# Medaris e-mail theme (MDRS-100). Native FreeMarker: keycloakify copies this
# directory into the theme JAR as is, because it finds theme.properties here.
# Only the verification and password-reset e-mails are overridden; every
# other e-mail, and every message not in messages/, comes from Keycloak's base
# (test/email.e2e.spec.ts sends one inherited e-mail to prove it still works).
parent=base
locales=en,tr,ar
