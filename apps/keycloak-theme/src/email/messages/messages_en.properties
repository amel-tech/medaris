# Medaris e-mail copy, English (MDRS-100). Keycloak formats every value with
# java.text.MessageFormat: {0}-style placeholders are arguments, and an ASCII
# apostrophe would start a quoted section, so the copy uses ’ instead.
emailLanguage=en
emailDirection=ltr
emailLinkFallback=If the button does not work, copy this address into your browser:
emailLinkExpiry=This link expires in {0}.

emailVerificationSubject=Verify your e-mail address
emailVerificationTitle=Confirm your e-mail address
emailVerificationIntro=Thank you for signing up to {0}. Please confirm that this e-mail address is yours.
emailVerificationButton=Verify my e-mail address
emailVerificationIgnore=If you did not create an account, you can ignore this e-mail.
emailVerificationBody=Thank you for signing up to {2}. Confirm your e-mail address by opening this link:\n\n{0}\n\nThe link expires in {3}.\n\nIf you did not create an account, you can ignore this e-mail.

passwordResetSubject=Reset your password
passwordResetTitle=Choose a new password
passwordResetIntro=Someone asked to reset the password of your {0} account. If it was you, choose a new password with the button below.
passwordResetButton=Choose a new password
passwordResetIgnore=If you did not ask for this, ignore this e-mail; your password stays the same.
passwordResetBody=Someone asked to reset the password of your {2} account. If it was you, choose a new password with this link:\n\n{0}\n\nThe link expires in {3}.\n\nIf you did not ask for this, ignore this e-mail; your password stays the same.
