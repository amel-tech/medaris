# ─────────────────────────────────────────────────────────────────────────────
# medaris workspace — single pnpm workspace, catalog-driven (MDRS-10).
#
# Authored from the MDRS-8 deliverable (docs/migration/pnpm-workspace.draft.yaml);
# version rationale and the full conflict table live in
# docs/migration/mdrs-8-dependency-reconciliation.md. Pins follow ADR-001 §D8:
# tilde/exact for framework-critical existing deps (a fresh pnpm resolve
# re-floats every caret = a hidden upgrade), caret for the harmless long tail.
#
# Adding a dependency: add it here first, then reference it as `catalog:` from
# the package. A bare version string in a workspace package.json is a bug.
# ─────────────────────────────────────────────────────────────────────────────

packages:
  # Explicit enumeration, no globs (ADR-001 §D11) — 16 real packages.
  # An unregistered package fails loudly instead of being silently ignored.
  - 'apps/tedrisat'
  - 'apps/teskilat'
  - 'apps/tedris'
  - 'apps/nizam'
  - 'apps/nazir'
  - 'apps/landing'
  - 'apps/keycloak-theme'
  - 'libs/common'
  - 'libs/ui'
  - 'libs/icons'
  - 'libs/tokens'
  - 'libs/hooks'
  - 'libs/services'
  - 'libs/i18n'
  - 'libs/types'
  - 'libs/utils'
  # Reserved names — docs-only, create nothing now (ADR-001 §D1):
  #   apps/muhasebe, apps/e2e, apps/web, apps/docs,
  #   libs/errors, libs/validation, libs/config
  # Adding one = a line here + release-please component + manifest entry +
  # commitlint scope, in a single PR (§D10).

  # pnpm 11 defaults this to `install`, which can prune devDeps and then abort in
  # non-TTY contexts (husky hooks, CI) with ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY.
verifyDepsBeforeRun: warn

# ── Build-script decisions (MDRS-8 §3, ADR-001 §D11) ─────────────────────────
# pnpm 11 replaces pnpm 10's `onlyBuiltDependencies` list with this map, and
# every dependency carrying an install script must be decided explicitly — an
# undecided one aborts the install. Approve real native builds; deny watchers
# and telemetry. This list is exactly what pnpm's own scan of the merged tree
# reported: MDRS-8 predicted 8 entries from `hasInstallScript` in the two npm
# locks, but `nx`, `lightningcss`, `@tailwindcss/oxide` and `unrs-resolver`
# ship no install script at the pinned versions, while `@parcel/watcher`,
# `@scarf/scarf`, `cpu-features`, `protobufjs` and `ssh2` do and had to be
# denied here rather than in a comment.
#
# MDRS-11 correction: `nx` DOES carry a postinstall script (it fetches the
# platform-native `@nx/nx-<os>-<arch>` binary). MDRS-10 recorded it as
# script-free, but nx was not in the dependency graph then, so pnpm never
# scanned it. It is approved here per ADR §D11, which pre-approved nx.
allowBuilds:
  nx: true # root task runner — postinstall fetches the native nx binary
  '@swc/core': true # backend — NestJS SWC transform (native)
  esbuild: true # both — bundler (native)
  sharp: true # frontend — Next.js image optimization
  '@openapitools/openapi-generator-cli': true # libs/services — postinstall fetches the generator jar
  '@parcel/watcher': false # file watcher — nothing here needs it at install time
  '@scarf/scarf': false # telemetry
  '@scarf/scarf-js': false # telemetry (alternate package name)
  protobufjs: false # OTel transitive; the prebuilt JS is what we use
  cpu-features: false # optional native probe pulled in by ssh2
  ssh2: false # testcontainers transitive; the JS fallback is sufficient

# ── Security floors ──────────────────────────────────────────────────────────
# MDRS-8 §6 left this deliberately empty and routed the work here. MDRS-21's
# pass: every advisory a direct catalog/version bump could reach was fixed
# that way instead (see the MDRS-21-tagged entries below and the `@nestjs/
# swagger` patch bump, which pulled a fixed transitive `js-yaml` on its own).
# What's left is nested two or more levels below a dependency this workspace
# doesn't declare directly, where only an override reaches it.
#
# The `multer` and `smol-toml` entries reached `main` ahead of this pass, as
# MDRS-76 and MDRS-79 — carved out of MDRS-21 so an urgent floor was not held
# behind this branch's review. Same kind of entry, longer comments: each had to
# establish that no bump exists at all rather than merely that none had landed
# yet, which is a claim about the registry and not about this lockfile.
overrides:
  uuid: ^11.1.1 # GHSA missing-buffer-bounds-check; exceljs pins 8.3.2. uuid's
  #               named v1/v3/v4/v5 API has been stable since v3, so forcing
  #               the one exceljs pulls in doesn't change what it calls.
  nanoid: ^3.3.18 # infinite-loop-on-size-0 fix; postcss's transitive pin
  #                 (3.3.16) is the only vulnerable instance in the tree.
  fast-uri: ^3.1.6 # 4 host-confusion/SSRF advisories past the ^3.1.5 that
  #                   MDRS-74 already floored; ajv (via @nestjs/schematics'
  #                   angular-devkit chain) is the only remaining consumer.
  qs: ^6.16.0 # array-limit bypass + isBuffer DoS. express and body-parser
  #             both already declare qs with a caret wide enough for 6.16.0
  #             (^6.14.0 / ^6.15.2) — pnpm just hadn't re-resolved to it.
  # brace-expansion: DoS via unbounded expansion, on two major lines that both
  # need their own floor — minimatch 3.x declares ^1.x, minimatch 5/7/9/10
  # declare ^2.x. The keys are range-scoped on purpose. A plain
  # `brace-expansion: ^1.1.18 || ^2.1.4` REPLACES every consumer's specifier
  # with the union, which pnpm resolves to its single highest match: measured,
  # that collapsed the whole tree onto 2.1.4 — including nx, which pins the
  # exact string "5.0.9" and imports the named `expand` that 2.x does not
  # export. `nx affected` then died with "brace_expansion_1.expand is not a
  # function" and took the Verify job's affected-isolation gate with it. The
  # `@1` / `@2` selectors apply each floor only to consumers whose declared
  # range falls on that line, so nx's 5.x is never touched.
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4

  # MDRS-76. multer 2.2.0 carries three high DoS advisories — GHSA-535w-7cp7-47q4
  # (oversized array), GHSA-qfvm-cv95-jqjf (fd leak), GHSA-wc9g-mqfw-jrwm
  # (crafted multipart) — all first patched in 2.3.0, and all against a path this
  # repo actually mounts: apps/tedrisat/src/flashcard/flashcard.controller.ts:333
  # puts FileInterceptor("file") on the bulk import route, which takes a 5MB
  # workbook per request.
  #
  # This is a floor rather than a bump because no bump exists. `pnpm up -r multer`
  # changes nothing: @nestjs/platform-express declares multer as the exact string
  # "2.2.0", not a range, so there is no room to re-resolve into — and 12.0.1,
  # the newest release, still declares "2.2.0". Measured, not assumed.
  #
  # A caret, not an exact pin. The override replaces the parent's declaration
  # outright, so pinning 2.3.0 here would freeze a future 2.3.x security patch
  # behind another hand edit of this file — the floor is what matters, not the
  # exact version. `^` stays inside 2.x, which is the major the parent expects.
  #
  # Removal condition: drop this the moment @nestjs/platform-express ships a
  # version whose multer dependency admits >= 2.3.0, and let the ordinary
  # re-resolve carry it.
  multer: ^2.3.0

  # ── dev-only exposure (no advisory here reaches a shipped runtime) ────────
  # js-yaml: quadratic-CPU !!omap DoS on the 3.x and 4.x lines (depcheck and
  # cosmiconfig 8/9 declare ^4.x). Range-scoped for the same reason as
  # brace-expansion above: the earlier `^3.15.1 || ^4.3.1 || ^5.2.2` union
  # silently moved every ^4.x consumer onto 5.3.0, a major they never asked
  # for. The 5.x line needs no entry — the @nestjs/swagger bump in the catalog
  # already carries a fixed js-yaml 5.x on its own.
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  file-type: ^21.3.2 # infinite-loop + zip-bomb DoS; pulled by @swc/cli's
  #                     bin-wrapper (platform-binary downloader), dev-only.
  esbuild: ">=0.24.3 <1" # dev-server request/response disclosure; the one
  #                         vulnerable instance is drizzle-kit's deprecated
  #                         @esbuild-kit/* migration helper, dev-only, and no
  #                         app here runs esbuild's own dev server regardless.
  #                         A plain caret cannot express this floor: esbuild
  #                         treats every 0.x minor as breaking, so ^0.25 would
  #                         lock one minor while the tree legitimately carries
  #                         two (0.25.x via drizzle-kit, 0.28.x via vite). The
  #                         `<1` ceiling keeps the floor while refusing a
  #                         silent jump onto a 1.x line nobody has tested.
  #                         While this entry exists it also governs the
  #                         `esbuild` catalog entry below, which nothing in the
  #                         workspace references today.

  # MDRS-79. smol-toml <= 1.7.0 carries GHSA-7w5x-hrqm-74c2, a high DoS via
  # malformed TOML documents, first patched in 1.7.1.
  #
  # The same shape as multer above, and it earns its place for the same reason:
  # nx declares smol-toml as the exact string "1.6.1", so nothing re-resolves
  # into the fix. Checked against the registry rather than the installed tree —
  # the 23.2.0 this catalog now pins, 23.2.1 (`latest`) and 23.3.0-beta.0
  # (`next`) all still declare "1.6.1", so there is no bump to wait for.
  #
  # Reachability is weaker than multer's and is not dressed up: smol-toml
  # arrives only through nx, so it is build tooling that reaches no deployed
  # artifact, and the TOML nx parses is repo-controlled rather than
  # attacker-supplied. It is floored anyway because audit-ci.json sets
  # skip-dev:false on purpose (MDRS-8 §6) and is a ratchet, not an amnesty — a
  # new high with a published fix and a one-line floor is not allowlist material.
  #
  # A caret for the reason given on the multer entry above.
  #
  # Removal condition: drop this the moment nx ships a release whose smol-toml
  # dependency admits >= 1.7.1.
  smol-toml: ^1.7.1
# xlsx@0.18.5 stays un-overridden and unfloored: no patched npm version
# exists (FU-5, tracked as a replace-SheetJS follow-up, not an override).

catalog:
  # ═══ Toolchain — ADR-001 §D8 normative (do not re-decide here) ═══
  nx: 23.2.0 # MDRS-21: exact; every @nx/* pinned to the same version
  '@nx/js': 23.2.0
  '@nx/eslint': 23.2.0
  '@nx/eslint-plugin': 23.2.0
  '@nx/nest': 23.2.0
  '@nx/next': 23.2.0
  '@nx/vite': 23.2.0
  '@nx/vitest': 23.2.0
  typescript: ~5.9.3 # last JS-based line; tilde ≈ frozen. TS7 held back —
  #                    typescript-eslint has no release supporting it yet
  #                    (peers cap at <6.1.0); see docs/migration/mdrs-21-*.
  '@types/node': ^22 # PROD floor (node:22-alpine), not dev Node 24
  '@biomejs/biome': 2.4.4 # exact — the reformat commit must be byte-reproducible
  eslint: ^10.10.0 # boundaries-ONLY surface (MDRS-12) — MDRS-21
  typescript-eslint: ^8.70.0 # MDRS-21
  vitest: ^4.1.9
  '@vitest/coverage-v8': ^4.1.9
  '@vitest/ui': ^4.1.9
  '@swc/core': ~1.15.43 # floors backend 1.15.33; emitDecoratorMetadata under Vitest
  unplugin-swc: ^1.5.11 # MDRS-20: routes Vitest's transform through @swc/core so
  #                       `design:paramtypes` survives — esbuild drops it and
  #                       NestJS DI then fails at runtime while tsc stays green.
  husky: ^9.1.7
  lint-staged: ^17.0.8
  '@commitlint/cli': ^21.0.2
  '@commitlint/config-conventional': ^21.0.2

  # ── Jest: removed by MDRS-20 ───────────────────────────────────────────────
  # `jest`, `@types/jest`, `ts-jest` and `jest-junit` lived here through MDRS-10
  # only, as the signal that pnpm's strict node_modules layout had not broken
  # NestJS resolution. Both backend apps now run the same 10 suites under Vitest
  # (junit output comes from Vitest's built-in reporter, so jest-junit has no
  # successor entry). See docs/migration/mdrs-20-jest-to-vitest.md.

  # ═══ Backend runtime & framework ═══
  '@nestjs/common': ~11.1.19
  '@nestjs/core': ~11.1.19
  '@nestjs/platform-express': ~11.1.19
  '@nestjs/testing': ~11.1.19
  '@nestjs/config': ^4.0.2
  '@nestjs/cache-manager': ^3.0.1
  '@nestjs/throttler': ^6.5.0 # MDRS-31; 6.4.0 is the first release whose peer range admits Nest 11
  '@nestjs/swagger': ^11.4.7 # MDRS-21: patch pulls js-yaml 5.3.0, closing the 5.x DoS advisory
  '@nestjs/cli': ^11.0.10
  '@nestjs/schematics': ^11.0.7
  '@nestjs/class-transformer': ^0.4.0 # NestJS fork (tedrisat)
  '@nestjs/class-validator': ^0.13.4 # NestJS fork (tedrisat)
  class-transformer: ^0.5.1 # standalone (libs/common) — coexists intentionally
  class-validator: ^0.15.1 # standalone (libs/common, tedrisat) — MDRS-21
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.4
  pg: ^8.23.0 # MDRS-21
  '@types/pg': ^8.23.1 # MDRS-21
  cache-manager: ^7.1.1
  compression: ^1.8.1
  '@types/compression': ^1.8.1
  helmet: ^8.1.0
  exceljs: ^4.4.0
  jsonwebtoken: ^9.0.2
  '@types/jsonwebtoken': ^9.0.10
  pino: ^10.3.1 # MDRS-21: +1 major
  pino-pretty: ^13.0.0
  winston: ^3.17.0
  '@types/express': ^5.0.0
  '@types/multer': ^2.0.0 # ADR §D4: runtime → dev
  '@opentelemetry/sdk-node': ^0.222.0 # MDRS-21: closes GHSA prometheus-exporter crash (<0.217 vulnerable)
  '@opentelemetry/exporter-trace-otlp-grpc': ^0.222.0
  '@opentelemetry/auto-instrumentations-node': ^0.80.0 # MDRS-21: same prometheus-exporter advisory, <0.75 vulnerable
  '@opentelemetry/resources': ^2.11.0
  '@opentelemetry/semantic-conventions': ^1.36.0

  # ═══ Backend build / test tooling ═══
  # ts-node, ts-loader, tsconfig-paths and source-map-support were removed at
  # MDRS-21: none is imported or `-r`-registered anywhere in either backend
  # app, `nest build`/`nest start --watch` use tsc directly (no webpack
  # builder), and ADR-001 D7 already rules out tsconfig `paths` aliases
  # entirely. All four were dead weight carried over from the pre-merge repos
  # and masked by .depcheckrc's ignore list.
  '@swc/cli': ^0.7.8
  rimraf: ^6.0.1
  supertest: ^7.0.0
  '@types/supertest': ^7.2.1 # MDRS-21: +1 major
  testcontainers: ^12.1.0 # MDRS-21: +1 major
  '@testcontainers/postgresql': ^12.1.0 # MDRS-21: +1 major
  audit-ci: ^7.1.0
  depcheck: ^1.4.7

  # ═══ Frontend runtime & framework ═══
  next: ~16.3.4 # MDRS-21: closes ~15 high/moderate Next.js advisories (<16.2.11)
  react: ~19.2.8 # MDRS-21: ADR-001 §D8 named this "a one-line MDRS-21 bump"
  react-dom: ~19.2.8
  '@types/react': ^19
  '@types/react-dom': ^19
  '@radix-ui/react-alert-dialog': ^1.1.15
  '@radix-ui/react-avatar': ^1.1.10
  '@radix-ui/react-checkbox': ^1.3.2
  '@radix-ui/react-collapsible': ^1.1.12
  '@radix-ui/react-context-menu': ^2.2.16
  '@radix-ui/react-dialog': ^1.1.15
  '@radix-ui/react-dropdown-menu': ^2.1.15
  '@radix-ui/react-hover-card': ^1.1.14
  '@radix-ui/react-label': ^2.1.7
  '@radix-ui/react-popover': ^1.1.15
  '@radix-ui/react-select': ^2.2.5
  '@radix-ui/react-separator': ^1.1.7
  '@radix-ui/react-slot': ^1.2.3
  '@radix-ui/react-switch': ^1.2.6
  '@radix-ui/react-tabs': ^1.1.13
  '@radix-ui/react-tooltip': ^1.2.8
  '@phosphor-icons/react': ^2.1.10
  '@tanstack/react-table': ^9.2.4 # MDRS-21: +1 major
  '@hookform/resolvers': ^5.2.2
  react-hook-form: ^7.64.0
  sonner: ^2.0.7
  next-themes: ^0.4.6
  next-auth: ^4.24.11
  next-intl: ^4.4.0
  '@t3-oss/env-nextjs': ^0.13.8
  '@fontsource/scheherazade-new': ^5.2.8
  dotenv: ^17.4.2 # libs/i18n runtime — MDRS-21: +1 major
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.3.1 # unified to ui's major; tedris v1→v3 port = FU-2
  tailwindcss-animate: ^1.0.7
  tw-animate-css: ^1.3.7
  zod: ^4.5.4 # MDRS-21: v3->v4. FU-3 (libs/ui never imported zod) meant no
  #             per-package exception was needed for this migration either.
  '@opentelemetry/api': ^1.9.0
  '@vercel/otel': ^2.1.3 # MDRS-21: +1 major
  xlsx: ^0.18.5 # ⚠ security FU-5 (unfloorable; replace SheetJS)

  # ═══ Frontend build / styling / codegen ═══
  tailwindcss: ~4.3.3 # MDRS-21
  '@tailwindcss/postcss': ^4.1.12
  '@tailwindcss/vite': ^4.1.11
  lightningcss: ^1.30.1
  postcss: ^8
  autoprefixer: ^10.4.21
  esbuild: ^0.21.5 # unreferenced; the `esbuild` override above governs while it exists
  jiti: ^2.5.1
  onchange: ^7.1.0 # libs/services watch; MDRS-11 may replace with an Nx target
  '@next/bundle-analyzer': ^16.3.4 # MDRS-21: caught up to Next 16, +1 major
  '@openapitools/openapi-generator-cli': ^2.24.0
  '@tolgee/cli': ^2.10.2

  # ═══ keycloak-theme island — unfrozen at MDRS-21 (ADR §D8 exception #1) ═══
  # ADR-001 §D8 named "keycloakify 11.15 / vite 7" as the proven MDRS-21
  # destination; keycloakify 11.16.0 and vite 7.3.6 satisfy that (both are
  # already load-bearing elsewhere: vite 7.3.6 is the `vitest` named catalog
  # below). Deliberately not vite 8 / storybook's newest peer range — staying
  # on the version this workspace already runs under Vitest keeps this the
  # smallest change that lifts the freeze, not a second bleeding-edge bump.
  vite: ^7.3.6
  '@vitejs/plugin-react': ^5.2.0 # 6.x requires vite ^8; 5.x's ^4||^5||^6||^7||^8 keeps vite 7
  keycloakify: ^11.16.0
  '@storybook/react': ^10.6.0
  '@storybook/react-vite': ^10.6.0
  storybook: ^10.6.0

# ── Named catalogs ───────────────────────────────────────────────────────────
# MDRS-20 measured why this exists: vitest@4 peers on `vite: ^6 || ^7 || ^8`,
# and with no `vite` declared by the backend apps pnpm satisfied that peer
# from whatever the default catalog's `vite` pin was — back when that was the
# frozen keycloak-theme pin (5.4.21), vitest died at startup with
# ERR_PACKAGE_PATH_NOT_EXPORTED on `vite/module-runner`, a subpath vite 5
# does not export. Declaring the peer explicitly here is what pinned it
# correctly independent of keycloak-theme's freeze.
#
# MDRS-21 unfroze keycloak-theme onto vite ^7.3.6 (see above) — the same
# value as this catalog's `vite` entry, so the two-catalog split is no longer
# load-bearing. Left in place rather than collapsed in this same change:
# tedrisat/teskilat still reference `catalog:vitest` explicitly, and
# repointing them plus deleting this block is a separate, purely-mechanical
# follow-up (tracked in docs/migration/mdrs-21-dependency-upgrade.md), not a
# dependency-version decision this ticket needs to also make.
catalogs:
  vitest:
    vite: ^7.3.6
