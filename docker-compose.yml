# Since MDRS-25 there is one .env, at the root, and compose reads it for
# ${...} interpolation automatically.
#
# `env_file:` is deliberately not used: it would hand the container the file's
# raw keys, so the app would see TEDRISAT__PORT and no PORT. The image has no
# copy of tools/env/root-env.cjs to strip prefixes with — production does not
# need one, because Coolify sets the canonical names directly. So the mapping
# from prefixed key to canonical name is written out here instead.
#
# Two properties this buys, beyond being readable:
#
#   * Least privilege. `env_file: .env` would hand the tedrisat container every
#     other app's secrets too — nazir's and nizam's NEXTAUTH_SECRET, tedris's
#     Keycloak client secret. Naming the keys means a container receives only
#     what it needs.
#   * The same precedence the loader applies. Each value tries the app-specific
#     spelling first and falls back to the group one, so TEDRISAT__DB_PORT and
#     API__DB_PORT both work — exactly as they do for a `pnpm dev` run.
services:
  tedrisat:
    build:
      context: .
      dockerfile: apps/tedrisat/Dockerfile
    ports:
      - "${TEDRISAT_PORT:-3001}:3001"
    environment:
      # Falls back to production, matching `ENV NODE_ENV=production` in
      # apps/tedrisat/Dockerfile. A compose `environment:` entry overrides image
      # ENV, so the old `development` fallback silently moved every container
      # that did not set the key into the relaxed branch of every environment
      # check — and this is the master switch for two of them: cors.config.ts
      # accepts a `*` origin list only under development, and swagger-env.ts
      # demands SWAGGER_ALLOW_IN_PRODUCTION only under production. Hardening
      # either of those while this said development would have been decorative.
      NODE_ENV: ${TEDRISAT__NODE_ENV:-${API__NODE_ENV:-production}}
      PORT: ${TEDRISAT__PORT:-3001}
      SERVICE_NAME: ${TEDRISAT__SERVICE_NAME:-tedrisat-service}
      LOG_LEVEL: ${TEDRISAT__LOG_LEVEL:-${API__LOG_LEVEL:-info}}
      # No `*` fallback. libs/common/src/config/cors.config.ts refuses to boot on
      # a wildcard outside NODE_ENV=development, so the old default survived only
      # because NODE_ENV falls back to development one line above — change that
      # and the container dies on a value nobody chose. Required instead, the way
      # the other per-deployment values here are.
      ALLOWED_ORIGINS: ${TEDRISAT__ALLOWED_ORIGINS:-${API__ALLOWED_ORIGINS:?set API__ALLOWED_ORIGINS in .env}}
      ALLOWED_METHODS: ${TEDRISAT__ALLOWED_METHODS:-${API__ALLOWED_METHODS:-GET,HEAD,PUT,PATCH,POST,DELETE}}
      # Off by default since MDRS-33 — publishing the schema also relaxes CSP and
      # COOP on the Swagger pages — matching API__SWAGGER_ENABLED=false in .env.example.
      SWAGGER_ENABLED: ${TEDRISAT__SWAGGER_ENABLED:-${API__SWAGGER_ENABLED:-false}}
      SWAGGER_PATH: ${TEDRISAT__SWAGGER_PATH:-${API__SWAGGER_PATH:-/docs}}
      # MDRS-33's opt-in. Without this key the refusal it guards has no remedy
      # reachable from the root .env: with NODE_ENV=production above, turning
      # SWAGGER_ENABLED on makes swagger-env.ts throw in the config factory and
      # the container restart-loops. Shipping the gate without its own escape
      # hatch would make the documented production-Swagger path impossible.
      SWAGGER_ALLOW_IN_PRODUCTION: ${TEDRISAT__SWAGGER_ALLOW_IN_PRODUCTION:-${API__SWAGGER_ALLOW_IN_PRODUCTION:-false}}
      # The root .env carries the host-side DB_HOST=localhost; inside the
      # compose network the database answers on the service name.
      DB_HOST: medaris-db
      DB_PORT: ${TEDRISAT__DB_PORT:-${API__DB_PORT:-5432}}
      DB_SSL: ${TEDRISAT__DB_SSL:-${API__DB_SSL:-false}}
      # Without this, DB_SSL=true is only usable against a database whose
      # certificate chains to the platform trust store: database-ssl.ts keeps
      # rejectUnauthorized on and has no other way to receive a private-CA
      # bundle, so the connection fails with what reads as a broken certificate.
      DB_CA_CERT: ${TEDRISAT__DB_CA_CERT:-${API__DB_CA_CERT:-}}
      DB_NAME: ${TEDRISAT__DB_NAME:-tedrisat_db}
      DB_USERNAME: ${TEDRISAT__DB_USERNAME:-tedrisat}
      DB_PASSWORD: ${TEDRISAT__DB_PASSWORD:?set TEDRISAT__DB_PASSWORD in .env}
      AUTO_MIGRATIONS_ENABLED: ${TEDRISAT__AUTO_MIGRATIONS_ENABLED:-${API__AUTO_MIGRATIONS_ENABLED:-true}}
      # Not interpolated: the root .env names ./src/... for `nest start`, and the
      # container runs compiled output. tsc mirrors the source tree, so the
      # compiled migrations are under dist/src/, not dist/ — measured against the
      # image, where ./dist/database/migrations does not exist and the service
      # logs "Migrations failed: Can't find meta/_journal.json file" three times
      # and then serves traffic against an unmigrated database.
      AUTO_MIGRATIONS_FOLDER: ./dist/src/database/migrations
      OTEL_ENABLED: ${TEDRISAT__OTEL_ENABLED:-${API__OTEL_ENABLED:-false}}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${TEDRISAT__OTEL_EXPORTER_OTLP_ENDPOINT:-${API__OTEL_EXPORTER_OTLP_ENDPOINT:-localhost:4317}}
      # The endpoint above carries no scheme, so the gRPC exporter needs the
      # INSECURE flag to reach a plaintext collector. .env.example ships all
      # three; unmapped they could not reach a container at all.
      OTEL_EXPORTER_OTLP_INSECURE: ${TEDRISAT__OTEL_EXPORTER_OTLP_INSECURE:-${API__OTEL_EXPORTER_OTLP_INSECURE:-true}}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${TEDRISAT__OTEL_EXPORTER_OTLP_PROTOCOL:-${API__OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}}
      OTEL_EXPORTER_OTLP_COMPRESSION: ${TEDRISAT__OTEL_EXPORTER_OTLP_COMPRESSION:-${API__OTEL_EXPORTER_OTLP_COMPRESSION:-gzip}}
      KEYCLOAK_JWKS_URL: ${TEDRISAT__KEYCLOAK_JWKS_URL:-${API__KEYCLOAK_JWKS_URL:?set API__KEYCLOAK_JWKS_URL in .env}}
      # Required by apps/tedrisat/src/config/security-env.ts alongside the JWKS
      # URL (MDRS-30): the config factory parses all three through one zod schema,
      # so an unset issuer or audience is a boot failure, not a relaxed check.
      KEYCLOAK_ISSUER: ${TEDRISAT__KEYCLOAK_ISSUER:-${API__KEYCLOAK_ISSUER:?set API__KEYCLOAK_ISSUER in .env}}
      KEYCLOAK_AUDIENCE: ${TEDRISAT__KEYCLOAK_AUDIENCE:-${API__KEYCLOAK_AUDIENCE:?set API__KEYCLOAK_AUDIENCE in .env}}
      # Empty is a legitimate value — it means "no `azp` restriction" — so this is
      # not `:?`. It is mandatory only in the pairing .env.example actually ships:
      # with the realm-wide audience `account`, loadJwtClaimPolicy
      # (libs/common/src/auth-guard/services/jwt-verifier.service.ts:107) refuses
      # to construct without it, and that error names the variable better than a
      # compose interpolation failure would.
      KEYCLOAK_ALLOWED_CLIENTS: ${TEDRISAT__KEYCLOAK_ALLOWED_CLIENTS:-${API__KEYCLOAK_ALLOWED_CLIENTS:-}}
      # Both carry the API__ tier the file header promises ("the app-specific
      # spelling first, then the group one"). Without it the
      # API__KEYCLOAK_REDIRECT_URL that .env.example ships reached the container
      # as an empty string while working fine under `nx run tedrisat:dev`, so the
      # two paths disagreed about a documented variable.
      KEYCLOAK_CLIENT_ID: ${TEDRISAT__KEYCLOAK_CLIENT_ID:-${API__KEYCLOAK_CLIENT_ID:-}}
      KEYCLOAK_REDIRECT_URL: ${TEDRISAT__KEYCLOAK_REDIRECT_URL:-${API__KEYCLOAK_REDIRECT_URL:-}}
      # .env.example ships 3600/60; the code defaults are 86400/120
      # (libs/common/src/auth-guard/key-providers/keycloak-public-key-provider.ts).
      # Left out of the allowlist, the template's values could not reach a
      # container by any route, so a rotated or revoked realm key stayed trusted
      # for 24 hours instead of one.
      KEYCLOAK_CACHE_TTL: ${TEDRISAT__KEYCLOAK_CACHE_TTL:-${API__KEYCLOAK_CACHE_TTL:-3600}}
      KEYCLOAK_NOT_FOUND_CACHE_TTL: ${TEDRISAT__KEYCLOAK_NOT_FOUND_CACHE_TTL:-${API__KEYCLOAK_NOT_FOUND_CACHE_TTL:-60}}
    depends_on:
      medaris-db:
        condition: service_healthy

  teskilat:
    build:
      context: .
      dockerfile: apps/teskilat/Dockerfile
    ports:
      - "${TESKILAT_PORT:-3002}:3002"
    environment:
      # production, for the same reason as tedrisat above.
      NODE_ENV: ${TESKILAT__NODE_ENV:-${API__NODE_ENV:-production}}
      PORT: ${TESKILAT__PORT:-3002}
      SERVICE_NAME: ${TESKILAT__SERVICE_NAME:-teskilat-service}
      LOG_LEVEL: ${TESKILAT__LOG_LEVEL:-${API__LOG_LEVEL:-info}}
      # Same rule as tedrisat: both APIs reach cors.config.ts through
      # applyGlobalMiddleware, so the wildcard is refused here too.
      ALLOWED_ORIGINS: ${TESKILAT__ALLOWED_ORIGINS:-${API__ALLOWED_ORIGINS:?set API__ALLOWED_ORIGINS in .env}}
      ALLOWED_METHODS: ${TESKILAT__ALLOWED_METHODS:-${API__ALLOWED_METHODS:-GET,HEAD,PUT,PATCH,POST,DELETE}}
      SWAGGER_ENABLED: ${TESKILAT__SWAGGER_ENABLED:-${API__SWAGGER_ENABLED:-false}}
      # SWAGGER_ENDPOINT, not the SWAGGER_PATH tedrisat reads: teskilat's own
      # config names it that (apps/teskilat/src/config/config.ts:35), so the
      # SWAGGER_PATH handed in here reached nothing. The .env key is unchanged —
      # this file is where the prefixed key is mapped to the canonical name.
      SWAGGER_ENDPOINT: ${TESKILAT__SWAGGER_PATH:-${API__SWAGGER_PATH:-/docs}}
      DB_HOST: medaris-db
      DB_PORT: ${TESKILAT__DB_PORT:-${API__DB_PORT:-5432}}
      DB_SSL: ${TESKILAT__DB_SSL:-${API__DB_SSL:-false}}
      DB_NAME: ${TESKILAT__DB_NAME:-teskilat_db}
      DB_USERNAME: ${TESKILAT__DB_USERNAME:-teskilat}
      DB_PASSWORD: ${TESKILAT__DB_PASSWORD:?set TESKILAT__DB_PASSWORD in .env}
      AUTO_MIGRATIONS_ENABLED: ${TESKILAT__AUTO_MIGRATIONS_ENABLED:-${API__AUTO_MIGRATIONS_ENABLED:-true}}
      # Not interpolated: the root .env names ./src/... for `nest start`, and the
      # container runs compiled output. tsc mirrors the source tree, so the
      # compiled migrations are under dist/src/, not dist/ — measured against the
      # image, where ./dist/database/migrations does not exist and the service
      # logs "Migrations failed: Can't find meta/_journal.json file" three times
      # and then serves traffic against an unmigrated database.
      AUTO_MIGRATIONS_FOLDER: ./dist/src/database/migrations
      OTEL_ENABLED: ${TESKILAT__OTEL_ENABLED:-${API__OTEL_ENABLED:-false}}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${TESKILAT__OTEL_EXPORTER_OTLP_ENDPOINT:-${API__OTEL_EXPORTER_OTLP_ENDPOINT:-localhost:4317}}
      # Same three as tedrisat above. No DB_CA_CERT here: teskilat opens no
      # database connection (MDRS-69 decides whether the rest of its DB block
      # should go the way KEYCLOAK_JWKS_URL did).
      OTEL_EXPORTER_OTLP_INSECURE: ${TESKILAT__OTEL_EXPORTER_OTLP_INSECURE:-${API__OTEL_EXPORTER_OTLP_INSECURE:-true}}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${TESKILAT__OTEL_EXPORTER_OTLP_PROTOCOL:-${API__OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}}
      OTEL_EXPORTER_OTLP_COMPRESSION: ${TESKILAT__OTEL_EXPORTER_OTLP_COMPRESSION:-${API__OTEL_EXPORTER_OTLP_COMPRESSION:-gzip}}
      # No KEYCLOAK_* here. teskilat has no auth guard: nothing under
      # apps/teskilat/src reads a Keycloak variable, and its AppModule imports
      # only ConfigModule and LoggerModule. The KEYCLOAK_JWKS_URL that used to
      # sit on this line was copied from tedrisat, `:?` and all, handing the
      # container a value no teskilat code path reads.
      #
      # Removing it does NOT make `docker compose up teskilat` work without
      # tedrisat's variables — measured: compose interpolates the whole file
      # before it selects a service, so tedrisat's four `:?` keys are still
      # required to render this one. This is least-privilege hygiene about what
      # reaches the container, not a fix for the single-service case.
      # Add them back when the guard lands, not before.
    depends_on:
      medaris-db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Web apps — opt-in via `docker compose --profile web up`; a plain
  # `docker compose up` neither starts nor builds them. Deliberately not in the
  # default set: the images are production builds (`output: "standalone"`,
  # `next build` already run — no HMR, no fast refresh), so a compose service
  # only ever means "run the built app". Frontend development is
  # `pnpm nx run <app>-web:dev`, not a container.
  #
  # NEXT_PUBLIC_* is baked into the image at BUILD time from .env.example's
  # placeholder values (apps/<app>/Dockerfile does `cp .env.example .env`
  # before `next build`). Locally the placeholders happen to be right
  # (http://localhost:...), but changing a NEXT_PUBLIC_ value needs an image
  # rebuild, not a restart. Passing real values as build args is MDRS-16's
  # remaining item, out of scope here.
  #
  # Environment is spelled out key by key, exactly like the API services and
  # for the same two reasons (see the header comment): the runtime image has no
  # tools/env/root-env.cjs, so `env_file: .env` would hand the app
  # TEDRIS__KEYCLOAK_CLIENT_SECRET and no KEYCLOAK_CLIENT_SECRET; and naming
  # the keys keeps least privilege — no app sees another's secrets. The list is
  # short anyway: the client-side keys are baked at build time, so only the
  # server-side handful appears here.

  tedris:
    build:
      context: .
      dockerfile: apps/tedris/Dockerfile
    profiles: [web]
    ports:
      - "${TEDRIS_WEB_PORT:-4000}:4000"
    environment:
      OTEL_SERVICE_NAME: ${TEDRIS__OTEL_SERVICE_NAME:-tedris-web}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${TEDRIS__OTEL_EXPORTER_OTLP_ENDPOINT:-${WEB__OTEL_EXPORTER_OTLP_ENDPOINT:?set WEB__OTEL_EXPORTER_OTLP_ENDPOINT in .env}}
      KEYCLOAK_ISSUER: ${TEDRIS__KEYCLOAK_ISSUER:-${WEB__KEYCLOAK_ISSUER:?set WEB__KEYCLOAK_ISSUER in .env}}
      KEYCLOAK_CLIENT_ID: ${TEDRIS__KEYCLOAK_CLIENT_ID:?set TEDRIS__KEYCLOAK_CLIENT_ID in .env}
      KEYCLOAK_CLIENT_SECRET: ${TEDRIS__KEYCLOAK_CLIENT_SECRET:?set TEDRIS__KEYCLOAK_CLIENT_SECRET in .env}
      NEXTAUTH_URL: ${TEDRIS__NEXTAUTH_URL:-http://localhost:4000}
      NEXTAUTH_SECRET: ${TEDRIS__NEXTAUTH_SECRET:?set TEDRIS__NEXTAUTH_SECRET in .env}
      API_MOCKING: ${TEDRIS__API_MOCKING:-${WEB__API_MOCKING:-disabled}}
      # Not interpolated: the root .env says http://localhost:3001, and inside
      # this container localhost is the container itself. On the compose
      # network the API answers on its service name — a host-side run (nx dev,
      # bare `docker run`) needs the localhost value instead.
      TEDRISAT_API_BASE_URL: http://tedrisat:3001
    depends_on:
      - tedrisat

  nizam:
    build:
      context: .
      dockerfile: apps/nizam/Dockerfile
    profiles: [web]
    ports:
      - "${NIZAM_WEB_PORT:-4001}:4001"
    environment:
      OTEL_SERVICE_NAME: ${NIZAM__OTEL_SERVICE_NAME:-nizam-web}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${NIZAM__OTEL_EXPORTER_OTLP_ENDPOINT:-${WEB__OTEL_EXPORTER_OTLP_ENDPOINT:?set WEB__OTEL_EXPORTER_OTLP_ENDPOINT in .env}}
      KEYCLOAK_ISSUER: ${NIZAM__KEYCLOAK_ISSUER:-${WEB__KEYCLOAK_ISSUER:?set WEB__KEYCLOAK_ISSUER in .env}}
      KEYCLOAK_CLIENT_ID: ${NIZAM__KEYCLOAK_CLIENT_ID:?set NIZAM__KEYCLOAK_CLIENT_ID in .env}
      KEYCLOAK_CLIENT_SECRET: ${NIZAM__KEYCLOAK_CLIENT_SECRET:?set NIZAM__KEYCLOAK_CLIENT_SECRET in .env}
      NEXTAUTH_URL: ${NIZAM__NEXTAUTH_URL:-http://localhost:4001}
      NEXTAUTH_SECRET: ${NIZAM__NEXTAUTH_SECRET:?set NIZAM__NEXTAUTH_SECRET in .env}
      API_MOCKING: ${NIZAM__API_MOCKING:-${WEB__API_MOCKING:-disabled}}
      TEDRISAT_API_BASE_URL: http://tedrisat:3001
    depends_on:
      - tedrisat

  nazir:
    build:
      context: .
      dockerfile: apps/nazir/Dockerfile
    profiles: [web]
    ports:
      - "${NAZIR_WEB_PORT:-4002}:4002"
    environment:
      OTEL_SERVICE_NAME: ${NAZIR__OTEL_SERVICE_NAME:-nazir-web}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${NAZIR__OTEL_EXPORTER_OTLP_ENDPOINT:-${WEB__OTEL_EXPORTER_OTLP_ENDPOINT:?set WEB__OTEL_EXPORTER_OTLP_ENDPOINT in .env}}
      KEYCLOAK_ISSUER: ${NAZIR__KEYCLOAK_ISSUER:-${WEB__KEYCLOAK_ISSUER:?set WEB__KEYCLOAK_ISSUER in .env}}
      KEYCLOAK_CLIENT_ID: ${NAZIR__KEYCLOAK_CLIENT_ID:?set NAZIR__KEYCLOAK_CLIENT_ID in .env}
      KEYCLOAK_CLIENT_SECRET: ${NAZIR__KEYCLOAK_CLIENT_SECRET:?set NAZIR__KEYCLOAK_CLIENT_SECRET in .env}
      NEXTAUTH_URL: ${NAZIR__NEXTAUTH_URL:-http://localhost:4002}
      NEXTAUTH_SECRET: ${NAZIR__NEXTAUTH_SECRET:?set NAZIR__NEXTAUTH_SECRET in .env}
      API_MOCKING: ${NAZIR__API_MOCKING:-${WEB__API_MOCKING:-disabled}}
      TEDRISAT_API_BASE_URL: http://tedrisat:3001
    depends_on:
      - tedrisat

  # No auth: landing carries neither Keycloak credentials nor NEXTAUTH_*, and
  # it calls no API server-side — its NEXT_PUBLIC_TEDRIS_APP_URL link target is
  # baked at build time like every other NEXT_PUBLIC_ value.
  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    profiles: [web]
    ports:
      - "${LANDING_WEB_PORT:-4003}:4003"
    environment:
      OTEL_SERVICE_NAME: ${LANDING__OTEL_SERVICE_NAME:-landing-web}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${LANDING__OTEL_EXPORTER_OTLP_ENDPOINT:-${WEB__OTEL_EXPORTER_OTLP_ENDPOINT:?set WEB__OTEL_EXPORTER_OTLP_ENDPOINT in .env}}


  medaris-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${MEDARIS_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${MEDARIS_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${MEDARIS_POSTGRES_DB:-postgres}
    ports:
      - "${MEDARIS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 7
      start_period: 15s

volumes:
  postgres_data:
