<!-- @dsCard group="Forms" viewport="760x280" name="Checkbox, radio, switch" subtitle="16px boxes, 36×20 switch — all three fill with sky-900 when on" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;background:var(--background-white);font-family:var(--font-ui)}
.cols{display:flex;gap:56px}
.h{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-neutral-disabled);margin:0 0 12px}
label{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:12px;color:var(--text-neutral-primary)}
.note{margin-top:18px;font-size:12px;color:var(--text-neutral-tertiary);line-height:1.6;max-width:700px}
</style></head><body>
<div class="cols">
<div>
<p class="h">Checkbox</p>
<label><input type="checkbox" class="mds-check" checked> Ezber tamamlandı</label>
<label><input type="checkbox" class="mds-check"> Tekrar gerekiyor</label>
<label style="opacity:.5"><input type="checkbox" class="mds-check" disabled> Kilitli</label>
</div>
<div>
<p class="h">Radio</p>
<label><input type="radio" name="r" class="mds-radio" checked> Müderris</label>
<label><input type="radio" name="r" class="mds-radio"> Talebe</label>
<label style="opacity:.5"><input type="radio" name="r2" class="mds-radio" disabled> Misafir</label>
</div>
<div>
<p class="h">Switch</p>
<label><input type="checkbox" class="mds-switch" checked> Günlük hatırlatma</label>
<label><input type="checkbox" class="mds-switch"> Herkese açık kart</label>
<label style="opacity:.5"><input type="checkbox" class="mds-switch" disabled> Yönetici modu</label>
</div>
</div>
<p class="note">Checkbox and radio share one 16px box and differ only in radius — <code>--radius-xxs</code> against <code>--radius-full</code>. A switch commits immediately; a checkbox waits for a submit. If a control needs a Save button next to it, it is not a switch.</p>
</body></html>
