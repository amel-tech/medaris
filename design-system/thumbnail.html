<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>
body{margin:0;width:400px;height:300px;background:var(--sky-900);display:flex;flex-direction:column;justify-content:space-between;padding:26px;box-sizing:border-box;overflow:hidden}
h1{font-family:var(--font-display);font-size:40px;font-weight:700;color:#fff;line-height:1;margin:0;letter-spacing:-.02em}
.ar{font-family:var(--font-arabic);font-size:22px;color:var(--sky-200);margin:10px 0 0;direction:rtl}
.sub{font-family:var(--font-ui);font-size:12px;color:var(--sky-300);margin:14px 0 0;letter-spacing:.04em;text-transform:uppercase}
.ramp{display:flex;gap:3px}
.ramp i{flex:1;height:20px;border-radius:3px}
</style></head><body>
<div>
  <h1>Medaris</h1>
  <p class="ar">اقْرَأْ بِاسْمِ رَبِّكَ</p>
  <p class="sub">Design System</p>
</div>
<div class="ramp">
  <i style="background:var(--sky-100)"></i><i style="background:var(--sky-200)"></i><i style="background:var(--sky-300)"></i><i style="background:var(--sky-400)"></i><i style="background:var(--sky-500)"></i><i style="background:var(--sky-600)"></i><i style="background:var(--sky-700)"></i><i style="background:var(--sky-800)"></i>
</div>
</body></html>
