<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../css/index.css">
<style>body{padding:18px;background:var(--surface)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.lbl{font:var(--fw-semibold) var(--fs-10)/1 var(--font-ui);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--faint)}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../../../docs/ds-components.jsx"></script>
<script type="text/babel">
const { Field, Input, Textarea, Select, CheckboxRow, Icon } = window.MadrasahDS;
ReactDOM.createRoot(document.getElementById("root")).render(
  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18,alignItems:"start"}}>
    <div className="col">
      <Field label="Kurs adı" required><Input defaultValue="Tefsir Usûlüne Giriş" /></Field>
      <Field label="Toplantı bağlantısı" hint="Platform bağlantıdan otomatik algılanır.">
        <Input mono defaultValue="https://meet.google.com/bqx-mfzn-rde" />
      </Field>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Field label="Seviye"><Select value="Başlangıç" /></Field>
        <Field label="Süre"><Select value="60 dk" /></Field>
      </div>
    </div>
    <div className="col">
      <Field label="Açıklama" hint="Birkaç cümle ile dersin amacı."><Textarea rows={3} /></Field>
      <CheckboxRow checked icon={<Icon name="certificate" size={18} />} title="İcâzet verilsin"
        description="Müfredatı tamamlayan talebelere otomatik icâzet belgesi verilsin mi?" />
      <CheckboxRow icon={<Icon name="shield" size={18} />} title="Kayıt onayı gereksin"
        description="Talebelerin kaydı, siz onaylayana kadar beklemede kalır." />
    </div>
  </div>
);
</script></body></html>
