<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../css/index.css">
<style>body{padding:18px;background:var(--surface)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.lbl{font:var(--fw-semibold) var(--fs-10)/1 var(--font-ui);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--faint)}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../../../docs/ds-components.jsx"></script>
<script type="text/babel">
const { Logo, Icon, CoverPattern } = window.MadrasahDS;
ReactDOM.createRoot(document.getElementById("root")).render(
  <div className="col">
    <div className="row" style={{gap:26}}>
      <Logo mark="madrasah" size={40} withWordmark subtitle="Tedris" />
      <Logo mark="nizam" size={40} withWordmark subtitle="Online Madrasah" />
    </div>
    <div className="row" style={{gap:14,color:"var(--slate-600)"}}>
      {["home","book","table","headset","calendar","certificate","users","settings","eye","trash","link","filter"].map(n=>
        <Icon key={n} name={n} size={19} />)}
      <Icon name="star" filled size={19} style={{color:"var(--amber)"}} />
      <Icon name="play" filled size={19} />
    </div>
    <div className="row" style={{gap:10}}>
      {[145,28,270,340,60].map(h=>
        <div key={h} style={{width:118}}><CoverPattern hue={h} height={54} dense /></div>)}
    </div>
  </div>
);
</script></body></html>
