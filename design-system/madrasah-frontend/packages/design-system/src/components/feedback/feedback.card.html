<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../css/index.css">
<style>body{padding:18px;background:var(--surface)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.lbl{font:var(--fw-semibold) var(--fs-10)/1 var(--font-ui);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--faint)}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../../../docs/ds-components.jsx"></script>
<script type="text/babel">
const { Dialog, Toast, Button, Badge, Icon } = window.MadrasahDS;
ReactDOM.createRoot(document.getElementById("root")).render(
  <div style={{position:"relative",height:262,border:"1px solid var(--line-soft)",borderRadius:"var(--r-10)",overflow:"hidden",background:"var(--surface-page-alt)"}}>
    <Dialog contained width={520} eyebrow="Tam Müfredat" title="Bina ve İzhar Şerhi"
      onClose={()=>{}} style={{marginTop:14,maxHeight:"calc(100% - 28px)"}}
      headerExtra={<Button variant="ghost" size="sm" icon={<Icon name="download" size={14}/>}>PDF</Button>}
      actions={<>
        <span style={{color:"var(--muted)",font:"var(--fw-regular) var(--fs-12)/1 var(--font-ui)"}}>Son güncelleme: Ekim 2026</span>
        <Button size="sm" icon={<Icon name="play" filled size={12}/>}>Devam et</Button></>}>
      <div style={{display:"flex",gap:24,marginBottom:12}}>
        {[["Hafta","2/10"],["Ders","14/40"],["Süre","22 sa"]].map(([k,v])=>
          <div key={k}><div style={{font:"var(--fw-regular) var(--fs-11)/1 var(--font-ui)",color:"var(--muted)",marginBottom:3}}>{k}</div>
          <div style={{font:"var(--fw-semibold) var(--fs-14)/1 var(--font-ui)"}}>{v}</div></div>)}
      </div>
      <div style={{font:"var(--fw-regular) var(--fs-13)/var(--lh-body) var(--font-ui)",color:"var(--muted)"}}>
        Haftalar ve dersler bu alanda listelenir.
      </div>
    </Dialog>
    <Toast title="İthal Kartlar" description="2 kart başarıyla içe aktarıldı." />
  </div>
);
</script></body></html>
