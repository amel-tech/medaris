<!-- @dsCard group="Colors" viewport="700x120" subtitle="Page, card, sunken and nav fills" name="Surfaces" -->
<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../src/css/index.css">
<style>
body{padding:16px;background:var(--surface)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:96px}
.chip{height:46px;border-radius:var(--r-6);border:1px solid rgba(0,0,0,.06)}
.nm{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-ui);color:var(--ink);margin-top:6px}
.hx{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--faint)}
.row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tok{font:var(--fw-regular) 10.5px/1 var(--font-mono);color:var(--faint)}

</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="nm">surface</div><div class="hx">#ffffff</div></div>
<div class="sw"><div class="chip" style="background:var(--surface-alt)"></div><div class="nm">surface-alt</div><div class="hx">#f8fafc</div></div>
<div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><div class="nm">surface-sunken</div><div class="hx">#f3f4f6</div></div>
<div class="sw"><div class="chip" style="background:var(--nav-active)"></div><div class="nm">nav-active</div><div class="hx">#f1f2f4</div></div>
<div class="sw"><div class="chip" style="background:var(--surface-table-head)"></div><div class="nm">table-head</div><div class="hx">#fafafa</div></div>
<div class="sw"><div class="chip" style="background:var(--avatar-ground)"></div><div class="nm">avatar-ground</div><div class="hx">#eceef1</div></div>
<div class="sw"><div class="chip" style="background:var(--player-ground)"></div><div class="nm">player-ground</div><div class="hx">#0b1020</div></div>
</div></body></html>
