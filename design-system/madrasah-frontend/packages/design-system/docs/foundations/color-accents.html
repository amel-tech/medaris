<!-- @dsCard group="Colors" viewport="700x120" subtitle="Tedris blue, Nizam green, rating amber" name="Accents" -->
<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../src/css/index.css">
<style>
body{padding:16px;background:var(--surface)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:96px}
.chip{height:46px;border-radius:var(--r-6);border:1px solid rgba(0,0,0,.06)}
.nm{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-ui);color:var(--ink);margin-top:6px}
.hx{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--faint)}
.row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tok{font:var(--fw-regular) 10.5px/1 var(--font-mono);color:var(--faint)}

</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="nm">accent</div><div class="hx">#1d4ed8</div></div>
<div class="sw"><div class="chip" style="background:var(--accent-soft)"></div><div class="nm">accent-soft</div><div class="hx">#eff4ff</div></div>
<div class="sw"><div class="chip" style="background:var(--green)"></div><div class="nm">green</div><div class="hx">#0f9d63</div></div>
<div class="sw"><div class="chip" style="background:var(--green-dark)"></div><div class="nm">green-dark</div><div class="hx">#0c8454</div></div>
<div class="sw"><div class="chip" style="background:var(--amber)"></div><div class="nm">amber</div><div class="hx">#f59e0b</div></div>
</div></body></html>
