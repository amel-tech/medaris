<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../src/css/index.css">
<style>
body{padding:16px;background:var(--surface)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:96px}
.chip{height:46px;border-radius:var(--r-6);border:1px solid rgba(0,0,0,.06)}
.nm{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-ui);color:var(--ink);margin-top:6px}
.hx{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--faint)}
.row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tok{font:var(--fw-regular) 10.5px/1 var(--font-mono);color:var(--faint)}

</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--brand-navy)"></div><div class="nm">brand-navy</div><div class="hx">#0b1f3a</div></div>
<div class="sw"><div class="chip" style="background:var(--nizam-shell)"></div><div class="nm">nizam-shell</div><div class="hx">#1c2430</div></div>
<div class="sw"><div class="chip" style="background:var(--nizam-shell-fg)"></div><div class="nm">nizam-shell-fg</div><div class="hx">#bfe3ea</div></div>
<div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="nm">ink</div><div class="hx">#16181d</div></div>
<div class="sw"><div class="chip" style="background:var(--ink-tedris)"></div><div class="nm">ink-tedris</div><div class="hx">#0f172a</div></div>
</div></body></html>
