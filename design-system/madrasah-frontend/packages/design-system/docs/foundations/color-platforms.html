<!-- @dsCard group="Colors" viewport="700x120" subtitle="Resolved from the meeting URL, never picked" name="Meeting platforms" -->
<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../src/css/index.css">
<style>
body{padding:16px;background:var(--surface)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:96px}
.chip{height:46px;border-radius:var(--r-6);border:1px solid rgba(0,0,0,.06)}
.nm{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-ui);color:var(--ink);margin-top:6px}
.hx{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--faint)}
.row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tok{font:var(--fw-regular) 10.5px/1 var(--font-mono);color:var(--faint)}

</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--platform-meet)"></div><div class="nm">meet</div><div class="hx">#00897b</div></div>
<div class="sw"><div class="chip" style="background:var(--platform-meet-soft)"></div><div class="nm">meet-soft</div><div class="hx">#e6f4f1</div></div>
<div class="sw"><div class="chip" style="background:var(--platform-zoom)"></div><div class="nm">zoom</div><div class="hx">#2d8cff</div></div>
<div class="sw"><div class="chip" style="background:var(--platform-zoom-soft)"></div><div class="nm">zoom-soft</div><div class="hx">#e9f2ff</div></div>
<div class="sw"><div class="chip" style="background:var(--platform-jitsi)"></div><div class="nm">jitsi</div><div class="hx">#1d6fb8</div></div>
<div class="sw"><div class="chip" style="background:var(--platform-jitsi-soft)"></div><div class="nm">jitsi-soft</div><div class="hx">#e7f0f9</div></div>
</div></body></html>
