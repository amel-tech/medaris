<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../src/css/index.css">
<style>
body{padding:16px;background:var(--surface)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:96px}
.chip{height:46px;border-radius:var(--r-6);border:1px solid rgba(0,0,0,.06)}
.nm{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-ui);color:var(--ink);margin-top:6px}
.hx{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--faint)}
.row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tok{font:var(--fw-regular) 10.5px/1 var(--font-mono);color:var(--faint)}

</style></head><body>
<div style="font:var(--fw-extrabold) var(--fs-33)/var(--lh-tight) var(--font-ui);letter-spacing:var(--tracking-display)">Bilgi Kartı Desteleri</div>
<div class="tok">--fs-33 / --fw-extrabold / --tracking-display</div>
<div style="font:var(--fw-extrabold) var(--fs-26)/var(--lh-tight) var(--font-ui);letter-spacing:var(--tracking-title);margin-top:12px">Yeni Kurs Oluştur</div>
<div class="tok">--fs-26 / --fw-extrabold / --tracking-title</div>
<div style="font:var(--fw-bold) var(--fs-19)/var(--lh-heading) var(--font-ui);letter-spacing:var(--tracking-heading);margin-top:12px">Müderris ve kaynaklar</div>
<div class="tok">--fs-19 / --fw-bold / --tracking-heading</div></body></html>
