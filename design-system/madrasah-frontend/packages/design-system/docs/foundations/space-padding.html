<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Tedris 16px vs Nizam 22px" name="Card padding in use" -->
<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../src/css/index.css">
<style>
body{padding:16px;background:var(--surface)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:96px}
.chip{height:46px;border-radius:var(--r-6);border:1px solid rgba(0,0,0,.06)}
.nm{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-ui);color:var(--ink);margin-top:6px}
.hx{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--faint)}
.row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tok{font:var(--fw-regular) 10.5px/1 var(--font-mono);color:var(--faint)}

</style></head><body>
<div style="display:flex;gap:16px">
  <div style="flex:1;border:1px solid var(--border);border-radius:var(--r-card);padding:var(--pad-card)">
    <div style="font:var(--fw-semibold) var(--fs-15)/1.3 var(--font-ui)">Tedris kartı</div>
    <div style="font:var(--fw-regular) var(--fs-12)/1.45 var(--font-ui);color:var(--muted);margin-top:4px">--pad-card · 16px · gap 16px</div>
  </div>
  <div style="flex:1;border:1px solid var(--line);border-radius:var(--r-card);padding:var(--pad-card-nizam)">
    <div style="font:var(--fw-bold) var(--fs-19)/1.3 var(--font-ui);letter-spacing:var(--tracking-heading)">Nizam kartı</div>
    <div style="font:var(--fw-regular) var(--fs-14)/1.45 var(--font-ui);color:var(--muted);margin-top:6px">--pad-card-nizam · 22px · gap 22px</div>
  </div>
</div></body></html>
