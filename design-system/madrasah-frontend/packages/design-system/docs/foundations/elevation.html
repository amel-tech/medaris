<!-- @dsCard group="Brand" viewport="700x170" subtitle="Hairlines do the work; shadows are wide soft lifts" name="Elevation" -->
<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../src/css/index.css">
<style>
body{padding:16px;background:var(--surface)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:96px}
.chip{height:46px;border-radius:var(--r-6);border:1px solid rgba(0,0,0,.06)}
.nm{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-ui);color:var(--ink);margin-top:6px}
.hx{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--faint)}
.row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tok{font:var(--fw-regular) 10.5px/1 var(--font-mono);color:var(--faint)}

</style></head><body>
<div class="grid" style="gap:16px">
<div class="sw" style="width:118px"><div style="height:64px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-card);box-shadow:var(--shadow-hairline)"></div><div class="nm">hairline</div></div><div class="sw" style="width:118px"><div style="height:64px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-card);box-shadow:var(--shadow-float)"></div><div class="nm">float</div></div><div class="sw" style="width:118px"><div style="height:64px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-card);box-shadow:var(--shadow-card-lift)"></div><div class="nm">card-lift</div></div><div class="sw" style="width:118px"><div style="height:64px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-card);box-shadow:var(--shadow-toast)"></div><div class="nm">toast</div></div><div class="sw" style="width:118px"><div style="height:64px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-card);box-shadow:var(--shadow-dialog)"></div><div class="nm">dialog</div></div>
</div>
<div class="tok" style="margin-top:12px">Default container = 1px border + --r-card + white. No shadow.</div></body></html>
