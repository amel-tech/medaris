<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../src/css/index.css">
<style>
body{padding:16px;background:var(--surface)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:96px}
.chip{height:46px;border-radius:var(--r-6);border:1px solid rgba(0,0,0,.06)}
.nm{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-ui);color:var(--ink);margin-top:6px}
.hx{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--faint)}
.row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tok{font:var(--fw-regular) 10.5px/1 var(--font-mono);color:var(--faint)}

</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--type-video)"></div><div class="nm">video</div><div class="hx">#1d4ed8</div></div>
<div class="sw"><div class="chip" style="background:var(--type-doc)"></div><div class="nm">doc</div><div class="hx">#64748b</div></div>
<div class="sw"><div class="chip" style="background:var(--type-live)"></div><div class="nm">live</div><div class="hx">#dc2626</div></div>
<div class="sw"><div class="chip" style="background:var(--type-quiz)"></div><div class="nm">quiz</div><div class="hx">#d97706</div></div>
</div></body></html>
