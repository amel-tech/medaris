<!-- @dsCard group="Colors" viewport="700x120" subtitle="Text greys and the two 1px border tokens" name="Neutrals & hairlines" -->
<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../src/css/index.css">
<style>
body{padding:16px;background:var(--surface)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:96px}
.chip{height:46px;border-radius:var(--r-6);border:1px solid rgba(0,0,0,.06)}
.nm{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-ui);color:var(--ink);margin-top:6px}
.hx{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--faint)}
.row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tok{font:var(--fw-regular) 10.5px/1 var(--font-mono);color:var(--faint)}

</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--muted)"></div><div class="nm">muted</div><div class="hx">#64748b</div></div>
<div class="sw"><div class="chip" style="background:var(--faint)"></div><div class="nm">faint</div><div class="hx">#94a3b8</div></div>
<div class="sw"><div class="chip" style="background:var(--slate-600)"></div><div class="nm">slate-600</div><div class="hx">#3f444c</div></div>
<div class="sw"><div class="chip" style="background:var(--slate-500)"></div><div class="nm">slate-500</div><div class="hx">#6b7280</div></div>
<div class="sw"><div class="chip" style="background:var(--line)"></div><div class="nm">line</div><div class="hx">#e7e8ea</div></div>
<div class="sw"><div class="chip" style="background:var(--border)"></div><div class="nm">border</div><div class="hx">#e5e7eb</div></div>
<div class="sw"><div class="chip" style="background:var(--line-soft)"></div><div class="nm">line-soft</div><div class="hx">#eef0f2</div></div>
</div></body></html>
