<!-- @startingPoint section="Tedris" subtitle="Tedris app shell with real screens" viewport="1440x900" -->
<!doctype html><html lang="tr"><head><meta charset="utf-8">
<title>Tedris — UI kit</title>
<link rel="stylesheet" href="../../../src/css/index.css">
<style>html,body{margin:0;height:100%}#root{min-height:100vh}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../../ds-components.jsx"></script>
<script type="text/babel">
// Resolve the generated component bundle namespace, whatever it is called.
window.DS = (function(){
  for (const v of Object.values(window)) {
    if (v && typeof v === "object" && v.Button && v.Card && v.Icon) return v;
  }
  return window;
})();
</script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="OgrenmeScreen.jsx"></script>
<script type="text/babel" src="CourseScreen.jsx"></script>
<script type="text/babel" src="LiveLessonScreen.jsx"></script>
<script type="text/babel">
function TedrisApp() {
  const [route, setRoute] = React.useState("ogrenme");
  const crumbs = {
    ogrenme: ["Öğrenme", "Köşkler"],
    course: ["Öğrenme", "Süleymaniye Köşkü", "Bina ve İzhar Şerhi"],
    lesson: ["Öğrenme", "Bina ve İzhar Şerhi", "Hafta 3"],
    ev: ["Ev"],
    desteler: ["Desteler"],
  };
  return (
    <TedrisShell route={route} onNavigate={setRoute} breadcrumb={crumbs[route] ?? ["Öğrenme"]}>
      {route === "course"
        ? <CourseScreen onOpenLesson={() => setRoute("lesson")} />
        : route === "lesson"
        ? <LiveLessonScreen onBack={() => setRoute("course")} />
        : <OgrenmeScreen onOpenCourse={() => setRoute("course")} onOpenLesson={() => setRoute("lesson")} />}
    </TedrisShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<TedrisApp />);
</script>
</body></html>
