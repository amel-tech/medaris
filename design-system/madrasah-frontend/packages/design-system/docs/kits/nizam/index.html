<!doctype html><html lang="tr"><head><meta charset="utf-8">
<title>Nizam — UI kit</title>
<link rel="stylesheet" href="../../../src/css/index.css">
<style>html,body{margin:0;height:100%}#root{min-height:100vh}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../../ds-components.jsx"></script>
<script type="text/babel">window.DS = window.MadrasahDS;</script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="DecksScreen.jsx"></script>
<script type="text/babel" src="KosksScreen.jsx"></script>
<script type="text/babel" src="CourseEditScreen.jsx"></script>
<script type="text/babel">
function NizamApp() {
  const [route, setRoute] = React.useState("koskler");
  const crumbs = {
    desteler: ["Ev", "Decks"],
    deckDetail: ["Ev", "Decks", "testtest"],
    koskler: ["Ev", "Köşkler"],
    koskDetail: ["Ev", "Köşkler", "Fâtih Köşkü"],
    courseEdit: ["Ev", "Köşkler", "Fâtih Köşkü", "Kursu Düzenle"],
  };
  const screen =
    route === "desteler"   ? <DecksScreen onOpenDeck={() => setRoute("deckDetail")} /> :
    route === "deckDetail" ? <DeckDetailScreen /> :
    route === "koskDetail" ? <KoskDetailScreen onEditCourse={() => setRoute("courseEdit")} /> :
    route === "courseEdit" ? <CourseEditScreen /> :
                             <KosksScreen onOpenKosk={() => setRoute("koskDetail")} />;
  return (
    <NizamShell route={route} onNavigate={setRoute} breadcrumb={crumbs[route] ?? ["Ev"]}>
      {screen}
    </NizamShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<NizamApp />);
</script>
</body></html>
