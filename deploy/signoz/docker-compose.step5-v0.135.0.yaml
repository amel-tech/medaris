# Upgrade step 5 of 5 (README.md, "Upgrade path"): mandatory stop v0.135.0.
# The dashboards in SQLite are converted to the v2 schema when signoz starts.
# SigNoz v0.135.0 with collector v0.144.6, the newest collector released
# before v0.135.0, on the collector config of steps 3 and 4. Otherwise
# identical to docker-compose.coolify.yaml, except that it sets no
# CLICKHOUSE_PASSWORD: ClickHouse logs `Env variable is not set` and keeps the
# empty password of the earlier steps (README.md, "ClickHouse password").
services:
  init-clickhouse:
    image: clickhouse/clickhouse-server:25.12.5
    container_name: signoz-init-clickhouse
    exclude_from_hc: true
    restart: on-failure
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - user-scripts:/var/lib/clickhouse/user_scripts
    mem_limit: 256m
    cpus: 0.5
    networks:
      - signoz-net
    logging:
      options:
        max-size: 50m
        max-file: "3"

  zookeeper-1:
    image: signoz/zookeeper:3.7.1
    container_name: signoz-zookeeper-1
    restart: unless-stopped
    # The volume's files were written as root by the bitnami image.
    user: root
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_4LW_COMMANDS_WHITELIST=srvr, mntr, ruok
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_AUTOPURGE_RETAIN_COUNT=3
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      # Upstream sets 1024 (MB, used for both -Xms and -Xmx). Measured use is
      # 170 MiB in total, so the heap is cut to fit mem_limit below.
      - ZOO_HEAP_SIZE=256
      - ZOO_INIT_LIMIT=10
      - ZOO_LOG_LEVEL=INFO
      - ZOO_MAX_CLIENT_CNXNS=60
      - ZOO_MAX_SESSION_TIMEOUT=40000
      - ZOO_PRE_ALLOC_SIZE=65536
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141
      - ZOO_SNAPCOUNT=100000
      - ZOO_SYNC_LIMIT=5
      - ZOO_TICK_TIME=2000
    volumes:
      - zookeeper-1:/bitnami/zookeeper
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - signoz-net
    logging:
      options:
        max-size: 50m
        max-file: "3"

  clickhouse:
    image: clickhouse/clickhouse-server:25.12.5
    container_name: signoz-clickhouse
    restart: unless-stopped
    depends_on:
      init-clickhouse:
        condition: service_completed_successfully
      zookeeper-1:
        condition: service_healthy
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - CLICKHOUSE_CONFIG=/etc/clickhouse-server/config-0-0.yaml
    volumes:
      - clickhouse:/var/lib/clickhouse/
      - user-scripts:/var/lib/clickhouse/user_scripts:ro
      - type: bind
        source: ./config/clickhouse/config-0-0.yaml
        target: /etc/clickhouse-server/config-0-0.yaml
        read_only: true
      - type: bind
        source: ./config/clickhouse/functions.yaml
        target: /etc/clickhouse-server/functions.yaml
        read_only: true
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8123/ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Owner-approved. ClickHouse sizes its own ceiling from the cgroup limit
    # (max_server_memory_usage_to_ram_ratio, default 0.9), see README.md.
    mem_limit: 2560m
    cpus: 2
    networks:
      - signoz-net
    logging:
      options:
        max-size: 50m
        max-file: "3"

  signoz-telemetrystore-migrator:
    image: signoz/signoz-otel-collector:v0.144.6
    container_name: signoz-telemetrystore-migrator
    exclude_from_hc: true
    restart: on-failure
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate ready &&
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    mem_limit: 256m
    cpus: 0.5
    networks:
      - signoz-net
    logging:
      options:
        max-size: 50m
        max-file: "3"

  signoz:
    image: signoz/signoz:v0.135.0
    container_name: signoz
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      # Steps 1-5 still sign sessions as JWTs with this key
      # (README.md, "JWT secret"). Set once in Coolify;
      # Older releases read the first name, newer ones the second.
      - SIGNOZ_JWT_SECRET=${SIGNOZ_JWT_SECRET:?set SIGNOZ_JWT_SECRET in Coolify}
      - SIGNOZ_TOKENIZER_JWT_SECRET=${SIGNOZ_JWT_SECRET:?set SIGNOZ_JWT_SECRET in Coolify}
      - SIGNOZ_SQLSTORE_PROVIDER=sqlite
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
    # No published port: Coolify's proxy reaches the UI on container port
    # 8080 over the stack's network, behind the domain's TLS.
    volumes:
      - sqlite:/var/lib/signoz/
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8080/api/v1/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 1g
    cpus: 1
    networks:
      - signoz-net
    logging:
      options:
        max-size: 50m
        max-file: "3"

  otel-collector:
    image: signoz/signoz-otel-collector:v0.144.6
    container_name: signoz-otel-collector
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    # Refuses to start until the migrator's sync migrations are in; the
    # restart policy retries until they are.
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/opamp-config.yaml --copy-path=/var/tmp/collector-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    # The proxy labels of docker-compose.coolify.yaml: otlp.medaris.net
    # serves only OTLP_ALLOWED_SOURCES (README.md, "OTLP endpoint").
    labels:
      - traefik.http.middlewares.signoz-otlp-allowlist.ipallowlist.sourcerange=${OTLP_ALLOWED_SOURCES:?set OTLP_ALLOWED_SOURCES in Coolify, see README.md}
      - traefik.http.routers.signoz-otlp.rule=Host(`otlp.medaris.net`)
      - traefik.http.routers.signoz-otlp.priority=100
      - traefik.http.routers.signoz-otlp.entrypoints=https
      - traefik.http.routers.signoz-otlp.tls=true
      - traefik.http.routers.signoz-otlp.tls.certresolver=letsencrypt
      - traefik.http.routers.signoz-otlp.middlewares=signoz-otlp-allowlist
      - traefik.http.routers.signoz-otlp.service=signoz-otlp
      - traefik.http.services.signoz-otlp.loadbalancer.server.port=4318
      - traefik.http.routers.signoz-otlp-http.rule=Host(`otlp.medaris.net`)
      - traefik.http.routers.signoz-otlp-http.priority=100
      - traefik.http.routers.signoz-otlp-http.entrypoints=http
      - traefik.http.routers.signoz-otlp-http.middlewares=redirect-to-https
      - traefik.http.routers.signoz-otlp-http.service=noop@internal
    volumes:
      - type: bind
        source: ./legacy/otel-collector-config.v0.129.yaml
        target: /etc/otel-collector-config.yaml
        read_only: true
      - type: bind
        source: ./config/ingester/opamp.yaml
        target: /etc/opamp-config.yaml
        read_only: true
    mem_limit: 768m
    cpus: 1
    networks:
      - signoz-net
    logging:
      options:
        max-size: 50m
        max-file: "3"

networks:
  signoz-net:
    name: signoz-net

volumes:
  clickhouse:
    name: signoz-clickhouse
  sqlite:
    name: signoz-sqlite
  zookeeper-1:
    name: signoz-zookeeper-1
  user-scripts:
    name: signoz-user-scripts
