# Upgrade step 3 of 5 (README.md, "Upgrade path"): mandatory stop v0.113.0.
# The schema migrator image is retired: one signoz-telemetrystore-migrator
# service (the collector image's `migrate` command) replaces the two
# schema-migrator services, the collector checks the sync migrations before it
# starts, and signoz loses its legacy flags, mounts and variables. As upstream's
# compose at v0.113.0 (collector v0.144.1). ClickHouse stays on 25.5.6.
services:
  init-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: signoz-init-clickhouse
    exclude_from_hc: true
    restart: on-failure
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - user-scripts:/var/lib/clickhouse/user_scripts
    mem_limit: 256m
    cpus: 0.5
    networks:
      - signoz-net
    logging:
      options:
        max-size: 50m
        max-file: "3"

  zookeeper-1:
    image: signoz/zookeeper:3.7.1
    container_name: signoz-zookeeper-1
    restart: unless-stopped
    user: root
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141
      - ZOO_HEAP_SIZE=256
    volumes:
      - zookeeper-1:/bitnami/zookeeper
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    cpus: 0.5
    networks:
      - signoz-net
    logging:
      options:
        max-size: 50m
        max-file: "3"

  clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: signoz-clickhouse
    restart: unless-stopped
    tty: true
    environment:
      # Without it the 25.x entrypoint may restrict the password-less
      # default user to localhost, which locks every other container out.
      - CLICKHOUSE_SKIP_USER_SETUP=1
    depends_on:
      init-clickhouse:
        condition: service_completed_successfully
      zookeeper-1:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./legacy/clickhouse/config.xml
        target: /etc/clickhouse-server/config.xml
      - type: bind
        source: ./legacy/clickhouse/users.xml
        target: /etc/clickhouse-server/users.xml
      - type: bind
        source: ./legacy/clickhouse/custom-function.xml
        target: /etc/clickhouse-server/custom-function.xml
      - type: bind
        source: ./legacy/clickhouse/cluster.xml
        target: /etc/clickhouse-server/config.d/cluster.xml
      - user-scripts:/var/lib/clickhouse/user_scripts
      - clickhouse:/var/lib/clickhouse/
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - 0.0.0.0:8123/ping
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 2560m
    cpus: 2
    networks:
      - signoz-net
    logging:
      options:
        max-size: 50m
        max-file: "3"

  signoz-telemetrystore-migrator:
    image: signoz/signoz-otel-collector:v0.144.1
    container_name: signoz-telemetrystore-migrator
    exclude_from_hc: true
    restart: on-failure
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    mem_limit: 256m
    cpus: 0.5
    networks:
      - signoz-net
    logging:
      options:
        max-size: 50m
        max-file: "3"

  signoz:
    image: signoz/signoz:v0.113.0
    container_name: signoz
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      # Steps 1-5 still sign sessions as JWTs with this key
      # (README.md, "JWT secret"). Set once in Coolify;
      # Older releases read the first name, newer ones the second.
      - SIGNOZ_JWT_SECRET=${SIGNOZ_JWT_SECRET:?set SIGNOZ_JWT_SECRET in Coolify}
      - SIGNOZ_TOKENIZER_JWT_SECRET=${SIGNOZ_JWT_SECRET:?set SIGNOZ_JWT_SECRET in Coolify}
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
    # No published port: Coolify's proxy reaches the UI on container port
    # 8080 over the stack's network, behind the domain's TLS.
    volumes:
      - sqlite:/var/lib/signoz/
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - localhost:8080/api/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 1g
    cpus: 1
    networks:
      - signoz-net
    logging:
      options:
        max-size: 50m
        max-file: "3"

  otel-collector:
    image: signoz/signoz-otel-collector:v0.144.1
    container_name: signoz-otel-collector
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/manager-config.yaml --copy-path=/var/tmp/collector-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - type: bind
        source: ./legacy/otel-collector-config.v0.129.yaml
        target: /etc/otel-collector-config.yaml
      - type: bind
        source: ./legacy/signoz/otel-collector-opamp-config.yaml
        target: /etc/manager-config.yaml
    mem_limit: 768m
    cpus: 1
    networks:
      - signoz-net
    logging:
      options:
        max-size: 50m
        max-file: "3"

networks:
  signoz-net:
    name: signoz-net

volumes:
  clickhouse:
    name: signoz-clickhouse
  sqlite:
    name: signoz-sqlite
  zookeeper-1:
    name: signoz-zookeeper-1
  user-scripts:
    name: signoz-user-scripts
