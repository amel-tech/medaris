name: Keycloak Theme Deploy

# The only deploy workflow that never touches Docker: it builds a JAR on the
# runner, ships it over SSH and restarts Keycloak through a Coolify webhook.
# Since MDRS-99 the build is keycloak-theme-jar.yaml (called below, so the JAR
# that ships is the one that passed the Keycloak smoke test), SSH uses a deploy
# key instead of a password, and the JAR lands as medaris-keycloak-theme.jar in
# the host directory named by the KC_THEME_DIR repository variable — see
# docs/runbooks/deploy-keycloak-theme.md.
#
# It was also the only one that failed before reaching its first real step —
# `cache: npm` + `cache-dependency-path: '**/package-lock.json'` hard-fails with
# "Dependencies lock file is not found" because MDRS-10/MDRS-11 deleted every
# package-lock.json. Toolchain here now matches ci.yaml exactly (MDRS-16).

on:
  workflow_dispatch:
  workflow_call:
  release:
    types:
      - created

permissions:
  contents: read

# Serialize deploys of this app. Not ref-scoped: two dispatches from different
# branches still race for the same providers directory and the same
# Keycloak restart. `cancel-in-progress: false` — cancelling mid-`mv` on the
# server is strictly worse than queueing.
concurrency:
  group: deploy-keycloak-theme
  cancel-in-progress: false

jobs:
  # Gate inverted (MDRS-16). The old form was
  #   github.event_name == 'workflow_dispatch' || == 'workflow_call' || startsWith(...)
  # which is a trap for `workflow_call`: inside a reusable workflow the
  # `github` context belongs to the CALLER, so `github.event_name` is never
  # 'workflow_call' — it is whatever triggered the caller. Since MDRS-86
  # cd-development.yaml calls this workflow, and this gate is why that works.
  # Stating the one real restriction instead — "on a release, the tag must be
  # ours" — is safe for any future trigger. It sits on the first job only:
  # build and deploy `need` it, so they are skipped with it.
  #
  # The configuration check runs before the build, so an unconfigured deploy
  # fails in seconds instead of after a JDK/Maven build and a Keycloak boot.
  preflight:
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'keycloak-theme-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KC_THEME_DIR: ${{ vars.KC_THEME_DIR }}
    steps:
      - name: Check deploy configuration
        env:
          HAS_HOST: ${{ secrets.KC_SSH_HOST != '' }}
          HAS_USER: ${{ secrets.KC_SSH_USERNAME != '' }}
          HAS_KEY: ${{ secrets.KC_SSH_PRIVATE_KEY != '' }}
          HAS_FINGERPRINT: ${{ secrets.KC_SSH_HOST_FINGERPRINT != '' }}
        run: |
          set -euo pipefail
          missing=''
          [ -n "${KC_THEME_DIR}" ] || missing="$missing variable:KC_THEME_DIR"
          [ "$HAS_HOST" = true ] || missing="$missing secret:KC_SSH_HOST"
          [ "$HAS_USER" = true ] || missing="$missing secret:KC_SSH_USERNAME"
          [ "$HAS_KEY" = true ] || missing="$missing secret:KC_SSH_PRIVATE_KEY"
          [ "$HAS_FINGERPRINT" = true ] || missing="$missing secret:KC_SSH_HOST_FINGERPRINT"
          if [ -n "$missing" ]; then
            echo "::error::Keycloak theme deploy is not configured; missing:${missing}. See docs/runbooks/deploy-keycloak-theme.md §0."
            exit 1
          fi
          echo "Deploying to ${KC_THEME_DIR}"

  build:
    needs: preflight
    uses: ./.github/workflows/keycloak-theme-jar.yaml
    permissions:
      contents: read

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Host directory mounted at /opt/keycloak/providers in the Keycloak
      # container. A repository VARIABLE, not a secret: it is not sensitive,
      # and it must be readable in the run log to be checked. No default — the
      # directory hard-coded before MDRS-99 was never confirmed to be mounted,
      # and a JAR written to an unmounted path fails nothing (MDRS-99).
      KC_THEME_DIR: ${{ vars.KC_THEME_DIR }}
      # Where the JAR waits on the host between the copy and the swap: outside
      # the providers directory, so a restart in between cannot load it, and
      # relative, i.e. in the deploy user's home — not a world-writable /tmp,
      # where another local user could swap the JAR before it is installed
      # (a provider JAR runs inside Keycloak).
      KC_STAGE_DIR: .medaris-keycloak-theme-staging/${{ github.run_id }}
      KC_STAGED_JAR: .medaris-keycloak-theme-staging/${{ github.run_id }}/keycloak-theme-for-kc-all-other-versions.jar
    steps:
      # For script_path below: ssh-action reads tools/keycloak/deploy-theme.sh
      # from this checkout and runs its contents on the host.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the smoke-tested JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist_keycloak

      # Key, not password (MDRS-99): KC_SSH_PASSWORD is gone. The host key is
      # pinned by fingerprint so a spoofed host cannot receive the JAR.
      - name: Copy JAR file to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.KC_SSH_HOST }}
          username: ${{ secrets.KC_SSH_USERNAME }}
          key: ${{ secrets.KC_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.KC_SSH_HOST_FINGERPRINT }}
          port: ${{ secrets.KC_SSH_PORT || 22 }}
          source: dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar
          target: ${{ env.KC_STAGE_DIR }}
          strip_components: 1
          overwrite: true

      # tools/keycloak/deploy-theme.sh: back up the current
      # medaris-keycloak-theme.jar, swap the new one in atomically, retire the
      # pre-MDRS-10 JAR (old file name, old theme id) so it stops loading, and
      # print the deployed SHA-256.
      - name: Back up the current theme and activate the new JAR
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.KC_SSH_HOST }}
          username: ${{ secrets.KC_SSH_USERNAME }}
          key: ${{ secrets.KC_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.KC_SSH_HOST_FINGERPRINT }}
          port: ${{ secrets.KC_SSH_PORT || 22 }}
          envs: KC_THEME_DIR,KC_STAGED_JAR
          script_path: tools/keycloak/deploy-theme.sh

      # A 401, a 404 or a Coolify 5xx fails the job: a new JAR on disk with an
      # unrestarted Keycloak is not a deploy. Secrets come in through `env` so
      # they are never spliced into the script body.
      - name: Restart Keycloak at Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.KEYCLOAK_COOLIFY_RESTART_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_WEBHOOK}" ]; then
            echo "::error::KEYCLOAK_COOLIFY_RESTART_WEBHOOK is not set — the JAR is on the server but Keycloak was never restarted."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
               --retry 3 --retry-connrefused --max-time 60 \
               --request GET "${COOLIFY_WEBHOOK}" \
               --header "Authorization: Bearer ${COOLIFY_TOKEN}"
          echo
          echo "Coolify restart webhook accepted."
