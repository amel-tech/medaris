name: Keycloak Theme Deploy

# The only deploy workflow that never touches Docker: it builds a JAR on the
# runner, ships it over SSH and restarts Keycloak through a Coolify webhook.
# It was also the only one that failed before reaching its first real step —
# `cache: npm` + `cache-dependency-path: '**/package-lock.json'` hard-fails with
# "Dependencies lock file is not found" because MDRS-10/MDRS-11 deleted every
# package-lock.json. Toolchain here now matches ci.yaml exactly (MDRS-16).

on:
  workflow_dispatch:
  workflow_call:
  release:
    types:
      - created

permissions:
  contents: read

# Serialize deploys of this app. Not ref-scoped: two dispatches from different
# branches still race for the same /opt/keycloak/themes directory and the same
# Keycloak restart. `cancel-in-progress: false` — cancelling mid-`mv` on the
# server is strictly worse than queueing.
concurrency:
  group: deploy-keycloak-theme
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gate inverted (MDRS-16). The old form was
    #   github.event_name == 'workflow_dispatch' || == 'workflow_call' || startsWith(...)
    # which is a trap for `workflow_call`: inside a reusable workflow the
    # `github` context belongs to the CALLER, so `github.event_name` is never
    # 'workflow_call' — it is whatever triggered the caller. It happens to work
    # today only because deploy-affected.yaml is workflow_dispatch-only. The
    # moment that dispatcher gains a `push:` trigger, event_name becomes 'push',
    # no clause matches, and the deploy is silently skipped with a green
    # checkmark. Stating the one real restriction instead — "on a release, the
    # tag must be ours" — is behaviour-identical for the three current triggers
    # and safe for any future one.
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'keycloak-theme-') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Third-party actions are pinned to a commit; first-party actions/* stay
      # on tags. That split is ci.yaml's stated policy (ci.yaml:100-106) and the
      # SHA below is byte-identical to the one ci.yaml already uses.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Java 21, not 11. keycloakify 11.9.16 shells out to `mvn clean install`
      # (node_modules/keycloakify/bin/511.index.js) to package the theme, and
      # the JAR it produces is loaded by Keycloak 26 — apps/keycloak-theme/
      # package.json pins quay.io/keycloak/keycloak:26.3.2, whose bundled JVM is
      # `openjdk 21.0.8 2025-07-15 LTS` (verified by running `java -version`
      # inside that image). Building on the JDK the artifact will run on is the
      # only defensible pairing; 11 was inherited from a pre-Keycloak-25 theme.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # `stCarolas/setup-maven@v5` is gone: it was an unpinned third-party action
      # installing Maven 3.9.6, while the ubuntu-24.04 runner image already ships
      # Maven 3.9.16 (actions/runner-images Ubuntu2404-Readme.md). Nothing here
      # needs a specific Maven version — the generated pom.xml declares no
      # compiler plugin and the JAR carries resources only, no .class files.
      # This step exists so a future runner image dropping Maven fails loudly
      # here instead of deep inside keycloakify's build.
      - name: Verify Maven is available
        run: mvn --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/keycloak-theme has NO `build` target. Its project.json declares only
      # `lint`; every other target is inferred by Nx from package.json scripts,
      # so the real target name is `build-keycloak-theme`
      # (`nx show project keycloak-theme` lists it). Running it through Nx rather
      # than `cd apps/keycloak-theme && npm run …` is what builds @medaris/ui and
      # @medaris/icons first, via nx.json targetDefaults.
      - name: Build Keycloak theme
        run: pnpm exec nx run keycloak-theme:build-keycloak-theme

      # keycloakify emits two JARs (…-for-kc-22-to-25.jar and
      # …-for-kc-all-other-versions.jar). Keycloak 26 needs the latter.
      - name: Verify JAR file exists
        run: |
          set -euo pipefail
          jar="apps/keycloak-theme/dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::JAR not found at $jar"
            ls -la apps/keycloak-theme/dist_keycloak || true
            exit 1
          fi
          echo "JAR file found successfully"
          ls -l "$jar"

      # Retained for 90 days so a rollback does not depend on a
      # madrasah-theme.jar.backup.* file happening to still be on the box.
      # See docs/runbooks/deploy-keycloak-theme.md.
      - name: Upload theme JAR for rollback
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-theme-jar-${{ github.sha }}
          path: apps/keycloak-theme/dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar
          if-no-files-found: error
          retention-days: 90

      - name: Copy JAR file to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.KC_SSH_HOST }}
          username: ${{ secrets.KC_SSH_USERNAME }}
          password: ${{ secrets.KC_SSH_PASSWORD }}
          port: ${{ secrets.KC_SSH_PORT || 22 }}
          source: "apps/keycloak-theme/dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar"
          target: "/opt/keycloak/themes"
          strip_components: 3
          overwrite: true

      - name: Backup existing theme and activate new JAR
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.KC_SSH_HOST }}
          username: ${{ secrets.KC_SSH_USERNAME }}
          password: ${{ secrets.KC_SSH_PASSWORD }}
          port: ${{ secrets.KC_SSH_PORT || 22 }}
          script: |
            set -e
            if [ -f "/opt/keycloak/themes/madrasah-theme.jar" ]; then
              echo "Backing up existing theme..."
              cp /opt/keycloak/themes/madrasah-theme.jar /opt/keycloak/themes/madrasah-theme.jar.backup.$(date +%Y%m%d_%H%M%S)
            else
              echo "No existing theme to backup"
            fi
            echo "Activating new theme..."
            mv -f /opt/keycloak/themes/keycloak-theme-for-kc-all-other-versions.jar /opt/keycloak/themes/madrasah-theme.jar

      # The old form was `curl --request GET '<url>' --header '…'` with no
      # failure handling: a 401, a 404 or a Coolify 500 all left the job green
      # while the new JAR sat on disk unloaded. Secrets move to `env` so they are
      # never spliced into the script body.
      - name: Restart Keycloak at Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.KEYCLOAK_COOLIFY_RESTART_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_WEBHOOK}" ]; then
            echo "::error::KEYCLOAK_COOLIFY_RESTART_WEBHOOK is not set — the JAR is on the server but Keycloak was never restarted."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
               --retry 3 --retry-connrefused --max-time 60 \
               --request GET "${COOLIFY_WEBHOOK}" \
               --header "Authorization: Bearer ${COOLIFY_TOKEN}"
          echo
          echo "Coolify restart webhook accepted."
