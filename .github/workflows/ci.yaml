name: CI

# The single shared-CI surface for the monorepo (MDRS-15). Replaces four
# inherited workflows: .migration/{backend,frontend}/.github/workflows/
# pull-request.yaml and ci-dev.yaml.
#
# The two inherited pull-request.yaml files each ran lint + test + build over
# their whole repo with `npm ci`. The two inherited ci-dev.yaml files contained
# no CI at all — they were push-to-main Docker build/push + Coolify deploy jobs,
# and that deploy surface is already covered by the seven per-app workflows in
# this directory (same Dockerfiles, same registry, same webhook secrets), whose
# trigger policy belongs to MDRS-16. So nothing from ci-dev.yaml is reproduced
# here; this workflow owns the quality gates only.
#
# Deploys are NOT triggered from here.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight run per PR; pushes to main are never cancelled because
# nx-set-shas uses the last successful main run as the affected base.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Commit hygiene ─────────────────────────────────────────────────────────
  # MDRS-14 wired commitlint into a local commit-msg hook, but a local hook only
  # sees commits authored locally, and only by people who ran `pnpm install`.
  # Nothing it checks is what actually lands: with squash merge GitHub composes
  # the message from the PR title server-side, and with a merge commit the
  # branch's own commits land verbatim. So both the PR title and the commits in
  # the range are linted here, and this job is the only thing that gates main's
  # history against commitlint.config.mjs.
  #
  # This job used to carry `if: github.event_name == 'pull_request'`, which made
  # it SKIP on every push. That is how 4305356 reached main unchecked (run
  # 31701734355: Commit hygiene skipped, Verify failed, main stayed red for a
  # day) — a direct push bypasses the PR surface entirely, so a PR-only gate is
  # not a gate. The job now runs on push too and lints the pushed range; the
  # PR-shaped checks stay as pull_request-only STEPS below.
  #
  # Merge commits are not a problem for the range lint: commitlint's
  # defaultIgnores drops any `Merge ...`/`Revert ...` subject before the rules
  # run (verified against @commitlint/cli 21.2.2 on this repo's own history —
  # `commitlint --from 4305356 --to 68faa44`, a range whose tip IS the merge
  # commit 68faa44, reports "found 0 problems"). This matters because the repo
  # allows both merge and rebase merges today; nothing here assumes squash-only.
  commit-hygiene:
    name: Commit hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This is the message that will land on main when the PR is squashed
      # (squash_merge_commit_title is COMMIT_OR_PR_TITLE).
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | pnpm exec commitlint --verbose

      # These are the messages that land on main when the PR is merged with a
      # merge or rebase merge, both of which the repo still allows.
      - name: Lint commits in PR range
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      # The push path. `before..after` is the exact set of commits this push
      # added to main, which for a merged PR is the same set the PR range lint
      # already saw, and for a direct push (the 4305356 case) is the only place
      # anything sees it at all.
      #
      # Three shapes have to be handled or the step fails for reasons that have
      # nothing to do with commit messages:
      #
      #   * before is all-zeroes — the branch was just created, so there is no
      #     previous tip. Fall back to the single new commit (HEAD~1..HEAD).
      #   * after is all-zeroes — the branch was deleted. Nothing to lint.
      #   * before is unreachable — a force-push (or a re-run after the ref
      #     moved) leaves a SHA that is no longer in this clone, and commitlint
      #     21 runs `git merge-base` before walking the range, so an unreachable
      #     ref is a hard error rather than an empty range. `git cat-file -e`
      #     is the cheap pre-check; same HEAD~1..HEAD fallback.
      #
      # Checkout above already uses fetch-depth: 0, which this needs — a shallow
      # clone would give commitlint no merge-base and it would (correctly) refuse
      # rather than silently linting a truncated range.
      #
      # before/after come in as env rather than being interpolated into the
      # script body: they are GitHub-supplied SHAs, but keeping every
      # `github.event.*` value out of the shell text is the rule that does not
      # need a case-by-case audit.
      - name: Lint pushed commit range
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          zero='0000000000000000000000000000000000000000'

          if [ "$AFTER_SHA" = "$zero" ]; then
            echo "Branch deleted (after = ${zero}); no commits to lint." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          from="$BEFORE_SHA"
          reason=''

          if [ "$BEFORE_SHA" = "$zero" ]; then
            from=''
            reason='branch was created by this push, so there is no previous tip'
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            from=''
            reason="before-SHA ${BEFORE_SHA} is not reachable (force-push or rewritten history)"
          elif [ "$BEFORE_SHA" = "$AFTER_SHA" ]; then
            echo "Push added no new commits (before = after); nothing to lint." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$from" ]; then
            if git rev-parse -q --verify "${AFTER_SHA}^1" >/dev/null; then
              from="${AFTER_SHA}^1"
              echo "Falling back to the tip commit only: ${reason}." \
                | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "Skipping: ${reason}, and ${AFTER_SHA} has no parent (root commit)." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          echo "Linting ${from}..${AFTER_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"
          pnpm exec commitlint --verbose --from "$from" --to "$AFTER_SHA"

      # Manual dispatch has neither a PR nor a push range; lint the checked-out
      # tip so the job still means something when someone runs it by hand.
      - name: Lint HEAD (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec commitlint --verbose --last

  # ── Quality gates ──────────────────────────────────────────────────────────
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Cold Nx cache every run (see docs/migration/mdrs-15-ci-unification.md §3),
    # so this is sized for a full 8-project build, not a cache hit.
    timeout-minutes: 45
    #
    # Deliberately NO postgres service. The backend's inherited pull-request.yaml
    # ran one, but nothing can use it: the 10 Jest suites in the `test` target
    # need no database, and apps/tedrisat/test/helpers/test-app.helper.ts
    # (`test:e2e`, not in this pipeline) starts its *own* Testcontainers
    # postgres:17-alpine and overwrites DB_HOST/DB_PORT/DB_USERNAME/DB_PASSWORD/
    # DB_NAME before AppModule loads — with different credentials
    # (testuser/testpass/tedrisat_test) than the inherited service provided.
    # Carrying it forward would have paid a container pull and health-check on
    # every run for nothing. When MDRS-20 wires e2e in, what it needs is a Docker
    # socket, which ubuntu-latest already has — not a service container.
    steps:
      # fetch-depth: 0 — nx affected needs real history to find a merge base.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sets NX_BASE / NX_HEAD. On a PR that is the merge base with the target
      # branch; on a push to main it is the last successful CI run on main.
      # Pinned to a commit, not a tag: CodeQL's `actions` analysis flagged the
      # floating `@v4` refs on this PR, and a mutable third-party ref is exactly
      # the exposure that got the coverage-comment action dropped (§1). The
      # first-party actions/* and github/codeql-action refs are left on tags, as
      # the 7 deploy workflows have them — changing those is MDRS-16's surface.
      - name: Derive nx affected SHAs
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The six apps/<app>/.env.example files are generated from the root one
      # (MDRS-25). Editing a generated file by hand is the failure mode that
      # scheme is built to prevent, and .env files are git-ignored, so this is
      # the only place the mistake can be caught. Runs before the seeding step
      # below so a stale example never reaches a build.
      - name: Check generated env examples are in sync
        run: pnpm env:check

      # Not optional: apps/nizam and apps/tedris validate env through
      # @t3-oss/env-nextjs at build time, so `nx run-many -t build` fails on a
      # clean checkout with "Invalid environment variables" without this.
      # `env:sync` writes every apps/<app>/.env from the root file, replacing
      # the per-app copy loop the inherited frontend workflow did by hand.
      - name: Seed app env files from the root example
        run: |
          cp .env.example .env
          pnpm env:sync

      # Workspace-root lint + warning ratchet. Covers the 13 root config files
      # that no per-project `lint` target can see, and fails when Biome's
      # warning/info counts grow. See tools/ci/biome-ratchet.mjs for the why.
      - name: Lint workspace root (Biome ratchet)
        run: node tools/ci/biome-ratchet.mjs

      # Proves AC #2 on every PR: a leaf change in one stack must affect exactly
      # its own project. This PR itself cannot demonstrate that (it edits
      # sharedGlobals, so it correctly affects all 16 projects), so the property
      # is asserted here instead of observed once.
      - name: Assert nx affected isolates each stack
        run: node tools/ci/assert-affected-isolation.mjs

      # The five targets are kept identical to the root `affected` script so the
      # local and CI gates cannot drift.
      - name: Verify affected projects
        run: >-
          pnpm exec nx affected
          -t lint typecheck test build module-boundaries

      - name: Report affected projects
        if: always()
        run: |
          echo "NX_BASE=$NX_BASE"
          echo "NX_HEAD=$NX_HEAD"
          echo '--- projects affected by this change ---'
          pnpm exec nx show projects --affected || true

  # ── Security gates ─────────────────────────────────────────────────────────
  # Ported from the backend, where `security-check` existed but was commented
  # out of its pull-request.yaml ("# disabled for now."). Running for real here.
  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One lockfile, so one audit at the root. Fails on any high/critical
      # advisory that is not in audit-ci.json's dated allowlist.
      - name: Audit dependencies
        run: pnpm run audit:ci

      # Unused/missing deps for the three projects that declare the target.
      - name: Check for unused dependencies
        run: pnpm run depcheck
