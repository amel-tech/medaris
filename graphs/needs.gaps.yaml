# The known gaps of every needs.yaml (graphs/README.md, "needs.yaml and the gaps"): the needs the product has not met, and the ones the code has but nothing walks.
#
# Built by script from the 175 needs.yaml files, each parsed with a YAML parser (none failed to parse; every needs.yaml names its own flow id).
# 2640 needs in all: 1264 missing, 545 unwalked, 831 met and not listed. 175 flows have at least one gap, and every key below is the id of a
# flow.yaml in this tree. Neither this file nor a needs.yaml is read by `delurio check`.
#
#   missing   The need has a `missing:` key: no code, or code that does not meet the need (a finding the flow draws). The comment is the
#             need's Linear key, or "no Linear key" where it has none; "code exists in part" where the need also lists `built`; and the
#             finding ids of the flow's ui.yaml `rules` that the need names (graphs/FINDINGS.md).
#   unwalked  The need lists `built` and no e2e check and no replay scenario in `walked`. 360 have no `walked` at all; 185 have only
#             a Vitest spec (`test:`), which draws the markup without a browser and does not walk the app; the comment says which. Why a need
#             is unwalked is in its own `note` in needs.yaml, where the writer gave one. The narrower rule (built, no `walked` at all) would list
#             only the first 360; the writers' own header comments list the unit-spec-only needs as unwalked too, so they are kept here.
#
# Not listed: 730 needs walked by an e2e check, and 101 walked only by a `replay:` entry. A `replay:` entry names a scenario that the
# flow's binding defines (every name resolves to a scenario, checked by script). The walk phase has not run, so no replay has passed them as
# a whole; those needs are met on paper and are the first the walk phase proves. A writer's header comment that calls such a need
# "unwalked" means "not yet replayed"; this file does not list it.
#
# Gender separation is given (kontenjan per gender, gender always required); the needs that decide a seat carry MDRS-284.
# Linear keys by the number of needs they hold: MDRS-284 (37), MDRS-238 (17), MDRS-140 (12), MDRS-246 (11), MDRS-141 (11), MDRS-197 (9),
# MDRS-113 (8), MDRS-239 (8), MDRS-189 (7), MDRS-125 (6), MDRS-295 (4), MDRS-202 (4), MDRS-201 (4), MDRS-240 (4), and 32 more keys with
# one to four each; 1063 missing needs have no key.
#
# It only shrinks: a need that is met leaves the list. Flow writers do not edit it; the orchestrator merges each wave's gaps.

