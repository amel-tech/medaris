# Every need of the flows under graphs/ that is missing (SPEC.md §13): by flow id, the ids of its needs that say `missing`.
# Each need's `missing` in its needs.yaml says why, or where it is tracked: the Linear issue first where there is one, then the
# finding ids of the flow's ui.yaml `rules` (graphs/FINDINGS.md). `delurio check` holds this file to the needs: a missing need that
# is not listed here fails (need-unlisted), and so does an entry whose need is met (gap-met), so the list only shrinks.
#
# 1299 missing needs in 181 flows, of 2764 needs in 182 flows (counted by script from the needs.yaml files, 23 Nov 2026, after
# tedris.course.updateProgress was retired and the unlisted course of MDRS-248 was noted; `check` prints the same 1299 of 2764). 219 name
# a Linear issue first, the most MDRS-284 (35), MDRS-299 (23, what of the online exams is not built yet), MDRS-238 (17), MDRS-140 (12),
# MDRS-141 (11), MDRS-246 (11), MDRS-197 (9), MDRS-239 (8), MDRS-113 (7); 1080 have no Linear issue, 8 of them the unlisted course's
# "not drawn yet": its code and tests exist, and no state or node of the flow draws it.
#
# Not listed here: a need that is met but that no walk covers yet. A met need names its evidence; one whose evidence names no
# `scenario` and no browser e2e test (apps/*/e2e/*.e2e.ts) is walked by nothing. There are 675 (counted by the same script, 23 Nov 2026;
# README.md, under Gaps, gives the number of an earlier count).

