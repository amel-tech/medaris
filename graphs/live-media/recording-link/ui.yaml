# Medaris, captured from origin/main ce47fce8: nazar's Ders kayıtları table and the recording dialog's Bağlantı yapıştır
# tab. The dialog is the kit's Dialog on Base UI: role dialog, named by its title, focus trapped; no initialFocus is
# passed, so the first focusable element takes it, which is the header's close button (Kapat) before the fields.
# Herkese açık is the kit's Switch and the release choice its RadioGroup; this format has neither, so the switch is a
# Button with role switch and the choice a list of radios.
