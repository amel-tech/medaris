# Medaris, captured from origin/main ce47fce8: nazar's Celseler page, the stream button of a row and its inline form.
# A refusal is a toast (Base UI's toast, error tone, kept until closed); the field's problem is the Field's error line,
# which replaces its help and is wired to the input by aria-describedby, not announced as an alert.
