# Medaris, captured from origin/main ce47fce8: nizam's Barındırma hakları page and its two dialogs (the kit's Dialog,
# role dialog, named by its title). The grant dialog passes no initialFocus, so its header's close button takes the
# focus; the withdrawal dialog starts on Vazgeç. Toasts are sonner's: success closes itself, an error stays until closed.
# The settings tabs (links) and the breadcrumb are left out.
