# Medaris, captured from origin/main ce47fce8: tedris's watch page (WatchView). The players are iframes, which this
# format has no component for: a frame is named here by the heading of its card (MediaPlayer, a section labelled by it).
# On a phone the chat or "Soru sor" and "Notlarım" are two toggle buttons (aria-pressed) under the video; wider, both
# panels show and the toggles are hidden. The toggles change no flow state and are left out.
