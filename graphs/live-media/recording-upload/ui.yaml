# Medaris, captured from origin/main ce47fce8: nazar's Ders kayıtları table and the recording dialog's Bunny'ye yükle
# tab. The dialog is the kit's Dialog on Base UI: role dialog, named by its title; no initialFocus is passed, so the
# header's close button (Kapat), the first focusable element, takes the focus. It does not close while bytes go; the
# browser asks before the page is left. The file input, the progress bar (Progress, role progressbar), the tabs and the
# switch have no component of their own in this format and are drawn as the nearest one.
