# The screens of medaris.kc-sign-in: Keycloak's pages as apps/keycloak-theme draws them. Every page sits on AuthCard
# (libs/ui/src/giris/auth-card.tsx:172), a <main> labelled by its one <h1>. No page of this flow sets an initial focus:
# the login form has no autoFocus (libs/ui/src/giris/login-form.tsx:80), so none is written here.
# Gender, firstName, lastName and the privacy box are the realm's profile drawn by apps/keycloak-theme/src/login/profile-fields.tsx.
