invariants:
  - { id: gender-required, rule: "every account of the realm has a gender, FEMALE or MALE; registration without one is refused and an account without one is stopped at Keycloak's VERIFY_PROFILE before any portal", source: "config/keycloak/user-profile.json:36" }
  - { id: gender-from-the-account, rule: "tedrisat's user_profiles.gender is the copy of the token's gender claim; Hesap and the hidden public profile never change it while the token carries one", source: "apps/tedrisat/src/user/user-profile.service.ts:63" }
  - { id: gender-claim-only-from-its-scope, rule: "only the gender client scope puts the claim into a token; the gender mapper is removed from Keycloak's profile scope", source: "config/keycloak/client-scopes/gender.json:10" }
  - { id: pkce-s256, rule: "every portal client requires PKCE S256 and is confidential; the password grant is off", source: "config/keycloak/clients/prod/tedris.json:11" }
  - { id: redirect-uri-exact, rule: "a portal's redirect URI is exactly <origin>/api/auth/callback/keycloak", spec: RFC 6749 §3.1.2.3, source: "config/keycloak/clients/prod/tedris.json:7" }
  - { id: return-to-same-origin, rule: "every return path is a same-origin path that is not an auth route", source: "libs/auth/src/server/return-to.ts:158" }
  - { id: back-channel-with-sid, rule: "each portal client has front-channel logout off and a back-channel URL that carries the sid", spec: OIDC Back-Channel Logout 1.0, source: "config/keycloak/clients/prod/tedris.json:14" }
  - { id: no-token-in-the-browser, rule: "no access, refresh or ID token reaches client JavaScript; GET /api/auth/session gives the user and the expiry only", source: "libs/auth/src/server/routes.ts:434" }
  - { id: platform-access-by-the-engine, rule: "Platform ayarları lets in SYSTEM_ADMIN and a Medaris nazımı holding the code through the authz engine; Pasif kapsamlar asks its own query", source: "apps/tedrisat/src/inactive-scope/inactive-scope.repository.ts:217" }
  - { id: no-self-grant-but-the-chief, rule: "nobody but SYSTEM_ADMIN names themself into more than they hold; on the paths marked always, never", source: "libs/common/src/authz/self-grant.guard.ts:67" }
