# The data and the API of Medaris's köşk and deck area, as tedrisat answers it at ce47fce8 (capture mode).
# Every action is one route of tedrisat with its operationId as the name; `needs` is who passes, read from the route's
# `@Authz` and from the service that decides when the route has none; every element carries the code it rests on.
# Paths are tedrisat's own (no prefix). A refusal's `status` is the HTTP status the error class carries.
schema: delurio-graph/0
kind: domain
id: medaris.kosk-decks
status: proposed
title: Köşks, köşk applications and flashcard decks
summary: >-
  A member applies to open a köşk; Medaris management (the başnazım, or a Medaris nazımı given the permission) answers
  it and opens the köşk with its nazımları. A köşk is shown, hidden or passive; its nazımları appoint ders nazırları in
  its medrese-free courses. Decks are a member's own (private until a reviewer publishes them), a köşk's, a course's
  or a medrese's; a talebe studies a deck in rounds and each rating schedules the card's next review.

entities:
  KoskApplication:
    source: apps/tedrisat/src/database/schema/kosk-application.schema.ts:36
    required: [id, applicantId, name, field, summary, reason, email, status]
    fields:
      id: { type: string, format: uuid }
      applicantId: { type: string, format: uuid, note: "the Keycloak sub, not a foreign key" }
      name: { type: string, maxLength: 120 }
      field: { enum: [ARABIC_LANGUAGE_SCIENCES, RHETORIC, FIQH, USUL_AL_FIQH, HADITH, QURAN_SCIENCES, TAFSIR, AQEEDAH_KALAM, SEERAH, LOGIC, OTHER] }
      summary: { type: string, maxLength: 500 }
      reason: { type: string, maxLength: 3000 }
      email: { type: string, format: email, maxLength: 254, sensitivity: personal, note: "what the applicant typed; the form starts from the account's address" }
      phone: { type: [string, "null"], pattern: "^\\+?[0-9][0-9 ()-]{5,18}[0-9]$", sensitivity: personal }
      status: { enum: [PENDING, APPROVED, REJECTED], default: PENDING }
      decidedBy: { type: [string, "null"], format: uuid }
      decidedAt: { type: [string, "null"], format: date-time }
      rejectReason: { type: [string, "null"] }
      koskId: { type: [string, "null"], format: uuid, note: "the köşk given with the approval; not a foreign key and never compared with the application" }
    lifecycle:
      - "none -> PENDING: createKoskApplication (kosk-apply); nothing limits how many a person files"
      - "PENDING -> APPROVED: approveKoskApplication with any existing köşk's id (kosk-application-review)"
      - "PENDING -> REJECTED: rejectKoskApplication with a reason (kosk-application-review)"

  Kosk:
    source: apps/tedrisat/src/database/schema/kosk.schema.ts:21
    required: [id, ownerId, name, isPrivate]
    fields:
      id: { type: string, format: uuid }
      ownerId: { type: string, format: uuid, note: "who opened it; grants nothing" }
      name: { type: string }
      handle: { type: [string, "null"], unique: case-insensitive }
      description: { type: [string, "null"] }
      field: { type: [string, "null"], note: "the Turkish label, e.g. Tefsir" }
      isPrivate: { type: boolean, default: false, note: "unlisted: in no list, opened by its link by a signed-in caller only" }
      alwaysRequireApproval: { type: boolean, default: false }
      recordingsNeverPublic: { type: boolean, default: false }
      passiveSince: { type: [string, "null"], format: date-time }
      passiveReason: { type: [string, "null"], enum: [DEACTIVATED_BY_ADMIN, null], note: "other reasons are written by the passive-scope module" }
      archivedAt: { type: [string, "null"], format: date-time, note: "hidden while set" }
      archivedBy: { type: [string, "null"], format: uuid }
      archivedLevel: { enum: [platform, kosk, madrasah, course, null] }
    lifecycle:
      - "none -> ACTIVE: createKosk, with its nazımları in the same transaction (kosk-application-review, kosk-lifecycle)"
      - "ACTIVE | PASSIVE -> HIDDEN: hideKosk, at the level the hider acts at (kosk-lifecycle)"
      - "HIDDEN -> ACTIVE | PASSIVE: restoreKosk by the level that hid it or above (kosk-lifecycle)"
      - "ACTIVE | HIDDEN -> PASSIVE(+hidden): deactivateKosk, which takes every held nazım off the post; the API does not refuse a hidden köşk (kosk-lifecycle)"
      - "PASSIVE -> ACTIVE: addKoskNazims (kosk-lifecycle)"
      - "any -> none: deleteKosk, the başnazım's alone (no screen in this area)"

  KoskNazimSeat: # a role_assignments row with role KOSK_NAZIM in the köşk
    source: apps/tedrisat/src/database/role-assignments.ts:109
    key: [userId, koskId]
    fields:
      userId: { type: string, format: uuid }
      koskId: { type: string, references: Kosk }
      grantedBy: { type: string, format: uuid }
      expiresAt: { type: [string, "null"], format: date-time }
      revokedAt: { type: [string, "null"], format: date-time }
    lifecycle:
      - "none -> held: createKosk, addKoskNazims, addKoskManager"
      - "held -> revoked: deactivateKosk (every seat), removeKoskManager"
      - "held -> lapsed: expiresAt passes"

  CourseNazirPost: # a DERS_NAZIR role assignment in a medrese-free course of the köşk, with its permission grants
    source: apps/tedrisat/src/kosk/kosk-grants.repository.ts:271
    fields:
      id: { type: string, format: uuid }
      userId: { type: string, format: uuid }
      courseId: { type: string, format: uuid }
      permissions: { type: array, items: { type: string }, note: "codes of the course catalog, granted with authority KOSK (a köşk nazımı) or PLATFORM (the başnazım)" }
      endsAt: { type: [string, "null"], format: date-time, note: "the post and its permissions end together" }
      grantedBy: { type: string, format: uuid }
    lifecycle:
      - "none -> held: createKoskGrant (kosk-grants)"
      - "held -> held: updateKoskGrant replaces the whole set and the end (kosk-grants)"
      - "held -> revoked: revokeKoskGrant, refused while someone the holder appointed holds a post (kosk-grants)"

  Deck:
    source: apps/tedrisat/src/database/schema/flashcard-deck.schema.ts:21
    required: [id, authorId, title, isPublic, cardType, publishStatus]
    fields:
      id: { type: string, format: uuid }
      authorId: { type: string, format: uuid, note: "the only DECK_OWNER; for a köşk deck the nazım who opened it, for a course deck the staff member who created it" }
      title: { type: string, minLength: 5, maxLength: 100 }
      description: { type: [string, "null"], maxLength: 1000 }
      isPublic: { type: boolean, default: false, note: "true exactly while publishStatus is PUBLISHED" }
      cardType: { enum: [VOCABULARY, HADEETH], note: "fixed at creation" }
      publishStatus: { enum: [PRIVATE, PENDING, PUBLISHED, REJECTED], default: PRIVATE }
      publishRequestedAt: { type: [string, "null"], format: date-time }
      publishDecidedAt: { type: [string, "null"], format: date-time }
      publishDecidedBy: { type: [string, "null"], format: uuid }
      publishRejectReason: { type: [string, "null"] }
      tags: { type: array, items: { type: string, maxLength: 40 }, maxItems: 20, note: "only the author reads them back" }
      courseId: { type: [string, "null"], references: Course, note: "ders destesi" }
      weekId: { type: [string, "null"], note: "the course week a course deck is studied in" }
      courseDraft: { type: boolean, default: false, note: "a course deck the talebe do not see yet" }
      koskId: { type: [string, "null"], references: Kosk, note: "köşk destesi" }
      madrasahId: { type: [string, "null"], note: "medrese destesi; no route of this area writes it" }
      archivedAt: { type: [string, "null"], format: date-time, note: "hidden while set" }
      archivedLevel: { enum: [platform, kosk, madrasah, course, null] }
    lifecycle:
      - "none -> PRIVATE: createFlashcardDeck (a member's own), createKoskDeck (a köşk's), createCourseDeck (a course's)"
      - "PRIVATE | REJECTED -> PENDING: requestFlashcardDeckPublication, by whoever holds deck.manage_private on it"
      - "PENDING -> PRIVATE: withdrawFlashcardDeckPublication"
      - "PENDING -> PUBLISHED: approveDeckPublishRequest (isPublic true)"
      - "PENDING -> REJECTED: rejectDeckPublishRequest"
      - "PUBLISHED | REJECTED -> PRIVATE: withdrawFlashcardDeckPublication (the author's Özele çek)"
      - "PUBLISHED -> PRIVATE: unpublishDeck, the başnazım's alone"
      - "PUBLISHED -> PUBLISHED: updateFlashcardDeck, replaceFlashcardDeck and every card write leave publishStatus as it is"
      - "shown -> hidden: hideKoskDeck for a köşk deck; a hidden public deck stays readable through the public reads"
      - "any -> none: deleteFlashcardDeck (cards and collection rows cascade; progress rows are left behind); deleteCourseDeck for a course deck in draft"

  Flashcard:
    source: apps/tedrisat/src/database/schema/flashcard.schema.ts:20
    fields:
      id: { type: string, format: uuid }
      deckId: { type: string, references: Deck }
      authorId: { type: string, format: uuid, note: "provenance only" }
      type: { enum: [VOCABULARY, HADEETH] }
      contentFront: { type: string }
      contentBack: { type: string }

  FlashcardProgress:
    source: apps/tedrisat/src/database/schema/flashcard.schema.ts:34
    key: [userId, flashcardId]
    fields:
      userId: { type: string, format: uuid }
      flashcardId: { type: string, references: Flashcard }
      status: { enum: [NEW, LEARNING, MASTERED] }
      dueAt: { type: [string, "null"], format: date-time }
      reviewedAt: { type: [string, "null"], format: date-time }
      intervalDays: { type: integer, minimum: 0, maximum: 180 }
    lifecycle:
      - "HARD: LEARNING, due in 1 day; MEDIUM: LEARNING, due in max(3, the last gap) days; EASY: MASTERED, due in max(7, twice the last gap) days, never more than 180 (review-schedule.ts)"
      - "a bare status (no rating): no due time, gap 0"

  DeckCollectionEntry: # decks_users
    source: apps/tedrisat/src/database/schema/flashcard-deck.schema.ts:96
    key: [userId, deckId]
    fields:
      userId: { type: string, format: uuid }
      deckId: { type: string, references: Deck }
      createdAt: { type: string, format: date-time }

  DeckProposal:
    source: apps/tedrisat/src/database/schema/deck-proposal.schema.ts:21
    fields:
      id: { type: string, format: uuid }
      koskId: { type: string, references: Kosk }
      courseId: { type: [string, "null"], note: "the course the müderris teaches in the köşk" }
      proposedBy: { type: string, format: uuid }
      title: { type: string }
      description: { type: [string, "null"] }
      cardType: { enum: [VOCABULARY, HADEETH] }
      status: { enum: [PENDING, ACCEPTED, REJECTED], default: PENDING }
      rejectReason: { type: [string, "null"] }
      deckId: { type: [string, "null"], references: Deck }
    lifecycle:
      - "none -> PENDING: proposeKoskDeck, which no app calls"
      - "PENDING -> ACCEPTED: createKoskDeck with proposalId, in the deck's own transaction; the proposer is not told"
      - "PENDING -> REJECTED: rejectKoskDeckProposal; the proposer is told the reason"

policies:
  - { actor: member, needs: session, do: [createKoskApplication], write: [KoskApplication], source: "apps/tedrisat/src/kosk-application/kosk-application.controller.ts:17" }
  - { actor: application-decider, needs: "the başnazım, or a Medaris nazımı holding platform.kosk_application_decide", do: [listKoskApplications, getKoskApplication, approveKoskApplication, rejectKoskApplication], write: [KoskApplication], source: "apps/tedrisat/src/kosk-application/kosk-application-review.service.ts:88" }
  - { actor: kosk-opener, needs: "the başnazım, or a Medaris nazımı holding platform.kosk_create", do: [createKosk], write: [Kosk, KoskNazimSeat], source: "apps/tedrisat/src/kosk/kosk.controller.ts:309" }
  - { actor: kosk-editor, needs: "a nazım of the köşk (kosk.manage), or platform.kosk_edit, or the başnazım", do: [updateKosk, hideKosk, getKoskOverview, getKoskNazims, getKoskCourseRoster, getKoskDashboard], write: [Kosk], source: "apps/tedrisat/src/kosk/kosk-admin.controller.ts:356" }
  - { actor: platform-kosk-editor, needs: "platform.kosk_edit, or the başnazım", do: [getKoskDeactivationPreview, deactivateKosk], write: [Kosk, KoskNazimSeat], source: "apps/tedrisat/src/kosk/kosk-admin.controller.ts:279" }
  - { actor: nazim-manager, needs: "platform.kosk_nazim_manage, or the başnazım", do: [addKoskNazims, addKoskManager, removeKoskManager], write: [KoskNazimSeat, Kosk], source: "apps/tedrisat/src/kosk/kosk-admin.service.ts:482" }
  - { actor: kosk-nazim, needs: "a held KOSK_NAZIM seat in the köşk (the role, not a permission), or the başnazım", do: [getKoskGrants, createKoskGrant, updateKoskGrant, revokeKoskGrant, getManagedKoskDecks, createKoskDeck, rejectKoskDeckProposal, hideKoskDeck], write: [CourseNazirPost, Deck, DeckProposal], source: "apps/tedrisat/src/deck-review/deck-review.service.ts:350" }
  - { actor: course-muderris, needs: "a MUDERRIS seat in a shown course of the köşk (the role, not deck.propose_kosk)", do: [proposeKoskDeck], write: [DeckProposal], source: "apps/tedrisat/src/deck-review/deck-review.repository.ts:547" }
  - { actor: deck-reviewer, needs: "the başnazım, or a Medaris nazımı holding platform.deck_publish (not on a deck of their own)", do: [listDeckPublishRequests, readDeckPublishRequestCards, approveDeckPublishRequest, rejectDeckPublishRequest], write: [Deck], source: "apps/tedrisat/src/deck-review/deck-review.service.ts:321" }
  - { actor: basnazim, needs: "SYSTEM_ADMIN", do: [unpublishDeck, deleteKosk], write: [Deck, Kosk], source: "apps/tedrisat/src/deck-review/deck-review.service.ts:161" }
  - { actor: deck-owner, needs: "the deck's author (DECK_OWNER), or the staff of the deck's course (deck.manage_course)", do: [updateFlashcardDeck, replaceFlashcardDeck, deleteFlashcardDeck, requestFlashcardDeckPublication, withdrawFlashcardDeckPublication, createFlashcards, createFlashcardsBulk, importsCard], write: [Deck, Flashcard], source: "libs/common/src/authz/effective-permissions.ts:305" }
  - { actor: card-editor, needs: "the deck's author, or a reader of a public or shared deck that the engine then refuses; the course's staff are refused by the card resolver", do: [updateFlashcard, replaceFlashcard, deleteFlashcard], write: [Flashcard], source: "apps/tedrisat/src/flashcard/flashcard.service.ts:86" }
  - { actor: reader, needs: "the author, anyone for a public deck, a talebe ENROLLED or COMPLETED in a published shown course the deck belongs to (or of its köşk or medrese)", do: [getFlashcardDeckById, getFlashcardByDeckId, getFlashcardStudyRound, createFlashcardDeckUser, replaceManyFlashcardProgress], write: [DeckCollectionEntry, FlashcardProgress], source: "apps/tedrisat/src/flashcard/deck-sharing.ts:35" }
  - { actor: visitor, needs: "no token", do: [getFlashcardDeckById, getFlashcardByDeckId, getAllFlashcardDecks, getAllKosks, getKoskFields, getKoskById], source: "apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:231" }
  - { actor: course-staff, needs: "deck.manage_course in the course", do: [getCourseDecksManage, createCourseDeck, updateCourseDeck, deleteCourseDeck], write: [Deck], source: "apps/tedrisat/src/flashcard/course-decks.controller.ts:67" }
  - { actor: course-talebe, needs: "course.view_details in the course (ENROLLED or COMPLETED, not barred)", do: [getCourseDecks], source: "apps/tedrisat/src/flashcard/course-decks.controller.ts:144" }

actions:
  # ---- köşk applications ----
  createKoskApplication:
    route: POST /kosk-applications
    source: apps/tedrisat/src/kosk-application/kosk-application.controller.ts:28
    needs: session
    body: { type: object, required: [name, field, summary, reason, email], properties: { name: { type: string, maxLength: 120 }, field: { type: string }, summary: { type: string, maxLength: 500 }, reason: { type: string, maxLength: 3000 }, email: { type: string, format: email }, phone: { type: [string, "null"] } } }
    result: { returns: KoskApplication, status: 201 }
    sideEffects: ["a PENDING row; nothing is sent to anyone"]
    refusals: { VALIDATION_ERROR: { status: 400 } }
  listKoskApplications:
    route: GET /nizam/kosk-applications
    source: apps/tedrisat/src/kosk-application/nizam-kosk-applications.controller.ts:64
    needs: "session; application-decider"
    query: { type: object, properties: { status: { enum: [PENDING, DECIDED], default: PENDING } } }
    result: { type: object, note: "at most 100 rows, waiting oldest first, answered newest first, both counts, no contact detail" }
    refusals: { AUTHZ_FORBIDDEN: { status: 403, source: "apps/tedrisat/src/platform-access/platform-access.service.ts:46" } }
  getKoskApplication:
    route: GET /nizam/kosk-applications/{id}
    source: apps/tedrisat/src/kosk-application/nizam-kosk-applications.controller.ts:86
    needs: "session; application-decider"
    result: { returns: KoskApplication, note: "with the applicant's e-mail, phone and held roles, and the shown köşks of the same field" }
    sideEffects: ["audit:kosk_application.contact_read, written before the details are returned (kosk-application-review.service.ts:121)"]
    refusals: { AUTHZ_FORBIDDEN: { status: 403 }, KOSK_APPLICATION_NOT_FOUND: { status: 404 } }
  approveKoskApplication:
    route: POST /nizam/kosk-applications/{id}/approve
    source: apps/tedrisat/src/kosk-application/nizam-kosk-applications.controller.ts:104
    needs: "session; application-decider (platform.kosk_application_decide alone; opening the köşk first needs platform.kosk_create)"
    body: { type: object, required: [koskId], properties: { koskId: { type: string, format: uuid } } }
    result: { status: 204 }
    sideEffects: ["audit:kosk_application.approve in the same transaction", "notification KOSK_APPLICATION_RESULT to the applicant; a failed notification is only logged"]
    refusals:
      AUTHZ_FORBIDDEN: { status: 403 }
      KOSK_APPLICATION_NOT_FOUND: { status: 404 }
      KOSK_NOT_FOUND: { status: 404, note: "any existing köşk passes; it is never compared with the application", source: "apps/tedrisat/src/kosk-application/kosk-application-review.service.ts:166" }
      KOSK_APPLICATION_DECIDED: { status: 409, source: "apps/tedrisat/src/kosk-application/kosk-application-review.service.ts:178" }
  rejectKoskApplication:
    route: POST /nizam/kosk-applications/{id}/reject
    source: apps/tedrisat/src/kosk-application/nizam-kosk-applications.controller.ts:124
    needs: "session; application-decider"
    body: { type: object, required: [reason], properties: { reason: { type: string } } }
    result: { status: 204 }
    sideEffects: ["audit:kosk_application.reject", "notification KOSK_APPLICATION_RESULT with the reason"]
    refusals: { AUTHZ_FORBIDDEN: { status: 403 }, KOSK_APPLICATION_NOT_FOUND: { status: 404 }, KOSK_APPLICATION_DECIDED: { status: 409 } }

  # ---- köşks ----
  getAllKosks:
    route: GET /kosks
    source: apps/tedrisat/src/kosk/kosk.controller.ts:154
    needs: "nothing; managedBy=me needs a session"
    result: { type: object, note: "unlisted köşks are in no list but the caller's own managed ones" }
  getKoskFields:
    route: GET /kosks/fields
    source: apps/tedrisat/src/kosk/kosk.controller.ts:196
    result: { type: array, items: { type: string } }
  getFollowedKoskCourses:
    route: GET /kosks/followed/courses
    source: apps/tedrisat/src/kosk/kosk.controller.ts:218
    needs: session
    result: { type: array }
  getKoskById:
    route: GET /kosks/{id}
    source: apps/tedrisat/src/kosk/kosk.controller.ts:261
    needs: "kosk.view; a hidden köşk only for its nazımları, platform.kosk_edit and the başnazım"
    result: { returns: Kosk }
    refusals: { KOSK_NOT_FOUND: { status: 404, note: "also an unlisted köşk to a caller with no token, and a hidden one to anyone else" } }
  getKoskDecks:
    route: GET /kosks/{id}/decks
    source: apps/tedrisat/src/kosk/kosk.controller.ts:281
    needs: "session; the köşk's decks only for a talebe of its courses, a müderris or a nazım of it"
    result: { type: object, properties: { accessible: { type: boolean }, decks: { type: array } }, note: "only the köşk's decks with isPublic true and not hidden (kosk.repository.ts:295)" }
    refusals: { KOSK_NOT_FOUND: { status: 404 } }
  createKosk:
    route: POST /kosks
    source: apps/tedrisat/src/kosk/kosk.controller.ts:310
    needs: "session; kosk-opener"
    body: { type: object, required: [name, managerUserIds], properties: { name: { type: string }, handle: { type: string }, description: { type: string }, isPrivate: { type: boolean }, managerUserIds: { type: array, minItems: 1, items: { type: string, format: uuid } } } }
    result: { returns: Kosk, status: 201 }
    sideEffects: ["a KOSK_NAZIM seat per person, granted by the opener", "audit:kosk.create in the same transaction"]
    refusals:
      AUTHZ_FORBIDDEN: { status: 403 }
      SELF_GRANT_REFUSED: { status: 403, note: "a Medaris nazımı names themselves; the başnazım is not asked", source: "apps/tedrisat/src/kosk/kosk.controller.ts:319" }
      KOSK_HANDLE_TAKEN: { status: 409 }
      KOSK_NAZIM_UNKNOWN_ACCOUNT: { status: 404 }
      VALIDATION_ERROR: { status: 400 }
  updateKosk:
    route: PATCH /kosks/{id}
    source: apps/tedrisat/src/kosk/kosk.controller.ts:340
    needs: "session; kosk-editor"
    result: { returns: Kosk }
    sideEffects: ["audit:kosk.policy_change when a policy changes"]
    refusals: { AUTHZ_FORBIDDEN: { status: 403 }, KOSK_NOT_FOUND: { status: 404 }, KOSK_HANDLE_TAKEN: { status: 409 } }
  deleteKosk:
    route: DELETE /kosks/{id}
    source: apps/tedrisat/src/kosk/kosk.controller.ts:367
    needs: "session; the başnazım (kosk.delete is held by no role or grant)"
    result: { type: boolean }
    sideEffects: ["the köşk with its followers and every course under it, in one transaction, and an audit row"]
    refusals: { AUTHZ_FORBIDDEN: { status: 403 }, KOSK_NOT_FOUND: { status: 404 } }
  addKoskManager:
    route: POST /kosks/{id}/managers/{userId}
    source: apps/tedrisat/src/kosk/kosk.controller.ts:388
    needs: "session; nazim-manager (platform.kosk_nazim_manage); no app calls it"
    result: { returns: Kosk }
    refusals: { AUTHZ_FORBIDDEN: { status: 403 }, SELF_GRANT_REFUSED: { status: 403 }, KOSK_NOT_FOUND: { status: 404 }, KOSK_MANAGER_UNKNOWN_USER: { status: 404 } }
  removeKoskManager:
    route: DELETE /kosks/{id}/managers/{userId}
    source: apps/tedrisat/src/kosk/kosk.controller.ts:435
    needs: "session; nazim-manager; no app calls it"
    query: { type: object, properties: { successorUserId: { type: string, format: uuid } } }
    result: { returns: Kosk }
    refusals: { KOSK_MANAGER_NOT_FOUND: { status: 404 }, KOSK_LAST_MANAGER: { status: 409 }, KOSK_SUCCESSOR_INVALID: { status: 400 }, KOSK_MANAGER_UNKNOWN_USER: { status: 404 } }
  followKosk:
    route: POST /kosks/{id}/follow
    source: apps/tedrisat/src/kosk/kosk.controller.ts:470
    needs: "session; kosk.view"
    result: { type: boolean }
  unfollowKosk:
    route: DELETE /kosks/{id}/follow
    source: apps/tedrisat/src/kosk/kosk.controller.ts:487
    needs: session
