invariants:
  - { id: application-answered-once, rule: "an application moves from PENDING once; a second answer is 409 KOSK_APPLICATION_DECIDED", source: "apps/tedrisat/src/kosk-application/kosk-application-review.repository.ts:202" }
  - { id: contact-read-audited, rule: "the applicant's e-mail and phone are returned only after an audit row is written", source: "apps/tedrisat/src/kosk-application/kosk-application-review.service.ts:121" }
  - { id: kosk-opened-with-nazims, rule: "a köşk is opened with at least one nazım, in the same transaction, and the opener is not one of them unless the başnazım", source: "apps/tedrisat/src/kosk/kosk-admin.repository.ts:422" }
  - { id: restore-by-level, rule: "a hidden köşk is brought back by the level that hid it or above", source: "apps/tedrisat/src/kosk/kosk-admin.repository.ts:513" }
  - { id: deck-born-private, rule: "every route that creates a deck creates it private; approveDeckPublishRequest is the only writer of a public deck", source: "apps/tedrisat/src/flashcard/flashcard-deck.repository.ts:169" }
  - { id: publish-status-in-step, rule: "isPublic is true exactly while publishStatus is PUBLISHED; status writes are guarded on the status read", source: "apps/tedrisat/src/flashcard/flashcard-deck.repository.ts:254" }
  - { id: no-own-publication, rule: "a Medaris nazımı holding platform.deck_publish does not answer the request of his own deck; the başnazım may", source: "apps/tedrisat/src/deck-review/deck-review.service.ts:343" }
  - { id: private-read-audited, rule: "a reviewer's read of a requested deck's cards is written to the audit log first", source: "apps/tedrisat/src/deck-review/deck-review.service.ts:101" }
  - { id: shared-deck-readers, rule: "a deck that is not public is read by its author, by the talebe ENROLLED or COMPLETED in a published shown course it belongs to (directly, or through the course's köşk or medrese), and by the course's staff; nothing in the rule looks at bans or at a hidden köşk", source: "apps/tedrisat/src/flashcard/deck-sharing.ts:35" }
  - { id: schedule, rule: "HARD: 1 day; MEDIUM: max(3, last gap); EASY: max(7, 2 × last gap), at most 180 days", source: "apps/tedrisat/src/flashcard/domain/review-schedule.ts:28" }
  - { id: course-deck-delete-draft, rule: "DELETE /courses/{id}/decks/{deckId} deletes a draft only; DELETE /flashcard/decks/{id} deletes any deck its owner or its course's staff may manage", source: "apps/tedrisat/src/flashcard/course-deck.service.ts:134" }
