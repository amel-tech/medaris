rules:
  - { id: offered-where-it-works, rule: "a control is drawn only for whom the API accepts it (Köşk nazımı ekle is drawn for every viewer of nizam/20)" }
  - { id: no-default-confirm, rule: "no dialog starts its focus on an action with intent confirm" }
