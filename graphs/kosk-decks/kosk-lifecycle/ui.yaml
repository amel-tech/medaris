# The screens of medaris.kosk-lifecycle: nizam /kosks/{id} (management view, nizam/20), /kosks/{id}/ayarlar (nizam/24),
# /kosks (the köşk table, nizam/09) and their dialogs. Base UI dialogs are labelled by their title; an AlertDialog
# starts on Vazgeç. Toasts are Sonner's polite live region, drawn as status nodes.
schema: delurio-graph/0
kind: ui
id: medaris.kosk-lifecycle
flow: medaris.kosk-lifecycle
status: proposed
catalog: catalog/tr.json
locales: [tr, en]
