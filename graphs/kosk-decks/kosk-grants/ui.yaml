# The screens of medaris.kosk-grants: nizam /kosks/{id}/izinler (design nizam/38) and its dialogs. The grant dialog
# sets no initialFocus, so Base UI focuses its first tabbable element, the header's close button. The dismissal is a
# form Dialog whose focus starts on Vazgeç. Toasts are Sonner's polite live region, drawn as status nodes.
