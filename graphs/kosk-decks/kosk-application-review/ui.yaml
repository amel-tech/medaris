# The screens of medaris.kosk-application-review: nizam /talepler/kosk-basvurulari (design nizam/15) with the köşk form
# (nizam/10) and the reasoned refusal. Dialogs are Base UI dialogs (role dialog, labelled by their title). Toasts are
# Sonner's, announced by a polite live region; the format has no toast component, so they are drawn as status nodes.
# A row of the list and the selected application's title show data, not words: their message is the bare value.
