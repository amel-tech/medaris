rules:
  - { id: read-after-choice, rule: "a private deck's cards are read only for a request the reviewer picked (the code reads them for the automatic selection too)" }
  - { id: offered-where-it-works, rule: "Yayımla and Reddet are drawn only where the API accepts them (they are drawn on the reviewer's own deck)" }
