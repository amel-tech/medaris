# The screens of medaris.deck-publish-review: nizam /talepler/deste-yayin-istekleri (design nizam/16) and its two
# reasoned dialogs (Base UI dialogs labelled by their title, the focus on the reason). Toasts are Sonner's polite live
# region, drawn as status nodes. A row's title and the selected deck's title are data, so their message is the value.
