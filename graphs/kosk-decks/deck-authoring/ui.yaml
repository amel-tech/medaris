  deleteTitle: { type: text, component: Heading, role: heading, text: { key: Delete.title }, in: [deleteConfirm, deletingCard] }
  deleteText: { type: text, component: Text, text: { key: Delete.text }, in: [deleteConfirm, deletingCard] } # says the progress is deleted; the rows stay
  deleteCancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: Delete.cancel }, in: [deleteConfirm, deletingCard], disabledIn: [deletingCard], emits: CANCEL, source: "libs/ui/src/mds/alert-dialog.tsx:42" }
