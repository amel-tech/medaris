# The screens of medaris.deck-authoring: tedris /decks/create (design tedris/27) and /decks/{id}/cards (design
# tedris/29) with the card dialog (its focus on the front field), the import dialog and the card's delete alertdialog,
# whose Vazgeç is the kit's default label, Turkish in every locale. Toasts are Base UI toasts.
schema: delurio-graph/0
kind: ui
id: medaris.deck-authoring
flow: medaris.deck-authoring
status: approved
catalog: catalog/tr.json
locales: [tr, en]
samples: { title: "Sarfın temel kelimeleri", count: "2", n: "4", deck: "Sarfın temel kelimeleri" }
changes: { key: Changes.note }

