  importSubmit: { type: action, component: Button, role: button, intent: confirm, text: { key: Cards.import }, in: [importDialog, importing], disabledIn: [importing], emits: SUBMIT, source: "apps/tedris/features/flashcards/components/import-cards-dialog.tsx:114" }

  # a reader of the deck on Kartlar
