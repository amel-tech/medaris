  cardsFailed: { type: alert, component: Alert, role: alertdialog, name: { key: Cards.deleteFailedTitle }, text: { key: Cards.tryAgain }, in: [cardsPage], when: "notice == 'failed'", source: "apps/tedris/features/flashcards/components/deck-cards-page.tsx:62" }

  # the card dialog
  cardDialog: { type: page, component: Page, role: dialog, name: { labelledBy: cardDialogTitle }, in: [addDialog, editDialog, addingCard, updatingCard], initialFocus: frontField, source: "apps/tedris/features/flashcards/components/card-form-dialog.tsx:89" }
  cardDialogTitle: { type: text, component: Heading, role: heading, text: { oneOf: [Cards.addCard, Card.editTitle] }, in: [addDialog, editDialog, addingCard, updatingCard] }
