  forbiddenAction: { type: action, component: LinkButton, role: link, text: { key: Forbidden.deckAction }, in: [notTheirs] }

edges:
  - { labelledBy: [createPage, createTitle] }
  - { labelledBy: [kindGroup, kindLegend] }
  - { labelledBy: [cardsPage, deckTitle] }
  - { labelledBy: [cardDialog, cardDialogTitle] }
  - { labelledBy: [deleteDialog, deleteTitle] }
  - { labelledBy: [importDialog, importTitle] }
  - { triggers: [createSubmit, creating] }
  - { triggers: [cardSave, addingCard] }
  - { triggers: [cardSave, updatingCard] }
  - { triggers: [deleteYes, deletingCard] }
  - { triggers: [importSubmit, importing] }

rules:
  - { id: localized-labels, rule: "every control's name comes from the page's locale (the delete alertdialog's Vazgeç and the dialogs' Kapat do not)" }
  - { id: no-default-confirm, rule: "no dialog starts its focus on an action with intent confirm" }
