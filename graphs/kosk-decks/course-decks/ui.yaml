# The screens of medaris.course-decks: nazar /ders/{dersId}/deste and /ders/{dersId}/deste/{desteId} with their
# dialogs, and the "Ders destesi" tab of tedris /courses/{courseId}. The nazar dialogs set no first focus and pass no
# closeLabel: Base UI focuses the header's close button, named by the kit's default "Kapat". The alertdialogs pass no
# cancelLabel: their Vazgeç is the kit's default. Toasts are Base UI toasts.
schema: delurio-graph/0
kind: ui
id: medaris.course-decks
flow: medaris.course-decks
status: approved
catalog: catalog/tr.json
locales: [tr, en]
samples: { title: "Emsile kelimeleri", decks: "3", cards: "42", students: "18", count: "14", percent: "40" }
changes: { key: Changes.note }

