# The screens of medaris.kosk-decks: nizam /kosks/{id}/desteler (nizam/30), /kosks/{id}/desteler/yeni (nizam/35), the
# refusal and hide dialogs, and /decks/{id}/cards. The deck form sets its focus on the name only when a submit finds
# it empty; the page itself sets no first focus. Toasts are Sonner's polite live region, drawn as status nodes.
