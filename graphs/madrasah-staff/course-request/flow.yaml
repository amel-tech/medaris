# Medaris, captured at origin/main ce47fce8, with #372 (566d3e21) and #373 (d283d5af): a medrese asks a köşk to open
# a course outside the medrese. nazar's "Medrese dışı ders talebi" (/medrese/:id/dersler/talep, nazir/09) writes
# course_requests, the table nizam's "Ders talepleri" (/kosks/:id/ders-talepleri, nizam/39) lists and answers;
# POST /kosks/:id/course-requests writes it too, and no app calls that route. The elements that changed with the two
# fixes point at the lines on main 4b1f9f78, the rest at ce47fce8.
schema: delurio-graph/0
kind: flow
id: medaris.course-request
status: approved
domain: medaris.madrasah-staff
ui: medaris.course-request
title: Ask a köşk for a course outside the medrese
summary: >-
  In nazar the başmüderris, or a nazır given madrasah.offsite_course_request, sends a köşk a suggested course name and
  a reason; the request waits as PENDING in the köşk's Ders talepleri. In nizam a köşk's nazım answers it: "Kabul et"
  opens the köşk's own course form with the request's name and accepts the request with the course it opens, and a
  warning says so when the request was answered elsewhere meanwhile; "Reddet" asks for a reason. A course answers one
  request. nazar lists none of the medrese's requests, so no answer reaches the medrese's screens.

scope:
  shows: both halves as the code has them, nazar's form and nizam's answer, and the table between them
  world: open
  outOfView:
    - "nizam's \"Ders aç\" form of a köşk's own course (its team, schedule and settings): the köşk area"
    - "the köşk list nazar reads (GET /kosks, every listed köşk, 50 a page)"
    - "the Karara bağlanan tab, which only lists"

context:
  via:
    values: [nazarForm, api]
    initial: any
    say: { nazarForm: "the request is sent with nazar's form", api: "the request is sent by calling POST /kosks/:id/course-requests directly" }
  sender:
    values: [basmuderris, nazirGiven, nazirNot]
    initial: any
    say: { basmuderris: "the sender is the medrese's başmüderris", nazirGiven: "the sender is a nazır given madrasah.offsite_course_request", nazirNot: "the sender is a nazır without it" }
  kosks:
    values: [some, none]
    initial: any
    say: { some: "köşks are listed", none: "no köşk is listed" }
  formOk:
    values: [true, false]
    initial: any
    say: { "true": "the köşk, the name and the reason are filled in", "false": "a field is missing or too long" }
  koskLive:
    values: [true, false]
    initial: any
    say: { "true": "the köşk is still there when the request is written", "false": "the köşk was hidden or deleted meanwhile" }
  answerer:
    values: [koskNazim, admin, other]
    initial: any
    say: { koskNazim: "nizam's page is opened by a nazım of the köşk", admin: "by the başnazım", other: "by someone else" }
  stillPending:
    values: [true, false]
    initial: any
    say: { "true": "nobody answers the request meanwhile", "false": "another nazım answers it meanwhile" }
  attempted: { values: [false, true], initial: false }
  notice: { values: [none, kosk, answered, requestLeft], initial: none }
  table: { values: [none, kosk], initial: none } # where the request was written: course_requests, which the köşk reads
  courseTaken: { values: [false, true], initial: false } # the course a direct call accepts with already answers another request
  courseOpened: { values: [false, true], initial: false }
  requestStatus: { values: [none, pending, accepted, rejected, elsewhere], initial: none } # elsewhere: another nazım answered it

guards:
  maySendOffsite: "sender in ['basmuderris', 'nazirGiven']"
  answers: "answerer in ['koskNazim', 'admin']"

effects:
  markAttempted: { set: { attempted: true } }
  fixForm: { set: { formOk: true } }
  koskGone: { set: { notice: kosk, koskLive: true, formOk: false }, havoc: [kosks] }
  writtenKosk: { set: { table: kosk, requestStatus: pending } }
  courseOpened: { set: { courseOpened: true } }
  accepted: { set: { requestStatus: accepted } }
  rejected: { set: { requestStatus: rejected } }
  answeredElsewhere: { set: { notice: answered, requestStatus: elsewhere } }
  requestLeft: { set: { notice: requestLeft, requestStatus: elsewhere } }
  requestLeftUnsure: { set: { notice: requestLeft } } # the request may still wait
  pickCourse: { havoc: [courseTaken] }

failures:
  sendingOffsite: { from: requestOffsiteCourse, kosk: [KOSK_NOT_FOUND] }
  sendingDirect: { from: createCourseRequest, forbidden: [COURSE_REQUEST_FORBIDDEN] }
  rejecting: { from: rejectCourseRequest, settled: [COURSE_REQUEST_NOT_PENDING] }
  accepting: { from: acceptCourseRequest, settled: [COURSE_REQUEST_NOT_PENDING], other: [network, 5xx, COURSE_REQUEST_FORBIDDEN, COURSE_REQUEST_NOT_FOUND] }
  acceptingByCall: { from: acceptCourseRequest, taken: [COURSE_REQUEST_COURSE_TAKEN] }

main:
  given: { via: nazarForm, sender: basmuderris, kosks: some, formOk: true, koskLive: true }
  events: [SUBMIT, DONE]

initial: start
states:
  start:
    title: How the request is sent
    always:
      - { guard: "via == 'nazarForm'", target: offsiteLoading, say: "with nazar's form, the only app that sends one", source: "apps/nazar/features/offsite/actions.ts:16" }
      - { target: sendingDirect, say: "by a direct call that no app makes", source: "apps/tedrisat/src/course-request/course-request.controller.ts:63" }

  offsiteLoading:
    title: Read the köşks and the medrese's own requests
    description: The köşks are open to anyone signed in, so the page asks the medrese's own requests to learn whether it may send.
    source: apps/nazar/features/offsite/components/offsite-page.tsx:38
    always:
      - { guard: "not maySendOffsite", target: offsiteForbidden, say: "the API refuses the medrese's requests (403)", source: "apps/tedrisat/src/madrasah/course/madrasah-course.controller.ts:240" }
      - { guard: "kosks == 'none'", target: offsiteNoKosk, say: "no köşk is listed", source: "apps/nazar/features/offsite/components/offsite-page.tsx:69" }
      - { target: offsiteForm, say: "the form opens with the first köşk chosen", source: "apps/nazar/features/offsite/components/offsite-page.tsx:77" }

  offsiteForbidden:
    type: final
    title: The page says the reader has no permission
    source: apps/nazar/features/shell/components/page-problem.tsx:23

  offsiteNoKosk:
    title: There is no köşk to ask
    by: human
    source: apps/nazar/features/offsite/components/offsite-page.tsx:70
    on:
      BACK: { target: left, say: "they go back to Dersler", source: "apps/nazar/features/offsite/components/offsite-page.tsx:72" }

  offsiteForm:
    title: Write the request
    by: human
    description: The köşk, a suggested name and the reason, and beside them what happens after the request.
    includes: [the köşk, the course name, the reason, "\"Talepten sonra\""]
    source: apps/nazar/features/offsite/components/offsite-form.tsx:33
    on:
      SUBMIT:
        - { guard: "not formOk", target: offsiteForm, effect: [markAttempted], say: "a field is wrong: its problem is written under it, the focus goes to the first, nothing is sent", source: "apps/nazar/features/offsite/components/offsite-form.tsx:61" }
        - { target: sendingOffsite, say: "they press \"Talebi gönder\"", source: "apps/nazar/features/offsite/components/offsite-form.tsx:75" }
      FIX: { guard: "not formOk", target: offsiteForm, effect: [fixForm], say: "they correct the fields" }
      CANCEL: { target: left, say: "they press \"Vazgeç\"", source: "apps/nazar/features/offsite/components/offsite-form.tsx:189" }

  sendingOffsite:
    title: Record the request
    description: >-
      POST /madrasahs/:id/offsite-course-requests: one row in course_requests, PENDING, and the audit row
      course_request.create, in one transaction. No course is made.
    invoke: { action: requestOffsiteCourse }
    source: apps/tedrisat/src/madrasah/course/madrasah-course.repository.ts:390
    on:
      FAIL.kosk: { guard: "not koskLive", target: offsiteForm, effect: [koskGone], say: "404 KOSK_NOT_FOUND: the köşk list is read again", source: "apps/nazar/features/offsite/components/offsite-form.tsx:97" }
      DONE: { guard: koskLive, target: sent, effect: [writtenKosk], say: "the request is written where the köşk reads it", source: "apps/tedrisat/src/madrasah/course/madrasah-course.repository.ts:410" }

  sent:
    title: The request is sent and waits for the köşk
    by: human
    description: >-
      nazar's toast says the request went to the köşk's nazım, and the page goes back to Dersler. The request waits in the
      köşk's Ders talepleri. The medrese's own GET reads it, but nazar uses that only to decide whether the form may be
      drawn and never lists it.
    source: apps/nazar/features/offsite/components/offsite-form.tsx:81
    on:
      KOSK_OPENS: { target: requestsLoading, say: "someone opens the köşk's Ders talepleri in nizam", source: "apps/tedrisat/src/course-request/course-request.repository.ts:114" }
      ACCEPT_BY_CALL: { guard: answers, target: acceptingByCall, effect: [pickCourse], say: "a nazım of the köşk, or the başnazım, accepts it by a direct call with a course of the köşk", source: "apps/tedrisat/src/course-request/course-request.controller.ts:113" }

  sendingDirect:
    title: Record the request in the köşk's table
    description: POST /kosks/:id/course-requests. The service asks for the MEDRESE_BASMUDERRIS role, not a permission, and writes no audit row.
    invoke: { action: createCourseRequest }
    source: apps/tedrisat/src/course-request/course-request.service.ts:88
    on:
      FAIL.forbidden: { guard: "sender != 'basmuderris'", target: directRefused, say: "403 COURSE_REQUEST_FORBIDDEN: only the başmüderris, whatever was granted", source: "apps/tedrisat/src/course-request/course-request.service.ts:99" }
      DONE: { guard: "sender == 'basmuderris'", target: pending, effect: [writtenKosk], say: "201 with the request's id", source: "apps/tedrisat/src/course-request/course-request.repository.ts:198" }

  directRefused:
    type: final
    title: The call is refused
    response: { status: 403, code: COURSE_REQUEST_FORBIDDEN }
    source: apps/tedrisat/src/course-request/course-request.service.ts:100

  pending:
    title: The request waits in the köşk's Bekleyen tab
    description: course_requests, PENDING, oldest first, a hundred at most.
    source: apps/tedrisat/src/course-request/course-request.repository.ts:114
    on:
      KOSK_OPENS: { target: requestsLoading, say: "someone opens the köşk's Ders talepleri in nizam" }
      ACCEPT_BY_CALL: { guard: answers, target: acceptingByCall, effect: [pickCourse], say: "a nazım of the köşk, or the başnazım, accepts it by a direct call with a course of the köşk", source: "apps/tedrisat/src/course-request/course-request.controller.ts:113" }

  acceptingByCall:
    title: Accept the request by a direct call
    description: >-
      POST /course-requests/:id/accept with any course of the köşk, which no app sends but nizam's form right after it
      opens one. A course that already answers another request is refused. The check takes no lock and course_id has no
      unique index, so two calls at the same moment with one course are not covered.
    invoke: { action: acceptCourseRequest }
    source: apps/tedrisat/src/course-request/course-request.service.ts:160
    on:
      FAIL.taken: { guard: courseTaken, target: callRefused, say: "409 COURSE_REQUEST_COURSE_TAKEN: the request still waits", source: "apps/tedrisat/src/course-request/course-request.service.ts:161" }
      DONE: { guard: "not courseTaken", target: acceptedByCall, effect: [accepted], say: "204: the request is accepted with that course", source: "apps/tedrisat/src/course-request/course-request.service.ts:163" }

  callRefused:
    type: final
    title: The call is refused; the request waits
    response: { status: 409, code: COURSE_REQUEST_COURSE_TAKEN }
    source: apps/tedrisat/src/course-request/course-request.service.ts:161

  acceptedByCall:
    type: final
    title: The request is accepted with the course the call named
    response: { status: 204 }
    source: apps/tedrisat/src/course-request/course-request.service.ts:163

  requestsLoading:
    title: Read the waiting requests
    source: apps/nizam/app/kosks/[id]/ders-talepleri/page.tsx:27
    always:
      - { guard: "not answers", target: requestsForbidden, say: "403 COURSE_REQUEST_FORBIDDEN: not a nazım of the köşk", source: "apps/tedrisat/src/course-request/course-request.service.ts:195" }
      - { target: requestsList, say: "the first waiting request is selected", source: "apps/nizam/features/platform-admin/components/course-requests-view.tsx:58" }

  requestsForbidden:
    type: final
    title: nizam's "Bu bölüm için izniniz yok"
    source: apps/nizam/app/kosks/[id]/ders-talepleri/page.tsx:28

  requestsList:
    title: Answer a waiting request
    by: human
    goal: true
    description: The waiting requests on the left; the selected one's köşk, medrese, sender, date and reason on the right.
    source: apps/nizam/features/platform-admin/components/course-requests-view.tsx:169
    on:
      ACCEPT: { guard: "requestStatus == 'pending'", target: courseForm, say: "they press \"Kabul et\"", source: "apps/nizam/features/platform-admin/components/course-requests-view.tsx:234" }
      REJECT: { guard: "requestStatus == 'pending'", target: rejectDialog, say: "they press \"Reddet\"", source: "apps/nizam/features/platform-admin/components/course-requests-view.tsx:238" }
      NAVIGATE: { target: left, say: "they go to another page" }

  rejectDialog:
    title: Write why the request is refused
    by: human
    description: The reason is required; "Reddet" stays off until it is written.
    source: apps/nizam/features/deck-review/components/reject-dialog.tsx:39
    on:
      CONFIRM: { target: rejecting, say: "they write the reason and press \"Reddet\"", source: "apps/nizam/features/deck-review/components/reject-dialog.tsx:70" }
      CANCEL: { target: requestsList, say: "they press \"Vazgeç\"" }

  rejecting:
    title: Refuse the request
    description: POST /course-requests/:id/reject. Only a PENDING row is answered, with the audit row course_request.reject and its reason.
    invoke: { action: rejectCourseRequest }
    source: apps/tedrisat/src/course-request/course-request.repository.ts:206
    on:
      DONE: { guard: stillPending, target: rejected, effect: [rejected], say: "the request leaves the waiting list", source: "apps/nizam/features/platform-admin/components/course-requests-view.tsx:125" }
      FAIL.settled: { guard: "not stillPending", target: requestsList, effect: [answeredElsewhere], say: "409 COURSE_REQUEST_NOT_PENDING: answered meanwhile; the row leaves the list", source: "apps/nizam/features/platform-admin/components/course-requests-view.tsx:118" }

  rejected:
    type: final
    title: The request is refused
    description: >-
      The toast says the reason was passed on to the başmüderris; nazar lists none of the medrese's requests, so nobody
      there sees it.
    source: apps/nizam/features/platform-admin/components/course-requests-view.tsx:125

  courseForm:
    title: Open the köşk's own course from the request
    by: human
    description: nizam's "Ders aç" with the request's name filled in (/kosks/:id/courses/new?talep=…); an answered request leaves the form empty.
    source: apps/nizam/app/kosks/[id]/courses/new/page.tsx:39
    on:
      SUBMIT: { target: creatingCourse, say: "they fill in the course and press \"Dersi aç\"", source: "apps/nizam/features/courses/components/course-create-form.tsx:122" }
      CANCEL: { target: requestsList, say: "they go back" }

  creatingCourse:
    title: Open the course
    description: POST /kosks/:koskId/courses, a köşk course with no medrese (the köşk area).
    invoke: { action: createCourse }
    source: apps/nizam/features/courses/components/course-create-form.tsx:130
    on:
      DONE: { target: accepting, effect: [courseOpened], say: "the course exists" }

  accepting:
    title: Accept the request with the course
    description: >-
      POST /course-requests/:id/accept with the new course's id. The service checks that the course is in the request's
      köşk and answers no other request, which a course just opened never does. The form reads the answer: when the
      request was not accepted, a warning that stays until closed says so; either way the form goes on to plan the
      sessions and says the course was opened.
    invoke: { action: acceptCourseRequest }
    source: apps/nizam/features/courses/components/course-create-form.tsx:164
    on:
      DONE: { guard: stillPending, target: openedFromRequest, effect: [accepted], say: "the request is accepted with the course", source: "apps/tedrisat/src/course-request/course-request.service.ts:163" }
      FAIL.settled: { guard: "not stillPending", target: openedFromRequest, effect: [requestLeft], say: "409 COURSE_REQUEST_NOT_PENDING: a warning says the course is open but the request no longer waits", source: "apps/nizam/features/courses/components/course-create-form.tsx:167" }
      FAIL.other: { target: openedFromRequest, effect: [requestLeftUnsure], say: "any other failure: the same warning, which says the request no longer waits though it may still (MS-19)", source: "apps/nizam/features/courses/components/course-create-form.tsx:166" }

  openedFromRequest:
    type: final
    title: The course is open; the form plans its sessions
    description: A toast says "Ders açıldı" and the page goes to the köşk's Dersler; the warning, when there is one, stays beside it.
    source: apps/nizam/features/courses/components/course-create-form.tsx:190

  left:
    type: final
    title: They leave the page
    leavesPage: true

assertions:
  - { id: only-holders-send-offsite, never: "via == 'nazarForm' and table != 'none' and sender == 'nazirNot'", say: "A nazır without madrasah.offsite_course_request never sends a request", source: "apps/tedrisat/src/madrasah/course/madrasah-course.controller.ts:221" }
  - { id: no-offsite-request-to-a-gone-kosk, never: "via == 'nazarForm' and table != 'none' and not koskLive", say: "nazar's form never records a request for a köşk that is hidden or gone", source: "apps/tedrisat/src/madrasah/course/madrasah-course.repository.ts:407" }
  - { id: nazar-request-reaches-kosk, never: "via == 'nazarForm' and requestStatus != 'none' and table != 'kosk'", say: "A request sent from nazar is written where the köşk's Ders talepleri reads it", source: "apps/tedrisat/src/madrasah/course/madrasah-course.repository.ts:410" }
  - { id: only-the-kosk-answers, never: "requestStatus in ['accepted', 'rejected'] and not answers", say: "Only a nazım of the köşk, or the başnazım, answers a request", source: "apps/tedrisat/src/course-request/course-request.service.ts:186" }
  - { id: answered-once, never: "state in ['rejecting', 'accepting', 'acceptingByCall'] and requestStatus in ['accepted', 'rejected', 'elsewhere']", say: "A request already answered is never answered again", source: "apps/tedrisat/src/course-request/course-request.repository.ts:229" }
  - { id: not-accepted-is-said, never: "state == 'openedFromRequest' and requestStatus != 'accepted' and notice != 'requestLeft'", say: "When the request was not accepted, the nazım reads so beside \"Ders açıldı\"", source: "apps/nizam/features/courses/components/course-create-form.tsx:167" }
  - { id: course-answers-one-request, never: "requestStatus == 'accepted' and courseTaken", say: "A course that already answers a request is not given to another (calls one after the other; two at the same moment are not covered)", source: "apps/tedrisat/src/course-request/course-request.service.ts:160" }
  - { id: invalid-form-sends-nothing, never: "state == 'sendingOffsite' and not formOk", say: "A form with a missing or wrong field sends nothing", source: "apps/nazar/features/offsite/components/offsite-form.tsx:61" }
