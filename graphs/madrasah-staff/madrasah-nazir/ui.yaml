  grantsFailedTitle: { type: alert, component: Alert, role: alert, text: { key: Dismiss.loadFailedTitle }, in: [grantsFailed], source: "apps/nazar/features/nazirs/components/dismiss-dialog.tsx:174" }
  grantsFailedText: { type: text, component: Text, text: { key: Dismiss.loadFailed }, in: [grantsFailed] }
  retry: { type: action, component: Button, role: button, intent: secondary, text: { key: Shell.retry }, in: [grantsFailed], emits: RETRY, source: "apps/nazar/features/nazirs/components/dismiss-dialog.tsx:176" }
  dismissIntro: { type: text, component: Text, text: { key: Dismiss.intro }, in: [dismissDialog, dismissing], when: "given == 'some'", source: "apps/nazar/features/nazirs/components/dismiss-dialog.tsx:183" }
  dismissIntroNone: { type: text, component: Text, text: { key: Dismiss.introNone }, in: [dismissDialog, dismissing], when: "given == 'none'", source: "apps/nazar/features/nazirs/components/dismiss-dialog.tsx:183" }
