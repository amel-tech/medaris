  appointIntro: { type: text, component: Text, text: { key: Appoint.intro }, in: [appointDialog, searching, picked, appointing], source: "apps/nazar/features/nazirs/components/appoint-nazir.tsx:160" }
  emailField: { type: field, component: TextField, role: textbox, text: { key: Appoint.label }, in: [appointDialog, searching], disabledIn: [searching], emits: SEARCH, source: "apps/nazar/features/nazirs/components/appoint-nazir.tsx:204" } # type="email"; Enter searches
  emailHelp: { type: text, component: Text, text: { key: Appoint.help }, in: [appointDialog, searching] }
  notFound: { type: text, component: Text, text: { key: Appoint.notFound }, in: [appointDialog], when: "notice == 'notFound'", source: "apps/nazar/features/nazirs/components/appoint-nazir.tsx:121" }
  lookupFailed: { type: text, component: Text, text: { key: Appoint.failed }, in: [appointDialog], when: "notice == 'lookupFailed'", source: "apps/nazar/features/nazirs/components/appoint-nazir.tsx:123" }
  searchingNote: { type: status, component: Status, role: status, text: { key: Appoint.searching }, in: [searching], source: "apps/nazar/features/nazirs/components/appoint-nazir.tsx:227" }
  chosenTitle: { type: text, component: Heading, role: heading, text: { key: Appoint.chosenTitle }, in: [picked, appointing], source: "apps/nazar/features/nazirs/components/appoint-nazir.tsx:167" }
  unpick: { type: action, component: Button, role: button, intent: secondary, name: { key: Appoint.remove }, in: [picked, appointing], disabledIn: [appointing], emits: UNPICK, source: "apps/nazar/features/nazirs/components/appoint-nazir.tsx:182" } # an icon button, named only by aria-label
  already: { type: status, component: Status, role: status, text: { key: Appoint.already }, in: [picked], when: "target == 'nazir'", source: "apps/nazar/features/nazirs/components/appoint-nazir.tsx:192" }
  appointFailed: { type: alert, component: Alert, role: alert, text: { key: Appoint.failedTitle }, in: [picked], when: "notice == 'selfGrant'", source: "apps/nazar/features/nazirs/components/appoint-nazir.tsx:110" } # a toast
  appointFailedSelf: { type: text, component: Text, text: { key: Problems.selfGrant }, in: [picked], when: "notice == 'selfGrant'" }
  appointCancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: Appoint.cancel }, in: [appointDialog, searching, picked, appointing], emits: CANCEL, source: "apps/nazar/features/nazirs/components/appoint-nazir.tsx:149" }
  appointSubmit: { type: action, component: Button, role: button, intent: confirm, text: { key: Appoint.submit }, in: [appointDialog, searching, picked, appointing], disabledIn: [appointDialog, searching, appointing], emits: SUBMIT, source: "apps/nazar/features/nazirs/components/appoint-nazir.tsx:150" } # off until someone not yet a nazır is chosen

  # Görevden al
