  forbiddenText: { type: text, component: Text, text: { key: Problems.forbidden }, in: [forbidden] }
  appoint: { type: action, component: Button, role: button, intent: secondary, text: { key: Nazirs.appoint }, in: [roster, editing, readingGrants], disabledIn: [editing, readingGrants], emits: APPOINT, source: "apps/nazar/features/nazirs/components/appoint-nazir.tsx:128" }
  appointedToast: { type: status, component: Status, role: status, text: { key: Appoint.appointed }, in: [roster], when: "notice == 'appointed'", source: "apps/nazar/features/nazirs/components/appoint-nazir.tsx:101" }
  appointedBody: { type: text, component: Text, text: { key: Appoint.appointedBody }, in: [roster], when: "notice == 'appointed'" }
  dismissedToast: { type: status, component: Status, role: status, text: { key: Dismiss.dismissed }, in: [roster], when: "notice == 'dismissed'", source: "apps/nazar/features/nazirs/components/dismiss-dialog.tsx:120" }
  dismissedBody: { type: text, component: Text, text: { key: Dismiss.dismissedBody }, in: [roster], when: "notice == 'dismissed'" }
  caption: { type: text, component: Text, text: { key: Nazirs.caption }, in: [roster, editing, readingGrants], source: "apps/nazar/features/nazirs/components/nazirs-table.tsx:184" }
  rows: { type: list, component: List, role: table, name: { labelledBy: caption }, in: [roster, editing, readingGrants], source: "apps/nazar/features/nazirs/components/nazirs-table.tsx:183" }
  row: { type: text, component: ListItem, role: row, text: { key: Nazirs.appointedBy }, repeat: madrasah.nazirs, in: [roster, editing, readingGrants] } # the nazır's name, address, groups, end and giver
  givePermission: { type: action, component: Button, role: button, intent: secondary, name: { key: Nazirs.givePermissionLabel }, text: { key: Nazirs.givePermission }, repeat: madrasah.nazirs, in: [roster], when: manages, emits: EDIT, source: "apps/nazar/features/nazirs/components/nazirs-table.tsx:148" } # "İzinleri düzenle" once the nazır holds something
  dismiss: { type: action, component: Button, role: button, intent: secondary, name: { key: Nazirs.dismissLabel }, text: { key: Nazirs.dismiss }, repeat: madrasah.nazirs, in: [roster], when: mayDismissHere, emits: DISMISS, source: "apps/nazar/features/nazirs/components/nazirs-table.tsx:167" }

  # Medrese nazırı ata
  appointDialog: { type: page, component: Page, role: dialog, name: { labelledBy: appointTitle }, in: [appointDialog, searching, picked, appointing], initialFocus: emailField, source: "apps/nazar/features/nazirs/components/appoint-nazir.tsx:146" }
