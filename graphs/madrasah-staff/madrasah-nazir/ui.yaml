  takeOver: { type: action, component: Button, role: button, intent: secondary, text: { key: Dismiss.takeOver }, repeat: nazir.given, in: [dismissDialog, dismissing], when: "given == 'some'", disabledIn: [dismissing], emits: TAKE_OVER, source: "apps/nazar/features/nazirs/components/dismiss-dialog.tsx:256" }
  drop: { type: action, component: Button, role: button, intent: secondary, text: { key: Dismiss.drop }, repeat: nazir.given, in: [dismissDialog, dismissing], when: "given == 'some'", disabledIn: [dismissing], emits: DROP, source: "apps/nazar/features/nazirs/components/dismiss-dialog.tsx:257" }
  answersNote: { type: text, component: Text, text: { key: Dismiss.answersNote }, in: [dismissDialog, dismissing], when: "given == 'some'", source: "apps/nazar/features/nazirs/components/dismiss-dialog.tsx:264" }
