  dismissSubmit: { type: action, component: Button, role: button, intent: confirm, text: { key: Dismiss.submit }, in: [grantsFailed, dismissDialog, dismissing], disabledIn: [grantsFailed, dismissing], emits: SUBMIT, source: "apps/nazar/features/nazirs/components/dismiss-dialog.tsx:161" } # off until every row has an answer

edges:
  - { labelledBy: [page, title] }
  - { labelledBy: [rows, caption] }
  - { labelledBy: [appointDialog, appointTitle] }
  - { labelledBy: [dismissDialog, dismissTitle] }
  - { triggers: [appointSubmit, appointing] }
  - { triggers: [dismissSubmit, dismissing] }
  - { triggers: [givePermission, editing] }

rules:
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3)" }
  - { id: no-default-dismiss, rule: "the dismissal dialog opens with the focus on \"Vazgeç\", never on \"Görevden al\"" }
  - { id: search-not-per-key, rule: "the e-mail search runs on Enter or when the field is left, never per key: each search is written to the audit log" }
