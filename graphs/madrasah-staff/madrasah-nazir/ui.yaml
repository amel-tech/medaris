  gateNote: { type: text, component: Text, text: { key: Dismiss.gateNote }, in: [dismissDialog, dismissing], when: "given == 'some'", source: "apps/nazar/features/nazirs/components/dismiss-dialog.tsx:157" }
  dismissFailed: { type: alert, component: Alert, role: alert, text: { key: Dismiss.failedTitle }, in: [dismissDialog, readingGrants], when: "notice in ['selfGrant', 'cascade', 'notYours', 'changed']", source: "apps/nazar/features/nazirs/components/dismiss-dialog.tsx:129" } # a toast
