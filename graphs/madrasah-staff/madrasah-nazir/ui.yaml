# The screens of medaris.madrasah-nazir: nazar's "Medrese nazırları" (/medrese/:id/nazirlar), its "Medrese nazırı ata"
# dialog and its "Görevden al" dialog. Both dialogs are form dialogs the scrim does not close (libs/ui/src/mds/dialog.tsx:71).
# The Devral/Düşür answer of each person is a toggle group of two chips (aria-pressed), drawn here as two buttons.
schema: delurio-graph/0
kind: ui
id: medaris.madrasah-nazir
flow: medaris.madrasah-nazir
status: proposed
catalog: catalog/tr.json
locales: [tr, en]
samples: { name: "Ahmet Yılmaz", person: "Zeynep Kaya", what: "Talebe işleri grubu", date: "12 Ekim 2026" }
changes: { key: Changes.note }

nodes:
  # the roster
  page: { type: page, component: Page, role: main, name: { labelledBy: title }, in: [loading, forbidden, roster, editing, readingGrants], source: "apps/nazar/features/nazirs/components/nazirs-page.tsx:53" }
  title: { type: text, component: Heading, role: heading, text: { key: Nazirs.title }, in: [loading, forbidden, roster, editing, readingGrants], source: "apps/nazar/features/nazirs/components/nazirs-page.tsx:57" }
  intro: { type: text, component: Text, text: { key: Nazirs.intro }, in: [loading, forbidden, roster, editing, readingGrants] }
