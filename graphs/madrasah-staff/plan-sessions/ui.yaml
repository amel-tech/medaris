# The screen of medaris.plan-sessions: nazar's "Celse planla" (/ders/:id/celseler/planla). The portal shell owns <main>;
# the page sets no first focus. The choice of single or weekly and the days are toggle chips (aria-pressed); the preview
# is an aside labelled by its heading. A field's problem is a plain line under it, the days' one is role="alert".
