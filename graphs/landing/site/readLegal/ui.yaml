rules:
  - id: L10
    rule: >-
      The terms promise an acceptance at sign-in that nothing does. Three sentences of the terms page say so: the lead
      "Girişte gördüğünüz şartların özeti, bu metnin kısa hâlidir" (kullanim-sartlari/page.tsx:27), section 2 "Giriş,
      bu şartların kabul edilmesiyle tamamlanır; kabul tarihi hesapta saklanır" (:224-225) and section 10 "Esaslı bir
      değişiklikte girişte şartların yeniden kabul edilmesi istenebilir" (:482-484). What the repository does:
      config/keycloak provisions no terms step (grep finds none); docs/migration/mdrs-102-privacy-notice.md:73-75 says the
      terms-and-conditions required action "stays off"; the registration form of the theme draws a terms checkbox only
      when Keycloak sends `termsAcceptanceRequired` (apps/keycloak-theme/src/login/pages/Register.tsx:131), which it
      does only when the registration flow has the terms step; the only box at registration is `privacyNoticeRead`
      (the privacy notice, stored as "yes" with no date); nothing in tedrisat stores an acceptance of the terms.
      Measured on 15 Nov 2026 on the local stack's realm "medaris", provisioned from config/keycloak: the required action
      TERMS_AND_CONDITIONS is enabled=false and the registration form's "Terms and conditions" execution is DISABLED.
      The live realms were not checked. The work is MDRS-191 (Backlog). Fix: build the acceptance and its date, or
      reword the three sentences to say what happens (see decision D1).
  - id: L15
    rule: >-
      The two draft notes depend on NODE_ENV: `IS_DRAFT = process.env.NODE_ENV !== "production"`
      (content/aydinlatma-metni.ts:35). A development server shows a "Taslak — hukuk onayı bekliyor" note (role=note) at
      the top of the terms (kullanim-sartlari/page.tsx:36-48) and a "Bu metin taslaktır ..." note (role=note) under the
      date of the notice (aydinlatma-metni/page.tsx:30-35); a production build shows neither. This graph draws the
      production build, so the notes are not drawn, and a replay on the dev server sees them without failing. A walk on a
      production build was not made. Fix: none needed in the code; walk a production build before approving the graph.
  - id: L5
    rule: >-
      The footer's "GitHub" opens a new tab (target=_blank) with no visible or spoken note that it does
      (components/site-footer.tsx:32-39). On a legal page the visitor who follows it finds themselves in another tab with
      the page still open behind it. Fix: a visually hidden "(yeni sekmede açılır)" in the link.
  - id: L12
    rule: >-
      The pages have no message catalog: every word is a Turkish literal in the page files and in content/*.ts, and
      <html lang="tr"> is fixed (app/[locale]/layout.tsx:41-47, app/aydinlatma-metni/layout.tsx:19-25). The catalog of this
      graph is made from those literals; a second language would need every page changed (a launch decision, lib/i18n/routing.ts:3-5).
  - id: LEGAL-1
    rule: >-
      The cookies page lists a cookie that nothing writes. The row `medaris-locale` ("Dil menüsünde seçtiğiniz dili
      hatırlar; Tedris, Nizam ve Nazar sonraki ziyaretinizde doğrudan o dilde açılır", content/cerezler.ts:120-125) describes
      the language menu, which is gone: libs/ui/src/lib/locale-preference.ts:11-12 says "Nothing writes it while the apps
      are Turkish only (the language menu is gone)", and a grep of apps and libs finds only readers of the cookie.
      content/cerezler.ts:14-15 says a cookie that no code sets is not listed. Fix: take the row out until the menu
      returns (MDRS-295 draws it again).
  - id: LEGAL-2
    rule: >-
      The row `NEXT_LOCALE` ("Sayfaların dilini hatırlar", set by "Tedris ve Nizam", until the browser is closed,
      content/cerezler.ts:127-131) is attributed to the wrong apps. Tedris and Nizam run no next-intl middleware (apps/tedris/proxy.ts
      is its own; a grep for NEXT_LOCALE in apps and libs, tests apart, finds only this row), and on the local stack
      GET /discover of Tedris and GET / of Nizam answer no Set-Cookie. Landing's own middleware (apps/landing/middleware.ts)
      does set `NEXT_LOCALE=tr; Path=/; SameSite=lax` (a session cookie), measured on /, /kullanim-sartlari and /cerezler of
      the stack; it does not on /aydinlatma-metni, which the matcher excludes. The page names landing nowhere as a setter.
      Fix: name the site's own pages as the setter (and the pages that do), and take Tedris and Nizam out.
  - id: LEGAL-3
    rule: >-
      Terms section 8 describes a device restriction that is not built (MDRS-125, Backlog; grep for device in
      apps/tedrisat/src finds nothing, and content/cerezler.ts:14-15 says the device cookie is not built). Its first
      paragraph says "Bu çerez henüz kullanılmıyor" (kullanim-sartlari/page.tsx:419-427), but the four items under it
      (:429-447) are written as rules in force: "Kısıtlanan cihazdan ... kayıt başvurusu yapılamaz ... cihazdan hiçbir
      sayfa kullanılamaz", "Kısıtlı cihazda ... kısa bir ileti gösterilir", "... cihaz kısıtlaması da kendiliğinden kalkar".
      Fix: say once, at the head of the section and in the contents entry, that this is not in force yet, or leave the
      section out until MDRS-125 is built.
  - id: focus-not-set
    rule: >-
      No page sets an initial focus and no <main> is labelled: the focus starts at the start of the document on each of the
      three pages, and a contents link of the terms leaves the focus on itself while the browser scrolls the section into
      view. The sections are regions with names, but no link or heading is made focusable to receive the focus (the inventory
      notes the same for the home page, L8). Fix: none required by the format; a skip link to the content would help.
