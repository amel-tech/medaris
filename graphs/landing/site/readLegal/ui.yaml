# The screens of landing.site.readLegal: the three legal pages of the public site at the wide layout (768 px and up), the
# production build, each with the footer it wears. The header (the logo, the theme toggle, "Giriş yap", "Kayıt ol") is the
# navigation graph's frame (landing.nav, frame site), not drawn here.
#
# Words. Landing has no i18n file: every word is a Turkish literal in the three pages, in components/site-footer.tsx or in
# apps/landing/content/{cerezler,aydinlatma-metni}.ts. Each value of catalog/tr.json is copied from that literal (the
# source of the node that uses it names the line) and was checked to be the whole text of one element of the page the
# local dev server renders; the keys are the writer's: Terms.*, Cookies.*, Privacy.*, Link.* and Footer.nav. The keys that
# are NOT one literal but a text the code puts together are `composed.*`:
#   composed.Terms.dates                   terms page.tsx:29-31 ("Son güncelleme: <time>15 Ekim 2026</time> · Yürürlük tarihi: " and
#                                          legal.termsEffectiveDate, content/legal.ts:189)
#   composed.Cookies.required.1.lifetime,  content/cerezler.ts:62 and :82: a template literal over sessionCookieMax and
#   composed.Cookies.required.4.lifetime   sessionEnds (:33), which are built from sessionIdle, sessionMax, rememberIdle and rememberMax (:21-24)
#   composed.Privacy.updated               privacy page.tsx:28 ("Son güncelleme: " and LAST_UPDATED, content/aydinlatma-metni.ts:39)
#   composed.Privacy.recordFields          content/aydinlatma-metni.ts:91: the closing of section 2, over ACCOUNT_RECORD_FIELDS (:47-58)
#   composed.Privacy.apply                 content/aydinlatma-metni.ts:171: the first paragraph of section 7, over CONTROLLER.email (:30)
# The flow writes nothing, so there is no `changes` key.
#
# What is drawn of each page: its landmarks, its headings, the dates, the controls (the contents links, the inline links
# that go to another page, the footer), every row of the three cookie tables, and the statements that a spec of
# apps/landing/test reads or that a finding below is about. The rest of the prose is not drawn (flow.yaml, scope).
#
# Repeated nodes. The eleven contents links and the eleven headings of the terms, the seven headings of the notice and the
# rows of the cookie tables are `repeat` nodes whose words are `oneOf` their texts; the replay finds a `oneOf` node by its
# first text only, so the binding gives each one a pattern of all of them and the count of items (binding.yaml, nodes).
schema: delurio-graph/0
kind: ui
id: landing.site.readLegal
flow: landing.site.readLegal
status: captured
catalog: catalog/tr.json
locales: [tr]

# No `initialFocus` and no `focus`: none of the three pages moves the focus when it opens, and none of its links moves it
