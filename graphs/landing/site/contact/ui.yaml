# The screens of landing.site.contact: the page /iletisim at the wide layout (768 px and up), main only. The header and
# the footer are the navigation graph's frame (landing.nav, frame site), not drawn here. The words are Turkish literals
# in apps/landing (landing has no i18n catalog); each key of catalog/tr.json is copied letter for letter from the literal
# that the `source` of the node that uses it names. The one key with no literal is Changes.note: it is written from the
# code (what the send does and what a visitor cannot undo) because the format asks every flow that writes to have one.
schema: delurio-graph/0
kind: ui
id: landing.site.contact
flow: landing.site.contact
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples: { address: selam@medaris.app }
changes: { key: Changes.note }

# The focus after a step: the first field that failed (the page calls .focus() on it, contact-form.tsx:44); and the
# button the visitor pressed, while it sends and when the server says no (the page moves nothing). After the send the
# page puts the focus nowhere (L1), so `sent` has none; and it sets none when it opens, so there is no `initialFocus`.
focus:
  formInvalid: nameField
  sending: send
  formFailed: send

nodes:
  # ---- the page, in every state ----
  page: { type: page, component: Page, role: main, in: [formPage, formInvalid, sending, formFailed, sent], source: "apps/landing/app/[locale]/iletisim/page.tsx:22" }
  title: { type: text, component: Heading, role: heading, text: { key: Page.title }, in: [formPage, formInvalid, sending, formFailed, sent], source: "apps/landing/app/[locale]/iletisim/page.tsx:25" }
  intro: { type: text, component: Text, text: { key: Page.intro }, in: [formPage, formInvalid, sending, formFailed, sent], source: "apps/landing/app/[locale]/iletisim/page.tsx:26" }

  # ---- the form: four states; `sent` replaces all of it ----
  form: { type: page, component: Page, role: form, name: { labelledBy: formTitle }, in: [formPage, formInvalid, sending, formFailed], source: apps/landing/components/contact-form.tsx:101 }
  formTitle: { type: text, component: Heading, role: heading, text: { key: Form.title }, in: [formPage, formInvalid, sending, formFailed], source: apps/landing/components/contact-form.tsx:109 }
  failedAlert: { type: alert, component: Alert, role: alert, text: { key: Banner.title }, in: [formFailed], source: apps/landing/components/contact-form.tsx:114 } # one banner for 400, 429, 502, 503 and no answer (L3); the focus does not go to it
  failedText: { type: text, component: Text, text: { key: Banner.text, params: { address: address } }, in: [formFailed], source: apps/landing/components/contact-form.tsx:118 }
  failedMail: { type: action, component: LinkButton, role: link, text: { key: Contact.address }, in: [formFailed], source: apps/landing/components/contact-form.tsx:119 } # mailto:, inside the banner
  required: { type: text, component: Text, text: { key: Form.required }, in: [formPage, formInvalid, sending, formFailed], source: apps/landing/components/contact-form.tsx:124 }

  nameField: { type: field, component: TextField, role: textbox, text: { key: Form.name }, value: { literal: "" }, in: [formPage, formInvalid, sending, formFailed], source: apps/landing/components/contact-form.tsx:133 } # aria-invalid and aria-describedby the line below it in formInvalid
  nameError: { type: text, component: Text, text: { key: Error.name }, in: [formInvalid], source: apps/landing/components/contact-form.tsx:68 } # span.mds-error, no role (L2: it stays after the field is fixed)
  emailField: { type: field, component: TextField, role: textbox, text: { key: Form.email }, value: { literal: "" }, in: [formPage, formInvalid, sending, formFailed], source: apps/landing/components/contact-form.tsx:153 } # type=email, placeholder adiniz@example.com
  emailHint: { type: text, component: Text, text: { key: Form.emailHint }, in: [formPage, sending, formFailed], source: apps/landing/components/contact-form.tsx:170 } # the field's description while it is valid; its error line replaces it
  emailError: { type: text, component: Text, text: { key: Error.email }, in: [formInvalid], source: apps/landing/components/contact-form.tsx:68 }
  topicField: { type: field, component: TextField, role: combobox, text: { key: Form.topic }, in: [formPage, formInvalid, sending, formFailed], source: apps/landing/components/contact-form.tsx:184 } # a native select; its first option, "Seçin", is hidden and disabled and nothing else is selected
  topicChoices: { type: list, component: List, role: listbox, name: { labelledBy: topicField }, in: [formPage, formInvalid, sending, formFailed], source: apps/landing/components/contact-form.tsx:197 }
  topicChoice: { type: text, component: ListItem, role: option, text: { oneOf: [Topic.genel, Topic.hesap, Topic.ders, Topic.kvkk, Topic.dersVermek, Topic.diger] }, in: [formPage, formInvalid, sending, formFailed], source: apps/landing/lib/contact.ts:8 } # six options, in this order; the server accepts only these
  topicError: { type: text, component: Text, text: { key: Error.topic }, in: [formInvalid], source: apps/landing/components/contact-form.tsx:68 }
  messageField: { type: field, component: TextField, role: textbox, text: { key: Form.message }, value: { literal: "" }, in: [formPage, formInvalid, sending, formFailed], source: apps/landing/components/contact-form.tsx:213 } # a textarea of 6 rows, no maxLength (the server cuts at 5000)
  messageError: { type: text, component: Text, text: { key: Error.message }, in: [formInvalid], source: apps/landing/components/contact-form.tsx:68 }

  privacyNote: { type: text, component: Text, text: { key: Form.privacy }, in: [formPage, formInvalid, sending, formFailed], source: apps/landing/components/contact-form.tsx:226 }
  privacyLink: { type: action, component: LinkButton, role: link, text: { key: Form.privacyLink }, in: [formPage, formInvalid, sending, formFailed], source: apps/landing/components/contact-form.tsx:229 }
  send: { type: action, component: Button, role: button, intent: confirm, text: { key: Form.send }, in: [formPage, formInvalid, sending, formFailed], disabledIn: [sending], emits: SUBMIT, source: apps/landing/components/contact-form.tsx:232 } # aria-disabled and aria-busy while it sends, never disabled; a second press is ignored in code
  sendingStatus: { type: status, component: Status, role: status, text: { key: Form.sending }, in: [sending], source: apps/landing/components/contact-form.tsx:242 } # always mounted, empty except while it sends

  # ---- the card that replaces the form ----
  sentAlert: { type: status, component: Alert, role: status, text: { key: Sent.title }, in: [sent], source: apps/landing/components/contact-form.tsx:77 } # mounted already holding its text (L1)
  sentText: { type: text, component: Text, text: { key: Sent.text }, in: [sent], source: apps/landing/components/contact-form.tsx:81 }
  sentHome: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Sent.home }, in: [sent], emits: HOME, source: apps/landing/components/contact-form.tsx:85 }
  sentFaq: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Sent.faq }, in: [sent], emits: FAQ, source: apps/landing/components/contact-form.tsx:91 }

  # ---- the side cards, beside the form or the card, in every state ----
  infoTitle: { type: text, component: Heading, role: heading, text: { key: Side.infoTitle }, in: [formPage, formInvalid, sending, formFailed, sent], source: "apps/landing/app/[locale]/iletisim/page.tsx:39" }
  infoMail: { type: action, component: LinkButton, role: link, text: { key: Contact.address }, in: [formPage, formInvalid, sending, formFailed, sent], source: "apps/landing/app/[locale]/iletisim/page.tsx:44" } # mailto:
  faqTitle: { type: text, component: Heading, role: heading, text: { key: Side.faqTitle }, in: [formPage, formInvalid, sending, formFailed, sent], source: "apps/landing/app/[locale]/iletisim/page.tsx:57" }
  faqText: { type: text, component: Text, text: { key: Side.faqText }, in: [formPage, formInvalid, sending, formFailed, sent], source: "apps/landing/app/[locale]/iletisim/page.tsx:59" }
  faqLink: { type: action, component: LinkButton, role: link, text: { key: Side.faqLink }, in: [formPage, formInvalid, sending, formFailed, sent], source: "apps/landing/app/[locale]/iletisim/page.tsx:63" }

edges:
  - { labelledBy: [form, formTitle] }
  - { triggers: [send, sending] }
  - { triggers: [sentHome, home_opened] }
  - { triggers: [sentFaq, faq_opened] }

rules:
  - { id: L1, rule: "After a send the form is unmounted: the focused \"Gönder\" disappears and the focus falls to the document, and the success alert (role=status) is mounted already holding its text, which many screen readers do not announce. Keep one persistent status region, or move the focus to the title of the card (contact-form.tsx:73-97)." }
  - { id: L2, rule: "A field's error line is never cleared while the visitor fixes the field: `invalid` is reset only by the next submit, so a corrected field keeps aria-invalid=true and its line. Clear a field's line on change (contact-form.tsx:65-71)." }
  - { id: L3, rule: "The server's 400 (with `fields`), 429, 502 and 503 and a failed request all show the one banner, and the 400's list of fields is thrown away; the page has no maxLength (the server cuts at 120, 254 and 5000) and its address pattern is weaker than the server's isBareAddress, so a long message or an address with a bracket passes the page and fails with a generic banner. Add maxLength, mirror isBareAddress, mark the fields the server names, give 429 its own sentence (contact-form.tsx:59-62)." }
  - { id: L4, rule: "<form method=\"post\"> has no `action`: with no script a native submit posts to the page's own address, which answers nothing useful. Add action=\"/api/iletisim\" or drop `method` (contact-form.tsx:101-107)." }
  - { id: no-default-accept, rule: "no page has initialFocus on an action with intent confirm (this page has no initialFocus at all: the focus starts at the document)" }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3)" }
