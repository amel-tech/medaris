schema: delurio-graph/0
kind: needs
id: landing.site.enterApp
status: proposed
summary: >-
  What must exist for a visitor who goes from the public site into the app, from landing.site.enterApp: the flow's closed product
  list, written on 15 Nov 2026 from the flow's own story, the inventory finding L6 (apps/landing, section 7), two new findings
  (ENTER-1, ENTER-2) and planned.md (P-21, P-23). Each need is what the product must do, never what the page does today. Landing
  has no browser e2e: its checks are Vitest specs in apps/landing/test that render the page or call the route handler, so `e2e:`
  below names one of those, and `check` is the inventory's number (landing.md section 6).

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# missing (no code): phone-visitor-can-register-from-any-page, the-entry-says-no-in-words, roadmap-from-the-header,
# chosen-language-follows-into-the-app
# unwalked (code, no e2e and no replay): none
# walked by an e2e check only, no replay of the state: the-entry-never-redirects-blind, the-entry-keeps-a-path-prefix (the stack's
# landing has the address set and no second landing without it runs); an-entry-that-does-not-exist-is-not-found has the 404 on
# the wire in the replay (the effect enterTedris), not the state unknownRoute
# replays that passed on 15 Nov 2026: scenario `visitor`, the main story (REGISTER), `--to handed_over.sign_in` and
# `--to handed_over.discover`; each ends with the wire checks of its effect

needs:
  - id: register-from-the-public-site
    need: >-
      A visitor who has read about Medaris on the public site starts registering in one click, from every place the home page
      invites them (the header, the hero, the talebe door and the closing), and arrives on the registration form.
    evidence:
      - state: home
      - node: headerRegister
      - node: heroRegister
      - node: doorRegister
      - node: closingRegister
      - state: registerRoute
      - state: handed_over.register
      - source: "apps/landing/app/api/tedris/[intent]/route.ts:12"
      - source: apps/landing/components/site-header.tsx:63
      - source: "apps/landing/app/[locale]/page.tsx:224"
      - source: "apps/landing/app/api/tedris/[intent]/route.ts:28"
      - test: apps/landing/test/home.spec.ts
        name: "renders them with the exact hrefs of lib/tedris.ts"
      - test: apps/landing/test/home.spec.ts
        name: "sends Keşfet to a page tedris opens to a visitor, per request"
      - test: apps/landing/test/tedris-entry.spec.ts
        name: "the page\\'s \"Kayıt ol\" opens registration, \"Giriş yap\" sign-in"
      - test: apps/landing/test/tedris-entry.spec.ts
        name: "one click: the CTA's link redirects to tedris's registration page, with no language in it (MDRS-248)"
      - scenario: visitor
    note: |-
      home.spec.ts home#1, #2
      tedris-entry.spec.ts tedris-entry#1, #2

  - id: sign-in-from-the-public-site
    need: >-
      A person who already has an account signs in in one click from the public site (the header or the closing) and arrives on
      the sign-in form.
    evidence:
      - state: home
      - node: headerSignIn
      - node: closingSignIn
      - state: signInRoute
      - state: handed_over.sign_in
      - source: "apps/landing/app/api/tedris/[intent]/route.ts:12"
      - source: apps/landing/components/site-header.tsx:60
      - source: "apps/landing/app/[locale]/page.tsx:419"
      - test: apps/landing/test/home.spec.ts
        name: "renders them with the exact hrefs of lib/tedris.ts"
      - test: apps/landing/test/home.spec.ts
        name: "sends Keşfet to a page tedris opens to a visitor, per request"
      - test: apps/landing/test/tedris-entry.spec.ts
        name: "sign-in goes to tedris's sign-in page"
      - scenario: visitor
    note: "home.spec.ts home#1, #2"

  - id: look-at-the-courses-without-an-account
    need: >-
      A visitor who has no account looks at the courses in one click from the public site, and is not asked to register first; the
      page says so beside the link.
    evidence:
      - state: home
      - node: heroExplore
      - node: doorExplore
      - node: heroNote
      - state: discoverRoute
      - state: handed_over.discover
      - source: "apps/landing/app/tedris/[[...path]]/route.ts:5"
      - source: "apps/landing/app/[locale]/page.tsx:236"
      - source: apps/landing/lib/tedris.ts:17
      - test: apps/landing/test/home.spec.ts
        name: "never mentions a donation, a fee or 'free', in the markup or the content"
      - scenario: visitor

  - id: the-doors-are-plain-links
    need: >-
      Every door is an ordinary link that the browser follows, so that it works before the page's scripts have run, and a person
      who opens it in a new tab gets the same. What follows the link (tedris's entry page and Keycloak's form) needs script today
      (ENTER-2); this need is about the link.
    evidence:
      - state: home
      - source: apps/landing/components/site-header.tsx:60
      - test: apps/landing/test/home.spec.ts
        name: "renders them with the exact hrefs of lib/tedris.ts"
      - scenario: visitor

  - id: the-entry-never-redirects-blind
    need: >-
      When the public site does not know where the app is, no door sends the visitor anywhere: it answers that it cannot, and
      never redirects to an address that only looks right.
    evidence:
      - state: refused.not_configured
      - source: "apps/landing/app/api/tedris/[intent]/route.ts:12"
      - source: "apps/landing/app/api/tedris/[intent]/route.ts:21"
      - source: apps/landing/lib/tedris.ts:18
      - test: apps/landing/test/tedris-entry.spec.ts
        name: "answers 503, not a broken link, while TEDRIS_APP_URL is unset"
    note: Also drawn as the assertion handed-over-only-with-an-address, the assertion refused-only-without-an-address.

  - id: the-entry-says-no-in-words
    need: >-
      A visitor to whom a door cannot answer is told so in Turkish, in the site's own page, with the contact address and a way
      back to the home page, not with an English line that names a server setting (ENTER-1).
    missing: ENTER-1; no Linear issue
    note: >-
      Drawn on the state refused.not_configured, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).

  - id: an-entry-that-does-not-exist-is-not-found
    need: An address under the entry route that is not one of its two entries answers not found, and never redirects.
    evidence:
      - state: unknownRoute
      - state: refused.unknown_address
      - source: "apps/landing/app/api/tedris/[intent]/route.ts:12"
      - source: "apps/landing/app/api/tedris/[intent]/route.ts:17"
      - test: apps/landing/test/tedris-entry.spec.ts
        name: "answers 404 for any other intent"
      - scenario: visitor
    note: "visitor: on the wire only: the effect enterTedris asks /api/tedris/admin and sees 404"

  - id: the-entry-keeps-a-path-prefix
    need: >-
      Where the app is served under a path (a prefix on its address), the doors lead into that path, not to the root of its host.
    evidence:
      - state: signInRoute
      - state: registerRoute
      - state: discoverRoute
      - source: apps/landing/lib/tedris-entry.ts:23
      - source: apps/landing/lib/tedris.ts:24
      - test: apps/landing/test/tedris-entry.spec.ts
        name: "keeps a path prefix on the configured tedris URL"

  - id: phone-visitor-can-register-from-any-page
    need: >-
      A visitor on a phone can start registering from every page of the public site, not only from the home page: the phone header
      has a way to "Kayıt ol" as the wide header has (L6).
    missing: L6; no Linear issue
    note: >-
      Drawn on the nodes banner and headerRegister, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).

  - id: roadmap-from-the-header
    need: >-
      A visitor reaches the public roadmap in one click from the header and the footer of every page (decided 4 October 2026:
      route /yol-haritasi, linked from both). landing.site.roadmap draws the page; the link is in this flow's header.
    evidence:
      - node: headerRoadmap
      - state: handed_over.roadmap
    missing: MDRS-246
    note: >-
      Drawn on the node banner, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves
      out what only missing needs name).

  - id: chosen-language-follows-into-the-app
    need: >-
      A visitor who chose a language on the public site is taken into registration and sign-in in that language: the entry
      addresses name none, so the choice has to travel in a cookie that tedris reads. The site is Turkish only today and has no
      language control, so there is no choice to carry yet. Not confirmed that MDRS-295 (the interface language moves from the
      path to a cookie in tedris and nizam) covers landing's doors; planned.md P-21 names landing-web among its apps.
    missing: MDRS-295
    note: >-
      Drawn on the state home, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves
      out what only missing needs name).
