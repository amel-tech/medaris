# The main story: the visitor opens the question about signing up (the others stay as the page had them: the first and the
# fourth open), closes it again, closes the first question that the page opened for them, opens the last, and follows the
# link inside its second paragraph to the privacy notice.
main:
  events: [TOGGLE_3, TOGGLE_3, TOGGLE_1, TOGGLE_11, PRIVACY_IN_ANSWER]

initial: questions
states:
  questions:
    title: The questions
    by: human
    goal: true
    description: >-
      The page as it opens, and as it stays while the visitor reads: a heading, a line of introduction, three groups of
      questions (Medaris 1-2, Kayıt ve dersler 3-10, Hesap 11), each question a button inside an h3, and two cards in an
      aside beside them. Answers 1 and 4 are open when the page opens; the other nine are closed and carry `hidden`, so
      their text is not on the screen and not in the accessibility tree. A press on a button toggles its own answer
      only. The buttons keep the focus (the page moves nothing; the item is not remounted), the page sets no initial
      focus, and aria-expanded and aria-controls carry the state, which the graph has no key for: it is drawn by whether
      the answer is shown. Findings: L9 and FAQ-1 in the answer to question 3 (it leaves out the required gender choice
      and names the button "Derse kaydol" where tedris-web says "Kayıt ol"); L11 on all eleven (the answers are plain
      divs, no region named by its question).
    source: "apps/landing/app/[locale]/sss/page.tsx:18"
