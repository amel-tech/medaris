# The questions page of the public site (landing-web, /sss): a visitor reads the answers to what is asked most before a
# person opens an account. No sign-in, no form, no server call: the page is static, and the only thing that moves on it is
# eleven disclosures, each a button that shows and hides its own answer. Written from the code on 15 Nov 2026 (captured):
# the page is apps/landing/app/[locale]/sss/page.tsx and the disclosure apps/landing/components/faq-item.tsx.
#
# What the page does today, where it differs from what a visitor needs (inventory findings, apps/landing, section 7, and
# one that the inventory lacks):
#   L9    The answer to "Bir derse nasıl kaydolurum?" lists what the sign-up form asks (name, surname, username, e-mail,
#         password, the privacy notice) and leaves out the gender choice, which the realm requires of every account
#         (config/keycloak/user-profile.json:25-39, required for the roles admin and user) and which the terms page says
#         is required (kullanim-sartlari/page.tsx:190-196). Gender is always asked in Medaris; the answer must say so.
#   L11   The answers are plain divs: no role=region and no aria-labelledby, which the disclosure pattern asks for once
#         there are more than a few panels.
#   FAQ-1 (new) The same answer calls the course page's enrolment button "Derse kaydol"; tedris-web's button for a course
#         that takes anyone is "Kayıt ol" (CoursePage.enroll, course-aside.tsx:371), and "Kayıt başvurusu yap" for a course
#         that asks for approval. No string "Derse kaydol" exists in the apps.
# The graph draws what the code does; none of these is fixed here.
#
# The disclosures are independent (several may be open at once), so each of the eleven is a variable of its own, q1 to q11;
# the checker visits every combination (2048), which a flow of one state and eleven self-loops makes cheap.
schema: delurio-graph/0
kind: flow
id: landing.site.faq
status: captured
domain: medaris.api
ui: landing.site.faq
title: Read the answers to the common questions
summary: >-
  A visitor opens the questions page and finds eleven questions in three groups (Medaris, Kayıt ve dersler, Hesap).
  Each question is a button that shows and hides its own answer; the page opens with the first ("Medaris nedir?") and the
  fourth ("Derse kaydım neden onay bekliyor?") already open, and any number may be open at once. The visitor opens the
  question they came with, reads it and may close it again; the focus stays on the button they pressed. When the answer
  is not there, the card beside the questions ("Sorunuz burada yok mu?") sends them to the contact page, and the privacy
  notice is one link away in the card "Kişisel verileriniz" and inside the last answer. Two of the answers need care:
  the one on signing up omits the required gender choice (L9) and names the course page's button wrongly (FAQ-1).
source: "apps/landing/app/[locale]/sss/page.tsx:10"

scope:
  shows: the eleven questions as disclosures, opening and closing them, and the three links of the page body that lead on
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "the way into the page: the footer link, the home page's closing sentence, the contact page's card and the success card are the navigation graph's entries (landing.nav: frame:site->faq, start->faq, contact->faq); a visitor who opens the address (a link in a mail, a bookmark) meets the same page"
    - "the header and the footer, with the links they carry on every page (landing.nav draws the frame)"
    - "the phone layout (below 768 px): the same questions, the card column falls under them, and the header is another bar (landing.nav)"
    - "what the answers say about the other apps: the graph carries the words, and checks them against tedris-web only where a finding names it (the enrolment button, FAQ-1); the ten-minute window of \"Celseye katıl\", the tab \"Sorularım\" and the badge \"Onay bekliyor\" were read in tedris-web and agree"
    - "a keyboard visitor: the triggers are native buttons, so Enter and Space press them; not walked"
    - "an address with a locale prefix (/tr/sss) or with a fragment: not verified"
    - "where the focus is when the page opens: the page sets none (focus-not-set in ui.yaml)"

context:
  q1: { values: [open, closed], initial: open, say: { open: "the answer to \"Medaris nedir?\" is shown", closed: "the answer to \"Medaris nedir?\" is hidden" } }
  q2: { values: [open, closed], initial: closed, say: { open: "the answer to \"Köşk ve medrese nedir?\" is shown", closed: "the answer to \"Köşk ve medrese nedir?\" is hidden" } }
