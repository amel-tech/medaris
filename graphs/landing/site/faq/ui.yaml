rules:
  - { id: L9, rule: "The answer to \"Bir derse nasıl kaydolurum?\" lists what the sign-up form asks (name, surname, username, e-mail, password and the privacy notice) and leaves out the gender choice. Gender is always asked in Medaris: the realm's user profile makes it required for every account (config/keycloak/user-profile.json:25-39, a choice of FEMALE or MALE) and the terms page says so (kullanim-sartlari/page.tsx:190-196). A visitor who follows the answer meets a required choice it did not mention. Add \"cinsiyetinizi seçin\" to the list (sss/page.tsx:81-85)." }
  - { id: FAQ-1, rule: "The second paragraph of the same answer sends the visitor to a button \"Derse kaydol\" on the course page; tedris-web draws \"Kayıt ol\" there (CoursePage.enroll, apps/tedris/features/courses/components/course-aside.tsx:375, libs/i18n tedris.json:16) and \"Kayıt başvurusu yap\" for a course that asks for approval, and no string \"Derse kaydol\" exists in the apps. Say \"Kayıt ol\" (sss/page.tsx:88-90). Found by reading the code; not seen in a browser." }
  - { id: L11, rule: "The eleven answers are plain divs (`div.mds-week__panel`, hidden while closed) with no role=region and no aria-labelledby, so a screen reader that lists regions finds none for them. The pattern asks for role=region labelled by the trigger once there are more than a few panels; give each panel role=\"region\" and aria-labelledby=\"{id}-b\" (faq-item.tsx:46-50)." }
  - { id: focus-not-set, rule: "The page sets no initial focus (no autoFocus and no focus() in sss/page.tsx or faq-item.tsx), so the page node has no `initialFocus`, and a press on a question moves none: the graph says nothing of the focus anywhere. Recorded so the silence is a fact and not an omission." }
  - { id: state-is-the-answer, rule: "A question's open or closed state is carried by aria-expanded on its button, aria-controls naming its answer and `hidden` on the answer (faq-item.tsx:33-34,46). The graph has no key for aria-expanded, so a node draws it by being shown or not: the answer's paragraphs are `when` the question is open, and the replay checks they are visible or not there." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): each trigger's name is its question, and the number and the chevron around it are aria-hidden" }
