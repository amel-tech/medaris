# The screen of landing.site.faq: the page /sss at the wide layout (768 px and up), main only. The header and the footer are
# the navigation graph's frame (landing.nav, frame site), not drawn here. The words are Turkish literals in apps/landing
# (landing has no i18n catalog); each key of catalog/tr.json is copied letter for letter from the literal that the `source`
# of the node that uses it names, by a script that read apps/landing/app/[locale]/sss/page.tsx, and then every value was
# compared with the text of the page the running site answers. One value is assembled in code: Answer.s11.p1 is the JSX
# sentence of page.tsx:208-210 around legal.accountDeletionPath (content/legal.ts:12), written here as {path} with the
# path in `samples`. The flow writes nothing, so there is no Changes.note.
schema: delurio-graph/0
kind: ui
id: landing.site.faq
flow: landing.site.faq
status: captured
catalog: catalog/tr.json
locales: [tr]
samples: { path: "Aydınlatma Metni’nin 7. bölümünde yazan yollardan biriyle veri sorumlusuna yazarak" }

# No `focus` and no `initialFocus`: the page sets none when it opens and a press on a question moves none (the button stays
# where it is, the item is not remounted), so the graph says nothing of the focus anywhere (rule focus-not-set).

