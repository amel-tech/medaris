# The decks, cards, labels, course decks and deck review of the Medaris API: 51 handlers (domain.md of the inventory, lines 4576-5132;
# 14 personal decks, 12 cards, 5 card labels, 5 deck labels, 5 course decks, 5 köşk decks and proposals, 5 publish review). Written from
# the code as it is, each handler read through its guard, its pipe, its service and its repository.
#
# Conventions of this file
#   route         OpenAPI style: a path parameter is {id}, not :id. The anchor of an action is its route decorator line.
#   result        returns: an entity the response is, a row of it. A list of an entity is { type: array, items: { type: object,
#                 references: Entity } }. A projection that is no entity (the summary rows, the study round, the köşk deck page) is
#                 written out. A 204 is { status: 204 }.
#   refusals      listed in full per action. HTTP_400, HTTP_404 and HTTP_429 are Nest's HttpException codes (HTTP_<status>);
#                 the 401 of AuthGuard (HTTP_401: no token, or one that does not verify; invariant access-token-only) and the default
#                 budgets (3000 per address and 100 per user, per route and minute; invariant rate-limit-before-auth) can answer on any
#                 route and are not repeated: only the three bulk routes carry a 429 budget of their own. A malformed id on a guarded write route is 403
#                 AUTHZ_FORBIDDEN for everyone but the SYSTEM_ADMIN, because the PUBLIC relation holds no write code; the HTTP_400 there is
#                 the SYSTEM_ADMIN's.
#                 Two answers belong to every route that takes a JSON body and are not repeated: a body that is not valid JSON is 400
#                 HTTP_400 before any guard runs, and one over 100 KB (express's default, no limit is set) is a 500 INTERNAL_ERROR, since
#                 nothing maps its PayloadTooLargeError (derived by reading, not run; only the bulk create can reach it by size).
#   needs         the guards and the code: the controllers of this area use AuthGuard and AuthzGuard with @Authz or @AuthzExempt, except
#                 the two label controllers and the two deck-review controllers, which use AuthGuard alone and decide in their service.
#   description   what the action reads and writes; note: the author's remarks, the findings and what was derived by reading and not run.
#
# Names of generic controller methods (the controller method becomes the action):
#   FlashcardDeckController   findAllUserCollections listCollectedDecks, summary listDeckSummaries, dueToday listDecksDueToday,
#                             explore exploreDecks, findById getDeck, findAll listDecks, create createDeck, addToUserCollection collectDeck,
#                             requestPublication requestDeckPublication, replace replaceDeck, updateDeck updateDeck, delete deleteDeck,
#                             withdrawPublication withdrawDeckPublication, removeFromUserCollection uncollectDeck
#   FlashcardController       findById getCard, findByDeckId listDeckCards, studyRound getStudyRound, createMany createCards,
#                             replaceManyProgress saveCardProgress, replace replaceCard, update updateCard, deleteCard deleteCard,
#                             bulk createCardsBulk, downloadSample downloadCardSample, exportCards exportCards, importCards importCards
#   FlashcardlabelController  createFlashcardLabel createCardLabel, deleteFlashcardLabel deleteCardLabel, flahscardLabeling labelCard,
#                             getById getCardLabel, getLabelStats getCardLabelStats
#   FlashcardDeckLabelController  createFlashcardDeckLabel createDeckLabel, deleteFlashcardDeckLabel deleteDeckLabel,
#                             deckLabeling labelDeck, getById getDeckLabel, getLabelStats getDeckLabelStats
#   CourseDecksController     manage listCourseDecksForStaff, create createCourseDeck, update updateCourseDeck, delete deleteCourseDeck,
#                             list listCourseDecks
#   KoskDecksController       decks getManagedKoskDecks, createDeck createKoskDeck, propose proposeKoskDeck,
#                             rejectProposal rejectKoskDeckProposal, hide hideKoskDeck
#   NizamDeckRequestsController  list listDeckPublishRequests, readCards readDeckPublishRequestCards, approve approveDeckPublishRequest,
#                             reject rejectDeckPublishRequest, unpublish unpublishDeck
#
# No background job belongs to this area: notifications are written inline (NotificationService.notify, swallowed on failure only in
# DeckReviewService.tell).
schema: delurio-graph/0
kind: domain
id: medaris.api
policies:
  - actor: course-deck-staff
    needs: deck.manage_course in the course, held by the müderris of the course, the başmüderris of its medrese, the nazım of its köşk, or a grant
    where: >-
      Opens, edits and deletes (while a draft) the course's decks, and reads, fills, edits and publishes-by-request them on the deck routes as
      the author does. Not the single-card routes unless it wrote the deck (invariant course-deck-staff-edit-any-card), and not the export.
    read: [Deck, Flashcard, FlashcardProgress, CourseWeek, Enrollment]
    write: [Deck, Flashcard]
    do: [listCourseDecksForStaff, createCourseDeck, updateCourseDeck, deleteCourseDeck, getDeck, getStudyRound, createCards, createCardsBulk, importCards, listDeckCards, replaceDeck, updateDeck, deleteDeck, requestDeckPublication, withdrawDeckPublication]
    source: libs/common/src/authz/effective-permissions.ts:306

  - actor: deck-reviewer
    needs: the realm role SYSTEM_ADMIN, or platform.deck_publish held by a Medaris nazımı through a grant
    where: >-
      Lists the publish requests, reads the cards of a requested private deck (on the record), approves or refuses a request. A holder of
      platform.deck_publish may not answer the request for their own deck. Unpublishing is the SYSTEM_ADMIN's alone.
    read: [Deck, Flashcard]
    write: [Deck, Notification, AuditLog]
    do: [listDeckPublishRequests, readDeckPublishRequestCards, approveDeckPublishRequest, rejectDeckPublishRequest, unpublishDeck]
    source: apps/tedrisat/src/deck-review/deck-review.service.ts:321

  - actor: kosk-deck-nazim
    needs: KOSK_NAZIM in the köşk (a role assignment, not a permission code), or the realm role SYSTEM_ADMIN
    where: Opens the köşk's decks, answers its müderrises' proposals, hides its decks. deck.manage_kosk is not consulted.
    read: [Deck, DeckProposal, Kosk]
    write: [Deck, DeckProposal, Notification]
    do: [getManagedKoskDecks, createKoskDeck, rejectKoskDeckProposal, hideKoskDeck]
    source: apps/tedrisat/src/deck-review/deck-review.service.ts:350

  - actor: deck-proposer
    needs: MUDERRIS in a course of the köşk that is not hidden (a role assignment, not a permission code)
    where: Suggests a deck for the köşk, tied to one of its own courses there. deck.propose_kosk is not consulted.
    read: [Kosk, Course]
    write: [DeckProposal]
    do: [proposeKoskDeck]
    source: apps/tedrisat/src/deck-review/deck-review.repository.ts:547

  - actor: label-owner
    needs: a signed-in caller who made the label
    where: >-
      Makes, reads, deletes and uses their own card labels and deck labels, and reads their stats, whatever the scope. Nobody else reads or uses
      them, and no route reads labelings back.
    read: [FlashcardLabel, FlashcardLabelStats, DeckLabel, DeckLabelStats]
    write: [FlashcardLabel, FlashcardLabeling, FlashcardLabelStats, DeckLabel, DeckLabeling, DeckLabelStats]
    do: [createCardLabel, deleteCardLabel, labelCard, getCardLabel, getCardLabelStats, createDeckLabel, deleteDeckLabel, labelDeck, getDeckLabel, getDeckLabelStats]
    source: apps/tedrisat/src/flashcard/flashcard-label.service.ts:44

actions:
  listCollectedDecks:
    route: GET /flashcard/decks/collections
    summary: "The decks in the caller's collection"
    description: >-
      The decks of other people the caller put in their collection, and their own that they collected. A deck stays
      listed only while the caller may still read it: it must be public, the caller's own or shared with them
      (deckSharedWith), and that is decided on every read, so a deck its author turned private drops out. Tags are []
      unless the caller wrote the deck.
    needs: "a signed-in caller: AuthGuard and AuthzGuard, with @AuthzExempt (no resource is named; the rows are chosen by the caller's own sub)"
    result: { type: array, items: { type: object, references: Deck } }
    note: >-
      Hidden decks (archivedAt) are not filtered out here, unlike the summary and explore lists (finding
      hidden-decks-in-lists). The scoping is in the query, flashcard-deck.repository.ts:126-166, and the tags are
      blanked by the service, flashcard-deck.service.ts:21.
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:90

  listDeckSummaries:
    route: GET /flashcard/decks/summary
    summary: "The caller's decks with their progress"
    description: >-
      The caller's own decks, newest first and hidden ones left out, then the decks of other people the caller collected
      and may still read (not hidden, public or shared with them), in the order they were collected. Each row carries
      the card counts and the caller's own progress, so a list page makes one request.
    needs: "a signed-in caller: AuthGuard and AuthzGuard, with @AuthzExempt (no resource is named; the rows are chosen by the caller's own sub)"
    result:
      type: array
      items:
        type: object
        required: [id, title, authorId, isMine, cardType, publishStatus, source, inCollection, cardCount, masteredCount, learningCount, newCount, dueCount, addedSinceCollectedCount]
        properties:
          id: { type: string, format: uuid, references: Deck }
          title: { type: string }
          description: { type: [string, "null"] }
          authorId: { type: string, format: uuid }
          isMine: { type: boolean }
          cardType: { enum: [VOCABULARY, HADEETH] }
          publishStatus: { enum: [PRIVATE, PENDING, PUBLISHED, REJECTED] }
          publishRequestedAt: { type: [string, "null"], format: date-time }
          source: { enum: [OWN, COLLECTION], note: "OWN when the caller wrote the deck" }
          collectionKind: { enum: [COURSE, KOSK, MADRASAH, PUBLIC, null], note: "null for the caller's own decks; else the most specific link first: the course, then the köşk, then the medrese, else PUBLIC" }
          inCollection: { type: boolean, note: "whether a decks_users row of the caller exists" }
          contextTitle: { type: [string, "null"], note: "the course title, else the köşk name, else the medrese name, else null" }
          muderrisName: { type: [string, "null"], note: "the course's first müderris by order index; only for a course deck" }
          muderrisUnvan: { type: [string, "null"], note: "that müderris' unvan in the course (the HocaUnvan values of CourseMuderris.unvan)" }
          cardCount: { type: integer }
          masteredCount: { type: integer, note: "the caller's MASTERED progress rows" }
          learningCount: { type: integer, note: "the caller's LEARNING progress rows" }
          newCount: { type: integer, note: "max(0, cardCount - masteredCount - learningCount)" }
          dueCount: { type: integer, note: "cards waiting for a repeat now (invariant card-review-due)" }
          addedSinceCollectedCount: { type: integer, note: "cards written after the caller collected the deck; 0 for the caller's own" }
    note: >-
      Declared before :id in the controller so that summary is not read as a deck id. Built in
      flashcard-deck-summary.service.ts:73 from flashcard-deck-summary.repository.ts:105-130 and :165.
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:109

  listDecksDueToday:
    route: GET /flashcard/decks/due
    summary: "The decks with something to study today"
    description: >-
      From the caller's list (own and collected), first the decks with cards waiting for a repeat, the most waiting
      first, then the collected decks of other people with nothing due that grew since they were collected. An own deck
      with nothing due is never listed. Cut to limit.
    needs: "a signed-in caller: AuthGuard and AuthzGuard, with @AuthzExempt (no resource is named; the rows are chosen by the caller's own sub)"
    query: { type: object, properties: { limit: { type: integer, default: 3, note: "clamped to 1..10, not refused" } } }
    result: { type: array, items: { type: object, references: Deck, description: "a row of listDeckSummaries" } }
    refusals:
      HTTP_400: { status: 400, note: "limit is not an integer (ParseIntPipe)", source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:134 }
    note: >-
      Code: flashcard-deck-summary.service.ts:105-118.
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:131

  exploreDecks:
    route: GET /flashcard/decks/explore
    summary: "Decks to discover and collect"
    description: >-
      Two lists, newest first, each marked with whether the caller already collected the deck. courseDecks are other
      people's private decks shared with the caller through an enrollment in the course, a course of the köşk or a
      course of the medrese; publicDecks are every published deck that is not hidden, the caller's own included. Both
      can be narrowed to one card type.
    needs: "a signed-in caller: AuthGuard and AuthzGuard, with @AuthzExempt (no resource is named; the rows are chosen by the caller's own sub)"
    query: { type: object, properties: { cardType: { enum: [VOCABULARY, HADEETH] } } }
    result:
      type: object
      required: [courseDecks, publicDecks]
      properties:
        courseDecks: { type: array, items: { type: object, references: Deck, description: "a row of listDeckSummaries" } }
        publicDecks: { type: array, items: { type: object, references: Deck, description: "a row of listDeckSummaries" } }
    refusals:
      HTTP_400: { status: 400, note: "cardType is not VOCABULARY or HADEETH (ParseEnumPipe)", source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:160 }
    note: >-
      Code: flashcard-deck-summary.service.ts:82-95 and flashcard-deck-summary.repository.ts:132-163.
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:157

  getDeck:
    route: GET /flashcard/decks/{id}
    summary: "One deck"
    description: >-
      The author, anyone for a public deck, a talebe the deck is shared with, the course staff of a course deck, and the
      SYSTEM_ADMIN for any deck read it. Tags come back only to the author. The SYSTEM_ADMIN's read of another person's
      private deck is on the record.
    needs: "anyone, with or without a token: AuthGuard and AuthzGuard with @Authz(deck.view, the deck (byParam flashcard-deck)) and @AuthzPublic; with no token only the anonymous relation is decided, so only public decks pass"
    query: { type: object, properties: { include: { type: string, note: "a comma list, accepted and ignored: DeckIncludeEnum is empty" } } }
    result: { returns: Deck }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      DECK_NOT_FOUND: { status: 404, note: "no such deck, or a private deck the caller did not write and is not shared with: the same answer for both, on purpose. An anonymous caller meets it for every non-public deck (tedrisat-role-resolver.service.ts:240)", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:306 }
      HTTP_400: { status: 400, note: "a path id that is not a uuid (ParseUUIDPipe)", source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:187 }
      DECK_FORBIDDEN: { status: 403, note: "a second lock: the guard has already answered, so this is reached only when the deck turned private between the guard's read and the handler's", source: apps/tedrisat/src/flashcard/flashcard-deck.service.ts:195 }
    sideEffects:
      - "audit:deck.admin_read, when the SYSTEM_ADMIN reads another person's private deck (libs/common/src/authz/authz.service.ts:234)"
    note: >-
      The course staff branch asks authz.can(deck.manage_course) only when the cheaper answers did not settle the read
      (flashcard-deck.controller.ts:204).
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:184

  listDecks:
    route: GET /flashcard/decks
    summary: "Public decks, and the caller's own"
    description: >-
      With no token only public decks. Signed in: isPublic=true gives the public decks, isPublic=false the caller's own
      non-public ones, and with it omitted both. Decks shared through a course are not in this list (explore has them).
      Tags are [] unless the caller wrote the deck.
    needs: "@AuthzPublic only, with no @Authz: anyone, with or without a token (a list has no single resource; visibility is in the query)"
    query: { type: object, properties: { isPublic: { type: boolean }, include: { type: string, note: "accepted and ignored" } } }
    result: { type: array, items: { type: object, references: Deck } }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      HTTP_400: { status: 400, note: "isPublic is not a boolean (ParseBoolPipe)", source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:246 }
    note: >-
      An anonymous isPublic=false answers [] at once (flashcard-deck.controller.ts:256). Hidden decks are not filtered
      out (finding hidden-decks-in-lists). The query is flashcard-deck.repository.ts:101-124.
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:242

  createDeck:
    route: POST /flashcard/decks
    summary: "Make a private deck"
    description: >-
      The caller becomes the author. The deck is born private whatever the body says: isPublic is not accepted, and the
      status is PRIVATE. Tags are trimmed, blanks dropped and repeats removed without regard to case in the Turkish
      locale.
    needs: "a signed-in caller holding deck.create_private on the new-deck sentinel (forNew flashcard-deck); the PUBLIC relation holds it, so any signed-in caller passes (AuthGuard, AuthzGuard)"
    body:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 5, maxLength: 100 }
        cardType: { enum: [VOCABULARY, HADEETH], default: VOCABULARY, note: "fixed once the deck exists" }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        description: { type: string, maxLength: 1000 }
    result: { returns: Deck, status: 201 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      VALIDATION_ERROR: { status: 400, note: "title shorter than 5 or longer than 100, an unknown cardType, more than 20 tags or a tag over 40 characters, a description over 1000, or an unknown property (isPublic included)", source: libs/common/src/pipes/validation.pipe.ts:40 }
      INTERNAL_ERROR: { status: 500, note: "tags or cardType sent as JSON null: @IsOptional lets null through the DTO and the insert writes NULL into a NOT NULL column. Derived by reading, not run (finding accepted-write-500)", source: apps/tedrisat/src/flashcard/flashcard-deck.repository.ts:173 }
    note: >-
      flashcard-deck.repository.ts:169-181 forces isPublic false and publishStatus PRIVATE; flashcard-deck.service.ts:25
      normalises the tags.
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:276

  collectDeck:
    route: POST /flashcard/decks/{id}/collections
    summary: "Put a deck in the caller's collection"
    description: >-
      Writes a decks_users row for the caller. Collecting twice is not an error: the second call returns the row that is
      there and keeps its createdAt.
    needs: "a signed-in caller holding deck.view on the deck (byParam flashcard-deck) (AuthGuard, AuthzGuard), and the handler asks again whether the deck is readable, without the SYSTEM_ADMIN's exception"
    result: { returns: DeckUser, status: 201 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      DECK_NOT_FOUND: { status: 404, note: "no such deck, or a private deck the caller did not write and is not shared with: the same answer for both, on purpose. The SYSTEM_ADMIN skips the guard's relation check and meets the service's own 404 for an absent deck (flashcard-deck.service.ts:187)", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:306 }
      HTTP_400: { status: 400, note: "a path id that is not a uuid (ParseUUIDPipe)", source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:306 }
      DECK_FORBIDDEN: { status: 403, note: "the guard let the caller read the deck but the handler's second look does not: the SYSTEM_ADMIN on another person's private deck, or course staff who are not enrolled and so not shared with", source: apps/tedrisat/src/flashcard/flashcard-deck.service.ts:195 }
    sideEffects:
      - "audit:deck.admin_read, when the SYSTEM_ADMIN reads another person's private deck: the guard writes it before the handler runs (libs/common/src/authz/authz.service.ts:234)"
    note: >-
      The audit row is written even though the handler then refuses the SYSTEM_ADMIN with DECK_FORBIDDEN.
      flashcard-deck.controller.ts:318 calls assertReadable; the repository insert is
      flashcard-deck.repository.ts:183-201 (onConflictDoNothing, then a read).
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:303

  requestDeckPublication:
    route: POST /flashcard/decks/{id}/publish-request
    summary: "Ask for a deck to be published"
    description: >-
      A PRIVATE or REJECTED deck becomes PENDING, with publishRequestedAt set and the last reviewer's answer cleared.
      The write is guarded on the status that was read, so a request that lost a race answers 409.
    needs: "a signed-in caller holding deck.manage_private on the deck (byParam flashcard-deck) (AuthGuard, AuthzGuard); held by the deck's author and, on a course deck, by its course staff; the SYSTEM_ADMIN passes on any deck, refused only on a write to another person's private one (authz.service.ts:222-253)"
    result: { returns: Deck, status: 201 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      DECK_NOT_FOUND: { status: 404, note: "no such deck, or a private deck the caller did not write and is not shared with: the same answer for both, on purpose. The SYSTEM_ADMIN skips the guard's relation check and meets the service's own 404 for an absent deck (flashcard-deck.service.ts:271)", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:306 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller can see the resource but holds no code that allows this", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "a path id that is not a uuid; only the SYSTEM_ADMIN reaches the pipe with one, everyone else is refused 403 by the guard first (the PUBLIC relation holds no write code)", source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:338 }
      DECK_PUBLISH_STATE_CONFLICT: { status: 409, note: "the deck is PENDING or PUBLISHED already, or its status moved between the read and the write; the message names the current status", source: apps/tedrisat/src/flashcard/flashcard-deck.service.ts:277 }
    note: >-
      Course staff hold deck.manage_private on a course deck, so they can ask to make it public (finding
      deck-manage-private-reaches-course-decks). No notification goes out when a request is made: the reviewers poll
      their list. flashcard-deck.service.ts:269-285, flashcard-deck.repository.ts:236-257.
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:336

  replaceDeck:
    route: PUT /flashcard/decks/{id}
    summary: "Change a deck (the whole body)"
    description: >-
      Sets the title, and the description, tags and cardType that are sent. Fields left out are not cleared, though the
      route says it replaces completely, and cardType is accepted, though the deck's card type is meant to be fixed.
    needs: "a signed-in caller holding deck.manage_private on the deck (byParam flashcard-deck) (AuthGuard, AuthzGuard); held by the deck's author and, on a course deck, by its course staff; the SYSTEM_ADMIN passes on any deck, refused only on a write to another person's private one (authz.service.ts:222-253)"
    body:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 5, maxLength: 100 }
        cardType: { enum: [VOCABULARY, HADEETH], note: "written when sent, which the other update routes do not allow (finding put-deck-changes-card-type)" }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        description: { type: string, maxLength: 1000 }
    result: { returns: Deck }
    refusals:
      DECK_NOT_FOUND: { status: 404, note: "no such deck (resolver :290), or a private deck the caller did not write and is not shared with (:303): the same answer for both, on purpose", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:306 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller can see the resource but holds no code that allows this", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "a path id that is not a uuid; only the SYSTEM_ADMIN reaches the pipe with one, everyone else is refused 403 by the guard first (the PUBLIC relation holds no write code)", source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:359 }
      VALIDATION_ERROR: { status: 400, note: "the same bounds as createDeck, isPublic included", source: libs/common/src/pipes/validation.pipe.ts:40 }
      HTTP_404: { status: 404, note: "the update matched no row: the deck was deleted meanwhile, or the SYSTEM_ADMIN named an absent deck (the guard resolves no relation for it)", source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:369 }
      INTERNAL_ERROR: { status: 500, note: "tags or cardType sent as JSON null (see createDeck): the update writes NULL into a NOT NULL column. Derived by reading, not run (finding accepted-write-500)", source: apps/tedrisat/src/flashcard/flashcard-deck.repository.ts:214 }
    note: >-
      updated_at is not touched by this route or by updateDeck (finding deck-edit-updated-at).
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:357

  updateDeck:
    route: PATCH /flashcard/decks/{id}
    summary: "Change a deck (the fields sent)"
    description: >-
      Sets the title, description and tags that are sent. The card type cannot be changed here.
    needs: "a signed-in caller holding deck.manage_private on the deck (byParam flashcard-deck) (AuthGuard, AuthzGuard); held by the deck's author and, on a course deck, by its course staff; the SYSTEM_ADMIN passes on any deck, refused only on a write to another person's private one (authz.service.ts:222-253)"
    body:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 5, maxLength: 100 }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        description: { type: string, maxLength: 1000 }
    result: { returns: Deck }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      DECK_NOT_FOUND: { status: 404, note: "no such deck (resolver :290), or a private deck the caller did not write and is not shared with (:303): the same answer for both, on purpose", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:306 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller can see the resource but holds no code that allows this", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "a path id that is not a uuid; only the SYSTEM_ADMIN reaches the pipe with one, everyone else is refused 403 by the guard first (the PUBLIC relation holds no write code)", source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:392 }
      VALIDATION_ERROR: { status: 400, note: "a bound is broken, or an unknown property is sent (cardType and isPublic included)", source: libs/common/src/pipes/validation.pipe.ts:40 }
      HTTP_404: { status: 404, note: "the update matched no row (see replaceDeck)", source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:398 }
      INTERNAL_ERROR: { status: 500, note: "an empty body {} passes the DTO and leaves drizzle no value to set (drizzle-orm utils.js 'No values to set'), or title or tags is sent as JSON null (@IsOptional lets null through) and the update writes NULL into a NOT NULL column. Derived by reading, not run (finding accepted-write-500)", source: apps/tedrisat/src/flashcard/flashcard-deck.repository.ts:214 }
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:390

  deleteDeck:
    route: DELETE /flashcard/decks/{id}
    summary: "Delete a deck"
    description: >-
      Deletes the deck for good with its cards, its collection rows and its label rows. The cards' progress rows have no
      foreign key and stay behind. No audit row is written.
    needs: "a signed-in caller holding deck.manage_private on the deck (byParam flashcard-deck) (AuthGuard, AuthzGuard); held by the deck's author and, on a course deck, by its course staff; the SYSTEM_ADMIN passes on any deck, refused only on a write to another person's private one (authz.service.ts:222-253)"
    result: { status: 200, type: boolean, note: "true; false for the SYSTEM_ADMIN naming an absent deck, or for a caller who loses a race with another delete" }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      DECK_NOT_FOUND: { status: 404, note: "no such deck (resolver :290), or a private deck the caller did not write and is not shared with (:303): the same answer for both, on purpose", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:306 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller can see the resource but holds no code that allows this", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "a path id that is not a uuid; only the SYSTEM_ADMIN reaches the pipe with one, everyone else is refused 403 by the guard first (the PUBLIC relation holds no write code)", source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:419 }
    note: >-
      Course staff can delete a published course deck here at once, which the course route refuses
      (COURSE_DECK_NOT_DRAFT): finding deck-manage-private-reaches-course-decks. Progress orphans: finding
      progress-orphans.
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:418

  withdrawDeckPublication:
    route: DELETE /flashcard/decks/{id}/publish-request
    summary: "Withdraw a publication request, or take a public deck back"
    description: >-
      A PENDING or REJECTED deck goes back to PRIVATE. A PUBLISHED deck goes back to PRIVATE at once, isPublic false in
      the same write. The last reviewer's answer is cleared either way.
    needs: "a signed-in caller holding deck.manage_private on the deck (byParam flashcard-deck) (AuthGuard, AuthzGuard); held by the deck's author and, on a course deck, by its course staff; the SYSTEM_ADMIN passes on any deck, refused only on a write to another person's private one (authz.service.ts:222-253)"
    result: { returns: Deck }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      DECK_NOT_FOUND: { status: 404, note: "no such deck, or a private deck the caller did not write and is not shared with: the same answer for both, on purpose. The SYSTEM_ADMIN skips the guard's relation check and meets the service's own 404 for an absent deck (flashcard-deck.service.ts:294)", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:306 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller can see the resource but holds no code that allows this", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "a path id that is not a uuid; only the SYSTEM_ADMIN reaches the pipe with one, everyone else is refused 403 by the guard first (the PUBLIC relation holds no write code)", source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:441 }
      DECK_PUBLISH_STATE_CONFLICT: { status: 409, note: "the deck is PRIVATE already (nothing to withdraw), or its status moved between the read and the write", source: apps/tedrisat/src/flashcard/flashcard-deck.service.ts:296 }
    note: >-
      flashcard-deck.service.ts:292-329 and flashcard-deck.repository.ts:220-257. No notification and no audit row.
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:439

  uncollectDeck:
    route: DELETE /flashcard/decks/{id}/collections
    summary: "Take a deck out of the caller's collection"
    description: >-
      Deletes the caller's own decks_users row for the deck. It answers 200 whether or not there was a row.
    needs: "a signed-in caller: AuthGuard and AuthzGuard, with @AuthzExempt (the caller's own row; leaving must not depend on still being allowed to read the deck)"
    result: { returns: DeckUser, note: "the deleted row; an empty body, still 200, when the caller had not collected the deck (the repository returns undefined). Derived by reading, not run" }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      HTTP_400: { status: 400, note: "a path id that is not a uuid (ParseUUIDPipe)", source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:460 }
    note: >-
      Code: flashcard-deck.repository.ts:268-277.
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:457

  getCard:
    route: GET /flashcard/cards/{id}
    summary: "One card"
    description: >-
      Anyone who may read the card's deck: the author, anyone for a public deck, a talebe the deck is shared with, the
      SYSTEM_ADMIN. With include=progress the card carries the caller's own progress rows.
    needs: "a signed-in caller holding deck.view on the card's parent deck (byParentDeckOfCard) (AuthGuard, AuthzGuard)"
    query: { type: object, properties: { include: { type: string, enum: [progress], note: "a comma list; only progress is honoured" } } }
    result: { returns: Flashcard, note: "with progress: [{ flashcardId, status, userId, dueAt, intervalDays, reviewedAt }] when include=progress" }
    refusals:
      CARD_NOT_FOUND: { status: 404, note: "no such card, or a card of a private deck the caller did not write and is not shared with: the same answer for both. The SYSTEM_ADMIN sees every card", source: apps/tedrisat/src/flashcard/flashcard.service.ts:98 }
      AUTHZ_RESOLVER_ERROR: { status: 500, note: "a card id that is not a uuid: the resolver's query fails in Postgres before any pipe runs and the guard wraps it. Derived by reading, not run (finding card-id-not-uuid-500)", source: libs/common/src/authz/authz.guard.ts:120 }
      HTTP_404: { status: 404, note: "could not find card #id: the card was deleted between the guard and the handler", source: apps/tedrisat/src/flashcard/flashcard.controller.ts:121 }
    sideEffects:
      - "audit:deck.admin_read, when the SYSTEM_ADMIN reads another person's private deck: the guard writes it before the handler runs (libs/common/src/authz/authz.service.ts:234)"
    note: >-
      Course staff who did not write the deck and are not enrolled meet CARD_NOT_FOUND here: the resolver
      (flashcard.service.ts:86) knows the author, public decks and the shared-with rule, not the course staff rule
      (finding course-deck-staff-card-routes-404).
    source: apps/tedrisat/src/flashcard/flashcard.controller.ts:106

  listDeckCards:
    route: GET /flashcard/cards
    summary: "The cards of a deck"
    description: >-
      Every card of the deck, with no paging. Anonymous callers get the cards of a public deck and never any progress; a
      signed-in caller gets their own progress rows with include=progress.
    needs: "anyone, with or without a token: AuthGuard and AuthzGuard with @Authz(deck.view, the deck named by the deckId query parameter (byQuery flashcard-deck)) and @AuthzPublic; with no token only the anonymous relation is decided, so only public decks pass"
    query: { type: object, required: [deckId], properties: { deckId: { type: string, format: uuid, references: Deck }, include: { type: string, enum: [progress], note: "a comma list; only progress is honoured" } } }
    result: { type: array, items: { type: object, references: Flashcard } }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      DECK_NOT_FOUND: { status: 404, note: "no such deck (resolver :290), or a private deck the caller did not write and is not shared with (:303): the same answer for both. An anonymous caller meets it for every non-public deck. The SYSTEM_ADMIN is never refused: for an absent deck it gets 200 [] (the guard's bypass and the handler check nothing)", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:306 }
      HTTP_400: { status: 400, note: "deckId is missing or not a string (the guard, libs/common/src/authz/resolvers.ts:19), or not a uuid (ParseUUIDPipe)", source: apps/tedrisat/src/flashcard/flashcard.controller.ts:151 }
    sideEffects:
      - "audit:deck.admin_read, when the SYSTEM_ADMIN reads another person's private deck: the guard writes it before the handler runs (libs/common/src/authz/authz.service.ts:234)"
    note: >-
      The deck id in the query scopes the route; the userId threaded into the repository only narrows the progress
      relation (flashcard.controller.ts:155).
    source: apps/tedrisat/src/flashcard/flashcard.controller.ts:148

  getStudyRound:
    route: GET /flashcard/decks/{id}/due
    summary: "Today's study round of a deck"
    description: >-
      The cards of the deck waiting for a repeat (at most 50, the oldest due first, never-rated LEARNING cards first),
      then the cards the caller has not started (at most 10, oldest first). Every card carries the caller's own progress
      row, or none.
    needs: "a signed-in caller holding deck.view on the deck (byParam flashcard-deck) (AuthGuard, AuthzGuard); not @AuthzPublic, so a caller with no token is refused 401"
    result:
      type: object
      required: [cards, dueCount, newCount]
      properties:
        cards:
          type: array
          items: { type: object, references: Flashcard, note: "the card with progress: [the caller's row] or []" }
        dueCount: { type: integer, note: "how many of cards are repeats that are due" }
        newCount: { type: integer, note: "how many of cards the caller has not started" }
    refusals:
      DECK_NOT_FOUND: { status: 404, note: "no such deck (resolver :290), or a private deck the caller did not write and is not shared with (:303): the same answer for both. The SYSTEM_ADMIN is never refused: for an absent deck it gets an empty round, 200 { cards: [], dueCount: 0, newCount: 0 }", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:306 }
      HTTP_400: { status: 400, note: "a path id that is not a uuid (ParseUUIDPipe)", source: apps/tedrisat/src/flashcard/flashcard.controller.ts:178 }
    sideEffects:
      - "audit:deck.admin_read, when the SYSTEM_ADMIN reads another person's private deck: the guard writes it before the handler runs (libs/common/src/authz/authz.service.ts:234)"
    note: >-
      flashcard.repository.ts:181-228. The route is declared in FlashcardController, beside GET /flashcard/decks/due of
      the deck controller, which has no deck id.
    source: apps/tedrisat/src/flashcard/flashcard.controller.ts:175

  createCards:
    route: POST /flashcard/decks/{deckId}/cards
    summary: "Add cards to a deck (a JSON array)"
    description: >-
      Writes one card per element, authored by the caller. An empty array is accepted and answers []. The card's type is
      not compared with the deck's card type, and there is no cap on the length of the array.
    needs: "a signed-in caller holding deck.create_card on the deck (byParam flashcard-deck, deckId) (AuthGuard, AuthzGuard); held by the deck's author and, on a course deck, by its course staff; the SYSTEM_ADMIN passes on any deck, refused only on a write to another person's private one (authz.service.ts:222-253)"
    body:
      type: array
      items:
        type: object
        required: [type, contentFront, contentBack]
        properties:
          type: { enum: [VOCABULARY, HADEETH] }
          contentFront: { type: string, minLength: 3, maxLength: 5000 }
          contentBack: { type: string, minLength: 3, maxLength: 5000 }
          contentMeta: { type: object }
    result: { status: 201, type: array, items: { type: object, references: Flashcard } }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      DECK_NOT_FOUND: { status: 404, note: "no such deck (resolver :290), or a private deck the caller did not write and is not shared with (:303): the same answer for both, on purpose", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:306 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller can see the resource but holds no code that allows this", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "the body is not an array, or an element breaks its bounds (ParseArrayPipe: only the first failure is reported, as an HTTP_400, never VALIDATION_ERROR), or the deckId is not a uuid (:202; only the SYSTEM_ADMIN reaches the pipe with that)", source: apps/tedrisat/src/flashcard/flashcard.controller.ts:203 }
      INTERNAL_ERROR: { status: 500, note: "an insert the database refuses: the SYSTEM_ADMIN naming an absent deck (the guard checks nothing for it and the handler no more, so the foreign key fails), or an element with an id that is not a uuid or is taken, or with a createdAt or updatedAt (drizzle calls toISOString on a string). Derived by reading, not run (finding card-create-extra-columns)", source: apps/tedrisat/src/flashcard/flashcard.repository.ts:119 }
    note: >-
      ParseArrayPipe carries no whitelist, so an element's extra properties are not refused and are spread into the
      insert: a caller can set the new card's id (flashcard.service.ts:108; a createdAt or updatedAt is a 500, since the
      timestamp columns call toISOString on the value). Derived by reading, not run: finding card-create-extra-columns.
      The bulk routes validate each row strictly.
    source: apps/tedrisat/src/flashcard/flashcard.controller.ts:199

  saveCardProgress:
    route: PUT /flashcard/cards/progress
    summary: "Record the caller's study progress on cards"
    description: >-
      Upserts the caller's progress row for each card, on (user, card). With a rating the server works out the status,
      the next due time and the interval, and ignores any status sent. With a bare status it stores it with no due time.
      The caller's id always wins over any userId in the body.
    needs: "a signed-in caller: AuthGuard and AuthzGuard, with @AuthzExempt (the body names cards in any number of decks, so the check is the service's, flashcard.service.ts:228, and the SYSTEM_ADMIN gets no exception)"
    body:
      type: array
      items:
        type: object
        required: [flashcardId]
        properties:
          flashcardId: { type: string, format: uuid, references: Flashcard }
          status: { enum: [NEW, LEARNING, MASTERED], note: "required unless rating is sent; ignored when it is" }
          rating: { enum: [HARD, MEDIUM, EASY], note: "HARD: LEARNING, back in 1 day; MEDIUM: LEARNING, max(3, last gap) days; EASY: MASTERED, max(7, 2 x last gap) days; every gap at most 180 (invariant card-review-schedule)" }
    result:
      type: array
      items: { type: object, references: FlashcardProgress }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      CARD_NOT_FOUND: { status: 404, note: "a card id in the body has no card", source: apps/tedrisat/src/flashcard/flashcard.service.ts:238 }
      AUTHZ_FORBIDDEN: { status: 403, note: "a card's deck is private and neither the caller's nor shared with them (the SYSTEM_ADMIN too, MDRS-148)", source: apps/tedrisat/src/flashcard/flashcard.service.ts:242 }
      HTTP_400: { status: 400, note: "the body is not an array, an element has no uuid flashcardId, or has neither a status nor a rating, or names an unknown status or rating (ParseArrayPipe)", source: apps/tedrisat/src/flashcard/flashcard.controller.ts:237 }
      INTERNAL_ERROR: { status: 500, note: "an empty array passes every check and reaches insert().values([]), which drizzle refuses; or the same flashcardId twice in one body, which one multi-row INSERT ... ON CONFLICT DO UPDATE cannot do (Postgres: cannot affect row a second time; the service de-duplicates only for the visibility check). Derived by reading, not run (finding accepted-write-500)", source: apps/tedrisat/src/flashcard/flashcard.repository.ts:150 }
    note: >-
      Extra properties of an element are neither stripped nor refused (the array pipe has no whitelist,
      flashcard.service.ts:146). The upsert is flashcard.repository.ts:145-162.
    source: apps/tedrisat/src/flashcard/flashcard.controller.ts:234

