      CARD_NOT_FOUND: { status: 404, note: "no such card, or a card of a private deck the caller did not write and is not shared with: the same answer for both. Also the answer to course staff who did not write the deck and are not enrolled (finding course-deck-staff-card-routes-404). The SYSTEM_ADMIN is never given it for a private deck: the resolver skips the check for it, and the guard then refuses a write on another person's private deck with AUTHZ_FORBIDDEN", source: apps/tedrisat/src/flashcard/flashcard.service.ts:98 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the card is readable but the caller does not manage the deck's cards", source: libs/common/src/authz/authz.guard.ts:92 }
      AUTHZ_RESOLVER_ERROR: { status: 500, note: "a card id that is not a uuid (see getCard). Derived by reading, not run (finding card-id-not-uuid-500)", source: libs/common/src/authz/authz.guard.ts:120 }
    source: apps/tedrisat/src/flashcard/flashcard.controller.ts:318

  createCardsBulk:
    route: POST /flashcard/decks/{deckId}/cards/bulk
    summary: "Add cards to a deck (a JSON array, every bad row reported)"
    description: >-
      Writes up to 1000 cards in one insert, authored by the caller, and answers how many. Every row is validated with
      whitelist and forbidNonWhitelisted, and all the bad rows are reported at once, with their spreadsheet row numbers
      (row = index + 2).
    needs: "a signed-in caller holding deck.create_card on the deck (byParam flashcard-deck, deckId) (AuthGuard, AuthzGuard); held by the deck's author and, on a course deck, by its course staff; its own bulk throttle; the SYSTEM_ADMIN passes on any deck, refused only on a write to another person's private one (authz.service.ts:222-253)"
    body:
      type: array
      maxItems: 1000
      items:
        type: object
        required: [type, contentFront, contentBack]
        additionalProperties: false
        properties:
          type: { enum: [VOCABULARY, HADEETH], note: "not compared with the deck's cardType (finding no-card-type-match)" }
          contentFront: { type: string, minLength: 3, maxLength: 5000 }
          contentBack: { type: string, minLength: 3, maxLength: 5000 }
          contentMeta: { type: object, note: "free JSON; any object" }
    result: { type: object, required: [count], properties: { count: { type: integer } }, status: 201 }
    refusals:
      DECK_NOT_FOUND: { status: 404, note: "no such deck (resolver :290), or a private deck the caller did not write and is not shared with (:303): the same answer for both, on purpose", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:306 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller can see the resource but holds no code that allows this", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "the body is not an array (ParseArrayPipe), or the deckId is not a uuid (only the SYSTEM_ADMIN reaches the pipe with that)", source: apps/tedrisat/src/flashcard/flashcard.controller.ts:364 }
      BULK_PAYLOAD_INVALID: { status: 400, note: "the array is empty", source: apps/tedrisat/src/flashcard/flashcard-bulk.service.ts:51 }
      BULK_ROW_LIMIT_EXCEEDED: { status: 422, note: "more than 1000 rows; context.errors names row 1002", source: apps/tedrisat/src/flashcard/flashcard-bulk.service.ts:54 }
      BULK_VALIDATION_ERROR: { status: 422, note: "any row breaks its bounds or carries an unknown property; context.errors lists every bad row as { row, errors: [{ field, message }] }", source: apps/tedrisat/src/flashcard/flashcard.controller.ts:376 }
      HTTP_429: { status: 429, note: "over the bulk budget of this route: 10 requests per window per user and route (THROTTLE_BULK_LIMIT, THROTTLE_BULK_TTL; the per-user window when unset), with Retry-After", source: apps/tedrisat/src/config/throttle-env.ts:156 }
      INTERNAL_ERROR: { status: 500, note: "three cases, derived by reading and not run (finding accepted-write-500): the SYSTEM_ADMIN naming an absent deck (no check anywhere, so the insert breaks the foreign key); a null element, [null], whose validation reads null.constructor; and a JSON body over 100 KB, the express default since no limit is set, whose PayloadTooLargeError nothing maps, so 1000 cards of any length can hit it", source: apps/tedrisat/src/flashcard/flashcard-bulk.service.ts:57 }
    note: >-
      The card type is not compared with the deck's card type (finding no-card-type-match).
    source: apps/tedrisat/src/flashcard/flashcard.controller.ts:350

  downloadCardSample:
    route: GET /flashcard/cards/bulk/sample
    summary: "Download the card import template"
    description: >-
      A workbook (or a CSV) named sample.<format> with a sheet Cards, the header row Card Type, Content Front, Content
      Back and two example rows, one HADEETH and one VOCABULARY. Cells that start with = + - @ tab or CR are prefixed
      with a quote.
    needs: "a signed-in caller: AuthGuard and AuthzGuard, with @AuthzExempt (the route reads no user data)"
    query: { type: object, properties: { format: { type: string, default: xlsx, note: "xlsx or csv, not validated: any other value is written as csv and named sample.<value>" } } }
    result: { status: 200, type: string, format: binary, note: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, or text/csv; Content-Disposition: attachment; filename=sample.<format>" }
    note: >-
      Code: libs/common/src/excel/excel.service.ts:70-88.
    source: apps/tedrisat/src/flashcard/flashcard.controller.ts:386
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }

  exportCards:
    route: GET /flashcard/decks/{deckId}/cards/bulk/export
    summary: "Export the cards of a deck"
    description: >-
      A workbook (or a CSV) of the deck's cards, in the template's three columns. The file is named after the deck's
      title with every character other than letters, digits, underscore and hyphen replaced by an underscore. Cells that
      start with = + - @ tab or CR are prefixed with a quote, so a formula in a card is text.
    needs: "a signed-in caller holding deck.manage_cards on the deck (byParam flashcard-deck, deckId) (AuthGuard, AuthzGuard); its own bulk throttle; then the handler asks that the caller is the deck's author"
    query: { type: object, properties: { format: { type: string, default: xlsx, note: "xlsx or csv, not validated: any other value is written as csv" } } }
    result: { status: 200, type: string, format: binary, note: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, or text/csv; Content-Disposition: attachment; filename=<title>.<format>" }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      DECK_NOT_FOUND: { status: 404, note: "no such deck, or a private deck the caller did not write and is not shared with: the same answer for both, on purpose. The SYSTEM_ADMIN skips the guard's relation check and meets the service's own 404 for an absent deck (flashcard-deck.service.ts:224)", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:306 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller can see the resource but holds no code that allows this", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "the deckId is not a uuid (only the SYSTEM_ADMIN reaches the pipe with that)", source: apps/tedrisat/src/flashcard/flashcard.controller.ts:430 }
      DECK_FORBIDDEN: { status: 403, note: "the caller passed the guard (the deck's course staff, or the SYSTEM_ADMIN on a public deck) but is not the deck's author: an export is an owner's affordance (finding export-refused-to-staff)", source: apps/tedrisat/src/flashcard/flashcard-deck.service.ts:227 }
      HTTP_429: { status: 429, note: "over the bulk budget of this route: 10 requests per window per user and route (THROTTLE_BULK_LIMIT, THROTTLE_BULK_TTL; the per-user window when unset), with Retry-After", source: apps/tedrisat/src/config/throttle-env.ts:156 }
    note: >-
      flashcard.controller.ts:445 asks findOwned. A reader of a public deck is refused by the guard already
      (AUTHZ_FORBIDDEN).
    source: apps/tedrisat/src/flashcard/flashcard.controller.ts:411

  importCards:
    route: POST /flashcard/decks/{deckId}/cards/bulk/import
    summary: "Add cards to a deck from a workbook or a CSV"
    description: >-
      Reads the first sheet of the file, matches the header names without regard to case (Card Type, Content Front,
      Content Back), skips empty rows, removes the quote that export puts before a formula trigger, and writes the rows
      as bulk does, up to 1000.
    needs: "a signed-in caller holding deck.create_card on the deck (byParam flashcard-deck, deckId) (AuthGuard, AuthzGuard); held by the deck's author and, on a course deck, by its course staff; its own bulk throttle. The guard runs before the upload is buffered; the SYSTEM_ADMIN passes on any deck, refused only on a write to another person's private one (authz.service.ts:222-253)"
    body:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, note: "multipart/form-data field file: at most 5 MB; content type the xlsx type, text/csv, text/plain, application/octet-stream or application/vnd.ms-excel (the magic number is not checked); csv for the three text-like types unless the name ends in .xlsx, else xlsx" }
    result: { type: object, required: [count], properties: { count: { type: integer } }, status: 201 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      DECK_NOT_FOUND: { status: 404, note: "no such deck (resolver :290), or a private deck the caller did not write and is not shared with (:303): the same answer for both, on purpose", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:306 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller can see the resource but holds no code that allows this", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "the deckId is not a uuid (only the SYSTEM_ADMIN reaches the pipe with that); no file; a file over 5 MB or of another content type (ParseFilePipe); or a file with a header and no data rows (flashcard.controller.ts:520)", source: apps/tedrisat/src/flashcard/flashcard.controller.ts:489 }
      BULK_ROW_LIMIT_EXCEEDED: { status: 422, note: "more than 1000 data rows; context.errors names row 1002", source: apps/tedrisat/src/flashcard/flashcard-bulk.service.ts:54 }
      BULK_VALIDATION_ERROR: { status: 422, note: "any row breaks its bounds; context.errors lists every bad row", source: apps/tedrisat/src/flashcard/flashcard.controller.ts:529 }
      HTTP_429: { status: 429, note: "over the bulk budget of this route: 10 requests per window per user and route (THROTTLE_BULK_LIMIT, THROTTLE_BULK_TTL; the per-user window when unset), with Retry-After", source: apps/tedrisat/src/config/throttle-env.ts:156 }
      INTERNAL_ERROR: { status: 500, note: "a file the workbook reader cannot open, including a CSV sent as application/vnd.ms-excel, which detectFormat reads as xlsx (excel.service.ts:257-264); and the SYSTEM_ADMIN naming an absent deck, whose insert breaks the foreign key after the file was parsed. Derived by reading, not run (finding accepted-write-500)", source: libs/common/src/excel/excel.service.ts:183 }
    note: >-
      BULK_PAYLOAD_INVALID cannot come from this route: an empty file is refused before as HTTP_400.
    source: apps/tedrisat/src/flashcard/flashcard.controller.ts:461

  createCardLabel:
