        cardType: { enum: [VOCABULARY, HADEETH], note: "fixed once the deck exists" }
        weekId: { type: string, format: uuid, references: CourseWeek }
        draft: { type: boolean, default: false, note: "a draft is seen by the course's staff only" }
    result: { type: object, required: [id], properties: { id: { type: string, format: uuid, references: Deck } }, status: 201 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      COURSE_NOT_FOUND: { status: 404, note: "no such course, or the course sits in a hidden köşk, which is closed to everyone but holders of course.hide and platform.kosk_edit. The SYSTEM_ADMIN is not refused by either: for an absent course the staff and talebe lists answer 200 [], an update or a delete answers DECK_NOT_FOUND, and a create fails (see there)", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:400 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller holds no deck.manage_course in the course", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "a course id that is not a uuid; only the SYSTEM_ADMIN reaches the pipe with one, everyone else is refused 403 by the guard first (the PUBLIC relation holds no course code)", source: apps/tedrisat/src/flashcard/course-decks.controller.ts:89 }
      VALIDATION_ERROR: { status: 400, note: "title shorter than 5 or longer than 100, no or an unknown cardType, a weekId that is not a uuid, a description over 1000, or an unknown property", source: libs/common/src/pipes/validation.pipe.ts:40 }
      COURSE_WEEK_NOT_IN_COURSE: { status: 400, note: "weekId is not a shown (not hidden) week of this course", source: apps/tedrisat/src/flashcard/course-deck.service.ts:156 }
      INTERNAL_ERROR: { status: 500, note: "the SYSTEM_ADMIN naming an absent course: the guard checks no course for it, so the insert breaks the foreign key decks.course_id. Derived by reading, not run (finding accepted-write-500)", source: apps/tedrisat/src/flashcard/course-deck.repository.ts:98 }
    source: apps/tedrisat/src/flashcard/course-decks.controller.ts:86

  updateCourseDeck:
    route: PATCH /courses/{id}/decks/{deckId}
    summary: "Edit a deck of a course"
    description: >-
      Sets the title, description, week and draft that are sent, and answers the refreshed row of the staff list. weekId
      null takes the deck out of its week. Setting draft true takes a published deck from the talebe and keeps their
      progress.
    needs: "a signed-in caller holding deck.manage_course on the course (byParam course) (AuthGuard, AuthzGuard); held by the müderris of the course, the başmüderris of its medrese, the nazım of its köşk, or a grant"
    body:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 5, maxLength: 100 }
        description: { type: [string, "null"], maxLength: 1000 }
        weekId: { type: [string, "null"], format: uuid, references: CourseWeek, note: "null takes the deck out of its week" }
        draft: { type: boolean }
    result:
      type: object
      required: [id, title, cardType, cardCount, draft, masteredRatio, enrolledCount]
      properties:
        id: { type: string, format: uuid, references: Deck }
        title: { type: string }
        description: { type: [string, "null"] }
        cardType: { enum: [VOCABULARY, HADEETH] }
        cardCount: { type: integer }
        weekId: { type: [string, "null"], format: uuid, references: CourseWeek }
        weekNumber: { type: [integer, "null"] }
        draft: { type: boolean, note: "Deck.courseDraft" }
        masteredRatio: { type: number, minimum: 0, maximum: 1, note: "MASTERED progress rows of the ENROLLED and COMPLETED talebe over cardCount x enrolledCount, capped at 1; 0 when either is 0" }
        enrolledCount: { type: integer, note: "the course's enrollments with status ENROLLED or COMPLETED" }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      COURSE_NOT_FOUND: { status: 404, note: "no such course, or the course sits in a hidden köşk, which is closed to everyone but holders of course.hide and platform.kosk_edit. The SYSTEM_ADMIN is not refused by either: for an absent course the staff and talebe lists answer 200 [], an update or a delete answers DECK_NOT_FOUND, and a create fails (see there)", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:400 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller holds no deck.manage_course in the course", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "a course id or a deckId that is not a uuid; the course id reaches the pipe only for the SYSTEM_ADMIN (everyone else is refused 403 by the guard first), the deckId (:109) for any caller who passed the guard", source: apps/tedrisat/src/flashcard/course-decks.controller.ts:108 }
      VALIDATION_ERROR: { status: 400, note: "a bound is broken, a cardType is sent (it is fixed), or an unknown property is sent", source: libs/common/src/pipes/validation.pipe.ts:40 }
      DECK_NOT_FOUND: { status: 404, note: "the deck does not belong to this course (or is absent)", source: apps/tedrisat/src/flashcard/course-deck.service.ts:145 }
      COURSE_WEEK_NOT_IN_COURSE: { status: 400, note: "weekId is not a shown week of this course", source: apps/tedrisat/src/flashcard/course-deck.service.ts:156 }
      INTERNAL_ERROR: { status: 500, note: "title or draft sent as JSON null: @IsOptional lets null through and the update writes NULL into a NOT NULL column (an empty body {} is fine here, updatedAt is always set). Derived by reading, not run (finding accepted-write-500)", source: apps/tedrisat/src/flashcard/course-deck.repository.ts:114 }
    note: >-
      The refreshed row is looked up in the staff list afterwards; a deck that is gone by then answers DECK_NOT_FOUND
      from course-deck.service.ts:125 too.
    source: apps/tedrisat/src/flashcard/course-decks.controller.ts:106

  deleteCourseDeck:
