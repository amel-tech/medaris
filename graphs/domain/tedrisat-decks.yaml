    needs: "a signed-in caller, who must own the label and be able to read the card's deck (AuthGuard only; the service asserts both)"
    body:
      type: object
      required: [labelId, flashcardId]
      additionalProperties: false
      properties:
        labelId: { type: string, format: uuid, references: FlashcardLabel }
        flashcardId: { type: string, format: uuid, references: Flashcard }
        privateToUserId: { type: [string, "null"], format: uuid, default: null }
    result: { returns: FlashcardLabeling, status: 201 }
    refusals:
      VALIDATION_ERROR: { status: 400, note: "labelId, flashcardId or privateToUserId is not a uuid, or an unknown property is sent (createdBy included)", source: libs/common/src/pipes/validation.pipe.ts:40 }
      FLASHCARD_LABEL_NOT_FOUND: { status: 404, note: "no such label", source: apps/tedrisat/src/flashcard/flashcard-label.service.ts:47 }
      FLASHCARD_LABEL_FORBIDDEN: { status: 403, note: "the label belongs to someone else", source: apps/tedrisat/src/flashcard/flashcard-label.service.ts:50 }
      CARD_NOT_FOUND: { status: 404, note: "no such card", source: apps/tedrisat/src/flashcard/flashcard-label.service.ts:173 }
      DECK_FORBIDDEN: { status: 403, note: "the card's deck is private and neither the caller's nor shared with them: a 403, not the 404 that the card routes give (finding label-target-oracle)", source: apps/tedrisat/src/flashcard/flashcard-deck.service.ts:195 }
    note: >-
      The deck's own 404 (DECK_NOT_FOUND) cannot come first: the card exists, so its deck does, apart from a race. No
      route reads labelings back.
