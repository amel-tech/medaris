    result: { status: 204 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      COURSE_NOT_FOUND: { status: 404, note: "no such course, or the course sits in a hidden köşk, which is closed to everyone but holders of course.hide and platform.kosk_edit. The SYSTEM_ADMIN is not refused by either: for an absent course the staff and talebe lists answer 200 [], an update or a delete answers DECK_NOT_FOUND, and a create fails (see there)", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:400 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller holds no deck.manage_course in the course", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "a course id or a deckId that is not a uuid; the course id reaches the pipe only for the SYSTEM_ADMIN (everyone else is refused 403 by the guard first), the deckId (:130) for any caller who passed the guard", source: apps/tedrisat/src/flashcard/course-decks.controller.ts:129 }
      DECK_NOT_FOUND: { status: 404, note: "the deck does not belong to this course (or is absent)", source: apps/tedrisat/src/flashcard/course-deck.service.ts:145 }
      COURSE_DECK_NOT_DRAFT: { status: 409, note: "the deck is published: set draft true first", source: apps/tedrisat/src/flashcard/course-deck.service.ts:136 }
    note: >-
