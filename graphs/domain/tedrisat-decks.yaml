          masteredRatio: { type: number, minimum: 0, maximum: 1, note: "MASTERED progress rows of the ENROLLED and COMPLETED talebe over cardCount x enrolledCount, capped at 1; 0 when either is 0" }
          enrolledCount: { type: integer, note: "the course's enrollments with status ENROLLED or COMPLETED" }
    refusals:
      COURSE_NOT_FOUND: { status: 404, note: "no such course, or the course sits in a hidden köşk, which is closed to everyone but holders of course.hide and platform.kosk_edit. The SYSTEM_ADMIN is not refused by either: for an absent course the staff and talebe lists answer 200 [], an update or a delete answers DECK_NOT_FOUND, and a create fails (see there)", source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:400 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller holds no deck.manage_course in the course (a talebe, a pending applicant, a stranger)", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "a course id that is not a uuid; only the SYSTEM_ADMIN reaches the pipe with one, everyone else is refused 403 by the guard first (the PUBLIC relation holds no course code)", source: apps/tedrisat/src/flashcard/course-decks.controller.ts:70 }
    note: >-
      Code: course-deck.service.ts:30-56.
    source: apps/tedrisat/src/flashcard/course-decks.controller.ts:68

  createCourseDeck:
    route: POST /courses/{id}/decks
    summary: "Open a deck of a course"
    description: >-
      The caller becomes the author. The deck is private, not public, and shown to the talebe unless draft is true. A
      week, when named, must be one of the course's shown weeks. The cards are added afterwards through the card routes.
    needs: "a signed-in caller holding deck.manage_course on the course (byParam course) (AuthGuard, AuthzGuard); held by the müderris of the course, the başmüderris of its medrese, the nazım of its köşk, or a grant"
    body:
      type: object
      required: [title, cardType]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 5, maxLength: 100 }
