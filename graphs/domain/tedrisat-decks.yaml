    refusals:
      VALIDATION_ERROR: { status: 400, note: "title shorter than 5 or longer than 100, a scope other than PUBLIC or PERSONAL, or an unknown property (userId and createdBy included)", source: libs/common/src/pipes/validation.pipe.ts:40 }
    note: >-
