  getManagedKoskDecks:
    route: GET /kosks/{id}/decks/manage
    summary: "A köşk's decks and the proposals waiting for an answer"
    description: >-
      The köşk's shown decks, newest update first, with their card counts, and the müderris proposals nobody has
      answered, oldest first. Both lists are cut by page and limit; the two totals count every one.
    needs: "a signed-in caller (AuthGuard only: no AuthzGuard); the service then asks that the köşk exists and that the caller is the SYSTEM_ADMIN or holds KOSK_NAZIM in it (DeckReviewService.assertKoskNazim)"
    query:
      type: object
      properties:
        page: { type: integer, default: 1, note: "below 1 reads as 1; a non-integer is refused" }
        limit: { type: integer, default: 12, note: "clamped to 1..50, not refused" }
    result:
      type: object
      required: [decks, proposals, decksTotal, proposalsTotal]
      properties:
        decks:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid, references: Deck }
              title: { type: string }
              description: { type: [string, "null"] }
              cardType: { enum: [VOCABULARY, HADEETH] }
              cardCount: { type: integer }
              updatedAt: { type: string, format: date-time }
        proposals:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid, references: DeckProposal }
              koskId: { type: string, format: uuid, references: Kosk, note: "on the wire although the response DTO does not declare it: the repository's rows are returned unmapped" }
              title: { type: string }
              description: { type: [string, "null"] }
              cardType: { enum: [VOCABULARY, HADEETH] }
              status: { enum: [PENDING], note: "always PENDING in this list; on the wire although the response DTO does not declare it" }
              proposedBy: { type: object, properties: { id: { type: string, format: uuid }, name: { type: [string, "null"] } } }
              courseTitle: { type: [string, "null"] }
              createdAt: { type: string, format: date-time }
        decksTotal: { type: integer, note: "every shown deck of the köşk, not the page" }
        proposalsTotal: { type: integer, note: "every proposal nobody has answered, not the page" }
    refusals:
      HTTP_400: { status: 400, note: "the id is not a uuid, or page or limit is not an integer (ParseUUIDPipe, ParseIntPipe)", source: apps/tedrisat/src/deck-review/kosk-decks.controller.ts:71 }
      KOSK_NOT_FOUND: { status: 404, note: "no such köşk", source: apps/tedrisat/src/deck-review/deck-review.service.ts:355 }
      DECK_REVIEW_FORBIDDEN: { status: 403, note: "You are not a nazım of this köşk", source: apps/tedrisat/src/deck-review/deck-review.service.ts:359 }
    note: >-
      deck-review.service.ts:199-217 and deck-review.repository.ts:342-370 and :437-497. The permissions
      deck.manage_kosk and deck.propose_kosk are not consulted here or anywhere (finding deck-manage-kosk-unused).
    source: apps/tedrisat/src/deck-review/kosk-decks.controller.ts:68

  createKoskDeck:
    route: POST /kosks/{id}/decks
    summary: "Open a köşk deck"
    description: >-
      Writes a private deck of the köşk with the caller as its author. With proposalId the same transaction marks the
      proposal ACCEPTED, with the new deck on it; a proposal answered in the meantime rolls the deck back. The cards are
      added afterwards through the card routes, by the creating nazım.
    needs: "a signed-in caller (AuthGuard only: no AuthzGuard); the service then asks that the köşk exists and that the caller is the SYSTEM_ADMIN or holds KOSK_NAZIM in it (DeckReviewService.assertKoskNazim)"
    body:
      type: object
      required: [title, cardType]
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200, pattern: "\\S", note: "not blank; trimmed" }
        description: { type: string, maxLength: 1000 }
        cardType: { enum: [VOCABULARY, HADEETH] }
        proposalId: { type: string, format: uuid, references: DeckProposal, note: "the proposal this deck answers" }
    result: { type: object, required: [id], properties: { id: { type: string, format: uuid, references: Deck } }, status: 201 }
    refusals:
      HTTP_400: { status: 400, note: "the köşk id is not a uuid", source: apps/tedrisat/src/deck-review/kosk-decks.controller.ts:92 }
      VALIDATION_ERROR: { status: 400, note: "title blank or over 200 characters, a description over 1000, no or an unknown cardType, a proposalId that is not a uuid, or an unknown property", source: libs/common/src/pipes/validation.pipe.ts:40 }
      KOSK_NOT_FOUND: { status: 404, note: "no such köşk", source: apps/tedrisat/src/deck-review/deck-review.service.ts:355 }
      DECK_REVIEW_FORBIDDEN: { status: 403, note: "You are not a nazım of this köşk", source: apps/tedrisat/src/deck-review/deck-review.service.ts:359 }
      DECK_PROPOSAL_NOT_FOUND: { status: 404, note: "no such proposal in this köşk", source: apps/tedrisat/src/deck-review/deck-review.service.ts:227 }
      DECK_PROPOSAL_NOT_PENDING: { status: 409, note: "the proposal was answered already, or while the deck was being made", source: apps/tedrisat/src/deck-review/deck-review.service.ts:229 }
    note: >-
      Accepting a proposal does not notify the proposer (only a rejection does). A second nazım of the köşk is a
      stranger to a deck the first made when it comes to its cards (finding deck-manage-kosk-unused).
      deck-review.service.ts:219-245, deck-review.repository.ts:377-421.
    source: apps/tedrisat/src/deck-review/kosk-decks.controller.ts:89

  proposeKoskDeck:
    route: POST /kosks/{id}/deck-proposals
    summary: "Suggest a deck for a köşk"
    description: >-
      Writes a PENDING proposal for the köşk, tied to one of the proposer's courses there: the one named, else the first
      that matches. The köşk's nazım who is not also a müderris of a course there is refused.
    needs: "a signed-in caller (AuthGuard only: no AuthzGuard); the service asks that the köşk exists and that the caller holds MUDERRIS on a course of it that is not hidden (DeckReviewRepository.muderrisCourseInKosk)"
    body:
      type: object
      required: [title, cardType]
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200, pattern: "\\S", note: "not blank; trimmed" }
        description: { type: string, maxLength: 1000 }
        cardType: { enum: [VOCABULARY, HADEETH] }
        courseId: { type: string, format: uuid, references: Course, note: "one of the proposer's courses in this köşk; the first match when omitted" }
    result: { type: object, required: [id], properties: { id: { type: string, format: uuid, references: DeckProposal } }, status: 201 }
    refusals:
      HTTP_400: { status: 400, note: "the köşk id is not a uuid", source: apps/tedrisat/src/deck-review/kosk-decks.controller.ts:110 }
      VALIDATION_ERROR: { status: 400, note: "title blank or over 200 characters, a description over 1000, no or an unknown cardType, a courseId that is not a uuid, or an unknown property", source: libs/common/src/pipes/validation.pipe.ts:40 }
      KOSK_NOT_FOUND: { status: 404, note: "no such köşk", source: apps/tedrisat/src/deck-review/deck-review.service.ts:295 }
      DECK_REVIEW_FORBIDDEN: { status: 403, note: "Only a müderris of a course in this köşk may propose a deck", source: apps/tedrisat/src/deck-review/deck-review.service.ts:303 }
    note: >-
      Nobody is told that a proposal was made: the nazım finds it in their list. Code: deck-review.service.ts:284-316.
    source: apps/tedrisat/src/deck-review/kosk-decks.controller.ts:107

  rejectKoskDeckProposal:
    route: POST /kosks/{id}/deck-proposals/{proposalId}/reject
    summary: "Refuse a deck proposal"
    description: >-
      Marks the PENDING proposal REJECTED with the reason, the decider and the time, and tells the proposer. A proposal
      answered already answers 409.
    needs: "a signed-in caller (AuthGuard only: no AuthzGuard); the service then asks that the köşk exists and that the caller is the SYSTEM_ADMIN or holds KOSK_NAZIM in it (DeckReviewService.assertKoskNazim)"
    body:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 1000, pattern: "\\S", note: "required and not blank; trimmed before it is stored and sent" }
    result: { status: 204 }
    refusals:
      HTTP_400: { status: 400, note: "the köşk id or the proposal id is not a uuid", source: apps/tedrisat/src/deck-review/kosk-decks.controller.ts:130 }
      VALIDATION_ERROR: { status: 400, note: "the reason is missing, blank or over 1000 characters, or an unknown property is sent", source: libs/common/src/pipes/validation.pipe.ts:40 }
      KOSK_NOT_FOUND: { status: 404, note: "no such köşk", source: apps/tedrisat/src/deck-review/deck-review.service.ts:355 }
      DECK_REVIEW_FORBIDDEN: { status: 403, note: "You are not a nazım of this köşk", source: apps/tedrisat/src/deck-review/deck-review.service.ts:359 }
      DECK_PROPOSAL_NOT_FOUND: { status: 404, note: "no such proposal in this köşk", source: apps/tedrisat/src/deck-review/deck-review.service.ts:271 }
      DECK_PROPOSAL_NOT_PENDING: { status: 409, note: "the proposal was answered already", source: apps/tedrisat/src/deck-review/deck-review.service.ts:274 }
    sideEffects:
      - "notification:DECK_PUBLISH_RESULT to the proposer, with no target and params { outcome: proposal_rejected, deckTitle, reason }; a failure to write it is logged and ignored (deck-review.service.ts:276, :363)"
    source: apps/tedrisat/src/deck-review/kosk-decks.controller.ts:126

  hideKoskDeck:
    route: POST /decks/{id}/hide
    summary: "Hide a köşk deck (Gizle)"
    description: >-
      Sets archivedAt, archivedBy and archivedLevel (platform for the SYSTEM_ADMIN, else kosk) on a shown deck that
      belongs to a köşk. Nothing is deleted: the deck moves to the köşk's archive, where a restore brings it back at the
      same level or above. A personal deck is never hidden here.
    needs: "a signed-in caller (AuthGuard only: no AuthzGuard); the service asks that the caller is the SYSTEM_ADMIN or holds KOSK_NAZIM in the deck's köşk"
    result: { status: 204 }
    refusals:
      HTTP_400: { status: 400, note: "the deck id is not a uuid", source: apps/tedrisat/src/deck-review/kosk-decks.controller.ts:150 }
      KOSK_DECK_NOT_FOUND: { status: 404, note: "no such deck, a deck with no köşk, or a deck that is hidden already", source: apps/tedrisat/src/deck-review/deck-review.service.ts:250 }
      DECK_REVIEW_FORBIDDEN: { status: 403, note: "You are not a nazım of this köşk", source: apps/tedrisat/src/deck-review/deck-review.service.ts:359 }
    note: >-
      KOSK_NOT_FOUND cannot come from this route: a deck's koskId is set to null with its köşk, so a deck that names a
      köşk has one (apart from a race). The deck is looked up before the caller's role is asked, so a caller who is no
      nazım learns from 404 versus 403 whether a köşk deck exists. No audit row is written, unlike the hide of a köşk,
      medrese, course, week or session (finding kosk-deck-hide-no-audit). deck-review.service.ts:247-261.
    source: apps/tedrisat/src/deck-review/kosk-decks.controller.ts:146

  listDeckPublishRequests:
    route: GET /nizam/deck-publish-requests
    summary: "Deck publish requests, waiting or answered"
    description: >-
      PENDING: the decks waiting for an answer, oldest request first. DECIDED: the decks that were published or refused,
      newest answer first. Hidden decks are left out. Both tab counts come with the page and count every request.
    needs: "a signed-in caller (AuthGuard only: no AuthzGuard); the service asks that the caller is the SYSTEM_ADMIN or holds platform.deck_publish (DeckReviewService.assertChief)"
    query:
      type: object
      properties:
        status: { enum: [PENDING, DECIDED], default: PENDING }
        page: { type: integer, default: 1, note: "below 1 reads as 1; a non-integer is refused" }
        limit: { type: integer, default: 12, note: "clamped to 1..50, not refused" }
    result:
      type: object
      required: [items, pendingCount, decidedCount]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid, references: Deck, note: "the deck's id" }
              title: { type: string }
              description: { type: [string, "null"] }
              cardType: { enum: [VOCABULARY, HADEETH] }
              cardCount: { type: integer }
              owner: { type: object, properties: { id: { type: string, format: uuid }, name: { type: [string, "null"] } } }
              requestedAt: { type: string, format: date-time, note: "falls back to the decision time, then the epoch, for a decided deck that kept no request time" }
              outcome: { enum: [PENDING, PUBLISHED, REJECTED] }
              decidedAt: { type: [string, "null"], format: date-time }
              rejectReason: { type: [string, "null"] }
        pendingCount: { type: integer }
        decidedCount: { type: integer }
    refusals:
      HTTP_400: { status: 400, note: "status is not PENDING or DECIDED, or page or limit is not an integer", source: apps/tedrisat/src/deck-review/nizam-deck-requests.controller.ts:80 }
      DECK_REVIEW_FORBIDDEN: { status: 403, note: "Only the Medaris başnazımı and a Medaris nazımı holding platform.deck_publish may review deck publish requests", source: apps/tedrisat/src/deck-review/deck-review.service.ts:332 }
    note: >-
      Code: deck-review.service.ts:74-85 and deck-review.repository.ts:109-190.
    source: apps/tedrisat/src/deck-review/nizam-deck-requests.controller.ts:74

  readDeckPublishRequestCards:
    route: GET /nizam/deck-publish-requests/{id}/cards
    summary: "The cards of a requested deck"
    description: >-
      Three sample cards, or every card with all=true, in creation order, with the total. The deck is private until it
      is published, so the read is written to the audit log before any card leaves.
    needs: "a signed-in caller (AuthGuard only: no AuthzGuard); the service asks that the caller is the SYSTEM_ADMIN or holds platform.deck_publish (DeckReviewService.assertChief)"
    query: { type: object, properties: { all: { type: boolean, default: false, note: "false reads a sample of 3 cards" } } }
    result: { type: object, required: [items, total], properties: { items: { type: array, items: { type: object, properties: { id: { type: string, format: uuid, references: Flashcard }, front: { type: string }, back: { type: string } } } }, total: { type: integer, note: "every card the deck holds" } } }
    refusals:
      HTTP_400: { status: 400, note: "the deck id is not a uuid, or all is not a boolean", source: apps/tedrisat/src/deck-review/nizam-deck-requests.controller.ts:113 }
      DECK_REVIEW_FORBIDDEN: { status: 403, note: "Only the Medaris başnazımı and a Medaris nazımı holding platform.deck_publish may review deck publish requests", source: apps/tedrisat/src/deck-review/deck-review.service.ts:332 }
      DECK_REQUEST_NOT_FOUND: { status: 404, note: "no such deck, a deck that is hidden, or a deck that is PRIVATE (no request on record)", source: apps/tedrisat/src/deck-review/deck-review.service.ts:192 }
    sideEffects:
      - "audit:deck.private-read, written before the cards are returned, with { title, owner, scope: all or sample, cards: n } (deck-review.service.ts:102)"
    note: >-
      Code: deck-review.service.ts:91-118.
    source: apps/tedrisat/src/deck-review/nizam-deck-requests.controller.ts:109

  approveDeckPublishRequest:
    route: POST /nizam/deck-publish-requests/{id}/approve
    summary: "Publish a requested deck (Yayımla)"
    description: >-
      The PENDING deck becomes PUBLISHED: isPublic true, the request time cleared, the decision time and the decider
      set. The write is guarded on the status PENDING.
    needs: "a signed-in caller (AuthGuard only: no AuthzGuard); the service asks that the caller is the SYSTEM_ADMIN or holds platform.deck_publish (DeckReviewService.assertChief); a holder of platform.deck_publish may not answer the request for their own deck, the SYSTEM_ADMIN may"
    result: { status: 204 }
    refusals:
      HTTP_400: { status: 400, note: "the deck id is not a uuid", source: apps/tedrisat/src/deck-review/nizam-deck-requests.controller.ts:132 }
      DECK_REVIEW_FORBIDDEN: { status: 403, note: "two sites, one code: the caller is neither the SYSTEM_ADMIN nor a holder of platform.deck_publish (\"Only the Medaris başnazımı and a Medaris nazımı holding platform.deck_publish may review deck publish requests\", service :332); or the caller holds platform.deck_publish, is not the SYSTEM_ADMIN, and the request is for their own deck (\"A Medaris nazımı may not answer the publish request of his own deck\", service :345)", source: apps/tedrisat/src/deck-review/deck-review.service.ts:332 }
      DECK_REQUEST_NOT_FOUND: { status: 404, note: "no such deck, a deck that is hidden, or a deck that is PRIVATE (no request on record)", source: apps/tedrisat/src/deck-review/deck-review.service.ts:192 }
      DECK_REQUEST_NOT_PENDING: { status: 409, note: "the request was answered or withdrawn meanwhile (also a deck that is PUBLISHED or REJECTED already)", source: apps/tedrisat/src/deck-review/deck-review.service.ts:125 }
    sideEffects:
      - "notification:DECK_PUBLISH_RESULT to the deck's author, target DECK and the deck's id, params { outcome: approved, deckTitle }; a failure to write it is logged and ignored (deck-review.service.ts:127, :363)"
    note: >-
      Code: deck-review.service.ts:120-131.
    source: apps/tedrisat/src/deck-review/nizam-deck-requests.controller.ts:128

  rejectDeckPublishRequest:
    route: POST /nizam/deck-publish-requests/{id}/reject
    summary: "Refuse a requested deck (Reddet)"
    description: >-
      The PENDING deck becomes REJECTED with the reason, the decider and the time; it stays private and its author may
      ask again.
    needs: "a signed-in caller (AuthGuard only: no AuthzGuard); the service asks that the caller is the SYSTEM_ADMIN or holds platform.deck_publish (DeckReviewService.assertChief); a holder of platform.deck_publish may not answer the request for their own deck, the SYSTEM_ADMIN may"
    body:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 1000, pattern: "\\S", note: "required and not blank; trimmed before it is stored and sent" }
    result: { status: 204 }
    refusals:
      HTTP_400: { status: 400, note: "the deck id is not a uuid", source: apps/tedrisat/src/deck-review/nizam-deck-requests.controller.ts:151 }
      VALIDATION_ERROR: { status: 400, note: "the reason is missing, blank or over 1000 characters, or an unknown property is sent", source: libs/common/src/pipes/validation.pipe.ts:40 }
      DECK_REVIEW_FORBIDDEN: { status: 403, note: "two sites, one code: the caller is neither the SYSTEM_ADMIN nor a holder of platform.deck_publish (\"Only the Medaris başnazımı and a Medaris nazımı holding platform.deck_publish may review deck publish requests\", service :332); or the caller holds platform.deck_publish, is not the SYSTEM_ADMIN, and the request is for their own deck (\"A Medaris nazımı may not answer the publish request of his own deck\", service :345)", source: apps/tedrisat/src/deck-review/deck-review.service.ts:332 }
      DECK_REQUEST_NOT_FOUND: { status: 404, note: "no such deck, a deck that is hidden, or a deck that is PRIVATE (no request on record)", source: apps/tedrisat/src/deck-review/deck-review.service.ts:192 }
      DECK_REQUEST_NOT_PENDING: { status: 409, note: "the request was answered or withdrawn meanwhile", source: apps/tedrisat/src/deck-review/deck-review.service.ts:143 }
    sideEffects:
      - "notification:DECK_PUBLISH_RESULT to the deck's author, target DECK and the deck's id, params { outcome: rejected, deckTitle, reason }; a failure to write it is logged and ignored (deck-review.service.ts:145, :363)"
    note: >-
      Code: deck-review.service.ts:133-150.
    source: apps/tedrisat/src/deck-review/nizam-deck-requests.controller.ts:147

  unpublishDeck:
    route: POST /nizam/deck-publish-requests/{id}/unpublish
    summary: "Take a published deck back (Yayından kaldır)"
    description: >-
      The PUBLISHED deck becomes PRIVATE: isPublic false and every request and decision column cleared, in one
      transaction with the audit row, so the row is the only record of who took the deck down and why. Works on a hidden
      deck too. Its author may ask again.
    needs: "a signed-in caller (AuthGuard only: no AuthzGuard); the service asks that the caller is the SYSTEM_ADMIN, which a holder of platform.deck_publish is not"
    body:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 1000, pattern: "\\S", note: "required and not blank; trimmed before it is stored and sent" }
    result: { status: 204 }
    refusals:
      HTTP_400: { status: 400, note: "the deck id is not a uuid", source: apps/tedrisat/src/deck-review/nizam-deck-requests.controller.ts:171 }
      VALIDATION_ERROR: { status: 400, note: "the reason is missing, blank or over 1000 characters, or an unknown property is sent", source: libs/common/src/pipes/validation.pipe.ts:40 }
      DECK_REVIEW_FORBIDDEN: { status: 403, note: "Only the Medaris başnazımı may unpublish a deck", source: apps/tedrisat/src/deck-review/deck-review.service.ts:162 }
      DECK_REQUEST_NOT_FOUND: { status: 404, note: "no such deck", source: apps/tedrisat/src/deck-review/deck-review.service.ts:169 }
      DECK_NOT_PUBLISHED: { status: 409, note: "the deck is not PUBLISHED, or stopped being so meanwhile", source: apps/tedrisat/src/deck-review/deck-review.service.ts:175 }
    sideEffects:
      - "audit:deck.unpublish with { title, owner, reason }, in the same transaction as the change (deck-review.repository.ts:316)"
      - "notification:DECK_PUBLISH_RESULT to the deck's author, target DECK and the deck's id, params { outcome: unpublished, deckTitle, reason }; a failure to write it is logged and ignored (deck-review.service.ts:177, :363)"
    note: >-
      Code: deck-review.service.ts:156-182.
    source: apps/tedrisat/src/deck-review/nizam-deck-requests.controller.ts:167

invariants:
  # What the code keeps
  - id: deck-born-private
    rule: >-
      A deck is created with isPublic false and publishStatus PRIVATE by the repository, whatever the body says, and the body may not name
      isPublic (400). The only writer of a public deck is the başnazım's approval of a request.
    source: apps/tedrisat/src/flashcard/flashcard-deck.repository.ts:169

  - id: deck-publish-status-machine
    rule: >-
      PRIVATE moves to PENDING when the author asks, and PENDING to PUBLISHED when the reviewer approves. PENDING moves to REJECTED when
      the reviewer refuses with a reason, and REJECTED to PENDING when the author asks again. PENDING and REJECTED return to PRIVATE when
      the author withdraws, PUBLISHED returns to PRIVATE at once when the author withdraws, and PUBLISHED returns to PRIVATE when the
      başnazım unpublishes with a reason (audit deck.unpublish, the owner told). Every move is a compare-and-set on the status that was read.
    source: apps/tedrisat/src/flashcard/flashcard-deck.service.ts:269

  - id: deck-publish-columns-in-step
    rule: >-
      isPublic is true exactly when publishStatus is PUBLISHED, and a request or a change of visibility wipes the previous reviewer's
      answer (publishDecidedAt, publishDecidedBy, publishRejectReason).
    source: apps/tedrisat/src/flashcard/flashcard-deck.repository.ts:19

  - id: deck-reviewer-not-own-deck
    rule: >-
      A holder of platform.deck_publish may not approve or refuse the request for their own deck; the SYSTEM_ADMIN may. Unpublishing is the
      SYSTEM_ADMIN's alone.
    source: apps/tedrisat/src/deck-review/deck-review.service.ts:343

  - id: deck-private-read-on-the-record
    rule: >-
      Reading the cards of a requested, still private deck writes deck.private-read before the cards leave; the SYSTEM_ADMIN's read of
      another person's private deck through the deck routes writes deck.admin_read; the başnazım's other access to it (writes, collecting,
      progress) is refused.
    source: apps/tedrisat/src/deck-review/deck-review.service.ts:99

  - id: private-deck-card-looks-absent
    rule: >-
      A private deck, its cards and the card routes answer a stranger and an anonymous caller exactly as an id that does not exist: 404
      DECK_NOT_FOUND on the deck routes and 404 CARD_NOT_FOUND on the card routes. A 403 is given only for what the caller can already see
      (a public deck, a write code missing).
    source: apps/tedrisat/src/flashcard/flashcard.service.ts:86

  - id: deck-anonymous-reads-public-only
    rule: >-
      With no token only GET /flashcard/decks/{id}, GET /flashcard/decks and GET /flashcard/cards?deckId= work, and only for public decks;
      progress is never returned to an anonymous caller, any write is 401, and an invalid token is 401, never read as anonymous.
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:184

  - id: deck-shared-with-enrolled-read
    rule: >-
      A non-public deck with a course, a köşk or a medrese is readable, collectable and studiable, never writable, by a talebe with an
      ENROLLED or COMPLETED enrollment in that course, in a course of that köşk or in a course of that medrese, provided the enrolling
      course is PUBLISHED and not hidden and the deck is neither hidden nor a course draft. PENDING and REVOKED enrollments do not count.
    source: apps/tedrisat/src/flashcard/deck-sharing.ts:35

  - id: course-deck-staff-rights
    rule: >-
      Whoever holds deck.manage_course in a course reads (drafts included), fills and edits that course's decks as the author does, on the
      deck routes: view, create_card, manage_cards and manage_private. It exists only for a deck whose courseId is set.
    source: libs/common/src/authz/effective-permissions.ts:306

  - id: course-deck-draft-delete
    rule: >-
      A course deck is deleted through the course route only while it is a draft; a published one is first set to draft (the talebe lose
      sight of it and keep their progress), then deleted.
    source: apps/tedrisat/src/flashcard/course-deck.service.ts:134

  - id: course-deck-week
    rule: >-
      A deck's weekId must be one of the course's shown (not hidden) weeks; a week that goes leaves its decks unplaced (on delete set null).
    source: apps/tedrisat/src/flashcard/course-deck.service.ts:150

  - id: deck-limits
    rule: >-
      A personal or course deck's title is 5 to 100 characters, a köşk deck's and a proposal's title is not blank and at most 200, a
      description is at most 1000, a deck has at most 20 tags of at most 40 characters each, trimmed, blanks dropped and repeats removed
      without regard to case in the Turkish locale. Tags are read back by the author only.
    source: apps/tedrisat/src/flashcard/flashcard-deck.service.ts:25

  - id: card-limits
    rule: A card's front and back are 3 to 5000 characters, its type is VOCABULARY or HADEETH, and its contentMeta is a JSON object.
    source: apps/tedrisat/src/flashcard/dto/create-flashcard.dto.ts:12

  - id: card-bulk-limits
    rule: >-
      A bulk create or an import carries at most 1000 cards (422 BULK_ROW_LIMIT_EXCEEDED), an empty or non-array payload is 400
      BULK_PAYLOAD_INVALID, every invalid row is reported at once (422 BULK_VALIDATION_ERROR, row = index + 2), an import file is at most 5
      MB, and the bulk routes have their own throttle (10 per window per user and route unless configured).
    source: apps/tedrisat/src/flashcard/flashcard-bulk.service.ts:21

  - id: card-export-formula-neutral
    rule: >-
      Every exported or sample string cell that starts with = + - @ tab or CR gets a leading quote, and an import removes the quote only
      when what follows is such a trigger, so the round trip is exact.
    source: libs/common/src/excel/excel.service.ts:40

  - id: card-export-owner-only
    rule: >-
      A reader of a public deck cannot export it: export needs deck.manage_cards, and then the handler asks that the caller wrote the deck.
    source: apps/tedrisat/src/flashcard/flashcard.controller.ts:445

  - id: card-review-schedule
    rule: >-
      A rating HARD gives LEARNING with a 1 day interval, MEDIUM gives LEARNING with max(3, previous) days, EASY gives MASTERED with
      max(7, 2 x previous) days, every interval is at most 180 days, and the due time is the review time plus the interval. The client may
      not set the status or the due time when it sends a rating.
    source: apps/tedrisat/src/flashcard/domain/review-schedule.ts:28

  - id: card-review-due
    rule: >-
      A progress row is due when its status is not NEW and either it is LEARNING with no due time or its due time has come; a MASTERED row
      with no due time is never due; a card with no progress row or status NEW is new, not due.
    source: apps/tedrisat/src/flashcard/review-due.ts:15

  - id: card-study-round-size
    rule: >-
      A study round holds at most 50 due cards (oldest due first, never-rated LEARNING first) then at most 10 unstarted cards (oldest
      first); the due-today deck list shows 3 decks unless asked, never more than 10.
    source: apps/tedrisat/src/flashcard/flashcard.service.ts:23

  - id: card-progress-targets-visible
    rule: >-
      Every card named in a progress write must exist (404) and sit in a deck the caller may read (403), and the progress row is always
      the caller's own.
    source: apps/tedrisat/src/flashcard/flashcard.service.ts:228

  - id: deck-collection-reevaluated
    rule: >-
      A collected deck stays in decks_users but is listed only while the caller may still read it; collecting is idempotent; leaving needs
      no read right.
    source: apps/tedrisat/src/flashcard/flashcard-deck.repository.ts:126

  - id: deck-labels-private-to-owner
    rule: >-
      Card labels and deck labels, and their stats, are readable, deletable and attachable only by their creator, whatever their scope,
      and a labeling also needs the target card or deck to be readable by the caller. No route reads labelings back.
    source: apps/tedrisat/src/flashcard/flashcard-label.service.ts:44

  - id: deck-proposal-machine
    rule: >-
      A deck proposal is PENDING until a nazım of the köşk opens a deck from it (ACCEPTED, in the same transaction) or refuses it with a
      reason (REJECTED); an answered proposal answers 409; only a müderris of a non-hidden course of that köşk proposes; only a rejection
      notifies the proposer.
    source: apps/tedrisat/src/deck-review/deck-review.service.ts:219

  - id: kosk-deck-hide-never-deletes
    rule: >-
      A köşk deck is hidden, never deleted, by a nazım of its köşk or the başnazım, and the level (platform or kosk) is stored for the
      restore rule. A hidden deck drops out of the köşk list, deckSharedWith, the summary and explore lists and the review lists, but a
      hidden public deck is still served by the direct routes.
    source: apps/tedrisat/src/deck-review/deck-review.service.ts:247

  # What the code breaks
  - id: course-deck-staff-edit-any-card
    rule: >-
      Whoever holds deck.manage_course in a course may read, edit and delete every card of that course's decks, drafts included, on the
      single-card routes as well as the deck routes.
    holds: false
    finding: course-deck-staff-card-routes-404
    note: >-
      The card routes authorize against the card's parent deck through findVisibleDeckId, which knows the deck's author, a public deck and
      the shared-with rule, but not the course staff rule (flashcard.service.ts:86-101). A staff member who did not write the deck and is
      not enrolled meets 404 CARD_NOT_FOUND on GET, PUT, PATCH and DELETE /flashcard/cards/{id}, while adding cards and listing them
      (deck-level routes) work. The e2e suite covers a second müderris adding cards only (course-decks.e2e.spec.ts:248). Derived by reading,
      not run.
    source: apps/tedrisat/src/flashcard/flashcard.service.ts:92

  - id: course-deck-staff-use-course-routes
    rule: >-
      A course deck is deleted, published and made public only through the course's own routes: a published one is deleted only after it
      is set to draft, and it never becomes a public deck by a request.
    holds: false
    finding: deck-manage-private-reaches-course-decks
    note: >-
      Course staff hold deck.manage_private and deck.manage_cards on a course deck (effective-permissions.ts:215), so the generic routes
      deleteDeck, replaceDeck, updateDeck, requestDeckPublication and withdrawDeckPublication accept them. deleteDeck removes a PUBLISHED
      course deck at once, past COURSE_DECK_NOT_DRAFT, and requestDeckPublication lets staff ask to make a course deck public, which an
      approval would set isPublic on. No spec covers these. Derived by reading, not run.
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:418

  - id: deck-card-type-fixed
    rule: A deck's cardType is chosen at creation and never changes.
    holds: false
    finding: put-deck-changes-card-type
    note: >-
      PATCH /flashcard/decks/{id} and the course PATCH refuse a cardType, but PUT /flashcard/decks/{id} takes CreateFlashcardDeckDto, which
      allows it, and the update writes it. PUT also leaves out fields it does not clear, though it is documented as replacing completely.
    source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:357

  - id: card-export-follows-manage-cards
    rule: Whoever holds deck.manage_cards on a deck, the course staff of a course deck included, can export its cards.
    holds: false
    finding: export-refused-to-staff
    note: >-
      The route passes the guard for course staff and then findOwned throws 403 DECK_FORBIDDEN unless the caller is the deck's author
      (flashcard.controller.ts:445, flashcard-deck.service.ts:218).
    source: apps/tedrisat/src/flashcard/flashcard.controller.ts:411

  - id: kosk-deck-written-by-its-nazims
    rule: Any nazım of a köşk, or whoever holds deck.manage_kosk, may fill and edit the köşk's decks, whoever opened them.
    holds: false
    finding: deck-manage-kosk-unused
    note: >-
      deck.manage_kosk and deck.propose_kosk are in the catalogue and on the nizam permission screens, but no route asks for them: köşk
      decks and proposals check a KOSK_NAZIM role assignment and a MUDERRIS role assignment. A köşk deck has no scope chain, so a second
      nazım of the köşk is a stranger to a deck the first opened (404 on its cards); only the creating nazım, or the başnazım through the
      bypass on a public deck, writes its cards. See also grantable-codes-are-asked-for.
    source: apps/tedrisat/src/deck-review/deck-review.service.ts:350

  - id: hidden-deck-leaves-lists
    rule: A hidden deck is in none of the deck lists a person reads.
    holds: false
    finding: hidden-decks-in-lists
    note: >-
      GET /flashcard/decks and GET /flashcard/decks/collections do not filter archivedAt, so a hidden public deck, and the author's own
      hidden deck, still appear; the summary and explore lists do filter it.
    source: apps/tedrisat/src/flashcard/flashcard-deck.repository.ts:101

  - id: label-target-looks-absent
    rule: >-
      Putting a label on a card or a deck answers a private deck of someone else exactly as an id that does not exist, as the card and deck
      routes do.
    holds: false
    finding: label-target-oracle
    note: >-
      labelCard answers 404 CARD_NOT_FOUND for an absent card and 403 DECK_FORBIDDEN for a card in someone else's private deck, and labelDeck
      answers 404 DECK_NOT_FOUND for an absent deck and 403 DECK_FORBIDDEN for a private one (assertReadable, flashcard-deck.service.ts:114, whose comments
      at :50-62 and :99-113 say the 404 and 403 split is kept). Ids are random uuids, so the oracle is small.
    source: apps/tedrisat/src/flashcard/flashcard-label.service.ts:167

  - id: card-routes-malformed-id-400
    rule: A card id that is not a uuid answers 400 on every card route, as a deck id does on the deck routes.
    holds: false
    finding: card-id-not-uuid-500
    note: >-
      The four routes that authorize through the card's parent deck (GET, PUT, PATCH and DELETE /flashcard/cards/{id}) run their resolver
      before any pipe: findVisibleDeckId puts the id into a uuid-typed query, Postgres refuses it, and AuthzGuard wraps the failure as 500
      AUTHZ_RESOLVER_ERROR. Derived by reading, not run.
    source: libs/common/src/authz/authz.guard.ts:120

  - id: accepted-write-never-500
    rule: A request that the validation accepts never ends in 500.
    holds: false
    finding: accepted-write-500
    note: >-
      Each case is derived by reading and not run. PATCH /flashcard/decks/{id} and PATCH /flashcard/cards/{id} with an empty body {}
      (drizzle's update has no value to set). A JSON null in a field that the DTO marks optional but the column does not accept:
      @IsOptional lets null through, so createDeck, replaceDeck, updateDeck (tags, cardType, title), updateCard (type, front, back) and
      updateCourseDeck (title, draft) write NULL into a NOT NULL column. PUT /flashcard/cards/progress with an empty array
      (insert().values([])) or the same card twice (ON CONFLICT DO UPDATE cannot touch a row twice). An import of a CSV sent as
      application/vnd.ms-excel, which the file filter allows and detectFormat reads as xlsx, or of a corrupt workbook. A bulk create with
      a null element, or a JSON body over 100 KB. And the SYSTEM_ADMIN naming an absent deck or course on a route that adds rows to it
      (createCards, createCardsBulk, importCards, createCourseDeck), whose insert breaks a foreign key.
    source: apps/tedrisat/src/flashcard/flashcard.controller.ts:508

  - id: card-create-takes-only-its-fields
    rule: >-
      A card is created from its type, front, back and contentMeta only; its id, author, deck and timestamps are the server's, on every
      route that creates cards.
    holds: false
