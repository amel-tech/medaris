      AUTHZ_FORBIDDEN: { status: 403, note: "a pending applicant, a removed or barred talebe or a stranger holds course.view only", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "a course id that is not a uuid; only the SYSTEM_ADMIN reaches the pipe with one, everyone else is refused 403 by the guard first (the PUBLIC relation holds no course code)", source: apps/tedrisat/src/flashcard/course-decks.controller.ts:148 }
    sideEffects:
