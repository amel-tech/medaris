    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:495

  getMadrasahDeactivationPreview: # MadrasahController.deactivationPreview
    route: GET /madrasahs/{id}/deactivation-preview
    summary: What taking a medrese out of service takes along
    description: >-
      Measures the impact of passivating the medrese (PassivationImpactRepository.measure): the courses below it in every köşk and how many have
      a müderris in the post, the talebe enrolled, the live sessions in the next days and the başmüderris who would leave; with the confirmation
      token to post to deactivateMadrasah. Answers 200 with alreadyPassive true when it is passive already. The başmüderris cannot passivate
      their own medrese. Writes nothing.
    needs: "AuthGuard + AuthzGuard, @Authz(platform.madrasah_edit, byExistingMadrasah). Held by SYSTEM_ADMIN and by a Medaris nazımı granted it"
    result:
      status: 200
      type: object
      required: [scope, alreadyPassive, closesContent, staffLeaving, courses, students, sessions, confirmation]
      properties:
        scope:
          type: object
          required: [type, id, name]
          properties:
            type: { enum: [KOSK, MADRASAH], note: "MADRASAH here" }
            id: { type: string, format: uuid, references: Madrasah }
            name: { type: string }
        alreadyPassive: { type: boolean, note: "true when it is passive already; the preview still answers 200" }
        closesContent: { type: boolean, note: "false when the scope never had a manager: the engine treats it as new, so passivating it closes no course" }
        staffLeaving: { type: integer, note: "the başmüderris who would leave the post" }
        courses:
          type: object
          required: [total, published, draft, withLiveMuderris, items, truncated]
          properties:
            total: { type: integer }
            published: { type: integer }
            draft: { type: integer }
            withLiveMuderris: { type: integer, note: "how many have a müderris in the post now" }
            items:
              type: array
              note: "the first 50, the most enrolled first; a hidden course is not counted"
              items:
                type: object
                required: [id, title, koskName, status, liveMuderris, enrolled, completed]
                properties:
                  id: { type: string, format: uuid, references: Course }
                  title: { type: string }
                  koskName: { type: string }
                  status: { enum: [DRAFT, PUBLISHED] }
                  liveMuderris: { type: boolean }
                  enrolled: { type: integer }
                  completed: { type: integer }
            truncated: { type: boolean, note: "items is shorter than total; the confirmation covers every course" }
        students:
          type: object
          required: [enrolled, completed]
          properties:
            enrolled: { type: integer, note: "distinct talebe enrolled in those courses" }
            completed: { type: integer, note: "distinct talebe who finished one of them" }
        sessions:
          type: object
          required: [windowDays, count, next]
          properties:
            windowDays: { type: integer, note: "how many days ahead are counted" }
            count: { type: integer, note: "live, not cancelled sessions of published courses that start inside the window" }
            next:
              type: array
              note: "the first five"
              items:
                type: object
                required: [id, title, courseTitle, scheduledAt]
                properties:
                  id: { type: string, format: uuid, references: Lesson }
                  title: { type: string }
                  courseTitle: { type: string }
                  scheduledAt: { type: string, format: date-time }
        confirmation: { type: string, minLength: 64, maxLength: 64, note: "a token bound to exactly these numbers and to the caller; post it back to deactivate" }
    refusals:
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah); or the impact cannot be measured (madrasah.service.ts:341)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold platform.madrasah_edit" }
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:527

  deactivateMadrasah: # MadrasahController.deactivate
    route: POST /madrasahs/{id}/deactivate
    summary: Take a medrese out of service
    description: >-
      One transaction, the medrese row locked. The impact is measured again under the lock and must match the confirmation for this caller. Every
      held MEDRESE_BASMUDERRIS row is revoked, passiveSince is set and passiveReason becomes DEACTIVATED_BY_ADMIN, and the audit row carries the
      heads removed and the impact confirmed. The nazırs and every grant stay, nothing is hidden or deleted, and every course below it closes in
      every köşk (a passive scope closes its content). Appointing a başmüderris (setMadrasahHeadMuderris) opens it again.
    needs: "AuthGuard + AuthzGuard, @Authz(platform.madrasah_edit, byExistingMadrasah) @HttpCode(200). Held by SYSTEM_ADMIN and by a Medaris nazımı granted it"
    body:
      type: object
      required: [confirmation]
      additionalProperties: false
      properties:
        confirmation: { type: string, minLength: 64, maxLength: 64, note: "the confirmation of the preview the person read" }
    result:
      status: 200
      description: "MadrasahDirectoryItemResponse as getMadrasahDirectory lists it: status PASSIVE (HIDDEN when it is hidden as well), headMuderris null because the heads were revoked"
      type: object
      required: [id, handle, name, coverHue, status, since, hiddenLevel, canRestore, headMuderris, courseCount, hostingKosks]
      properties:
        id: { type: string, format: uuid, references: Madrasah }
        handle: { type: string }
        name: { type: string }
        coverHue: { type: integer }
        status: { enum: [ACTIVE, PASSIVE, HIDDEN], note: "HIDDEN wins over PASSIVE wins over ACTIVE" }
        since: { type: [string, "null"], format: date-time, note: "archivedAt when hidden, else passiveSince; null while active" }
        hiddenLevel: { enum: [course, madrasah, kosk, platform, null], note: "the level that hid it; madrasah for a row hidden before levels were recorded; null while it is not hidden" }
        canRestore: { type: boolean, note: "hidden, and the caller holds madrasah.hide or platform.madrasah_edit and acts at the level that hid it or above" }
        headMuderris:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: string, format: uuid, note: "Keycloak sub" }
            name: { type: [string, "null"], note: "null until that person has signed in once" }
          note: "the oldest held MEDRESE_BASMUDERRIS; null when there is none"
        courseCount: { type: integer, note: "courses that are not hidden" }
        hostingKosks:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid, references: Kosk }
              name: { type: string }
          note: "the köşks holding an unrevoked hosting right for it, hidden köşks left out, by name"
    refusals:
      PASSIVATION_IMPACT_CHANGED:
        status: 409
        note: "What passivating takes along changed since the preview; read it again and confirm again. Nothing is written. The fresh preview is in context.impact"
        body:
          type: object
          properties:
            context:
              type: object
              properties:
                impact: { type: object, note: "the same shape getMadrasahDeactivationPreview answers, with a new confirmation" }
        source: apps/tedrisat/src/passivation/passivation-impact.repository.ts:182
      MADRASAH_ALREADY_PASSIVE: { status: 409, note: "Medrese <id> is passive already (checked before the confirmation)", source: apps/tedrisat/src/madrasah/madrasah.service.ts:358 }
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      VALIDATION_ERROR: { status: 400, note: "confirmation is missing, not a string or not exactly 64 characters, or an unknown property" }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold platform.madrasah_edit" }
    sideEffects:
      - audit:madrasah.deactivate
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:549

  restoreMadrasah: # MadrasahController.restore
    route: POST /madrasahs/{id}/restore
    summary: Bring a hidden medrese back
    description: >-
      One transaction. Allowed at the level that hid it or above (platform over medrese; a medrese hidden before levels were recorded counts as
      hidden at the medrese level): the başmüderris restores what was hidden at medrese level, platform management restores anything, and the
      başmüderris cannot restore what the platform hid. Clears archivedAt, archivedBy and archivedLevel, and brings back the courses whose archivedAt
      equals the medrese's own instant (version + 1); a course hidden earlier on its own stays hidden. A medrese that is both hidden and passive
      comes back passive.
    needs: "AuthGuard + AuthzGuard, @Authz([madrasah.hide, platform.madrasah_edit], byExistingMadrasah) @HttpCode(200). Held by the başmüderris, SYSTEM_ADMIN and a Medaris nazımı granted platform.madrasah_edit"
    result:
      status: 200
      description: "MadrasahDirectoryItemResponse as getMadrasahDirectory lists it: status ACTIVE, or PASSIVE when it is passive as well; hiddenLevel null"
      type: object
      required: [id, handle, name, coverHue, status, since, hiddenLevel, canRestore, headMuderris, courseCount, hostingKosks]
      properties:
        id: { type: string, format: uuid, references: Madrasah }
        handle: { type: string }
        name: { type: string }
        coverHue: { type: integer }
        status: { enum: [ACTIVE, PASSIVE, HIDDEN], note: "HIDDEN wins over PASSIVE wins over ACTIVE" }
        since: { type: [string, "null"], format: date-time, note: "archivedAt when hidden, else passiveSince; null while active" }
        hiddenLevel: { enum: [course, madrasah, kosk, platform, null], note: "the level that hid it; madrasah for a row hidden before levels were recorded; null while it is not hidden" }
        canRestore: { type: boolean, note: "hidden, and the caller holds madrasah.hide or platform.madrasah_edit and acts at the level that hid it or above" }
        headMuderris:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: string, format: uuid, note: "Keycloak sub" }
            name: { type: [string, "null"], note: "null until that person has signed in once" }
          note: "the oldest held MEDRESE_BASMUDERRIS; null when there is none"
        courseCount: { type: integer, note: "courses that are not hidden" }
        hostingKosks:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid, references: Kosk }
              name: { type: string }
          note: "the köşks holding an unrevoked hosting right for it, hidden köşks left out, by name"
    refusals:
      ARCHIVE_RESTORE_LEVEL:
        status: 403
        note: "This was hidden at the <hidden> level; only that level or above brings it back (you act at the <yours> level). context carries hiddenAt and yourLevel"
        source: apps/tedrisat/src/madrasah/madrasah.repository.ts:797
      MADRASAH_NOT_HIDDEN: { status: 409, note: "Medrese <id> is not hidden", source: apps/tedrisat/src/madrasah/madrasah.service.ts:371 }
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller holds neither madrasah.hide nor platform.madrasah_edit on the medrese" }
    sideEffects:
      - audit:madrasah.restore
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:577

  updateMadrasah: # MadrasahController.update
    route: PATCH /madrasahs/{id}
    summary: Update a medrese's name, description, handle or cover colour
    description: >-
      Writes the fields sent and updated_at, whether or not the medrese is hidden or passive. No audit row. The medrese's settings screen
      saves name and description through updateMadrasahSettings instead; the two routes overlap on those two fields.
    needs: "AuthGuard + AuthzGuard, @Authz([madrasah.settings_edit, platform.madrasah_edit], byExistingMadrasah). Held by the başmüderris, a nazır granted madrasah.settings_edit, SYSTEM_ADMIN, and a Medaris nazımı granted platform.madrasah_edit"
    body:
      type: object
      additionalProperties: false
      properties:
        handle: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])$" }
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        coverHue: { type: integer, minimum: 0, maximum: 360 }
    result:
      status: 200
      returns: Madrasah
      type: object
      description: "MadrasahResponse, re-read after the write"
      properties:
        nazirIds: { type: array, items: { type: string, format: uuid } }
    refusals:
      MADRASAH_HANDLE_TAKEN: { status: 409, note: "another medrese holds the handle (madrasah.service.ts:389, excluding itself) or the unique index refused it (:397)", source: apps/tedrisat/src/madrasah/madrasah.service.ts:389 }
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      VALIDATION_ERROR: { status: 400, note: "handle pattern, name length, description over 1000, coverHue outside 0..360, an unknown property" }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller holds neither madrasah.settings_edit nor platform.madrasah_edit on the medrese" }
    note: >-
      Finding patch-madrasah-unaudited: this route can change the name, the description and the public handle with no audit_log row, while
      updateMadrasahSettings (the same name and description) writes madrasah.settings.update and stamps MadrasahSettings.updatedBy.
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:605

  getMadrasahSettings: # MadrasahController.getSettings
    route: GET /madrasahs/{id}/settings
    summary: The medrese's settings
    description: >-
      The medrese's name and description, its three policies (all off until the first save: a medrese never saved has no MadrasahSettings row)
      and who saved last. Not part of the public read. Writes nothing.
    needs: "AuthGuard + AuthzGuard, @Authz(madrasah.settings_edit, byExistingMadrasah). Held by the başmüderris, a nazır granted it, and SYSTEM_ADMIN. A Medaris nazımı with only platform.madrasah_edit is refused"
    result:
      status: 200
      type: object
      required: [name, description, policies, updatedAt, updatedBy]
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        policies:
          type: object
          required: [closedCourseRequired, alwaysApproval, noPublicRecordings]
          properties:
            closedCourseRequired: { type: boolean }
            alwaysApproval: { type: boolean }
            noPublicRecordings: { type: boolean, note: "stored and shown, and read by nothing that decides (invariant madrasah-no-public-recordings-closes-recordings)" }
          note: "all three read false until the first save: no MadrasahSettings row yet"
        updatedAt: { type: [string, "null"], format: date-time, note: "the last save of the settings; null until the first one" }
        updatedBy:
          type: [object, "null"]
          required: [id, name, email]
          properties:
            id: { type: string, format: uuid, note: "Keycloak sub" }
            name: { type: [string, "null"] }
            email: { type: [string, "null"], sensitivity: personal }
          note: "who saved last; null until the first save"
    refusals:
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold madrasah.settings_edit on the medrese" }
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:626

  updateMadrasahSettings: # MadrasahController.updateSettings
    route: PATCH /madrasahs/{id}/settings
    summary: Save the medrese's settings
    description: >-
      One transaction, the medrese row locked, planned by planSettingsUpdate: text is trimmed, a blank or null description clears it, and a field
      sent with the value it already has changes nothing. When nothing changes nothing is written (no audit row, updatedAt and updatedBy untouched).
      Otherwise the Madrasah's name, description and updatedAt (when those changed), an upsert of all three MadrasahSettings policy columns with
      updatedAt = now() and updatedBy = the caller, and the audit row with the changes. alwaysApproval takes effect at once: every new enrollment
      in the medrese's courses waits for approval from then on (CourseService.enroll via CourseRepository.forcesApproval, and it closes
      setting.approval_off). closedCourseRequired is applied when the medrese opens a course and refuses a save that opens it again.
      noPublicRecordings is stored and nothing reads it.
    needs: "AuthGuard + AuthzGuard, @Authz(madrasah.settings_edit, byExistingMadrasah). Held by the başmüderris, a nazır granted it, and SYSTEM_ADMIN. A Medaris nazımı with only platform.madrasah_edit is refused"
    body:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120, note: "not blank" }
        description: { type: [string, "null"], maxLength: 1000, note: "blank or null clears it" }
        policies:
          type: object
          additionalProperties: false
          properties:
            closedCourseRequired: { type: boolean }
            alwaysApproval: { type: boolean }
            noPublicRecordings: { type: boolean }
          note: "only the policies sent change"
    result:
      status: 200
      type: object
      required: [name, description, policies, updatedAt, updatedBy]
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        policies:
          type: object
          required: [closedCourseRequired, alwaysApproval, noPublicRecordings]
          properties:
            closedCourseRequired: { type: boolean }
            alwaysApproval: { type: boolean }
            noPublicRecordings: { type: boolean, note: "stored and shown, and read by nothing that decides (invariant madrasah-no-public-recordings-closes-recordings)" }
          note: "all three read false until the first save: no MadrasahSettings row yet"
        updatedAt: { type: [string, "null"], format: date-time, note: "the last save of the settings; null until the first one" }
        updatedBy:
          type: [object, "null"]
          required: [id, name, email]
          properties:
            id: { type: string, format: uuid, note: "Keycloak sub" }
            name: { type: [string, "null"] }
            email: { type: [string, "null"], sensitivity: personal }
          note: "who saved last; null until the first save"
    refusals:
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      VALIDATION_ERROR: { status: 400, note: "name shorter than 2, blank or over 120 characters, description over 1000, a policy that is not a boolean, an unknown property" }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold madrasah.settings_edit on the medrese" }
    sideEffects:
      - audit:madrasah.settings.update (only when something changed)
    note: >-
      The DTO and schema comments (madrasah-settings.dto.ts, madrasah.schema.ts:47-54) still say nothing enforces closedCourseRequired; it is
      enforced (openMadrasahCourse, and the course save at course.service.ts:995-1001 answers 409 PLATFORM_POLICY_LOCKED). There is no
      admission-rule feature behind the madrasah.admission_rules permission (finding no-admission-rules; the code gates nothing, MDRS-208 in
      domain.yaml). Read from the code, not run.
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:643

  listMadrasahCourses: # MadrasahController.findCourses
    route: GET /madrasahs/{id}/courses
    summary: The medrese's courses, for its nazırs
    description: >-
      The medrese's DRAFT and PUBLISHED courses that are not hidden, in köşks that are not hidden (an unlisted köşk is fine), by title then id,
      each with its enrolled and pending counts (a COMPLETED enrollment counts as neither) and its müderrisler with the account's e-mail and the
      imam marked. Writes nothing.
    needs: "AuthGuard + AuthzGuard, @Authz([madrasah.course_open, madrasah.course_hide, madrasah.muderris_manage], byExistingMadrasah): any one of the three. Held by the başmüderris, a nazır granted any of them, and SYSTEM_ADMIN"
    query:
      type: object
      properties:
        koskId: { type: string, format: uuid, references: Kosk }
        status: { enum: [DRAFT, PUBLISHED] }
    result:
      status: 200
      type: array
      items:
        type: object
        required: [id, title, koskId, koskName, status, requiresApproval, closed, createdAt, studentCount, pendingCount, muderris]
        properties:
          id: { type: string, format: uuid, references: Course }
          title: { type: string }
          koskId: { type: string, format: uuid, references: Kosk }
          koskName: { type: string }
          status: { enum: [DRAFT, PUBLISHED] }
          requiresApproval: { type: boolean, note: "as stored, after the medrese's policy" }
          closed: { type: boolean, note: "kapalı ders, as stored, after the medrese's policy" }
          createdAt: { type: string, format: date-time }
          studentCount: { type: integer, note: "ENROLLED enrollments only: a PENDING or COMPLETED one is not counted" }
