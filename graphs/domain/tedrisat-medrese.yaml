# The medrese's actions: the medrese layer itself (a madrasah, "medrese"), the courses a medrese opens in the köşks that host it, its
# portal (the talebe list and the Pano) and the course requests it sends to a köşk. Written from the code as it is
# (apps/tedrisat/src/madrasah/, madrasah/course/, madrasah/portal/, course-request/), from inventory/domain.md lines 3055-3389.
#
# Handlers: 30, actions: 30. MadrasahController 18, MadrasahCourseController 6, MadrasahPortalController 2, CourseRequestController 4.
# There are no background jobs, no webhooks and no notifications in this area (a refusal of a course request sends the medrese nothing).
#
# Names. The controller method in camelCase, with its resource where the method name is generic: findAll is listMadrasahs, findById is
# getMadrasah, create is createMadrasah, update is updateMadrasah, delete is deleteMadrasah, hide, restore and deactivate carry the
# medrese (hideMadrasah, restoreMadrasah, deactivateMadrasah), and so on; the course side is named after the operation id the API
# itself publishes (openMadrasahCourse, hideMadrasahCourse, requestOffsiteCourse). The course-request routes are createCourseRequest,
# listCourseRequests, acceptCourseRequest and rejectCourseRequest.
#
# How to read an action.
#  - route: {id}, {courseId} are path parameters. `source` is the line of the route decorator of the handler.
#  - needs: the guards, the @Authz call and who holds it. Every handler here sits on AuthGuard and AuthzGuard, except the four
#    course-request routes: AuthGuard alone, the service decides (CourseRequestService). A request with no token is 401 on every route
#    that is not @AuthzPublic, and a bad token is 401 on all of them; those 401s and the 429 throttle belong to the pipeline
#    (invariants access-token-only and rate-limit-before-auth) and are not repeated per action.
#  - refusals: every code the handler can really answer. HTTP_400 is a path or query pipe (ParseIntPipe, ParseEnumPipe,
#    ParseUUIDPipe); VALIDATION_ERROR is the body DTO. MADRASAH_NOT_FOUND on a /madrasahs/{id} route is the guard's resolver
#    (byExistingMadrasah, madrasah.controller.ts:104-113), which runs before the UUID pipe: a malformed id is 404, never 400.
#    The call-graph draft over-reports; where the code cannot give a refusal the draft lists, the action's note says so.
#  - result: `returns: <Entity>` says the response is that entity's record (the properties listed are what the response adds or
#    masks), and `type: array` a list of them. A response that is a view over several entities is written out as a schema and its
#    id fields carry `references`. A user id in a response is the Keycloak sub and carries no `references` (a user column is no foreign key).
#  - description says what the route does and writes; note is the author's own words (findings, what was not verified). Every claim was read
#    from the code and none was run.
#  - sideEffects: audit rows by their action key, Keycloak reads. A read with no side effect has none listed.
schema: delurio-graph/0
kind: domain
id: medaris.api

actions:
  # ---------------------------------------------------------------------------------------------------------------------------------
  # MadrasahController (apps/tedrisat/src/madrasah/madrasah.controller.ts): public reads
  # ---------------------------------------------------------------------------------------------------------------------------------
  listMadrasahs: # MadrasahController.findAll
    route: GET /madrasahs
    summary: The medreses, a page at a time, hidden ones left out
    description: >-
      Every medrese whose archivedAt is null, by name then id, each with nazirIds (the held MEDRESE_BASMUDERRIS). Open to a caller with
      no token (MDRS-122); for such a caller createdBy is null and nazirIds is [] on every item (anonymous-mask, MDRS-160). Writes nothing.
    needs: "No token needed. AuthGuard + AuthzGuard, @Authz(madrasah.view, anyMadrasah) @AuthzPublic. madrasah.view is held by the relations PUBLIC and ANONYMOUS, so every caller passes"
    query:
      type: object
      properties:
        page: { type: integer, default: 1, note: "below 1 reads as 1" }
        limit: { type: integer, default: 12, minimum: 1, maximum: 50, note: "clamped to 1..50, never refused" }
    result:
      status: 200
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, handle, name, description, coverHue, createdBy, nazirIds, createdAt, updatedAt]
            properties:
              id: { type: string, format: uuid, references: Madrasah }
              handle: { type: string }
              name: { type: string }
              description: { type: [string, "null"] }
              coverHue: { type: integer }
              createdBy: { type: [string, "null"], format: uuid, note: "Keycloak sub of the person who opened it; null for a caller with no token" }
              nazirIds: { type: array, items: { type: string, format: uuid }, note: "the held MEDRESE_BASMUDERRIS holders, oldest first (the API's old name for the head); [] for a caller with no token" }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
        total: { type: integer, note: "the medreses that are not hidden" }
        page: { type: integer }
        limit: { type: integer }
    refusals:
      HTTP_400: { status: 400, note: "page or limit is not an integer (ParseIntPipe)" }
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:204

  exploreMadrasahs: # MadrasahController.explore
    route: GET /madrasahs/explore
    summary: The medreses Keşfet lists, each with its listed courses
    description: >-
      Each medrese with its başmüderris's name and its listed courses, by name then id; not paginated (MDRS-159). A course is listed when it
      is PUBLISHED, not hidden, and in a köşk that is neither unlisted (isPrivate) nor hidden. level and field keep the medreses with at
      least one listed course in a köşk of exactly that level or ilim alanı (the web app sends neither); q keeps those where every whitespace-separated word occurs, case-
      insensitively, in the name, handle, description or the başmüderris's name. Writes nothing.
    needs: "No token needed. AuthGuard + AuthzGuard, @Authz(madrasah.view, anyMadrasah) @AuthzPublic. Every caller passes"
    query:
      type: object
      properties:
        q: { type: string, maxLength: 100, note: "cut to 100 characters, not refused; a repeated key arrives as an array and is read as no search" }
        level: { enum: [ALL, BEGINNER, INTERMEDIATE, ADVANCED], note: "keeps the medreses with a listed course in a köşk whose level is exactly this; ALL is a level a köşk can declare (kosk-field-rules.ts:25), not 'no filter'; absent is no filter" }
        field: { type: string, note: "the ilim alanı of the köşk, trimmed; blank is no filter" }
        madrasahId: { type: string, format: uuid, references: Madrasah }
    result:
      status: 200
      type: array
      items:
        type: object
        required: [id, handle, name, headMuderrisName, courseCount, courses]
        properties:
          id: { type: string, format: uuid, references: Madrasah }
          handle: { type: string }
          name: { type: string }
          headMuderrisName: { type: [string, "null"], note: "null with none, or while that person has never signed in" }
          courseCount: { type: integer, note: "the listed courses" }
          courses:
            type: array
            items:
              type: object
              required: [id, title, coverHue]
              properties:
                id: { type: string, format: uuid, references: Course }
                title: { type: string }
                coverHue: { type: integer }
    refusals:
      HTTP_400: { status: 400, note: "level is not one of the four values, or madrasahId is not a uuid (ParseEnumPipe, ParseUUIDPipe)" }
    note: >-
      The inventory reads level ALL as no filter; the code does not (the repository compares the köşk's level with the value as it is).
      Finding explore-lists-hidden: the query has no archivedAt filter on madrasahs (madrasah.repository.ts:1030-1056) while GET /madrasahs and the
      page leave a hidden medrese out. A hidden medrese's courses are hidden with it, so it appears here with courseCount 0 and its name and handle
      (and level or field filters drop it, because it has no listed course). Not pinned by discover.e2e.spec.ts. Read from the code, not run.
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:241

  getMadrasah: # MadrasahController.findById
    route: GET /madrasahs/{id}
    summary: One medrese
    description: >-
      The medrese and its nazirIds. Open to a caller with no token, who gets createdBy null and nazirIds []. A hidden medrese (archivedAt set)
      answers 404 to everyone except a signed-in caller who holds madrasah.hide or platform.madrasah_edit on it (mayOpenHidden). Writes nothing.
    needs: "No token needed. AuthGuard + AuthzGuard, @Authz(madrasah.view, byExistingMadrasah) @AuthzPublic. Every caller passes the guard; a hidden medrese is closed by the service"
    result:
      status: 200
      returns: Madrasah
      type: object
      description: "MadrasahResponse: the Madrasah row without its passive and archive columns, plus nazirIds"
      properties:
        createdBy: { type: [string, "null"], format: uuid, note: "null for a caller with no token" }
        nazirIds: { type: array, items: { type: string, format: uuid }, note: "the held MEDRESE_BASMUDERRIS holders, oldest first; [] for a caller with no token" }
    refusals:
      MADRASAH_NOT_FOUND:
        status: 404
        note: "no such medrese or the id is not a uuid (byExistingMadrasah); or the medrese is hidden and the caller may not open it (madrasah.service.ts:98)"
        source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:333

  getMadrasahOverview: # MadrasahController.findOverview
    route: GET /madrasahs/{id}/overview
    summary: What a medrese's page shows
    description: >-
      The medrese's PUBLISHED, not hidden courses in köşks that are neither unlisted nor hidden, each with its müderrisler, the caller's own
      enrollment status (null with no token) and the next session still ahead (never the meeting link); the köşks those courses are in; and the
      oldest held başmüderris with the number of listed courses they teach. A hidden medrese is 404 to everyone but the people above it, as in
      getMadrasah. Writes nothing.
    needs: "No token needed. AuthGuard + AuthzGuard, @Authz(madrasah.view, byExistingMadrasah) @AuthzPublic. Every caller passes the guard; a hidden medrese is closed by the service"
    result:
      status: 200
      type: object
      required: [headMuderris, courses, kosks]
      properties:
        headMuderris:
          type: [object, "null"]
          required: [id, name, courseCount]
          properties:
            id: { type: string, format: uuid, note: "Keycloak sub of the başmüderris; returned to a caller with no token as well (finding overview-exposes-head-id)" }
            name: { type: [string, "null"], note: "null while that person has never signed in" }
            courseCount: { type: integer, note: "how many of the medrese's listed courses they teach" }
        courses:
          type: array
          items:
            type: object
            required: [id, title, category, coverHue, inPerson, koskId, koskName, muderris, enrollmentStatus, nextSessionAt]
            properties:
              id: { type: string, format: uuid, references: Course }
              title: { type: string }
              category: { type: [string, "null"] }
              coverHue: { type: integer }
              inPerson: { type: boolean, note: "yüz yüze (MDRS-283): the sessions are held in person; a public label" }
              koskId: { type: string, format: uuid, references: Kosk }
              koskName: { type: string }
              muderris:
                type: array
                items:
                  type: object
                  required: [name, title, unvan, isImam]
                  properties:
                    name: { type: string }
                    title: { type: [string, "null"] }
                    unvan: { enum: [PROF_DR, DOC_DR, DR, MUDERRIS, MOLLA, MUFTU, SEYH, HAFIZ, null] }
                    isImam: { type: boolean }
              enrollmentStatus: { enum: [PENDING, ENROLLED, COMPLETED, null], note: "the caller's own; null with no token or no enrollment" }
              nextSessionAt: { type: [string, "null"], format: date-time, note: "the earliest session still ahead; never the meeting link" }
        kosks:
          type: array
          note: "only the köşks the medrese has a listed course in"
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid, references: Kosk }
              name: { type: string }
    refusals:
      MADRASAH_NOT_FOUND:
        status: 404
        note: "no such medrese or the id is not a uuid (byExistingMadrasah); or the medrese is hidden and the caller may not open it (madrasah.service.ts:114-117)"
        source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110
    note: >-
      Finding overview-exposes-head-id (not in the inventory): the controller does not apply the anonymous mask to this response, so headMuderris.id,
      the başmüderris's Keycloak sub, reaches a caller with no token, although GET /madrasahs/{id} hides nazirIds from that caller for the reason
      that "a person's id is not for the public" (MDRS-160; the köşk page has a test for it, public-pages.e2e.spec.ts:273, the medrese overview has none).
      Read from the code, not run.
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:355

  # ---------------------------------------------------------------------------------------------------------------------------------
  # MadrasahController: the portal's own reads and the platform's management of medreses
  # ---------------------------------------------------------------------------------------------------------------------------------
  getMadrasahBadgeCounts: # MadrasahController.getBadgeCounts
    route: GET /madrasahs/{id}/badge-counts
    summary: The counts behind the nazır portal's menu badges
    description: >-
      The PENDING enrollments across the medrese's courses that are not hidden (drafts counted, the köşk's hidden state not asked), and how
      many courses hold one. Figures about the medrese's own applicants, so it asks madrasah.students_view and not madrasah.view. Writes nothing.
    needs: "AuthGuard + AuthzGuard, @Authz(madrasah.students_view, byExistingMadrasah). Held by the başmüderris by role default, by a nazır only when granted, and by SYSTEM_ADMIN"
    result:
      status: 200
      type: object
      required: [pendingApplications, coursesWithPendingApplications]
      properties:
        pendingApplications: { type: integer }
        coursesWithPendingApplications: { type: integer }
    refusals:
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold madrasah.students_view on the medrese" }
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:382

  getMadrasahDirectory: # MadrasahController.directory
    route: GET /madrasahs/directory
    summary: Every medrese for the platform's table, hidden and passive ones too
    description: >-
      nizam's Medreseler table: every medrese with its oldest held başmüderris, its course count (courses that are not hidden), its hosting köşks
      (unrevoked, köşk not hidden), the per-status counts the tabs show and the passive medreses the page's warning names. Each item says
      whether the caller may bring it back (canRestore, by the hide ladder). Writes nothing.
    needs: "AuthGuard + AuthzGuard, @Authz([platform.madrasah_create, platform.madrasah_edit, platform.head_muderris_manage], anyMadrasah): any one of the three opens it. Held by SYSTEM_ADMIN and by a Medaris nazımı granted at least one; platform.madrasah_nazir_grant alone opens nothing"
    query:
      type: object
      properties:
        status: { enum: [ALL, ACTIVE, PASSIVE, HIDDEN], default: ALL }
        q: { type: string, maxLength: 100, note: "matches name, handle or the başmüderris's name, case-insensitively; cut to 100; a repeated key is read as no search" }
        page: { type: integer, default: 1, note: "below 1 reads as 1" }
        limit: { type: integer, default: 25, minimum: 1, maximum: 50, note: "clamped to 1..50" }
    result:
      status: 200
      type: object
      required: [items, total, page, limit, counts, passive]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, handle, name, coverHue, status, since, hiddenLevel, canRestore, headMuderris, courseCount, hostingKosks]
            properties:
              id: { type: string, format: uuid, references: Madrasah }
              handle: { type: string }
              name: { type: string }
              coverHue: { type: integer }
              status: { enum: [ACTIVE, PASSIVE, HIDDEN], note: "HIDDEN wins over PASSIVE wins over ACTIVE" }
              since: { type: [string, "null"], format: date-time, note: "archivedAt when hidden, else passiveSince; null while active" }
              hiddenLevel: { enum: [course, madrasah, kosk, platform, null], note: "the level that hid it; madrasah for a row hidden before levels were recorded; null while it is not hidden" }
              canRestore: { type: boolean, note: "hidden, and the caller holds madrasah.hide or platform.madrasah_edit and acts at the level that hid it or above" }
              headMuderris:
                type: [object, "null"]
                required: [id, name]
                properties:
                  id: { type: string, format: uuid, note: "Keycloak sub" }
                  name: { type: [string, "null"], note: "null until that person has signed in once" }
                note: "the oldest held MEDRESE_BASMUDERRIS; null when there is none"
              courseCount: { type: integer, note: "courses that are not hidden" }
              hostingKosks:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: string, format: uuid, references: Kosk }
                    name: { type: string }
                note: "the köşks holding an unrevoked hosting right for it, hidden köşks left out, by name"
        total: { type: integer, note: "the rows matching the status and the search" }
        page: { type: integer }
        limit: { type: integer }
        counts:
          type: object
          required: [all, active, passive, hidden]
          properties:
            all: { type: integer }
            active: { type: integer }
            passive: { type: integer }
            hidden: { type: integer }
          note: "every medrese by status, whatever the filter and the search: the tabs' numbers"
        passive:
          type: array
          note: "the passive medreses the page's warning names, oldest first"
          items:
            type: object
            required: [id, name, since]
            properties:
              id: { type: string, format: uuid, references: Madrasah }
              name: { type: string }
              since: { type: string, format: date-time }
    refusals:
      HTTP_400: { status: 400, note: "status is not one of the four values, or page or limit is not an integer" }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller holds none of the three codes: a başmüderris is refused here too" }
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:283

  createMadrasah: # MadrasahController.create
    route: POST /madrasahs
    summary: Open a medrese with its başmüderris
    description: >-
      One transaction writes the Madrasah (created_by the caller), the MEDRESE_BASMUDERRIS role assignment of headMuderrisUserId (no end,
      granted_by the caller) and the audit row madrasah.create. Without a handle one is made from the name (Turkish letters transliterated,
      lower-case ASCII, hyphens, at most 60 characters, falling back to "medrese") and numbered -2, -3, ... until free; a handle the caller
      supplies is theirs to get right. A Medaris nazımı may not name themselves head, whatever they hold (SelfGrantGuard, always); SYSTEM_ADMIN may.
    needs: "AuthGuard + AuthzGuard, @Authz(platform.madrasah_create, anyMadrasah). Held by SYSTEM_ADMIN and by a Medaris nazımı granted it; the resolver reads a non-existent id as PUBLIC, which holds nothing that creates"
    body:
      type: object
      required: [name, headMuderrisUserId]
      additionalProperties: false
      properties:
        handle: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])$", note: "2 to 60 characters: lower-case letters, digits, inner hyphens" }
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        coverHue: { type: integer, minimum: 0, maximum: 360 }
        headMuderrisUserId: { type: string, format: uuid, note: "the account that becomes the başmüderris; not checked against the users table or the realm (finding head-account-not-checked)" }
    result:
      status: 201
      returns: Madrasah
      type: object
      description: "MadrasahResponse, re-read after the write: nazirIds is [headMuderrisUserId]"
      properties:
        nazirIds: { type: array, items: { type: string, format: uuid } }
    refusals:
      SELF_GRANT_REFUSED: { status: 403, note: "a caller who is not SYSTEM_ADMIN names themselves head (SelfGrantGuard always: true, route madrasah.create.head)", source: libs/common/src/authz/self-grant.guard.ts:91 }
      MADRASAH_HANDLE_TAKEN:
        status: 409
        note: "an explicit handle is taken (madrasah.service.ts:182); or a concurrent create won the unique index (:193); or three races in a row for a generated handle (:196)"
        source: apps/tedrisat/src/madrasah/madrasah.service.ts:182
      VALIDATION_ERROR: { status: 400, note: "handle pattern, name length 2..120, description over 1000, coverHue outside 0..360, headMuderrisUserId missing or not a uuid, an unknown property" }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold platform.madrasah_create" }
    sideEffects:
      - audit:madrasah.create
      - audit:permission.self_grant_refused (when a refused self-naming is written)
    note: >-
      Finding head-account-not-checked: neither this route nor setMadrasahHeadMuderris asks the users table or the realm whether the named account
      exists (role_assignments.user_id is no foreign key and MadrasahService.open has no directory call), while openMadrasahCourse answers 404
      MUDERRIS_UNKNOWN_USER and the köşk nazım routes check too. Read from the code, not run. The call-graph draft's 404 MADRASAH_NOT_FOUND on this
      route is only the post-insert re-read, not a refusal.
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:399

  getMadrasahHeadDelegations: # MadrasahController.headDelegations
    route: GET /madrasahs/{id}/head-muderris/delegations
    summary: What the sitting başmüderris handed on
    description: >-
      The nazır roles and permission grants the sitting başmüderris gave in this medrese and its courses that are still held, whoever holds
      them (roles MEDRESE_NAZIR, and course seats MUDERRIS and DERS_NAZIR; grants single or by group). The incoming başmüderris's own rows are included:
      a head change decides every row. Names come from users, the missing ones from the realm (failures swallowed with a warning). Empty when
      there is no başmüderris or nothing was handed on. Writes nothing.
    needs: "AuthGuard + AuthzGuard, @Authz(platform.head_muderris_manage, byExistingMadrasah). Held by SYSTEM_ADMIN and by a Medaris nazımı granted it"
    result:
      status: 200
      type: array
      items:
        type: object
        required: [kind, id, role, permission, groupName, scopeType, scopeId, courseTitle, to, grantedAt, expiresAt]
        properties:
          kind: { enum: [ROLE, GRANT] }
          id: { type: string, format: uuid, note: "a RoleAssignment id for a ROLE, a PermissionGrant id for a GRANT" }
          role: { type: [string, "null"], note: "for a ROLE: MEDRESE_NAZIR in the medrese, or a course seat (MUDERRIS, DERS_NAZIR) in one of its courses" }
          permission: { type: [string, "null"], note: "the permission code, for a single-permission GRANT" }
          groupName: { type: [string, "null"], note: "for a group GRANT" }
          scopeType: { enum: [madrasah, course] }
          scopeId: { type: [string, "null"], format: uuid }
          courseTitle: { type: [string, "null"], note: "for a row held in a course" }
          to:
            type: object
            required: [id, name, email]
            properties:
              id: { type: string, format: uuid, note: "Keycloak sub of the holder" }
              name: { type: [string, "null"] }
              email: { type: [string, "null"], sensitivity: personal }
          grantedAt: { type: string, format: date-time }
          expiresAt: { type: [string, "null"], format: date-time }
    refusals:
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold platform.head_muderris_manage" }
    sideEffects:
      - "Keycloak admin GET by id, for the holders the users table does not know (failures swallowed: the route is never 503)"
    note: >-
      The call-graph draft attributes 503 KEYCLOAK_ADMIN_UNAVAILABLE to this route; MadrasahService.headDelegations reads the directory through
      Promise.allSettled (madrasah.service.ts:278), so the directory being down leaves names null and is no refusal here.
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:427

  setMadrasahHeadMuderris: # MadrasahController.setHeadMuderris
    route: PUT /madrasahs/{id}/head-muderris
    summary: Make a user the medrese's başmüderris
    description: >-
      One transaction, the medrese row locked FOR NO KEY UPDATE. When the head is being replaced (some held head is another person) every item
      getMadrasahHeadDelegations lists must be answered exactly once and nothing else: TAKE_OVER sets granted_by to the caller, DROP revokes the
      role or grant, and a seat answered DROP also revokes what its holder was given in that scope and nothing else covers. The outgoing heads
      are revoked, the new head is seated (expires_at = endsAt), passiveSince and passiveReason are cleared (a passive medrese is active again),
      and the audit row is written. Naming the person who already heads it asks nothing and changes nothing but the audit row. SYSTEM_ADMIN
      may seat themselves; nobody else may, nor take over a row given to themselves (two SelfGrantGuard calls, both always).
    needs: "AuthGuard + AuthzGuard, @Authz(platform.head_muderris_manage, byExistingMadrasah). Held by SYSTEM_ADMIN and by a Medaris nazımı granted it"
    body:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId: { type: string, format: uuid, note: "the account that becomes the başmüderris; not checked against the users table or the realm" }
        endsAt: { type: string, format: date-time, note: "the new head's Görev bitişi; omitted means until taken away; in the past is refused" }
        delegations:
          type: array
          maxItems: 500
          note: "one answer per item getMadrasahHeadDelegations lists, when the head is replaced"
          items:
            type: object
            required: [kind, id, action]
            additionalProperties: false
            properties:
              kind: { enum: [ROLE, GRANT] }
              id: { type: string, format: uuid }
              action: { enum: [TAKE_OVER, DROP] }
    result:
      status: 200
      description: "MadrasahDirectoryItemResponse of the medrese, as getMadrasahDirectory lists it, with canRestore: the new head is in headMuderris and the medrese is no longer passive"
      type: object
      required: [id, handle, name, coverHue, status, since, hiddenLevel, canRestore, headMuderris, courseCount, hostingKosks]
      properties:
        id: { type: string, format: uuid, references: Madrasah }
        handle: { type: string }
        name: { type: string }
        coverHue: { type: integer }
        status: { enum: [ACTIVE, PASSIVE, HIDDEN], note: "HIDDEN wins over PASSIVE wins over ACTIVE" }
        since: { type: [string, "null"], format: date-time, note: "archivedAt when hidden, else passiveSince; null while active" }
        hiddenLevel: { enum: [course, madrasah, kosk, platform, null], note: "the level that hid it; madrasah for a row hidden before levels were recorded; null while it is not hidden" }
        canRestore: { type: boolean, note: "hidden, and the caller holds madrasah.hide or platform.madrasah_edit and acts at the level that hid it or above" }
        headMuderris:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: string, format: uuid, note: "Keycloak sub" }
            name: { type: [string, "null"], note: "null until that person has signed in once" }
          note: "the oldest held MEDRESE_BASMUDERRIS; null when there is none"
        courseCount: { type: integer, note: "courses that are not hidden" }
        hostingKosks:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid, references: Kosk }
              name: { type: string }
          note: "the köşks holding an unrevoked hosting right for it, hidden köşks left out, by name"
    refusals:
      SELF_GRANT_REFUSED: { status: 403, note: "the caller is not SYSTEM_ADMIN and names themselves head (route madrasah.head_muderris.set) or takes over a hand-on given to themselves (madrasah.head_muderris.take_over); both always: true", source: libs/common/src/authz/self-grant.guard.ts:91 }
      GRANT_EXPIRY_INVALID: { status: 400, note: "The end date is in the past", source: apps/tedrisat/src/madrasah/madrasah.service.ts:232 }
      DISMISS_DECISIONS_INCOMPLETE: { status: 400, note: "a hand-on is unanswered, answered twice, or an answer names nothing handed on: Decide every permission and role this person handed on, and nothing else", source: apps/tedrisat/src/madrasah/madrasah.repository.ts:535 }
      DISMISS_TAKE_OVER_WITHOUT_SEAT: { status: 400, note: "a grant answered TAKE_OVER would go with a seat answered DROP in the same change: A grant taken over cannot outlast the seat dropped beside it", source: apps/tedrisat/src/madrasah/madrasah.repository.ts:611 }
      DISMISS_SEAT_HANDED_ON: { status: 409, note: "a seat answered DROP still has something its holder handed on under it: Dismiss <ids> first", source: apps/tedrisat/src/assignment/admin/orphaned-grants.ts:321 }
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah); or it vanished under the lock (madrasah.service.ts:242)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      VALIDATION_ERROR: { status: 400, note: "userId or an id is not a uuid, endsAt is not an ISO-8601 time, delegations has over 500 items or an answer outside the two kinds and two actions, an unknown property" }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold platform.head_muderris_manage" }
    sideEffects:
      - audit:madrasah.head_muderris.set
      - audit:permission.self_grant_refused (when a refused self-naming is written)
    note: >-
      Finding head-account-not-checked (see createMadrasah): userId is not looked up. A medrese with no head and one whose head is the same
      person ask for no delegations.
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:448

  hideMadrasah: # MadrasahController.hide
    route: POST /madrasahs/{id}/hide
    summary: Hide a medrese, with its courses
    description: >-
      One transaction, the medrese row locked. Sets archivedAt, archivedBy and archivedLevel on the medrese and the same three (and version + 1)
      on every course of it not already hidden, and writes one audit row with the number of courses. Nothing is deleted and the hosting köşks stay.
      The level is the highest rung of the medrese ladder the caller holds: platform for platform.madrasah_edit (SYSTEM_ADMIN counts as platform),
      else medrese for madrasah.hide. A nazır given "change the medrese settings" cannot hide it: madrasah.hide is a role default no grant carries.
    needs: "AuthGuard + AuthzGuard, @Authz([madrasah.hide, platform.madrasah_edit], byExistingMadrasah) @HttpCode(200). Held by the başmüderris (madrasah.hide), SYSTEM_ADMIN and a Medaris nazımı granted platform.madrasah_edit"
    result:
      status: 200
      description: "MadrasahDirectoryItemResponse as getMadrasahDirectory lists it: status HIDDEN, hiddenLevel the level the caller acted at (platform or madrasah)"
      type: object
      required: [id, handle, name, coverHue, status, since, hiddenLevel, canRestore, headMuderris, courseCount, hostingKosks]
      properties:
        id: { type: string, format: uuid, references: Madrasah }
        handle: { type: string }
        name: { type: string }
        coverHue: { type: integer }
        status: { enum: [ACTIVE, PASSIVE, HIDDEN], note: "HIDDEN wins over PASSIVE wins over ACTIVE" }
        since: { type: [string, "null"], format: date-time, note: "archivedAt when hidden, else passiveSince; null while active" }
        hiddenLevel: { enum: [course, madrasah, kosk, platform, null], note: "the level that hid it; madrasah for a row hidden before levels were recorded; null while it is not hidden" }
        canRestore: { type: boolean, note: "hidden, and the caller holds madrasah.hide or platform.madrasah_edit and acts at the level that hid it or above" }
        headMuderris:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: string, format: uuid, note: "Keycloak sub" }
            name: { type: [string, "null"], note: "null until that person has signed in once" }
          note: "the oldest held MEDRESE_BASMUDERRIS; null when there is none"
        courseCount: { type: integer, note: "courses that are not hidden" }
        hostingKosks:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid, references: Kosk }
              name: { type: string }
          note: "the köşks holding an unrevoked hosting right for it, hidden köşks left out, by name"
    refusals:
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      MADRASAH_ALREADY_HIDDEN: { status: 409, note: "Medrese <id> is already hidden", source: apps/tedrisat/src/madrasah/madrasah.service.ts:323 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller holds neither madrasah.hide nor platform.madrasah_edit on the medrese" }
    sideEffects:
