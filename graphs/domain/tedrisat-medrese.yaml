      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold madrasah.course_open on the medrese" }
    source: apps/tedrisat/src/madrasah/course/madrasah-course.controller.ts:82

  openMadrasahCourse: # MadrasahCourseController.open
    route: POST /madrasahs/{id}/courses
    summary: Open a course of the medrese in a köşk that hosts it
    description: >-
      The team is planned first (ids lower-cased, no duplicates; a lone müderris is the imam, with several imamUserId is required and must be
      listed; each unvan must belong to a listed account, once), then every account must exist in the users table or the realm
      (UserDirectoryService.findUnknownAccounts), then one transaction: the medrese row read FOR NO KEY UPDATE and shown (archivedAt null), a hosting
      right read FOR SHARE and the köşk existing and not hidden, the policies read under the lock, the Course inserted (DRAFT, authorId the caller,
      requiresApproval = requested or the alwaysApproval policy, isClosed = requested or the closedCourseRequired policy), the CourseMuderris rows
      (name from users or the realm, unvan, order), the MUDERRIS role assignments (syncMuderrisAssignments), the one imam row, and the audit row.
      Naming oneself müderris works only for someone who already holds every course code in the medrese (the başmüderris), not for a grantee
      (SelfGrantGuard, role MUDERRIS).
    needs: "AuthGuard + AuthzGuard, @Authz(madrasah.course_open, byExistingMadrasah). Held by the başmüderris, a nazır granted it (a grant held in a köşk that gave the medrese no hosting right does not help), and SYSTEM_ADMIN. A köşk's nazım is refused"
    body:
      type: object
      required: [koskId, title, muderrisUserIds]
      additionalProperties: false
      properties:
        koskId: { type: string, format: uuid, references: Kosk, note: "a köşk the medrese holds a hosting right in" }
        title: { type: string, minLength: 2, maxLength: 200, note: "trimmed first" }
        muderrisUserIds: { type: array, minItems: 1, maxItems: 20, items: { type: string, format: uuid }, note: "found with lookupUser (GET /users/lookup), in the order they are shown" }
        imamUserId: { type: string, format: uuid, note: "one of muderrisUserIds; left out, a lone müderris is the imam, with several it is required" }
        muderrisUnvans:
          type: array
          maxItems: 20
          note: "the unvan each müderris carries in the new course; one left out has none"
          items:
            type: object
            required: [userId, unvan]
            additionalProperties: false
            properties:
              userId: { type: string, format: uuid, note: "one of muderrisUserIds, named once" }
              unvan: { enum: [PROF_DR, DOC_DR, DR, MUDERRIS, MOLLA, MUFTU, SEYH, HAFIZ, null], note: "the key must be sent; null is no unvan" }
        closedCourse: { type: boolean, note: "forced on when the closedCourseRequired policy is on" }
        requiresApproval: { type: boolean, note: "forced on when the alwaysApproval policy is on" }
    result:
      status: 201
      description: "MadrasahCourseListItemResponse: the new course as listMadrasahCourses lists it"
      type: object
      required: [id, title, koskId, koskName, status, requiresApproval, closed, createdAt, studentCount, pendingCount, muderris]
      properties:
        id: { type: string, format: uuid, references: Course }
        title: { type: string }
        koskId: { type: string, format: uuid, references: Kosk }
        koskName: { type: string }
        status: { enum: [DRAFT, PUBLISHED] }
        requiresApproval: { type: boolean, note: "as stored, after the medrese's policy" }
        closed: { type: boolean, note: "kapalı ders, as stored, after the medrese's policy" }
        createdAt: { type: string, format: date-time }
        studentCount: { type: integer, note: "ENROLLED enrollments only: a PENDING or COMPLETED one is not counted" }
        pendingCount: { type: integer, note: "PENDING enrollments" }
        muderris:
          type: array
          note: "the course's müderrisler in list order, the imam marked"
          items:
            type: object
            required: [userId, name, title, unvan, email, isImam]
            properties:
              userId: { type: [string, "null"], format: uuid, note: "null for a müderris shown by name alone, with no account" }
              name: { type: string }
              title: { type: [string, "null"] }
              unvan: { enum: [PROF_DR, DOC_DR, DR, MUDERRIS, MOLLA, MUFTU, SEYH, HAFIZ, null] }
              email: { type: [string, "null"], sensitivity: personal, note: "null until that person has signed in once" }
              isImam: { type: boolean }
    refusals:
      HOSTING_RIGHT_REQUIRED:
        status: 403
        note: "Medrese <m> holds no hosting right in köşk <k>. Also answered for a köşk that does not exist or is hidden, never 404"
        source: apps/tedrisat/src/madrasah/course/madrasah-course.service.ts:110
      SELF_GRANT_REFUSED: { status: 403, note: "the caller names themselves müderris without holding every course code in the medrese (route madrasah.course.open)", source: libs/common/src/authz/self-grant.guard.ts:91 }
      MADRASAH_NOT_FOUND:
        status: 404
        note: "no such medrese or the id is not a uuid (byExistingMadrasah); or the medrese is hidden (madrasah-course.service.ts:107)"
        source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110
      MUDERRIS_UNKNOWN_USER:
        status: 404
        note: "No account <id> in the app or the realm; it cannot be made a müderris. With the directory not configured every account missing from users is unknown"
        source: apps/tedrisat/src/madrasah/course/madrasah-course.service.ts:222
      COURSE_IMAM_REQUIRED: { status: 400, note: "With more than one müderris, the imam must be named", source: apps/tedrisat/src/madrasah/course/course-team.ts:27 }
      COURSE_IMAM_NOT_LISTED: { status: 400, note: "the imam is not among the müderrisler", source: apps/tedrisat/src/madrasah/course/course-team.ts:30 }
      MUDERRIS_DUPLICATE_USER: { status: 400, note: "an account is listed twice", source: apps/tedrisat/src/madrasah/course/course-team.ts:23 }
      MUDERRIS_LIST_INVALID: { status: 400, note: "an unvan is given to an account that is not listed (madrasah-course.service.ts:48), or twice to one (:53)", source: apps/tedrisat/src/madrasah/course/madrasah-course.service.ts:48 }
      KEYCLOAK_ADMIN_UNAVAILABLE: { status: 503, note: "an account missing from users is looked up in the realm and the directory does not answer (transport, HTTP or parse); never read as unknown", source: apps/tedrisat/src/keycloak-admin/keycloak-admin.service.ts:160 }
      VALIDATION_ERROR: { status: 400, note: "title length outside 2..200, no or over 20 müderris, a value that is not a uuid, an unvan outside the eight codes, a non-boolean flag, an unknown property" }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold madrasah.course_open on the medrese" }
    sideEffects:
      - audit:course.open
      - audit:permission.self_grant_refused (when a refused self-naming is written)
      - "Keycloak admin GET by id, for the accounts the users table does not know"
    note: >-
      Finding open-course-hidden-köşk-is-403: a köşk that does not exist or is hidden answers 403 HOSTING_RIGHT_REQUIRED, not 404 (the
      repository returns no-hosting-right for both). The inventory's 503 KEYCLOAK_ADMIN_NOT_CONFIGURED is not given here: findUnknownAccounts
      checks isConfigured first, so an unconfigured directory yields 404 MUDERRIS_UNKNOWN_USER instead.
    source: apps/tedrisat/src/madrasah/course/madrasah-course.controller.ts:103

  setMadrasahCourseMuderris: # MadrasahCourseController.setMuderris
    route: PUT /madrasahs/{id}/courses/{courseId}/muderrises
    summary: Replace a course's müderrisler
    description: >-
      The listed müderrisler become the course's müderrisler and imamUserId its imam. assertOpen first (a hidden köşk closes its course to the
      medrese: a medrese is not above a köşk), then SelfGrantGuard only for accounts the save would newly seat. In one transaction with the
      course row locked: the course must be the medrese's and not hidden; when the list and the imam equal the stored ones nothing is written and
      the answer is 200; otherwise the CourseMuderris rows of dropped accounts are deleted, new ones inserted (name from the directory, looked up
      only for accounts not listed before) and ordered, a müderris shown by name alone with no account is left as it is, courses.version + 1, the
      MUDERRIS role rows are synced (leavers lose the role) and the imam row set, and the audit row is written.
    needs: "AuthGuard + AuthzGuard, @Authz(madrasah.muderris_manage, byExistingMadrasah). Held by the başmüderris, a nazır granted it, and SYSTEM_ADMIN. A köşk's nazım is refused"
    body:
      type: object
      required: [muderrisUserIds]
      additionalProperties: false
      properties:
        muderrisUserIds: { type: array, minItems: 1, maxItems: 20, items: { type: string, format: uuid }, note: "every müderris the course is to have, in the order shown; the last one cannot be left out" }
        imamUserId: { type: string, format: uuid, note: "one of muderrisUserIds; left out, a lone müderris is the imam, with several it is required" }
    result:
      status: 200
      description: "MadrasahCourseListItemResponse: the course as listMadrasahCourses lists it"
      type: object
      required: [id, title, koskId, koskName, status, requiresApproval, closed, createdAt, studentCount, pendingCount, muderris]
      properties:
        id: { type: string, format: uuid, references: Course }
        title: { type: string }
        koskId: { type: string, format: uuid, references: Kosk }
        koskName: { type: string }
        status: { enum: [DRAFT, PUBLISHED] }
        requiresApproval: { type: boolean, note: "as stored, after the medrese's policy" }
        closed: { type: boolean, note: "kapalı ders, as stored, after the medrese's policy" }
        createdAt: { type: string, format: date-time }
        studentCount: { type: integer, note: "ENROLLED enrollments only: a PENDING or COMPLETED one is not counted" }
        pendingCount: { type: integer, note: "PENDING enrollments" }
        muderris:
          type: array
          note: "the course's müderrisler in list order, the imam marked"
          items:
            type: object
            required: [userId, name, title, unvan, email, isImam]
            properties:
              userId: { type: [string, "null"], format: uuid, note: "null for a müderris shown by name alone, with no account" }
              name: { type: string }
              title: { type: [string, "null"] }
              unvan: { enum: [PROF_DR, DOC_DR, DR, MUDERRIS, MOLLA, MUFTU, SEYH, HAFIZ, null] }
              email: { type: [string, "null"], sensitivity: personal, note: "null until that person has signed in once" }
              isImam: { type: boolean }
    refusals:
      MADRASAH_COURSE_NOT_FOUND:
        status: 404
        note: "Medrese <m> has no course <c>: not this medrese's, hidden, or not found (madrasah-course.service.ts:142, :159, :241)"
        source: apps/tedrisat/src/madrasah/course/madrasah-course.service.ts:142
      COURSE_NOT_FOUND: { status: 404, note: "the course's köşk is hidden and the caller holds neither course.hide nor platform.kosk_edit on it (assertOpen)", source: libs/common/src/authz/authz.service.ts:135 }
      MUDERRIS_UNKNOWN_USER: { status: 404, note: "a newly listed account is in neither the users table nor the realm", source: apps/tedrisat/src/madrasah/course/madrasah-course.service.ts:222 }
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      COURSE_IMAM_REQUIRED: { status: 400, note: "With more than one müderris, the imam must be named", source: apps/tedrisat/src/madrasah/course/course-team.ts:27 }
      COURSE_IMAM_NOT_LISTED: { status: 400, note: "the imam is not among the müderrisler", source: apps/tedrisat/src/madrasah/course/course-team.ts:30 }
      MUDERRIS_DUPLICATE_USER: { status: 400, note: "an account is listed twice", source: apps/tedrisat/src/madrasah/course/course-team.ts:23 }
      SELF_GRANT_REFUSED: { status: 403, note: "the caller newly seats themselves as müderris without holding every course code in the medrese (route madrasah.course.muderris)", source: libs/common/src/authz/self-grant.guard.ts:91 }
      KEYCLOAK_ADMIN_UNAVAILABLE: { status: 503, note: "a newly listed account missing from users is looked up in the realm and the directory does not answer", source: apps/tedrisat/src/keycloak-admin/keycloak-admin.service.ts:160 }
      HTTP_400: { status: 400, note: "courseId is not a uuid (ParseUUIDPipe)" }
      VALIDATION_ERROR: { status: 400, note: "no or over 20 müderris, a value that is not a uuid, an unknown property" }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold madrasah.muderris_manage on the medrese" }
    sideEffects:
      - audit:course.muderris.update (only when the list or the imam changed)
      - audit:permission.self_grant_refused (when a refused self-naming is written)
      - "Keycloak admin GET by id, for newly listed accounts the users table does not know"
    note: >-
      The course's version moves, so an editor that opened the course earlier gets 409 on its next save (COURSE_VERSION_CONFLICT, S19).
      This route sets no unvan: a newly listed müderris has none and a kept one keeps theirs; unvans are changed in Ders ayarları.
    source: apps/tedrisat/src/madrasah/course/madrasah-course.controller.ts:137

  hideMadrasahCourse: # MadrasahCourseController.hide
    route: POST /madrasahs/{id}/courses/{courseId}/hide
    summary: Hide a course of the medrese
    description: >-
      assertOpen first, as in setMadrasahCourseMuderris. The level is the highest rung of the course ladder the caller holds (platform:
      platform.course_hide; köşk: course.hide; medrese: madrasah.course_hide), falling back to medrese when the course does not exist (the
      404 then comes from the medrese). In one transaction with the course row locked: the course must be the medrese's; archivedAt, archivedBy
      and archivedLevel are stamped (the first hider's stamp is never overwritten, because a hidden course is refused) and version + 1; the audit
      row is written. Nothing is deleted. The course leaves the medrese's list, the köşk's page, the talebe's calendar and every search, and is
      listed in the medrese's archive, where restoreArchiveItem (POST /archive/course/{id}/restore) brings it back by level.
    needs: "AuthGuard + AuthzGuard, @Authz(madrasah.course_hide, byExistingMadrasah) @HttpCode(204). Held by the başmüderris, a nazır granted it, and SYSTEM_ADMIN"
    result:
      status: 204
    refusals:
      MADRASAH_COURSE_NOT_FOUND: { status: 404, note: "Medrese <m> has no course <c>: not this medrese's, or it does not exist", source: apps/tedrisat/src/madrasah/course/madrasah-course.service.ts:206 }
      MADRASAH_COURSE_ALREADY_HIDDEN: { status: 409, note: "Course <id> is already hidden", source: apps/tedrisat/src/madrasah/course/madrasah-course.service.ts:209 }
      COURSE_NOT_FOUND: { status: 404, note: "the course's köşk is hidden and the caller holds neither course.hide nor platform.kosk_edit on it (assertOpen)", source: libs/common/src/authz/authz.service.ts:135 }
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      HTTP_400: { status: 400, note: "courseId is not a uuid (ParseUUIDPipe)" }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold madrasah.course_hide on the medrese" }
    sideEffects:
      - audit:course.hide
    source: apps/tedrisat/src/madrasah/course/madrasah-course.controller.ts:177

  requestOffsiteCourse: # MadrasahCourseController.requestOffsite
    route: POST /madrasahs/{id}/offsite-course-requests
    summary: Ask a köşk to open a course outside the medrese
    description: >-
      In one transaction: the medrese must exist and be shown, the köşk must exist and be shown (any köşk that is not hidden: the medrese's hosting
      rights are neither required nor looked at); a CourseRequest is inserted (status PENDING, requestedBy the caller) and the audit row is
      written. No course is created and nothing is added to the medrese's list. The köşk's nazım finds the request by listing (listCourseRequests)
      and answers it with acceptCourseRequest or rejectCourseRequest; no notification or mail is sent.
    needs: "AuthGuard + AuthzGuard, @Authz(madrasah.offsite_course_request, byExistingMadrasah). Held by the başmüderris, a nazır granted it, and SYSTEM_ADMIN. A stranger, another medrese's head and a nazır without the grant are refused"
    body:
      type: object
      required: [koskId, title, reason]
      additionalProperties: false
      properties:
        koskId: { type: string, format: uuid, references: Kosk }
        title: { type: string, minLength: 2, maxLength: 200, note: "the suggested name; trimmed first" }
        reason: { type: string, minLength: 1, maxLength: 2000, note: "why the course should open outside the medrese, and the müderrisler proposed; trimmed first, so blank is refused" }
    result:
      status: 201
      description: "OffsiteCourseRequestResponse"
      type: object
      required: [id, madrasahId, koskId, koskName, title, reason, status, requestedById, requestedByName, createdAt]
      properties:
        id: { type: string, format: uuid, references: CourseRequest }
        madrasahId: { type: string, format: uuid, references: Madrasah }
        koskId: { type: string, format: uuid, references: Kosk }
        koskName: { type: string }
        title: { type: string }
        reason: { type: string }
        status: { enum: [PENDING, ACCEPTED, REJECTED] }
        requestedById: { type: string, format: uuid, note: "Keycloak sub of the sender" }
        requestedByName: { type: [string, "null"], note: "null when the account never signed in to tedrisat" }
        createdAt: { type: string, format: date-time }
    refusals:
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah); or the medrese is hidden (madrasah-course.service.ts:179)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      KOSK_NOT_FOUND: { status: 404, note: "Köşk with id <k> not found: unknown or hidden", source: apps/tedrisat/src/madrasah/course/madrasah-course.service.ts:182 }
      VALIDATION_ERROR: { status: 400, note: "koskId is not a uuid, title outside 2..200, reason blank or over 2000, an unknown property" }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold madrasah.offsite_course_request on the medrese" }
    sideEffects:
      - audit:course_request.create
    note: >-
      Finding two-course-request-routes: this route and createCourseRequest both insert CourseRequest, with different gates and effects (see
      invariant course-request-routes-agree). Since migration 0067 this route writes course_requests, not the legacy offsite_course_requests.
    source: apps/tedrisat/src/madrasah/course/madrasah-course.controller.ts:220

  listOffsiteCourseRequests: # MadrasahCourseController.offsiteRequests
    route: GET /madrasahs/{id}/offsite-course-requests
    summary: The medrese's requests for a course outside it
    description: >-
