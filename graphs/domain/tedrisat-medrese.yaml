      type: array
      items:
        type: object
        required: [id, madrasahId, koskId, koskName, title, reason, status, requestedById, requestedByName, createdAt]
        properties:
          id: { type: string, format: uuid, references: CourseRequest }
          madrasahId: { type: string, format: uuid, references: Madrasah }
          koskId: { type: string, format: uuid, references: Kosk }
          koskName: { type: string }
          title: { type: string }
          reason: { type: string }
          status: { enum: [PENDING, ACCEPTED, REJECTED] }
          requestedById: { type: string, format: uuid, note: "Keycloak sub of the sender" }
          requestedByName: { type: [string, "null"], note: "null when the account never signed in to tedrisat" }
          createdAt: { type: string, format: date-time }
    refusals:
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold madrasah.offsite_course_request on the medrese" }
    source: apps/tedrisat/src/madrasah/course/madrasah-course.controller.ts:239

  # ---------------------------------------------------------------------------------------------------------------------------------
  # MadrasahPortalController (madrasah/portal/madrasah-portal.controller.ts): the talebe list and the Pano
  # ---------------------------------------------------------------------------------------------------------------------------------
  listMadrasahStudents: # MadrasahPortalController.students
    route: GET /madrasahs/{id}/students
    summary: The medrese's talebe, a page at a time
    description: >-
      A talebe of the medrese is anyone with an ENROLLED or COMPLETED enrollment in one of its courses that is not hidden, derived on every
      read and never stored. Newest first by first enrollment; each row lists all the talebe's seats in the medrese by title. The filters pick
      the talebe on one seat each: a course and a state together, not a course here and a state there. q matches the given or family name, the
      enrollment's student name, or the e-mail address, case-insensitively, with % and _ literal. Writes nothing, and writes no audit row.
    needs: "AuthGuard + AuthzGuard, @Authz(madrasah.students_view, byExistingMadrasah). Held by the başmüderris, a nazır granted it, and SYSTEM_ADMIN"
    query:
      type: object
      properties:
        page: { type: integer, default: 1, note: "below 1 reads as 1" }
        limit: { type: integer, default: 10, minimum: 1, maximum: 50, note: "clamped to 1..50" }
        q: { type: string, maxLength: 100, note: "cut to 100; a repeated key is read as no search" }
        courseId: { type: string, format: uuid, references: Course }
        status: { enum: [ENROLLED, COMPLETED] }
    result:
      status: 200
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            type: object
            required: [userId, name, email, firstEnrolledAt, ongoingCourses, completedCourses]
            properties:
              userId: { type: string, format: uuid, note: "Keycloak sub" }
              name: { type: [string, "null"], sensitivity: personal }
              email: { type: [string, "null"], sensitivity: personal }
              firstEnrolledAt: { type: string, format: date-time, note: "the earliest enrollment in any course of the medrese" }
              ongoingCourses:
                type: array
                note: "the courses of the medrese they are enrolled in, by title"
                items:
                  type: object
                  required: [id, title, completedAt]
                  properties:
                    id: { type: string, format: uuid, references: Course }
                    title: { type: string }
                    completedAt: { type: "null" }
              completedCourses:
                type: array
                note: "the courses of the medrese they completed, by title"
                items:
                  type: object
                  required: [id, title, completedAt]
                  properties:
                    id: { type: string, format: uuid, references: Course }
                    title: { type: string }
                    completedAt: { type: [string, "null"], format: date-time, note: "null for a completion recorded before the date was kept" }
        total: { type: integer, note: "the talebe matching the filters, over every page" }
        page: { type: integer }
        limit: { type: integer }
    refusals:
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      HTTP_400: { status: 400, note: "page or limit is not an integer, courseId is not a uuid, or status is not ENROLLED or COMPLETED" }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold madrasah.students_view on the medrese" }
    note: >-
      Finding students-read-unaudited: the names and e-mail addresses of the whole medrese's talebe are returned with no audit row, while a
      course roster read writes course.roster_read (invariant madrasah-students-read-is-audited). Read from the code, not run.
    source: apps/tedrisat/src/madrasah/portal/madrasah-portal.controller.ts:67

  getMadrasahDashboard: # MadrasahPortalController.dashboard
    route: GET /madrasahs/{id}/dashboard
    summary: What the medrese's Pano shows
    description: >-
      Counts of the nazırs (MEDRESE_NAZIR holders; the başmüderris is not counted) and of the courses (not hidden, köşk not hidden, drafts
      included); the hosting köşks (as listMadrasahHostingKosks); the live sessions of PUBLISHED courses in the next 7 days, soonest first (a
      hidden course, week or session, a hidden köşk and a draft are left out; a cancelled session stays, with its badge and note); and the pending
      applications across the medrese's courses that are not hidden (newest 50, with the whole count), each saying whether the caller may decide it.
      For a course in a passive scope (its müderris, köşk nazım or medrese başmüderris gone) the content is closed to the caller, so its session
      rows carry meetingHost, hasLiveStream and withoutAccess null and no cancel note; the in-person mark stays. Writes nothing.
    needs: "AuthGuard + AuthzGuard, @Authz(madrasah.students_view, byExistingMadrasah). Held by the başmüderris, a nazır granted it, and SYSTEM_ADMIN"
    result:
      status: 200
      type: object
      required: [nazirCount, courseCount, hostingKosks, upcomingSessions, pendingApplicationCount, pendingCourseCount, pendingApplications]
      properties:
        nazirCount: { type: integer, note: "the nazırs held; the başmüderris is not among them" }
        courseCount: { type: integer, note: "the medrese's courses that are not hidden, drafts included, in köşks that are not hidden" }
        hostingKosks:
          type: array
          items:
            type: object
            required: [id, name, field, courseCount]
            properties:
              id: { type: string, format: uuid, references: Kosk }
              name: { type: string }
              field: { type: [string, "null"] }
              courseCount: { type: integer }
        upcomingSessions:
          type: array
          note: "the live sessions of the next 7 days, soonest first"
          items:
            type: object
            required: [lessonId, courseId, courseTitle, courseCoverHue, koskId, koskName, weekNumber, scheduledAt, meetingHost, inPerson, hasLiveStream, withoutAccess, cancelled, cancelReason]
            properties:
              lessonId: { type: string, format: uuid, references: Lesson }
              courseId: { type: string, format: uuid, references: Course }
              courseTitle: { type: string }
              courseCoverHue: { type: integer }
              koskId: { type: string, format: uuid, references: Kosk }
              koskName: { type: string }
              weekNumber: { type: integer }
              scheduledAt: { type: string, format: date-time }
              meetingHost: { type: [string, "null"], note: "the host of the meeting link, never the link; null with no link, or when the course is in a passive scope" }
              inPerson: { type: boolean, note: "the session's own mark, else the course's (MDRS-283); a public label that stays in a passive scope" }
              hasLiveStream: { type: [boolean, "null"], note: "a live stream is set, never the link; null in a passive scope" }
              withoutAccess: { type: [boolean, "null"], note: "nobody can attend it as it stands: no meeting link, no live stream and not in person; false for a cancelled session; null in a passive scope" }
              cancelled: { type: boolean, note: "a cancelled celse stays in the list with its badge (MDRS-248)" }
              cancelReason: { type: [string, "null"], note: "the müderris's note on a cancelled celse; null when not cancelled, no note, or a passive scope" }
        pendingApplicationCount: { type: integer, note: "every PENDING enrollment across the medrese's courses that are not hidden" }
        pendingCourseCount: { type: integer, note: "in how many courses they wait" }
        pendingApplications:
          type: array
          note: "newest first, at most 50; the count above is the true number when there are more"
          items:
            type: object
            required: [courseId, courseTitle, userId, studentName, studentEmail, appliedAt, viewerMayDecide]
            properties:
              courseId: { type: string, format: uuid, references: Course }
              courseTitle: { type: string }
              userId: { type: string, format: uuid, note: "Keycloak sub of the applicant" }
              studentName: { type: [string, "null"], sensitivity: personal }
              studentEmail: { type: [string, "null"], sensitivity: personal }
              appliedAt: { type: string, format: date-time }
              viewerMayDecide: { type: boolean, note: "true only for SYSTEM_ADMIN, a held MUDERRIS of that course or a held KOSK_NAZIM of its köşk (the routes approveEnrollment and rejectEnrollment; invariant madrasah-pano-decides-like-the-course-routes)" }
    refusals:
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller does not hold madrasah.students_view on the medrese" }
    note: >-
      Finding viewer-may-decide-skips-head: viewerMayDecide ignores the başmüderris, although the catalogue gives MEDRESE_BASMUDERRIS
      enrollment.decide by role default in its medrese's courses and approveEnrollment asks enrollment.decide, and a grant of it to a nazır is
      ignored too (madrasah-portal.repository.ts:362-391, decidingScopes). The Pano and the approve route can disagree. Stale text: the
      DTO of upcomingSessions and the docblock of findUpcomingSessions say a cancelled session is left out, while the query keeps it
      (madrasah-portal.repository.ts, "A cancelled celse stays on the Pano"). Read from the code, not run.
    source: apps/tedrisat/src/madrasah/portal/madrasah-portal.controller.ts:117

  # ---------------------------------------------------------------------------------------------------------------------------------
  # CourseRequestController (course-request/course-request.controller.ts): the köşk side of a course request, and the older
  # medrese route. AuthGuard only: CourseRequestService decides (the engine has no entity for a request).
  # ---------------------------------------------------------------------------------------------------------------------------------
  createCourseRequest: # CourseRequestController.create
    route: POST /kosks/{id}/course-requests
    summary: Ask a köşk to open a course for a medrese
    description: >-
      Checks in this order: the köşk exists (KoskService.exists, with no archivedAt filter, so a hidden köşk is accepted), the medrese exists, and
      the caller holds the MEDRESE_BASMUDERRIS role of that medrese. Then inserts a CourseRequest (status PENDING, requestedBy the caller). No
      audit row, no notification.
    needs: "AuthGuard only, no @Authz: CourseRequestService. A held MEDRESE_BASMUDERRIS of the medrese named in the body; not a nazır with the madrasah.offsite_course_request grant, not SYSTEM_ADMIN"
    body:
      type: object
      required: [madrasahId, title, reason]
      additionalProperties: false
      properties:
        madrasahId: { type: string, format: uuid, references: Madrasah, note: "the medrese the request is sent from" }
        title: { type: string, minLength: 1, maxLength: 200, note: "trimmed first, not empty" }
        reason: { type: string, minLength: 1, maxLength: 2000, note: "trimmed first, not empty" }
    result:
      status: 201
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid, references: CourseRequest }
    refusals:
      KOSK_NOT_FOUND: { status: 404, note: "no köşk with that id (a hidden one still exists here)", source: apps/tedrisat/src/course-request/course-request.service.ts:110 }
      MADRASAH_NOT_FOUND: { status: 404, note: "no medrese with the id in the body (a hidden one still exists here)", source: apps/tedrisat/src/course-request/course-request.service.ts:113 }
      COURSE_REQUEST_FORBIDDEN: { status: 403, note: "Only the başmüderris of the medrese may send its course requests", source: apps/tedrisat/src/course-request/course-request.service.ts:116 }
      HTTP_400: { status: 400, note: "the köşk id in the path is not a uuid (ParseUUIDPipe)" }
      VALIDATION_ERROR: { status: 400, note: "madrasahId is not a uuid, title or reason blank or too long, an unknown property" }
    note: >-
      Finding two-course-request-routes: no audit row here, a hidden köşk is accepted, and a grant of madrasah.offsite_course_request does not
      pass; requestOffsiteCourse requires the permission, refuses hidden köşks and writes course_request.create.
    source: apps/tedrisat/src/course-request/course-request.controller.ts:63

  listCourseRequests: # CourseRequestController.list
    route: GET /kosks/{id}/course-requests
    summary: The course requests a köşk received
    description: >-
      The köşk must exist, and the caller must be SYSTEM_ADMIN or hold a KOSK_NAZIM role row of that köşk (KoskService.isManager): a Medaris nazımı
      and a başmüderris are refused. PENDING lists the waiting requests oldest first, DECIDED every other status newest decision first; at most
      100, and both tab counts. Writes nothing.
    needs: "AuthGuard only, no @Authz: CourseRequestService.assertKoskNazim. A held KOSK_NAZIM of the köşk, or SYSTEM_ADMIN"
    query:
      type: object
      properties:
        status: { enum: [PENDING, DECIDED], default: PENDING }
    result:
      status: 200
      type: object
      required: [items, pendingCount, decidedCount]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, title, reason, status, kosk, madrasah, requestedBy, createdAt, decidedAt, rejectReason, courseId]
            properties:
              id: { type: string, format: uuid, references: CourseRequest }
              title: { type: string }
              reason: { type: string }
              status: { enum: [PENDING, ACCEPTED, REJECTED] }
              kosk:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid, references: Kosk }
                  name: { type: string }
              madrasah:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid, references: Madrasah }
                  name: { type: string }
              requestedBy:
                type: object
                required: [id, name]
                properties:
                  id: { type: string, format: uuid, note: "Keycloak sub of the sender" }
                  name: { type: [string, "null"], note: "the user's name, else the e-mail address, else null" }
              createdAt: { type: string, format: date-time }
              decidedAt: { type: [string, "null"], format: date-time }
              rejectReason: { type: [string, "null"] }
              courseId: { type: [string, "null"], format: uuid, references: Course, note: "the course the köşk opened by accepting" }
        pendingCount: { type: integer, note: "the Bekleyen tab's count" }
        decidedCount: { type: integer, note: "the Karara bağlanan tab's count" }
    refusals:
      KOSK_NOT_FOUND: { status: 404, note: "no köşk with that id", source: apps/tedrisat/src/course-request/course-request.service.ts:210 }
      COURSE_REQUEST_FORBIDDEN: { status: 403, note: "You are not a nazım of this köşk", source: apps/tedrisat/src/course-request/course-request.service.ts:214 }
      HTTP_400: { status: 400, note: "the köşk id is not a uuid, or status is not PENDING or DECIDED" }
    source: apps/tedrisat/src/course-request/course-request.controller.ts:86

  acceptCourseRequest: # CourseRequestController.accept
    route: POST /course-requests/{id}/accept
    summary: Accept a course request with the course opened from it
    description: >-
      The köşk's nazım opens the course first (the "Ders aç" form, filled in from the request); this marks the request accepted. Checks in this
      order: the request exists, the caller is SYSTEM_ADMIN or a held KOSK_NAZIM of the request's köşk, the request is PENDING, the course is a
      course of the request's köşk, the course answers no other request. Then one conditional update (only where status is PENDING) sets status
      ACCEPTED, decidedBy, decidedAt = now() and courseId, with the audit row in the same transaction. The course's madrasah_id is not touched:
      it stays a köşk course. No notification reaches the medrese.
    needs: "AuthGuard only, no @Authz: CourseRequestService.assertKoskNazim. A held KOSK_NAZIM of the request's köşk, or SYSTEM_ADMIN"
    body:
      type: object
      required: [courseId]
      additionalProperties: false
      properties:
        courseId: { type: string, format: uuid, references: Course, note: "the course opened from the request in this köşk" }
    result:
      status: 204
    refusals:
      COURSE_REQUEST_NOT_FOUND: { status: 404, note: "No course request <id>", source: apps/tedrisat/src/course-request/course-request.service.ts:201 }
      COURSE_REQUEST_FORBIDDEN: { status: 403, note: "You are not a nazım of this köşk", source: apps/tedrisat/src/course-request/course-request.service.ts:214 }
      COURSE_REQUEST_NOT_PENDING: { status: 409, note: "Course request <id> has been answered already; checked up front (:155) and again when the conditional update finds no pending row (:196)", source: apps/tedrisat/src/course-request/course-request.service.ts:155 }
      COURSE_REQUEST_COURSE_NOT_FOUND: { status: 404, note: "Course <c> is not a course of the request's köşk", source: apps/tedrisat/src/course-request/course-request.service.ts:158 }
      COURSE_REQUEST_COURSE_TAKEN: { status: 409, note: "Course <c> already answers another course request", source: apps/tedrisat/src/course-request/course-request.service.ts:161 }
      HTTP_400: { status: 400, note: "the request id in the path is not a uuid" }
      VALIDATION_ERROR: { status: 400, note: "courseId missing or not a uuid, an unknown property" }
    sideEffects:
      - audit:course_request.accept
    note: >-
      KOSK_NOT_FOUND (course-request.service.ts:210) is not listed: the request is read through an inner join on kosks, so a request whose köşk is gone
      is COURSE_REQUEST_NOT_FOUND, and the köşk check can fail only if the köşk is deleted between the two reads.
    source: apps/tedrisat/src/course-request/course-request.controller.ts:113

  rejectCourseRequest: # CourseRequestController.reject
    route: POST /course-requests/{id}/reject
    summary: Refuse a course request
    description: >-
      As acceptCourseRequest up to the köşk check, with no check of the status up front: the same conditional update, with status REJECTED and the
      trimmed reason as rejectReason, and the audit row in the same transaction. A refused request can be appealed (createMadrasahAppeal).
    needs: "AuthGuard only, no @Authz: CourseRequestService.assertKoskNazim. A held KOSK_NAZIM of the request's köşk, or SYSTEM_ADMIN"
    body:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 1000, pattern: "\\S", note: "required and not blank; the DTO is shared with deck review (RejectReasonDto); stored trimmed" }
    result:
      status: 204
    refusals:
      COURSE_REQUEST_NOT_FOUND: { status: 404, note: "No course request <id>", source: apps/tedrisat/src/course-request/course-request.service.ts:201 }
      COURSE_REQUEST_FORBIDDEN: { status: 403, note: "You are not a nazım of this köşk", source: apps/tedrisat/src/course-request/course-request.service.ts:214 }
      COURSE_REQUEST_NOT_PENDING: { status: 409, note: "Course request <id> has been answered already: the conditional update found no pending row", source: apps/tedrisat/src/course-request/course-request.service.ts:196 }
      HTTP_400: { status: 400, note: "the request id in the path is not a uuid" }
      VALIDATION_ERROR: { status: 400, note: "reason missing, blank, over 1000 characters, or an unknown property" }
    sideEffects:
      - audit:course_request.reject
    note: >-
      KOSK_NOT_FOUND is not listed here either, for the reason given on acceptCourseRequest. The status is not checked up front, so a request
      answered before is 409 only through the conditional update.
    source: apps/tedrisat/src/course-request/course-request.controller.ts:132

# The medrese's invariants (domain.md section 12, this area). The ids are specific to the medrese and the course request; none repeats an id of
# domain.yaml. A rule the code breaks is holds: false with the finding that reports it (the inventory's finding id).
policies:
  - actor: medrese-reader
    needs: 'nothing: no token (madrasah.view is held by the relations ANONYMOUS and PUBLIC)'
    where: >-
      Every caller passes the guard; a hidden medrese is closed by the service, so a stranger reads it as absent. Nothing here writes.
    read: [Madrasah]
    do: [listMadrasahs, exploreMadrasahs, getMadrasah, getMadrasahOverview]
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:204
  - actor: medrese-head
    needs: the role MEDRESE_BASMUDERRIS in the medrese (the başmüderris)
    where: >-
      Holds by role default every medrese code: madrasah.hide, settings_edit, course_open, course_hide, muderris_manage, offsite_course_request and students_view.
      createCourseRequest is the head's alone: a nazır holding madrasah.offsite_course_request and the SYSTEM_ADMIN are refused (the service checks a held
      MEDRESE_BASMUDERRIS of the medrese named in the body). The SYSTEM_ADMIN passes the other decisions through the realm bypass.
    do: [getMadrasahBadgeCounts, hideMadrasah, restoreMadrasah, updateMadrasah, getMadrasahSettings, updateMadrasahSettings, listMadrasahCourses, listMadrasahHostingKosks,
      openMadrasahCourse, setMadrasahCourseMuderris, hideMadrasahCourse, requestOffsiteCourse, listOffsiteCourseRequests, listMadrasahStudents, getMadrasahDashboard,
      createCourseRequest]
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:382
  - actor: medrese-nazir-with-grant
    needs: the role MEDRESE_NAZIR in the medrese, and the medrese code granted to them there
    where: >-
      Holds nothing by default, and only the code that was granted. students_view opens getMadrasahBadgeCounts, listMadrasahStudents and getMadrasahDashboard;
      settings_edit opens updateMadrasah, getMadrasahSettings and updateMadrasahSettings; course_open opens openMadrasahCourse and listMadrasahHostingKosks
      (a grant held in a köşk that gave the medrese no hosting right does not help); muderris_manage opens setMadrasahCourseMuderris; course_hide opens hideMadrasahCourse;
      any one of course_open, course_hide and muderris_manage opens listMadrasahCourses; offsite_course_request opens requestOffsiteCourse and listOffsiteCourseRequests.
      A nazır never hides, restores or deletes the medrese and never sends a course request.
    do: [getMadrasahBadgeCounts, listMadrasahStudents, getMadrasahDashboard, updateMadrasah, getMadrasahSettings, updateMadrasahSettings, openMadrasahCourse,
      listMadrasahHostingKosks, setMadrasahCourseMuderris, hideMadrasahCourse, listMadrasahCourses, requestOffsiteCourse, listOffsiteCourseRequests]
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:382
  - actor: medaris-nazim-over-medreses
    needs: the role MEDARIS_NAZIM in the platform scope, and the platform code granted to them
    where: >-
      Holds nothing by default, and only the code that was granted: platform.madrasah_create opens createMadrasah; platform.madrasah_edit opens updateMadrasah,
      hideMadrasah, restoreMadrasah, getMadrasahDeactivationPreview and deactivateMadrasah; platform.head_muderris_manage opens getMadrasahHeadDelegations
      and setMadrasahHeadMuderris; any one of the three opens getMadrasahDirectory (platform.madrasah_nazir_grant alone opens nothing). It holds none of the
      medrese's own codes: a Medaris nazımı with only platform.madrasah_edit is refused on the settings routes.
    do: [getMadrasahDirectory, createMadrasah, getMadrasahHeadDelegations, setMadrasahHeadMuderris, updateMadrasah, hideMadrasah, restoreMadrasah, getMadrasahDeactivationPreview,
      deactivateMadrasah]
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:283
  - actor: medrese-deleter
    needs: the realm role SYSTEM_ADMIN in the access token
    where: >-
      madrasah.delete is an implicit code held by no role, grant or relationship (MDRS-124): the başmüderris and the nazırs are refused, and only the SYSTEM_ADMIN
      deletes for real (invariant deleting-for-real-is-the-basnazims).
    do: [deleteMadrasah]
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:691
  - actor: kosk-nazim-over-course-requests
    needs: >-
      the role KOSK_NAZIM of the köşk the request is addressed to, or the SYSTEM_ADMIN: decided inside CourseRequestService, since these routes carry AuthGuard
      alone and no @Authz
    where: >-
      The köşk's nazım lists the course requests sent to the köşk and accepts or rejects them; a medrese's head sends one (createCourseRequest, under medrese-head).
    do: [listCourseRequests, acceptCourseRequest, rejectCourseRequest]
    source: apps/tedrisat/src/course-request/course-request.controller.ts:86

invariants:
  - id: madrasah-handle-unique
    rule: >-
      A medrese's handle is unique (the database constraint madrasahs_handle_unique) and is 2 to 60 characters of lower-case letters, digits and
      inner hyphens. A handle made from the name is numbered -2, -3, ... until free; one the caller chose that is taken is 409
      MADRASAH_HANDLE_TAKEN, and so is losing the race on the unique index.
    source: apps/tedrisat/src/madrasah/dto/create-madrasah.dto.ts:15

  - id: madrasah-opens-with-its-head
    rule: >-
      A medrese never exists without its başmüderris and its audit row: the Madrasah, the MEDRESE_BASMUDERRIS role assignment (no end, granted_by
      the opener) and the row madrasah.create are written in one transaction, so a refused handle writes none of them.
    source: apps/tedrisat/src/madrasah/madrasah.repository.ts:265

  - id: madrasah-single-head-in-code
    rule: >-
      A medrese has at most one held başmüderris, because setting the head revokes every other holder. The database has no constraint for it
      (only one held row per user, role and scope, and a CHECK that MEDRESE_BASMUDERRIS has scope type madrasah); the directory and the overview show
      the earliest held.
    source: apps/tedrisat/src/madrasah/madrasah.repository.ts:491

  - id: madrasah-head-change-answers-every-hand-on
    rule: >-
      Replacing a head needs one TAKE_OVER or DROP per item the outgoing head handed on (roles in the medrese and its courses, grants, groups): no
      more, no fewer. A taken-over grant cannot sit under a seat dropped in the same change, and a dropped seat that still has hand-ons held under
      it blocks the change. Naming the sitting head again, or appointing into an empty seat, asks nothing.
    source: apps/tedrisat/src/madrasah/madrasah.repository.ts:535

  - id: madrasah-head-end-not-past
    rule: The new head's endsAt must not be in the past (400 GRANT_EXPIRY_INVALID).
    source: apps/tedrisat/src/madrasah/madrasah.service.ts:231

  - id: madrasah-head-is-never-named-by-themselves
    rule: >-
      Anyone but SYSTEM_ADMIN is refused (403 SELF_GRANT_REFUSED, and the audit row permission.self_grant_refused) when they name themselves head of a
      medrese or take over a hand-on given to themselves, whatever they hold (always). Naming oneself müderris of a medrese course is allowed only
      to someone who already holds every course code in the medrese, the başmüderris.
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:405

  - id: madrasah-head-is-a-known-account
    rule: >-
      A person named head of a medrese is a known account, in the users table or the realm, as a müderris of a course (404 MUDERRIS_UNKNOWN_USER) or a
      köşk nazım must be.
    holds: false
    finding: head-account-not-checked
    note: >-
      Neither POST /madrasahs nor PUT /madrasahs/{id}/head-muderris asks the users table or the realm whether the named account exists
      (role_assignments.user_id is no foreign key; MadrasahService.open has no directory call). Read from the code, not run.
    source: apps/tedrisat/src/madrasah/madrasah.service.ts:168

  - id: madrasah-hide-cascades-with-one-instant
    rule: >-
      Hiding a medrese hides all its shown courses with the medrese's own instant and level (and bumps their version); restoring brings back exactly
      the courses stamped with that instant. A course hidden earlier on its own stays hidden.
    source: apps/tedrisat/src/madrasah/madrasah.repository.ts:650

  - id: madrasah-hide-and-restore-by-ladder
    rule: >-
      Hiding a medrese is by platform.madrasah_edit (the platform level) or madrasah.hide (the medrese level), the highest rung held. Restoring needs
      the level that hid it or above (ranks course, medrese, köşk, platform); a medrese hidden before levels were recorded counts as hidden at the
      medrese level. A nazır given "change the settings" cannot hide it: madrasah.hide is a role default no grant carries.
    source: apps/tedrisat/src/archive/hide-level.ts:101

  - id: madrasah-hidden-is-closed-to-the-public
    rule: >-
      A hidden medrese answers 404 MADRASAH_NOT_FOUND on its page and its overview to everyone except holders of madrasah.hide or
      platform.madrasah_edit, and is left out of the public list, the course list and the hosting list; its directory row stays for the platform.
    holds: false
    finding: explore-lists-hidden
    note: >-
      GET /madrasahs/explore has no archivedAt filter on madrasahs (madrasah.repository.ts:1030), so a hidden medrese is listed there with courseCount 0,
      its name and handle. Not pinned by discover.e2e.spec.ts. Read from the code, not run.
    source: apps/tedrisat/src/madrasah/madrasah.service.ts:92

  - id: madrasah-status-precedence
    rule: >-
      In the directory HIDDEN wins over PASSIVE wins over ACTIVE, and since is the hide time before the passive time. Restoring a medrese that is both
      hidden and passive returns it passive.
    source: apps/tedrisat/src/madrasah/madrasah.repository.ts:847

  - id: madrasah-passivation-is-confirmed
    rule: >-
      Deactivating needs the confirmation of a preview read by the same caller. The impact is measured again under the medrese lock and any change is 409
      PASSIVATION_IMPACT_CHANGED with the fresh preview and no write. The başmüderris is taken off the post, the nazırs and every grant stay, the
      courses close in every köşk, and appointing a head makes it active again.
    source: apps/tedrisat/src/passivation/passivation-impact.repository.ts:172

  - id: madrasah-settings-save-noop
    rule: >-
      A settings save that changes nothing writes nothing: no updatedBy, no updatedAt, no audit row. Otherwise one transaction writes the medrese row,
      the MadrasahSettings upsert and the audit row madrasah.settings.update with the changes.
    source: apps/tedrisat/src/madrasah/madrasah-settings.ts:30

  - id: madrasah-update-is-audited
    rule: >-
      Changing a medrese's name, description or public handle writes an audit row, whichever route does it.
    holds: false
    finding: patch-madrasah-unaudited
    note: >-
      PATCH /madrasahs/{id} writes no audit row, while PATCH /madrasahs/{id}/settings (the same name and description) writes madrasah.settings.update.
      Read from the code, not run.
    source: apps/tedrisat/src/madrasah/madrasah.repository.ts:189

  - id: madrasah-always-approval-reaches-enrollment
    rule: >-
      With alwaysApproval on, every new enrollment in a course of the medrese is PENDING whatever the course's own requiresApproval says; courses the
      medrese opens also get requiresApproval true; and setting.approval_off is closed in its courses, except to a person with a grant from above the
      medrese (the platform).
    source: apps/tedrisat/src/course/course.service.ts:1556

  - id: madrasah-closed-course-required
    rule: >-
      With closedCourseRequired on, a course the medrese opens is created closed (isClosed true), and a course save that sets isClosed false is
      409 PLATFORM_POLICY_LOCKED (CLOSED_COURSE_REQUIRED) unless the caller holds setting.course_open through a grant from above.
    note: "No test pins the medrese-level lock specifically (platform-admin.e2e.spec.ts covers the approval lock only)."
    source: apps/tedrisat/src/course/course.service.ts:995

  - id: madrasah-no-public-recordings-closes-recordings
    rule: >-
      With noPublicRecordings on, no recording of the medrese's courses is shown to someone who cannot read the course's content.
    holds: false
    finding: policy-no-public-recordings-inert
    note: >-
      The policy is stored and loaded as one that would close setting.recordings_public, but no handler asks that code and
      CourseService.publicRecordingsAllowed reads only the platform and the köşk flags (course.service.ts:857-867), so the switch has no effect.
      policyNoPublicRecordings appears only in madrasah.repository.ts, madrasah-settings.ts, the schema, the DTOs and tedrisat-authz-context.service.ts.
    source: apps/tedrisat/src/course/course.service.ts:857

  - id: madrasah-opens-courses-only-with-a-hosting-right
    rule: >-
      A medrese opens a course only in a köşk that holds an unrevoked hosting right for it and is not hidden, and only while the medrese itself is
      shown. The course starts as a DRAFT authored by the caller with 1 to 20 müderrisler (unique, all known accounts, one imam: the lone one by
      default, else named and listed). The policies are applied under the medrese's lock, so a policy saved a moment ago cannot be missed.
    source: apps/tedrisat/src/madrasah/course/madrasah-course.repository.ts:148

  - id: madrasah-course-has-one-imam
    rule: >-
      A course has exactly one held imam: a partial unique index (role_assignments_one_imam_per_course_idx) and a CHECK that the imam is a MUDERRIS;
      replacing the müderrisler keeps it.
    source: apps/tedrisat/src/database/schema/role-assignment.schema.ts:100

  - id: madrasah-is-not-above-the-kosk
    rule: >-
      A medrese's routes on a course stop at a hidden köşk (404 COURSE_NOT_FOUND, before anything is written) and never reach what belongs to the
      köşk; the course list and the hosting list leave out hidden köşks.
    source: apps/tedrisat/src/madrasah/course/madrasah-course.controller.ts:147

  - id: madrasah-course-hide-keeps-first-hider
    rule: >-
      A course already hidden cannot be hidden again (409 MADRASAH_COURSE_ALREADY_HIDDEN), so the first hider's archivedBy and archivedLevel are the ones
      the restore rule judges.
    source: apps/tedrisat/src/madrasah/course/madrasah-course.repository.ts:344

  - id: madrasah-talebe-are-derived
    rule: >-
      A medrese's talebe are never stored: they are everyone with an ENROLLED or COMPLETED enrollment in one of its courses that is not hidden. A REVOKED
      or PENDING enrollment does not count.
    note: >-
      MadrasahRepository.findTalebeIds, which nothing calls, does not leave out hidden courses; the students list (the code that is used) does.
    source: apps/tedrisat/src/madrasah/portal/madrasah-portal.repository.ts:81

  - id: madrasah-list-limits
    rule: >-
      limit is clamped to 1..50 and page to at least 1 on the public list, the directory and the students list, and a search text is cut to 100
      characters, never refused; a repeated query key is read as absent.
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:212

  - id: madrasah-anonymous-mask
    rule: >-
      For a request with no token the medrese list and page carry createdBy null and nazirIds [].
    source: apps/tedrisat/src/madrasah/anonymous-mask.ts:9

  - id: madrasah-head-id-is-not-public
    rule: >-
      A person's id is not for the public: a caller with no token learns who heads a medrese by name only, never by id, on every route.
    holds: false
    finding: overview-exposes-head-id
    note: >-
      GET /madrasahs/{id}/overview returns headMuderris.id to a caller with no token; only the page and the list are masked. Not in the inventory;
      found while writing. Read from the code, not run.
    source: apps/tedrisat/src/madrasah/madrasah.repository.ts:1220

  - id: madrasah-delete-keeps-its-courses
    rule: >-
      A medrese deleted for real (SYSTEM_ADMIN only) takes its role assignments, settings, hosting rights, course requests and appeals with it, and its
      courses stay in their köşks with madrasah_id null; the audit row madrasah.delete names the caller and the number of courses kept.
    source: apps/tedrisat/src/madrasah/madrasah.repository.ts:205

  - id: madrasah-students-read-is-audited
    rule: >-
      Reading the names and e-mail addresses of a medrese's talebe writes an audit row, as reading a course roster does (course.roster_read).
    holds: false
    finding: students-read-unaudited
    note: >-
      GET /madrasahs/{id}/students returns them for the whole medrese with no audit row. Read from the code, not run.
    source: apps/tedrisat/src/madrasah/portal/madrasah-portal.controller.ts:67

  - id: madrasah-pano-decides-like-the-course-routes
    rule: >-
      A pending application shows the buttons of deciding it to exactly the callers the approve and reject routes accept.
    holds: false
    finding: viewer-may-decide-skips-head
    note: >-
      viewerMayDecide is true only for SYSTEM_ADMIN, a held MUDERRIS of the course or a held KOSK_NAZIM of its köşk (madrasah-portal.repository.ts:362),
      while the catalogue gives MEDRESE_BASMUDERRIS enrollment.decide by role default in its medrese's courses and approveEnrollment asks
      enrollment.decide; a grant of it to a nazır is ignored too. Read from the code, not run.
    source: apps/tedrisat/src/madrasah/portal/madrasah-portal.repository.ts:362

  - id: course-request-answered-once
    rule: >-
      A course request is PENDING and becomes ACCEPTED or REJECTED once: the update is conditional on status PENDING, so a race is 409
      COURSE_REQUEST_NOT_PENDING. A course answers at most one request, an accepted request names a course of its own köşk, and a rejection needs a
      reason of at most 1000 characters. (An accepted appeal puts a rejected request back to PENDING.)
    source: apps/tedrisat/src/course-request/course-request.repository.ts:216

  - id: course-request-who-sends-and-answers
    rule: >-
      Sending through POST /kosks/{id}/course-requests takes the held MEDRESE_BASMUDERRIS role of the medrese; sending through
      POST /madrasahs/{id}/offsite-course-requests takes the permission madrasah.offsite_course_request on it. Answering and listing take a held
      KOSK_NAZIM of the köşk or SYSTEM_ADMIN: not a Medaris nazımı, not a başmüderris, not a nazır with grants such as course.manage_all.
    source: apps/tedrisat/src/course-request/course-request.service.ts:205

  - id: course-request-routes-agree
    rule: >-
      The two routes that send a course request take the same callers, refuse the same köşks and leave the same audit row.
    holds: false
    finding: two-course-request-routes
    note: >-
      POST /kosks/{id}/course-requests needs the role itself (a grant of madrasah.offsite_course_request does not pass), checks only that the köşk
      exists (KoskRepository.exists has no archivedAt filter, kosk.repository.ts:472), so a hidden köşk is accepted, and writes no audit row;
      POST /madrasahs/{id}/offsite-course-requests needs the permission, refuses hidden köşks and writes course_request.create. Read from the code, not run.
    source: apps/tedrisat/src/course-request/course-request.service.ts:104
