      received is listCourseRequests. Writes nothing.
    needs: "AuthGuard + AuthzGuard, @Authz(madrasah.offsite_course_request, byExistingMadrasah). Held by the başmüderris, a nazır granted it, and SYSTEM_ADMIN"
    result:
