      type: array
      items:
        type: object
        required: [id, name, field, courseCount]
        properties:
          id: { type: string, format: uuid, references: Kosk }
          name: { type: string }
          field: { type: [string, "null"], note: "the köşk's ilim alanı" }
          courseCount: { type: integer }
