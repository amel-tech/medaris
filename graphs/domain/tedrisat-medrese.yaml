            items:
              type: object
              required: [userId, name, title, unvan, email, isImam]
              properties:
                userId: { type: [string, "null"], format: uuid, note: "null for a müderris shown by name alone, with no account" }
                name: { type: string }
                title: { type: [string, "null"] }
                unvan: { enum: [PROF_DR, DOC_DR, DR, MUDERRIS, MOLLA, MUFTU, SEYH, HAFIZ, null] }
                email: { type: [string, "null"], sensitivity: personal, note: "null until that person has signed in once" }
                isImam: { type: boolean }
    refusals:
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      HTTP_400: { status: 400, note: "koskId is not a uuid or status is not DRAFT or PUBLISHED" }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller holds none of the three codes on the medrese" }
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:664

  deleteMadrasah: # MadrasahController.delete
    route: DELETE /madrasahs/{id}
    summary: Delete a medrese for real
    description: >-
      One transaction, the medrese row locked. Deletes the madrasahs row (its settings, hosting rights, course requests, appeals and legacy off-site requests go by cascade; a
      deck's madrasah_id is set null), deletes every role assignment of scope madrasah, history included (scope_id is no foreign key), and writes
      the audit row with the name, handle, the former nazırs and the number of courses kept. The courses stay in their köşks with madrasah_id null. Only SYSTEM_ADMIN:
      madrasah.delete is an implicit code that no role, grant or relationship holds.
    needs: "AuthGuard + AuthzGuard, @Authz(madrasah.delete, byExistingMadrasah). Held by SYSTEM_ADMIN alone, through the realm bypass; the başmüderris and the nazırs are refused (MDRS-124)"
    result:
      status: 200
      type: boolean
      description: "true"
    refusals:
      MADRASAH_NOT_FOUND: { status: 404, note: "no such medrese or the id is not a uuid (byExistingMadrasah); or it vanished under the lock (madrasah.service.ts:436)", source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110 }
      AUTHZ_FORBIDDEN: { status: 403, note: "anyone but SYSTEM_ADMIN" }
    sideEffects:
      - audit:madrasah.delete
    note: >-
      Not verified: whether PermissionGrant and PermissionGroup rows scoped to the deleted medrese are removed. This path does not touch them and
      permission.schema.ts has no foreign key to madrasahs; the role assignments their holders needed are deleted, so by
      permission-never-outlasts-its-role the grants stop counting. Read from the code, not run.
    source: apps/tedrisat/src/madrasah/madrasah.controller.ts:691

  # ---------------------------------------------------------------------------------------------------------------------------------
  # MadrasahCourseController (madrasah/course/madrasah-course.controller.ts): the courses a medrese opens in the köşks that host it,
  # and its requests for a course outside it
  # ---------------------------------------------------------------------------------------------------------------------------------
  listMadrasahHostingKosks: # MadrasahCourseController.hostingKosks
    route: GET /madrasahs/{id}/hosting-kosks
    summary: The köşks the medrese may open courses in
    description: >-
      The köşks holding an unrevoked hosting right for the medrese, hidden köşks left out, by name, each with its ilim alanı and how many of
      the medrese's courses that are not hidden (drafts included) it has there. Writes nothing.
    needs: "AuthGuard + AuthzGuard, @Authz(madrasah.course_open, byExistingMadrasah). Held by the başmüderris, a nazır granted it, and SYSTEM_ADMIN"
    result:
