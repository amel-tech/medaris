      status: 200
      type: string
      format: binary
      description: >-
        The template's bytes. Content-Type text/csv; charset=utf-8 or the spreadsheetml sheet type; Content-Disposition: attachment; filename="deste-ornek.<format>";
        Cache-Control: no-store.
    refusals:
      redirectToSignIn:
        status: 307
        redirect: the app's sign-in page, keeping callbackUrl
        note: >-
