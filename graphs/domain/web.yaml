  webUploadCourseResourceFile:
    route: POST /api/files/courses/{courseId}/resources
    summary: Adds a file to a course's resources
    description: >-
      Adds a file to a course's resources. The route reads the caller's access token on the server and streams the multipart body on to tedrisat unread (uploadCourseResourceFile,
      POST /courses/{id}/resources/files), with its Content-Type and so its boundary unchanged. Tedrisat decides the rest (who may, the 25 MB, the types it
      stores by their bytes) and its status and JSON come back as they are. next.config.js raises proxyClientMaxBodySize to 26 MB for it. Used by the "Dosya
      yükle" dialog of Müfredat (nazar) and of the curriculum editor (nizam).
    needs: >-
      a signed-in browser: the route reads the session's access token (getAccessToken) and adds it as a bearer; it checks no role. Who may do it is tedrisat's
      decision, as the `needs` of uploadCourseResourceFile.
    body:
      type: object
      required: [file]
      description: multipart/form-data
      properties:
        file:
          type: string
          format: binary
          description: at most 25 MB; PDF, PNG, JPEG, WebP, docx, xlsx, pptx or plain UTF-8 text, as read from its bytes
        name:
          type: string
          maxLength: 200
          description: the listed name; the file's own name without its extension when absent or blank
        meta: {type: string, maxLength: 120, description: a short line under the name}
    result:
      returns: CourseResource
      status: 201
      type: object
      required: [resource, courseVersion]
      description: the new CourseResource and the course's new version
      properties:
        resource:
          type: object
          description: >-
            the CourseResource as the course page lists it, with file {name, contentType, sizeBytes, downloadUrl}; downloadUrl is tedrisat's download route
            for it, a path from the API's root (/courses/<id>/resources/<rid>/file), which needs the caller's own token
        courseVersion: {type: integer}
    refusals:
      NOT_FOUND:
        status: 404
        note: >-
          A path id is not a uuid (isUuid). The route answers it itself, before it asks for a token and before tedrisat is called; a followed link is not
          redirected for it. Body {code: NOT_FOUND}.
        redirect: never
        source: apps/nazar/app/api/files/courses/[courseId]/resources/route.ts:24
      unauthenticated:
        status: 401
        note: >-
          No access token in the session (reauth absent), or tedrisat refused the token (reauth true, relay at file-proxy.ts:186). Body {kind: unauthenticated,
          reauth?: true}, the value handleUnauthenticated of @medaris/auth acts on. Tedrisat is not called when there is no token.
        source: libs/services/src/file-proxy/file-proxy.ts:137
      MULTIPART_REQUIRED:
        status: 415
        note: >-
          The Content-Type is not multipart/form-data with a boundary. Answered at the web edge, before anything is sent.
        source: libs/services/src/file-proxy/file-proxy.ts:236
      FILE_TOO_LARGE:
        status: 413
        note: >-
          The announced Content-Length is over 25 MB plus 64 KB of multipart allowance: refused before a byte of the body is read, body {code, status, message,
          context: {maxBytes}}. A body that announces no length is cut off by tedrisat as it streams, with the same code. Also relayed from tedrisat.
        source: libs/services/src/file-proxy/file-proxy.ts:247
      FILE_REQUIRED:
        status: 400
        note: >-
          The request has no body. Tedrisat answers the same code for a multipart body that holds no file. Also relayed from tedrisat.
        source: libs/services/src/file-proxy/file-proxy.ts:255
      TEDRISAT_UNREACHABLE:
        status: 502
        note: The call to tedrisat itself failed (the service could not be reached).
        source: libs/services/src/file-proxy/file-proxy.ts:176
      AUTHZ_FORBIDDEN:
        status: 403
        note: Relayed as it came, from uploadCourseResourceFile.
        source: libs/services/src/file-proxy/file-proxy.ts:185
      VALIDATION_ERROR:
        status: 400
        note: Relayed as it came, from uploadCourseResourceFile.
        source: libs/services/src/file-proxy/file-proxy.ts:185
      COURSE_NOT_FOUND:
        status: 404
        note: Relayed as it came, from uploadCourseResourceFile.
        source: libs/services/src/file-proxy/file-proxy.ts:185
      FILE_TYPE_NOT_ALLOWED:
        status: 415
        note: Relayed as it came, from uploadCourseResourceFile.
        source: libs/services/src/file-proxy/file-proxy.ts:185
      STORAGE_NOT_CONFIGURED:
        status: 503
        note: Relayed as it came, from uploadCourseResourceFile.
        source: libs/services/src/file-proxy/file-proxy.ts:185
      STORAGE_UNAVAILABLE:
        status: 503
        note: Relayed as it came, from uploadCourseResourceFile.
        source: libs/services/src/file-proxy/file-proxy.ts:185
    sideEffects:
    - >-
      calls: uploadCourseResourceFile (tedrisat POST /courses/{id}/resources/files) with the caller's bearer token; what it writes (audit rows, storage) is
      tedrisat's
    note: >-
      Served by nazar (apps/nazar/app/api/files/courses/[courseId]/resources/route.ts:18), nizam (apps/nizam/app/api/files/courses/[courseId]/resources/route.ts:17):
      the same handler in each (@medaris/services/file-proxy).
    source: apps/nazar/app/api/files/courses/[courseId]/resources/route.ts:18

