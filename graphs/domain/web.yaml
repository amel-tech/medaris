      calls: addSubmissionReviewFile (tedrisat POST /courses/{id}/submissions/{submissionId}/review/files) with the caller's bearer token; what it writes
      (audit rows, storage) is tedrisat's
    note: >-
      Served by nazar (apps/nazar/app/api/files/courses/[courseId]/reviews/[submissionId]/route.ts:17) only (@medaris/services/file-proxy).
    source: apps/nazar/app/api/files/courses/[courseId]/reviews/[submissionId]/route.ts:17

  # ---- calendar: tedris ----
  webGetLessonCalendar:
    route: GET /api/lessons/{id}/calendar
    summary: One celse as an iCalendar file, through the web app
    description: >-
      The "Apple Takvim (.ics)" link of the tedris course card, a plain navigation, and the fetch of the celse page's calendar menu. The browser cannot send
      the access token, so the route fetches getLessonCalendar from tedrisat with it and hands the file on as an attachment named medaris-<id>.ics. Tedrisat
      decides who may have it (the rule of the celse page) and builds the entry.
    needs: >-
      a signed-in browser (getAccessToken); a visitor is sent to sign-in. Who may have the file is tedrisat's decision, as getLessonCalendar
    query:
      type: object
      properties:
        locale:
          enum: [tr, en, ar]
          description: The language of the entry's one-line description; any other value is ignored. The link sends tr.
    result:
      status: 200
      type: string
      contentMediaType: text/calendar; charset=utf-8
      description: >-
        The entry as tedrisat built it. Content-Disposition: attachment; filename="medaris-<id>.ics"; Cache-Control: private, no-store.
    refusals:
      HTTP_404:
        status: 404
        note: 'The id is not a uuid. Body {error: "Not found"}; answered before the session is asked.'
        source: apps/tedris/app/api/lessons/[id]/calendar/route.ts:30
      redirectToSignIn:
        status: 307
        redirect: >-
          the app's sign-in page for /api/lessons/{id}/calendar[?locale=<locale>], so that the download starts after sign-in
        note: >-
          No access token, or tedrisat answered 401. A link followed as a download would only save a JSON 401 as a broken file, so this route redirects (NextResponse.redirect,
          307) instead of answering JSON.
        source: apps/tedris/app/api/lessons/[id]/calendar/route.ts:43
      CALENDAR_NOT_CONFIGURED:
        status: 503
        note: 'Relayed from getLessonCalendar with its status; the body is {error: "CALENDAR_NOT_CONFIGURED"}, the code only.'
        source: apps/tedris/app/api/lessons/[id]/calendar/route.ts:70
      LESSON_NOT_FOUND:
        status: 404
        note: 'Relayed from getLessonCalendar with its status; the body is {error: "LESSON_NOT_FOUND"}, the code only.'
        source: apps/tedris/app/api/lessons/[id]/calendar/route.ts:70
      LESSON_NOT_SCHEDULED:
        status: 409
        note: 'Relayed from getLessonCalendar with its status; the body is {error: "LESSON_NOT_SCHEDULED"}, the code only.'
        source: apps/tedris/app/api/lessons/[id]/calendar/route.ts:70
      HTTP_500:
        status: 500
        note: >-
          Any other failure of the call (an answer that is not one of 400, 403, 404, 409, 503, or an error that is not tedrisat's). Body {error: "Failed to
          fetch the calendar file"}.
        source: apps/tedris/app/api/lessons/[id]/calendar/route.ts:85
    sideEffects:
    - 'calls: getLessonCalendar (tedrisat GET /lessons/{id}/calendar.ics) with the caller''s bearer token'
    note: Served by tedris only (apps/tedris/app/api/lessons/[id]/calendar/route.ts:23).
    source: apps/tedris/app/api/lessons/[id]/calendar/route.ts:23

  webGetCalendarFeed:
    route: GET /calendar/{file}
    summary: The personal calendar subscription feed, through the web app
    description: >-
      The address Apple Calendar and Google Calendar poll: /calendar/<token>.ics on tedris-web, passed on to tedrisat's getCalendarFeed (GET {TEDRISAT_API_BASE_URL}/calendar/<token>.ics)
      with no Authorization header. A calendar app cannot sign in, so the secret in the address is the credential and tedrisat decides which feed it is and
      what is in it. tedris's proxy.ts excludes calendar/ from its matcher: no sign-in redirect, no session renewal, no locale rewrite. The account calendar
      page shows the link.
    needs: 'nothing: no session; the 43-character token in the address is the credential (getCalendarFeed)'
    result:
      status: 200
      type: string
      contentMediaType: text/calendar; charset=utf-8
      description: >-
        The feed as tedrisat built it. Content-Disposition: inline; filename="medaris.ics"; Cache-Control: private, no-store; X-Robots-Tag: noindex.
    refusals:
      HTTP_404:
        status: 404
        note: >-
          The file is not 43 base64url characters and ".ics" (^[A-Za-z0-9_-]{43}\.ics$). Body {error: "Not found"}; tedrisat is not called.
        source: apps/tedris/app/calendar/[file]/route.ts:22
      CALENDAR_NOT_CONFIGURED:
        status: 503
        note: >-
          Relayed from getCalendarFeed with its status; the body is {error: "CALENDAR_NOT_CONFIGURED"} and Cache-Control: no-store.
        source: apps/tedris/app/calendar/[file]/route.ts:40
      CALENDAR_FEED_NOT_FOUND:
        status: 404
        note: >-
          Relayed from getCalendarFeed with its status; the body is {error: "CALENDAR_FEED_NOT_FOUND"} and Cache-Control: no-store.
        source: apps/tedris/app/calendar/[file]/route.ts:40
      HTTP_429:
        status: 429
        note: >-
          Relayed from getCalendarFeed with its status; the body is {error: "HTTP_429"} and Cache-Control: no-store, Retry-After as tedrisat sent it.
        source: apps/tedris/app/calendar/[file]/route.ts:40
      HTTP_502:
        status: 502
        note: 'The call to tedrisat itself failed. Body {error: "Failed to fetch the calendar feed"}.'
        source: apps/tedris/app/calendar/[file]/route.ts:35
    sideEffects:
    - >-
      calls: getCalendarFeed (tedrisat GET /calendar/{file}) with no token; tedrisat limits the polls of one feed's owner (20 a minute)
    note: Served by tedris only (apps/tedris/app/calendar/[file]/route.ts:17).
    source: apps/tedris/app/calendar/[file]/route.ts:17

  # ---- decks: the deck file routes (tedris, nazar) and the legacy JSON readers (tedris, nizam) ----
  webExportCards:
    route: GET /api/decks/{id}/export
    summary: A deck's cards as an xlsx or csv file, through tedris
    description: >-
      The "Dışa aktar" button of the tedris deck page (xlsx only). The route hands the request on to tedrisat with the caller's own access token and gives
      the answer back as it came, body and status included, with only the content-type, content-disposition, content-length and retry-after headers; the refusals
      of tedrisat (403, 404, 429) are the page's to show. Only the deck's author gets a file.
    needs: >-
      a signed-in browser (getAccessToken). Who may export is tedrisat's decision: deck.manage_cards on the deck, as exportCards
    query:
      type: object
      properties:
        format:
          enum: [xlsx, csv]
          default: xlsx
          description: Any other value is 400.
    result:
      status: 200
      type: string
      format: binary
      description: >-
        The file as tedrisat sent it, with its Content-Disposition (an attachment named for the deck) and Content-Type.
    refusals:
      HTTP_400:
        status: 400
        note: 'The id is not a uuid, or format is neither xlsx nor csv. Body {error: "Bad request"}; tedrisat is not called.'
        source: apps/tedris/app/api/decks/[id]/export/route.ts:14
      HTTP_401:
        status: 401
        note: >-
          No access token. Body {data: null, error: "Unauthorized"}; tedrisat is not called. A 401 from tedrisat is relayed as it came.
        source: apps/tedris/lib/tedrisat-file-proxy.ts:28
      DECK_NOT_FOUND:
        status: 404
        note: Relayed as it came, with tedrisat's status and body, from exportCards.
        source: apps/tedris/lib/tedrisat-file-proxy.ts:51
      AUTHZ_FORBIDDEN:
        status: 403
        note: Relayed as it came, with tedrisat's status and body, from exportCards.
        source: apps/tedris/lib/tedrisat-file-proxy.ts:51
      DECK_FORBIDDEN:
        status: 403
        note: Relayed as it came, with tedrisat's status and body, from exportCards.
        source: apps/tedris/lib/tedrisat-file-proxy.ts:51
      HTTP_429:
        status: 429
        note: Relayed as it came, with tedrisat's status and body, from exportCards.
        source: apps/tedris/lib/tedrisat-file-proxy.ts:51
      HTTP_502:
        status: 502
        note: 'The call to tedrisat itself failed. Body {data: null, error: "Failed to reach the service"}.'
        source: apps/tedris/lib/tedrisat-file-proxy.ts:55
    sideEffects:
    - >-
      calls: exportCards (tedrisat GET /flashcard/decks/{deckId}/cards/bulk/export?format=) with the caller's bearer token
    note: Served by tedris only (apps/tedris/app/api/decks/[id]/export/route.ts:7).
    source: apps/tedris/app/api/decks/[id]/export/route.ts:7

  webImportCards:
    route: POST /api/decks/{id}/import
    summary: A csv or xlsx file of cards into a deck, through tedris
    description: >-
      The "İçe aktar" dialog of the tedris deck page. The route reads the multipart form, takes its `file` part, packs it into a new FormData (any other field
      is dropped) and hands it on to tedrisat with the caller's access token; tedrisat's answer comes back as it came, so the 422 with its row errors (context.errors)
      is the dialog's to show. The size (5 MB) and the type are tedrisat's checks. Only the deck's author may.
    needs: >-
      a signed-in browser (getAccessToken). Who may import is tedrisat's decision: deck.create_card on the deck, as importCards
    body:
      type: object
      required: [file]
      description: multipart/form-data
      properties:
        file:
          type: string
          format: binary
          description: A csv, text or xlsx file of cards; at most 5 MB at tedrisat.
    result:
      type: object
      required: [count]
      properties:
        count: {type: integer}
      status: 201
    refusals:
      HTTP_400:
        status: 400
        note: >-
          The id is not a uuid, or the multipart body has no `file` part. Body {error: "Bad request"}; tedrisat is not called. Tedrisat's own HTTP_400 is
          relayed under the same code.
        source: apps/tedris/app/api/decks/[id]/import/route.ts:14
      HTTP_401:
        status: 401
        note: >-
          No access token. Body {data: null, error: "Unauthorized"}; tedrisat is not called. A 401 from tedrisat is relayed as it came.
        source: apps/tedris/lib/tedrisat-file-proxy.ts:28
      DECK_NOT_FOUND:
        status: 404
        note: Relayed as it came, with tedrisat's status and body, from importCards.
        source: apps/tedris/lib/tedrisat-file-proxy.ts:51
      AUTHZ_FORBIDDEN:
        status: 403
        note: Relayed as it came, with tedrisat's status and body, from importCards.
        source: apps/tedris/lib/tedrisat-file-proxy.ts:51
      BULK_ROW_LIMIT_EXCEEDED:
