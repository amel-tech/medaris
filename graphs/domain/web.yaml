        properties:
          data:
            type: array
            items: {type: object, references: Deck}
          error: {type: 'null'}
      - type: array
        description: nizam
        items: {type: object, references: Deck}
    refusals:
      HTTP_401:
        status: 401
        note: 'No access token. Body {data: null, error: "Unauthorized"} (tedris) or {error: "Unauthorized"} (nizam).'
        source: apps/tedris/app/api/decks/route.ts:11
      HTTP_500:
        status: 500
        note: >-
          Any failure of the call. Body {data: null, error: "Failed to fetch decks"} (tedris) or {error: "Failed to fetch card"} (nizam, whose text names
