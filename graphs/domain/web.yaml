    description: >-
      A legacy reader: it calls getCard with the caller's token and answers the card itself. tedrisat's 403 and 404 come back as {error: "Forbidden"} and
      {error: "Not found"}; nizam also maps a tedrisat 401 to {error: "Unauthorized"}, tedris does not. Called by no page of the app (DCK-22); the route stays
      reachable.
    needs: a signed-in browser (getAccessToken); who may read the card is tedrisat's decision, as getCard
    result: {status: 200, returns: Flashcard}
    refusals:
      HTTP_401:
        status: 401
        note: 'No access token, or (nizam only) tedrisat refused the token. Body {error: "Unauthorized"}.'
        source: apps/tedris/app/api/cards/[id]/route.ts:25
      HTTP_403:
        status: 403
        note: 'Tedrisat answered 403. Body {error: "Forbidden"}.'
        source: apps/tedris/app/api/cards/[id]/route.ts:47
      HTTP_404:
        status: 404
        note: 'Tedrisat answered 404 (no such card). Body {error: "Not found"}.'
        source: apps/tedris/app/api/cards/[id]/route.ts:47
      HTTP_500:
        status: 500
        note: 'Any other failure. Body {error: "Failed to fetch card"}.'
        source: apps/tedris/app/api/cards/[id]/route.ts:60
    sideEffects:
    - 'calls: getCard (tedrisat GET /flashcard/cards/{id}) with the caller''s bearer token'
    note: >-
      Served by tedris (apps/tedris/app/api/cards/[id]/route.ts:14) and nizam (apps/nizam/app/api/cards/[id]/route.ts:14).
    source: apps/tedris/app/api/cards/[id]/route.ts:14

  # ---- audit log: nizam ----
  webExportAuditLog:
    route: GET /api/audit-log/export
    summary: The audit log, filtered as the page is, as a CSV file, through nizam
    description: >-
      "Dışa aktar" of nizam's Denetim kaydı page. The page's own filters (actor, type, scope, range, and the days of a custom range) are read from the address,
      turned into the API's query (a range becomes from and to as ISO times; a picked day starts and ends at UTC+3) and sent to exportAuditLog with the caller's
      token. Tedrisat decides who may have the file and writes the export to the log; any refusal of tedrisat is passed on with its status and the one text
      "Export failed". An unknown type, scope or range is dropped, as the page does.
    needs: >-
      a signed-in browser (getAccessToken). Who may export is tedrisat's decision: platform.audit_read, the başnazım, or a Medaris nazım holding it, as exportAuditLog
    query:
      type: object
      properties:
        actor: {type: string}
        type:
          enum:
          - CONTENT_READ
          - PRIVATE_DECK_READ
          - PERSONAL_DATA_READ
          - USER_LOOKUP
          - GRANT
          - ROLE_CHANGE
          - POLICY_CHANGE
          - BAN
          - HIDE
          - HOSTING
          - TAKEOVER
          - SELF_GRANT_REFUSED
          - APPEAL
          - PERMANENT_BAN
          - PERMANENT_DELETE
          - EXPORT
        scope:
          enum: [PLATFORM, KOSK, MADRASAH]
        range:
          enum: [24h, 7d, 30d, custom]
        from:
          type: string
          format: date
          description: Read only with range=custom; a day, YYYY-MM-DD.
        to:
          type: string
          format: date
          description: Read only with range=custom; a day, YYYY-MM-DD.
    result:
      status: 200
      type: string
      contentMediaType: text/csv; charset=utf-8
      description: >-
        The CSV tedrisat built, streamed. Content-Disposition: tedrisat's, else attachment; filename="denetim-kaydi.csv"; Cache-Control: private, no-store.
    refusals:
      HTTP_401:
        status: 401
        note: 'No access token. Body {error: "Unauthorized"}; tedrisat is not called.'
        source: apps/nizam/app/api/audit-log/export/route.ts:18
      HTTP_403:
        status: 403
        note: 'Tedrisat refused the caller (AUTHZ_FORBIDDEN). Body {error: "Export failed"}: the code is not passed on.'
        source: apps/nizam/app/api/audit-log/export/route.ts:37
      HTTP_400:
        status: 400
        note: 'Tedrisat refused the query (VALIDATION_ERROR). Body {error: "Export failed"}.'
        source: apps/nizam/app/api/audit-log/export/route.ts:37
      HTTP_502:
        status: 502
        note: 'The call to tedrisat itself failed. Body {error: "Export failed"}.'
        source: apps/nizam/app/api/audit-log/export/route.ts:52
    sideEffects:
    - >-
      calls: exportAuditLog (tedrisat GET /nizam/audit-log/export) with the caller's bearer token; tedrisat writes the audit row audit.export
    note: >-
      Served by nizam only (apps/nizam/app/api/audit-log/export/route.ts:16). Any other upstream status (401, 429, 500) is also passed on with {error: "Export
      failed"}.
    source: apps/nizam/app/api/audit-log/export/route.ts:16

  # ---- landing: the contact form and the two ways into tedris ----
  submitContactForm:
    route: POST /api/iletisim
    summary: Send the contact form's message to Medaris by e-mail
    description: >-
      The "Gönder" button of landing's İletişim page. The message is e-mailed to the address the page prints (selam@medaris.app) with the visitor as Reply-To.
      Checked in this order: an SMTP sender (503 when LANDING SMTP_HOST is unset, or half-configured), the body (400), the throttle (429), the send (502).
      It never pretends a message was delivered.
    needs: 'nothing: anyone, no session; landing reads no cookie'
    body:
      type: object
      required: [ad, eposta, konu, mesaj]
      properties:
        ad:
          type: string
          minLength: 1
          maxLength: 120
          sensitivity: personal
          description: Trimmed.
        eposta:
          type: string
          maxLength: 254
          sensitivity: personal
          description: Trimmed; one bare address, no name, brackets, whitespace or list separator.
        konu:
          enum: [genel, hesap, ders, kvkk, ders-vermek, diger]
        mesaj: {type: string, minLength: 1, maxLength: 5000, description: Trimmed.}
    result:
      status: 200
      type: object
      required: [ok]
      properties:
        ok: {const: true}
    refusals:
      contact-delivery-not-configured:
        status: 503
        note: >-
          SMTP_HOST is unset (no sender), or set and misconfigured (SmtpConfigError: SMTP_FROM not a bare address, a bad SMTP_SECURITY or SMTP_PORT, a user
          without a password or the reverse, a password over SMTP_SECURITY=none). Body {error: "contact-delivery-not-configured"}. The page tells the visitor
          where to write instead.
        source: apps/landing/app/api/iletisim/route.ts:81
      invalid:
        status: 400
        note: 'The body is not JSON or fails the schema. Body {error: "invalid", fields: [the names of the fields at fault]}.'
        source: apps/landing/app/api/iletisim/route.ts:90
      too-many:
        status: 429
        note: >-
          More than 5 messages from one sender (the first x-forwarded-for, else x-real-ip, else "unknown") in 10 minutes, or 60 in all: per process, each
          instance keeps its own window. Body {error: "too-many"}.
        source: apps/landing/app/api/iletisim/route.ts:98
      contact-send-failed:
        status: 502
        note: 'The SMTP server refused or could not be reached. Body {error: "contact-send-failed"}.'
        source: apps/landing/app/api/iletisim/route.ts:107
    sideEffects:
    - >-
      mail: one message to selam@medaris.app through the LANDING SMTP_* sender, Reply-To the visitor, subject "İletişim formu · <topic> · <name>", the text
      "Ad soyad", "E-posta", "Konu" and the message (apps/landing/lib/contact-mail.ts:111)
    note: >-
      Served by landing only (apps/landing/app/api/iletisim/route.ts:59). The form keeps what was typed on every failure and shows one banner for all of them.
    source: apps/landing/app/api/iletisim/route.ts:59

  enterTedris:
    route: GET /api/tedris/{intent}
    summary: Send the visitor to tedris's registration or sign-in page
    description: >-
      The "Kayıt ol" and "Giriş yap" links of every landing page. tedris's own /auth/<intent> page starts the Keycloak round trip at once, so a visitor reaches
      Keycloak's registration or login form in one click. The hop exists because tedris's origin is server configuration (TEDRIS_APP_URL, read on every request,
      never at build time) while the landing pages are built statically. The address names no language: tedris reads the visitor's from the medaris-locale
      cookie.
    needs: 'nothing: anyone, no session'
    result: {status: 307, redirect: <TEDRIS_APP_URL><path prefix>/auth/<intent>}
    refusals:
      HTTP_404:
        status: 404
        note: The intent is neither register nor signin. An empty body.
        source: apps/landing/app/api/tedris/[intent]/route.ts:18
      HTTP_503:
        status: 503
        note: >-
          TEDRIS_APP_URL is not set: the plain text "TEDRIS_APP_URL is not configured", never a redirect to somewhere that only looks right.
        source: apps/landing/app/api/tedris/[intent]/route.ts:23
    note: >-
      Served by landing only (apps/landing/app/api/tedris/[intent]/route.ts:12). The target's own work is startSignIn, with intent=register for the registration
      form.
    source: apps/landing/app/api/tedris/[intent]/route.ts:12

  redirectToTedris:
    route: GET /tedris/{path}
    summary: Send the visitor on to a page of tedris
    description: >-
      A landing address that redirects to the same path on tedris-web: the "Keşfet" link (/tedris/discover) is its one caller in the pages. The path is zero
      or more segments (the optional catch-all [[...path]], so /tedris itself goes to tedris's root), each re-encoded with encodeURIComponent. TEDRIS_APP_URL
      is read on every request.
    needs: 'nothing: anyone, no session'
    result: {status: 307, redirect: <TEDRIS_APP_URL><path prefix>/<path>}
    refusals:
      HTTP_503:
        status: 503
        note: 'TEDRIS_APP_URL is not set: the plain text "TEDRIS_APP_URL is not configured".'
        source: apps/landing/lib/tedris.ts:21
    note: >-
      Served by landing only (apps/landing/app/tedris/[[...path]]/route.ts:5; the redirect is apps/landing/lib/tedris.ts:17).
    source: apps/landing/app/tedris/[[...path]]/route.ts:5

invariants:
  - id: web-token-stays-on-the-server
    rule: >-
      The browser holds no tedrisat token. Every route of the web apps that calls tedrisat for a person reads the access token of their session on the server
      (getAccessToken) and adds it as a bearer; with none it answers at the route and does not call. The session route serves the user claims and expiresAt,
      never a token. The one call made with no token is the calendar feed, whose address is the credential.
    source: libs/services/src/file-proxy/file-proxy.ts:144
  - id: web-return-to-is-same-origin
    rule: >-
      A callbackUrl is used only as a same-origin path with its query and fragment, at most 2048 characters, no control character and not under /api/auth;
      anything else is replaced by the app's afterSignIn, so no auth route is an open redirect. The proxy and the sign-in redirect go through the same check.
    source: libs/auth/src/server/return-to.ts:32
  - id: web-sign-in-start-is-capped
    rule: >-
      One browser may start 5 sign-in round trips in 5 minutes (AUTH_SIGN_IN_LIMIT, <count>/<seconds>, sets it per app); the next start is answered ?error=SignInLimit
      without asking Keycloak, and nothing starts another by itself. A visit that is only sent on because a session is already there counts too, so a page
      that keeps sending a signed-in browser here cannot loop for free.
    source: libs/auth/src/server/routes.ts:167
  - id: web-sign-out-is-a-same-site-post
    rule: >-
      A session ends only through POST /api/auth/signout from the app's own origin: GET is 405, an Origin other than the app's or Sec-Fetch-Site: cross-site
      is 403 before the IdP is asked. With an ID token it ends the Keycloak session too, with id_token_hint and post_logout_redirect_uri; the cookie goes
      whatever the store answers.
    source: libs/auth/src/server/routes.ts:351
  - id: web-session-store-down-is-not-signed-out
    rule: >-
      When the session store cannot be asked, /api/auth/session says 503, never null: null would read as signed out and reload the page for a person who is
      still signed in. The sign-in start refuses with OAuthSignin for the same reason, and the proxy decides nothing.
    source: libs/auth/src/server/routes.ts:436
  - id: web-backchannel-logout-token-is-used-once
    rule: >-
      A back-channel logout_token must verify against the realm's keys, the issuer and this app's client id, and its jti is accepted once (remembered for
      JTI_TTL_MS, 3 minutes); it ends every session of the SSO session, or of the account when it names no sid. With the session in the cookie nothing can
      be ended, and a valid token is answered 501 rather than 200.
    source: libs/auth/src/server/routes.ts:495
  - id: web-file-ids-are-uuids
    rule: >-
      The path ids of a file route are uuids, checked at the route before a token is asked for or tedrisat is called; anything else is 404 {code: NOT_FOUND},
      whatever the method and even for a link followed as a page.
    source: libs/services/src/file-proxy/file-proxy.ts:98
  - id: web-file-proxy-sends-only-file-paths
    rule: >-
      The file proxy sends only a path that starts with /courses/ or /lessons/ and is made of segments of letters, digits, - and _, at most 512 characters:
      no query, no fragment, no dot, no empty segment, no encoding. Anything else is 400 INVALID_PATH, unsent. It follows no redirect (redirect: error), so
      the stream and the token never go anywhere else.
    source: libs/services/src/file-proxy/file-proxy.ts:109
  - id: web-every-file-route-builds-a-proxiable-path
    rule: >-
      Every file route builds a tedrisat path that the proxy accepts, so that what the page offers can be downloaded.
    holds: false
    finding: evaluation-export-invalid-path
    note: >-
      nazar's /api/files/courses/{courseId}/evaluations asks for /courses/<id>/evaluations/export?lang=<lang> (route.ts:23), and isProxiablePath refuses any
      path with a query (file-proxy.ts:106-112; the proxy's own spec lists ?include=all among the refused paths), so "Excel indir" on the Değerlendirme page
      is 400 INVALID_PATH on every call and tedrisat never sees it. The route was added on 13 November 2026, after the proxy (12 October); no spec or e2e
      test downloads the sheet. Confirmed by calling proxyDownload on that path with a stub fetch (400 INVALID_PATH, fetch not called); not walked in a browser.
      Fix: send lang as a path-safe segment, or let the proxy take a query of its own making.
    source: apps/nazar/app/api/files/courses/[courseId]/evaluations/route.ts:24
  - id: web-download-refusal-returns-to-the-page
    rule: >-
      A refused download is answered by what asked for it: a fetch() (Sec-Fetch-Dest: empty, and a link with the download attribute) gets the refusal as JSON
      with tedrisat's status and body; a link followed as a page (Sec-Fetch-Dest: document, or Sec-Fetch-Mode: navigate where no destination is sent) gets
      a 303: to the sign-in page with the page it was on as callbackUrl for a 401 (reauth when tedrisat refused the token), else back to that page with ?fileError=<forbidden
      for 403, notFound for 400, 404 and 410, unavailable for 502, 503 and 504, failed for the rest>. A request that came from no page of this app (a typed
      or pasted address) gets a plain text in three languages with the status. Only the four reasons ever reach the address, never tedrisat's own code.
    source: libs/services/src/file-proxy/file-proxy.ts:351
  - id: web-refused-download-keeps-the-page
    rule: 'A download that is refused leaves the page as the person had it: focus, scroll and what they had typed.'
    holds: false
    finding: WRT-10
    note: >-
      The refusal is a 303 page navigation, so the whole celse page is loaded again: focus and scroll reset, and the text typed in the notes or the homework
      note and not yet saved is lost, with no warning (WRT-13). The reason then appears as a toast, and on nazar's Değerlendirme page not even that, because
      the page does not mount FileErrorNotice (F-D1-13). A fetch() download with the error shown in place would keep the page.
    source: libs/services/src/file-proxy/file-proxy.ts:351
  - id: web-sample-download-failure-is-explained
    rule: A template or file download that fails says so to the person who asked for it.
    holds: false
    finding: F-D1-19
    note: >-
      nazar's template links are plain <a download> to /api/decks/sample (import-cards-dialog.tsx:134-138), and every failure of that route is an empty 502,
      so the page says nothing. tedris's two links are plain <a download> as well (features/flashcards/components/import-cards-dialog.tsx:137, 143) and its
      route answers a JSON refusal; what a browser does with that behind such a link was not verified.
    source: apps/nazar/app/api/decks/sample/route.ts:31
  - id: web-calendar-feed-address-is-the-credential
    rule: >-
      The subscription feed is read with no session: the 43 base64url characters and ".ics" of the address are checked at the web edge (a miss is 404 and
      tedrisat is not called) and passed on with no Authorization header; the feed is never cached (no-store), marked noindex and answers inline. Which feed
      the secret opens, and how often it may be read, is tedrisat's.
    source: apps/tedris/app/calendar/[file]/route.ts:5
  - id: web-contact-never-pretends-delivery
    rule: >-
      The contact form's route answers 200 only after the SMTP server took the message. With no sender, or a misconfigured one, it answers 503 contact-delivery-not-configured
      and logs it, and the page tells the visitor where to write instead; a refused send is 502. A default local stack has no SMTP sender, so the form can
      only reach its error state there.
    source: apps/landing/app/api/iletisim/route.ts:76
  - id: web-landing-reads-the-tedris-address-per-request
    rule: >-
      Landing's redirects into tedris read TEDRIS_APP_URL on every request, never at build time, so one image serves every environment. When it is unset they
      answer 503 "TEDRIS_APP_URL is not configured" rather than send the visitor somewhere that only looks right.
    source: apps/landing/lib/tedris.ts:18
  - id: web-every-route-has-a-caller
    rule: Every route handler of a web app is called by some page of that app.
    holds: false
    finding: DCK-22
    note: >-
      The GET handlers /api/decks, /api/decks/{id}, /api/decks/{id}/cards and /api/cards/{id} of tedris, and /api/decks, /api/decks/{id} and /api/cards/{id}
      of nizam, have no caller in the app (a search for /api/decks and /api/cards finds only export, import and sample); they stay reachable. Two carry wrong
      labels: the deck handler answers "Card not found" and "Failed to fetch card". In nizam the only reference is the dead hook useDeckCards, which fetches
      /api/decks/{id}/cards, a route nizam does not have.
    source: apps/tedris/app/api/decks/route.ts:6
