  webListDecks:
    route: GET /api/decks
    summary: The caller's decks as JSON, through tedris or nizam
    description: >-
      A legacy reader: it calls listDecks with the caller's token. tedris wraps the list as {data, error: null}; nizam answers the list itself. Every failure
      of the call, tedrisat's own 401, 403 and 404 included, is flattened into a 500 whose error text is "Failed to fetch decks" (tedris) or "Failed to fetch
      card" (nizam). Called by no page of the app (DCK-22); the route stays reachable.
    needs: a signed-in browser (getAccessToken); what the caller sees is tedrisat's decision, as listDecks
    result:
