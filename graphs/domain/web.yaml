# The web edge of Medaris: the HTTP routes the web apps (tedris, nazar, nizam and landing) answer to the browser themselves, none of
# them tedrisat's. They are the 40 route.ts files of apps/*/app (tedris 16, nazar 12, nizam 9, landing 3), written as 32 actions, one per
# behaviour: where two or three apps serve the same behaviour with the same code, one action and a `note` that names the apps and their
# files (`source` is the first app's); where they differ (the deck sample, the legacy deck readers) the differences are in the
# description and the refusals say which app. Pages are not here (the navigation graphs draw them) and neither are Server Actions: a flow
# invokes the tedrisat action they call.
#
# What is here, by group:
#   auth      5 actions, the five routes of libs/auth (@medaris/auth) that tedris, nazar and nizam mount at app/api/auth/[...auth]/route.ts.
#             Anything else under /api/auth is a bodiless 404 (libs/auth/src/server/routes.ts:527), written once here and not as an action.
#   files     13 actions, /api/files/**: one behaviour per proxied tedrisat action, 8 downloads and 5 uploads, 20 route files in the three apps.
#   calendar  2 actions, tedris: /api/lessons/{id}/calendar and /calendar/{file}.
#   decks     4 actions for the deck file routes (tedris: export, import, sample; nazar: sample) and 4 for the legacy JSON readers.
#   audit     1 action, nizam: /api/audit-log/export.
#   landing   3 actions: the contact form and the two redirects into tedris.
#
# Names. An action that stands in front of a tedrisat action is `web` + that action's name (webDownloadCourseResourceFile in front of
# downloadCourseResourceFile) and names it in its description and its sideEffects; the others are named for what a person does
# (startSignIn, signOut, submitContactForm).
#
# Refusals. This is not tedrisat's pipeline: the invariants access-token-only and rate-limit-before-auth do not apply to these routes, so each
# action lists its own refusals in full, with the status the route answers. A refusal tedrisat gives is listed under its own code, as the
# route relays it (the status and the JSON body as they came); a code the route makes up itself is a string the code contains, or
# HTTP_<status> where the body is only an `error` string. A route that redirects says so in `redirect`.
# A flow that walks a failure of one of these actions uses the codes here.
#
# What the web apps' proxy does around them (not a route, so not an action): proxy.ts of tedris, nazar and nizam (libs/auth/src/server/proxy.ts)
# renews the session on every request except the four auth routes that start or end a round trip, and never redirects an /api route or a
# Server Action to sign-in; a page that is not public and has no session is sent to /auth/signin?callbackUrl=<path> (307); tedris and nizam
# also move an address from before MDRS-248 (/en/...) to the same page without the language (308). /calendar/ and the files with an
# extension are outside tedris's matcher. Landing has no session: its middleware.ts is next-intl only and skips /api and /tedris.
#
# Verified by reading each route file and the libs it calls (libs/auth, libs/services file-proxy and file-rules); no route was walked in a
# browser and no test was run. The one thing executed is the real proxyDownload on the evaluation export's path (the invariant
# web-every-file-route-builds-a-proxiable-path).
schema: delurio-graph/0
kind: domain
id: medaris.api

policies:
  - actor: visitor-browser
    needs: no session cookie
    where: >-
      What a web app answers a browser that holds no session: the auth routes (the sign-in start and the sign-out answer everyone and the session route answers
      null), landing's three routes and the calendar feed, whose address is its own credential. Every other route of the web apps answers a visitor 401, or
      sends it to sign-in, and calls nothing.
    do:
    - startSignIn
    - finishSignIn
    - signOut
    - getAuthSession
    - webGetCalendarFeed
    - submitContactForm
    - enterTedris
    - redirectToTedris
    source: libs/auth/src/server/routes.ts:529
  - actor: signed-in-browser
    needs: a session whose access token is usable (the cookie or the store entry, which proxy.ts renews on every request)
    where: >-
      Every route that calls tedrisat for the person: the web app adds the caller's access token and checks no role. What the person may read or write is
      the policy of the tedrisat action the route stands in front of, so the web edge never widens it.
    do:
    - webDownloadCourseResourceFile
    - webDownloadLessonResourceFile
    - webDownloadLessonAssignmentFile
    - webDownloadMySubmissionFile
    - webDownloadMySubmissionReviewFile
    - webDownloadCourseSubmissionFile
    - webDownloadCourseSubmissionReviewFile
    - webExportEvaluationBoard
    - webUploadCourseResourceFile
    - webUploadLessonResourceFile
    - webAddLessonAssignmentFile
    - webAddMySubmissionFile
    - webAddSubmissionReviewFile
    - webGetLessonCalendar
    - webExportCards
    - webImportCards
    - webDownloadCardSample
    - webDownloadCardSampleNazar
    - webListDecks
    - webGetDeck
    - webListDeckCards
    - webGetCard
    - webExportAuditLog
    - startSignIn
    - signOut
    - getAuthSession
    source: libs/services/src/file-proxy/file-proxy.ts:144
  - actor: identity-provider
    needs: a logout_token signed by the realm, with this app's client id as audience
    where: Keycloak tells the app that an SSO session ended; no browser and no session cookie takes part.
    do: [receiveBackchannelLogout]
    source: libs/auth/src/server/routes.ts:463

actions:
  # ---- auth: libs/auth, five routes mounted at app/api/auth/[...auth]/route.ts in tedris, nazar and nizam ----
  startSignIn:
    route: GET /api/auth/signin
    summary: Start a sign-in round trip with Keycloak
    description: >-
      The one entry of every sign-in: the app's /auth/signin and /auth/register pages and every "Giriş yap" end here. In order: a start from a browser that
      has already counted five starts since its window of five minutes opened is refused (SignInLimit); a session store that cannot be asked is refused (OAuthSignin);
      a browser that already holds a usable session, and asked neither for the registration form (intent=register), nor for new tokens (reauth=1), nor for
      an account action (action=UPDATE_PROFILE), is sent straight on to the destination and the visit still counts as a start; Keycloak's discovery document
      that cannot be read is refused (OAuthSignin); otherwise a 303 to Keycloak's authorization endpoint with redirect_uri <NEXTAUTH_URL>/api/auth/callback/keycloak,
      scope openid profile email, PKCE S256, state, nonce, ui_locales (and kc_locale), prompt=create for the registration form and kc_action=UPDATE_PROFILE
      for the account action. The destination is callbackUrl when it is a same-origin path, else the app's afterSignIn (/).
    needs: 'nothing: a visitor or a signed-in browser (the route reads the session cookie only to skip the round trip)'
    query:
      type: object
      properties:
        callbackUrl:
          type: string
          maxLength: 2048
          description: >-
            Where to land afterwards: a same-origin path with its query and fragment, no control character, and not an /api/auth path. Anything else is dropped
            and afterSignIn is used.
        locale:
          type: string
          description: One of the app's locales; sent to Keycloak as ui_locales and kc_locale. Any other value is dropped.
        intent:
          enum: [register]
          description: register asks for the registration form (prompt=create); tedris's /auth/register page is its only caller.
        reauth:
          enum: ['1']
          description: >-
            The API refused the token this browser holds: go through Keycloak for new tokens instead of straight back. Still counts against the cap.
        action:
          enum: [UPDATE_PROFILE]
          description: >-
            An account action: Keycloak's own form for it, then back through the callback with new tokens. Any other value is no action.
        auto:
          enum: ['1']
          description: The sign-in page adds it to its own automatic start; the route ignores it.
    result:
      status: 303
      redirect: Keycloak's authorization endpoint; or the destination itself when the browser already holds a usable session
    refusals:
      SignInLimit:
        status: 303
        redirect: <signInPage>?error=SignInLimit[&callbackUrl=<destination>]
        note: >-
          The browser has already started 5 round trips in 5 minutes (the default cap; AUTH_SIGN_IN_LIMIT sets it per app). Nothing starts another by itself.
        source: libs/auth/src/server/routes.ts:167
      OAuthSignin:
        status: 303
        redirect: <signInPage>?error=OAuthSignin[&callbackUrl=<destination>]
        note: >-
          The round trip could not start: the session store cannot be asked (a callback now could not store its session), or Keycloak's discovery document
          is out of reach.
        source: libs/auth/src/server/routes.ts:190
    sideEffects:
    - >-
      cookie <prefix>.auth-flow.<state, 16 characters> set: the sealed state, nonce, PKCE verifier and destination, 10 minutes; the newest 3 round trips are
      kept and older flow cookies are deleted
    - 'cookie <prefix>.auth-starts set: counts this start for 5 minutes'
    - reads the session store (Valkey, or the cookie) and Keycloak's discovery document
    note: >-
      Served by tedris, nazar and nizam through one catch-all each (apps/tedris/app/api/auth/[...auth]/route.ts:11, apps/nazar/app/api/auth/[...auth]/route.ts:10,
      apps/nizam/app/api/auth/[...auth]/route.ts:10): the same libs/auth handler, with cookie prefix tedris, nazar or nizam and the Keycloak client of the
      app. Landing has no auth route.
    source: libs/auth/src/server/routes.ts:146

  finishSignIn:
    route: GET /api/auth/callback/keycloak
    summary: Take Keycloak's answer and store the session
    description: >-
      The redirect URI every Keycloak client has had since NextAuth. A state that no flow cookie of this browser holds (the Back button replaying a callback,
      or a link from elsewhere) is a quiet 303 to afterSignIn when a usable session is already there and OAuthCallback otherwise. Else the code grant is made
      with the expected state, nonce and PKCE verifier; the session is stored under a new id, the one this browser had (a reauth, or a sign-in as someone
      else) is ended with it, the flow cookie is cleared and the browser is sent on (303) to the flow's destination.
    needs: >-
      nothing: the browser comes back from Keycloak carrying the code and the state; the flow cookie of this browser is what proves the round trip is its
      own
    query:
      type: object
      properties:
        code: {type: string, description: The authorization code.}
        state:
          type: string
          description: Names the flow cookie; must be the state this browser started.
        session_state: {type: string}
        iss: {type: string}
        error:
          type: string
          description: Keycloak's own error, such as access_denied or invalid_client.
        error_description: {type: string}
    result:
      status: 303
      redirect: the destination the flow cookie holds (a same-origin path)
    refusals:
      OAuthCallback:
        status: 303
        redirect: <signInPage>?error=OAuthCallback[&callbackUrl=<destination>]
        note: >-
          No round trip of this browser has this state and no usable session is there; or the grant failed for any other reason (an unknown or replayed state,
          an expired code, an ID token that names no subject, a store that cannot keep the session). A second round trip usually fixes it.
        source: libs/auth/src/server/routes.ts:300
      AccessDenied:
        status: 303
        redirect: <signInPage>?error=AccessDenied&callbackUrl=<destination>
        note: Keycloak refused the account (error=access_denied).
        source: libs/auth/src/server/oidc.ts:102
      Configuration:
        status: 303
        redirect: <signInPage>?error=Configuration&callbackUrl=<destination>
        note: >-
          Keycloak refused the app (invalid_client or unauthorized_client: a client secret that no longer matches). Retrying cannot help, so nothing retries
          it.
        source: libs/auth/src/server/oidc.ts:103
    sideEffects:
    - >-
      session stored in the session store (a new id; the cookie <prefix>.session set, __Host- over https); the browser's earlier session ended
    - cookie <prefix>.auth-flow.<state> cleared
    - a failed callback is logged with names and codes only (failureSummary), never a token
    note: >-
      Served by tedris, nazar and nizam through one catch-all each (apps/tedris/app/api/auth/[...auth]/route.ts:11, apps/nazar/app/api/auth/[...auth]/route.ts:10,
      apps/nizam/app/api/auth/[...auth]/route.ts:10): the same libs/auth handler, with cookie prefix tedris, nazar or nizam and the Keycloak client of the
      app. Landing has no auth route.
    source: libs/auth/src/server/routes.ts:277

  signOut:
    route: POST /api/auth/signout
    summary: End the session here and at Keycloak
    description: >-
      Reads the session's ID token. With one (or when the session store cannot be read) it builds Keycloak's end-session URL with post_logout_redirect_uri
      = NEXTAUTH_URL and ui_locales, and id_token_hint when there is a token (without a hint Keycloak shows its own logout-confirm page); with no ID token
      it signs out here only and goes to afterSignOut (/). It removes the store entry first (Keycloak then tells the other Medaris apps through back-channel
      logout) and the cookie whatever the store answers, and answers 303. The app's sign-out page posts it from a hidden form.
    needs: >-
      nothing: no session needed (without one it redirects and has nothing to end); the request must come from the app's own origin
    body:
      type: object
      description: A form (application/x-www-form-urlencoded); a body that is not a form is read as no locale.
      properties:
        locale:
          type: string
          description: One of the app's locales, passed to Keycloak as ui_locales.
    result:
      status: 303
      redirect: >-
        Keycloak's end-session endpoint, which comes back to the app's origin; or afterSignOut (/) when there is no ID token or no end-session endpoint
    refusals:
      HTTP_405:
        status: 405
        note: 'Any method but POST (GET /api/auth/signout too), with Allow: POST and no body.'
        source: libs/auth/src/server/routes.ts:352
      HTTP_403:
        status: 403
        note: 'The Origin is not the app''s, or Sec-Fetch-Site is cross-site: a sign-out on another site''s say-so. No body.'
        source: libs/auth/src/server/routes.ts:361
    sideEffects:
    - the session store entry and its index entries removed, the cookie <prefix>.session cleared
    - >-
      Keycloak ends its SSO session and posts a back-channel logout to the other Medaris apps (see receiveBackchannelLogout)
    note: >-
      Served by tedris, nazar and nizam through one catch-all each (apps/tedris/app/api/auth/[...auth]/route.ts:11, apps/nazar/app/api/auth/[...auth]/route.ts:10,
      apps/nizam/app/api/auth/[...auth]/route.ts:10): the same libs/auth handler, with cookie prefix tedris, nazar or nizam and the Keycloak client of the
      app. Landing has no auth route.
    source: libs/auth/src/server/routes.ts:351

  getAuthSession:
    route: GET /api/auth/session
    summary: The client-safe session, or null
    description: >-
      What the browser's SessionProvider reads when a tab is shown again (at least 5 s apart): who is signed in and until when, never a token. null means
      signed out (no session, or no usable access token), and a page that reads it reloads when the session ended or switched account. Cache-Control: no-store,
      max-age=0. proxy.ts runs on this route, so the access token is renewed on the way.
    needs: 'nothing: a visitor gets null'
    result:
      status: 200
      oneOf:
      - {type: 'null'}
      - type: object
        required: [user, expiresAt]
        properties:
          user:
            type: object
            required: [sub]
            properties:
              sub: {type: string, description: Keycloak's subject for the account}
              name: {type: string, sensitivity: personal}
              email: {type: string, sensitivity: personal}
              username: {type: string, description: the preferred_username claim, sensitivity: personal}
              locale:
                type: string
                description: the account's locale claim, when Keycloak sends one
              image: {type: string, description: 'the picture claim, when Keycloak sends one'}
          expiresAt:
            type: integer
            description: epoch milliseconds until which the server holds a usable access token; a hint, not a deadline
    refusals:
      temporarily_unavailable:
        status: 503
        note: >-
          The session store cannot be asked. Body {error: temporarily_unavailable}. Not null: that would read as signed out and reload the page; the client
          takes any answer that is not 200 as "could not ask".
        source: libs/auth/src/server/routes.ts:436
    sideEffects: [reads the session store; proxy.ts renews the access token on the way]
    note: >-
      Served by tedris, nazar and nizam through one catch-all each (apps/tedris/app/api/auth/[...auth]/route.ts:11, apps/nazar/app/api/auth/[...auth]/route.ts:10,
      apps/nizam/app/api/auth/[...auth]/route.ts:10): the same libs/auth handler, with cookie prefix tedris, nazar or nizam and the Keycloak client of the
      app. Landing has no auth route.
    source: libs/auth/src/server/routes.ts:428

  receiveBackchannelLogout:
    route: POST /api/auth/backchannel-logout
    summary: Keycloak tells the app an SSO session ended (OIDC Back-Channel Logout 1.0)
    description: >-
      Called by Keycloak, never by a browser, when an SSO session ends (a sign-out in another Medaris app, an administrator, an expiry). The signed logout_token
      is checked against the realm's keys, the issuer and this app's client id, and its jti may be used once; then every session of this app behind that Keycloak
      session (sid), or of that account when the token names no sid, ends at once instead of within a minute through the userinfo probe. 200 with Cache-Control:
      no-store.
    needs: 'Keycloak: a logout_token signed by the realm with this app''s client id as audience; no session cookie'
    body:
      type: object
      required: [logout_token]
      description: A form (application/x-www-form-urlencoded).
      properties:
        logout_token: {type: string, description: The signed logout token (a JWT).}
    result: {status: 200, description: 'No body. Cache-Control: no-store.'}
    refusals:
      invalid_request:
        status: 400
        note: >-
          logout_token is missing, fails a check of OIDC Back-Channel Logout §2.8, or was used before (the same jti twice). Body {error: invalid_request,
          error_description}.
        source: libs/auth/src/server/routes.ts:492
      unsupported:
        status: 501
        note: >-
          The app keeps its sessions in the cookie, so there is nothing to look a session up in; a valid token is answered 501 so Keycloak's log says this
          app did not end its session. Body {error: unsupported, error_description}.
        source: libs/auth/src/server/routes.ts:508
      temporarily_unavailable:
        status: 503
        note: 'Keycloak''s keys or the session store cannot be reached. Body {error: temporarily_unavailable}.'
        source: libs/auth/src/server/routes.ts:523
      HTTP_405:
        status: 405
        note: 'Any method but POST (GET too), with Allow: POST and Cache-Control: no-store.'
        source: libs/auth/src/server/routes.ts:479
    sideEffects:
    - >-
      every session of the SSO session (sid) or of the account ended in the session store, and the logout token's jti remembered for 3 minutes (JTI_TTL_MS)
    note: >-
      Served by tedris, nazar and nizam through one catch-all each (apps/tedris/app/api/auth/[...auth]/route.ts:11, apps/nazar/app/api/auth/[...auth]/route.ts:10,
      apps/nizam/app/api/auth/[...auth]/route.ts:10): the same libs/auth handler, with cookie prefix tedris, nazar or nizam and the Keycloak client of the
      app. Landing has no auth route. Excluded from the web apps' proxy matcher.
    source: libs/auth/src/server/routes.ts:463

  # ---- files: /api/files/**, tedrisat's files through the web apps (downloads, then uploads) ----
  webDownloadCourseResourceFile:
    route: GET /api/files/courses/{courseId}/resources/{resourceId}
    summary: A course resource's file, as an attachment
    description: >-
      A course resource's file, as an attachment. The browser holds no token: the route reads the caller's access token on the server and streams the file
      from tedrisat (downloadCourseResourceFile, GET /courses/{id}/resources/{resourceId}/file) with only content-type, content-length, content-disposition
      (attachment), x-content-type-options, cache-control and content-security-policy of tedrisat's own headers. A refusal reaches a fetch() as JSON, and
      a link followed as a page as a 303 (invariant web-download-refusal-returns-to-the-page). Used by the file link of a course resource: the "Bu dersin
      kaynakları" card of the tedris course page, nazar Müfredat and the nizam curriculum editor.
    needs: >-
      a signed-in browser: the route reads the session's access token (getAccessToken) and adds it as a bearer; it checks no role. Who may do it is tedrisat's
      decision, as the `needs` of downloadCourseResourceFile.
    result:
      status: 200
      type: string
      contentMediaType: application/octet-stream
      description: The file's bytes, as an attachment under the name tedrisat gave it.
    refusals:
      NOT_FOUND:
        status: 404
        note: >-
          A path id is not a uuid (isUuid). The route answers it itself, before it asks for a token and before tedrisat is called; a followed link is not
          redirected for it. Body {code: NOT_FOUND}.
        redirect: never
        source: apps/tedris/app/api/files/courses/[courseId]/resources/[resourceId]/route.ts:17
      unauthenticated:
        status: 401
        note: >-
          No access token in the session (reauth absent), or tedrisat refused the token (reauth true, relay at file-proxy.ts:186). Body {kind: unauthenticated,
          reauth?: true}, the value handleUnauthenticated of @medaris/auth acts on. Tedrisat is not called when there is no token.
        source: libs/services/src/file-proxy/file-proxy.ts:137
        redirect: 'a link followed as a page: 303 to signInUrl(the referring page, {reauth}); a fetch() keeps the JSON'
      TEDRISAT_UNREACHABLE:
        status: 502
        note: The call to tedrisat itself failed (the service could not be reached).
        source: libs/services/src/file-proxy/file-proxy.ts:176
        redirect: 'a link followed as a page: 303 back to the page with ?fileError=unavailable'
      AUTHZ_FORBIDDEN:
        status: 403
        note: Relayed as it came, from downloadCourseResourceFile.
        redirect: 'a link followed as a page: 303 back to the page with ?fileError=forbidden'
        source: libs/services/src/file-proxy/file-proxy.ts:185
      COURSE_NOT_FOUND:
        status: 404
        note: Relayed as it came, from downloadCourseResourceFile.
        redirect: 'a link followed as a page: 303 back to the page with ?fileError=notFound'
        source: libs/services/src/file-proxy/file-proxy.ts:185
      RESOURCE_FILE_NOT_FOUND:
        status: 404
        note: Relayed as it came, from downloadCourseResourceFile.
        redirect: 'a link followed as a page: 303 back to the page with ?fileError=notFound'
        source: libs/services/src/file-proxy/file-proxy.ts:185
      STORAGE_NOT_CONFIGURED:
        status: 503
        note: Relayed as it came, from downloadCourseResourceFile.
        redirect: 'a link followed as a page: 303 back to the page with ?fileError=unavailable'
        source: libs/services/src/file-proxy/file-proxy.ts:185
      STORAGE_UNAVAILABLE:
        status: 503
        note: Relayed as it came, from downloadCourseResourceFile.
        redirect: 'a link followed as a page: 303 back to the page with ?fileError=unavailable'
        source: libs/services/src/file-proxy/file-proxy.ts:185
    sideEffects:
    - >-
      calls: downloadCourseResourceFile (tedrisat GET /courses/{id}/resources/{resourceId}/file) with the caller's bearer token; what it writes (audit rows,
      storage) is tedrisat's
    note: >-
      Served by tedris (apps/tedris/app/api/files/courses/[courseId]/resources/[resourceId]/route.ts:11), nazar (apps/nazar/app/api/files/courses/[courseId]/resources/[resourceId]/route.ts:11),
      nizam (apps/nizam/app/api/files/courses/[courseId]/resources/[resourceId]/route.ts:11): the same handler in each (@medaris/services/file-proxy).
    source: apps/tedris/app/api/files/courses/[courseId]/resources/[resourceId]/route.ts:11

  webDownloadLessonResourceFile:
    route: GET /api/files/lessons/{lessonId}/resources/{resourceId}
    summary: A celse (session) resource's file, as an attachment
    description: >-
      A celse (session) resource's file, as an attachment. The browser holds no token: the route reads the caller's access token on the server and streams
      the file from tedrisat (downloadLessonResourceFile, GET /lessons/{id}/resources/{resourceId}/file) with only content-type, content-length, content-disposition
      (attachment), x-content-type-options, cache-control and content-security-policy of tedrisat's own headers. A refusal reaches a fetch() as JSON, and
      a link followed as a page as a 303 (invariant web-download-refusal-returns-to-the-page). Used by the file link of a celse resource: the "Kaynaklar"
      card of the tedris celse page, nazar Müfredat and the nizam curriculum editor.
    needs: >-
      a signed-in browser: the route reads the session's access token (getAccessToken) and adds it as a bearer; it checks no role. Who may do it is tedrisat's
      decision, as the `needs` of downloadLessonResourceFile.
    result:
      status: 200
      type: string
      contentMediaType: application/octet-stream
      description: The file's bytes, as an attachment under the name tedrisat gave it.
    refusals:
      NOT_FOUND:
        status: 404
        note: >-
          A path id is not a uuid (isUuid). The route answers it itself, before it asks for a token and before tedrisat is called; a followed link is not
          redirected for it. Body {code: NOT_FOUND}.
        redirect: never
        source: apps/tedris/app/api/files/lessons/[lessonId]/resources/[resourceId]/route.ts:16
      unauthenticated:
        status: 401
        note: >-
          No access token in the session (reauth absent), or tedrisat refused the token (reauth true, relay at file-proxy.ts:186). Body {kind: unauthenticated,
          reauth?: true}, the value handleUnauthenticated of @medaris/auth acts on. Tedrisat is not called when there is no token.
        source: libs/services/src/file-proxy/file-proxy.ts:137
        redirect: 'a link followed as a page: 303 to signInUrl(the referring page, {reauth}); a fetch() keeps the JSON'
