      calls: importCards (tedrisat POST /flashcard/decks/{deckId}/cards/bulk/import) with the caller's bearer token; the cards are written by tedrisat
    note: Served by tedris only (apps/tedris/app/api/decks/[id]/import/route.ts:7).
