  webDownloadCardSampleNazar:
    route: GET /api/decks/sample
    summary: The card import template, through nazar
    description: >-
      The "xlsx" and "csv" template links of nazar's "İçe aktar" dialog (plain <a download>). Unlike tedris, nazar calls tedrisat through the generated client
      (cards.getSampleFileRaw) and builds its own response: format=csv gives csv and any other value, or none, gives xlsx, never a 400; a caller with no session
      is redirected to sign-in; and any failure of the call is an empty 502.
    needs: >-
      a signed-in browser: tedrisatApi() redirects a caller with no session to sign-in. The tedrisat route itself needs no permission (downloadCardSample)
    query:
      type: object
      properties:
