        source: apps/tedris/app/api/decks/route.ts:30
    sideEffects:
    - 'calls: listDecks (tedrisat GET /flashcard/decks) with the caller''s bearer token'
    note: Served by tedris (apps/tedris/app/api/decks/route.ts:6) and nizam (apps/nizam/app/api/decks/route.ts:6).
