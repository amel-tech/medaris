        status: 404
        note: Relayed as it came, from exportEvaluationBoard.
        redirect: 'a link followed as a page: 303 back to the page with ?fileError=notFound'
        source: libs/services/src/file-proxy/file-proxy.ts:185
      AUTHZ_FORBIDDEN:
        status: 403
        note: Relayed as it came, from exportEvaluationBoard.
        redirect: 'a link followed as a page: 303 back to the page with ?fileError=forbidden'
        source: libs/services/src/file-proxy/file-proxy.ts:185
      INVALID_PATH:
        status: 400
        note: >-
          Every call: the route asks for /courses/{courseId}/evaluations/export?lang=<lang>, and isProxiablePath refuses any path with a query, so the proxy
          answers 400 INVALID_PATH "Not a file address" before it calls tedrisat. Confirmed by calling the real proxyDownload on that path with a stub fetch
          (a scratch copy of file-proxy.ts): 400 INVALID_PATH and no call; not walked in a browser.
        redirect: >-
          a link followed as a page: 303 back to the page with ?fileError=notFound (the page does not mount FileErrorNotice, F-D1-13, so the refusal is silent)
        source: libs/services/src/file-proxy/file-proxy.ts:145
