  listCourseSubmissions:
    summary: The course's homework hand-ins, for the course team
    route: GET /courses/{id}/submissions
    needs: "submission.read on the course (AuthGuard + AuthzGuard, resolver byExistingCourse): müderris, başmüderris and köşk nazımı by role, a ders nazırı when granted, the başnazım. Cache-Control private, no-store"
    query:
      type: object
      additionalProperties: false
      properties:
        lessonId: { type: string, format: uuid, references: Lesson, note: "narrows both lists to one session" }
    result:
      type: object
      required: [items, sessions, talebeCount]
      properties:
        items:
          type: array
          note: "every LessonSubmission of the course's live sessions in programme order, the latest change first within a session, with its files, review, session title, week number and the talebe's name: a row whose note and files were all removed is listed, and so is a talebe who is no longer seated"
          items: { type: object, properties: { id: { type: string, format: uuid, references: LessonSubmission } } }
        sessions:
          type: array
          note: "every live session of the course: whether it has homework, whether that homework is a MEMORIZE one, and how many ENROLLED or COMPLETED talebe handed in a note or a file"
          items:
            type: object
            required: [lessonId, hasAssignment, isMemorization, handedInCount]
            properties:
              lessonId: { type: string, format: uuid, references: Lesson }
              hasAssignment: { type: boolean }
              isMemorization: { type: boolean }
              handedInCount: { type: integer, minimum: 0 }
        talebeCount: { type: integer, minimum: 0, note: "ENROLLED plus COMPLETED: the M of N / M teslim" }
    refusals:
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.controller.ts:111, note: "an id that is not a uuid or names no course; a course of a hidden köşk (the guard); a hidden course or a draft to this caller (course.service.ts:352, :366)" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks submission.read on the course; a talebe is refused" }
      HTTP_400: { status: 400, source: apps/tedrisat/src/lesson-submission/lesson-submission.controller.ts:297, note: "lessonId is not a uuid" }
    source: apps/tedrisat/src/lesson-submission/lesson-submission.controller.ts:293

