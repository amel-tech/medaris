      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.controller.ts:111, note: "an id that is not a uuid or names no course (byExistingCourse); a course of a hidden köşk (the guard); a hidden course or a draft to this caller (course.service.ts:352, :366)" }
