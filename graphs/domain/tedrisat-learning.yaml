      - "the first call sets resultsReleasedAt, writes the audit row and tells the course's ENROLLED seat holders except the caller (a COMPLETED talebe is not told, though they can read the grades); a repeat changes nothing, writes nothing and tells nobody, and answers the same resultsReleasedAt"
