  # ---- Memorisation marks and the board, "Değerlendirme" (EvaluationController, evaluation/evaluation.controller.ts) ----
  getEvaluationBoard:
    summary: The course's board of memorisation marks and exam results, for the course team
    route: GET /courses/{id}/evaluations
    needs: "session.manage on the course (AuthGuard + AuthzGuard, resolver byExistingCourse): müderris, başmüderris and köşk nazımı by role, a granted ders nazırı, the başnazım; a talebe is refused. Cache-Control private, no-store"
    result:
      type: object
      required: [columns, talebe, marks, results]
      properties:
        columns:
          type: array
          note: "in programme order: a MEMORIZE column for each memorisation homework and an EXAM column for each exam, each with the session's lessonId, title, weekNumber, scheduledAt, description and fullCount (the FULL marks of a memorisation, the entered results of an exam); an exam column also carries format, maxScore, isRetake and resultsReleasedAt"
          items:
            type: object
            required: [kind, lessonId, title, weekNumber, fullCount]
            properties:
              kind: { enum: [MEMORIZE, EXAM] }
              lessonId: { type: string, format: uuid, references: Lesson }
              title: { type: string }
              weekNumber: { type: integer }
              fullCount: { type: integer, minimum: 0 }
        talebe:
          type: array
          note: "the ENROLLED and COMPLETED talebe by name; a mark or result of somebody no longer seated is kept but not shown"
          items:
            type: object
            required: [id]
            properties:
              id: { type: string, format: uuid, references: User }
              name: { type: [string, "null"] }
        marks:
          type: array
          note: "a cell with no row is Bekliyor"
          items:
            type: object
            required: [lessonId, userId, status]
            properties:
              lessonId: { type: string, format: uuid, references: Lesson }
              userId: { type: string, format: uuid, references: User }
              status: { enum: [FULL, INCOMPLETE, ABSENT] }
              note: { type: [string, "null"] }
              updatedAt: { type: string, format: date-time }
        results:
          type: array
          items:
            type: object
            required: [lessonId, userId, absent]
            properties:
              lessonId: { type: string, format: uuid, references: Lesson }
              userId: { type: string, format: uuid, references: User }
              score: { type: [integer, "null"] }
              absent: { type: boolean }
              updatedAt: { type: string, format: date-time }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.controller.ts:111, note: "an id that is not a uuid or names no course; a course of a hidden köşk (the guard); a hidden course or a draft to this caller (course.service.ts:352, :366)" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks session.manage on the course" }
    source: apps/tedrisat/src/evaluation/evaluation.controller.ts:68

  exportEvaluationBoard:
    summary: The board as a spreadsheet ("Excel indir")
    route: GET /courses/{id}/evaluations/export
    needs: session.manage on the course (AuthGuard + AuthzGuard, resolver byExistingCourse), as the board. Cache-Control private, no-store
    query:
      type: object
      additionalProperties: false
      properties:
        lang: { type: string, note: "tr, en or ar, picks the language of the headers and the words; not validated, tr otherwise" }
    result: { status: 200, type: string, format: binary, note: "an .xlsx named degerlendirme: a row per talebe (Ad Soyad) and a column per memorisation homework and exam in programme order; a cell is Tam, Eksik, Vermedi or Bekliyor, or an exam's score or Girmedi; text that looks like a formula is neutralised by ExcelService" }
    refusals:
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.controller.ts:111, note: "an id that is not a uuid or names no course; a course of a hidden köşk (the guard); a hidden course or a draft to this caller (course.service.ts:352, :366)" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks session.manage on the course" }
    source: apps/tedrisat/src/evaluation/evaluation.controller.ts:91

  saveEvaluation:
    summary: Mark a talebe on a session's memorisation homework (Tam, Eksik, Vermedi)
    route: PUT /lessons/{id}/evaluations/{userId}
    needs: session.manage on the session's course (AuthGuard + AuthzGuard, resolver byLessonCourse); the session is live and its homework is a MEMORIZE one; the talebe is ENROLLED or COMPLETED in the course
    body:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { enum: [FULL, INCOMPLETE, ABSENT], note: "FULL is Tam, INCOMPLETE is Eksik, ABSENT is Vermedi" }
        note: { type: [string, "null"], maxLength: 280, note: "trimmed; null, absent or blank is none; the talebe reads it with the mark" }
    result: { returns: AssignmentEvaluation, status: 200 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      MEMORIZATION_NOT_FOUND: { status: 404, source: apps/tedrisat/src/evaluation/evaluation.repository.ts:249, note: "the session has no homework, or its homework is a FILE one" }
      EVALUATION_TALEBE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/evaluation/evaluation.repository.ts:262, note: "no ENROLLED or COMPLETED seat for this talebe in the session's course" }
      LESSON_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.service.ts:553, note: "an id that is not a session, an archived session, a hidden course or a draft to this caller (course.service.ts:549); again under the transaction, evaluation.repository.ts:237" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the course is in a hidden köşk" }
      VALIDATION_ERROR: { status: 400, source: libs/common/src/pipes/validation.pipe.ts:52, note: "a status that is none of the three, a note over 280 characters, or an unknown property" }
      HTTP_400: { status: 400, source: apps/tedrisat/src/evaluation/evaluation.controller.ts:119, note: "userId is not a uuid" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks session.manage on the course" }
    sideEffects:
      - audit:assignment_evaluation.save
      - "upserts on (assignmentId, userId) under a FOR UPDATE lock on the homework, so two first saves of one cell take turns. A save equal to the stored mark writes nothing and no audit row. The audit row carries the status ({from, to} on a change) and the note's length. No notification"
    source: apps/tedrisat/src/evaluation/evaluation.controller.ts:115

  getMyEvaluation:
    summary: The caller's own mark on a session's memorisation homework
    route: GET /lessons/{id}/evaluation
    needs: any signed-in caller (course.view on the session's course); own mark only, while the course is visible and not passive (mayReachOwnWriting). Cache-Control private, no-store
    result:
      type: object
      required: [status, note, updatedAt]
      properties:
        status: { enum: [FULL, INCOMPLETE, ABSENT, null], note: "null is Bekliyor: no mark yet" }
        note: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      MEMORIZATION_NOT_FOUND: { status: 404, source: apps/tedrisat/src/evaluation/evaluation.repository.ts:185, note: "the session's homework is not a memorisation, or there is none: answered to any caller of a visible course, enrolled or not (invariant evaluation-read-keeps-homework-kind-closed)" }
      EVALUATION_FORBIDDEN: { status: 403, source: apps/tedrisat/src/evaluation/evaluation.service.ts:239, note: "the course is in a passive scope and its content is closed to the caller" }
