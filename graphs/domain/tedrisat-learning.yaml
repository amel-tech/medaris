      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:400, note: "no course has this id (the resolver); a course of a hidden köşk (the guard); a hidden course or a draft to this caller (course.service.ts:352, :366)" }
    source: apps/tedrisat/src/lesson-question/lesson-question.controller.ts:160

  listCourseQuestions:
    summary: The course's questions, for the people who answer them
    route: GET /courses/{id}/questions
    needs: "question.answer on the course (AuthGuard + AuthzGuard, resolver byExistingCourse): müderris, başmüderris and köşk nazımı by role, a granted ders nazırı, the başnazım. question.answer alone does not open the course's other content. Cache-Control private, no-store"
    query:
      type: object
      additionalProperties: false
      properties:
        cursor: { type: string, note: "the nextCursor of the previous page; left out for the first page" }
        limit: { type: integer, default: 20, note: "lowered into 1..50" }
    result:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          note: "still-waiting questions first, oldest first, then the answered ones; paging is stable across equal timestamps; each adds author {id, name} to what the asker reads"
          items: { type: object, required: [id], properties: { id: { type: string, format: uuid, references: LessonQuestion } } }
        nextCursor: { type: [string, "null"] }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      INVALID_QUESTION_CURSOR: { status: 400, source: apps/tedrisat/src/lesson-question/lesson-question-cursor.ts:39, note: "the cursor is not one this server issued" }
      HTTP_400: { status: 400, source: apps/tedrisat/src/lesson-question/lesson-question.controller.ts:197, note: "limit is not an integer" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.controller.ts:111, note: "an id that is not a uuid or names no course; a course of a hidden köşk (the guard); a hidden course or a draft to this caller (course.service.ts:352, :366)" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks question.answer on the course; a talebe is refused" }
    source: apps/tedrisat/src/lesson-question/lesson-question.controller.ts:192

  answerLessonQuestion:
    summary: Answer a question, or replace the answer
    route: PUT /questions/{questionId}/answer
    needs: course.view on the question's course, which the guard never refuses (it only gives the 404s); the service then asks that the course is visible to the caller and question.answer on it, and any refusal reads as "no such question" so the question's existence is not confirmed
    body:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 4000, note: "trimmed; Markdown stored as typed" }
    result: { returns: LessonQuestion, status: 200 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      LESSON_QUESTION_NOT_FOUND: { status: 404, source: apps/tedrisat/src/lesson-question/lesson-question.service.ts:188, note: "an id that is not a uuid or names no question (the resolver, lesson-question.controller.ts:79); the course is not visible to the caller (a hidden course or a draft); or the caller lacks question.answer there: no 403 is ever given" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the question's course is in a hidden köşk" }
      VALIDATION_ERROR: { status: 400, source: libs/common/src/pipes/validation.pipe.ts:52, note: "a body empty after trimming or over 4000 characters, or an unknown property" }
    sideEffects: ["sets answer, answeredBy and answeredAt, replacing an earlier answer with no history; no notification to the asker"]
    source: apps/tedrisat/src/lesson-question/lesson-question.controller.ts:217

  updateLessonQuestion:
    summary: Rewrite one of the caller's own unanswered questions
    route: PATCH /questions/{questionId}
    needs: the question's author, while still an active talebe (course.view on the question's course, then mayWriteAsTalebe); another person's question, the course team's included, is 404
    body:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 4000, note: "trimmed; Markdown stored as typed" }
    result: { returns: LessonQuestion, status: 200 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      LESSON_QUESTION_NOT_FOUND: { status: 404, source: apps/tedrisat/src/lesson-question/lesson-question.service.ts:209, note: "an id that is not a uuid or names no question (the resolver); not the caller's question; its course is not visible to the caller; or it went meanwhile (service.ts:147)" }
      LESSON_QUESTION_FORBIDDEN: { status: 403, source: apps/tedrisat/src/lesson-question/lesson-question.service.ts:140, note: "not an active talebe, or the content is closed" }
      LESSON_QUESTION_ANSWERED: { status: 409, source: apps/tedrisat/src/lesson-question/lesson-question.service.ts:146, note: "the question was answered, so the answer belongs to the question as asked and it can no longer be edited" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the question's course is in a hidden köşk" }
      VALIDATION_ERROR: { status: 400, source: libs/common/src/pipes/validation.pipe.ts:52, note: "a body empty after trimming or over 4000 characters, or an unknown property" }
    source: apps/tedrisat/src/lesson-question/lesson-question.controller.ts:239

  deleteLessonQuestion:
    summary: Delete one of the caller's own questions, with its answer
    route: DELETE /questions/{questionId}
    needs: the question's author at any time, answered or not, whatever has become of their enrollment, while the course is visible and not passive (course.view on the question's course, then mayReachOwnWriting)
    result: { status: 204 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      LESSON_QUESTION_NOT_FOUND: { status: 404, source: apps/tedrisat/src/lesson-question/lesson-question.service.ts:209, note: "an id that is not a uuid or names no question (the resolver); not the caller's question; its course is not visible to the caller; or it went meanwhile (service.ts:163)" }
      LESSON_QUESTION_FORBIDDEN: { status: 403, source: apps/tedrisat/src/lesson-question/lesson-question.service.ts:160, note: "the course is in a passive scope and its content is closed to the caller" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the question's course is in a hidden köşk" }
    source: apps/tedrisat/src/lesson-question/lesson-question.controller.ts:259

  # ---- Appeals, "İtirazlar": a medrese appeals a köşk's refusal of its course request (AppealController, appeal/appeal.controller.ts) ----
  listMadrasahAppeals:
    summary: The medrese's refused course requests and their appeals
    route: GET /madrasahs/{id}/appeals
    needs: "madrasah.appeal_open on the medrese (AuthGuard + AuthzGuard, resolver byExistingMadrasah): the başmüderris by role, a granted medrese nazırı, the başnazım"
    result:
      type: array
      note: "newest first, at most 100: each REJECTED course request of the medrese and every request it appealed; an accepted appeal sends its request back to PENDING, so such a row shows requestStatus PENDING"
      items:
        type: object
        required: [courseRequestId, title, kosk, requestStatus, rejectReason, appeal]
        properties:
          courseRequestId: { type: string, format: uuid, references: CourseRequest }
          title: { type: string }
          kosk: { type: object, required: [id, name], properties: { id: { type: string, format: uuid, references: Kosk }, name: { type: string } } }
          requestStatus: { type: string, note: "the course request's status" }
          rejectReason: { type: [string, "null"] }
          appeal:
            type: [object, "null"]
            note: "an Appeal as id, status, reason, decisionNote, createdAt and decidedAt; null while nothing was appealed"
    refusals:
      MADRASAH_NOT_FOUND: { status: 404, source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110, note: "an id that is not a uuid or names no medrese" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks madrasah.appeal_open on the medrese" }
    source: apps/tedrisat/src/appeal/appeal.controller.ts:64

  createMadrasahAppeal:
    summary: Appeal a köşk's refusal of the medrese's course request
    route: POST /madrasahs/{id}/appeals
    needs: madrasah.appeal_open on the medrese (AuthGuard + AuthzGuard, resolver byExistingMadrasah)
    body:
      type: object
      required: [courseRequestId, reason]
      additionalProperties: false
      properties:
        courseRequestId: { type: string, format: uuid, references: CourseRequest }
        reason: { type: string, minLength: 1, maxLength: 1000, note: "trimmed; also a database check" }
    result:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid, references: Appeal }
    refusals:
      APPEAL_REQUEST_NOT_FOUND: { status: 404, source: apps/tedrisat/src/appeal/appeal.service.ts:108, note: "no such course request in this medrese: absent, or another medrese's" }
      APPEAL_REQUEST_NOT_REJECTED: { status: 409, source: apps/tedrisat/src/appeal/appeal.service.ts:111, note: "only a request the köşk refused can be appealed" }
      APPEAL_EXISTS: { status: 409, source: apps/tedrisat/src/appeal/appeal.service.ts:121, note: "a request is appealed once: the unique index on course_request_id (appeal.repository.ts:143)" }
      MADRASAH_NOT_FOUND: { status: 404, source: apps/tedrisat/src/madrasah/madrasah.controller.ts:110, note: "an id that is not a uuid or names no medrese" }
      VALIDATION_ERROR: { status: 400, source: libs/common/src/pipes/validation.pipe.ts:52, note: "a courseRequestId that is not a uuid, a reason that is empty after trimming or over 1000 characters, or an unknown property" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks madrasah.appeal_open on the medrese" }
    sideEffects: [audit:appeal.create, "written in the same transaction as the Appeal (courseRequestId, title, madrasahId, koskId, reason). No notification to the platform"]
    source: apps/tedrisat/src/appeal/appeal.controller.ts:84

  listAppeals:
    summary: Appeals, waiting and decided (Bekleyen, Karara bağlanan)
    route: GET /appeals
    needs: "signed in, then platform.appeal_decide asked inside the service (PlatformAccessService.assert; AuthGuard only, no AuthzGuard and no @Authz): the başnazım, or a Medaris nazımı holding it by a grant or a group whose role is still held"
    query:
      type: object
      additionalProperties: false
      properties:
        status: { enum: [PENDING, DECIDED], default: PENDING }
    result:
      type: object
      required: [items, pendingCount, decidedCount]
      properties:
        items:
          type: array
          note: "at most 100; waiting ones oldest first, decided ones newest first by decidedAt; each is an Appeal with the medrese and köşk (id, name), courseRequestId, title, rejectReason and createdBy {id, name}"
          items: { type: object, required: [id], properties: { id: { type: string, format: uuid, references: Appeal } } }
        pendingCount: { type: integer, minimum: 0 }
        decidedCount: { type: integer, minimum: 0 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      AUTHZ_FORBIDDEN: { status: 403, source: apps/tedrisat/src/platform-access/platform-access.service.ts:46, note: "Only the Medaris başnazımı and a Medaris nazımı holding platform.appeal_decide may do this" }
      HTTP_400: { status: 400, source: apps/tedrisat/src/appeal/appeal.controller.ts:122, note: "status is neither PENDING nor DECIDED" }
    note: The route has no AuthzGuard, so the route inventory and the OpenAPI document carry no `needs` for it (invariant every-handler-declares-its-access, MDRS-44).
    source: apps/tedrisat/src/appeal/appeal.controller.ts:116

  acceptAppeal:
    summary: Accept an appeal (Kabul et)
    route: POST /appeals/{id}/accept
    needs: "signed in, then platform.appeal_decide asked inside the service (PlatformAccessService.assert; AuthGuard only): the başnazım, or a Medaris nazımı holding it"
    result: { status: 204 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      AUTHZ_FORBIDDEN: { status: 403, source: apps/tedrisat/src/platform-access/platform-access.service.ts:46, note: "Only the Medaris başnazımı and a Medaris nazımı holding platform.appeal_decide may do this" }
      APPEAL_NOT_FOUND: { status: 404, source: apps/tedrisat/src/appeal/appeal.service.ts:160, note: "no appeal with this id" }
      APPEAL_NOT_PENDING: { status: 409, source: apps/tedrisat/src/appeal/appeal.service.ts:161, note: "the appeal was decided already, or another caller decided it first (service.ts:163)" }
      HTTP_400: { status: 400, source: apps/tedrisat/src/appeal/appeal.controller.ts:143, note: "id is not a uuid; answered before the permission is asked" }
    sideEffects:
      - audit:appeal.accept
      - "in one transaction: the Appeal becomes ACCEPTED with decidedBy and decidedAt, only while it is still PENDING, and its CourseRequest goes back to PENDING with decidedBy and decidedAt cleared, only if it was REJECTED, so the köşk decides again; the köşk's earlier reject reason stays on it. No notification to the medrese or the köşk"
    source: apps/tedrisat/src/appeal/appeal.controller.ts:139

  rejectAppeal:
    summary: Refuse an appeal (Reddet)
    route: POST /appeals/{id}/reject
    needs: "signed in, then platform.appeal_decide asked inside the service (PlatformAccessService.assert; AuthGuard only): the başnazım, or a Medaris nazımı holding it"
    body:
      type: object
      required: [note]
      additionalProperties: false
      properties:
        note: { type: string, minLength: 1, maxLength: 1000, note: "required, trimmed; the medrese reads it as the decision note" }
    result: { status: 204 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      AUTHZ_FORBIDDEN: { status: 403, source: apps/tedrisat/src/platform-access/platform-access.service.ts:46, note: "Only the Medaris başnazımı and a Medaris nazımı holding platform.appeal_decide may do this" }
      APPEAL_NOT_FOUND: { status: 404, source: apps/tedrisat/src/appeal/appeal.service.ts:160, note: "no appeal with this id" }
      APPEAL_NOT_PENDING: { status: 409, source: apps/tedrisat/src/appeal/appeal.service.ts:161, note: "the appeal was decided already, or another caller decided it first (service.ts:163)" }
      VALIDATION_ERROR: { status: 400, source: libs/common/src/pipes/validation.pipe.ts:52, note: "a note that is empty after trimming or over 1000 characters, or an unknown property" }
      HTTP_400: { status: 400, source: apps/tedrisat/src/appeal/appeal.controller.ts:162, note: "id is not a uuid; answered before the permission is asked" }
    sideEffects: [audit:appeal.reject, "the Appeal becomes REJECTED with decidedBy, decidedAt and the decision note, only while it is still PENDING; the course request stays REJECTED. No notification to the medrese or the köşk"]
    source: apps/tedrisat/src/appeal/appeal.controller.ts:158

  # ---- The one background job of this chapter: no route ----
  remindDueExams:
    summary: Remind the talebe of an exam a day before it, once
    needs: "the system itself: an in-process timer of tedrisat (ExamReminderPoller), with no caller, no token and no actor"
    result: { type: integer, minimum: 0, note: "how many exams the pass claimed; a pass never overlaps another" }
    sideEffects:
      - notification:EXAM_REMINDER
      - "claims, in one statement that checks and marks (skip locked, at most 50), the exams that start within 24 hours, are neither cancelled nor hidden, sit in an unhidden course and have no remindedAt, and sets lesson_exams.reminded_at; an exam planned less than a day ahead is reminded on the next pass; moving the exam's time clears remindedAt (course.repository.ts:1604)"
      - "tells the course's ENROLLED seat holders in the app (no actor to leave out); a COMPLETED talebe is not told"
      - "mail, a Yaklaşan sınav message, only when SMTP and TEDRIS_WEB_URL are set: to each ENROLLED talebe with a verified e-mail whose users.lesson_invitation_emails is true; one failing recipient is logged and skipped, a pass that fails is logged and not retried"
    note: Trigger is a 60 second timer started at application bootstrap (EXAM_REMINDER_POLL_INTERVAL_MS), never under the test runner; the specs call remindDue(clock) themselves. It raises no refusal.
    source: apps/tedrisat/src/exam/exam-reminder.poller.ts:73

invariants:
  # ---- Homework a müderris sets ----
  - id: homework-one-per-session
    rule: >-
      A session has at most one homework (a LessonAssignment, unique on lessonId); a session with no row has none. Its kind is FILE, the
      default and what every homework that existed before the column became, or MEMORIZE; its description is at most 4000 characters. A hand-in
      has no deadline and no grade.
    source: apps/tedrisat/src/database/schema/lesson-assignment.schema.ts:52

  - id: homework-is-set-by-session-manage
    rule: >-
      Only holders of session.manage set, change or remove a session's homework and its files, on a live session of a course they may write
      to; course.edit alone is refused, and a hidden session, or a course the köşk hid, is not found (LESSON_NOT_FOUND).
    source: apps/tedrisat/src/course/course.service.ts:535

  - id: homework-files-need-homework
    rule: >-
      A homework file needs an existing homework (LESSON_ASSIGNMENT_NOT_FOUND otherwise); homework files are never listed as the session's
      resources, and they download as attachments to readers of the course's content only. No cap on how many files one homework holds was found.
    source: apps/tedrisat/src/course/lesson-assignment.service.ts:85

  - id: taking-homework-off-keeps-hand-ins
    rule: >-
      Taking a homework off removes its description, its files (from storage too, through the deletion queue) and its memorisation marks, and
      never a talebe's LessonSubmission.
    source: apps/tedrisat/src/course/lesson-assignment.repository.ts:185

  # ---- What a talebe writes on a session ----
  - id: talebe-writing-needs-an-active-seat
    rule: >-
      A note, a question and a hand-in (its note and its files) are written only by a person with an ENROLLED or COMPLETED enrollment, no open
      ban that bars the course, and the course's content open to them (course.view_details, which a passive scope closes even to the enrolled).
      A pending or removed talebe, a stranger, staff who are not enrolled, and the başnazım without an enrollment are refused with the
      route's own 403: LESSON_NOTE_FORBIDDEN, LESSON_QUESTION_FORBIDDEN or SUBMISSION_FORBIDDEN.
    source: apps/tedrisat/src/course/course.service.ts:567

  - id: own-writing-outlives-the-seat
    rule: >-
      A talebe who was removed, barred or left pending still reads what they wrote (their notes, their questions with the answers, their
      hand-in with its files and review, their mark and their grades) while the course is open, and still deletes their notes and their
      questions. Only a passive scope closes it. They can no longer change or delete a hand-in: saving its note, adding a file and removing a
      file ask for an active seat, so a removed talebe can read their own files and cannot take them off.
    note: >-
      The inventory said "reads and deletes ... own submission files"; deleteMySubmissionFile asks assertMayWrite (lesson-submission.service.ts:217,
      :481), which needs the seat, so only the reads survive for a hand-in.
    source: apps/tedrisat/src/course/course.service.ts:590

  - id: writing-stays-with-its-reader
    rule: >-
      A note is read by its author alone: no route reads a note by id or across sessions, and the başnazım, the müderris and the köşk nazımı
      read nobody else's. A question is read by its author and by the holders of question.answer. A hand-in is read by its talebe and by the
      holders of submission.read. A memorisation mark is read by its talebe and by the holders of session.manage.
    source: apps/tedrisat/src/lesson-note/lesson-note.repository.ts:40

  - id: session-routes-hide-an-unseen-course
    rule: >-
      On every session route of this file a hidden course, a draft the caller may not edit or view unpublished, and a course of a hidden köşk
      answer as a session that is not there: 404 LESSON_NOT_FOUND from the service, or COURSE_NOT_FOUND from the guard for the hidden köşk, and
      nothing is written. A question's routes answer LESSON_QUESTION_NOT_FOUND for a course the caller may not see.
    source: apps/tedrisat/src/course/course.service.ts:511

  - id: learning-text-limits
    rule: >-
      Every text is trimmed first, then held to its limit: a note's body 1..4000 characters (Markdown, stored as typed, never rendered as HTML)
      and its position 0..359999 seconds; a question and an answer 1..4000; a hand-in's note and a review's note at most 4000, a blank one being
      none; a homework description at most 4000; a memorisation note at most 280; an appeal's reason and decision note 1..1000. A text over its
      limit is 400 VALIDATION_ERROR.
    source: apps/tedrisat/src/lesson-submission/dto/lesson-submission.dto.ts:7

  - id: hand-in-file-limits
    rule: >-
      A talebe has at most 10 files on one session (409 SUBMISSION_FILE_LIMIT, refused before an eleventh is stored and checked again under the
      row lock); a review carries at most 5 files (409 SUBMISSION_REVIEW_FILE_LIMIT); every file is at most 25 MB and one of PDF, PNG, JPEG,
      WebP, docx, xlsx, pptx or plain UTF-8 text by its bytes; a MEMORIZE homework takes no file (409 SUBMISSION_FILES_NOT_TAKEN).
    source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:184

  - id: hand-in-needs-a-live-session
    rule: >-
      A hand-in, a review, a memorisation mark and an exam result are written on a live session, never an archived one (404 LESSON_NOT_FOUND);
      any live session takes a hand-in, whether or not it has a homework row.
    source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:487

  - id: notes-and-questions-reach-hidden-sessions
    rule: >-
      A note or a question is written on an archived (hidden) session of a visible course: findVisibleLessonCourse counts archived sessions on
      purpose (MDRS-150), and neither the note nor the question repository checks the session. Whether a talebe can reach a hidden session's id
      is a question for the web apps.
    note: Kept as the code has it, beside hand-in-needs-a-live-session; it is a difference between the routes, not a defect.
    source: apps/tedrisat/src/course/course.service.ts:511

  - id: a-ban-bars-writing-not-the-seat
    rule: >-
      An open ban that bars a course stops a talebe writing notes, questions and hand-ins (mayWriteAsTalebe asks BanService.isBarred) and takes
      course.view_details away (the resolver falls back to PUBLIC), but does not change the enrollment: nothing under ban/ writes the enrollments
      table, so a barred ENROLLED or COMPLETED talebe stays seated, still a column of the evaluation board and still marked and graded.
    source: apps/tedrisat/src/course/course.service.ts:567

  # ---- Review of a hand-in ----
  - id: review-reaches-the-talebe-when-sent
    rule: >-
      The talebe sees a review's note, reviewer and files only after reviewedAt is set by sending it; review files uploaded before that stay
      hidden (404 SUBMISSION_FILE_NOT_FOUND); sending again replaces the note and keeps the files; a review needs a note or a file (400
      SUBMISSION_REVIEW_EMPTY); the talebe is notified (SUBMISSION_REVIEWED) on every send, a re-send that changes nothing included.
    source: apps/tedrisat/src/lesson-submission/lesson-submission.repository.ts:698

  - id: hand-in-downloads-by-staff-are-recorded
    rule: >-
      A staff download of a hand-in file or of a review file writes submission.file_download or submission.review_file_download before a byte is
      sent, and a failed write fails the download; the owner's own download writes nothing.
    source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:279

  # ---- Memorisation marks, exams ----
  - id: memorization-mark-rules
    rule: >-
      A mark is FULL, INCOMPLETE or ABSENT (Tam, Eksik, Vermedi) and no row is Bekliyor; there is one per talebe per MEMORIZE homework, written
      by holders of session.manage for an ENROLLED or COMPLETED talebe only; a session whose homework is a FILE one, or has none, is 404
      MEMORIZATION_NOT_FOUND; a save equal to the stored mark writes nothing and no audit row; concurrent first saves of one cell take turns
      under a row lock.
    source: apps/tedrisat/src/evaluation/evaluation.repository.ts:215

  - id: exam-is-one-session
    rule: >-
      An exam is exactly one session (a LessonExam, unique on lessonId): planning it with a pattern of more than one session is 400
      EXAM_ONE_SESSION; its format is WRITTEN or ORAL, its maxScore 1..1000 (default 100), its topics and location optional, and isRetake marks
      a make-up. An exam with a location is in person, else online.
    source: apps/tedrisat/src/course/course.service.ts:1418

  - id: exam-result-rules
    rule: >-
      A result is a whole number from 0 to the exam's maxScore, or absent with no score (a score sent with absent is dropped); holders of
      session.manage write it for an ENROLLED or COMPLETED talebe on a live exam session; an unchanged save writes nothing; concurrent first
      saves take turns; there is no time window, so a result can be entered before the exam and before the release.
    source: apps/tedrisat/src/exam/exam.repository.ts:160

  - id: exam-results-are-released-once
    rule: >-
      A talebe reads their score or Girmedi only after resultsReleasedAt; releasing is once only, and a second call changes nothing and tells
      nobody; the course team always reads every result; a caller whose content is closed sees only their own released results and their own
      marks.
    source: apps/tedrisat/src/exam/exam.repository.ts:266

  - id: exam-reminder-is-sent-once
    rule: >-
      An exam starting within 24 hours of a poll, not cancelled or hidden and with no remindedAt, is claimed in one statement and reminded of
      once, in the app and, with SMTP and TEDRIS_WEB_URL set, by e-mail to each ENROLLED talebe with a verified address whose lesson
      invitation e-mails are on; moving the exam's time clears remindedAt; the same start sent again does not.
    source: apps/tedrisat/src/exam/exam.repository.ts:470

  # ---- Appeals ----
  - id: appeal-lifecycle
    rule: >-
      A course request is appealed once (unique courseRequestId), and only a REJECTED request of the appealing medrese. An Appeal goes PENDING to
      ACCEPTED, which puts the request back to PENDING for the köşk to decide again with its decider cleared and its old reject reason kept,
      or PENDING to REJECTED, which needs a note and leaves the request REJECTED. It is decided once (409 APPEAL_NOT_PENDING, also on a lost
      race) and the decision and its audit row are one transaction. Opening needs madrasah.appeal_open, deciding platform.appeal_decide or
      SYSTEM_ADMIN.
    source: apps/tedrisat/src/appeal/appeal.service.ts:101

  # ---- Two things the code does on purpose, written as it has them ----
  - id: exam-news-goes-to-enrolled-seats-only
    rule: >-
      EXAM_RESULTS_RELEASED, like EXAM_SCHEDULED, EXAM_REMINDER and the other session news, goes to the course's ENROLLED seat holders, and the
      reminder mail only to ENROLLED talebe: a COMPLETED talebe, who still reads their grades on Notlarım, is told of nothing.
    note: >-
      findSeatHolders selects ENROLLED only and says why: a request is not a seat, a completion has finished the course, a revoked seat is out
      (course-notification.repository.ts:104-118; exam.repository.ts reminderRecipients). The inventory listed the COMPLETED case as a finding;
      it is the code's own decision, so it is written as a rule and not as one the code breaks.
    source: apps/tedrisat/src/course/course-notification.repository.ts:107

  - id: staff-hand-in-list-holds-more-than-its-counts
    rule: >-
      The course team's list of hand-ins holds every LessonSubmission row of the live sessions, including a row whose note and files were all
      removed and the row of a talebe who is no longer seated, while handedInCount, talebeCount and the talebe's own list count only a note or a
      file of an ENROLLED or COMPLETED talebe, so that N never passes M in "N / M teslim".
    note: >-
      The repository says so itself: a submission of somebody no longer enrolled is listed by listForCourse but not counted (lesson-submission.repository.ts:850-855).
    source: apps/tedrisat/src/lesson-submission/lesson-submission.repository.ts:500

  # ---- What the code does not keep ----
  - id: evaluation-read-keeps-homework-kind-closed
    rule: >-
      Whether a session carries a memorisation homework is content: it is read only by a caller who may read the course's content, as the grades
      list does for a caller it is closed to.
    holds: false
    finding: evaluation-probe-leaks-homework-kind
    note: >-
      GET /lessons/{id}/evaluation answers 200 {status null} to any signed-in caller of a visible, open course when the session's homework is a
      memorisation and 404 MEMORIZATION_NOT_FOUND when it is not (evaluation.repository.ts:185), so a stranger, a pending or a removed talebe
      learns which sessions are memorisations, while exam.service.ts:91 treats "which sessions are exams or carry homework" as content. Read
      from the code; no request was made.
    source: apps/tedrisat/src/evaluation/evaluation.repository.ts:185
