# Homework, homework hand-ins and their review, memorisation marks, exams, session notes, session questions and appeals: the
# handlers of domain.md lines 2259-2689 (the inventory chapter "Homework, questions, notes, evaluations, exams, appeals"). The chapter
# counts 41 handlers (5 homework definition + 13 hand-in and review + 4 evaluation + 4 exam + 4 note + 6 question + 5 appeal) and
# this file writes 41 of them, plus one action with no route, the exam reminder poll, so 42 actions in all; MDRS-248 (#402) added the
# two routes of LessonViewController (recordLessonView, listMyLessonViews), which the chapter predates: 44 actions in all. Each is named by its
# explicit OpenAPI operationId (the `operationId` of @ApiOperation), which is unique across the API and says what a person would say.
#
# Routes are written with {param}, as OpenAPI does (the controllers spell them :param). `source` on an action is the
# line of its route decorator; `source` on a refusal is the line that throws it, checked against the code of this branch (the
# worktree is stacked on #394).
#
# What is NOT repeated on every action (it holds for all of them; domain.yaml carries the invariants):
#   401 HTTP_401        no token, a header that is not `Bearer <token>`, or a token the verifier refuses (AuthGuard, invariant access-token-only).
#   429 HTTP_429        the address throttle and the per-user throttle (invariant rate-limit-before-auth).
#   passive scope       every decision that opens a passive scope's content to management writes the audit row scope.passive_open
#                       (invariant passive-scope-closes-content).
#
# How a request is refused, in this order, for the routes of this file:
#   1. AuthGuard: 401.
#   2. AuthzGuard resolves the resource and answers its own 404 before anything else: `byLessonCourse` (course/lesson.controller.ts:89)
#      gives 404 LESSON_NOT_FOUND for an id that is not a uuid or names no session; `byExistingCourse` (course/course.controller.ts:103)
#      gives 404 COURSE_NOT_FOUND; `byExistingMadrasah` (madrasah/madrasah.controller.ts:104) gives 404 MADRASAH_NOT_FOUND;
#      `byQuestionCourse` (lesson-question/lesson-question.controller.ts:71) gives 404 LESSON_QUESTION_NOT_FOUND.
#   3. assertOpen (authz.guard.ts:89): a course of a hidden (archived) köşk answers 404 COURSE_NOT_FOUND to everyone but holders of
#      course.hide or platform.kosk_edit (tedrisat-role-resolver.service.ts:102), on every route whose resource is a course.
#   4. The permission of @Authz: 403 AUTHZ_FORBIDDEN (authz.guard.ts:92). A route whose @Authz asks course.view never refuses here:
#      every signed-in caller holds course.view on an existing course (relation PUBLIC), on purpose, so that the guard only gives the
#      404s and the service makes the real decision (see the three helpers below). Those routes list no AUTHZ_FORBIDDEN.
#      Where a route asks a content code (session.manage, submission.read, question.answer, course.view_details) a passive scope removes it
#      from everyone but the holders of platform.inactive_scopes_manage and the nazım of the köşk, so the course team is refused 403 there too.
#   5. For an upload route, UploadGateInterceptor: 503 STORAGE_NOT_CONFIGURED before the body is read, 413 FILE_TOO_LARGE for a
#      Content-Length above 25 MB + 64 KB, a multipart body that breaks multer's limits (400 HTTP_400).
#   6. Pipes: a parameter that is not a uuid is 400 HTTP_400 (ParseUUIDPipe), a body that breaks its DTO is 400 VALIDATION_ERROR.
#   7. The handler and its service.
# `:id` of a session route is read by the resolver first, so a malformed session id is 404 and never 400; a second parameter
# (`:fileId`, `:noteId`, `:userId`, `:submissionId`) has no resolver and is 400 HTTP_400 when it is not a uuid.
#
# The three service helpers of course/course.service.ts that decide who is a talebe here:
#   mayWriteAsTalebe (:570)     an enrollment ENROLLED or COMPLETED, no open ban that bars the course, and the course's content open to
#                               the caller (course.view_details, which a passive scope closes even to the enrolled). Staff who are not
#                               enrolled and the başnazım are refused.
#   mayReachOwnWriting (:593)   the content is open to the caller, or the course is in no passive scope: a removed, barred or pending
#                               person, and a stranger of a visible course, still reach what they wrote.
#   findVisibleLessonCourse (:514) / findWritableLessonCourse (:538): the course of a session, seen through getDetail. A hidden course, a
#                               draft the caller may not edit or view unpublished, and (for the writable one) an archived session are
#                               404 LESSON_NOT_FOUND, never COURSE_NOT_FOUND.
#
# UPLOAD, the refusals every upload route gives (storage/upload.ts, storage/object-storage.ts): 503 STORAGE_NOT_CONFIGURED when no
# BUNNY_STORAGE_* key is set; 413 FILE_TOO_LARGE above 25 MB; 400 FILE_REQUIRED for no file or an empty one; 415 FILE_TYPE_NOT_ALLOWED
# unless the bytes are a PDF, PNG, JPEG, WebP, docx, xlsx, pptx or plain UTF-8 text; 503 STORAGE_UNAVAILABLE when the store does not
# answer. A stored file is claimed in the same transaction as its row and its audit row; deletions go through the storage_deletions
# queue (StorageDeletion) and a kick of its sweep. DOWNLOAD streams through the API with Content-Disposition attachment, the type read at
# upload, X-Content-Type-Options nosniff and Cache-Control private, no-store (storage/stored-file.ts:19).
schema: delurio-graph/0
kind: domain
id: medaris.api
actions:
  # ---- Homework a müderris sets on a session (LessonAssignmentController, course/lesson-assignment.controller.ts) ----
  saveLessonAssignment:
    summary: Set a session's homework, or change its description or how it is handed in
    route: PUT /lessons/{id}/assignment
    needs: session.manage on the session's course (AuthGuard + AuthzGuard, resolver byLessonCourse); course.edit alone is refused; a hidden session or a course the caller may not write to is not found
    body:
      type: object
      additionalProperties: false
      properties:
        description: { type: [string, "null"], maxLength: 4000, note: "plain text, trimmed; null, absent or blank is none, so a save without it clears the description" }
        kind: { enum: [FILE, MEMORIZE], note: "absent keeps what the homework has, FILE for a new one; MEMORIZE is recited to the müderris and takes no file" }
    result: { returns: LessonAssignment, status: 200 }
    refusals:
      LESSON_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.service.ts:553, note: "the id is not a uuid or names no session (lesson.controller.ts:91, :95); the session is archived (course.service.ts:553; again under the lock, lesson-assignment.repository.ts:306); its course is hidden or a draft to this caller (course.service.ts:549)" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the course is in a hidden köşk and the caller holds neither course.hide nor platform.kosk_edit" }
      VALIDATION_ERROR: { status: 400, source: libs/common/src/pipes/validation.pipe.ts:52, note: "description over 4000 characters, a kind that is neither FILE nor MEMORIZE, or an unknown property" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks session.manage on the course" }
    sideEffects:
      - audit:lesson_assignment.create
      - audit:lesson_assignment.update
      - "the first save makes the homework (lesson_assignment.create); a later save that changes the description or the kind writes lesson_assignment.update; a save that changes nothing writes nothing. The audit row carries the description's length, never its text"
    note: The homework is not part of PUT /courses/{id}, so the course's version is not bumped.
    source: apps/tedrisat/src/course/lesson-assignment.controller.ts:84

  deleteLessonAssignment:
    summary: Take a session's homework off
    route: DELETE /lessons/{id}/assignment
    needs: session.manage on the session's course (AuthGuard + AuthzGuard, resolver byLessonCourse)
    result: { status: 204 }
    refusals:
      LESSON_ASSIGNMENT_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/lesson-assignment.service.ts:68, note: "the session has no homework" }
      LESSON_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.service.ts:553, note: "as saveLessonAssignment: an id that is not a session, an archived session, a hidden course or a draft to this caller" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the course is in a hidden köşk" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks session.manage on the course" }
    sideEffects:
      - audit:lesson_assignment.delete
      - "deletes the homework's AssignmentEvaluation marks, its LessonAssignmentFile rows and the LessonAssignment row; each file's object is queued in StorageDeletion and the sweep is kicked; the audit row says what went (marks, files). The talebe's LessonSubmission rows stay"
    source: apps/tedrisat/src/course/lesson-assignment.controller.ts:110

  addLessonAssignmentFile:
    summary: Add a file to a session's homework
    route: POST /lessons/{id}/assignment/files
    needs: session.manage on the session's course (AuthGuard + AuthzGuard, resolver byLessonCourse)
    body:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, note: "multipart field `file`, one file, 25 MB at most, a PDF, PNG, JPEG, WebP, docx, xlsx, pptx or plain UTF-8 text by its bytes; at most 4 other fields" }
    result: { returns: LessonAssignment, status: 201 }
    refusals:
      STORAGE_NOT_CONFIGURED: { status: 503, source: apps/tedrisat/src/storage/object-storage.ts:68, note: "no BUNNY_STORAGE_* key; the upload gate refuses before the body is read (upload.ts:113)" }
      FILE_TOO_LARGE: { status: 413, source: apps/tedrisat/src/storage/upload.ts:120, note: "a Content-Length above 25 MB + 64 KB, a body that streams past 25 MB (upload.ts:126) or a file over 25 MB (upload.ts:151)" }
      HTTP_400: { status: 400, source: apps/tedrisat/src/storage/upload.ts:72, note: "the multipart body breaks multer's limits: a field other than `file`, more than one file, more than 4 fields or 6 parts" }
      FILE_REQUIRED: { status: 400, source: apps/tedrisat/src/storage/upload.ts:150, note: "no file in the field `file`, or an empty one" }
      FILE_TYPE_NOT_ALLOWED: { status: 415, source: apps/tedrisat/src/storage/upload.ts:153, note: "the type read from the bytes is not one of the eight" }
      STORAGE_UNAVAILABLE: { status: 503, source: apps/tedrisat/src/storage/bunny-object-storage.ts:155, note: "the store did not answer; the reserved object is queued for removal" }
      LESSON_ASSIGNMENT_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/lesson-assignment.service.ts:85, note: "the session has no homework yet (a homework file needs one); asked again under the row lock, lesson-assignment.repository.ts:235, when the homework was taken off meanwhile" }
      LESSON_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.service.ts:553, note: "an id that is not a session, an archived session, a hidden course or a draft to this caller" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the course is in a hidden köşk" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks session.manage on the course" }
    sideEffects:
      - audit:lesson_assignment.file_upload
      - "the object is put in Bunny Storage under a key tedrisat makes (lessonAssignmentFileKey) and the claim on it is taken in the same transaction as the LessonAssignmentFile row"
    note: No cap on the number of files of one homework was found in the service or the repository (lesson-assignment.repository.ts:227-262). A homework file is never one of the session's LessonResource rows.
    source: apps/tedrisat/src/course/lesson-assignment.controller.ts:144

  deleteLessonAssignmentFile:
    summary: Remove a file from a session's homework
    route: DELETE /lessons/{id}/assignment/files/{fileId}
    needs: session.manage on the session's course (AuthGuard + AuthzGuard, resolver byLessonCourse)
    result: { status: 204 }
    refusals:
      LESSON_ASSIGNMENT_FILE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/lesson-assignment.service.ts:111, note: "no such file on this session's homework, or the session has no homework" }
      HTTP_400: { status: 400, source: apps/tedrisat/src/course/lesson-assignment.controller.ts:169, note: "fileId is not a uuid" }
      LESSON_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.service.ts:553, note: "an id that is not a session, an archived session, a hidden course or a draft to this caller" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the course is in a hidden köşk" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks session.manage on the course" }
    sideEffects: [audit:lesson_assignment.file_delete, "the object is queued in StorageDeletion and the sweep is kicked"]
    source: apps/tedrisat/src/course/lesson-assignment.controller.ts:165

  downloadLessonAssignmentFile:
    summary: Download a file of a session's homework
    route: GET /lessons/{id}/assignment/files/{fileId}
    needs: "course.view_details on the session's course (AuthGuard + AuthzGuard, resolver byLessonCourse): an ENROLLED or COMPLETED talebe with no bar, the course team, the başnazım"
    result: { status: 200, type: string, format: binary, note: "the file as an attachment under its stored name (DOWNLOAD headers)" }
    refusals:
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "a pending talebe, a stranger, a removed or barred talebe: none holds course.view_details; and everyone but the managers a passive scope leaves open (platform.inactive_scopes_manage, the köşk nazımı) while the course is in a passive scope" }
      STORAGE_NOT_CONFIGURED: { status: 503, source: apps/tedrisat/src/storage/object-storage.ts:68, note: "no BUNNY_STORAGE_* key" }
      LESSON_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/lesson-assignment.service.ts:137, note: "an id that is not a session, a hidden course or a draft to this caller (course.service.ts:521), or the session is archived and so not in the course detail" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the course is in a hidden köşk" }
      LESSON_ASSIGNMENT_FILE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/lesson-assignment.service.ts:141, note: "no such file on this session, the course detail says the content is locked, or the store no longer has the object (stored-file.ts:38)" }
      STORAGE_UNAVAILABLE: { status: 503, source: apps/tedrisat/src/storage/bunny-object-storage.ts:155, note: "the store did not answer" }
      HTTP_400: { status: 400, source: apps/tedrisat/src/course/lesson-assignment.controller.ts:196, note: "fileId is not a uuid" }
    sideEffects:
      - audit:course.content_read
      - "written (via assignment.download) before the body is returned when the reader is neither an enrolled talebe nor one of the course's müderrisler (MDRS-103); a failed write fails the read"
    source: apps/tedrisat/src/course/lesson-assignment.controller.ts:192

  # ---- A talebe's homework hand-in, and the review of it (LessonSubmissionController and CourseSubmissionsController) ----
  getMySubmission:
    summary: The caller's own homework on a session
    route: GET /lessons/{id}/submission
    needs: any signed-in caller (course.view on the session's course, which the guard never refuses); the service reads only the caller's own row, while the course is visible and not passive (mayReachOwnWriting). Cache-Control private, no-store
    result:
      type: object
      required: [submission, maxFiles, maxFileBytes]
      properties:
        submission: { type: [object, "null"], note: "a LessonSubmission with its SubmissionFile rows and, once the review is sent, the review (note, reviewer, SubmissionReviewFile rows); null while nothing is handed in. The review is null until it is sent" }
        maxFiles: { const: 10 }
        maxFileBytes: { const: 26214400 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      SUBMISSION_FORBIDDEN: { status: 403, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:502, note: "the course is in a passive scope and its content is closed to the caller" }
      LESSON_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.service.ts:521, note: "an id that is not a session (lesson.controller.ts:91, :95), or the session's course is hidden or a draft to this caller; an archived session is still found" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the course is in a hidden köşk" }
    note: A stranger of a visible, open course gets 200 with submission null.
    source: apps/tedrisat/src/lesson-submission/lesson-submission.controller.ts:99

  listMySubmissions:
    summary: The sessions of a course the caller handed homework in on
    route: GET /courses/{id}/my-submissions
    needs: any signed-in caller (course.view on the course, resolver byExistingCourse); own rows only, while the course is visible and not passive. Cache-Control private, no-store
    result:
      type: object
      required: [items]
      properties:
        items:
          type: array
          note: "each live session where the caller's homework holds a note or at least one file; one emptied since is not listed"
          items:
            type: object
            required: [lessonId, updatedAt]
            properties:
              lessonId: { type: string, format: uuid, references: Lesson }
              updatedAt: { type: string, format: date-time }
    refusals:
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.controller.ts:111, note: "an id that is not a uuid or names no course; a course of a hidden köşk (the guard); a hidden course or a draft to this caller (course.service.ts:352, :366)" }
      SUBMISSION_FORBIDDEN: { status: 403, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:256, note: "the course is in a passive scope and its content is closed to the caller" }
    source: apps/tedrisat/src/lesson-submission/lesson-submission.controller.ts:119

  saveMySubmissionNote:
    summary: Save the note of the caller's homework on a session
    route: PUT /lessons/{id}/submission
    needs: an ENROLLED or COMPLETED talebe with no bar and the content open (course.view on the session's course, then mayWriteAsTalebe); no deadline
    body:
      type: object
      additionalProperties: false
      properties:
        note: { type: [string, "null"], maxLength: 4000, sensitivity: personal, note: "trimmed; null, absent or blank clears it; stored as typed, never rendered as HTML" }
    result: { returns: LessonSubmission, status: 200 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      SUBMISSION_FORBIDDEN: { status: 403, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:490, note: "not an active talebe (pending, removed, barred, a stranger, staff who are not enrolled, the başnazım) or the content is closed" }
      LESSON_NOT_FOUND: { status: 404, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:487, note: "an id that is not a session, a hidden course or a draft to this caller; the session is archived (also under the transaction, lesson-submission.repository.ts:294)" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the course is in a hidden köşk" }
      VALIDATION_ERROR: { status: 400, source: libs/common/src/pipes/validation.pipe.ts:52, note: "a note over 4000 characters, not a string, or an unknown property" }
    sideEffects:
      - "upserts the LessonSubmission on (lessonId, userId), making the row if there is none even when the note is blank; the session need not have a LessonAssignment, any live session takes a hand-in. No audit row"
    source: apps/tedrisat/src/lesson-submission/lesson-submission.controller.ts:138

  addMySubmissionFile:
    summary: Hand a file in on a session
    route: POST /lessons/{id}/submission/files
    needs: an ENROLLED or COMPLETED talebe with no bar and the content open (course.view on the session's course, then mayWriteAsTalebe)
    body:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, note: "multipart field `file`, one file, 25 MB at most, the eight types of UPLOAD" }
    result: { returns: LessonSubmission, status: 201 }
    refusals:
      STORAGE_NOT_CONFIGURED: { status: 503, source: apps/tedrisat/src/storage/object-storage.ts:68, note: "no BUNNY_STORAGE_* key; the upload gate refuses before the body is read (upload.ts:113)" }
      FILE_TOO_LARGE: { status: 413, source: apps/tedrisat/src/storage/upload.ts:120, note: "a Content-Length above 25 MB + 64 KB, a body that streams past 25 MB (upload.ts:126) or a file over 25 MB (upload.ts:151)" }
      HTTP_400: { status: 400, source: apps/tedrisat/src/storage/upload.ts:72, note: "the multipart body breaks multer's limits: a field other than `file`, more than one file, more than 4 fields or 6 parts" }
      FILE_REQUIRED: { status: 400, source: apps/tedrisat/src/storage/upload.ts:150, note: "no file in the field `file`, or an empty one" }
      FILE_TYPE_NOT_ALLOWED: { status: 415, source: apps/tedrisat/src/storage/upload.ts:153, note: "the type read from the bytes is not one of the eight" }
      STORAGE_UNAVAILABLE: { status: 503, source: apps/tedrisat/src/storage/bunny-object-storage.ts:155, note: "the store did not answer; the reserved object is queued for removal" }
      SUBMISSION_FORBIDDEN: { status: 403, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:490, note: "not an active talebe, or the content is closed" }
      SUBMISSION_FILES_NOT_TAKEN: { status: 409, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:184, note: "the session's homework is a MEMORIZE homework: recited to the müderris, never uploaded; asked again under a share lock, lesson-submission.repository.ts:333" }
      SUBMISSION_FILE_LIMIT: { status: 409, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:190, note: "the caller already has 10 files on the session (MAX_SUBMISSION_FILES); re-checked under the row lock, lesson-submission.repository.ts:356" }
      LESSON_NOT_FOUND: { status: 404, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:487, note: "an id that is not a session, a hidden course or a draft to this caller; the session is archived (also lesson-submission.repository.ts:323)" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the course is in a hidden köşk" }
    sideEffects:
      - audit:submission.file_upload
      - "makes the LessonSubmission row if there is none, then inserts the SubmissionFile under the row's lock so two uploads cannot pass the limit together; the claim on the stored object is taken in the same transaction"
    source: apps/tedrisat/src/lesson-submission/lesson-submission.controller.ts:174

  deleteMySubmissionFile:
    summary: Remove one of the caller's own homework files
    route: DELETE /lessons/{id}/submission/files/{fileId}
    needs: an ENROLLED or COMPLETED talebe with no bar and the content open (course.view on the session's course, then mayWriteAsTalebe), and the file is theirs
    result: { status: 204 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      SUBMISSION_FORBIDDEN: { status: 403, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:490, note: "not an active talebe, so a removed, barred or pending talebe cannot remove a file; or the file is another talebe's (service.ts:476)" }
      SUBMISSION_FILE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:475, note: "no such file on this session (also :222, when it went meanwhile)" }
      HTTP_400: { status: 400, source: apps/tedrisat/src/lesson-submission/lesson-submission.controller.ts:199, note: "fileId is not a uuid" }
      LESSON_NOT_FOUND: { status: 404, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:487, note: "an id that is not a session, a hidden course or a draft to this caller; the session is archived" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the course is in a hidden köşk" }
    sideEffects: [audit:submission.file_delete, "the object is queued in StorageDeletion and the sweep is kicked; the LessonSubmission's updatedAt moves"]
    source: apps/tedrisat/src/lesson-submission/lesson-submission.controller.ts:195

