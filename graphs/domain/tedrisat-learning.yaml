  # ---- Exams, "Sınav" (ExamController, exam/exam.controller.ts); an exam is planned by the session batch of the courses chapter ----
  saveExamResult:
    summary: Enter a talebe's score on an exam, or mark them Girmedi
    route: PUT /lessons/{id}/exam-results/{userId}
    needs: session.manage on the session's course (AuthGuard + AuthzGuard, resolver byLessonCourse); the session is live and an exam; the talebe is ENROLLED or COMPLETED in the course; no time window, so a result can be entered before the exam and before the release
    body:
      type: object
      additionalProperties: false
      properties:
        score: { type: [integer, "null"], minimum: 0, note: "a whole number from 0 to the exam's maxScore, checked under a lock; null with absent" }
        absent: { type: boolean, default: false, note: "Girmedi: a score sent with it is dropped, no score is kept" }
    result: { returns: ExamResult, status: 200 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      EXAM_SCORE_OUT_OF_RANGE: { status: 400, source: apps/tedrisat/src/exam/exam.repository.ts:188, note: "not absent and the score is missing or outside 0..maxScore" }
      EXAM_NOT_FOUND: { status: 404, source: apps/tedrisat/src/exam/exam.repository.ts:182, note: "the session is not an exam" }
      EXAM_TALEBE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/exam/exam.repository.ts:201, note: "no ENROLLED or COMPLETED seat for this talebe in the session's course" }
      LESSON_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.service.ts:553, note: "an id that is not a session, an archived session, a hidden course or a draft to this caller (course.service.ts:549); again under the transaction, exam.repository.ts:171" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the course is in a hidden köşk" }
      VALIDATION_ERROR: { status: 400, source: libs/common/src/pipes/validation.pipe.ts:52, note: "a score that is not an integer, an absent that is not a boolean, or an unknown property" }
      HTTP_400: { status: 400, source: apps/tedrisat/src/exam/exam.controller.ts:80, note: "userId is not a uuid" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks session.manage on the course" }
    sideEffects:
      - audit:exam_result.save
      - "upserts on (examId, userId) with the exam row held FOR UPDATE, so max_score cannot change under the check. A save equal to the stored result writes nothing and no audit row. The audit row carries the score and absent. No notification"
    source: apps/tedrisat/src/exam/exam.controller.ts:76

  releaseExamResults:
    summary: Open an exam's results to the talebe ("Sonuçları talebelere aç")
    route: POST /lessons/{id}/exam-results/release
    needs: session.manage on the session's course (AuthGuard + AuthzGuard, resolver byLessonCourse); the session is live and an exam
