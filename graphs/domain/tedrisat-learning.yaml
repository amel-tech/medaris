  sendSubmissionReview:
    summary: Send the review of a talebe's homework (a note, with or without files) to the talebe
    route: PUT /courses/{id}/submissions/{submissionId}/review
    needs: "submission.read on the course (AuthGuard + AuthzGuard, resolver byExistingCourse): whoever reads the homework reviews it; the homework must be on a live session of this course"
    body:
      type: object
      additionalProperties: false
      properties:
        note: { type: [string, "null"], maxLength: 4000, sensitivity: personal, note: "trimmed; null, absent or blank leaves none, which then needs at least one review file; sending again replaces the note and keeps the files" }
    result: { returns: LessonSubmission, status: 200 }
    refusals:
      SUBMISSION_REVIEW_EMPTY: { status: 400, source: apps/tedrisat/src/lesson-submission/lesson-submission.repository.ts:721, note: "no note and no review file: a review needs one of the two" }
      VALIDATION_ERROR: { status: 400, source: libs/common/src/pipes/validation.pipe.ts:52, note: "a note over 4000 characters, not a string, or an unknown property" }
      HTTP_400: { status: 400, source: apps/tedrisat/src/lesson-submission/lesson-submission.controller.ts:348, note: "submissionId is not a uuid" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.controller.ts:111, note: "an id that is not a uuid or names no course; a course of a hidden köşk (the guard); a hidden course or a draft to this caller (course.service.ts:352, :366)" }
      SUBMISSION_NOT_FOUND: { status: 404, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:446, note: "the homework is not on a live session of this course, or its session is hidden (also :452)" }
      LESSON_NOT_FOUND: { status: 404, source: apps/tedrisat/src/lesson-submission/lesson-submission.repository.ts:714, note: "only when the session is hidden between the check and the row lock" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks submission.read on the course" }
    sideEffects:
      - audit:submission.review
      - notification:SUBMISSION_REVIEWED
      - "sets reviewNote, reviewedBy and reviewedAt under the row lock; review files already attached become visible to the talebe at this moment. The audit row carries the note's length and `first`. The talebe is notified (target SESSION; params courseId, courseTitle, sessionLabel) on EVERY send, a re-send that changes nothing included, unless the reviewer is that talebe; a failed notification is logged and never the caller's error"
    source: apps/tedrisat/src/lesson-submission/lesson-submission.controller.ts:344

  addSubmissionReviewFile:
    summary: Attach a file to the review of a talebe's homework
    route: POST /courses/{id}/submissions/{submissionId}/review/files
    needs: submission.read on the course (AuthGuard + AuthzGuard, resolver byExistingCourse)
    body:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, note: "multipart field `file`, one file, 25 MB at most, the eight types of UPLOAD" }
    result: { returns: LessonSubmission, status: 201 }
    refusals:
      STORAGE_NOT_CONFIGURED: { status: 503, source: apps/tedrisat/src/storage/object-storage.ts:68, note: "no BUNNY_STORAGE_* key; the upload gate refuses before the body is read (upload.ts:113)" }
      FILE_TOO_LARGE: { status: 413, source: apps/tedrisat/src/storage/upload.ts:120, note: "a Content-Length above 25 MB + 64 KB, a body that streams past 25 MB (upload.ts:126) or a file over 25 MB (upload.ts:151)" }
      HTTP_400: { status: 400, source: apps/tedrisat/src/storage/upload.ts:72, note: "the multipart body breaks multer's limits; or submissionId is not a uuid (lesson-submission.controller.ts:391)" }
      FILE_REQUIRED: { status: 400, source: apps/tedrisat/src/storage/upload.ts:150, note: "no file in the field `file`, or an empty one" }
      FILE_TYPE_NOT_ALLOWED: { status: 415, source: apps/tedrisat/src/storage/upload.ts:153, note: "the type read from the bytes is not one of the eight" }
      STORAGE_UNAVAILABLE: { status: 503, source: apps/tedrisat/src/storage/bunny-object-storage.ts:155, note: "the store did not answer; the reserved object is queued for removal" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.controller.ts:111, note: "an id that is not a uuid or names no course; a course of a hidden köşk (the guard); a hidden course or a draft to this caller (course.service.ts:352, :366)" }
      SUBMISSION_NOT_FOUND: { status: 404, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:446, note: "the homework is not on a live session of this course" }
      LESSON_NOT_FOUND: { status: 404, source: apps/tedrisat/src/lesson-submission/lesson-submission.repository.ts:618, note: "only when the session is hidden between the check and the row lock" }
      SUBMISSION_REVIEW_FILE_LIMIT: { status: 409, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:355, note: "the review already carries 5 files (MAX_REVIEW_FILES); re-checked under the row lock, lesson-submission.repository.ts:625" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks submission.read on the course" }
    sideEffects:
      - audit:submission.review_file_upload
      - "inserts the SubmissionReviewFile (uploadedBy the caller) and takes the claim on its object. It does not send the review: before the review is sent the talebe sees nothing of the file, after it a new file shows at once"
    source: apps/tedrisat/src/lesson-submission/lesson-submission.controller.ts:387

