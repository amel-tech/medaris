      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/course.controller.ts:111, note: "an id that is not a uuid or names no course; a course of a hidden köşk (the guard); a hidden course or a draft to this caller (course.service.ts:352, :366)" }
      SUBMISSION_FILE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:288, note: "the file is no homework file of this course (another course's file is 404); or the store no longer has the object (service.ts:295)" }
