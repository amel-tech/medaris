  # ---- How far a talebe watched each celse (LessonViewController, lesson-view/lesson-view.controller.ts, MDRS-248) ----
  recordLessonView:
    summary: Record how far the caller has watched a celse's video
    route: PUT /lessons/{id}/view
    needs: "an ENROLLED or COMPLETED talebe with no bar and the content open (course.view on the session's course, then mayWriteAsTalebe): a pending, removed or barred talebe, a stranger, the course team as such, the başnazım and SYSTEM_ADMIN are refused; an archived session of a visible course is not refused"
    body:
      type: object
      required: [positionSeconds]
      additionalProperties: false
      properties:
        positionSeconds: { type: integer, minimum: 0, maximum: 359999, note: "the player's position in whole seconds from the start of the video" }
        durationSeconds: { type: integer, minimum: 1, maximum: 359999, note: "the video's length as the player reports it; left out while it has not said, and the length stored last stays" }
        ended: { type: boolean, note: "true when the player said the video ended" }
    result: { returns: LessonView, status: 200 }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      LESSON_VIEW_FORBIDDEN: { status: 403, source: apps/tedrisat/src/lesson-view/lesson-view.service.ts:42, note: "not an active talebe (pending, removed, barred, a stranger, the course team as such, SYSTEM_ADMIN), or the content is closed to them (a passive scope)" }
      LESSON_NOT_FOUND: { status: 404, source: apps/tedrisat/src/course/lesson.controller.ts:95, note: "the id is not a uuid or names no session (byLessonCourse, lesson.controller.ts:91, :95); the session's course is hidden or a draft to this caller (course.service.ts:524)" }
      COURSE_NOT_FOUND: { status: 404, source: apps/tedrisat/src/authz/tedrisat-role-resolver.service.ts:111, note: "the course is in a hidden köşk" }
      VALIDATION_ERROR: { status: 400, source: libs/common/src/pipes/validation.pipe.ts:52, note: "a position that is negative, above 359999 or not an integer, a length below 1, above 359999 or not an integer, an `ended` that is not a boolean, or an unknown property" }
    sideEffects:
      - "upserts the caller's LessonView on (user, celse) with the position and the length; the first report that ends the video or reaches nine tenths of the length stamps completedAt, and every later write keeps the stamp (lesson-view.repository.ts:95-136)"
      - "the report that stamps completedAt also sets the caller's Enrollment.progress, in the same transaction, to the share of the course's celses watched, in whole percent (not hidden, not in a hidden week, not cancelled; 0 for a course with none), on an ENROLLED or COMPLETED row only and never its status (lesson-view.repository.ts:138-174); no other report writes it"
      - "no audit row and no notification"
    note: "Handler LessonViewController.record. Sent by the watch page's counter (tedris.celse.watchRecording) while a YouTube or Bunny recording plays; tedris calls it from nothing else."
    source: apps/tedrisat/src/lesson-view/lesson-view.controller.ts:66

