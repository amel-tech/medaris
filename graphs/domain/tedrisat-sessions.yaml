  # ------------------------------------------------------------------------------------------------------------------------
  # Background jobs of the area: in-process timers, none under the test runner, no route and no caller. The inventory's section 2
  # lists them; there is no Bunny webhook route, polling was chosen "because how Bunny's webhooks are authenticated was not checked".
  # ------------------------------------------------------------------------------------------------------------------------
  pollRecordingEncoding:
    summary: Settle the Bunny uploads that are still PROCESSING, then delete the replaced videos from Bunny
    description: >-
      One pass (RecordingEncodingPoller.pollOnce). Settling: reads up to 50 PROCESSING Bunny uploads, least recently updated first,
      from Bunny (getVideo) and decides by the video's status: FINISHED (4) or the JIT playlists created (8) is READY, ERROR (5) or
      UPLOAD_FAILED (6) is FAILED, CREATED (0) after upload_expires_at is FAILED, a video gone from the library is FAILED, anything
      else keeps waiting (even past the lifetime, because the file arrived in time and is being encoded). A READY upload gets
      duration_minutes = max(1, round(length / 60)) and is announced. The write is conditional on the row still being PROCESSING
      with the same video id, so several instances polling at once are harmless. A row left waiting or not answered for goes to the
      back of the queue. Removing: then deletes up to 20 queued replaced videos, least recently tried first, once the upload that
      replaced each is over; a video Bunny no longer has counts as deleted, a video a recording holds again is never deleted, a
      refusal bumps attempts and is tried again later with no cap.
    needs: the system itself (an in-process timer); no caller, no token, no permission
    result:
      type: object
      description: the counts of one pass, which the poller returns and no route sends
      properties:
        ready: { type: integer }
        failed: { type: integer }
        waiting: { type: integer }
        errors: { type: integer }
        removed: { type: integer }
        removeErrors: { type: integer }
    refusals: {}
    sideEffects:
      - "bunny:getVideo (GET /library/<id>/videos/<videoId>, per PROCESSING upload)"
      - "bunny:deleteVideo (DELETE, per queued replaced video; a 404 counts as deleted)"
      - "notification:RECORDING_ADDED (announce, with no actor, when an upload turns READY and its release time has passed)"
      - "audit:recording.video_delete (per video deleted from Bunny)"
    note: >-
      Trigger: setInterval every 60 seconds (ENCODING_POLL_INTERVAL_MS), started at application bootstrap only when the Bunny Stream
      library is configured (BUNNY_STREAM_LIBRARY_ID and BUNNY_STREAM_API_KEY), so a server without the keys, every test app among
      them, runs no timer. A pass still running when the next tick comes is not overlapped. An error on one video is logged, counted
      in errors and retried on a later pass.
    source: apps/tedrisat/src/course/recording-encoding.poller.ts:100

  announceReleasedRecordings:
    summary: Announce the recordings whose release time has come
    description: >-
      One pass (RecordingReleasePoller.releaseDue). Claims up to 100 READY recordings that were not announced and whose release time
      has come, one statement per recording that checks and marks notified_at, and tells the talebe of each (RECORDING_ADDED). A
      recording opens on every read at its own time, so playing needs no job; only the announcement waits for this one. The writes
      that may have opened a recording (a pasted link, a link replaced, a release time changed) and the encoding poll call announce
      themselves, and whichever gets there first claims it; a recording is announced once and never again.
    needs: the system itself (an in-process timer); no caller, no token, no permission
    result:
      type: integer
      description: how many recordings the pass claimed
    refusals: {}
    sideEffects:
      - "notification:RECORDING_ADDED (to the ENROLLED seats of the session's course, no actor left out; a hidden session is not news)"
    note: >-
      Trigger: setInterval every 60 seconds (RELEASE_POLL_INTERVAL_MS), started at application bootstrap and never under the test
      runner (isTestRunner). A pass still running when the next tick comes is not overlapped. A failure to claim or to write the
      notification is logged and never undoes anything.
    source: apps/tedrisat/src/course/recording-release.poller.ts:103

  sweepStorageDeletions:
    summary: Delete from Bunny Storage the objects that no row points at any more
    description: >-
      One pass (StorageDeletionService.pass) claims up to 50 StorageDeletion rows that are due with FOR UPDATE SKIP LOCKED, moving
      their due time 15 minutes ahead and counting an attempt, removes each object from the store, and deletes the rows of the
      objects removed. A failure keeps the row with last_error and a backoff of one minute doubling to at most six hours. A kick
      goes round again while a full batch is claimed, at most 20 rounds. The rows are written by the transactions that drop a file's
      last reference (a removed resource, a purge, a deleted homework file) and by the upload routes (upload.unclaimed, upload.failed), so
      the database decides what is gone and the sweep only catches the store up.
    needs: the system itself (an in-process timer, or a kick after a write); no caller, no token, no permission
    refusals: {}
    sideEffects:
      - "storage:delete (Bunny Storage, per due object; an object already gone is not an error)"
    note: >-
      Trigger: setInterval every 5 minutes (STORAGE_SWEEP_INTERVAL_MS) and once at bootstrap, only when the object store is
      configured (BUNNY_STORAGE_*) and never under the test runner; and StorageDeletionService.kick() after each write that lets
      a file go (updateLesson with resources, uploads that fail, a purge, a köşk delete, the whole-course save). Without storage no
      sweep runs and the rows wait. Several instances sweeping at once is harmless.
    source: apps/tedrisat/src/storage/storage-deletion.service.ts:118

invariants:
  # Sessions
  - id: session-is-a-live-lesson
    rule: >-
      A "session" (celse) is a lesson of type LIVE. The session page, previous and next, and the weekly batch deal with LIVE lessons
      only, so a VIDEO, DOCUMENT or QUIZ lesson is a 404 LESSON_NOT_FOUND on the session page, and only a LIVE lesson takes a stream
      link or is a make-up.
    source: apps/tedrisat/src/course/domain/session-view.ts:165

  - id: session-status-follows-the-clock
    rule: >-
      A session's status is never stored: CANCELLED when cancelled_at is set, else ENDED once now is at or after the start plus the
      length (60 minutes when it has none), LIVE from the start, else SCHEDULED; a session with no start is SCHEDULED.
    source: apps/tedrisat/src/course/domain/session-view.ts:131

  - id: session-content-is-view-details
    rule: >-
      The meeting link, agenda, kaynak, cancel reason, how a session is attended (inPerson excepted), the stream link, the release
      time of its recording, its homework, its exam and the links and files of its resources are sent only to a caller holding
      course.view_details, and the keys are removed, never nulled. The programme (title, type, schedule, length, the names of its
      resources, the in-person mark) is public. A sample session (is_preview) also shows kaynak, agenda and its PUBLIC recording to a
      locked caller. A cancelled session's meeting link is null even to a content reader.
    source: apps/tedrisat/src/course/domain/course-content.ts:78

  - id: session-meeting-link-any-https-host
    rule: >-
      A stored meeting link is an https address of at most 500 characters on any host; the API has no host allow-list (the Meet,
      Zoom or Jitsi chip is a display helper of the web apps). Only the first session of a weekly batch gets the link, because links
      change every week.
    source: apps/tedrisat/src/course/dto/create-course.dto.ts:178

  - id: session-attendance-has-three-ways
    rule: >-
      A session is attended by its meeting link, its live stream, or in person (lessons.in_person, else courses.in_person); a link
      that is null or only whitespace is no link. A session with none of the three is "without access", which the course menu badge,
      the köşk home and the medrese Pano flag; a cancelled session and one finished without a recording are not counted.
    source: apps/tedrisat/src/course/domain/session-access.ts:82

  - id: session-cancel-keeps-the-slot
    rule: >-
      Cancelling a session sets cancelled_at, cancel_reason and replacement_lesson_id and writes the audit row lesson.cancel; the
      session stays in the programme, its meeting link is no longer sent, and a cancelled session takes no live stream link and no
      pasted recording (409 LESSON_CANCELLED). A second cancel is 409 LESSON_ALREADY_CANCELLED.
    source: apps/tedrisat/src/course/course.repository.ts:1333

  - id: session-make-up-rules
    rule: >-
      The make-up of a cancelled session is a non-archived LIVE session of the same course, not the session itself, not cancelled,
      and the make-up of at most one cancelled session; checked under the course row's lock, after the version check.
    source: apps/tedrisat/src/course/course.repository.ts:1387

  - id: session-hide-never-deletes
    rule: >-
      These routes hide a lesson or a week (archived_at, archived_by, archived_level) and never delete one. A week hides its live
      sessions at one instant with one stamp. The hider's level, the highest rung of COURSE_HIDE_LADDER the caller holds, decides who
      may restore it: the same level or above. Everything attached (recordings, resources, homework) is kept; the real delete is the
      başnazım's purge.
    source: apps/tedrisat/src/course/course.repository.ts:1622

  - id: session-writes-bump-the-version
    rule: >-
      courses.version is bumped by createLesson, updateLesson, cancelLesson, archiveLesson, hideCourseWeek, createSessionBatch and both
      resource file uploads, under the course row's lock, so a whole-course save loaded before them is refused. Only updateLesson and
      cancelLesson carry the version they saw and are refused 409 COURSE_VERSION_CONFLICT when it is stale; the others bump with no
      expected version. The live stream, the recordings and the release time do not bump it, because they are no part of the course
      document.
    source: apps/tedrisat/src/course/course.repository.ts:809

  - id: session-batch-pattern-limits
    rule: >-
      A weekly pattern has 1 to 7 unique ISO weekdays, a local HH:mm start in an IANA zone (the course's by default; the local wall
      time is kept across daylight-saving changes), exactly one of endDate and count, at most 200 sessions, a range of at most 366
      days, and at least one session; an exam batch is exactly one session.
    source: apps/tedrisat/src/course/domain/weekly-pattern.ts:144

  - id: session-batch-week-placement
    rule: >-
      A session of a batch goes into the week whose dates hold it, counted from the course's existing dated weeks in sevens (never
      below 1); with no dated week the pattern's own numbering applies (the Monday-to-Sunday week of startDate is week 1); a missing
      week is created as "Hafta N" after the last. The preview and the write number a session the same way.
    source: apps/tedrisat/src/course/domain/weekly-pattern.ts:224

  - id: session-live-stream-is-youtube
    rule: >-
      Only a LIVE, non-cancelled session takes a stream link, only a YouTube video link, stored normalised as
      https://www.youtube.com/live/<id>. Content readers are shown it from the scheduled start until a released recording replaces it,
      and at most 24 hours after the scheduled end; never to anyone else.
    source: apps/tedrisat/src/course/live-stream.service.ts:48

  - id: session-content-reads-are-audited
    rule: >-
      A content read (the session page, the recordings list, a resource download) by a caller who holds course.view_details and is
      neither a müderris of the course nor an enrolled talebe writes the audit row course.content_read before the body is returned,
      and a failed write fails the read. The audit keys this area writes are session.hide, week.hide, lesson.cancel,
      lesson.live_stream_set, lesson.live_stream_clear, lesson.recording_availability_set, recording.upload_start, recording.add,
      recording.update, recording.video_delete, resource.file_upload, resource.file_delete, course.content_read and scope.passive_open.
    source: apps/tedrisat/src/course/course.service.ts:415

  # Recordings
  - id: recording-one-per-session
    rule: >-
      A session has at most one recording (a unique index on lesson_recordings.lesson_id) and a Bunny video belongs to at most one
      recording (a unique index on bunny_video_id). A second recording is 409 RECORDING_EXISTS unless the existing one is a FAILED
      Bunny upload (a paste may replace it) or a link, a FAILED upload or, with replaceVideo, any Bunny upload (an upload may replace it).
    source: apps/tedrisat/src/database/schema/course.schema.ts:454

  - id: recording-provider-columns
    rule: >-
      A BUNNY recording carries bunny_video_id and upload_expires_at and no url; every other provider carries a url and no video id
      (and a PROCESSING row may have neither), by the CHECK lesson_recordings_provider_columns.
    source: apps/tedrisat/src/database/schema/course.schema.ts:456

  - id: recording-status-machine
    rule: >-
      A Bunny upload is PROCESSING until the encoding poll settles it: FINISHED or JIT playlists created is READY, ERROR or
      UPLOAD_FAILED is FAILED, CREATED after upload_expires_at is FAILED, a video gone from the library is FAILED, any other status
      keeps waiting. A pasted link is READY at once, and a replaced link is READY again. A FAILED recording is listed to no one and is
      retried through the upload route.
    source: apps/tedrisat/src/bunny-stream/bunny-signature.ts:136

  - id: recording-opens-when-released
    rule: >-
      A recording opens to talebe when it is READY, its session has begun and the release time the course team set
      (lessons.recording_available_at) has passed: its availableAt is the later of the two, null only for a session with neither.
      Before that it is listed with availableAt and no link, except to recording.manage holders. It is announced once (RECORDING_ADDED,
      claimed through notified_at) by whichever of the write, the encoding poll or the release poll gets there first.
    source: apps/tedrisat/src/course/domain/recording.ts:100

  - id: recording-visibility-caps
    rule: >-
      An ENROLLED recording is for content readers. A PUBLIC one is also for everyone else, token or not, unless the course is closed
      (is_closed), the platform policy RECORDINGS_NEVER_PUBLIC is on, or the köşk has recordings_never_public; a pending, removed or
      barred talebe counts as everyone else.
    source: apps/tedrisat/src/course/course.service.ts:861

  - id: recording-public-honours-medrese-policy
    rule: >-
      A PUBLIC recording of a medrese course is hidden from visitors when the medrese's policy "no public recordings"
      (madrasah_settings.policy_no_public_recordings) is on, as the köşk's and the platform's flags hide it.
    holds: false
    finding: policy-no-public-recordings-inert
    note: >-
      The policy is stored, edited on the medrese settings route and loaded into the authz policy list, but publicRecordingsAllowed
      reads only is_closed, the platform policy and the köşk flag, so a PUBLIC recording of a medrese course is still shown to
      visitors. The schema comment says the other two medrese policies "are kept for the courses and recordings that will read them".
      setting.recordings_public is closed by the policy in the engine and no handler asks it.
    source: apps/tedrisat/src/course/course.service.ts:861

  - id: recording-bunny-link-own-library
    rule: >-
      A pasted Bunny player link is accepted only for the configured library, any other Bunny host or library is refused, and a
      Bunny video can be the recording of one session only. The video id is never sent to a client; the player link is signed on every
      response with an expiry (6 hours by default, 60 seconds to 7 days).
    source: apps/tedrisat/src/course/domain/recording-link.ts:116

  - id: recording-upload-signature-24h
    rule: >-
      A TUS upload is signed for 24 hours (Bunny asks for at least one hour); re-signing keeps the original expiry and is possible
      only for a PROCESSING upload that has not expired.
    source: apps/tedrisat/src/bunny-stream/bunny-signature.ts:10

  - id: recording-replaced-videos-leave-bunny
    rule: >-
      A Bunny video that leaves its recording (replaced by an upload, by a pasted link, or after a FAILED upload) is queued in
      bunny_video_removals in the same transaction and deleted by the encoding poll, 20 per pass, once the upload that replaced it is
      over; a video a recording holds again is never deleted, and the deletion is audited recording.video_delete.
    source: apps/tedrisat/src/course/recording.repository.ts:653

  - id: recording-upload-refuses-cancelled-session
    rule: "A cancelled session takes no recording: an upload is refused with 409 LESSON_CANCELLED exactly as a pasted link is."
    holds: false
    finding: upload-on-cancelled-session
    note: >-
      POST /lessons/{id}/recordings/uploads never looks at cancelled_at (recording-upload.service.ts:53-117,
      recording.repository.ts:445-545), while POST /lessons/{id}/recordings answers 409 LESSON_CANCELLED (recording.repository.ts:895).
      No spec covers an upload on a cancelled session.
    source: apps/tedrisat/src/course/recording.repository.ts:445

  - id: session-cancel-takes-live-sessions-only
    rule: Only a LIVE session can be cancelled, as only LIVE lessons are sessions and only LIVE lessons can be a make-up.
    holds: false
    finding: cancel-no-type-check
    note: >-
      cancelLesson has no lesson-type check, so a VIDEO, DOCUMENT or QUIZ lesson can be cancelled, though it appears nowhere as a
      session (course.repository.ts:1333).
    source: apps/tedrisat/src/course/course.repository.ts:1333

  - id: session-hide-audit-key-is-documented
    rule: The audit action DELETE /lessons/{id} writes is the one its published description names.
    holds: false
    finding: archive-lesson-audit-name
    note: >-
      The route's swagger description says the hide is written "as lesson.hide" (lesson.controller.ts:410); the code writes
      session.hide (entity session, archive/hide-audit.ts) and the e2e spec pins session.hide (week-hide.e2e.spec.ts#5).
    source: apps/tedrisat/src/course/lesson.controller.ts:410

  - id: session-cancelled-message-fits-its-route
    rule: The sentence of a 409 LESSON_CANCELLED says why the route refused.
    holds: false
    finding: lesson-cancelled-text-streams-only
    note: >-
      LessonCancelledError has one message, "Lesson X is cancelled; a cancelled session takes no live stream link", and
      createLessonRecording answers it too. The code is right; the sentence is about streams only.
    source: apps/tedrisat/src/course/errors/lesson-cancelled.error.ts:11

  # Resource files
  - id: resource-link-xor-file
    rule: >-
      A resource is a link or a stored file, never both and never half a file (the CHECKs course_resources_link_or_file and
      lesson_resources_link_or_file; course_resources.url may also be null on legacy rows). A stored file keeps its file on a whole-list
      save and refuses a url (400 RESOURCE_IS_FILE); a new row in a list needs a url (files come only through the upload routes); a
      row left out of a list is deleted and its object queued.
    source: apps/tedrisat/src/database/schema/course.schema.ts:291

  - id: resource-upload-limits
    rule: >-
      One file of at most 25 MB per request. The type is read from the bytes, never the header or the extension: PDF, PNG, JPEG, WebP,
      Word docx, Excel xlsx, PowerPoint pptx or plain UTF-8 text; HTML, SVG and everything else are 415. The stored name is sanitised
      (last path segment, control and bidi characters dropped, <>:"|?* replaced, at most 200 characters, the extension forced to agree
      with the type: ödev.html that is a PDF is stored ödev.html.pdf). The storage key is built by tedrisat from ids and a random uuid
      only, never from user text.
    source: apps/tedrisat/src/storage/upload.ts:147

  - id: resource-upload-leaves-no-orphan
    rule: >-
      An upload reserves its key (a StorageDeletion row due in one hour), stores the object, then records it in a transaction that
      claims the reservation; a failure queues the key at once. Every dropped last reference (a removed resource, a purge, a deleted
      homework file) writes a StorageDeletion row in the same transaction, and a sweep every five minutes and after writes deletes the
      objects, retrying with a backoff of at most six hours. Without storage no sweep runs.
    source: apps/tedrisat/src/storage/upload-store.ts:32

  - id: resource-download-is-content
    rule: >-
      Only content readers download a file, streamed through the API as an attachment with nosniff, no-store and a sandbox CSP; the
      store's address is never sent; a hidden session serves no files; a link is never a download.
    source: apps/tedrisat/src/storage/stored-file.ts:30
