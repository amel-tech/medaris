    route: GET /courses/{id}/resources/{resourceId}/file
    summary: Download a file of the course's resources
    description: >-
      Streamed through tedrisat as an attachment with the recorded content type and the sanitised name (Content-Disposition
      attachment; filename*=...), X-Content-Type-Options nosniff, Cache-Control private, no-store and Content-Security-Policy
      default-src 'none'; sandbox. No store address is ever sent. The read is the course page's (viewDetail), so a hidden course and
