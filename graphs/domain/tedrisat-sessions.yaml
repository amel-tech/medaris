  # ------------------------------------------------------------------------------------------------------------------------
  # Resource files in Bunny Storage (resource-file.controller.ts). The two upload routes carry UploadGateInterceptor and the
  # validation pipe; the order is the guards (@Authz), then the interceptor, then the pipe, then the service. The interceptor
  # answers 503 STORAGE_NOT_CONFIGURED before the body is read and 413 FILE_TOO_LARGE when Content-Length is past 25 MB plus 64 KB
  # without reading it, then parses multipart/form-data with multer: ONE file in memory under the field `file`, 4 fields, 1 KB per
  # field, 6 parts, names read as UTF-8; multer's own size limit is mapped to 413 FILE_TOO_LARGE. Other multer limit violations (a
  # second file, an unexpected field name, too many parts) keep Nest's 400 mapping: NOT VERIFIED which message.
  # ------------------------------------------------------------------------------------------------------------------------
  uploadCourseResourceFile:
    route: POST /courses/{id}/resources/files
    summary: Upload a file as one of the course's resources
    description: >-
      The file is checked by its bytes and size (acceptUpload), stored under a key tedrisat builds
      (<prefix>/courses/<courseId>/resources/<uuid>) and added as the LAST resource. The order is: a StorageDeletion row for the new
      key due in one hour (upload.unclaimed); the object put to Bunny Storage; then one transaction that bumps courses.version
      (unconditionally), inserts the CourseResource row (order_index max+1, url null, sanitised file_name), claims the reservation
      and writes the audit row. On any failure the key is queued for removal at once (upload.failed) and the sweep is kicked. The
      course must be one the caller may write: a müderris does not write to a course the köşk hid.
    needs: course.edit on the course (byExistingCourse; hidden courses count as existing)
    body:
      type: object
      required: [file]
      description: multipart/form-data
      properties:
        file: { type: string, format: binary, description: "at most 25 MB; PDF, PNG, JPEG, WebP, docx, xlsx, pptx or plain UTF-8 text, as read from its bytes" }
        name: { type: string, maxLength: 200, description: "the listed name; the file's own name without its extension when absent or blank" }
        meta: { type: string, maxLength: 120, description: a short line under the name }
    result:
      returns: CourseResource
      status: 201
      type: object
      required: [resource, courseVersion]
      description: the new CourseResource and the course's new version
      properties:
        resource: { type: object, description: "the CourseResource as the course page lists it, with file {name, contentType, sizeBytes, downloadUrl}; downloadUrl is tedrisat's download route for it, a path from the API's root (/courses/<id>/resources/<rid>/file), which needs the caller's own token" }
        courseVersion: { type: integer }
    refusals:
      AUTHZ_FORBIDDEN:
        status: 403
        note: course.edit is not held on the course
        source: libs/common/src/authz/authz.guard.ts:92
      FILE_REQUIRED:
        status: 400
        note: no file part, or an empty one
        source: apps/tedrisat/src/storage/upload.ts:150
      VALIDATION_ERROR:
        status: 400
        note: name or meta longer than their limits
        source: libs/common/src/pipes/validation.pipe.ts:52
      COURSE_NOT_FOUND:
        status: 404
        note: >-
          the id is not a uuid or names no course (resolver); a draft, a hidden course or a course of a hidden köşk to a caller who may
          not write it (getDetail in write mode)
        source: apps/tedrisat/src/course/course.controller.ts:111
      FILE_TOO_LARGE:
        status: 413
        note: more than 25 MB, by the announced length (:120), by multer (:126) or by the buffered size (:151)
        source: apps/tedrisat/src/storage/upload.ts:151
      FILE_TYPE_NOT_ALLOWED:
        status: 415
        note: the bytes are not one of the accepted types (HTML, SVG, a plain ZIP, an executable and a macro-enabled Office file are refused)
        source: apps/tedrisat/src/storage/upload.ts:153
      STORAGE_NOT_CONFIGURED:
        status: 503
        note: the BUNNY_STORAGE_* keys are not set (S17); answered by the interceptor before the body is read
        source: apps/tedrisat/src/storage/object-storage.ts:68
      STORAGE_UNAVAILABLE:
        status: 503
        note: the store did not answer or answered with an error; no resource row is recorded and the key is queued for removal
        source: apps/tedrisat/src/storage/bunny-object-storage.ts:155
    sideEffects:
      - "storage:put (Bunny Storage, the object under the new key)"
      - "audit:resource.file_upload (entity resource; details courseId, name, fileName, contentType, sizeBytes)"
      - "storageDeletions:reserve (the key, due in one hour, claimed by the same transaction that records the row)"
      - "kicks sweepStorageDeletions (only when the upload fails)"
    source: apps/tedrisat/src/course/resource-file.controller.ts:93

