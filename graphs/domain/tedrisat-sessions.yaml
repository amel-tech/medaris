      STORAGE_NOT_CONFIGURED:
        status: 503
        note: the BUNNY_STORAGE_* keys are not set; checked first, before any lookup
        source: apps/tedrisat/src/storage/object-storage.ts:68
      STORAGE_UNAVAILABLE:
        status: 503
        note: the store did not answer or answered with an error
        source: apps/tedrisat/src/storage/bunny-object-storage.ts:163
    sideEffects:
      - "storage:get (Bunny Storage)"
      - "audit:course.content_read (via resource.download; only when the reader is neither a müderris nor an enrolled talebe)"
    source: apps/tedrisat/src/course/resource-file.controller.ts:120

