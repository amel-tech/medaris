    source: apps/tedrisat/src/kosk/kosk.controller.ts:435

  # ---- Köşk administration screens (kosk-admin.controller.ts) ----
  getKoskDirectory:
    route: GET /kosks/directory
    summary: Every köşk for nizam's table, hidden and passive ones too
    needs: "AuthGuard + AuthzGuard: @AuthzExempt; the service decides (scopeOf). Registered before KoskController so that directory is not read as :id"
    description: >-
      The başnazım, or anyone holding any of platform.kosk_create, platform.kosk_edit, platform.kosk_nazim_manage or
      platform.hosting_grant, sees every köşk. A köşk nazım sees only the köşks they manage. Everyone else is refused. Status is derived:
      HIDDEN (archivedAt set) before PASSIVE (passiveSince set) before ACTIVE. Rows are ordered by name, id. since is archivedAt or
      passiveSince; hiddenLevel is archivedLevel, or kosk for a legacy row. courseCount here counts EVERY course of the köşk, hidden and
      draft included, unlike the public courseCount. Each row carries its live nazımları (name and e-mail from users, else from Keycloak)
      and canRestore (the caller's rung on the köşk hide ladder reaches hiddenLevel). counts follow the caller's scope and ignore the
      other filters; fields are the distinct fields of the caller's köşks. The nazım e-mail is personal data.
    query:
      type: object
      properties:
        status: { enum: [ALL, ACTIVE, PASSIVE, HIDDEN], default: ALL }
        level: { enum: [ALL, BEGINNER, INTERMEDIATE, ADVANCED] }
        field: { type: string, maxLength: 100, note: "trimmed and cut to 100" }
        listing: { enum: [ALL, LISTED, UNLISTED], default: ALL }
        q: { type: string, maxLength: 100, note: "matches name, handle or a live nazım's full name, case-insensitively" }
        page: { type: integer, default: 1, minimum: 1 }
        limit: { type: integer, default: 12, minimum: 1, maximum: 50 }
    result:
      status: 200
      type: object
      required: [items, total, page, limit, counts, fields]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid, references: Kosk }
              handle: { type: [string, "null"] }
              name: { type: string }
              coverHue: { type: integer }
              field: { type: [string, "null"] }
              level: { type: [string, "null"] }
              isPrivate: { type: boolean }
              status: { enum: [ACTIVE, PASSIVE, HIDDEN] }
              since: { type: [string, "null"], format: date-time }
              hiddenLevel: { type: [string, "null"], enum: [platform, kosk, madrasah, course, null] }
              canRestore: { type: boolean }
              courseCount: { type: integer, note: "every course, hidden and draft included" }
              nazims:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid, references: User }
                    name: { type: [string, "null"] }
                    email: { type: [string, "null"], sensitivity: personal }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        counts:
          type: object
          properties:
            all: { type: integer }
            active: { type: integer }
            passive: { type: integer }
            hidden: { type: integer }
        fields: { type: array, items: { type: string } }
    refusals:
      AUTHZ_FORBIDDEN: { status: 403, note: "'The köşk table is for the Medaris başnazımı and köşk nazımları': the caller holds none of the four platform codes and manages no köşk", source: apps/tedrisat/src/kosk/kosk-admin.service.ts:203 }
      HTTP_400: { status: 400, note: "status, level or listing is not one of its values, page or limit is not an integer" }
    source: apps/tedrisat/src/kosk/kosk-admin.controller.ts:131

  getKoskOverview:
