  getKoskDashboard:
    route: GET /kosks/{id}/dashboard
    summary: A köşk nazımı's home page in one read
    needs: "AuthGuard + AuthzGuard: @Authz([kosk.manage, platform.kosk_edit], byExistingKosk). The service then cuts what is shown"
    description: >-
      The köşk's nazımları and the başnazım get everything. A Medaris nazımı holding only platform.kosk_edit gets contentLocked true:
      the numbers, with no meeting links, no per-row attendance flags and latestApplications empty (counts.pendingApplications still
      counts). The programme is live (type LIVE) sessions with a time, in PUBLISHED, non-hidden courses, weeks and sessions. counts.courses
      is the non-hidden courses (drafts included); counts.students the distinct ENROLLED users; sessionCounts.upcoming is not cancelled
      and starting in the next 7 days, past is not cancelled and already started, cancelled is cancelled; withoutAccessCount is the
      upcoming ones with no meeting link, no live stream and not in person, firstWithoutAccess the first of them. sessions of the tab:
      UPCOMING soonest first, at most 50; PAST and CANCELLED newest first, at most 20. latestApplications is the 5 newest PENDING
      enrollments, each with canDecide (the caller's effective enrollment.decide on that course; always true for SYSTEM_ADMIN). A
      course in a passive scope is left out of pendingApplications, the session lists and counts and latestApplications unless the caller
      is a live nazım of this köşk or holds platform.inactive_scopes_manage; counts.courses and counts.students still include it (the
      repository applies the passive filter to the other queries only).
    query:
      type: object
      properties:
        sessions: { enum: [UPCOMING, PAST, CANCELLED], default: UPCOMING }
    result:
      status: 200
      type: object
      properties:
        koskId: { type: string, format: uuid, references: Kosk }
        koskName: { type: string }
        greetingName: { type: [string, "null"] }
        counts:
          type: object
          properties:
            courses: { type: integer }
            students: { type: integer }
            upcomingSessions: { type: integer }
            pendingApplications: { type: integer }
        sessionCounts:
          type: object
          properties:
            upcoming: { type: integer }
            past: { type: integer }
            cancelled: { type: integer }
        withoutAccessCount: { type: integer }
        firstWithoutAccess: { type: [object, "null"], note: "a session row as in sessions" }
        tab: { enum: [UPCOMING, PAST, CANCELLED] }
        contentLocked: { type: boolean }
        sessions:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid, references: Lesson }
              courseId: { type: string, format: uuid, references: Course }
              courseTitle: { type: string }
              courseCoverHue: { type: integer }
              weekNumber: { type: integer }
              scheduledAt: { type: string, format: date-time }
              durationMinutes: { type: [integer, "null"] }
              meetingUrl: { type: [string, "null"], note: "absent when contentLocked" }
              inPerson: { type: boolean, note: "absent when contentLocked" }
              hasLiveStream: { type: boolean, note: "absent when contentLocked" }
              withoutAccess: { type: boolean, note: "absent when contentLocked" }
              isMakeup: { type: boolean }
              studentCount: { type: integer }
              cancelled: { type: boolean }
              madrasahName: { type: [string, "null"] }
              muderris: { type: array, items: { type: object, properties: { name: { type: string }, unvan: { type: [string, "null"] }, isImam: { type: boolean } } } }
        latestApplications:
          type: array
          items:
            type: object
            properties:
              userId: { type: string, format: uuid, references: User }
              courseId: { type: string, format: uuid, references: Course }
              courseTitle: { type: string }
              studentName: { type: [string, "null"] }
              studentEmail: { type: [string, "null"], sensitivity: personal }
              requestedAt: { type: string, format: date-time }
              canDecide: { type: boolean }
              scopePassive: { type: boolean }
        muderris:
          type: array
          items:
            type: object
            properties:
              userId: { type: [string, "null"], format: uuid, references: User }
              name: { type: string }
              courseCount: { type: integer }
              studentCount: { type: integer }
              madrasahName: { type: [string, "null"] }
    refusals:
      KOSK_NOT_FOUND: { status: 404, note: "a malformed or unknown id (byExistingKosk, S12); no row (:85)", source: apps/tedrisat/src/kosk/kosk.controller.ts:88 }
      AUTHZ_FORBIDDEN: { status: 403, note: "neither kosk.manage on the köşk nor platform.kosk_edit", source: libs/common/src/authz/authz.guard.ts:92 }
      HTTP_400: { status: 400, note: "sessions is not UPCOMING, PAST or CANCELLED" }
    sideEffects:
      - "audit:course.roster_read (entity kosk, details via kosk-dashboard, courseIds, systemAdmin, permission), on every read that is not contentLocked, even when no applicant is listed"
      - "audit:course.content_read, one per course whose meeting link is handed out, unless the caller is a müderris of that course"
      - "audit:scope.passive_open, one per such course that sits in a passive scope"
      - "the rows are written before the page is returned: a failed write fails the read"
    source: apps/tedrisat/src/kosk/kosk-admin.controller.ts:204

