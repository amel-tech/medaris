      medreses it hosts too), how many have a müderris in the post now, the talebe enrolled and completed, the live sessions in the next
      days, the nazımları who leave, and a 64-character confirmation token bound to those numbers and to the caller. A köşk that is
      passive already answers 200 with alreadyPassive true.
    result:
      status: 200
      type: object
      properties:
        scope: { type: object, properties: { type: { type: string }, id: { type: string, format: uuid, references: Kosk }, name: { type: string } } }
        alreadyPassive: { type: boolean }
        closesContent: { type: boolean }
        staffLeaving: { type: integer }
        courses: { type: object, properties: { total: { type: integer }, published: { type: integer }, draft: { type: integer }, withLiveMuderris: { type: integer }, items: { type: array, items: { type: object } }, truncated: { type: boolean } }, note: "items: the first 50, most enrolled first" }
        students: { type: object, properties: { enrolled: { type: integer }, completed: { type: integer } } }
        sessions: { type: object, properties: { windowDays: { type: integer }, count: { type: integer }, next: { type: array, items: { type: object } } } }
