# Köşk, köşk applications, hosting rights and the Medaris home page: 31 handlers of apps/tedrisat (inventory/domain.md lines 2689-3055).
# kosk.controller.ts 12, kosk-admin.controller.ts 10, kosk-application.controller.ts 1, nizam-kosk-applications.controller.ts 4,
# nizam-dashboard.controller.ts 1, hosting.controller.ts 3. Each `source` is the route decorator line of the handler, read in this
# worktree (stacked on #394). The köşk grants routes (GET|POST /kosks/{id}/grants, PATCH|DELETE /kosks/{id}/grants/{grantId}) and
# GET /kosks/{koskId}/courses (listKoskCourses, in courses) are other chapters' handlers and are not written here.
#
# Reading the refusals:
#   - 401 HTTP_401 (AuthGuard: no bearer token, or one that is not a valid access token; invariant access-token-only) and the 429 of the
#     throttlers (invariant rate-limit-before-auth) are listed on no action. On an @AuthzPublic route only a token that is present and
#     wrong is refused; no token passes.
#   - HTTP_400 is a Nest pipe (ParseUUIDPipe, ParseEnumPipe, ParseIntPipe): body type HTTP_ERROR. VALIDATION_ERROR is a failed DTO.
#   - byExistingKosk (kosk.controller.ts:82) answers 404 KOSK_NOT_FOUND for a malformed or an unknown :id BEFORE the permission is asked,
#     so on those routes a malformed id is a 404 and not a 400, and a caller who may not act learns 404 or 403 by whether the köşk exists.
#   - byParam(KOSK) routes: a malformed id reaches the pipe (400); an unknown uuid is 404 from the role resolver (a caller with no token
#     also gets 404 for an unlisted or hidden köşk, tedrisat-role-resolver.service.ts:160), and for SYSTEM_ADMIN, who bypasses the
#     resolver, from the service.
#   - AUTHZ_FORBIDDEN from the guard is authz.guard.ts:92 ("Caller is not authorized for the requested scope on this resource").
#   - KEYCLOAK_ADMIN_UNAVAILABLE (S6-S8) is real only where written below (assertKnownAccounts): the people-name lookups of the
#     directory, overview, nazım list and Hosting list swallow a directory failure (kosk-admin.service.ts:130-146 and :425-445).
schema: delurio-graph/0
kind: domain
id: medaris.api

actions:
  # ---- Köşk: public reads, discovery, following (kosk.controller.ts) ----
  listKosks:
    route: GET /kosks
    summary: A page of köşks, the list Keşfet and nizam's köşk list read
    needs: "AuthGuard + AuthzGuard: @AuthzPublic, no @Authz (a list has no single resource). No token is let in; managedBy=me needs a token"
    description: >-
      Anyone, token or not. A hidden köşk (archivedAt) is in no list, the manager's own included. Without managedBy=me an unlisted
      (isPrivate) köşk is also in no list, for anyone, the başnazım included. With managedBy=me the list is the köşks where the caller holds
      a live KOSK_NAZIM role (unlisted ones too), and total follows it. madrasahId keeps the köşks where that medrese holds a non-revoked
      hosting right. q: every whitespace-separated word must occur, case-insensitively, in name, handle, description or field, and the
      characters % _ and the backslash are text. Order: featured desc, createdAt desc, id desc. total counts the same filter.
    query:
      type: object
      properties:
        page: { type: integer, default: 1, minimum: 1, note: "a value below 1 becomes 1" }
        limit: { type: integer, default: 12, minimum: 1, maximum: 50, note: "clamped into 1..50" }
        managedBy: { enum: [me] }
        madrasahId: { type: string, format: uuid, references: Madrasah }
        level: { enum: [ALL, BEGINNER, INTERMEDIATE, ADVANCED] }
        field: { type: string, note: "trimmed; an exact match on Kosk.field" }
        q: { type: string, maxLength: 100, note: "cut to 100 characters, not refused" }
    result:
      status: 200
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid, references: Kosk }
              ownerId: { type: [string, "null"], format: uuid, note: "null for a caller with no token" }
              managerIds: { type: array, items: { type: string, format: uuid }, note: "empty for a caller with no token; the live KOSK_NAZIM holders, oldest grant first, for anyone signed in" }
              managerName: { type: [string, "null"], note: "the oldest live nazım's given and family name; shown to everyone" }
              courseCount: { type: integer, note: "PUBLISHED courses that are not hidden; drafts left out" }
              studentCount: { type: integer, note: "distinct users with an enrollment of any status but REVOKED in a non-hidden course" }
              muderrisCount: { type: integer, note: "distinct course_muderris rows of non-hidden courses, drafts included" }
              followerCount: { type: integer }
              isFollowing: { type: boolean, note: "false for a caller with no token" }
            note: "a KoskResponse: every Kosk field (the stored ones) plus the computed fields above"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    refusals:
      AUTHZ_MISSING_USER: { status: 401, note: "managedBy=me with no token", source: apps/tedrisat/src/kosk/kosk.controller.ts:170 }
      HTTP_400: { status: 400, note: "managedBy is not me, level is not one of the four, madrasahId is no uuid, page or limit is not an integer" }
    source: apps/tedrisat/src/kosk/kosk.controller.ts:154

  listKoskFields:
    route: GET /kosks/fields
    summary: The distinct ilim alanı of the listed köşks, the chips of Keşfet
    needs: "AuthGuard + AuthzGuard: @AuthzPublic. No token is let in"
    description: >-
      The distinct, non-empty Kosk.field of the köşks that are listed (not isPrivate) and not hidden, alphabetical. Declared before
      GET /kosks/{id} so that "fields" is not read as an id.
    result:
      status: 200
      type: array
      items: { type: string }
    source: apps/tedrisat/src/kosk/kosk.controller.ts:196

  listFollowedKoskCourses:
    route: GET /kosks/followed/courses
    summary: Published courses of the köşks the caller follows, for Ana sayfa
    needs: "AuthGuard + AuthzGuard: @AuthzExempt. A token is required; rows are chosen by the caller's own sub"
    description: >-
      Courses of the köşks the caller follows that are PUBLISHED and not hidden, whose köşk is neither unlisted nor hidden, and in which
      the caller has no enrollment row at all (any status). Newest first (createdAt desc, id desc). Each carries the first müderris by
      orderIndex with that müderris's unvan, whether they are the course's imam (a held MUDERRIS role with isImam) and how many müderrisler
      the course lists.
    query:
      type: object
      properties:
        limit: { type: integer, default: 4, minimum: 1, maximum: 12, note: "clamped into 1..12" }
    result:
      status: 200
      type: array
      items:
        type: object
        properties:
          id: { type: string, format: uuid, references: Course }
          title: { type: string }
          koskId: { type: string, format: uuid, references: Kosk }
          koskName: { type: string }
          coverHue: { type: integer }
          muderrisName: { type: [string, "null"] }
          muderrisUnvan: { type: [string, "null"], note: "the hoca unvan; null is none, shown as the name and Hoca" }
          muderrisIsImam: { type: boolean }
          muderrisCount: { type: integer }
    refusals:
      HTTP_400: { status: 400, note: "limit is not an integer" }
    source: apps/tedrisat/src/kosk/kosk.controller.ts:218

  getKosk:
    route: GET /kosks/{id}
    summary: One köşk with its numbers
    needs: "AuthGuard + AuthzGuard: @Authz(kosk.view, byParam(KOSK)) + @AuthzPublic. No token is let in for a listed, shown köşk"
    description: >-
      No token: only a listed, shown köşk; a missing, unlisted or hidden one is the same 404. Signed in: any köşk that exists (an unlisted
      köşk opens by its link), except that a hidden köşk opens only for holders of kosk.manage there or platform.kosk_edit (the başnazım by
      bypass); for everyone else it is a 404. The numbers are defined in the result.
    result:
      status: 200
      returns: Kosk
      note: >-
        A KoskResponse: the Kosk fields plus managerIds (live KOSK_NAZIM holders, oldest first), managerName, courseCount (PUBLISHED, not
        hidden), studentCount (distinct users with any enrollment but REVOKED in a non-hidden course), muderrisCount (distinct
        course_muderris rows of non-hidden courses, drafts included), followerCount and isFollowing (false with no token). For a caller
        with no token ownerId is null and managerIds is [] (maskKoskForAnonymous); a signed-in caller gets both.
    refusals:
      KOSK_NOT_FOUND:
        status: 404
        note: >-
          Four ways, one answer: no such köşk (service); a caller with no token and the köşk is unlisted or hidden (role resolver, :160); a
          signed-in caller and an unknown uuid (resolver, :355); a signed-in caller, a hidden köşk and neither kosk.manage nor
          platform.kosk_edit (assertMayOpenHidden)
        source: apps/tedrisat/src/kosk/kosk.controller.ts:247
      HTTP_400: { status: 400, note: "the id is no uuid" }
    source: apps/tedrisat/src/kosk/kosk.controller.ts:261

  listKoskDecks:
    route: GET /kosks/{id}/decks
    summary: The shared decks a köşk offers the people who belong to it
    needs: "AuthGuard + AuthzGuard: @Authz(kosk.view, byExistingKosk), no @AuthzPublic: a token is required"
    description: >-
      Any signed-in caller gets 200. The caller belongs when they hold an ENROLLED or COMPLETED enrollment in a non-hidden course of the
      köşk, are a course_muderris of one of its courses, or manage the köşk. Belonging: accessible true and the köşk's decks that are
      public and not archived, ordered by title. Not belonging (a PENDING applicant, a stranger): accessible false and no decks, never an
      error. A hidden köşk is a 404 to everyone but kosk.manage and platform.kosk_edit holders.
    result:
      status: 200
      type: object
      required: [accessible, decks]
      properties:
        accessible: { type: boolean }
        decks:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid, references: Deck }
              title: { type: string }
              cardCount: { type: integer }
              inCollection: { type: boolean, note: "a decks_users row for the caller" }
    refusals:
      KOSK_NOT_FOUND: { status: 404, note: "a malformed or unknown id (byExistingKosk, shared tag S12), or a hidden köşk to a caller without kosk.manage and platform.kosk_edit (:247)", source: apps/tedrisat/src/kosk/kosk.controller.ts:88 }
    source: apps/tedrisat/src/kosk/kosk.controller.ts:281

  followKosk:
    route: POST /kosks/{id}/follow
    summary: Follow a köşk as the current talebe
    needs: "AuthGuard + AuthzGuard: @Authz(kosk.view, byParam(KOSK)). Any signed-in caller who may see the köşk"
    description: >-
      Inserts the KoskFollower row (userId, koskId) with onConflictDoNothing, so it is idempotent and answers true either way. Only that the
      köşk exists is checked, not that it is shown: see the note.
    result: { status: 201, type: boolean, note: "always true" }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      KOSK_NOT_FOUND: { status: 404, note: "unknown uuid (role resolver for a caller who is not SYSTEM_ADMIN) or no such köşk (service)", source: apps/tedrisat/src/kosk/kosk.service.ts:103 }
      HTTP_400: { status: 400, note: "the id is no uuid" }
    note: >-
      A hidden köşk can be followed by whoever knows its id: the guard's closure covers courses only and the service reads existence
      alone (kosk.service.ts:277). Inventory F-5, not run.
    source: apps/tedrisat/src/kosk/kosk.controller.ts:470

  unfollowKosk:
    route: DELETE /kosks/{id}/follow
    summary: Stop following a köşk
    needs: "AuthGuard + AuthzGuard: @AuthzExempt, on purpose: leaving must not depend on still being allowed in"
    description: Deletes the caller's own KoskFollower row. True when a row was deleted, false when there was none; a missing köşk is simply false.
    result: { status: 200, type: boolean }
    refusals:
      HTTP_401: { status: 401, note: "no token on a route that needs one, or a token that does not verify (AuthGuard, invariant access-token-only): listed because a flow draws what a signed-out caller meets", source: libs/common/src/auth-guard/auth-guard.ts:41 }
      HTTP_400: { status: 400, note: "the id is no uuid" }
    source: apps/tedrisat/src/kosk/kosk.controller.ts:487

  # ---- Köşk: opening, editing, deleting, nazımları (kosk.controller.ts) ----
  createKosk:
    route: POST /kosks
    summary: Open a köşk together with its nazımları
    needs: "AuthGuard + AuthzGuard: @Authz(platform.kosk_create, forNew(KOSK)), asked again by the service. The başnazım, or a Medaris nazımı who was given platform.kosk_create"
    description: >-
      Nobody else (no role default, no relationship); a köşk nazımı cannot open a köşk. One transaction: the Kosk (ownerId = the caller),
      one KOSK_NAZIM RoleAssignment per managerUserIds entry (grantedBy = the caller, no end) and the audit row. The caller is the owner
      and is not made a nazım. Order of the checks: guard, DTO, self-grant, service permission, handle, accounts. Unknown properties
      (verified, featured, rating, ownerId and the rest) are refused, and so is null for a NOT NULL field.
    body:
      type: object
      required: [name, managerUserIds]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        handle: { type: [string, "null"], maxLength: 60 }
        description: { type: [string, "null"], maxLength: 1000 }
        coverHue: { type: integer, minimum: 0, maximum: 360, default: 215, note: "never null" }
        isPrivate: { type: boolean, default: false, note: "false is listed" }
        field: { type: [string, "null"], maxLength: 60 }
        level: { type: [string, "null"], enum: [ALL, BEGINNER, INTERMEDIATE, ADVANCED, null] }
        tags: { type: array, maxItems: 10, uniqueItems: true, items: { type: string, maxLength: 40, pattern: "\\S" }, default: [] }
        alwaysRequireApproval: { type: boolean, default: false }
        recordingsNeverPublic: { type: boolean, default: false }
        managerUserIds: { type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: { type: string, format: uuid, references: User } }
    result:
      status: 201
      returns: Kosk
      note: "re-read as for getKosk, with the caller's isFollowing"
    refusals:
      SELF_GRANT_REFUSED: { status: 403, note: "the caller is among managerUserIds and is not SYSTEM_ADMIN: always refused (always true), whatever they hold; audit permission.self_grant_refused", source: libs/common/src/authz/self-grant.guard.ts:91 }
      AUTHZ_FORBIDDEN: { status: 403, note: "no platform.kosk_create: from the guard first, and again from the service as 'Only the Medaris başnazımı and a Medaris nazımı holding platform.kosk_create may open a köşk with nazımları'", source: apps/tedrisat/src/kosk/kosk-admin.service.ts:117 }
      KOSK_HANDLE_TAKEN: { status: 409, note: "another köşk has the same short name, compared without case and with a leading @ ignored", source: apps/tedrisat/src/kosk/kosk.service.ts:147 }
      KOSK_NAZIM_UNKNOWN_ACCOUNT: { status: 404, note: "an id that is neither in users nor in the realm directory (or the directory is not configured)", source: apps/tedrisat/src/kosk/kosk-admin.service.ts:473 }
      KEYCLOAK_ADMIN_UNAVAILABLE: { status: 503, note: "the realm lookup of an id missing from users failed (S6-S8)", source: apps/tedrisat/src/keycloak-admin/keycloak-admin.service.ts:160 }
      VALIDATION_ERROR: { status: 400, note: "no nazım named, a duplicate or a malformed id, name out of range, a bad level, coverHue or tags, an unknown property, null for a NOT NULL field" }
    sideEffects:
      - audit:kosk.create
      - "one KOSK_NAZIM role assignment per managerUserIds entry, granted by the caller"
      - "audit:permission.self_grant_refused, when the refusal above is given"
      - "Keycloak read: GET /users/<id> for each id with no users row, only when KEYCLOAK_ADMIN_* is set"
    source: apps/tedrisat/src/kosk/kosk.controller.ts:310

  updateKosk:
    route: PATCH /kosks/{id}
    summary: Change a köşk's own fields and policies
    needs: "AuthGuard + AuthzGuard: @Authz([kosk.manage, platform.kosk_edit], byExistingKosk)"
    description: >-
      A nazım of that köşk, a Medaris nazımı holding platform.kosk_edit, or the başnazım. Not another köşk's nazım, not a medrese's
      başmüderris (a medrese has no say over a köşk since MDRS-134). Every field of createKosk is optional except managerUserIds, which is
      not accepted; the nullable columns (handle, description, field, level) take null to clear. A platform policy that is on cannot be
      switched off from below: alwaysRequireApproval false while the platform policy ALWAYS_REQUIRE_APPROVAL is on, or
      recordingsNeverPublic false while RECORDINGS_NEVER_PUBLIC is on, is refused unless the caller is SYSTEM_ADMIN.
    body:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        handle: { type: [string, "null"], maxLength: 60 }
        description: { type: [string, "null"], maxLength: 1000 }
        coverHue: { type: integer, minimum: 0, maximum: 360 }
        isPrivate: { type: boolean }
        field: { type: [string, "null"], maxLength: 60 }
        level: { type: [string, "null"], enum: [ALL, BEGINNER, INTERMEDIATE, ADVANCED, null] }
        tags: { type: array, maxItems: 10, uniqueItems: true, items: { type: string, maxLength: 40, pattern: "\\S" } }
        alwaysRequireApproval: { type: boolean }
        recordingsNeverPublic: { type: boolean }
    result: { status: 200, returns: Kosk, note: "re-read as for getKosk" }
    refusals:
      KOSK_NOT_FOUND: { status: 404, note: "a malformed or unknown id (byExistingKosk, S12); the update matched no row (:238)", source: apps/tedrisat/src/kosk/kosk.controller.ts:88 }
      AUTHZ_FORBIDDEN: { status: 403, note: "neither kosk.manage on the köşk nor platform.kosk_edit", source: libs/common/src/authz/authz.guard.ts:92 }
      KOSK_HANDLE_TAKEN: { status: 409, note: "as createKosk; the köşk's own handle is excepted", source: apps/tedrisat/src/kosk/kosk.service.ts:147 }
      PLATFORM_POLICY_LOCKED: { status: 409, note: "alwaysRequireApproval=false while ALWAYS_REQUIRE_APPROVAL is on, or recordingsNeverPublic=false while RECORDINGS_NEVER_PUBLIC is on; never given to SYSTEM_ADMIN", source: apps/tedrisat/src/platform-policy/platform-policy.service.ts:61 }
      VALIDATION_ERROR: { status: 400, note: "null for a NOT NULL field, an unknown property (managerUserIds among them), a value out of range" }
    sideEffects:
      - "audit:kosk.policy_change, only when the body touches alwaysRequireApproval or recordingsNeverPublic"
    source: apps/tedrisat/src/kosk/kosk.controller.ts:340

  deleteKosk:
    route: DELETE /kosks/{id}
    summary: Delete a köşk for real
    needs: "AuthGuard + AuthzGuard: @Authz(kosk.delete, byExistingKosk). kosk.delete is held by no role, grant or relationship: only SYSTEM_ADMIN, by the realm bypass"
    description: >-
      One transaction (kosk.repository.ts:689): every course of the köşk and all under it (lessons, weeks, recordings, notes, questions,
      submissions and their files, exams, assignments, resources, müderris rows, enrollments, partner links and codes, the courses' role
      rows, queued file deletions), the followers, the köşk's role assignments, the Kosk, and one audit row naming the name, the managers
      and per-table counts. Hosting rights go with the row (cascade). A köşk nazım hides and never deletes.
    result: { status: 200, type: boolean, note: "true" }
    refusals:
      KOSK_NOT_FOUND: { status: 404, note: "a malformed or unknown id (byExistingKosk, S12); the purge found no row (:269)", source: apps/tedrisat/src/kosk/kosk.controller.ts:88 }
      AUTHZ_FORBIDDEN: { status: 403, note: "everyone but SYSTEM_ADMIN, the köşk's owner and its nazımları included", source: libs/common/src/authz/authz.guard.ts:92 }
    sideEffects:
      - audit:kosk.delete
      - "LessonInvitationService.kick: the CANCEL mails of the lost sessions"
      - "StorageDeletionService.kick: the stored files of the köşk's courses go"
    source: apps/tedrisat/src/kosk/kosk.controller.ts:367

  addKoskManager:
    route: POST /kosks/{id}/managers/{userId}
    summary: Seat a person as a nazım of the köşk
    needs: "AuthGuard + AuthzGuard: @Authz(platform.kosk_nazim_manage, byExistingKosk)"
    description: >-
      The başnazım, or a Medaris nazımı holding platform.kosk_nazim_manage. A köşk nazım does not add peers (owner decision d-1004-12,
      MDRS-136). Idempotent: an existing live nazım answers 201 with no write. The target must have a users row (has signed in). Done
      under a NO KEY UPDATE lock of the köşk row so concurrent changes queue. No end date on this route. A lapsed but unrevoked row of
      the same seat is revoked before the new one is inserted. Unlike addKoskNazims it does not clear Kosk.passiveSince.
    result: { status: 201, returns: Kosk, note: "re-read as for getKosk" }
    refusals:
      SELF_GRANT_REFUSED: { status: 403, note: "the caller names themselves into KOSK_NAZIM without holding those codes and is not SYSTEM_ADMIN; audit permission.self_grant_refused", source: libs/common/src/authz/self-grant.guard.ts:91 }
      AUTHZ_FORBIDDEN: { status: 403, note: "no platform.kosk_nazim_manage, a köşk's own nazım included", source: libs/common/src/authz/authz.guard.ts:92 }
      KOSK_NOT_FOUND: { status: 404, note: "a malformed or unknown id (byExistingKosk, S12); the köşk vanished under the lock (:183)", source: apps/tedrisat/src/kosk/kosk.controller.ts:88 }
      KOSK_MANAGER_UNKNOWN_USER: { status: 404, note: "the target has no users row: they never signed in", source: apps/tedrisat/src/kosk/kosk.service.ts:185 }
      HTTP_400: { status: 400, note: "userId is no uuid" }
    sideEffects:
      - "audit:kosk.nazim.add, details authority platform"
      - "audit:permission.self_grant_refused, when the refusal above is given"
    source: apps/tedrisat/src/kosk/kosk.controller.ts:388

  removeKoskManager:
    route: DELETE /kosks/{id}/managers/{userId}
    summary: Take a nazım off the köşk, naming a successor when they are the last
    needs: "AuthGuard + AuthzGuard: @Authz(platform.kosk_nazim_manage, byExistingKosk)"
    description: >-
      The başnazım, or a Medaris nazımı holding platform.kosk_nazim_manage. A köşk nazım cannot remove a peer or resign. Under the köşk
      lock, in order: köşk missing, target not a live nazım, successor equal to the target, no successor and the target the only live
      nazım; with a successor, the successor is seated first (needs a users row; an existing nazım is fine) and then the target's row is
      revoked in the caller's name (revokedAt and revokedBy; never deleted). The başnazım may name themselves as the successor.
    query:
      type: object
      properties:
        successorUserId: { type: string, format: uuid, references: User, note: "who takes the seat when the removed nazım is the last one" }
    result: { status: 200, returns: Kosk, note: "re-read as for getKosk" }
    refusals:
      SELF_GRANT_REFUSED: { status: 403, note: "the successor is the caller, who is not SYSTEM_ADMIN and does not hold the KOSK_NAZIM codes; given before any check of the köşk or the target", source: libs/common/src/authz/self-grant.guard.ts:91 }
      AUTHZ_FORBIDDEN: { status: 403, note: "no platform.kosk_nazim_manage", source: libs/common/src/authz/authz.guard.ts:92 }
      KOSK_NOT_FOUND: { status: 404, note: "a malformed or unknown id (byExistingKosk, S12); the köşk vanished under the lock (:207)", source: apps/tedrisat/src/kosk/kosk.controller.ts:88 }
      KOSK_MANAGER_NOT_FOUND: { status: 404, note: "the target is not a live nazım of the köşk", source: apps/tedrisat/src/kosk/kosk.service.ts:209 }
      KOSK_SUCCESSOR_INVALID: { status: 400, note: "the successor is the nazım being removed", source: apps/tedrisat/src/kosk/kosk.service.ts:215 }
      KOSK_LAST_MANAGER: { status: 409, note: "the target is the only live nazım and no successor was named", source: apps/tedrisat/src/kosk/kosk.service.ts:212 }
      KOSK_MANAGER_UNKNOWN_USER: { status: 404, note: "the successor has no users row", source: apps/tedrisat/src/kosk/kosk.service.ts:218 }
      HTTP_400: { status: 400, note: "userId or successorUserId is no uuid" }
    sideEffects:
      - "audit:kosk.nazim.remove, with successorUserId when one was named"
      - "audit:kosk.nazim.add for the successor, when they were seated"
