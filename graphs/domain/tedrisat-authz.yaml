    note: "Only courses of this köşk with no medrese and not hidden count as medrese-free; a medrese's course is staffed from its own route. The service narrows the guard: SYSTEM_ADMIN gives as the platform (the whole 21-code catalogue); otherwise the caller must hold a KOSK_NAZIM role in this köşk, so a Medaris nazım or anyone merely granted the code passes the guard and is refused here."
    source: apps/tedrisat/src/kosk/kosk-grants.controller.ts:69

