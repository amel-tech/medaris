    route: GET /kosks/{id}/grants
    summary: The köşk's ders nazırları in its medrese-free courses, its courses and the codes the caller may hand out
    needs: "course_nazir.assign_kosk on the köşk (AuthGuard, AuthzGuard, byExistingKosk), then in the service SYSTEM_ADMIN or a held KOSK_NAZIM seat in this köşk"
    result:
      status: 200
      type: object
      required: [items, courses, grantable]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, user, course, permissions, endsAt, grantedBy, grantedAt]
            properties:
              id: { type: string, format: uuid, references: RoleAssignment, note: the ders nazırı post; PATCH and DELETE address it }
              user:
                type: object
                required: [id, name, email]
                properties:
                  id: { type: string, format: uuid, references: User }
                  name: { type: [string, "null"], sensitivity: personal }
                  email: { type: [string, "null"], format: email, sensitivity: personal }
              course:
                type: object
                required: [id, title, madrasahName]
                properties:
                  id: { type: string, format: uuid, references: Course }
                  title: { type: string }
                  madrasahName: { type: [string, "null"], note: null for a medrese-free course; only those take a post on this page }
              permissions: { type: array, items: { type: string } }
              endsAt: { type: [string, "null"], format: date-time }
              grantedBy:
                type: object
                required: [id, name, email]
                properties:
                  id: { type: string, format: uuid, references: User }
                  name: { type: [string, "null"], sensitivity: personal }
                  email: { type: [string, "null"], format: email, sensitivity: personal }
              grantedAt: { type: string, format: date-time }
          note: the posts of the köşk's medrese-free courses, oldest first
        courses:
          type: array
          items:
            type: object
            required: [id, title, madrasahName]
            properties:
              id: { type: string, format: uuid, references: Course }
              title: { type: string }
              madrasahName: { type: [string, "null"], note: null for a medrese-free course; only those take a post on this page }
          note: every course of the köşk that is not hidden
        grantable: { type: array, items: { type: string }, note: the course codes the caller may hand out }
    refusals:
      AUTHZ_FORBIDDEN: { status: 403, note: "the guard (authz.guard.ts:92): the caller does not hold course_nazir.assign_kosk on the köşk; the service: the caller holds the route code but no KOSK_NAZIM seat in this köşk (Only a nazım of the köşk and the başnazım hand out course permissions)", source: apps/tedrisat/src/kosk/kosk-grants.service.ts:77 }
