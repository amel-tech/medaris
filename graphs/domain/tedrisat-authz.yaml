    note: "Unlike createCourseNazir this route has no ban check, no check for another seat over the course and no revocation of an earlier post's leftover grants (see the invariant nazir-post-needs-a-clear-seat). Its ceiling is computed from the role default plus köşk-scope grants, not from the engine's effective codes as the course route does; whether any case differs was not run."
