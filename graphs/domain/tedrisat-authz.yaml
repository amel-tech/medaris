# Roles, grants, groups, nazırs and "what do I hold" (inventory domain.md lines 3389-3798): 36 handlers, 36 actions.
# The handlers, by controller: PermissionAdminController (11: /nizam/permissions, /nizam/medaris-nazims*, /nizam/permission-groups*),
# MeAssignmentsController (5: /me/*), NizamController (1: /nizam/chief-nazim), CourseNazirController (4: /courses/{id}/nazirs*),
# KoskGrantsController (4: /kosks/{id}/grants*), MadrasahNazirController (4: /madrasahs/{id}/nazirs*) and MadrasahPermissionController
# (7: /madrasahs/{id}/permissions, /permission-groups* and /nazirs/{userId}/permissions). Every `source` is the line of the route decorator.
#
# Path parameters are written {id}, as OpenAPI does; the code names them :id. Each action lists its own refusals in full. Left out of every
# action: the 401 of AuthGuard for no token or a token that does not verify (invariant access-token-only), the 429 of the throttler that runs
# before the guards (invariant rate-limit-before-auth) and a 500 for a bug.
# The machine draft attached a 503 KEYCLOAK_ADMIN_UNAVAILABLE to nearly every handler here. It is real only on the three appointment routes that
# call findUnknownAccounts or findById (createCourseNazir, createKoskGrant, addMadrasahNazir); every other route here swallows a directory
# failure and leaves a name null. KEYCLOAK_ADMIN_NOT_CONFIGURED is never answered here: an unconfigured directory skips the realm check.
# Order of refusals on the /nizam routes that carry only AuthGuard: a path parameter that is no uuid (HTTP_400) and a bad body
# (VALIDATION_ERROR) come before the service's own 403, because the SYSTEM_ADMIN check is made inside the service; on the guarded routes
# the guard's 403 and the resolver's 404 come first, and the pipes after.
#
# Names: the controller method, with its resource when the method is generic.
#   PermissionAdminController: catalog -> getPermissionCatalog, list -> listMedarisNazims, appoint -> appointMedarisNazim, setGrants -> setMedarisNazimGrants,
#   given -> getMedarisNazimGiven, dismiss -> dismissMedarisNazim, groups -> listPermissionGroups, createGroup -> createPermissionGroup,
#   updateGroup -> updatePermissionGroup, deleteGroup -> deletePermissionGroup, groupUsers -> listPermissionGroupUsers.
#   MeAssignmentsController: assignmentsOf, roles, grants, permissions, effectivePermissions -> getMyAssignments, getMyRoles, getMyGrants, getMyPermissions,
#   getMyEffectivePermissions. NizamController: chiefNazim -> getChiefNazim.
#   CourseNazirController: list, create, update, revoke -> listCourseNazirs, createCourseNazir, updateCourseNazir, revokeCourseNazir.
#   KoskGrantsController: list, create, update, revoke -> listKoskGrants, createKoskGrant, updateKoskGrant, revokeKoskGrant.
#   MadrasahNazirController: list, addNazir, grants, removeNazir -> listMadrasahNazirs, addMadrasahNazir, getMadrasahNazirGrants, removeMadrasahNazir.
#   MadrasahPermissionController: catalog, groups, createGroup, updateGroup, deleteGroup, nazirPermissions, setNazirPermissions -> getMadrasahPermissionCatalog,
#   listMadrasahPermissionGroups, createMadrasahPermissionGroup, updateMadrasahPermissionGroup, deleteMadrasahPermissionGroup, getMadrasahNazirPermissions,
#   setMadrasahNazirPermissions.
schema: delurio-graph/0
kind: domain
id: medaris.api
actions:
  # ---- the platform: Medaris nazımları and the platform and course permission groups (SYSTEM_ADMIN alone) ----
  getPermissionCatalog:
    route: GET /nizam/permissions
    summary: The permission codes of the platform and of a course, in the sections the nizam screens print
    needs: "SYSTEM_ADMIN alone: AuthGuard, then PermissionAdminService.actor() (the realm role in the token, and a sub that is a uuid); no @Authz"
    result:
      status: 200
      type: object
      required: [platform, course]
      properties:
        platform:
          type: array
          items:
            type: object
            required: [id, permissions]
            properties: { id: { enum: [kosks, madrasahs, requests, bans, audit] }, permissions: { type: array, items: { type: string } } }
          note: the 19 platform codes in five sections
        course: { type: array, items: { type: string }, note: the 21 course codes a course-scoped group may carry }
    refusals:
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller is not SYSTEM_ADMIN, or the token's sub is not a uuid (Only the Medaris başnazımı manages Medaris nazımları and permission groups)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:91 }
    note: "Codes only: the sentence for a code is the web app's (account.permissions.<code>). No database read."
    source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:66

  listMedarisNazims:
    route: GET /nizam/medaris-nazims
    summary: The Medaris nazımları in office, with their groups and single platform permissions
    needs: "SYSTEM_ADMIN alone: AuthGuard, then PermissionAdminService.actor() (the realm role in the token, and a sub that is a uuid); no @Authz"
    result:
      status: 200
      type: array
      items:
        type: object
        required: [user, appointedBy, appointedAt, assignmentExpiresAt, expiresAt, groups, permissions]
        properties:
          user:
            type: object
            required: [id, name, email]
            properties:
              id: { type: string, format: uuid, references: User }
              name: { type: [string, "null"], sensitivity: personal }
              email: { type: [string, "null"], format: email, sensitivity: personal }
          appointedBy:
            type: object
            required: [id, name, email]
            properties:
              id: { type: string, format: uuid, references: User }
              name: { type: [string, "null"], sensitivity: personal }
              email: { type: [string, "null"], format: email, sensitivity: personal }
          appointedAt: { type: string, format: date-time }
          assignmentExpiresAt: { type: [string, "null"], format: date-time, note: the appointment's own end; null while it has none}
          expiresAt:
            type: [string, "null"]
            format: date-time
            note: the earliest end among the appointment and the platform permissions; null when nothing ends
          groups:
            type: array
            items:
              type: object
              required: [id, name, scope, courseTitle, permissions]
              properties:
                id: { type: string, format: uuid, references: PermissionGroup }
                name: { type: string }
                scope: { enum: [PLATFORM, ALL_COURSES, COURSE] }
                courseTitle: { type: [string, "null"] }
                permissions: { type: array, items: { type: string } }
            note: every group held, the platform's and the course-wide ones
          permissions:
            type: array
            items:
              type: object
              required: [code, grantedAt]
              properties: { code: { type: string }, grantedAt: { type: string, format: date-time } }
            note: platform permissions given one by one, not through a group
      note: held appointments only, oldest first; a row whose end has passed is not listed. appointedBy is declared nullable in the DTO but the service always fills it (an unknown person has a null name)
    refusals:
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller is not SYSTEM_ADMIN, or the token's sub is not a uuid (Only the Medaris başnazımı manages Medaris nazımları and permission groups)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:91 }
    note: "Names come from the users table and, for a person who never signed in, from the realm directory (findById); a directory failure leaves the name null and is not an error."
    source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:81

  appointMedarisNazim:
    route: POST /nizam/medaris-nazims
    summary: Appoint a Medaris nazım and give them their platform permissions in the same call
    needs: "SYSTEM_ADMIN alone: AuthGuard, then PermissionAdminService.actor() (the realm role in the token, and a sub that is a uuid); no @Authz"
    body:
      type: object
      required: [userId, permissions]
      additionalProperties: false
      properties:
        userId: { type: string, format: uuid, references: User }
        groupId: { type: [string, "null"], format: uuid, references: PermissionGroup }
        permissions: { type: array, maxItems: 64, items: { type: string } }
        expiresAt: { type: [string, "null"], format: date-time, note: when the appointment and its permissions end; empty means never }
    result:
      status: 201
      type: object
      required: [user, appointedBy, appointedAt, assignmentExpiresAt, expiresAt, groups, permissions]
      properties:
        user:
          type: object
          required: [id, name, email]
          properties:
            id: { type: string, format: uuid, references: User }
            name: { type: [string, "null"], sensitivity: personal }
            email: { type: [string, "null"], format: email, sensitivity: personal }
        appointedBy:
          type: object
          required: [id, name, email]
          properties:
            id: { type: string, format: uuid, references: User }
            name: { type: [string, "null"], sensitivity: personal }
            email: { type: [string, "null"], format: email, sensitivity: personal }
        appointedAt: { type: string, format: date-time }
        assignmentExpiresAt: { type: [string, "null"], format: date-time, note: the appointment's own end; null while it has none}
        expiresAt:
          type: [string, "null"]
          format: date-time
          note: the earliest end among the appointment and the platform permissions; null when nothing ends
        groups:
          type: array
          items:
            type: object
            required: [id, name, scope, courseTitle, permissions]
            properties:
              id: { type: string, format: uuid, references: PermissionGroup }
              name: { type: string }
              scope: { enum: [PLATFORM, ALL_COURSES, COURSE] }
              courseTitle: { type: [string, "null"] }
              permissions: { type: array, items: { type: string } }
          note: every group held, the platform's and the course-wide ones
        permissions:
          type: array
          items: { type: object, required: [code, grantedAt], properties: { code: { type: string }, grantedAt: { type: string, format: date-time } } }
          note: platform permissions given one by one, not through a group
      note: the new row, as listMedarisNazims gives it
    refusals:
      VALIDATION_ERROR: { status: 400, note: "a userId or groupId that is no uuid, more than 64 codes, a non-string code, an expiresAt that is no date string, or an unknown property", source: libs/common/src/pipes/validation.pipe.ts:52 }
      GRANT_EXPIRY_INVALID: { status: 400, note: "expiresAt is not after now (The end date is in the past)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:125 }
      PERMISSION_UNKNOWN: { status: 400, note: "a code outside the platform catalogue (Not in this scope's catalog: ...)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:451 }
      PERMISSION_GROUP_SCOPE_INVALID: { status: 400, note: "the group is not a platform group (Only a group defined for the platform can be given here)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:171 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller is not SYSTEM_ADMIN, or the token's sub is not a uuid (Only the Medaris başnazımı manages Medaris nazımları and permission groups)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:91 }
      PERMISSION_GROUP_NOT_FOUND: { status: 404, note: "no live group with that id", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:169 }
      MEDARIS_NAZIM_ALREADY_APPOINTED: { status: 409, note: "the user already holds a live MEDARIS_NAZIM seat (unique held index role_assignments_held_platform_idx)", source: apps/tedrisat/src/assignment/admin/permission-admin.repository.ts:366 }
    sideEffects:
      - "one transaction: revokes a lapsed but unrevoked MEDARIS_NAZIM seat of the same person, inserts the seat (scope platform, no scope id, granted_by the actor, expires_at = expiresAt)"
      - "revokes what the person still holds from an earlier seat that no seat below the platform covers (revokeOrphanedGrants, anywhere), so it does not come back with the platform seat"
      - "inserts the platform grants: one row per extra code, or one row for the group, authority PLATFORM, ending with the seat; codes the group already carries are not repeated (extrasBeyondGroup)"
      - "audit:medaris_nazim.appoint"
      - "audit:permission.grant when anything is given"
    note: "The account is not checked for existence: there is no directory lookup on this route, so any uuid is appointed (see the invariant medaris-nazim-is-a-known-account). No mail, no notification, no Keycloak read or write."
    source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:96

  setMedarisNazimGrants:
    route: PUT /nizam/medaris-nazims/{userId}/grants
    summary: Replace a Medaris nazım's platform group and single permissions
    needs: "SYSTEM_ADMIN alone: AuthGuard, then PermissionAdminService.actor() (the realm role in the token, and a sub that is a uuid); no @Authz"
    body:
      type: object
      required: [permissions]
      additionalProperties: false
      properties:
        groupId: { type: [string, "null"], format: uuid, references: PermissionGroup }
        permissions: { type: array, maxItems: 64, items: { type: string }, note: the single permissions on top of the group }
        expiresAt:
          type: [string, "null"]
          format: date-time
          note: when the permissions end; empty means when the appointment ends; never after it
    result:
      status: 200
      type: object
      required: [user, appointedBy, appointedAt, assignmentExpiresAt, expiresAt, groups, permissions]
      properties:
        user:
          type: object
          required: [id, name, email]
          properties:
            id: { type: string, format: uuid, references: User }
            name: { type: [string, "null"], sensitivity: personal }
            email: { type: [string, "null"], format: email, sensitivity: personal }
        appointedBy:
          type: object
          required: [id, name, email]
          properties:
            id: { type: string, format: uuid, references: User }
            name: { type: [string, "null"], sensitivity: personal }
            email: { type: [string, "null"], format: email, sensitivity: personal }
        appointedAt: { type: string, format: date-time }
        assignmentExpiresAt: { type: [string, "null"], format: date-time, note: the appointment's own end; null while it has none}
        expiresAt:
          type: [string, "null"]
          format: date-time
          note: the earliest end among the appointment and the platform permissions; null when nothing ends
        groups:
          type: array
          items:
            type: object
            required: [id, name, scope, courseTitle, permissions]
            properties:
              id: { type: string, format: uuid, references: PermissionGroup }
              name: { type: string }
              scope: { enum: [PLATFORM, ALL_COURSES, COURSE] }
              courseTitle: { type: [string, "null"] }
              permissions: { type: array, items: { type: string } }
          note: every group held, the platform's and the course-wide ones
        permissions:
          type: array
          items: { type: object, required: [code, grantedAt], properties: { code: { type: string }, grantedAt: { type: string, format: date-time } } }
          note: platform permissions given one by one, not through a group
      note: the updated row
    refusals:
      HTTP_400: { status: 400, note: "userId in the path is not a uuid (ParseUUIDPipe)" }
      VALIDATION_ERROR: { status: 400, note: "a groupId that is no uuid, more than 64 codes, a non-string code, an expiresAt that is no date string, or an unknown property", source: libs/common/src/pipes/validation.pipe.ts:52 }
      PERMISSION_UNKNOWN: { status: 400, note: "a code outside the platform catalogue", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:451 }
      PERMISSION_GROUP_SCOPE_INVALID: { status: 400, note: "the group is not a platform group", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:171 }
      GRANT_EXPIRY_INVALID: { status: 400, note: "expiresAt is not after now (:417), or is after the appointment's end (:420, after-assignment)", source: apps/tedrisat/src/assignment/admin/permission-admin.repository.ts:417 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller is not SYSTEM_ADMIN, or the token's sub is not a uuid (Only the Medaris başnazımı manages Medaris nazımları and permission groups)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:91 }
      MEDARIS_NAZIM_NOT_FOUND: { status: 404, note: "the user holds no live MEDARIS_NAZIM seat (lockNazimRole)", source: apps/tedrisat/src/assignment/admin/permission-admin.repository.ts:556 }
      PERMISSION_GROUP_NOT_FOUND: { status: 404, note: "no live group with that id", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:169 }
    sideEffects:
      - "one transaction: locks the person's held seat (for update); planGrants diffs the held platform grants against the wanted group and codes: kept rows are untouched (same id, giver and date), others are revoked in the actor's name, kept rows with a different end are re-timed, missing ones are inserted (authority PLATFORM, ending with the appointment unless expiresAt is earlier)"
      - "audit:permission.grant, audit:permission.revoke, audit:permission.retime (each only when something of that kind happened; retime lists the previous ends)"
    note: "No group and no codes empties the person without dismissing them."
    source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:114

  getMedarisNazimGiven:
    route: GET /nizam/medaris-nazims/{userId}/given
    summary: What a Medaris nazım has handed on, the question a dismissal asks
    needs: "SYSTEM_ADMIN alone: AuthGuard, then PermissionAdminService.actor() (the realm role in the token, and a sub that is a uuid); no @Authz"
    result:
      status: 200
      type: array
      items:
        type: object
        required: [kind, id, role, permission, groupName, to, groupPermissions, groupAction, scopeType, scopeName]
        properties:
          kind: { enum: [ROLE, GRANT, GROUP] }
          id: { type: string, format: uuid, note: 'the role row, the grant row or, for a GROUP, the permission group' }
          role: { type: [string, "null"] }
          permission: { type: [string, "null"] }
          groupName: { type: [string, "null"] }
          to:
            type: [object, "null"]
            required: [id, name, email]
            properties:
              id: { type: string, format: uuid, references: User }
              name: { type: [string, "null"], sensitivity: personal }
              email: { type: [string, "null"], format: email, sensitivity: personal }
          groupPermissions: { type: [array, "null"], items: { type: string }, note: the codes a GROUP carries now; null for a role or a grant }
          groupAction: { enum: [create, update, null], note: 'for a GROUP, whether the person defined it or last changed it' }
          scopeType: { type: string }
          scopeName: { type: [string, "null"] }
      note: ROLE and GRANT items are what the person gave that is still held, in any scope, their own self-made rows included (to is the person); GROUP items are the groups they defined or last changed, listed for information, and need no answer
    refusals:
      HTTP_400: { status: 400, note: "userId in the path is not a uuid (ParseUUIDPipe)" }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller is not SYSTEM_ADMIN, or the token's sub is not a uuid (Only the Medaris başnazımı manages Medaris nazımları and permission groups)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:91 }
      MEDARIS_NAZIM_NOT_FOUND: { status: 404, note: "the user holds no live MEDARIS_NAZIM seat", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:188 }
    note: "Reads role_assignments and permission_grants where granted_by is the person and the row is still held, and the groups they touched from the audit rows permission_group.create and permission_group.update (groupsTouchedBy)."
    source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:132

  dismissMedarisNazim:
    route: DELETE /nizam/medaris-nazims/{userId}
    summary: Dismiss a Medaris nazım, answering for everything they handed on
    needs: "SYSTEM_ADMIN alone: AuthGuard, then PermissionAdminService.actor() (the realm role in the token, and a sub that is a uuid); no @Authz"
    body:
      type: object
      required: [decisions]
      additionalProperties: false
      properties:
        decisions:
          type: array
          maxItems: 500
          items:
            type: object
            required: [kind, id, action]
            additionalProperties: false
            properties:
              kind: { enum: [ROLE, GRANT] }
              id: { type: string, format: uuid, note: 'a RoleAssignment id for ROLE, a PermissionGrant id for GRANT' }
              action: { enum: [TAKE_OVER, DROP] }
          note: one per ROLE and GRANT that getMedarisNazimGiven lists as given to someone else, none for anything else and none twice; none for a row the person made for themselves
    result: { status: 204 }
    refusals:
      HTTP_400: { status: 400, note: "userId in the path is not a uuid (ParseUUIDPipe)" }
      VALIDATION_ERROR: { status: 400, note: "a decision of the wrong shape, more than 500 decisions, or an unknown property", source: libs/common/src/pipes/validation.pipe.ts:52 }
      DISMISS_DECISIONS_INCOMPLETE: { status: 400, note: "the decisions are not exactly the set to answer, or a TAKE_OVER names a row the person made for themselves; nothing is written", source: apps/tedrisat/src/assignment/admin/permission-admin.repository.ts:590 }
      DISMISS_TAKE_OVER_WITHOUT_SEAT: { status: 400, note: "a grant answered TAKE_OVER would vanish with the seat dropped beside it", source: apps/tedrisat/src/assignment/admin/permission-admin.repository.ts:649 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller is not SYSTEM_ADMIN, or the token's sub is not a uuid (Only the Medaris başnazımı manages Medaris nazımları and permission groups)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:91 }
      MEDARIS_NAZIM_NOT_FOUND: { status: 404, note: "the user holds no live MEDARIS_NAZIM seat", source: apps/tedrisat/src/assignment/admin/permission-admin.repository.ts:556 }
      DISMISS_SEAT_HANDED_ON: { status: 409, note: "a dropped seat whose holder handed on something still held under it, which no seat of theirs backs any more (Dismiss <ids> first)", source: apps/tedrisat/src/assignment/admin/orphaned-grants.ts:321 }
    sideEffects:
      - "one transaction: locks the seat; for each given row TAKE_OVER sets granted_by to the actor (the right stays, under the başnazım's name) and DROP revokes it; rows the person made for themselves are revoked whatever is sent"
      - "a role dropped also revokes, with revokeOrphanedGrants, whatever its holder was given in that seat's scope tree by anyone, unless another role of theirs below the platform still covers it"
      - "revokes every platform grant of the person and the MEDARIS_NAZIM seat itself"
      - "audit:medaris_nazim.dismiss"
    note: "A DELETE with a body. No notification or mail."
    source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:150

  listPermissionGroups:
    route: GET /nizam/permission-groups
    summary: The live platform groups and course groups, with their codes and how many people hold each
    needs: "SYSTEM_ADMIN alone: AuthGuard, then PermissionAdminService.actor() (the realm role in the token, and a sub that is a uuid); no @Authz"
    result:
      status: 200
      type: array
      items:
        type: object
        required: [id, name, scope, courseId, courseTitle, permissions, userCount]
        properties:
          id: { type: string, format: uuid, references: PermissionGroup }
          name: { type: string }
          scope: { enum: [PLATFORM, ALL_COURSES, COURSE] }
          courseId: { type: [string, "null"], format: uuid, references: Course }
          courseTitle: { type: [string, "null"] }
          permissions: { type: array, items: { type: string } }
          userCount: { type: integer, minimum: 0, note: people who hold the group right now }
      note: oldest first; a medrese's own groups are not listed here
    refusals:
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller is not SYSTEM_ADMIN, or the token's sub is not a uuid (Only the Medaris başnazımı manages Medaris nazımları and permission groups)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:91 }
    source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:170

  createPermissionGroup:
    route: POST /nizam/permission-groups
    summary: Define a platform group or a course group
    needs: "SYSTEM_ADMIN alone: AuthGuard, then PermissionAdminService.actor() (the realm role in the token, and a sub that is a uuid); no @Authz"
    body:
      type: object
      required: [name, scope, permissions]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80, pattern: \S, note: trimmed; must contain a non-space character }
        scope: { enum: [PLATFORM, ALL_COURSES, COURSE] }
        courseId: { type: string, format: uuid, references: Course, note: 'required with scope COURSE, refused with any other' }
        permissions: { type: array, maxItems: 64, items: { type: string } }
    result:
      status: 201
      type: object
      required: [id, name, scope, courseId, courseTitle, permissions, userCount]
      properties:
        id: { type: string, format: uuid, references: PermissionGroup }
        name: { type: string }
        scope: { enum: [PLATFORM, ALL_COURSES, COURSE] }
        courseId: { type: [string, "null"], format: uuid, references: Course }
        courseTitle: { type: [string, "null"] }
        permissions: { type: array, items: { type: string } }
        userCount: { type: integer, minimum: 0, note: people who hold the group right now }
    refusals:
      VALIDATION_ERROR: { status: 400, note: "a blank or over-long name, a scope that is none of the three, a courseId that is no uuid, more than 64 codes, or an unknown property", source: libs/common/src/pipes/validation.pipe.ts:52 }
      PERMISSION_GROUP_EMPTY: { status: 400, note: "no code is left after de-duplication (A group holds at least one permission)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:441 }
      PERMISSION_UNKNOWN: { status: 400, note: "a code outside the scope's catalogue: the platform's 19 for PLATFORM, the course's 21 otherwise", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:451 }
      PERMISSION_GROUP_SCOPE_INVALID: { status: 400, note: "COURSE without a courseId (:333), a courseId that names no course (:336), or a courseId sent with another scope (:340); an unknown scope never gets here, the DTO refuses it first", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:333 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller is not SYSTEM_ADMIN, or the token's sub is not a uuid (Only the Medaris başnazımı manages Medaris nazımları and permission groups)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:91 }
      PERMISSION_GROUP_NAME_TAKEN: { status: 409, note: "another live group has the same name, whatever its case, among the groups with the same scope id (null for the platform and every-course groups); the partial unique index permission_groups_name_idx is the backstop for those, a group of one course has the service check alone", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:345 }
    sideEffects:
      - "inserts the group (name trimmed; scope_type platform for PLATFORM and course for the other two; scope_id the courseId for COURSE, null for ALL_COURSES; created_by the actor) and its de-duplicated items"
      - "audit:permission_group.create (name, scope, authority PLATFORM, codes)"
    source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:185

  updatePermissionGroup:
    route: PUT /nizam/permission-groups/{id}
    summary: Rename a platform or course group or replace its codes
    needs: "SYSTEM_ADMIN alone: AuthGuard, then PermissionAdminService.actor() (the realm role in the token, and a sub that is a uuid); no @Authz"
    body:
      type: object
      required: [name, permissions]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80, pattern: \S }
        permissions: { type: array, maxItems: 64, items: { type: string } }
        usersPolicy: { enum: [keep, revoke], note: required when the codes change and anyone holds the group }
    result:
      status: 200
      type: object
      required: [id, name, scope, courseId, courseTitle, permissions, userCount]
      properties:
        id: { type: string, format: uuid, references: PermissionGroup }
        name: { type: string }
        scope: { enum: [PLATFORM, ALL_COURSES, COURSE] }
        courseId: { type: [string, "null"], format: uuid, references: Course }
        courseTitle: { type: [string, "null"] }
        permissions: { type: array, items: { type: string } }
        userCount: { type: integer, minimum: 0, note: people who hold the group right now }
      note: re-read after the write
    refusals:
      HTTP_400: { status: 400, note: "id in the path is not a uuid (ParseUUIDPipe)" }
      VALIDATION_ERROR: { status: 400, note: "a blank or over-long name, more than 64 codes, a usersPolicy that is neither keep nor revoke, or an unknown property", source: libs/common/src/pipes/validation.pipe.ts:52 }
      PERMISSION_GROUP_EMPTY: { status: 400, note: "no code is left after de-duplication", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:441 }
      PERMISSION_UNKNOWN: { status: 400, note: "a code outside the catalogue of the group's own scope", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:451 }
      USERS_POLICY_REQUIRED: { status: 400, note: "the codes change, people hold the group and no usersPolicy was sent (<n> people use this group); the repository recounts under the group's lock, so a holder who appeared meanwhile counts too", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:371 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller is not SYSTEM_ADMIN, or the token's sub is not a uuid (Only the Medaris başnazımı manages Medaris nazımları and permission groups)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:91 }
      PERMISSION_GROUP_NOT_FOUND: { status: 404, note: "no live group, or the group belongs to a medrese", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:430 }
      PERMISSION_GROUP_NAME_TAKEN: { status: 409, note: "another live group has the name in the same scope id (also the unique violation of the index, read as the same refusal)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:374 }
    sideEffects:
      - "one transaction, group row locked: when the codes change and anyone holds the group every holder is detached from the group row (keep first gives each holder the group's old codes as single permissions in the same scope, with the same end and giver, skipping codes they hold singly already; revoke gives nothing); the holder's group grant is revoked either way, so the new set reaches only whoever is given the group from now on"
      - "replaces the items (delete and insert) only if the set changed; updates the name if it differs"
      - "audit:permission_group.update (name, previousName, scope, authority, permissions, previousPermissions, usersPolicy, affectedUsers, holderIds)"
    source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:204

  deletePermissionGroup:
    route: DELETE /nizam/permission-groups/{id}
    summary: Delete a platform or course group (a soft delete; its name becomes free again)
    needs: "SYSTEM_ADMIN alone: AuthGuard, then PermissionAdminService.actor() (the realm role in the token, and a sub that is a uuid); no @Authz"
    body:
      type: object
      additionalProperties: false
      properties:
        usersPolicy:
          enum: [keep, revoke]
          note: 'required while anyone holds the group: keep turns its codes into single permissions for each holder, revoke takes them away'
      note: a DELETE with a body, which may be left out when nobody holds the group
    result: { status: 204 }
    refusals:
      HTTP_400: { status: 400, note: "id in the path is not a uuid (ParseUUIDPipe)" }
      VALIDATION_ERROR: { status: 400, note: "a usersPolicy that is neither keep nor revoke, or an unknown property", source: libs/common/src/pipes/validation.pipe.ts:52 }
      USERS_POLICY_REQUIRED: { status: 400, note: "people hold the group and no usersPolicy was sent", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:393 }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller is not SYSTEM_ADMIN, or the token's sub is not a uuid (Only the Medaris başnazımı manages Medaris nazımları and permission groups)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:91 }
      PERMISSION_GROUP_NOT_FOUND: { status: 404, note: "no live platform or course group with that id", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:430 }
    sideEffects:
      - "detaches every holder as updatePermissionGroup does, then sets permission_groups.deleted_at"
      - "audit:permission_group.delete (name, scope, authority, permissions, usersPolicy, affectedUsers, holderIds)"
    source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:223

  listPermissionGroupUsers:
    route: GET /nizam/permission-groups/{id}/users
    summary: The people who hold a platform or course group right now
    needs: "SYSTEM_ADMIN alone: AuthGuard, then PermissionAdminService.actor() (the realm role in the token, and a sub that is a uuid); no @Authz"
    result:
      status: 200
      type: array
      items:
        type: object
        required: [userId, name, email, isMedarisNazim, expiresAt]
        properties:
          userId: { type: string, format: uuid, references: User }
          name: { type: [string, "null"], sensitivity: personal }
          email: { type: [string, "null"], format: email, sensitivity: personal }
          isMedarisNazim: { type: boolean, note: holds the MEDARIS_NAZIM seat right now }
          expiresAt: { type: [string, "null"], format: date-time }
    refusals:
      HTTP_400: { status: 400, note: "id in the path is not a uuid (ParseUUIDPipe)" }
      AUTHZ_FORBIDDEN: { status: 403, note: "the caller is not SYSTEM_ADMIN, or the token's sub is not a uuid (Only the Medaris başnazımı manages Medaris nazımları and permission groups)", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:91 }
      PERMISSION_GROUP_NOT_FOUND: { status: 404, note: "no live platform or course group with that id", source: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:430 }
    note: "Names are best effort, from users and then the realm directory; no 503."
    source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:240

  # ---- what the caller holds (every signed-in caller; every route answers about the caller only) ----
  getMyAssignments:
    route: GET /me/assignments
    summary: The roles the caller holds, each with its scope
    needs: "a signed-in caller: AuthGuard only, no @Authz; every route answers about the caller's own rows"
    result:
      status: 200
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            type: object
            required: [id, role, scopeType, scopeId, scopeName, isImam, grantedAt, expiresAt, grantedBy, grantedBySelf]
            properties:
              id: { type: string, format: uuid, references: RoleAssignment }
              role: { enum: [MEDARIS_NAZIM, KOSK_NAZIM, MEDRESE_BASMUDERRIS, MEDRESE_NAZIR, MUDERRIS, DERS_NAZIR] }
              scopeType: { enum: [platform, kosk, madrasah, course] }
              scopeId: { type: [string, "null"], format: uuid, note: 'null for the platform; a köşk, a medrese or a course by scopeType' }
              scopeName: { type: [string, "null"] }
              isImam: { type: boolean, note: the course's imam; MUDERRIS only}
              grantedAt: { type: string, format: date-time }
              expiresAt: { type: [string, "null"], format: date-time }
              grantedBy:
                type: object
                required: [id, displayName]
                properties: { id: { type: string, format: uuid, references: User }, displayName: { type: [string, "null"], sensitivity: personal } }
              grantedBySelf: { type: boolean, note: the caller gave this role to themselves }
              course:
                type: object
                note: present only when the scope is a course
                required: [status, hidden, koskId, koskName, madrasahId, madrasahName, studentCount, muderrisCount]
                properties:
                  status: { enum: [DRAFT, PUBLISHED] }
                  hidden: { type: boolean, note: hidden (archived) by its köşk's manager}
                  koskId: { type: string, format: uuid, references: Kosk }
                  koskName: { type: string }
                  madrasahId: { type: [string, "null"], format: uuid, references: Madrasah }
                  madrasahName: { type: [string, "null"] }
                  studentCount: { type: integer, minimum: 0, note: talebe currently enrolled }
                  muderrisCount: { type: integer, minimum: 0 }
      note: 'held rows only: not revoked and not past their end, against the database clock; a role whose scope row no longer exists is left out (scopeExists)'
    note: "A token whose sub is not a uuid holds nothing: the answer is an empty list (userIdOf)."
    source: apps/tedrisat/src/assignment/me-assignments.controller.ts:40

  getMyRoles:
    route: GET /me/roles
    summary: Which roles the caller holds and in how many scopes
    needs: "a signed-in caller: AuthGuard only, no @Authz; every route answers about the caller's own rows"
    result:
      status: 200
      type: object
      required: [systemAdmin, roles]
      properties:
        systemAdmin: { type: boolean, note: the SYSTEM_ADMIN realm role in the token }
        roles:
          type: array
          items:
            type: object
            required: [role, scopeCount]
            properties:
              role: { enum: [MEDARIS_NAZIM, KOSK_NAZIM, MEDRESE_BASMUDERRIS, MEDRESE_NAZIR, MUDERRIS, DERS_NAZIR] }
              scopeCount: { type: integer, minimum: 1, note: in how many scopes the role is held }
      note: counted from the held assignments
    source: apps/tedrisat/src/assignment/me-assignments.controller.ts:52

  getMyGrants:
    route: GET /me/grants
    summary: The permissions and permission groups given to the caller
    needs: "a signed-in caller: AuthGuard only, no @Authz; every route answers about the caller's own rows"
    result:
      status: 200
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items:
            type: object
            required: [id, scopeType, scopeId, scopeName, permission, group, grantedAt, expiresAt, grantedBy, grantedBySelf]
            properties:
              id: { type: string, format: uuid, references: PermissionGrant }
              scopeType: { enum: [platform, kosk, madrasah, course] }
              scopeId: { type: [string, "null"], format: uuid, note: 'null means the platform, or every course' }
              scopeName: { type: [string, "null"] }
              permission: { type: [string, "null"], note: a catalogue code; null when the grant is a group }
              group:
                type: [object, "null"]
                required: [id, name, permissions]
                properties:
                  id: { type: string, format: uuid, references: PermissionGroup }
                  name: { type: string }
                  permissions: { type: array, items: { type: string } }
              grantedAt: { type: string, format: date-time }
              expiresAt: { type: [string, "null"], format: date-time }
              grantedBy:
                type: object
                required: [id, displayName]
                properties: { id: { type: string, format: uuid, references: User }, displayName: { type: [string, "null"], sensitivity: personal } }
              grantedBySelf: { type: boolean }
      note: held rows only; exactly one of permission and group is set on each; a grant whose scope row no longer exists is left out
    source: apps/tedrisat/src/assignment/me-assignments.controller.ts:62

  getMyPermissions:
    route: GET /me/permissions
    summary: Every permission code the caller holds in any scope
    needs: "a signed-in caller: AuthGuard only, no @Authz; every route answers about the caller's own rows"
    result:
      status: 200
      type: object
      required: [permissions]
      properties: { permissions: { type: array, items: { type: string } } }
      note: the union of every code of getMyEffectivePermissions, flattened
    source: apps/tedrisat/src/assignment/me-assignments.controller.ts:72

  getMyEffectivePermissions:
    route: GET /me/effective-permissions
    summary: The caller's permissions by role and scope, as the engine decides them
    needs: "a signed-in caller: AuthGuard only, no @Authz; every route answers about the caller's own rows"
    result:
      status: 200
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [role, scopeType, scopes, permissions]
            properties:
              role:
                enum: [MEDARIS_NAZIM, KOSK_NAZIM, MEDRESE_BASMUDERRIS, MEDRESE_NAZIR, MUDERRIS, DERS_NAZIR, null]
                note: null for scopes where the caller holds a grant but no role
              scopeType: { enum: [platform, kosk, madrasah, course] }
              scopes:
                type: array
                items:
                  type: object
                  required: [type, id, name]
                  properties:
                    type: { enum: [platform, kosk, madrasah, course] }
                    id: { type: [string, "null"], format: uuid }
                    name: { type: [string, "null"] }
                note: scopes held under the same role with the same lines are one group
              permissions: { type: array, items: { type: string }, note: 'listed catalogue codes only, in catalogue order' }
      note: scopes held under the same role with the same lines are one group (a müderris of four courses reads as one set); a course that went passive is a group of its own; the köşk nazım's course work is not repeated line by line under its köşk
    note: "For each scope a held role or grant names, one AuthzService.effective(user, scope, {acrossCourses: true}) call, the engine's own computation (role defaults with nesting, grants a role still covers, policies, passive scopes), so this screen and a request cannot disagree. A scope gone between the two reads holds nothing (NotFoundError swallowed)."
    source: apps/tedrisat/src/assignment/me-assignments.controller.ts:86

  getChiefNazim:
    route: GET /nizam/chief-nazim
    summary: The name of the Medaris başnazım, for the no-access screen
    needs: "a signed-in caller: AuthGuard only (NizamController), no @Authz; the no-access screen names whom to ask"
    result:
      status: 200
      type: object
      required: [displayName]
      properties:
        displayName:
          type: [string, "null"]
          sensitivity: personal
          note: the first holder of the SYSTEM_ADMIN realm role, as given and family name, else the e-mail; null when nobody holds it, the directory is not configured or it does not answer
    sideEffects:
      - "reads the realm directory (findByRealmRole SYSTEM_ADMIN, first holder), cached in the process for 5 minutes (CHIEF_CACHE_MS)"
    note: "A directory failure is not an error here: the name is null."
    source: apps/tedrisat/src/assignment/nizam.controller.ts:26

  # ---- the ders nazırları of one course (nazar's "Ders nazırları") ----
  listCourseNazirs:
    route: GET /courses/{id}/nazirs
    summary: A course's ders nazırları and what the caller may do with them
    needs: "course_nazir.assign on the course (AuthGuard, AuthzGuard, byExistingCourse): the müderris, the başmüderris and the köşk nazım of its place, SYSTEM_ADMIN, and anyone granted the code; the service then decides the caller's standing (giver, appointer or outside)"
    result:
      status: 200
      type: object
      required: [course, items, catalog, grantable, mayAppoint]
      properties:
        course:
          type: object
          required: [id, title, madrasahName]
          properties:
            id: { type: string, format: uuid, references: Course }
            title: { type: string }
            madrasahName: { type: [string, "null"], note: the medrese the course is the work of; null for a köşk's own}
        items:
          type: array
          items:
            type: object
            required: [id, user, permissions, endsAt, grantedBy, grantedAt, mayEdit, mayEnd]
            properties:
              id: { type: string, format: uuid, references: RoleAssignment, note: the ders nazırı post; PATCH and DELETE address it }
              user:
                type: object
                required: [id, name, email]
                properties:
                  id: { type: string, format: uuid, references: User }
                  name: { type: [string, "null"], sensitivity: personal }
                  email: { type: [string, "null"], format: email, sensitivity: personal }
              permissions: { type: array, items: { type: string }, note: 'the course codes the person holds in the course now, in catalogue order' }
              endsAt:
                type: [string, "null"]
                format: date-time
                note: when the post and its permissions end, at the same instant; null until they are taken away
              grantedBy:
                type: object
                required: [id, name, email]
                properties:
                  id: { type: string, format: uuid, references: User }
                  name: { type: [string, "null"], sensitivity: personal }
                  email: { type: [string, "null"], format: email, sensitivity: personal }
              grantedAt: { type: string, format: date-time }
              mayEdit: { type: boolean, note: 'the caller is a giver, and not on their own post unless SYSTEM_ADMIN' }
              mayEnd: { type: boolean, note: a giver ends any post; an appointer only the ones they appointed }
          note: oldest post first
        catalog: { type: array, items: { type: string }, note: 'the 21 course codes, in the order the dialog draws them' }
        grantable:
          type: array
          items: { type: string }
          note: the codes the caller may hand out here; empty for an appointer or for a caller who stands outside
        mayAppoint: { type: boolean, note: 'not outside, and the course is not hidden' }
    refusals:
      AUTHZ_FORBIDDEN: { status: 403, note: "AuthzGuard: the caller does not hold course_nazir.assign on the course", source: libs/common/src/authz/authz.guard.ts:92 }
      COURSE_NOT_FOUND: { status: 404, note: "a malformed or unknown id (the resolver), a course of a hidden köşk, or a hidden course or a draft that this caller may not see (getDetail)", source: apps/tedrisat/src/course/course.controller.ts:111 }
    note: "Passing the route is not enough: the standing decides what the caller may do. A giver holds permission.grant through a role (MUDERRIS at course level, MEDRESE_BASMUDERRIS at medrese level, KOSK_NAZIM at köşk level, the last not in a medrese course) or is SYSTEM_ADMIN (platform level). An appointer holds course_nazir.assign by a grant only. Outside means the course is not theirs to staff (the köşk nazım in a medrese course). See the invariant course-nazir-standing."
    source: apps/tedrisat/src/course/nazir/course-nazir.controller.ts:71

  createCourseNazir:
    route: POST /courses/{id}/nazirs
    summary: Make someone the course's ders nazırı, with permissions the caller holds themselves
    needs: "course_nazir.assign on the course (AuthGuard, AuthzGuard, byExistingCourse): the müderris, the başmüderris and the köşk nazım of its place, SYSTEM_ADMIN, and anyone granted the code; the service then decides the caller's standing (giver, appointer or outside); a giver appoints and gives, an appointer appoints with no permissions; never for oneself (SYSTEM_ADMIN excepted)"
    body:
      type: object
      required: [userId, permissions]
      additionalProperties: false
      properties:
        userId: { type: string, format: uuid, references: User }
        permissions: { type: array, maxItems: 40, items: { type: string }, note: course codes; empty appoints with no permission }
        endsAt: { type: string, format: date-time, note: the post and its permissions end together; omitted means until taken away }
    result:
      status: 201
      type: object
      required: [course, items, catalog, grantable, mayAppoint]
      properties:
        course:
          type: object
          required: [id, title, madrasahName]
          properties:
            id: { type: string, format: uuid, references: Course }
            title: { type: string }
            madrasahName: { type: [string, "null"], note: the medrese the course is the work of; null for a köşk's own}
        items:
          type: array
          items:
            type: object
            required: [id, user, permissions, endsAt, grantedBy, grantedAt, mayEdit, mayEnd]
            properties:
              id: { type: string, format: uuid, references: RoleAssignment, note: the ders nazırı post; PATCH and DELETE address it }
              user:
                type: object
                required: [id, name, email]
                properties:
                  id: { type: string, format: uuid, references: User }
                  name: { type: [string, "null"], sensitivity: personal }
                  email: { type: [string, "null"], format: email, sensitivity: personal }
              permissions: { type: array, items: { type: string }, note: 'the course codes the person holds in the course now, in catalogue order' }
              endsAt:
                type: [string, "null"]
                format: date-time
                note: when the post and its permissions end, at the same instant; null until they are taken away
              grantedBy:
                type: object
                required: [id, name, email]
                properties:
                  id: { type: string, format: uuid, references: User }
                  name: { type: [string, "null"], sensitivity: personal }
                  email: { type: [string, "null"], format: email, sensitivity: personal }
              grantedAt: { type: string, format: date-time }
              mayEdit: { type: boolean, note: 'the caller is a giver, and not on their own post unless SYSTEM_ADMIN' }
              mayEnd: { type: boolean, note: a giver ends any post; an appointer only the ones they appointed }
          note: oldest post first
        catalog: { type: array, items: { type: string }, note: 'the 21 course codes, in the order the dialog draws them' }
        grantable:
          type: array
          items: { type: string }
          note: the codes the caller may hand out here; empty for an appointer or for a caller who stands outside
        mayAppoint: { type: boolean, note: 'not outside, and the course is not hidden' }
      note: the list as it is now
    refusals:
      VALIDATION_ERROR: { status: 400, note: "more than 40 codes, a userId that is no uuid, an endsAt that is not an ISO 8601 date-time, or an unknown property", source: libs/common/src/pipes/validation.pipe.ts:52 }
      GRANT_COURSE_INVALID: { status: 400, note: "the course is hidden (Course <id> is hidden), also when it was hidden while the request was on its way (:181)", source: apps/tedrisat/src/course/nazir/course-nazir.service.ts:198 }
      GRANT_EXPIRY_INVALID: { status: 400, note: "endsAt is not an instant (ISO basic format, \"20261231\", passes the DTO and is no Date) at :183, or is in the past at :186", source: apps/tedrisat/src/course/nazir/course-nazir.service.ts:183 }
      PERMISSION_UNKNOWN: { status: 400, note: "a code outside the 21 course codes", source: apps/tedrisat/src/course/nazir/course-nazir.service.ts:212 }
      AUTHZ_FORBIDDEN: { status: 403, note: "AuthzGuard: the caller does not hold course_nazir.assign on the course", source: libs/common/src/authz/authz.guard.ts:92 }
      GRANT_EXCEEDS_GIVER: { status: 403, note: "a catalogue code the giver does not hold in this course now (You do not hold: <codes>)", source: apps/tedrisat/src/course/nazir/course-nazir.service.ts:216 }
      PERMISSION_NOT_GIVABLE: { status: 403, note: "the caller stands outside (In a medrese course its own staff appoint ders nazırları, :206), or is an appointer who sent a code (Holding course_nazir.assign by a grant appoints; it gives nothing, :214)", source: apps/tedrisat/src/course/nazir/course-nazir.service.ts:206 }
      SELF_GRANT_REFUSED: { status: 403, note: "userId is the caller (always, whatever they hold); SYSTEM_ADMIN is never asked", source: libs/common/src/authz/self-grant.guard.ts:91 }
      COURSE_NOT_FOUND: { status: 404, note: "a malformed or unknown id (the resolver), a course of a hidden köşk, or a hidden course or a draft that this caller may not see (getDetail)", source: apps/tedrisat/src/course/course.controller.ts:111 }
      COURSE_NAZIR_UNKNOWN_ACCOUNT: { status: 404, note: "no users row and not in the realm", source: apps/tedrisat/src/course/nazir/course-nazir.service.ts:220 }
      COURSE_NAZIR_BARRED: { status: 409, note: "an open ban bars the account from the course, its köşk or its medrese; a post would undo the ban", source: apps/tedrisat/src/course/nazir/course-nazir.service.ts:224 }
      COURSE_NAZIR_EXISTS: { status: 409, note: "the person already holds a ders nazırı post in this course", source: apps/tedrisat/src/course/nazir/course-nazir.repository.ts:200 }
      COURSE_NAZIR_HOLDS_SEAT: { status: 409, note: "another held seat already speaks for the person over the course: a role at the course, its köşk, its medrese or the platform", source: apps/tedrisat/src/course/nazir/course-nazir.repository.ts:232 }
      KEYCLOAK_ADMIN_UNAVAILABLE: { status: 503, note: "the user directory did not answer (a transport error, a non-2xx answer or an unreadable body, each with a 5 s timeout); the check on the account does not swallow it, so a real person is never told they do not exist", source: apps/tedrisat/src/keycloak-admin/keycloak-admin.service.ts:160 }
    sideEffects:
      - "one transaction: locks the course row (not hidden); revokes a lapsed but unrevoked post and every earlier grant the person still held in this course, so an old post's leftovers do not count again"
      - "inserts the DERS_NAZIR role (scope course, granted_by the actor, expires_at = endsAt) and one permission_grants row per code (scope course, authority = the giver's level, same end)"
      - "audit:course_nazir.assign (via course, postId, userId, permissions, endsAt, standing, authority, revokedLeftovers, revokedLapsedPosts)"
      - "audit:permission.self_grant_refused when the caller names themselves (written even though nothing changes)"
      - "reads the realm directory (findUnknownAccounts) and the bans (isBarred)"
    note: "The ceiling is the catalogue codes the giver holds in this course now (authz.effective), so a policy, a passive course or a medrese course cuts what they give as it cuts what they do; SYSTEM_ADMIN gives all 21; an appointer gives none. No mail, no notification."
    source: apps/tedrisat/src/course/nazir/course-nazir.controller.ts:97

  updateCourseNazir:
    route: PATCH /courses/{id}/nazirs/{postId}
    summary: Replace a ders nazırı's whole set of permissions and their end
    needs: "course_nazir.assign on the course (AuthGuard, AuthzGuard, byExistingCourse): the müderris, the başmüderris and the köşk nazım of its place, SYSTEM_ADMIN, and anyone granted the code; the service then decides the caller's standing (giver, appointer or outside); a giver only, and a giver may not edit their own post (SYSTEM_ADMIN may)"
    body:
      type: object
      required: [permissions, endsAt]
      additionalProperties: false
      properties:
        permissions: { type: array, maxItems: 40, items: { type: string }, note: the whole set the person holds from now on }
        endsAt:
          type: [string, "null"]
          format: date-time
          note: 'required: null means until taken away; an edit that leaves it out cannot lift an end by accident'
    result:
      status: 200
      type: object
      required: [course, items, catalog, grantable, mayAppoint]
      properties:
        course:
          type: object
          required: [id, title, madrasahName]
          properties:
            id: { type: string, format: uuid, references: Course }
            title: { type: string }
            madrasahName: { type: [string, "null"], note: the medrese the course is the work of; null for a köşk's own}
        items:
          type: array
          items:
            type: object
            required: [id, user, permissions, endsAt, grantedBy, grantedAt, mayEdit, mayEnd]
            properties:
              id: { type: string, format: uuid, references: RoleAssignment, note: the ders nazırı post; PATCH and DELETE address it }
              user:
                type: object
                required: [id, name, email]
                properties:
                  id: { type: string, format: uuid, references: User }
                  name: { type: [string, "null"], sensitivity: personal }
                  email: { type: [string, "null"], format: email, sensitivity: personal }
              permissions: { type: array, items: { type: string }, note: 'the course codes the person holds in the course now, in catalogue order' }
              endsAt:
                type: [string, "null"]
                format: date-time
                note: when the post and its permissions end, at the same instant; null until they are taken away
              grantedBy:
                type: object
                required: [id, name, email]
                properties:
                  id: { type: string, format: uuid, references: User }
                  name: { type: [string, "null"], sensitivity: personal }
                  email: { type: [string, "null"], format: email, sensitivity: personal }
              grantedAt: { type: string, format: date-time }
              mayEdit: { type: boolean, note: 'the caller is a giver, and not on their own post unless SYSTEM_ADMIN' }
              mayEnd: { type: boolean, note: a giver ends any post; an appointer only the ones they appointed }
          note: oldest post first
        catalog: { type: array, items: { type: string }, note: 'the 21 course codes, in the order the dialog draws them' }
        grantable:
          type: array
          items: { type: string }
          note: the codes the caller may hand out here; empty for an appointer or for a caller who stands outside
        mayAppoint: { type: boolean, note: 'not outside, and the course is not hidden' }
    refusals:
      HTTP_400: { status: 400, note: "postId in the path is not a uuid (ParseUUIDPipe)" }
      VALIDATION_ERROR: { status: 400, note: "endsAt missing, more than 40 codes, an endsAt that is not an ISO 8601 date-time, or an unknown property", source: libs/common/src/pipes/validation.pipe.ts:52 }
      GRANT_EXPIRY_INVALID: { status: 400, note: "endsAt is not an instant (:183) or is in the past (:186)", source: apps/tedrisat/src/course/nazir/course-nazir.service.ts:183 }
      PERMISSION_UNKNOWN: { status: 400, note: "a code outside the 21 course codes", source: apps/tedrisat/src/course/nazir/course-nazir.service.ts:251 }
      AUTHZ_FORBIDDEN: { status: 403, note: "AuthzGuard: the caller does not hold course_nazir.assign on the course", source: libs/common/src/authz/authz.guard.ts:92 }
      GRANT_EXCEEDS_GIVER: { status: 403, note: "a code given or moved later that the caller does not hold; dropping a code or an earlier end gives nothing and is not held to the ceiling", source: apps/tedrisat/src/course/nazir/course-nazir.service.ts:262 }
      PERMISSION_NOT_GIVABLE: { status: 403, note: "the caller is not a giver: an appointer (APPOINTS_ONLY) or one who stands outside (MEDRESE_STAFF_APPOINT)", source: apps/tedrisat/src/course/nazir/course-nazir.service.ts:245 }
      SELF_GRANT_REFUSED: { status: 403, note: "the post is the caller's own: a giver does not rewrite their own post; SYSTEM_ADMIN is never asked", source: libs/common/src/authz/self-grant.guard.ts:91 }
      COURSE_NOT_FOUND: { status: 404, note: "a malformed or unknown id (the resolver), a course of a hidden köşk, or a hidden course or a draft that this caller may not see (getDetail)", source: apps/tedrisat/src/course/course.controller.ts:111 }
      COURSE_NAZIR_NOT_FOUND: { status: 404, note: "no held post with that id in this course", source: apps/tedrisat/src/course/nazir/course-nazir.repository.ts:146 }
    sideEffects:
      - "one transaction: locks the post; planPostGrants replaces its set: what stays keeps its giver and date, the rest is revoked, shortened, lengthened or added; the post's expires_at moves with the permissions"
      - "a row given from above the caller is never lengthened: the extra time is a row of the caller's own beside it, its authority capped to what the caller holds (tavan kazanır)"
      - "audit:course_nazir.update (via course, postId, userId, permissions, endsAt, previousEndsAt, authority, revoked, shortened, extended, inserted)"
      - "audit:permission.self_grant_refused when the post is the caller's own"
    note: "planPostGrants was read from its comment and the e2e titles (course-nazirs.e2e#9), not traced line by line."
    source: apps/tedrisat/src/course/nazir/course-nazir.controller.ts:126

  revokeCourseNazir:
    route: DELETE /courses/{id}/nazirs/{postId}
    summary: Take a ders nazırı's post and every permission they hold in the course away
    needs: "course_nazir.assign on the course (AuthGuard, AuthzGuard, byExistingCourse): the müderris, the başmüderris and the köşk nazım of its place, SYSTEM_ADMIN, and anyone granted the code; the service then decides the caller's standing (giver, appointer or outside); a giver ends any post, an appointer only the posts they appointed, never for one who stands outside"
    result: { status: 204 }
    refusals:
      HTTP_400: { status: 400, note: "postId in the path is not a uuid (ParseUUIDPipe)" }
      AUTHZ_FORBIDDEN: { status: 403, note: "AuthzGuard: the caller does not hold course_nazir.assign on the course", source: libs/common/src/authz/authz.guard.ts:92 }
      PERMISSION_NOT_GIVABLE: { status: 403, note: "the caller stands outside (In a medrese course its own staff appoint ders nazırları)", source: apps/tedrisat/src/course/nazir/course-nazir.service.ts:281 }
      NAZIR_NOT_APPOINTED_BY_YOU: { status: 403, note: "an appointer ending a post someone else made (You may dismiss only the nazırs you appointed)", source: apps/tedrisat/src/course/nazir/course-nazir.repository.ts:462 }
      COURSE_NOT_FOUND: { status: 404, note: "a malformed or unknown id (the resolver), a course of a hidden köşk, or a hidden course or a draft that this caller may not see (getDetail)", source: apps/tedrisat/src/course/course.controller.ts:111 }
      COURSE_NAZIR_NOT_FOUND: { status: 404, note: "no held post with that id in this course", source: apps/tedrisat/src/course/nazir/course-nazir.repository.ts:146 }
      DISMISS_SEAT_HANDED_ON: { status: 409, note: "someone the person appointed still holds their post (Dismiss <ids> first)", source: apps/tedrisat/src/assignment/admin/orphaned-grants.ts:321 }
    sideEffects:
      - "one transaction: revokes the post (role_assignments) and every permission the person holds in the course (permission_grants), the rows kept as history; assertNothingLeftUnder"
      - "audit:course_nazir.revoke (via course, postId, userId, grantIds)"
    source: apps/tedrisat/src/course/nazir/course-nazir.controller.ts:159

  # ---- the köşk's İzinler page: ders nazırları of its medrese-free courses (nizam) ----
