    source: apps/tedrisat/src/online-exam/exam-results.controller.ts:74
    needs: exam.prepare on the exam's course
    result:
      status: 200
      type: object
      description: "the talebe's name, state and how it ended, score, switches with their times, zeroth answer, and each question in the exam's order with its options, the correct ones, the talebe's choice, skipped or blank, and the points earned"
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }
      ATTEMPT_NOT_FOUND: { status: 404, source: apps/tedrisat/src/online-exam/errors/exam-results.errors.ts:17, note: "no seat or no attempt of this exam" }
      EXAM_NOT_FOUND: { status: 404, source: apps/tedrisat/src/online-exam/errors/online-exam.errors.ts:145 }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92 }

  # ----- the zeroth question ------------------------------------------------------------------------------------------------------

  getMadrasahZerothQuestion:
    summary: The medrese's zeroth question, in Medrese ayarları
    route: GET /madrasahs/{id}/exam-zeroth-question
    source: apps/tedrisat/src/online-exam/zeroth-question.controller.ts:70
    needs: madrasah.settings_edit on the medrese
    result: { status: 200, note: "{ text, options } or null" }
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92 }

  saveMadrasahZerothQuestion:
    summary: Save the medrese's zeroth question
    route: PUT /madrasahs/{id}/exam-zeroth-question
    source: apps/tedrisat/src/online-exam/zeroth-question.controller.ts:89
    needs: madrasah.settings_edit on the medrese
    body:
      type: object
      additionalProperties: false
      required: [text, options]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }
        options: { type: array, minItems: 2, maxItems: 10, items: { type: string, minLength: 1, maxLength: 300 } }
    result: { status: 200 }
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92 }
      VALIDATION_ERROR: { status: 400, note: "fewer than two options, more than ten, or two the same" }
    sideEffects:
      - "audit:madrasah.zeroth_question.update, unless nothing changed; reaches only exams published after it"

  getCourseZerothQuestion:
    summary: Which zeroth question a course's exams ask
    route: GET /courses/{id}/exam-zeroth-question
    source: apps/tedrisat/src/online-exam/zeroth-question.controller.ts:112
    needs: exam.prepare on the course
    result: { status: 200, note: "{ own, madrasah, applies: COURSE | MADRASAH | NONE, inMadrasah }" }
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92 }

  saveCourseZerothQuestion:
    summary: Bu ders için değiştir
    route: PUT /courses/{id}/exam-zeroth-question
    source: apps/tedrisat/src/online-exam/zeroth-question.controller.ts:132
    needs: exam.prepare on the course (my choice, #421)
    body:
      type: object
      additionalProperties: false
      required: [text, options]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }
        options: { type: array, minItems: 2, maxItems: 10, items: { type: string, minLength: 1, maxLength: 300 } }
    result: { status: 200 }
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92 }
      VALIDATION_ERROR: { status: 400 }
    sideEffects:
      - "audit row, unless nothing changed; reaches only exams published after it"

  removeCourseZerothQuestion:
    summary: Medresenin sorusuna dön
    route: DELETE /courses/{id}/exam-zeroth-question
    source: apps/tedrisat/src/online-exam/zeroth-question.controller.ts:155
    needs: exam.prepare on the course
    result: { status: 200 }
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92 }

  listZerothAnswerCounts:
    summary: Sıfırıncı soru cevapları, Medaris management's aggregate in nizam
    route: GET /nizam/exam-zeroth-answers
    source: apps/tedrisat/src/online-exam/zeroth-answers.controller.ts:53
    needs: exam.zeroth_read in the platform scope, or in a köşk (narrowed to it); the başnazım by bypass
    query:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        koskId: { type: string, format: uuid }
        madrasahId: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
    result: { status: 200, note: "each distinct question (its words and options letter for letter) with how many exams asked it, how many talebe answered, and the exact count per option; no name and no user id" }
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }
      AUTHZ_FORBIDDEN: { status: 403, note: "no exam.zeroth_read, or a köşk filter outside the caller's köşk" }
      VALIDATION_ERROR: { status: 400, note: "a range whose start is after its end" }
    sideEffects:
      - "audit:exam.zeroth_read"

  getZerothQuestionExams:
    summary: One zeroth question's exams
    route: GET /nizam/exam-zeroth-answers/{questionKey}
    source: apps/tedrisat/src/online-exam/zeroth-answers.controller.ts:74
    needs: as listZerothAnswerCounts
    result: { status: 200, note: "the exams that asked it, with course, köşk, date and the exact count per option" }
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }
      AUTHZ_FORBIDDEN: { status: 403, note: "as listZerothAnswerCounts" }
      ZEROTH_QUESTION_NOT_FOUND: { status: 404, source: apps/tedrisat/src/online-exam/errors/zeroth-answers.errors.ts:5 }
    sideEffects:
      - "audit:exam.zeroth_read"

invariants:
  - id: online-exam-points-total-100
    rule: >-
      The points of an online exam's questions total 100: each question's own points, and an equal, exact share of what is left for the
      questions that have none. An exam whose points do not total 100 is not published (POINTS).
    holds: true
    source: apps/tedrisat/src/online-exam/domain/online-exam.ts:204

  - id: online-exam-length-required
    rule: An online exam is published only with a length; a new draft has none (NO_DURATION).
    holds: true
    source: apps/tedrisat/src/online-exam/domain/online-exam.ts:210

  - id: online-exam-order-is-the-talebe-s-own
    rule: >-
      Every attempt has an order of questions, and of each question's options, drawn for it alone when it starts; a resumed attempt
      keeps its order.
    holds: true
    source: apps/tedrisat/src/database/schema/exam-attempt.schema.ts:42

  - id: online-exam-correct-options-stay-hidden
    rule: >-
      No answer to a talebe says which options are correct, or how many, before the exam has closed for everyone and its results are
      released.
    holds: true
    source: apps/tedrisat/src/online-exam/my-exams.service.ts

  - id: online-exam-taken-once
    rule: A talebe has at most one attempt of an exam; a finished attempt is not started again (EXAM_ALREADY_TAKEN).
    holds: true
    source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:46

  - id: online-exam-fixed-once-published
    rule: >-
      A published exam's questions, options, points, topics, settings and zeroth question do not change (EXAM_LOCKED); it is taken back
      to a draft only until it opens.
    holds: true
    source: apps/tedrisat/src/online-exam/errors/online-exam.errors.ts:27

  - id: online-exam-clock-runs-connected
    rule: >-
      An attempt's time is used only while the page that holds it calls; the time lost to a dropped connection is not counted.
    holds: true
    source: apps/tedrisat/src/online-exam/exam-attempt.service.ts:548
    note: "The owner: \"talebeye güvenilecek burada, böyle bi yolla kandırırsa Allah Teâlâ'ya hesap verir\"."

  - id: zeroth-answers-never-traced
    rule: An aggregate of the zeroth answers never carries a name, a user id or a single answer. Its counts are exact.
    holds: true
    source: apps/tedrisat/src/online-exam/zeroth-answers.service.ts
