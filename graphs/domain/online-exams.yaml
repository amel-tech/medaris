# Online multiple-choice exams (MDRS-299): the third format of an exam celse, built in apps/tedrisat/src/online-exam (PRs #408 to #431,
# merged on 22 November 2026). Written graph-first on 21 November 2026 as planned-exams.yaml; rewritten from the code the same week, so
# every entity and action below names its code, and the two that are not built yet say `planned`.
#
# The owner's words this API carries (each quoted where he gave it; a rule with no quote is a choice made in the code, said as such):
#   - "Celsesiz taslak" (22 Nov, asked how a draft and its celse relate): a draft has no celse; publishing makes the celse, of format
#     MULTIPLE_CHOICE, and taking it back to a draft deletes that celse.
#   - The length: "sınav süresinin varsayılanı olmasın, zorunlu olsun ama boş kalsın o olmadan sınav yayına alınamasın" (22 Nov). A new
#     draft has no length, and publishing refuses one without it (NO_DURATION).
#   - The late window: "'sınava en geç başlama saati' de defaultta 10 dakika sonra olacak" (22 Nov, relayed from the medrese) and
#     "belki 10 dk değil 20 dk seçecek hoca, bunun da mümkün olması gerekmez mi sence" (22 Nov). Publishing takes the window in minutes
#     from the start it sets (latestStartMinutes, 10 when left out); a talebe starts until then and always gets the whole length.
#   - The zeroth question: madrasah-wide, "şu an vize dönemindeyiz, soruyu her sınavda aynı soralım, finalde de soruyu değiştiririz her
#     dersin sınavında o yeni soru sorulur" (22 Nov, relayed), and per course, "ders özelinde sıfırıncı soru mümkün olsun, medreseninki
#     default olur ders özelinde değişebilir" (22 Nov). Publishing copies the course's own question, else the medrese's, into the exam.
#     The hadith stays as written, with no source line ("Böyle kalsın", "Hayır", 22 Nov).
#   - Tab switches: "tab değiştirme meselesinde sıfırlanıp baştan başlamayacak, sadece tab değişikliğini sayacağız" (22 Nov, relayed).
#     A switch is counted with its time; the page counts another window taking the focus as well, from two seconds (my choice, #425).
#   - Check boxes: "doğru cevaplardan herhangi birini işaretlemesi de yeterli olsun puanı tam alması için" (22 Nov): ANY_CORRECT, beside
#     ALL_OR_NOTHING and IN_SHARES. That a wrong mark gives no points under ANY_CORRECT is my choice, so that marking every box never pays.
#   - Topic numbers: "Konuların konu numarası da olsun ismi ile beraber, hoca aramadan direk konunun numarasını girebilsin kolayca"; and
#     "konu silebilmek de lazım sadece ekleme var" (22 Nov). A topic that questions use is not deleted (my choice).
#   - Results: those who prepare the exam see them, "görebilsin, soruları hazırlayanlar için değerli olabilir sonraki hazırlamada" (22
#     Nov); each talebe's answers too, "talebeye tıklayıp hangi soruya ne cevap verdiğini ayrıca görebilmek lazım" (22 Nov). The release
#     stays with the existing releaseExamResults.
#   - The talebe's rank: "sınava şu kadar kişi girdi, senin puanın şu, bu kadar kişiden şu sıradasınız … aynı şekilde konu başına da bu
#     sıralama olsun. eşit puan alanlar 'şu sıradasınız şu kadar kişi sizinle aynı puanı aldı' görsün" (22 Nov). Competition ranking
#     (1, 2, 2, 4) and counting only finished attempts are my choices.
#   - The zeroth answers' aggregate shows exact counts: "ben böyle bi karar vermedim, saçma bu zaten neden gizleyeyim tabi ki görünecek"
#     (22 Nov). The first draft hid counts under five and called that his rule; it was not, and #427 removed it.
#   - The clock stops while the connection is lost: "talebeye güvenilecek burada, böyle bi yolla kandırırsa Allah Teâlâ'ya hesap verir"
#     (21 Nov).
#
# Who may call what:
#   - a talebe through course.view on the exam's course and an ENROLLED seat of their own (getMyExamResult also takes a COMPLETED
#     seat); listMyExams needs only a token and reads the caller's own seats;
#   - the course team with exam.prepare on the course (a hoca holds it as every course code; a ders nazırı by grant);
#   - the medrese's zeroth question with madrasah.settings_edit; the aggregate with exam.zeroth_read (a Medaris nazımı by grant in the
#     platform scope, a köşk nazımı in their köşk, the başnazım by bypass).
#
# Not built: copying an earlier exam of the course (copyOnlineExam), the team's Sınavlarım across courses (listMyTeachingExams), a
# preview of the exam as the talebe sees it, and changing a scheduled exam in place (today it is taken back to a draft and published
# again).
schema: delurio-graph/0
kind: domain
id: medaris.api

entities:
  CourseTopic: # one topic of a course's exams: a number and a short name, kept by the course and picked by its exams and questions
    source: apps/tedrisat/src/database/schema/online-exam.schema.ts:32
    key: [id]
    required: [id, courseId, number, name, nameKey, createdAt, updatedAt]
    fields:
      id: { type: string, format: uuid }
      courseId: { type: string, format: uuid, references: Course }
      number: { type: integer, minimum: 1, maximum: 999, note: "shown before the name (\"3. Kıyas\") and typed to pick it; unique in the course; a new topic takes the next free number unless one is given" }
      name: { type: string, minLength: 1, maxLength: 60, note: "one to three words (TOPIC_TOO_LONG past three)" }
      nameKey: { type: string, note: "the name in Turkish lower case; unique in the course, so İcma and icma are one topic" }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }

  OnlineExam: # an online exam of a course: a draft with no celse, then published with the celse it makes
    source: apps/tedrisat/src/database/schema/online-exam.schema.ts:71
    key: [id]
    required: [id, courseId, title, version, createdBy, createdAt, updatedAt]
    fields:
      id: { type: string, format: uuid }
      courseId: { type: string, format: uuid, references: Course }
      lessonId: { type: [string, "null"], format: uuid, unique: true, references: Lesson, note: "null while a draft; the celse publishing made, whose scheduledAt is the earliest start and whose LessonExam has format MULTIPLE_CHOICE and maxScore 100" }
      title: { type: string, minLength: 1, maxLength: 200 }
      durationMinutes: { type: [integer, "null"], minimum: 1, maximum: 2147483647, note: "no default and no upper bound; null until the team types it, and publishing refuses an exam without it (NO_DURATION, the owner 22 Nov)" }
      instructions: { type: [string, "null"], maxLength: 4000, note: "the team's own words, read in the briefing" }
      zerothQuestion: { type: [string, "null"], note: "the course's or the medrese's zeroth question as publishing copied it; a later change to theirs does not reach it" }
      latestStartAt: { type: [string, "null"], format: date-time, note: "set at publish: the start plus latestStartMinutes (10 when left out)" }
      publishedAt: { type: [string, "null"], format: date-time, note: "null while a draft" }
      closedEarlyAt: { type: [string, "null"], format: date-time, note: "set by closeOnlineExamEarly" }
      version: { type: integer, minimum: 1, maximum: 2147483647, note: "bumped by every write of the exam, its questions, its points and a topic delete that changes its pick; a write naming an older one is EXAM_STALE, and every write's answer carries the new one" }
      createdBy: { type: string, format: uuid, note: "Keycloak sub" }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
    lifecycle:
      - "none -> draft: createOnlineExam, a title only"
      - "draft -> scheduled | open: publishOnlineExam (later, or now); the celse and its LessonExam are made, the zeroth question copied"
      - "scheduled -> draft: unpublishOnlineExam until it opens; the celse is deleted"
      - "open -> closed: the late window has passed and no attempt runs, or closeOnlineExamEarly"

  ExamTopic: # a topic an exam has picked from its course's list
    source: apps/tedrisat/src/database/schema/online-exam.schema.ts:109
    key: [examId, topicId]
    required: [examId, topicId, position]
    fields:
      examId: { type: string, format: uuid, references: OnlineExam }
      topicId: { type: string, format: uuid, references: CourseTopic }
      position: { type: integer, minimum: 0 }

  ZerothOption: # one option of the exam's copy of the zeroth question: none is correct and none carries points
    source: apps/tedrisat/src/database/schema/online-exam.schema.ts:130
    key: [id]
    required: [id, examId, position, text]
    fields:
      id: { type: string, format: uuid }
      examId: { type: string, format: uuid, references: OnlineExam }
      position: { type: integer, minimum: 0 }
      text: { type: string, minLength: 1, maxLength: 300 }

  ExamQuestion: # one multiple-choice question of an exam
    source: apps/tedrisat/src/database/schema/online-exam.schema.ts:150
    key: [id]
    required: [id, examId, position, text, answerMode, createdAt, updatedAt]
    fields:
      id: { type: string, format: uuid }
      examId: { type: string, format: uuid, references: OnlineExam }
      position: { type: integer, minimum: 0 }
      text: { type: string, maxLength: 4000, note: "empty while the question is incomplete" }
      answerMode: { enum: [SINGLE, MULTIPLE], note: "SINGLE: one choice, and any correct option gets the points; MULTIPLE: check boxes" }
      scoring: { enum: [ALL_OR_NOTHING, IN_SHARES, ANY_CORRECT, "null"], note: "MULTIPLE only, with two correct options or more (QUESTION_MODE_INVALID otherwise); ANY_CORRECT: one correct mark and no wrong one is the whole points" }
      ownPoints: { type: [integer, "null"], minimum: 1, maximum: 10000, note: "hundredths; null takes an equal, exact share of what the own points leave of 100" }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }

  ExamQuestionTopic: # a topic a question carries
    source: apps/tedrisat/src/database/schema/online-exam.schema.ts:185
    key: [questionId, topicId]
    required: [questionId, topicId]
    fields:
      questionId: { type: string, format: uuid, references: ExamQuestion }
      topicId: { type: string, format: uuid, references: CourseTopic }

  ExamOption: # one option of a question
    source: apps/tedrisat/src/database/schema/online-exam.schema.ts:202
    key: [id]
    required: [id, questionId, position, text, correct]
    fields:
      id: { type: string, format: uuid }
      questionId: { type: string, format: uuid, references: ExamQuestion }
      position: { type: integer, minimum: 0 }
      text: { type: string, minLength: 1, maxLength: 1000 }
      correct: { type: boolean, note: "never sent to a talebe before the exam has closed for everyone and its results are released" }

  MadrasahZerothQuestion: # the medrese's zeroth question, edited in Medrese ayarları: every course's default
    source: apps/tedrisat/src/database/schema/online-exam.schema.ts:225
    key: [madrasahId]
    required: [madrasahId, text, updatedAt, updatedBy]
    fields:
      madrasahId: { type: string, format: uuid, references: Madrasah }
      text: { type: string, minLength: 1, maxLength: 1000 }
      updatedAt: { type: string, format: date-time }
      updatedBy: { type: string, format: uuid }

  MadrasahZerothOption: # one option of the medrese's zeroth question
    source: apps/tedrisat/src/database/schema/online-exam.schema.ts:237
    key: [id]
    required: [id, madrasahId, position, text]
    fields:
      id: { type: string, format: uuid }
      madrasahId: { type: string, format: uuid, references: MadrasahZerothQuestion }
      position: { type: integer, minimum: 0 }
      text: { type: string, minLength: 1, maxLength: 300, note: "2 to 10 options, each different (my choice, #411)" }

  CourseZerothQuestion: # a course's own zeroth question, over the medrese's; a köşk-only course needs it to publish
    source: apps/tedrisat/src/database/schema/online-exam.schema.ts:267
    key: [courseId]
    required: [courseId, text, updatedAt, updatedBy]
    fields:
      courseId: { type: string, format: uuid, references: Course }
      text: { type: string, minLength: 1, maxLength: 1000 }
      updatedAt: { type: string, format: date-time }
      updatedBy: { type: string, format: uuid }

  CourseZerothOption: # one option of a course's own zeroth question
    source: apps/tedrisat/src/database/schema/online-exam.schema.ts:279
    key: [id]
    required: [id, courseId, position, text]
    fields:
      id: { type: string, format: uuid }
      courseId: { type: string, format: uuid, references: CourseZerothQuestion }
      position: { type: integer, minimum: 0 }
      text: { type: string, minLength: 1, maxLength: 300 }

  ExamAttempt: # one talebe's sitting of an exam: their order, where they are, the time used and how it ended
    source: apps/tedrisat/src/database/schema/exam-attempt.schema.ts:42
    key: [id]
    required: [id, examId, userId, questionOrder, optionOrder, usedSeconds, holderId, lastSeq, switches, startedAt]
    fields:
      id: { type: string, format: uuid }
      examId: { type: string, format: uuid, references: OnlineExam, note: "one attempt per talebe and exam" }
      userId: { type: string, format: uuid, sensitivity: personal }
      questionOrder: { type: array, items: { type: string, format: uuid }, note: "drawn for this talebe when the attempt starts" }
      optionOrder: { type: object, note: "each question's options in this talebe's order" }
      currentQuestionId: { type: [string, "null"], format: uuid }
      usedSeconds: { type: integer, minimum: 0, note: "counted only while the holding page calls (tickExamClock), at most 90 s a call; a lost connection uses none" }
      countedAt: { type: [string, "null"], format: date-time }
      holderId: { type: string, note: "the page that holds it; another tab or device takes it over with resumeExamAttempt" }
      lastSeq: { type: integer, minimum: 0, note: "the highest page count written; a save at or under it writes nothing; 0 again at every resume" }
      switches: { type: integer, minimum: 0 }
      startedAt: { type: string, format: date-time }
      finishedAt: { type: [string, "null"], format: date-time }
      finishedBy: { enum: [TALEBE, TIME, CLOSED_EARLY, "null"] }
      scoreHundredths: { type: [integer, "null"], note: "set when it ends; also written to the celse's ExamResult (rounded half up), unless the team entered one by hand" }

  ExamAnswer: # a talebe's answer to one question, saved when it is chosen
    source: apps/tedrisat/src/database/schema/exam-attempt.schema.ts:83
    key: [attemptId, questionId]
    required: [attemptId, questionId, optionIds, skipped, savedAt]
    fields:
      attemptId: { type: string, format: uuid, references: ExamAttempt }
      questionId: { type: string, format: uuid, references: ExamQuestion }
      optionIds: { type: array, items: { type: string, format: uuid } }
      skipped: { type: boolean }
      savedAt: { type: string, format: date-time }

  ZerothAnswer: # a talebe's answer to an exam's zeroth question, given on the briefing
    source: apps/tedrisat/src/database/schema/exam-attempt.schema.ts:109
    key: [examId, userId]
    required: [examId, userId, optionId, answeredAt]
    fields:
      examId: { type: string, format: uuid, references: OnlineExam }
      userId: { type: string, format: uuid, sensitivity: personal }
      optionId: { type: string, format: uuid, references: ZerothOption }
      answeredAt: { type: string, format: date-time }

  TabSwitch: # a switch to another tab or window during an attempt, kept with its time for the team
    source: apps/tedrisat/src/database/schema/exam-attempt.schema.ts:134
    key: [id]
    required: [id, attemptId, at]
    fields:
      id: { type: string, format: uuid }
      attemptId: { type: string, format: uuid, references: ExamAttempt }
      at: { type: string, format: date-time }

actions:
  # ----- the talebe ---------------------------------------------------------------------------------------------------------------

  listMyExams:
    summary: Sınavlarım, the talebe's exams across their courses
    route: GET /me/exams
    source: apps/tedrisat/src/online-exam/my-exams.controller.ts:46
    needs: a token; the caller's own ENROLLED and COMPLETED seats (no AuthzGuard, scoped to the caller in the query, as Programım)
    result:
      status: 200
      type: array
      description: "each exam of every format with where it stands for the caller (UPCOMING, OPEN, IN_PROGRESS, TAKEN, RELEASED, MISSED), its course, lesson, times and length; a score only once released"
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }

  getExamBriefing:
    summary: What the talebe reads before the exam, and where their attempt stands
    route: GET /lessons/{id}/online-exam
    source: apps/tedrisat/src/online-exam/exam-attempt.controller.ts:75
    needs: course.view on the lesson's course (resolver byLessonCourse) and an ENROLLED seat of the caller's own
    result:
      status: 200
      type: object
      required: [lessonId, courseId, title, courseTitle, durationMinutes, questionCount, startsAt, latestStartAt, window, zeroth, attempt]
      properties:
        title: { type: string }
        courseTitle: { type: string }
        durationMinutes: { type: integer }
        questionCount: { type: integer }
        startsAt: { type: string, format: date-time }
        latestStartAt: { type: string, format: date-time }
        instructions: { type: [string, "null"] }
        window: { enum: [BEFORE, OPEN, CLOSED] }
        zeroth: { type: object, description: "{ question, options: [{ id, text }], answeredOptionId }" }
        attempt: { type: [object, "null"], description: "{ status, finishedAt, finishedBy } of the caller's attempt" }
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }
      EXAM_NOT_FOUND: { status: 404, source: apps/tedrisat/src/online-exam/errors/online-exam.errors.ts:145, note: "the celse is no published online exam, or the caller holds no ENROLLED seat in its course" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92, note: "the caller lacks course.view on the course" }

  answerZerothQuestion:
    summary: Answer the zeroth question
    route: PUT /lessons/{id}/online-exam/zeroth-answer
    source: apps/tedrisat/src/online-exam/exam-attempt.controller.ts:97
    needs: as getExamBriefing; the exam is open and the caller has not started it
    body:
      type: object
      additionalProperties: false
      required: [optionId]
      properties:
        optionId: { type: string, format: uuid }
    result: { status: 200, returns: ZerothAnswer }
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }
      EXAM_NOT_OPEN: { status: 409, source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:12, note: "before the start or after the late window" }
      ZEROTH_ANSWER_LOCKED: { status: 409, source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:116, note: "the attempt has started; the answer is kept as it was (my choice, #416)" }
      ZEROTH_OPTION_NOT_FOUND: { status: 400, source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:34, note: "not an option of this exam's zeroth question" }
      EXAM_NOT_FOUND: { status: 404, note: "as getExamBriefing" }
      VALIDATION_ERROR: { status: 400, note: "optionId missing or not a uuid" }
    sideEffects:
      - "upserts the caller's ZerothAnswer"

  startExamAttempt:
    summary: Sınava başla
    route: POST /lessons/{id}/online-exam/attempt
    source: apps/tedrisat/src/online-exam/exam-attempt.controller.ts:120
    needs: as getExamBriefing; the zeroth question answered; between the start and the late window
    body:
      type: object
      additionalProperties: false
      required: [holderId]
      properties:
        holderId: { type: string, minLength: 8, maxLength: 64, description: "the page's own id, kept in the tab (sessionStorage)" }
    result: { status: 201, returns: ExamAttempt, note: "the questions and options in the caller's order, never which are correct; each question's points and mode; the seconds left" }
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }
      ZEROTH_UNANSWERED: { status: 409, source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:22 }
      EXAM_NOT_OPEN: { status: 409, source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:12 }
      EXAM_ALREADY_TAKEN: { status: 409, source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:46, note: "the caller's attempt has ended; an exam is taken once" }
      EXAM_NOT_FOUND: { status: 404, note: "as getExamBriefing" }
      VALIDATION_ERROR: { status: 400, note: "holderId missing or out of bounds" }
    sideEffects:
      - "creates the caller's ExamAttempt with its drawn order; an attempt in progress is taken over as resumeExamAttempt does"

  resumeExamAttempt:
    summary: Go on with an attempt in progress, here
    route: POST /lessons/{id}/online-exam/attempt/resume
    source: apps/tedrisat/src/online-exam/exam-attempt.controller.ts:141
    needs: as getExamBriefing; an attempt of the caller's in progress
    body:
      type: object
      additionalProperties: false
      required: [holderId]
      properties:
        holderId: { type: string, minLength: 8, maxLength: 64 }
    result: { status: 200, returns: ExamAttempt, note: "with the answers saved so far and the question the talebe was on; it counts no time" }
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }
      ATTEMPT_NOT_FOUND: { status: 404, source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:58 }
      ATTEMPT_ENDED: { status: 409, source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:82, note: "finished, timed out or closed early" }
      EXAM_NOT_FOUND: { status: 404, note: "as getExamBriefing" }
      VALIDATION_ERROR: { status: 400 }
    sideEffects:
      - "the attempt's holder becomes this page and lastSeq 0; the page that held it before gets ATTEMPT_HELD_ELSEWHERE on its next call"

  saveExamAnswer:
    summary: Save an answer the moment it is chosen
    route: PUT /lessons/{id}/online-exam/attempt/answers/{questionId}
    source: apps/tedrisat/src/online-exam/exam-attempt.controller.ts:166
    needs: as getExamBriefing; the caller's attempt in progress, held by this page
    body:
      type: object
      additionalProperties: false
      required: [holderId, seq, optionIds, skipped]
      properties:
        holderId: { type: string }
        seq: { type: integer, minimum: 1, description: "the page's count of its calls; one at or under the attempt's lastSeq writes nothing, so a late answer never replaces a later choice" }
        optionIds: { type: array, items: { type: string, format: uuid } }
        skipped: { type: boolean }
        currentQuestionId: { type: string, format: uuid }
    result: { status: 200, note: "{ written, secondsLeft }" }
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }
      ATTEMPT_HELD_ELSEWHERE: { status: 409, source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:70 }
      ATTEMPT_ENDED: { status: 409, source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:82 }
      ATTEMPT_NOT_FOUND: { status: 404, source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:58 }
      ANSWER_INVALID: { status: 400, source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:92, note: "an option of another question, or several for a SINGLE question" }
      QUESTION_NOT_FOUND: { status: 404, source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:104 }
      VALIDATION_ERROR: { status: 400 }
    sideEffects:
      - "upserts the ExamAnswer and the attempt's current question"

  tickExamClock:
    summary: Count the time while the page holds the attempt
    route: POST /lessons/{id}/online-exam/attempt/clock
    source: apps/tedrisat/src/online-exam/exam-attempt.controller.ts:189
    needs: as saveExamAnswer
    body:
      type: object
      additionalProperties: false
      required: [holderId]
      properties:
        holderId: { type: string }
    result: { status: 200, note: "{ secondsLeft, status }; the page calls it every 10 s; a call counts at most 90 s, so a lost connection uses no time; at 0 the attempt ends as TIME" }
    refusals:
      HTTP_401: { status: 401, note: "no token, or one that does not verify" }
      ATTEMPT_HELD_ELSEWHERE: { status: 409, source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:70 }
