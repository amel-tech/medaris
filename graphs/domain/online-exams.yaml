      PRACTICE_POOL_COUNT_INVALID: { status: 400, source: apps/tedrisat/src/practice/errors/practice.errors.ts:86, note: "RANDOM with a count over the pool's size, or an empty pool" }
      AUTHZ_FORBIDDEN: { status: 403, source: libs/common/src/authz/authz.guard.ts:92 }
      VALIDATION_ERROR: { status: 400 }
    sideEffects:
