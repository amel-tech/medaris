    needs: course.view on the course, and a talebe's seat that may write
    result: { status: 200, type: object, description: "courseId, questionCount (the complete questions of its published sets; no exam's, no draft's), openAttemptId, attempts (the caller's ten latest pool attempts: id, mode, questionCount, status, startedAt, finishedAt, result)" }
