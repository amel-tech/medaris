invariants:
  - id: online-exam-points-total-100
    rule: >-
      The points of an online exam's questions total 100: each question's own points, and an equal, exact share of what is left for the
      questions that have none. An exam whose points do not total 100 is not published (POINTS).
    holds: true
    source: apps/tedrisat/src/online-exam/domain/online-exam.ts:216

  - id: online-exam-length-required
    rule: An online exam is published only with a length; a new draft has none (NO_DURATION).
    holds: true
    source: apps/tedrisat/src/online-exam/domain/online-exam.ts:222

  - id: online-exam-order-is-the-talebe-s-own
    rule: >-
      Every attempt has an order of questions, and of each question's options, drawn for it alone when it starts; a resumed attempt
      keeps its order.
    holds: true
    source: apps/tedrisat/src/database/schema/exam-attempt.schema.ts:42

  - id: online-exam-correct-options-stay-hidden
    rule: >-
      No answer to a talebe says which options are correct, or how many, before the exam has closed for everyone and its results are
      released.
    holds: true
    source: apps/tedrisat/src/online-exam/my-exams.service.ts

  - id: online-exam-release-ends-it
    rule: >-
      Releasing an online exam's results ends it for everyone, in the release's transaction, as closeOnlineExamEarly does: every
      attempt in progress ends with its saved answers (CLOSED_EARLY) and is scored, the exam is closed early at the release's time,
      and no one starts it any more. An exam that has closed for everyone already keeps its close as it was. So each talebe reads
      their answers with the correct ones as soon as the results are released.
    holds: true
    source: apps/tedrisat/src/online-exam/exam-results.service.ts:451
    note: "The owner, 24 Nov 2026: \"Önerini uygula\" (an attempt whose talebe left without finishing had kept a released exam open for good)."

  - id: online-exam-released-only-once-open
    rule: >-
      An online exam's results are released only once it has opened; before, the release is refused (EXAM_NOT_OPEN) and changes
      nothing, so it can never close an exam nobody could take.
    holds: true
    source: apps/tedrisat/src/online-exam/exam-results.service.ts:458

  - id: online-exam-taken-once
    rule: A talebe has at most one attempt of an exam; a finished attempt is not started again (EXAM_ALREADY_TAKEN).
    holds: true
    source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:46

  - id: online-exam-fixed-once-published
    rule: >-
      A published exam's questions, options, points, topics, settings and zeroth question do not change (EXAM_LOCKED); it is taken back
      to a draft only until it opens.
    holds: true
    source: apps/tedrisat/src/online-exam/errors/online-exam.errors.ts:27

  - id: online-exam-clock-runs-connected
    rule: >-
      An attempt's time is used only while the page that holds it calls; the time lost to a dropped connection is not counted.
    holds: true
    source: apps/tedrisat/src/online-exam/exam-attempt.service.ts:548
    note: "The owner: \"talebeye güvenilecek burada, böyle bi yolla kandırırsa Allah Teâlâ'ya hesap verir\"."

  - id: practice-correct-options-only-when-finished
    rule: >-
      No answer about a practice attempt in progress says which options are correct; a finished attempt shows them with each
      question's outcome and the percentage at once (MDRS-248).
    holds: true
    source: apps/tedrisat/src/practice/practice.service.ts:545

  - id: practice-set-has-no-celse
    rule: >-
      A çalışma seti (kind PRACTICE) never has a celse: publishing it plans nothing, so it reaches no calendar and no notification.
    holds: true
    source: apps/tedrisat/src/database/schema/online-exam.schema.ts:117

  - id: practice-one-open-attempt
    rule: A talebe has at most one attempt of a çalışma seti in progress; starting it again goes on with that one.
    holds: true
    source: apps/tedrisat/src/database/schema/practice.schema.ts:63

  - id: practice-one-open-pool-attempt
    rule: >-
      A talebe has at most one pool attempt of a course in progress; starting the pool again goes on with that one. The pool is the
      complete questions of the course's published çalışma setleri, never an exam's or a draft's (MDRS-248 Faz 4).
    holds: true
    source: apps/tedrisat/src/database/schema/practice.schema.ts:66

  - id: zeroth-answers-never-traced
    rule: An aggregate of the zeroth answers never carries a name, a user id or a single answer. Its counts are exact.
    holds: true
    source: apps/tedrisat/src/online-exam/zeroth-answers.service.ts
