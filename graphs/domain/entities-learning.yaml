# Homework, exams, questions, notes and evaluations (domain.md section 7, E). Every table hangs off Lesson with RESTRICT: the
# course, week and session purges remove them first (course/course-purge.ts:101-293, archive/archive.repository.ts:764-798).
# All timestamps here are with time zone. A user column holds a Keycloak sub and is no foreign key: it is marked `note: "Keycloak sub"`.
schema: delurio-graph/0
kind: domain
id: medaris.api
entities:
  LessonNote: # a talebe's PRIVATE note on a session's video: its author is the only reader and writer
    source: apps/tedrisat/src/database/schema/lesson-note.schema.ts:27
    required: [id, lessonId, authorId, body, createdAt, updatedAt]
    fields:
      id: { type: string, format: uuid }
      lessonId: { type: string, format: uuid, references: Lesson, note: "on delete restrict" }
      authorId: { type: string, format: uuid, note: "Keycloak sub" }
      offsetSeconds: { type: [integer, "null"], minimum: 0, maximum: 359999, note: "the player position; null when none" }
      body: { type: string, minLength: 1, maxLength: 4000, sensitivity: personal, note: "Markdown source, stored as typed, never rendered as HTML" }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
    # An index on (authorId, lessonId). Check lesson_notes_offset_not_negative.
    lifecycle:
      - "none -> written: an ENROLLED or COMPLETED talebe with no ban and with course.view_details writes it (lesson-note.repository.ts:66)"
      - "written -> written: the author edits it (:98)"
      - "written -> none: the author deletes it (:112), and may still do so after being removed, barred or left pending while the course is open"

  LessonQuestion: # a talebe's question on a session and the course team's single answer; answering again replaces it, with no history
    source: apps/tedrisat/src/database/schema/lesson-question.schema.ts:23
    required: [id, lessonId, authorId, body, createdAt, updatedAt]
    fields:
      id: { type: string, format: uuid }
      lessonId: { type: string, format: uuid, references: Lesson, note: "on delete restrict" }
      authorId: { type: string, format: uuid, note: "Keycloak sub" }
      body: { type: string, minLength: 1, maxLength: 4000, note: "Markdown" }
      answer: { type: [string, "null"], minLength: 1, maxLength: 4000 }
      answeredBy: { type: [string, "null"], format: uuid, note: "Keycloak sub" }
      answeredAt: { type: [string, "null"], format: date-time }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
    # Indexes on authorId and on lessonId. Check lesson_questions_answer_complete: answer, answeredBy and answeredAt are all null or all set.
    lifecycle:
      - "none -> asked: an ENROLLED or COMPLETED talebe asks (lesson-question.repository.ts:279)"
      - "asked -> asked: the author edits the question (:293)"
      - "asked -> answered: a holder of question.answer answers; the author and the holders read it, nobody else"
      - "answered -> answered: answering again replaces the answer (:315)"
      - "asked | answered -> none: deleted (:331)"

  LessonSubmission: # a talebe's homework on a session: one per talebe per session, an optional note and up to 10 files; no deadline and no grade
    source: apps/tedrisat/src/database/schema/lesson-submission.schema.ts:24
    required: [id, lessonId, userId, createdAt, updatedAt]
    fields:
      id: { type: string, format: uuid }
      lessonId: { type: string, format: uuid, references: Lesson, note: "on delete restrict" }
      userId: { type: string, format: uuid, note: "Keycloak sub; the talebe" }
      note: { type: [string, "null"], maxLength: 4000, sensitivity: personal, note: "blank means none" }
      reviewNote: { type: [string, "null"], maxLength: 4000, sensitivity: personal, note: "the course team's note; invisible to the talebe until reviewedAt is set" }
      reviewedBy: { type: [string, "null"], format: uuid, note: "Keycloak sub" }
      reviewedAt: { type: [string, "null"], format: date-time, note: "set by 'send' on the review; null iff reviewedBy is null (check lesson_submissions_review_sent)" }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
    # A unique index on (lessonId, userId): one submission per talebe per session.
    lifecycle:
      - "none -> handed in: a talebe with an active seat hands in on a live (not hidden) session; any live session takes a hand-in, whether or not it has a homework row (lesson-submission.repository.ts:297, 336)"
      - "handed in -> reviewed: the course team sends a review (a note or at least one file); the talebe is notified SUBMISSION_REVIEWED on every send, even a re-send that changes nothing (audit submission.review)"
      - "reviewed -> reviewed: sending again replaces the note and keeps the files"

  SubmissionFile: # a file of a talebe's homework: at most 10 per submission, 25 MB each
    source: apps/tedrisat/src/database/schema/lesson-submission.schema.ts:62
    required: [id, submissionId, storageKey, fileName, contentType, sizeBytes, createdAt]
    fields:
      id: { type: string, format: uuid }
      submissionId: { type: string, format: uuid, references: LessonSubmission, note: "on delete restrict" }
      storageKey: { type: string, unique: true, sensitivity: internal, note: "built by tedrisat from ids and a random uuid, never from user text" }
      fileName: { type: string, maxLength: 200, note: "sanitised; the extension is forced to agree with the type read from the bytes" }
      contentType: { type: string, enum: [application/pdf, image/png, image/jpeg, image/webp, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.openxmlformats-officedocument.presentationml.presentation, "text/plain; charset=utf-8"], note: "read from the bytes (file-type.ts: PDF, PNG, JPEG, WebP, docx, xlsx, pptx, plain UTF-8 text); anything else is 415" }
      sizeBytes: { type: integer, maximum: 26214400, note: "25 MB (MAX_UPLOAD_BYTES, storage/upload.ts:19); more is 413 FILE_TOO_LARGE" }
      createdAt: { type: string, format: date-time }
    # An index on submissionId.
    lifecycle:
      - "none -> stored: the talebe adds a file (lesson-submission.repository.ts:359); an eleventh is 409 SUBMISSION_FILE_LIMIT, and a MEMORIZE homework takes no file (409 SUBMISSION_FILES_NOT_TAKEN)"
      - "stored -> none: the talebe deletes it (:460), and its object is queued in StorageDeletion"

  SubmissionReviewFile: # a file the course team returns with a review: at most 5 per homework
    source: apps/tedrisat/src/database/schema/lesson-submission.schema.ts:89
    required: [id, submissionId, storageKey, fileName, contentType, sizeBytes, uploadedBy, createdAt]
    fields:
      id: { type: string, format: uuid }
      submissionId: { type: string, format: uuid, references: LessonSubmission, note: "on delete restrict" }
      storageKey: { type: string, unique: true, sensitivity: internal }
      fileName: { type: string, maxLength: 200 }
      contentType: { type: string, note: "the same eight types as SubmissionFile" }
      sizeBytes: { type: integer, maximum: 26214400 }
      uploadedBy: { type: string, format: uuid, note: "Keycloak sub; the reviewer" }
      createdAt: { type: string, format: date-time }
    # An index on submissionId.
    lifecycle:
      - "none -> stored: the course team uploads one (lesson-submission.repository.ts:628); a sixth is 409 SUBMISSION_REVIEW_FILE_LIMIT; it stays hidden from the talebe (404 SUBMISSION_FILE_NOT_FOUND) until the review is sent"
      - "stored -> none: deleted (:662), and its object is queued in StorageDeletion"

  LessonAssignment: # the homework a müderris SETS on a session: at most one per session
    source: apps/tedrisat/src/database/schema/lesson-assignment.schema.ts:31
    required: [id, lessonId, kind, createdAt, updatedAt]
    fields:
      id: { type: string, format: uuid }
      lessonId: { type: string, format: uuid, unique: true, references: Lesson, note: "on delete restrict; the unique index makes it one homework per session" }
      description: { type: [string, "null"], maxLength: 4000, note: "plain text, never HTML" }
      kind: { enum: [FILE, MEMORIZE], default: FILE, note: "MEMORIZE is recited to the müderris and marked in AssignmentEvaluation, and takes no file; FILE is also what every homework that existed before the column became" }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
    lifecycle:
      - "none -> set: a holder of session.manage sets the homework on a live session (course/lesson-assignment.repository.ts:144, 160)"
      - "set -> set: its description, kind and files change (:204, 242, 286)"
      - "set -> none: taking it off removes its description, its files (from storage too) and its memorization marks, and never the talebe's submissions"

  LessonAssignmentFile: # a file of the homework a müderris sets; never a row of LessonResource
    source: apps/tedrisat/src/database/schema/lesson-assignment.schema.ts:61
    required: [id, assignmentId, storageKey, fileName, contentType, sizeBytes, createdAt]
    fields:
      id: { type: string, format: uuid }
      assignmentId: { type: string, format: uuid, references: LessonAssignment, note: "on delete restrict" }
      storageKey: { type: string, unique: true, sensitivity: internal }
      fileName: { type: string, maxLength: 200 }
      contentType: { type: string, note: "the same eight types as SubmissionFile" }
      sizeBytes: { type: integer, maximum: 26214400 }
      createdAt: { type: string, format: date-time }
    # An index on assignmentId.
    lifecycle:
      - "none -> stored: a holder of session.manage uploads it, which needs an existing homework (404 LESSON_ASSIGNMENT_NOT_FOUND otherwise; lesson-assignment.repository.ts:195, 237, 271)"
      - "stored -> none: deleted, and its object is queued in StorageDeletion"

  AssignmentEvaluation: # the course team's mark of one talebe on a MEMORIZE homework: Tam, Eksik or Vermedi. NO ROW means Bekliyor
    source: apps/tedrisat/src/database/schema/lesson-assignment.schema.ts:91
    required: [id, assignmentId, userId, status, evaluatedBy, createdAt, updatedAt]
    fields:
      id: { type: string, format: uuid }
      assignmentId: { type: string, format: uuid, references: LessonAssignment, note: "on delete restrict" }
      userId: { type: string, format: uuid, note: "Keycloak sub; the talebe, who must hold an ENROLLED or COMPLETED seat" }
      status: { enum: [FULL, INCOMPLETE, ABSENT], note: "FULL is Tam, INCOMPLETE is Eksik, ABSENT is Vermedi" }
      note: { type: [string, "null"], maxLength: 280 }
      evaluatedBy: { type: string, format: uuid, note: "Keycloak sub" }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
    # A unique index on (assignmentId, userId), pinned by memorize-evaluations-migration.e2e.spec.ts.
    lifecycle:
      - "none -> marked: a holder of session.manage saves a mark (evaluation.repository.ts:285, an upsert, audit assignment_evaluation.save); a session whose homework is a FILE homework or has none is 404 MEMORIZATION_NOT_FOUND"
      - "marked -> marked: saving a different mark replaces it; a save equal to the stored mark writes nothing and no audit row; concurrent first saves of one cell take turns under a row lock"

  LessonExam: # a session planned as Sınav (otherwise it stays a LIVE session): at most one per session; a make-up (Telafi) is a second exam session with isRetake
    source: apps/tedrisat/src/database/schema/lesson-exam.schema.ts:28
    required: [id, lessonId, format, maxScore, isRetake, createdAt, updatedAt]
    fields:
      id: { type: string, format: uuid }
      lessonId: { type: string, format: uuid, unique: true, references: Lesson, note: "on delete restrict; the unique index makes it one exam per session" }
      format: { enum: [WRITTEN, ORAL], default: WRITTEN }
      maxScore: { type: integer, minimum: 1, maximum: 1000, default: 100, note: "check lesson_exams_max_score_check (EXAM_DEFAULT_MAX_SCORE 100, EXAM_MAX_SCORE_LIMIT 1000)" }
      topics: { type: [string, "null"], maxLength: 2000 }
      location: { type: [string, "null"], maxLength: 200, note: "an exam with a location is in person, else online" }
      isRetake: { type: boolean, default: false }
      remindedAt: { type: [string, "null"], format: date-time, note: "claimed once by the 24-hour reminder; moving the exam's time clears it" }
      resultsReleasedAt: { type: [string, "null"], format: date-time, note: "until it is set, no talebe reads a score" }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
    lifecycle:
      - "none -> planned: the row is created with the session save (course.repository.ts:1886); planning with a pattern of more than one session is 400 EXAM_ONE_SESSION"
      - "planned -> reminded: the reminder poll claims an exam that starts within 24 hours, is neither cancelled nor hidden and has no remindedAt, and tells the enrolled talebe once (exam.repository.ts:466-535)"
      - "planned | reminded -> released: the course team releases the results (audit exam.release); once only, a second call changes nothing and tells nobody (exam.repository.ts:305)"

  ExamResult: # one talebe's result in an exam: a score from 0 to maxScore, or Girmedi. NO ROW means not entered yet
    source: apps/tedrisat/src/database/schema/lesson-exam.schema.ts:68
    required: [id, examId, userId, absent, gradedBy, createdAt, updatedAt]
    fields:
      id: { type: string, format: uuid }
      examId: { type: string, format: uuid, references: LessonExam, note: "on delete restrict" }
      userId: { type: string, format: uuid, note: "Keycloak sub; the talebe, who must hold an ENROLLED or COMPLETED seat" }
      score: { type: [integer, "null"], minimum: 0, note: "its upper bound, the exam's maxScore, is checked by the service under a lock (maxScore is read for update), not by the database" }
      absent: { type: boolean, default: false, note: "Girmedi: absent with no score; a score sent with absent is dropped" }
      gradedBy: { type: string, format: uuid, note: "Keycloak sub" }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
    # A unique index on (examId, userId). Check exam_results_score_check: (absent and score is null) or (not absent and score is not null and score >= 0).
    lifecycle:
      - "none -> entered: a holder of session.manage saves a result on a live exam session for a seated talebe (exam.repository.ts:220, an upsert, audit exam_result.save); there is no time window, so a result can be entered before the exam and before the release"
      - "entered -> entered: saving again replaces it; an unchanged save writes nothing; concurrent first saves take turns"
      - "entered -> readable: the talebe reads their own score or Girmedi only after LessonExam.resultsReleasedAt; the course team always reads them all"
