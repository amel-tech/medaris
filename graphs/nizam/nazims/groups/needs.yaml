# What must exist for the Medaris başnazım to manage the platform's permission groups: the flow's product list (LAYOUT.md section 7). Each need
# is what the product must do, from the flow's story, not from what the page does today; the known gaps go to graphs/needs.gaps.yaml, which the
# orchestrator merges. Read by people for now: no checker runs on this file yet.
#
# No replay has run (the owner moved every walk to the end), so no `replay:` scenario is named under `walked`; the e2e checks are the ones of
# apps/nizam/e2e/permissions.e2e.ts, whose numbers (permissions#10 to #16) are the inventory's.
#
# For the gaps merge:
#   missing:  group-the-course-permissions (MDRS-226), warn-before-an-edit-is-dropped, the-question-is-described-by-its-intro,
#             the-list-is-a-list, busy-buttons-say-so, a-stale-count-can-be-answered, focus-after-a-make-or-a-delete,
#             say-why-one-course-is-off, no-call-when-nothing-changed   (all but the first `missing: none`, no issue yet)
#   unwalked: scope-is-fixed-once-made, a-refusal-is-told (code, no e2e and no replay; permissions#11 only reads that a new group's "Bir ders" is off)
#   permissions#16 asserts a fixed date ("31 Aralık 2026", F-W2-7, F-X-20): it rests on the seed's fixed expiry and fails after 2026-12-31, so
#             open-a-users-permissions is walked by it only until then.
kind: needs
flow: nizam.nazims.groups
status: proposed

needs:
  - id: list-groups-with-scope-count-and-users
    need: >-
      The başnazım sees every permission group of the platform, oldest first, with its scope, how many permissions it holds and how many people
      use it, can choose one by name, and sees for the chosen one its name, its permissions and who uses it, each with the end of their
      appointment or "süresiz". A platform with no group says so.
    drawn: [groupList, groupItem, itemName, itemLine, itemUsed, listEmpty, usersCount, userName, userLine, usersNone, start, openedScope]
    built:
      - action: medaris.api:listPermissionGroups
      - action: medaris.api:listPermissionGroupUsers
      - route: apps/nizam/features/permissions/components/groups-view.tsx:84
      - route: apps/nizam/features/permissions/components/group-form.tsx:250
    walked:
      - e2e: apps/nizam/e2e/permissions.e2e.ts
        check: 'permissions#10'

  - id: define-a-group
    need: >-
      The başnazım makes a group of permissions to give to Medaris nazımları with one choice. A group needs a name that is not blank, not over 80
      characters and not another group's whatever its case, and at least one permission; each of these is said before anything is sent, and a
      name another group got meanwhile is refused by the server. The group appears in the list with its permissions, and its form opens.
    drawn: [newForm, creating, afterCreate, nameFieldNew, nameHelp, nameRequired, nameTaken, nameLong, noPermission, toastCreated, toastCreatedBody, toastTaken]
    built:
      - action: medaris.api:createPermissionGroup
      - route: apps/nizam/features/permissions/components/group-form.tsx:116
      - route: apps/nizam/features/permissions/present.ts:283
    walked:
      - e2e: apps/nizam/e2e/permissions.e2e.ts
        check: 'permissions#12'

  - id: scope-decides-the-boxes
    need: >-
      The scope of a group says what it may hold: "Platform" lets in the platform's 19 permissions in five sections, "Her ders" the 21 course
      permissions, and choosing the other scope switches the boxes over and drops the ticks the new scope cannot hold. "Bir ders" is not offered
      until a page lets the başnazım pick the course.
    drawn: [scopeGroup, scopePlatform, scopeCourses, scopeOne, secKosks, secMadrasahs, secRequests, secBans, secAudit, secCourse]
    built:
      - route: apps/nizam/features/permissions/present.ts:303
      - route: apps/nizam/features/permissions/present.ts:313
      - route: apps/nizam/features/permissions/components/group-form.tsx:217
    walked:
      - e2e: apps/nizam/e2e/permissions.e2e.ts
        check: 'permissions#11'

  - id: scope-is-fixed-once-made
    need: >-
      A group keeps its scope: the form of a saved group shows its own scope and the other two are off, so a platform group cannot become an
      every-course group, which would change what its holders can do.
    drawn: [editForm, editFormCourses, scopePlatform, scopeCourses, scopeOne]
    built:
      - route: apps/nizam/features/permissions/components/group-form.tsx:169
      - route: apps/tedrisat/src/assignment/admin/permission-admin.service.ts:366
    # no e2e reads this, and no replay has run

  - id: edit-asks-what-happens-to-the-users
    need: >-
      Saving a group whose set of permissions changed, while somebody uses it, asks first what becomes of them: they keep what the group gave
      as single permissions, or lose it; no answer is chosen for the başnazım and nothing is sent until one is. A rename alone, and a group
      nobody uses, ask nothing. A saved change detaches everybody from the group.
    drawn: [editForm, editFormCourses, updating, askSave, askSaveReady, savingAsked, askSaveDialog, askSaveKeep, askSaveRevoke, askSaveConfirm, toastSaved]
    built:
      - action: medaris.api:updatePermissionGroup
      - route: apps/nizam/features/permissions/components/users-policy-dialog.tsx:48
      - route: apps/nizam/features/permissions/present.ts:333
    walked:
      - e2e: apps/nizam/e2e/permissions.e2e.ts
        check: 'permissions#15'

  - id: delete-asks-what-happens-to-the-users
    need: >-
      Deleting a group always asks. While somebody uses it the question is the same two answers with none chosen and the confirm off until one
      is; for a group nobody uses it is a plain confirmation that says the deletion cannot be undone. "Vazgeç" deletes nothing, and the
      scrim does not close the question.
    drawn: [askDelete, askDeleteReady, deletingAsked, askDeletePlain, deletingPlain, afterDelete, askDeleteDialog, askPlainDialog, toastDeleted]
    built:
      - action: medaris.api:deletePermissionGroup
      - route: apps/nizam/features/permissions/components/users-policy-dialog.tsx:48
    walked:
      - e2e: apps/nizam/e2e/permissions.e2e.ts
        check: 'permissions#13'
      - e2e: apps/nizam/e2e/permissions.e2e.ts
        check: 'permissions#14'

  - id: open-a-users-permissions
    need: >-
      From a group's page the başnazım opens the permissions of one of its users, who is a Medaris nazımı, in the same dialog the Medaris nazımları
      page opens, for that person, with the group already chosen.
    drawn: [editUser, handed_over.edit_permissions]
    built:
      - action: medaris.api:setMedarisNazimGrants
      - route: apps/nizam/features/permissions/components/group-form.tsx:291
      - route: apps/nizam/features/permissions/components/groups-view.tsx:145
    walked:
      - e2e: apps/nizam/e2e/permissions.e2e.ts
        check: 'permissions#16'

  - id: a-refusal-is-told
    need: >-
      When the server refuses a make, a change or a delete (the name was taken meanwhile, the group is gone, the caller may not), a message says
      which and the form stays as it was.
    drawn: [toastSaveFailed, toastDeleteFailed, toastTaken, toastGone, toastGeneric]
    built:
      - route: apps/nizam/features/permissions/components/group-form.tsx:94
      - route: apps/nizam/features/permissions/present.ts:348
    # no e2e visits a refusal, and no replay has run

  - id: group-the-course-permissions
    need: >-
      The permissions are grouped, and a group of them can be ticked at once, instead of one flat list of boxes per scope (planned.md P-17,
      MDRS-226, requested by the owner on 2026-10-03: the issue names this list of boxes).
    drawn: [permissionsHeading, secKosks, secMadrasahs, secRequests, secBans, secAudit, secCourse]
    missing: MDRS-226

  - id: warn-before-an-edit-is-dropped
    need: >-
      Choosing another group, or "Grup oluştur", while the form holds changes does not drop them without a word (F-W2-8): it warns, or keeps a
      draft.
    drawn: [newForm, editForm, editFormCourses, groupItem, createLink]
    missing: none

  - id: the-question-is-described-by-its-intro
    need: >-
      The question over a group is described to a screen reader by its intro line, not by the whole body with both answers and their small
      print (F-W2-13, F-X-6, F-UI-W1-1).
    drawn: [askSaveDialog, askDeleteDialog, askPlainDialog]
    missing: none

  - id: the-list-is-a-list
    need: >-
      The list of groups is one labelled list, not a navigation that holds a hidden heading of the same name (F-W2-9).
    drawn: [listNav, listHeading, groupList]
    missing: none

  - id: busy-buttons-say-so
    need: >-
      While a save or a delete runs, every control that does nothing then says so: "Vazgeç" and the close icon of the question are off, and the
      busy button's status is a catalog message, not a hard-coded "Yükleniyor" (F-W2-groups-1, F-UI-W1-3).
    drawn: [askSaveCancel, askSaveClose, askDeleteCancel, askDeleteClose, askPlainCancel, askPlainClose, busyStatus, save]
    missing: none

  - id: a-stale-count-can-be-answered
    need: >-
      When somebody was given the group after the page was read, a save or a delete that needs the question is not just refused with a toast:
      the question opens with the new count, or the page reads again (F-W2-groups-3, decision D2). A refusal that is raised while the
      question is open is reachable by a screen reader (F-W2-groups-2).
    drawn: [updating, deletingPlain, toastGeneric, savingAsked, deletingAsked]
    missing: none

  - id: focus-after-a-make-or-a-delete
    need: >-
      After a group is made or deleted the focus goes to something that is still there: the new form's title, or the list (F-W2-groups-4).
    drawn: [afterCreate, afterDelete, editForm, newForm]
    missing: none

  - id: say-why-one-course-is-off
    need: >-
      "Bir ders" is either left out until the başnazım can pick a course, or says why it cannot be chosen (F-W2-groups-5).
    drawn: [scopeOne, scopeOneHelp]
    missing: none

  - id: no-call-when-nothing-changed
    need: >-
      "Kaydet" on a form that equals its group closes without a call, an audit row or a toast that says the group was saved (F-W2-groups-6).
    drawn: [editForm, updating, toastSaved]
    missing: none
