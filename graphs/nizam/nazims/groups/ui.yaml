# The screens of nizam.nazims.groups: the page İzin grupları (/izin-gruplari) with its list of groups and the form of the selected group, and
# the question "Bu grubu N kişi kullanıyor" (or "{name} silinsin mi?") over it, with the toasts. Read from apps/nizam/app/izin-gruplari/page.tsx and
# apps/nizam/features/permissions/components/{groups-view,group-form,users-policy-dialog,permission-boxes}.tsx; the words are copied from
# libs/i18n/src/locales/tr/nizam.json by their key (GroupsPage, UsersPolicyDialog, PermissionCatalog, PermissionsPage). The one message the
# graph uses to say what the flow changes, `changes`, is the page's own: GroupsPage.usersNote ("Kaydederken ya da silerken grubu kullananların
# izinlerine ne olacağını seçersiniz. Her değişiklik denetim kaydına yazılır."). Two entries are text the code builds from data and that no
# i18n file holds (composed.*):
#   composed.GroupsPage.name   a person's or a group's name drawn as it is: the list item (groups-view.tsx:102), the form's title (group-form.tsx:189), the
#                              name field's value (:204), a user (:281) and the eyebrow of the question (users-policy-dialog.tsx:53)
#   composed.Busy.loading      "Yükleniyor", the busy button's hard-coded status text (libs/ui/src/mds/button.tsx:62)
# The 19 platform boxes and the 21 course boxes are all drawn (one set shows for each scope, so `--absent` also proves that the scope decides
# which boxes the form offers, permissions#11-#12); a box's tick is not drawn, only the message a form with none gives. The small print under a
# box (PermissionCatalog.permissions.*.help) is each checkbox's description and is not drawn.
# The page behind a question is inert, so no page node is listed in a question's states; the toasts are in a region outside both.
