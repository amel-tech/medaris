rules:
  - { id: focus-not-set, rule: "The page sets no focus of its own when it loads, and choosing a group in the list or 'Grup oluştur' is a client navigation to the same page: the link keeps the focus while the form beside it is replaced (apps/nizam/features/permissions/components/groups-view.tsx:94). No `initialFocus` is drawn on the page." }
  - { id: label-in-name, rule: "A node's visible text is contained in its accessible name (WCAG 2.5.3): 'İzinlerini düzenle' in 'İzinlerini düzenle: {name}', 'Grubu sil' in 'Grubu sil: {name}'. Holds. A list link's name is its three parts together: the group's name, '{scope} · {count} izin' and, for a used group, 'N kişi kullanıyor'." }
  - { id: no-default-accept, rule: "The question opens with no radio chosen and the focus on 'Vazgeç', and its confirm button stays natively off until an answer is chosen: a destructive default is not offered (permissions#13). The legend, not the button, says what is missing." }
  - { id: F-W2-8, rule: "Choosing another group in the list, or 'Grup oluştur', remounts the form (`key={group?.id ?? \"new\"}`, groups-view.tsx:133) and what was typed or ticked and not saved is dropped without a prompt; a grep for dirty or beforeunload in features/permissions is empty. The new form after 'Grup oluştur' and the other group's form are both reached this way (SELECT_OTHER, NEW_GROUP). Fix: warn when the form differs from the group, or keep a draft (decision D1)." }
  - { id: F-W2-9, rule: "The list of groups is a <nav aria-label=\"Gruplar\"> that contains a visually hidden <h2> 'Gruplar' (groups-view.tsx:84-85): the same name twice, and a list of choices inside the page is announced as navigation. Fix: keep one of them; a labelled <ul>, or a listbox." }
  - { id: F-W2-13, rule: "The question is described by its whole body: AlertDialog wraps its children in Base UI's Dialog.Description (libs/ui/src/mds/alert-dialog.tsx:88-93), so opening it reads the legend, both radios and their descriptions as the description. Fix: describe the dialog by its intro line only (F-UI-W1-1, F-X-6)." }
  - { id: F-UI-W3-1, rule: "Field's error element has no live region (libs/ui/src/mds/field.tsx): 'Bir grup adı yazın.', 'Bu adda bir grup var.' and the length message are read only if the focus is on the field, and a try to save with a blank name moves nothing (group-form.tsx:146-150). The one message of this form that is announced is 'En az bir izin seçin.' (role alert, :244)." }
  - { id: F-UI-W1-3, rule: "The busy 'Kaydet', and the busy confirm of the question, say 'Yükleniyor' from the button's hard-coded default (libs/ui/src/mds/button.tsx:62); nothing passes `loadingLabel`, so it is outside the catalog and cannot follow another locale. Drawn as `busyStatus` on the form only: over the question both the form's and the dialog's button speak, and the dialog's is not drawn." }
  - { id: F-W2-groups-1, rule: "new: while a save or a delete runs in the question, 'Vazgeç' and the close icon stay enabled and do nothing: UsersPolicyDialog ignores a close while `busy` (users-policy-dialog.tsx:50-52) and the buttons are not marked. The form's own 'Vazgeç', 'Grubu sil' and fields are disabled while it runs. Fix: disable the two buttons while busy. The same shape as F-W3-open-2 (nizam.kosks.open)." }
  - { id: F-W2-groups-2, rule: "new, from the code: a refusal after the question is a sticky toast (`fail()`, group-form.tsx:94-98) raised while the question stays open (`setAsking(null)` is only on success, :112 and :141). The toast region is its own portal outside the alert dialog, which Base UI makes modal, so a screen reader may not reach or announce it; sighted people see a toast over the dialog. Not verified in a browser. Fix: raise the refusal inside the dialog, or close the dialog and then toast." }
  - { id: F-W2-groups-3, rule: "new: a count that is out of date cannot be repaired on the page. `needsUsersQuestion` reads the user count the page was loaded with (group-form.tsx:85, present.ts:333); a person given the group meanwhile makes the API answer USERS_POLICY_REQUIRED, the toast says 'Grubu kullananların izinleri için bir seçim yapın.' (present.ts:360), there is nothing on the page to choose, and nothing reads the page again (`router.refresh()` is only on success, :113), so the same try fails the same way until the page is reloaded. Fix: read the group again on that refusal and open the question with the new count (decision D2)." }
  - { id: F-W2-groups-4, rule: "new, from the code: after a create or a delete the button that was pressed is gone, so the focus falls to the page. A create replaces the form (the key goes from 'new' to the new id, group-form.tsx:127, groups-view.tsx:133) and a delete pushes /izin-gruplari, which selects another group or the empty form (:142); nothing moves the focus to the new form, the heading or the list. The same shape as F-W2-10 on the other pages. Not verified in a browser. Fix: focus the new form's title, or the list, once the page has read again." }
  - { id: F-W2-groups-5, rule: "new: 'Bir ders' is drawn on every new group and is disabled (group-form.tsx:168-169: 'A course is picked from a köşk's course list, which no page offers for the whole platform yet'), and nothing on the page says why; its own help line ('Ders işleri, seçeceğiniz tek bir derste.') reads as if it could be chosen. permissions#11 asserts it is disabled. An existing group's other two radios are disabled too, which the scope help does not explain either. Fix: say so, or leave the option out until a page offers it." }
  - { id: F-W2-groups-6, rule: "new: 'Kaydet' on a saved group's form with nothing changed is sent all the same (group-form.tsx:161: `needsUsersQuestion` is the only check): the API runs updateGroup, writes an audit row 'permission_group.update' and the toast says 'Grup kaydedildi'. The same as EPERM-2 of nizam.nazims.editPermissions. Fix: close without a call when the form equals the group." }
