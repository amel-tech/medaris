      - { guard: "rows == 'one'", target: newForm, effect: [rowsNone, freshNew], source: "apps/nizam/features/permissions/components/group-form.tsx:142", say: "that was the last group: the list says 'Henüz grup yok.' and the empty form opens" }
      - { target: editForm, effect: [rowsOne, firstGroup], source: "apps/nizam/features/permissions/components/group-form.tsx:142", say: "other groups are left: the oldest one's form opens" }

  left:
    type: final
    leavesPage: true
    title: They leave the page
    description: "A link or the menu takes them elsewhere; nothing here is changed by it."

  handed_over.edit_permissions:
    type: final
    title: They go on to a person's permissions
    description: >-
      nizam.nazims.editPermissions draws the dialog "İzinleri düzenle" for that person (the same PermissionsDialog its own page opens). Here it
      opens over this page and the page stays behind it; its save reads this page again (`onSaved` is a refresh, groups-view.tsx:154).

assertions:
  - { id: asks-before-detaching-people, never: "state == 'updating' and holders == 'used' and changed", say: "A change of a group's permissions never goes to the API without the question while somebody uses the group (needsUsersQuestion)", source: apps/nizam/features/permissions/present.ts:333 }
  - { id: delete-asks-the-users, never: "state == 'deletingPlain' and holders == 'used'", say: "A group somebody uses is never deleted by the plain question", source: apps/nizam/features/permissions/components/group-form.tsx:317 }
  - { id: no-default-answer, never: "(state == 'askSave' or state == 'askDelete') and policy != 'none'", say: "The question opens with no answer chosen", source: apps/nizam/features/permissions/components/users-policy-dialog.tsx:42 }
  - { id: the-answer-is-given, never: "(state == 'savingAsked' or state == 'deletingAsked') and policy == 'none'", say: "A group is never saved or deleted with the question's answer missing", source: apps/nizam/features/permissions/components/users-policy-dialog.tsx:62 }
  - { id: no-blank-name-is-sent, never: "(state == 'creating' or state == 'updating' or state == 'savingAsked') and name != 'ok'", say: "A blank, over-long or taken name is never sent", source: apps/nizam/features/permissions/components/group-form.tsx:149 }
  - { id: no-empty-group-is-made, never: "state == 'creating' and ticked == 'none'", say: "A group with no permission is never sent", source: apps/nizam/features/permissions/components/group-form.tsx:150 }
