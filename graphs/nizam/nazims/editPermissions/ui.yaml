# The screens of nizam.nazims.editPermissions: the page "Medaris nazımları" (/medaris-nazimlari) with the edited person's row, the dialog "İzinleri
# düzenle" over it, the group select's open list, and the toasts of a save. Read from apps/nizam/features/permissions/components/{nazims-view,
# permissions-dialog,permission-boxes}.tsx, apps/nizam/app/medaris-nazimlari/page.tsx, libs/ui/src/mds/{dialog,field,select,checkbox,button,table}.tsx
# and libs/ui/src/components/sonner.tsx on 15 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nizam.json (namespaces NazimsPage,
# PermissionsDialog, PermissionsPage, PermissionCatalog). Nothing was seen in a browser: every node is "from the code" until the walk phase.
#
# What the graph draws of a form of 19 boxes. The platform catalog has 19 codes in five sections; the graph draws five, the ones the walk meets:
# "Medrese aç ve başmüderrisini seç" (a single permission the walk never changes), "Desteyi herkese yayımla" (a single permission, ticked and unticked),
# and "Denetim kaydını oku" and "Pasif kapsamları yönet" (the two codes of the walk's group: ticked, locked and saying "Gruptan gelir." while the group is
# chosen, free and unticked with "Grup yok"). The other fourteen are boxes like them; `world: open` leaves them out. The group's two boxes are one node each
# whose `checked` follows the select; that they are also disabled while the group is chosen is said here and not drawn (a node has no `disabled` that
# follows a variable), and the summary and the help lines are separate nodes.
#
# Composed text (not in any i18n file), each a value the page puts in a place with no message of its own:
#   composed.Row.person       the <bdi> of the person's name in the table (nazims-view.tsx:74)
#   composed.Row.email        her address, a <bdi dir=ltr> (nazims-view.tsx:78)
#   composed.Row.group        the badge's group name, which is followed by the visually hidden word "grubu" (NazimsPage.groupSuffix) (nazims-view.tsx:104)
#   composed.Row.singles      the single permissions of the "İzinler ve gruplar" cell: the short sentences joined with ", ", after a group beginning with
#                             "ve " (NazimsPage.andPermissions); with no group, the plain list (nazims-view.tsx:118-122)
#   composed.Row.endDate      the day of the end, formatDay(locale, zone), no hour (nazims-view.tsx:140, present.ts:34)
#   composed.Row.giver        the <bdi> of who appointed (nazims-view.tsx:160)
#   composed.Dialog.person    the person's name in the dialog's card (permissions-dialog.tsx:207)
#   composed.Dialog.email     her address, a <bdi dir=ltr> (permissions-dialog.tsx:211)
#   composed.Group.name       the name of the walk's group, in the select's list (permissions-dialog.tsx:242)
#   composed.Button.loading   the busy button's hidden "Yükleniyor", a default of libs/ui/src/mds/button.tsx:62, in no catalog (F-UI-W1-3)
# The one message that is authored here is `Changes.note`: no message of the app says what saving the permissions changes; the dialog's only note is the
# audit sentence (PermissionsDialog.auditNote) and the toast says "güncellendi".
#
# Samples: the replay reads the binding's samples (the person's name and address, the giver, the group, the days) and matches any text where it has none.
