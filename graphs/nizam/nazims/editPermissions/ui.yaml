rules:
  - { id: focus-not-set, rule: "The page sets no focus when it loads. The dialog passes no `initialFocus` (permissions-dialog.tsx:178-198), so Base UI's default applies. The graph draws the close icon as the dialog's `initialFocus`, which is what the header order gives (libs/ui/src/mds/dialog.tsx:97-100); not verified in a browser." }
  - { id: F-W2-12, rule: "The dialog opens on the header's close icon and not on the work: PermissionsDialog passes no `initialFocus` (permissions-dialog.tsx:178), unlike most dialogs of the app. Fix: pass the select's trigger (edit mode) or the e-mail picker (appoint mode). Not verified in a browser." }
  - { id: F-W2-13, rule: "libs/ui/src/mds/dialog.tsx:103-112 makes BaseDialog.Description wrap the whole body, so aria-describedby is the entire form: the card, the select, 19 checkboxes with their help lines, the end field and the note. A screen reader may read all of it on open. Fix: describe the dialog by the intro line only. Not verified with one." }
  - { id: F-W2-11, rule: "A row's buttons are named with the person ('İzinleri düzenle: {name}', 'Görevden al: {name}') but a person with no name gets an empty name after the colon (nazims-view.tsx:180, `n.user.name ?? ''`). Fix: fall back to the address or 'Adı bilinmiyor'. Not drawn: the walk's person has a name." }
  - { id: F-W2-7, rule: "permissions.e2e.ts#6, #7 and #8 (which this flow takes over) use the seed's fixed expiry 2026-12-31T20:59:59Z and assertion strings built on it (permissions.e2e.ts:127, 397, 403): after 2026-12-31 the seeded appointment is lapsed and they fail. This flow does not copy them: its walk appoints a seat of its own with an end twenty days ahead, and the strings come from the seat's own end." }
  - { id: F-UI-W3-1, rule: "Field's error element has no role=alert and no live region (libs/ui/src/mds/field.tsx:50-52): 'Bitiş zamanı şu andan sonra olmalı.' and 'Bitiş zamanı atamanın bitişinden (...) sonra olamaz.' appear in place of the help line as the end is typed and are read only if the focus moves to them, which it does not. 'Kaydet' goes natively disabled at the same time (permissions-dialog.tsx:193), so a screen-reader user who types a wrong end finds a dead button and no word. Fix: role=alert on the error, or aria-live on the line." }
  - { id: F-X-4, rule: "A refused or failed save is told only by a toast while the dialog stays open (permissions-dialog.tsx:156-160, an error toast with an infinite duration); inside the dialog nothing says the save failed, and whether a toast raised under a modal Base UI dialog is exposed to assistive technology (the toaster is a sibling portal) is not known from the code. Fix: an Alert (error) inside the dialog body with the sentence. Not verified with a screen reader." }
  - { id: EPERM-1, rule: "New. A refusal reads nothing again: `onSaved` runs only on success (permissions-dialog.tsx:155-167), and revalidatePath only on success (actions.ts:109-111). After MEDARIS_NAZIM_NOT_FOUND ('Bu kişi artık Medaris nazımı değil.') the dialog stays open on a person who is gone, with 'Kaydet' on, and the row stays in the table until a reload; after PERMISSION_GROUP_NOT_FOUND ('Bu grup artık yok.') the select still lists the deleted group (the groups were read with the page, page.tsx:25-29) and the same save is refused the same way. Compare nazar's ders nazırı dialog, which closes and reads again (CNP-1 there). Fix: read again after these two refusals, and close the dialog when the person is gone." }
  - { id: EPERM-2, rule: "New. 'Kaydet' with the same group, the same permissions and the same end is sent all the same (canSave has no 'changed' test, permissions-dialog.tsx:134) and the toast says 'İzinler kaydedildi' / '{name} için izinler güncellendi.' although the API's planGrants finds nothing to do and writes no audit row (permission-admin.repository.ts, applyGrants). The başnazım is told something was updated that was not. Fix: close with no call and no toast when the form equals what the person holds, or say 'Değişiklik yok'." }
  - { id: EPERM-3, rule: "New. The end's 'now' is the moment the dialog opened (`setNow(new Date())` in the open effect, permissions-dialog.tsx:92), and the appointment's end is the one the page read. A dialog left open past the end that was typed, or over an appointment shortened meanwhile, is checked by the page against stale facts; the server then refuses with GRANT_EXPIRY_INVALID and the toast says only 'Bitiş tarihi geçmişte ya da atamanın bitişinden sonra.', which does not say which. Fix: say which, and read the appointment again." }
  - { id: EPERM-4, rule: "The table's end cell prints the day only ('5 Aralık 2026', formatDay, present.ts:34) while the dialog edits the day and the hour and the permissions end at that hour; the hour is visible only in the dialog's help line (and its field). The same as CNP-2 of nazar's table. Fix: print the hour in the cell." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'İzinleri düzenle' in 'İzinleri düzenle: {name}', 'Görevden al' in 'Görevden al: {name}' (WCAG 2.5.3). Holds." }
  - { id: closing-asks-nothing, rule: "Vazgeç, the close icon and Esc drop the form with no question; the scrim does not close it, so a stray click loses nothing. 'İzin gruplarını düzenle' is a plain link: following it drops the form with no question too. While a save runs the three buttons do nothing (permissions-dialog.tsx:181)." }
  - { id: the-end-is-an-instant, rule: "The end goes out as an instant (resolveEnd, libs/utils/src/end-instant.ts:141), `expiresAt: new Date(endIso)`, or null, never as a basic-format date, so the domain's grant-end-is-an-instant finding is not reachable from this dialog. A value equal to the held one goes back as the stored instant, so an end such as 23:59:59 does not drift." }
  - { id: toast-is-the-only-word, rule: "The result of a save is said by a toast: 6 seconds for a success, until closed for an error. Nothing on the page says what changed except the row itself." }
