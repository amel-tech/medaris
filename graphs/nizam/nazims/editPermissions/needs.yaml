schema: delurio-graph/0
kind: needs
id: nizam.nazims.editPermissions
status: proposed
summary: >-
  What must exist for the başnazım to change a Medaris nazımı's permissions and end: the flow's product list. No replay has been
  run (the owner's word: replays happen once, after every graph is written), so `walked` names the e2e checks and the specs that
  carry a need and no replay scenario; the replays bound in binding*.yaml (dated, forever, gone, groupGone, expiry) are named in
  the comments, not in `walked`.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# missing  (no code): a-wrong-end-is-announced (none, F-UI-W3-1), a-refusal-says-what-is-true-now (none, EPERM-1, decision D1), a-save-that-changes-nothing-says-so
# (none, EPERM-2, decision D2), the-dialog-starts-on-the-work (none, F-W2-12), the-table-shows-the-hour (none, EPERM-4), the-count-is-announced (none, CNP-4
# of nazar), the-checks-do-not-expire (none, F-W2-7)
# unwalked (code, no e2e and no replay that passed): a-refusal-keeps-the-form (a unit spec pins the code's sentences; that the dialog stays open on the form
# is walked only by the replays gone, groupGone and expiry, which are written and not run)

needs:
  - id: change-the-group-and-the-singles-in-one-save
    need: >-
      The başnazım changes the ready group and the single permissions of a Medaris nazımı in one save: what is ticked is what the
      person holds from then on, what stays keeps its giver and its date, the rest is revoked or added in the başnazım's name, and
      the row says it at once.
    evidence:
      - node: editButton
      - state: editing
      - state: choosingGroup
      - node: permDeck
      - state: saving
      - state: applied
      - node: rowGroup
      - node: rowSingles
      - node: toastSaved
      - source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:114
      - source: apps/nizam/features/permissions/components/permissions-dialog.tsx:136
      - source: apps/nizam/features/permissions/components/nazims-view.tsx:176
      - test: apps/nizam/e2e/permissions.e2e.ts
        name: "nizam/12 — saving changes the group and the single permissions, keeps what stays, and writes the audit log (criteria 4, 5)"
      - test: apps/tedrisat/test/e2e/permission-admin.e2e.spec.ts
    note: |-
      permissions#7: date-bound (F-W2-7, F-X-20): it needs the seed's fixed appointment end of 2026-12-31; carried here without
      the date
      apps/tedrisat/test/e2e/permission-admin.e2e.spec.ts: "changes the group and single permissions, leaving what stays alone"

  - id: a-group-locks-what-it-carries
    need: >-
      Choosing a group ticks and locks the boxes it carries and says where they come from; "Grup yok" frees them; the footer
      counts what the group gives and what is ticked besides; a single permission the group carries is no longer a single one.
    evidence:
      - node: groupSelect
      - node: groupList
      - node: optionGroup
      - node: optionNone
      - node: permAudit
      - node: permInactive
      - node: auditFromGroup
      - node: inactiveFromGroup
      - node: summaryGroup
      - node: summaryPlain
      - source: apps/nizam/features/permissions/components/permission-boxes.tsx:28
      - source: apps/nizam/features/permissions/present.ts:169
      - test: apps/nizam/e2e/permissions.e2e.ts
        name: "nizam/12 — 'İzinleri düzenle' opens with what the person holds, locks the group's boxes and counts them (criteria 1, 2, 6)"
      - test: apps/nizam/test/permissions.spec.tsx
    note: |-
      permissions#6: date-bound too: its first half reads the seeded person's card and end
      apps/nizam/test/permissions.spec.tsx: "the dialog's boxes (nizam 12 criteria 1, 2)"

  - id: change-or-clear-the-end
    need: >-
      The başnazım gives the permissions an end on her own clock, moves it sooner, or empties it. An empty field means "with the
      appointment": a seat that has an end keeps it (the row still says its day) and a seat with none stays endless; the dialog
      says which in its help line. A field she leaves alone sends the stored instant back unchanged.
    evidence:
      - node: endField
      - node: endHelpDated
      - node: endHelpForever
      - state: editing
      - state: appliedEnd
      - node: rowEnd
      - node: rowDaysLeft
      - node: rowForever
      - source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:114
      - source: libs/utils/src/end-instant.ts:141
      - source: apps/nizam/features/permissions/components/permissions-dialog.tsx:282
      - test: apps/nizam/e2e/permissions.e2e.ts
        name: "nizam/12 — an end date after the appointment's, or not in the future, is refused where it is typed (criterion 3)"
      - test: apps/tedrisat/test/e2e/permission-admin.e2e.spec.ts
      - test: libs/utils/test/end-instant.spec.ts
    note: |-
      permissions#8: date-bound; its last step (an end of 15 Aralık and the row saying so) is the one this need carries
      apps/tedrisat/test/e2e/permission-admin.e2e.spec.ts: "a shorter end shows in the list; an empty one falls back to the
      appointment's"

  - id: a-wrong-end-is-said-under-the-field
    need: >-
      An end that is not after now, or is after the appointment's end, is said in words under the field as it is typed, and
      nothing is sent while it stands; the server refuses it too.
    evidence:
      - node: endPastMessage
      - node: endBeyondMessage
      - state: formBlocked
      - node: save
      - source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:114
      - source: apps/nizam/features/permissions/components/permissions-dialog.tsx:289
      - source: libs/utils/src/end-instant.ts:112
      - test: apps/nizam/e2e/permissions.e2e.ts
        name: "nizam/12 — an end date after the appointment's, or not in the future, is refused where it is typed (criterion 3)"
      - test: apps/tedrisat/test/e2e/permission-admin.e2e.spec.ts
    note: |-
      Also drawn as the assertion a-wrong-end-is-never-sent.
      permissions#8: date-bound: it types 2027-01-01 against the seed's 31 Aralık 2026 end
      apps/tedrisat/test/e2e/permission-admin.e2e.spec.ts: "refuses an end after the appointment's, or in the past, and a
      stranger"

  - id: a-wrong-end-is-announced
    need: >-
      A person who cannot see the screen is told, when she types a wrong end, that it is wrong and why "Kaydet" is off, and keeps
      her place in the field.
    missing: "no Linear issue; F-UI-W3-1: the message is a Field error with no role and no live region"
    note: >-
      Drawn on the state formBlocked and on the nodes endPastMessage and endBeyondMessage, which the code has: they are not
      evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-refusal-says-what-is-true-now
    need: >-
      When the server says the person is no longer a Medaris nazımı, or the group is gone, the page reads again, says which, and
      does not leave a dialog open on a person or a group that is no longer there.
    missing: >-
      no Linear issue; EPERM-1, decision D1; the API's refusals exist (MEDARIS_NAZIM_NOT_FOUND, PERMISSION_GROUP_NOT_FOUND), the
      page reads nothing again
    note: >-
      Drawn on the states saving and editing and on the nodes toastGone and toastGroupGone, which the code has: they are not
      evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-save-that-changes-nothing-says-so
    need: >-
      A save with the same group, the same permissions and the same end writes nothing and does not say that the permissions were
      updated.
    missing: no Linear issue; EPERM-2, decision D2
    note: >-
      Drawn on the state saving and on the node toastSaved, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-refusal-keeps-the-form
    need: >-
      A refused save keeps the dialog open with the form as it was, and says the refusal in the sentence of its code; the generic
      sentence is for the codes the page has no sentence for.
    evidence:
      - node: toastFailedTitle
      - node: toastGone
      - node: toastGroupGone
      - node: toastExpiry
      - node: toastForbidden
      - node: toastFailedGeneric
      - state: saving
      - source: apps/nizam/features/permissions/present.ts:365
      - source: apps/nizam/features/permissions/components/permissions-dialog.tsx:155
      - test: apps/nizam/test/permissions.spec.tsx
    note: "apps/nizam/test/permissions.spec.tsx: \"maps the API's codes to a message and falls back to the generic one\""

  - id: the-person-sees-the-change-at-once
    need: >-
      After a save the person's own pages follow her new permissions the next time she reads them: the menu, the home's cards and
      "İzinleriniz" show what she holds now and nothing she lost.
    evidence:
      - state: appliedEnd
      - source: apps/tedrisat/src/assignment/me-assignments.controller.ts:72
      - source: apps/nizam/components/shell/nizam-shell.tsx:87
      - test: apps/nizam/e2e/dashboard.e2e.ts
        name: "nizam/05 — a Medaris nazımı sees only the sections their permissions open, and their own permissions (criteria 1, 2, 3, 4, 6)"
    note: "dashboard#8: carried by nizam.home.medarisNazimCut, which this flow starts with granted: some"

  - id: a-medaris-nazim-cannot-edit-grants
    need: >-
      Only the başnazım changes what a Medaris nazımı holds: a Medaris nazımı, whatever she holds, meets "Bu bölüm için izniniz
      yok" on the page and 403 from the API.
    evidence:
      - state: no_access
      - state: reading
      - source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:114
      - source: apps/nizam/app/medaris-nazimlari/page.tsx:28
      - test: apps/nizam/e2e/permissions.e2e.ts
        name: "nizam/11 — a Medaris nazımı gets the 'izniniz yok' screen on both pages, not the list (criterion 4)"
      - test: apps/tedrisat/test/e2e/permission-admin.e2e.spec.ts
    note: >-
      apps/tedrisat/test/e2e/permission-admin.e2e.spec.ts: "answers anyone but the başnazım with 403, a Medaris nazımı included"

  - id: the-dialog-starts-on-the-work
    need: >-
      The dialog opens on the group select (or the first thing to decide), not on the header's close icon, so a keyboard user
      starts where the work is.
    missing: no Linear issue; F-W2-12
    note: >-
      Drawn on the nodes dialog, closeIcon and groupSelect, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: the-table-shows-the-hour
    need: The table's end cell says the hour the permissions end at, not only the day, as the dialog's field does.
    missing: no Linear issue; EPERM-4 (the same as CNP-2 of nazar's table)
    note: >-
      Drawn on the node rowEnd, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves
      out what only missing needs name).

  - id: the-count-is-announced
    need: A person who ticks or unticks a box hears the new count of permissions.
    missing: no Linear issue; the footer's meta line is not a live region (the same as CNP-4 of nazar's ders nazırı dialog)
    note: >-
      Drawn on the nodes summaryGroup and summaryPlain, which the code has: they are not evidence, so that a replay still walks
      them (SPEC.md §13 leaves out what only missing needs name).

  - id: the-checks-do-not-expire
    need: >-
      The e2e checks of this story derive the appointment's end and the typed days from the clock, so they pass after 2026-12-31.
    missing: >-
      no Linear issue; F-W2-7, F-X-20: permissions#6, #7 and #8 use the seed's fixed 2026-12-31 end; this flow's walk makes its
      own seat
    note: >-
      Drawn on the nodes endHelpDated and endBeyondMessage, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).
