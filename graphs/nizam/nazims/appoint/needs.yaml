  - id: kaydet-says-why-it-is-off
    need: >-
      A person who cannot send the form is told in words what is missing (nobody chosen, an end not ahead), and a keyboard or
      screen-reader user can reach the button and the message. Nothing that blocks them is silent.
    missing: "no Linear issue; MAPPT-1, F-X-3: \"Kaydet\" is natively disabled and the only word is the end's error"
    note: >-
      Drawn on the states asking, searching and pickedBadEnd and on the node save, which the code has: they are not evidence, so
      that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: the-person-is-checked-before-sending
    need: >-
      DECISION OPEN: the dialog warns beside the person chosen, before "Kaydet", when they are a Medaris nazımı already or are the
      başnazım himself, and the API refuses the başnazım's own id, as the ders nazırı dialog of nazar does for its own cases.
      Today the page lets him choose both and only the server's 409 answers the first, after sending; the second is appointed.
    evidence:
      - source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:96
    missing: >-
      no Linear issue; MAPPT-2, MAPPT-3: the routes' order of checks has no self-grant step (ledger/security.md); D1; code exists
      in part
    note: >-
      Drawn on the states picked, pickedBadEnd, appointing and appointed, which the code has: they are not evidence, so that a
      replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: only-a-known-account-is-appointed
    need: >-
      A Medaris nazımı is an account the app or the realm knows, as every other appointment route checks (ders nazırı, medrese
      nazır, köşk grant). The page cannot send an unknown id (it offers only a found account); the API accepts any uuid.
    evidence:
      - source: apps/tedrisat/src/user/users.controller.ts:57
    missing: >-
      no Linear issue; domain invariant medaris-nazim-is-a-known-account (holds: false, finding medaris-nazim-account-unchecked);
      code exists in part
    note: >-
