      - source: apps/nizam/features/permissions/present.ts:365
      - test: apps/nizam/e2e/permissions.e2e.ts
        name: "nizam/12 — appointing finds the person by e-mail in the realm, gives a group, a single permission and an end, and the list shows it (criteria 4, 5)"
      - test: apps/nizam/test/permissions.spec.tsx
      - test: apps/tedrisat/test/e2e/permission-admin.e2e.spec.ts
    note: |-
