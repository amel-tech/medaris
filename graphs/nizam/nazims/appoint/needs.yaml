      permissions beside it and an end, in one step; the appointment and its permissions end together, the footer counts what was
      given ("Gruptan {n} izin ve {m} ek izin"), the appointment is written to the audit log, and the list shows the new row: its
      group, its box, the end, the giver.
    evidence:
      - state: picked
      - state: appointing
      - state: appointed
      - node: groupSelect
      - node: permKoskCreate
      - node: permKoskEdit
      - node: permAudit
      - node: lockedNote
      - node: endField
      - node: summaryNone
      - node: summaryTicked
      - node: summaryGroup
      - node: summaryGroupTicked
      - node: save
      - node: toastAppointed
      - node: toastAppointedBody
      - node: rowGroup
      - node: rowSinglesAfterGroup
      - node: rowEndDate
      - node: rowDaysLeft
      - node: rowEndsToday
      - node: rowGiver
      - source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:96
      - source: apps/nizam/features/permissions/actions.ts:27
      - source: apps/nizam/features/permissions/components/permissions-dialog.tsx:136
      - test: apps/nizam/e2e/permissions.e2e.ts
        name: "nizam/12 — appointing finds the person by e-mail in the realm, gives a group, a single permission and an end, and the list shows it (criteria 4, 5)"
      - test: apps/tedrisat/test/e2e/permission-admin.e2e.spec.ts
    note: |-
      permissions#9: e2e lines 462-487: "Gruptan 4 izin ve 1 ek izin", the dialog closes, the row has the group and the box, the
      grants and the seat in the database, one audit row of each kind; the re-opened edit dialog (lines 489-496) is
      nizam.nazims.editPermissions's
      apps/tedrisat/test/e2e/permission-admin.e2e.spec.ts: :484, post, grants, end, audit, order

  - id: an-end-not-ahead-is-told-where-typed
    need: >-
      An end that is not ahead is said under the end field the moment it is typed, "Kaydet" stays off until it is fixed, and
      nothing is sent; the server refuses it too.
    evidence:
      - state: pickedBadEnd
      - node: endError
      - node: endHelp
      - node: save
      - source: apps/nizam/features/permissions/components/permissions-dialog.tsx:106
      - source: libs/utils/src/end-instant.ts:128
      - test: libs/utils/test/end-instant.spec.ts
      - test: apps/nizam/e2e/permissions.e2e.ts
        name: "nizam/12 — an end date after the appointment's, or not in the future, is refused where it is typed (criterion 3)"
    note: |-
