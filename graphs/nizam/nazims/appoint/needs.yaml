      apps/nizam/test/permissions.spec.tsx: :337, the API's codes to the messages
      apps/tedrisat/test/e2e/permission-admin.e2e.spec.ts: :550, the 409, a past end, an unknown code and a non-platform group at
      the API

  - id: a-refusal-is-announced
    need: >-
      A refusal and an answer under a field ("no account", "not available", the end) are announced to a screen reader and the
      focus goes to what the person must correct.
    missing: "no Linear issue; F-UI-W3-1: the Field error has no live region and the focus stays where it was"
    note: >-
      Drawn on the nodes pickerNotFound, pickerDown, endError and toastFailed, which the code has: they are not evidence, so that
