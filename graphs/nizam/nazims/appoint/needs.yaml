      described by its lead line, not by its whole body.
    missing: "no Linear issue; F-W2-12, F-W2-13: the dialog opens on its close icon and describes itself by every field"
    note: >-
      Drawn on the nodes dialog, closeIcon and pickerField, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: the-appointed-person-gets-the-cut-home
    need: >-
      The person appointed opens Nizam and finds a menu, a home and numbers cut to exactly what she was given, and, with nothing
      given, a home that says so. The başnazım's own home and menu are not the same page.
    evidence:
      - state: appointed
      - state: handed_over.cut
      - source: apps/nizam/features/dashboard/components/medaris-home.tsx:349
      - test: apps/nizam/e2e/dashboard.e2e.ts
        name: "nizam/05 — a Medaris nazımı sees only the sections their permissions open, and their own permissions (criteria 1, 2, 3, 4, 6)"
    note: >-
      dashboard#8: nizam.home.medarisNazimCut carries it; this flow starts that flow (granted: some, or none for an appointment
      with nothing)

  - id: a-ceiling-on-what-a-medaris-nazim-may-give
    need: >-
      DECISION OPEN (the owner's reading is awaited): a permission that lets a Medaris nazımı give permissions to others ("Medrese
      nazırına izin ver") can carry a ceiling on what she may give, set by the başnazım when he appoints her, so that giving on is
      never wider than the başnazım meant. Today the dialog offers no ceiling, and its audit note says only that she cannot give
      on what she was given.
    missing: >-
      MDRS-209; P-16, "Cap what a Medaris nazımı may give": status Ready to Test in Linear, no screen found in this dialog
    note: >-
      Drawn on the nodes auditNote and groupSelect, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).
