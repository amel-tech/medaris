schema: delurio-graph/0
kind: needs
id: nizam.nazims.appoint
status: proposed
summary: >-
  What must exist for the başnazım to read who is in office as a Medaris nazımı and to appoint one, give them a ready group and
  single permissions and an end: the flow's product list. Each need is what the product must do, from the flow's story (FLOWS.md),
  the inventory's findings (F-W2-1, F-W2-3, F-W2-7, F-W2-11, F-W2-12, F-X-14) and the flow's own (MAPPT-1 to MAPPT-10), not from
  what the page does today. Planned in planned.md: P-16 (a ceiling on what a Medaris nazımı may give, MDRS-209) is this flow's;
  P-15 (MDRS-201, adopt, edit or drop what a removed nazım gave) is the dismissal's, and P-17 (MDRS-226, group the course
  permissions) the groups page's.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# For the orchestrator's gaps merge (nothing here was replayed; the e2e checks, the API's e2e and the unit specs named under `walked` are the only
# runs, and the replay scenarios of binding.yaml and binding.groupGone.yaml are written and not run):
# missing:  lookup-only-on-request (none), kaydet-says-why-it-is-off (none), a-refusal-is-announced (none), the-dialog-opens-on-its-field
# (none), the-person-is-checked-before-sending (none), only-a-known-account-is-appointed (none),
# a-ceiling-on-what-a-medaris-nazim-may-give (MDRS-209)
# unwalked: an-empty-office-says-so (a unit spec only), an-end-not-ahead-is-told-where-typed (unit specs and the edit dialog's e2e, permissions#8;
# no web e2e of the appoint dialog), a-refusal-keeps-the-dialog (the API's own e2e; the replay scenarios `already` and `groupGone`
# are written and not run)

needs:
  - id: read-who-is-in-office
    need: >-
      The başnazım reads, in one list, who holds the Medaris nazımı seat now: each person by name and address, the groups and the
      single permissions they hold, when it ends, who gave it and on what day. A person whose end has passed is not listed.
    evidence:
      - state: listed
      - node: rosterTable
      - node: rowPerson
      - node: rowAddress
      - node: seedGrants
      - node: rowNever
      - node: rowGiver
      - node: rowGiverDay
      - node: count
      - source: apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:81
      - source: apps/nizam/features/permissions/components/nazims-view.tsx:236
      - test: apps/nizam/e2e/permissions.e2e.ts
        name: "nizam/11 — the list shows who is in office, in order, with their groups, single permissions, end and giver (criteria 1, 2, 3)"
      - test: apps/nizam/test/permissions.spec.tsx
      - test: apps/tedrisat/test/e2e/permission-admin.e2e.spec.ts
    note: |-
      permissions#1: e2e lines 104-138: the rows, their groups and singles, the giver; the fixed dates ("31 Aralık 2026", line
      127) and the seed's three people in order are the stale part, F-W2-7, not carried
      apps/nizam/test/permissions.spec.tsx: :485-530, the rows, the chips, the giver and the two buttons
      apps/tedrisat/test/e2e/permission-admin.e2e.spec.ts: :484, the API's list in order, with its groups and singles

  - id: an-end-is-warned-about-in-days
    need: >-
      The list says "Süresiz" for no end and the day for an end, and warns in words, "Bugün bitiyor" or "{n} gün kaldı", when the
      end is inside 30 days, so the başnazım sees what is about to lapse; counted in calendar days in the viewer's zone, never a
      negative number.
    evidence:
      - node: rowNever
      - node: rowEndDate
      - node: rowDaysLeft
      - node: rowEndsToday
      - source: apps/nizam/features/permissions/present.ts:95
      - test: apps/nizam/e2e/permissions.e2e.ts
        name: "nizam/11 — the list shows who is in office, in order, with their groups, single permissions, end and giver (criteria 1, 2, 3)"
      - test: apps/nizam/test/permissions.spec.tsx
    note: |-
      permissions#1: e2e lines 132-135: "Süresiz" and the days-left assertion on the second person ("1[34] gün kaldı", which
      depends on the seed's own dates, not on today)
      apps/nizam/test/permissions.spec.tsx: :116-150, the calendar days, "Süresiz", the date, the warning within thirty days,
      never negative

  - id: an-empty-office-says-so
    need: >-
      A list with nobody in office says "Henüz görevde Medaris nazımı yok." and still offers "Medaris nazımı ata"; a list that
      cannot be read says so with "Yeniden dene" and does not draw a table.
    evidence:
      - node: emptyLine
      - state: loadFailed
      - node: loadFailedAlert
      - node: retry
      - source: apps/nizam/features/permissions/components/nazims-view.tsx:241
      - test: apps/nizam/test/permissions.spec.tsx
    note: >-
      apps/nizam/test/permissions.spec.tsx: :543, the empty line and the error state; no e2e (the stack's own Medaris nazımı is
      always in office)

  - id: find-by-exact-address
    need: >-
      The başnazım finds the person by their exact e-mail address in the realm's directory, which holds people who never opened
      the app, sees who was found by name and address before doing anything, and is told when no account has the address and when
      the directory does not answer; nobody is chosen from an address that was not found.
    evidence:
      - state: asking
      - state: searching
      - state: picked
      - node: pickerField
      - node: pickerNotFound
      - node: pickerDown
      - node: searchingStatus
      - node: chosenRegion
      - node: chosenName
      - node: chosenAddress
      - node: removePerson
      - source: apps/tedrisat/src/user/users.controller.ts:57
      - source: apps/nizam/features/permissions/components/nazim-picker.tsx:39
      - test: apps/nizam/e2e/permissions.e2e.ts
        name: "nizam/12 — appointing finds the person by e-mail in the realm, gives a group, a single permission and an end, and the list shows it (criteria 4, 5)"
    note: >-
      permissions#9: e2e lines 445-460: "Bu e-posta adresiyle kayıtlı bir hesap bulunamadı." and "Kaydet" off, then the person
      found and "Kaydet" on; the e2e uses the seeded köşk nazımı, the walk a spare applicant

  - id: lookup-only-on-request
    need: >-
      A person's address is searched in the realm only when the başnazım asks (Enter or a button), never because they tabbed
      through the field or pressed "Vazgeç" with an address in it, since every search is written to the audit log; the result is
      announced and the focus is kept.
    missing: "no Linear issue; F-X-14, F-W2-3, F-X-8: the field searches on blur and is disabled while it does"
    note: >-
      Drawn on the state searching and on the node searchingStatus, which the code has: they are not evidence, so that a replay
      still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: appoint-with-a-group-boxes-and-an-end
    need: >-
