  editButton: { type: action, component: Button, role: button, intent: secondary, name: { key: NazimsPage.editLabel, params: { name: nazim.name } }, text: { key: NazimsPage.edit }, in: [listed, appointed], when: "roster == 'some' or state == 'appointed'", repeat: nazims.items, emits: EDIT_ROW, source: apps/nizam/features/permissions/components/nazims-view.tsx:176 } # an outline button named after the person (F-W2-11: "İzinleri düzenle: " when the person has no name)
  dismissButton: { type: action, component: Button, role: button, intent: dismiss, name: { key: NazimsPage.dismissLabel, params: { name: nazim.name } }, text: { key: NazimsPage.dismiss }, in: [listed, appointed], when: "roster == 'some' or state == 'appointed'", repeat: nazims.items, emits: DISMISS_ROW, source: apps/nizam/features/permissions/components/nazims-view.tsx:185 } # a ghost button, always on whatever the person's end (MDRS-215)

