edges:
  - { labelledBy: [dialog, dialogTitle] }
  - { labelledBy: [listRegion, listHeading] }
  - { labelledBy: [chosenRegion, chosenTitle] }
  - { triggers: [appointButton, asking] }
  - { triggers: [save, appointing] }
  - { returnsFocus: [dialog, appointButton] } # Base UI returns the focus to the element that had it when the dialog opened: the page's "Medaris nazımı ata" button, which outlives the refresh (not verified in a browser)

rules:
  - { id: focus-not-set, rule: "No code of app/medaris-nazimlari or features/permissions sets the focus when the page opens, when a toast shows or when a row appears; the dialog's focus and Base UI's return of it are the only moves. The page node has no `initialFocus`. Not verified in a browser." }
  - { id: F-W2-12, rule: "permissions-dialog.tsx passes no `initialFocus` to Dialog (libs/ui/src/mds/dialog.tsx:138 gives Base UI `undefined` for a form), so the dialog opens on the first thing it can focus: the close icon in its header, not the e-mail field; a keyboard user starts on 'Kapat' and the picker is the second stop. The graph draws `initialFocus: closeIcon`, from the code. Fix: pass the picker's input as `initialFocus` (the other dialogs of the app do)." }
  - { id: F-W2-3, rule: "The e-mail lookup has no button; the input is `disabled` while it searches (nazim-picker.tsx:94), so the focused field loses the focus, and nothing says the search finished except a hidden <output> for the success; 'not found' and 'failed' are a Field error that is not a live region (F-UI-W3-1). Fix: a visible 'Ara' button, keep the input enabled with aria-busy, announce the result with role=status." }
  - { id: F-X-14, rule: "The address is searched on Enter and also when the field is left (`onBlur`, nazim-picker.tsx:103), and tedrisat writes every search, found or not, to the audit log; the help line says searches are audited. Tabbing through the field, or pressing 'Vazgeç' with an address typed in it (the blur comes before the click), makes audited searches nobody asked for. Fix: search on Enter or on an explicit button only (decision D2)." }
  - { id: F-UI-W3-1, rule: "Field's error element has no role=alert and no live region (libs/ui/src/mds/field.tsx:51-53): 'Bu e-posta adresiyle kayıtlı bir hesap bulunamadı.', 'Arama şu an yapılamıyor.' and 'Bitiş zamanı şu andan sonra olmalı.' are read only if the focus moves to the field. Fix: role=alert in the kit's Field error, or move the focus to the field." }
  - { id: F-W2-1, rule: "The boxes offer permissions whose pages a Medaris nazımı's menu has no entry for (Pasif kapsamları yönet, YouTube bağlantısını yönet, Platform politikalarını değiştir, Ortak uygulamaları yönet, İtirazı karara bağla, Denetim kaydını oku: lib/shell-nav.ts:178-186 has none of them), so the başnazım can give a permission the person can only use by an address (F-X-12). Fix: add the entries, or drop the permissions from the dialog until they have one." }
  - { id: F-W2-7, rule: "e2e permissions#1 asserts a fixed end ('31 Aralık 2026') and the seed's lapsed appointment; after 2026-12-31 it fails. The graph carries the code's behaviour (the end label counts days from today) and the replay's data compute their days from now. Not copied: the fixed date." }
  - { id: F-W2-11, rule: "A row whose person has no name (`user.name` null) gets the buttons 'İzinleri düzenle: ' and 'Görevden al: ' with an empty name (`n.user.name ?? ''`, nazims-view.tsx:180,188), while the person's own cell says 'Adı bilinmiyor'. Fix: fall back to the address or 'Adı bilinmiyor'." }
  - { id: F-X-8, rule: "'Seçimi kaldır' removes itself (the chosen block unmounts, nazim-picker.tsx:111-146) and the focus is not moved; the e-mail field comes back empty and a found person replaces the field with nothing moving the focus. Fix: focus the field after a removal and the chosen block's heading after a pick." }
  - { id: F-W2-13, rule: "Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:103-112), so the dialog's description is the picker, the group, nineteen boxes with their help and the end field; a reader of the screen may read all of it when it opens. Fix: describe the dialog by one line only." }
  - { id: MAPPT-1, rule: "New. 'Kaydet' is natively disabled (`disabled={!canSave}`, permissions-dialog.tsx:193) until a person is chosen and the end has no problem, and nothing says why when nobody is chosen: a keyboard user's Tab skips it, the form cannot be sent by Enter, and no line names the step. With an end in the past the field's error says what is wrong but is not tied to the button. The family of F-X-3. Fix: keep it enabled and say 'Önce bir kişi bulun' when it is pressed, or tie the reason to it with aria-describedby (decision D3)." }
  - { id: MAPPT-2, rule: "New, security-adjacent, for the owner. Nothing stops the başnazım from choosing his own address and being appointed a Medaris nazımı: the picker does not know the viewer, and POST /nizam/medaris-nazims has no self-grant check (apps/tedrisat/src/assignment/admin/permission-admin.controller.ts:96 injects no SelfGrantGuard; SYSTEM_ADMIN is never asked) and no check that the person is not the caller. The list then has a row for him, appointed by himself. A seat for the başnazım does nothing (the chief variant of the shell wins) and dismissing it would ask an answer for every role and permission he has ever given, where 'Düşür' revokes them (permission-admin.repository.ts:233, :572-592). Not walked: the stack's başnazım is not made a Medaris nazımı. The köşk routes order the checks the other way round (self-grant before the permission check; ledger/security.md). Fix: refuse the caller's own id, or say so beside the person (decision D1)." }
  - { id: MAPPT-3, rule: "New. The page holds the list of who is in office and still lets the başnazım choose a person who is a Medaris nazımı already: found and chosen like anyone, 'Kaydet' on, and only the server's 409 MEDARIS_NAZIM_ALREADY_APPOINTED, a sticky toast 'Bu kişi zaten Medaris nazımı.', says so after sending. The ders nazırı dialog of nazar warns beside the person before sending. Fix: compare the person's id with the list (decision D1)." }
  - { id: MAPPT-4, rule: "New. Text that cannot be an address is neither searched nor told: `search()` returns without a word when `isEmailLike` fails (nazim-picker.tsx:41), so Enter on 'kimse' does nothing, and 'Kaydet' stays off with nothing said. The same address is not searched twice in a row (`searched.current`), so a 'not found' answered once is not repeated either. Fix: say 'Geçerli bir e-posta adresi yazın.' on Enter and on blur." }
  - { id: MAPPT-5, rule: "New. The footer's count ('0 izin', '1 izin', 'Gruptan 2 izin ve 1 ek izin') is a plain <p class=mds-dialog__meta> (libs/ui/src/mds/dialog.tsx:115), not a live region: ticking a box or choosing a group changes it and a reader of the screen is told nothing. Fix: role=status on it." }
  - { id: MAPPT-6, rule: "New. While the save is on its way 'Vazgeç', the close icon and Esc do nothing (`onOpenChange` ignores a close while `saving`, permissions-dialog.tsx:181) and are neither disabled nor marked; the group, the boxes, the end and 'Seçimi kaldır' are the only controls disabled. Fix: disable them with aria-disabled while it is saving, or let the dialog close and tell the outcome in the toast." }
  - { id: MAPPT-7, rule: "New. The star of 'Medaris nazımı' is aria-hidden and the input carries no `required` (Field `required` only draws the star, libs/ui/src/mds/field.tsx:42-45; nazim-picker.tsx:84-85), so a reader of the screen is never told the field is required. Fix: required and aria-required on the input." }
  - { id: MAPPT-8, rule: "New. The busy word of 'Kaydet' is the kit Button's default `loadingLabel`, the literal 'Yükleniyor' (libs/ui/src/mds/button.tsx:62), written outside the catalogue and the same in every language; the dialog passes none. Fix: pass a catalogue message as `loadingLabel`." }
  - { id: MAPPT-9, rule: "New. `lookupUserByEmail` answers 'unavailable' for every failure but an ended session (features/madrasahs/actions.ts:141), so an address the page's pattern accepts (`^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$`) and the server's validation refuses (a 400) is told as 'Arama şu an yapılamıyor. Biraz sonra yeniden deneyin.', as if the directory were down. Not walked. Fix: tell a 400 as 'Geçerli bir e-posta adresi yazın.'" }
  - { id: MAPPT-10, rule: "New. 'İzin gruplarını düzenle' is a plain `<a href=\"/izin-gruplari\">` inside a modal (permissions-dialog.tsx:246): the browser loads the page anew, the dialog and the person, group, boxes and end typed in it are gone, and no question is asked. Fix: ask first, or open the groups page in a new tab (and say so)." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'İzinleri düzenle' in 'İzinleri düzenle: {name}' and 'Görevden al' in 'Görevden al: {name}' (WCAG 2.5.3). The close icon and 'Seçimi kaldır: {name}' are icon buttons with no visible text. Holds." }
  - { id: no-default-accept, rule: "The dialog's initial focus is the close icon (or, were the e-mail field given it, that field), not 'Kaydet': a keyboard user cannot appoint by pressing Enter on arrival, and Enter in the e-mail field searches and does not send the form (nazim-picker.tsx:60-65). Holds." }
