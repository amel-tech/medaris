  rowDaysLeft: { type: text, component: Text, text: { key: NazimsPage.daysLeft, params: { count: new.daysLeft } }, in: [appointed], when: "until == 'soon'", source: apps/nizam/features/permissions/components/nazims-view.tsx:147 } # data-testid=days-left, within 30 days (WARN_DAYS, present.ts:88)
  rowEndsToday: { type: text, component: Text, text: { key: NazimsPage.endsToday }, in: [appointed], when: "until == 'today'", source: apps/nizam/features/permissions/components/nazims-view.tsx:146 }
  rowGiver: { type: text, component: Text, text: { key: composed.NazimsPage.giver, params: { giver: giver.name } }, in: [listed, appointed], when: "roster == 'some' or state == 'appointed'", repeat: nazims.items, source: apps/nizam/features/permissions/components/nazims-view.tsx:160 }
