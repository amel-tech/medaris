  summaryGroup: { type: text, component: Text, text: { key: PermissionsDialog.summaryGroup, params: { fromGroup: group.size, extra: ticked.none } }, in: [asking, searching, picked, pickedBadEnd, appointing], when: "group == 'chosen' and ticks == 'none'", source: apps/nizam/features/permissions/components/permissions-dialog.tsx:171 } # "Gruptan 2 izin ve 0 ek izin"
  summaryGroupTicked: { type: text, component: Text, text: { key: PermissionsDialog.summaryGroup, params: { fromGroup: group.size, extra: ticked.one } }, in: [asking, searching, picked, pickedBadEnd, appointing], when: "group == 'chosen' and ticks == 'some'", source: apps/nizam/features/permissions/components/permissions-dialog.tsx:171 } # "Gruptan 2 izin ve 1 ek izin" (e2e permissions#9)
