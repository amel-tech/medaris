# The screens of nizam.nazims.appoint: "Medaris nazımları" (/medaris-nazimlari) with its table, and the "Medaris nazımı ata" dialog over it. Read
# from apps/nizam/features/permissions/components/{nazims-view,permissions-dialog,nazim-picker,permission-boxes}.tsx and libs/ui/src/mds (app-shell,
# dialog, field, select, checkbox, table, alert, button) on 15 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nizam.json (namespaces
# NazimsPage, PermissionsDialog, NazimPicker, PermissionsPage, PermissionCatalog), key for key. Nothing was walked in a browser (from the code).
#
# The page behind the dialog is drawn only where the dialog is closed: the dialog is modal, so the page is inert while it is open. The table's rows
# are data. The graph draws two kinds of row: the stack's own Medaris nazımı (Selma, five single permissions, no end), which is there whenever
# `roster == 'some'`, and the new person's row, in `appointed`. The nodes marked `repeat` are the cells every row has (a person, an address, who
# gave it, the two buttons): the replay finds one or more. The nodes that say what a row holds or when it ends are one row's, and the binding
# scopes them to that person's row.
#
# What the graph draws of a form of nineteen boxes. The dialog draws the platform catalogue (19 codes in five sections: Köşkler, Medreseler,
# Talepler ve desteler, Yasak ve cihaz, Denetim ve ayarlar); the graph draws the five section headings and the three boxes the walk touches: the two
# the group carries ("Köşk aç ve köşk nazımını seç", "Köşkü düzenle, gizle ya da geri al": ticked and locked once the group is chosen) and the one it
# ticks ("Denetim kaydını oku", e2e permissions#9). The other sixteen are boxes like them; `world: open` leaves them out. The help line under each
# box is not drawn; the note "Gruptan gelir." that replaces it under a locked box is.
#
# Composed text (built in code, in no i18n file), each a value the page puts in a place that has no message of its own:
#   composed.NazimsPage.person       a person's name: the row header (nazims-view.tsx:74) and the chosen block (nazim-picker.tsx:123)
#   composed.NazimsPage.address      a person's address, a <bdi dir=ltr> (nazims-view.tsx:78; nazim-picker.tsx:127)
#   composed.NazimsPage.groupBadge   a group's name in its badge, the words "grubu" follow in a hidden span (nazims-view.tsx:104)
#   composed.NazimsPage.singles      the short sentences of the single permissions, joined with ", " (nazims-view.tsx:121; the key `short` of
#                                    PermissionCatalog is in the catalogue and is not copied)
#   composed.NazimsPage.endDate      the day of the end, as formatDay writes it in the viewer's zone (nazims-view.tsx:142, present.ts:34)
#   composed.NazimsPage.giver        the giver's name (nazims-view.tsx:160)
#   composed.NazimsPage.giverDay     the day of the appointment (nazims-view.tsx:162)
#   composed.PermissionsDialog.busy  "Yükleniyor": the word the kit's Button writes in its hidden status while it is busy, `loadingLabel`'s default
#                                    (libs/ui/src/mds/button.tsx:62); the dialog passes none, so the word is not a catalogue message (MAPPT-8)
# The one message not authored here is none: `changes` is the page's own intro line, which says what a Medaris nazımı is (NazimsPage.intro).
#
# Samples are what the page prints for the person the walk appoints; the replay reads the binding's own values (the spare account's name and
# address, the group, the days) and matches any text where it has none.
schema: delurio-graph/0
kind: ui
id: nizam.nazims.appoint
flow: nizam.nazims.appoint
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: NazimsPage.intro } # "Medaris nazımı yalnız sizin verdiğiniz izinlerle çalışır ve Nizam’da yalnız o bölümleri görür. Süresi dolan izin kendiliğinden düşer."
samples:
  name: Betül Başvuran
  email: e2e-basvuran-e@medaris.test
  group: Deneme grubu nzappt
  list: Denetim kaydını oku
  date: 20 Kasım 2026
  giver: Vedat Başnazım
  day: 15 Kasım 2026
  count: "5"
  fromGroup: "2"
  extra: "1"

# The page sets no focus of its own on load (nothing in features/permissions or app/medaris-nazimlari does), so there is no `initialFocus` on
# the page and no `focus`. The dialog has no `initialFocus` either: Base UI's default is the first thing it can focus, the close icon (F-W2-12).
nodes:
  # ---- the page, the dialog closed ---------------------------------------------------------------------------------------------
  page: { type: page, component: Page, role: main, in: [listed, appointed, loadFailed], source: libs/ui/src/mds/app-shell.tsx:41 } # the shell's one <main id="main">, with no name; the page's own root is <div data-testid=nazims>
  title: { type: text, component: Heading, role: heading, text: { key: NazimsPage.title }, in: [listed, appointed, loadFailed], source: apps/nizam/features/permissions/components/nazims-view.tsx:205 } # h1
  intro: { type: text, component: Text, text: { key: NazimsPage.intro }, in: [listed, appointed, loadFailed], source: apps/nizam/features/permissions/components/nazims-view.tsx:206 }
  appointButton: { type: action, component: Button, role: button, intent: confirm, text: { key: NazimsPage.appoint }, in: [listed, appointed], emits: OPEN_APPOINT, source: apps/nizam/features/permissions/components/nazims-view.tsx:208 } # primary, with a plus icon; natively disabled when the catalogue or the groups did not load; it stays after an appointment, so the focus has somewhere to return, and pressing it opens the dialog again, which the graph does not draw twice (`appointed` has no transition for it)

  listRegion: { type: page, component: Page, role: region, name: { labelledBy: listHeading }, in: [listed, appointed, loadFailed], source: apps/nizam/features/permissions/components/nazims-view.tsx:217 } # <section aria-labelledby="nazims-heading">
  listHeading: { type: text, component: Heading, role: heading, text: { key: NazimsPage.heading }, in: [listed, appointed, loadFailed], source: apps/nizam/features/permissions/components/nazims-view.tsx:219 } # h2 "Görevde"
  count: { type: text, component: Text, text: { key: NazimsPage.count, params: { count: nazims.count } }, in: [listed, appointed], source: apps/nizam/features/permissions/components/nazims-view.tsx:223 } # data-testid=nazim-count: "1 kişi", then "2 kişi" after an appointment

  loadFailedAlert: { type: alert, component: Alert, role: alert, text: { key: NazimsPage.loadFailedTitle }, in: [loadFailed], source: apps/nizam/features/permissions/components/nazims-view.tsx:229 } # an error Alert: announced; no table is drawn
  loadFailedText: { type: text, component: Text, text: { key: NazimsPage.loadFailed }, in: [loadFailed], source: apps/nizam/features/permissions/components/nazims-view.tsx:230 }
  retry: { type: action, component: Button, role: button, intent: secondary, text: { key: NazimsPage.retry }, in: [loadFailed], emits: RETRY, source: apps/nizam/features/permissions/components/nazims-view.tsx:231 }

  # the table, named by its caption, which is visually hidden: the empty line, or a row per appointment
  rosterTable: { type: list, component: List, role: table, name: { key: NazimsPage.caption }, in: [listed, appointed], source: apps/nizam/features/permissions/components/nazims-view.tsx:236 }
  emptyLine: { type: text, component: Text, text: { key: NazimsPage.empty }, in: [listed], when: "roster == 'empty'", source: apps/nizam/features/permissions/components/nazims-view.tsx:241 } # a cell spanning the columns
  rowPerson: { type: text, component: Text, role: rowheader, text: { key: composed.NazimsPage.person, params: { name: nazim.name } }, in: [listed, appointed], when: "roster == 'some' or state == 'appointed'", repeat: nazims.items, source: apps/nizam/features/permissions/components/nazims-view.tsx:74 } # the <th scope=row>: an avatar (decorative) and the name; "Adı bilinmiyor" when the person has none
  rowAddress: { type: text, component: Text, text: { key: composed.NazimsPage.address, params: { email: nazim.email } }, in: [listed, appointed], when: "roster == 'some' or state == 'appointed'", repeat: nazims.items, source: apps/nizam/features/permissions/components/nazims-view.tsx:78 }
  seedGrants: { type: text, component: Text, text: { key: composed.NazimsPage.singles, params: { list: seed.list } }, in: [listed, appointed], when: "roster == 'some'", source: apps/nizam/features/permissions/components/nazims-view.tsx:121 } # the stack's own nazımı: five single permissions, in the catalogue's order, no group (data-testid=single-permissions)
  rowNoGrants: { type: text, component: Text, text: { key: NazimsPage.noGrants }, in: [appointed], when: "group == 'none' and ticks == 'none'", source: apps/nizam/features/permissions/components/nazims-view.tsx:97 } # "İzin verilmemiş": a person appointed holding nothing
  rowGroup: { type: text, component: Text, text: { key: composed.NazimsPage.groupBadge, params: { group: group.name } }, in: [appointed], when: "group == 'chosen'", source: apps/nizam/features/permissions/components/nazims-view.tsx:103 } # a secondary badge with a key icon; "grubu" follows in a visually hidden span
  rowSingles: { type: text, component: Text, text: { key: composed.NazimsPage.singles, params: { list: new.list } }, in: [appointed], when: "group == 'none' and ticks == 'some'", source: apps/nizam/features/permissions/components/nazims-view.tsx:121 }
  rowSinglesAfterGroup: { type: text, component: Text, text: { key: NazimsPage.andPermissions, params: { list: new.list } }, in: [appointed], when: "group == 'chosen' and ticks == 'some'", source: apps/nizam/features/permissions/components/nazims-view.tsx:120 } # "ve Denetim kaydını oku"
  rowNever: { type: text, component: Text, text: { key: NazimsPage.never }, in: [listed, appointed], when: "roster == 'some' or (state == 'appointed' and until == 'none')", source: apps/nizam/features/permissions/components/nazims-view.tsx:138 } # "Süresiz": the stack's own nazımı, and the new one when no end was typed
