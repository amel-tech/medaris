# The screens of nizam.nazims.dismiss: Medaris nazımları (/medaris-nazimlari) as far as its "Görevden al" row buttons go, and the dialog "Görevden al" over it. Read from
# apps/nizam/features/permissions (nazims-view.tsx, dismiss-dialog.tsx, present.ts) on 15 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nizam.json
# and common.json, key for key. Four messages are not in an i18n file; the catalog keeps them under `composed.` with the code that builds each:
#   composed.DismissDialog.eyebrow  "{name}"      the person's name above the dialog's title, a <p class=mds-eyebrow> that holds the value alone (dismiss-dialog.tsx:157)
#   composed.NazimsPage.personName  "{name}"      the name in the row header cell (nazims-view.tsx:74); not drawn, the replay never needs it
#   composed.Shell.buttonBusy       "Yükleniyor"  the hidden <output> of a busy button, a default of the kit (libs/ui/src/mds/button.tsx:62), not a message of the app
# `Changes.note` is the one message authored here: no message of the app says all that a dismissal changes (DismissDialog.answersNote covers the answers,
# dismissedBody the end of the seat), so one factual set of sentences was written; each claim is from permission-admin.repository.ts:565-700 (the transaction,
# the audit row, the orphaned grants), permission-admin.controller.ts:150 ("No notification or mail") and the re-appointment (appoint revokes what an earlier seat left).
# The toasts are Sonner's, not the kit's toaster: `toast` of libs/ui/src/components/sonner.tsx (a success closes after 6 s, an error stays until closed). A Sonner toast
# is one element, <li data-sonner-toast>, with the title in [data-title] and the description in [data-description], and no role.
# Where a node says "repeat", the page draws it once per item; the replay finds the items through the binding.
