rules:
  - { id: focus-not-set, rule: "Nothing in features/permissions moves the focus when the roster loads, so the page has no initialFocus; the dialog's focus is on 'Vazgeç' (dismiss-dialog.tsx:160) from the moment it opens, while the list is still being read (permissions#4)." }
  - { id: F-W2-4, rule: "apps/nizam/features/permissions/components/dismiss-dialog.tsx:165: 'Görevden al' is natively disabled until every row has an answer, and the footer carries only 'Görevden alma denetim kaydına yazılır.' (:161): nothing says why it is off, and a natively disabled button is out of the tab order, so a keyboard user cannot reach it to find out. The head dialog's footer does say it ('Her satır için seçim yapılmadan başmüderris değiştirilemez.', assign-head-dialog.tsx:258). Fix: put the same kind of line in this footer, or keep the button reachable (F-X-3)." }
  - { id: F-W2-5, rule: "dismiss-dialog.tsx:217-233 and libs/ui/src/mds/choice-chips.tsx:46: a required either/or answer is two aria-pressed toggle buttons, announced as toggles, switchable off again (back to no answer), and the group is not announced as required; in a list of N rows the 2 x N buttons are all named only Devral or Düşür, the person being in each group's hidden legend ('Köşk nazımı, Dilek Başvuran'), so a list of buttons or voice control cannot tell the rows apart and the e2e has to scope by row (permissions#4 uses given-item). Fix: a radio group per row, with the person in each option's name." }
  - { id: F-W2-10, rule: "dismiss-dialog.tsx:124-128: after a success the dialog closes and the roster is read again; the pressed 'Görevden al: {name}' button is gone with its row, so Base UI's return focus has no target and the focus falls to the document (not verified in a browser). Only the toast tells the result. Fix: move the focus to the table's caption or the next row's button, and say so in the toast." }
  - { id: F-W2-11, rule: "nazims-view.tsx:176-190: a row whose person has no name gets aria-label 'Görevden al: ' and 'İzinleri düzenle: ' with nothing after the colon (n.user.name ?? ''), while the cell itself says 'Adı bilinmiyor'; the dialog's eyebrow and intro are empty for such a person (dismiss-dialog.tsx:157, :171), and the success toast reads ' artık Medaris nazımı değil.'. Fix: fall back to the e-mail or 'Adı bilinmiyor' in all four places." }
  - { id: F-W2-13, rule: "libs/ui/src/mds/dialog.tsx:103-112 (F-UI-W1-1): the dialog is described by its whole body (the intro, the rows, both chips of every row, the notes), so opening it makes a screen reader read all of it as the description before the title's own words settle. Fix: give only the intro paragraph aria-describedby." }
  - { id: NZDIS-1, rule: "New finding, not in the inventory; read from the code, not verified in a browser. dismiss-dialog.tsx:108-122 and actions.ts:22-24 and :56-68: only a success refreshes the page (revalidatePath runs only when the call succeeded, and onDismissed only after it). A dismissal answered MEDARIS_NAZIM_NOT_FOUND (somebody dismissed the person meanwhile; the replay makes it with GONE_ELSEWHERE) shows an error toast 'Görevden alınamadı' with 'Bu kişi artık Medaris nazımı değil.', keeps the dialog open with its answers, and leaves the person's row on the roster; the button can only fail again, and nothing offers to read the list again. The outcome is the one the başnazım wanted, yet it is drawn as a failure that stays until it is closed. Fix: close the dialog and refresh on that code, with a status toast like the success." }
  - { id: NZDIS-2, rule: "New finding. dismiss-dialog.tsx:172-176: while the list is read, the body is two Skeleton bars in a div with aria-busy=true and no role, and Skeleton is aria-hidden (libs/ui/src/mds/skeleton.tsx), so nothing is said or announced, and the intro line above it ('... görevinden alınacak; platform izinleri kalkacak.') already reads as the whole dialog; the Vazgeç button has the focus and 'Görevden al' is off with nothing to say why. The nazar twin has a status 'Yükleniyor' (nazar.nazirs.dismiss). Fix: a status with a hidden word beside the bars." }
  - { id: NZDIS-3, rule: "New finding, not verified in a browser. dismiss-dialog.tsx:151-153: while the call is in flight onOpenChange ignores a close, but DialogClose and the close icon have no disabled state, so Vazgeç, Esc and the close icon do nothing and look as live as before; only 'Görevden al' is busy. The same finding as nazar.nazirs.dismiss DISMISS-2. Fix: disable them while saving." }
  - { id: NZDIS-4, rule: "New finding, from the code, not verified in a browser. dismiss-dialog.tsx:184-237: with no row to answer but a group the person defined (kind GROUP), the dialog draws 'Bu kişinin başkalarına verdiği bir izin ya da rol yok.' and then the <ul data-testid=given-items> with the class of a bordered card and no <li> (list.map over nothing), then the groups section: an empty list element, announced as an empty list by some readers. The graph does not draw it. Fix: draw the <ul> only when list.length > 0." }
  - { id: NZDIS-5, rule: "New finding. permission-admin.controller.ts:150 and orphaned-grants.ts:321: the 409 DISMISS_SEAT_HANDED_ON says 'Dismiss <ids> first', naming the rows that block a Düşür, but the page shows only its own sentence (present.ts:358, 'Düşürdüğünüz görevlerden birinin sahibi başkalarına rol ya da izin vermiş...') and ignores the ids, so the başnazım is told to dismiss 'that person' without being told who, and the dialog has no link to them. Fix: name the person from the response." }
  - { id: NZDIS-6, rule: "New finding, not verified in a browser. The dialog's toasts go through Sonner (dismiss-dialog.tsx:7), as DSC-20 found for tedris-web: the region keeps its English default name 'Notifications alt+T' (sonner's containerAriaLabel is not passed, sonner.tsx:59-76) and is polite although an error stays until it is closed, while the page also mounts the kit's own toaster, which names its region 'Bildirimler'. The success toast is the only message that the dismissal happened, and the focus has left (F-W2-10). Fix: pass containerAriaLabel and move the dialog to the kit's toaster." }
  - { id: toast-stays, rule: "An error toast stays until it is closed (sonner.tsx:21 and :46), so after a refusal it is still on the screen when the dialog is closed and when it is opened again; the graph keeps `last` until the next outcome replaces it, and does not draw two toasts side by side (a second refusal stacks a second toast). A success closes after six seconds, which a replay may not wait for." }
  - { id: scrim-does-not-close, rule: "A click on the scrim does not close the dialog (a form dialog sets disablePointerDismissal, libs/ui/src/mds/dialog.tsx:126), so a stray click does not lose the answers; Esc and Vazgeç do close it (permissions#4). Holds." }
  - { id: no-date-gate, rule: "permissions#3 and #4 are still titled 'after the gate' and pin the browser's clock (2026-10-02, 2026-10-05): the 4 Ekim 2026 version gate is gone (MDRS-215) and nothing in nazims-view.tsx or dismiss-dialog.tsx reads a date, so 'Görevden al' is on every row today. The graph carries the code's behaviour and pins no clock." }
  - { id: label-in-name, rule: "The row button's visible text 'Görevden al' is contained in its accessible name 'Görevden al: {name}' (WCAG 2.5.3), and the dialog's own 'Görevden al' (title and submit) is named by its text. Holds; the e2e needs exact: true to tell the submit from the row buttons." }
  - { id: confirm-with-consequences, rule: "The dismissal asks once, in a dialog that lists what the person handed on, with the focus on 'Vazgeç'; the button stays off until every row is answered, and nothing is written until 'Görevden al' (permissions#4, #5). Holds." }
