  reason: Halkamız yüz yüze yürüyor; ders verecek hocalarımız ve okunacak metinlerimiz belli.
  email: e2e-basvuran-c@medaris.test
  phone: +90 532 000 00 01
  rejectReason: Aynı alanda başka bir köşk var.

