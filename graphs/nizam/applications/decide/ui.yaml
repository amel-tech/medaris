rules:
  - { id: F-W3-5, rule: "The tabs 'Bekleyen' and 'Karara bağlanan' are `Tabs mode=tabs` with no `TabsPanel` (applications-view.tsx:381-398): the tablist controls no panel, and a tab switch changes the list and the detail below with no announcement and no move of the focus. Fix: wrap the list in a TabsPanel, or use links; add a status line '{n} başvuru'." }
  - { id: F-X-1, rule: "The family of F-W3-5: Tabs with no TabsPanel in six pages of nizam (libs/ui/src/mds/tabs.tsx:52-125)." }
  - { id: F-W3-7, rule: "The page selects an application on its own and so reads its applicant's e-mail and telephone, which tedrisat writes to the audit log (`kosk_application.contact_read`, kosk-application-review.service.ts:121): opening the list audits a read of personal data nobody asked for, and the line that says so ('İletişim bilgilerini görmeniz denetim kaydına yazılır.') appears under the details after the read it describes. Fix: select nothing until the reader chooses a row, or read the details behind an explicit 'Göster'." }
  - { id: APPDEC-2, rule: "New: F-W3-7 is wider than the first load. Every change of the selected application reads and audits the contact details of the one it lands on: after each decision the page selects the next waiting one (settle, applications-view.tsx:152), and every tab switch selects the first row of the tab (changeTab, :117). A reader who refuses ten applications in a row writes ten contact reads of people they never opened." }
  - { id: F-W3-8, rule: "Opening a köşk from an application is two writes (POST /kosks in the form, then POST /nizam/kosk-applications/{id}/approve here, applications-view.tsx:164-176). When the second fails the köşk exists, the form is closed, the toast says 'Karar kaydedilemedi' and nothing says the köşk was made; the application still says 'Karar bekliyor' and 'Köşkü aç' is on, so pressing it again makes a second köşk (the short name is optional, so nothing refuses it). The sentence 'Köşk açma formu, başvurudaki ad, alan ve açıklamayla açılır' still promises the field the form no longer carries (present.ts:75-80, MDRS-252). Fix: one transaction in the API, or a retry of the approval named in the toast; correct the sentence." }
  - { id: F-3, rule: "Drawn by tedris.discover.applyForKosk, owned here: the approval only records the köşk's id, and tedrisat does not check that the köşk was opened from this application (kosk-application-review.service.ts:156-181); the applicant's notice carries the köşk's name and no target, so the notification page cannot lead to it. The answered detail does not name the köşk either (APPDEC-3)." }
  - { id: APPDEC-1, rule: "New: `?secili=` is honoured only when the id is among the waiting applications the server read (applications-view.tsx:73-77, documented at :45); an application that was decided meanwhile, or any other id, falls back to the first waiting one in silence. The home page's 'İncele' link can therefore open another person's contact details than the one it named, and write that read to the audit log, with no word. Fix: say that the application is no longer waiting, and select nothing." }
  - { id: APPDEC-3, rule: "New: an accepted application shows its badge and nothing else: the API sends `koskId` (KoskApplicationDetailResponse) and the page never draws it, so the reader cannot go from an accepted application to the köşk it opened (applications-view.tsx:349-353). A refused one does show its reason. Fix: a link 'Açılan köşk' to /kosks/{id}." }
  - { id: APPDEC-4, rule: "New: when a read after the first fails, the error alert replaces the tabs, the list and the detail (`failed && lists[tab] === undefined`, applications-view.tsx:372): after a failed read of the answered tab the person has no tab to go back with, only 'Tekrar dene' or a reload. A failed detail read draws an alert in the panel with no retry, and pressing the selected row again changes nothing (:130). Not verified in a browser (nothing makes the API fail on request)." }
  - { id: APPDEC-5, rule: "New: no code moves the focus after a decision. The pressed button and the row it belongs to leave with `settle` (applications-view.tsx:145-153) and the next application's detail is read behind a skeleton, so the focus falls to the page; the only word is a toast, which a success removes after 6 seconds. The same after 'Köşkü aç': the form closes onto a button that is gone. Fix: after a decision move the focus to the next row (or the tab list when none is left). From the code; not verified in a browser." }
  - { id: APPDEC-6, rule: "New: tedrisat lists at most 100 applications per tab (LIST_LIMIT, kosk-application-review.service.ts:48) and the page has no pager and no word about it, while the tab counts are the real totals: with 120 waiting, 'Bekleyen 120' lists 100 and the oldest 20 of the answered tab can never be read." }
  - { id: F-X-3, rule: "'Reddet' of the reject dialog is natively disabled while the reason is blank and nothing ties the reason to the button; leaving the field empty draws 'Bir gerekçe yazın.' as a plain line (no live region, no move of the focus). The family of F-W3-1." }
  - { id: F-W1-12, rule: "fieldLabel() spells the eleven fields in hard-coded Turkish (present.ts:54-68), again in tedrisat (KOSK_FIELD_LABEL, kosk-application-review.service.ts:51-63), while tedris's form translates them (tedris-account.json): the list's row and the detail would not follow a locale." }
  - { id: focus-not-set, rule: "The page sets no initial focus and the app does not move it after a step: choosing a row, a tab, a decision and the close of a dialog over a button that has gone all leave it where the browser puts it (APPDEC-5). Not drawn." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Bekleyen' in 'Bekleyen 2', 'Köşkü aç', 'Reddet'. Holds (WCAG 2.5.3)." }
  - { id: answer-is-given-once, rule: "tedrisat answers an application once: the update is `where status = 'PENDING'` and no row means KOSK_APPLICATION_DECIDED (409, kosk-application-review.repository.ts:192-209). The page treats DECIDED and NOT_FOUND as 'it is settled': the row leaves and the toast says so, for the refusal as for the approval. Holds." }
