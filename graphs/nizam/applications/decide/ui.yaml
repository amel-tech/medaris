# The screens of nizam.applications.decide: the page "Köşk başvuruları" (/talepler/kosk-basvurulari) with its tabs, its list and the
# detail of the selected application, the reject dialog, and the toasts of a decision. Read from apps/nizam/features/platform-admin/
# components/applications-view.tsx and apps/nizam/features/deck-review/components/reject-dialog.tsx on 15 Nov 2026; the words are copied
# from libs/i18n/src/locales/tr/nizam.json (namespaces KoskApplicationsPage, DeckReject, and OpenKoskDialog.saved/savedBody for the
# toast of the köşk form's own).
#
# Two kinds of entries are not copied from the app:
#   Changes.note   the one message written for this graph: no app message says what the two decisions change (see `changes`).
#   composed.*     text the page builds in code from data and that is in no i18n file: the row's name (applications-view.tsx:197-223),
#                  the tab counts (libs/ui/src/mds/tabs.tsx:63) and the values of the detail's lists (applications-view.tsx:233-262, 306-334).
#                  Each is one placeholder or the line the code joins with " · ".
#
# The köşk form that "Köşkü aç" opens is nizam.kosks.open's, started with fromApplication: true; the page behind it is inert, so the
# state `koskForm` draws no node. The detail of an application that has no telephone number says "Verilmedi" (`phone == 'missing'`).
schema: delurio-graph/0
kind: ui
id: nizam.applications.decide
flow: nizam.applications.decide
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note } # the one authored message of this catalog: no app message says what a decision changes
