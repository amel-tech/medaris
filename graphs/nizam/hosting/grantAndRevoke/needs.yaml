# What must exist for a köşk's people to give a medrese the right to open courses in the köşk and to take it back: the flow's product list
# (LAYOUT.md section 7). Each need is what the product must do, from the flow's story and the findings of the page, not from what the page
# does today. The known gaps go to graphs/needs.gaps.yaml, which the orchestrator merges; this file does not edit it. Read by people for
# now: no checker runs on this file yet. `replay:` entries name the scenarios of the binding as written: none has been run (the first
# walks are a later phase), so none is a pass.
#
# Gaps of this file, for that merge:
#   missing:   the-reason-a-button-is-off-is-said (F-W3-1, F-X-3), the-focus-survives-a-withdrawal (HOST-1), a-refusal-brings-the-page-up-to-date
#              (HOST-4), a-failed-list-can-be-tried-again-in-place (HOST-5), the-page-names-its-kosk (F-W3-9), a-call-in-flight-is-not-answered-by-a-live-button
#              (HOST-2), the-grant-window-starts-on-its-list (HOST-6), the-list-of-medreses-is-read-when-needed (HOST-3) (each `missing: none`),
#              appeal-a-withdrawn-right (MDRS-139)
#   unwalked:  a-medaris-nazim-with-the-code-works-the-page (code; no account holds platform.hosting_grant alone), no-medrese-left-is-said and
#              a-failed-list-is-said (code; the stack cannot make the case without touching the seeded medrese or failing a read)
kind: needs
flow: nizam.hosting.grantAndRevoke
status: proposed

needs:
  - id: give-a-medrese-the-right
    need: >-
      A köşk's nazımı, the başnazım, or a Medaris nazımı holding the code gives a medrese the right to open courses in the köşk by
      choosing it from the open medreses that hold none. The right is given at once, written to the audit log with the role the person
      acted as, and the page says so and lists the medrese. Giving it again changes nothing. A medrese that was hidden meanwhile is
      refused in words.
    drawn: [grantForm, choosing, grantReady, granting, listed, toastGranted, a-right-needs-a-medrese]
    built:
      - action: medaris.api:grantKoskHostingRight
      - route: apps/nizam/features/hosting/components/grant-dialog.tsx:50
    walked:
      - e2e: apps/nizam/e2e/madrasahs.e2e.ts
        check: 'madrasahs#10'
      - replay: grantsAndKeeps
      - replay: chiefGrantsAndKeeps
      - replay: madrasahGone

  - id: read-who-holds-a-right-and-what-is-open
    need: >-
      The page lists every medrese that holds a right in the köşk with its başmüderris, who gave the right and in what role, the date,
      and how many courses it has open there, published and draft. A right that was withdrawn, a hidden medrese and a medrese with none
      are not listed.
    drawn: [listed, table, rowName, rowHead, rowGrantedBy, rowGrantedRole, rowDate, rowCount, rowSummary]
    built:
      - action: medaris.api:listKoskHostingRights
      - route: apps/nizam/features/hosting/components/hosting-view.tsx:157
    walked:
      - e2e: apps/nizam/e2e/madrasahs.e2e.ts
        check: 'madrasahs#9'
      - replay: hides
      - replay: withOther

  - id: a-right-gives-no-power-over-the-kosk
    need: >-
      The page and the grant window say, in the words a nazım reads before giving it, that the right lets the medrese open courses and
      gives it no authority over the köşk.
    drawn: [intro, grantIntro]
    built:
      - route: apps/nizam/features/hosting/components/hosting-view.tsx:169
    walked:
      - e2e: apps/nizam/e2e/madrasahs.e2e.ts
        check: 'madrasahs#9'

  - id: withdraw-and-say-what-becomes-of-the-open-courses
    need: >-
      Withdrawing a right names the medrese, lists its open courses with their talebe and imam, and asks what becomes of them: they carry
      on as they are, or they are hidden (drafts too, at the level the person acts at, so that the medrese's own başmüderris cannot bring
      them back) and come back from the Arşiv; nothing is deleted. No answer is chosen for the person. With no open course nothing is
      asked. The medrese can open no new course in the köşk afterwards, and the choice is written to the audit log.
    drawn: [revokeAsk, revokeReady, revokeNoCourses, revoking, introSome, introNone, courseList, choicesGroup, choiceKeep, choiceHide, open-courses-need-an-answer, toastRevoked]
    built:
      - action: medaris.api:revokeKoskHostingRight
      - route: apps/nizam/features/hosting/components/revoke-dialog.tsx:72
    walked:
      - e2e: apps/nizam/e2e/madrasahs.e2e.ts
        check: 'madrasahs#11'
      - e2e: apps/nizam/e2e/madrasahs.e2e.ts
        check: 'madrasahs#12'
      - replay: grantsAndKeeps
      - replay: hides
      - replay: noCourses
      - replay: chiefGrantsAndKeeps
      - replay: notHeld

  - id: leaving-a-window-changes-nothing
    need: >-
      Vazgeç, the close icon and Escape close either window and leave the rights, the courses and the list as they were.
    drawn: [grantForm, grantReady, revokeAsk, revokeReady, revokeNoCourses, listed]
    built:
      - route: apps/nizam/features/hosting/components/grant-dialog.tsx:78
      - route: apps/nizam/features/hosting/components/revoke-dialog.tsx:98
    walked:
      - e2e: apps/nizam/e2e/madrasahs.e2e.ts
        check: 'madrasahs#12'
      - replay: grantsAndKeeps
      - replay: hides

  - id: only-the-kosks-own-people-manage-its-rights
    need: >-
      A person who is not a nazım of the köşk, and holds no platform.hosting_grant, is told "Bu bölüm için izniniz yok" and sees no right;
      a köşk that is not there gets the same words, so the page never tells which köşks exist.
    drawn: [forbidden, not_found, noAccessTitle]
    built:
      - action: medaris.api:listKoskHostingRights
      - route: apps/nizam/app/kosks/[id]/ayarlar/barindirma/page.tsx:40
    walked:
      - e2e: apps/nizam/e2e/madrasahs.e2e.ts
        check: 'madrasahs#13'
      - replay: refused
      - replay: gone

  - id: the-list-of-medreses-is-complete
    need: >-
      The grant window offers every open medrese that holds no right in the köşk and none that is hidden, however many medreses there are.
    drawn: [readingMedreses, madrasahList, optMadrasah]
    built:
      - action: medaris.api:listMadrasahs
      - route: apps/nizam/features/hosting/reads.ts:43
    walked:
      - replay: grantsAndKeeps

  - id: a-medaris-nazim-with-the-code-works-the-page
    need: >-
      A Medaris nazımı who holds platform.hosting_grant and no other köşk code opens this page from the köşk's address, gives and
      withdraws rights, and is not shown settings pages they cannot open.
    drawn: [crumbSettingsText, tabsNav, listed]
    built:
      - route: apps/nizam/app/kosks/[id]/ayarlar/barindirma/page.tsx:54
      - action: medaris.api:grantKoskHostingRight

  - id: no-medrese-left-is-said
    need: >-
      When every open medrese already holds a right, the grant window says there is no other medrese to give it to, with nothing to choose.
    drawn: [grantNone, grantNoneText]
    built:
      - route: apps/nizam/features/hosting/components/grant-dialog.tsx:101

  - id: a-failed-list-is-said
    need: >-
      When the list of medreses cannot be read, the grant window says so and gives nothing to choose.
    drawn: [grantFailed, grantFailedAlert]
    built:
      - route: apps/nizam/features/hosting/components/grant-dialog.tsx:97

  - id: the-reason-a-button-is-off-is-said
    need: >-
      "Barındırma hakkı ver" and "Barındırma hakkını geri al" never sit dead with nothing saying why: the missing choice is named, to a
      keyboard or a screen reader as to the eye, and the person is taken to it.
    drawn: [grantForm, revokeAsk, grantSubmit, revokeSubmit]
    missing: none

  - id: the-focus-survives-a-withdrawal
    need: >-
      After a withdrawal the focus lands somewhere that says what happened (the table's caption or the heading, with a status line), not on
      a button that went with its row.
    drawn: [afterRevoke, listed, rowRevoke]
    missing: none

  - id: a-refusal-brings-the-page-up-to-date
    need: >-
      When the call is refused because the world moved (the medrese is gone or hidden, the right is already withdrawn), the page is read
      again, so that the list and the table show what is true and the person's next press is not refused for the same reason.
    drawn: [granting, revoking, toastGrantMadrasahGone, toastRevokeNotHeld]
    missing: none

  - id: a-failed-list-can-be-tried-again-in-place
    need: >-
      The grant window's failed list has a way to read it again without leaving the page.
    drawn: [grantFailed, grantFailedAlert]
    missing: none

  - id: a-call-in-flight-is-not-answered-by-a-live-button
    need: >-
      While the call runs, the controls that do nothing (Vazgeç, the close icon) say so by being off, or they are allowed to close the window.
    drawn: [granting, revoking, grantCancel, revokeCancel]
    missing: none

  - id: the-grant-window-starts-on-its-list
    need: >-
      The grant window opens with the focus on its select, as the withdrawal window opens on its safe button.
    drawn: [grantDialog, grantClose, madrasahField]
    missing: none

  - id: the-page-names-its-kosk
    need: >-
      The tab title and the heading name the köşk, so a nazım of several köşks knows which page they are on.
    drawn: [pageTitle, listed]
    missing: none

  - id: the-list-of-medreses-is-read-when-needed
    need: >-
      The page does not read every page of every open medrese on each load and each refresh when the grant window may never be opened.
    drawn: [readingMedreses]
    missing: none

  - id: appeal-a-withdrawn-right
    need: >-
      A medrese whose hosting right was withdrawn can appeal the decision to Medaris management (planned.md P-04); nothing of it is built
      for hosting.
    drawn: [afterRevoke]
    missing: MDRS-139
