# The screens of nizam.hosting.grantAndRevoke: Barındırma hakları (/kosks/<id>/ayarlar/barindirma), the window "Barındırma hakkı ver"
# with the kit's select open over it, the window "Barındırma hakkını geri al", and the toasts of both calls. Read from
# apps/nizam/features/hosting/components/{hosting-view,grant-dialog,revoke-dialog}.tsx, present.ts and the kit's Dialog, Select,
# RadioGroup, Table, Tabs, Breadcrumb and Alert on 15 Nov 2026; nothing here was looked at in a browser, so every focus, role and name is
# "from the code" unless a node says otherwise. The words are copied, key for key, from libs/i18n/src/locales/tr/nizam.json (namespaces
# HostingPage, GrantDialog, RevokeDialog, NoAccess; the root key removed).
#
# Two kinds of catalog entry are not copied.
#   `composed.*` is text the app builds in code and keeps in no file; each is the one placeholder it fills, or the join the code writes:
#     composed.HostingPage.madrasahName   {name}: the medrese's own name in a row (hosting-view.tsx:86), and over the withdrawal window
#     composed.HostingPage.person         {person}: who gave the right, or "Adı bilinmiyor" (:103)
#     composed.HostingPage.date           {date}: "16 Kasım 2026" (present.ts:83, `grantedOn`, in the viewer's zone)
#     composed.HostingPage.openCount      {count}: the number of open courses (:127)
#     composed.HostingPage.summary        "1 yayında · 1 taslak": HostingPage.published and .draft, joined by " · " with a part of none left out (present.ts:27)
#     composed.GrantDialog.eyebrow        {koskName}: the köşk's name over the window's title (grant-dialog.tsx:84)
#     composed.GrantDialog.option         "{name} (@{handle})": one medrese in the list (grant-dialog.tsx:114)
#     composed.RevokeDialog.courseTitle   {title}: a course's title in the list of open courses (revoke-dialog.tsx:157)
#     composed.RevokeDialog.courseLine    "{studentsLine} · {imam}": RevokeDialog.students or .noStudents, then the imam's name with their
#                                         unvan, or "{name} Hoca" without one (present.ts:52-72)
#     composed.Button.loading             "Yükleniyor", the hidden status beside a busy Button, a default of libs/ui/src/mds/button.tsx
#   `Changes.note` is the one message written for the graph: the app has a toast for each call and no message that says, before the
#   first, what both do; the note is made of the app's own sentences (HostingPage.intro, .footnote, RevokeDialog.hideDesc and .auditNote).
#
# Where {name} is the medrese (the row, the buttons' labels, the toasts, the withdrawal window) the sample gives the medrese's name; in
# HostingPage.head it is the başmüderris's, which the wireframe then draws wrongly ("Başmüderris Deneme medresesi hosting"); the binding
# finds that line by a regular expression, as nizam.madrasahs.headMuderris does.
#
# The page behind a window is drawn only where the window is closed (`listed`): the window is modal, so the page is inert while it is
# open, and none of its nodes is listed in a window state. In `choosing` the footer buttons are not drawn: whether "Barındırma hakkı ver"
# is on depends on an earlier choice, and Base UI's select is modal over the window (not verified in a browser).
