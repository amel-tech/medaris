rules:
  - { id: focus-not-set, rule: "Nothing in page.tsx, hosting-view.tsx or loading.tsx moves the focus when the page opens (no autoFocus, no FocusHeading), nor after a window's result, so the page node has no `initialFocus` and the graph says nothing of the focus there. Recorded so the silence is not read as an omission." }
  - { id: no-default-accept, rule: "no page has initialFocus on an action with intent confirm: the withdrawal window starts on 'Vazgeç' (revoke-dialog.tsx:106), the grant window on its close icon (HOST-6)" }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): the row's button says 'Barındırma hakkını geri al' and is named 'Barındırma hakkını geri al: {medrese}'; holds" }
  - { id: F-W3-1, rule: "a submit button is not natively disabled while the form is incomplete with nothing saying what is missing. 'Barındırma hakkı ver' is off until a medrese is chosen (grant-dialog.tsx:90) and 'Barındırma hakkını geri al' is off until an answer for the open courses is chosen (revoke-dialog.tsx:112-115, present.ts:99); the first has a select whose placeholder 'Bir medrese seçin' says what to do, the second has a required legend and no word about the button. A keyboard or screen-reader user meets a dead button. Fix: keep it enabled and say what is missing on submit, or tie the reason to the button with aria-describedby" }
  - { id: F-X-3, rule: "the family of F-W3-1: natively disabled submit buttons with no reason given, in these two windows and in every dialog of the app" }
  - { id: F-W3-9, rule: "the tab title and the h1 are 'Barındırma hakları' for every köşk (barindirma/page.tsx:12-15, hosting-view.tsx:168); only the sentence under the heading, the table's caption and the window's eyebrow name the köşk, so a nazım of several köşks cannot tell which page they are on from the title. Fix: put the köşk's name in the title and in an eyebrow above the h1" }
  - { id: F-W3-5, rule: "does not apply to this page: FLOWS.md lists it for this flow, but F-W3-5 is `Tabs mode=tabs` with no tab panel on the köşk applications and course requests pages. Barındırma hakları draws its tabs with `mode=\"links\"` (hosting-view.tsx:180), a <nav> of links with aria-current, which is the right pattern" }
  - { id: F-UI-W1-1, rule: "Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:103), so a screen reader reads the intro, the list of courses, the radios and their descriptions as the window's description when it opens; in the withdrawal window that is the whole question" }
  - { id: HOST-1, rule: "new, from the code: after a withdrawal the row whose button opened the window is gone. The window closes and Base UI gives the focus back to that row's 'Barındırma hakkını geri al' (revoke-dialog.tsx:90-91), and the refresh that follows (revalidatePath and router.refresh, actions.ts:48, hosting-view.tsx:68) draws the table without the row, so the focus falls to the page and only a toast says what happened; with a last right the table says 'Henüz barındırma hakkı yok'. The same family as F-A-2 of nazar.pano.decideApplications and F-W2-10 of nizam.madrasahs.passivate. Not verified in a browser. Fix: move the focus to the table's caption or the heading, and say it in a status line" }
  - { id: HOST-2, rule: "new, from the code: while the call runs, 'Vazgeç', the close icon and Escape do nothing (`if (!saving) onOpenChange(next)`, grant-dialog.tsx:78-80, revoke-dialog.tsx:98-100) and stay enabled; the select and the radios are disabled and the button is busy. A control that is on and does nothing. Fix: disable them while the call runs, or let them close the window and leave the call to finish" }
  - { id: HOST-3, rule: "new, from the code: the page reads every page of every open medrese on every load, 50 at a time and one after the other (getMadrasahOptions, reads.ts:43-60), whether or not the grant window is ever opened, and again on every router.refresh() that a grant or a withdrawal causes. With N open medreses that is ceil(N/50) requests in the page's critical path, and the medreses that already hold a right are discarded in the browser. Fix: read the list when the window opens, or ask the API for the medreses that hold no right in this köşk" }
  - { id: HOST-4, rule: "new, from the code: a refusal leaves the page as it was. grant-dialog.tsx:58-64 and revoke-dialog.tsx:80-86 return before `onGranted`/`onRevoked`, so after 'Bu medrese artık yok ya da gizli.' the hidden medrese is still in the list, and after 'Bu medresenin bu köşkte barındırma hakkı yok.' (someone withdrew it first) the row and its button are still in the table; the person's next press gets the same refusal. The toast stays until it is closed. Fix: read the page again after MADRASAH_NOT_FOUND and HOSTING_RIGHT_NOT_FOUND" }
  - { id: HOST-5, rule: "new, from the code: when the list of medreses could not be read the window shows 'Medreseler yüklenemedi' and no 'Yeniden dene' (grant-dialog.tsx:97-100). The list is read once, by the page, so closing and opening the window reads nothing; the person has to reload. The rights' own error box has a retry (hosting-view.tsx:205). Fix: a retry in the window that reads the list" }
  - { id: HOST-6, rule: "new, from the code, the family of F-W2-12: the grant window passes no `initialFocus` to Dialog (grant-dialog.tsx:76-95; libs/ui/src/mds/dialog.tsx:138 gives Base UI `undefined` for a form), so it opens on the first thing it can focus, the close icon in its header, not on the select. The withdrawal window does pass one ('Vazgeç'). The graph draws `initialFocus: grantClose`, from the code. Fix: pass the select's trigger" }
