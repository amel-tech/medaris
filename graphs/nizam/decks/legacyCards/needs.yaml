schema: delurio-graph/0
kind: needs
id: nizam.decks.legacyCards
status: proposed
summary: >-
  What must exist for a person to look after their flashcard decks and the cards in them on the two legacy pages of nizam-web
  (/decks and /decks/<id>/cards). No e2e check of nizam-web touches these pages (the nizam inventory lists none), the unit specs
  of the app have none for them, and no replay has been run (the owner moved every replay to the walk phase), so no `walked` entry
  names one: every need that has code is `unwalked` below. The Linear key of a missing need is `none`: nothing is planned for
  these pages, and decision D1 says whether they stay.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# missing (no code, Linear key `none`): only-what-is-yours-is-offered, a-bad-value-is-told-on-the-field, a-refused-save-is-undone, a-failure-says-why-in-the-persons-words,
# every-control-has-a-name, every-word-is-the-persons-own, a-saved-change-is-said-in-the-persons-words, big-files-can-be-imported, the-table-keeps-an-order,
# the-table-keeps-the-right-text, the-import-says-it-is-working, one-place-to-edit-a-deck, a-page-has-a-title-and-a-loading-state
# unwalked (code, no e2e and no replay yet): see-your-decks-in-a-table, make-a-deck, rename-in-place, delete-a-deck-after-asking, open-a-decks-cards, edit-a-card-in-place,
# delete-a-card-after-asking, import-cards-from-a-file, export-a-deck, get-a-sample-file, a-failed-read-is-told

needs:
  - id: see-your-decks-in-a-table
    need: >-
      A signed-in person sees the decks that are theirs, one row each with its title and description, and a person who has none is
      told so. The table says what it holds and in what order.
    evidence:
      - state: list
      - node: listTitle
      - node: listIntro
      - node: deckTable
      - node: colTitle
      - node: colDescription
      - node: rowTitle
      - node: rowDescription
      - node: emptyRow
      - source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:242
      - source: apps/nizam/features/decks/components/decks.tsx:60

  - id: only-what-is-yours-is-offered
    need: >-
      A person is offered a rename, a delete, a card edit, an import and an export only on a deck they may change. A public deck
      of someone else is shown as something to read, and nobody learns it is not theirs by pressing and being refused.
    missing: no Linear issue
    note: >-
      Drawn on the nodes rowTitle, rowDescription, rowRemove, cardFront, cardBack, cardRemove, importItem, exportItem and
      toastReason, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only
      missing needs name).

  - id: make-a-deck
    need: >-
      A person makes a deck from a title of 5 to 100 characters and an optional description; it is theirs alone and has no card;
      they are told it exists and the table shows it. A title that is only blanks is not sent.
    evidence:
      - node: newButton
      - state: newDeck
      - state: newDeckInvalid
      - state: creating
      - state: newDeckFailed
      - node: titleField
      - node: descriptionField
      - node: newDeckSubmit
      - node: newDeckSubmitBusy
      - node: toastCreated
      - node: toastCreatedBody
      - node: toastBlank
      - source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:276
      - source: apps/nizam/features/decks/components/decks-table-header.tsx:46

  - id: a-bad-value-is-told-on-the-field
    need: >-
      A title that is blank, too short or too long, and a card face that is too short, are told where they were typed, in the
      person's words, before or when the person presses; the focus goes to the field and the message is announced.
    missing: no Linear issue
    note: >-
      Drawn on the states newDeckInvalid and newDeckFailed and on the nodes toastBlank, toastBlankBody, toastCreateFailed and
      toastReason, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only
      missing needs name).

  - id: rename-in-place
    need: >-
      A person changes the title or the description of a deck where it stands, and it is saved when they leave the cell or press
      Enter; the page tells them it was saved and keeps the focus.
    evidence:
      - node: rowTitle
      - node: rowDescription
      - state: renaming
      - node: toastRenamed
      - node: toastRenamedBody
      - source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:390
      - source: apps/nizam/features/decks/components/decks.tsx:38

  - id: a-refused-save-is-undone
    need: >-
      When the server refuses a change made in a cell, the cell goes back to what is stored and says why, instead of showing the
      refused text as if it were saved.
    missing: no Linear issue
    note: >-
      Drawn on the states renaming and savingCard and on the nodes toastRenameFailed, toastCardFailed, toastReason, rowTitle and
      cardBack, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only
      missing needs name).

  - id: a-saved-change-is-said-in-the-persons-words
    need: >-
      A cell that was saved, a deck made or deleted, a card deleted or imported are told in Turkish, in one voice, naming the deck
      or the card and not its id; the page also says when a cell saves.
    missing: no Linear issue
    note: >-
      Drawn on the nodes toastRenamed, toastRenamedBody, toastRemoved, toastRemovedBody, toastCardSaved, toastCardSavedBody,
      toastCardRemoved, toastCardRemovedBody, toastImported and toastImportedBody, which the code has: they are not evidence, so
      that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: delete-a-deck-after-asking
    need: >-
      A deck is deleted only after the person is asked once, in words that say the cards go with it and it cannot be undone, and
      the table follows at once; the person is told it is gone.
    evidence:
