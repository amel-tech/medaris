      - source: apps/tedrisat/src/flashcard/flashcard.controller.ts:148
      - source: apps/nizam/features/decks/hooks/useDecksColumns.tsx:52

  - id: edit-a-card-in-place
    need: >-
      A person changes a card's front or back where it stands, and it is saved when they leave it; a face of fewer than 3
