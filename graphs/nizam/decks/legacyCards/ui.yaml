rules:
  - { id: F-P0-10, rule: "The eye and trash buttons of a deck row, and the trash button of a card row, hold only an icon and have no accessible name (useDecksColumns.tsx:49-60, useFlashcardColumns.tsx:49-51): a screen reader says 'button' three times. A deck of two dozen cards has two dozen unnamed trash buttons. Fix: aria-label with the title ('Kartları aç', 'Sil') and the row's own words." }
  - { id: F-P0-11, rule: "The editable cells are an <input> or a <textarea> whose only name is its placeholder (editable-input.tsx:36-43, editable-textarea.tsx:30). Nothing announces a save but a toast, and the cell's own input is replaced by a Skeleton while its save runs (editable-input.tsx:25, editable-textarea.tsx:25), so the focus is lost at the moment the person has just pressed Enter or left the cell (F-X-8). Nothing on the page says that a cell saves when it is left; Enter saves a one-line cell and makes a new line in a textarea (LEGACY-6). Fix: aria-label from the column's header, keep the field mounted and aria-busy, and say when it saves." }
  - { id: F-P0-12, rule: "A title of blanks is stopped by a toast alone (decks-table-header.tsx:37-43): the field has no aria-invalid and no message, and the focus stays on the pressed button. A title that is empty never gets there: `required` is on the field (decks-table-header.tsx:110), so the browser's own bubble stops it. Fix: aria-invalid and a described message on #title, and no toast." }
  - { id: F-P0-13, rule: "Hard-coded English that is in no catalog: the toasts 'Card Updated', 'Flashcard was updated successfully.', 'Update Error', 'Card Deleted', 'Card with ID {id} was deleted.', 'Delete Error' (decks.tsx:22-54) and the menu items 'CSV' and 'Excel' (cards-table-header.tsx:80, 83, 96, 101). Fix: move them to nizam.DecksPage.Toast and the like (F-X-17)." }
  - { id: F-P0-14, rule: "'Kart Güncellendi' goes with 'Kartvizit başarıyla güncellendi.' (nizam.json DeckCards.cardUpdatedDescription, line 119): kartvizit is a business card. Fix: 'Kart başarıyla güncellendi.'" }
  - { id: F-P0-15, rule: "When a create is answered 'unauthenticated' the button stays 'Oluşturuluyor...' and disabled: handleSubmit returns before setIsLoading(false) (decks-table-header.tsx:47). The redirect to sign-in follows, so it shows only while it is under way. Fix: reset the loading before returning." }
  - { id: F-P0-16, rule: "Neither page is guarded beyond sign-in (app/decks/page.tsx, app/decks/[id]/cards/page.tsx), so a person with no role at all opens them (app/kosks/layout.tsx covers only /kosks/**); neither has generateMetadata (the tab says 'Nizam'), a loading.tsx or a catch: a failed read is the generic error page. Fix: decide to retire them or put them on the design system (decision D1)." }
  - { id: F-X-18, rule: "The same decision seen from the köşk side: these two pages are the second UI of the köşk decks, with F-P0-10 to F-P0-16 and F-W5-8 (the köşk decks page's 'Kartları düzenle' links here, to a page that checks no köşk)." }
  - { id: F-W5-8, rule: "'Kartları düzenle' on the köşk decks page links to /decks/<id>/cards, which checks neither that the deck belongs to that köşk nor who the person is beyond what tedrisat decides (kosk-decks-view.tsx:224). Carried here as the page it opens. Fix: build the editor under /kosks/<id>/desteler/<deck>." }
  - { id: F-X-8, rule: "Fields that are replaced or disabled while their own save runs, so the focus is lost: the editable cells (a Skeleton instead of the input) and, here, every field and button of the Yeni Güverte dialog while the deck is made (decks-table-header.tsx:111, 144 `disabled={isLoading}`). Fix: keep the control mounted with aria-busy." }
  - { id: F-X-17, rule: "Hard-coded text outside the catalogs: the six English toasts of decks.tsx and the two menu words of cards-table-header.tsx (F-P0-13), and the shadcn Dialog's visually hidden 'Close' (libs/ui/src/components/dialog.tsx:75; LEGACY-8)." }
  - { id: LEGACY-1, rule: "A save that fails leaves the typed text in the cell. EditableCell.handleSave sets its stored text to the typed one before the save has an answer (editable-cell.tsx:61-66), and DataTable.handleUpdateData reverts only when onRowUpdate throws, while both pages' onRowUpdate return false on a refusal (components/data-table/index.tsx:78-83, decks.tsx:51-55, cards.tsx:54-58). So after 'Update Error' the cell shows the text the server refused, nothing is read again (a failure runs no revalidatePath) and leaving the cell a second time sends nothing, because it is not 'changed'. The screen and the data disagree until a reload. Fix: put the stored text back when the answer is a failure, or mark the cell invalid." }
  - { id: LEGACY-2, rule: "Every failure toast prints the API's own message as its description (authenticated-action.ts:56, getErrorMessage in libs/services/src/utils/error-handler.ts): 'Caller is not authorized for the requested scope on this resource' for a deck that is not the person's, and the validator's 'title must be longer than or equal to 5 characters' for a short title, in English under a Turkish or an English title. Fix: map the refusal's code to a Turkish sentence in the catalog and say whose deck it is." }
  - { id: LEGACY-3, rule: "GET /flashcard/decks has no order (flashcard-deck.repository.ts:48-51, a findMany with no orderBy, and the TODO at :102 and :111), so a row can move after an edit (an UPDATE writes a new row version) and the table has no stable order; it lists every public deck and the person's own including their hidden köşk decks (the domain's hidden-decks-in-lists). The table has no paging and no search. Fix: order by title or by date, and filter the hidden." }
  - { id: LEGACY-4, rule: "A public deck of another person is drawn with editable cells and a trash button exactly like one's own: the response carries `authorId` and the page never reads it (decks.tsx, useDecksColumns.tsx). The first press is answered 403 and the page then says so in English (LEGACY-2); the cards page offers the same edits, the trash buttons, 'Excel'den İçe Aktar' and 'Dışa Aktar' on a deck the person may only read. Fix: draw it read-only (decision D2)." }
  - { id: LEGACY-5, rule: "The deck's and the card's success toasts print the record's raw uuid: 'Card with ID 3f2c8a1e-... was deleted.' (decks.tsx:25) and '3f2c8a1e-... kimlik numaralı kart silindi.' (nizam.json DeckCards.cardDeletedDescription). Fix: name the deck by its title and the card by its front." }
  - { id: LEGACY-6, rule: "A textarea cell saves only when it is left: EditableTextarea has no key handler (editable-textarea.tsx:30-39), so Enter makes a new line and sends nothing, while the one-line cells of /decks save on Enter (editable-input.tsx:29-33). Two behaviours in one table, and neither is said on the page. Fix: say it, or save on Ctrl+Enter." }
  - { id: LEGACY-7, rule: "The import has no busy state, no progress and no 'done' beyond a toast: onDeckFileImport awaits the Server Action with nothing drawn (cards.tsx:61-83). The file travels as a Server Action argument, whose body Next limits to 1 MB unless next.config.js sets serverActions.bodySizeLimit, and it does not (apps/nizam/next.config.js), while the API takes 5 MB (flashcard.controller.ts:491): a file between the two probably dies in the framework, the awaited promise rejects with no catch and the person sees nothing. NOT VERIFIED in a browser (nazar.decks.import carries the same doubt as F-D1-18). Fix: bodySizeLimit of 6mb, a try/catch and a busy label." }
  - { id: LEGACY-8, rule: "Wrong or hard-coded words: 'Yeni Güverte' (TableHeader.newDeck) is a ship's deck, not a card deck; 'İthal Kartlar' (DeckCards.cardsImported) is imported goods; the buttons 'İptal etmek' and 'Silmek' are infinitives; the failure title of an export, an import and a sample file is 'Güncelleme Hatası' (an update's), reused (cards.tsx:109-112, 122-125); and the two dialogs' close icon is named 'Close', in English, by the shadcn kit (libs/ui/src/components/dialog.tsx:75) while the toasts' is 'Kapat' (common.toast.close). The catalog also holds DecksPage.Dialog.* and DecksPage.Toast.* that no code reads. Fix: 'Yeni Deste', 'Kartlar içe aktarıldı', 'Vazgeç', 'Sil', a failure title for each action and a closeLabel prop." }
  - { id: LEGACY-9, rule: "While a deck is made, every field and both buttons of the dialog are disabled (decks-table-header.tsx:111, 124, 135, 141), so the focused field loses the focus and Esc may be the only way out; the Close icon stays enabled and closes the dialog while the request goes on (the success toast then still comes). Not verified in a browser. Fix: keep the fields mounted, aria-busy on the button." }
  - { id: LEGACY-10, rule: "DERIVED FROM THE CODE, NOT SEEN: both tables are keyed by row index (DataTable passes no getRowId, so TanStack's default id is the index), and each EditableCell copies the text of its row once (`useState(getValue())`, editable-cell.tsx:23) while the cards' textarea is uncontrolled (`defaultValue`, editable-textarea.tsx:30). After a delete of a row that is not the last, or a reorder (LEGACY-3), a cell that stays mounted may keep the old row's text: the deleted card's face stays on screen and the last card's is gone. The decks table rebuilds its default column on every render (decks.tsx:58) and may remount its cells, which hides the same fault there. The walk should delete the first of three cards and read the table. Fix: getRowId from the record's id." }
  - { id: createcards-no-whitelist, rule: "Neither page calls createCards (POST /flashcard/decks/{id}/cards, whose pipe has no whitelist, ledger/security.md): the only way they add cards is importCards, which validates every row with whitelist and forbidNonWhitelisted against the three fixed columns Card Type, Content Front and Content Back (flashcard-bulk.service.ts:98-102, config-excel.dto.ts), so a card id cannot be chosen from here. The binding's data helper does use createCards, to put cards into its own deck." }
  - { id: focus-not-set, rule: "No page sets an initial focus: nothing in features/decks, app/decks, app/error.tsx calls focus() or autofocuses, and neither page has a FocusHeading (only /yetki-yok has one), so a person who arrives from the köşk page lands with the focus at the start of the document. The graph draws a focus only where Radix gives one (the three dialogs) and on the button that was pressed after a blank title. Not verified in a browser." }
  - { id: label-in-name, rule: "Where a button has a visible word it is in its accessible name: 'Yeni Güverte', 'Toplu İşlemler', 'Deste Oluştur', 'İptal etmek', 'Silmek', 'Yeniden dene'. The icon buttons have no visible word and no name at all (F-P0-10). Holds, apart from those." }
  - { id: confirm-before-deleting, rule: "A deck and a card are deleted only after 'Emin misin?', in an alertdialog whose focus starts on 'İptal etmek'; the dialog says the delete cannot be undone, and a deck's says that everything about it goes, but not whose deck it is or that its talebe's progress rows stay behind (the domain's progress-orphans). An edit of a cell is not confirmed. Holds." }
