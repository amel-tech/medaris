# The screens of nizam.decks.legacyCards: the table of decks at /decks and the table of one deck's cards at /decks/<id>/cards, with the Yeni Güverte dialog,
# the two delete confirmations, the Toplu İşlemler menu, the import-errors dialog, the toasts and the error page. Read on 15 Nov 2026 from
# apps/nizam/features/decks (decks, decks-table-header, cards, cards-table-header, import-errors-dialog, useDecksColumns, useFlashcardColumns, actions),
# apps/nizam/components/data-table, apps/nizam/app/error.tsx, and the shadcn kit in libs/ui/src/components (dialog, alert-dialog, dropdown-menu, table, sonner).
# Nothing was seen in a browser by its writer: every behaviour is "from the code" unless a rule says otherwise.
#
# What this file leaves to its neighbours: the shell around both pages (sidebar, person row, footer: nizam.shell.menuPerPersona; only its <main> is drawn here)
# and the köşk decks page that links to the cards (nizam.decks.koskDecks).
#
# Words: every key without a `composed.` prefix is copied letter for letter from libs/i18n/src/locales/tr/nizam.json (the file the app reads as `nizam`; a key
# is the path under its root) by <scratchpad>/mkcat-legacycards.mjs, except `Changes.note`: the app has a toast for each action and none that says, in one
# place, what these pages change and what follows, so one short factual note is authored (the only catalog entry not copied from the app). The `composed.*`
# keys are text the app builds in code, in no i18n file, each with its line:
#   composed.Decks.titleLabel          "Başlık *"            TableHeader.title and " *" typed after it in the JSX (decks-table-header.tsx:104)
#   composed.Decks.deckTitle           "{title}"             the deck's own title as the h1 of the cards page (cards-table-header.tsx:51)
#   composed.Decks.deckDescription     "{description}"       its description in the <p> under it, empty when there is none (cards-table-header.tsx:52)
#   composed.Decks.renamed / renamedBody      "Card Updated" / "Flashcard was updated successfully."   English, hard-coded (decks.tsx:45-48)
#   composed.Decks.renameFailed               "Update Error"                       English, hard-coded; its body is the server's words (decks.tsx:51-54)
#   composed.Decks.removed / removedBody      "Card Deleted" / "Card with ID {id} was deleted."        English, hard-coded; {id} is the deck's uuid (decks.tsx:22-27)
#   composed.Decks.removeFailed               "Delete Error"                       English, hard-coded (decks.tsx:31-34)
#   composed.Decks.serverMessage       "{reason}"            the API's own message, shown as the description of every failure toast (authenticated-action.ts:56)
#   composed.Dialog.close              "Close"               the shadcn Dialog's hard-coded visually hidden word on its close icon (libs/ui/src/components/dialog.tsx:75)
#   composed.CardsTableHeader.csv / excel     "CSV" / "Excel"                      hard-coded menu items (cards-table-header.tsx:80, 83, 96, 101)
#   composed.ImportErrors.summary      "{summary}"           the dialog's description, the API's own "message" (import-errors-dialog.tsx:27)
#   composed.ImportErrors.fieldMessage "{field}: {message}"  one error of a row: the property name and the validator's sentence (import-errors-dialog.tsx:38-39)
