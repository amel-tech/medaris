# What must exist for a köşk's nazımı to open, answer and hide the köşk's decks on /kosks/<id>/desteler and /kosks/<id>/desteler/yeni (LAYOUT.md section 7). Each need is what the
# product must do, from the flow's story, its decisions D1 to D3 and the findings of the two pages (F-W5-3, F-W5-4, F-W5-5, F-W5-8, F-W5-9, KDECK-1 to KDECK-7), not from what the pages do
# today; the known gaps go to graphs/needs.gaps.yaml, which the orchestrator merges. Read by people for now: no checker runs on this file yet.
# Nothing is planned for these pages (FLOWS.md names no planned item for this flow), so the Linear key of a missing need is `none`. No replay has been run (the owner moved every replay to
# the walk phase), so no `walked` entry names one: a need is walked only where an e2e check of apps/nizam/e2e/deck-review.e2e.ts asserts it (the file's own numbering: #6 the counts, #7 Kabul
# et and the form filled in, #8 the empty name and a deck from nothing, #9 Reddet with a reason, Gizle and the archive, #10 the refusal of a person who is no nazım, which
# nizam.shell.noAccessAndNotFound carries). None of these checks is stale.
#
# missing (no code, Linear key `none`): edit-the-cards-on-the-design-system, the-proposer-is-told-of-an-acceptance, a-stale-proposal-link-says-so, a-failed-read-explains-itself,
#   a-failed-write-is-told-where-it-happens, the-focus-follows-an-answer, the-hide-dialog-says-who-can-undo-it, a-proposal-card-says-its-card-type, the-edit-link-says-its-words,
#   the-page-links-to-the-archive, hiding-is-audited
# unwalked (code, no e2e and no replay yet): edit-a-decks-cards, a-long-list-is-paged, an-answer-is-given-once, the-first-read-failing-is-told-by-the-page
kind: needs
flow: nizam.decks.koskDecks
status: proposed

needs:
  - id: see-the-decks-and-the-waiting-proposals
    need: >-
      The köşk's nazımı sees the decks the köşk shares, each with its type and number of cards, and above them the proposals the hocas made, oldest first, each with who proposed it, for which
      course and when, and how many wait. Where none waits the block is not there; where no deck exists the table says so.
    drawn: [list, listTitle, listIntro, proposalsRegion, proposalsCount, proposalTitle, proposalDescription, proposalFooter, decksRegion, decksCount, decksTable, deckName, deckCaption, deckCards, deckChanged, emptyDecks]
    built:
      - action: medaris.api:getManagedKoskDecks
      - route: apps/nizam/features/deck-review/components/kosk-decks-view.tsx:50
    walked:
      - e2e: apps/nizam/e2e/deck-review.e2e.ts
        check: 'deck-review#6'

  - id: open-a-deck-from-nothing
    need: >-
      The nazım opens a deck for the köşk's talebe from a name, an optional description and the kind of its cards (vocabulary or hadith); it is theirs to fill, the page tells them it is open, and
      the table lists it with its type.
    drawn: [openLink, openingForm, formScratch, nameFieldEmpty, descFieldEmpty, kindGroup, kindVocabulary, kindHadeeth, visibleAlert, submitButton, submitting, afterOpen, toastOpened, toastOpenedBody]
    built:
      - action: medaris.api:createKoskDeck
      - route: apps/nizam/features/deck-review/components/kosk-deck-form.tsx:80
    walked:
      - e2e: apps/nizam/e2e/deck-review.e2e.ts
        check: 'deck-review#8'

  - id: a-deck-needs-a-name
    need: >-
      A deck is never sent with an empty or blank name: the person is told on the field, in words, that it needs one, the focus goes to the field, and nothing is made.
    drawn: [formInvalid, nameField, nameError, nameFieldFilled]
    built:
      - route: apps/nizam/features/deck-review/present.ts:181
      - route: apps/nizam/features/deck-review/components/kosk-deck-form.tsx:74
    walked:
      - e2e: apps/nizam/e2e/deck-review.e2e.ts
        check: 'deck-review#8'

  - id: open-a-deck-from-a-proposal
    need: >-
      The nazım answers a proposal with "Kabul et": the form opens filled in with the proposal's name, description and kind, says whose proposal it is, lets them change it, and opening the deck
      accepts the proposal in the same step, so the proposal leaves the waiting ones and the deck is listed.
    drawn: [acceptLink, openingForm, formProposal, proposalBanner, proposalBannerText, nameFieldFilled, descFieldFilled, kindHadeeth, submitting, afterOpenProposal]
    built:
      - action: medaris.api:createKoskDeck
      - route: apps/nizam/app/kosks/[id]/desteler/yeni/page.tsx:53
    walked:
      - e2e: apps/nizam/e2e/deck-review.e2e.ts
        check: 'deck-review#7'

  - id: refuse-a-proposal-with-a-reason
    need: >-
      The nazım refuses a proposal only with a reason, which the hoca who proposed it reads in their notifications; the proposal leaves the waiting ones and the page says it was refused.
    drawn: [refuseButton, rejectForm, rejectFormReady, reasonField, reasonRequired, rejectSubmit, rejecting, afterReject, toastRefused, toastRefusedBody]
    built:
      - action: medaris.api:rejectKoskDeckProposal
      - route: apps/nizam/features/deck-review/components/reject-dialog.tsx:65
    walked:
      - e2e: apps/nizam/e2e/deck-review.e2e.ts
        check: 'deck-review#9'

  - id: hide-a-deck-after-asking
    need: >-
      The nazım hides a deck from the köşk's talebe after being asked and told that nothing is deleted; the deck leaves the table and the page says it moved to the archive.
    drawn: [hideButton, confirmHide, hideDialog, hideBody, hideConfirm, hiding, afterHide, toastHidden, toastHiddenBody]
    built:
      - action: medaris.api:hideKoskDeck
      - route: apps/nizam/features/deck-review/components/kosk-decks-view.tsx:154
    walked:
      - e2e: apps/nizam/e2e/deck-review.e2e.ts
        check: 'deck-review#9'

  - id: find-a-hidden-deck-in-the-archive
    need: >-
      A deck that was hidden is found in the köşk's archive, with who hid it, and brought back from there (nizam.moderation.restoreArchived).
    drawn: [handed_over.archive]
    built:
      - route: apps/nizam/lib/shell-nav.ts:253
    walked:
      - e2e: apps/nizam/e2e/deck-review.e2e.ts
        check: 'deck-review#9'

  - id: the-page-links-to-the-archive
    need: >-
      The page that hides a deck, and the message that says it was hidden, lead to the archive where it now is, so the person does not have to look for the menu entry.
    drawn: [toastHidden, toastHiddenBody, hideBody, handed_over.archive]
    missing: none

  - id: only-a-nazim-may-open-it
    need: >-
      A person who is no nazım of the köşk reads neither its decks nor its proposals and writes nothing: the page says "Bu bölüm için izniniz yok", the same for a köşk that is not there.
    drawn: [handed_over.no_access]
    built:
      - action: medaris.api:getManagedKoskDecks
      - route: apps/nizam/app/kosks/[id]/desteler/page.tsx:34
    walked:
      - e2e: apps/nizam/e2e/deck-review.e2e.ts
        check: 'deck-review#10'

  - id: edit-a-decks-cards
    need: >-
      The nazım adds and changes the cards of a deck the köşk shares, from the page that lists it, one by one or from a file.
    drawn: [editCards, handed_over.edit_cards]
    built:
      - route: apps/nizam/features/deck-review/components/kosk-decks-view.tsx:221
      - route: apps/nizam/app/decks/[id]/cards/page.tsx:4
    walked: []

  - id: edit-the-cards-on-the-design-system
    need: >-
      The cards of a köşk deck are edited on a page of the design system under the deck's own address, with a title, Turkish words, named buttons and a check that the deck belongs to this
      köşk, and not on the legacy page that lists every public deck beside the nazım's own (D1).
    drawn: [editCards, handed_over.edit_cards]
    missing: none

  - id: the-proposer-is-told-of-an-acceptance
    need: >-
      The hoca who proposed a deck is told, in their notifications, when the nazım accepts it, naming the deck, as they are told when it is refused and why (D3).
    drawn: [submitting, afterOpen, toastOpened, toastOpenedBody]
    missing: none

  - id: a-stale-proposal-link-says-so
    need: >-
      A nazım who follows "Kabul et" always gets the proposal they chose: a proposal that was answered or deleted meanwhile is told to be no longer waiting, with a way back to the list, and
      a proposal that lies beyond the first twelve of the list opens its own form. Nobody meets an empty form that looks like the proposal's (KDECK-1).
    drawn: [openingForm, formScratch]
    missing: none

  - id: an-answer-is-given-once
    need: >-
      A proposal is answered once: a second answer, from another nazım or another tab, is told that it was answered meanwhile, the row leaves, and nothing is written twice; a deck that is hidden
      already is told the same way.
    drawn: [rejecting, hiding, submitting, toastProposalAnswered, toastProposalGone, toastDeckGone, toastOpenAnswered, toastOpenGone]
    built:
      - route: apps/nizam/features/deck-review/components/kosk-decks-view.tsx:134
      - route: apps/tedrisat/src/deck-review/deck-review.repository.ts:513
    walked: []

  - id: a-failed-read-explains-itself
    need: >-
      When the köşk and its decks cannot be read the page says so, offers to try again, and does not offer what cannot be done meanwhile (no disabled button without a word of why) (F-W5-9, D2).
    drawn: [listUnreadable, loadFailedAlert, loadFailedText, retry, openDisabled, formUnreadable, formUnreadableAlert, formRetry]
    missing: none

  - id: the-first-read-failing-is-told-by-the-page
    need: >-
      A first read that fails (the server down, a 5xx) is neither the refusal nor the empty page: it draws the warning "Desteler okunamadı" with "Yeniden dene", and the same on the form page.
    drawn: [listUnreadable, loadFailedAlert, retry, formUnreadable, formUnreadableAlert, formRetry]
    built:
      - route: apps/nizam/features/deck-review/components/load-failed.tsx:18
    walked: []

  - id: a-failed-write-is-told-where-it-happens
    need: >-
      A write that is refused or fails is told inside the dialog or the form where the person pressed, in words they can act on, announced to a screen reader, and not only by a toast that stays in
      another part of the page (F-W5-3).
    drawn: [toastActionFailed, toastForbidden, toastGeneric, toastOpenFailed, toastOpenForbidden, toastOpenGeneric, rejectFormReady, confirmHide, formScratch, formProposal]
    missing: none

  - id: the-focus-follows-an-answer
    need: >-
      After a proposal is answered, a deck hidden or a deck opened, the focus goes to the next card or row, or to the section's heading, and what happened is said where the person is, not only by a
      toast of six seconds (F-W5-5, KDECK-4).
    drawn: [rejectDialog, hideDialog, refuseButton, hideButton, toastRefused, toastHidden, toastOpened]
    missing: none

  - id: the-hide-dialog-says-who-can-undo-it
    need: >-
      The window that asks whether to hide a deck says who can bring it back: the köşk's nazımı for what they hid, the başnazım alone for what the başnazım hid (KDECK-3).
    drawn: [hideDialog, hideBody]
    missing: none

  - id: a-proposal-card-says-its-card-type
    need: >-
      A proposal's card says whether it proposes a vocabulary or a hadith deck, so the nazım need not open the form to know (KDECK-5).
    drawn: [proposalTitle, proposalDescription, proposalFooter]
    missing: none

  - id: the-edit-link-says-its-words
    need: >-
      The link that leads to a deck's cards carries the words it shows in its accessible name, so that a person who speaks to their computer reaches it by what they read (KDECK-6, WCAG 2.5.3).
    drawn: [editCards]
    missing: none

  - id: a-long-list-is-paged
    need: >-
      A köşk with more than twelve decks or twelve waiting proposals shows twelve of each and the rest on "Daha fazla göster", with the totals in the headings.
    drawn: [proposalsCount, decksCount]
    built:
      - route: apps/nizam/features/deck-review/components/kosk-decks-view.tsx:93
      - route: apps/nizam/features/deck-review/present.ts:28
    walked: []

  - id: hiding-is-audited
    need: >-
      Hiding a köşk's deck is written to the audit log with who did it and at which level, as hiding a course, a week or a session is (the domain's kosk-deck-hide-no-audit).
    drawn: [hiding, afterHide]
    missing: none
