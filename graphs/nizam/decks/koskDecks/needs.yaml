  - id: hiding-is-audited
    need: >-
      Hiding a köşk's deck is written to the audit log with who did it and at which level, as hiding a course, a week or a session
      is (the domain's kosk-deck-hide-no-audit).
    missing: no Linear issue
    note: >-
      Drawn on the states hiding and afterHide, which the code has: they are not evidence, so that a replay still walks them
