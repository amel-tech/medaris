# The screens of nizam.decks.koskDecks: "Köşk desteleri" (/kosks/<id>/desteler) with its waiting proposals and its table of decks, the warning of a first read that failed, the
# form "Köşk destesi aç" (/kosks/<id>/desteler/yeni, from nothing and from a proposal), the reject dialog and the hide confirmation, and the toasts that answer each write. Read
# from apps/nizam/features/deck-review/components/{kosk-decks-view,kosk-deck-form,reject-dialog,load-failed}.tsx, apps/nizam/app/kosks/[id]/desteler/{page,yeni/page}.tsx and
# libs/ui/src/mds/{table,card,field,alert,alert-dialog,dialog,breadcrumb,radio-group,button}.tsx and libs/ui/src/components/sonner.tsx on 16 Nov 2026. Nothing was seen in a browser
# by its writer: every behaviour is "from the code" unless a rule says otherwise.
#
# The sidebar, the person row and the footer are nizam.shell.menuPerPersona's; the page here is the shell's <main>. While a dialog is open the page behind it is inert, so no page node
# is `in` a dialog state; the toasts live in sonner's own portal and are.
#
# Words: every key without a `composed.` prefix is copied letter for letter from libs/i18n/src/locales/tr/nizam.json (namespaces KoskDecksPage, KoskDeckForm, DeckReject; the file the app
# reads as `nizam`) and common.json (`common.toast.close`) by <scratchpad>/mkcat-koskdecks.mjs. Two kinds of entries are not copied:
#   Changes.note   the one message written for this graph: no message of the app says, in one place, what opening, refusing and hiding change and who is told
#   composed.*     text the page builds in code from data and that is in no i18n file; each with its code line:
#     composed.KoskDecksPage.proposalTitle   "{title}" the proposal's title, in the card's h3 (kosk-decks-view.tsx:292) and above the reject dialog's title (reject-dialog.tsx:85)
#     composed.KoskDecksPage.proposalDescription   "{description}" the proposal's description, a paragraph of the card (:305)
#     composed.KoskDecksPage.proposalFooter   "{proposedBy} · {course} · {date}": the card's footer is one <span> that joins KoskDecksPage.proposedBy ("Öneren {name}"), " · " and the
#                                             course, " · " and the date by hand (:295-301); the sample `proposedBy` is the whole "Öneren <name>"
#     composed.KoskDecksPage.deckName   "{title}" the deck's title, in the row header (:185)
#     composed.KoskDecksPage.deckCaption   "{caption}" the description (when there is one), " · " and the card type's word (KoskDecksPage.cardTypes.*), in one caption under the title (:186-193)
#     composed.KoskDecksPage.deckCards   "{cards}" the number of cards (:202); composed.KoskDecksPage.deckChanged   "{changed}" the last change, "29 Eyl 21:10" (shortDateTime, :209)
#     composed.KoskDeckForm.titleValue / descriptionValue   what a form opened from a proposal holds in its two fields: the proposal's own title and description (kosk-deck-form.tsx:150,163)
#     composed.Button.loading   "Yükleniyor" the busy button's hidden status, a default of the kit (libs/ui/src/mds/button.tsx:62)
# A toast is two lines (a title and a description) in a sonner <li data-sonner-toast> that has no role; each line is a node.
