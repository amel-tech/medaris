rules:
  - { id: F-W5-8, rule: "'Kartları düzenle' (kosk-decks-view.tsx:221-228) is a link to the LEGACY /decks/<id>/cards, a shadcn page with no title, English toasts, icon-only buttons with no name and no check beyond sign-in (nizam.decks.legacyCards owns it, F-P0-10 to F-P0-16, F-X-18). The nazım leaves the design system to edit the cards of a deck this page just opened, which holds none. Fix: build the editor under /kosks/<id>/desteler/<deck>." }
  - { id: F-W5-9, rule: "When the first read failed (`initial === null`) the header draws 'Köşk destesi aç' as a DISABLED <Button> beside the error Alert (kosk-decks-view.tsx:260-264): a control that cannot be pressed and says nothing of why, while the Alert already says what to do. Fix: hide it in that state, or keep it as the link it is." }
  - { id: F-W5-3, rule: "A write that is refused or fails is told only by a sticky error toast in sonner's portal, in the page's own words per code (present.ts:107-134): the dialog or form stays as it was, nothing inside it says it failed, and no field is marked (kosk-decks-view.tsx:86-90, kosk-deck-form.tsx:87-91). Whether the toast region announces is not verified; sonner's own label is English (F-X-5). Fix: put an Alert tone=error (role alert) in the dialog or above the form with the same sentence." }
  - { id: F-W5-4, rule: "The reject dialog (reject-dialog.tsx:92,104) keeps 'Reddet' natively disabled while the reason is blank and shows 'Bir gerekçe yazın.' only after the field was left: a keyboard user who never leaves the field and tabs on cannot reach the button and is told nothing; the message is not a live region. The köşk deck form is the better pattern (submit stays enabled, the error shows on submit, the focus moves to the field). Fix: keep 'Reddet' enabled and validate on submit." }
  - { id: F-W5-5, rule: "After an answer the card or the row is gone (dropProposal, dropDeck: kosk-decks-view.tsx:124-132) and with it the 'Reddet' or 'Gizle' that had the focus; the dialog closes on a button that has left, no code moves the focus, and only a toast of 6 seconds (or none, when the proposal was the last: the whole block goes) says what happened, so a keyboard or screen-reader user falls back to the top of the page. The inventory marks what Base UI does then as not verified; the family is F-X-7. Fix: move the focus to the next card or row, or to the section's heading." }
  - { id: KDECK-4, rule: "New, from the code, not seen: the same loss of focus after the form. 'Desteyi aç' pushes to the list and refreshes it (kosk-deck-form.tsx:96-97); the new page sets no focus, so the focus lands on the document and the only word that the deck is open is a 6-second toast. Fix: focus the new deck's row, or the h1, on arrival." }
  - { id: F-X-2, rule: "The field errors of this flow, 'Bir deste adı yazın.' under the name and 'Bir gerekçe yazın.' under the reason, are Base UI Field.Error lines tied to their field by aria-describedby and are no live region (libs/ui/src/mds/field.tsx): nothing announces them when they appear. On a submit the name field receives the focus (kosk-deck-form.tsx:76), which reads its description; on a blur nothing moves." }
  - { id: F-X-5, rule: "Two toast hosts are mounted (client-providers.tsx); sonner's has the default label 'Notifications alt+T', in English, because the app passes only the close label (libs/ui/src/components/sonner.tsx:55-72). Every toast of this flow is sonner's. Not verified in a browser." }
  - { id: F-X-10, rule: "Reading the page shows loading.tsx: a <div aria-busy=true> whose children are aria-hidden skeletons (app/kosks/[id]/desteler/loading.tsx:6; Skeleton is aria-hidden), so a screen reader hears nothing while the köşk is read. The graph's `reading` has no screen. The form page has no loading.tsx of its own, so the nearest one, this one, wraps it too (Next wraps a nested page in the segment's boundary; not seen), and it draws the shape of the list, not of a form." }
  - { id: KDECK-1, rule: "New, from the code, not seen. A proposal that was answered by a colleague, or deleted, before 'Kabul et' is followed makes /yeni?oneri=<id> open EMPTY with no banner and no word that the proposal is gone (yeni/page.tsx:53-56 looks it up among the waiting ones and falls back to null; the page's own comment says 'an id that is not a waiting proposal of this köşk is ignored'). The nazım who pressed 'Kabul et' sees an empty form and may open a deck from scratch believing it is the proposal's; the proposal then stays waiting. The same happens for a proposal that IS waiting but is not among the first twelve: the form page reads only the first page of the köşk's proposals (reads.ts:43-52, page 1 and limit 12) and looks the id up there, while the list's 'Daha fazla göster' shows the thirteenth and later with their own 'Kabul et' links, which therefore open an empty form (derived from the code, not seen). Fix: read the proposal by its id, or say that it is not found, and take the person back to the list." }
  - { id: KDECK-2, rule: "New, from the code and the domain. Accepting a proposal tells the proposer nothing: createKoskDeck writes the deck and marks the proposal ACCEPTED (deck-review.repository.ts:377-421) and calls no notification, while a refusal writes one with the reason (deck-review.service.ts:276, tell()). The hoca finds out only by seeing the deck. The toast 'Deste açıldı' does not say that a proposal was accepted either. Fix: send the same DECK_PUBLISH_RESULT notification on acceptance and name the proposal in the toast." }
  - { id: KDECK-3, rule: "New, from the code, not walked: the persona of this flow cannot meet it. 'Deste gizlensin mi?' says 'Arşivden istediğiniz an geri alabilirsiniz.' to everyone (KoskDecksPage.hideBody), but the başnazım, whom assertKoskNazim lets into this page, hides at the PLATFORM level (deck-review.service.ts:253-257), and the köşk's nazımı cannot restore what a higher kademe hid (ARCHIVE_RESTORE_LEVEL, nizam.moderation.restoreArchived). The text is the same for both. Fix: say who can bring it back, as the archive's own row does (HideLevel.locked)." }
  - { id: KDECK-5, rule: "New, from the code. A proposal's card (kosk-decks-view.tsx:289-327) shows its title, description, the hoca, the course and the date but not whether it is a vocabulary or a hadith deck; the nazım learns the type only after following 'Kabul et', in the form (formFromProposal). Fix: put the card type's word in the card, as the table does for a deck." }
  - { id: focus-not-set, rule: "Neither page sets a focus on load or after a step except the empty-name submit (titleRef.focus()), the reject dialog's field and the hide dialog's 'Vazgeç'; the page nodes carry no initialFocus and no focus. The replay checks only those." }
  - { id: label-in-name, rule: "Three of the four named controls of a row hold their visible word in their accessible name, case aside: 'Kabul et' in '{title} önerisini kabul et', 'Reddet' in '{title} önerisini reddet', 'Gizle' in '{title} destesini gizle' (WCAG 2.5.3). 'Kartları düzenle' does not: KDECK-6." }
  - { id: KDECK-6, rule: "New, from the code and the catalog (WCAG 2.5.3, label in name). The link's visible text is 'Kartları düzenle' (KoskDecksPage.editCards) and its aria-label is '{title} kartlarını düzenle' (editCardsLabel, kosk-decks-view.tsx:225): 'kartları' is not a part of 'kartlarını', so a person who says the words they see to a voice-control program does not reach the link. nizam.nav's binding finds the same link by its address for that reason. Fix: word the label '{title} için kartları düzenle' or 'Kartları düzenle: {title}'." }
  - { id: KDECK-7, rule: "New, from the code. The page promises the archive twice, in the hide dialog ('Arşivden istediğiniz an geri alabilirsiniz.') and in the toast ('köşkün arşivine taşındı.'), and links to it nowhere: the only way is the köşk menu's 'Arşiv' entry (shell-nav.ts:253). The köşk's own Dersler page has a link 'Arşiv' (kosk-courses-view.tsx:161), this page has none. e2e deck-review#9 reaches the archive by typing its address. Fix: an 'Arşiv' link in the page's header, or in the toast's action." }
  - { id: confirm-before-hiding, rule: "'Gizle' asks first, in an alertdialog whose focus starts on 'Vazgeç' and which says that nothing is deleted and that the archive brings it back; it is a primary, not a destructive button. 'Reddet' asks for a reason first, in a modal form dialog the scrim does not close. Holds." }
  - { id: a-proposal-is-answered-once, rule: "tedrisat answers a proposal once: the update is `where status = 'PENDING'` and no row means DECK_PROPOSAL_NOT_PENDING (deck-review.repository.ts:526-528); opening a deck from it rolls the deck back when it was answered meanwhile (:377-421). The page treats not-pending and not-found as 'it is gone': the row leaves and the dialog closes. Holds." }
