# The screens of nizam.platform.auditLog: nizam-web's Denetim kaydı (/denetim-kaydi, app/denetim-kaydi/page.tsx) as the başnazım and a Medaris nazımı who holds
# platform.audit_read meet it: the page (features/platform-admin/components/audit-view.tsx) with its header and export link, the notice, the filter form, the
# table with its older rows and the box that says the log could not be read. The section refusal and the shell around the page are other flows'
# (nizam.shell.noAccessAndNotFound, nizam.shell.menuPerPersona). Read from the code on 16 Nov 2026; nothing was opened in a browser.
#
# Words: every `AuditPage.*` key is copied from libs/i18n/src/locales/tr/nizam.json (the app reads it as `nizam.AuditPage`), the key being the path inside
# that file. The `composed.*` keys are NOT in any i18n file: they are texts the app builds in code from data, written here with their placeholders:
#   composed.AuditPage.number   "#" and the row's number (recordNumber, present.ts:238; audit-view.tsx:126)
#   composed.AuditPage.when     the day word or date, and the time (when(), audit-view.tsx:110-116)
#   composed.AuditPage.name     the person's name, in <bdi> (audit-view.tsx:139)
#   composed.AuditPage.person   the same name, for the rows of a person the filter named (audit-view.tsx:139)
#   composed.AuditPage.scopeName  the köşk's or medrese's name, or "Platform" (audit-view.tsx:173)
#   composed.AuditPage.myNumber   one row's number, the row the walk's setup wrote (the binding gives its value)
#   composed.Button.loading     "Yükleniyor", the hidden status of a busy Button (libs/ui/src/mds/button.tsx:103; F-X-17)
# `Changes.note` is the one entry copied from no file: the flow invokes the export, which writes a row to the log, so the graph carries a note that
# says so (authored for this graph; the app has no such message).
# The table is Table responsive="stack": the table, its rows and its cells carry explicit roles and each cell a data-label (the column's words), which
# is the hook for the cells (libs/ui/src/mds/table.tsx:94-132). The detail line under a row's kind, the person's role and the closing "Platform" caption
# of a platform row are not drawn: they are data, and not every row has them.
# Rows are data and the log is shared: the graph draws what a row is and never how many there are.
