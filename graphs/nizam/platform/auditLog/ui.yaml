rules:
  - { id: focus-not-set, rule: "Denetim kaydı sets no initial focus (no autoFocus and no focus() in features/platform-admin or app/denetim-kaydi), so the page node has no `initialFocus`, and a filter keeps it nowhere in particular: see AUDIT-2. The shell's <main> is not labelled either." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): the four fields are named by their visible labels, 'Dışa aktar' and 'Daha eskileri göster' by their own words" }
  - { id: F-W3-2, rule: "audit-view.tsx:337 and the catalog's AuditPage.retention tell every reader 'Kayıtlar [KVKK saklama süresi] boyunca saklanır.' with the bracketed placeholder never filled in; e2e platform-admin#5 pins the placeholder, so fixing the text breaks the test. Fix: write the real period and drop the pin." }
  - { id: F-X-21, rule: "the same finding as F-W3-2, as the register of unfilled placeholders lists it (apps/nizam/features/platform-admin/components/audit-view.tsx:337)" }
  - { id: F-W3-4b, rule: "'Dışa aktar' is `<a download>` to a route handler (audit-view.tsx:194, app/api/audit-log/export/route.ts:16-53); a refusal or failure comes back as JSON {\"error\":\"Export failed\"} with tedrisat's status (a 401 {\"error\":\"Unauthorized\"} with no token, a 502 on a network error) that the browser downloads or shows, and the page says nothing. The graph draws it from a list that did not load (exportingBad), the one failure the stack can make. A link styled as a button is right for a download; the silence is the finding. Fix: fetch the file, announce a failure in a status or alert, or render the failure as an error page. From the code: how this browser treats a download that answers 400 was not seen." }
  - { id: F-W3-12, rule: "a filter, 'Tekrar dene' and 'Daha eskileri göster' change the table with no announcement: the table has no live region and no status line says how many rows came or how many fit. A screen-reader user hears nothing after choosing a kind or pressing the button. Fix: a polite status line '{n} kayıt' beside the table (audit-view.tsx:76-92,316-324)." }
  - { id: AUDIT-1, rule: "new: the export holds at most 10 000 rows, the newest (AUDIT_EXPORT_MAX, audit.service.ts:93; the list's cursor does not apply). A log with more rows is exported cut and neither the link, the page nor the file says so; the file has no footer and the row count is only in the log's own `audit.export` row. Fix: say on the link or beside it 'en yeni 10 000 kayıt', or write a last line in the file when it was cut. (e2e platform-admin#5 compares the file's rows with the whole table's count, which fails past 10 000 rows and races with every other writer.)" }
  - { id: AUDIT-2, rule: "new, from the code and not seen in a browser: page.tsx:36 keys <AuditView> by the filters' query, so every filter change mounts a new view, the filter form included. The select, the date field and the person box a person was working in are replaced when the server answers; the person box keeps its text (it is read from the address) but the focused element is a new one, so the focus very likely falls to the page and a keyboard user starts again from the top after every choice; Base UI's Select would normally return the focus to its trigger. 'Daha eskileri göster' is not affected (no key change). Fix: do not key the whole view; key only the table, or reset the rows in an effect, so the form keeps its place. To be verified at the walk." }
  - { id: AUDIT-3, rule: "new: a row's scope reads `e.scope.name ?? t('scopes.PLATFORM')` (audit-view.tsx:173) with the caption of its kind under it. A row whose köşk or medrese no longer exists (the log keeps the rows of every deleted köşk: kosk.delete, course.delete, kosk.create ... on the stack) has a scope KIND of Köşk and no name, and the page says 'Platform' as its name with 'Köşk' under it: a wrong name, not a missing one. A platform row says 'Platform' twice. Fix: say 'Silinmiş köşk' (or the entity's id) when the kind is Köşk or Medrese and the name is gone, and drop the caption for the platform." }
  - { id: AUDIT-4, rule: "new: the person box has no maxLength and the page sends what is typed (parseAuditFilters, present.ts:131) while the API's DTO caps `actor` at 200 characters (audit.dto.ts:24). A longer text is refused with 400, which the page reads as any failure: 'Kayıt okunamadı ... Biraz sonra yeniden deneyin.', and 'Tekrar dene' sends the same address again, so it cannot work; erasing the text is the only way out and nothing says so. Fix: maxLength={200} on the input (or trim in parseAuditFilters) and a message that names the cause." }
  - { id: AUDIT-5, rule: "new, corrects the inventory: the 'Ne yaptı' list holds 'Tümü' and sixteen kinds (AUDIT_TYPE_OPTIONS, present.ts:84-101), not seventeen: the kind 'Diğer işlem' (OTHER) is the label of a row no kind claims and has no option, so those rows (inactive_scope.view, and every action a kind rule does not name) are reachable only under 'Tümü'. 'Devral ya da düşür' (TAKEOVER) is an option that never matches: no code writes permission.take_over or permission.drop (domain invariant every-audit-filter-has-a-writer). Fix: add 'Diğer işlem' to the list, and drop or wire TAKEOVER." }
  - { id: AUDIT-6, rule: "new: the notice says 'Bu kaydı yalnız siz görürsünüz' (you alone see this log) to every reader. It is read by the başnazım and by every Medaris nazımı who holds platform.audit_read, so 'yalnız siz' is false for the second kind of reader. Fix: say 'Bu kaydı yalnız başnazım ve denetim izni olan Medaris nâzımları görür'." }
  - { id: AUDIT-7, rule: "new: a Medaris nazımı who holds platform.audit_read is admitted by the API and the page, and the menu has no entry for them (the entry is the başnazım's alone, nav graph nizam.nav) and nothing links to the page: they can read the log only if they know the address (nav.yaml notes the same for six pages, F-W2-1). Fix: give the Medaris menu a 'Denetim kaydı' entry for the holders of the permission." }
  - { id: select-name-not-value, rule: "each filter's Select is a combobox named by its Field label ('Kişi' is a searchbox, 'Ne yaptı', 'Kapsam' and 'Tarih' are comboboxes); its current choice is its text, not its name. The graph draws the choice as a text node beside it (kindAll, kindPolicy ...) found by the combobox's own text." }
