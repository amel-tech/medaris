# What must exist for the başnazım (and a Medaris nazımı who holds platform.audit_read) in nizam.platform.auditLog: the flow's product list, written from the
# flow's story and its open decisions, never from what the page does today. A need that is not met is a gap in graphs/needs.gaps.yaml (the orchestrator merges
# it; this file does not edit it).
#
# Gaps of this file, for that merge:
#   missing:   the-log-says-how-long-it-is-kept (F-W3-2), the-export-says-how-much-it-holds (AUDIT-1), a-failed-export-says-so (F-W3-4b),
#              a-change-of-rows-is-announced (F-W3-12), a-granted-medaris-nazim-finds-the-page (AUDIT-7), every-kind-the-log-lists-can-be-chosen (AUDIT-5),
#              a-deleted-scope-is-named-as-deleted (AUDIT-3), a-name-too-long-is-refused-in-words (AUDIT-4), the-notice-says-who-sees-the-log (AUDIT-6),
#              the-filter-form-keeps-its-place (AUDIT-2)
#   unwalked:  the-downloaded-file-is-the-filtered-log (the replay cannot read a download: the file the browser saves is not checked, only the row the export
#              writes and the same CSV through the API), an-older-page-that-fails-says-so (nothing on the stack makes that one read fail),
#              the-log-cannot-be-changed (a property of the API, with no check on any page), a-page-with-few-rows-offers-no-older-button (the stack's log
#              holds hundreds of rows, so a view that fits one page without the kind filter cannot be made)
# No gender or kontenjan need: no seat is decided on this page. No Linear key is known for any of the missing needs: they are findings of this write-up, not of
# planned work, so `missing` says `none`.
kind: needs
flow: nizam.platform.auditLog
status: proposed

needs:
  - id: read-the-log-newest-first
    need: >-
      The başnazım, and a Medaris nazımı who was given the audit permission, read in one place everything that was read or changed on the platform that
      matters to a person's rights: the record number and time, who did it and in what role, what kind of act it was with a line of detail where its writer
      kept one, and where it happened (the platform, a köşk or a medrese). Newest first.
    drawn: [listed, listedMore, rowRecord, rowWhen, rowActor, rowKind, rowScopeName, rowScopeKind]
    built:
      - action: medaris.api:listAuditLog
      - route: apps/nizam/features/platform-admin/components/audit-view.tsx:317
    walked:
      - e2e: apps/nizam/e2e/platform-admin.e2e.ts
        check: 'platform-admin#5'
      - replay: chief

  - id: only-the-chief-and-the-granted-read
    need: >-
      Only the başnazım and a Medaris nazımı who holds platform.audit_read may read or export the log. A köşk nazımı, a başmüderris, a talebe, and a Medaris
      nazımı without the permission are refused in words and see none of it.
    drawn: [reading, handed_over.no_access]
    built:
      - action: medaris.api:listAuditLog
      - action: medaris.api:exportAuditLog
      - route: apps/nizam/app/denetim-kaydi/page.tsx:31
    walked:
      - e2e: apps/nizam/e2e/platform-admin.e2e.ts
        check: 'platform-admin#6'
      - replay: stranger
      - replay: medaris

  - id: narrow-by-person-kind-scope-and-time
    need: >-
      A reader narrows the log by person (a name or e-mail fragment), by kind of act, by scope (platform, köşk, medrese) and by time (a preset or two days), the
      filters combine, and the address carries them, so that a link or a reload opens the same view.
    drawn: [personField, kindField, kindAll, kindPolicy, scopeField, scopeAll, scopePlatform, rangeField, rangeAll, rangeRecent, rangeCustom, fromField, toField, reading, empty]
    built:
      - action: medaris.api:listAuditLog
      - route: apps/nizam/features/platform-admin/present.ts:131
    walked:
      - e2e: apps/nizam/e2e/platform-admin.e2e.ts
        check: 'platform-admin#5'
      - replay: chief

  - id: find-the-row-an-act-wrote
    need: >-
      After someone does an audited act, such as switching a platform policy, the reader finds the row it wrote by the kind ("Politika değişikliği"), the
      person and the time, and every row the kind filter shows is of that kind.
    drawn: [kindPolicy, rowKindPolicy, myRecord, listed]
    built:
      - action: medaris.api:listAuditLog
      - action: medaris.api:setPlatformPolicy
    walked:
      - e2e: apps/nizam/e2e/platform-admin.e2e.ts
        check: 'platform-admin#7'
      - replay: chief

  - id: read-older-rows
    need: >-
      Fifty rows are shown at a time and the reader can go back as far as the log goes, with the same filters, without losing the rows already read.
    drawn: [listedMore, loadingOlder, olderButton, olderBusy]
    built:
      - action: medaris.api:listAuditLog
      - route: apps/nizam/features/platform-admin/components/audit-view.tsx:93
    walked:
      - replay: chief

  - id: an-older-page-that-fails-says-so
    need: >-
      When the next fifty cannot be read, the reader is told in words and keeps what they have, and can try again.
    drawn: [loadingOlder, olderToastTitle, olderToastBody]
    built:
      - route: apps/nizam/features/platform-admin/components/audit-view.tsx:99

  - id: the-downloaded-file-is-the-filtered-log
    need: >-
      "Dışa aktar" gives the reader a file with the same filters, in a form a spreadsheet opens (a header line, one row a line, a UTF-8 mark, cells that cannot
      run as formulas), and the export is itself written to the log with its filters and its row count.
    drawn: [exportLink, exporting, exportingMore]
    built:
      - action: medaris.api:exportAuditLog
      - action: medaris.api:webExportAuditLog
      - route: apps/nizam/app/api/audit-log/export/route.ts:86
    walked:
      - e2e: apps/nizam/e2e/platform-admin.e2e.ts
        check: 'platform-admin#5'
      - replay: chief

  - id: the-export-says-how-much-it-holds
    need: >-
      The reader is told that the file holds the newest 10 000 rows of the filters at most, on the link or in the file, so that a cut file is never taken for
      the whole log.
    drawn: [exportLink, exportingMore]
    missing: none

  - id: a-failed-export-says-so
    need: >-
      When the file cannot be made (the reader may no longer read the log, the session ended, the API is down), the page says so and the reader is not left to
      read a JSON error in a download.
    drawn: [exportingBad, exportLink]
    missing: none

  - id: the-log-says-how-long-it-is-kept
    need: >-
      Every reader is told how long the log is kept, in a real period, not a placeholder (KVKK).
    drawn: [retentionLine]
    missing: none

  - id: a-change-of-rows-is-announced
    need: >-
      A screen-reader user is told how many rows a filter or the next fifty left, so that choosing a kind or pressing the button is never met with silence.
    drawn: [reading, loadingOlder, olderBusy]
    missing: none

  - id: the-filter-form-keeps-its-place
    need: >-
      Choosing a filter does not replace the form the reader is working in: the focus stays where it was, so a keyboard user can set the kind, then the scope,
      then the time without starting over from the top of the page.
    drawn: [filterForm, reading]
    missing: none

  - id: a-granted-medaris-nazim-finds-the-page
    need: >-
      A Medaris nazımı who may read the log finds it from their menu, as the başnazım does.
    drawn: [reading]
    missing: none

  - id: every-kind-the-log-lists-can-be-chosen
    need: >-
      Every kind of act a row can say is a choice of "Ne yaptı", the "other" kind included, and every choice can match a row.
    drawn: [kindField, rowKind]
    missing: none

  - id: a-deleted-scope-is-named-as-deleted
    need: >-
      A row whose köşk or medrese no longer exists says so in its scope, never the name "Platform".
    drawn: [rowScopeName, rowScopeKind]
    missing: none

  - id: a-name-too-long-is-refused-in-words
    need: >-
      A person text the log cannot search for is stopped in the field, with the reason, instead of ending in the box that says the log is unavailable.
    drawn: [personField, loadFailed, failedAlert]
    missing: none

  - id: the-notice-says-who-sees-the-log
    need: >-
      The notice names who may read the log truthfully: the başnazım and the Medaris nâzımları who were given the audit permission.
    drawn: [noticeAlert, noticeBody]
    missing: none

  - id: the-log-cannot-be-changed
    need: >-
      No person and no screen edits or deletes a row of the log; the page says so and the API has no route that could.
    drawn: [pageIntro]
    built:
      - route: apps/tedrisat/src/audit/audit.controller.ts:32
