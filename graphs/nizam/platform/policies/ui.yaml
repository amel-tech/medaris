# The screens of nizam.platform.policies: Platform ayarları (nizam-web, /ayarlar/platform) as app/ayarlar/platform/page.tsx and
# features/platform-admin/components/policies-view.tsx draw it: the two switches, "Politikalar nasıl birleşir", the table of the köşks that apply a rule
# on their own, the box that takes their place when the read fails, the sonner toasts of a save, and the shell's refusal for a person who may not edit
# the policies. Read from the code of the branch on 16 Nov 2026; nothing was opened in a browser, so the focus and what a screen reader says are from
# the code, and the table's row is the one the walk makes (a köşk of its own that applies "Kayıt her zaman onaylı").
#
# Words: every `PlatformSettingsPage.*` and `NoAccess.*` key is copied from libs/i18n/src/locales/tr/nizam.json (the app reads them as
# `nizam.PlatformSettingsPage` and `nizam.NoAccess`), `common.toast.close` from common.json, the key being the path inside each file. Four kinds of text
# are not in an i18n file:
#   composed.PlatformSettingsPage.scopeName / by / at   the first, third and fourth cell of a table row: the köşk's name and the person's name as the API
#                                                        gives them, and the date as shortDateTime writes it ("16 Kas 14:30"; policies-view.tsx:94,111,120)
#   Changes.note   the one message of this catalog that is not the app's. The flow writes with one action, and the app says only that a change applies at
#                  once and is logged (instantNote) and what each policy is (the two descriptions); no message says what a switch does to the platform and
#                  how it is taken back, so the note joins what the descriptions, the introduction and tedrisat's own description of the route say.
# Samples are invented and neutral; the köşk of the table is the one the walk's setup makes, and the date is whatever moment the setup switched the rule.
