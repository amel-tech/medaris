rules:
  - { id: focus-not-set, rule: "Platform ayarları sets no initial focus (no autoFocus and no focus() in app/ayarlar/platform or policies-view.tsx), so the page node has no `initialFocus`, and the graph says nothing of the focus when the page opens, after a save or after a retry. Recorded so the silence is not read as an omission. From the code, not looked at in a browser." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): each switch is named by its own label (aria-labelledby the label's span), the retry button and the close button carry their own words" }
  - { id: F-W3-6, rule: "policies-view.tsx:166: the switch is `disabled` while its own save runs, and nothing else says a save is running (no busy text, no aria-busy; the toast comes only at the end). The inventory says disabling the focused control drops the keyboard focus to the page. Read from the kit's switch (libs/ui/src/mds/switch.tsx, Base UI's SwitchRoot, switch/root/SwitchRoot.js): the focusable root is a <span role=switch> that gets aria-disabled and tabindex -1 (useFocusableWhenDisabled.js:36-39), not a native disabled element; only the hidden input is natively disabled. A span keeps the focus when its tabindex changes, so the focus is probably kept and only the state is lost. NOT verified in a browser: the walk phase looks at document.activeElement after a press. Fix: keep it enabled with aria-busy, and say 'Kaydediliyor' in a status." }
  - { id: F-X-20, rule: "platform-admin.e2e.ts (restorePolicies, :194-198) deletes every row of platform_policies and inserts back what it saw, so a crash between the two statements leaves a shared database with no policies at all; and its test nizam/19 switches one policy once and never back, leaving the platform changed until the afterAll runs. This graph's binding never deletes a row it did not record: it records both keys exactly (no row, or the row's three columns), switches one on and off inside the scenario, and writes back what it recorded in the teardown, idempotently, also when the walk stopped midway (policies.mjs). The e2e name also promises 'the table lists the köşks that apply a rule themselves' and its body never looks at the table: the scenario ownScope does." }
  - { id: F-X-5, rule: "the toasts of this page are sonner's (policies-view.tsx:9), mounted beside the unified kit's toaster: sonner's region is labelled in English by default ('Notifications alt+T') and its close button takes the Toaster's closeLabel ('Kapat', client-providers.tsx:53). The same as every sonner page of nizam. Fix: one toast host, labelled from the catalog." }
  - { id: POL-1, rule: "new: a platform-wide switch is one press with no confirmation. 'Kayıt her zaman onaylı' turns every new enrolment of every köşk, medrese and course into an application from the moment the answer arrives, and the line that says 'Her değişiklik anında geçerli olur ve denetim kaydına yazılır.' (policies-view.tsx:177) sits under the list, so a reader meets it after the switches. It is undone by pressing again, and both presses are logged, so the cost is a window in which enrolments wait; applications made in it stay waiting after the switch is off (platform-policy.repository.ts:109 only upserts the row). From the code. Decision for the owner: ask first, or put the line before the switches, or leave it." }
  - { id: POL-2, rule: "new: the köşks that already apply a rule on their own are named in a <p class=mds-caption> under the switch (policies-view.tsx:169-173: 'Kendi kapsamında uygulayan: …'), and the switch's aria-describedby points at its description only (switch.tsx:49-52), so a person on the switch hears what the policy does and never that köşks apply it already; and the list, an <ul class=list-none>, has no name. From the code. Fix: put the caption in the switch's description." }
  - { id: POL-3, rule: "new: the table is headed 'Köşk ve medrese politikaları' and, empty, says 'Kendi politikasını uygulayan köşk ya da medrese yok.', but the API lists köşks only (platform-policy.repository.ts:136 scoped() reads `kosks`; the controller says 'Medreses have no policy settings of their own yet', platform-policy.controller.ts:82) although madrasah_settings holds three policy columns that the engine enforces. So the empty line is false for a medrese that applies a rule, and the label 'Medrese' of scopeKinds is dead. The domain holds this as invariant platform-policy-scoped-list-covers-every-scope (holds: false, finding scoped-policies-lists-only-kosks). Fix: list the medreses, or name the köşks alone in the heading and the empty line." }
  - { id: POL-4, rule: "new, latent: failureKey (features/platform-admin/present.ts:39) answers every code of the platform screens with a key of its own, and policies-view.tsx:76 reads it in the namespace PlatformSettingsPage, whose `errors` holds only `generic` and `forbidden`; PLATFORM_POLICY_LOCKED, KOSK_APPLICATION_DECIDED, COURSE_REQUEST_* would ask for errors.locked, errors.answered, errors.gone, errors.courseGone, which this namespace lacks. Unreachable today: PUT /nizam/platform-policies never answers those codes (the service never throws PLATFORM_POLICY_LOCKED here: platform-policy.service.ts:93-104, and the domain's note on setPlatformPolicy). From the code, not run. Fix: map to the page's own two keys, or give the namespace the rest." }
  - { id: POL-5, rule: "new: `busy` is one key for two switches (policies-view.tsx:57,69,71). Pressing the second switch while the first save is out moves `busy` to the second key, so the first switch is enabled again; when the first answer arrives it sets `busy` to null (the second switch is enabled while its own save is out) and replaces the list with one that may not yet hold the second change (setItems(result.data.items), :81), so the second switch can snap back until its own answer comes. From the code, not looked at in a browser. Fix: `busy` as a set of keys, and an answer applied to its own key only." }
  - { id: POL-6, rule: "new, the API's: PlatformPolicyRepository.set writes the audit row `platform_policy.change` whatever it found (platform-policy.repository.ts:121-126): `was` is read and never compared with `enabled`, so a PUT of the value a key already holds adds a row whose `was` equals `enabled`. The page cannot send it (a press always flips), the API can, and the log is what the page calls proof. From the code, not run. Fix: write nothing when the value does not change." }
  - { id: POL-7, rule: "new, the same family as F-W2-1 and AUDIT-7: the page and the API admit a Medaris nazımı who holds platform.policy_edit (page.tsx:24 and platform-policy.service.ts:72 ask the permission, not the role), and lib/shell-nav.ts even lists \"platform-settings\": [\"platform.policy_edit\"] among the permissions behind a Medaris menu item (:304), but medarisGroups (:177-186) keeps only Medreseler, Köşkler, the three requests and Yasaklamalar of the başnazım's menu, so no Medaris nazımı is ever drawn 'Platform ayarları' and a permitted one finds the page only by its address. From the code. Decision for the owner: keep 'platform-settings' in the Medaris menu for the holders of the permission, or take the permission off the Medaris nazımı's list." }
