# The screens of nizam.courseRequests.decide: "Ders talepleri" of a köşk (/kosks/<id>/ders-talepleri) with its two tabs, the list and the card
# of a request, the reject dialog and the toasts of an answer, and the screen that says "Bu bölüm için izniniz yok". Read from
# apps/nizam/features/platform-admin/components/course-requests-view.tsx, apps/nizam/features/deck-review/components/reject-dialog.tsx and
# apps/nizam/components/errors/no-access.tsx on 16 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nizam.json (namespaces
# CourseRequestsPage, DeckReject, NoAccess) and common.json (toast.close). Nothing was looked at in a browser: every node is "from the code".
#
# Text the page builds in code, in no i18n file, is `composed.CourseRequestsPage.<name>` (a single placeholder: the request's title, the köşk's,
# the medrese's and the sender's names, the date, the reason, a tab's count) and `composed.Button.loading` (the hidden <output> of a busy
# button, "Yükleniyor", libs/ui/src/mds/button.tsx:113: a hard-coded default).
#
# The `changes` message is the page's own `CourseRequestsPage.answerNote`: it says what the two buttons do and who reads the reason.
#
# The frame (the sidebar, the köşk picker, the bell) is outside this view (scope.outOfView), so no node of it is drawn. While the reject dialog is
# open the page behind it is inert, so no page node is `in` a dialog state; the toasts live in their own portal and are.
