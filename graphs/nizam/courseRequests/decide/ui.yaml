rules:
  - { id: focus-not-set, rule: "No code of this page moves the focus: not when it opens, not after a tab is chosen or a row selected (F-W3-5), and not after a decision. The page node has no `initialFocus` on purpose." }
  - { id: F-W3-5, rule: "course-requests-view.tsx:271-290: Tabs mode=tabs with no TabsPanel children, so the tabs control no panel (aria-controls points at nothing); the list and the card below are plain regions; a tab switch or a row selection changes the page with no announcement and no focus move; the selected row is shown with aria-current on a button. Fix: TabsPanel around the list, a polite status line '{n} talep', and a name for the list." }
  - { id: F-X-1, rule: "The same family as F-W3-5 across nizam's pages that draw Tabs without TabsPanel (libs/ui/src/mds/tabs.tsx:68-80 lets a caller leave the panel out)." }
  - { id: F-W3-9, rule: "ders-talepleri/page.tsx:10-13 and the view's h1: the tab title and the heading say 'Ders talepleri' for every köşk; for a nazım of several köşks only the card's 'Açılması istenen köşk' (once a request is selected) and the scope picker say which. Fix: put the köşk's name in the title and an eyebrow." }
  - { id: F-X-2, rule: "libs/ui/src/mds/field.tsx: the reason's error 'Bir gerekçe yazın.' is a Base UI Field.Error with no live region and no focus move, and the dialog's button is natively disabled while the reason is blank, so a keyboard or screen-reader user hears nothing about why. Fix: keep the button on and say the error in a role=alert line on press, or announce it." }
  - { id: F-UI-W1-1, rule: "libs/ui/src/mds/dialog.tsx:103: the dialog's description is its whole body (BaseDialog.Description wraps the paragraphs and the field), so a screen reader reads all of it as the description." }
  - { id: CREQ-1, rule: "The toast says 'gerekçe başmüderrise iletildi' and the dialog 'Gerekçeyi medresenin başmüderrisi görür', but rejectCourseRequest writes an audit row and sends no notification or mail (apps/tedrisat/src/course-request/course-request.service.ts:166-197): the başmüderris finds the refusal only by opening İtirazlar. Fix: notify her and the nazırs who may ask (decision D1), or word the toast 'gerekçe kaydedildi'." }
  - { id: CREQ-2, rule: "After the last waiting request is answered, the card (and the 'Reddet' that the dialog gives the focus back to) leaves the page with the list (settle, course-requests-view.tsx:103-111), so the focus falls to the document; with other requests waiting the next one is selected and the card is kept. The only word is a toast of 6 seconds. Not verified in a browser. Fix: move the focus to the tab, the empty line or the next row, and keep a status line." }
  - { id: CREQ-3, rule: "course-requests-view.tsx:262: when reading the Karara bağlanan tab fails, `failed` is true and that tab has no list, so the Alert replaces the whole block including the tabs: the Bekleyen list that was read cannot be reached again (no tab to press) until the page is reloaded, and 'Tekrar dene' retries the tab that failed. Fix: draw the Alert under the tabs." }
  - { id: CREQ-4, rule: "'Kabul et' accepts nothing: it is a <button> that calls router.push to the Ders aç form (course-requests-view.tsx:234), and the request is accepted only when a course is made from it (nizam.courses.open); leaving the form leaves the request waiting, and the only word is the caption under the card. It cannot be opened in a new tab either. Fix: name it after what it does or make it a link, and say on the form that the request is not yet accepted (decision D2)." }
  - { id: CREQ-5, rule: "settle (course-requests-view.tsx:103-111) counts every request that leaves the waiting list as decided: after COURSE_REQUEST_NOT_FOUND (a request that is gone, answered by nobody) the Karara bağlanan tab's number is one too high until that tab is read again. Fix: add one only for a request that was answered." }
  - { id: CREQ-6, rule: "The card of an accepted request names no course: the API sends `courseId` (listCourseRequests) and the view never reads it (course-requests-view.tsx:169-250), so the nazım cannot go from an accepted request to the course made from it. Fix: link the course on the card." }
  - { id: confirm-before-rejecting, rule: "Reddet asks first, in a form dialog whose reason is required and whose button stays off until one is written (the API also requires it: RejectReasonDto, `\\S`); Kabul et needs no question because it writes nothing (CREQ-4)." }
  - { id: toast-is-the-only-word, rule: "The result of a refusal is said by a sonner toast (a list item in the Toaster's live region): 'Talep reddedildi' closes by itself after 6 seconds, an error toast stays until it is closed. The page itself says nothing but the row leaving and the counts moving." }
  - { id: busy-label-not-in-the-catalog, rule: "The dialog's busy button passes no loadingLabel, so its hidden status says 'Yükleniyor' from a hard-coded default (libs/ui/src/mds/button.tsx:103)." }
