  tableHidden: { type: list, component: List, role: table, name: { key: MadrasahsPage.caption.HIDDEN }, in: [list, restoring, restored], when: "tab == 'hidden'", source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:427 }
  tableAll: { type: list, component: List, role: table, name: { key: MadrasahsPage.caption.ALL }, in: [list, restoring, restored], when: "tab == 'all'", source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:427 }

