  rowHandle: { type: text, component: Text, text: { key: composed.MadrasahsPage.handle, params: { handle: madrasah.handle } }, in: [list, restoring, restored], when: rowListed, source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:159 }
