# The screens of nizam.madrasahs.restore: the Medreseler page (/medreseler) as it bears on a hidden medrese: the table with its row, the
# row's "Geri al" (or what stands in its place), the busy state, the row after the restore, and the toasts of each answer. Read from
# apps/nizam/features/madrasahs/components/madrasahs-view.tsx, present.ts and app/medreseler/page.tsx on 15 Nov 2026; nothing was opened
# in a browser. The words are copied from libs/i18n/src/locales/tr/nizam.json (the app reads it as `nizam.MadrasahsPage` and
# `nizam.HideLevel`) and common.json (`toast.close`); a key is the path inside the file's root.
#
# Words that are NOT in an i18n file, so they are `composed.*` or authored:
#   composed.MadrasahsPage.name     the medrese's name as the API gives it (madrasahs-view.tsx:158)
#   composed.MadrasahsPage.handle   "@" and its short name (madrasahs-view.tsx:159-161)
#   composed.MadrasahsPage.head     the başmüderris's name as the API gives it (madrasahs-view.tsx:172)
#   composed.Button.loading         the hidden status text of a busy button, a hard-coded default of libs/ui/src/mds/button.tsx:62 (RESTORE-3)
#   Changes.note                    AUTHORED, the only one: the app's own toast says "{name} yeniden listelerde." and nothing of the courses
#                                   that come back with the medrese, of what stays hidden, of a medrese that is passive as well, or of the
#                                   audit row; the sentences are the API's own (MadrasahController.restore's description)
# The words under "Gizli" ("{date}'den beri") are built in code (present.ts: dateWithCase) from `madrasah.since`, the day the walk hides the
# medrese; the sample `dateAblative` is the day this was written, and the binding finds that node by its ending, not by the sample.
# A node whose text is a number ("0", "1") is the Ders column's count of courses that are not hidden: 0 while the medrese is hidden, 1 once
# it is back (the walk's medrese holds one course).
schema: delurio-graph/0
kind: ui
id: nizam.madrasahs.restore
flow: nizam.madrasahs.restore
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  name: Geri Alma Denemesi Medresesi
  handle: geri-alma-denemesi
  head: Dilek Başvuran
  level: medrese yönetimi
  dateAblative: 15 Kasım’dan

nodes:
  # ---- the page: the shell's one <main>, the heading and what stands in it ----
  page: { type: page, component: Page, role: main, in: [list, restoring, restored], source: libs/ui/src/mds/app-shell.tsx:41 } # <main id="main">, no name and no initialFocus: nothing in features/madrasahs or app/medreseler moves the focus when the page opens (rule focus-not-set)
  title: { type: text, component: Heading, role: heading, text: { key: MadrasahsPage.title }, in: [list, restoring, restored], source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:332 } # h1
  intro: { type: text, component: Text, text: { key: MadrasahsPage.intro }, in: [list, restoring, restored], source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:333 }
  listRegion: { type: page, component: Page, role: region, name: { labelledBy: listHeading }, in: [list, restoring, restored], source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:371 } # <section aria-labelledby="madrasahs-heading">
  listHeading: { type: text, component: Heading, role: heading, text: { key: MadrasahsPage.heading }, in: [list, restoring, restored], source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:376 } # h2; the same words as the caption of Tümü's table

  # ---- the tabs and the search, which this flow only stands on ----
  tabs: { type: list, component: List, role: tablist, name: { key: MadrasahsPage.tabsLabel }, in: [list, restoring, restored], source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:386 }
  tabAll: { type: action, component: Button, role: tab, text: { key: MadrasahsPage.tabs.ALL }, in: [list, restoring, restored], source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:391 } # a tab's name is its label with the count glued on ("Gizli1"); the binding finds it by its beginning
  tabActive: { type: action, component: Button, role: tab, text: { key: MadrasahsPage.tabs.ACTIVE }, in: [list, restoring, restored], source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:391 }
  tabPassive: { type: action, component: Button, role: tab, text: { key: MadrasahsPage.tabs.PASSIVE }, in: [list, restoring, restored], source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:391 }
  tabHidden: { type: action, component: Button, role: tab, text: { key: MadrasahsPage.tabs.HIDDEN }, in: [list, restoring, restored], source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:391 }
  search: { type: field, component: TextField, role: searchbox, text: { key: MadrasahsPage.searchLabel }, value: { literal: "" }, in: [list, restoring, restored], source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:406 } # an aria-label, a placeholder and a leading icon

