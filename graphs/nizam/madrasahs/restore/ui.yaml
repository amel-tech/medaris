edges:
  - { labelledBy: [listRegion, listHeading] }
  - { triggers: [rowRestore, restoring] }

rules:
  - { id: focus-not-set, rule: "The page sets no initial focus (nothing in features/madrasahs or app/medreseler does), so a person who arrives starts at the top of the document, and no `focus` is drawn after the press: the button that had the focus leaves the page (F-W2-10). The graph says nothing of where the focus is." }
  - { id: label-in-name, rule: "'Geri al: {name}' contains the visible 'Geri al' (WCAG 2.5.3 holds); so do 'Başmüderrisi değiştir: {name}' and 'Pasife al: {name}'. 'Nazar’da aç, yeni sekmede: {name}' contains 'Nazar’da aç'." }
  - { id: F-W2-2, rule: "present.ts:103: when the roles or the permission codes could not be read (me or held is null), madrasahAbilities switches every ability on, so a Medaris nazımı who holds none of them is drawn 'Geri al' (or, on a row whose canRestore the API says is false, the kademe sentence, RESTORE-1) and the API refuses the press. Here only the sentence is reachable that way, and it is what `nazimUnread` stands for. Fix: keep the failure visible (a notice) or hide the buttons." }
  - { id: F-W2-10, rule: "madrasahs-view.tsx:116-131: after 'Geri al' the row is read again; on the Gizli tab it leaves the table, on Tümü the button is replaced by the buttons of an active row, so the element that had the focus is removed either way and the focus falls to the page; only a toast of six seconds says what happened. Not verified in a browser. Fix: move the focus to the next row's control, or to the table's heading, once the page is read again." }
  - { id: F-X-7, rule: "the family of F-W2-10: rows that leave the page after an action and the focus that is lost with them, in every table of nizam." }
  - { id: F-X-5, rule: "this flow's toasts are sonner's (madrasahs-view.tsx:8), which the app mounts beside the unified kit's own Toaster (client-providers.tsx): two toast hosts with two looks and two region names, as the account page and the notification page use the other one." }
  - { id: RESTORE-1, rule: "new: the kademe sentence (madrasahs-view.tsx:249-255, HideLevel.locked) and the toast for ARCHIVE_RESTORE_LEVEL (present.ts:311) cannot be reached by anyone who is offered 'Geri al'. The cell is drawn only for `can.restore` (platform.madrasah_edit, present.ts:107), and the API's canRestore (madrasah.controller.ts:177-195, mayRestoreHidden, archive/hide-level.ts:206-216) asks whether the viewer acts at or above the level that hid it; a holder of platform.madrasah_edit, like the başnazım (actingLevel, hide-level.ts:178), acts at the platform level, the top rung of MADRASAH_HIDE_LADDER (hide-level.ts:101-104), and a medrese is hidden only at the platform or the medrese level (madrasah.controller.ts:148-155, 495-513). The sentence can only appear through the fail-open of F-W2-2, where it names a level to a person who lacks the permission, which is not why they cannot restore. The unit spec draws it with canRestore false made by hand (test/madrasahs.spec.tsx:404-419); the e2e checks no such state. Not verified in a browser. Fix: say what is true instead (RESTORE-2), and keep the kademe words for the tables where a lower level really can look at a higher one's hide (the köşk's, the course's)." }
  - { id: RESTORE-2, rule: "new: madrasahs-view.tsx:238 (`!can.restore ? null`): a Medaris nazımı who opens the page by platform.madrasah_create or platform.head_muderris_manage, as the seeded one does (platform.madrasah_create), sees a hidden row with an empty last cell and no word of why; the footnote under the table says 'Medreseyi gizleyen kademe ya da üstü bu tablodan geri alır' and does not say that platform.madrasah_edit is what they lack. The column's header is visually hidden ('İşlemler'). Fix: a caption in the cell ('Geri almak için platform.madrasah_edit izni gerekir' in the app's own words), or leave the hidden rows out for them." }
  - { id: RESTORE-3, rule: "new: madrasahs-view.tsx:243 gives the button `loading` and no `loadingLabel`, so its hidden <output> says the hard-coded default 'Yükleniyor' (libs/ui/src/mds/button.tsx:62,114), which is in no catalog; every other row's button carries an empty <output> too. Same as nazar's F-A-14. Fix: pass the label from the catalog." }
  - { id: RESTORE-4, rule: "new: madrasahs-view.tsx:121-127: a refused restore toasts and returns, and unlike a success it does not call refresh(). After 409 MADRASAH_NOT_HIDDEN (someone else brought it back) or 404 MADRASAH_NOT_FOUND (it was deleted) the row keeps 'Gizli' and its 'Geri al', the sticky toast is the only word, and the same press is refused again until the person reloads (F-X-4). Nazar's own restore reads the page again after every answer. Not verified in a browser. Fix: refresh() on those two codes." }
