  rowCoursesNone: { type: text, component: Text, text: { literal: "0" }, in: [list, restoring], source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:189 } # its course is hidden with it, and a hidden course is not counted
  rowCoursesBack: { type: text, component: Text, text: { literal: "1" }, in: [restored], when: "tab == 'all'", source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:189 }
  rowStatusHidden: { type: text, component: Text, text: { key: MadrasahsPage.status.HIDDEN }, in: [list, restoring], source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:219 } # plain text with an eye-off glyph, no badge
  rowSince: { type: text, component: Text, text: { key: MadrasahsPage.since, params: { dateAblative: madrasah.since } }, in: [list, restoring], source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:224 }
  rowStatusActive: { type: text, component: Text, text: { key: MadrasahsPage.status.ACTIVE }, in: [restored], when: "tab == 'all'", source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:210 } # a badge; a medrese that was passive as well would read "Pasif" (a warning badge)

  # ---- the last cell of the hidden row: the button, or what stands in its place ----
  rowRestore: { type: action, component: Button, role: button, intent: secondary, name: { key: MadrasahsPage.restoreLabel, params: { name: madrasah.name } }, text: { key: MadrasahsPage.restore }, in: [list, restoring], when: mayPress, disabledIn: [restoring], emits: RESTORE, source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:239 } # the visible words are in the name (label in name holds); busy (aria-busy, aria-disabled) while the call runs
  restoreBusy: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [restoring], source: libs/ui/src/mds/button.tsx:114 } # the button's hidden <output>; every row's button carries an empty one (RESTORE-3)
  lockedNote: { type: text, component: Text, text: { key: HideLevel.locked, params: { level: madrasah.hiddenLevelName } }, in: [list], when: "viewer == 'nazimUnread'", source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:251 } # in place of the button; only when the page could not read the viewer's permissions (RESTORE-1, F-W2-2)

  # ---- the same row once it is back, on Tümü: the buttons of an active row ----
  openInNazar: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: MadrasahsPage.openInNazarLabel, params: { name: madrasah.name } }, text: { key: MadrasahsPage.openInNazar }, in: [restored], when: "tab == 'all' and viewer == 'chief'", source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:270 } # the başnazım's alone, and only while NAZAR_URL is set (the local stack sets it); opens nazar's Pano in a new tab
  changeHead: { type: action, component: Button, role: button, intent: secondary, name: { key: MadrasahsPage.changeLabel, params: { name: madrasah.name } }, text: { key: MadrasahsPage.change }, in: [restored], when: "tab == 'all' and viewer == 'chief'", source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:283 } # platform.head_muderris_manage (the başnazım holds everything); nizam.madrasahs.headMuderris walks it
  passivate: { type: action, component: Button, role: button, intent: secondary, name: { key: MadrasahsPage.passivateLabel, params: { name: madrasah.name } }, text: { key: MadrasahsPage.passivate }, in: [restored], when: "tab == 'all' and mayPress", source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:300 } # platform.madrasah_edit; nizam.madrasahs.passivate walks it

