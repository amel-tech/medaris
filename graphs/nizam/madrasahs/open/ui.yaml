# The screens of nizam.madrasahs.open: the Medreseler page (/medreseler) behind, and the "Medrese aç" dialog over it. Read from
# apps/nizam/features/madrasahs/components/{madrasahs-view,open-madrasah-dialog,head-picker}.tsx on 15 Nov 2026; the words are copied from
# libs/i18n/src/locales/tr/nizam.json (namespaces MadrasahsPage, OpenMadrasahDialog, HeadPicker).
#
# Words that are not copied:
#   - Changes.note is the one message written for the graph: the app has none that says what opening a medrese changes. Its facts are the
#     dialog's own (intro, chosenNote, the head picker's help), tedrisat's POST /madrasahs (madrasah.repository.ts:265, one transaction:
#     the medrese, the başmüderris's role, an audit row) and the passivate and hide flows of the same page.
#   - composed.MadrasahsPage.rowName, rowHandle, rowHead: the table's first and second column write data, not messages
#     (madrasahs-view.tsx:158, :160, :172); a key carries each, with the sample as its placeholder, so that the new row can be drawn.
#   - composed.Button.loadingLabel: the shared Button's hidden status text while busy, a hard-coded default "Yükleniyor"
#     (libs/ui/src/mds/button.tsx:62, :114), in no catalog (F-UI-W1-3, F-X-17).
#   Why the toast's body ("{name} açıldı; başmüderrisi {head}.") is not a node: its {name} is the medrese, while {name} of the head picker's
#   messages ("{name} seçildi", "Seçimi kaldır: {name}") is the person, and a graph has one sample per placeholder name. The toast's
#   title and the new row, which carry the same facts, are drawn.
#
# The page behind the dialog is drawn only where the dialog is closed: the dialog is modal, so the page is inert while it is open.
