schema: delurio-graph/0
kind: needs
id: nizam.madrasahs.browse
status: proposed
summary: >-
  What must exist for the başnazım (and a Medaris nazımı who holds a platform.madrasah_* code) in nizam.madrasahs.browse: the
  flow's product list, written from the flow's story and its open decisions, never from what the page does today.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# Gaps of this file, for that merge:
# missing:   a-passive-medrese-says-why-it-is-passive, a-medrese-with-no-head-is-in-the-passive-list, the-numbers-say-what-they-count,
# a-change-of-rows-is-announced, the-rest-of-a-long-list-is-reachable, a-tab-is-chosen-not-passed, an-unread-viewer-is-not-trusted
# unwalked:  a-viewer-is-offered-only-what-they-may-do (no e2e check draws a Medaris nazımı with madrasah_create only; the replay scenario
# medarisOpen is written, not run), the-list-says-when-it-cannot-be-read (nothing on the stack makes the read fail),
# the-archive-is-one-click-away, the-chief-opens-a-medrese-in-nazar (no e2e check and no replay has passed on either yet)
# No gender or kontenjan need: no seat is decided on this page.

needs:
  - id: read-the-tab-counts
    need: >-
      The başnazım, and a Medaris nazımı who may open the page, read at a glance how many medreses the platform holds in all and
      in each state, active, passive and hidden, and the numbers are the platform's true totals.
    evidence:
      - node: tabAllCount
      - node: tabActiveCount
      - node: tabPassiveCount
      - node: tabHiddenCount
      - state: listed
      - source: apps/tedrisat/src/madrasah/madrasah.controller.ts:283
      - source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:386
      - test: apps/nizam/e2e/madrasahs.e2e.ts
        name: "nizam/07 — the tabs' numbers are the database's totals, and each medrese reads as its status says (criteria 1, 2, 4)"

  - id: each-row-reads-as-its-state-says
    need: >-
      Every medrese is one row that says its name and short name, who its başmüderris is (or that nobody is), how many courses it
      has, which köşks host it, and its state with the date the state began.
    evidence:
      - state: listed
      - node: rowName
      - node: rowHandle
      - node: rowHeadActive
      - node: rowHeadHidden
      - node: rowUnassigned
      - node: rowTermEnded
      - node: rowCourses
      - node: rowHosting
      - node: rowStatusActive
      - node: rowStatusPassive
      - node: rowStatusHidden
      - node: rowSincePassive
      - node: rowSinceHidden
      - source: apps/tedrisat/src/madrasah/madrasah.controller.ts:283
      - source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:148
      - test: apps/nizam/e2e/madrasahs.e2e.ts
        name: "nizam/07 — the tabs' numbers are the database's totals, and each medrese reads as its status says (criteria 1, 2, 4)"

  - id: narrow-by-state-in-the-address
    need: >-
      A person narrows the list to the active, the passive or the hidden medreses, and the address says which (?durum=etkin, pasif
      or gizli), so that Back, a reload and a link a colleague is sent open the same list.
    evidence:
      - node: tabAll
      - node: tabActive
      - node: tabPassive
      - node: tabHidden
      - state: readingDirectory
      - state: listed
      - source: apps/tedrisat/src/madrasah/madrasah.controller.ts:283
      - source: apps/nizam/features/madrasahs/present.ts:43
      - test: apps/nizam/e2e/madrasahs.e2e.ts
        name: "nizam/07 — the warning names the passive medrese, the status tab narrows the list through the URL, and a search narrows it too (criterion 5)"

  - id: narrow-by-search
    need: >-
      A person finds a medrese by a part of its name, its short name or its başmüderris's name, the address carries the text
      (?q=), and a text that fits nobody is told so in the table.
    evidence:
      - node: searchField
      - state: readingDirectory
      - state: listed
      - state: emptySearch
      - source: apps/tedrisat/src/madrasah/madrasah.controller.ts:283
      - source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:406
      - test: apps/nizam/e2e/madrasahs.e2e.ts
        name: "nizam/07 — the warning names the passive medrese, the status tab narrows the list through the URL, and a search narrows it too (criterion 5)"
    note: "madrasahs#2: types a name; the başmüderris's name and the text that finds nobody are not asserted"

  - id: the-warning-names-the-passive-medreses
    need: >-
      Above the tabs a warning names every passive medrese, whichever tab is open and whatever is typed, and says what being
      passive means and what ends it.
    evidence:
      - node: passiveWarningOne
      - node: passiveBodyOne
      - node: passiveWarningMany
      - node: passiveBodyMany
      - source: apps/tedrisat/src/madrasah/madrasah.controller.ts:283
      - source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:345
      - test: apps/nizam/e2e/madrasahs.e2e.ts
        name: "nizam/07 — the warning names the passive medrese, the status tab narrows the list through the URL, and a search narrows it too (criterion 5)"

  - id: a-viewer-is-offered-only-what-they-may-do
    need: >-
      A Medaris nazımı is offered the buttons their permissions open and no other, and the platform archive is the başnazım's
      alone, so that no button leads to a refusal (MDRS-108).
    evidence:
      - node: openButton
      - node: restoreButton
      - node: assignButton
      - node: changeButton
      - node: passivateButton
      - node: archiveLink
      - node: nazarLink
      - source: apps/nizam/features/madrasahs/present.ts:99
    note: >-
      no e2e check draws a Medaris nazımı who holds one of the codes (madrasahs#8 is the one with none); replay: medarisOpen is
      written, not run

  - id: an-unread-viewer-is-not-trusted
    need: >-
      When the page cannot read who the viewer is or what they hold, it says so and offers only the buttons it can vouch for,
      instead of every button and a refusal toast for each (decision D2).
    missing: "no Linear issue; F-W2-2: madrasahAbilities switches every ability on when a read fails (present.ts:103)"
    note: >-
      Drawn on the state readingViewer, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).

  - id: a-person-without-the-permission-is-refused
    need: >-
      A person who holds none of the three platform codes (a Medaris nazımı with no grants, a köşk nazımı, a başmüderris, a
      talebe) is refused the page and told the permission is the başnazım's to give, not shown an empty list.
    evidence:
      - state: readingDirectory
      - state: handed_over.no_access
      - source: apps/tedrisat/src/madrasah/madrasah.controller.ts:283
      - source: apps/nizam/app/medreseler/page.tsx:48
      - test: apps/nizam/e2e/madrasahs.e2e.ts
        name: "nizam/06 — a Medaris nazımı is not the başnazım: Medreseler shows 'Bu bölüm için izniniz yok'"
    note: "madrasahs#8: a Medaris nazımı with no grants; taken over by nizam.shell.noAccessAndNotFound, which draws the refusal"

  - id: the-list-says-when-it-cannot-be-read
    need: >-
      When the directory cannot be read the page says so in place of the table and offers to try again, and the rest of the page
      stays.
    evidence:
      - state: loadFailed
      - node: loadFailedAlert
      - node: retryButton
      - source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:418
    note: "unwalked: nothing on the local stack makes tedrisat fail the read, and no e2e check or unit spec of the app draws it"

  - id: the-archive-is-one-click-away
    need: The başnazım reaches the platform archive of everything hidden from the same page that lists the hidden medreses.
    evidence:
      - node: archiveLink
      - source: apps/nizam/features/madrasahs/components/madrasahs-view.tsx:380
    note: "unwalked: no e2e check follows it (archive.e2e.ts opens /arsiv by address); replay: chief takes it once, not run"

  - id: the-chief-opens-a-medrese-in-nazar
    need: >-
      The başnazım opens an active medrese's Pano in nazar-web from its row, in a new tab, to appoint its nazırs and open its
      courses.
    evidence:
      - node: nazarLink
      - source: apps/nizam/features/madrasahs/present.ts:119
    note: "unwalked: no e2e check follows it; replay: chief takes it once, not run"

  - id: a-passive-medrese-says-why-it-is-passive
    need: >-
      A passive medrese says why it is passive: the başnazım passivated it, or its başmüderris's term ended; the warning and the
      row word it by the reason, not always as an ended term (decision D1, MBROWSE-1).
    missing: >-
      no Linear issue; the directory sends no reason (madrasah.repository.ts:922, :984); passiveReason is stored and not read
    note: >-
      Drawn on the nodes passiveBodyOne and rowTermEnded, which the code has: they are not evidence, so that a replay still walks
      them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-medrese-with-no-head-is-in-the-passive-list
    need: >-
      A medrese whose başmüderris's term has ended is found in the same list and tab as the ones the başnazım passivated, with the
      way to give it a başmüderris from that row, so that Medreseler and Pasif kapsamlar agree (decision D1, MBROWSE-1).
    missing: >-
      no Linear issue; status reads passive_since alone (madrasah.repository.ts:849); an active row has no "Başmüderris ata"
    note: >-
      Drawn on the nodes rowHeadActive, rowStatusActive and assignButton, which the code has: they are not evidence, so that a
      replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: the-numbers-say-what-they-count
    need: >-
      A person who types a text or opens a tab can tell which number is the platform's and which is what the list shows: the table
      says how many rows fit, or the numbers follow the text (MBROWSE-2).
    missing: no Linear issue; findings MBROWSE-2
    note: >-
      Drawn on the state emptySearch and on the nodes tabAllCount, tabActiveCount, tabPassiveCount and tabHiddenCount, which the
      code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-change-of-rows-is-announced
    need: >-
      A person who cannot see the table is told when a tab or a search has changed its rows, and how many are left (MBROWSE-3).
    missing: no Linear issue; findings MBROWSE-3
    note: >-
      Drawn on the states listed, emptyStatus and emptySearch, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: the-rest-of-a-long-list-is-reachable
    need: >-
      A platform with more than 50 medreses can read all of them from the page, not only the first 50 by name and what a search
      finds (MBROWSE-4).
    missing: no Linear issue; the page never sends `page`; the API takes it (getMadrasahDirectory)
    note: >-
      Drawn on the state listed, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves
      out what only missing needs name).

  - id: a-tab-is-chosen-not-passed
    need: >-
      A keyboard user moves along the four tabs without reading the directory and adding a history entry for each tab they pass
      (MBROWSE-5).
    missing: no Linear issue; findings MBROWSE-5
    note: >-
      Drawn on the nodes tabsList, tabAll, tabActive, tabPassive and tabHidden, which the code has: they are not evidence, so that
      a replay still walks them (SPEC.md §13 leaves out what only missing needs name).
