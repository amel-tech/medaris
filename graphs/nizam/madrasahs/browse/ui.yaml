edges:
  - { labelledBy: [listSection, listHeading] }

rules:
  - { id: focus-not-set, rule: "Medreseler sets no initial focus (no autoFocus and no focus() in features/madrasahs or app/medreseler), so the page node has no `initialFocus`. A press on a tab or the typing keeps the focus where it was (a soft navigation of the same page), and the recorded silence is not a finding; the inventory does not call it one." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): every row button's aria-label is its visible text, a colon and the medrese's name, and \"Nazar’da aç, yeni sekmede: <ad>\" starts with its visible words and says the tab is new" }
  - { id: F-W2-2, rule: "madrasahAbilities switches every ability on when the roles or the permission codes could not be read (present.ts:103: `!me || me.systemAdmin || !held`), so a Medaris nazımı who holds one platform.madrasah_* code is offered the buttons of the other two and the Arşiv link, and meets a refusal toast from tedrisat for each. The comment says it is on purpose (\"tedrisat refuses what is not theirs\"). Fix: keep the failure visible (a notice) or hide the buttons. Drawn as the viewer `unread`; the stack cannot make the reads fail, so it is not walked." }
  - { id: F-W2-10, rule: "After \"Geri al\" or an assignment the row's button is replaced or removed by the refresh and nothing moves the focus; only a toast tells the result and the focus falls to the page (the W5 pattern, F-X-7). The buttons are drawn here and the dialogs and toasts by nizam.madrasahs.restore and nizam.madrasahs.headMuderris; this flow only starts them. Fix: move the focus to the next row's control or the page heading." }
  - { id: F-A-12, rule: "A tab's content is its label immediately followed by the count <span> with no whitespace (tabs.tsx:65-69, the same component as nazar's Arşiv tabs), so its name can read \"Etkin1\". The e2e finds the number by `.mds-tab__count`, not by the name, and asks the tab by /^Etkin/. Not verified in a browser. Fix: a visually hidden space, or the count in an aria-label." }
  - { id: MBROWSE-1, rule: "Pasif is told as an ended term and is not one. The only code that makes a medrese passive here is the başnazım's \"Pasife al\", which revokes the başmüderris and sets passive_since and passiveReason DEACTIVATED_BY_ADMIN (madrasah.repository.ts:746-747); the directory sends only `since`, never the reason (madrasah.repository.ts:922, :984), and the page words every passive medrese as \"Görev süresi <tarih> doldu\" (madrasahs-view.tsx:178, present.ts termEndedLabel) and its warning as \"Başmüderrisin görev süresi <tarih> doldu\" (MadrasahsPage.passiveBodyOne). A medrese whose başmüderris's term really ran out (a role row whose expires_at passed) is Etkin here: the status reads passive_since alone (madrasah.repository.ts:849), the başmüderris cell says \"Atanmamış\", and an active row has no \"Başmüderris ata\" (madrasahs-view.tsx:266-309), so the way to it is Pasif kapsamlar. Found by grep for passive_since in apps/tedrisat/src: the only code that sets it for a medrese is deactivate (madrasah.repository.ts:746); setHeadMuderris (:620) and the assignment of an inactive scope (inactive-scope.repository.ts:308) clear it. Not seen in a browser; the stack's walk will show the wording on the medrese it passivates. Fix: send the reason and word by it, and count a medrese with no sitting başmüderris as passive, as Pasif kapsamlar does. Proposed id; not in the inventory (decision D1)." }
  - { id: MBROWSE-2, rule: "The tab numbers and the passive warning are every medrese's, not what the status and the text leave (directory `counts` and `passive`, madrasah.service.ts:206-209). So \"Tümü 3\" sits over one row after a search, and a text typed in Tümü that finds a hidden medrese shows a row the Etkin tab, with the same text, does not. Nothing says so: the table's hidden caption and the numbers do not change with the text. Proposed id; not in the inventory. Fix: say how many rows fit (\"<n> medrese\") in a status line, or give the numbers the text's meaning." }
  - { id: MBROWSE-3, rule: "A tab or a search changes the rows and nothing announces it: the wrapper carries aria-busy while the navigation is pending (madrasahs-view.tsx:402), which a screen reader does not read, and no status line or live region says how many rows are left (compare nazar's F-B-4). The e2e waits for the rows to change; a person who cannot see them does not know that they did. Proposed id; not in the inventory. Fix: a visually hidden role=status line with the row count that follows each read." }
  - { id: MBROWSE-4, rule: "The page asks for 50 rows (DIRECTORY_PAGE_SIZE, reads.ts:14) and never a page: past 50 medreses the table keeps the first 50 by name and a caption says \"Toplam <total> medrese, <shown> tanesi gösteriliyor\" (madrasahs-view.tsx:435-442), with no control to the rest. Only the search (or a tab) reaches them. The stack holds a handful, so it is not walked. Proposed id; not in the inventory. Fix: a pager that sends `page`, which the API already takes." }
  - { id: MBROWSE-5, rule: "The tab list is Base UI tabs with activateOnFocus (tabs.tsx:105), and each tab's onValueChange is router.push of the new address (madrasahs-view.tsx:111-114): a keyboard user who arrows from Tümü to Gizli reads the directory three times and leaves three history entries, so Back undoes one tab at a time. Not verified in a browser. Proposed id; not in the inventory. Fix: let the arrow keys move the focus and Enter or Space select (manual activation), or replace the entry for a tab as the typing does." }
