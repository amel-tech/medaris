# The screens of nizam.madrasahs.browse: nizam-web's Medreseler (/medreseler, app/medreseler/page.tsx) as the başnazım and a Medaris nazımı meet
# it: the page (features/madrasahs/components/madrasahs-view.tsx) with its header, the passive warning, the four tabs and their numbers, the
# search box, the table with its three empty lines and the box that says the list could not be read. The dialogs its buttons open are the
# flows that make them (nizam.madrasahs.open, headMuderris, passivate, restore); the shell around the page (sidebar, person row, bell, skip
# link) is nizam.shell.menuPerPersona's. Read from the code on 15 Nov 2026; nothing was opened in a browser.
#
# Words: every `MadrasahsPage.*` key is copied from libs/i18n/src/locales/tr/nizam.json (the app reads it as `nizam.MadrasahsPage`), the key
# being the path inside that file. The `composed.*` keys are NOT in any i18n file: they are texts the app builds in code from data, written
# here with their placeholders so a replay can match them (a placeholder with no sample matches any text):
#   composed.MadrasahsPage.name      a medrese's name, in <bdi> (madrasahs-view.tsx:158)
#   composed.MadrasahsPage.handle    "@" and its short name, in <bdi dir=ltr> (madrasahs-view.tsx:160)
#   composed.MadrasahsPage.head      the başmüderris's name (madrasahs-view.tsx:172)
#   composed.MadrasahsPage.courses   the number of courses that are not hidden (madrasahs-view.tsx:189)
#   composed.MadrasahsPage.hosting   the köşks that host it, "A ve B" (hostingLabel, present.ts:230; madrasahs-view.tsx:196)
#   composed.MadrasahsPage.count     a tab's number, a <span class=mds-tab__count>, formatted for the page's language (tabs.tsx:67)
# The two dates the page spells ({dateAblative}, {dateLocative}) are the Turkish case forms of a day and a month in the viewer's zone
# (dateWithCase, present.ts:180); the samples say one.
# The table is Table responsive="stack": the table, its rows and its cells carry explicit roles and each cell a data-label, and the caption
# that names it is visually hidden (libs/ui/src/mds/table.tsx:94-132).
# The tab panel (role tabpanel, named by its tab) around the search box and the table, and the aria-busy that wrapper carries while a read
# is pending, are not drawn; nor is the caption under a table that holds more than 50 rows (data-testid=truncated, MBROWSE-4).
# Samples are invented and neutral.
