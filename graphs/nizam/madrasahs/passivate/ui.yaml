# The screens of nizam.madrasahs.passivate: the Medreseler page (/medreseler) with the "Pasife al" button on a row, the dialog "Medreseyi
# pasife al" over it, and the page again once the medrese is passive. Read from apps/nizam/features/madrasahs/components/madrasahs-view.tsx
# and features/passivation/components/passivate-scope-dialog.tsx on 15 Nov 2026; the words are copied from
# libs/i18n/src/locales/tr/nizam.json (namespaces MadrasahsPage and PassivateScopeDialog).
#
# Two kinds of catalog entry are not copied. `composed.*` is text the app builds in code and that is in no i18n file:
#   composed.PassivateScopeDialog.eyebrow  the medrese's own name over the dialog's title, `eyebrow={name}` (passivate-scope-dialog.tsx:189)
#   composed.Button.loading                "Yükleniyor", the hidden status beside a busy Button, a default of libs/ui/src/mds/button.tsx (the
#                                          button passes no loadingLabel)
# `Changes.note` is the one message written for the graph: no message of the app tells the person what the window changed (the dialog tells it
# before, in its warning, and the toast says only that the medrese is passive).
#
# The page behind the dialog is drawn where the dialog is closed (`listed`, `passivated`): the dialog is modal, so the page is inert while it
# is open and none of its nodes is listed in a dialog state.
