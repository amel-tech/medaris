# The screens of nizam.madrasahs.headMuderris: the Medreseler page (/medreseler) with the row of one medrese, and the "Başmüderris ata" / "Başmüderrisi değiştir"
# dialog over it. Read from apps/nizam/features/madrasahs/components/{madrasahs-view,assign-head-dialog,head-picker}.tsx on 15 Nov 2026; the words are copied from
# libs/i18n/src/locales/tr/nizam.json (namespaces MadrasahsPage, AssignHeadDialog, HeadPicker). Nothing was seen in a browser.
#
#   - changes: the app's own message after the change, AssignHeadDialog.changedBody ("{name} için başmüderris {head} oldu."). It says who heads the medrese; it does not
#     say that the old head's seat ends, that each answer is applied, or that a passive medrese opens again. No message is authored.
#   - composed.* keys are text the code builds from data and pieces of messages: composed.MadrasahsPage.oldHeadCell and .headCell (the Başmüderris cell, a <bdi> with the
#     head's name, madrasahs-view.tsx:172), composed.AssignHeadDialog.eyebrow (the medrese's name above the title, assign-head-dialog.tsx:255), .introChange and
#     .handedOnHeading (a <strong> with the old head's name followed by the messages of those names, :269-272 and :336-337), .person and .personEmail (the <bdi> lines of a person, :352-359),
#     .handOnLine (heading(group), :194-210, which joins the role's name, the place, "süresiz" or "{date} tarihine dek" and "verildi {date}" with " · ").
#   - the two meanings of {name}: the medrese's (the row buttons, the intro, the toasts) and, in HeadPicker.chosen and HeadPicker.remove, the chosen person's. The samples give the
#     medrese's, so the two picker nodes read wrongly on the wireframe; the binding finds them by their frame (a regular expression).
#   - the permission names of a hand-on line are the codes themselves (HEAD-2): the sample of {names} is what the page prints for the two permissions the walk's data gives.
#   - the dialog is modal, so the page behind it is inert and its nodes are listed only where the dialog is closed.
schema: delurio-graph/0
kind: ui
id: nizam.madrasahs.headMuderris
flow: nizam.madrasahs.headMuderris
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: AssignHeadDialog.changedBody }
samples:
  name: Başmüderris Deneme Medresesi # the medrese; also the sample of {place} below
  head: Dilek Başvuran # the new başmüderris
  oldHead: Tahsin Başvuran # the sitting başmüderris
  person: Salih Başvuran # a person the old head gave something to
  email: salih.basvuran@example.test
  role: Medrese nâzırı
  place: Başmüderris Deneme Medresesi
  until: süresiz
  given: verildi 15 Kasım 2026
  count: "2"
  names: madrasah.nazir_appoint · course_nazir.assign

