edges:
  - { labelledBy: [dialogAssign, titleAssign] }
  - { labelledBy: [dialogChange, titleChange] }
  - { labelledBy: [handedOnRegion, handedOnTitle] }
  - { triggers: [assignButton, form] }
  - { triggers: [changeButton, reading] }
  - { triggers: [assignSubmit, saving] }
  - { triggers: [changeSubmit, saving] }
  - { triggers: [retry, reading] }
  - { returnsFocus: [dialogAssign, assignButton] } # Vazgeç, Esc or the close icon: the row's button is still there. After a success the passive row's button is gone (F-W2-10): the graph says nothing of the focus; not verified in a browser
  - { returnsFocus: [dialogChange, changeButton] } # the active row keeps its button after a change; not verified in a browser

rules:
  - id: focus-not-set
    rule: >-
      Nothing in features/madrasahs moves the focus when the page loads, so the page has no initialFocus. The dialog is opened with no initialFocus
      either (assign-head-dialog.tsx:246-266 passes none), so the focus is on the close icon of the header, not on the e-mail field; the same as F-W2-12.
  - id: F-W2-12
    rule: >-
      The dialog opens on its first focusable element, the header's close icon, instead of the first field (assign-head-dialog.tsx:246, libs/ui/src/mds/dialog.tsx:138).
      A keyboard or screen-reader user starts one stop before the field they came for. Fix: pass initialFocus = the picker's input.
  - id: F-W2-3
    rule: >-
      The e-mail lookup has no button: it runs when the input loses focus or on Enter (head-picker.tsx:74-79, 121), the input is `disabled` while it searches, so the focused
      field loses the focus (:112), and nothing says the search finished except a hidden <output> for a success; 'not found' and 'failed' are a Field error that is
      not a live region. Fix: a visible 'Ara' button, keep the input enabled with aria-busy, announce the result with role=status.
  - id: F-X-14
    rule: >-
      The family of F-W2-3: tabbing through the field makes an audited realm-directory search (tedrisat writes user.lookup for every one, found or not,
      apps/tedrisat/src/assignment/user-directory.service.ts:45); the help text says so. Fix: search on Enter or a button only.
  - id: F-W2-5
    rule: >-
      A required either/or answer is two toggle buttons, 'Devral' and 'Düşür', with aria-pressed (libs/ui/src/mds/choice-chips.tsx:46-90): they are announced as toggle
      buttons, can be pressed again to take the answer back (the graph's CLEAR_ANSWER), the group is not announced as required, and every row's two buttons carry the same
      names; the person is only in the group's hidden legend (assign-head-dialog.tsx:365-380), so a voice or button list cannot tell the rows apart and the e2e scopes by row.
      Fix: a RadioGroup per person, or chips named 'Devral: {person}'.
  - id: F-W2-10
    rule: >-
      After a success the table is read again. On a passive row the button that opened the dialog, 'Başmüderris ata: {name}', is replaced by the active row's buttons
      (madrasahs-view.tsx:257-310), so Base UI's return focus has no element and it falls to the page; only the toast says what happened. On an active row
      'Başmüderrisi değiştir: {name}' is still there and the focus goes back to it (not verified in a browser). Fix: move the focus to the row's new button or the table's caption.
  - id: F-X-3
    rule: >-
      The submit button is natively disabled (assign-head-dialog.tsx:262) and says nothing about what is missing: the e-mail, an end that is not in the future (its
      own message shows), or an answer for a person. Only the last has a line, 'Her satır için seçim yapılmadan başmüderris değiştirilemez.' (:258), and only while the list has
      rows; when the list cannot be read the button is off for good and the alert's retry is the only cue. Fix: keep the button on and validate on submit, or tie the reason to the button.
  - id: F-UI-W1-1
    rule: >-
      Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:103-112), so opening 'Başmüderrisi değiştir' makes a screen reader read the intro,
      the fields and every row as the dialog's description (F-W2-13).
  - id: HEAD-1
    rule: >-
      New. The message written for choosing the sitting başmüderris, 'Bu kişi zaten bu medresenin başmüderrisi.' (AssignHeadDialog.sameHead), is never shown. The dialog passes it
      as the picker's `error` (assign-head-dialog.tsx:283), but HeadPicker hands the Field `error={value ? undefined : problem}` (head-picker.tsx:101): the person has just been
      chosen, so `value` is set and the error is dropped. The person is shown as chosen, the button stays off, and nothing says why. The e2e does not try it. Fix: show the error
      beside the chosen person, or refuse the choice in the picker.
  - id: HEAD-2
    rule: >-
      New. The line under a person who was given permissions prints each permission as its raw code, 'madrasah.nazir_appoint · course_nazir.assign', not as a sentence. permissionName
      (assign-head-dialog.tsx:168-174) looks the code up in nizam's PermissionCatalog, which holds the 19 platform codes only (libs/i18n/src/locales/tr/nizam.json,
      PermissionCatalog.permissions), and falls back to the code. A başmüderris can give only medrese and course codes (the API's catalog is those two sections), so
      every permission this dialog ever lists is printed raw; the e2e's seed gives a platform code (head-seed.ts, platform.madrasah_nazir_grant), which the catalog has, and so hides it.
      Fix: nizam needs the medrese and course sentences nazar already has (nazar.json, madrasah_nazir_appoint ...).
  - id: HEAD-3
    rule: >-
      New here, the same as nizam.madrasahs.open's F-W2-open-1 (one picker, head-picker.tsx). A second search that finds nobody, or fails, while a person is already chosen says nothing: the picker's message is the Field's `error`, dropped once `value`
      is set (head-picker.tsx:101), and no alert takes its place (the köşk picker has one, nizam.kosks.open). The person stays chosen and the field keeps the typed address,
      with no sign that the second search did anything. Fix: show it beside the field as a live region.
  - id: HEAD-4
    rule: >-
      New here, the same as nizam.madrasahs.open's F-W2-open-2 (one map, present.ts:307). madrasahErrorKey maps SELF_GRANT_REFUSED to one sentence, 'Size verilmiş bir rolü ya da izni devralamazsınız; kendinize rol ya da izin vermek olur. Onu düşürün.'
      (present.ts:307), but the API answers it for two different acts: taking over a row given to the caller, and naming oneself the new head (madrasah.controller.ts:455-470).
      A Medaris nazımı who names themselves is told to 'drop' a row they never saw. Fix: a second sentence for naming oneself, on a code the API tells apart (the audit row has two routes).
  - id: HEAD-5
    rule: >-
      New, for the owner (security; ledger/security.md has the köşk's route). The order of the server's checks on PUT /madrasahs/:id/head-muderris, read from the code and not run:
      (1) AuthGuard, then AuthzGuard (madrasah.controller.ts:134): `byExistingMadrasah` answers 404 MADRASAH_NOT_FOUND for an unknown or malformed id before any
      permission is read (:104-113), then platform.head_muderris_manage, 403 AUTHZ_FORBIDDEN (:449); (2) the id and body pipes, 400 VALIDATION_ERROR; (3) for anyone but SYSTEM_ADMIN, the
      self-grant check on the new head, `always`: 403 SELF_GRANT_REFUSED and an audit row permission.self_grant_refused (:455-461, libs/common/src/authz/self-grant.guard.ts:67-95);
      (4) the same check on the recipients of every row answered TAKE_OVER, read by the ids the body names (:464-470, madrasah.repository.ts:335-355), before anything compares the answers with the list;
      (5) GRANT_EXPIRY_INVALID (madrasah.service.ts:231); (6) in the transaction: the medrese may be gone (madrasah.repository.ts:505-510), the answers must equal the list now,
      DISMISS_DECISIONS_INCOMPLETE (:531-535), they are applied, and then DISMISS_TAKE_OVER_WITHOUT_SEAT (:609-612) and DISMISS_SEAT_HANDED_ON (:616) refuse and roll everything back.
      Consequences: a caller who answers Devral for a row given to them is told SELF_GRANT_REFUSED even when the list is also stale; SYSTEM_ADMIN is exempt from (3) and (4) (self-grant.guard.ts:67),
      so the başnazım may seat themselves and take over their own rows, and the refusal is a Medaris nazımı's alone. Unlike the köşk's nazım route (self-grant before permission, so anyone signed in
      can write the audit row), the permission guard runs first here: a caller without platform.head_muderris_manage writes no audit row.
  - id: HEAD-6
    rule: >-
      New here, the same as nizam.madrasahs.open's F-W2-open-5 and nizam.kosks.open's F-W3-open-2. Vazgeç, the close icon and Escape stay enabled while the call is in flight and do nothing (`if (!saving) onOpenChange(next)`,
      assign-head-dialog.tsx:249-251); only 'Değiştir' is busy. Fix: disable them while saving.
  - id: HEAD-7
    rule: >-
      New. The API's own summaries say 'What the başmüderris handed on (SYSTEM_ADMIN only)' and 'Make a user the medrese's başmüderris (SYSTEM_ADMIN only)'
      (madrasah.controller.ts:419, 436), but both routes are `@Authz(platform.head_muderris_manage)` (:428, :449), which a Medaris
      nazımı can hold, and the page gives that nazımı the buttons (present.ts:106). The summaries are stale; the walk (scenario selfGrant) is the Medaris nazımı's.
  - id: F-W2-open-7
    rule: >-
      The same picker as nizam.madrasahs.open's finding of that id: an address that was not found is remembered as searched (head-picker.tsx:55-56, :66-67), so pressing Enter again does
      nothing and, once the account has been made, typing the same address again gets no search and no word (not walked here).
  - id: F-W2-open-8
    rule: >-
      The same picker as nizam.madrasahs.open's finding of that id: the e-mail field is drawn as required (head-picker.tsx:99) but its Input carries no `required`, so a screen reader never hears that a person is needed.
  - id: one-answer-per-person
    rule: >-
      The list is by person, not by row: the page groups the API's items by the person they went to and posts that person's one answer for each of their items
      (present.ts:368-415). The inventory's 'every row' is every person; a person given a seat and a permission cannot be answered differently for each, so the API's
      DISMISS_TAKE_OVER_WITHOUT_SEAT is out of reach of this page (decision D1).
  - id: stale-list-wipes-the-answers
    rule: >-
      A refusal with DISMISS_DECISIONS_INCOMPLETE clears every answer and reads the list again (assign-head-dialog.tsx:148-155); the toast says to read and answer again, but nothing marks
      which person changed. Not a defect; drawn as the code has it.
  - id: scrim-does-not-close
    rule: >-
      A click on the scrim does not close the dialog (a form dialog sets disablePointerDismissal, libs/ui/src/mds/dialog.tsx:71), so a stray click does not lose the answers; Esc and Vazgeç do close it (head-change#2). Holds.
  - id: label-in-name
    rule: >-
      A button's visible text is contained in its accessible name: 'Başmüderris ata' in 'Başmüderris ata: {name}', 'Başmüderrisi değiştir' in 'Başmüderrisi değiştir: {name}' (WCAG 2.5.3). Holds.
      The dialog's own submit is named by its text, 'Değiştir' or 'Başmüderris ata', which is also the dialog's title and the start of the row button's name, so the e2e scopes by dialog.
