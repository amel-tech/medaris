# The navigation graph of nizam-web, the Medaris administration app (apps/nizam), as the code has it on this branch.
#
# nav.extracted.yaml is generated (`node src/cli.ts extract graphs/nizam/nav --repo <worktree>`, adapter nizam) from
# the route files, lib/shell-nav.ts and lib/public-paths.ts: the 45 pages it finds (43 route files, two menu entries
# that have none), the menu entries of the three menu variants with their guards, and the page titles. This file adds
# what the extractor cannot read: the frames, the facts and personas, the gates that tedrisat decides, the links
# between pages, the redirects, the pages of other apps, and the goals of the flows.
#
# Two things in this file are hand work against the generated one, each a finding about the extractor (see the
# report): (1) every `{id}` route is rewritten `:kosk` and `{courseId}` `:course`, because the replay finds a route's
# parameters as `:name` (nav-replay.ts) and the generated `{id}` would be opened as a literal address (the adapter's own
# repo check compares the köşk menu rows with the `{id}` form and says they differ for that reason); (2) the `opensFor`
# of every page whose gate sits in tedrisat (the extractor reads only `forbidden()` calls that name the person's own
# roles, so it gives those pages `signedIn` alone). catalog/tr.json is the extractor's output as it is.
kind: nav
schema: delurio-graph/0
id: nizam.nav
title: Nizam, the Medaris administration app
status: captured
locale: tr
catalog: catalog/tr.json
extends: nav.extracted.yaml

summary: >-
  Where each kind of signed-in person lands, which menu the shell draws for them, and which pages open or refuse them.
  The shell is chosen by what tedrisat says of the person (GET /me/assignments, /me/roles, /me/permissions), never by
  the session, which holds identity only: the başnazım (a Keycloak realm role) gets every entry, a Medaris nazımı the
  entries their platform permission codes open, a köşk nazımı the köşk menu of the köşk in scope, and everyone else no
  menu at all (a person with no role lands on "Yönetim yetkiniz yok", a person with only medrese or course roles on the
  hand-over to Nazar). Two menu entries of the başnazım point at pages that do not exist and answer "Sayfa bulunamadı".

source:
  repo: amel-tech/medaris
  app: apps/nizam
  menu: apps/nizam/lib/shell-nav.ts
  locales: libs/i18n/src/locales/{locale}/nizam.json
  shell: apps/nizam/components/shell/shell-frame.tsx
  gates: apps/nizam/app/kosks/layout.tsx
  public: apps/nizam/lib/public-paths.ts
  proxy: apps/nizam/proxy.ts

extract:
  adapter: nizam
  locales: [tr]
  names:
    /: start
    /arsiv: archive
    /auth/signin: signIn
    /auth/signout: signOut
    /ayarlar/ortak-uygulamalar: partners
    /ayarlar/platform: platformSettings
    /ayarlar/youtube: youtube
    /bildirimler: notifications
    /decks: legacyDecks
    /decks/{id}/cards: legacyDeckCards
    /denetim-kaydi: auditLog
    /hesap: account
    /izin-gruplari: permissionGroups
    /kosks: kosks
    /kosks/{id}: koskManage
    /kosks/{id}/ana-sayfa: koskHome
    /kosks/{id}/arsiv: koskArchive
    /kosks/{id}/ayarlar: koskSettings
    /kosks/{id}/ayarlar/barindirma: koskHosting
    /kosks/{id}/ayarlar/nazimlar: koskNazims
    /kosks/{id}/basvurular: courseApplications
    /kosks/{id}/courses/new: courseNew
    /kosks/{id}/courses/{courseId}: courseOverview
    /kosks/{id}/courses/{courseId}/ayarlar: courseSettings
    /kosks/{id}/courses/{courseId}/curriculum: courseCurriculum
    /kosks/{id}/courses/{courseId}/edit: courseEdit
    /kosks/{id}/courses/{courseId}/sessions: courseSessions
    /kosks/{id}/courses/{courseId}/sessions/new: courseSessionsNew
    /kosks/{id}/courses/{courseId}/students: courseStudents
    /kosks/{id}/ders-talepleri: courseRequests
    /kosks/{id}/dersler: koskCourses
    /kosks/{id}/desteler: koskDecks
    /kosks/{id}/desteler/yeni: koskDeckNew
    /kosks/{id}/izinler: koskGrants
    /kosks/{id}/yasaklamalar: koskBans
    /medaris-nazimlari: nazims
    /medreseler: madrasahs
    /nazar-yonlendirme: nazarRedirect
    /pasif-kapsamlar: inactive
    /talepler/deste-yayin-istekleri: deckRequests
    /talepler/itirazlar: appeals
    /talepler/kalici-yasak: permanentBans
    /talepler/kosk-basvurulari: koskApplications
    /yasaklamalar: bans
    /yetki-yok: noRole

frames:
  shell:
    title: >-
      The management shell around every page but the sign-in pages: the sidebar from 768 px up (brand, theme toggle,
      scope picker for a köşk nazımı, the menu of the person's variant, the person row), and below 768 px an app bar
      whose menu button opens the same menu as a sheet. A person with no menu variant gets the brand and the person
      row only. The footer link to the privacy notice sits inside the main area.
    menu: Ana menü
    source: apps/nizam/components/shell/shell-frame.tsx:112
  bare:
    title: >-
      The sign-in and sign-out pages: the whole screen, with no shell even around a signed-in person (isBarePath).
      The privacy-notice footer follows the page.
    source: apps/nizam/lib/shell-nav.ts:382
  outside:
    title: Pages that belong to other apps or to Keycloak, which Nizam links to or sends the browser to.

facts:
  signedIn:
    values: [true, false]
    say: whether the browser holds a session (the proxy sends every page but the three public ones to sign-in without one)
  landing:
    values: [nizam, nazar, none]
    say: >-
      landingFor(me): nizam for the başnazım and for anyone holding MEDARIS_NAZIM or KOSK_NAZIM, nazar for any other
      assignment (medrese or course roles), none for no assignment or no session
  variant:
    values: [chief, medaris, kosk, none]
    say: >-
      shellVariant(me), the menu the shell draws: chief for the realm role SYSTEM_ADMIN, then medaris for a MEDARIS_NAZIM
      assignment, then kosk for a KOSK_NAZIM assignment, else none. The widest role wins
  held:
    of:
      - platform.kosk_create
      - platform.kosk_nazim_manage
      - platform.kosk_edit
      - platform.course_hide
      - platform.hosting_grant
      - platform.madrasah_create
      - platform.head_muderris_manage
      - platform.madrasah_edit
      - platform.madrasah_nazir_grant
      - platform.kosk_application_decide
      - platform.deck_publish
      - platform.appeal_decide
      - platform.ban_scoped
      - platform.ban_account
      - platform.audit_read
      - platform.inactive_scopes_manage
      - platform.youtube_manage
      - platform.policy_edit
      - platform.partner_manage
    say: the platform permission codes a Medaris nazımı holds (GET /me/permissions); only the medaris variant reads them
  koskManaged:
    values: [zero, one, many]
    say: how many köşks the person is nazım of; two or more turn the köşk label of the menu into a scope picker

guards:
  koskManager: "variant == 'chief' or variant == 'kosk'"
  koskEditor: "variant == 'chief' or variant == 'kosk' or (variant == 'medaris' and 'platform.kosk_edit' in held)"
  banReader: "variant == 'chief' or (variant == 'medaris' and ('platform.ban_scoped' in held or 'platform.ban_account' in held))"
  koskBansReader: "variant == 'chief' or variant == 'kosk' or (variant == 'medaris' and ('platform.ban_scoped' in held or 'platform.ban_account' in held))"

personas:
  visitor:
    title: Visitor
    say: no session; sees the welcome page with "Giriş yap" and nothing else
    facts: { signedIn: false, landing: none, variant: none, held: [], koskManaged: zero }
  noRole:
    title: Signed in with no role (P-NONE)
    say: a talebe or a guest with no assignment; lands on "Yönetim yetkiniz yok", no menu, no bell
    facts: { signedIn: true, landing: none, variant: none, held: [], koskManaged: zero }
  nazarRoles:
    title: Medrese or course roles only (P-NAZAR)
    say: a müderris, medrese nazırı or ders nazırı; lands on the hand-over to Nazar, no menu, no bell
    facts: { signedIn: true, landing: nazar, variant: none, held: [], koskManaged: zero }
  koskNazim:
    title: Nazım of one köşk (P-KOSK)
    say: >-
      a köşk nazımı of exactly one köşk; lands on that köşk's home. The seeded KOSK_NAZIM manages two köşks (seed.json
      `kosk` and `kosk2`), so no seeded account is this persona: it takes an account made nazım of one köşk of its own
      (the binding does not bind it)
    facts: { signedIn: true, landing: nizam, variant: kosk, held: [], koskManaged: one }
  koskNazimMany:
    title: Nazım of two köşks (P-KOSK)
    say: >-
      a köşk nazımı of two köşks; the menu's köşk label is a picker. The seeded KOSK_NAZIM is this persona: nazım of
      "Süleymaniye Köşkü" and "Kubbealtı Köşkü" (seed.json `kosk` and `kosk2`)
    facts: { signedIn: true, landing: nizam, variant: kosk, held: [], koskManaged: many }
  medarisNazim:
    title: Medaris nazımı with the seeded permissions (P-MEDARIS)
    say: >-
      the seeded Medaris nazımı, who holds platform.kosk_create, madrasah_create, kosk_edit, audit_read and course_hide;
      the menu shows Medreseler and Köşkler only
    facts:
      signedIn: true
      landing: nizam
      variant: medaris
      held:
        - platform.kosk_create
        - platform.madrasah_create
        - platform.kosk_edit
        - platform.audit_read
        - platform.course_hide
      koskManaged: zero
  medarisWide:
    title: Medaris nazımı holding every permission behind a menu entry (P-MEDARIS)
    say: >-
      a Medaris nazımı whose permissions open every entry of the Medaris menu; the seeded one holds five, so the
      permissions are given by the başnazım on the Medaris nazımları page (the binding gives them to a spare account
      with helpers/nazim.mjs)
    facts:
      signedIn: true
      landing: nizam
      variant: medaris
      held:
        - platform.kosk_create
        - platform.kosk_nazim_manage
        - platform.kosk_edit
        - platform.hosting_grant
        - platform.madrasah_create
        - platform.head_muderris_manage
        - platform.madrasah_edit
        - platform.kosk_application_decide
        - platform.deck_publish
        - platform.appeal_decide
        - platform.ban_scoped
        - platform.ban_account
        - platform.audit_read
        - platform.inactive_scopes_manage
        - platform.policy_edit
        - platform.partner_manage
      koskManaged: zero
  chief:
    title: Medaris başnazımı (P-CHIEF)
    say: the realm role SYSTEM_ADMIN; every menu entry, and every page by the bypass of the API's checks
    facts: { signedIn: true, landing: nizam, variant: chief, held: [], koskManaged: zero }

pages:
  # `{id}` is `:kosk` and `{courseId}` is `:course` from here on (see the header). The sample of `:kosk` is the köşk of
  # the köşk nazımı, so a köşk page that is opened "for the köşk the person manages" is the case that is drawn.
  start:
    # "/" is public. A visitor sees "Hoş geldiniz" and "Giriş yap"; a signed-in person is sent on by landingFor (the auto
    # entries below); the başnazım and a Medaris nazımı stay and see the Medaris home. When the roles cannot be read
    # (tedrisat unreachable) a signed-in person keeps "/" and sees only "Hoş geldiniz" (F-P0-9).
    evidence: apps/nizam/app/(home)/page.tsx:48-58 sends a person with no role to /yetki-yok, one with medrese or course roles to /nazar-yonlendirme and a köşk nazımı to the home of the first köşk they manage; the başnazım and a Medaris nazımı get the Medaris home
  koskManage:
    route: /kosks/:kosk
    opensFor: "signedIn and (variant == 'chief' or variant == 'kosk' or (variant == 'medaris' and ('platform.kosk_edit' in held or 'platform.hosting_grant' in held)))"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403) for everyone else. The management view itself is the başnazım's and a Medaris nazımı's with platform.kosk_edit; a köşk's own nazımı is redirected to Dersler and a Medaris nazımı with only platform.hosting_grant to Barındırma hakları (the auto entries)
    evidence: apps/nizam/app/kosks/[id]/page.tsx:50-54 and apps/nizam/features/kosks/kosk-entry.ts:41-50 (koskEntry)
  koskHome:
    route: /kosks/:kosk/ana-sayfa
    opensFor: "signedIn and koskEditor"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403), also for a köşk that is not theirs or does not exist
    evidence: apps/nizam/app/kosks/[id]/ana-sayfa/page.tsx:30; tedrisat kosk-admin.controller.ts:204-212 asks kosk.manage or platform.kosk_edit
  koskCourses:
    route: /kosks/:kosk/dersler
    opensFor: "signedIn and koskEditor"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403 or 404)
    evidence: apps/nizam/app/kosks/[id]/dersler/page.tsx:42-46; tedrisat kosk-admin.controller.ts:234 asks kosk.manage or platform.kosk_edit
  courseApplications:
    route: /kosks/:kosk/basvurular
    # The köşk-wide list is the köşk nazımı's alone (CDA-5). The başnazım is not a nazım of any köşk, so tedrisat's guard
    # (course.manage_all, which SYSTEM_ADMIN holds) lets her through and KoskService.assertManager then refuses her with
    # KOSK_FORBIDDEN; the page says "Bu bölüm için izniniz yok" at the address she opened. The menu entry is the köşk
    # nazımı's only (Shell.items.applications), but the links to this page from the köşk home and from Dersler are drawn for
    # her too (`koskManager`), so the checker says link-refused for the chief: a finding of the code, not of this graph.
    opensFor: "signedIn and variant == 'kosk'"
    refusal: the "Bu bölüm için izniniz yok" screen (KOSK_FORBIDDEN) for the başnazım, who is no row of the köşk's nazımlar, and for a Medaris nazımı who reaches the köşk by platform.kosk_edit alone
    evidence: apps/nizam/app/kosks/[id]/basvurular/page.tsx:34-35; tedrisat course.controller.ts:523 asks course.manage_all on the köşk, then course.service.ts:1575 calls koskService.assertManager (kosk.service.ts:128-139; kosk.repository.ts:488 reads a KOSK_NAZIM row of this köşk only)
  courseRequests:
    route: /kosks/:kosk/ders-talepleri
    opensFor: "signedIn and koskManager"
    refusal: the "Bu bölüm için izniniz yok" screen; a Medaris nazımı is refused, the köşk's own nazımı and the başnazım are not
    evidence: apps/nizam/app/kosks/[id]/ders-talepleri/page.tsx:28-29; tedrisat course-request.service.ts:205-215 (assertKoskNazim)
  koskDecks:
    route: /kosks/:kosk/desteler
    opensFor: "signedIn and koskManager"
    refusal: the "Bu bölüm için izniniz yok" screen
    evidence: apps/nizam/app/kosks/[id]/desteler/page.tsx:34-35; tedrisat kosk-decks.controller.ts:68 ("A nazım of the köşk or SYSTEM_ADMIN")
  koskDeckNew:
    route: /kosks/:kosk/desteler/yeni
    opensFor: "signedIn and koskManager"
    refusal: the "Bu bölüm için izniniz yok" screen
    evidence: apps/nizam/app/kosks/[id]/desteler/yeni/page.tsx:38-39
  koskBans:
    route: /kosks/:kosk/yasaklamalar
    opensFor: "signedIn and koskBansReader"
    refusal: the "Bu bölüm için izniniz yok" screen (a müderris of a course gets it too)
    evidence: apps/nizam/app/kosks/[id]/yasaklamalar/page.tsx:34-35; tedrisat ban.controller.ts:102 asks ban.manage_kosk, or platform.ban_scoped or ban_account
  koskArchive:
    route: /kosks/:kosk/arsiv
    opensFor: "signedIn and koskEditor"
    refusal: the "Bu bölüm için izniniz yok" screen
    evidence: apps/nizam/app/kosks/[id]/arsiv/page.tsx:36-37; tedrisat archive.controller.ts:104 (KOSK_ARCHIVE_READ_CODES)
  koskGrants:
    route: /kosks/:kosk/izinler
    opensFor: "signedIn and koskManager"
    refusal: the "Bu bölüm için izniniz yok" screen; a Medaris nazımı with no grant gets it
    evidence: apps/nizam/app/kosks/[id]/izinler/page.tsx:32-33; tedrisat kosk-grants.controller.ts:69 asks course_nazir.assign on the köşk
  koskSettings:
    route: /kosks/:kosk/ayarlar
    opensFor: "signedIn and koskEditor"
    refusal: the "Bu bölüm için izniniz yok" screen
    evidence: apps/nizam/app/kosks/[id]/ayarlar/page.tsx:40-44; tedrisat kosk-admin.controller.ts:298 asks kosk.manage or platform.kosk_edit
  koskNazims:
    route: /kosks/:kosk/ayarlar/nazimlar
    opensFor: "signedIn and koskEditor"
    refusal: the "Bu bölüm için izniniz yok" screen
    evidence: apps/nizam/app/kosks/[id]/ayarlar/nazimlar/page.tsx:35-39
  koskHosting:
    route: /kosks/:kosk/ayarlar/barindirma
    opensFor: "signedIn and (koskManager or (variant == 'medaris' and 'platform.hosting_grant' in held))"
    refusal: the "Bu bölüm için izniniz yok" screen
    evidence: apps/nizam/app/kosks/[id]/ayarlar/barindirma/page.tsx:40-45; tedrisat hosting.controller.ts:72 asks kosk.hosting or platform.hosting_grant
  courseNew:
    route: /kosks/:kosk/courses/new
    opensFor: "signedIn and koskManager"
    refusal: the "Bu bölüm için izniniz yok" screen
    evidence: apps/nizam/app/kosks/[id]/courses/new/page.tsx:35 (koskAbilities.openCourse)
  courseOverview:
    route: /kosks/:kosk/courses/:course
    opensFor: "signedIn and koskManager"
    refusal: the "Bu bölüm için izniniz yok" screen (a refused read is HTTP 403, a course not in this köşk 404)
    evidence: apps/nizam/app/kosks/[id]/courses/[courseId]/page.tsx:49-65; tedrisat course.controller.ts:543 asks course.staff_read
  courseEdit:
    route: /kosks/:kosk/courses/:course/edit
    evidence: apps/nizam/app/kosks/[id]/courses/[courseId]/edit/page.tsx:16 redirects to /curriculum with no guard and no title
  courseSettings:
    route: /kosks/:kosk/courses/:course/ayarlar
    opensFor: "signedIn and koskManager"
    refusal: the "Bu bölüm için izniniz yok" screen
    evidence: apps/nizam/app/kosks/[id]/courses/[courseId]/ayarlar/page.tsx:34-35 (readCourseScope, mayEditCourse)
  courseCurriculum:
    route: /kosks/:kosk/courses/:course/curriculum
    opensFor: "signedIn and koskManager"
    refusal: the "Bu bölüm için izniniz yok" screen
    evidence: apps/nizam/app/kosks/[id]/courses/[courseId]/curriculum/page.tsx:30-31 (readCourseScope, mayEditCourse)
  courseSessions:
    route: /kosks/:kosk/courses/:course/sessions
    opensFor: "signedIn and koskManager"
    refusal: the "Bu bölüm için izniniz yok" screen
    evidence: apps/nizam/app/kosks/[id]/courses/[courseId]/sessions/page.tsx:37-38 (readCourseScope, mayEditCourse)
  courseSessionsNew:
    route: /kosks/:kosk/courses/:course/sessions/new
    opensFor: "signedIn and koskManager"
    refusal: the "Bu bölüm için izniniz yok" screen
    evidence: apps/nizam/app/kosks/[id]/courses/[courseId]/sessions/new/page.tsx:27-28 (readCourseScope, mayEditCourse)
  courseStudents:
    route: /kosks/:kosk/courses/:course/students
    opensFor: "signedIn and koskManager"
    refusal: the "Bu bölüm için izniniz yok" screen (a refused read lands on notFound, HTTP 404, never 403)
    evidence: apps/nizam/app/kosks/[id]/courses/[courseId]/students/page.tsx:44; tedrisat course.controller.ts:562 asks course.staff_read
  madrasahs:
    opensFor: "signedIn and (variant == 'chief' or (variant == 'medaris' and ('platform.madrasah_create' in held or 'platform.madrasah_edit' in held or 'platform.head_muderris_manage' in held)))"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403)
    evidence: apps/nizam/app/medreseler/page.tsx:48; tedrisat madrasah.controller.ts:283 (directory) asks one of the three codes
  nazims:
    opensFor: "signedIn and (variant == 'chief')"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403), also for a Medaris nazımı
    evidence: apps/nizam/app/medaris-nazimlari/page.tsx:27; tedrisat permission-admin.controller.ts:48 (SYSTEM_ADMIN only)
  permissionGroups:
    opensFor: "signedIn and (variant == 'chief')"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403), also for a köşk nazımı
    evidence: apps/nizam/app/izin-gruplari/page.tsx:40-49; tedrisat permission-admin.controller.ts:48 (SYSTEM_ADMIN only)
  inactive:
    opensFor: "signedIn and (variant == 'chief' or (variant == 'medaris' and 'platform.inactive_scopes_manage' in held))"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403)
    evidence: apps/nizam/app/pasif-kapsamlar/page.tsx:23; tedrisat inactive-scope.service.ts:59-63. A permitted Medaris nazımı has no menu entry and reaches it by address (F-W2-1)
  kosks:
    opensFor: "signedIn and (variant == 'chief' or variant == 'kosk' or (variant == 'medaris' and ('platform.kosk_create' in held or 'platform.kosk_edit' in held or 'platform.kosk_nazim_manage' in held or 'platform.hosting_grant' in held)))"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403); a person who is no nazım is refused by the /kosks layout already
    evidence: apps/nizam/app/kosks/layout.tsx:19-21 (landing), apps/nizam/app/kosks/page.tsx:37; tedrisat kosk-admin.service.ts:190-207 (scopeOf)
  partners:
    opensFor: "signedIn and (variant == 'chief' or (variant == 'medaris' and 'platform.partner_manage' in held))"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403)
    evidence: apps/nizam/app/ayarlar/ortak-uygulamalar/page.tsx:23; tedrisat partner-admin.service.ts:48. A permitted Medaris nazımı has no menu entry
  platformSettings:
    opensFor: "signedIn and (variant == 'chief' or (variant == 'medaris' and 'platform.policy_edit' in held))"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403), also for a köşk nazımı
    evidence: apps/nizam/app/ayarlar/platform/page.tsx:24; tedrisat platform-policy.service.ts:72. A permitted Medaris nazımı has no menu entry
  koskApplications:
    opensFor: "signedIn and (variant == 'chief' or (variant == 'medaris' and 'platform.kosk_application_decide' in held))"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403)
    evidence: apps/nizam/app/talepler/kosk-basvurulari/page.tsx:29; tedrisat kosk-application-review.service.ts:90
  deckRequests:
    opensFor: "signedIn and (variant == 'chief' or (variant == 'medaris' and 'platform.deck_publish' in held))"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403), also for a köşk nazımı
    evidence: apps/nizam/app/talepler/deste-yayin-istekleri/page.tsx:32; tedrisat deck-review.service.ts:322-327
  appeals:
    opensFor: "signedIn and (variant == 'chief' or (variant == 'medaris' and 'platform.appeal_decide' in held))"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403). The menu entry is the başnazım's alone, a permitted Medaris nazımı reaches it by address
    evidence: apps/nizam/app/talepler/itirazlar/page.tsx:24; tedrisat appeal.service.ts:129
  bans:
    opensFor: "signedIn and banReader"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403), also for a köşk nazımı
    evidence: apps/nizam/app/yasaklamalar/page.tsx:25; tedrisat ban.controller.ts:135
  auditLog:
    opensFor: "signedIn and (variant == 'chief' or (variant == 'medaris' and 'platform.audit_read' in held))"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403), also for a köşk nazımı
    evidence: apps/nizam/app/denetim-kaydi/page.tsx:31; tedrisat audit.service.ts:97. A permitted Medaris nazımı has no menu entry
  archive:
    opensFor: "signedIn and (variant == 'chief')"
    refusal: the "Bu bölüm için izniniz yok" screen (HTTP 403), also for a köşk nazımı
    evidence: apps/nizam/app/arsiv/page.tsx:26; tedrisat archive.controller.ts:191 (SYSTEM_ADMIN only)
  permanentBans:
    # Draws what happens today: the menu entry is shown to the başnazım and to a Medaris nazımı holding platform.ban_account, and the address falls through to the catch-all, which answers "Sayfa bulunamadı" inside the shell (F-P0-4, F-W3-10, F-X-11). The page is planned (MDRS-140, flow nizam.moderation.decidePermanentBan).
    opensFor: signedIn
    refusal: sends a visitor to sign in
    evidence: no folder under apps/nizam/app/talepler for it; apps/nizam/app/[...rest]/page.tsx:9 calls notFound()
  youtube:
    # Draws what happens today: the menu entry is the başnazım's, and the address falls through to the catch-all, which answers "Sayfa bulunamadı" inside the shell (F-P0-4, F-W3-10, F-X-11). The page is planned (MDRS-195, flow nizam.youtube.liveBroadcasts).
    opensFor: signedIn
    refusal: sends a visitor to sign in
    evidence: no folder under apps/nizam/app/ayarlar for it; apps/nizam/app/[...rest]/page.tsx:9 calls notFound()
  legacyDecks:
    # The pre-redesign flashcard deck table; no menu entry points at it, no role is checked, and a failed read is the generic error page (F-P0-16). Nothing in the app links to /decks itself; only /decks/:id/cards is linked, from the köşk decks page.
    evidence: apps/nizam/app/decks/page.tsx has no guard; the title stays "Nizam"
  legacyDeckCards:
    # The cards of one deck on the legacy shadcn table; linked from "Kartları düzenle" on the köşk decks page (F-P0-16).
    route: /decks/:deck/cards
    evidence: apps/nizam/app/decks/[id]/cards/page.tsx has no guard; the title stays "Nizam"

  # Pages the extractor does not list.
  notFound:
    # The catch-all app/[...rest]: any address no page answers, at any depth, shows "Sayfa bulunamadı" inside the shell (HTTP 404). The menu's two entries with no page land here. `:rest` stands for the whole unmatched path.
    route: /:rest
    title: PageNotFound.title
    kind: missing
    frame: shell
    opensFor: signedIn
    refusal: sends a visitor to sign in
    evidence: apps/nizam/app/[...rest]/page.tsx:9 calls notFound(); apps/nizam/app/[...rest]/not-found.tsx:12 draws components/errors/page-not-found.tsx
    source: app/[...rest]/page.tsx
  realmSignIn:
    # Where /api/auth/signin sends the browser; drawn by the realm flows (realm.auth.signIn), not here.
    route: Keycloak's sign-in page of the medaris realm (login.ftl)
    title: Keycloak sign-in of the medaris realm
    kind: external
    frame: outside
  tedris:
    # The talebe's app; every link to it is left out when TEDRIS_URL is not set.
    route: the Tedris app (TEDRIS_URL), its home and the public köşk, course and session pages
    title: Tedris
    kind: external
    frame: outside
  nazar:
    # The app of medrese and course roles; every link to it is left out when NAZAR_URL is not set.
    route: the Nazar app (NAZAR_URL), its landing, medrese and course pages
    title: Nazar
    kind: external
    frame: outside

