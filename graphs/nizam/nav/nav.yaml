notModeled:
  - "the first screens of nizam.shell.noAccessAndNotFound, nizam.moderation.decidePermanentBan and nizam.youtube.liveBroadcasts are the not-found screen and the two menu entries with no page; they are drawn as the pages notFound, permanentBans and youtube (kind missing) and have no goal, because a goal on a missing page fails by definition"
  - "a köşk nazımı has no menu entry or link to the köşk directory /kosks (the köşk menu holds no 'Köşkler' item, and the köşk home links elsewhere); it reaches it by address or after hiding a köşk from its settings"
  - "the dialogs, tabs and queries of a page (?durum=, ?grup=, ?secili=, ?ac=1, ?talep=, ?oneri=, ?range=) are the flows' to draw; a query on the same page is not a page"
  - "the 'Bu bölüm için izniniz yok' screen is drawn in place of any page that refuses a person, with its own 'Ana sayfaya dön' button to the home page (NoAccess.back); it is the refusal of each page above, not a page"
  - "the brand link to '/', the bell link of the phone bar to Bildirimler (the menu already has it), the theme toggle, and the person row's role line"
  - "the footer link to the privacy notice of the landing site (LegalFooter, in the shell and after the sign-in pages): its words are in common.json, which the extractor and the repo check do not read; the flow common.shell.privacyNotice draws it"
  - "a köşk the person does not manage: every /kosks/:kosk page answers the refusal screen for another köşk's id or one that does not exist, so the graph draws only the case of the person's own köşk, which is the sample of :kosk"
  - "the Medaris nazımı's fine cuts inside a page (a nazım reaching a köşk by platform.kosk_edit alone is given no applicants; a Medaris nazımı with only platform.hosting_grant is redirected from /kosks/:kosk to Barındırma hakları) are drawn once, as the auto entry and the opensFor of koskManage"
  - "when the roles cannot be read (tedrisat unreachable or a 401), the shell draws no menu, '/' shows only 'Hoş geldiniz' and every /kosks page is let through to tedrisat's own refusal (F-P0-9)"
  - "the list of courses a person teaches in other köşks on /kosks (TaughtCourses) links to /kosks/:kosk/courses/:course/edit; no seeded persona has such a course"
  - "the audit log's CSV export link goes to the route handler /api/audit-log/export, a download and not a page; so do the four /api/files/* resource routes; /api/auth/* carries the sign-in round trip; /api/decks, /api/decks/:id and /api/cards/:id have no caller"
  - "every link to Tedris or Nazar is left out by the app when TEDRIS_URL or NAZAR_URL is not set; the local stack sets both"
  - "the old /tr, /en and /ar addresses answer 308 to the same path without the language (proxy.ts:19-24); only tr is routed and no language menu is drawn"
  - "the badge a menu entry carries (Bildirimler's unread number, Başvurular' pending number) is data, not navigation"
