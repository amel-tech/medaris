  koskDeckNew:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Köşk destesi aç }
  koskBans:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Yasaklamalar }
  koskArchive:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Arşiv }
  koskGrants:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: İzinler }
  koskSettings:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Köşk ayarları }
  koskNazims:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Köşk nazımları }
  koskHosting:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Barındırma hakları }
  courseNew:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Ders aç }
  courseOverview:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: '/^Genel bakış/' }
  courseSettings:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
