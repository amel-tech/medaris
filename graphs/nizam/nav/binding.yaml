# The navigation graph nizam.nav (graphs/nizam/nav) bound to the local stack: nizam-web on :4001, which the shared
# base lists first, the accounts the stack's seed makes, and the seed's ids for the routes' parameters.
#
#   node src/cli.ts replay graphs/nizam/nav --bind graphs/nizam/nav/binding.yaml --out <dir>
#
# Not run yet: this file was written from the code and checked only by loading it (loadNavBinding). What the replay
# finds on a page the first time (a dev page compiles for up to half a minute) will correct the locators below.
#
# Data the personas need. A navigation replay has no teardown, so what a persona's `setup` makes is taken away by the
# `setup` of the persona that runs after it (graph order: koskNazimMany, medarisNazim, medarisWide, chief), and the top-level
# `setup` clears what a run that died left. A full run leaves nothing; a run kept to some personas with `--persona` may leave
# a ban notice or a Medaris nazımı seat (`triage.mjs down <ACCOUNT>`, `helpers/nazim.mjs down applicantG` take them away).
schema: delurio-graph/0
kind: binding
nav: nizam.nav
extends: ../../bindings/local.nizam.binding.yaml

# The routes' `:params`. `:kosk` is the seeded köşk of the köşk nazımı ("Süleymaniye Köşkü"); `:course` is the köşk's own
# course "Nahiv Metinleri" (no medrese), which belongs to that köşk; `:rest` is any address no page answers. `:deck` has
# no sample: the seed makes no flashcard deck, so the legacy deck cards page is not opened.
samples:
  kosk: '{seed.kosk}'
  course: '{seed.courses.standalone}'
  rest: sayfa-yok

# One account stands for each persona it can; each signs in once through Keycloak's real form (the base's signIn).
#   not bound: `visitor` (a replay always signs in) and `koskNazim` (a nazım of exactly one köşk: the seeded KOSK_NAZIM
#   manages two, seed.json `kosk` and `kosk2`, so it is `koskNazimMany`; the one-köşk persona needs a spare account made nazım
#   of a köşk of its own, which no shared helper does yet).
#
# A ban notice is what makes the notification row's link to Yasaklamalar (`notifications->koskBans`) appear, and no notice is
# in the seed. The nav graph offers that link to a köşk nazımı and to every Medaris nazımı (the başnazım is never told), so
# each of those personas has one notice of its own, written the way tedrisat's ban producer writes it
# (nizam/notifications/triage/triage.mjs, `--set last`: three rows, one unread) and taken away by the next persona's setup.
#
# `medarisWide` is a spare account (applicantG, a woman with a full profile and no enrolment) made a Medaris nazımı holding
# the sixteen permissions of the persona by the başnazım, through helpers/nazim.mjs, and dismissed again when the başnazım's
# turn comes. The seeded Medaris nazımı is never changed.
personas:
  noRole: { as: talebe }
  nazarRoles: { as: muderris }
  koskNazimMany:
    as: koskNazim
    setup:
      - run: [node, ../nizam/notifications/triage/triage.mjs, up, koskNazim, --set, last]
        expect: 'ready: last'
  medarisNazim:
    as: medarisNazim
    setup:
      - run: [node, ../nizam/notifications/triage/triage.mjs, down, koskNazim]
      - run: [node, ../nizam/notifications/triage/triage.mjs, up, medarisNazim, --set, last]
        expect: 'ready: last'
  medarisWide:
    as: applicantG
    setup:
      - run: [node, ../nizam/notifications/triage/triage.mjs, down, medarisNazim]
      - run:
          - node
          - helpers/nazim.mjs
          - up
          - applicantG
          - --codes
          - platform.kosk_create,platform.kosk_nazim_manage,platform.kosk_edit,platform.hosting_grant,platform.madrasah_create,platform.head_muderris_manage,platform.madrasah_edit,platform.kosk_application_decide,platform.deck_publish,platform.appeal_decide,platform.ban_scoped,platform.ban_account,platform.audit_read,platform.inactive_scopes_manage,platform.policy_edit,platform.partner_manage
        expect: up APPLICANT_G
      - run: [node, ../nizam/notifications/triage/triage.mjs, up, applicantG, --set, last]
        expect: 'ready: last'
  chief:
    as: systemAdmin
    setup:
      - run: [node, ../nizam/notifications/triage/triage.mjs, down, applicantG]
      - run: [node, helpers/nazim.mjs, down, applicantG]

# Once, before the first persona signs in (no data source is read yet: the commands name nothing but the apps): what a run
# that died left.
setup:
  - run: [node, ../nizam/notifications/triage/triage.mjs, down, koskNazim]
  - run: [node, ../nizam/notifications/triage/triage.mjs, down, medarisNazim]
  - run: [node, ../nizam/notifications/triage/triage.mjs, down, applicantG]
  - run: [node, helpers/nazim.mjs, down, applicantG]

# The shell: its chrome is the sidebar (an `<aside>`; the phone's menu sheet is a dialog, shown only once opened). The
# menu entries are looked up inside it, the page's own links inside `<main>`. The person row is a plain link, so its
# "menu" opens with nothing to press; the köşk picker is a Base UI menu whose trigger reads "Köşk değiştir: <name>".
frames:
  shell:
    find: { css: aside }
    page: { role: main }
    user:
      open: []
      find: { css: aside }
    picker:
      open: [{ click: { role: button, name: '/^Köşk değiştir/' } }]
      find: { role: menu }

pages:
  # Pages the replay cannot hold to "the page stays at its address", because the app moves some personas on from it.
  start: { skip: "'/' sends a person with no role to /yetki-yok, one with medrese or course roles to /nazar-yonlendirme and a köşk nazımı to their köşk's home, so it never stays at its address for them (nizam.shell.landingByRole walks it)" }
  signIn: { skip: "every persona is signed in already, and a signed-in person is sent straight on to the callback address" }
  noRole: { skip: "the persona it refuses is sent to '/' (a redirect, not a refusal screen); nizam.shell.landingByRole walks both ends" }
  nazarRedirect: { skip: "the persona it refuses is sent to '/' (a redirect, not a refusal screen); nizam.shell.landingByRole walks both ends" }
  koskManage: { skip: "a köşk nazımı is redirected from it to Dersler, so it does not stay at its address for them; the başnazım's and the Medaris nazımı's management view is walked by nizam.kosks.manage" }
  courseEdit: { skip: "a redirect page: it always ends on /curriculum (kosk-view#12 asserted the old address and is stale)" }
  legacyDeckCards: { skip: "needs a deck, and the seed makes none" }

  # The screen that says no is the same everywhere: the NoAccess heading.

  koskHome:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Ana sayfa }
  koskCourses:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Dersler }
  courseApplications:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Başvurular }
  courseRequests:
