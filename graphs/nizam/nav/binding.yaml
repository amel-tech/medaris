  courseSessions:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Celseler }
  courseSessionsNew:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Celse planla }
  courseStudents:
