# The navigation graph nizam.nav (graphs/nizam/nav) bound to the local stack: nizam-web on :4001, which the shared
# base lists first, the accounts the stack's seed makes, and the seed's ids for the routes' parameters.
#
#   node src/cli.ts replay graphs/nizam/nav --bind graphs/nizam/nav/binding.yaml --out <dir>
#
# Not run yet: this file was written from the code and checked only by loading it (loadNavBinding). What the replay
# finds on a page the first time (a dev page compiles for up to half a minute) will correct the locators below.
schema: delurio-graph/0
kind: binding
nav: nizam.nav
extends: ../../bindings/local.nizam.binding.yaml

# The routes' `:params`. `:kosk` is the seeded köşk of the köşk nazımı ("Süleymaniye Köşkü"); `:course` is the köşk's own
# course "Nahiv Metinleri" (no medrese), which belongs to that köşk; `:rest` is any address no page answers. `:deck` has
# no sample: the seed makes no flashcard deck, so the legacy deck cards page is not opened.
samples:
  kosk: '{seed.kosk}'
  course: '{seed.courses.standalone}'
  rest: sayfa-yok

# One account stands for each persona it can; each signs in once through Keycloak's real form (the base's signIn).
#   not bound: `visitor` (a replay always signs in), `koskNazimMany` (the seed gives the köşk nazımı one köşk) and
#   `medarisWide` (the seed's Medaris nazımı holds five permissions, not the sixteen of the persona).
personas:
  noRole: { as: talebe }
  nazarRoles: { as: muderris }
  koskNazim: { as: koskNazim }
  medarisNazim: { as: medarisNazim }
  chief: { as: systemAdmin }

# The shell: its chrome is the sidebar (an `<aside>`; the phone's menu sheet is a dialog, shown only once opened). The
# menu entries are looked up inside it, the page's own links inside `<main>`. The person row is a plain link, so its
# "menu" opens with nothing to press; the köşk picker is a Base UI menu whose trigger reads "Köşk değiştir: <name>".
frames:
  shell:
    find: { css: aside }
    page: { role: main }
    user:
      open: []
      find: { css: aside }
    picker:
      open: [{ click: { role: button, name: '/^Köşk değiştir/' } }]
      find: { role: menu }

pages:
  # Pages the replay cannot hold to "the page stays at its address", because the app moves some personas on from it.
  start: { skip: "'/' sends a person with no role to /yetki-yok, one with medrese or course roles to /nazar-yonlendirme and a köşk nazımı to their köşk's home, so it never stays at its address for them (nizam.shell.landingByRole walks it)" }
  signIn: { skip: "every persona is signed in already, and a signed-in person is sent straight on to the callback address" }
  noRole: { skip: "the persona it refuses is sent to '/' (a redirect, not a refusal screen); nizam.shell.landingByRole walks both ends" }
  nazarRedirect: { skip: "the persona it refuses is sent to '/' (a redirect, not a refusal screen); nizam.shell.landingByRole walks both ends" }
  koskManage: { skip: "a köşk nazımı is redirected from it to Dersler, so it does not stay at its address for them; the başnazım's and the Medaris nazımı's management view is walked by nizam.kosks.manage" }
  courseEdit: { skip: "a redirect page: it always ends on /curriculum (kosk-view#12 asserted the old address and is stale)" }
  legacyDeckCards: { skip: "needs a deck, and the seed makes none" }

  # The screen that says no is the same everywhere: the NoAccess heading.

  koskHome:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Ana sayfa }
  koskCourses:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Dersler }
  courseApplications:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Başvurular }
  courseRequests:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Ders talepleri }
  koskDecks:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Köşk desteleri }
  koskDeckNew:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Köşk destesi aç }
  koskBans:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Yasaklamalar }
  koskArchive:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Arşiv }
  koskGrants:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: İzinler }
  koskSettings:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Köşk ayarları }
  koskNazims:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Köşk nazımları }
  koskHosting:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Barındırma hakları }
  courseNew:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Ders aç }
  courseOverview:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: '/^Genel bakış/' }
  courseSettings:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Ders ayarları }
  courseCurriculum:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Müfredat }
  courseSessions:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Celseler }
  courseSessionsNew:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Celse planla }
  courseStudents:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Talebeler }
  madrasahs:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Medreseler }
  nazims:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Medaris nazımları }
  permissionGroups:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: İzin grupları }
  inactive:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Pasif kapsamlar }
  kosks:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Köşkler }
  partners:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Ortak uygulamalar }
  platformSettings:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Platform ayarları }
  koskApplications:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Köşk başvuruları }
  deckRequests:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Deste yayın istekleri }
  appeals:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: İtirazlar }
  bans:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Yasaklamalar }
  auditLog:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Denetim kaydı }
  archive:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Arşiv }
  notifications:
    refusal: { role: heading, name: Bu bölüm için izniniz yok }
    shows: { role: heading, name: Bildirimler }
  # The not-found screen: the catch-all's, and the two menu entries with no page.
  notFound: { shows: { role: heading, name: Sayfa bulunamadı } }
  permanentBans: { shows: { role: heading, name: Sayfa bulunamadı } }
  youtube: { shows: { role: heading, name: Sayfa bulunamadı } }
  account: { shows: { role: heading, name: Hesap ve ayarlar } }
  signOut: { shows: { role: heading, name: Çıkış yapılsın mı? } }
  legacyDecks: { shows: { role: heading, name: Bilgi Kartı Desteleri } }

# An entry is found by its label as the name of the role its `how` draws, inside the chrome or the page. These say
# where that is not enough: a badge or a hidden word after the name, a name that carries the row's own name, a link that
# opens in a new tab, or a control that needs a row of data (looked for on the seeded rows only).
entries:
  # the menu's badges: the unread count and the pending count are part of the link's name
  frame:shell->notifications: { role: link, name: '/^Bildirimler/' }
  frame:shell->courseApplications: { role: link, name: '/^Başvurular/' }
  # the person row's name is the person's name, the role line and ", Hesap"
  frame:shell->account: { css: 'a.mds-nav-user' }
  frame:shell->koskHome picker: { role: menuitem, hasText: Süleymaniye }

  # leaving: "Çıkış yap" ends the session, so a --follow walk must not take it
  account->signOut: { follow: false }
  signOut->start: { follow: false }
  signOut->account: { follow: false }

  # the seeded rows
  kosks->koskManage: { role: link, name: Süleymaniye Köşkü }
  koskCourses->courseOverview: { role: link, name: Nahiv Metinleri }
  koskCourses->courseCurriculum: { role: link, name: 'Düzenle: Nahiv Metinleri' }
  koskCourses->tedris KoskCourses.view: { role: link, name: 'Dersi gör: Nahiv Metinleri' }
  koskCourses->tedris KoskCourses.publicPage: { role: link, name: '/^Köşk sayfasını gör/' }

  # links that open in a new tab carry a hidden "(yeni sekmede açılır)" after their name
  courseOverview->nazar: { role: link, name: '/^Nazar’da aç/' }
  madrasahs->nazar: { role: link, name: '/^Nazar’da aç, yeni sekmede: /' }

  # the course overview's links to /edit are named after what the button says (F-W4-1: all three land on the curriculum)
  courseOverview->courseEdit CourseOverview.editSession: { role: link, name: '/^Düzenle: /' }
  courseSessionsNew->courseSessions SessionPlan.submit: { role: button, name: '/celse oluştur$/' }
  courseSessions->tedris: { skip: "the session's own name is a link to its Tedris page; the title is the seeded session's, which this replay does not know" }

  # a dialog's own button, shown once the dialog is open, and rows the seed does not make
  koskSettings->kosks: { skip: "the confirm button of the 'Köşkü gizle' dialog, shown only after the dialog opens" }
  inactive->koskManage: { skip: "a row of Pasif kapsamlar; the seed makes no passive scope" }
  inactive->courseEdit: { skip: "a row of Pasif kapsamlar; the seed makes no passive scope" }
  courseRequests->courseNew: { skip: "a waiting course request; the seed makes none" }
  koskDecks->koskDeckNew KoskDecksPage.accept: { skip: "a teacher's deck proposal; the seed makes none" }
  koskDecks->legacyDeckCards: { skip: "a köşk deck; the seed makes none" }
  legacyDecks->legacyDeckCards: { skip: "a deck; the seed makes none, and the eye icon has no accessible name (F-P0-10)" }
  notifications->koskBans: { skip: "a ban notification; the seed makes none" }
  koskHome->courseSessions: { skip: "a row of the week's celse list; the row's action is named after the celse and its time" }
  nazims->permissionGroups: { skip: "a link inside the permissions dialog of a Medaris nazımı" }
