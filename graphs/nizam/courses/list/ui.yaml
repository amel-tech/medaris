# The screens of nizam.courses.list: Dersler (/kosks/<id>/dersler) of a köşk, as its nazımı and the başnazım meet it: the header with its two
# links, the three cards, the section "Bütün dersler" with the tabs "Ders durumu" and the table "Köşkün dersleri", the buttons of a row by
# the row's kind, the window "Dersi gizle" and the toasts that answer a hide and a restore. Read from apps/nizam/app/kosks/[id]/dersler/
# page.tsx, features/kosks/components/{kosk-courses-view,kosk-course-table,hide-course-dialog}.tsx, features/kosks/{overview-present,
# course-actions}.ts and libs/ui/src/mds (alert, alert-dialog, button, stat, table, tabs) and libs/ui/src/components/sonner.tsx on
# 16 Nov 2026. Nothing was seen in a browser by its writer: every behaviour is "from the code" unless a rule says otherwise.
#
# What this file leaves to its neighbours (flow.yaml `scope.outOfView` names them): the dialog "Hocaları düzenle"
# (nizam.courses.editHocalar), the form behind "Ders aç" (nizam.courses.open), the pages the other links open, and the screen that says
# "Bu bölüm için izniniz yok" (nizam.shell.noAccessAndNotFound).
#
# Words: every key that has no `composed.` prefix is copied letter for letter from libs/i18n/src/locales/tr/nizam.json (the file the app
# reads as `nizam`; the key is the path under its root) and common.json, by <scratchpad>/ncl/catalog.py, except `Changes.note`, the one
# authored message of this catalog (the app has no one place that says what a hide changes and who can undo it; it is made of the app's
# own sentences HideCourseDialog.body, HideCourseDialog.way and HideLevel.locked). The `composed.*` keys are text the app builds in code
# from data and messages; each has its code line here, and a placeholder the binding gives no sample for matches any text:
#   composed.KoskCourses.subtitle         "{kosk} · " and KoskCourses.listed in one <p> (kosk-courses-view.tsx:94-98)
#   composed.KoskCourses.publicPageName   KoskCourses.publicPage and, inside the link, the visually hidden " " and KoskCourses.newTab:
#                                         the link's whole accessible name (kosk-courses-view.tsx:109-110)
#   composed.KoskCourses.number           "{count}" a card's number, formatted for the page's locale (stat.tsx:41)
#   composed.KoskCourses.tabAll|tabPublished|tabDraft|tabHidden   a tab: its label directly followed by the count, no space (tabs.tsx:111-112)
#   composed.KoskCourses.rowTitle         "{title}" the course's title, a link in the row header, or plain text for a hidden course
#                                         (kosk-course-table.tsx:117-127)
#   composed.HideCourseDialog.eyebrow     "{title}" the course's title above the window's title (hide-course-dialog.tsx:65)
#   composed.Button.loading               "Yükleniyor" the busy button's hidden status, a default of the kit (libs/ui/src/mds/button.tsx:62)
# A toast is two lines (a title and a description) in a sonner <li data-sonner-toast> that has no role; each line is a node.
schema: delurio-graph/0
kind: ui
id: nizam.courses.list
flow: nizam.courses.list
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  kosk: Örnek Köşk
  name: Örnek Ders
  title: Örnek Ders
  count: '1'
  level: Medaris yönetimi

# Dersler sets no focus on load (nothing in the page or in features/kosks does), so no page node carries `initialFocus` (rule
# focus-not-set). Only the window's, on Vazgeç, is drawn. While the window is open the page behind it is inert, so no page node is `in`
# confirmHide or hiding; the toasts live in their own portal and are.
nodes:
  # ---- the page: what every state of Dersler draws -----------------------------------------------------------------------------
  main: { type: page, component: Page, role: main, in: [listed, listedHidden, empty, rowsFailed, restoring], source: libs/ui/src/mds/app-shell.tsx:41 } # the shell's one <main>; it has no name, so the binding tells it from the page a walk leaves for by a word of its own
  title: { type: text, component: Heading, role: heading, text: { key: KoskCourses.title }, in: [listed, listedHidden, empty, rowsFailed, restoring], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:93 } # the page's <h1> "Dersler" (kosk-view.e2e.ts#6, #7); the document's <title> is the same word for every köşk (F-W4-17)
  subtitle: { type: text, component: Text, text: { key: composed.KoskCourses.subtitle, params: { kosk: kosk.name } }, in: [listed, listedHidden, empty, rowsFailed, restoring], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:94 } # "<köşk> · Listelerde görünür"; a private köşk says "... · Listelerde görünmez" (not drawn)
  publicPage: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: composed.KoskCourses.publicPageName }, text: { key: KoskCourses.publicPage }, in: [listed, listedHidden, empty, rowsFailed, restoring], emits: OPEN_PUBLIC_PAGE, source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:101 } # tedris's page of the köşk, in a new tab (target=_blank), and only where the app knows tedris's address (TEDRIS_URL)
  openCourse: { type: action, component: LinkButton, role: link, intent: confirm, text: { key: KoskCourses.open }, in: [listed, listedHidden, empty, rowsFailed, restoring], emits: OPEN_NEW, source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:113 } # "Ders aç": the köşk's nazımı and the başnazım see it (koskAbilities.openCourse); kosk-view.e2e.ts#10

  # ---- the three cards ------------------------------------------------------------------------------------------------------------
  cardsRegion: { type: page, component: Page, role: region, name: { key: KoskCourses.cardsLabel }, in: [listed, listedHidden, empty, rowsFailed, restoring], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:124 } # <section aria-label="Köşkün özeti">; where the overview did not read it holds an error Alert in place of the cards (not drawn)
  applicationsLabel: { type: text, component: Text, text: { key: KoskCourses.cards.applications }, in: [listed, listedHidden, empty, rowsFailed, restoring], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:139 }
  applicationsNumber: { type: text, component: Text, text: { key: composed.KoskCourses.number, params: { count: overview.pendingApplications } }, in: [listed, listedHidden, empty, rowsFailed, restoring], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:65 } # kosk-view.e2e.ts#7: the first card says 1; it counts the applications of courses that are not hidden (kosk-admin.repository.ts:585-588), so it falls while the course that holds them is hidden
  applicationsLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: KoskCourses.cards.applicationsLink }, in: [listed, listedHidden, empty, rowsFailed, restoring], emits: OPEN_APPLICATIONS, source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:145 } # /kosks/<id>/basvurular
  hostingLabel: { type: text, component: Text, text: { key: KoskCourses.cards.hosting }, in: [listed, listedHidden, empty, rowsFailed, restoring], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:139 }
  hostingNumber: { type: text, component: Text, text: { key: composed.KoskCourses.number, params: { count: overview.hostingMadrasahs } }, in: [listed, listedHidden, empty, rowsFailed, restoring], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:72 } # the number of medreses that hold a hosting right in the köşk and are not hidden (kosk-admin.repository.ts:593-600)
  hostingLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: KoskCourses.cards.hostingLink }, in: [listed, listedHidden, empty, rowsFailed, restoring], emits: OPEN_HOSTING, source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:145 } # /kosks/<id>/ayarlar/barindirma
  nazimsLabel: { type: text, component: Text, text: { key: KoskCourses.cards.nazims }, in: [listed, listedHidden, empty, rowsFailed, restoring], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:139 }
  nazimsNumber: { type: text, component: Text, text: { key: composed.KoskCourses.number, params: { count: overview.nazimCount } }, in: [listed, listedHidden, empty, rowsFailed, restoring], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:79 }
  nazimsLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: KoskCourses.cards.nazimsLink }, in: [listed, listedHidden, empty, rowsFailed, restoring], emits: OPEN_NAZIMS, source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:145 } # /kosks/<id>/ayarlar/nazimlar

  # ---- the section "Bütün dersler" ----------------------------------------------------------------------------------------------
  coursesRegion: { type: page, component: Page, role: region, name: { labelledBy: coursesHeading }, in: [listed, listedHidden, empty, rowsFailed, restoring], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:153 }
  coursesHeading: { type: text, component: Heading, role: heading, text: { key: KoskCourses.heading }, in: [listed, listedHidden, empty, rowsFailed, restoring], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:158 } # an <h2>, id courses-heading
  archiveLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: KoskCourses.archive }, in: [listed, listedHidden, empty, rowsFailed, restoring], emits: OPEN_ARCHIVE, source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:161 } # /kosks/<id>/arsiv
  intro: { type: text, component: Text, text: { key: KoskCourses.intro }, in: [listed, listedHidden, empty, rowsFailed, restoring], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:165 }
  hiddenInArchive: { type: text, component: Text, text: { key: KoskCourses.hiddenInArchive }, in: [listed, listedHidden, empty, rowsFailed, restoring], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:182 }

  # ---- the roster could not be read: the cards and the section stay, and an error Alert stands where the tabs and the table were --------
  failAlert: { type: alert, component: Alert, role: alert, name: { key: KoskCourses.loadFailedTitle }, in: [rowsFailed], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:167 } # an error Alert is role=alert
  failText: { type: text, component: Text, text: { key: KoskCourses.loadFailed }, in: [rowsFailed], source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:168 }
  retry: { type: action, component: Button, role: button, intent: secondary, text: { key: KoskCourses.retry }, in: [rowsFailed], emits: RETRY, source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:169 } # router.refresh(): the page is read again

  # ---- the tabs: a Base UI tablist with activateOnFocus; the tab of the page has aria-selected, which the format cannot say ------------
  # The tabs stay live while a restore runs: a choice changes the table at once, and the answer keeps it (`tab` is kept); `duringStep` draws it after.
  tablist: { type: list, component: List, role: tablist, name: { key: KoskCourses.tabsLabel }, in: [listed, listedHidden, empty, restoring], source: libs/ui/src/mds/tabs.tsx:103 }
  tabAll: { type: action, component: Button, role: tab, intent: secondary, name: { key: composed.KoskCourses.tabAll, params: { count: counts.all } }, in: [listed, listedHidden, empty, restoring], emits: TAB_ALL, duringStep: true, source: libs/ui/src/mds/tabs.tsx:110 } # "Tümü5": label and count with no space between (NCL-3); the counts are the rows' own (countRows, kosk-course-table.tsx:79), so a tab always equals the list it opens (kosk-view.e2e.ts#7)
  tabPublished: { type: action, component: Button, role: tab, intent: secondary, name: { key: composed.KoskCourses.tabPublished, params: { count: counts.published } }, in: [listed, listedHidden, empty, restoring], emits: TAB_PUBLISHED, duringStep: true, source: libs/ui/src/mds/tabs.tsx:110 }
  tabDraft: { type: action, component: Button, role: tab, intent: secondary, name: { key: composed.KoskCourses.tabDraft, params: { count: counts.draft } }, in: [listed, listedHidden, empty, restoring], emits: TAB_DRAFT, duringStep: true, source: libs/ui/src/mds/tabs.tsx:110 }
  tabHidden: { type: action, component: Button, role: tab, intent: secondary, name: { key: composed.KoskCourses.tabHidden, params: { count: counts.hidden } }, in: [listed, listedHidden, empty, restoring], emits: TAB_HIDDEN, duringStep: true, source: libs/ui/src/mds/tabs.tsx:110 }

  # ---- the table "Köşkün dersleri": explicit table roles (responsive="stack"), named by its caption -------------------------------------
  table: { type: list, component: List, role: table, name: { key: KoskCourses.caption }, in: [listed, listedHidden, empty, restoring], source: apps/nizam/features/kosks/components/kosk-course-table.tsx:361 }
  emptyAll: { type: text, component: Text, text: { key: KoskCourses.emptyAll }, in: [empty], source: apps/nizam/features/kosks/components/kosk-course-table.tsx:367 } # the table's one cell when the köşk has no course at all, whatever the tab
  emptyTab: { type: text, component: Text, text: { key: KoskCourses.emptyTab }, in: [listed, listedHidden], when: "held == 'none' and tab == 'hidden'", source: apps/nizam/features/kosks/components/kosk-course-table.tsx:367 } # the table's one cell when the tab holds nothing; only Gizli can hold nothing in the data the walks make
  rowTitle: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: composed.KoskCourses.rowTitle, params: { title: course.title } }, in: [listed, listedHidden, restoring], when: "tab != 'hidden'", emits: OPEN_COURSE, repeat: courses.shown, source: apps/nizam/features/kosks/components/kosk-course-table.tsx:122 } # a course that is not hidden: its title is a link to its overview, /kosks/<id>/courses/<courseId> (nizam.courses.overview)
  statusHidden: { type: text, component: Text, text: { key: KoskCourses.status.HIDDEN }, in: [listed, listedHidden, restoring], when: "held != 'none' and tab in ['all', 'hidden']", repeat: courses.hidden, source: apps/nizam/features/kosks/components/kosk-course-table.tsx:234 } # the Durum cell of a hidden course: the word with an eye-off glyph, not a badge; the title of that row is plain text, no link (kosk-course-table.tsx:117)
  chipPending: { type: text, component: Text, text: { key: KoskCourses.chip.pending, params: { count: course.pendingCount } }, in: [listed], when: "tab in ['all', 'published']", source: apps/nizam/features/kosks/components/kosk-course-table.tsx:206 } # the Kayıt durumu cell of a published course that has applications waiting: a warning badge "1 onay bekliyor" (kosk-view.e2e.ts#7)

  # ---- the buttons of a row by its kind. A course of the köşk's own: Düzenle, Hocaları düzenle, Gizle. A course a medrese opened: Dersi gör, Gizle. ----
  ownEdit: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: KoskCourses.editLabel, params: { name: course.title } }, text: { key: KoskCourses.edit }, in: [listed], when: "tab in ['all', 'published']", emits: OPEN_CURRICULUM, source: apps/nizam/features/kosks/components/kosk-course-table.tsx:271 } # a link to /kosks/<id>/courses/<courseId>/curriculum (nizam.courses.curriculum); kosk-view.e2e.ts#8
  ownHocas: { type: action, component: Button, role: button, intent: secondary, name: { key: KoskCourses.editMuderrisLabel, params: { name: course.title } }, text: { key: KoskCourses.editMuderris }, in: [listed], when: "tab in ['all', 'published']", emits: EDIT_HOCAS, source: apps/nizam/features/kosks/components/kosk-course-table.tsx:283 } # a button that opens the window of nizam.courses.editHocalar on this page, not a link to a page (kosk-view.e2e.ts#8)
  ownHide: { type: action, component: Button, role: button, intent: secondary, name: { key: KoskCourses.hideLabel, params: { name: course.title } }, text: { key: KoskCourses.hide }, in: [listed], when: "tab in ['all', 'published']", emits: HIDE_OWN, source: apps/nizam/features/kosks/components/kosk-course-table.tsx:309 } # opens the window "Dersi gizle"; the window gives the focus back here when it closes with nothing hidden
  medreseView: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: KoskCourses.viewLabel, params: { name: course.title } }, text: { key: KoskCourses.view }, in: [listed, listedHidden], when: "tab in ['all', 'published']", emits: VIEW_COURSE, source: apps/nizam/features/kosks/components/kosk-course-table.tsx:297 } # tedris's course page; drawn only where the app knows tedris's address (F-W4-21), and a medrese's course has no Düzenle (kosk-view.e2e.ts#8)
  medreseHide: { type: action, component: Button, role: button, intent: secondary, name: { key: KoskCourses.hideLabel, params: { name: course.title } }, text: { key: KoskCourses.hide }, in: [listed, listedHidden], when: "tab in ['all', 'published']", source: apps/nizam/features/kosks/components/kosk-course-table.tsx:309 } # the same window as ownHide's; the walk presses the own row's, so this node sends no event
  medreseEdit: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: KoskCourses.editLabel, params: { name: course.title } }, text: { key: KoskCourses.edit }, in: [], source: apps/nizam/features/kosks/overview-present.ts:98 } # never drawn: a medrese's course has no "Düzenle" (the medrese opens it and picks its hocalar); `--absent` checks the binding's row for it (kosk-view.e2e.ts#8: `toHaveCount(0)`)
  hiddenHide: { type: action, component: Button, role: button, intent: secondary, name: { key: KoskCourses.hideLabel, params: { name: course.title } }, text: { key: KoskCourses.hide }, in: [], source: apps/nizam/features/kosks/overview-present.ts:96 } # never drawn: a hidden course has "Geri al" only, no "Gizle" (kosk-view.e2e.ts#8: `toHaveCount(0)`)
  restoreButton: { type: action, component: Button, role: button, intent: secondary, name: { key: KoskCourses.restoreLabel, params: { name: course.title } }, text: { key: KoskCourses.restore }, in: [listed, listedHidden], when: "held in ['restorable', 'both'] and tab in ['all', 'hidden']", repeat: courses.restorable, emits: RESTORE, source: apps/nizam/features/kosks/components/kosk-course-table.tsx:321 } # the only button of a hidden course the person's kademe reaches; it asks nothing first (kosk-view.e2e.ts#8, #9). The pressed one is rowRestore
  rowRestore: { type: action, component: Button, role: button, intent: secondary, name: { key: KoskCourses.restoreLabel, params: { name: course.title } }, text: { key: KoskCourses.restore }, in: [restoring], disabledIn: [restoring], source: apps/nizam/features/kosks/components/kosk-course-table.tsx:326 } # the first item of restoreButton: busy (aria-disabled, aria-busy) while the call runs; the other rows' buttons stay live
  restoreBusy: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [restoring], source: libs/ui/src/mds/button.tsx:114 } # the visually hidden <output> beside the busy button; "Yükleniyor" is the kit's default (F-UI-W1-3)
  lockedNote: { type: text, component: Text, text: { key: HideLevel.locked, params: { level: course.hiddenLevel } }, in: [listed, listedHidden, restoring], when: "held in ['locked', 'both'] and tab in ['all', 'hidden']", repeat: courses.locked, source: apps/nizam/features/kosks/components/kosk-course-table.tsx:259 } # where the API says the person may not bring the course back (canRestore false: Medaris yönetimi hid it and the person is the köşk's nazımı): this sentence in the place of every button. The başnazım never meets it

  # ---- "Dersi gizle": an AlertDialog opened by the table's own state (no trigger) ---------------------------------------------------
  # While the hide runs, "Vazgeç" and the close icon are not disabled in the DOM and a press does nothing (the window ignores every way of
  # closing, NCL-1): `hiding` takes the press and stays.
  hideDialog: { type: page, component: Page, role: alertdialog, name: { labelledBy: hideTitle }, in: [confirmHide, hiding], initialFocus: hideCancel, source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:60 } # Base UI AlertDialog: modal, never closed by the scrim, the page behind is inert; described by its two paragraphs
  hideEyebrow: { type: text, component: Text, text: { key: composed.HideCourseDialog.eyebrow, params: { title: course.title } }, in: [confirmHide, hiding], source: libs/ui/src/mds/alert-dialog.tsx:76 } # the course's title above the window's title (kosk-view.e2e.ts#9 reads it in the alertdialog)
  hideTitle: { type: text, component: Heading, role: heading, text: { key: HideCourseDialog.title }, in: [confirmHide, hiding], source: libs/ui/src/mds/alert-dialog.tsx:80 } # Base UI's Title, an h2
  hideBody: { type: text, component: Text, text: { key: HideCourseDialog.body, params: { name: course.title } }, in: [confirmHide, hiding], source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:73 } # who loses the course; it says nothing of the talebe enrolled or of their calendar, which nazar's window says (NCL-2)
  hideWay: { type: text, component: Text, text: { key: HideCourseDialog.way }, in: [confirmHide, hiding], source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:74 } # "Hiçbir şey silinmez; Arşiv’den geri alabilirsiniz."
  hideClose: { type: action, component: Button, role: button, intent: dismiss, name: { key: HideCourseDialog.close }, in: [confirmHide, hiding], emits: CLOSE, source: libs/ui/src/mds/alert-dialog.tsx:88 } # an icon only, named by its aria-label; closing is ignored while the call runs (NCL-1)
  hideCancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: HideCourseDialog.cancel }, in: [confirmHide, hiding], emits: CANCEL, source: libs/ui/src/mds/alert-dialog.tsx:102 } # the focus starts here; it stays live while the call runs and does nothing (NCL-1)
  hideConfirm: { type: action, component: Button, role: button, intent: confirm, text: { key: HideCourseDialog.confirm }, in: [confirmHide, hiding], disabledIn: [hiding], emits: CONFIRM_HIDE, source: libs/ui/src/mds/alert-dialog.tsx:109 } # a primary button, not a destructive one: nothing is deleted; busy (aria-disabled, aria-busy) while the call runs
  hideBusy: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [hiding], source: libs/ui/src/mds/button.tsx:114 } # the visually hidden <output> beside the busy button (F-UI-W1-3)

  # ---- the toasts: sonner's <li data-sonner-toast>, which has no role, in a region the app's own locale never names (F-X-5). A title and a description each; a close button "Kapat" ----
  toastHidden: { type: status, component: Status, text: { key: HideCourseDialog.hidden }, in: [listedHidden], when: "toast == 'hidden'", source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:52 } # success: it closes by itself after 6 seconds; the only word that it worked, and the row and the numbers change (kosk-view.e2e.ts#9)
  toastHiddenBody: { type: status, component: Status, text: { key: HideCourseDialog.hiddenBody, params: { name: course.title } }, in: [listedHidden], when: "toast == 'hidden'", source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:53 }
  toastHideFailed: { type: status, component: Status, text: { key: HideCourseDialog.failed }, in: [confirmHide], when: "toast == 'hideFailed'", source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:46 } # an error toast over the window, which stays open (F-X-4); the toast stays until it is closed
  toastHideFailedBody: { type: status, component: Status, text: { key: HideCourseDialog.failedBody }, in: [confirmHide], when: "toast == 'hideFailed'", source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:47 }
  toastRestored: { type: status, component: Status, text: { key: KoskCourses.restored }, in: [listed], when: "toast == 'restored'", source: apps/nizam/features/kosks/components/kosk-course-table.tsx:101 } # success, 6 seconds (kosk-view.e2e.ts#9)
  toastRestoredBody: { type: status, component: Status, text: { key: KoskCourses.restoredBody, params: { name: course.title } }, in: [listed], when: "toast == 'restored'", source: apps/nizam/features/kosks/components/kosk-course-table.tsx:102 }
