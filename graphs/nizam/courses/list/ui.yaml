rules:
  - { id: NCL-4, rule: "A Medaris nazımı who holds platform.kosk_edit is let into a köşk's Dersler, where every own course row draws 'Düzenle: {name}' (kosk-course-table.tsx:275; rowActions, overview-present.ts:95-100, has no ability check). The curriculum page refuses them (readCourseScope and mayEditCourse, kosk-abilities.ts:70-80, courses/reads.ts:36-60), so the link ends on 'Bu bölüm için izniniz yok'. Same family as KOVERVIEW-5 (the title link) and F-W4-hocalar-3. Read from the code, not run (audit lane C, nav link-refused). Fix: draw a row's actions by what the reader may do." }
  - { id: F-W4-6, rule: "After a hide the pressed 'Gizle' is replaced by 'Geri al' (its key changes, kosk-course-table.tsx:267-336) and the window closes on a button that is gone; after a restore the pressed 'Geri al' is replaced; in a tab the row leaves the tab. No code moves the focus (hide-course-dialog.tsx:36-57, kosk-course-table.tsx:82-105) and the only word is a toast of 6 seconds, so a keyboard or screen-reader user falls back to the top of the page. Not measured here. Fix: move the focus to the next row's first button or to the table's caption, and keep a status line." }
  - { id: F-W4-21, rule: "'Dersi gör' of a medrese's course and 'Köşk sayfasını gör' are drawn only where the app knows tedris's address (kosk-course-table.tsx:253,296-306, kosk-courses-view.tsx:101): without TEDRIS_URL a medrese's course offers only 'Gizle' and no way to open it. The local stack sets it. Fix: say so, or show the row as plain text." }
  - { id: F-X-4, rule: "A refused hide leaves the window open and tells it by an error toast only (hide-course-dialog.tsx:42-50): the window itself says nothing, the toast is in another portal and stays until closed. A refused restore is a toast too (kosk-course-table.tsx:90-96), with no Alert on the page. Not verified whether the toast region is announced. Fix: show an Alert in the window." }
  - { id: F-X-5, rule: "Two toast hosts are mounted (client-providers.tsx:42-53); sonner's has the default label 'Notifications alt+T', English, because the app passes only the close label (libs/ui/src/components/sonner.tsx:55-78). Not verified in a browser." }
  - { id: F-X-10, rule: "Reading Dersler shows loading.tsx: a <div aria-busy=true> whose children are aria-hidden skeletons, so a screen reader hears nothing while the roster is read (app/kosks/[id]/dersler/loading.tsx:6). The graph's `reading` has no screen." }
  - { id: F-W4-17, rule: "The document's <title> is 'Dersler' for every köşk (dersler/page.tsx:16-19) and the h1 is the same word; the köşk's name is only in the paragraph under it. Fix: put the köşk's name in the title." }
  - { id: F-UI-W1-3, rule: "The busy 'Gizle' and 'Geri al' pass no loadingLabel, so their hidden status says 'Yükleniyor' from the kit's hard-coded default (button.tsx:62), outside the catalog; Turkish only today." }
  - { id: NCL-1, rule: "New finding, from the code; not seen in a browser. While 'Gizle' is busy the window ignores every way of closing it (onOpenChange does nothing while `saving`, hide-course-dialog.tsx:62-64), but 'Vazgeç' and the close icon stay enabled and a press does nothing; only 'Gizle' is marked busy. Fix: mark 'Vazgeç' and the close icon disabled for the length of the call." }
  - { id: NCL-2, rule: "New finding, from the code. The window 'Dersi gizle' of nizam says only that the course is hidden from talebe and visitors and leaves every list (HideCourseDialog.body); the same API call, made from nazar-web's Dersler, asks with a window that also says the celses leave the talebe's calendar and how many talebe lose access (nazar.json HideCourse.rest, HideCourse.affected). The köşk's nazımı hides a course with talebe enrolled without being told how many. Fix: read the course's enrolment (the row already has studentCount) and say it in the window." }
  - { id: NCL-3, rule: "New finding, from the code; the same defect as nazar's F-A-12. A tab's content is its label followed by an inline count <span> with no whitespace (libs/ui/src/mds/tabs.tsx:111-112), so the accessible name reads 'Tümü5' and 'Gizli2'. The e2e reads it with a regular expression (kosk-view.e2e.ts#7, `^Gizli`). Fix: a visually hidden space, or the count in an aria-label." }
  - { id: focus-not-set, rule: "Dersler sets no focus on load or after a tab change, so the page nodes carry no initialFocus and no focus; the replay checks only the window's, on Vazgeç." }
  - { id: confirm-before-hiding, rule: "'Gizle' asks first, in an alertdialog whose focus starts on 'Vazgeç' and which says who loses the course and that nothing is deleted; 'Geri al' asks nothing, because a restore gives access back and deletes nothing." }
  - { id: label-in-name, rule: "Every row button's name begins with its visible word and ends with the course's title ('Gizle: {name}', 'Geri al: {name}', 'Düzenle: {name}', 'Hocaları düzenle: {name}', 'Dersi gör: {name}'), so WCAG 2.5.3 holds and the rows can be told apart. The tab names contain their visible text. Holds." }
  - { id: toast-is-the-only-word, rule: "The result of a hide and of a restore is said by a toast: it closes after 6 seconds for a success and stays for an error. Nothing on the page itself says what was done, but the row, its status and the tab numbers change." }
