# nizam.courses.list on the local stack: the köşk nazımı (KOSK_NAZIM) of a köşk of the walk's own, at http://localhost:4001.
#   flock <scratchpad>/replay.lock nice -n 10 node /home/taha/delurio-wt/medaris-engine/apps/engine/src/cli.ts replay graphs/nizam/courses/list \
#     --bind graphs/nizam/courses/list/binding.yaml --cover transitions --out <dir>
#
# NOT RUN: written without a replay (the owner's word). Every behaviour and locator is from the code; none was seen in a browser.
#
# The data and how it is taken away. `setup` makes, as the başnazım through tedrisat's HTTP API (./data.mjs and helpers/course.mjs), the köşk
# "Deneme köşkü ncl" with KOSK_NAZIM as its only nazım, the medrese "Deneme medresesi nclm" (APPLICANT_D, a spare talebe account, as its
# başmüderris) with a hosting right in it, and five courses, so the tab numbers are exact and no seeded course or köşk is touched:
#   nclLock   the köşk's own, hidden by the başnazım (Medaris yönetimi): the nazım sees the sentence and no button, Gizli
#   nclHid    the köşk's own, hidden by the nazım: "Geri al", Gizli
#   nclDraft  the köşk's own, a draft: Taslak
#   nclMed    a course the medrese opened in the köşk, published: "Dersi gör" and "Gizle", Yayında
#   nclOwn    the köşk's own, published, asking for approval, with one application waiting (APPLICANT_E): "1 onay bekliyor". The walk hides it and
#             brings it back. It is made last, so that it is the newest row (the page lists newest first) and its buttons are the first ones
# Tümü 5, Yayında 2, Taslak 1, Gizli 2; the cards say 1 waiting application (0 while nclOwn is hidden), 1 hosting medrese and 1 nazım. The
# page's order is the order of creation, newest first, not the order of hiding.
# `teardown` removes the courses (the talebe leave, the course is deleted as the başnazım, its mails and notifications go), then the medrese
# and the köşk (which takes its role assignments and anything left in it), and ends with checks that nothing is left. Every command is safe to
# run twice, and `setup` removes what a walk that died left (a tag made again removes the old one first). What it cannot undo: the audit rows
# (kosk.create, madrasah.create, hosting_right.grant, course.create, course.hide, course.restore, the deletes) and the lookup rows.
#
# The walk opens the köşk's own address, /kosks/<id>, and a köşk nazımı is sent on to Dersler (kosk-view.e2e.ts#6). `--cover transitions`
# walks this file's story (the tabs, the window cancelled and confirmed, the restore) and, through the events of locators.binding.yaml, every
# other transition this data can drive: the cards' and the row's links leave the page (each an exit with its address). The refusals of a hide
# and a restore have a file each: binding.staleHide, binding.staleRestore, binding.restoreGone and binding.parentHidden.
schema: delurio-graph/0
kind: binding
extends: ./locators.binding.yaml
flow: nizam.courses.list

data:
  ncl: { json: ../.local/made/ncl.json }
  nclm: { json: ../.local/made/nclm.json }
  nclOwn: { json: ../.local/made/nclOwn.json }
  nclDraft: { json: ../.local/made/nclDraft.json }
  nclMed: { json: ../.local/made/nclMed.json }
  nclHid: { json: ../.local/made/nclHid.json }
  nclLock: { json: ../.local/made/nclLock.json }

scenarios:
  hides:
    given: { courses: some, held: both }
    as: koskNazim
    open: '{nizam}/kosks/{ncl.kosk}'
    setup:
      - run: [node, helpers/make-kosk.mjs, make, ncl, KOSK_NAZIM]
        expect: '"tag":"ncl"'
      - run: [node, helpers/make-medrese.mjs, make, nclm, --kosk, ncl, --head, APPLICANT_D]
        expect: '"tag":"nclm"'
      - run: [node, helpers/course.mjs, make, nclLock, --kosk, '{ncl.kosk}', --weeks, '1', --lessons, '1']
        expect: '"title":"Deneme dersi nclLock"'
      - run: [node, helpers/course.mjs, make, nclHid, --kosk, '{ncl.kosk}', --weeks, '1', --lessons, '1']
        expect: '"title":"Deneme dersi nclHid"'
      - run: [node, helpers/course.mjs, make, nclDraft, --kosk, '{ncl.kosk}', --draft, --weeks, '1', --lessons, '1']
        expect: '"title":"Deneme dersi nclDraft"'
      - run: [node, helpers/course.mjs, make, nclMed, --madrasah, '{nclm.madrasah}', --kosk, '{ncl.kosk}', --weeks, '1', --lessons, '1']
        expect: '"title":"Deneme dersi nclMed"'
      - run: [node, helpers/course.mjs, make, nclOwn, --kosk, '{ncl.kosk}', --approval, --weeks, '1', --lessons, '1', --talebe, applicantE]
        expect: '"APPLICANT_E":"PENDING"'
      - run: [node, ../nizam/courses/list/data.mjs, hide-course, --as, systemAdmin, --tag, nclLock]
        expect: 'hide-course nclLock by SYSTEM_ADMIN'
      - run: [node, ../nizam/courses/list/data.mjs, hide-course, --as, koskNazim, --tag, nclHid]
        expect: 'hide-course nclHid by KOSK_NAZIM'
    teardown:
      - run: [node, helpers/course.mjs, remove, nclOwn]
        expect: 'course remove nclOwn'
      - run: [node, helpers/course.mjs, remove, nclMed]
        expect: 'course remove nclMed'
      - run: [node, helpers/course.mjs, remove, nclDraft]
        expect: 'course remove nclDraft'
      - run: [node, helpers/course.mjs, remove, nclHid]
        expect: 'course remove nclHid'
      - run: [node, helpers/course.mjs, remove, nclLock]
        expect: 'course remove nclLock'
      - run: [node, helpers/make-medrese.mjs, remove, nclm]
        expect: 'remove-medrese nclm'
      - run: [node, helpers/make-kosk.mjs, remove, ncl]
        expect: 'kosk remove ncl'
      - run: [node, helpers/sql.mjs, "select count(*)::int as n from courses where title like 'Deneme dersi ncl%'"]
        expect: '"n":0'
      - run: [node, helpers/sql.mjs, "select (select count(*) from kosks where name like 'Deneme köşkü ncl%') + (select count(*) from madrasahs where name like 'Deneme medresesi ncl%') as n"]
        expect: '"n":0'

# kosk-view.e2e.ts#7: the tab numbers are the database's. It runs once, after the first read (the walk reads the roster again after each write).
effects:
  getKoskCourseRoster:
    - run: [node, helpers/sql.mjs, "select count(*)::int as total, (count(*) filter (where archived_at is null and status = 'PUBLISHED'))::int as published, (count(*) filter (where archived_at is null and status = 'DRAFT'))::int as draft, (count(*) filter (where archived_at is not null))::int as hidden from courses where kosk_id = '{ncl.kosk}'"]
      expect: '"total":5,"published":2,"draft":1,"hidden":2'
    - run: [node, helpers/api.mjs, koskNazim, GET, '/kosks/{ncl.kosk}/course-roster']
      expect: '"counts":{"all":5,"published":2,"draft":1,"hidden":2}'
