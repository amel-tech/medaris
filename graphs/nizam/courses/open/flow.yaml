# Opening a course of a köşk: the köşk nazımı's "Ders aç" page in nizam-web (/kosks/<id>/courses/new), read from the code of PR #394's
# branch on 16 Nov 2026 (apps/nizam/app/kosks/[id]/courses/new/page.tsx, features/courses/components/course-create-form.tsx and
# team-picker.tsx; features/courses/present.ts holds the rules). Three links lead here: "Ders aç" on Dersler (the story's start), "Ders aç"
# on the köşk's home, and "Kabul et" on Ders talepleri, which adds `?talep=<id>` (nizam.courseRequests.decide starts this flow with
# fromRequest: true). The sibling of nazar.courses.open, which opens a course of a medrese in a köşk that hosts it; this one opens the
# köşk's own course and, unlike that one, also plans its celses in the same press.
#
# What the page does today, and where it is wrong for its people (each finding is in ui.yaml `rules`):
#   - "Dersi aç" is never off for what is missing (only while a hoca search runs, below): a press with something missing writes what under each field and sends nothing. It moves no focus, two of the
#     four messages are plain text and are not announced, and the other two are role=alert (F-W4-15, F-X-2). The stars of the required
#     fields are drawn and exposed to no one (F-W4-open-1), and the weekday group's name carries a real "*" (F-W4-19).
#   - the hoca is found by exact e-mail address, on Enter and also when the field is left; every lookup is audited; the field is disabled while
#     it searches (F-W4-20, F-X-14, F-W2-3), and "Çıkar" takes a hoca off with no question while the picker's hidden status goes on saying
#     "<name> seçildi" (F-W4-open-5).
#   - one press is three calls in a row: the course, then, from a request, the request's answer, then the celses. The celses can be refused after
#     the course exists (a pattern of more than 200 celses, which the form counts without a word); the person is then moved to Celse planla
#     with a toast that does not say why, and the pattern they typed is gone (F-W4-open-2, F-W4-open-4). A request answered elsewhere meanwhile is
#     told with the words "talep artık beklemiyor", which any failure of that call gets (F-W4-open-3).
#   - a `?talep` the page cannot find (answered meanwhile, or unreadable) opens a blank form and says nothing (F-W4-open-6).
#
# Fixed on 23 Nov 2026 (three races with a call on its way, from the 22 Nov rewrite of this graph): "Dersi aç" is off while a hoca search
# runs, so the course is no longer made without the hoca being looked up; a hoca taken off while the second search runs stays off when the
# search finds someone (the picker changes the list as it then is); and while the three calls of "Dersi aç" run, the breadcrumb's "Dersler"
# is plain text and the page says the course is being opened, so the press can no longer be left half done. Tests:
# apps/nizam/test/course-create-in-flight.spec.tsx.
schema: delurio-graph/0
kind: flow
id: nizam.courses.open
status: captured
domain: medaris.api
ui: nizam.courses.open
title: Open a course of the köşk
summary: >-
  The köşk nazımı opens a course. The form asks for a name, hocalar found one by one by exact e-mail address (a lone hoca is the imam;
  with two the first is, until the other is chosen; each may carry an unvan), a weekly schedule (start date, length in weeks, the days, the
  hour, the length of a celse, the time zone) whose live summary counts the celses, a cover, and the options: closed, needs approval
  (fixed on by a köşk policy), celses in person, and draft or published. Pressed with something missing it names what under each
  field and sends nothing. Otherwise it makes the course, accepts the request it was opened from (if any) and plans the celses, and goes to
  Dersler with a toast. A refused course keeps the form open with a toast; celses refused after the course was made move the person to
  Celse planla.

scope:
  shows: >-
    the page's reads and what they decide, the form with its four missing-field messages, the hoca search with its outcomes, the list of
    hocas with the imam, the schedule with its live summary, the options and the köşk policy that fixes approval, the three calls one press
    makes in turn and the toast each refusal gets, and the two pages the press can end on (Dersler, Celse planla)
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "the Dersler list's own tabs, filters and row actions: nizam.courses.list; the Celse planla form the person lands on after a refused plan: nizam.courses.planSessions"
    - "the Ders talepleri page that hands the request over, and its refusal of a request: nizam.courseRequests.decide"
    - "a list of three or more hocas, where taking the imam off leaves 'Birden çok hoca var; dersin imamını işaretleyin.' (role=alert) under the list (team-picker.tsx:261; only one or two hocas are drawn: `team`)"
    - "the schedule's other three messages ('Süre 1 ile 52 hafta arasında olmalı.', 'Başlangıç saatini girin.', 'Celse süresi 1 ile 1440 dakika arasında olmalı.'): the defaults (8 weeks, 21:00, 60 minutes) are valid and no walk empties them; they are written under their field in the same way as the date's (present.ts:95)"
    - "the answers the form blocks first: MUDERRIS_LIST_INVALID, MUDERRIS_DUPLICATE_USER and COURSE_IMAM_NOT_LISTED cannot come from this page (a hoca is listed once, with an account, and the imam is one of them)"
    - "an ended session: the lookup, the course, the request's answer and the celses each send the person to sign in (realm.auth.signIn) instead of drawing an error"
    - "the cover colour, the cover caption and the time zone, and the state of the three boxes: they change what is sent, not what the flow does; the stored row is read by the effect `createCourse` (the boxes are checked there only weakly: the walk's path decides them)"
    - "a hoca's unvan once chosen: the select's value changes and is not drawn (`CHOOSE_UNVAN`)"
    - "the köşk's home and the Dersler list, where 'Ders aç' is offered; and the sidebar: nizam.home.koskNazimLanding, nizam.shell.menuPerPersona"

decisions:
  D1:
    question: >-
      What should the person be told when the celses are refused after the course was made? Today the toast says only that the celses could
      not be added, though the refusal has a reason the form already has words for (INVALID_SESSION_PATTERN), and the pattern the person
      typed is dropped: Celse planla opens empty.
    recommend: >-
      Say the reason (the catalog has errors.api.invalidPattern), and either hand the typed pattern to Celse planla or send the person
      to Dersler with the course shown as having no celses. The smaller change is the wording.
    affects: [planning, session_planner]
  D2:
    question: >-
      Should the form stop a schedule that tedrisat is sure to refuse? The length goes to 52 weeks and any number of days, but a batch is at
      most 200 celses and the summary counts 208 as calmly as 8.
    recommend: >-
      Warn in the summary when the count is over 200 and keep "Dersi aç" from making a course whose celses cannot be made.
    affects: [form]

context:
  fromRequest:
    values: [true, false]
    initial: any
    say:
      "true": "the form was opened from a course request ('Kabul et' on Ders talepleri adds ?talep=<id>)"
      "false": "the form was opened from Dersler or the köşk's home"
  access:
    values: [open, refused, missing, unreadable]
    initial: any
    say:
      open: "the caller manages the köşk (or is the başnazım): the form is drawn"
      refused: "the caller is a nazım of another scope or of Medaris and does not manage this köşk: the 'Bu bölüm için izniniz yok' screen, HTTP 403"
      missing: "there is no such köşk (or the read of it failed while the caller's roles were read): the same screen, HTTP 404"
      unreadable: "both reads failed (the API does not answer): the page says the course information could not be read"
  request:
    values: [accepted, left, gone]
    initial: any
    say:
      accepted: "the request is waiting when the page reads it, and still when the course exists: the form opens with its name and it is accepted with the course"
      left: "the request is waiting when the page reads it and has been answered by someone else when the course exists"
      gone: "the page finds no waiting request with that id (answered, no such id, or the read failed): the form opens blank and nothing is accepted"
  lookup:
    values: [found, notFound, down]
    initial: any
    say: { found: "the realm has an account with the address typed", notFound: "the realm has none", down: "the directory does not answer" }
  policy:
    values: [free, locked]
    initial: any
    say:
      free: "the köşk has no policy on approval: 'Kayıt onayı gereksin' is a choice"
      locked: "the köşk's policy 'her kayıt onaylı' is on: the box is drawn checked and off limits, with a sentence that says so"
  answer:
    values: [created, forbidden, unknownUser, failed, sessionsFailed]
    initial: any
    say:
      created: "the server makes the course and then its celses"
      forbidden: "the caller no longer holds the right to open courses in the köşk"
      unknownUser: "a chosen hoca's account is in neither Medaris nor the realm any more"
      failed: "anything else: the directory is down, the body is refused, a naming-oneself refusal, the server does not answer (all worded 'İşlem tamamlanamadı')"
      sessionsFailed: "the course is made and the celses are refused (a pattern of more than 200 celses, INVALID_SESSION_PATTERN)"
  titled: { values: [true, false], initial: false } # the name field holds 2 or more characters once trimmed
  team:
    values: [none, a, abImamA, abImamB, b]
    initial: none
    say:
      none: "no hoca is on the list"
      a: "the first person found is on the list, alone, and is the imam"
      abImamA: "two people are on the list, the first found is the imam"
      abImamB: "two people are on the list and the second found is the imam"
      b: "only the second person found is left (the first was taken off), and is the imam"
  dated: { values: [true, false], initial: false } # the start date is filled
  daysSet: { values: [true, false], initial: false } # at least one weekday chip is pressed
  attempted: { values: [true, false], initial: false } # "Dersi aç" was pressed with something missing: the messages are live from then on
  last:
    values: [none, addedA, addedB, notFound, down, listed]
    initial: none
    say: { none: "no search yet, or one is running", addedA: "the first person was added", addedB: "the second person was added", notFound: "no account with that address", down: "the directory did not answer", listed: "the person is on the list already" }
  toast: { values: [none, forbidden, unknownUser, failed], initial: none } # which refusal's toast is up (it stays until closed)
  visibility: { values: [draft, publish], initial: draft } # 'Taslak olarak aç' or 'Hemen yayımla'

guards:
  # `hasProblem` of course-create-form.tsx:119 over what the graph draws: the name, the hocas, the start date and the days (the other three
  # schedule fields keep their valid defaults)
  problems: "not titled or team == 'none' or not dated or not daysSet"
  scheduled: "dated and daysSet"
  titleWrong: "attempted and not titled"
  teamWrong: "attempted and team == 'none'"
  dateWrong: "attempted and not dated"
  daysWrong: "attempted and not daysSet"
  # `request` of course-create-form.tsx:167: the page found the request
  requested: "fromRequest and request != 'gone'"
  locked: "policy == 'locked'"
  courseMade: "answer == 'created' or answer == 'sessionsFailed'"
  both: "team == 'abImamA' or team == 'abImamB'"
  # the searches the graph draws: a person found twice is listed, a third is not drawn (`team`), and `b` alone is not searched again
  canSearch: "(lookup == 'found' and team != 'b') or lookup == 'notFound' or lookup == 'down'"
  searchError: "last == 'notFound' or last == 'down' or last == 'listed'"

effects:
  prefilled: { set: { titled: true } }
  typedTitle: { set: { titled: true } }
  dateSet: { set: { dated: true } }
  dayPicked: { set: { daysSet: true } }
  attempt: { set: { attempted: true } }
  clearNote: { set: { last: none } }
  addedFirst: { set: { team: a, last: addedA } }
  addedSecond: { set: { team: abImamA, last: addedB } }
  addedSecondAlone: { set: { team: b, last: addedB } }
  noteNotFound: { set: { last: notFound } }
  noteDown: { set: { last: down } }
  noteListed: { set: { last: listed } }
  removedAAlone: { set: { team: none } }
  removedAOfTwo: { set: { team: b } }
  removedBOfTwo: { set: { team: a } }
  removedBAlone: { set: { team: none } }
  imamIsB: { set: { team: abImamB } }
  publishChosen: { set: { visibility: publish } }
  draftChosen: { set: { visibility: draft } }
  forbiddenToast: { set: { toast: forbidden } }
  unknownUserToast: { set: { toast: unknownUser } }
  failedToast: { set: { toast: failed } }

failures:
  reading:
    from: getKosk
    missing: [KOSK_NOT_FOUND]
    unreadable: []
  looking:
    from: lookupUser
    unavailable: [KEYCLOAK_ADMIN_UNAVAILABLE, KEYCLOAK_ADMIN_NOT_CONFIGURED, USER_LOOKUP_FORBIDDEN]
  opening:
    from: createCourse
    forbidden: [AUTHZ_FORBIDDEN]
    unknownUser: [MUDERRIS_UNKNOWN_USER]
    failed: [SELF_GRANT_REFUSED, KOSK_NOT_FOUND, VALIDATION_ERROR, KEYCLOAK_ADMIN_UNAVAILABLE]
  answering:
    from: acceptCourseRequest
    left: [COURSE_REQUEST_NOT_PENDING, COURSE_REQUEST_COURSE_TAKEN, COURSE_REQUEST_COURSE_NOT_FOUND, COURSE_REQUEST_NOT_FOUND, COURSE_REQUEST_FORBIDDEN]
  planning:
    from: createSessionBatch
    refused: [INVALID_SESSION_PATTERN, AUTHZ_FORBIDDEN, COURSE_NOT_FOUND, VALIDATION_ERROR]

# The story the page tells first, as the e2e tells it (courses#1 then #2): the nazım presses "Dersi aç" on the blank form and is told what is
# missing, names the course, finds one hoca by e-mail address, fills the date and a day, and opens the course; its celses are planned.
main:
  given: { fromRequest: false, access: open, request: accepted, lookup: found, policy: free, answer: created }
  events: [DONE, SUBMIT, FILL_IN, SEARCH, DONE, SET_DATE, PICK_DAY, SUBMIT, DONE, DONE]

initial: reading
states:
  reading:
    title: The köşk and the caller are read
    description: >-
      The server reads GET /kosks/:id and GET /me together behind loading.tsx (a skeleton that says nothing). Both failed: the page says the
      course information could not be read (`readFailed`). The köşk could not be read (any failure, a 404 included) while the caller's
      roles were: the "Bu bölüm için izniniz yok" screen with HTTP 404 (`not_found`). A caller who does not manage the köşk and is not the
      başnazım: the same screen with HTTP 403 (`no_access`); typed in by hand, since nothing links here for them. Otherwise the form is
      drawn; with `?talep=` the request is read first.
    invoke: { action: getKosk }
    on:
      DONE:
        - { guard: "access == 'refused'", target: no_access, source: "apps/nizam/app/kosks/[id]/courses/new/page.tsx:35", say: "the caller may not open courses in this köşk: forbidden()" }
        - { guard: "access == 'open' and fromRequest", target: readingRequest, source: "apps/nizam/app/kosks/[id]/courses/new/page.tsx:39", say: "the address carries ?talep=, so the köşk's waiting requests are read" }
        - { guard: "access == 'open'", target: form, source: "apps/nizam/app/kosks/[id]/courses/new/page.tsx:45", say: "the form opens blank" }
      FAIL.missing: { guard: "access == 'missing'", target: not_found, source: "apps/nizam/app/kosks/[id]/courses/new/page.tsx:34", say: "no köşk was read: notFound(), drawn as the same screen" }
      FAIL.unreadable: { guard: "access == 'unreadable'", target: readFailed, source: "apps/nizam/app/kosks/[id]/courses/new/page.tsx:33", say: "neither the köşk nor the caller could be read" }
    source: "apps/nizam/app/kosks/[id]/courses/new/page.tsx:32"

  readingRequest:
    title: The waiting requests of the köşk are read
    description: >-
      GET /kosks/:id/course-requests?status=PENDING (at most 100, oldest first). If the request of ?talep= is among them the form opens with its
      title as the course's name, and the course will answer it. If it is not (answered meanwhile, no such id, or the read failed) the page
      opens a blank form and says nothing (F-W4-open-6). No node is drawn in this step.
    invoke: { action: listCourseRequests }
    on:
      DONE:
        - { guard: "request == 'gone'", target: form, source: "apps/nizam/app/kosks/[id]/courses/new/page.tsx:40", say: "no waiting request has that id: the form is blank and answers nothing" }
        - { target: form, effect: [prefilled], source: "apps/nizam/app/kosks/[id]/courses/new/page.tsx:49", say: "the request is found: its title is the name field's first value" }
    source: "apps/nizam/app/kosks/[id]/courses/new/page.tsx:39"

  readFailed:
    title: The course information could not be read
    by: human
    description: >-
      The page's own error state: an error Alert, role=alert, titled "Ders bilgisi okunamadı", the sentence "Sunucu şu an yanıt vermiyor.
      Biraz sonra yeniden deneyin." and "Yeniden dene", which reads the page again (router.refresh). It is not worded as a refusal.
    on:
      RETRY: { target: reading, source: apps/nizam/features/kosks/components/load-failed.tsx:29, say: "they press 'Yeniden dene'" }
      NAVIGATE: { target: left, say: "they follow the menu" }
    source: apps/nizam/features/courses/components/course-load-failed.tsx:6

  form:
    title: The Ders aç form
    by: human
    goal: true
    description: >-
      The page: the header (breadcrumb, h1 "Ders aç", the sentence that the course is the köşk's own and a medrese opens its own, the note that
      * means required) and four parts, "Ders" (name, short description, cover colour and caption), "Hocalar" (the search and the list),
      "Zaman" (start date, length, days, hour, celse length, time zone, and the summary that counts the celses) and, beside them, "Ders
      ayarları" (the three boxes, draft or published, Vazgeç and "Dersi aç"). "Dersi aç" is never off for what is missing; it is off
      only while a hoca search runs (`looking`). Pressed with the name, the hocas, the
      start date or the days missing it sets `attempted` for good and writes what is missing under each (e2e courses#1): the name and
      the date as plain field errors, not announced (F-X-2), the hocas and the days as role=alert, and it moves no focus (F-W4-15); the
      messages go the moment the field is fixed. The stars are drawn and nothing exposes "required" (F-W4-open-1). The weekday chips are
      named "Pzt", "Sal"... (F-W4-open-8) and the group by "Haftalık celse günü *" (F-W4-19). The summary is an Alert, a polite live region: it
      is announced as the fields change (F-W4-13 does not hold here as worded). The hoca search runs on Enter and when the field is left
      (F-W4-20); a hoca found is added at once and the field is emptied. A köşk policy fixes "Kayıt onayı gereksin" on and says so under it.
      From a request, the name starts with the request's title. The graph draws one or two hocas; the page takes more.
    on:
      FILL_IN: { guard: "not titled", target: form, effect: [typedTitle], source: apps/nizam/features/courses/components/course-create-form.tsx:247, say: "they type a name of two or more characters (a name of one character says the same as none)" }
      SEARCH: { guard: canSearch, target: looking, effect: [clearNote], source: apps/nizam/features/courses/components/team-picker.tsx:128, say: "they type a hoca's e-mail address and press Enter, or leave the field" }
      SEARCH_ANOTHER: { guard: "team == 'a'", target: lookingAnother, effect: [clearNote], source: apps/nizam/features/courses/components/team-picker.tsx:128, say: "they search for a second hoca by another address" }
      REMOVE_A:
        - { guard: "team == 'a'", target: form, effect: [removedAAlone], source: apps/nizam/features/courses/components/team-picker.tsx:243, say: "they take the only hoca off: the list is empty again, nothing asks and the focus is not moved (F-W4-open-5)" }
        - { guard: "both", target: form, effect: [removedAOfTwo], source: apps/nizam/features/courses/components/team-picker.tsx:243, say: "they take the first of two off: the other is the imam" }
      REMOVE_B:
        - { guard: "both", target: form, effect: [removedBOfTwo], source: apps/nizam/features/courses/components/team-picker.tsx:243, say: "they take the second of two off: the first is the imam" }
        - { guard: "team == 'b'", target: form, effect: [removedBAlone], source: apps/nizam/features/courses/components/team-picker.tsx:243, say: "they take the last hoca off" }
      PICK_IMAM: { guard: "team == 'abImamA'", target: form, effect: [imamIsB], source: apps/nizam/features/courses/components/team-picker.tsx:202, say: "they choose the second hoca as the imam; choosing the first again is the same move the other way and is not drawn" }
      CHOOSE_UNVAN: { guard: "team != 'none'", target: form, source: apps/nizam/features/courses/components/team-picker.tsx:236, say: "they choose an unvan for a hoca (sent with that hoca; the select's value is not drawn)" }
      SET_DATE: { guard: "not dated", target: form, effect: [dateSet], source: apps/nizam/features/courses/components/course-create-form.tsx:345, say: "they fill the start date (and may change the length): the summary counts the celses once a day is chosen too" }
      PICK_DAY: { guard: "not daysSet", target: form, effect: [dayPicked], source: apps/nizam/features/courses/components/course-create-form.tsx:373, say: "they press a weekday chip: it is pressed (aria-pressed) and the summary counts the celses once the date is filled" }
      CHOOSE_LABEL: { target: form, source: apps/nizam/features/courses/components/course-create-form.tsx:295, say: "they choose a cover caption from the list" }
      TOGGLE_CLOSED: { target: form, source: apps/nizam/features/courses/components/course-create-form.tsx:469, say: "they check or uncheck 'Kapalı ders'" }
      TOGGLE_APPROVAL: { guard: "not locked", target: form, source: apps/nizam/features/courses/components/course-create-form.tsx:479, say: "they check or uncheck 'Kayıt onayı gereksin' (checked at first); off limits when the köşk's policy fixes it" }
      TOGGLE_IN_PERSON: { target: form, source: apps/nizam/features/courses/components/course-create-form.tsx:491, say: "they check or uncheck 'Celseler yüz yüze yapılır': every celse with no setting of its own is then in person" }
      CHOOSE_PUBLISH: { guard: "visibility == 'draft'", target: form, effect: [publishChosen], source: apps/nizam/features/courses/components/course-create-form.tsx:501, say: "they choose 'Hemen yayımla'" }
      CHOOSE_DRAFT: { guard: "visibility == 'publish'", target: form, effect: [draftChosen], source: apps/nizam/features/courses/components/course-create-form.tsx:501, say: "they choose 'Taslak olarak aç' again" }
      SUBMIT:
        - { guard: problems, target: form, effect: [attempt], source: apps/nizam/features/courses/components/course-create-form.tsx:131, say: "they press 'Dersi aç' with something missing: nothing is sent, the messages appear, the focus stays on the button" }
        - { target: opening, source: apps/nizam/features/courses/components/course-create-form.tsx:135, say: "they press 'Dersi aç' with a name, a hoca, a date and a day" }
      CANCEL: { target: courses_listed, source: apps/nizam/features/courses/components/course-create-form.tsx:527, say: "they press 'Vazgeç': Dersler opens, nothing is made, what was typed is dropped without a question" }
      BACK: { target: courses_listed, source: apps/nizam/features/courses/components/course-create-form.tsx:216, say: "they follow the breadcrumb's 'Dersler'" }
      NAVIGATE: { target: left, say: "they follow the menu" }
    source: apps/nizam/features/courses/components/course-create-form.tsx:207

  looking:
    title: Look the first hoca up
    description: >-
      The server action lookupUserByEmail, GET /users/lookup: the realm's directory is searched for the exact address (0 or 1 account; a
      person who never opened the app is found too) and tedrisat writes the search to the audit log, found or not. The field is disabled and
      aria-busy while it runs, so it loses the focus (F-W2-3); a hidden status says "Aranıyor…". A person already on the list is not added again:
      the same address typed twice says "Bu kişi zaten listede.", and the field is emptied. A person found is added at once and a hidden status
      says "<name> seçildi". "Bu e-posta adresiyle kayıtlı bir hesap bulunamadı." and "Arama şu an yapılamadı…" are the field's own error while
      nobody is listed (no live region) and a role=alert paragraph once somebody is (F-W2-3, F-X-2). "Dersi aç" is off while the search
      runs (the picker says when it starts and ends, apps/nizam/features/courses/components/team-picker.tsx:97-99; the button, apps/nizam/features/courses/components/course-create-form.tsx:534), so the course waits for the hoca
      being looked up and a press is not sent (apps/nizam/features/courses/components/course-create-form.tsx:129). A press that is itself what leaves the e-mail field starts the
      search and lands on the button already off: nothing is sent and nothing says why (not verified in a browser).
    invoke: { action: lookupUser }
    on:
      DONE:
        - { guard: "lookup == 'found' and team == 'none'", target: form, effect: [addedFirst], source: apps/nizam/features/courses/components/team-picker.tsx:114, say: "the person is added at once; a lone hoca is the imam" }
        - { guard: "lookup == 'found' and team != 'none'", target: form, effect: [noteListed], source: apps/nizam/features/courses/components/team-picker.tsx:106, say: "the same address again: 'Bu kişi zaten listede.' and nobody is added" }
        - { guard: "lookup == 'notFound'", target: form, effect: [noteNotFound], source: apps/nizam/features/courses/components/team-picker.tsx:121, say: "no account has that address: 'Bu e-posta adresiyle kayıtlı bir hesap bulunamadı.'" }
      FAIL.unavailable: { guard: "lookup == 'down'", target: form, effect: [noteDown], source: apps/nizam/features/courses/components/team-picker.tsx:123, say: "the directory is not reachable: 'Arama şu an yapılamadı. Biraz sonra yeniden deneyin.'" }
      CANCEL: { target: courses_listed, source: apps/nizam/features/courses/components/course-create-form.tsx:527, say: "they press 'Vazgeç' while the search runs; its answer is dropped" }
      BACK: { target: courses_listed, source: apps/nizam/features/courses/components/course-create-form.tsx:216, say: "they follow the breadcrumb while the search runs; its answer is dropped" }
    source: apps/nizam/features/courses/components/team-picker.tsx:92

  lookingAnother:
    title: Look the second hoca up
    description: >-
      The same search for another address while one hoca is listed. The first search found its person, so this one is drawn as found too
      (`lookup` is one answer for the whole walk): a failed second search says what a failed first one says and is not drawn again. A found
      person is added after the first; the first stays the imam until the other is chosen, and each row shows a radio, an unvan select and "Çıkar".
    invoke: { action: lookupUser }
    on:
      DONE:
        - { guard: "lookup == 'found' and team == 'none'", target: form, effect: [addedSecondAlone], source: apps/nizam/features/courses/components/team-picker.tsx:114, say: "the first hoca was taken off while the search ran: the second person is added alone and is the imam, and the first stays off" }
        - { guard: "lookup == 'found'", target: form, effect: [addedSecond], source: apps/nizam/features/courses/components/team-picker.tsx:114, say: "the second person is added: two rows, a radio each, the first the imam" }
      CANCEL: { target: courses_listed, source: apps/nizam/features/courses/components/course-create-form.tsx:527, say: "they press 'Vazgeç' while the search runs" }
      # The first hoca's "Çıkar" is live while the second search runs, and the row goes at once. The search adds its person to the list as it
      # is when the answer comes (a state setter's update, team-picker.tsx:114), so the hoca taken off meanwhile stays off.
      REMOVE_A: { guard: "team == 'a'", target: lookingAnother, effect: [removedAAlone], source: apps/nizam/features/courses/components/team-picker.tsx:243, say: "they take the first hoca off while the second search runs: the row goes, and the search already sent goes on" }
      BACK: { target: courses_listed, source: apps/nizam/features/courses/components/course-create-form.tsx:216, say: "they follow the breadcrumb while the search runs" }
    source: apps/nizam/features/courses/components/team-picker.tsx:92

  opening:
    title: Make the course
    description: >-
      The server action createKoskCourse, POST /kosks/:koskId/courses with the trimmed name, the short description, the cover, "closed",
      "needs approval" (sent as the box shows it, a policy's lock included), "in person", draft or published, the time zone and the hocas with
      their unvans and the imam; no weeks and no resources. The button is busy (aria-disabled, "Kaydediliyor…" for a screen reader) and every
      field is disabled; the busy state stays through the next two calls. While they run the breadcrumb's "Dersler" is plain text, no link
      (apps/nizam/features/courses/components/course-create-form.tsx:221), and a line above the buttons says "Ders açılıyor. Bitene kadar bu sayfadan ayrılmayın." (:517), so the
      press is not left half done by the page's own way out (the sidebar and the browser's Back are still there). A success goes on to the request (if any) and the celses. A refusal
      keeps the form, re-enables it and puts a sticky toast "Ders açılamadı" with the reason over it: nothing inside the form says the
      press failed (F-X-4). A naming-oneself refusal (SELF_GRANT_REFUSED) is worded as the generic one, which can never work (F-W4-open-7).
    invoke: { action: createCourse }
    on:
      DONE:
        - { guard: "courseMade and requested", target: answering, source: apps/nizam/features/courses/components/course-create-form.tsx:167, say: "the course exists and the form was opened from a request: the request is answered with it" }
        - { guard: courseMade, target: planning, source: apps/nizam/features/courses/components/course-create-form.tsx:178, say: "the course exists: its celses are made next" }
      FAIL.forbidden: { guard: "answer == 'forbidden'", target: form, effect: [forbiddenToast], source: apps/nizam/features/courses/components/course-create-form.tsx:155, say: "a toast says they may not do this; the form stays" }
      FAIL.unknownUser: { guard: "answer == 'unknownUser'", target: form, effect: [unknownUserToast], source: apps/nizam/features/courses/components/course-create-form.tsx:155, say: "a toast says one of the hocas has no account; the form stays" }
      FAIL.failed: { guard: "answer == 'failed'", target: form, effect: [failedToast], source: apps/nizam/features/courses/present.ts:1231, say: "a toast says the action could not be completed, try again; the form stays" }
    source: apps/nizam/features/courses/components/course-create-form.tsx:136

  answering:
    title: Answer the request with the course
    description: >-
      The server action acceptCourseRequest, POST /course-requests/:id/accept with the new course's id. The course exists already and stays
      whatever this answers. A failure of any kind (the request answered meanwhile, the course already answering another request, a refusal, the
      server) is worded the same way, as the request no longer waiting (F-W4-open-3): a sticky warning toast "Talep yanıtlanamadı", and the
      press goes on to the celses.
    invoke: { action: acceptCourseRequest }
    on:
      DONE: { guard: "request == 'accepted'", target: planning, source: apps/nizam/features/courses/components/course-create-form.tsx:168, say: "the request is ACCEPTED and points at the course" }
      FAIL.left: { guard: "request == 'left'", target: planning, source: apps/nizam/features/courses/components/course-create-form.tsx:171, say: "a warning toast says the course was opened but the request no longer waits; the celses are made all the same" }
    source: apps/nizam/features/courses/components/course-create-form.tsx:168

  planning:
    title: Make the celses
    description: >-
      The server action createCourseSessions, POST /courses/:courseId/sessions/batch with the weekly pattern (the days, the hour, the zone, the
      start date and an end date a whole number of weeks on), the name as each celse's title and its length. One transaction makes the weeks
      "Hafta N" and the celses. Refused, the course stays with no celse; the button is no longer busy and a sticky error toast "Ders açıldı,
      celseler eklenemedi" is put up, without the reason (F-W4-open-2), and the person is taken to Celse planla. A pattern of more than 200
      celses is refused by tedrisat though the form let it through (F-W4-open-4).
    invoke: { action: createSessionBatch }
    on:
      DONE: { guard: "answer == 'created'", target: opened, source: apps/nizam/features/courses/components/course-create-form.tsx:194, say: "the celses exist: a toast says so and Dersler opens" }
      FAIL.refused: { guard: "answer == 'sessionsFailed'", target: session_planner, starts: { flow: nizam.courses.planSessions, given: { fromOpen: "true" } }, source: apps/nizam/features/courses/components/course-create-form.tsx:185, say: "the celses are refused: a toast says so and the person goes to Celse planla of the new course" }
    source: apps/nizam/features/courses/components/course-create-form.tsx:178

  opened:
    type: final
    title: The course is open and Dersler is shown
    description: >-
      Dersler opens (client navigation, router.push) with the toast "Ders açıldı" ("<name> açıldı.") for 6 seconds, and the new course's row:
      the name as a link, its weeks, the hocas, and "Taslak" (or "Yayında" when published). After a request's answer that failed, the warning toast
      of `answering` is still up. The focus is not moved (it falls to the top of the page); the toast's close button says "Kapat" in every
      language (MDRS-233). The list is nizam.courses.list's page; only what proves this flow's result is drawn.

  session_planner:
    type: final
    title: The person is taken to Celse planla
    description: >-
      The course exists as a draft or published, with no celse, and the page is the course's Celse planla (nizam.courses.planSessions): its h1,
      with the sticky error toast "Ders açıldı, celseler eklenemedi" over it. The pattern the person typed is not carried there (F-W4-open-2).
      The warning toast of `answering` is still up if the request's answer failed.

  courses_listed:
    type: final
    title: The person goes back to Dersler and nothing is made
    leavesPage: true
    description: >-
      Vazgeç or the breadcrumb's "Dersler": the list opens and what was typed is dropped without a question.

  left:
    type: final
    title: The person leaves the page
    leavesPage: true

  no_access:
    type: final
    title: The "Bu bölüm için izniniz yok" screen, HTTP 403
    description: >-
      The caller is signed in and does not manage this köşk: forbidden() draws the screen of nizam.shell.noAccessAndNotFound, the same words as for
      a section they may not open and a köşk that is not there.

  not_found:
    type: final
    title: The "Bu bölüm için izniniz yok" screen, HTTP 404
    description: >-
      The köşk could not be read: notFound() draws the same screen as `no_access`, so which ids exist is not for the page to tell.

assertions:
  - { id: a-nothing-is-sent-with-a-problem, never: "state == 'opening' and problems", say: "A course is never sent with the name, the hocas, the start date or the days missing", source: apps/nizam/features/courses/components/course-create-form.tsx:131 }
  - { id: a-course-has-a-hoca, never: "state == 'opening' and team == 'none'", say: "A course is never sent without a hoca", source: apps/nizam/features/courses/components/course-create-form.tsx:131 }
  - { id: a-course-has-a-schedule, never: "state == 'opening' and (not dated or not daysSet)", say: "A course is never sent without the start date and a weekday", source: apps/nizam/features/courses/present.ts:117 }
  - { id: the-request-is-answered-after-its-course, never: "state == 'answering' and not requested", say: "A request is answered only by a form that was opened from one and found it, and only once its course exists", source: apps/nizam/features/courses/components/course-create-form.tsx:167 }
  - { id: the-celses-follow-a-made-course, never: "state == 'planning' and not courseMade", say: "The celses are made only for a course the server made", source: apps/nizam/features/courses/components/course-create-form.tsx:178 }
