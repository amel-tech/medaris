rules:
  - { id: focus-not-set, rule: "The page sets no initial focus (nothing in page.tsx or course-create-form.tsx does); a keyboard user who arrives from Dersler starts at the top of the page. After a refused press the focus stays on 'Dersi aç' (course-create-form.tsx:127-130), after the course is made the page goes to Dersler by client navigation (router.push, :194) and nothing moves the focus there either, and after a refused celse plan it goes to Celse planla the same way (:187)." }
  - { id: submit-is-never-off, rule: "'Dersi aç' is never disabled because of what is missing: a press writes the messages and sends nothing. A busy press is aria-disabled and aria-busy, not disabled, so the focus survives. This is the opposite of nizam.kosks.open's F-W3-1 and is right; what the press does with its answer is F-W4-15." }
  - { id: F-W4-13, rule: "Corrected for this page. The inventory says the summary's count changes with no live announcement; here the summary is an info Alert (libs/ui/src/mds/alert.tsx:23: role=status for every tone but error), a polite live region that is always in the page, so a change of its text is announced. The submit button's label does not change here (the 'N celse oluştur' label is Celse planla's). What is left is noise: every keystroke in the length or the date changes the whole sentence, and each change is read in full. Not heard in a screen reader." }
  - { id: F-W4-15, rule: "A refused press sets `sent` only (course-create-form.tsx:127-130): the focus stays on 'Dersi aç' and there is no summary. Of the four messages two are plain Field.Error text with no live region (the name, the start date: F-X-2, F-UI-W4-1) and two are role=alert paragraphs that are announced when they appear (the hocas, team-picker.tsx:264, and the days, course-create-form.tsx:374), so the same press is half heard. Fix: move the focus to the first field with a message, or give the Field error role=alert." }
  - { id: F-X-2, rule: "Field.Error has no role and no aria-live (libs/ui/src/mds/field.tsx:48-52, Base UI FieldError): the name's and the start date's messages ('Ders adı en az iki harften oluşmalı.', 'Başlangıç tarihini girin.') and, while nobody is listed, the hoca search's own outcomes appear silently. Same as F-UI-W4-1 and F-UI-W3-1." }
  - { id: F-W4-19, rule: "The weekday group is named 'Haftalık celse günü *': the star is real text in the legend (course-create-form.tsx:363) while the other required fields hide theirs (aria-hidden), so the name ends with a symbol and the group is not marked required. Fix: render the marker aria-hidden and mark the group required another way." }
  - { id: F-W4-20, rule: "The hoca's address is searched on Enter and also when the field is left (team-picker.tsx:115-121, 160), and tedrisat writes every lookup, found or not, to the audit log (the help line says so). Tabbing through the field with something address-like in it makes an audited lookup the person did not ask for and puts the person on the list. Same as F-X-14 and OPEN-5 of nazar. Fix: search on Enter or an explicit 'Ara' button only." }
  - { id: F-X-14, rule: "The family of F-W4-20: e-mail lookups that run on blur in the four pickers of nizam." }
  - { id: F-W2-3, rule: "The lookup has no button and the field is `disabled` while it searches (team-picker.tsx:147), so the focused field loses the focus and the person who pressed Enter must tab back for the next address; nothing says the search ended except the hidden status for a success, and 'not found' and 'failed' are a Field error with no live region while nobody is listed. Fix: a visible 'Ara' button, keep the input enabled with aria-busy, announce the result with role=status." }
  - { id: F-X-4, rule: "A refused or failed write is told only by a sticky sonner toast, in another portal (course-create-form.tsx:151, 182): 'Ders açılamadı' and 'Ders açıldı, celseler eklenemedi' say it, and nothing inside the form does. Fix: an Alert tone=error with role=alert in the form beside the button." }
  - { id: F-W4-17, rule: "<title> is 'Ders aç' with no köşk named (page.tsx:14-17); tabs and history entries of two köşks are the same (the family of F-X-16). Fix: put the köşk's name in the title." }
  - { id: F-W4-open-1, rule: "new: the stars are drawn and exposed to no one. Field's `required` only draws an aria-hidden '*' (libs/ui/src/mds/field.tsx:42-47; it is not passed to Base UI's Field.Root) and the form gives none of its inputs `required` (course-create-form.tsx:238, 333, 347, 385, 398; the form is noValidate), so 'Ders adı', 'Başlangıç tarihi', 'Süre (hafta)', 'Başlangıç saati', 'Celse süresi' and the hoca list are required to the eye and not to a screen reader. Fix: pass `required` to the inputs and mark the hoca list and the day group required with aria-required or a described note." }
  - { id: F-W4-open-2, rule: "new: when the celses are refused after the course was made, the toast 'Ders açıldı, celseler eklenemedi' (course-create-form.tsx:181-188) always says the same words; the reason is dropped, though the catalog has errors.api.invalidPattern for it ('Bu tekrar düzeni geçerli bir celse üretmiyor; tarihleri ve günleri gözden geçirin.'), and the pattern the person typed (the start date, the length, the days, the hour) is not passed on: Celse planla opens empty and the person types it again. The course stays with no celse, and the only record is a toast that stays until closed. Fix: say the reason and hand the pattern over (decision D1)." }
  - { id: F-W4-open-3, rule: "new: any failure of the request's answer (acceptCourseRequest) is worded 'talep artık beklemiyor; başka bir nazım yanıtlamış olabilir' (course-create-form.tsx:166-172): a server error, a refusal of the right and a request that already answers another course are all told as 'answered by another nazım', and the warning offers only 'Ders talepleri sayfasından bakabilirsiniz'. The course is made either way. Fix: word the cases apart, or say that the answer could not be sent and to look at Ders talepleri." }
  - { id: F-W4-open-4, rule: "new: the form lets a schedule through that tedrisat is sure to refuse. The length goes to 52 weeks and the days are free, so 52 weeks of four days is 208 celses, which patternDates counts and the summary announces as calmly as 8 ('208 celse planlanacak'), while a batch holds at most 200 (apps/tedrisat/src/course/domain/weekly-pattern.ts:16, 177). The course is then made first and the celses refused (F-W4-open-2). Fix: warn in the summary over 200 and keep the button from making a course whose celses cannot be made (decision D2)." }
  - { id: F-W4-open-5, rule: "new: 'Çıkar' takes a hoca off at once with no question, moves no focus (the pressed button leaves with its row), and the picker's hidden <output> keeps its last words, '<name> seçildi', after that person is gone (team-picker.tsx:102, 225, 270). The same shape as F-W3-open-3 of nizam.kosks.open and OPEN-3 of nazar.courses.open." }
  - { id: F-W4-open-6, rule: "new: a ?talep the page cannot find (the request was answered meanwhile by another nazım, the id is not one, or the read failed) opens a blank form and says nothing (page.tsx:39-43, course-create-form.tsx:75). The person who pressed 'Kabul et' on a request then opens a course that answers nothing, without a word about it, and the request stays on whatever status it has. Fix: say the request is no longer waiting and offer Ders talepleri." }
  - { id: F-W4-open-7, rule: "new: courseErrorKey (present.ts:1230-1251) has no case for SELF_GRANT_REFUSED, COURSE_IMAM_NOT_LISTED or KOSK_NOT_FOUND, so a naming-oneself refusal is worded 'İşlem tamamlanamadı. Biraz sonra yeniden deneyin.', which can never work. helpers/course.mjs says the köşk's nazım cannot also be a course's hoca; if that is this refusal, a nazım who finds their own address is told to try again later. From the code and that note, not seen in a browser." }
  - { id: F-W4-open-8, rule: "new: the weekday chips are named by their three-letter abbreviations, 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz' (course-create-form.tsx:370, weekdayName with style short); a screen reader reads 'Pzt' as letters and the group says nothing of which is pressed beyond aria-pressed. Fix: aria-label the chip with the long name ('Pazartesi'), as the summary below already writes it." }
  - { id: label-in-name, rule: "A visible text is contained in its accessible name (WCAG 2.5.3): 'Dersi aç' and 'Vazgeç' are their own names; 'Çıkar' is inside 'Hocayı listeden çıkar: <name>'; the köşk radios, the checkboxes and the hoca radios are named by their label only. Holds." }
