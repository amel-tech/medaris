# The screens of nizam.courses.open: "Ders aç" (/kosks/<id>/courses/new) under the nizam shell, read from
# apps/nizam/features/courses/components/{course-create-form,team-picker}.tsx and features/courses/present.ts on 16 Nov 2026; the words are
# copied from libs/i18n/src/locales/tr/nizam.json (namespaces CourseCreate, CourseTeamPicker, KoskCourses, SessionPlan, CourseLoad).
#
# The sidebar is nizam.shell.menuPerPersona's; the page here is the shell's <main>. The form is a page, not a dialog, so nothing is inert
# behind it and no focus is returned to an opener. Two hocas are drawn at most (the page takes more), and the names of those two people are
# written as literals: a catalog parameter has one sample per flow, and `name` is the course's in the toasts. "Hamdi Müderris" and "Esma
# Başvuran" are the local stack's müderris account and a spare talebe account, which the binding finds by e-mail address (the stack's
# invented names). "{name} dersin imamı olsun", "Hocayı listeden çıkar: {name}", "{name} için unvan" and "{name} seçildi" are
# CourseTeamPicker.imamRadio, removeLabel, unvanLabel and chosen with those names. The throwaway köşk's name is the sample `koskGenitive`
# ("Deneme nizam-courses-open Köşkü’nün", koskCase of apps/nizam/features/kosks/admin-present.ts:401). The count, the dates, the days and the
# length of the schedule summary are the samples of the main walk (two Mondays from 1 March 2027); the binding finds those nodes by shape, so
# that the walk with 208 celses reads the same nodes.
# `Changes.note` is the one catalog entry that is not copied from the app: nizam has no sentence that tells the person what "Dersi aç"
# changes, so one short, factual Turkish message was authored from what the code does.
