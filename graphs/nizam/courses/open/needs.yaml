schema: delurio-graph/0
kind: needs
id: nizam.courses.open
status: proposed
summary: >-
  What must exist for a köşk nazımı to open a course of the köşk: the flow's product list. Each need is what the product must do,
  from the flow's story and the findings of the page, not from what the page does today.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# Gaps of this file, for that merge:
# missing:   kontenjan-per-gender and gender-is-always-required (`missing: MDRS-284`: an in-person course has no seat count, and the form
# asks no gender of anyone); every-answer-is-announced, lookup-only-on-request, removing-a-hoca-is-said, the-refusal-is-said-in-the-form,
# the-required-fields-are-exposed, a-refused-celse-plan-is-explained-and-kept, a-schedule-the-server-refuses-is-said-before,
# a-request-answer-that-failed-is-told-truly, a-request-that-is-gone-is-said, naming-oneself-is-explained, the-days-have-names
# (each `missing: none`; F-W4-13..F-W4-20, F-X-2, F-X-4 and F-W4-open-1..8 of ui.yaml are their evidence)
# unwalked:  accept-a-request-by-opening-its-course, say-when-a-hoca-is-unknown-or-the-celses-fail and open-from-the-kosk-home-or-a-request
# (code, no e2e: no check opens a course from a request or sees a refused plan, and the replay scenarios `fromRequest`, `requestLeft`,
# `sessionsFailed` and `forbidden` have not been run); give-a-hoca-an-unvan (code, no e2e picks an unvan; the walk presses the
# select, and no effect says what was sent); the-kosk-can-fix-approval (code, no e2e: courses#1-#3 run on a köşk with no policy)

needs:
  - id: open-a-course-with-its-hocas-and-celses
    need: >-
      The köşk nazımı opens a course of the köşk's own in one step: its name, at least one hoca, and a weekly schedule from which
      its celses are made at once, each in its week. The course is a draft unless the nazım chooses to publish it, and Dersler
      lists it with its weeks and its status straight away. Who opened it and when is on record.
    evidence:
      - state: form
      - state: opening
      - state: planning
      - state: opened
      - node: createdToast
      - node: newRowTitle
      - node: newRowWeeks
      - node: newRowDraft
      - source: apps/tedrisat/src/course/course.controller.ts:188
      - source: apps/tedrisat/src/course/lesson.controller.ts:329
      - source: apps/nizam/features/courses/components/course-create-form.tsx:124
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 2–5: one müderris is the imam, the summary counts the sessions, a draft is opened with its sessions"
    note: >-
      Also drawn as the assertion a-nothing-is-sent-with-a-problem, the assertion a-course-has-a-hoca, the assertion
      a-course-has-a-schedule, the assertion the-celses-follow-a-made-course.

  - id: say-what-is-missing
    need: >-
      A press of "Dersi aç" that cannot be sent says, under each field, what is missing (the name, a hoca, the start date, a celse
      day), sends nothing and makes no course; the messages go the moment the field is fixed. The button is never dead.
    evidence:
      - state: form
      - node: nameError
      - node: teamEmpty
      - node: startDateError
      - node: daysError
      - node: submit
      - source: apps/nizam/features/courses/components/course-create-form.tsx:127
      - source: apps/nizam/features/courses/present.ts:95
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 1: a form with nothing in it sends nothing and names what is missing"

  - id: every-answer-is-announced
    need: >-
      Every answer the form gives is announced to a person who cannot see it and tied to the field it is about: the four
      missing-field messages, the outcomes of a hoca search (not found, directory down, already listed), the weekday group and the
      required marks. After a refused press the focus goes to the first field with a message.
    missing: no Linear issue; F-W4-13 (corrected), F-W4-15, F-W4-19, F-X-2, F-W2-3
    note: >-
      Drawn on the nodes nameError, startDateError, teamEmpty, daysError, hocaNotFound, hocaDown, hocaListed, daysGroup and
      summary, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only
      missing needs name).

  - id: the-required-fields-are-exposed
    need: >-
      A field that is required says so to assistive technology, not only to the eye: the name, the start date, the length, the
      hour, the length of a celse, the list of hocas and the group of days.
    missing: no Linear issue; F-W4-open-1
    note: >-
      Drawn on the nodes nameField, startDateField, weeksField, startTimeField, durationField, teamList, daysGroup and
      requiredNote, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only
      missing needs name).

  - id: find-hocas-by-exact-email
    need: >-
      Each hoca is found by the exact e-mail address of an account in the realm, even one that never opened the app; a person
      already listed is not added twice; an address with no account and a directory that does not answer are said in words.
    evidence:
      - state: looking
      - state: lookingAnother
      - node: hocaField
      - node: hocaNotFound
      - node: hocaDown
      - node: hocaListed
      - node: searching
      - source: apps/tedrisat/src/user/users.controller.ts:57
      - source: apps/nizam/features/courses/components/team-picker.tsx:80
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 2–5: one müderris is the imam, the summary counts the sessions, a draft is opened with its sessions"
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 4: 'Hemen yayımla' with a closed course and a cover caption opens it published"

  - id: lookup-only-on-request
    need: >-
      A person's address is searched in the realm only when the nazım asks (Enter or a button), never because they tabbed through
      the field, since every search is written to the audit log; the result is announced and the focus stays in the field.
    missing: no Linear issue; F-W4-20, F-X-14, F-W2-3
    note: >-
      Drawn on the state looking and on the node hocaField, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: choose-the-imam
    need: >-
      A lone hoca is the imam; with several the first is the imam until the nazım picks another, and the row of the imam says so.
      The list the API gets always names exactly one imam among its hocas.
    evidence:
      - node: teamList
      - node: imamRadioA
      - node: imamRadioB
      - node: imamBadge
      - node: soleNote
      - node: manyNote
      - node: removeA
      - node: removeB
      - state: opening
      - source: apps/tedrisat/src/course/course.controller.ts:188
      - source: apps/nizam/features/courses/present.ts:298
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 2–5: one müderris is the imam, the summary counts the sessions, a draft is opened with its sessions"

  - id: give-a-hoca-an-unvan
    need: >-
      Each hoca can carry an unvan in this course from the day it is opened ("Prof. Dr.", "Doç. Dr.", ... or none, the default),
      written before their name wherever the course shows them; it is kept in this course only.
    evidence:
      - node: unvanA
      - node: unvanB
      - state: form
      - source: apps/tedrisat/src/course/course.controller.ts:188
      - source: apps/nizam/features/courses/components/team-picker.tsx:212

  - id: removing-a-hoca-is-said
    need: >-
      Taking a hoca off the list is said (who was taken off), keeps the focus on a control of the form, and a status that said
      "added" does not go on saying it.
    missing: no Linear issue; F-W4-open-5
    note: >-
      Drawn on the nodes removeA, removeB, addedA and addedB, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: weekly-schedule-with-a-live-count
    need: >-
      The schedule is one weekly pattern (a start date, a length in weeks, the days, an hour, a length for each celse, a time
      zone), and a summary says how many celses it makes, from which day to which, as the fields change.
    evidence:
      - node: startDateField
      - node: weeksField
      - node: daysGroup
      - node: dayMon
      - node: startTimeField
      - node: durationField
      - node: zoneField
      - node: summary
      - node: summaryBody
      - node: summaryNone
      - node: summaryEmpty
      - source: apps/nizam/features/courses/present.ts:1210
      - source: apps/nizam/features/courses/components/course-create-form.tsx:425
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 2–5: one müderris is the imam, the summary counts the sessions, a draft is opened with its sessions"

  - id: a-schedule-the-server-refuses-is-said-before
    need: >-
      A schedule that makes more celses than one batch can hold (200) is said in the summary, and the course is not made first:
      the nazım is told before the press, not after the course exists.
    missing: no Linear issue; F-W4-open-4, decision D2
    note: >-
      Drawn on the states form, planning and session_planner and on the node summary, which the code has: they are not evidence,
      so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: closed-approval-and-in-person-are-options
    need: >-
      The nazım can make the course closed (its content and recordings never open to everyone), ask that every application be
      approved (checked at first), and mark its celses as in person; each is kept on the course and, for the celses, each celse
      follows it unless it has its own mark.
    evidence:
      - node: closedBox
      - node: approvalBox
      - node: inPersonBox
      - node: closedDesc
      - node: approvalDesc
      - node: inPersonDesc
      - state: opening
      - source: apps/tedrisat/src/course/course.controller.ts:188
      - source: apps/nizam/features/courses/components/course-create-form.tsx:455
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 4: 'Hemen yayımla' with a closed course and a cover caption opens it published"

  - id: draft-or-published
    need: >-
      The nazım chooses to open the course as a draft (hocas prepare it, talebe do not see it) or to publish it at once (the
      introduction is open to everyone and talebe can apply); the course is listed with the status chosen.
    evidence:
      - node: visibilityGroup
      - node: draftRadio
      - node: publishRadio
      - node: newRowDraft
      - node: newRowPublished
      - source: apps/tedrisat/src/course/course.controller.ts:188
      - source: apps/nizam/features/courses/components/course-create-form.tsx:487
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 2–5: one müderris is the imam, the summary counts the sessions, a draft is opened with its sessions"
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 4: 'Hemen yayımla' with a closed course and a cover caption opens it published"

  - id: the-kosk-can-fix-approval
    need: >-
      A köşk policy that every enrolment waits for approval fixes "Kayıt onayı gereksin" on in the form, says so and says who can
      change the policy; the course is made with approval on whatever the form sends.
    evidence:
      - node: approvalBox
      - node: approvalFixed
      - node: approvalDesc
      - source: apps/nizam/features/courses/components/course-create-form.tsx:470

  - id: accept-a-request-by-opening-its-course
    need: >-
      A request that a medrese sent to the köşk is accepted by opening the course it asks for: the form opens with the request's
      name, the course is made, the request is marked accepted with the course's id, and the course stays a köşk course with no
      medrese.
    evidence:
      - state: readingRequest
      - state: answering
      - source: apps/tedrisat/src/course-request/course-request.controller.ts:86
      - source: apps/tedrisat/src/course-request/course-request.controller.ts:113
      - source: "apps/nizam/app/kosks/[id]/courses/new/page.tsx:39"
      - source: apps/nizam/features/courses/components/course-create-form.tsx:163
    note: Also drawn as the assertion the-request-is-answered-after-its-course.

  - id: a-request-answer-that-failed-is-told-truly
    need: >-
      When the answer to the request fails after the course was made, the nazım is told what happened (answered by another nazım,
      refused, or not sent), the course stays, and Ders talepleri is offered; the words do not say a thing that was not checked.
    missing: no Linear issue; F-W4-open-3
    note: >-
      Drawn on the state answering and on the nodes requestLeftToast and requestLeftBody, which the code has: they are not
      evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-request-that-is-gone-is-said
    need: >-
      A request that was answered meanwhile, or that cannot be found, is said when the form opens from its link: the nazım is not
      left to open a course that answers nothing without knowing.
    missing: no Linear issue; F-W4-open-6
    note: >-
      Drawn on the states readingRequest and form, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).

  - id: a-refused-course-is-said-with-its-reason
    need: >-
      A course the server refuses (the right is gone, a hoca's account is gone, anything else) is said with its reason where the
      nazım is looking, not only in a toast that stays until closed, and a nazım who names themselves a hoca is told that is not
      allowed, not to try again.
    missing: no Linear issue; F-X-4, F-W4-open-7
    note: >-
      Drawn on the states opening and form and on the nodes failedToast, toastForbidden, toastUnknownUser and toastFailed, which
      the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs
      name).

  - id: a-refused-celse-plan-is-explained-and-kept
    need: >-
      When the course is made and its celses are refused, the nazım is told why, the schedule they typed is carried to Celse
      planla, and the course is not left with no celse and no sign of it.
    missing: no Linear issue; F-W4-open-2, decision D1
    note: >-
      Drawn on the states planning and session_planner and on the nodes sessionsFailedToast and sessionsFailedBody, which the code
      has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: say-when-a-hoca-is-unknown-or-the-celses-fail
    need: >-
      The two refusals the stack can make on request, the nazım's right gone and the celses refused, are told in the words the
      catalog already has, and each leaves the form or the page the nazım is on in a known state.
    evidence:
      - state: opening
      - state: planning
      - state: form
      - state: session_planner
      - node: toastForbidden
      - source: apps/tedrisat/src/course/course.controller.ts:188
      - source: apps/tedrisat/src/course/lesson.controller.ts:329

  - id: the-days-have-names
    need: The weekday buttons are named by the day, not by three letters, and say which are pressed.
    missing: no Linear issue; F-W4-open-8
    note: >-
      Drawn on the nodes daysGroup, dayMon, dayTue, dayWed, dayThu, dayFri, daySat and daySun, which the code has: they are not
      evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: open-from-the-kosk-home-or-a-request
    need: >-
      "Ders aç" opens the form from Dersler, from the köşk's home and from a request's "Kabul et"; its address opens it for a
      nazım of the köşk and the başnazım, and a person who may not gets the refusal in words, not a form.
    evidence:
      - state: reading
      - state: no_access
      - state: not_found
      - state: readFailed
      - source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:114
      - source: apps/nizam/features/platform-admin/components/course-requests-view.tsx:234
      - source: "apps/nizam/app/kosks/[id]/courses/new/page.tsx:35"
      - test: apps/nizam/e2e/kosk-view.e2e.ts
        name: "nizam/23 — 'Ders aç' opens the new-course form"

  - id: kontenjan-per-gender
    need: >-
      A course held in person has seats, and the seats are two counts, one for women and one for men, set where the course or its
      celses are opened (planned per celse and per week, not per course). The form's "Celseler yüz yüze yapılır" box is the base:
      today it only marks the celses.
    missing: MDRS-284
    note: >-
      Drawn on the nodes inPersonBox and inPersonDesc, which the code has: they are not evidence, so that a replay still walks
      them (SPEC.md §13 leaves out what only missing needs name).

  - id: gender-is-always-required
    need: >-
      Gender is always required of a talebe who takes or asks for a seat, so that the two counts can be told apart; it is never
      optional.
    missing: "`missing: MDRS-284`: an in-person course has no seat count, and the form asks no gender of anyone"
    note: >-
      Drawn on the node inPersonBox, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).
