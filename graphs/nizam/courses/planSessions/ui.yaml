# The screens of nizam.courses.planSessions: "Celse planla" (/kosks/<id>/courses/<id>/sessions/new), the form that makes one celse or a weekly repeat
# with its live preview, the card the page draws when the course cannot be read, and the page it lands on. Read from apps/nizam/features/courses
# (session-plan-form.tsx, course-load-failed.tsx, sessions-view.tsx) and apps/nizam/features/kosks/components/load-failed.tsx; the words are copied from
# libs/i18n/src/locales/tr/nizam.json (namespaces SessionPlan, CourseLoad, CourseCreate, Sessions) and common.json by script, letter for letter.
#
# Three messages are built in code and are in no i18n file, so they are `composed.SessionPlan.*` ("Günler *" at session-plan-form.tsx:202, a weekday's
# short name at :209, the date of a previewed celse at :429). `Changes.note` is the one catalog entry the app does not have: no app message says what
# making celses changes (the toast says only "N celse eklendi"), so one short factual sentence was written for it from the API's side effects (the calendar
# invitation mail to the enrolled talebe: apps/tedrisat/src/course/course.service.ts:1386-1415).
# Where a node says "repeat", the page draws it once per item; the replay finds the items through the binding.
schema: delurio-graph/0
kind: ui
id: nizam.courses.planSessions
flow: nizam.courses.planSessions
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  name: Deneme dersi planla
  count: "3"
  week: "1"
  minutes: "60"
  link: boş
  zone: İstanbul
  when: 9 Ekim 2026 Cuma 21:00
  day: Sal
  legend: Günler

# The page sets no focus of its own: on load, after a refused press and after the celses are made nothing in session-plan-form.tsx moves it, so there is
# no `initialFocus` on the page and no `focus` here. The graph says nothing of what the code does not say.
