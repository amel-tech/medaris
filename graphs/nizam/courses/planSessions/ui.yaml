rules:
  - { id: F-X-3, rule: "The submit is natively `disabled` while the preview holds no celse, whatever is wrong, and its label reads '0 celse oluştur'; nothing says what is missing and the button leaves the tab order (session-plan-form.tsx:395-402; e2e courses#14 asserts it is disabled). The inventory's list of such buttons does not name this one. The page's own messages for the pattern ('En az bir gün seçin.', 'Başlangıç tarihini girin.', 'Bitiş tarihini girin.') are written for a press the off button never lets happen, so a person who has pressed nothing never reads them: they are drawn once any press was refused, because `sent` is never reset (:75, :130), and then only the weekday message is a role=alert (:213). nazar.sessions.plan's F-C-course-a-09 says the pattern's messages can never be said; with the same `sent` they can, after one refused press of a wrong title or link. Fix: keep the button reachable (aria-disabled) and say what is missing, or word the label 'Celse oluştur' until a preview exists (decision D1)." }
  - { id: F-W4-13, rule: "The preview (the count badge and the list) is rewritten 250 ms after the last key and is not a live region (session-plan-form.tsx:90-113, 406-456); only the submit's label changes with it, and that is not announced either (nazar's F-C-course-a-10). Fix: aria-live=polite on the count." }
  - { id: F-W4-15, rule: "A refused press (an empty title, a first-celse link that is not https) only sets `sent`: the text appears under the field, the Field's error is no live region (F-X-2, F-UI-W4-1) and the focus stays on the button (session-plan-form.tsx:127-132, 124-125). A keyboard or screen-reader user presses the button and hears nothing (PLAN-1 on nazar). Not verified in a browser. Fix: move the focus to the first field in error and name it in a status." }
  - { id: F-W4-17, rule: "The page names neither the course nor the köşk: the breadcrumb is 'Celseler / Celse planla' with no köşk or course (session-plan-form.tsx:165-171), the sentence under the h1 does not name the course (:173) as nazar's does, and the tab is 'Celse planla' (page.tsx:11-14). Celseler, one step back, names both. A nazım with two courses open cannot tell the tabs apart or be sure which course the celses go to. Fix: put the course's title in the sentence, the breadcrumb and the <title> (decision D3)." }
  - { id: F-W4-18, rule: "The placeholder 'https://zoom.us/j/…' of the link field is typed into the code, not the catalog (session-plan-form.tsx:375), and names one platform in every locale (PLAN-3 on nazar). Fix: move it to the catalog." }
  - { id: F-W4-19, rule: "The weekday group's legend is `{t('daysLegend')} *` (session-plan-form.tsx:202): the required asterisk is real text in the group's name ('Günler *'), while the Field labels hide theirs (`aria-hidden`, field.tsx:46). Fix: render the marker aria-hidden and mark the group required another way." }
  - { id: F-W4-5, rule: "'Vazgeç', the breadcrumb's 'Celseler' and every link of the menu leave the page with everything typed and no guard (session-plan-form.tsx:165-171, 392-394): a plain link, no beforeunload, no router guard. The inventory names the Müfredat and Ders ayarları forms; the planner is the same (nazar's F-C-course-a-13). Fix: warn while the form has been typed in." }
  - { id: NPLAN-1, rule: "Nothing refuses a date in the past: the date inputs carry no min (session-plan-form.tsx:268-274, 298-303) and neither the preview nor the write checks it (apps/tedrisat/src/course/domain/weekly-pattern.ts:151-190), so a repeat that starts yesterday makes celses that are already over, with no warning, and the invitation sweep mails the enrolled talebe for them (PLAN-4 on nazar, whose page has the same inputs). Not verified in a browser. Decision D2. Proposed id; not in the inventory." }
  - { id: NPLAN-2, rule: "A course that is not there can be drawn as the server being down. readCourseScope takes `!kosk && !course` for 'the API did not answer' (reads.ts:45), and getKoskById and getCourse turn every error, a 404 too, into null (actions/index.ts:47-70): an address whose köşk id AND course id name nothing draws 'Ders bilgisi okunamadı / Sunucu şu an yanıt vermiyor. Biraz sonra yeniden deneyin.' with a retry that cannot help, where one wrong id gives the 'izniniz yok' screen (notFound). The card (course-load-failed.tsx) also has no heading and no breadcrumb: its title is a <p> in an Alert, so the page has no h1 (nazar's twin draws two, PLAN-2, which does not hold here). Seen as code, not in a browser. Fix: let the two reads say 'not found' apart from 'failed', and draw a heading. Proposed id; not in the inventory." }
  - { id: NPLAN-3, rule: "'Planlama biçimi' is a Base UI toggle group of aria-pressed buttons, not radios, and pressing the pressed one is ignored (choice-chips.tsx:75-92; session-plan-form.tsx:182) (nazar's F-C-course-a-12); the day chips are named by the three-letter abbreviations 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz' (weekdayName(…, 'short'), :209), which a screen reader spells as letters (the same chips on Ders aç: F-W4-open-8). Fix: radios for the single choice, and the full weekday names as the chips' accessible names. Proposed id; not in the inventory." }
  - { id: NPLAN-4, rule: "A single celse is offered the title 'Haftanın tekrarı' ('the week's repeat'): the title state starts from `defaultTitle` and never follows the mode (session-plan-form.tsx:72), so 'Tek seferlik' makes a celse called a repeat unless the person edits it (e2e courses#14 and #15 both assert 'Haftanın tekrarı'). Fix: a title that fits the mode, or none. Proposed id; not in the inventory." }
  - { id: focus-not-set, rule: "No code in session-plan-form.tsx moves the focus: not on load, not after a refused press, not after the celses are made (the page changes, so the focus is the new document's)." }
  - { id: sent-is-never-reset, rule: "`sent` is set by the first refused press and never cleared (session-plan-form.tsx:75, 130), so afterwards every field problem is said at once, as the person edits: the messages come and go with the fields, and 'En az bir gün seçin.' is announced when the last day is unchosen. The graph draws it as `sent` and the transition CLEAR_DAYS." }
  - { id: no-in-person-mark, rule: "The request carries no in-person mark and no seat count (session-plan-form.tsx:134-141): the celses follow the course's own mark, and an extra paragraph says so when the course is held in person (:385-387, not drawn here). A kontenjan per gender per celse is MDRS-284 and does not exist." }
  - { id: no-exam, rule: "nizam's planner has no 'Sınav': an exam is planned in nazar (nazar.sessions.plan), so the köşk nazımı cannot plan one in the app made for them." }
