# What must exist for a köşk nazımı to plan the celses of a course of her köşk, one by one or as a weekly repeat: the flow's product list (LAYOUT.md
# section 7). Each need is what the product must do, from the flow's story and the inventory's planned work (planned.md), not from what the page does today;
# the known gaps go to graphs/needs.gaps.yaml, which the orchestrator merges. Read by people for now: no checker runs on this file.
#
# Missing (no code): button-says-what-is-missing, preview-is-announced, a-field-in-error-is-announced, a-course-that-is-not-there-is-said-so,
#   no-celse-in-the-past-unasked, the-page-names-its-course, quota-per-gender-when-planning.
# Unwalked (code, no e2e and no replay that has run): plan-one-celse, a-title-or-link-that-is-wrong-is-said, a-refused-write-leaves-the-form,
#   the-planner-is-for-those-who-manage-the-kosk, the-planner-after-a-refused-open.
# Walked: open-the-planner (the heading only), plan-a-weekly-repeat, read-the-preview-before-making, a-first-link-on-the-first-celse-only (e2e courses#14, #15)
#   and the closed button (courses#14).
# The scenarios that will walk them are in comments below; none is named as walked because no replay has run (the walks are a later phase).
kind: needs
flow: nizam.courses.planSessions
status: proposed

needs:
  - id: open-the-planner
    need: >-
      From a course's Celseler, a köşk nazımı reaches the planner with one press, and from the planner she can go back to Celseler without making anything;
      the planner says which course it is for.
    drawn: [form, sessions_opened, breadcrumbRoot, cancel, planTitle]
    built:
      - route: apps/nizam/features/courses/components/sessions-view.tsx:494
      - route: apps/nizam/app/kosks/[id]/courses/[courseId]/sessions/new/page.tsx:20
    walked:
      - e2e: apps/nizam/e2e/courses.e2e.ts
        check: 'courses#14' # a1 only: the h1 "Celse planla" is there (the test opens the address, it does not press the link)
    # replay: weekly (enters through the nav entry courseSessions->courseSessionsNew), then CANCEL and BREADCRUMB in the cover run

  - id: plan-a-weekly-repeat
    need: >-
      She chooses the days of the week, the start time and length, the first date and an end (a date, or a number of celses) and the course gets one celse for
      each, titled as she wrote, each in the week its date falls in, in one step.
    drawn: [form, previewing, formReady, creating, landed, repeatRegion, startDateField, endDateField, endByCount, countField, dayChip]
    built:
      - action: medaris.api:createSessionBatch
      - action: medaris.api:previewSessionBatch
      - route: apps/nizam/features/courses/components/session-plan-form.tsx:127
    walked:
      - e2e: apps/nizam/e2e/courses.e2e.ts
        check: 'courses#14' # three celses that end on a date, "3 celse", created titled "Haftanın tekrarı"
      - e2e: apps/nizam/e2e/courses.e2e.ts
        check: 'courses#15' # "Belirli sayıda celseden sonra" and 2: stops at two
    # replay: weeklyPlain (courses#14), weeklyCount (courses#15), weekly (the main story); the effect reads the lessons in the database

  - id: plan-one-celse
    need: >-
      She can add a single celse by its date and time, without a repeat, to the same place in the programme the repeat would have put it.
    drawn: [singleRegion, modeSingle, dateField]
    built:
      - action: medaris.api:createSessionBatch
      - route: apps/nizam/features/courses/components/session-plan-form.tsx:177
    # replay: single

  - id: read-the-preview-before-making
    need: >-
      Before anything is made she reads, as a list, the date, week and length of each celse the pattern gives and whether the first has a link, and she sees at
      once when the pattern gives none.
    drawn: [formReady, previewFailed, previewRow, previewRowCaption, previewCount, previewFailedAlert]
    built:
      - action: medaris.api:previewSessionBatch
      - route: apps/nizam/features/courses/components/session-plan-form.tsx:406
    walked:
      - e2e: apps/nizam/e2e/courses.e2e.ts
        check: 'courses#14' # the preview says "3 celse"
      - e2e: apps/nizam/e2e/courses.e2e.ts
        check: 'courses#15' # the preview says "2 celse"
    # replay: weeklyPlain (formReady), previewRefused (previewFailed: a pattern of Monday and Saturday over a Tuesday and a Wednesday)

  - id: a-first-link-on-the-first-celse-only
    need: >-
      She can give the first celse its meeting link when she plans, and the others stay empty, because a link is a week's and changes every week; she is told so on
      the form.
    drawn: [linksGroup, linkField, linksNote, previewRowCaption]
    built:
      - action: medaris.api:createSessionBatch
      - route: apps/nizam/features/courses/components/session-plan-form.tsx:346
    walked:
      - e2e: apps/nizam/e2e/courses.e2e.ts
        check: 'courses#15' # the first created celse holds the link, the second none
    # replay: weekly and weeklyCount (LINKS_FIRST); the effect checks that no later celse has a link

  - id: button-says-what-is-missing
    need: >-
      When the form cannot be made yet, the button can still be reached and the page says what is missing, so a keyboard or screen-reader user is not left with a
      disabled button that reads "0 celse oluştur" and no reason (F-X-3, decision D1).
    drawn: [form, previewFailed, submitOff, daysError]
    walked:
      - e2e: apps/nizam/e2e/courses.e2e.ts
        check: 'courses#14' # a2 pins today's behaviour: the button /celse oluştur/ is disabled; it will change with the fix
    missing: none

  - id: preview-is-announced
    need: >-
      A change to the number of celses the pattern gives is announced to a screen-reader user, not only drawn (F-W4-13).
    drawn: [formReady, previewCount]
    missing: none

  - id: a-field-in-error-is-announced
    need: >-
      A title or link that is wrong is announced when the button is pressed and the focus goes to the first field in error (F-W4-15, F-X-2).
    drawn: [titleError, linkError, daysError]
    missing: none

  - id: a-title-or-link-that-is-wrong-is-said
    need: >-
      A title that is empty or a first-celse link that does not start with https:// is refused with a word under the field, and nothing is made, until each is
      corrected.
    drawn: [formReady, titleError, linkError, a-refused-form-is-not-sent]
    built:
      - route: apps/nizam/features/courses/components/session-plan-form.tsx:116
    # replay: noTitle, badLink (and CLEAR_DAYS, which reads "En az bir gün seçin." after the refused press)

  - id: a-refused-write-leaves-the-form
    need: >-
      When the API refuses the write (the pattern gives no celse, the permission was taken away, anything else) she is told in a toast and the form is as she left
      it, so she can correct it and try again.
    drawn: [creating, formReady, toastFailedTitle, toastPatternBody, toastForbiddenBody, toastGenericBody]
    built:
      - action: medaris.api:createSessionBatch
      - route: apps/nizam/features/courses/components/session-plan-form.tsx:144
    # replay: none can be made on the local stack (answer: patternRefused, forbidden, failed need the API to refuse a pattern it just previewed, a nazım who
    # loses session.manage after the page was read, or a write that fails)

  - id: the-planner-is-for-those-who-manage-the-kosk
    need: >-
      Only a person who manages the köşk (or the başnazım) sees the planner; another nazım is told she has no access, and a course that is not this köşk's gets the
      same screen.
    drawn: [no_access, opened]
    built:
      - route: apps/nizam/features/courses/reads.ts:36
    # replay: denied (a Medaris nazımı), unknownCourse (a course id no course has)

  - id: a-course-that-is-not-there-is-said-so
    need: >-
      An address whose köşk and course do not exist is said to be missing, not drawn as the server being down with a retry that cannot help, and the page has a
      heading (NPLAN-2).
    drawn: [loadFailed, failedAlert, retryButton]
    missing: none
    # replay: unreadable walks today's card

  - id: the-planner-after-a-refused-open
    need: >-
      When a course was opened and its celses were refused, the nazım is taken to the new course's planner, told why they were refused and given back what she typed
      (F-W4-open-2); today she gets a sticky toast with no reason and a blank form.
    drawn: [arrivalTitle, arrivalBody, form]
    built:
      - route: apps/nizam/features/courses/components/course-create-form.tsx:181
    # replay: none here; nizam.courses.open reaches it (this flow's `fromOpen: true`), and the stack cannot make the celses fail

  - id: no-celse-in-the-past-unasked
    need: >-
      A repeat or a celse whose first date is already past is not made without her being asked, because the celses would be over before they began and the enrolled
      talebe would be mailed invitations for them (NPLAN-1, decision D2).
    drawn: [formReady, creating]
    missing: none

  - id: the-page-names-its-course
    need: >-
      The planner says which course and köşk it plans for, in the sentence under the title, the breadcrumb and the tab (F-W4-17, decision D3).
    drawn: [planTitle, planIntro, breadcrumb]
    missing: none

  - id: quota-per-gender-when-planning
    need: >-
      Where a celse is held in person, planning it also gives its kontenjan: one number for women and one for men, never one pooled count, and a weekly repeat carries
      the same pair for every celse it makes (MDRS-284; the planner sends no in-person mark and no seat count today).
    drawn: [formReady, creating]
    missing: MDRS-284
