rules:
  - { id: focus-not-set, rule: "No page of this flow moves the focus when it opens: the page nodes carry no `initialFocus` and there is no `focus`. Nothing in apps/nizam/features/kosks/components/course-overview.tsx or app/kosks/[id]/courses/[courseId]/page.tsx calls focus() or sets autoFocus; the overview, the refusal and the box are drawn by whatever the browser or Next's router does after a load. Recorded so the silence is not read as an omission; the inventory does not call it a finding. The links leave the page (a full document request), so there is no return to draw." }
  - { id: F-W4-1, rule: "Four controls are named after one page and open another. `editHref` is `/kosks/<id>/courses/<id>/edit` (course-overview.tsx:81) and /edit only redirects to /curriculum (edit/page.tsx:16, no guard, no title): 'Müfredatı düzenle' (:294) is true, but 'Celse planla' (:299) does not open Celse planla (/sessions/new), 'Ders ayarları' (:465) does not open the settings (/ayarlar), and a row's 'Toplantı bağlantısı ekle' / 'Düzenle' (:168) does not open the Celseler form that adds a link. A user, and a screen-reader user who trusts the link's name, lands on a page that does not match it; e2e kosk-view#12 cannot pass as written (it waits for the /edit address, which a redirect never commits). Fix: link to /curriculum, /sessions/new, /ayarlar and /sessions. Decision D1." }
  - { id: F-X-19, rule: "The shared form of F-W4-1, listed by the inventory for the pages that reach /edit: the overview's three links (course-overview.tsx:81), the Talebeler page's 'Derse dön' (students/page.tsx:52), TaughtCourses and the inactive-scopes table (features/inactive-scopes/present.ts:71). Each button lands on the curriculum page, not on the page its name promises. Fix: link each button to its own page." }
  - { id: F-X-15, rule: "Cited, and it HOLDS on this page: 'Nazar’da aç' opens a new tab and says so in its name, with a visually hidden '(ders nazırları ve ders ayarları, yeni sekmede açılır)' (course-overview.tsx:285-289), and the visible words are contained in the name (WCAG 2.5.3). The finding is about other pages' links that do not say so (kosk-home, account-page, sessions-view.tsx:289-296)." }
  - { id: F-W4-17, rule: "Cited from the inventory: the <title> is the catalog's 'Genel bakış' with no course or köşk name (page.tsx:22-25), and the h1 holds the title and the state's badge, so its accessible name is 'Genel bakış Yayında' or 'Genel bakış Taslak'; the course's name is only in the line under it and in the breadcrumb. Tabs and history entries are indistinguishable between courses. Fix: put the course's title in <title> and in the h1." }
  - { id: F-X-10, rule: "The loading file of this page (app/kosks/[id]/courses/[courseId]/loading.tsx:8) is an `aria-busy=true` <div> of skeletons that are aria-hidden (libs/ui/src/mds/skeleton.tsx:20): while the six reads run a screen reader hears nothing. The same finding as F-W1-8 on the köşk home. Fix: add a visually hidden status text 'Yükleniyor' to the skeleton (it needs a catalog key)." }
  - { id: F-W1-11, rule: "Cited: the Katılım cell of a cancelled celse is a bare '—' with no text alternative here too (course-overview.tsx:143), where the shared AttendanceCell hides a null view behind 'Katılım bilgisi gösterilmez' (attendance-cell.tsx:16-22). The same shape is the Süre cell of a celse with no length (:134). Fix: render <AttendanceCell view={null}> or write 'İptal edildi'." }
  - { id: KOVERVIEW-1, rule: "Proposed id; not in the inventory. The card 'Devam eden hafta' (weeks under way) shows `startedWeekCount`, the weeks of the programme that have BEGUN: at least one of their live celses is dated at or before now (course-stats.repository.ts:24-58). A course in its fifth week of ten says 5, not 1: a number that only grows, under a label that reads as the current week, with 'Toplam {n} hafta' under it. Whether the owner meant 'weeks so far' was not verified; the words and the number do not say the same thing. Fix: label it 'Başlayan hafta' or count the weeks that are under way." }
  - { id: KOVERVIEW-2, rule: "Proposed id; not in the inventory. When nothing can be read (the numbers, the köşk or the course fail together), the page is an error Alert alone in <main> (page.tsx:53-63, load-failed.tsx:19-35): no h1 and no heading of any kind, and the tab still says 'Genel bakış'. A screen-reader user who opens the page by its address finds no heading to land on; the words are the köşk page's ('Bölüm yüklenemedi'), not the overview's. The same box serves every köşk page that reads (the same lack as KOSKHOME-3 on the home). Not walkable on the stack; from the code. Fix: give the box a heading, or render it under the page's own h1." }
  - { id: KOVERVIEW-3, rule: "Proposed id; not in the inventory. The numbers' read decides the refusal, but a failed read of the köşk or of the course is `null`, and `if (!kosk || !course || course.koskId !== kosk.id) notFound()` (page.tsx:65) draws it as 'Bu bölüm için izniniz yok' with a 404: while the numbers answer, a 5xx on GET /courses/:id or GET /kosks/:id tells a nazım of the course that they have no permission, where the page has a retry box for the same failure when the numbers fail too (page.tsx:53). Read from the code (getCourse and getKoskById return null on any error, features/kosks/actions/index.ts:47-70); not walkable on the stack. Fix: tell a failed read apart from a missing record, and draw the retry box for it." }
  - { id: KOVERVIEW-4, rule: "Proposed id; not in the inventory (the table notes the fact only). The 'Saat dilimi' of the settings summary is the raw zone id, e.g. 'Europe/Istanbul' (course-overview.tsx:484), a string for a program, in a page of Turkish; the settings page writes zones by name. Low severity. Fix: write the zone as the settings page does." }
  - { id: KOVERVIEW-5, rule: "Proposed id; not in the inventory. A Medaris nazımı who holds platform.kosk_edit is let into a köşk's Dersler (dersler/page.tsx:42-46; tedrisat asks kosk.manage or platform.kosk_edit), where each course's title is a plain link to this page (kosk-course-table.tsx:122-126, drawn whatever the reader holds), and this page refuses them: the numbers' read asks course.staff_read, which a platform permission does not give (seen on the stack: GET /courses/<seeded>/stats as the seeded Medaris nazımı answers 403 AUTHZ_FORBIDDEN). So the list offers a link that ends on 'Bu bölüm için izniniz yok'; the nav graph's `koskCourses->courseOverview` entry has no guard for it. The `refused` scenario of binding.yaml is exactly this arrival, by address. Fix: draw the title as plain text for a reader the overview refuses, or let the Medaris nazımı read the numbers." }
  - { id: label-in-name, rule: "A node's visible text is contained in its accessible name (WCAG 2.5.3). Holds: the row's button says 'Toplantı bağlantısı ekle' or 'Düzenle' and is named '... : <celse>', 'Onayla' and 'Reddet' are named 'Onayla: <name>' and 'Reddet: <name>', and 'Nazar’da aç' is named 'Nazar’da aç (… yeni sekmede açılır)'." }
  - { id: warning-not-announced, rule: "The warning for a celse with no way in is an Alert with the warning tone, which is role=status (alert.tsx:23): it is in the page when it loads, so it is not announced; only a change would be. An observation, not a finding (the inventory makes none). Its text names the first such celse only and holds no link (the row's button, which lands on Müfredat, is the way to the fix: F-W4-1)." }
