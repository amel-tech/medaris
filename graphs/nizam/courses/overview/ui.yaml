  allSessions: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: CourseOverview.allSessions }, in: [overview], emits: OPEN_SESSIONS, source: apps/nizam/features/kosks/components/course-overview.tsx:371 } # to /kosks/<id>/courses/<id>/sessions
  sessionsTable: { type: list, component: List, role: table, name: { key: CourseOverview.nextHeading }, in: [overview], source: apps/nizam/features/kosks/components/course-overview.tsx:378 } # `responsive="stack"`: explicit table roles, named by the hidden caption
  columnSession: { type: text, component: Text, role: columnheader, text: { key: CourseOverview.columns.session }, in: [overview], source: apps/nizam/features/kosks/components/course-overview.tsx:101 }
  columnWhen: { type: text, component: Text, role: columnheader, text: { key: CourseOverview.columns.when }, in: [overview], source: apps/nizam/features/kosks/components/course-overview.tsx:115 }
  columnLength: { type: text, component: Text, role: columnheader, text: { key: CourseOverview.columns.length }, in: [overview], source: apps/nizam/features/kosks/components/course-overview.tsx:125 }
  columnAttendance: { type: text, component: Text, role: columnheader, text: { key: CourseOverview.columns.attendance }, in: [overview], source: apps/nizam/features/kosks/components/course-overview.tsx:139 }
  columnStatus: { type: text, component: Text, role: columnheader, text: { key: CourseOverview.columns.status }, in: [overview], source: apps/nizam/features/kosks/components/course-overview.tsx:147 }
  columnSessionActions: { type: text, component: Text, role: columnheader, text: { key: CourseOverview.columns.actions }, in: [overview], source: apps/nizam/features/kosks/components/course-overview.tsx:158 } # its text is visually hidden
  noSessions: { type: text, component: Text, role: cell, text: { key: CourseOverview.noSessions }, in: [overview], when: "programme == 'empty'", source: apps/nizam/features/kosks/components/course-overview.tsx:383 } # the table's one cell, whatever the reason: nothing is ahead, or every celse is behind us
  rowSession: { type: text, component: Text, role: rowheader, text: { key: composed.CourseOverview.sessionTitle, params: { session: session.title } }, in: [overview], when: hasRows, repeat: sessions, source: apps/nizam/features/kosks/components/course-overview.tsx:106 }
  rowWeek: { type: text, component: Text, text: { key: CourseOverview.weekNumber, params: { number: session.week } }, in: [overview], when: hasRows, repeat: sessions, source: apps/nizam/features/kosks/components/course-overview.tsx:108 } # the grey line under the title: "Hafta 1"
  rowWhen: { type: text, component: Text, role: cell, text: { key: composed.CourseOverview.when, params: { when: session.when } }, in: [overview], when: hasRows, repeat: sessions, source: apps/nizam/features/kosks/components/course-overview.tsx:119 }
  rowLength: { type: text, component: Text, role: cell, text: { key: CourseOverview.minutes, params: { count: session.minutes } }, in: [overview], when: hasRows, repeat: sessions, source: apps/nizam/features/kosks/components/course-overview.tsx:131 } # a cancelled celse keeps its length
  attendanceMissing: { type: text, component: Text, text: { key: Sessions.attendance.missing }, in: [overview], when: "programme == 'lacking'", repeat: sessions, source: apps/nizam/features/courses/components/attendance-cell.tsx:25 } # a warning Badge "Eksik" and, visually hidden, ": toplantı bağlantısı, canlı yayın ya da yüz yüze işareti yok" (data-testid="attendance-missing"); e2e kosk-view#11
