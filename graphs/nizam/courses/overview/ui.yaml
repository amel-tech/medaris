# The screens of nizam.courses.overview: nizam-web's Genel bakış of a course (/kosks/<kosk>/courses/<course>,
# app/kosks/[id]/courses/[courseId]/page.tsx, drawn by features/kosks/components/course-overview.tsx), the screen it gives for a course the
# reader may not read (components/errors/no-access.tsx) and the box that says nothing could be read (features/kosks/components/load-failed.tsx).
# The shell around the page (the sidebar, the köşk picker, the person row, the bell) is nizam.shell.menuPerPersona's. Read from the code on
# 16 Nov 2026; nothing was opened in a browser.
#
# Words: every `CourseOverview.*`, `KoskManage.*`, `NoAccess.*` and `Sessions.*` key is copied from libs/i18n/src/locales/tr/nizam.json, and
# `common.imamStar.title` from common.json (the app reads them as `nizam.<key>` and `common.<key>`), the key being the path inside the file.
# The `composed.*` keys are NOT in any i18n file: they are texts the app builds in code from messages and data, written here with their
# placeholders so a replay can match them:
#   composed.CourseOverview.courseName      "{course}"       the course's title in the breadcrumb's current item, in a <bdi> (breadcrumb.tsx:36)
#   composed.CourseOverview.courseLine      "{course} · {line}"   the <p> under the h1: the title in a <bdi>, " · ", then the köşk, "{n} hafta", "{n} celse" and the
#                                           days and times the course meets, joined by " · " with the empty parts left out (course-overview.tsx:244-274)
#   composed.CourseOverview.openInNazarName "Nazar’da aç (ders nazırları ve ders ayarları, yeni sekmede açılır)"   the link's accessible name: its text, a
#                                           space and the visually hidden CourseOverview.openInNazarHint (course-overview.tsx:285-289)
#   composed.CourseOverview.number          "{n}"            a Stat's big number, formatted for the page's language (libs/ui/src/mds/stat.tsx:47)
#   composed.CourseOverview.sessionTitle    "{session}"      a celse's title in the row header, in a <bdi> (course-overview.tsx:106)
#   composed.CourseOverview.when            "{when}"         a celse's time, "17 Kas Sal 21:00", in the viewer's zone (archive/present.ts:77), and the long form
#                                           in the warning ("17 Kasım Salı 21:00", course-overview.tsx:318)
#   composed.CourseOverview.ways            "{ways}"         the ways in a Katılım cell names, joined by " · ": "Yüz yüze", the meeting platform (Zoom, Google Meet,
#                                           Jitsi Meet, YouTube, or "Bilinmeyen platform" and its host), "YouTube yayını" or "Yalnız yayın"
#                                           (features/courses/components/attendance-cell.tsx:41-80)
#   composed.CourseOverview.dash            "—"              the Katılım cell of a cancelled celse, a bare dash (course-overview.tsx:143)
#   composed.CourseOverview.name            "{name}"         a waiting talebe's name, a hoca's name with "Hoca" or the unvan (`formatHocaName`, libs/utils/src/hoca-unvan.js:60)
#   composed.CourseOverview.applied         "{applied}"      the Başvuru cell: CourseOverview.today "Bugün {time}", CourseOverview.yesterday "Dün {time}" or "29 Eyl 14:05"
#                                           (features/archive/present.ts:51)
#   composed.CourseOverview.zone            "{zone}"         the course's zone id as the API gives it, e.g. Europe/Istanbul (course-overview.tsx:484, KOVERVIEW-4)
#   composed.NoAccess.account               "Giriş yaptığınız hesap: {email}"   (no-access.tsx:33-37)
# The Katılım "Eksik" badge also carries, visually hidden, Sessions.attendance.missingDetail; the node is named by its two parts, "Eksik: toplantı
# bağlantısı, canlı yayın ya da yüz yüze işareti yok", and the graph writes the visible word. Samples are invented and neutral.
# No message says what a flow changes: the flow only reads, so there is no `changes` key.
schema: delurio-graph/0
kind: ui
id: nizam.courses.overview
flow: nizam.courses.overview
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples:
  course: Örnek Ders
  line: Örnek Köşk · 2 hafta · 4 celse · Cuma 21:00
  n: "3"
  session: Celse 1
  title: Celse 1
  when: 17 Kas Sal 21:00
  ways: Zoom
  name: Örnek Kişi
  applied: Bugün 14:05
  zone: Europe/Istanbul
  email: ornek@example.test
  day: Salı
  number: "1"
  count: "2"

# Nothing in the page sets a focus: no `initialFocus` on the page and no `focus` here (rule focus-not-set).
nodes:
  # ---- the page: the shell's <main>, the breadcrumb, the h1 and its badge, the course's line ----
  overviewPage: { type: page, component: Page, role: main, in: [overview], source: libs/ui/src/mds/app-shell.tsx:41 } # <main id="main">: no name, no initialFocus; the binding finds it by the page's own data-testid inside it
  breadcrumb: { type: page, component: Page, role: navigation, name: { key: CourseOverview.breadcrumbLabel }, in: [overview], source: apps/nizam/features/kosks/components/course-overview.tsx:258 } # <nav aria-label="Sayfa yolu"> of a list of two items
  crumbCourses: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: CourseOverview.courses }, in: [overview], emits: OPEN_COURSES, source: apps/nizam/features/kosks/components/course-overview.tsx:260 } # to /kosks/<id>/dersler
  crumbCurrent: { type: text, component: Text, text: { key: composed.CourseOverview.courseName, params: { course: course.title } }, in: [overview], source: apps/nizam/features/kosks/components/course-overview.tsx:260 } # the current item, aria-current=page, never a link
  pageTitle: { type: text, component: Heading, role: heading, text: { key: CourseOverview.title }, in: [overview], source: apps/nizam/features/kosks/components/course-overview.tsx:264 } # h1 "Genel bakış" and the state's badge: its accessible name ends with "Yayında" or "Taslak" (F-W4-17); the tab's title is "Genel bakış" for every course (page.tsx:22)
  badgePublished: { type: text, component: Text, text: { key: CourseOverview.published }, in: [overview], when: "status == 'published'", source: apps/nizam/features/kosks/components/course-overview.tsx:266 } # a Badge inside the h1
  badgeDraft: { type: text, component: Text, text: { key: CourseOverview.draft }, in: [overview], when: "status == 'draft'", source: apps/nizam/features/kosks/components/course-overview.tsx:266 } # e2e kosk-view#15
  courseLine: { type: text, component: Text, text: { key: composed.CourseOverview.courseLine, params: { course: course.title, line: course.line } }, in: [overview], source: apps/nizam/features/kosks/components/course-overview.tsx:270 }

  # ---- the three buttons of the page's head ----
  openInNazar: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: composed.CourseOverview.openInNazarName }, text: { key: CourseOverview.openInNazar }, in: [overview], when: isChief, emits: OPEN_NAZAR, source: apps/nizam/features/kosks/components/course-overview.tsx:277 } # target=_blank and rel=noopener noreferrer, and the new tab is said in the name; to <nazar>/ders/<id>/nazirlar; drawn only for the başnazım and only while NAZAR_URL is set (the local stack sets it); e2e kosk-view#13
  editSyllabus: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: CourseOverview.editSyllabus }, in: [overview], emits: EDIT_SYLLABUS, source: apps/nizam/features/kosks/components/course-overview.tsx:292 } # /edit, which redirects to Müfredat; here the name is true (F-W4-1 is the other three)
  planSession: { type: action, component: LinkButton, role: link, intent: confirm, text: { key: CourseOverview.planSession }, in: [overview], emits: PLAN_SESSION, source: apps/nizam/features/kosks/components/course-overview.tsx:299 } # the primary button, /edit again: it does not open Celse planla (F-W4-1, F-X-19)

  # ---- the warning: a celse ahead has no way in ----
  missingAlert: { type: alert, component: Alert, role: status, text: { key: CourseOverview.missingTitle, params: { day: missing.day } }, in: [overview], when: "programme == 'lacking'", source: apps/nizam/features/kosks/components/course-overview.tsx:305 } # a warning tone is role=status, which is not announced when the page loads, only when it changes; the title is the weekday of the first such celse, written in full
  missingBody: { type: text, component: Text, text: { key: CourseOverview.missingBody, params: { title: missing.title, when: missing.when } }, in: [overview], when: "programme == 'lacking'", source: apps/nizam/features/kosks/components/course-overview.tsx:315 } # names the first such celse only (the first of all ahead, not of the four listed) and holds no link; the row's button is the way to the fix and lands on Müfredat (F-W4-1)

  # ---- the three numbers: a region named by its aria-label, each number a Stat (two spans, the label and the number) ----
  statsRegion: { type: page, component: Page, role: region, name: { key: CourseOverview.summaryLabel }, in: [overview], when: "answer == 'ok'", source: apps/nizam/features/kosks/components/course-overview.tsx:340 } # <section aria-label="Dersin sayıları">
  statStudents: { type: text, component: Text, text: { key: CourseOverview.stats.students }, in: [overview], when: "answer == 'ok'", source: apps/nizam/features/kosks/components/course-overview.tsx:344 } # a plain card, not a link (MDRS-291, decision D2)
  valueStudents: { type: text, component: Text, text: { key: composed.CourseOverview.number, params: { n: stats.enrolled } }, in: [overview], when: "answer == 'ok'", source: apps/nizam/features/kosks/components/course-overview.tsx:346 } # the talebe whose seat is ENROLLED; a COMPLETED one is not counted here
  statPending: { type: text, component: Text, text: { key: CourseOverview.stats.pending }, in: [overview], when: "answer == 'ok'", source: apps/nizam/features/kosks/components/course-overview.tsx:349 } # a plain card, not a link (MDRS-291)
  valuePending: { type: text, component: Text, text: { key: composed.CourseOverview.number, params: { n: stats.pending } }, in: [overview], when: "answer == 'ok'", source: apps/nizam/features/kosks/components/course-overview.tsx:351 } # the numbers' own read; it falls by one after an answer to an application, when the page is refreshed (nizam.courses.decideApplications)
  statWeeks: { type: text, component: Text, text: { key: CourseOverview.stats.weeks }, in: [overview], when: "answer == 'ok'", source: apps/nizam/features/kosks/components/course-overview.tsx:354 } # "Devam eden hafta" (weeks under way) over a number that counts the weeks that have BEGUN (KOVERVIEW-1)
  valueWeeks: { type: text, component: Text, text: { key: composed.CourseOverview.number, params: { n: stats.started } }, in: [overview], when: "answer == 'ok'", source: apps/nizam/features/kosks/components/course-overview.tsx:356 } # startedWeekCount: the weeks with a live celse dated at or before now (course-stats.repository.ts:24)
  weeksOf: { type: text, component: Text, text: { key: CourseOverview.stats.weeksOf, params: { count: stats.weeks } }, in: [overview], when: "answer == 'ok'", source: apps/nizam/features/kosks/components/course-overview.tsx:359 }
  statsFailedAlert: { type: alert, component: Alert, role: alert, text: { key: CourseOverview.loadFailedTitle }, in: [overview], when: "answer == 'statsFailed'", source: apps/nizam/features/kosks/components/course-overview.tsx:333 } # an error Alert is role=alert; in the numbers' place
  statsFailedText: { type: text, component: Text, text: { key: CourseOverview.loadFailed }, in: [overview], when: "answer == 'statsFailed'", source: apps/nizam/features/kosks/components/course-overview.tsx:334 }
  statsRetry: { type: action, component: Button, role: button, intent: secondary, text: { key: CourseOverview.retry }, in: [overview], when: "answer == 'statsFailed'", emits: RETRY, source: apps/nizam/features/kosks/components/course-overview.tsx:335 } # router.refresh: the whole page is read again

