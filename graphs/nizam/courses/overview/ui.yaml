  rowEdit: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: CourseOverview.editSessionLabel, params: { name: session.title } }, text: { key: CourseOverview.editSession }, in: [overview], when: hasRows, repeat: sessions, emits: EDIT_SESSION, source: apps/nizam/features/kosks/components/course-overview.tsx:165 } # the same address, /edit (F-W4-1); none on a cancelled row

