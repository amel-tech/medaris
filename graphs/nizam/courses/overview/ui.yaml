  rowApplied: { type: text, component: Text, role: cell, text: { key: composed.CourseOverview.applied, params: { applied: applicant.applied } }, in: [overview], when: hasApplications, repeat: applications, source: apps/nizam/features/kosks/components/course-overview.tsx:196 }
