schema: delurio-graph/0
kind: needs
id: nizam.courses.curriculum
status: proposed
summary: >-
  What must exist for the köşk nazımı to edit a course's info, weeks, celses and resources in Müfredat and save them: the flow's
  product list. No replay has been run, so no `walked` entry names one: the unit specs under apps/nizam/test are listed as `test:`
  and are not e2e or replay. The nazar page's own list is in nazar.curriculum.edit and nazar.curriculum.resources; the needs below
  that are the same as theirs are named alike.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# missing (no code, Linear key `none`): a-refused-save-says-so, a-conflict-offers-the-current-course, unsaved-edits-survive-a-link, a-save-keeps-the-focus-and-says-it,
# hiding-says-what-it-does-and-keeps-the-place, a-refused-download-keeps-the-edits, reorder-the-course-list, name-each-row-and-field,
# a-failed-call-is-told, the-form-is-locked-while-it-is-sent, buttons-land-on-the-page-they-name
# unwalked (code, no e2e and no replay yet): add-a-week-or-a-celse, links-on-the-course-and-its-celses, attach-a-file, file-refusals-are-worded,
# taking-a-file-off-asks, download-a-file, a-save-over-someone-elses-is-refused, hide-a-week
# On this stack attach-a-file and file-refusals-are-worded cannot be walked at all (the replay cannot set a file input, and every upload answers 503);
# download-a-file can be walked as far as its refusal, the toast "Dosyalara şu an ulaşılamıyor.".

needs:
  - id: read-the-course-as-stored
    need: >-
      The köşk nazımı opens Müfredat of a course and finds it as stored: its name, cover colour, description, resources, weeks and
      celses, with nothing to save and nothing to undo until something is changed.
    evidence:
      - state: clean
      - node: pageTitle
      - node: nameField
      - node: weeksSummary
      - node: save
      - node: cancel
      - node: dirtyNote
      - source: apps/tedrisat/src/course/course.controller.ts:260
      - source: "apps/nizam/app/kosks/[id]/courses/[courseId]/curriculum/page.tsx:29"
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 1–2: a changed title shows the strip, Vazgeç puts it back, Kaydet keeps it across a reload"

  - id: see-that-something-is-unsaved
    need: >-
      While the form differs from what is stored a line says so and "Vazgeç" and "Kaydet" are on; "Vazgeç" puts the stored values
      back and the line goes. Nothing is written until Kaydet.
    evidence:
      - state: edited
      - node: dirtyNote
      - node: cancel
      - node: save
      - source: apps/nizam/features/courses/components/curriculum-editor.tsx:293
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 1–2: a changed title shows the strip, Vazgeç puts it back, Kaydet keeps it across a reload"
      - test: apps/nizam/test/curriculum-resources.spec.tsx

  - id: edit-and-save-the-whole-course
    need: >-
      The nazım changes the name, a celse's title or link, adds a week or a celse and saves with one press of Kaydet; everything
      changed is stored together or none of it is, the page says it was saved, and what was stored is there after a reload.
    evidence:
      - state: edited
      - state: saving
      - node: toastSavedTitle
      - node: toastSavedBody
      - source: apps/tedrisat/src/course/course.controller.ts:334
      - source: apps/nizam/features/courses/components/curriculum-editor.tsx:232
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 1–2: a changed title shows the strip, Vazgeç puts it back, Kaydet keeps it across a reload"
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 4: 'Haftayı kopyala' adds the week again seven days later and Kaydet keeps it"
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 5: a hidden session is gone from the course after Kaydet"

  - id: add-a-week-or-a-celse
    need: >-
      "Hafta ekle" and "Celse ekle" add a row to the draft that has no title; Kaydet stores it, and a celse added to a week takes
      the date of the week's last celse at 21:00 for 60 minutes.
    evidence:
      - state: edited
      - node: addWeek
      - node: addLesson
      - node: weekTitleField
      - node: sessionTitleField
      - source: apps/tedrisat/src/course/course.controller.ts:334
      - source: apps/nizam/features/courses/components/curriculum-editor.tsx:431
      - test: apps/nizam/test/course-views.spec.tsx

  - id: a-blank-stops-the-save
    need: >-
      A week, a celse or a resource row without a title or a name, and a meeting link that does not start with https, stop Kaydet;
      each says what is wrong under its field and nothing is sent.
    evidence:
      - state: invalid
      - node: weekTitleError
      - node: sessionTitleError
      - node: linkError
      - node: courseNameError
      - node: courseUrlError
      - node: lessonNameError
      - node: lessonUrlError
      - source: apps/nizam/features/courses/present.ts:941
      - source: apps/nizam/features/courses/components/curriculum-editor.tsx:234
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 3: an empty required field or an http link stops Kaydet"

  - id: a-refused-save-says-so
    need: >-
      A refused Kaydet tells the person it was refused and where: it moves the focus to the first field with an error, or says in
      a live region how many there are, also for a field inside a folded week.
    missing: no Linear issue; F-W4-2, F-X-2, F-UI-W4-1
    note: >-
      Drawn on the state invalid and on the nodes weekTitleError, sessionTitleError and linkError, which the code has: they are
      not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: copy-a-week
    need: >-
      "Haftayı kopyala" adds the week again seven days later, with the same titles, no links and nothing cancelled, as a new last
      week; Kaydet stores it.
    evidence:
      - state: edited
      - node: copyWeek
      - node: weeksSummary
      - source: apps/nizam/features/courses/present.ts:990
      - source: apps/nizam/features/courses/components/curriculum-editor.tsx:814
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 4: 'Haftayı kopyala' adds the week again seven days later and Kaydet keeps it"

  - id: hide-a-celse
    need: "\"Gizle\" takes a celse out of the draft and Kaydet hides it (it is archived, not deleted); the Arşiv restores it."
    evidence:
      - state: edited
      - node: hideSession
      - source: apps/tedrisat/src/course/course.controller.ts:334
      - source: apps/nizam/features/courses/components/curriculum-editor.tsx:568
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 5: a hidden session is gone from the course after Kaydet"

  - id: hide-a-week
    need: >-
      "Haftayı gizle" takes a week and its celses out of the draft and Kaydet hides them (archived, not deleted); the Arşiv
      restores them.
    evidence:
      - state: edited
      - node: hideWeek
      - source: apps/tedrisat/src/course/course.controller.ts:334
      - source: apps/nizam/features/courses/components/curriculum-editor.tsx:831
      - test: apps/nizam/test/course-views.spec.tsx

  - id: hiding-says-what-it-does-and-keeps-the-place
    need: >-
      The button that hides a celse or a week names its row, says that Kaydet is what hides it, and leaves the focus on the next
      row; the person can tell what was taken out.
    missing: no Linear issue; F-W4-3, F-W4-4, F-C-course-a-15, F-C-course-a-16
    note: >-
      Drawn on the state edited and on the nodes hideSession, hideWeek and dirtyNote, which the code has: they are not evidence,
      so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: links-on-the-course-and-its-celses
    need: >-
      The nazım adds, fills, removes and (on a celse) reorders links, each with a name, an optional short line and an http(s)
      address; Kaydet stores them in the order of the form, and one left out is deleted.
    evidence:
      - state: edited
      - node: addCourseLink
      - node: lessonAddLink
      - node: lessonRemove
      - node: courseRemove
      - node: courseUrl
      - node: lessonRowUrl
      - node: lessonMoveDown
      - source: apps/tedrisat/src/course/course.controller.ts:334
      - source: apps/nizam/features/courses/components/resources-editor.tsx:36
      - source: apps/nizam/features/courses/components/lesson-resources-editor.tsx:38
      - test: apps/nizam/test/curriculum-resources.spec.tsx

  - id: reorder-the-course-list
    need: >-
      The course's own resource list can be reordered, as a celse's can, without taking rows out and adding them again (which
      deletes a file for good).
    missing: no Linear issue; RESOURCES-1 (found in nazar)
    note: >-
      Drawn on the nodes courseRemove, lessonMoveUp and lessonMoveDown, which the code has: they are not evidence, so that a
      replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: attach-a-file
    need: >-
      "Dosya yükle" stores a file of at most 25 MB (a type the app takes) as the last resource of the course or of a stored celse
      at once, without Kaydet, and the next Kaydet keeps it and does not conflict.
    evidence:
      - state: uploadDialog
      - state: uploadingCourse
      - state: uploadingLesson
      - node: fileInput
      - node: sendButton
      - node: toastUploadedTitle
      - source: "apps/nazar/app/api/files/courses/[courseId]/resources/route.ts:18"
      - source: "apps/nazar/app/api/files/lessons/[lessonId]/resources/route.ts:17"
      - source: apps/nizam/features/courses/components/resource-file-parts.tsx:108
      - test: apps/nizam/test/curriculum-files.spec.tsx
      - test: apps/nizam/test/resource-files.spec.ts

  - id: file-refusals-are-worded
    need: >-
      A file that is empty, too large, of a type the app does not take, or an upload the server refuses (no store, no permission,
      no course) is told in words that name the cause, and the dialog stays open for another try; the file's own refusals are
      under the file field, the others are an alert.
    evidence:
      - node: pickMissingText
      - node: pickEmptyText
      - node: pickTooLargeText
      - node: pickWrongTypeText
      - node: uploadFailedStorage
      - node: uploadFailedRejected
      - node: uploadFailedGone
      - source: apps/nizam/features/courses/resource-files.ts:89
      - test: apps/nizam/test/resource-files.spec.ts

  - id: taking-a-file-off-asks
    need: >-
      Taking a stored file out of the list asks first and says that Kaydet deletes it for good and that Vazgeç of the page gives
      it back until then; a link goes at once.
    evidence:
      - state: removeFile
      - node: removeDialog
      - node: removeBody
      - node: removeWay
      - node: removeConfirm
      - node: removeCancel
      - source: apps/nizam/features/courses/components/resource-file-parts.tsx:65
      - test: apps/nizam/test/curriculum-files.spec.tsx

  - id: download-a-file
    need: >-
      A person who may read the course's content downloads a stored file through the app, as an attachment; a refusal says so on
      the page in words that name the cause.
    evidence:
      - state: downloading
      - node: courseFileLink
      - node: toastFileTitle
      - node: toastFileUnavailable
      - node: toastFileForbidden
      - node: toastFileGone
      - node: toastFileFailed
      - source: "apps/tedris/app/api/files/courses/[courseId]/resources/[resourceId]/route.ts:11"
      - source: "apps/nizam/app/api/files/courses/[courseId]/resources/[resourceId]/route.ts:11"
      - source: apps/nizam/features/courses/components/file-error-notice.tsx:19
      - test: apps/nizam/test/file-routes.spec.ts
      - test: apps/nizam/test/file-error-notice.spec.tsx

  - id: a-refused-download-keeps-the-edits
    need: >-
      A refused download, or a served one, leaves the page and its unsaved edits as they were; the refusal is a toast on the same
      page.
    missing: no Linear issue; NCURR-3
    note: >-
      Drawn on the states downloading and edited and on the node courseFileLink, which the code has: they are not evidence, so
      that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-save-over-someone-elses-is-refused
    need: When another person saved the course after the page read it, Kaydet writes nothing and says so.
    evidence:
      - state: saving
      - state: edited
      - node: toastFailedTitle
      - node: toastConflict
      - source: apps/tedrisat/src/course/course.controller.ts:334
      - source: apps/nizam/features/courses/components/curriculum-editor.tsx:246
      - test: apps/nizam/test/course-views.spec.tsx

  - id: a-conflict-offers-the-current-course
    need: >-
      After a refused save for a stale version the page offers the current course (and says what is discarded), so Kaydet does not
      keep answering 409 until the person reloads and loses the edits.
    missing: no Linear issue; NCURR-1
    note: >-
      Drawn on the state edited and on the nodes toastConflict and save, which the code has: they are not evidence, so that a
      replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: unsaved-edits-survive-a-link
    need: >-
      A link or a menu entry that leaves the page with unsaved edits asks first (or the browser is made to), instead of dropping
      them.
    missing: no Linear issue; F-W4-5, F-C-course-a-13
    note: >-
      Drawn on the state edited and on the nodes navSessions, navSettings, changeZone, generate and crumbCourses, which the code
      has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-save-keeps-the-focus-and-says-it
    need: >-
      After a save the focus is on a node that stays on the page, and the word that it was saved is a status line, not only a
      toast of six seconds.
    missing: no Linear issue; F-W4-8
    note: >-
      Drawn on the state clean and on the nodes save and toastSavedTitle, which the code has: they are not evidence, so that a
      replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-failed-call-is-told
    need: A save whose call fails outright (no network) unlocks Kaydet and says so.
    missing: no Linear issue; F-C-course-a-19
    note: >-
      Drawn on the state saving and on the node saveBusy, which the code has: they are not evidence, so that a replay still walks
      them (SPEC.md §13 leaves out what only missing needs name).

  - id: the-form-is-locked-while-it-is-sent
    need: >-
      While Kaydet is sent the fields and the row buttons are locked, so what the answer puts into the form cannot overwrite what
      the person typed meanwhile.
    evidence:
      - state: saving
      - node: weekTitleField
      - node: sessionTitleField
      - node: addWeek
      - source: apps/nizam/features/courses/components/curriculum-editor.tsx:337
      - test: apps/nizam/test/course-pages-in-flight.spec.tsx
        name: "has every field and row button off until the answer, then on again"
    note: >-
      Met on 23 Nov 2026 (NCURR-2): the form's sections are a <fieldset disabled> while the course is sent. Walked by no scenario
      and no browser e2e test.

  - id: name-each-row-and-field
    need: >-
      The buttons of a row (Gizle, Haftayı gizle, Celse ekle, Haftayı kopyala, Kaynağı çıkar, Yukarı taşı, Aşağı taşı) are named
      with their row, the fields of a celse are grouped by it, and a required field says it is required.
    missing: no Linear issue; F-W4-3, F-C-course-a-04, F-C-course-a-07
    note: >-
      Drawn on the nodes hideSession, hideWeek, addLesson, copyWeek, courseRemove, lessonRemove, lessonMoveUp, lessonMoveDown,
      sessionHeading and sessionTitleField, which the code has: they are not evidence, so that a replay still walks them (SPEC.md
      §13 leaves out what only missing needs name).

  - id: buttons-land-on-the-page-they-name
    need: >-
      The buttons of other pages named "Celse planla", "Ders ayarları", "Derse dön" and a celse's "Düzenle" open the page they
      name, not this one through /edit.
    missing: no Linear issue; F-W4-1, F-X-19 (nizam.courses.overview's buttons; the page they land on is this one)
    note: >-
      Drawn on the state clean, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves
      out what only missing needs name).
