# The screens of nizam.courses.curriculum: Müfredat of a course (/kosks/<id>/courses/<id>/curriculum) in nizam-web, its field errors, the dirty line,
# the toasts of a save, an upload and a refused download, the dialog "Dosya yükle" and the question "Dosya silinsin mi?". Read from
# apps/nizam/features/courses/components/{curriculum-editor,resources-editor,lesson-resources-editor,resource-file-parts,file-error-notice}.tsx and the
# shared libs/ui/src/mds components on 16 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nizam.json (namespace Curriculum, which the app reads as
# `nizam.Curriculum`) and common.json (`common.toast.close`) by script, letter for letter.
#
# Words that are not copied:
#   - Changes.note is the one message written for the graph: no app message says what Kaydet changes (what it hides, what it deletes, what an upload does
#     meanwhile, what a conflict leaves), so one short, factual Turkish note is authored. Each claim is the code's: curriculum-editor.tsx:78-90, payload.ts:21-27,
#     resource-file-parts.tsx:60-64, 97-107 and course.repository.ts:538 (a week or a celse left out is hidden, a resource left out is deleted).
#   - composed.Curriculum.fileName "{file}": the file's own name as the text of its link (resource-file-parts.tsx:49), data and not a message.
# The toasts are Sonner's (libs/ui/src/components/sonner.tsx), not the kit's toaster: one <li data-sonner-toast> with the title in [data-title] and the
# description in [data-description], no role; a success closes after six seconds, an error stays until it is closed.
# Where a node says "repeat", the page draws it once per item (per open week, per celse, per row); the replay finds the items through the binding. The page
# behind a dialog is drawn only where the dialog is closed: the dialog is modal, so the page is inert while it is open.
#
# Not drawn, and said in the flow's `scope.outOfView`: the cover colour's other findings, the badges, the week accordion's trigger and the folded weeks, the
# platform chip of a typed link, the three link helps ("Talebeler bağlantı olmadan…"), the errors of date, time and length, the empty-weeks alert, the
# eyebrow of the two dialogs (the course's or the celse's title) and a file row's type chip and size.
