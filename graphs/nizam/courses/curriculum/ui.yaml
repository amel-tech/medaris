rules:
  - { id: focus-not-set, rule: "Nothing in features/courses sets the focus on load or moves it after a step (no autoFocus, no .focus(); the page node has no initialFocus), so after navigation, a refused Kaydet, a save, a copied week and an added or taken out row the focus is wherever the browser leaves it (not verified in a browser). The dialogs begin where Base UI puts the focus: the question on 'Vazgeç' (alert-dialog.tsx:64), the upload dialog on its first tabbable element, the close icon (NCURR-5)." }
  - { id: F-W4-2, rule: "A Kaydet with errors only sets `sent` (curriculum-editor.tsx:234-237): the field errors appear under their fields, with no focus move, no summary and no alert, and an error inside a folded week is not seen at all, so 'nothing happens'; the same Field error has no role or live region (libs/ui/src/mds/field.tsx: Base UI Field.Error with id and aria-describedby only; F-X-2, F-UI-W4-1). Same as nazar's F-C-course-a-01. Fix: open the first week with an error, focus its field and add a summary role=alert naming the count." }
  - { id: F-W4-3, rule: "Identical names on every row: 'Gizle' on every celse (curriculum-editor.tsx:568-582), 'Celse ekle', 'Haftayı kopyala' and 'Haftayı gizle' on every week (:792-841), 'Kaynağı çıkar' and 'Yukarı taşı' / 'Aşağı taşı' on every resource (resources-editor.tsx:137-146, lesson-resources-editor.tsx:123-148). A screen-reader user in a list of buttons cannot tell which row one acts on, and the e2e has to scope by test id. Same as nazar's F-C-course-a-03. Fix: an aria-label with the row's title (the catalog has none; the hide page of nazar has hideWeekLabel and hideSessionLabel)." }
  - { id: F-W4-4, rule: "'Gizle' and 'Haftayı gizle' take the row out of the working copy at once (curriculum-editor.tsx:573-579, 817-819), with no question and no announcement, and Kaydet is what hides it (courses.e2e.ts#13: the celse ends archived); the focused button goes with the row, so the focus falls to the page (F-X-7, F-C-course-a-15). The word 'gizle' also says more than the click does: the row is only out of the draft until Kaydet, and 'Vazgeç' of the page is the only way back (the Arşiv restores it after). Same as nazar's F-C-course-a-16. Fix: move the focus to the next row or the week's 'Celse ekle' and say 'kaydedince gizlenir' in the dirty line." }
  - { id: F-W4-5, rule: "No beforeunload or router-leave guard (grep over app, features and components: none): 'Celseler', 'Ders ayarları', 'Saat dilimini değiştir', 'Haftalık celse üret', the breadcrumb, the shell's menu and Back all leave with every unsaved edit and no word. Only 'Haftalık celse üret' has a caption that warns, and it is not a live region and is drawn only while a celse exists (curriculum-editor.tsx:449-451, F-C-course-a-13). Fix: a beforeunload guard while `dirty`." }
  - { id: F-W4-8, rule: "After a successful save the form no longer differs, so the focused Kaydet becomes natively disabled (`disabled={!dirty}`, curriculum-editor.tsx:310) and the focus is lost; the shared Button keeps the focus only for the busy state (libs/ui/src/mds/button.tsx:29). The toast of six seconds is the only word of the save. Fix: keep it aria-disabled or move the focus to the h1 or a status line that says the course was saved." }
  - { id: F-W4-16, rule: "mayEditCourse lets a person who teaches the course through (features/kosks/kosk-abilities.ts:70-80), but the köşk layout forbids anyone whose landing is not nizam (app/kosks/layout.tsx:19-21), so a müderris who only teaches never reaches this page: a dead branch that says nizam is theirs. The page is the köşk nazımı's and the başnazım's. Fix: drop the branch or say it." }
  - { id: F-W4-17, rule: "The <title> is 'Müfredat' and the h1 is 'Müfredat' (page.tsx:19, curriculum-editor.tsx:289); the course's name is only in the paragraph and the breadcrumb, so two tabs of two courses read alike. Fix: put the course in the <title>." }
  - { id: F-W4-18, rule: "The placeholders of the link fields, 'https://zoom.us/j/…' (curriculum-editor.tsx:774) and 'https://…' (resources-editor.tsx:200, lesson-resources-editor.tsx:203), are hard-coded, not in the catalog; the other locales would read the same. Also F-X-17. Fix: move them to the catalog." }
  - { id: F-W4-1, rule: "Arrival, not behaviour: the overview's 'Müfredatı düzenle', 'Celse planla', 'Ders ayarları', a celse's 'Toplantı bağlantısı ekle' / 'Düzenle' and the Talebeler page's 'Derse dön' all link to /edit, which redirects here, so four of them land on a page that does not match their names (course-overview.tsx:81, students/page.tsx:52, edit/page.tsx:16; F-X-19). The page this flow draws is the one they all reach. Owned by nizam.courses.overview." }
  - { id: F-X-19, rule: "See F-W4-1: the nav graph's courseEdit page is a redirect to this page (nav: courseEdit)." }
  - { id: F-C-course-a-04, rule: "A celse's fields repeat the same labels in every celse (Celse başlığı, Kaynak, Tarih, Saat, Süre, Toplantı bağlantısı, and its resources' Kaynak adı, Kısa bilgi, Bağlantı) and the <li> is not a group (curriculum-editor.tsx:528-532), so a field's celse is not announced. Same as nazar's finding of the id. Fix: role=group with aria-labelledby the heading's id." }
  - { id: F-C-course-a-05, rule: "A celse's heading is an <h3> inside the week panel whose own heading is also an <h3> (curriculum-editor.tsx:534, libs/ui/src/mds/week-accordion.tsx:111, headingLevel default 3). Same as nazar's. Fix: weeks h3, celses h4." }
  - { id: F-C-course-a-06, rule: "A week's body list mixes items of different meaning in one <ol>: the first <li> holds the week's title and summary fields, the last one the three buttons (curriculum-editor.tsx:484, 774); the accordion's own 'Bu haftada henüz celse yok.' can never show, since the list is never empty. Same as nazar's. Fix: the fields and buttons outside the <ol>." }
  - { id: F-C-course-a-07, rule: "`Field required` draws only an aria-hidden star and no control carries `required` or aria-required (libs/ui/src/mds/field.tsx:43 holds the star, and its comment at :22 says the control carries `required` while the code does not; curriculum-editor.tsx:351-356, 478-486, 603-616, 674-682, 692-700, 710-718, resources-editor.tsx:148-156), and the form is noValidate, so 'required' is never announced. Same as nazar's. Fix: pass required to the control." }
  - { id: F-C-course-a-13, rule: "See F-W4-5: the caption of 'Haftalık celse üret' is the page's only warning of lost edits." }
  - { id: F-C-course-a-15, rule: "A control that removes its own row ('Gizle', 'Haftayı gizle', 'Kaynağı çıkar') leaves the focus on a removed element (curriculum-editor.tsx:568-582, 812-822, resources-editor.tsx:142, lesson-resources-editor.tsx:142); nothing moves it to the list or the next row. Same as nazar's (and F-X-7, F-W4-4)." }
  - { id: F-C-course-a-19, rule: "No try/catch around `await saveCurriculum(...)` (curriculum-editor.tsx:239-244): when the call itself fails (the network is down) `saving` stays true, Kaydet stays busy for good and nothing is said. A failed upload is caught ('Dosya gönderilemedi…'). Not verified at runtime. Same as nazar's. Fix: try/catch/finally and the generic toast." }
  - { id: F-C-course-a-25, rule: "The question's dialog is controlled and has no trigger element, so where the focus goes after 'Vazgeç' depends on Base UI's fallback to the previously focused element; the returnsFocus edge says so and was not verified. The upload dialog too (and it has no edge, since two buttons open it)." }
  - { id: EDIT-4, rule: "'Hafta ekle' and 'Celse ekle' (and 'Haftayı kopyala') are silent: the pressed button keeps the focus, nothing announces the new week or celse, and a new celse is appended above its button, which moves down (curriculum-editor.tsx:431-446, 776-810); the week is scrolled to the top (libs/ui/src/mds/week-accordion.tsx scrollOnOpen) and gets no focus. The same as nazar's EDIT-4. Fix: focus the new row's first field, or a status line 'Hafta {n} eklendi'." }
  - { id: RESOURCES-1, rule: "The course's own list has no move buttons; only a celse's rows can be reordered (resources-editor.tsx has none, lesson-resources-editor.tsx:123-136 has two). tedrisat stores the order as sent and the talebe sees it, so the only way to change the course's order is to take rows out and add them again, which deletes a file for good. The same as nazar's RESOURCES-1." }
  - { id: NCURR-1, rule: "A refused Kaydet for a stale version is an error toast only (curriculum-editor.tsx:246-253) and the page keeps its edits, its version and Kaydet on: pressing Kaydet again sends the same stale version and is refused again, and 'Vazgeç' puts back the values read at the old version. The only way on is to reload the page, which drops every edit, and the toast ('Sayfayı yenileyip yeniden deneyin.') does not say so. router.refresh() is called only on success (:264). nazar's page has a warning, a 'Güncel dersi yükle' button and says what is discarded. New finding (not in the inventory); decision D1. Fix: the same warning and button, or read the course again and keep the edits." }
  - { id: NCURR-2, rule: "Fixed on 23 Nov 2026. While a save was in flight only Kaydet (busy) and Vazgeç (off) changed: every field, 'Hafta ekle', 'Celse ekle', 'Haftayı kopyala', 'Gizle', 'Kaynak ekle' and 'Kaynağı çıkar' stayed live, and the answer replaces the form (curriculum-editor.tsx:256-260), so what was typed or pressed meanwhile was silently overwritten, or hid a row the save did not carry. The form's sections now sit in a <fieldset disabled={saving}> (:335-339, :851) and the tone radios, which are Base UI's and not native, take `disabled={saving}` (:369); the links stay live. As nazar's page does. Test: apps/nizam/test/course-pages-in-flight.spec.tsx ('has every field and row button off until the answer, then on again'). Not verified in a browser." }
  - { id: NCURR-3, rule: "A file's link is a plain <a> with no download attribute, on purpose (resource-file-parts.tsx:24-31): the browser leaves the page for it. A served file is saved and the page stays; a refusal (503 on this stack, 403, 404) is a 303 back to the page with ?fileError=, so the page is loaded anew and every unsaved edit is gone, with only the toast 'Dosya indirilemedi' to say something happened (libs/services/src/file-proxy/file-proxy.ts:351-371, file-error-notice.tsx:29). Not seen in a browser. New finding; decision D2. Fix: fetch the file and save the blob, so a refusal is a toast on the page that keeps its edits." }
  - { id: NCURR-4, rule: "While a file is on its way the dialog cannot be closed (resource-file-parts.tsx:192-197: onOpenChange returns when `busy`), yet its close icon and 'Vazgeç' are not disabled, so they look live and do nothing, and no text says why; 'Yükle' is busy and the status below says '<file> yükleniyor…'. Not verified in a browser. New finding. Fix: disable them while busy." }
  - { id: NCURR-5, rule: "The upload dialog does not say where the focus starts (`initialFocus` is not passed, resource-file-parts.tsx:190-200), so Base UI puts it on the first tabbable element, the close icon in the dialog's header, and the file field is the third stop. The question's dialog starts on 'Vazgeç' on purpose. Not verified in a browser. New finding. Fix: pass initialFocus to the file field." }
  - { id: NCURR-6, rule: "A stored file's link is named by the file's bare name ('ders-notu.pdf', resource-file-parts.tsx:48-50), with a type chip and a size beside it as plain text: no word says that it downloads, or that following it leaves the page (NCURR-3). nazar's link is named '<file> dosyasını indir' (Files.downloadLabel). Not verified with a screen reader. New finding. Fix: an aria-label or hidden text 'indir'." }
  - { id: NCURR-7, rule: "'Haftayı kopyala' copies a week's title, summary and celses with their titles and source lines, seven days later, and leaves out the meeting links and the celses' own resources (copyWeek, features/courses/present.ts:990-1017: link '', resources []) without saying so on the page; the copy is always the new LAST week whatever the copied week's place (nextNumber, curriculum-editor.tsx:195, 804), and its celses have no id yet, so their 'Dosya yükle' is off until Kaydet. Said only in a comment. New finding. Fix: say 'bağlantılar ve kaynaklar kopyalanmaz' beside the button or in the dirty line." }
  - { id: upload-failure-is-announced, rule: "A refusal of the server that is not about the file ends in an error Alert (role alert) inside the dialog, worded from the server's code; the file's own refusals are sentences under the field (no role). Holds, and the server's own message never reaches the page. On this stack the answer is 503 STORAGE_NOT_CONFIGURED, 'Dosya yükleme henüz açılmadı. Medaris yönetimine haber verin.'; not verified (no file can be sent here)." }
  - { id: file-removal-asks, rule: "Taking a file row off asks first, in an alertdialog whose focus starts on 'Vazgeç' and which the scrim does not close, because the Kaydet that follows deletes the file for good; a link goes at once and 'Vazgeç' of the page puts either back. Holds. The question names the file but not the list it leaves, and its title says 'silinsin' before anything is deleted." }
  - { id: upload-says-why-it-is-off, rule: "A celse added or copied on this page has 'Dosya yükle' off and a sentence beside it that says to save first ('Bu celseye dosya yüklemek için önce müfredatı kaydedin.'), but the sentence is a plain paragraph, not linked to the button by aria-describedby (lesson-resources-editor.tsx:226-236). Holds as to the words." }
