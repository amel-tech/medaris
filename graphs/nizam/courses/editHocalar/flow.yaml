# Changing the hocas of a köşk's course in nizam-web: the köşk nazımı presses "Hocaları düzenle" on a course's row of Dersler
# (/kosks/<id>/dersler) and edits the course's hoca list in a dialog. Read from the code of PR #394 on 15 Nov 2026
# (apps/nizam/features/courses/components/{muderris-dialog,team-picker}.tsx, features/courses/{present,actions}.ts,
# features/kosks/components/{kosk-course-table,kosk-courses-view}.tsx, features/kosks/overview-present.ts, and the API's
# GET /courses/:id, GET /users/lookup and PUT /courses/:id/muderris). Nothing here was walked: it is what the code says.
#
# The same dialog opens from Ders ayarları (/kosks/<id>/courses/<id>/ayarlar, "Hocaları düzenle" in the team card, drawn to the
# manager only: course-settings-page.tsx:407); that page is nizam.courses.settingsAndPublish. This flow starts on Dersler.
#
# What the page does today, and where it is wrong for its people (each finding is in ui.yaml `rules`):
#   - the dialog reads the whole course when it opens (GET /courses/:id) to get the list and its version, and the API writes a
#     content-read audit row for the nazım each time (F-W4-hocalar-1); the two skeleton bars of that read say nothing (F-W4-hocalar-2);
#   - Dersler offers the button on every own row to whoever reads the roster, a Medaris nazımı holding platform.kosk_edit included,
#     who meets "Bu işlem için yetkiniz yok." after building a list; Ders ayarları offers the same dialog to the manager only
#     (F-W4-hocalar-3);
#   - a hoca with no account is not in the dialog and a save deletes them (F-W4-hocalar-4); the dialog shows no unvan and a hoca
#     taken off loses theirs (F-W4-hocalar-5, the unvan is per course and is set in Ders ayarları);
#   - the e-mail is searched when the field is left as well as on Enter, and every search is audited (F-W4-20); the field is
#     disabled while it searches, so it loses the focus (F-W4-hocalar-6); "Vazgeç" and the close icon do nothing while the list is
#     saved (F-W4-hocalar-7); the hidden announcement outlives the person it names (F-W4-hocalar-8);
#   - "Kaydet" is natively disabled and says nothing of why (F-X-3); the field errors are not live regions while the list is empty
#     (F-UI-W4-1); the dialog's whole body is its description (F-UI-W1-1);
#   - a course that is gone while the dialog is open gets the generic toast and the dialog stays, and an address that is not valid
#     is not searched and nothing says so (F-W4-hocalar-9); the sentence about the removed hoca's permissions promises a decision
#     the dialog does not lead to (F-W4-hocalar-10);
#   - MDRS-221 (the list stale after a save, a lost first click) is open in Linear; from the code the list is read again after a save.
schema: delurio-graph/0
kind: flow
id: nizam.courses.editHocalar
status: captured
domain: medaris.api
ui: nizam.courses.editHocalar
title: Change the hocas of a course
summary: >-
  The köşk nazımı presses "Hocaları düzenle" on the row of one of the köşk's own courses on Dersler. The dialog reads the course
  (its hocas and its version) and lists the hocas who have an account, each with a radio for the imam and "Çıkar". She finds a
  person by the exact e-mail address of their account (searched on Enter or when the field is left), who is added at once, or
  told "Bu e-posta adresiyle kayıtlı bir hesap bulunamadı." / "Bu kişi zaten listede." / "Arama şu an yapılamadı. …"; she takes a
  hoca off with "Çıkar" (the last one too: the list then says "En az bir hoca olmalı."), and with several hocas she marks the
  imam, which the page asks for with "Birden çok hoca var; dersin imamını işaretleyin." when none is left. "Kaydet" comes on when
  the list differs from where it started and is complete; it sends the whole list with the version it was read at
  (PUT /courses/:id/muderris), a toast "Hocalar güncellendi" says so, the dialog closes and the list is read again. A refusal is a
  toast and the dialog stays open; a course someone else saved in the meantime is refused with its own sentence and the dialog
  reads the course again, which drops what she built. The save is written to the audit log.

scope:
  shows: >-
    the Dersler page with the course's row, the "Hocaları düzenle" dialog (the read of the course, the list, the e-mail search,
    "Çıkar", the imam's radios, "Kaydet" and "Vazgeç") and the toasts of the save
  world: open
  outOfView:
    - "the Dersler page's cards, tabs, other rows and row actions ('Düzenle', 'Gizle', 'Geri al', 'Dersi gör'): nizam.courses.list"
    - "a medrese's course, whose row has no 'Hocaları düzenle': the medrese picks its hocas (nazar.courses.changeHocas), and a hidden course, whose row has only 'Geri al'"
    - "the same dialog opened from Ders ayarları, and the unvan of each hoca, which is set there: nizam.courses.settingsAndPublish"
    - "the same change from the medrese's side, with its own pages and words: nazar.courses.changeHocas"
    - "a müderris who is only a müderris: nizam sends them to nazar (F-W4-16), so the 'teaches this course' branch of the abilities is never met here"
    - "a list of more than three accounts, the limit of 20, and the two accounts with no imam that an add would make (the model counts to three and adds one person)"
    - "undoing a change by changing it back (the list equals where it started again, 'Kaydet' goes off): not drawn; `changed` only turns on"
    - "an ended session: the read, the search and the save send the person to sign in (realm.auth.signIn) instead of drawing an error"
    - "what the removed hoca's own grants become: the sentence under the list says it is decided separately (nizam.grants.appoint)"

decisions:
  D1:
    question: >-
      Should Dersler offer "Hocaları düzenle" only to the manager, as Ders ayarları does? The row's button is drawn to every person
      who reads the roster (a Medaris nazımı holding platform.kosk_edit too), and the refusal comes only after the list is built and
      "Kaydet" is pressed (F-W4-hocalar-3).
    recommend: >-
      Gate the row's button with `mayAssignMuderris`, which the page already has for "Ders aç" and Ders ayarları, so that "Bu işlem
      için yetkiniz yok." is never the first word.
    affects: [listed]
  D2:
    question: >-
      Should the dialog show and keep each hoca's unvan? It lists names only, saving a list keeps the unvan of whoever stays, and a
      hoca taken off and added back after a save has none (F-W4-hocalar-5).
    recommend: >-
      Keep the unvan in Ders ayarları as decided on 15 Oct 2026, and say so in the dialog's intro, or warn before a removal that the
      hoca's unvan in this course goes with them.
    affects: [form, formReady]

context:
  team:
    values: [lone, pair]
    initial: any
    say:
      lone: "the course has one hoca with an account, the imam"
      pair: "the course has two hocas with accounts and the first is the imam"
  read:
    values: [ok, failed]
    initial: any
    say:
      ok: "the course reads: its hocas and its version"
      failed: "the course does not read: it is gone, or the server does not answer"
  lookup:
    values: [found, listed, notFound, down]
    initial: any
    say:
      found: "the realm has an account with the e-mail address she types, and it is not on the list"
      listed: "the address belongs to a hoca on the list as it was read"
      notFound: "the realm has no account with that address"
      down: "the realm's directory does not answer"
  answer:
    values: [saved, unknownUser, duplicate, invalid, forbidden, other]
    initial: any
    say:
      saved: "the server takes the list, unless somebody else has saved the course since it was read (`behind`)"
      unknownUser: "an account on the list is in neither Medaris nor the realm"
      duplicate: "the same account is on the list twice"
      invalid: "the imam is not among the listed accounts"
      forbidden: "the caller holds neither course.open_standalone nor madrasah.muderris_manage on the course"
      other: "anything else: the course is gone, a refused self-naming, the directory is down, a body the API does not take, the server does not answer"
  list:
    values: [lone, pair, trio, pairNoImam, empty]
    initial: lone
    say:
      lone: "one account, the imam"
      pair: "two accounts, an imam marked"
      trio: "three accounts, an imam marked"
      pairNoImam: "two accounts and no imam: the imam was taken off a list of three"
      empty: "nobody: the last hoca was taken off"
  changed: { values: [true, false], initial: false }
  added: { values: [true, false], initial: false }
  behind:
    values: [none, moved, reloaded]
    initial: none
    say:
      none: "nobody has saved the course since the dialog read it"
      moved: "somebody else saved the course's hocas after the dialog read it: its version moved"
      reloaded: "the dialog has read the course again after such a refusal"
  search:
    values: [idle, none, listed, down]
    initial: idle
    say:
      idle: "the field has no problem to show"
      none: "'Bu e-posta adresiyle kayıtlı bir hesap bulunamadı.' is up"
      listed: "'Bu kişi zaten listede.' is up"
      down: "'Arama şu an yapılamadı. Biraz sonra yeniden deneyin.' is up"
  said:
    values: [none, added]
    initial: none
    say: { none: "the hidden output says nothing", added: "the hidden output says '{name} seçildi'" }
  toast:
    values: [none, conflict, unknownUser, duplicate, invalid, forbidden, other]
    initial: none
    say:
      none: "no error toast is up"
      conflict: "an error toast says the course was saved by somebody else"
      unknownUser: "an error toast says an account was not found"
      duplicate: "an error toast says a person is listed twice"
      invalid: "an error toast says the list needs a hoca and an imam among them"
      forbidden: "an error toast says she may not"
      other: "an error toast says something went wrong"

guards:
  # `ready` is `disabled={!ready || loading || failed}` of "Kaydet" (muderris-dialog.tsx:93, 138): somebody is on the list and the imam
  # is one of them (`teamReady`), and the list differs from where it was read (`teamChanged`)
  ready: "changed and list in ['lone', 'pair', 'trio']"
  # what a search the model draws can lead to: one person is added once, to a list that is not past two accounts; an address nobody has
  # is searched once (the same string is not searched again until it changes); the hoca who is on the list as it was read
  searchable: "(lookup == 'found' and not added and list in ['lone', 'pair', 'empty']) or (lookup == 'notFound' and search == 'idle') or lookup == 'down' or (lookup == 'listed' and search == 'idle' and not changed)"

effects:
  openedLone: { set: { list: lone, changed: false, added: false, search: idle, said: none } }
  openedPair: { set: { list: pair, changed: false, added: false, search: idle, said: none } }
  reloadedPair: { set: { list: pair, changed: false, added: false, behind: reloaded, search: idle, said: none } }
  reloadedTrio: { set: { list: trio, changed: false, added: false, behind: reloaded, search: idle, said: none } }
  startSearch: { set: { search: idle } }
  addedToEmpty: { set: { list: lone, changed: true, added: true, search: idle, said: added } }
  addedToLone: { set: { list: pair, changed: true, added: true, search: idle, said: added } }
  addedToPair: { set: { list: trio, changed: true, added: true, search: idle, said: added } }
  alreadyListed: { set: { search: listed } }
  nobodyFound: { set: { search: none } }
  directoryDown: { set: { search: down } }
  imamLeftLone: { set: { list: empty, changed: true } }
  imamLeftPair: { set: { list: lone, changed: true } }
  imamLeftTrio: { set: { list: pairNoImam, changed: true } }
  otherLeftPair: { set: { list: lone, changed: true } }
  otherLeftTrio: { set: { list: pair, changed: true } }
  otherLeftPairNoImam: { set: { list: lone, changed: true } }
  imamMarked: { set: { changed: true } }
  imamMarkedOfNoImam: { set: { list: pair, changed: true } }
  courseMoved: { set: { behind: moved } }
  clearToast: { set: { toast: none } }
  conflictToast: { set: { toast: conflict } }
  unknownUserToast: { set: { toast: unknownUser } }
  duplicateToast: { set: { toast: duplicate } }
  invalidToast: { set: { toast: invalid } }
  forbiddenToast: { set: { toast: forbidden } }
  otherToast: { set: { toast: other } }

failures:
  reading:
    from: getCourse
    failed: [COURSE_NOT_FOUND, HTTP_400]
  looking:
    from: lookupUser
    unavailable: [KEYCLOAK_ADMIN_UNAVAILABLE, KEYCLOAK_ADMIN_NOT_CONFIGURED, USER_LOOKUP_FORBIDDEN, VALIDATION_ERROR]
  saving:
    from: setCourseMuderris
    conflict: [COURSE_VERSION_CONFLICT]
    unknownUser: [MUDERRIS_UNKNOWN_USER]
    duplicate: [MUDERRIS_DUPLICATE_USER]
    invalid: [MUDERRIS_LIST_INVALID]
    forbidden: [AUTHZ_FORBIDDEN]
    other: [COURSE_NOT_FOUND, SELF_GRANT_REFUSED, KEYCLOAK_ADMIN_UNAVAILABLE, VALIDATION_ERROR, HTTP_400]

# The story the page tells first, and what courses#4 walks: a course with two hocas, a third found by e-mail address and marked as the
# imam, the list saved.
main:
  given: { team: pair, read: ok, lookup: found, answer: saved }
  events: [OPEN_DIALOG, DONE, SEARCH, DONE, PICK_IMAM, SAVE, DONE]

initial: listed

states:
  listed:
    title: The köşk's courses are listed
    description: >-
      The Dersler page with the course's row: its title, its hocas as the course shows them ("{name} Hoca", or with the unvan it
      carries in this course; the imam's star only where the course has more than one hoca), the talebe, the registration chips,
      its state and the row's buttons. "Hocaları düzenle" is on every row of the köşk's own courses that is not hidden, whoever
      reads the page (F-W4-hocalar-3; D1); a medrese's course and a hidden one have none. The page keeps no focus of its own.
      Reading and filtering the list is nizam.courses.list.
    by: human
    on:
      OPEN_DIALOG: { target: reading, say: "they press 'Hocaları düzenle: {course}' on the row", source: apps/nizam/features/kosks/components/kosk-course-table.tsx:290 }
      NAVIGATE: { target: left, say: "they follow a link or the menu" }
    source: apps/nizam/features/kosks/components/kosk-course-table.tsx:361

  reading:
    title: Read the course
    description: >-
      The dialog opens and reads the course: GET /courses/:id (the server action readCourse), the whole course, to take its hocas
      and its version. For a caller who holds course.view_details and does not teach the course the API writes an audit row
      `course.content_read` each time (F-W4-hocalar-1). Two empty skeleton bars in an `aria-busy` box stand for the list and say
      nothing to a screen reader (F-W4-hocalar-2); "Kaydet" is off; "Vazgeç" and the close icon are live, and a close drops the
      answer. The dialog's own opening focus is on the close icon, the first thing it can focus; once the course is read the page
      moves the focus to the e-mail field (muderris-dialog.tsx:87), which this graph does not draw (rule `focus-not-set`). After a
      refused save for a moved version the same read runs again, with the error toast still up, and the list is what the server
      has now.
    invoke: { action: getCourse }
    on:
      DONE:
        - { guard: "read == 'ok' and behind == 'moved' and team == 'lone'", target: settle, effect: [reloadedPair], source: apps/nizam/features/courses/components/muderris-dialog.tsx:74, say: "the list is read again: the hoca and the one who saved in the meantime; what she built is gone" }
        - { guard: "read == 'ok' and behind == 'moved' and team == 'pair'", target: settle, effect: [reloadedTrio], source: apps/nizam/features/courses/components/muderris-dialog.tsx:74, say: "the list is read again with the person who saved in the meantime; what she built is gone" }
        - { guard: "read == 'ok' and team == 'lone'", target: settle, effect: [openedLone], source: apps/nizam/features/courses/components/muderris-dialog.tsx:74, say: "the list is the course's one hoca, the imam" }
        - { guard: "read == 'ok' and team == 'pair'", target: settle, effect: [openedPair], source: apps/nizam/features/courses/components/muderris-dialog.tsx:74, say: "the list is the course's two hocas, the first the imam" }
      FAIL.failed: { guard: "read == 'failed'", target: readFailed, source: apps/nizam/features/courses/components/muderris-dialog.tsx:70, say: "the read fails: 'Hocalar okunamadı' with 'Yeniden dene'" }
      CANCEL: { target: closed, source: apps/nizam/features/courses/components/muderris-dialog.tsx:134, say: "Vazgeç while the course is read: the dialog closes and the answer is dropped" }
      CLOSE: { target: closed, source: apps/nizam/features/courses/components/muderris-dialog.tsx:129, say: "the close icon or Esc while the course is read" }
    source: apps/nizam/features/courses/components/muderris-dialog.tsx:64

  readFailed:
    title: The course did not read
    description: >-
      The dialog shows an error Alert ("Hocalar okunamadı", "Ders bilgisi alınamadı.") and a "Yeniden dene" button, in place of the
      list; "Kaydet" is off. Every failure of the read is this one Alert: a course that is gone, a bad answer, a server that does
      not answer. "Yeniden dene" reads the course again.
    by: human
    on:
      RETRY: { target: reading, source: apps/nizam/features/courses/components/muderris-dialog.tsx:159, say: "they press 'Yeniden dene'" }
      CANCEL: { target: closed, source: apps/nizam/features/courses/components/muderris-dialog.tsx:134, say: "Vazgeç" }
      CLOSE: { target: closed, source: apps/nizam/features/courses/components/muderris-dialog.tsx:129, say: "the close icon or Esc" }
    source: apps/nizam/features/courses/components/muderris-dialog.tsx:156

  settle:
    title: Is "Kaydet" on?
    description: >-
      Not a screen: after every change to the list "Kaydet" is on or off. It is natively disabled (`disabled={!ready || loading ||
      failed}`) until the list differs from where it was read and is complete: somebody is on it, and with several accounts an imam
      is marked. Nothing on the page says why it is off (F-X-3); the two messages written for the empty list and the missing imam are
      live alerts.
    always:
      - { guard: ready, target: formReady, say: "the list is complete and has changed: the button is on" }
      - { target: form, say: "the list has not changed, or is not complete: the button is off" }
    source: apps/nizam/features/courses/components/muderris-dialog.tsx:93

  form:
    title: The dialog, "Kaydet" off
    description: >-
      "Hocaları düzenle" over the page, the course's title above its title, the intro with the course's title in bold, the list as
      the API has it (accounts only: a hoca with no account is not drawn, F-W4-hocalar-4; names only, no unvan, F-W4-hocalar-5),
      the e-mail field "Hoca" under it, and the footer "Değişiklikler denetim kaydına yazılır." with "Vazgeç" and "Kaydet". The list
      is a group "Seçilen hocalar" with a radio "{name} dersin imamı olsun" and "Çıkar" for each person, a badge "Dersin imamı" on the
      imam's row and a sentence under it ("Tek hoca dersin imamıdır." or the one about the permissions). "Çıkar" asks nothing and is
      live for the last hoca too; with several accounts and no imam "Birden çok hoca var; dersin imamını işaretleyin." is a live
      alert, and with nobody left "En az bir hoca olmalı." is. The e-mail is searched on Enter and when the field is left
      (F-W4-20); the outcome is the field's own error while the list is empty (no live region, F-UI-W4-1) and an alert once there
      is somebody on the list. The scrim does not close the dialog; its whole body is its description (F-UI-W1-1). Somebody else
      may save the course while it is open (`OTHER_SAVES`); nothing on the page tells her.
    by: human
    on:
      SEARCH: { guard: searchable, target: looking, effect: [startSearch], source: apps/nizam/features/courses/components/team-picker.tsx:80, say: "they type an e-mail address into 'Hoca' and press Enter, or leave the field" }
      REMOVE_IMAM:
        - { guard: "list == 'lone'", target: settle, effect: [imamLeftLone], source: apps/nizam/features/courses/present.ts:310, say: "they press the one hoca's 'Çıkar': the list is empty and says 'En az bir hoca olmalı.'" }
        - { guard: "list == 'pair'", target: settle, effect: [imamLeftPair], source: apps/nizam/features/courses/present.ts:310, say: "they press the imam's 'Çıkar': the other account is the imam now" }
        - { guard: "list == 'trio'", target: settle, effect: [imamLeftTrio], source: apps/nizam/features/courses/present.ts:310, say: "they press the imam's 'Çıkar': nobody is the imam, the page asks for one" }
      REMOVE_OTHER:
        - { guard: "list == 'pair'", target: settle, effect: [otherLeftPair], source: apps/nizam/features/courses/present.ts:310, say: "they press the other account's 'Çıkar': the imam stays, alone" }
        - { guard: "list == 'trio'", target: settle, effect: [otherLeftTrio], source: apps/nizam/features/courses/present.ts:310, say: "they press a non-imam account's 'Çıkar'" }
        - { guard: "list == 'pairNoImam'", target: settle, effect: [otherLeftPairNoImam], source: apps/nizam/features/courses/present.ts:310, say: "they press an account's 'Çıkar' while the imam is missing: the account left is the imam" }
      PICK_IMAM:
        - { guard: "list in ['pair', 'trio']", target: settle, effect: [imamMarked], source: apps/nizam/features/courses/components/team-picker.tsx:189, say: "they mark another account as the imam" }
        - { guard: "list == 'pairNoImam'", target: settle, effect: [imamMarkedOfNoImam], source: apps/nizam/features/courses/components/team-picker.tsx:189, say: "they mark one of the two accounts as the imam" }
      OTHER_SAVES: { guard: "behind == 'none'", target: settle, effect: [courseMoved], source: apps/tedrisat/src/course/course.repository.ts:837, say: "somebody else saves the course's hocas while this dialog is open: its version moves and nothing here says so" }
      CANCEL: { target: closed, source: apps/nizam/features/courses/components/muderris-dialog.tsx:134, say: "Vazgeç: the list is thrown away, nothing is saved" }
      CLOSE: { target: closed, source: apps/nizam/features/courses/components/muderris-dialog.tsx:129, say: "the close icon, or Esc: the list is thrown away, nothing is saved" }
    source: apps/nizam/features/courses/components/muderris-dialog.tsx:119

  formReady:
    title: The dialog, "Kaydet" on
    description: The same dialog with "Kaydet" on; pressing it sends the whole list with the version it was read at.
    by: human
    on:
      SEARCH: { guard: searchable, target: looking, effect: [startSearch], source: apps/nizam/features/courses/components/team-picker.tsx:80, say: "they look up another hoca" }
      REMOVE_IMAM:
        - { guard: "list == 'pair'", target: settle, effect: [imamLeftPair], source: apps/nizam/features/courses/present.ts:310, say: "they press the imam's 'Çıkar'" }
        - { guard: "list == 'trio'", target: settle, effect: [imamLeftTrio], source: apps/nizam/features/courses/present.ts:310, say: "they press the imam's 'Çıkar': nobody is the imam, the button goes off" }
        - { guard: "list == 'lone'", target: settle, effect: [imamLeftLone], source: apps/nizam/features/courses/present.ts:310, say: "they press the one hoca's 'Çıkar': the list is empty, the button goes off" }
      REMOVE_OTHER:
        - { guard: "list == 'pair'", target: settle, effect: [otherLeftPair], source: apps/nizam/features/courses/present.ts:310, say: "they press the other account's 'Çıkar'" }
        - { guard: "list == 'trio'", target: settle, effect: [otherLeftTrio], source: apps/nizam/features/courses/present.ts:310, say: "they press a non-imam account's 'Çıkar'" }
      PICK_IMAM:
        - { guard: "list in ['pair', 'trio']", target: settle, effect: [imamMarked], source: apps/nizam/features/courses/components/team-picker.tsx:189, say: "they mark another account as the imam" }
      OTHER_SAVES: { guard: "behind == 'none'", target: settle, effect: [courseMoved], source: apps/tedrisat/src/course/course.repository.ts:837, say: "somebody else saves the course's hocas while this dialog is open: its version moves and 'Kaydet' is still on" }
      SAVE: { target: saving, effect: [clearToast], source: apps/nizam/features/courses/components/muderris-dialog.tsx:95, say: "they press 'Kaydet'" }
      CANCEL: { target: closed, source: apps/nizam/features/courses/components/muderris-dialog.tsx:134, say: "Vazgeç: the list is thrown away, nothing is saved" }
      CLOSE: { target: closed, source: apps/nizam/features/courses/components/muderris-dialog.tsx:129, say: "the close icon, or Esc: the list is thrown away" }
    source: apps/nizam/features/courses/components/muderris-dialog.tsx:135

  looking:
    title: Look the person up
    description: >-
      The server action lookupUserByEmail, GET /users/lookup: the realm's directory is searched for the exact address (0 or 1
      account) and tedrisat writes the search to the audit log, found or not. An address that is not shaped like an e-mail address
      is not searched and nothing says so. The field is `disabled` and aria-busy while it runs, so it loses the focus and nothing
      gives it back (F-W4-hocalar-6); the hidden output says "Aranıyor…". A person found who is not on the list is added to it and
      the field is cleared, the output says "{name} seçildi" (F-W4-hocalar-8); a person already on the list, no account, or a
      directory that does not answer is the field's own error while the list is empty (no live region) and a live alert once
      somebody is on it. The rest of the dialog stays live; "Kaydet" keeps the state it had and is not drawn here.
    invoke: { action: lookupUser }
    on:
      DONE:
        - { guard: "lookup == 'found' and list == 'empty'", target: settle, effect: [addedToEmpty], source: apps/nizam/features/courses/components/team-picker.tsx:95, say: "the person is added and is the imam: one account" }
        - { guard: "lookup == 'found' and list == 'lone'", target: settle, effect: [addedToLone], source: apps/nizam/features/courses/components/team-picker.tsx:95, say: "the person is added; there are two accounts now and the imam stays who it was" }
        - { guard: "lookup == 'found' and list == 'pair'", target: settle, effect: [addedToPair], source: apps/nizam/features/courses/components/team-picker.tsx:95, say: "the person is added; there are three accounts" }
        - { guard: "lookup == 'listed'", target: settle, effect: [alreadyListed], source: apps/nizam/features/courses/components/team-picker.tsx:93, say: "'Bu kişi zaten listede.' and nobody is added; the field is cleared" }
        - { guard: "lookup == 'notFound'", target: settle, effect: [nobodyFound], source: apps/nizam/features/courses/components/team-picker.tsx:108, say: "'Bu e-posta adresiyle kayıtlı bir hesap bulunamadı.'; the address stays in the field and is not searched again until it changes" }
      FAIL.unavailable: { guard: "lookup == 'down'", target: settle, effect: [directoryDown], source: apps/nizam/features/courses/components/team-picker.tsx:110, say: "'Arama şu an yapılamadı. Biraz sonra yeniden deneyin.': every failure of the search is this one sentence, the 403 included" }
      CANCEL: { target: closed, source: apps/nizam/features/courses/components/muderris-dialog.tsx:134, say: "they close the dialog while the search runs: its answer is dropped" }
      CLOSE: { target: closed, source: apps/nizam/features/courses/components/muderris-dialog.tsx:129, say: "the close icon, or Esc, while the search runs: its answer is dropped" }
    source: apps/nizam/features/courses/components/team-picker.tsx:85

  saving:
    title: The list is on its way
    description: >-
      The server action setCourseMuderris calls PUT /courses/:id/muderris with the whole list (imam first), the imam and the
      version the dialog read. The API refuses a version that is no longer the course's, keeps the unvan of an account that stays,
      deletes the rows of the accounts taken off (a hoca with no account too, F-W4-hocalar-4), takes the MUDERRIS role from
      them, gives it to the newcomers, moves the imam flag, moves the course's version and writes the audit row
      `course.muderris_update`. "Kaydet" is busy (aria-disabled, "Yükleniyor" in its hidden output); the list's controls are
      disabled; "Vazgeç" and the close icon stay on and do nothing (F-W4-hocalar-7). A call that fails outright is caught and
      is the generic toast.
    invoke: { action: setCourseMuderris }
    on:
      DONE: { guard: "answer == 'saved' and behind != 'moved'", target: saved, source: apps/nizam/features/courses/components/muderris-dialog.tsx:111, say: "the list is saved" }
      FAIL.conflict: { guard: "answer == 'saved' and behind == 'moved'", target: reading, effect: [conflictToast], source: apps/nizam/features/courses/components/muderris-dialog.tsx:108, say: "somebody else saved the course: an error toast says so and the dialog reads the course again, which throws away the list she built" }
      FAIL.unknownUser: { guard: "answer == 'unknownUser'", target: settle, effect: [unknownUserToast], source: apps/nizam/features/courses/components/muderris-dialog.tsx:104, say: "an error toast says an account was not found; the dialog stays open with her list" }
      FAIL.duplicate: { guard: "answer == 'duplicate'", target: settle, effect: [duplicateToast], source: apps/nizam/features/courses/components/muderris-dialog.tsx:104, say: "an error toast says a person is listed twice; the page itself never lists a person twice" }
      FAIL.invalid: { guard: "answer == 'invalid'", target: settle, effect: [invalidToast], source: apps/nizam/features/courses/components/muderris-dialog.tsx:104, say: "an error toast says the course needs a hoca and an imam among them; the page itself never sends such a list" }
      FAIL.forbidden: { guard: "answer == 'forbidden'", target: settle, effect: [forbiddenToast], source: apps/nizam/features/courses/components/muderris-dialog.tsx:104, say: "an error toast says she may not; the dialog stays open (F-W4-hocalar-3)" }
      FAIL.other: { guard: "answer == 'other'", target: settle, effect: [otherToast], source: apps/nizam/features/courses/components/muderris-dialog.tsx:104, say: "an error toast says it could not be done, try again; a course that is gone is this one too (F-W4-hocalar-9); the dialog stays open" }
      CANCEL: { target: saving, source: apps/nizam/features/courses/components/muderris-dialog.tsx:122, say: "they press Vazgeç, or Esc, while the list is saved: nothing happens, the save goes on (onOpenChange is ignored while saving, F-W4-hocalar-7)" }
      CLOSE: { target: saving, source: apps/nizam/features/courses/components/muderris-dialog.tsx:122, say: "they press the close icon: nothing happens, the save goes on" }
    source: apps/nizam/features/courses/components/muderris-dialog.tsx:99

  saved:
    type: final
    title: The list is saved
    description: >-
      The toast "Hocalar güncellendi" names the course, the table is read again (`onSaved` is `router.refresh()`, and the action
      has revalidated /dersler), the dialog closes and the focus is meant to go back to the row's button. From the code the row has
      the new names at once: the MDRS-221 report of a stale list (3 Oct 2026) was not met in the code and not seen. The new hoca
      is shown as "{name} Hoca": the dialog gave them no unvan. Where the focus lands is not said by the code; not verified.

  closed:
    type: final
    title: The dialog is closed and nothing was saved
    description: The list she built is thrown away and the row is as it was. Where the focus lands is not said by the code; not verified.

  left:
    type: final
    title: They leave the page
    leavesPage: true

assertions:
  - { id: a-list-with-no-imam-is-never-sent, never: "state == 'saving' and list == 'pairNoImam'", say: "A list with several accounts and no imam is never sent: Kaydet is off and the page says 'Birden çok hoca var; dersin imamını işaretleyin.'.", source: apps/nizam/features/courses/present.ts:321 }
  - { id: an-empty-list-is-never-sent, never: "state == 'saving' and list == 'empty'", say: "A course always keeps a hoca: the empty list is never sent, Kaydet is off and the page says 'En az bir hoca olmalı.'.", source: apps/nizam/features/courses/present.ts:321 }
  - { id: an-unchanged-list-is-never-sent, never: "state == 'saving' and not changed", say: "A list that is the one the course already has is never sent: Kaydet is off until it differs.", source: apps/nizam/features/courses/components/muderris-dialog.tsx:92 }
  - { id: a-moved-course-is-never-overwritten, never: "state == 'saved' and behind == 'moved'", say: "A list built on a version somebody else has moved past is never saved: the API refuses it and the dialog reads the course again.", source: apps/tedrisat/src/course/course.repository.ts:837 }
