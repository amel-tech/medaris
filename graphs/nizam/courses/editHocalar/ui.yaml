edges:
  - { labelledBy: [hocasDialog, hocasTitle] }
  - { triggers: [rowEdit, reading] }
  - { triggers: [save, saving] }
  - { returnsFocus: [hocasDialog, rowEdit] } # Base UI gives the focus back to what had it when the dialog opened, the row's button; the table is read again after a save and the button keeps its key, so it should still be there: not looked at

rules:
  - { id: F-W4-16, rule: "mayEditCourse (features/kosks/kosk-abilities.ts:70-80) lets 'teaches this course' through, but app/kosks/layout.tsx:19-21 sends a person who is only a müderris to nazar, so no müderris edits the hocas from here: the branch is dead and the code suggests otherwise. Touched, not drawn: only the manager walks this flow." }
  - { id: F-W4-20, rule: "The hoca search runs on Enter and also when the field is left (team-picker.tsx:173, onBlur); the field's own help says every search is written to the audit log, so tabbing on, or pressing Vazgeç, with an address typed makes an audited lookup the person did not ask for and may add them to the list. Fix: search on Enter or an explicit 'Ara' button only." }
  - { id: F-X-14, rule: "The family of F-W4-20: e-mail lookups that run on blur in the four pickers of nizam." }
  - { id: F-X-3, rule: "'Kaydet' is natively disabled (muderris-dialog.tsx:138) while the course is read, until the list differs, and while an imam is missing, and nothing on the page says which: only the two cases with a message (the empty list, the missing imam) are explained, and they are live alerts. A keyboard or screen-reader user meets a dead button for an unchanged list. Fix: keep it enabled and answer on submit, or tie a reason to it with aria-describedby." }
  - { id: F-UI-W4-1, rule: "Field's error has no role=alert and no live region (libs/ui/src/mds/field.tsx): while the list is empty the outcomes of a search ('Bu e-posta adresiyle kayıtlı bir hesap bulunamadı.', 'Arama şu an yapılamadı. …') are the field's error and nothing announces them; once somebody is on the list the same sentences are a <p role=alert> and are announced (team-picker.tsx:272-276). The same sentence is announced or not by how many hocas the list has." }
  - { id: F-UI-W1-1, rule: "Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:103-112), so a screen reader may read the intro, the list and the field as the dialog's description when it opens. Fix: describe only the intro paragraph." }
  - { id: MDRS-221, rule: "Open in Linear (Backlog, 3 Oct 2026): the Dersler table was stale after a save and the first click on 'Müderrisleri düzenle' was lost. From the code the table is read again: the action revalidates /kosks/<id>/dersler (features/courses/actions.ts:23) and onSaved is router.refresh() (kosk-course-table.tsx:381). The lost first click and the stale row were not met in the code and not seen in a browser: not verified, and the walk's `saved` state is where it would show." }
  - { id: F-W4-hocalar-1, rule: "New, from the code, not seen. The dialog reads the whole course with GET /courses/:id (muderris-dialog.tsx:67) to take the list and its version, and for a caller who holds course.view_details and does not teach the course (the köşk nazımı) the API writes an audit row `course.content_read` each time (course.repository.ts:2349, MDRS-103): opening the dialog ten times writes ten content reads of a course whose programme and links the person did not ask to see. Fix: read only the hocas, or leave the dialog's read out of the content audit." }
  - { id: F-W4-hocalar-2, rule: "New, from the code, not seen. While the course is read the dialog shows two skeleton bars in an `aria-busy` box (muderris-dialog.tsx:151-155); the bars are aria-hidden and the box has no words and no live region, so a screen-reader user hears nothing for the read and the list appears silently. The dialog opens on the close icon, and the focus moves to the e-mail field only after the read (:87-89), with nothing said. Fix: a hidden status 'Hocalar okunuyor' while it reads." }
  - { id: F-W4-hocalar-3, rule: "New, from the code, not seen. Dersler draws 'Hocaları düzenle' on every own row to whoever reads the roster (rowActions, overview-present.ts:95-100, has no ability check): the route asks kosk.manage or platform.kosk_edit, so a Medaris nazımı holding platform.kosk_edit reads the page. Ders ayarları draws the same dialog to the manager only (`mayAssignMuderris`, course-settings-page.tsx:391), and the API asks course.open_standalone or madrasah.muderris_manage, which that nazım does not hold: they build a list and meet 'Bu işlem için yetkiniz yok.' at 'Kaydet' (courseErrorKey, present.ts:1225). kosk-abilities.ts:8-11 promises no visible button ends in a 403 (MDRS-108). Fix: gate the row's button with mayAssignMuderris." }
  - { id: F-W4-hocalar-4, rule: "New, from the code, not seen. A hoca who has no account (a legacy row, or one a medrese's course keeps) is not in the dialog: teamOfCourse keeps only the rows with a userId (present.ts:383), the list shows nobody for them and, if they are the only hoca, opens empty with 'En az bir hoca olmalı.' at once. A save deletes every row not in the list, the rows with no account included (course.repository.ts:1451-1453): the person disappears from the course and nothing warned. How such a row comes to a köşk's own course was not found in the code read. Fix: show them read-only, as the medrese's dialog does, and keep them." }
  - { id: F-W4-hocalar-5, rule: "New, from the code, not seen; by decision of 15 Oct 2026 the unvan is per course and is set in Ders ayarları. The dialog lists names only (the GET carries `unvan`, teamOfCourse drops it, present.ts:379-393) and the table behind it shows 'Prof. Dr. {name}' or '{name} Hoca'. A save keeps the unvan of an account that stays; a hoca taken off and saved loses their row and so the unvan they carried in this course, and one added again has none and shows as '{name} Hoca' until Ders ayarları sets it. Nothing in the dialog says so; the unit spec pins that no unvan select is drawn (course-create-unvan.spec.tsx). Fix: say it in the intro, or warn before a removal." }
  - { id: F-W4-hocalar-6, rule: "New, from the code, not seen (the same shape as F-W2-3 and nazar's HOCAS-3). The e-mail field is `disabled` and aria-busy while it searches (team-picker.tsx:160), so the focus it had is dropped and nothing gives it back: after Enter the person starts again from the top of the dialog, and only a hidden output says the search ended. Fix: keep the field enabled with aria-busy, or give the focus back when the search ends." }
  - { id: F-W4-hocalar-7, rule: "New, from the code, not seen (the same shape as F-W3-open-2). 'Vazgeç', the close icon and Esc do nothing while the list is saved (`if (!saving) onOpenChange(next)`, muderris-dialog.tsx:122) and are neither disabled nor marked busy. Fix: disable them while the list is on its way." }
  - { id: F-W4-hocalar-8, rule: "New, from the code, not seen (the same shape as F-W3-open-3 and nazar's HOCAS-2). The hidden <output> keeps saying '{name} seçildi' after that person is taken off the list with 'Çıkar' (team-picker.tsx:115, 271), and a removal says nothing: the screen-reader user is told the opposite of what the list holds. Fix: say the removal, or empty the output when the list changes." }
  - { id: F-W4-hocalar-9, rule: "New, from the code, not seen. A course that is gone while the dialog is open is the generic toast 'İşlem tamamlanamadı. Biraz sonra yeniden deneyin.' (COURSE_NOT_FOUND is not in CODES, present.ts:1219-1227): the dialog stays open on a course that no longer exists and tells her to try again, where the medrese's dialog says 'Bu ders artık yok.' and closes. A string that is not shaped like an e-mail address is not searched and nothing says so (team-picker.tsx:94): Enter does nothing. Fix: map COURSE_NOT_FOUND to its own sentence and close; say that an address is not valid." }
  - { id: F-W4-hocalar-10, rule: "New, from the code, not seen. Under a list of several hocas the dialog says 'Bir hocayı çıkardığınızda onun verdiği izinler için ayrıca karar verirsiniz.' (team-picker.tsx:259): the save only syncs the MUDERRIS roles (role-assignments.ts:212) and neither lists nor ends what the removed hoca granted, and the dialog does not say where that decision is made (İzinler, nizam.grants.appoint). A promise with no way to keep it from here. Fix: say where, with a link, or ask in the dialog." }
  - { id: focus-not-set, rule: "No code of features/kosks sets the focus when Dersler opens, after the dialog closes (a save or Vazgeç), or after 'Çıkar' removes the button that had it; the Base UI defaults are drawn (`returnsFocus`) and not verified. The dialog's own initial focus is meant to be the e-mail field (`initialFocus={emailRef}`, muderris-dialog.tsx:130), but the field exists only once the course is read, so the comment at :84-86 says the opening focus is on the first button and an effect moves it after the read (:87-89); the graph draws the first (the close icon) and not the second, since `form` is also entered from a finished search, where the field was disabled and the focus is on nothing. Not seen." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Hocaları düzenle' in 'Hocaları düzenle: {course}', 'Çıkar' in 'Hocayı listeden çıkar: {name}' (case aside); the dialog's close button is named by aria-label alone and has no visible text (WCAG 2.5.3). Holds." }
  - { id: no-confirmation-to-remove, rule: "'Çıkar' takes a hoca off the local list at once and nothing asks first; nothing is written until 'Kaydet', and 'Vazgeç' throws the list away. Holds; the unsaved list is lost silently on Esc, since nothing says it has changed." }
