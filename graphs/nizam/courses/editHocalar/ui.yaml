# The screens of nizam.courses.editHocalar: the Dersler page of a köşk (/kosks/<id>/dersler) with the row of the course, and the
# "Hocaları düzenle" dialog that the row's button opens, with the toasts of its save. Read from the code of PR #394
# (apps/nizam/features/kosks/components/{kosk-courses-view,kosk-course-table}.tsx, features/courses/components/{muderris-dialog,
# team-picker}.tsx, features/courses/present.ts, libs/ui/src/mds/{dialog,button,alert,field}.tsx); everything here is from the code,
# nothing was seen in a browser. The words are copied from libs/i18n/src/locales/tr/nizam.json (namespaces KoskCourses,
# MuderrisDialog, CourseTeamPicker) by script, letter for letter.
#
# Not in an i18n file, kept under `composed.`: composed.MuderrisDialog.eyebrow ("{title}", the course's title above the dialog's title
# and in bold in its intro, muderris-dialog.tsx:127, 147) and composed.Button.loading ("Yükleniyor", the hidden word of a busy Button,
# a default of libs/ui/src/mds/button.tsx:62: this dialog passes no loadingLabel). `Changes.note` is the one message the app has no
# equivalent of: no message of the app says what saving the list changes, so this graph carries one short Turkish sentence of its own.
#
# The catalog's `{name}` is the course's title in KoskCourses.editMuderrisLabel and MuderrisDialog.savedBody, and a person's name in
# CourseTeamPicker.chosen, .imamRadio and .removeLabel: one sample cannot be both, so `samples.name` is a person and the row's button
# on the page reads with a person's name in it (the binding gives the row's button its own locator).
#
# The page behind the dialog is drawn only where the dialog is closed: the dialog is modal and the page is inert while it is open.
# The skeleton of the read (two empty bars in an aria-busy box) has no node: nothing in it is exposed (F-W4-hocalar-2). The e-mail
# line under a newly found person's name and the placeholder of the field are not drawn.
