rules:
  - { id: focus-not-set, rule: "Nothing in sessions-view.tsx gives the page a focus when it opens, an inline form takes none when it opens (F-W4-9) and none is given back when it closes or after a write: the form unmounts and the focus falls to the document. The one focus the app sets is the confirmation's, on 'Vazgeç' (libs/ui/src/mds/alert-dialog.tsx:70), the safe end of a destructive question; that part is right." }
  - { id: F-W4-9, rule: "'Bağlantı ekle', 'Yüz yüze ayarı', 'Canlı yayın ekle' and 'Tarihi değiştir' open an inline form BELOW the whole table of celses ahead (sessions-view.tsx:535-667), with no focus move and no announcement; a keyboard user stays on the row's button and has to tab through the rest of the table to find it, and closing drops the focus again. The same as nazar's F-C-course-a-08 and F-L-17. Fix: focus the form's first field when it opens and the row's button when it closes." }
  - { id: F-W4-6, rule: "The family of F-W4-6 (the inventory lists other tables there, not this one): after a write the form closes, or the confirmation does and the row loses its buttons, and nothing gives the focus anywhere: the only word that the write was made is a toast, and a success toast closes after 6 seconds (sessions-view.tsx:246-257, :275-280). After a cancel the pressed button is gone with the row's buttons. Fix: focus the row's name cell or the table's caption, and keep a status line." }
  - { id: F-UI-W4-1, rule: "A refused 'Kaydet' says why only in the Field's error line (field.tsx:49-53), which is no live region and takes no focus: a screen-reader user does not know the send was refused. This holds for the link, the date and the stream field (the same as nazar's F-C-course-a-01). The stars of Tarih and Saat are decorative and the inputs carry no `required` (the same as F-C-course-a-07). Fix: role=alert on the error, or focus the first invalid field." }
  - { id: F-W4-11, rule: "Inventory: the visible text of 'Tarihi değiştir' and 'Canlı yayın ekle' is not in their names. MANAGE-6 of nazar.sessions.manage measures four, the catalog being the same: 'Bağlantıyı güncelle' is named '{when} celsesinin bağlantısını güncelle', 'Canlı yayın ekle' '{when} celsesine canlı yayın bağlantısı ekle', 'Canlı yayını güncelle' '{when} celsesinin canlı yayın bağlantısını güncelle' and 'Tarihi değiştir' '{when} celsesinin tarihini değiştir' (nizam.json Sessions.*Label). The other three hold: 'Bağlantı ekle', 'Yüz yüze ayarı' and 'İptal et'. Fix: begin each name with the visible text ('Tarihi değiştir: {when}')." }
  - { id: F-W4-12, rule: "The celse's title is a link with target=_blank and no word that says so (sessions-view.tsx:288-296), unlike 'Köşk sayfasını gör' on Dersler. NMSESS-3 is about where it goes. Fix: add the hidden '(yeni sekmede açılır)'." }
  - { id: F-W4-18, rule: "The placeholders 'https://zoom.us/j/…' (sessions-view.tsx:606) and 'https://studio.youtube.com/video/…' (:565) are written in the component, outside the catalog. They are language-neutral. The busy word 'Yükleniyor' of 'Kaydet' and of the confirm is the kit's own default (libs/ui/src/mds/button.tsx:62, F-UI-W1-3): Turkish only." }
  - { id: MANAGE-1, rule: "Cited, not repeated: PATCH /lessons/{id} writes no audit row for a changed link, time or in-person mark (apps/tedrisat/src/course/course.repository.ts:1555-1625); the stream (lesson.live_stream_set / _clear) and the cancel (lesson.cancel) are audited. Nobody can say afterwards which köşk nazımı moved a celse or changed its link. The binding's effect checks that none is written today." }
  - { id: MANAGE-3, rule: "Cited: the calendar invitation names how the celse is attended as of its last send, and the sweep re-sends one only when the start, the length or a title changed (lesson-invitation.repository.ts:226-233). A link, a stream or an in-person mark added later is told to nobody. Not verified in Mailpit." }
  - { id: MANAGE-4, rule: "Cited: a field error is cleared only when a form is opened again (sessions-view.tsx:144-166 call setProblem(null); saveEditing, :199-258, never does): after a refused 'Kaydet' a corrected value is sent with the old sentence still under the field, and a refused write brings the form back with it. From the code; not seen in a browser." }
  - { id: MANAGE-5, rule: "Cited: a meeting link can be replaced and never removed from this page. linkProblem says an empty link is allowed (present.ts:568-573, 'it is added later'), yet saveEditing refuses an empty field with 'Toplantı bağlantısı https:// ile başlamalı…' (sessions-view.tsx:219-223), and PATCH /lessons/{id} takes meetingUrl: null; the stream form has 'Bağlantıyı kaldır'. A link pasted by mistake can only be replaced by another https address. Decision D1." }
  - { id: CANCEL-4, rule: "Cited: the confirmation says only that the celse stays in the programme as 'İptal edildi' and that the talebe see it so (Sessions.cancelBody, cancelWay); it does not say that a cancellation cannot be taken back (no route of tedrisat un-cancels a celse) nor that the talebe are told at once by a notification and a calendar mail, and its confirm is a plain primary button (alert-dialog.tsx:46; no confirmVariant is passed). The same as nazar.sessions.cancel's, with F-C-course-a-20. Decision D3." }
  - { id: F-C-course-a-25, rule: "Cited: the AlertDialog is controlled (`open`) with no trigger element (sessions-view.tsx:700), so where the focus returns on Vazgeç or Esc is Base UI's fallback to the element that had it (the row's 'İptal et'; not verified), and after a cancel that button is gone with the row's buttons. Fix: pass the opener as finalFocus, or render the dialog with an AlertDialogTrigger." }
  - { id: F-C-course-a-26, rule: "Cited: while the cancel runs, Esc, the close icon and 'Vazgeç' do nothing and say nothing (`if (!busy && !next) setCancelling(null)`, sessions-view.tsx:702-704); only the confirm is busy. Fix: disable them with aria-disabled and say why." }
  - { id: NZDIS-6, rule: "Cited from nizam.nazims.dismiss: the toasts are Sonner's (sessions-view.tsx:4), whose region keeps its English default name 'Notifications alt+T' and is polite although an error stays until it is closed, while the page also mounts the kit's own toaster. The success toast is the only message that the write happened, and the focus has left (F-W4-6). A refusal's description names what went wrong: the version conflict, the stream's two states, 'Bu işlem için yetkiniz yok.' and the generic sentence." }
  - { id: NMSESS-1, rule: "New, from the code; not seen in a browser. No refusal reads the page again: `fail` (sessions-view.tsx:138-142) only shows the toast, and writeStream's refusal branch the same (:174-184); only a success calls refresh(). The page's `version` therefore stays the one it was read at. A write refused with COURSE_VERSION_CONFLICT says 'Sayfayı yenileyip yeniden deneyin.' and every press of Kaydet or of the confirm fails the same way until the person reloads the page by hand; the cancel dialog stays open over the stale rows, and a celse that was hidden meanwhile (LESSON_NOT_FOUND, worded 'İşlem tamamlanamadı…' by courseErrorKey, present.ts:1231-1240) keeps its row and its buttons. nazar re-reads the page on the version conflict and closes the cancel dialog on it (sessions-table.tsx:161-169, cancel-dialog.tsx:118): the same refusal is a retry there and a dead end here. This is MANAGE-2's cousin. Fix: call refresh() on a refusal that says the course moved or the celse is gone, and close the confirmation." }
  - { id: NMSESS-2, rule: "New, from the code. 'İptal et' here sends no note and offers no make-up: confirmCancel passes only the version (sessions-view.tsx:263-268), although cancelSession takes an optional `reason` (actions.ts:99-112) that no caller passes, and the API takes `reason` and `replacementLessonId`. A cancel from nazar carries the hoca's note and can add a make-up (nazar.sessions.cancel); a cancel from here tells the talebe nothing but 'İptal edildi', and tedris.celse.cancelled then reads the line that the hoca will set a new time. The köşk nazımı who cancels a celse because the hoca is ill cannot say so. Decision D2. Fix: the same dialog as nazar's, or the field for the note." }
  - { id: NMSESS-3, rule: "New, from the code (the route tree of apps/tedris/app has courses/[courseId]/lessons/[lessonId] and no sessions route); the 404 itself was not seen: a GET without a session is sent to sign-in on both addresses. The celse's title links to `${TEDRIS_URL}/courses/<course>/sessions/<celse>` (sessions-view.tsx:291), which is the API's path (GET /courses/:id/sessions/:id) and not tedris's page, `/courses/<course>/lessons/<celse>` (tedris.celse.attend, tedris.celse.cancelled). So the link, in a new tab (F-W4-12), lands on tedris's not-found page for every celse. No e2e opens it (nav.yaml's entry courseSessions->tedris is skipped in its binding). Fix: link to /lessons/<celse>." }
  - { id: NMSESS-4, rule: "New, from the code; not seen in a browser. 'Tarihi değiştir' checks that a date and a time are there and nothing more (sessions-view.tsx:227-237), and updateLesson takes any time (course.service.ts:1177-1196): a celse can be moved to a time that has passed. The row then leaves 'Yaklaşan celseler' for 'Geçmiş celseler' as 'Sona erdi' with 'Kayıt yok', its Katılım reads 'Eklenmedi' and no button can bring it back; the notifier leaves a celse moved into the past out of the talebe's notices (course-notifier.ts:94-111, 'one moved into the past [is] not news to the talebe'), so they may not be told. nazar's form is the same (nazar.sessions.manage describes it without a finding). Fix: refuse a time before now under the field." }
  - { id: toast-stays, rule: "An error toast stays until it is closed (sonner.tsx:21, :46), so after a refusal it is still on the screen when the form is closed and when another is opened; the graph keeps `toast` until the next open or send replaces it, and does not draw two toasts side by side. A success closes after six seconds, which a replay may not wait for." }
  - { id: stale-cancel-is-refused, rule: "Holds: a cancel carries the course version the page was read at and nothing else (sessions-view.tsx:263-268), so a page that went stale is refused with COURSE_VERSION_CONFLICT. nazar's cancel with a make-up carries the version the batch left and goes through on a stale page (CANCEL-2); this page has no make-up and has no such hole." }
