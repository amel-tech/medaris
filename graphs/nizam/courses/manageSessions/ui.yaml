# The screens of nizam.courses.manageSessions: Celseler (/kosks/<id>/courses/<id>/sessions) with its table of celses ahead, the four inline forms
# (meeting link, date and time, in-person mark, stream link), the confirmation of "İptal et", the toasts of every write and the table of celses
# already over. Read from apps/nizam/app/kosks/[id]/courses/[courseId]/sessions/page.tsx and features/courses/components/{sessions-view,attendance-cell}.tsx,
# features/courses/{present,attendance,actions,reads}.ts and libs/ui/src/mds/{alert-dialog,breadcrumb,button,field,radio-group,table}.tsx, libs/ui/src/components/sonner.tsx,
# on 16 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nizam.json and common.json by script, letter for letter (the app reads them as `nizam.<key>`
# and `common.<key>`; the key here is the path inside the file). Nothing was opened in a browser: every role, name and focus is from the code.
#
# Authored, not copied: `Changes.note`, the one message of this catalog no app message stands for (nothing in the app says what these writes change
# and who is told); each of its sentences was checked against lesson.controller.ts, course.repository.ts (cancelLesson, updateLesson),
# course-notifier.ts and the invitation sweep.
# Built in code, in no i18n file (each is named by its line):
#   composed.Button.loading            libs/ui/src/mds/button.tsx:62 (the default loadingLabel of a busy Button, F-UI-W1-3)
#   composed.Sessions.courseName       "{course}", the course's title in the breadcrumb's middle item, in a <bdi> (sessions-view.tsx:478, breadcrumb.tsx:55)
#   composed.Sessions.rowTitle         "{title}", a celse's title in the row header and the confirmation's eyebrow, in a <bdi> (sessions-view.tsx:295, :705)
#   composed.Sessions.counts           "{count} celse · Hafta {range}": Sessions.count and Sessions.weekRange joined with " · " in one span (sessions-view.tsx:514-524)
#   composed.Sessions.countsCancelled  the same with "{cancelled} iptal edildi" in the middle, once a celse ahead is cancelled
#   composed.Sessions.timeLine         "{when} · {minutes} dk": the celse's time, then Sessions.minutes after a "· " (sessions-view.tsx:306-313)
#   composed.Sessions.platform         "{platform}", the chip's label for a known platform (libs/ui/src/mds/platform-chip.tsx:9-15, attendance-cell.tsx:48)
# Where a node says "repeat", the page draws it once per row of its table; the replay finds the rows through the binding. The page behind a dialog is
# inert, so no page node is `in` a dialog state; the toasts are Sonner's, drawn in a portal of their own, so they are. The forms are NOT dialogs: the page
# stays live while one is open. A Sonner toast is one <li data-sonner-toast> with the title in [data-title], the description in [data-description] and a
# close button, and no role (the same as nizam.nazims.dismiss).
