  savingLink:
    title: The link is on its way
    description: >-
      patchLesson calls PATCH /lessons/{id} with {version, meetingUrl}: the version the page was read at. The course's version is checked and
      bumped in one statement, so a stale page changes nothing (409). The write leaves NO audit row (MANAGE-1). "Kaydet" is busy (aria-busy and a
      hidden "Yükleniyor" from a default of the kit, F-UI-W1-3) and "Vazgeç" is natively off; the field stays live and an old sentence under it
      stays too. A success keeps the version the answer carries, closes the form, shows the toast and reads the page again: the row's button
      reads "Bağlantıyı güncelle", its "Katılım" names the platform and, when nothing else was there, "Eksik" is gone. The talebe of the course
      read the link on the celse's page from then on; nobody is told and no new calendar invitation goes (MANAGE-3). A refusal is an error toast;
      the form stays open and the page is NOT read again, whatever the refusal (NMSESS-1).
    invoke: { action: updateLesson }
    on:
      DONE: { guard: "changeAnswer == 'saved'", target: listed, effect: [closedAfterLink], source: apps/nizam/features/courses/components/sessions-view.tsx:246, say: "the toast 'Bağlantı kaydedildi', the form closes, the page is read again" }
      FAIL.moved: { guard: "changeAnswer == 'moved'", target: linkForm, effect: [movedToast], source: apps/nizam/features/courses/components/sessions-view.tsx:242, say: "the error toast says the course was saved by someone else and asks them to reload; the form stays open and the page is NOT read again (NMSESS-1)" }
      FAIL.forbidden: { guard: "changeAnswer == 'forbidden'", target: linkForm, effect: [forbiddenToast], source: apps/nizam/features/courses/components/sessions-view.tsx:242, say: "the error toast says they have no authority for this; the form stays open" }
      FAIL.failed: { guard: "changeAnswer == 'failed'", target: linkForm, effect: [failedToast], source: apps/nizam/features/courses/components/sessions-view.tsx:242, say: "the error toast says it could not be completed; the form stays open and the page is NOT read again (NMSESS-1)" }
      # The link, a plain <a>, stays live while the write runs: the browser leaves the page at once, and the write already sent is the
      # server's to finish (not verified); no page is left to say how it went.
      OPEN_PLAN: { target: plan_opened, source: apps/nizam/features/courses/components/sessions-view.tsx:494, say: "they follow 'Celse planla' while the write runs: the page goes at once" }
    source: apps/nizam/features/courses/components/sessions-view.tsx:239

