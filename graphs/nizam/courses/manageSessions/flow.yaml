    description: >-
      setLiveStream calls PUT /lessons/{id}/live-stream with {liveStreamUrl}. The server parses it again and stores it normalised as
      https://www.youtube.com/live/<id>; it takes one only for a LIVE celse that is not cancelled. The course's version is neither sent nor bumped.
      The audit row lesson.live_stream_set is written (unlike the link, MANAGE-1). A success lays the link over the course read at once, closes
      the form, and clears "Eksik" for a celse with no other way in. A link the server's parser refuses is its sentence under the field (the form
      stays open); a celse that is not live or was cancelled meanwhile, a refused permission and anything else are an error toast and no new
      read (NMSESS-1).
    invoke: { action: setLessonLiveStream }
    on:
      DONE: { guard: "streamAnswer == 'saved'", target: listed, effect: [closedAfterStream], source: apps/nizam/features/courses/components/sessions-view.tsx:186, say: "the toast 'Canlı yayın bağlantısı kaydedildi', the form closes" }
      FAIL.invalid: { guard: "streamAnswer == 'invalid'", target: streamForm, effect: [saidStream], source: apps/nizam/features/courses/components/sessions-view.tsx:176, say: "the server's own sentence stands under the field; the form stays open" }
      FAIL.moved: { guard: "streamAnswer == 'moved'", target: streamForm, effect: [movedToast], source: apps/nizam/features/courses/components/sessions-view.tsx:179, say: "the error toast says only a live celse takes a stream, or that the celse was cancelled; no new read (NMSESS-1)" }
      FAIL.forbidden: { guard: "streamAnswer == 'forbidden'", target: streamForm, effect: [forbiddenToast], source: apps/nizam/features/courses/components/sessions-view.tsx:179, say: "the error toast says they have no authority for this (session.live_link was taken away)" }
      FAIL.failed: { guard: "streamAnswer == 'failed'", target: streamForm, effect: [failedToast], source: apps/nizam/features/courses/components/sessions-view.tsx:179, say: "the error toast says it could not be completed" }
      # The link, a plain <a>, stays live while the write runs: the browser leaves the page at once, and the write already sent is the
      # server's to finish (not verified); no page is left to say how it went.
      OPEN_PLAN: { target: plan_opened, source: apps/nizam/features/courses/components/sessions-view.tsx:494, say: "they follow 'Celse planla' while the write runs: the page goes at once" }
    source: apps/nizam/features/courses/components/sessions-view.tsx:169

  removingStream:
    title: The stream link is being cleared
    description: >-
      The same call with {liveStreamUrl: null}; the audit row is lesson.live_stream_clear. The toast reads "Canlı yayın bağlantısı kaldırıldı" and
      a celse that had no other way in reads "Eksik" again. "Kaydet", "Bağlantıyı kaldır" and "Vazgeç" are off while it runs.
    invoke: { action: setLessonLiveStream }
    on:
      DONE: { guard: "streamAnswer == 'saved' or streamAnswer == 'invalid'", target: listed, effect: [closedAfterRemoval], source: apps/nizam/features/courses/components/sessions-view.tsx:186, say: "the toast 'Canlı yayın bağlantısı kaldırıldı', the form closes (a clear is never refused for its link, so an `invalid` answer does not meet it)" }
      FAIL.moved: { guard: "streamAnswer == 'moved'", target: streamForm, effect: [movedToast], source: apps/nizam/features/courses/components/sessions-view.tsx:179, say: "the error toast says the celse is not live or was cancelled" }
      FAIL.forbidden: { guard: "streamAnswer == 'forbidden'", target: streamForm, effect: [forbiddenToast], source: apps/nizam/features/courses/components/sessions-view.tsx:179, say: "the error toast says they have no authority for this" }
      FAIL.failed: { guard: "streamAnswer == 'failed'", target: streamForm, effect: [failedToast], source: apps/nizam/features/courses/components/sessions-view.tsx:179, say: "the error toast says it could not be completed" }
      # The link, a plain <a>, stays live while the write runs: the browser leaves the page at once, and the write already sent is the
      # server's to finish (not verified); no page is left to say how it went.
      OPEN_PLAN: { target: plan_opened, source: apps/nizam/features/courses/components/sessions-view.tsx:494, say: "they follow 'Celse planla' while the write runs: the page goes at once" }
    source: apps/nizam/features/courses/components/sessions-view.tsx:169

  confirmCancel:
    title: İptal et asks once
    description: >-
      A confirmation over the page: an alertdialog "Celseyi iptal et" whose eyebrow is the celse's title and whose body says "{date} celsesi
      iptal edilecek; talebeler programda “İptal edildi” görür ve toplantı bağlantısı gösterilmez." and "İptal edilen celse programda kalır."; it
      does not say that the cancel is final or that the talebe are told at once (CANCEL-4, D3), and asks for no note and offers no make-up
      (NMSESS-2, D2). The page behind is inert and the scrim does not close it. The focus starts on "Vazgeç" (the app sets it). The footer has
      "Vazgeç" and "Celseyi iptal et", a plain primary button, not styled as destructive (F-C-course-a-20 of nazar's dialog). The dialog is
      controlled with no trigger element, so where the focus goes when it closes is the library's fallback (F-C-course-a-25, not verified).
      A refusal keeps it open over the toast: the stale version stays and the same press fails again (NMSESS-1).
    by: human
    on:
      CONFIRM: { target: cancelling, effect: [sends], source: apps/nizam/features/courses/components/sessions-view.tsx:711, say: "they press 'Celseyi iptal et'" }
      CANCEL:
        - { guard: "under == 'link'", target: linkForm, source: apps/nizam/features/courses/components/sessions-view.tsx:703, say: "Vazgeç, the close icon or Esc: the dialog closes, nothing is sent, and the link form it was opened over is there as it was" }
        - { guard: "under == 'time'", target: timeForm, source: apps/nizam/features/courses/components/sessions-view.tsx:703, say: "Vazgeç, the close icon or Esc: the dialog closes, nothing is sent, and the time form it was opened over is there as it was" }
        - { guard: "under == 'inPerson'", target: inPersonForm, source: apps/nizam/features/courses/components/sessions-view.tsx:703, say: "Vazgeç, the close icon or Esc: the dialog closes, nothing is sent, and the in-person form it was opened over is there as it was" }
        - { guard: "under == 'stream'", target: streamForm, source: apps/nizam/features/courses/components/sessions-view.tsx:703, say: "Vazgeç, the close icon or Esc: the dialog closes, nothing is sent, and the stream form it was opened over is there as it was" }
        - { target: listed, source: apps/nizam/features/courses/components/sessions-view.tsx:702, say: "Vazgeç, the close icon or Esc: the dialog closes and nothing is sent" }
    source: apps/nizam/features/courses/components/sessions-view.tsx:700

  cancelling:
    title: The cancel is on its way
    description: >-
      cancelSession calls POST /lessons/{id}/cancel with the course version the page holds and no reason (the action takes one, the page passes
      none: NMSESS-2). tedrisat checks the version first. A success writes the cancellation and its audit row (lesson.cancel), tells the talebe who
      hold a seat (a SESSION_CANCELLED notification with no note, to every enrolled seat but the actor, for a celse with a time that is not over)
      and kicks the invitation sweep, which mails the calendar's CANCEL. The confirm is busy ("Yükleniyor" for a reader of the screen) while the
      call runs, and Esc, the close icon and "Vazgeç" do nothing and say nothing (F-C-course-a-26, as in nazar). A refusal is an error toast and the
      dialog stays open; the page is not read again (NMSESS-1).
    invoke: { action: cancelLesson }
    on:
      DONE: { guard: "cancelAnswer == 'done'", target: cancelledShown, effect: [cancelled], starts: { flow: tedris.celse.cancelled, given: { lesson: "'session'", makeUp: "'none'", note: "'none'" } }, source: apps/nizam/features/courses/components/sessions-view.tsx:275, say: "the celse is cancelled with no note and no make-up: the talebe read it on the celse's page" }
      FAIL.moved: { guard: "cancelAnswer == 'moved'", target: confirmCancel, effect: [movedToast], source: apps/nizam/features/courses/components/sessions-view.tsx:271, say: "the error toast asks them to reload; the dialog stays open and a second press fails the same way (NMSESS-1)" }
      FAIL.already: { guard: "cancelAnswer == 'already'", target: confirmCancel, effect: [alreadyToast], source: apps/nizam/features/courses/components/sessions-view.tsx:271, say: "the error toast says the celse is cancelled already; the dialog stays open and the row still has its buttons" }
      FAIL.forbidden: { guard: "cancelAnswer == 'forbidden'", target: confirmCancel, effect: [forbiddenToast], source: apps/nizam/features/courses/components/sessions-view.tsx:271, say: "the error toast says they have no authority for this" }
      FAIL.failed: { guard: "cancelAnswer == 'failed'", target: confirmCancel, effect: [failedToast], source: apps/nizam/features/courses/components/sessions-view.tsx:271, say: "the error toast says it could not be completed" }
      CANCEL: { target: cancelling, source: apps/nizam/features/courses/components/sessions-view.tsx:703, say: "they press Vazgeç, the close icon or Esc while the cancel runs: nothing happens and nothing says so, the cancel goes on (F-C-course-a-26)" }
    source: apps/nizam/features/courses/components/sessions-view.tsx:260

  cancelledShown:
    title: The celse reads "İptal edildi"
    by: human
    description: >-
      The dialog is closed and the page is read again. The row of the celse now has the outline badge "İptal edildi" in its state cell, "—" for
      its Katılım (and, visually hidden, "Bağlantı gösterilmez": the link is no longer shown), no buttons (a hidden "İşlem yok" in their place);
      the counts line gains "· 1 iptal edildi"; the celse stays in "Yaklaşan celseler" until its time is over. A toast says "Celse iptal edildi"
      with "{name} iptal edildi." (it closes by itself after 6 seconds). The pressed button went with its row, and the dialog had no trigger
      element to give the focus back to, so no code moves the focus and it falls to the document (F-C-course-a-25, F-W4-6); the toast is the only
      word that says what was done. The talebe now read the celse's page (tedris.celse.cancelled, started on the way here): no note and no
      make-up, "Programım" shows it cancelled.
    on:
      OPEN_PLAN: { target: plan_opened, source: apps/nizam/features/courses/components/sessions-view.tsx:493, say: "they follow 'Celse planla'" }
      NAVIGATE: { target: left, source: apps/nizam/features/courses/components/sessions-view.tsx:474, say: "they follow the breadcrumb or the menu" }
    source: apps/nizam/features/courses/components/sessions-view.tsx:336

  plan_opened:
    title: Celse planla opens
    description: "'Celse planla' leads to /kosks/<id>/courses/<id>/sessions/new: nizam.courses.planSessions."
    type: final
    leavesPage: true

  left:
    title: They leave the page
    type: final
    leavesPage: true

assertions:
  - id: a-link-is-sent-only-after-the-page-accepts-it
    never: "state == 'savingLink' and entered != 'valid'"
    say: An address the page refuses (empty, http:// or not an address) is never sent.
    source: apps/nizam/features/courses/components/sessions-view.tsx:218
  - id: a-time-is-sent-only-with-a-date-and-a-time
    never: "state == 'savingTime' and entered != 'valid'"
    say: A time with the date or the hour missing is never sent.
    source: apps/nizam/features/courses/components/sessions-view.tsx:227
  - id: a-stream-is-sent-only-after-the-parser-accepts-it
    never: "state == 'savingStream' and entered != 'valid'"
    say: A stream link the parser refuses is never sent; clearing one is its own button.
    source: apps/nizam/features/courses/components/sessions-view.tsx:202
  - id: a-refused-page-offers-nothing
    never: "access == 'refused' and state != 'opened' and state != 'no_access'"
    say: A person who may not open the course meets the refusal screen and no row, no form, no dialog.
    source: apps/nizam/features/courses/reads.ts:46
  - id: a-cancelled-row-is-shown-only-after-a-cancel
    never: "state == 'cancelledShown' and toast != 'cancelled'"
    say: The cancelled row is drawn only after a cancel went through.
    source: apps/nizam/features/courses/components/sessions-view.tsx:336
