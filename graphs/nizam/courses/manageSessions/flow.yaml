# Celseler of a course in nizam-web (/kosks/<id>/courses/<id>/sessions), where the köşk's nazımı sets how each celse is attended, moves a celse
# and cancels one. Read from the code of PR #394's branch on 16 Nov 2026 (apps/nizam/app/kosks/[id]/courses/[courseId]/sessions/page.tsx,
# features/courses/components/sessions-view.tsx, present.ts, actions.ts, attendance.ts; the API's PATCH /lessons/{id}, PUT /lessons/{id}/live-stream
# and POST /lessons/{id}/cancel). It says what the code does today, and nothing here was opened in a browser. nazar-web has the same page for the
# course's staff: nazar.sessions.manage and nazar.sessions.cancel were written first, and this flow follows their shape and their variable names.
# Where the two pages share a component the finding is theirs and is cited here, not written again:
#   - MANAGE-1: PATCH /lessons/{id} writes no audit row for a link, a time or an in-person mark (the same route);
#   - MANAGE-3: the calendar invitation does not follow a change of link, stream or in-person mark (the same sweep);
#   - MANAGE-4: a field error is cleared only when a form is opened again (sessions-view.tsx:144-166, :199-258);
#   - MANAGE-5: a meeting link cannot be removed from the page (sessions-view.tsx:219-223), though PATCH takes null;
#   - MANAGE-6: four row buttons break WCAG 2.5.3, F-W4-11 of the inventory names three (the catalog's Sessions.*Label);
#   - F-W4-9 (and nazar's F-C-course-a-08): the four forms open BELOW the table and move no focus (sessions-view.tsx:535-667);
#   - CANCEL-4 and F-C-course-a-20: the confirmation does not say a cancel is final, and its confirm is a plain primary button.
# What this page adds, as NMSESS-1 to NMSESS-4 (ui.yaml `rules`): no refusal reads the page again, so a stale page stays stale and the
# cancel dialog stays open over it (NMSESS-1); the cancel sends no note and offers no make-up, though the action takes a reason and nazar's
# dialog asks for both (NMSESS-2); the celse's title is a link to an address tedris has no page for (NMSESS-3); a celse can be moved to a time
# that is already past (NMSESS-4). F-W4-12 (that link opens a new tab without saying so) and F-W4-18 (the placeholders) are the inventory's.
# The talebe's half is tedris.celse.attend; the planner is nizam.courses.planSessions; a cancelled celse as the talebe meets it is
# tedris.celse.cancelled (started below).
schema: delurio-graph/0
kind: flow
id: nizam.courses.manageSessions
status: captured
domain: medaris.api
ui: nizam.courses.manageSessions
title: Manage a course's celses
summary: >-
  A köşk nazımı opens a course's Celseler (from the course's Genel bakış, from the Müfredat's sub-menu or from a row of the köşk home). Under
  the course's name and the zone the times are written in, the celses still ahead are a table, each with its time, its "Katılım" (the
  meeting link as a platform chip, "YouTube yayını" or "Yalnız yayın", "Yüz yüze", or the warning "Eksik" when it has none of them) and its
  state; the celses already over are a second table, "Geçmiş celseler". A row ahead has buttons: "Bağlantı ekle" or "Bağlantıyı güncelle",
  "Yüz yüze ayarı", "Canlı yayın ekle" or "Canlı yayını güncelle", "Tarihi değiştir" and "İptal et". The first four open a small form under
  the table (the link, one of three in-person choices, the stream link, the date and the time); "Kaydet" writes one change, a toast says what
  was saved, the form closes and the page is read again: "Eksik" leaves the row. A link the page can see is wrong is refused before anything is
  sent, under its field; a write the API refuses is a toast and the form stays open. "İptal et" asks first, in a confirmation that says the
  celse stays in the programme as "İptal edildi": the row then says so, has no buttons and no link, and the talebe are told. Nothing moves
  the focus anywhere on this page.

scope:
  shows: >-
    Celseler of one course for its köşk's nazımı: the header with the breadcrumb, the table of celses ahead with their Katılım, the four inline
    forms, the confirmation of "İptal et", the toasts of every write, the table of celses already over, and the screen a course that is not
    this köşk's gets
  world: open
  outOfView:
    - "a course with no celse at all (the Alert 'Bu derste henüz celse yok' and its sentence), a course whose celses are all over (the sentence 'Yaklaşan celse yok.'), and the fold of 'Geçmiş celseler' ('{count} geçmiş celsenin tümü', which shows from the third celse over): only the data decides them; this graph draws one celse ahead and one over"
    - "a celse under way (it says 'Şu an canlı' and has no 'Tarihi değiştir' and no 'İptal et') and a celse over, whose row has no buttons at all: only the clock decides them; the page re-reads the clock every 30 seconds"
    - "the stream buttons being left out when the read of the stream links fails or is refused, and 'Yüz yüze ayarı' being left out when the read carries no attendance: the köşk's nazımı holds session.live_link and the content by default, so no reader of this page meets either"
    - "the failed read of the course ('Ders okunamadı' with a retry, course-load-failed.tsx), an ended session (every server call then sends the person to sign in: realm.auth.sessionEnded) and a call that fails outright, such as a dropped network"
    - "the screen for a course that is not there or not theirs, which is the same 'Bu bölüm için izniniz yok' as for a section the account may not open (nizam.shell.noAccessAndNotFound); this graph ends there"
    - "'Celse planla' and its page (nizam.courses.planSessions), the other pages of the course (nizam.courses.overview, .curriculum, .roster), and how the talebe meet a link, a stream, an in-person mark or a cancelled celse (tedris.celse.attend, tedris.celse.watchStream, tedris.celse.cancelled)"
    - "a second row: pressing the button of another row while a form is open swaps the form"
    - "the form left open under a cancel: 'İptal et' pressed while a form is open keeps that form (sessions-view.tsx:446 sets only `cancelling`), and once the celse is cancelled it stays open under the table, for the cancelled celse, until it is closed; this graph draws the page after a cancel without it (the way back by 'Vazgeç' is drawn: `under`)"

decisions:
  D1:
    question: >-
      Should a meeting link be removable from this page? PATCH /lessons/{id} takes meetingUrl: null and the stream has "Bağlantıyı kaldır", but the
      link form refuses an empty field (sessions-view.tsx:219-223) although its own helper says an empty link is allowed (present.ts:568-573). The same
      question as nazar.sessions.manage's D1 (MANAGE-5).
    recommend: >-
      Yes: let the form send null for an empty field, or add the button the stream form has, and say that the celse then reads "Eksik" again.
    affects: [linkForm, savingLink]
  D2:
    question: >-
      Should "İptal et" here ask for a note to the talebe and offer a make-up celse, as nazar's does? The action already takes a reason
      (actions.ts:104, cancelSession's `reason`, which the page never passes) and the API takes the make-up; the talebe's page (tedris.celse.cancelled)
      then shows a note and the make-up, and a cancel from this page shows neither (NMSESS-2).
    recommend: >-
      Yes, as the same dialog in the shared kit, so that a cancel means the same in both apps; until then say in the confirmation that the talebe
      get no reason.
    affects: [confirmCancel]
  D3:
    question: >-
      Should the confirmation say that a cancellation cannot be taken back and that the talebe are told at once? The API has no route that
      un-cancels a celse; the notification and the calendar mail go out when the cancel is made; the confirmation says only that the celse
      stays in the programme as "İptal edildi", and its confirm is a plain primary button. The same as nazar.sessions.cancel's D2 (CANCEL-4).
    recommend: >-
      One more sentence ("Talebelere hemen bildirim gider; iptal geri alınamaz.") and the confirm in the destructive style.
    affects: [confirmCancel]

context:
  access:
    values: [own, refused]
    initial: any
    say:
      own: "the address names a course of the köşk it names, and the person may edit it (the köşk's nazımı)"
      refused: "the course is not in that köşk, or is not there, or the person may not edit it: the page is the screen 'Bu bölüm için izniniz yok'"
  changeAnswer:
    values: [saved, moved, forbidden, failed]
    initial: any
    say:
      saved: "the API takes the change of the link, the time or the in-person mark"
      moved: "the course was saved by someone else since the page was read: a stale version (409)"
      forbidden: "the API refuses for lack of session.manage (it was taken away after the page opened)"
      failed: "the API refuses for any other reason: the celse is gone or hidden, the body is refused"
  streamAnswer:
    values: [saved, invalid, moved, forbidden, failed]
    initial: any
    say:
      saved: "the API takes the stream link, or clears it"
      invalid: "the server's parser refuses a link the page's own parser took (LIVE_STREAM_URL_INVALID): the sentence stands under the field"
      moved: "the celse is not a live one, or was cancelled meanwhile"
      forbidden: "the API refuses for lack of session.live_link (it was taken away after the page opened)"
      failed: "the API refuses for any other reason: the celse is gone"
  cancelAnswer:
    values: [done, moved, already, forbidden, failed]
    initial: any
    say:
      done: "the API cancels the celse"
      moved: "the course was saved by someone else since the page was read (COURSE_VERSION_CONFLICT)"
      already: "the celse was cancelled by someone else (LESSON_ALREADY_CANCELLED); a stale page meets the version conflict first, so this is a race inside the request"
      forbidden: "the API refuses for lack of session.manage (it was taken away after the page opened)"
      failed: "the API refuses for any other reason: the celse is gone or hidden"
  link:
    values: [none, set]
    initial: none
    say: { none: "the celse has no meeting link", set: "the celse has a meeting link" }
  stream:
    values: [none, set]
    initial: none
    say: { none: "the celse has no stream link", set: "the celse has a stream link" }
  held:
    values: [course, yes, no]
    initial: course
    say:
      course: "the celse follows the course's in-person setting (the course is held online here)"
      yes: "the celse is marked in person"
      no: "the celse is marked not in person"
  picked:
    values: [course, yes, no]
    initial: course
    say: { course: "the in-person form has 'Dersin ayarına uy' chosen", yes: "it has 'Yüz yüze' chosen", no: "it has 'Yüz yüze değil' chosen" }
  entered:
    values: [blank, valid, invalid]
    initial: blank
    say:
      blank: "the open form's field is empty"
      valid: "it holds what the page accepts: an https link, a YouTube video link, a date and a time"
      invalid: "it holds what the page refuses: a link that is not https, a channel link, no date"
  said:
    values: [none, link, time, stream]
    initial: none
    say:
      none: "no field error is shown"
      link: "'Toplantı bağlantısı https:// ile başlamalı…' under the link field"
      time: "'Tarihi ve saati girin.' under Tarih"
      stream: "one of the five stream problems under the stream field"
  under:
    values: [none, link, time, inPerson, stream]
    initial: none
    say:
      none: "the confirmation of 'İptal et' was opened with no form open"
      link: "it was opened over the link form, which stays open beneath it"
      time: "it was opened over the time form, which stays open beneath it"
      inPerson: "it was opened over the in-person form, which stays open beneath it"
      stream: "it was opened over the stream form, which stays open beneath it"
  toast:
    values: [none, linkSaved, timeSaved, inPersonSaved, streamSaved, streamRemoved, cancelled, moved, forbidden, failed, already]
    initial: none
    say:
      none: "no toast, or the last one is gone"
      linkSaved: "'Bağlantı kaydedildi'"
      timeSaved: "'Celse zamanı değişti'"
      inPersonSaved: "'Yüz yüze ayarı kaydedildi'"
      streamSaved: "'Canlı yayın bağlantısı kaydedildi'"
      streamRemoved: "'Canlı yayın bağlantısı kaldırıldı'"
      cancelled: "'Celse iptal edildi' with '{name} iptal edildi.'"
      moved: "the error toast 'İşlem yapılamadı' of a write the course or the celse had moved under"
      forbidden: "the error toast, 'Bu işlem için yetkiniz yok.'"
      failed: "the error toast, 'İşlem tamamlanamadı. Biraz sonra yeniden deneyin.'"
      already: "the error toast, 'Bu celse zaten iptal edilmiş.'"

guards:
  # "Eksik": a celse still ahead with no meeting link, no stream and no in-person mark (attendance.ts:28, :57; attendance-cell.tsx:25)
  lacksWay: "link == 'none' and stream == 'none' and held != 'yes'"
  # an error toast of any of the four kinds: it stays until it is closed (libs/ui/src/components/sonner.tsx:21)
  errorToast: "toast == 'moved' or toast == 'forbidden' or toast == 'failed' or toast == 'already'"

effects:
  # a form opens: the field starts empty or with what the celse holds, no error shows, the last toast is gone
  openLink: { set: { entered: blank, said: none, toast: none } }
  openLinkSet: { set: { entered: valid, said: none, toast: none } }
  openTime: { set: { entered: valid, said: none, toast: none } }
  openStream: { set: { entered: blank, said: none, toast: none } }
  openStreamSet: { set: { entered: valid, said: none, toast: none } }
  openInPersonCourse: { set: { picked: course, said: none, toast: none } }
  openInPersonYes: { set: { picked: yes, said: none, toast: none } }
  openInPersonNo: { set: { picked: no, said: none, toast: none } }
  openCancel: { set: { toast: none, under: none } }
  # "İptal et" pressed while a form is open: setCancelling(row) leaves `editing` as it is, so the form stays beneath the confirmation
  openCancelOverLink: { set: { toast: none, under: link } }
  openCancelOverTime: { set: { toast: none, under: time } }
  openCancelOverInPerson: { set: { toast: none, under: inPerson } }
  openCancelOverStream: { set: { toast: none, under: stream } }
  # what is typed and chosen
  typedValid: { set: { entered: valid } }
  typedInvalid: { set: { entered: invalid } }
  pickCourse: { set: { picked: course } }
  pickYes: { set: { picked: yes } }
  pickNo: { set: { picked: no } }
  # a send the page refuses first: only its own sentence under the field
  saidLink: { set: { said: link } }
  saidTime: { set: { said: time } }
  saidStream: { set: { said: stream } }
  # a send: the last toast goes before the call
  sends: { set: { toast: none } }
  # the form is closed: what it held is dropped; a toast stays until the next open
  closeForm: { set: { entered: blank, said: none, picked: course } }
  closedAfterLink: { set: { link: set, toast: linkSaved, entered: blank, said: none, picked: course } }
  closedAfterTime: { set: { toast: timeSaved, entered: blank, said: none, picked: course } }
  closedAfterInPersonCourse: { set: { held: course, toast: inPersonSaved, entered: blank, said: none, picked: course } }
  closedAfterInPersonYes: { set: { held: yes, toast: inPersonSaved, entered: blank, said: none, picked: course } }
  closedAfterInPersonNo: { set: { held: no, toast: inPersonSaved, entered: blank, said: none, picked: course } }
  closedAfterStream: { set: { stream: set, toast: streamSaved, entered: blank, said: none, picked: course } }
  closedAfterRemoval: { set: { stream: none, toast: streamRemoved, entered: blank, said: none, picked: course } }
  cancelled: { set: { toast: cancelled } }
  # a refused write: the form or the confirmation stays, with its toast
  movedToast: { set: { toast: moved } }
  forbiddenToast: { set: { toast: forbidden } }
  failedToast: { set: { toast: failed } }
  alreadyToast: { set: { toast: already } }

failures:
  opened:
    from: getCourse
    missing: [COURSE_NOT_FOUND]
  savingLink:
    from: updateLesson
    moved: [COURSE_VERSION_CONFLICT]
    forbidden: [AUTHZ_FORBIDDEN]
    failed: [LESSON_NOT_FOUND, VALIDATION_ERROR, COURSE_NOT_FOUND, WEEK_NOT_FOUND]
  savingTime:
    from: updateLesson
    moved: [COURSE_VERSION_CONFLICT]
    forbidden: [AUTHZ_FORBIDDEN]
    failed: [LESSON_NOT_FOUND, VALIDATION_ERROR, COURSE_NOT_FOUND, WEEK_NOT_FOUND]
  savingInPerson:
    from: updateLesson
    moved: [COURSE_VERSION_CONFLICT]
    forbidden: [AUTHZ_FORBIDDEN]
    failed: [LESSON_NOT_FOUND, VALIDATION_ERROR, COURSE_NOT_FOUND, WEEK_NOT_FOUND]
  savingStream:
    from: setLessonLiveStream
    invalid: [LIVE_STREAM_URL_INVALID]
    moved: [LESSON_NOT_LIVE, LESSON_CANCELLED]
    forbidden: [AUTHZ_FORBIDDEN]
    failed: [LESSON_NOT_FOUND, VALIDATION_ERROR, COURSE_NOT_FOUND]
  removingStream:
    from: setLessonLiveStream
    moved: [LESSON_NOT_LIVE, LESSON_CANCELLED]
    forbidden: [AUTHZ_FORBIDDEN]
    failed: [LESSON_NOT_FOUND, VALIDATION_ERROR, COURSE_NOT_FOUND]
  cancelling:
    from: cancelLesson
    moved: [COURSE_VERSION_CONFLICT]
    already: [LESSON_ALREADY_CANCELLED]
    forbidden: [AUTHZ_FORBIDDEN]
    failed: [VALIDATION_ERROR, LESSON_NOT_FOUND, COURSE_NOT_FOUND]
# `failed` stands for every answer but the classes named beside it: the page words any code it does not know as 'İşlem tamamlanamadı…' (present.ts:1242).

# The story e2e courses#17 tells: the nazım adds a link to a celse that has none, the page refuses an http:// address, then takes an https one.
main:
  given: { access: own, changeAnswer: saved, streamAnswer: saved, cancelAnswer: done }
  events: [DONE, OPEN_LINK, FILL_LINK_BAD, SAVE, FILL_LINK, SAVE, DONE]

initial: opened

states:
  opened:
    title: Celseler is read
    description: >-
      The page reads the köşk, the course (GET /courses/{id}, whose version every write of a form carries), who the person is, the course's
      recordings (to say "Kaydı var" or "Kayıt yok" of a celse that is over) and the stream links (GET /courses/{id}/live-streams, which the
      köşk's nazımı may read). A course that is not in the köşk the address names, or is not there, or that the person may not edit, is the
      screen "Bu bölüm için izniniz yok" (notFound() and forbidden() draw the same screen, nizam.shell.noAccessAndNotFound); a read that
      failed is the box "Ders okunamadı" with a retry (not drawn). Nothing is on screen in this step.
    invoke: { action: getCourse }
    on:
      DONE:
        - { guard: "access == 'refused'", target: no_access, source: apps/nizam/features/courses/reads.ts:46, say: "the course is not this köşk's, or not theirs to edit" }
        - { target: listed }
      FAIL.missing: { target: no_access, source: "apps/nizam/app/kosks/[id]/courses/[courseId]/sessions/page.tsx:37", say: "the course read answers 404: the same screen" }
    source: "apps/nizam/app/kosks/[id]/courses/[courseId]/sessions/page.tsx:33"

  no_access:
    title: Bu bölüm için izniniz yok
    description: >-
      The screen of a course that is not there, not in this köşk or not theirs: one sentence for a missing record and a missing right, so that
      the page does not tell which ids exist (not-found.tsx, no-access.tsx). Its story is nizam.shell.noAccessAndNotFound.
    type: final
    leavesPage: true

  listed:
    title: The celses, ahead and over
    description: >-
      The page: the breadcrumb "Dersler / {course} / Celseler", "Celseler", the sentence "{name} dersinin bütün celseleri, tarihe göre. Saatler
      {zone} saatiyle.", "Celse planla", and the table "Yaklaşan celseler" with its counts line ("1 celse · Hafta 1", "· {n} iptal edildi ·"
      once one is cancelled). Each row has the celse's title (a link that opens tedris in a new tab: F-W4-12, and to an address tedris has no
      page for: NMSESS-3), "Hafta n", its time with its length, its "Katılım" and its state ("Planlandı"), and in the last column a button for
      each thing that can be changed: "Bağlantı ekle" or "Bağlantıyı güncelle", "Yüz yüze ayarı", "Canlı yayın ekle" or "Canlı yayını
      güncelle", "Tarihi değiştir" and "İptal et", each named by the celse's short date (MANAGE-6). Under it "Geçmiş celseler": the same
      columns without the buttons, a celse over saying "Sona erdi" and "Kayıt yok" or "Kaydı var", and its Katılım "Eklenmedi" when it had
      none. The last write's toast stands for a few seconds (an error stays until closed). Findings read here: F-W4-9 (the forms open
      below the table and move no focus), F-W4-6 (the focus is lost after a row action), F-W4-11 with MANAGE-6, F-W4-12, MANAGE-5 (no way to
      remove a link), NMSESS-3 (the title link).
    by: human
    goal: true
    on:
      OPEN_LINK:
        - { guard: "link == 'set'", target: linkForm, effect: [openLinkSet], source: apps/nizam/features/courses/components/sessions-view.tsx:144, say: "they press 'Bağlantıyı güncelle': the form holds the link" }
        - { target: linkForm, effect: [openLink], source: apps/nizam/features/courses/components/sessions-view.tsx:144, say: "they press 'Bağlantı ekle': the form is empty" }
      OPEN_TIME: { target: timeForm, effect: [openTime], source: apps/nizam/features/courses/components/sessions-view.tsx:152, say: "they press 'Tarihi değiştir': the form holds the celse's date and time on the course's clock" }
      OPEN_IN_PERSON:
        - { guard: "held == 'yes'", target: inPersonForm, effect: [openInPersonYes], source: apps/nizam/features/courses/components/sessions-view.tsx:159, say: "they press 'Yüz yüze ayarı': 'Yüz yüze' is chosen" }
        - { guard: "held == 'no'", target: inPersonForm, effect: [openInPersonNo], source: apps/nizam/features/courses/components/sessions-view.tsx:159, say: "they press 'Yüz yüze ayarı': 'Yüz yüze değil' is chosen" }
        - { target: inPersonForm, effect: [openInPersonCourse], source: apps/nizam/features/courses/components/sessions-view.tsx:159, say: "they press 'Yüz yüze ayarı': 'Dersin ayarına uy' is chosen" }
      OPEN_STREAM:
        - { guard: "stream == 'set'", target: streamForm, effect: [openStreamSet], source: apps/nizam/features/courses/components/sessions-view.tsx:148, say: "they press 'Canlı yayını güncelle': the form holds the stream link" }
        - { target: streamForm, effect: [openStream], source: apps/nizam/features/courses/components/sessions-view.tsx:148, say: "they press 'Canlı yayın ekle': the form is empty" }
      CANCEL_CELSE: { target: confirmCancel, effect: [openCancel], source: apps/nizam/features/courses/components/sessions-view.tsx:442, say: "they press 'İptal et': the confirmation opens over this page" }
      OPEN_PLAN: { target: plan_opened, source: apps/nizam/features/courses/components/sessions-view.tsx:493, say: "they follow 'Celse planla'" }
      NAVIGATE: { target: left, source: apps/nizam/features/courses/components/sessions-view.tsx:474, say: "they follow the breadcrumb or the menu" }
    source: apps/nizam/features/courses/components/sessions-view.tsx:527

  linkForm:
    title: The meeting link form
    description: >-
      A card under the table with the heading "{date} celsesinin toplantı bağlantısı", one field, "Toplantı bağlantısı" (a mono text field with a
      Zoom address as its placeholder, hard-coded: F-W4-18), the help "Yalnız bu celsenin bağlantısı değişir. Platform, adresten anlaşılır.", and
      "Vazgeç" and "Kaydet". It is not a dialog: nothing traps or moves the focus, which stays on the row's button above (F-W4-9). "Kaydet" is
      always on. An address with no scheme gets https://; one that is empty, starts http:// or is not an address is refused under the field, in
      a sentence that replaces the help and that no screen reader is told of (F-UI-W4-1). The sentence is cleared only when a form is opened
      again, so a corrected value is sent, and a refused write answered, with it still there (MANAGE-4). The API keeps any https host of up to 500
      characters; the platform chip is read off the address afterwards. There is no way to send an empty link (MANAGE-5, D1).
    by: human
    on:
      FILL_LINK: { target: linkForm, effect: [typedValid], source: apps/nizam/features/courses/components/sessions-view.tsx:610, say: "they type an https address" }
