      OPEN_ZONE: { target: choosingZone, effect: [clearToast], say: "they open 'Saat dilimi'", source: apps/nizam/features/courses/components/course-settings-page.tsx:273 }
      UNPUBLISH: { guard: isPublished, target: asking, effect: [clearToast], say: "they press Taslağa çek", source: apps/nizam/features/courses/components/course-settings-page.tsx:353 }
