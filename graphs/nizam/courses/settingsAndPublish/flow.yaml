      OPEN_PUBLIC:
        - { guard: isDraft, target: readFixed, starts: { flow: tedris.course.draftPreview, given: { viewer: "'visitor'", draft: "'dated'" } }, say: "they follow Tanıtım sayfasını gör: Tedris opens in a new tab, where a draft is not there for her (DRAFT-1), and this tab stays", source: apps/nizam/features/courses/components/course-settings-page.tsx:209 }
        - { target: readFixed, say: "they follow Tanıtım sayfasını gör: the course's page in Tedris opens in a new tab and this tab stays", source: apps/nizam/features/courses/components/course-settings-page.tsx:209 }
