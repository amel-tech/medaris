      TOGGLE_CLOSED: { guard: closeIt, target: dirty, effect: [closedOn], say: "they tick 'Kapalı ders'", source: apps/nizam/features/courses/components/course-settings-page.tsx:231 }
      TOGGLE_IN_PERSON: { guard: markInPerson, target: dirty, effect: [inPersonOn], say: "they tick 'Celseler yüz yüze yapılır'", source: apps/nizam/features/courses/components/course-settings-page.tsx:269 }
      TOGGLE_POLICY: { guard: tickPolicy, target: dirty, effect: [policyOn], say: "they tick 'Ders kayıtları herkese açılamaz'", source: apps/nizam/features/courses/components/course-settings-page.tsx:303 }
