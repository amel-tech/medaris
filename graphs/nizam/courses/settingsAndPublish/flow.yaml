  clean:
    title: The page holds what is stored
    by: human
    description: >-
      The five controls and the policy box show what the course and the köşk hold, and "Kaydet" and "Vazgeç" are natively disabled with no word of
      why. A toast of the last step may be up (`toast`): after a save "Ders ayarları kaydedildi" with "<course> dersinin ayarları güncellendi."
      for six seconds. The form is not built again by a save: the controls keep what was pressed, which is now what is stored, and `router.refresh()`
      moves `stored` under them. What the person loses is the pressed Kaydet: once `stored` equals the form it is `disabled={!dirty}`, a
      natively disabled button under the focus (F-W4-8, F-X-8; not verified in a browser). The page sets no focus.
    on:
      TOGGLE_CLOSED: { guard: closeIt, target: dirty, effect: [closedOn], say: "they tick 'Kapalı ders'", source: apps/nizam/features/courses/components/course-settings-page.tsx:231 }
      TOGGLE_APPROVAL: { guard: dropApproval, target: dirty, effect: [approvalOff], say: "they untick 'Kayıt onayı gereksin'", source: apps/nizam/features/courses/components/course-settings-page.tsx:259 }
      TOGGLE_IN_PERSON: { guard: markInPerson, target: dirty, effect: [inPersonOn], say: "they tick 'Celseler yüz yüze yapılır'", source: apps/nizam/features/courses/components/course-settings-page.tsx:269 }
      TOGGLE_POLICY: { guard: tickPolicy, target: dirty, effect: [policyOn], say: "they tick 'Ders kayıtları herkese açılamaz': the köşk's policy, for every course of the köşk", source: apps/nizam/features/courses/components/course-settings-page.tsx:303 }
      OPEN_SAMPLE: { target: choosingSample, effect: [clearToast], say: "they open 'Örnek ders'", source: apps/nizam/features/courses/components/course-settings-page.tsx:235 }
      OPEN_ZONE: { target: choosingZone, effect: [clearToast], say: "they open 'Saat dilimi'", source: apps/nizam/features/courses/components/course-settings-page.tsx:273 }
      UNPUBLISH: { guard: isPublished, target: asking, effect: [clearToast], say: "they press Taslağa çek", source: apps/nizam/features/courses/components/course-settings-page.tsx:353 }
      PUBLISH: { guard: isDraft, target: publishing, effect: [clearToast], say: "they press Yayımla: it asks nothing", source: apps/nizam/features/courses/components/course-settings-page.tsx:361 }
      HIDE: { target: confirmingHide, effect: [clearToast], say: "they press Dersi gizle", source: apps/nizam/features/courses/components/course-settings-page.tsx:416 }
      RELOAD: { guard: "world == 'saves'", target: reloading, effect: [reloadedSaved], say: "they reload the page: it is read again with what the API now holds", source: "apps/nizam/app/kosks/[id]/courses/[courseId]/ayarlar/page.tsx:29" }
      OPEN_PUBLIC:
        - { guard: isDraft, target: clean, starts: { flow: tedris.course.draftPreview, given: { viewer: "'visitor'", draft: "'dated'" } }, say: "they follow Tanıtım sayfasını gör: Tedris opens in a new tab, where a person with no Tedris session is a visitor and a draft is not there for her (DRAFT-1)", source: apps/nizam/features/courses/components/course-settings-page.tsx:209 }
        - { target: clean, say: "they follow Tanıtım sayfasını gör: the course's page in Tedris opens in a new tab (tedris.course.readProgramme) and this tab stays", source: apps/nizam/features/courses/components/course-settings-page.tsx:209 }
      NAVIGATE: { target: left, say: "they follow the menu, a breadcrumb or a link" }
    source: apps/nizam/features/courses/components/course-settings-page.tsx:190

  dirty:
    title: Something differs from what is stored
    by: human
    description: >-
      Kaydet and Vazgeç are on as soon as one control differs, in the form or in the köşk's policy box (`dirty = settingsChanged ||
      policyChanged`; a control put back by hand turns them off again, not drawn). The graph draws the press of Kaydet once the form holds everything
      the walk's world presses (`readyToSend`): a form that holds less sends what differs by the same transitions. Nothing is sent until Kaydet, and
      the only sign of an unsaved change is that the two buttons are on: a menu entry, a link or a reload drops the pressed controls without a word
      (F-W4-5). The "Yayın" and "Dersi gizle" cards stay live; taking the course back to draft or publishing it keeps the form's draft (the form is
      not keyed by the status). After a refusal the person stays here, with the error toast over the page (it stays until closed) and the pressed
      controls as they were: nothing was read again, so after a policy that came on the box is still open and unticked and the same Kaydet is
      refused the same way, and after a conflict the same Kaydet is refused again until the page is reloaded (SETPUB-3).
    on:
      TOGGLE_CLOSED: { guard: closeIt, target: dirty, effect: [closedOn], say: "they tick 'Kapalı ders'", source: apps/nizam/features/courses/components/course-settings-page.tsx:231 }
      TOGGLE_APPROVAL: { guard: dropApproval, target: dirty, effect: [approvalOff], say: "they untick 'Kayıt onayı gereksin'", source: apps/nizam/features/courses/components/course-settings-page.tsx:259 }
      TOGGLE_IN_PERSON: { guard: markInPerson, target: dirty, effect: [inPersonOn], say: "they tick 'Celseler yüz yüze yapılır'", source: apps/nizam/features/courses/components/course-settings-page.tsx:269 }
      TOGGLE_POLICY: { guard: tickPolicy, target: dirty, effect: [policyOn], say: "they tick 'Ders kayıtları herkese açılamaz'", source: apps/nizam/features/courses/components/course-settings-page.tsx:303 }
      OPEN_SAMPLE: { target: choosingSample, effect: [clearToast], say: "they open 'Örnek ders'", source: apps/nizam/features/courses/components/course-settings-page.tsx:235 }
      OPEN_ZONE: { target: choosingZone, effect: [clearToast], say: "they open 'Saat dilimi'", source: apps/nizam/features/courses/components/course-settings-page.tsx:273 }
      SUBMIT: { guard: readyToSend, target: sending, say: "they press Kaydet", source: apps/nizam/features/courses/components/course-settings-page.tsx:319 }
      REVERT: { target: reverting, say: "they press Vazgeç: nothing asks first", source: apps/nizam/features/courses/components/course-settings-page.tsx:308 }
      UNPUBLISH: { guard: isPublished, target: asking, effect: [clearToast], say: "they press Taslağa çek with an unsaved change in the form", source: apps/nizam/features/courses/components/course-settings-page.tsx:353 }
      PUBLISH: { guard: isDraft, target: publishing, effect: [clearToast], say: "they press Yayımla with an unsaved change in the form", source: apps/nizam/features/courses/components/course-settings-page.tsx:361 }
      HIDE: { target: confirmingHide, effect: [clearToast], say: "they press Dersi gizle: hiding does not look at the form, and its unsaved change goes with the page", source: apps/nizam/features/courses/components/course-settings-page.tsx:416 }
      RELOAD: { guard: "world == 'stale'", target: reloading, effect: [reloadedLost], say: "after the conflict they reload the page: it is read again, the form is built again and the pressed controls are gone", source: "apps/nizam/app/kosks/[id]/courses/[courseId]/ayarlar/page.tsx:29" }
      OPEN_PUBLIC:
        - { guard: isDraft, target: dirty, starts: { flow: tedris.course.draftPreview, given: { viewer: "'visitor'", draft: "'dated'" } }, say: "they follow Tanıtım sayfasını gör: Tedris opens in a new tab (DRAFT-1) and this tab stays", source: apps/nizam/features/courses/components/course-settings-page.tsx:209 }
        - { target: dirty, say: "they follow Tanıtım sayfasını gör: Tedris opens in a new tab and this tab stays", source: apps/nizam/features/courses/components/course-settings-page.tsx:209 }
      NAVIGATE: { target: left, say: "they leave the page: the pressed controls are lost and nothing warned them" }
    source: apps/nizam/features/courses/components/course-settings-page.tsx:93

  choosingSample:
    title: The list "Örnek ders" is open
    by: human
    description: >-
      The kit's Select, a Base UI listbox in a popup: "Örnek ders yok" and one option for every LIVE session in programme order, "Hafta 1 · Celse 1" and
      "Hafta 1 · Celse 2" for the walk's course (`sampleOptions`; the Select has no empty value, "none" stands for no sample). Base UI's Select is
      modal, so the page behind is taken to be inert and only the list is drawn here (not verified in a browser). Choosing the value already shown
      changes nothing and is not drawn; "Hafta 1 · Celse 2" is an option of the list that no walk of this graph chooses. Esc closes the list and
      changes nothing.
    on:
      PICK_FIRST: { guard: pickFirst, target: dirty, effect: [sampleFirst], say: "they choose 'Hafta 1 · Celse 1'", source: apps/nizam/features/courses/components/course-settings-page.tsx:238 }
      DISMISS:
        - { guard: anythingPressed, target: dirty, say: "Esc: the list closes, nothing changes", source: libs/ui/src/mds/select.tsx:79 }
        - { target: clean, say: "Esc: the list closes, nothing changes", source: libs/ui/src/mds/select.tsx:79 }
    source: libs/ui/src/mds/select.tsx:79

  choosingZone:
    title: The list "Saat dilimi" is open
    by: human
    description: >-
      The same Select with every zone the runtime lists (about 418, `listTimeZones`), each named by its city alone, "İstanbul" being the only one the
      catalog words and the others being the last part of the IANA id with the underscores as spaces ("Berlin"), in the order of the ids, not of the
      labels (F-D2c-17 of nazar: no region, no search). Two options are drawn: the zone every course starts with and the one e2e courses#9 chooses;
      choosing İstanbul again is the way back and is not drawn. The page behind is inert as for the first list (not verified).
    on:
      PICK_BERLIN: { guard: pickBerlin, target: dirty, effect: [zoneBerlin], say: "they choose 'Berlin'", source: apps/nizam/features/courses/components/course-settings-page.tsx:276 }
      DISMISS:
        - { guard: anythingPressed, target: dirty, say: "Esc: the list closes, nothing changes", source: libs/ui/src/mds/select.tsx:79 }
        - { target: clean, say: "Esc: the list closes, nothing changes", source: libs/ui/src/mds/select.tsx:79 }
    source: libs/ui/src/mds/select.tsx:79

  reverting:
    title: Vazgeç puts back what the page read
    description: >-
      Not a screen: the form becomes `stored` and the köşk's policy box becomes the köşk's own value. The graph keeps one record of that, the course
      as the walk's world has it, so it puts that back; a Vazgeç after a save in the same visit is not drawn (outOfView). Vazgeç is natively
      disabled once the form equals the record, so the pressed button turns off under the focus.
    always:
      - { target: clean, effect: [restorePlain], say: "back to the course as it was read" }
    source: apps/nizam/features/courses/components/course-settings-page.tsx:312

  sending:
    title: Which writes are due
    description: >-
      Not a screen: `submit` returns at once when nothing differs, otherwise it writes the sample first when its id differs from the stored one, then the
      course's fields that differ (`settingsPatch` is null when none does, and then no course write is made), then the köşk's policy when it changed and
      the caller is the manager. The controls and Kaydet are busy while it runs: the fields are disabled, Kaydet is aria-disabled and aria-busy with a
      hidden output "Kaydediliyor…", Vazgeç is off.
    always:
      - { guard: sampleDue, target: sendingSample, say: "the sample differs: it is written first" }
      - { guard: fieldsDue, target: sendingCourse, say: "only the course's fields differ" }
      - { guard: policyDue, target: sendingPolicy, say: "only the köşk's policy differs" }
      - { target: clean, effect: [savedAll], say: "nothing differs (Kaydet is off then, so this is never taken)" }
    source: apps/nizam/features/courses/components/course-settings-page.tsx:109

  sendingSample:
    title: The sample session is written
    description: >-
      patchLesson, PATCH /lessons/:id with `{ version, isPreview }` and the version the page was read at: first the old sample is taken off
      (`isPreview: false`) when the course had one, then the new one is set (`isPreview: true`) with the version the first write returned; a course
      with no sample is one write. The API checks the version in the statement that bumps it, so a stale page changes nothing
      (COURSE_VERSION_CONFLICT). It needs `session.manage`. A refusal here stops the save: the course's fields and the policy are not sent, the
      toast "Ayarlar kaydedilemedi" says "Ders, bu sayfayı açtığınızdan beri başkası tarafından kaydedildi. Sayfayı yenileyip yeniden deneyin.", the
      page is NOT read again and the same Kaydet is refused again (SETPUB-3).
    invoke: { action: updateLesson }
    on:
      DONE: { guard: "not conflicting", target: afterSample, effect: [sampleLanded], say: "the sample is stored: it carries the course's new version", source: apps/nizam/features/courses/components/course-settings-page.tsx:129 }
      FAIL.stale: { guard: conflicting, target: dirty, effect: [toastStale], say: "409: nothing was written, the toast says to reload, the page is not read again and Kaydet stays on", source: apps/nizam/features/courses/components/course-settings-page.tsx:124 }
    source: apps/nizam/features/courses/components/course-settings-page.tsx:116

  afterSample:
    title: Is a course or a policy write due?
    description: "Not a screen: after the sample the course's fields are written when any differs, then the policy; a save that changed only the sample is done."
    always:
      - { guard: fieldsDue, target: sendingCourse, say: "a box or the zone differs: one PATCH /courses/:id follows" }
      - { guard: policyDue, target: sendingPolicy, say: "only the köşk's policy differs besides the sample" }
      - { target: clean, effect: [savedAll], say: "only the sample differed: the save is done" }
    source: apps/nizam/features/courses/components/course-settings-page.tsx:145

  sendingCourse:
    title: The course's fields are written
    description: >-
      patchCourse, PATCH /courses/:id with only the fields that differ from what was read among isClosed, requiresApproval, inPerson and timeZone:
      never the version (the route takes none, so it is never COURSE_VERSION_CONFLICT and the last save wins), never null. It needs `course.edit`, and
      `course.settings` for the two boxes (AUTHZ_FORBIDDEN otherwise); switching approval off or opening a closed course also needs the abilities a
      policy may have closed (PLATFORM_POLICY_LOCKED, 409), and the page words that code with the generic sentence "İşlem tamamlanamadı. Biraz
      sonra yeniden deneyin." because its table has no entry for it (SETPUB-2). A course that is gone is COURSE_NOT_FOUND for the başnazım and,
      from the guard, probably AUTHZ_FORBIDDEN for the nazım (the route resolves with `byParam`, not `byExistingCourse`; not verified), worded
      "Bu işlem için yetkiniz yok.".
    invoke: { action: updateCourse }
    on:
      DONE: { guard: "not courseRefused", target: afterCourse, say: "the course is saved", source: apps/nizam/features/courses/components/course-settings-page.tsx:154 }
      FAIL.policy: { guard: policyWorld, target: dirty, effect: [toastGeneric], say: "409 PLATFORM_POLICY_LOCKED: the toast says 'İşlem tamamlanamadı. Biraz sonra yeniden deneyin.' and names no box and no policy; nothing is read again, so the box is still open and the same Kaydet is refused again", source: apps/nizam/features/courses/present.ts:1231 }
      FAIL.other: { guard: goneWorld, target: dirty, effect: [toastGeneric], say: "404 COURSE_NOT_FOUND (read as the başnazım): the generic sentence; the course is gone and the page does not know", source: apps/nizam/features/courses/present.ts:1231 }
    source: apps/nizam/features/courses/components/course-settings-page.tsx:147

  afterCourse:
    title: Is a policy write due?
    description: "Not a screen: after the course the köşk's policy is written when it changed and the caller is the manager; a save with no policy change is done."
    always:
      - { guard: policyDue, target: sendingPolicy, say: "the policy box differs: PATCH /kosks/:id follows" }
      - { target: clean, effect: [savedAll], say: "the course was the last write: the save is done" }
    source: apps/nizam/features/courses/components/course-settings-page.tsx:155

  sendingPolicy:
    title: The köşk's policy is written
    description: >-
      updateKosk, PATCH /kosks/:id with `{ recordingsNeverPublic }` only, the köşk's own setting for EVERY course it runs. It needs `kosk.manage` or
      `platform.kosk_edit`. A platform policy that is on cannot be switched off from below (PLATFORM_POLICY_LOCKED, the başnazım excepted): the
      box accepts the untick and the refusal is the generic sentence, as on the köşk's own settings page (F-W3-3 of nizam.kosks.editAndHide; not
      drawn here, outOfView). The write is audited as `kosk.policy_change`. What the policy does and does not do is SETPUB-5: it is read when
      a visitor reads the course's recordings, and nothing reads it when a recording is made public.
    invoke: { action: updateKosk }
    on:
      DONE: { target: clean, effect: [savedAll], say: "the köşk's policy is stored: the save is done and the toast says the course's settings were saved", source: apps/nizam/features/courses/components/course-settings-page.tsx:166 }
    source: apps/nizam/features/courses/components/course-settings-page.tsx:155

  reloading:
    title: The page is read again
    description: >-
      After a reload the page reads the köşk, the course and the caller's roles again, as `opened` does, and the form is built again from them: the
      pressed controls of a reload from `dirty` are gone, and after a save the form shows what was saved, read from the API and not kept by the
      browser (the walk's effect check reads the course through the API as well).
    invoke: { action: getCourse }
    on:
      DONE: { target: clean, say: "the page shows what the API holds", source: apps/nizam/features/courses/components/course-settings-page.tsx:77 }
    source: "apps/nizam/app/kosks/[id]/courses/[courseId]/ayarlar/page.tsx:29"

  asking:
    title: Taslağa çek asks once
    description: >-
      An alertdialog, "Dersi taslağa çek", headed by the course's title as its eyebrow: "{name} taslağa çekilecek; talebeler dersi göremez." and
      "İstediğiniz zaman yeniden yayımlayabilirsiniz." The focus starts on "Vazgeç" (the kit's `initialFocus`), and the scrim does not close it. The
      page behind is inert. "Vazgeç", Esc and "Kapat" close it and write nothing, and the focus goes back to the button that opened it (Base UI's
      return to the element focused before; not verified). The question says no number of talebe: the caption on the card does (D2). After a
      refused write the question is STILL OPEN with the error toast over it (nizam closes the question only on a success; nazar closes it first).
    by: human
    on:
      CONFIRM_UNPUBLISH: { target: drafting, effect: [clearToast], say: "they press Taslağa çek in the dialog", source: apps/nizam/features/courses/components/course-settings-page.tsx:441 }
      CANCEL: { target: backToPage, say: "they press Vazgeç, or Esc", source: apps/nizam/features/courses/components/course-settings-page.tsx:432 }
      CLOSE: { target: backToPage, say: "they press the close icon", source: apps/nizam/features/courses/components/course-settings-page.tsx:432 }
    source: apps/nizam/features/courses/components/course-settings-page.tsx:430

  drafting:
    title: The status is written, the question still open
    description: >-
      changeStatus("DRAFT") sends PATCH /courses/:id with `{ status: "DRAFT" }` and nothing else (no version, the last save wins). It needs
      `course.publish`. The dialog stays open until the answer: its confirming button is busy (aria-disabled, with a hidden "Yükleniyor" output from
      the kit's default, F-D2c-13 of nazar) and the dialog ignores every way of closing meanwhile (`if (!publishBusy)`), though "Vazgeç" and "Kapat"
      look live (SETPUB-6, the same as PUB-2 of nazar). A success closes the question, says "Ders taslağa çekildi" in a toast and reads the page
      again; a refusal leaves the question open under an error toast.
    invoke: { action: updateCourse }
    on:
      DONE: { guard: "not statusRefused", target: backToPage, effect: [drafted], say: "the API answered 200: the question closes, toast \"Ders taslağa çekildi\", the page is read again and the card says Taslak", source: apps/nizam/features/courses/components/course-settings-page.tsx:183 }
      FAIL.other: { guard: statusRefused, target: asking, effect: [toastGeneric], say: "the course is gone: the question stays open with 'Ayarlar kaydedilemedi' and the generic sentence", source: apps/nizam/features/courses/components/course-settings-page.tsx:179 }
      CANCEL: { target: drafting, source: apps/nizam/features/courses/components/course-settings-page.tsx:433, say: "they press Vazgeç, or Esc, while the status is written: nothing happens, the change goes on (`if (!publishBusy)`, SETPUB-6)" }
      CLOSE: { target: drafting, source: apps/nizam/features/courses/components/course-settings-page.tsx:433, say: "they press the close icon: nothing happens, the change goes on" }
    source: apps/nizam/features/courses/components/course-settings-page.tsx:173

  publishing:
    title: The publish is on its way
    description: >-
      changeStatus("PUBLISHED") sends `{ status: "PUBLISHED" }`. "Yayımla" is busy (aria-disabled, "Yükleniyor" for a reader of the screen from the
      kit's default); the form's controls, Vazgeç, Kaydet and "Dersi gizle" are off until the answer (`writing`, course-settings-page.tsx:86-88;
      fixed 23 Nov 2026: they stayed live, and a press then went beside the write), and only the link to the public page is live. A success
      says "Ders yayımlandı" and reads the page again; the badge is "Yayında" and the button
      is "Taslağa çek" in the same place. Yayımla asks nothing: publishing is undone with Taslağa çek, and nothing is lost.
    invoke: { action: updateCourse }
    on:
      DONE: { guard: "not statusRefused", target: backToPage, effect: [published], say: "the API answered 200: toast \"Ders yayımlandı\"; the page is read again", source: apps/nizam/features/courses/components/course-settings-page.tsx:184 }
      FAIL.other: { guard: statusRefused, target: backToPage, effect: [toastGeneric], say: "the course is gone: 'Ayarlar kaydedilemedi' and the generic sentence; the card still offers Yayımla", source: apps/nizam/features/courses/components/course-settings-page.tsx:179 }
    source: apps/nizam/features/courses/components/course-settings-page.tsx:173

  backToPage:
    title: The page is back, with the form as it was
    description: >-
      Not a screen: on every way out of a question and on the end of a status change, the page is the clean one or the one holding the pressed controls
      (the status card does not touch the form's draft, and the form is not keyed by the status).
    always:
      - { guard: anythingPressed, target: dirty }
      - { target: clean }
    source: apps/nizam/features/courses/components/course-settings-page.tsx:77

  confirmingHide:
    title: Dersi gizle asks once
    description: >-
      An alertdialog, "Dersi gizle", with the course's title as its eyebrow: "{name} talebelerden ve ziyaretçilerden gizlenecek; ders her listeden çıkar."
      and "Hiçbir şey silinmez; Arşiv’den geri alabilirsiniz." The focus starts on "Vazgeç"; the confirming "Gizle" is the primary button (hiding is
      not destructive). The scrim does not close it. "Vazgeç", Esc and "Kapat" close it and write nothing. After a refused hide the question is still
      open with the toast "Ders gizlenemedi" over it.
    by: human
    on:
      CONFIRM_HIDE: { target: hiding, effect: [clearToast], say: "they press Gizle in the dialog", source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:71 }
      CANCEL: { target: backToPage, say: "they press Vazgeç, or Esc", source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:62 }
      CLOSE: { target: backToPage, say: "they press the close icon", source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:62 }
    source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:60

  hiding:
    title: The course is hidden, the question still open
    description: >-
      hideCourse, POST /courses/:id/archive. The confirming button is busy and the dialog ignores every way of closing meanwhile (SETPUB-6). A success
      closes the question, says "Ders gizlendi" and "<course> artık hiçbir listede görünmüyor." and sends the person to the list of courses
      (router.push) while the page, the opener and the dialog are all gone, so the focus is on nothing (not verified, as F-W3-hide-2 of
      nizam.kosks.editAndHide). A course hidden by someone else meanwhile answers 409 COURSE_ALREADY_HIDDEN, which the page takes as done (what the
      click wanted is done). Any other refusal is the toast "Ders gizlenemedi" with "Bir şeyler ters gitti. Biraz sonra yeniden deneyin." and the question
      stays open.
    invoke: { action: hideCourse }
    on:
      DONE: { guard: "not hideRefused and not settledWorld", target: dersler_opened, say: "the course is hidden: toast 'Ders gizlendi', and the person goes to the list of courses", source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:52 }
      FAIL.settled: { guard: settledWorld, target: dersler_opened, say: "409 COURSE_ALREADY_HIDDEN: the same as done: the same toast and the same list", source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:42 }
      FAIL.other: { guard: hideRefused, target: confirmingHide, effect: [toastHideFailed], say: "any other refusal: 'Ders gizlenemedi' and the question stays open", source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:46 }
      CANCEL: { target: hiding, source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:63, say: "they press Vazgeç, or Esc, while the hide runs: nothing happens, the hide goes on (onOpenChange is ignored while saving, SETPUB-6)" }
      CLOSE: { target: hiding, source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:63, say: "they press the close icon: nothing happens, the hide goes on" }
    source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:36

  dersler_opened:
    title: The list of courses opens
    description: >-
      After a hide the page goes to /kosks/<id>/dersler, where the toast "Ders gizlendi" is up and the course is no longer among the courses; the list
      is nizam.courses.list's, and the hidden course waits in the köşk's Arşiv (nizam.moderation.restoreArchived).
    type: final
    leavesPage: true

  no_access:
    title: The page says "Bu bölüm için izniniz yok"
    description: >-
      A person with no nazım role (the layout's `forbidden()`, HTTP 403, e2e courses#20), or a course of another köşk or an unknown one, or a caller who
      may not edit the course: one screen on purpose, drawn and walked by nizam.shell.noAccessAndNotFound.
    type: final
    leavesPage: true

  load_failed:
    title: The course could not be read
    description: "Any other failure of the reads draws 'Ders bilgisi okunamadı' with 'Yeniden dene' (CourseLoadFailed). Not reachable on the local stack."
    type: final
    leavesPage: true

  left:
    title: They leave the page
    type: final
    leavesPage: true

assertions:
  - id: the-sample-is-sent-only-when-it-differs
    never: "state == 'sendingSample' and sampleDraft == 'unchanged'"
    say: The sample session is written only when the chosen one differs from the stored one.
    source: apps/nizam/features/courses/components/course-settings-page.tsx:116
  - id: the-course-is-sent-only-when-a-field-differs
    never: "state == 'sendingCourse' and fieldsDraft == 'unchanged'"
    say: PATCH /courses/:id is sent only when a box or the zone differs, and carries only what differs.
    source: apps/nizam/features/courses/components/course-settings-page.tsx:145
  - id: the-policy-is-sent-only-when-it-differs
    never: "state == 'sendingPolicy' and policyDraft == 'unchanged'"
    say: PATCH /kosks/:id is sent only when the köşk's policy box differs from the köşk's own value.
    source: apps/nizam/features/courses/components/course-settings-page.tsx:155
  - id: the-sample-goes-before-the-course
    never: "state == 'sendingCourse' and sampleDraft == 'changed' and written == 'no'"
    say: When the sample differs, the course's fields are sent only after the sample's write landed.
    source: apps/nizam/features/courses/components/course-settings-page.tsx:116
  - id: a-conflict-stops-the-save
    never: "(state == 'sendingCourse' or state == 'sendingPolicy') and conflicting and sampleDraft == 'changed'"
    say: A sample write refused for a stale page stops the save; neither the course's fields nor the köşk's policy are sent after it.
    source: apps/nizam/features/courses/components/course-settings-page.tsx:124
  - id: a-success-toast-follows-a-save
    never: "toast == 'saved' and (sampleDraft == 'changed' or fieldsDraft == 'changed' or policyDraft == 'changed')"
    say: After a save the toast says so and nothing is left unsaved; the next press clears the toast.
    source: apps/nizam/features/courses/components/course-settings-page.tsx:167
  - id: only-a-published-course-is-taken-back
    never: "state == 'drafting' and status == 'draft'"
    say: Taslağa çek is offered, and its question asked, on a published course only.
    source: apps/nizam/features/courses/components/course-settings-page.tsx:352
  - id: only-a-draft-is-published
    never: "state == 'publishing' and status == 'published'"
    say: Yayımla is offered on a draft only.
    source: apps/nizam/features/courses/components/course-settings-page.tsx:360
  - id: a-confirm-starts-with-no-toast
    never: "(state == 'drafting' or state == 'hiding') and toast != 'none'"
    say: A write behind a question starts when the person presses its confirming button, with no toast of an earlier step over it.
    source: apps/nizam/features/kosks/components/hide-course-dialog.tsx:36
