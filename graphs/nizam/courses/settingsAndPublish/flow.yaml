# "Ders ayarları" of a course in nizam-web (/kosks/<id>/courses/<id>/ayarlar), used by the köşk's nazım and the başnazım: the five
# settings of the access card and the köşk's recordings policy in one Kaydet, the "Yayın" card (take a published course back to draft
# after being asked once, publish it again, with the number of enrolled talebe in the warning), and "Dersi gizle". Read from the code of
# the branch (the tree of PR #394) on 16 Nov 2026: apps/nizam/app/kosks/[id]/courses/[courseId]/ayarlar/page.tsx and layout, the page
# component features/courses/components/course-settings-page.tsx, features/courses/{present,reads,actions}.ts, hide-course-dialog.tsx,
# the kit's libs/ui/src/mds/{button,checkbox,select,field,alert-dialog,breadcrumb}.tsx, and the API's GET /courses/:id, GET
# /courses/:id/stats, PATCH /lessons/:id, PATCH /courses/:id, PATCH /kosks/:id and POST /courses/:id/archive. Nothing here was seen in a
# browser and no replay has run: "from the code" is the source of every behaviour below, apart from one read-only look at the running API
# (GET /kosks/<kosk2>, which says both policies are off) and the unit specs named in needs.yaml.
#
# It is the sibling of nazar.courseSettings.access and nazar.courseSettings.publish, written from the same facts through a different page,
# and the differences are the point of reading both:
#   - ONE form, one Kaydet and one Vazgeç. nizam has no "Hocalar ve unvanları" card with a Kaydet of its own (the team is a list and a
#     button that opens a dialog, nizam.courses.editHocalar), so the stale e2e of nazar (F-D2c-14: two buttons named Kaydet) does NOT apply
#     here: courses#6 to #9 name Kaydet by role and name and find one button. They are carried as written.
#   - The form is not built again after a save: it is `useState(stored)` once, and `router.refresh()` only moves `stored` under it. So
#     after a save the pressed controls are the stored ones, nothing is lost and nothing is remounted (nazar's F-D2c-7 does not hold); what
#     is lost is the pressed Kaydet, which becomes natively disabled under the focus (F-W4-8).
#   - NO REFUSAL READS THE PAGE AGAIN, and no refusal tells the page the version moved. The conflict (COURSE_VERSION_CONFLICT) is only the
#     sample session's: PATCH /courses/:id takes no version (the inventory's "carrying the course version" is not so: course.controller.ts:300
#     and the DTO), so a save of closed, approval, in person or the zone from an old page is never refused and the last save wins. The
#     toast of the conflict itself says "Sayfayı yenileyip yeniden deneyin", so the person knows to reload (unlike nazar's, which reads the
#     page for her).
#   - The page carries the köşk's RECORDINGS POLICY ("Ders kayıtları herkese açılamaz", manager only) in the same form, and the page's
#     last write after the sample and the course is PATCH /kosks/:id, a policy of the köşk's every course.
#   - The enrolled count is the API's, read with the page (GET /courses/:id/stats), and it is in the card's caption, not in the question.
#   - "Dersi gizle" is here (manager only); nazar has it elsewhere (nazar.archive.hideAndRestoreCourse).
#
# What this flow draws: the page for the manager (köşk nazımı or başnazım) with its three cards, the two option lists, the question
# "Dersi taslağa çek" and the question "Dersi gizle", the toasts of every write, and four ways the page opens differently (the köşk's
# approval policy holds the box, a person who teaches the course but does not manage the köşk, a person with no nazım role, a course
# that is not there). What it does not: see `scope.outOfView`.
#
# Findings it carries, with the inventory's ids: F-W4-8 (the focused Kaydet is turned off by its own success), F-W4-15 (does NOT hold on
# this page: it has no `sent` and no field with an error), F-W4-16 (the "teaches" branch is not dead: it is a nazım of another köşk who
# teaches here), F-W4-17 (the tab and the h1 name no course), F-X-8 (the family of F-W4-8). New ones, proposed ids SETPUB-1 to SETPUB-9, are
# in ui.yaml `rules`: opening the page writes two audit rows, a refusal never reads the page again and a refusal after the sample landed
# makes the retry a conflict, a locked policy is told with the generic sentence, the köşk's recordings policy is not enforced on the write
# side (the same family as RECADD-1 of nazar.recordings.add), the "0 talebe" sentence, the link that opens a new tab and says nothing, the
# skeleton of the wrong page, and the page of a hidden course.
#
# e2e checks it takes over: courses#6 (a1 to a6), #7 (a1 to a6), #8 (a1 to a3), #9 (a1 to a6), #20 (the 403, whose status the replay
# cannot read). None is stale: see needs.yaml.
schema: delurio-graph/0
kind: flow
id: nizam.courses.settingsAndPublish
status: captured
domain: medaris.api
ui: nizam.courses.settingsAndPublish
title: Change a course's settings, publish it, take it back, or hide it
summary: >-
  The köşk's nazım (or the başnazım) opens "Ders ayarları" of a course. The card "Erişim, kayıt ve saat dilimi" has "Kapalı ders", "Örnek
  ders", "Kayıt onayı gereksin", "Celseler yüz yüze yapılır", "Saat dilimi" and, under a line, the köşk's policy "Ders kayıtları herkese
  açılamaz"; "Kaydet" and "Vazgeç" are off until something differs. One Kaydet writes it all in order: the sample session (PATCH /lessons/:id,
  with the course version the page was read at), the course's own fields that differ (PATCH /courses/:id, no version), and the köşk's policy
  (PATCH /kosks/:id) if it changed. A toast says "Ders ayarları kaydedildi". A sample write from an out-of-date page is refused ("Ders, bu
  sayfayı açtığınızdan beri başkası tarafından kaydedildi. Sayfayı yenileyip yeniden deneyin."), nothing is written, and the page is not
  read again: she reloads and tries again. Beside it the card "Yayın" says "Yayında" or "Taslak" and, on a published course, how many talebe
  are enrolled and lose the course; "Taslağa çek" asks once ("Dersi taslağa çek", the focus on "Vazgeç") and writes the status alone,
  "Yayımla" publishes at once. "Dersi gizle" asks once as well and, once the course is hidden, takes her to the list of courses.

scope:
  shows: >-
    the page of Ders ayarları for the manager with its access card, the two option lists, the "Yayın" card with its two questions' worth of
    states, the "Hocalar" and "Dersi gizle" cards, the toasts of the writes, the page that opens with the approval box shut by the köşk's
    policy, the page of a person who teaches the course and does not manage the köşk, and the refusal that stops a person with no nazım role
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "the dialog 'Hocaları düzenle' and everything in it (the e-mail search, the imam, the unvan, the refusals): nizam.courses.editHocalar. Only the section's heading, its list and its button are drawn here"
    - "the köşk's own settings page 'Köşk ayarları', which the sentence under the policy box links to: nizam.kosks.editAndHide (the same two policies, the same refusal for a platform policy that is on, F-W3-3)"
    - "the list of courses 'Dersler' that 'Dersi gizle' ends on, its toast 'Ders gizlendi', the 'Arşiv' and 'Geri al': nizam.courses.list and nizam.moderation.restoreArchived. Here the page ends at the exit `dersler_opened`"
    - "the public page that 'Tanıtım sayfasını gör' opens in a new tab: tedris.course.readProgramme for a published course, tedris.course.draftPreview for a draft (the link is drawn for a draft too: DRAFT-1)"
    - "the course overview that the breadcrumb's course name links to, and the sub-pages of the course (Müfredat, Celseler, Talebeler): nizam.courses.overview, nizam.courses.curriculum, nizam.courses.manageSessions, nizam.courses.roster"
    - "the 404 and 403 screens 'Bu bölüm için izniniz yok' for a course of another köşk, an unknown id, or a nazım of this köşk who may not edit the course (the page's `forbidden()` and `notFound()`), and the page's own failure face 'Ders bilgisi okunamadı' with 'Yeniden dene' (CourseLoadFailed): nizam.shell.noAccessAndNotFound. Here the person with no nazım role is the exit `no_access`, which is e2e courses#20"
    - "the way back of each press: untick 'Kapalı ders' or 'Celseler yüz yüze yapılır', choose İstanbul again, choose 'Örnek ders yok' after a saved sample, tick 'Kayıt onayı gereksin' again, untick the policy box: the same transitions the other way, each drawn one way only (`closeIt`, `dropApproval` and the others hold a control to one press), so that a walk of a world presses the same controls whichever way the checker finds to Kaydet"
    - "a second round of edits after a save in the same visit: the same transitions again from `clean`; the graph keeps one record of what the form shows, and the page's Vazgeç after a save would put back values that the graph does not keep"
    - "the other options of the two lists: about 418 zones and the other sessions of a longer course; the options drawn are the two a world needs"
    - "a save that is refused after an earlier write landed (the sample saved, then the course's fields or the policy refused): the stack cannot make it (nothing but a policy that came on, a lost code or a platform policy refuses a course write, and the sample is written first); the code leaves the earlier write done, tells the person nothing was changed and keeps the old course version, so her retry is a conflict (SETPUB-3)"
    - "a platform policy that is on, which the köşk's policy box cannot switch off (PLATFORM_POLICY_LOCKED from PATCH /kosks/:id, answered with the generic sentence: F-W3-3 of nizam.kosks.editAndHide): switching a platform policy on and off is platform-wide, so no walk does it; the same code path as `policyLate` draws the refusal for the approval box"
    - "AUTHZ_FORBIDDEN of a write ('Bu işlem için yetkiniz yok.'): nothing on the stack takes the nazım's role away while the page is open, and a deleted course reads as it does for the başnazım (see `gone`)"
    - "the enrolled count that could not be read (the stats read answers 403, 404 or fails): the caption then says what taking the course back does without a number (`count: unread`); the stack cannot make it, so it is drawn and not walked"
    - "leaving a changed form: nothing asks (no beforeunload and no router guard in the settings page: F-W4-5), so a menu entry, a link or a reload drops the pressed controls"
    - "an ended session: every server action sends the person to sign in (redirectIfUnauthenticated) instead of drawing an error: realm.auth.signIn, realm.auth.sessionEnded"
    - "a refusal of the köşk write that is not a policy lock (a handle, a name): the page sends only `recordingsNeverPublic`, so none applies"
    - "the page of a course that is already hidden, opened by its address by the manager (who may read it): it draws like any other with no word of it, and 'Dersi gizle' is offered again (SETPUB-8); `alreadyHidden` draws the other half, the hide that finds it done"
    - "the sidebar, its köşk picker and the phone sheet: nizam.shell.menuPerPersona; only the sidebar is named as a landmark that the page sits beside"
    - "the page of a hoca who is only a hoca (no nazım role): nizam's layout sends them to Nazar before this page runs, so they are not a reader of it (F-W4-16 explains who the 'teaches' branch really serves)"

decisions:
  D1:
    question: >-
      Should the köşk's recordings policy be changed from a course's settings page at all? The checkbox says in its own sentence that it covers
      every course of the köşk, not this one, and a manager who ticks it while editing one course's access saves it in the same Kaydet, with
      the same toast "Ders ayarları kaydedildi" that names only this course.
    recommend: >-
      Keep the policy on "Köşk ayarları", where the sentence under the box already points ("Köşk ayarları"), and leave the course page with a
      line that says the policy's state. If it stays, the toast should say that the köşk's policy changed ("Köşk politikası da değişti").
    affects: [dirty, clean]
  D2:
    question: >-
      Should the "Taslağa çek" question say how many talebe lose the course? The number is on the card's caption above the button, not in the
      question the person answers; the question says only "talebeler dersi göremez". The count is the ENROLLED seats only: a COMPLETED talebe
      and the waiting applications lose sight of a draft as well, and are not counted.
    recommend: >-
      Put the count in the question's own sentence ("{count} talebe dersi göremez") and count every seat that is not removed; for none, say that
      nobody is enrolled and not "kayıtlı 0 talebe" (SETPUB-4).
    affects: [asking]
  D3:
    question: >-
      Should a refusal that leaves the stored values as they were read the page again, so that the form shows what is true (a policy that came
      on, a deleted course) and the next Kaydet carries the new version? Today `fail()` only words the refusal and leaves the page as it was.
    recommend: >-
      Read the page again on every refusal and keep the draft of the controls that still apply; after the sample landed, say that the sample was
      saved and the rest was not (SETPUB-3).
    affects: [dirty]

context:
  world:
    initial: any
    values: [saves, stale, policyLate, gone, alreadyHidden, approvalFixed, nonManager, outsider]
    say:
      saves: "the course is published, asks for approval, is open, not in person, in Istanbul, has no sample; the köşk's recordings policy is off; every write is accepted"
      stale: "as saves, and after the page was read someone else saved the course with no change of value, so the course version moved: the sample session's write is refused (409) and nothing is written"
      policyLate: "as saves, and after the page was read the köşk's own policy 'Kayıt her zaman onaylı' came on: switching 'Kayıt onayı gereksin' off is refused (409 PLATFORM_POLICY_LOCKED)"
      gone: "as saves, and the course is deleted while the page is open (read as the başnazım, for whom the API answers 404, not 403): every write answers 404 COURSE_NOT_FOUND"
      alreadyHidden: "as saves, and the course was hidden by someone else after the page was read: 'Dersi gizle' is answered 409 COURSE_ALREADY_HIDDEN, which the page takes as done"
      approvalFixed: "the köşk's policy 'Kayıt her zaman onaylı' is on when the page opens: the approval box is ticked and shut and says why"
      nonManager: "the reader teaches the course and is a nazım elsewhere but does not manage this köşk: no 'Hocaları düzenle', no 'Dersi gizle', the köşk's policy box shut"
      outsider: "the reader has no nazım role at all (a talebe): the /kosks layout refuses before the page runs"
  stored:
    initial: any
    values: [published, draft]
    say:
      published: "the course is published when the page is read: the card says Yayında and offers Taslağa çek"
      draft: "the course is a draft when the page is read: the card says Taslak and offers Yayımla"
  count:
    initial: any
    values: [read, unread]
    say:
      read: "the stats read answered, so the caption says how many talebe are enrolled"
      unread: "the stats read failed or was refused, so the caption says what taking the course back does and no number"
  status: { values: [published, draft], initial: published } # what the card shows
  closed: { values: ["off", "on"], initial: "off" } # what "Kapalı ders" shows
  approval: { values: ["off", "on"], initial: "on" } # what "Kayıt onayı gereksin" shows (the course asks for approval, e2e courses#6 a3)
  inPerson: { values: ["off", "on"], initial: "off" } # what "Celseler yüz yüze yapılır" shows
  zone: { values: [istanbul, berlin], initial: istanbul } # what "Saat dilimi" shows (two of about 418)
  sample: { values: [none, first], initial: none } # what "Örnek ders" shows: no sample, or the first live session
  neverPublic: { values: ["off", "on"], initial: "off" } # what "Ders kayıtları herkese açılamaz" shows
  sampleDraft: { values: [unchanged, changed], initial: unchanged } # the sample differs from what the page read: the first write is due
  fieldsDraft: { values: [unchanged, changed], initial: unchanged } # a box or the zone differs: the course write is due
  policyDraft: { values: [unchanged, changed], initial: unchanged } # the köşk policy box differs: the köşk write is due
  written: { values: [no, yes], initial: no } # the sample write of this Kaydet has landed
  looked: { values: [first, again], initial: first } # the page as it was first read, or as a reload read it
  toast: { values: [none, saved, drafted, published, stale, generic, hideFailed], initial: none } # the toast the last step left

guards:
  # the sample write carries the version the page was read at; someone else's save moved it
  conflicting: "world == 'stale' and looked == 'first'"
  policyWorld: "world == 'policyLate'"
  goneWorld: "world == 'gone'"
  settledWorld: "world == 'alreadyHidden'"
  # PATCH /courses/:id is refused in these worlds
  courseRefused: "policyWorld or goneWorld"
  # PATCH /courses/:id with a status, and POST /courses/:id/archive, are refused in the world where the course is gone
  statusRefused: "goneWorld"
  hideRefused: "goneWorld"
  sampleDue: "sampleDraft == 'changed'"
  fieldsDue: "fieldsDraft == 'changed'"
  policyDue: "policyDraft == 'changed'"
  anythingPressed: "sampleDraft == 'changed' or fieldsDraft == 'changed' or policyDraft == 'changed'"
  # What each world presses. Every press is drawn one way only, so that a walk of a world presses the same controls whichever way the checker
  # finds to Kaydet; the way back is the same transition the other way and is not drawn (outOfView).
  closeIt: "closed == 'off' and (world == 'saves' or goneWorld)"
  dropApproval: "approval == 'on' and (world == 'saves' or policyWorld)"
  markInPerson: "inPerson == 'off' and world == 'saves'"
  pickBerlin: "zone == 'istanbul' and world == 'saves'"
  pickFirst: "sample == 'none' and (world == 'saves' or world == 'stale')"
  tickPolicy: "neverPublic == 'off' and world == 'saves'"
  # Kaydet is on as soon as one control differs; the graph draws its press once the form holds everything the world presses
  readyToSend: "(world == 'saves' and closed == 'on' and approval == 'off' and inPerson == 'on' and zone == 'berlin' and sample == 'first' and neverPublic == 'on') or (world == 'stale' and sample == 'first') or (policyWorld and approval == 'off') or (goneWorld and closed == 'on')"
  isPublished: "status == 'published'"
  isDraft: "status == 'draft'"

effects:
  loadedPlain: { set: { status: published } } # the page was read as the walk's own course is: published, asking approval, open, in Istanbul, no sample (names the read for the effect check)
  loadedDraft: { set: { status: draft } }
  closedOn: { set: { closed: "on", fieldsDraft: changed, toast: none } }
  approvalOff: { set: { approval: "off", fieldsDraft: changed, toast: none } }
  inPersonOn: { set: { inPerson: "on", fieldsDraft: changed, toast: none } }
  zoneBerlin: { set: { zone: berlin, fieldsDraft: changed, toast: none } }
  sampleFirst: { set: { sample: first, sampleDraft: changed, toast: none } }
  policyOn: { set: { neverPublic: "on", policyDraft: changed, toast: none } }
  # Vazgeç puts back what the page read (`setForm(stored)`, `setNeverPublic(kosk.recordingsNeverPublic)`)
  restorePlain: { set: { closed: "off", approval: "on", inPerson: "off", zone: istanbul, sample: none, neverPublic: "off", sampleDraft: unchanged, fieldsDraft: unchanged, policyDraft: unchanged, toast: none } }
  # a reload builds the form again from what the API holds: the pressed controls are gone
  reloadedLost: { set: { closed: "off", approval: "on", inPerson: "off", zone: istanbul, sample: none, neverPublic: "off", sampleDraft: unchanged, fieldsDraft: unchanged, policyDraft: unchanged, toast: none, looked: again } }
  # a reload of a saved page shows what was saved: the values are the ones the controls hold
  reloadedSaved: { set: { toast: none, looked: again } }
  sampleLanded: { set: { written: yes } }
  savedAll: { set: { sampleDraft: unchanged, fieldsDraft: unchanged, policyDraft: unchanged, written: no, toast: saved } }
  toastStale: { set: { toast: stale } }
  toastGeneric: { set: { toast: generic } }
  toastHideFailed: { set: { toast: hideFailed } }
  drafted: { set: { status: draft, toast: drafted } }
  published: { set: { status: published, toast: published } }
  clearToast: { set: { toast: none } }

failures:
  opened:
    from: getCourse
    missing: [COURSE_NOT_FOUND]
    failed: []
  sendingSample:
    from: updateLesson
    stale: [COURSE_VERSION_CONFLICT]
  sendingCourse:
    from: updateCourse
    policy: [PLATFORM_POLICY_LOCKED]
    other: [COURSE_NOT_FOUND]
  drafting:
    from: updateCourse
    other: [COURSE_NOT_FOUND]
  publishing:
    from: updateCourse
    other: [COURSE_NOT_FOUND]
  hiding:
    from: hideCourse
    settled: [COURSE_ALREADY_HIDDEN]
    other: [COURSE_NOT_FOUND]

# The story the page tells first, and e2e courses#6, #7, #8 and #9 as one visit: the nazım unticks "Kayıt onayı gereksin" and ticks "Kapalı ders"
# and "Celseler yüz yüze yapılır", chooses Berlin and the first celse as the sample, ticks the köşk's policy and saves once, reloads and reads each
# value back, takes the course back to draft and publishes it again, and hides it.
main:
  given: { world: saves, stored: published, count: read }
  events: [DONE, TOGGLE_APPROVAL, TOGGLE_CLOSED, TOGGLE_IN_PERSON, OPEN_SAMPLE, PICK_FIRST, OPEN_ZONE, PICK_BERLIN, TOGGLE_POLICY, SUBMIT, DONE, DONE, DONE, RELOAD, DONE, UNPUBLISH, CONFIRM_UNPUBLISH, DONE, PUBLISH, DONE, HIDE, CONFIRM_HIDE, DONE]

initial: entered

states:
  entered:
    title: The /kosks layout lets the person in, or refuses them
    description: >-
      Not a screen. Every /kosks page sits under app/kosks/layout.tsx, which reads the caller's assignments and refuses with `forbidden()` when
      they are not a nazım (`landingFor(me) !== "nizam"`): a talebe, a person with medrese or course roles only. It answers before the page
      runs and without a skeleton, so it is the one refusal of this address that is HTTP 403 (NOACC-2 of nizam.shell.noAccessAndNotFound), as e2e
      courses#20 asserts; the replay does not read the status. When the assignments cannot be read the page is let through and tedrisat
      refuses each read itself.
    always:
      - { guard: "world == 'outsider'", target: no_access, say: "a person with no nazım role: the layout refuses them before the page runs", source: apps/nizam/app/kosks/layout.tsx:20 }
      - { target: opened, say: "a nazım, the başnazım or a hoca who is a nazım elsewhere: the page runs" }
    source: apps/nizam/app/kosks/layout.tsx:19

  opened:
    title: The page reads the köşk, the course, the caller's roles and the enrolled count
    description: >-
      The server component reads GET /kosks/:id, GET /courses/:id and GET /me together (readCourseScope) and, beside them, GET
      /courses/:id/stats for the enrolled count, behind a skeleton that is the course OVERVIEW's, not this page's (loading.tsx of the course
      folder, SETPUB-7). A course of another köşk or an unknown one is `notFound()`, a caller who is neither the köşk's manager nor the
      course's hoca is `forbidden()`: both are the one screen "Bu bölüm için izniniz yok" (exit `no_access`), and a read that fails is "Ders
      bilgisi okunamadı" with "Yeniden dene" (exit `load_failed`). The manager reads the course with `course.content_read` audited AND the stats
      with `course.roster_read` audited: two audit rows every time the page opens, to word one caption (SETPUB-1). From the code: the page
      sets no initial focus (focus-not-set).
    invoke: { action: getCourse }
    on:
      DONE:
        - { guard: "world == 'approvalFixed' and stored == 'draft'", target: readFixed, effect: [loadedDraft], say: "the köşk's approval policy holds the box, and the course is a draft", source: apps/nizam/features/courses/components/course-settings-page.tsx:94 }
        - { guard: "world == 'approvalFixed'", target: readFixed, effect: [loadedPlain], say: "the köşk's approval policy holds the box: ticked and shut", source: apps/nizam/features/courses/components/course-settings-page.tsx:94 }
        - { guard: "world == 'nonManager' and stored == 'draft'", target: readLimited, effect: [loadedDraft], say: "a hoca who is a nazım elsewhere reads a draft", source: apps/nizam/features/courses/components/course-settings-page.tsx:50 }
        - { guard: "world == 'nonManager'", target: readLimited, effect: [loadedPlain], say: "a hoca who is a nazım elsewhere: no team button, no hide card, the policy box shut", source: apps/nizam/features/courses/components/course-settings-page.tsx:50 }
        - { guard: "stored == 'draft'", target: clean, effect: [loadedDraft], say: "the course is a draft: the card says Taslak and offers Yayımla", source: apps/nizam/features/courses/components/course-settings-page.tsx:95 }
        - { target: clean, effect: [loadedPlain], say: "the course is published: the card says Yayında and offers Taslağa çek", source: apps/nizam/features/courses/components/course-settings-page.tsx:95 }
      FAIL.missing: no_access
      FAIL.failed: load_failed
    source: "apps/nizam/app/kosks/[id]/courses/[courseId]/ayarlar/page.tsx:29"

  readFixed:
    title: The page opens with the approval box shut by the köşk's policy
    by: human
    description: >-
      "Kayıt onayı gereksin" is ticked and shut and says "Köşk politikası gereği her kayıt onaya bağlıdır; bu derste değiştirilemez." (the köşk's
      `alwaysRequireApproval`, `fixed`; the box shows `effectiveApproval`, ticked whatever the course's own flag holds, and `disabled={saving ||
      fixed}`). The other controls and both cards behave as in `clean`, where a press leads; the box stays shut there too, for `fixed` is
      read once (the page's `world`). The page does not read
      the PLATFORM policy of the same name: when that one is on the box is open and the save is refused (policyLate, SETPUB-2). The page sets no
      focus (focus-not-set).
    on:
      # The controls are live here as in `clean`, and each press goes where it goes from there; this world draws none of the boxes' presses
