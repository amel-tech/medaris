schema: delurio-graph/0
kind: needs
id: nizam.courses.settingsAndPublish
status: proposed
summary: >-
  What must exist for a köşk's nazım (and the başnazım) to change a course's settings, publish it and take it back, and hide it,
  from Ders ayarları in nizam: the flow's product list.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# The e2e checks of this page (courses#6, #7, #8, #9, #20) are NOT stale: unlike nazar's (F-D2c-14), this page has one Kaydet and one Vazgeç, so each check names its button
# by role and name and finds one. They are listed under `walked` where they pin the behaviour. They read the course through the database, not through a reload, so the
# "read back after a reload" half of a story is the replay's effect check. No replay scenario is named under `walked`: none has run (the replays are one phase, at the end).
#
# missing (the need has no code; none has an issue): the-recordings-policy-is-kept-on-the-write (SETPUB-5), a-locked-rule-is-worded (SETPUB-2), a-refusal-reads-the-page-again
# (SETPUB-3, D3), the-warning-says-who-loses-the-course (SETPUB-4, D2), opening-the-page-writes-no-second-audit-row (SETPUB-1), focus-after-a-save (F-W4-8),
# leaving-a-changed-form-asks (F-W4-5), the-tab-names-the-course (F-W4-17), a-new-tab-is-said (SETPUB-9), cancel-and-close-say-they-are-busy (SETPUB-6),
# a-hidden-course-says-so (SETPUB-8), the-page-has-its-own-skeleton (SETPUB-7), the-zone-list-is-usable (F-D2c-17 of nazar, the same util), the-policy-saves-with-its-own-word (D1)
# unwalked (code, no e2e or replay that passes): kaydet-waits-for-a-change (unit spec only), the-sample-moves-with-the-version-and-a-stale-page-is-told (no e2e: the
# replay's `stale`), the-kosk-policy-holds-the-approval-box (unit spec; the replay's `fixed`), a-hoca-who-is-a-nazim-elsewhere-gets-the-limited-page (unit spec; no replay),
# the-enrolled-count-is-in-the-warning (no e2e; the replay's `saves`), the-hide-that-finds-it-done-is-done (the replay's `alreadyHidden`), the-recordings-policy-is-changed-by-the-manager
# (no e2e; the replay's `saves`), the-public-page-link (no e2e)
# The scenarios that will walk the rest are named in comments, not under `walked`, because none has run.

needs:
  - id: change-settings-in-one-save
    need: >-
      The köşk's nazım changes whether the course is closed, whether enrolment waits for approval, its sample session, whether its
      celses are in person and its time zone, and one Kaydet saves them all: the sample first (held to the version the page was
      read at), then the course's own fields, only what differs; the person is told in a toast.
    evidence:
      - state: clean
      - state: dirty
      - state: sending
      - state: sendingSample
      - state: afterSample
      - state: sendingCourse
      - state: afterCourse
      - node: closedBox
      - node: approvalBox
      - node: inPersonBox
      - node: sampleField
      - node: zoneField
      - node: submit
      - node: savedTitle
      - node: savedBody
      - source: apps/tedrisat/src/course/lesson.controller.ts:355
      - source: apps/tedrisat/src/course/course.controller.ts:300
      - source: apps/nizam/features/courses/components/course-settings-page.tsx:109
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 1–2: the page opens with the course's values and saves approval and closed"
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 5: the time zone is saved and the sample session is chosen"
      - test: apps/nizam/test/course-settings-in-person.spec.tsx
    note: |-
      courses#6: a1 to a6: the page opens with approval ticked and closed not; both are changed and saved; the toast; the course
      holds requiresApproval false and isClosed true
      courses#9: a1 to a6: Berlin and "Bağlantılı celse" are chosen and saved; the zone and the sample are stored
      apps/nizam/test/course-settings-in-person.spec.tsx: the box alone in the PATCH, and cleared with false (MDRS-283; no e2e
      touches it)
      replay: saves (written, not run)

  - id: kaydet-waits-for-a-change
    need: >-
      Kaydet and Vazgeç are off until something differs from what is stored, in the form or in the köşk's policy box, and Vazgeç
      puts back what the page read.
    evidence:
      - state: clean
      - state: dirty
      - state: reverting
      - node: submit
      - node: cancel
      - source: apps/nizam/features/courses/components/course-settings-page.tsx:93
      - test: apps/nizam/test/course-settings-in-person.spec.tsx
    note: "replay: saves (written, not run)"

  - id: read-back-after-a-save
    need: After a save, and after a reload, every control shows what was saved, read from the API and not kept by the browser.
    evidence:
      - state: clean
      - state: reloading
      - node: closedBox
      - node: approvalBox
      - node: inPersonBox
      - node: sampleField
      - node: zoneField
      - node: neverPublicBox
      - source: "apps/nizam/app/kosks/[id]/courses/[courseId]/ayarlar/page.tsx:29"
      - test: apps/nizam/e2e/courses.e2e.ts
        name: "criteria 1–2: the page opens with the course's values and saves approval and closed"
    note: |-
      courses#6: a6 and courses#9 a5, a6 read the stored course through the database
      replay: saves (written, not run): the effects `savedAll` and `reloadedSaved` read the course and the köşk through the API

  - id: the-sample-moves-with-the-version-and-a-stale-page-is-told
    need: >-
      Choosing the sample session writes with the course version the page was read at, so that a page that is out of date changes
