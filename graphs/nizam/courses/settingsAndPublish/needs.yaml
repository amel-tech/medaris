      - state: reloading
      - source: apps/tedrisat/src/course/lesson.controller.ts:355
      - source: apps/nizam/features/courses/components/course-settings-page.tsx:116
    note: "replay: stale (written, not run). No e2e names it (courses#9 saves the sample on a fresh page)."

  - id: the-recordings-policy-is-changed-by-the-manager
    need: >-
      The köşk's nazım (and the başnazım) ticks "Ders kayıtları herkese açılamaz" on a course's settings and it is saved with the
      rest as the köşk's own policy, for every course of the köşk; a hoca who does not manage the köşk sees it shut.
    evidence:
      - node: neverPublicBox
      - node: neverPublicDesc
      - node: policyTitle
      - node: policyIntro
      - node: policyLink
      - state: sendingPolicy
      - source: apps/tedrisat/src/kosk/kosk.controller.ts:340
      - source: apps/nizam/features/courses/components/course-settings-page.tsx:155
      - test: apps/nizam/test/course-views.spec.tsx
    note: |-
      apps/nizam/test/course-views.spec.tsx: "leaves the manager's boxes out for a müderris" (:248)
      replay: saves (written, not run); no e2e touches the box

  - id: the-recordings-policy-is-kept-on-the-write
    need: >-
      While the köşk's policy "Ders kayıtları herkese açılamaz" is on, no recording of any course of the köşk can be made public
      by anyone, and the switch that makes it public is shut; it is not enough that a visitor's read withholds it.
    missing: no Linear issue; SETPUB-5
    note: |-
      Drawn on the nodes neverPublicBox and neverPublicDesc, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).
      SETPUB-5, the köşk's side of RECADD-1 (ledger/security.md); the read side is built (course.service.ts:861-871)

  - id: the-policy-saves-with-its-own-word
    need: >-
      A save that changed the köşk's policy says so ("Köşk politikası da değişti"), because it covers every course of the köşk and
      the toast names only this course.
    missing: no Linear issue; D1
    note: |-
      Drawn on the nodes savedBody and neverPublicBox, which the code has: they are not evidence, so that a replay still walks
      them (SPEC.md §13 leaves out what only missing needs name).
