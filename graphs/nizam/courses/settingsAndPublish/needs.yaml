# What must exist for a köşk's nazım (and the başnazım) to change a course's settings, publish it and take it back, and hide it, from Ders ayarları in nizam: the flow's
# product list (LAYOUT.md section 7). Each need is what the product must do, from the flow's story and the decisions it leaves open, not from what the page does today;
# the known gaps go to graphs/needs.gaps.yaml, which the orchestrator merges. Read by people for now: no checker runs on this file yet.
#
# The e2e checks of this page (courses#6, #7, #8, #9, #20) are NOT stale: unlike nazar's (F-D2c-14), this page has one Kaydet and one Vazgeç, so each check names its button
# by role and name and finds one. They are listed under `walked` where they pin the behaviour. They read the course through the database, not through a reload, so the
# "read back after a reload" half of a story is the replay's effect check. No replay scenario is named under `walked`: none has run (the replays are one phase, at the end).
#
# missing (the need has no code; none has an issue): the-recordings-policy-is-kept-on-the-write (SETPUB-5), a-locked-rule-is-worded (SETPUB-2), a-refusal-reads-the-page-again
#   (SETPUB-3, D3), the-warning-says-who-loses-the-course (SETPUB-4, D2), opening-the-page-writes-no-second-audit-row (SETPUB-1), focus-after-a-save (F-W4-8),
#   leaving-a-changed-form-asks (F-W4-5), the-tab-names-the-course (F-W4-17), a-new-tab-is-said (SETPUB-9), cancel-and-close-say-they-are-busy (SETPUB-6),
#   a-hidden-course-says-so (SETPUB-8), the-page-has-its-own-skeleton (SETPUB-7), the-zone-list-is-usable (F-D2c-17 of nazar, the same util), the-policy-saves-with-its-own-word (D1)
# unwalked (code, no e2e or replay that passes): kaydet-waits-for-a-change (unit spec only), the-sample-moves-with-the-version-and-a-stale-page-is-told (no e2e: the
#   replay's `stale`), the-kosk-policy-holds-the-approval-box (unit spec; the replay's `fixed`), a-hoca-who-is-a-nazim-elsewhere-gets-the-limited-page (unit spec; no replay),
#   the-enrolled-count-is-in-the-warning (no e2e; the replay's `saves`), the-hide-that-finds-it-done-is-done (the replay's `alreadyHidden`), the-recordings-policy-is-changed-by-the-manager
#   (no e2e; the replay's `saves`), the-public-page-link (no e2e)
# The scenarios that will walk the rest are named in comments, not under `walked`, because none has run.
kind: needs
flow: nizam.courses.settingsAndPublish
status: proposed

needs:
  - id: change-settings-in-one-save
    need: >-
      The köşk's nazım changes whether the course is closed, whether enrolment waits for approval, its sample session, whether its celses are in person and its time zone,
      and one Kaydet saves them all: the sample first (held to the version the page was read at), then the course's own fields, only what differs; the person is told in a toast.
    drawn: [clean, dirty, sending, sendingSample, afterSample, sendingCourse, afterCourse, closedBox, approvalBox, inPersonBox, sampleField, zoneField, submit, savedTitle, savedBody]
    built:
      - action: medaris.api:updateLesson
      - action: medaris.api:updateCourse
      - route: apps/nizam/features/courses/components/course-settings-page.tsx:106
    walked:
      - e2e: apps/nizam/e2e/courses.e2e.ts
        check: 'courses#6' # a1 to a6: the page opens with approval ticked and closed not; both are changed and saved; the toast; the course holds requiresApproval false and isClosed true
      - e2e: apps/nizam/e2e/courses.e2e.ts
        check: 'courses#9' # a1 to a6: Berlin and "Bağlantılı celse" are chosen and saved; the zone and the sample are stored
      - test: apps/nizam/test/course-settings-in-person.spec.tsx # the box alone in the PATCH, and cleared with false (MDRS-283; no e2e touches it)
    # replay: saves (written, not run)

  - id: kaydet-waits-for-a-change
    need: >-
      Kaydet and Vazgeç are off until something differs from what is stored, in the form or in the köşk's policy box, and Vazgeç puts back what the page read.
    drawn: [clean, dirty, reverting, submit, cancel]
    built:
      - route: apps/nizam/features/courses/components/course-settings-page.tsx:90
    walked:
      - test: apps/nizam/test/course-settings-in-person.spec.tsx
    # replay: saves (written, not run)

  - id: read-back-after-a-save
    need: >-
      After a save, and after a reload, every control shows what was saved, read from the API and not kept by the browser.
    drawn: [clean, reloading, closedBox, approvalBox, inPersonBox, sampleField, zoneField, neverPublicBox]
    built:
      - route: "apps/nizam/app/kosks/[id]/courses/[courseId]/ayarlar/page.tsx:29"
    walked:
      - e2e: apps/nizam/e2e/courses.e2e.ts
        check: 'courses#6' # a6 and courses#9 a5, a6 read the stored course through the database
    # replay: saves (written, not run): the effects `savedAll` and `reloadedSaved` read the course and the köşk through the API

  - id: the-sample-moves-with-the-version-and-a-stale-page-is-told
    need: >-
      Choosing the sample session writes with the course version the page was read at, so that a page that is out of date changes nothing and the person is told to reload;
      the course's own fields never conflict (the last save wins).
    drawn: [sendingSample, staleBody, failedTitle, dirty, reloading]
    built:
      - action: medaris.api:updateLesson
      - route: apps/nizam/features/courses/components/course-settings-page.tsx:113
    walked: []
    # replay: stale (written, not run). No e2e names it (courses#9 saves the sample on a fresh page).

  - id: the-recordings-policy-is-changed-by-the-manager
    need: >-
      The köşk's nazım (and the başnazım) ticks "Ders kayıtları herkese açılamaz" on a course's settings and it is saved with the rest as the köşk's own policy, for every course
      of the köşk; a hoca who does not manage the köşk sees it shut.
    drawn: [neverPublicBox, neverPublicDesc, policyTitle, policyIntro, policyLink, sendingPolicy]
    built:
      - action: medaris.api:updateKosk
      - route: apps/nizam/features/courses/components/course-settings-page.tsx:152
    walked:
      - test: apps/nizam/test/course-views.spec.tsx # "leaves the manager's boxes out for a müderris" (:248)
    # replay: saves (written, not run); no e2e touches the box

  - id: the-recordings-policy-is-kept-on-the-write
    need: >-
      While the köşk's policy "Ders kayıtları herkese açılamaz" is on, no recording of any course of the köşk can be made public by anyone, and the switch that makes it
      public is shut; it is not enough that a visitor's read withholds it.
    drawn: [neverPublicBox, neverPublicDesc]
    missing: none
    # SETPUB-5, the köşk's side of RECADD-1 (ledger/security.md); the read side is built (course.service.ts:857-867)

  - id: the-policy-saves-with-its-own-word
    need: >-
      A save that changed the köşk's policy says so ("Köşk politikası da değişti"), because it covers every course of the köşk and the toast names only this course.
    drawn: [savedBody, neverPublicBox]
    missing: none
    # D1

  - id: the-kosk-policy-holds-the-approval-box
    need: >-
      When the köşk's policy "Kayıt her zaman onaylı" is on, the approval box is ticked and shut and says why, whatever the course's own flag holds.
    drawn: [readFixed, approvalBox, approvalFixedDesc]
    built:
      - route: apps/nizam/features/courses/components/course-settings-page.tsx:248
      - route: apps/nizam/features/courses/present.ts:1184
    walked:
      - test: apps/nizam/test/course-views.spec.tsx # "checks and locks the approval box under the köşk policy" (:283)
      - test: apps/nizam/test/course-settings-in-person.spec.tsx
    # replay: fixed (written, not run)

  - id: a-locked-rule-is-worded
    need: >-
      A switch-off that a policy holds (approval under the köşk's or the platform's policy, the köşk's recordings policy under the platform's) is refused in words that name the
      policy, the page is read again, and the box shows its lock; "try again" is never said of a thing that will be refused every time.
    drawn: [sendingCourse, dirty, genericBody, failedTitle]
    missing: none
    # SETPUB-2, F-W3-3; replay: policyLate (written, not run) draws the refusal as the page words it today

  - id: a-refusal-reads-the-page-again
    need: >-
      After a refused write the page is read again, keeps the controls that still apply, and says what was saved and what was not; a retry is never a conflict that the person
      did not cause.
    drawn: [dirty, sendingSample, sendingCourse, staleBody, genericBody]
    missing: none
    # SETPUB-3, D3

  - id: take-back-to-draft-after-asking
