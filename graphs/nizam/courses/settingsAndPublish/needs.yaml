      then on the course shows only to its staff, the köşk's nazım and Medaris's management. Cancelling leaves everything as it
      was; the question stays open under an error toast when the write is refused.
    evidence:
      - state: asking
      - state: drafting
      - node: unpublishDialog
      - node: unpublishCancel
      - node: unpublishConfirm
