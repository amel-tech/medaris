    drawn: [asking, drafting, unpublishDialog, unpublishCancel, unpublishConfirm, unpublishClose, draftedTitle, draftedBody, statusDraft]
    built:
      - action: medaris.api:updateCourse
      - route: apps/nizam/features/courses/components/course-settings-page.tsx:170
    walked:
      - e2e: apps/nizam/e2e/courses.e2e.ts
        check: 'courses#7' # a1 to a4: "Taslağa çek", the alertdialog's confirm, "Ders taslağa çekildi", the course is DRAFT in the database
    # replay: saves, gone (written, not run)

