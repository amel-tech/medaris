edges:
  - { labelledBy: [publishRegion, publishTitle] }
  - { labelledBy: [teamRegion, teamTitle] }
  - { labelledBy: [hideRegion, hideTitle] }
  - { labelledBy: [unpublishDialog, unpublishTitle] }
  - { labelledBy: [hideDialog, hideDialogTitle] }
  - { triggers: [submit, sending] }
  - { triggers: [cancel, reverting] }
  - { triggers: [unpublishButton, asking] }
  - { triggers: [unpublishConfirm, drafting] }
  - { triggers: [publishButton, publishing] }
  - { triggers: [hideButton, confirmingHide] }
  - { triggers: [hideConfirm, hiding] }
  - { returnsFocus: [unpublishDialog, unpublishButton] } # Vazgeç, Esc or Kapat: the button that opened it is still there (Base UI returns to the element focused before; not verified in a browser)
  - { returnsFocus: [hideDialog, hideButton] } # the same; after a success the page is gone (exit `dersler_opened`)

rules:
  - { id: focus-not-set, rule: "The page sets no initial focus when it opens and none after a save, a refusal or a status change; nothing in course-settings-page.tsx calls focus() or sets autoFocus, and a toast does not take it. The two questions set their own (Vazgeç, the kit's `initialFocus={cancel}`). A keyboard user starts from the top of the document and tabs through the sidebar first. The graph draws no `initialFocus` on the page and no `focus`." }
  - { id: F-W4-8, rule: "course-settings-page.tsx:315-321 (inventory F-W4-8): 'Kaydet' is `disabled={!dirty}`, natively. While the save runs it is `loading` (aria-disabled, so it keeps the focus), but once the writes are done and `router.refresh()` has moved `stored` under the form, `dirty` is false and the button the person pressed becomes a natively disabled button under the focus; the toast is the only word that it worked. Not verified in a browser. Same family as F-X-8. Fix: keep it aria-disabled after a save, or move the focus to the card's heading. Unlike nazar's card (F-D2c-7), nothing is built again: the form keeps what was pressed." }
  - { id: F-W4-15, rule: "Does NOT hold for this page as the code stands (inventory F-W4-15 names `course-settings-page.tsx` among its places): there is no `sent` state, no validation and no field with an error text here, because every control takes only a value from a list or a box; the failures are toasts. The finding belongs to course-create-form.tsx and session-plan-form.tsx (nizam.courses.open, nizam.courses.planSessions). Recorded so that nobody looks for it here." }
  - { id: F-W4-16, rule: "features/courses/reads.ts:48, features/kosks/kosk-abilities.ts:70-80, app/kosks/layout.tsx:20 (inventory F-W4-16, corrected): the 'teaches this course' branch is not dead. A person who is only a hoca is sent to Nazar by the layout, but a nazım of ANOTHER köşk who also teaches this course passes the layout and `mayEditCourse`, and then `manager` is false: no 'Hocaları düzenle', no 'Dersi gizle', the köşk's policy box shut (state readLimited). That is who `taughtElsewhere` lists on the Dersler page. Read from the code; not walked, and the seed has no such person. The page of that person opens as `readLimited`; its presses lead into the states every reader shares, where `world` keeps the manager's cards out and the policy box shut." }
  - { id: F-W4-17, rule: "app/kosks/[id]/courses/[courseId]/ayarlar/page.tsx:13-16 (inventory F-W4-17): the tab's title and the h1 are 'Ders ayarları' for every course; only the breadcrumb's middle link and the sentence under the h1 name the course. A nazım with two courses open in two tabs cannot tell them apart by their titles. Fix: put the course in the title and in an eyebrow." }
  - { id: F-W4-5, rule: "Inventory F-W4-5: the form loses its pressed controls silently when the person follows the breadcrumb, the menu or Back, or reloads: course-settings-page.tsx has no beforeunload and no router guard. The only sign of an unsaved change is that Kaydet and Vazgeç are on. Fix: a leave guard while `dirty`." }
  - { id: F-D2c-14-does-not-apply, rule: "nazar's finding F-D2c-14 (two buttons named Kaydet, so the e2e's `getByRole('button', { name: 'Kaydet' })` breaks in strict mode) does not hold here: this page has ONE form with one Kaydet and one Vazgeç, and the team is a list with a button that opens a dialog. courses#6 and #9 name Kaydet by role and name and find one button, so they are carried as written. The MuderrisDialog, which has its own Kaydet, is not in the page until it is opened. The card is not a labelled form (`<form class=\"mds-card\">` with no aria-labelledby), so the replay finds its controls by their own names, inside <main>." }
  - { id: SETPUB-1, rule: "New finding (proposed id), from the code. Opening the page writes TWO audit rows for the köşk's nazım and the başnazım: GET /courses/:id is `viewDetail` with `audit: true` (course.service.ts:372-411, `course.content_read`, written for anyone who is not the course's müderris or an enrolled talebe) and GET /courses/:id/stats calls `auditRosterRead` (course.controller.ts:548, `course.roster_read`). The second read exists only to word one caption ('kayıtlı {count} talebe'), and page.tsx:30-33 asks for it on every visit, also when nobody looks at the Yayın card and for a draft, whose caption is not drawn at all. Nazar's page leaves the count out for exactly this reason (its comment). Same family as KOSKHOME-1 and MENU-3. Fix: read the count only when the course is published, or on the press of 'Taslağa çek'." }
  - { id: SETPUB-2, rule: "New finding (proposed id), from the code. `courseErrorKey` (present.ts:1219-1237) has no entry for PLATFORM_POLICY_LOCKED, so a policy that holds a rule is worded 'İşlem tamamlanamadı. Biraz sonra yeniden deneyin.', which tells the person to try again a thing that will be refused every time. Three places meet it: the approval box when a PLATFORM policy of the same name is on (the page reads only the köşk's own flag, `fixed`, so the box is open and the save is refused), the same box when the KÖŞK's policy came on after the page was read (`policyLate`, drawn), and the köşk's policy box when a platform policy holds it (F-W3-3 of nizam.kosks.editAndHide, the same generic sentence; the catalog has 'Bu ayar platform politikasıyla kapalı.' unused here). After the refusal the page is not read again, so the box stays open and unticked. Fix: word the code and read the page again so the box shows its lock." }
  - { id: SETPUB-3, rule: "New finding (proposed id), from the code. No refusal reads the page again (`fail()` words it, course-settings-page.tsx:100-104, and every `return` leaves the form, `course` and `stored` as they were). (a) A conflict on the sample leaves the person on a page whose version is old: Kaydet stays on and the same press is refused again until she reloads, which drops every control she had pressed (the toast does say to reload). (b) A refusal AFTER the sample landed (the course's fields or the policy refused: nothing but a policy that came on, a code taken back or a platform policy does it, so the stack cannot) leaves the sample written with the new course version unseen by the page: the toast says 'Ayarlar kaydedilemedi' and nothing of a sample, and her retry resends the sample (the form still differs from `stored`) with the OLD version, so it is a conflict and she is told that someone else saved the course when it was she (:113-126). Nazar words the first and drops the pressed controls; this page keeps them and says nothing. Fix: read the page again after any write that landed, and say what was saved and what was not." }
  - { id: SETPUB-4, rule: "New finding (proposed id), from the code. The caption above 'Taslağa çek' counts `enrolledCount`, the ENROLLED seats only (course-stats.repository: status ENROLLED), and has no zero form: a course nobody is enrolled in reads 'kayıtlı 0 talebe de celselere ve ders kayıtlarına erişemez' (CourseSettings.unpublishNoteCount, one message for every count). A COMPLETED talebe and the waiting applications lose sight of a draft as well and are not counted, and the question the person answers ('talebeler dersi göremez') carries no number (decision D2). Fix: two messages, none and some; count every seat that is not removed; say the number in the question." }
  - { id: SETPUB-5, rule: "New finding (proposed id), from the code; the same family as RECADD-1 of nazar.recordings.add (the medrese's policy) and the domain's policy-no-public-recordings-inert. The box says 'Açıkken hiçbir ders kaydı herkese açık yapılamaz ve YouTube’a yüklenemez' (CourseSettings.neverPublicDesc). What the köşk's policy does: tedrisat reads `kosks.recordingsNeverPublic` when a course's recordings are read by someone who cannot read its content, and withholds the PUBLIC ones (course.service.ts:857-867 `publicRecordingsAllowed`, used at :744 and :812; domain/recording.ts:176-188 `visibleRecordings`), so a visitor does not see them. What it does NOT do: nothing refuses the WRITE. createLessonRecording and updateRecording (recording.service.ts:68, :93) take `visibility: PUBLIC` with no look at the köşk's policy, the permission `setting.recordings_public` that the policy closes (authz/tedrisat-authz-context.service.ts:459, policies.ts:23) is asked by no route, and nazar's 'Herkese açık' switch is locked only by a closed course. So a hoca can make a recording public in a köşk that forbade it, the recording shows 'Herkese açık' in Nazar, and only the visitor's read hides it. Unlike the medrese's policy (which no read honours either), the köşk's policy is honoured on the read side. 'YouTube’a yüklenemez' refers to a feature that is not built (publish to the Medaris channel, MDRS-204). Not run; read from the code. Fix: refuse PUBLIC on the write while the policy is on and lock the switch in Nazar; drop or build the YouTube sentence." }
  - { id: SETPUB-6, rule: "New finding (proposed id), from the code; the same as PUB-2 of nazar.courseSettings.publish and HIDE-3 of nazar.archive.hideAndRestoreCourse. While a status is written or the course is hidden the question ignores every way of closing (`if (!publishBusy)`, course-settings-page.tsx:425-427; `if (!saving)`, hide-course-dialog.tsx:62-64), but 'Vazgeç' and the close icon stay enabled and a press does nothing; only the confirming button is marked busy (the kit's AlertDialog has no way to disable them). Fix: disable both for the length of the call, in the kit." }
  - { id: SETPUB-7, rule: "New finding (proposed id), from the code. The page has no loading.tsx of its own, so the skeleton that streams while it reads (and the 200 status under which its refusals are sent, NOACC-2) is app/kosks/[id]/courses/[courseId]/loading.tsx, which is the COURSE OVERVIEW's: 'a heading, the number cards and rows of sessions' (its own comment). The settings page has a form and three cards, so what the person sees for a moment is the shape of another page. Fix: a loading.tsx beside the page." }
  - { id: SETPUB-8, rule: "New finding (proposed id), from the code, not run. The manager may read a course that is hidden (getDetail opens it to the people who may restore it, course.service.ts:317-338) and the page opens for it like any other: nothing says the course is hidden, 'Dersi gizle' is offered again and 'Yayımla' or 'Taslağa çek' write to it. Pressing 'Gizle' answers 409 COURSE_ALREADY_HIDDEN, which the page takes as done and says 'Ders gizlendi' (hide-course-dialog.tsx:42-45). Same family as F-W3-hide-3 of nizam.kosks.editAndHide. Fix: read `archivedAt`, say it at the top and offer 'Geri al'." }
  - { id: SETPUB-9, rule: "New finding (proposed id), from the code. 'Tanıtım sayfasını gör' opens in a new tab (`target=\"_blank\"`, course-settings-page.tsx:205-213) with a share icon and no word of it: its name is 'Tanıtım sayfasını gör', where nazar's says '(yeni sekmede açılır)'. WCAG 3.2.5 asks the new tab to be said; label-in-name (2.5.3) holds. It is drawn for a draft too, where it leads to a page Tedris refuses to a person whose only session is nizam's (DRAFT-1 of tedris.course.draftPreview, seen in a browser there). The address is {TEDRIS_URL}/courses/<id> with no language segment (nazar's PUB-1 does not apply). Fix: add the hidden '(yeni sekmede açılır)' text; for a draft, send the person through Tedris's own sign-in." }
  - { id: locked-approval-shown-ticked, rule: "The shut approval box is ticked whatever the course's own flag holds (`checked = effectiveApproval(form, fixed)`, present.ts:1184-1189), because the köşk's policy makes the enrolment wait anyway: the page shows the effective state and not the stored one. A course whose own flag is false therefore reads 'Kayıt onayı gereksin' ticked, and the page never says that the course's own setting is off. Holds as designed; recorded so that the replay's `approvalFixed` walk expects the box ticked." }
  - { id: stale-course-fields-not-told, rule: "Not a defect of the page, a limit of the story: the inventory says the course patch carries the course version, and it does not (course.controller.ts:300 and the DTO: 'no version'; the domain's updateCourse says an unknown property is VALIDATION_ERROR). Only the sample's write is held to the version the page was read at. So a save of closed, approval, in person or the zone from an old page is accepted and the last save wins, field by field (the page sends only the fields it changed, settingsPatch, present.ts:1162-1174), and the toast says 'Ders ayarları kaydedildi' either way. COURSE_VERSION_CONFLICT is a refusal of a sample write only." }
  - { id: policy-in-the-course-form, rule: "D1. The köşk's recordings policy sits in the course's form, saved by the same Kaydet, and covers every course of the köşk; the toast says 'Ders ayarları kaydedildi' and names only this course, and the audit row is kosk.policy_change (kosk.service.ts:247-262). The box is a manager's alone (`disabled={saving || !manager}`; tedrisat asks kosk.manage or platform.kosk_edit, kosk.controller.ts:337-345). The sentence over it points to 'Köşk ayarları' for the same switch." }
  - { id: checkboxes-not-switches, rule: "The four boxes are checkboxes that wait for Kaydet, not switches that commit at once (the kit's rule: a control that needs a save button beside it is not a switch). Holds." }
  - { id: confirm-before-drafting, rule: "'Taslağa çek' and 'Dersi gizle' ask first, in an alertdialog whose focus starts on 'Vazgeç' (libs/ui/src/mds/alert-dialog.tsx:62-65, 95-100); 'Yayımla' does not ask, because nothing is lost and the way back is one button. A refused status change leaves the question OPEN under the error toast, where nazar's closes it first." }
  - { id: toast-says-it-too, rule: "The result of a status change is said by a toast (Sonner: it closes after 6 seconds for a success and stays for an error) and by the card itself, whose badge, sentence, caption and button change after the page is read again. A refusal reads nothing again, so the card still offers the button the API has just refused." }
  - { id: F-UI-W1-3, rule: "libs/ui/src/mds/button.tsx:62, 114: a busy button's hidden status says 'Yükleniyor' from a hard-coded default where the caller passes no `loadingLabel`: Yayımla and the two questions' confirming buttons (Kaydet passes its own 'Kaydediliyor…'). Harmless while nizam is Turkish only; the catalog does not have it." }
