# The screens of nizam.courses.settingsAndPublish: Ders ayarları (/kosks/<id>/courses/<id>/ayarlar) of a course in nizam-web, its two option
# lists, the "Dersi taslağa çek" question, the "Dersi gizle" question and the toasts of every write. Read from apps/nizam/features/courses/
# components/course-settings-page.tsx, apps/nizam/features/kosks/components/hide-course-dialog.tsx, features/courses/present.ts and the kit's
# libs/ui/src/mds/{app-shell,button,checkbox,select,field,alert-dialog,breadcrumb}.tsx on 16 Nov 2026, not seen in a browser; the words are copied by
# script from libs/i18n/src/locales/tr/nizam.json (namespaces CourseSettings and HideCourseDialog; the app reads them as nizam.CourseSettings, ...).
#
# Words that are not in the app's i18n file (catalog keys `composed.*`, each with the code line it comes from):
#   composed.CourseSettings.courseName   "{title}"                       the course's own title, as the breadcrumb's middle link and as the eyebrow of the two
#                                                                         questions (course-settings-page.tsx:197, 428; hide-course-dialog.tsx:65)
#   composed.CourseSettings.sampleFirst  "Hafta {week} · {firstTitle}"   the app's own `CourseSettings.sampleOption` ("Hafta {week} · {title}",
#   composed.CourseSettings.sampleSecond "Hafta {week} · {secondTitle}"  course-settings-page.tsx:241) once for each of the two sessions of the walk's course;
#                                                                         two keys because a replay fills a sample by its placeholder's name
#   composed.CourseSettings.zoneCity     "{city}"                        a zone's label, the last part of its IANA id with the underscores as spaces
#                                                                         (`timeZoneCity`, libs/utils/src/time-zone.ts; course-settings-page.tsx:279)
#   composed.CourseSettings.busy         "Yükleniyor"                    the visually hidden status of a busy button that passes no `loadingLabel`: the kit's own
#                                                                         default (libs/ui/src/mds/button.tsx:62), in no catalog; Yayımla and the question's
#                                                                         confirming buttons are such buttons (F-UI-W1-3)
# `changes` is `Changes.note`, the one message authored for this catalog: no message of the app says what Kaydet, Taslağa çek and Gizle change as
# a whole (its own `savedBody` says only that the settings were updated, after the fact), so one short note puts the page's own descriptions
# (closedDesc, approvalDesc, neverPublicDesc, unpublishNote, hideBody) together.
#
# The page sets no focus of its own on load, after a save, after a refusal or after a status change (nothing in course-settings-page.tsx calls focus()
# or sets autoFocus: focus-not-set), so there is no `initialFocus` on the page and no `focus` after a press; the two questions set theirs (the kit's
# `initialFocus={cancel}`). The two option lists are drawn as the account page draws its own (a Base UI Select in a popup, the page behind taken to be
# inert, not verified in a browser). While a question is open the page behind it is inert, so no node of the page is listed in `asking`, `drafting`,
# `confirmingHide` or `hiding`; a Sonner toast stands over it and is listed there.
