# nizam.courses.decideApplications at the köşk's list: the newest applications are settled behind the page's back, so "Onayla" and
# "Reddet" are answered with 404 ENROLLMENT_NOT_FOUND, the error toast "İşlem yapılamadı: Bu başvuru artık bekleyenler arasında değil;
# liste yenilendi.", and the row leaves (FAIL.gone of both decisions).
#   node apps/engine/src/cli.ts replay graphs/nizam/courses/decideApplications --bind graphs/nizam/courses/decideApplications/binding.gone.yaml --cover transitions --out <dir>
# NOT RUN: written without a replay. Every behaviour below is from the code, none seen in a browser.
#
# How the answer is made: SETTLED_ELSEWHERE is no node's, so the binding gives it. The two newest applications are applicantE's and
# applicantD's (the last two to apply; the page lists newest first, so they are the rows the walk presses); the event has the köşk's
# nazım reject both through the API (DELETE /courses/:id/enrollments/:userId, as another nazım would), and the page, which was read
# before, still draws them. `--any` makes a second run of the event, which finds both gone already, answer 404 and not fail the step. It
# is an event of the flow (the page is stale before the person presses), not a failure injected into the held call, so it does not depend
# on whether the replay runs actions before it releases the held call. The status the replay compares on FAIL.gone is the server action's
# own 200 (an engine limit, see binding.yaml). The rejections send the two talebe a notice that course.mjs's `remove` clears. Spare
# applicants C, D and E, as in the other files.
schema: delurio-graph/0
kind: binding
extends: ./locators.binding.yaml
flow: nizam.courses.decideApplications

events:
  SETTLED_ELSEWHERE:
    - run: [node, helpers/api.mjs, koskNazim, DELETE, '/courses/{cdaGone.course}/enrollments/{secret.E2E_APPLICANT_E_SUB}', --any]
      expect: HTTP
    - run: [node, helpers/api.mjs, koskNazim, DELETE, '/courses/{cdaGone.course}/enrollments/{secret.E2E_APPLICANT_D_SUB}', --any]
      expect: HTTP

states:
  listed: { url: '{nizam}/kosks/*/basvurular' }
  empty: { url: '{nizam}/kosks/*/basvurular' }
  approving: { call: '{nizam}/kosks/*/basvurular' }
  rejecting: { call: '{nizam}/kosks/*/basvurular' }

scenarios:
  gone:
    given: { approval: needed, place: kosk, note: asks }
    as: koskNazim
    open: '{nizam}/kosks/{seed.kosk2}/basvurular'
    vars: { course: '{cdaGone.course}' }
    setup:
      - run: [node, helpers/course.mjs, make, cdaGone, --kosk, '{seed.kosk2}', --approval, --weeks, '1', --lessons, '1', --talebe, applicantC, applicantD, applicantE]
        expect: '"APPLICANT_E":"PENDING"'
    teardown:
      - run: [node, helpers/course.mjs, remove, cdaGone]
        expect: 'course remove cdaGone'
      - run: [node, helpers/sql.mjs, "select count(*) as revoked from enrollments where status = 'REVOKED' and user_id in ('{secret.E2E_APPLICANT_C_SUB}', '{secret.E2E_APPLICANT_D_SUB}', '{secret.E2E_APPLICANT_E_SUB}')"]
        expect: '"revoked":0'
