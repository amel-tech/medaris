# What must exist for a köşk's nazım to decide the applications that wait, from the köşk's list, a course's Genel bakış and its Talebeler:
# the flow's product list (LAYOUT.md section 7). Each need is what the product must do, from the flow's story and the planned work in
# the inventory (planned.md), not from what the pages do today; the known gaps go to graphs/needs.gaps.yaml, which the orchestrator
# merges. Read by people for now: no checker runs on this file yet.
#
# Missing (no code): reject-asks-once-and-may-carry-a-reason (F-W4-7, decision D1), a-barred-talebe-is-told-so (HOME-1),
#   a-row-in-flight-says-so (CDA-2, CDA-3), one-busy-mark-per-row (HOME-3), a-talebe-who-applies-again-is-listed (CDA-1, D3),
#   focus-follows-a-decision (F-W4-6), the-menus-number-costs-no-roster-read (CDA-4), the-basnazim-reads-the-list-or-is-told-why-not
#   (CDA-5, D2), the-note-says-why-an-application-waits (ROSTER-1), one-set-of-words-for-a-decision (CDA-6), an-unreadable-roster-is-an-alert
#   (F-W4-10), seats-per-gender-at-approval (MDRS-284).
# Unwalked (code, no e2e, no replay yet): a-decision-already-made-is-told and a-failed-call-keeps-the-row (only the unit spec
#   apps/nizam/test/applications.spec.tsx, which pins decisionErrorKey and the table, not the hook; binding.gone.yaml is written to walk the
#   first).
# Walked: read-the-koskwide-list, narrow-the-list-by-course-and-search, approve-in-one-press, reject-a-waiting-application,
#   the-numbers-follow-a-decision, decide-from-the-course-overview, decide-from-the-course-talebeler (e2e shell#4, #5, #7 and kosk-view#14
#   of apps/nizam/e2e, `#n` counting the tests of a file in order). shell#6 (another köşk's list is "izniniz yok") is carried by
#   nizam.shell.noAccessAndNotFound, whose binding.yaml opens a köşk made for it; here the exit no_access is walked by the başnazım's refusal
#   (binding.noAccess.yaml, CDA-5).
# No replay has run in this phase, so no replay is named under `walked`; binding.yaml (list, emptyKosk), binding.overview.yaml (overview,
# emptyOverview), binding.students.yaml (students, emptyStudents), binding.noteOpen.yaml, binding.gone.yaml, binding.barred.yaml and
# binding.noAccess.yaml are written to walk them.
kind: needs
flow: nizam.courses.decideApplications
status: proposed

needs:
  - id: read-the-koskwide-list
    need: >-
      The köşk's nazım sees, on one page, every application that waits in her köşk's courses, newest first: who applied to which
      course (with the course's hocas), when, and how many wait, in the page and in the menu.
    drawn: [listed, empty, listTable, listWhen, countLine, sidebarApplications, sidebarBadge]
    built:
      - action: medaris.api:listKoskPendingEnrollments
      - route: apps/nizam/features/applications/components/applications-view.tsx:124
    walked:
      - e2e: apps/nizam/e2e/shell.e2e.ts
        check: 'shell#4' # L141-L169: the heading, the five rows, "5 başvuru bekliyor", newest first with name, e-mail and "Bugün", a button named by its row, the menu's entry selected and its badge equal to the count. The e-mail cell is data and is not drawn; the menu entry's aria-current is not a graph property

  - id: narrow-the-list-by-course-and-search
    need: >-
      She narrows the köşk's list to one course, and searches it by a talebe's name or e-mail typed the way a person types Turkish (no
      case, no diacritics); the count follows, and a search that finds nobody says so.
    drawn: [courseFilter, searchField, noMatch, listNoMatchLine, countLine]
    built:
      - route: apps/nizam/features/applications/present.ts:50
      - route: apps/nizam/features/applications/components/applications-view.tsx:91
    walked:
      - e2e: apps/nizam/e2e/shell.e2e.ts
        check: 'shell#4' # L173-L187: the course filter gives 2 rows and "2 başvuru bekliyor", "Ders: tümü" gives 5, the search "omer" finds "Ömer Faruk Demirkaya" and counts 1
      - test: apps/nizam/test/applications.spec.tsx # "keeps every row for 'all' and only the chosen course's otherwise", "searches name and address the way Turkish is typed", "combines both, and the count is the list's own length" (pure helpers)

  - id: approve-in-one-press
    need: >-
      She approves a waiting application in one press: the talebe takes a seat in the course and is told, the row leaves, and a
      toast says what was done.
    drawn: [listApprove, ovApprove, stuApprove, approving, settled, toastApproved, listRowApprove, listRowReject]
    built:
      - action: medaris.api:approveEnrollment
      - route: apps/nizam/features/applications/use-decisions.ts:34
    walked:
      - e2e: apps/nizam/e2e/shell.e2e.ts
        check: 'shell#5' # L203-L215: Onayla on the list: the rows go from five to four, the toast "Başvuru onaylandı", the count "4 başvuru bekliyor", the seat is ENROLLED

  - id: reject-a-waiting-application
    need: >-
      She rejects a waiting application: it is deleted so the talebe may apply again, the talebe is told, the row leaves and a toast says
      what was done.
    drawn: [listReject, ovReject, stuReject, rejecting, settled, toastRejected]
    built:
      - action: medaris.api:rejectEnrollment
      - route: apps/nizam/features/applications/use-decisions.ts:44
    walked:
      - e2e: apps/nizam/e2e/shell.e2e.ts
        check: 'shell#5' # L221-L230: Reddet on the list: the rows go from four to three, the toast "Başvuru reddedildi", the talebe has no row

  - id: reject-asks-once-and-may-carry-a-reason
    need: >-
      Before a rejection is made she is asked once, and may write why, and what she writes is said truly to whoever reads it; a
      rejection is made the same way wherever it is made (the köşk home asks and takes a reason, nazar asks and takes none, this app's
      three other places ask nothing).
    drawn: [rejecting, listReject, ovReject, stuReject]
    missing: none # no issue: F-W4-7, decision D1; the API takes an optional reason of 500 characters on every route

  - id: the-numbers-follow-a-decision
    need: >-
      After a decision the numbers that count the waiting applications and the seats follow it: the list's count, the menu's badge, the
      overview's "Kayıtlı talebe" and "Bekleyen başvuru", and the tabs' counts of the Talebeler page.
    drawn: [countLine, sidebarBadge, ovEnrolledValue, ovPendingValue, stuTabApplications, stuTabEnrolled, settled]
    built:
      - action: medaris.api:getCourseStats
      - route: apps/nizam/features/applications/use-decisions.ts:86
    walked:
      - e2e: apps/nizam/e2e/shell.e2e.ts
        check: 'shell#5' # L217: the badge says 4 after the first decision, without a reload
      - e2e: apps/nizam/e2e/kosk-view.e2e.ts
        check: 'kosk-view#14' # L428-L445: the overview's two numbers: Kayıtlı talebe 2 to 3, Bekleyen başvuru 1 to 0
      - e2e: apps/nizam/e2e/shell.e2e.ts
        check: 'shell#7' # L289: "Kayıtlı" gains the talebe

  - id: decide-from-the-course-overview
    need: >-
      From a course's Genel bakış she decides that course's waiting applications in the same two presses, beside the course's numbers
      and its next celseler.
    drawn: [ovPage, ovRegion, ovTable, ovApprove, ovReject, ovRowApprove, ovRowBusy, ovEmptyLine]
    built:
      - route: apps/nizam/features/kosks/components/course-overview.tsx:412
    walked:
      - e2e: apps/nizam/e2e/kosk-view.e2e.ts
        check: 'kosk-view#14' # L427-L445: Onayla takes the application off the card, "Bekleyen başvuru yok" appears, the seat is ENROLLED. The title says 'Reddet only takes it off' but the body never presses Reddet: the overview's Reddet has no e2e, only binding.overview.yaml

  - id: decide-from-the-course-talebeler
    need: >-
      On a course's Talebeler, Başvurular is the first tab and she decides its applications there; the note says what a decision does,
      and a person who approves finds the talebe under Kayıtlı.
    drawn: [stuPage, stuTabs, stuTabApplications, stuTabEnrolled, stuNoteAsks, stuTable, stuApprove, stuReject, stuEmptyLine]
    built:
      - route: apps/nizam/features/applications/components/students-tabs.tsx:94
    walked:
      - e2e: apps/nizam/e2e/shell.e2e.ts
        check: 'shell#7' # L254-L290: the first tab is selected with the count, only this course's rows, the menu draws Dersler selected and no Talebeler, Onayla moves the talebe to Kayıtlı and the seat is ENROLLED

  - id: a-decision-already-made-is-told
    need: >-
      An application someone else settled first, or the talebe took back, leaves the list when she presses and a notice says so; the
      counts are read again.
    drawn: [toastGone, settled, approving, rejecting]
    built:
      - route: apps/nizam/features/applications/use-decisions.ts:58
    walked:
      - test: apps/nizam/test/applications.spec.tsx # "tells a refusal from a decision someone else already made" (decisionErrorKey alone; the hook is not rendered)

  - id: a-barred-talebe-is-told-so
    need: >-
      When the talebe has been barred from the course the approval is refused and the nazım is told that, not that she lacks the
      authority (HOME-1); a row of a barred talebe says so before she presses.
    drawn: [toastRefused, approving, listRowApprove]
    missing: none # no issue: decisionErrorKey words every 403 as "no authority" (present.ts:183); the two course pages drop the ban the API carries

  - id: a-failed-call-keeps-the-row
    need: >-
      When a decision cannot be saved (a refusal, an unknown failure, a dropped network) the row stays, the busy mark goes and she is
      told to try again.
    drawn: [toastRefused, toastFailed, listed]
    built:
      - route: apps/nizam/features/applications/use-decisions.ts:45

  - id: a-row-in-flight-says-so
    need: >-
      A row whose decision is on its way says so to a person who cannot see the screen, on the button she pressed, the same way in all
      three places (CDA-2, CDA-3).
    drawn: [listRowApprove, listRowReject, ovRowApprove, ovRowReject, ovRowBusy, stuRowApprove, stuRowReject]
    missing: none

  - id: one-busy-mark-per-row
    need: >-
      Two decisions pressed on two rows each keep their own busy mark until their own call ends (HOME-3).
    drawn: [listRowApprove, listRowReject, approving]
    missing: none

  - id: a-talebe-who-applies-again-is-listed
    need: >-
      A talebe whose application was rejected and who applies again appears on a page that is still open once it has been read again;
      the page forgets a decision as soon as the server has answered it (CDA-1, decision D3).
    drawn: [settled, listed]
    missing: none

  - id: focus-follows-a-decision
    need: >-
      After a decision the focus lands on a place a keyboard or screen-reader user can use (the next row's first button, or the table's
      caption), and a line on the page, not only a toast, says what was decided (F-W4-6).
    drawn: [listed, toastApproved, toastRejected]
    missing: none

  - id: the-menus-number-costs-no-roster-read
    need: >-
      The number on the menu's "Başvurular" is a count, not the whole list of waiting applications with the talebe's names and e-mails,
      and reading it does not write an audit row each time (CDA-4).
    drawn: [sidebarBadge]
    missing: none

  - id: the-basnazim-reads-the-list-or-is-told-why-not
    need: >-
      The başnazım either reads the köşk-wide list as she reads and decides on each course's pages, or the list says to her why it is
      the nazım's alone, and the nav graph says the same (CDA-5, decision D2).
    drawn: [no_access, openedKosk]
    built:
      - action: medaris.api:listKoskPendingEnrollments # KOSK_FORBIDDEN
    missing: none

  - id: the-note-says-why-an-application-waits
    need: >-
      The note over the Talebeler table is true of the applications beneath it: it does not say the course needs no approval above rows
      that wait because the köşk or the platform always asks, or the flag was switched off after they applied (ROSTER-1).
    drawn: [stuNoteAsks, stuNoteOpen]
    missing: none

  - id: one-set-of-words-for-a-decision
    need: >-
      The one decision is worded once in the app: the köşk home's toasts and these pages' toasts say the same (CDA-6).
    drawn: [toastApproved, toastRejected, toastGone, toastFailed]
    missing: none

  - id: an-unreadable-roster-is-an-alert
    need: >-
      When the Talebeler page's roster cannot be read, the page says so as an alert with a retry, as the köşk's list and the overview do
      (F-W4-10).
    drawn: [load_failed]
    missing: none

  - id: seats-per-gender-at-approval
    need: >-
      Where a seat is counted, the kontenjan is two counts, one per gender, and a seat is given at approval in the order of
      application; the three places' Onayla are among the places that give it, and follow the same rule as the köşk home, the roster and
      the Pano (MDRS-284, per celse and weekly; no kontenjan rule exists in the code today).
    drawn: [listApprove, ovApprove, stuApprove]
    missing: MDRS-284
