# nizam.courses.decideApplications at the köşk's list: the newest applicant is barred from the course behind the page's back, so
# "Onayla" is answered with 403 BAN_ACTIVE and the toast says "Bu başvuruya karar verme yetkiniz yok." (FAIL.barred, HOME-1) although
# the nazım has the authority and the talebe is the one who is barred. The list's rows carry no ban, so the page draws the row like any
# other.
#   node apps/engine/src/cli.ts replay graphs/nizam/courses/decideApplications --bind graphs/nizam/courses/decideApplications/binding.barred.yaml --cover transitions --out <dir>
# NOT RUN: written without a replay. Every behaviour below is from the code, none seen in a browser.
#
# How the answer is made: BAN_PLACED is no node's, so the binding gives it: the course's müderris bars applicantE (the newest row, the
# one the walk presses) from the course through the API (POST /courses/:id/bans, scope COURSE), as nizam.home.decideApplications'
# binding.barred.yaml does. A ban row is a record that outlives its course and no route deletes one, so `setup` and `teardown` delete the
# rows this walk made by their reason (SQL, the one write here with no API), and the notifications COURSE_BAN_PLACED that went to the
# köşk's nazım and the Medaris nazım. The audit row ban.create stays. The ban goes first in `teardown`, so that applicantE is no longer
# barred when the course's remove has the talebe leave. Spare applicants C, D and E.
schema: delurio-graph/0
kind: binding
extends: ./locators.binding.yaml
flow: nizam.courses.decideApplications

events:
  BAN_PLACED:
    - run: [node, helpers/api.mjs, muderris, POST, '/courses/{cdaBarred.course}/bans', '{"userId":"{secret.E2E_APPLICANT_E_SUB}","scope":"COURSE","reason":"Deneme yasağı cdaBarred"}']
      expect: '"scope":"COURSE"'

states:
  listed: { url: '{nizam}/kosks/*/basvurular' }
  empty: { url: '{nizam}/kosks/*/basvurular' }
  approving: { call: '{nizam}/kosks/*/basvurular' }
  rejecting: { call: '{nizam}/kosks/*/basvurular' }

scenarios:
  barred:
    given: { approval: needed, place: kosk, note: asks }
    as: koskNazim
    open: '{nizam}/kosks/{seed.kosk2}/basvurular'
    vars: { course: '{cdaBarred.course}' }
    setup:
      # a crashed walk's ban, found by its reason, not by the old course (whose file may be missing)
      - run: [node, helpers/sql.mjs, "delete from bans where reason = 'Deneme yasağı cdaBarred'"]
        expect: '"rows":'
      - run: [node, helpers/course.mjs, make, cdaBarred, --kosk, '{seed.kosk2}', --approval, --weeks, '1', --lessons, '1', --talebe, applicantC, applicantD, applicantE]
        expect: '"APPLICANT_E":"PENDING"'
    teardown:
      - run: [node, helpers/sql.mjs, "delete from bans where reason = 'Deneme yasağı cdaBarred'"]
        expect: '"rows":'
      - run: [node, helpers/sql.mjs, "delete from notifications where type = 'COURSE_BAN_PLACED' and params->>'courseTitle' = 'Deneme dersi cdaBarred'"]
        expect: '"rows":'
      - run: [node, helpers/course.mjs, remove, cdaBarred]
        expect: 'course remove cdaBarred'
      - run: [node, helpers/sql.mjs, "select count(*) as revoked from enrollments where status = 'REVOKED' and user_id in ('{secret.E2E_APPLICANT_C_SUB}', '{secret.E2E_APPLICANT_D_SUB}', '{secret.E2E_APPLICANT_E_SUB}')"]
        expect: '"revoked":0'
