# The screens of nizam.courses.decideApplications: the köşk's list "Başvurular" (/kosks/<id>/basvurular), the card "Bekleyen başvurular"
# of a course's Genel bakış (/kosks/<id>/courses/<id>), the Başvurular tab of a course's Talebeler (/kosks/<id>/courses/<id>/students),
# the buttons of a row while a decision is on its way and the toasts of a decision. Read from apps/nizam/features/applications/
# components/{applications-view,applications-table,students-tabs}.tsx, features/kosks/components/course-overview.tsx and the three pages
# on 16 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nizam.json (namespaces ApplicationsPage, StudentsPage, CourseOverview
# and Shell). Two messages are text the pages build in code and are in no i18n file, so they are `composed.*`: a Stat's number
# ("{count}", libs/ui/src/mds/stat.tsx:41, course-overview.tsx:345-352) and the busy button's hidden "Yükleniyor" (a default of
# libs/ui/src/mds/button.tsx:62). `changes` is the app's own sentence on what the two decisions do (ApplicationsPage.intro, the list's
# lead paragraph): no message is authored for this flow.
#
# One node is drawn once per place: the nodes whose id starts with `list`, `ov` or `stu` belong to the köşk's list, the overview and the
# Talebeler tab, and each carries `when: place == ...`; the toasts, the sidebar and the buttons' states are alike in all three. While no
# dialog exists here (Reddet asks nothing, F-W4-7) every page node is drawn in every state that shows its page. A row's own cells (the
# talebe's name and e-mail, the course title, the hoca names) are data, not messages, and are not drawn; the day is a message ("Bugün
# 21:04") and is.
#
# The app sets no initial focus on any of the three pages (nothing in features/applications or features/kosks calls focus(), and the
# shell's skip link is the shell's), so no page node has `initialFocus` and no `focus` is given: the graph says nothing of what the code
# does not say (see the rule focus-not-set).
