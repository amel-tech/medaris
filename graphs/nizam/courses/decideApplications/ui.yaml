rules:
  - { id: F-W4-6, rule: "After Onayla or Reddet the pressed row is dropped locally (`decided`, use-decisions.ts:73) and its button goes with it, so the focus falls to <body> (applications-table.tsx:117-136, course-overview.tsx:219-238, students-tabs.tsx:62-70); on the list and the tab the button had also been switched off natively a moment before, which may already have taken the focus away (not checked in a browser). The only word is a toast of six seconds, and nothing announces that the last row has gone except the list's polite count. Fix: after a decision move the focus to the next row's first button or to the table's caption (tabindex -1) and keep the toast. Read from the code, not seen in a browser." }
  - { id: F-W4-7, rule: "'Reddet' deletes the waiting application at once, with no confirmation, no reason and no undo (use-decisions.ts:44, applications-table.tsx:127-135, course-overview.tsx:229-237; the toast has no 'Geri al'), and the talebe is told it. Onayla sits beside it, 8px away; on the overview it is drawn as a text link. The köşk home's Reddet asks for a reason in a dialog, and nazar's asks in an alertdialog, so one decision is made three ways. Fix: ask once, with the optional reason the API takes (flow decision D1)." }
  - { id: F-W4-10, rule: "When the Talebeler page's roster could not be read it draws only a bare caption, 'Bu dersin kayıtları şu anda okunamadı.' (students/page.tsx:62-63), with no alert role and no retry, under the title and subtitle; the three decisions are then not reachable. Not reachable on the stack (exit load_failed). Fix: the shared LoadFailed alert with 'Yeniden dene'." }
  - { id: F-W4-1, rule: "'Derse dön' on the Talebeler page links to /edit (students/page.tsx:52), which redirects to the curriculum (edit/page.tsx:16): the link says it goes back to the course and lands on another page. Fix: link to /kosks/<id>/courses/<id>. Not walked here (the node stuBack is only drawn)." }
  - { id: HOME-1, rule: "(Cited, found in nizam.home.decideApplications.) A barred talebe's approval is refused with BAN_ACTIVE (403, ban.service.ts:616) and decisionErrorKey words every 403 as 'Bu başvuruya karar verme yetkiniz yok.' (present.ts:183), so the nazım is told she lacks the authority; she has it and the talebe is the one who is barred. The list's rows come from GET /kosks/:id/enrollments/pending, which carries no ban, and the two course pages drop the `ban` that GET /courses/:id/enrollments does carry (toRow keeps only the pending fields), so a barred talebe's row is drawn like any other with Onayla live (ROSTER-2 is the same in nazar). binding.barred.yaml walks it on the list. Fix: map BAN_ACTIVE to a sentence of its own and draw the barred row without Onayla." }
  - { id: HOME-3, rule: "(Cited.) One `busy` string serves the whole page (use-decisions.ts:30, 36, 54): a second press while a first call runs replaces it, which switches the first row's buttons back on while its call is still in flight, and the first call's answer then clears the second row's mark (finally setBusy(null)) while its own call runs. The overview's Reddet buttons are all off while any call runs (`busy !== null`), its Onayla buttons are not. Not seen in a browser. Fix: keep a set of busy rows. HOME-2 does not apply here: these pages take their rows from a prop that router.refresh() renews." }
  - { id: ROSTER-1, rule: "(Cited.) The Talebeler tab's note reads the course's own `requiresApproval` (students-tabs.tsx:123): it says 'Bu ders onay istemiyor; talebeler başvurur başvurmaz kaydolur.' above rows that wait because the köşk is private, the köşk or the platform always asks, or the flag was switched off after they applied (course.service.ts:1544-1560). binding.noteOpen.yaml makes the last case. The overview's 'Kayıt' line reads the same flag. Fix: read the reason an application waits from the API, not from the flag." }
  - { id: ROSTER-2, rule: "(Cited.) See HOME-1: a barred applicant is listed with Onayla live, and the answer is told as 'no authority' here, not as 'try again later' as in nazar." }
  - { id: CDA-1, rule: "New finding, from the code and not seen. `decided` (use-decisions.ts:31, 67, 73) only grows and is keyed by course and talebe. The rejection toast says the talebe 'dilerse … yeniden başvurabilir', and she can at once; when she does, and another decision on the open page calls router.refresh(), the new PENDING row arrives in the prop and is filtered out (applications-view.tsx:50-53, students-tabs.tsx:66-70, course-overview.tsx:89-91) because its key is in `decided`. The page and its count do not list her while the menu's badge, which is the server's, does. A reload brings her back. Fix: hide a row only while its decision is in flight, and derive the list from the server data after the refresh (flow decision D3)." }
  - { id: CDA-2, rule: "New finding, from the code and not seen. A row in flight is shown three ways, and none is announced. On the list and the Talebeler tab both of the row's buttons get `disabled` (applications-table.tsx:121, 130) with no `loading`: no spinner, no aria-busy and no status text, and the pressed button, switched off natively, may lose the focus before the row goes (which browsers do this was not checked) (the shared Button's own comment on `loading`: 'busy: aria-disabled and aria-busy, never `disabled`, so focus survives a submit', button.tsx:29). On the overview 'Onayla' uses `loading`, which does announce 'Yükleniyor', and 'Reddet' is `disabled` (course-overview.tsx:223, 232). Fix: use `loading` on the pressed button in all three places, with a status that names the action." }
  - { id: CDA-3, rule: "New finding, from the code and not seen. On the overview `loading` is `busy === row key` (course-overview.tsx:223) and `busy` is set for the row whatever button was pressed (use-decisions.ts:36), so pressing 'Reddet' makes the row's 'Onayla' spin and say 'Yükleniyor' to a reader of the screen while 'Reddet', switched off natively, shows nothing. The person who is rejecting is told a decision is on its way, but on the button she did not press. Fix: pass the kind with the busy key, and show `loading` on the pressed button." }
  - { id: CDA-4, rule: "New finding, from the code and not counted in a database. The menu's number is read by the shell (nizam-shell.tsx:79-83) as the length of GET /kosks/:id/enrollments/pending, one call per managed köşk on every full render of the layout, which router.refresh() after each decision also is. That route reads every waiting application with the talebe's name and e-mail, and writes an audit row `course.roster_read` (via pending) each time, with no exemption and awaited (course.service.ts:1571-1585, domain action listKoskPendingEnrollments). So each decision adds at least two such rows (the shell's and, on the list, the page's) and a page full of names is fetched to show a digit. Fix: a count route that writes no roster-read row, or read the count the dashboard already has." }
  - { id: CDA-5, rule: "New finding. The köşk-wide list is the köşk nazım's alone: tedrisat's guard asks course.manage_all, which SYSTEM_ADMIN holds, and then KoskService.assertManager (kosk.service.ts:128-139) wants a KOSK_NAZIM row of this köşk, so the başnazım gets KOSK_FORBIDDEN and the screen 'Bu bölüm için izniniz yok' (pinned as intended by roster-contact.e2e.spec.ts#6). The same başnazım reads and decides on each course's Genel bakış and Talebeler, because GET /courses/:id/stats and /enrollments and the decision routes let her through. So one decision has two sets of readers. The nav graph's `opensFor` of courseApplications says 'koskManager', which includes the chief persona: it is wrong for this page. Fix: decide (flow decision D2) and make the service, the nav graph and the code agree." }
  - { id: CDA-6, rule: "New finding. The same decision is worded two ways in one app. These pages' toasts say 'Başvuru onaylandı: {name}, {course} dersine kaydoldu.' and 'Başvuru reddedildi: {name} dilerse {course} dersine yeniden başvurabilir.', title 'İşlem yapılamadı' for an error and 'Başvuru işlenemedi. Biraz sonra yeniden deneyin.' for an unknown failure (nizam.json ApplicationsPage.*); the köşk home's toasts say '…{course} dersine kaydedildi.', '{name} için {course} başvurusu reddedildi.', 'Başvuru yanıtlanamadı' and 'Beklenmeyen bir hata oldu…' (Dashboard.applications.*). Fix: one set of messages for the one decision." }
  - { id: focus-not-set, rule: "None of the three pages sets an initial focus (no autoFocus and no .focus() in features/applications or features/kosks outside the dialogs of other flows), and no code moves it after a decision: a keyboard user starts at the top of the document. The graph draws no `initialFocus` and no `focus`." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Onayla' in 'Onayla: {name}, {course}' and in 'Onayla: {name}', 'Reddet' in 'Reddet: …' (WCAG 2.5.3). Holds." }
  - { id: toast-is-the-only-word, rule: "The result of a decision is said by a toast (a dialog in the 'Bildirimler' live region): it closes after 6 seconds for a success and stays for an error; on the page itself only the list's polite count and the menu's badge change, and the overview's two numbers and the tab's counts change when the page has been read again, silently." }
  - { id: count-is-the-lists-own, rule: "The list's line 'N başvuru bekliyor' is the length of the rows the course filter and the search leave, so with a filter it says '2 başvuru bekliyor' while the menu's badge says 5 (shell.e2e.ts#4 pins both). It is a polite live region, so each decision and each keystroke of the search is announced." }
