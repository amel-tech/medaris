      and the nazım is told when the quota for the talebe's gender is full.
    missing: MDRS-284
    note: >-
      Drawn on the state removedList and on the node removedTable, which the code has: they are not evidence, so that a replay
      still walks them (SPEC.md §13 leaves out what only missing needs name).
