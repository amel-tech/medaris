    missing: no Linear issue; findings NROS-7, F-D1-20
    note: >-
      Drawn on the states completing, reopening and removing, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: the-page-names-its-course
    need: The tab title and the h1 name the course, so that two courses' Talebeler are told apart in a tab list (F-W4-17).
    missing: no Linear issue; findings F-W4-17
    note: >-
      Drawn on the nodes studentsTitle and subtitle, which the code has: they are not evidence, so that a replay still walks them
