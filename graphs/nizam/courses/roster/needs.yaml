# What the Talebeler page of a course in nizam-web must do for the köşk's nazım, from the flow's story, and what is built, walked or missing. Read from the code of PR #394
# on 16 Nov 2026; nothing was walked in a browser, and no replay scenario of this flow has been run, so no `replay:` is named under `walked`: the evidence named is the
# e2e specs of apps/nizam/e2e/students.e2e.ts (checks `students#1` to `students#7`, which the inventory says hold) and, for the buttons that hand over, the ban specs the
# hand-over flow carries.
#
# Not applicable, noted so that the gap list is not read as an omission. Gender separation (kontenjan per gender, gender always required; MDRS-284): a completion, a
# removal and a bar give nobody a seat, and a reopening gives back the seat the talebe already held (there is no capacity at all in tedrisat). The seat decision is
# nizam.courses.decideApplications's. Where this page would decide a seat, it is the planned reinstatement of a removed talebe: that is the need
# `a-reinstated-seat-follows-the-kontenjan` below.
#
# For the orchestrator's gaps merge.
#   missing  (no code): a-removal-can-be-taken-back, the-dialog-tells-the-truth-about-applying-again, removing-and-barring-go-together, the-reason-says-who-reads-it,
#            a-completion-is-told-to-the-talebe, say-when-a-course-was-completed (MDRS-149), a-barred-talebe-is-told-at-the-row, a-stale-row-is-read-again,
#            an-unreadable-roster-says-why, the-form-says-what-is-missing, focus-and-words-follow-a-decision, a-busy-dialog-says-so, the-length-limit-is-said,
#            a-failed-call-is-told, the-page-names-its-course, back-goes-to-the-course, a-reinstated-seat-follows-the-kontenjan (MDRS-284)
#   unwalked (code exists; no e2e and no replay that passed): reopen-a-completion, a-refused-change-says-why, the-page-for-a-reader-with-no-roster-right,
#            a-course-under-another-kosks-address
#   walked by an e2e check but not by this flow's replay: page-through-a-long-roster (students#2: it needs seven enrolled talebe and the stack has four spare accounts)
kind: needs
flow: nizam.courses.roster
status: proposed
needs:
  - id: see-who-is-on-the-course
    need: >-
      The köşk's nazım sees a course's applications, its enrolled talebe, the ones who completed it and the ones taken out, each with its count, and the counts follow
      every change on the page.
    drawn: [tabList, tabApplications, tabEnrolled, tabCompleted, tabRemoved, countApplications, countEnrolled, countCompleted, countRemoved, enrolled, completed, removedList]
    built:
      - action: medaris.api:listCourseEnrollments
      - action: medaris.api:listRemovedEnrollments
      - route: apps/nizam/features/applications/components/students-tabs.tsx:94
    walked:
      - e2e: apps/nizam/e2e/students.e2e.ts
        check: 'students#1'

  - id: find-a-talebe-by-name-or-email
    need: >-
      The nazım finds one talebe in a long list by typing part of the name or of the e-mail address, in the way a person types it (case and Turkish letters ignored), and is told
      when nobody matches.
    drawn: [searchEnrolled, rowByName, rowByEmail, emptySearch]
    built:
      - route: apps/nizam/features/applications/present.ts:102
    walked:
      - e2e: apps/nizam/e2e/students.e2e.ts
        check: 'students#3'

  - id: page-through-a-long-roster
    need: >-
      A roster of more than six talebe shows six at a time with the total, and "Daha fazla göster" shows the rest.
    drawn: [showing, moreButton]
    built:
      - route: apps/nizam/features/applications/components/roster-table.tsx:287
    walked:
      - e2e: apps/nizam/e2e/students.e2e.ts
        check: 'students#2'

  - id: read-a-talebes-own-progress
    need: >-
      Beside each enrolled talebe the nazım reads the progress the talebe entered themselves, as a named bar with its number, and the help line says it is the talebe's own and that
      the team confirms the completion.
    drawn: [progressBars, progressEntered, rosterHelp, colProgress]
    built:
      - action: medaris.api:updateCourseProgress
      - route: apps/nizam/features/applications/components/roster-table.tsx:196
    walked:
      - e2e: apps/nizam/e2e/students.e2e.ts
        check: 'students#4'

  - id: mark-a-course-complete
    need: >-
      The nazım marks a talebe's course complete from the row, and the talebe moves from Kayıtlı to Tamamlayanlar with a word that says so.
    drawn: [complete, completing, toastCompleted, completed, a-completion-toast-means-a-completion]
    built:
      - action: medaris.api:setEnrollmentStatus
      - route: apps/nizam/features/applications/components/roster-table.tsx:93
    walked:
      - e2e: apps/nizam/e2e/students.e2e.ts
        check: 'students#7'

  - id: reopen-a-completion
    need: >-
      The nazım gives a completed talebe's course back to Kayıtlı.
    drawn: [reopen, reopening, toastReopened, reopen-needs-a-completion]
    built:
      - action: medaris.api:setEnrollmentStatus
      - route: apps/nizam/features/applications/components/roster-table.tsx:129
    walked: []

  - id: take-a-talebe-out-with-a-reason
    need: >-
      The nazım takes a talebe out of a course with a written reason that cannot be blank; the dialog starts in the reason box, the button stays off until the reason holds
      something, a click outside the dialog or "Vazgeç" removes nobody, and sending it moves the talebe to the record of removals and keeps the reason and who wrote it.
    drawn: [remove, form, formReady, removing, dialog, reasonField, submit, cancel, closeIcon, a-removal-needs-a-reason, toastRemoved, a-removal-toast-means-a-removal]
    built:
      - action: medaris.api:removeEnrollment
      - route: apps/nizam/features/applications/components/remove-dialog.tsx:58
    walked:
      - e2e: apps/nizam/e2e/students.e2e.ts
        check: 'students#5'
      - e2e: apps/nizam/e2e/students.e2e.ts
        check: 'students#6'

  - id: the-record-of-removals
    need: >-
      Erişimi kaldırılanlar lists each talebe taken out, with the day, the reason and who took them out, and nothing else changes it.
    drawn: [removedList, removedTable, removedPerson, removedDay, removedReason, removedBy, removedEmpty]
    built:
      - action: medaris.api:listRemovedEnrollments
      - route: apps/nizam/features/applications/components/removed-table.tsx:85
    walked:
      - e2e: apps/nizam/e2e/students.e2e.ts
        check: 'students#5'

  - id: bar-and-lift-from-the-roster
    need: >-
      From a talebe's row the nazım opens the ban dialog (and, on a barred talebe's row, the lift dialog); what they do is nizam.moderation.banStudent's.
    drawn: [ban, banCompleted, lift, bannedBadge, handed_over.ban, handed_over.lift]
    built:
      - action: medaris.api:createBan
      - action: medaris.api:liftBan
      - route: apps/nizam/features/applications/components/roster-table.tsx:316
    walked:
      - e2e: apps/nizam/e2e/bans.e2e.ts
        check: 'bans#1'

  - id: a-refused-change-says-why
    need: >-
      When a completion, a reopening or a removal is refused or the seat has moved, the nazım is told in her own words what happened and that nothing changed.
    drawn: [toastMoved, toastRefused, toastFailed, toastRemoveMoved, toastRemoveRefused, toastRemoveFailed]
    built:
      - route: apps/nizam/features/kosks/course-team.ts:41
    walked: []

  - id: the-page-for-a-reader-with-no-roster-right
    need: >-
      A person the köşk layout lets in but who holds no roster right in the course (a Medaris nazımı) is not shown a page of tabs; today she gets the bare caption.
    drawn: [unreadable, unreadableCaption]
    built:
      - route: "apps/nizam/app/kosks/[id]/courses/[courseId]/students/page.tsx:62"
    walked: []

  - id: a-course-under-another-kosks-address
    need: >-
      A course opened under the address of a köşk it does not belong to is the "Bu bölüm için izniniz yok" screen, not another köşk's roster.
    drawn: [opened, not_found]
    built:
      - route: "apps/nizam/app/kosks/[id]/courses/[courseId]/students/page.tsx:44"
    walked: []

  # ---- what the code does not do, from the findings (each is a rule in ui.yaml) ----
  - id: a-removal-can-be-taken-back
    need: >-
      A removal made by mistake can be undone from the product by the course team: the removed talebe's row has a way to bring the seat back, and the talebe is told.
      (Decision D1; the API's approve route reinstates a REVOKED seat, course.service.ts:1627-1668, and no screen calls it.)
    drawn: [removedList, removedTable, removedNote]
    missing: none

  - id: the-dialog-tells-the-truth-about-applying-again
    need: >-
      The removal dialog and the record of removals say what the API does: the talebe cannot apply again (409) and the seat comes back only if the team approves it. Today both
      say the talebe may apply again (NROS-1, the nizam half of RMV-2).
    drawn: [info, removedNote]
    missing: none

  - id: removing-and-barring-go-together
    need: >-
      A nazım who wants a talebe both out of the course and barred can do both from the page, or the dialog does not tell her to use "Yasakla" afterwards (NROS-2, decision D2).
    drawn: [info, remove, ban, lift]
    missing: none

  - id: the-reason-says-who-reads-it
    need: >-
      The dialog says that the talebe reads the reason too, or the notice is sent without it (RMV-1, decision D3).
    drawn: [reasonHelp]
    missing: none

  - id: a-completion-is-told-to-the-talebe
    need: >-
      A completion tells the talebe ("{course} dersi tamamlandı olarak işaretlendi", and a reopening likewise) and the toast says that the coming celses leave their schedule
      (ROSCOM-4, decision D3).
    drawn: [toastCompleted, completing]
    missing: none

  - id: say-when-a-course-was-completed
    need: >-
      Tamamlayanlar shows the day the course was completed, not the day the talebe joined; the planned icazet record needs it (ROSCOM-3).
    drawn: [colJoined, rowsCompleted]
    missing: MDRS-149

  - id: a-barred-talebe-is-told-at-the-row
    need: >-
      A barred, completed talebe's row does not offer "Yeniden aç", or says why it would be refused, and the refusal is worded in Turkish and says that the talebe is barred (NROS-4,
      the twin of ROSCOM-2).
    drawn: [reopen, toastBarred, bannedBadge]
    missing: none

  - id: a-stale-row-is-read-again
    need: >-
      When a seat has moved or a change is refused, the list is read again by the page itself, so the stale row goes and the nazım is not asked to refresh the page (NROS-3).
    drawn: [toastMoved, toastRemoveMoved]
    missing: none

  - id: an-unreadable-roster-says-why
    need: >-
      An unreadable roster is an alert that says whether the server did not answer or the reader may not see it, and offers "Yeniden dene" (F-W4-10, NROS-6).
    drawn: [unreadable, unreadableCaption]
    missing: none

  - id: the-form-says-what-is-missing
    need: >-
      The removal dialog says why "Dersten çıkar" is off, and a blank reason is met with a word and the focus on the field (F-W4-14).
    drawn: [submit, reasonField, settle]
    missing: none

  - id: focus-and-words-follow-a-decision
    need: >-
      After a completion, a reopening or a removal the focus goes to a place that still exists, and a search, a sort and "Daha fazla göster" say what they changed in a polite
      live region (F-W4-6, F-D1-04).
    drawn: [showing, emptySearch, moreButton, complete, remove]
    missing: none

  - id: a-busy-dialog-says-so
    need: >-
      While a removal is sent, "Vazgeç", the close icon and Escape are marked off and the pressed row's buttons keep the focus (NROS-5, ROSCOM-1).
    drawn: [cancel, closeIcon, rowComplete, rowRemoveBusy]
    missing: none

  - id: the-length-limit-is-said
    need: >-
      The reason box says it takes 500 characters (RMV-4).
    drawn: [reasonField, reasonHelp]
    missing: none

  - id: a-failed-call-is-told
    need: >-
      A server action that cannot reach the server ends in a toast and not in a row that stays busy for good (NROS-7, the twin of F-D1-20).
    drawn: [completing, reopening, removing]
    missing: none

  - id: the-page-names-its-course
    need: >-
      The tab title and the h1 name the course, so that two courses' Talebeler are told apart in a tab list (F-W4-17).
    drawn: [studentsTitle, subtitle]
    missing: none

  - id: back-goes-to-the-course
    need: >-
      "Derse dön" goes to the course's overview, not to the Müfredat page that /edit redirects to (F-W4-1).
    drawn: [backLink, handed_over.curriculum]
    missing: none

  - id: a-reinstated-seat-follows-the-kontenjan
    need: >-
      When a removed talebe's seat is brought back, it is a seat decided: kontenjan is per gender and gender is always required, and the nazım is told when the quota for the
      talebe's gender is full.
    drawn: [removedList, removedTable]
    missing: MDRS-284
