# The screens of nizam.courses.roster: Talebeler of a course (/kosks/<id>/courses/<id>/students) on its tabs Başvurular, Kayıtlı, Tamamlayanlar and
# Erişimi kaldırılanlar, with the search, the sort, "Daha fazla göster", the progress bars, the busy rows and the toasts of a completion and a
# reopening, the "Dersten çıkar" dialog over it, the record of removals, the buttons that hand over to the ban dialogs, and the page when the
# roster cannot be read. Read from apps/nizam/app/kosks/[id]/courses/[courseId]/students/page.tsx and apps/nizam/features/applications
# (students-tabs.tsx, roster-table.tsx, remove-dialog.tsx, removed-table.tsx, present.ts) and libs/ui/src/mds (Tabs, Table, Dialog, Button,
# Progress); every word is copied from libs/i18n/src/locales/tr/nizam.json by a script that fails on a missing key. Two kinds of entry are not
# from that file:
#   Changes.note   the one authored message of this catalog: no message of the app says what a completion does to the talebe's schedule, that a
#                  removal sends the reason to the talebe, or that a removal cannot be undone from the page and the talebe cannot apply again
#                  (the dialog says the opposite: NROS-1). It is factual and says only what the API does (course.service.ts:1537-1541, :1754-1790).
#   composed.*     text the page builds in code, in no i18n file:
#     composed.StudentsRoster.person        a talebe's name in a row header                (roster-table.tsx:161, removed-table.tsx:42)
#     composed.StudentsRoster.personEmail   their e-mail                                   (roster-table.tsx:177-183, removed-table.tsx:44-50)
#     composed.StudentsRoster.joined        the day they joined, formatted by next-intl      (roster-table.tsx:192)
#     composed.StudentsRoster.tabCount      the number after a tab's label                 (libs/ui/src/mds/tabs.tsx:67)
#     composed.StudentsRoster.removedReason the reason as the server kept it               (removed-table.tsx:74)
#     composed.StudentsRoster.removedBy     who took them out                              (removed-table.tsx:80)
#     composed.StudentsRoster.eyebrow       the course's name above the dialog's title      (remove-dialog.tsx:94)
#     composed.StudentsRoster.apiMessage    the API's own message when the page has no sentence for the code (roster-table.tsx:111, remove-dialog.tsx:74)
#     composed.Button.loading               the busy button's hidden <output>, a default of libs/ui/src/mds/button.tsx:62
# The toasts are sonner's (`toast` of @medaris/ui/components/sonner): a list item of the region "Bildirimler", with no role of its own; a
# success closes after 6 seconds and an error stays until closed (the binding finds them by css). The page behind the dialog is drawn only where
# the dialog is closed: the dialog is modal, so the page is inert while it is open.
# Not drawn (other flows' or things this flow never reads): Onayla and Reddet and the rows of Başvurular, the approval note, the empty Kayıtlı and
# Tamamlayanlar tabs, the e-mail and date cells of Tamamlayanlar, the search and sort of Tamamlayanlar, "Yasaklı · Köşk", the ban and lift
# dialogs (nizam.moderation.banStudent).
