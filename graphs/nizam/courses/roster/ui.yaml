  removedDay: { type: text, component: Text, role: cell, text: { key: BansPage.today, params: { time: removal.time } }, in: [removedList], when: "removed == 'some'", source: apps/nizam/features/applications/components/removed-table.tsx:62 } # "Bugün 14:05", "Dün 18:20" or the day and time, in the viewer's zone (hiddenAtLabel); the walk's own day, so the binding finds it by its shape
  removedReason: { type: text, component: Text, role: cell, text: { key: composed.StudentsRoster.removedReason, params: { reason: removal.reason } }, in: [removedList], when: "removed == 'some'", source: apps/nizam/features/applications/components/removed-table.tsx:74 } # the trimmed reason, as typed (students#5)
  removedBy: { type: text, component: Text, role: cell, text: { key: composed.StudentsRoster.removedBy, params: { by: removal.by } }, in: [removedList], when: "removed == 'some'", source: apps/nizam/features/applications/components/removed-table.tsx:80 } # the remover's name, "Bilinmiyor" when the account has none (not drawn)
  removedEmpty: { type: text, component: Text, text: { key: StudentsRoster.emptyRemoved }, in: [removedList], when: "removed == 'none'", source: apps/nizam/features/applications/components/removed-table.tsx:92 } # nobody was taken out (students#1: Erişimi kaldırılanlar 0)

  # ---- the dialog ----------------------------------------------------------------------------------------------------------------------------
  # While the removal is sent the close icon and "Vazgeç" are not disabled in the DOM and a press does nothing (NROS-5): `disabledIn: [removing]`
  # says what the press does, not what a screen reader is told.
  dialog: { type: page, component: Page, role: dialog, name: { labelledBy: dialogTitle }, in: [form, formReady, removing], initialFocus: reasonField, source: apps/nizam/features/applications/components/remove-dialog.tsx:86 } # a form dialog (a Base UI Form); the focus starts in the reason box (students#5)
  dialogEyebrow: { type: text, component: Text, text: { key: composed.StudentsRoster.eyebrow, params: { course: course.title } }, in: [form, formReady, removing], source: apps/nizam/features/applications/components/remove-dialog.tsx:94 } # above the title, outside the dialog's name
  dialogTitle: { type: text, component: Heading, role: heading, text: { key: RemoveDialog.title }, in: [form, formReady, removing], source: apps/nizam/features/applications/components/remove-dialog.tsx:95 } # Base UI's Title, an h2
  closeIcon: { type: action, component: Button, role: button, intent: dismiss, name: { key: RemoveDialog.close }, in: [form, formReady, removing], disabledIn: [removing], emits: CANCEL, source: apps/nizam/features/applications/components/remove-dialog.tsx:96 } # an icon button named only by aria-label; stays on and does nothing while the removal is sent (NROS-5)
  body: { type: text, component: Text, text: { key: RemoveDialog.body, params: { name: student.name, course: course.title } }, in: [form, formReady, removing], source: apps/nizam/features/applications/components/remove-dialog.tsx:107 } # says what closes to them; the talebe's name in <strong>; the whole body is the dialog's description
  info: { type: alert, component: Alert, role: status, text: { key: RemoveDialog.info }, in: [form, formReady, removing], source: apps/nizam/features/applications/components/remove-dialog.tsx:114 } # a neutral Alert: "Talebe yeniden başvurabilir. Yeniden başvurmasını da engellemek gerekiyorsa “Yasakla”yı kullanın." The first sentence is untrue and the second cannot be followed from this page (NROS-1, NROS-2)
  requiredNote: { type: text, component: Text, text: { key: RemoveDialog.requiredNote }, in: [form, formReady, removing], source: apps/nizam/features/applications/components/remove-dialog.tsx:117 } # drawn as "* zorunlu alan"
  reasonField: { type: field, component: TextField, role: textbox, text: { key: RemoveDialog.reasonLabel }, value: { literal: "" }, in: [form, formReady, removing], source: apps/nizam/features/applications/components/remove-dialog.tsx:119 } # a textarea of 4 rows, `required`, at most 500 characters with no counter (RMV-4); it stays editable while the removal is sent (nazar's is disabled); the red * is hidden from assistive technology, the control carries `required`
  reasonHelp: { type: text, component: Text, text: { key: RemoveDialog.reasonHelp }, in: [form, formReady, removing], source: apps/nizam/features/applications/components/remove-dialog.tsx:118 } # says the course team reads the reason; the talebe reads it too (RMV-1)
  cancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: RemoveDialog.cancel }, in: [form, formReady, removing], disabledIn: [removing], emits: CANCEL, source: apps/nizam/features/applications/components/remove-dialog.tsx:100 } # a DialogClose; on while the removal is sent, and does nothing then (NROS-5)
  submit: { type: action, component: Button, role: button, intent: confirm, text: { key: RemoveDialog.submit }, in: [form, formReady, removing], disabledIn: [form, removing], emits: SUBMIT, source: apps/nizam/features/applications/components/remove-dialog.tsx:101 } # natively disabled until the reason holds something (students#5), and nothing says that is why (F-W4-14); busy (aria-disabled, "Yükleniyor") while it is sent

  # ---- the toasts: sonner's region "Bildirimler"; a success closes by itself after 6 seconds, an error stays until closed ---------------------------------
  toastCompleted: { type: status, component: Status, name: { key: StudentsRoster.completed }, text: { key: StudentsRoster.completedBody, params: { name: student.name } }, in: [applications, enrolled, completed, removedList], when: "last == 'completed'", source: apps/nizam/features/applications/components/roster-table.tsx:115 } # it says only that the talebe moved: not that the celses leave their schedule and that they are not told (ROSCOM-4)
  toastReopened: { type: status, component: Status, name: { key: StudentsRoster.reopened }, text: { key: StudentsRoster.reopenedBody, params: { name: student.name } }, in: [applications, enrolled, completed, removedList], when: "last == 'reopened'", source: apps/nizam/features/applications/components/roster-table.tsx:115 }
  toastRemoved: { type: status, component: Status, name: { key: RemoveDialog.removed }, text: { key: RemoveDialog.removedBody, params: { name: student.name } }, in: [applications, enrolled, completed, removedList], when: "last == 'removed'", source: apps/nizam/features/applications/components/remove-dialog.tsx:78 } # the only word of the removal on the Kayıtlı tab; it names the tab the talebe moved to, and the page stays where it is
  toastMoved: { type: status, component: Status, name: { key: StudentsRoster.actionFailed }, text: { oneOf: [CourseTeam.errorEnrollmentState, CourseTeam.errorEnrollmentNotFound] }, in: [enrolled, completed], when: "last == 'moved'", source: apps/nizam/features/applications/components/roster-table.tsx:109 } # an error toast that stays; the list is not read again and the toast asks the person to do it (NROS-3)
  toastRefused: { type: status, component: Status, name: { key: StudentsRoster.actionFailed }, text: { key: CourseTeam.errorForbidden }, in: [enrolled, completed], when: "last == 'refused'", source: apps/nizam/features/applications/components/roster-table.tsx:109 }
  toastBarred: { type: status, component: Status, name: { key: StudentsRoster.actionFailed }, text: { key: composed.StudentsRoster.apiMessage, params: { message: api.message } }, in: [completed], when: "last == 'barred'", source: apps/nizam/features/applications/components/roster-table.tsx:111 } # the API's own sentence "You are barred from this course", in English, under a Turkish title (NROS-4)
  toastFailed: { type: status, component: Status, name: { key: StudentsRoster.actionFailed }, text: { key: composed.StudentsRoster.apiMessage, params: { message: api.message } }, in: [enrolled, completed], when: "last == 'failed'", source: apps/nizam/features/applications/components/roster-table.tsx:111 } # the API's own message, in English
  toastRemoveMoved: { type: status, component: Status, name: { key: RemoveDialog.failed }, text: { oneOf: [CourseTeam.errorEnrollmentState, CourseTeam.errorEnrollmentNotFound] }, in: [formReady], when: "last == 'removeMoved'", source: apps/nizam/features/applications/components/remove-dialog.tsx:72 } # over the open dialog, outside the modal (BULK-1, not verified)
  toastRemoveRefused: { type: status, component: Status, name: { key: RemoveDialog.failed }, text: { key: CourseTeam.errorForbidden }, in: [formReady], when: "last == 'removeRefused'", source: apps/nizam/features/applications/components/remove-dialog.tsx:72 }
  toastRemoveFailed: { type: status, component: Status, name: { key: RemoveDialog.failed }, text: { key: composed.StudentsRoster.apiMessage, params: { message: api.message } }, in: [formReady], when: "last == 'removeFailed'", source: apps/nizam/features/applications/components/remove-dialog.tsx:74 }

edges:
  - { labelledBy: [panelApplications, tabApplications] }
  - { labelledBy: [panelEnrolled, tabEnrolled] }
  - { labelledBy: [panelCompleted, tabCompleted] }
  - { labelledBy: [panelRemoved, tabRemoved] }
  - { labelledBy: [dialog, dialogTitle] }
  - { triggers: [complete, completing] }
  - { triggers: [reopen, reopening] }
  - { triggers: [remove, form] }
  - { triggers: [submit, removing] }
  - { returnsFocus: [dialog, remove] } # Vazgeç, the close icon or Escape: the row's button is still there and Base UI hands the focus back to it; after a removal the row is gone (F-W4-6); not verified in a browser

rules:
  - { id: F-W4-1, rule: "'Derse dön' links to /kosks/<id>/courses/<id>/edit (students/page.tsx:51-56), a redirect to the Müfredat page (edit/page.tsx:16), not to the course's overview: the link's name says 'back to the course' and the person lands on the curriculum editor. Fix: link to /kosks/<id>/courses/<id>." }
  - { id: F-W4-6, rule: "After Tamamladı say, Yeniden aç or Dersten çıkar succeeds, the row leaves its table with the button that had the focus and the focus falls to <body>; 'Daha fazla göster' unmounts too when the list is complete (roster-table.tsx:293-298, :118, :313); the toast is the only word. The progress and the counts change in no live region. Fix: after a decision move the focus to the table's caption or the next row's first action and keep a polite status line; keep the button until the focus has moved. Not verified in a browser." }
  - { id: F-W4-10, rule: "When the roster read fails the page shows one bare caption 'Bu dersin kayıtları şu anda okunamadı.' (students/page.tsx:62-63): no role=alert, no retry, no heading, no tabs, so the tabs that were read (the removed list is empty when its own read fails) are not offered either. Fix: the shared LoadFailed alert with 'Yeniden dene'." }
  - { id: F-W4-14, rule: "The removal dialog's submit is natively disabled while the reason is blank (remove-dialog.tsx:101) and the dialog has no field error and no help that says why: the cue is the 'zorunlu alan' note and the required marker only; a blank reason can never be 'sent and refused'. Fix: keep the button on and show 'Bir gerekçe yazın.' on a send with a blank reason, with the focus moved to the field." }
  - { id: F-W4-17, rule: "The <title> is 'Talebeler' with no course or köşk (students/page.tsx:21-24) and the h1 is the same word; the course is named only in the subtitle. Tabs and history entries of two courses are indistinguishable. Fix: put the course title in <title>." }
  - { id: F-D1-04, rule: "Searching the roster, flipping the sort and pressing Daha fazla göster change the list with no announcement: the '{total} talebeden {shown} tanesi gösteriliyor' line is a plain <p data-testid=roster-showing>, not a live region, and the empty-search text is only a table cell (roster-table.tsx:287-291, :283). The same finding as nazar's roster (its inventory id); nizam's inventory records only that the count is no live region (F-W4-6). Fix: role=status on the line and on the empty cell." }
  - { id: ROSCOM-1, rule: "The twin of nazar.roster.complete's ROSCOM-1. roster-table.tsx:228-229 gives every button of the pressed row `disabled={busy}` and the first one `loading` as well, although the Button's own contract is 'busy: aria-disabled and aria-busy, never disabled, so focus survives a submit' (libs/ui/src/mds/button.tsx:29): the button the person is on becomes natively disabled the moment it is pressed, and Dersten çıkar and Yasakla of that row go with it. Not verified in a browser. Fix: `disabled` only on the twins, `loading` alone on the pressed button." }
  - { id: ROSCOM-3, rule: "The twin of nazar.roster.complete's ROSCOM-3. Tamamlayanlar lists 'Kayıt tarihi', the day the talebe joined (roster-table.tsx:192), because the roster response has no completedAt (RosterEnrollmentResponse has none; MyEnrollmentResponse has it). The course team cannot see when a course was completed, which the planned icazet record (P-06, MDRS-149) needs. Fix: add completedAt to the roster response and a 'Tamamlanma tarihi' column." }
  - { id: ROSCOM-4, rule: "The twin of nazar.roster.complete's ROSCOM-4. A completion changes more than its toast says: setEnrollmentStatus sends no notification (course.service.ts:1745 kicks the invitation sweep only), and a seat that is not ENROLLED is not owed an invitation, so the talebe's coming celses leave their calendar and Programım while nobody tells them; the page asks nothing before it does it ('Tamamladı say' has no confirmation) and the toast says only '{name} dersi tamamladı.'. Fix: tell the talebe, and say so in the toast (decision D3)." }
  - { id: RMV-1, rule: "The twin of nazar.roster.remove's RMV-1. The dialog says 'Gerekçe, Erişimi kaldırılanlar sekmesinde ders kadrosuna görünür.' (RemoveDialog.reasonHelp) and nothing says the talebe reads it too: tedrisat sends REMOVED_FROM_COURSE with { reason } (course-notifier.ts:72-85, called at course.service.ts:1782) and tedris draws it as 'Gerekçe: {reason}'. The person who writes a candid note for her colleagues does not know the removed person gets it word for word. Fix: say it in the help line (decision D3), or send the notice without the reason." }
  - { id: RMV-4, rule: "The twin of nazar.roster.remove's RMV-4. The reason box stops taking text at 500 characters (`maxLength={REASON_MAX}`, remove-dialog.tsx:123, bans/present.ts) with no counter and no message, so a long note is cut silently. Fix: a counter or a help line that names the limit." }
  - { id: BULK-1, rule: "The twin of nazar.roster.bulkAdd's BULK-1. The refusal toasts of the removal are raised while the modal dialog is open; sonner's region is outside it, and Base UI marks everything outside a modal inert or aria-hidden, so a screen reader may not hear 'Talebe dersten çıkarılamadı' while the dialog is up. Read from the primitive, not verified in a browser. Fix: an Alert inside the dialog for a refusal." }
  - { id: NROS-1, rule: "The nizam half of RMV-2. The removal dialog's note 'Talebe yeniden başvurabilir.' (RemoveDialog.info, remove-dialog.tsx:114) and the removed tab's note 'Çıkarılan talebe yeniden başvurabilir.' (StudentsRoster.removedNote, removed-table.tsx:86) are untrue: the seat is kept as REVOKED, the record of the removal, and enroll() answers a new application with 409 ENROLLMENT_STATE_CONFLICT (course.service.ts:1537-1541), as does leaving the course; only the team approving the seat back reinstates the talebe, and no screen does that (Başvurular lists PENDING seats only, the removed table has no button, 'Toplu talebe ekle' of nazar skips a REVOKED seat). The code repeats the promise: the comment of RemoveDialog (remove-dialog.tsx:33-35), the one of removeEnrollment (actions/courses.ts:144-145) and the unused message CourseTeam.removeDescription, which says the seat 'silinir' (nizam.json:502). The API's own comment is right (course.service.ts:1754: 'the talebe does not apply again on their own'). Fix: 'Talebe yeniden başvuramaz; yeri ancak ders kadrosu onaylarsa geri gelir.' and decision D1." }
  - { id: NROS-2, rule: "The dialog tells the nazım 'Yeniden başvurmasını da engellemek gerekiyorsa “Yasakla”yı kullanın.', and the page cannot do both: a removed talebe has no row on Kayıtlı or Tamamlayanlar to press Yasakla on (the only BanDialog opener in nizam is this table, roster-table.tsx:316), a barred row offers no 'Dersten çıkar' (present.ts:145: 'a barred talebe is not taken out of the course'), and Erişimi kaldırılanlar is read-only. Removing and barring exclude each other here, and a removed talebe cannot apply anyway (NROS-1). Fix: drop the sentence, or offer Yasakla on the record of removals (decision D2)." }
  - { id: NROS-3, rule: "A seat that moved while the page was open (the talebe left, or a removal landed: ENROLLMENT_NOT_FOUND, ENROLLMENT_STATE_CONFLICT) and every other refusal leave the stale row where it was: the failure path of move() returns before router.refresh() (roster-table.tsx:107-113) and the toast, an error toast that stays until closed, says 'Kayıt artık yok; sayfayı yenileyin.' / 'Bu kayıt bu işleme uygun durumda değil; sayfayı yenileyin.' (CourseTeam.errorEnrollmentNotFound, errorEnrollmentState): the person is asked to do what the page could do. nazar's twin reads the list again by itself and calls it an info notice. A failed removal likewise keeps the dialog open over the stale row. Fix: router.refresh() on a 404 or 409." }
  - { id: NROS-4, rule: "The twin of ROSCOM-2. The roster read carries the open ban of every talebe, and 'Yeniden aç' is drawn on a completed barred talebe's row (present.ts:147: reopen, lift). The API refuses it with 403 BAN_ACTIVE (course.service.ts:1733-1734, ban.service.ts:616), a code that course-team.ts:41-49 has no sentence for, so the toast 'İşlem tamamlanamadı' carries the API's own message, the English 'You are barred from this course' (roster-table.tsx:110-112), which also speaks to the nazım as if she were the barred one. Any other unmapped code does the same (a missing course, a validation error). Fix: word BAN_ACTIVE ('Bu talebe bu dersten yasaklı; yasak kalkmadan yeniden açılamaz'), and leave 'Yeniden aç' off a barred row or say why." }
  - { id: NROS-5, rule: "The twin of RMV-3 and of BAN-3. While the removal is sent, 'Vazgeç', the close icon and Escape stay on and do nothing (`if (!saving) onOpenChange(next)`, remove-dialog.tsx:88-90), with no mark that says why; the reason box stays editable although its text has already gone. Fix: disable them with the rest of the form while saving." }
  - { id: NROS-6, rule: "A roster that cannot be read draws one caption for two different things (students/page.tsx:62-63, actions/index.ts:128-141 returns null for any failure): the server did not answer, and the reader holds no roster right. A Medaris nazımı (who the köşk layout lets in: she holds a nizam role) is refused with 403 and told the read 'failed'; no word says that her role does not reach the roster. The layout lets in the Medaris nazımı and the page then shows nothing she may use. Fix: tell a refusal (403) apart from a failure, and give the refused the 'Bu bölüm için izniniz yok' screen." }
  - { id: NROS-7, rule: "The twin of F-D1-20. No try/catch wraps `await setEnrollmentStatus(...)` in move() (roster-table.tsx:99-105, setBusyId(null) is never reached on a rejection) nor `await removeEnrollment(...)` in the dialog (remove-dialog.tsx:62-68): the server action catches the API's failures (authenticatedAction), but a browser that cannot reach Next throws, the row or the button stays busy and no toast is shown. Not verified in a browser. Fix: try/catch/finally with a network toast." }
  - { id: BANST-6, rule: "The nizam.moderation.banStudent writer's finding for this page, from the code and not walked. The badge reads `e.ban.scope === 'KOSK' ? 'Yasaklı · Köşk' : 'Yasaklı · Bu ders'` (roster-table.tsx:164), but the roster also marks a ban over the whole medrese (ban.repository.ts:241-262, `bans.madrasahId = courseMadrasah`), so a medrese-wide ban placed in Nazar reads 'Bu ders' on the köşk nazımı's roster of a medrese's course, and the row then offers 'Yasağı kaldır', which the API refuses the köşk nazımı (a medrese ban is lifted with madrasah.ban or platform.ban_scoped). The graph draws the one barred row of a course ban. Fix: a third label, 'Yasaklı · Medrese', and no lift button the viewer may not use." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Tamamladı say' in 'Tamamladı say: {name}', 'Yeniden aç' in 'Yeniden aç: {name}', 'Dersten çıkar' in 'Dersten çıkar: {name}', 'Yasakla' in 'Yasakla: {name}', 'Yasağı kaldır' in 'Yasağı kaldır: {name}' (WCAG 2.5.3). Holds. The same words 'Dersten çıkar' are the row button's text, the dialog's name and the submit's, so a test or a voice user has to scope them: the replay finds the submit inside the dialog." }
  - { id: focus-not-set, rule: "No code sets the focus on this page: not on load, and not after a completion, a reopening or a removal (F-W4-6). The only focus the code sets is the dialog's `initialFocus` on the reason box. The graph draws no initialFocus on the page and no focus." }
  - { id: no-default-accept, rule: "The dialog's focus starts in the reason box, not on the button that sends; the scrim does not close it (students#6); Escape and 'Vazgeç' do, unless a removal is being sent (NROS-5). A removal is asked for with a reason, not confirmed with a second dialog: the reason is the confirmation. 'Tamamladı say' asks nothing." }
  - { id: toast-is-the-only-word, rule: "The result of a completion, a reopening or a removal is said by a toast that closes after 6 seconds, and an error stays until closed. The table itself says nothing: the row is gone and the counts changed. The page does not move to the tab the toast names." }
