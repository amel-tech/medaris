# The köşk nazımı's İzinler page in nizam-web (/kosks/<id>/izinler), read from the code of PR #394 on 16 Nov 2026
# (apps/nizam/app/kosks/[id]/izinler/page.tsx, features/grants/{reads,actions,present}.ts, features/grants/components/{grants-view,grant-dialog,
# revoke-dialog}.tsx, features/madrasahs/components/head-picker.tsx; the API's GET, POST, PATCH and DELETE /kosks/:id/grants in
# apps/tedrisat/src/kosk/kosk-grants.{controller,service,repository}.ts and libs/common/src/authz/self-grant.guard.ts). Nothing here was walked in
# a browser: every behaviour is "from the code" until the walk phase. Read-only looks at the API on the stack (GET /kosks/<id>/grants as the köşk
# nazımı, the başnazım and the Medaris nazımı, and for an unknown id; GET /me for five accounts) agree with it: 21 codes grantable to the nazım and
# to the başnazım, the list empty for the seed's second köşk, the seed's first köşk naming its two medrese courses, 403 AUTHZ_FORBIDDEN for the
# Medaris nazımı and 404 KOSK_NOT_FOUND for an unknown id whoever asks. Nothing was written.
#
# One flow for the whole page, as its entry in FLOWS.md asks: the list of posts, "Ders nazırı ata", "İzinleri düzenle" and "Görevden al", with the
# refusals. It is the sibling of the three flows of nazar's "Ders nazırları" (nazar.courseNazirs.appoint, .permissions, .dismiss), which write the same
# API through the hoca's own page; the shape and the findings follow them (CAPPOINT-n, CNP-n and CNDIS-n are cited where this page shares the
# component or the behaviour). What differs on this page, from the code:
#   - the köşk's İzinler page reads the posts of ALL the köşk's medrese-free courses and the nazım picks the course in the dialog ("Ders", a select);
#     the hoca's page is one course's. A medrese's courses are not here: a note names them (the medrese's staff give those posts);
#   - "Kaydet" is off until a person, a course AND at least one permission are there (canSaveGrant, present.ts:72). The hoca's page lets a person be
#     appointed holding nothing; this one never does: a post here always carries a permission (the API's own rule, minItems 1);
#   - the dialog's search is nizam's HeadPicker, which says nothing for text that is no address and never warns that the person found is the viewer
#     (GRANTS-1, GRANTS-3); nazar's warns before sending;
#   - a refused save keeps the dialog open and re-reads nothing, whichever the code, so a post that was ended elsewhere stays on the page (GRANTS-2);
#     nazar's closes the dialog and reads the list again;
#   - the end of a post is shown as a day, "Görev ve izinler aynı gün biter." (CNP-2);
#   - the köşk's nazım may not edit his own post (the API's SELF_GRANT_REFUSED; the button is left out of his own row) and the başnazım may: the one
#     person who may rewrite his own row (own-row edit only for the chief, FLOWS.md); "Görevden al" is on every row, one's own too.
#
# The self-grant check order (ledger/security.md), drawn as this route has it. Unlike POST /kosks/:id/nazims, where the self-grant check runs before
# the permission check and anyone signed in can write an audit row, the permission guard comes first here: AuthGuard, then AuthzGuard
# (`@Authz(course_nazir.assign_kosk, byExistingKosk)`: an unknown or malformed id is 404 KOSK_NOT_FOUND before any permission is read, a hidden köşk
# 404 to the people who may not open it, then 403 AUTHZ_FORBIDDEN), then the pipes (400), then the handler's `assertNotSelf` (create: the person named; update:
# the holder of the post; always, and SYSTEM_ADMIN is not asked), then the service. A caller with no right to the köşk therefore writes no audit row;
# the nazım who names himself gets 403 SELF_GRANT_REFUSED and an audit row `permission.self_grant_refused` (the page then says "Bir şeyler ters gitti",
# GRANTS-1); DELETE has no self-grant check at all. Finding GRANTS-6 in ui.yaml `rules` gives file and line for each step.
#
# Findings of the page, each in ui.yaml `rules`: GRANTS-1 (SELF_GRANT_REFUSED and the other unnamed codes are "Bir şeyler ters gitti", and the page never
# warns about one's own address), GRANTS-2 (a refused save re-reads nothing), GRANTS-3 (text that is no address does nothing and says nothing),
# GRANTS-4 ("0 izin" for a post that holds nothing), GRANTS-5 ("Görevden al" is on for a person who has appointed others and the refusal comes after),
# GRANTS-6 (the order of the server's checks), and from the inventory F-W4-17 (the tab's title names neither the köşk nor the page's subject), F-X-20
# (grants#1 and #5 cannot be carried as written), F-X-3 and CAPPOINT-2 ("Kaydet" off with no word why), CAPPOINT-1 and CNDIS-3 (closing is ignored
# while a call is on), CAPPOINT-3 and CNP-4 (the count is not announced), CNP-2, CNP-3 and CNDIS-1, F-W2-12, F-W2-open-8, F-W2-3, F-X-14 and HEAD-3.
schema: delurio-graph/0
kind: flow
id: nizam.grants.appoint
status: captured
domain: medaris.api
ui: nizam.grants.appoint
title: Appoint a ders nazırı from the köşk
summary: >-
  The köşk's nazım opens İzinler and reads the posts held in the köşk's own courses: a row for each ders nazırı with their course, how many
  permissions and which, when it ends ("Süresiz" or a day, with "Görev ve izinler aynı gün biter."), who gave it and when. "Ders nazırı ata" opens
  a dialog: he types the exact e-mail address of a person and presses Enter (or leaves the field), the realm's directory is searched, and the
  person found is shown as "Seçilen ders nazırı". He picks one of the köşk's courses that belong to no medrese, ticks the permissions the post carries
  (the 21 codes of a course; he holds them all) and may type an end. "Kaydet" is on only when a person, a course and at least one permission are there
  and the end is ahead; it writes the post and its permissions, which end together. A toast says "Ders nazırı atandı", the dialog closes and the list
  has the row. "İzinleri düzenle: name" opens the same dialog on that post and replaces the whole set and the end; "Görevden al: name" asks first and
  ends the post and every permission at once. His own row has no "İzinleri düzenle" (the server would refuse it); the başnazım, who may open any
  köşk's İzinler by its address, has it on every row, his own too. A Medaris nazımı with no grant, a köşk nazımı of another köşk and an address that
  is no köşk are all met with the same screen, "Bu bölüm için izniniz yok". A refused save is worded in a toast and the dialog stays open: a person
  who holds a post in the course already, a post ended meanwhile, a post whose holder has appointed others, a code he may not give, a course that is
  no longer the köşk's, an end in the past, an account that is gone, and any other failure.

scope:
  shows: >-
    the list page with its empty line, its note about the medrese's courses and its rows, the three dialogs ("Ders nazırı ata" with the e-mail search,
    the chosen person, the course, the permission boxes and the end; "İzinleri düzenle"; "Görevden al"), the toasts of each write and of each refusal,
    and the two ways the page says "izniniz yok"
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "the sidebar, the scope picker, the phone bar and the menu's İzinler entry with its aria-current (e2e grants#1, last assertion): nizam.shell.menuPerPersona and nizam.shell.landingByRole. The refusal's own words, the account line and 'Ana sayfaya dön' are nizam.shell.noAccessAndNotFound's (it walks grants#2 and #3 as well); here `refused` and `not_found` are exits that carry the title only"
    - "the other 18 of the 21 boxes (the ones the walk does not tick) and the help line a box could have: PermissionCatalog holds no help for a course code (PermissionBoxes helpOf), so a box is its sentence alone. The graph draws the three the walk ticks"
    - "a medrese's courses and the people who hold posts in them: the medrese's staff give those (nazar.nazirs.*; the API answers 404 COURSE_NAZIR_NOT_FOUND to this page for such a post). The note names the courses and says so"
    - "the hoca appointing from the course itself, with nobody warned: nazar.courseNazirs.appoint, .permissions and .dismiss write the same posts through POST, PATCH and DELETE /courses/:id/nazirs"
    - "a read of the viewer that fails (GET /me): `viewerId` is null, so '(siz)' is never written and 'İzinleri düzenle' is drawn on every row, the viewer's own included, where the server then refuses it with SELF_GRANT_REFUSED (grants-view.tsx:181-183); the graph does not draw it"
    - "the answers the stack cannot make on request, each a class of `failures`: the directory not answering (`person: down`), a code the nazım may not give (GRANT_EXCEEDS_GIVER; the boxes offer only what `grantable` names and the nazım holds the whole catalog), a code outside the catalog, a course hidden or archived since the page was read (GRANT_COURSE_INVALID), an end that has passed since the dialog opened (the dialog reads the clock once, when it opens: grant-dialog.tsx:77), an account that is gone (KOSK_NAZIM_UNKNOWN_ACCOUNT), a caller who lost his seat (AUTHZ_FORBIDDEN) and the 503 of the directory. They are one class, `refused`, with one toast node whose sentence depends on the code"
    - "an end typed half way ('Bitiş tarihini ve saatini tamamlayın.', isUnfinishedEnd): a datetime-local field cannot be left half typed by the replay's fill; the unit spec kosk-grants.spec.tsx pins the rule"
    - "an end that is cleared on an edit (the field empty: 'Süresiz' again): the one end the graph does not walk; the effect is the post's end set to null (updateGrant sends `endsAt: null`)"
    - "a list that cannot be read for another reason: the page's own error ('Ders nazırları yüklenemedi', 'Yeniden dene'), drawn as `loadFailed` and not bound (nothing on the stack can make GET /kosks/:id/grants fail for a köşk that is there)"
    - "a session that has ended: every action sends the person to sign in (realm.auth.signIn) instead of drawing a toast (redirectIfUnauthenticated)"
    - "what the person appointed then opens: nazar.access.dersNazirPages (the permissions the post gives) and the course page in nazar-web"

decisions:
  D1:
    question: >-
      Should the dialog warn, before "Kaydet", that the person found is the viewer, as nazar's does ("Kendinizi ders nazırı yapamazsınız.")? Today the nazım
      types his own address, is shown the person, picks a course and boxes, and is told "Bir şeyler ters gitti. Biraz sonra yeniden deneyin." (GRANTS-1).
    recommend: >-
      Compare the person's id with the viewer's, which the page already has (`viewerId`), and warn beside the person; give SELF_GRANT_REFUSED its own
      sentence (the two other pages do: HEAD-4).
    affects: [picked, ready, appointing]
  D2:
    question: >-
      Should a save that is refused because the post is gone (COURSE_NAZIR_NOT_FOUND) or already there (COURSE_NAZIR_EXISTS) re-read the list, as
      nazar's page does? Today the dialog stays open on a row that no longer exists and nothing refreshes (GRANTS-2).
    recommend: >-
      On those two codes close the dialog and call `router.refresh()`, as the success path does, and keep the toast.
    affects: [ready, editReady, revoking]
  D3:
    question: >-
      Should "Kaydet" say what is missing while it is off (a person, a course, a permission)? It is natively disabled and nothing says why (F-X-3,
      CAPPOINT-2).
    recommend: >-
      Keep it enabled and name the missing step when it is pressed, or tie the reason to it with aria-describedby.
    affects: [asking, searching, picked, editNone, editPast]

context:
  start:
    values: [empty, note, held, own, chiefOwn, handedOn, medaris, missing, failed]
    initial: any
    say:
      empty: "the köşk nazımı opens the İzinler of a köşk whose own courses have no ders nazırı yet: the list says so"
      note: "the köşk nazımı opens İzinler of a köşk that also hosts medrese courses (the seed's first köşk): the note names them, and no post is listed"
      held: "the köşk nazımı opens İzinler where the list has one post of another person, with two permissions and an end ahead"
      own: "the köşk nazımı opens İzinler where the one post is his own, seated by the başnazım: its row has no 'İzinleri düzenle'"
      chiefOwn: "the başnazım opens the İzinler of a köşk by its address, where the one post is his own: its row has 'İzinleri düzenle'"
      handedOn: "the köşk nazımı opens İzinler where one ders nazırı holds the permission to appoint and has appointed another: two posts, and the first cannot be ended before the second"
      medaris: "a person with no right to this köşk's İzinler (the Medaris nazımı with no grant, or the nazım of another köşk) opens it: the server answers 403"
      missing: "the köşk in the address is not there: the server answers 404, and the page shows the same screen as for 403"
      failed: "the list cannot be read for another reason (the server answers 5xx or does not answer): the page's own error with 'Yeniden dene'"
  person:
    values: [fresh, member, refused, nobody, notAddress, down]
    initial: any
    say:
      fresh: "they type the address of an account that holds no post in the course: found, chosen, and the save is accepted"
      member: "they type the address of a person who holds a post in the chosen course already: found and chosen like anyone, and the save is refused with COURSE_NAZIR_EXISTS"
      refused: "they type the address of a person who is found, and the save is refused for any other reason (their own address, a code they may not give, a course that is no longer the köşk's, an end that has passed, an account that is gone, the directory failing at the save)"
      nobody: "they type an address no account has: the field says so and nobody is chosen"
      notAddress: "they type text that cannot be an address (no @, or no dot and two letters after it) and press Enter: nothing is searched and nothing is said"
      down: "they type an address and the directory does not answer: the field says the search cannot be made now"
  edit:
    values: [saved, gone, refused]
    initial: any
    say:
      saved: "the save of 'İzinleri düzenle' is accepted"
      gone: "the post was ended elsewhere while the dialog was open: the save is refused with COURSE_NAZIR_NOT_FOUND"
      refused: "the save is refused for another reason (a code he may not give, an end that has passed, the caller's own post, a caller who lost his seat)"
  revoke:
    values: [saved, gone, handedOn, refused]
    initial: any
    say:
      saved: "'Görevden al' is accepted: the post and its permissions end"
      gone: "the post was ended elsewhere while the dialog was open: the call is refused with COURSE_NAZIR_NOT_FOUND"
      handedOn: "someone the person appointed from the course still holds their post: the call is refused with DISMISS_SEAT_HANDED_ON"
      refused: "the call is refused for another reason (a caller who lost his seat, a köşk that is gone)"
  row:
    values: [none, other, own]
    initial: none
    say:
      none: "the list has no ders nazırı: it says 'Henüz ders nazırı yok.'"
      other: "the list has the post of a person who is not the viewer"
      own: "the list has the viewer's own post, seated by someone else"
  ends:
    values: [open, set]
    initial: open
    say:
      open: "the post has no end: the row says 'Süresiz'"
      set: "the post ends on a day: the row says the day and 'Görev ve izinler aynı gün biter.'"
  holds:
    values: [two, three]
    initial: two
    say:
      two: "the post holds the two permissions the walk ticks: the row says '2 izin' and 'Celseler, başvurular'"
      three: "the post holds the third box too (ders kayıtları): the row says '3 izin'"
  boxes:
    values: [zero, two, three]
    initial: zero
    say:
      zero: "no box is ticked: the footer says '0 izin seçili' and 'Kaydet' is off"
      two: "the two boxes of the walk are ticked: '2 izin seçili'"
      three: "the third box (ders kayıtları) is ticked too: '3 izin seçili'"
  until:
    values: [none, future, past]
    initial: none
    say:
      none: "nothing was typed in the end field (empty, or the end the post holds)"
      future: "an end ahead is typed"
      past: "an end that is not after the moment the dialog opened is typed: the field says so at once and 'Kaydet' is off"
  course:
    values: [none, chosen]
    initial: none
    say:
      none: "no course is chosen: the select says 'Ders seçin'"
      chosen: "one of the köşk's own courses is chosen"
  note:
    values: [none, nobody, down]
    initial: none
    say:
      none: "nothing is said under the e-mail field but its help"
      nobody: "the field says no account has this address"
      down: "the field says the search cannot be made now"
  toast:
    values: [none, assigned, edited, revoked, exists, gone, handedOn, refused]
    initial: none
    say:
      none: "no toast of this flow is up"
      assigned: "'Ders nazırı atandı' is up (6 seconds)"
      edited: "'İzinler kaydedildi' is up (6 seconds)"
      revoked: "'Görevden alındı' is up (6 seconds)"
      exists: "an error toast says the person is a ders nazırı of the course already (it stays until it is closed)"
      gone: "an error toast says the ders nazırı is no longer there"
      handedOn: "an error toast says the people the person appointed are still in post"
      refused: "an error toast with the sentence of another refusal"

guards:
  # `canSaveGrant` of present.ts:72 for an assignment: a person, a course, at least one permission, and an end that is not wrong
  formComplete: "course == 'chosen' and boxes != 'zero' and until != 'past'"
  # grants-view.tsx:181: the button is drawn unless the row is the viewer's own and the viewer is not the başnazım
  mayEdit: "row == 'other' or (row == 'own' and start == 'chiefOwn')"

effects:
  rowHeld: { set: { row: other, ends: set, holds: two } } # the list was read with one post of another person, two permissions, an end ahead
  rowOwn: { set: { row: own, ends: open, holds: two } } # the list was read with the viewer's own post, two permissions, no end
  reset: { set: { note: none, toast: none, boxes: zero, until: none, course: none } } # the dialog's opening effect (grant-dialog.tsx:70-79): the person, the course, the boxes and the end are forgotten; a refusal toast is cleared here, not by the page
  openEditTwo: { set: { toast: none, boxes: two, until: none } } # the same effect for a post: the dialog starts from what the post holds
  openEditThree: { set: { toast: none, boxes: three, until: none } }
  clearNote: { set: { note: none } }
  clearToast: { set: { toast: none } }
  forgot: { set: { note: none } } # `remove()` of HeadPicker: the person goes; the course, the boxes and the end stay
  nobodyNote: { set: { note: nobody } }
  downNote: { set: { note: down } }
  courseChosen: { set: { course: chosen } }
  ticked: { set: { boxes: two } }
  boxesThree: { set: { boxes: three } }
  boxesZero: { set: { boxes: zero } }
  endFuture: { set: { until: future } }
  endPast: { set: { until: past } }
  appointedEnd: { set: { toast: assigned, row: other, ends: set, holds: two } }
  appointedOpen: { set: { toast: assigned, row: other, ends: open, holds: two } }
  existsToast: { set: { toast: exists } }
  goneToast: { set: { toast: gone } }
  handedOnToast: { set: { toast: handedOn } }
  refusedToast: { set: { toast: refused } }
  editedThreeEnd: { set: { toast: edited, holds: three, ends: set } }
  editedThree: { set: { toast: edited, holds: three, ends: open } }
  editedTwoEnd: { set: { toast: edited, holds: two, ends: set } }
  editedTwo: { set: { toast: edited, holds: two, ends: open } }
  revokedKeep: { set: { toast: revoked } } # another post is still listed
  revokedLast: { set: { toast: revoked, row: none, ends: open, holds: two } }

failures:
  reading:
    from: listKoskGrants
    forbidden: [AUTHZ_FORBIDDEN]
    missing: [KOSK_NOT_FOUND]
    unavailable: []
  searching:
    from: lookupUser
    unavailable: [KEYCLOAK_ADMIN_UNAVAILABLE, KEYCLOAK_ADMIN_NOT_CONFIGURED, USER_LOOKUP_FORBIDDEN, VALIDATION_ERROR]
  appointing:
    from: createKoskGrant
    exists: [COURSE_NAZIR_EXISTS]
    refused: [AUTHZ_FORBIDDEN, SELF_GRANT_REFUSED, GRANT_EXCEEDS_GIVER, PERMISSION_UNKNOWN, GRANT_COURSE_INVALID, GRANT_EXPIRY_INVALID, KOSK_NAZIM_UNKNOWN_ACCOUNT, KEYCLOAK_ADMIN_UNAVAILABLE, VALIDATION_ERROR, KOSK_NOT_FOUND]
  saving:
    from: updateKoskGrant
    gone: [COURSE_NAZIR_NOT_FOUND]
    refused: [AUTHZ_FORBIDDEN, SELF_GRANT_REFUSED, GRANT_EXCEEDS_GIVER, PERMISSION_UNKNOWN, GRANT_EXPIRY_INVALID, VALIDATION_ERROR, KOSK_NOT_FOUND, HTTP_400]
  dismissing:
    from: revokeKoskGrant
    gone: [COURSE_NAZIR_NOT_FOUND]
    handedOn: [DISMISS_SEAT_HANDED_ON]
    refused: [AUTHZ_FORBIDDEN, KOSK_NOT_FOUND, HTTP_400]

# The story the page tells first: the nazım of an empty köşk finds a person by address, picks the course, ticks two permissions, types an end ahead and
# saves (the row says "2 izin" and the end); he opens "İzinleri düzenle" on that row, ticks a third box and saves; then he ends the post and the list
# is empty again.
main:
  given: { start: empty, person: fresh, edit: saved, revoke: saved }
  events: [DONE, OPEN_ASSIGN, SEARCH, DONE, CHOOSE_COURSE, TICK_PERMISSION, TYPE_FUTURE_END, SAVE, DONE, EDIT_PERMISSIONS, ADD_PERMISSION, SAVE, DONE, REVOKE, CONFIRM, DONE]

initial: reading

states:
  reading:
    title: The list is read
    description: >-
      The page reads GET /kosks/:id/grants and GET /me together on the server, behind a loading skeleton (loading.tsx, `aria-busy`). The list answers the
      posts held in the köşk's medrese-free courses (oldest first, with the person, the course, the codes held, the end, the giver and the day), every
      course of the köşk that is not hidden, and the codes the caller may give (`grantable`: 21 for the köşk's nazım and for the başnazım). The guard is
      `course_nazir.assign_kosk` on the köşk, then the service asks for a held KOSK_NAZIM seat in this köşk or SYSTEM_ADMIN. A 403 is `forbidden()` and a 404
      is `notFound()`: both draw the app's "Bu bölüm için izniniz yok" (exits `refused` and `not_found`; app/not-found.tsx says in its own comment that the
      403 and the 404 look the same on purpose, so no one learns which köşks exist). Any other failure is a null: the page's own error (`loadFailed`).
      The page sets no focus when it opens.
    invoke: { action: listKoskGrants }
    on:
      DONE:
        - { guard: "start == 'held' or start == 'handedOn'", target: listed, effect: [rowHeld], source: apps/nizam/features/grants/components/grants-view.tsx:256, say: "the list has a post of another person (two for handedOn; the graph draws one row)" }
        - { guard: "start == 'own' or start == 'chiefOwn'", target: listed, effect: [rowOwn], source: apps/nizam/features/grants/components/grants-view.tsx:181, say: "the list has the viewer's own post" }
        - { guard: "start == 'empty' or start == 'note'", target: listed, source: apps/nizam/features/grants/components/grants-view.tsx:256, say: "the köşk's own courses have no ders nazırı yet: the table says so" }
      FAIL.forbidden: { guard: "start == 'medaris'", target: refused, source: apps/nizam/features/grants/reads.ts:22, say: "403: the Medaris nazımı with no grant, or the nazım of another köşk" }
      FAIL.missing: { guard: "start == 'missing'", target: not_found, source: apps/nizam/features/grants/reads.ts:23, say: "404: the köşk is not there, for the nazım and the başnazım alike" }
      FAIL.unavailable: { guard: "start == 'failed'", target: loadFailed, source: apps/nizam/features/grants/reads.ts:26, say: "any other failure is `null`: the page's own error" }
    source: apps/nizam/app/kosks/[id]/izinler/page.tsx:28

  listed:
    title: The list of ders nazırları is on the page
    description: >-
      The page: the title "İzinler" (h1; the tab's <title> is "İzinler" too, with no köşk in it: F-W4-17), the line "Bu köşkün medrese dışı derslerinde ders nazırı
      atar, atadığınız kişilere izin verirsiniz. Verdiğiniz izin, kendi izinlerinizi aşamaz.", the button "Ders nazırı ata", the note about the medrese's courses
      (an Alert, role status, "Medrese derslerinde izni medrese kadrosu verir; burada yönetilmezler. Bu köşkte medreselere ait dersler: {courses}.", drawn only
      where the köşk hosts such courses: the seed's first köşk does, its second does not), the section "Atanmış ders nazırları" with "{n} kişi", and the
      table named by its caption: the empty line "Henüz ders nazırı yok." or a row for each post. A row: the person's name and address (the name is the row
      header), the course, "{n} izin" with the short names of the codes ("Celseler, başvurular"; for a post that holds none, which the hoca's page can make, this
      one says "0 izin" and nothing under it: GRANTS-4), the end ("Süresiz", or the day with "Görev ve izinler aynı gün biter.": CNP-2, the hour is only in the
      dialog), the giver's name (" (siz)" after it when the viewer gave) and the day, and two buttons: "İzinleri düzenle: name" (left out of the viewer's own row,
      unless the viewer is the başnazım) and "Görevden al: name" (every row, with no date gate: e2e grants#7; a row whose person has appointed others is not marked, GRANTS-5). After a write a toast of 6 seconds says what
