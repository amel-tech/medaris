    invoke: { action: revokeKoskGrant }
    on:
      CANCEL: { target: dismissing, source: apps/nizam/features/grants/components/revoke-dialog.tsx:74, say: "Vazgeç, the close icon or Esc: nothing happens, the dismissal goes on (CNDIS-3)" }
      DONE:
        - { guard: "revoke == 'saved' and start == 'handedOn'", target: listed, effect: [revokedKeep], source: apps/nizam/features/grants/components/revoke-dialog.tsx:60, say: "a toast says 'Görevden alındı' and '{name} artık {course} dersinin ders nazırı değil.'; the other post is still listed" }
        - { guard: "revoke == 'saved'", target: listed, effect: [revokedLast], source: apps/nizam/features/grants/components/revoke-dialog.tsx:60, say: "the same: the row goes and the list says 'Henüz ders nazırı yok.' (e2e grants#8)" }
      FAIL.gone: { guard: "revoke == 'gone'", target: revoking, effect: [goneToast], source: apps/nizam/features/grants/components/revoke-dialog.tsx:54, say: "COURSE_NAZIR_NOT_FOUND: an error toast 'Görevden alınamadı' says 'Bu ders nazırı artık yok.'; the dialog stays open and the row stays on the page (GRANTS-2)" }
      FAIL.handedOn: { guard: "revoke == 'handedOn'", target: revoking, effect: [handedOnToast], source: apps/nizam/features/grants/components/revoke-dialog.tsx:54, say: "DISMISS_SEAT_HANDED_ON: an error toast says the people the person appointed are still in post and to end them first; the dialog stays open" }
      FAIL.refused: { guard: "revoke == 'refused'", target: revoking, effect: [refusedToast], source: apps/nizam/features/grants/components/revoke-dialog.tsx:54, say: "any other refusal: an error toast 'Görevden alınamadı' with the sentence of its code or 'Bir şeyler ters gitti.'" }
    source: apps/nizam/features/grants/actions.ts:45

  refused:
    title: The page says "Bu bölüm için izniniz yok"
    description: >-
      The read answered 403: the person is a Medaris nazımı with no grant on this köşk, or the nazım of another köşk. `forbidden()` draws the app's refusal
      inside the shell: a section named by its h1 "Bu bölüm için izniniz yok", the sentence naming the başnazım, the account and "Ana sayfaya dön"
      (nizam.shell.noAccessAndNotFound draws it whole, with its findings NOACC-1 to NOACC-3: no alert, no focus, the tab keeps the title "İzinler"). e2e grants#2.
    type: final

  not_found:
    title: The köşk is not there and the page says the same
    description: >-
      The read answered 404 for an address that is no köşk (a made-up id, or one that is not a uuid): `notFound()` draws the same screen as the 403, on purpose
      (app/not-found.tsx), for the nazım and the başnazım alike. e2e grants#3.
    type: final

  left:
    title: They leave the page
    type: final
    leavesPage: true

assertions:
  - id: kaydet-sends-only-a-complete-form
    never: "state == 'appointing' and (course == 'none' or boxes == 'zero')"
    say: "Kaydet sends a new post only with a person, a course and at least one permission."
    source: apps/nizam/features/grants/present.ts:72
  - id: an-edit-keeps-a-permission
    never: "state == 'saving' and boxes == 'zero'"
    say: "An edit is never sent with no permission: a post here always carries at least one."
    source: apps/nizam/features/grants/present.ts:81
  - id: a-past-end-is-not-sent
    never: "(state == 'appointing' or state == 'saving') and until == 'past'"
    say: "An end that is not after the moment the dialog opened is told in the dialog and never sent."
    source: apps/nizam/features/grants/components/grant-dialog.tsx:94
  - id: the-nazim-does-not-edit-his-own-row
    never: "state == 'saving' and row == 'own' and start != 'chiefOwn'"
    say: "The row of the viewer's own post has no 'İzinleri düzenle' unless the viewer is the başnazım, so an edit of it is never sent."
    source: apps/nizam/features/grants/components/grants-view.tsx:181
  - id: a-refusal-keeps-the-dialog
    never: "state == 'listed' and toast in ['exists', 'gone', 'handedOn', 'refused']"
    say: "A refused write leaves its dialog open with the toast beside it; only a success closes it."
    source: apps/nizam/features/grants/components/grant-dialog.tsx:123
  - id: ending-the-last-post-empties-the-list
    never: "state == 'listed' and toast == 'revoked' and start != 'handedOn' and row != 'none'"
    say: "After 'Görevden alındı' of the only post the list says 'Henüz ders nazırı yok.'."
    source: apps/nizam/features/grants/components/revoke-dialog.tsx:60
