  - id: edit-the-whole-set-and-the-end
    need: >-
      The nazım opens a post, sees what the person holds and when it ends, changes the permissions and the end, and saves: what is
      ticked is what the person holds from now on, what stays keeps its giver and its date, and the post ends with its
      permissions. A post is edited to something, never to nothing: no permission, no save.
    evidence:
