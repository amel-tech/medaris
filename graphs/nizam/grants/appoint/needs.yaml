schema: delurio-graph/0
kind: needs
id: nizam.grants.appoint
status: proposed
summary: >-
  What must exist for the köşk's nazım to appoint a ders nazırı from İzinler, give them permissions and an end, change them, take
  the post away, and be refused: the flow's product list. Each need is what the product must do, from the flow's story (FLOWS.md),
  the inventory's findings (F-W4-17, F-X-20, F-X-3) and the flow's own (GRANTS-1 to GRANTS-6), and from the findings it shares
  with nazar's hoca pages (CAPPOINT-n, CNP-n, CNDIS-n), not from what the page does today. Nothing planned in planned.md belongs
  to this flow.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# For the orchestrator's gaps merge (nothing here was replayed; the e2e checks of apps/nizam/e2e/grants.e2e.ts, the unit spec apps/nizam/test/kosk-grants.spec.tsx and the API's own e2e named
# under `walked` are the only runs, and the replay scenarios of binding.yaml, binding.gone.yaml, binding.own.yaml, binding.chief.yaml and binding.note.yaml are written and not run):
# missing:  warn-before-naming-oneself (none), a-refused-write-reads-the-list-again (none), text-that-is-no-address-is-told (none), kaydet-says-why-it-is-off (none),
# the-count-is-announced (none), a-post-with-no-permission-reads-izin-yok (none), the-tab-names-the-kosk (none), the-end-shows-its-hour (none),
# the-dialogs-open-on-their-first-field (none), a-dismissal-names-who-stands-in-the-way (none)
# unwalked: revoke-is-refused-while-appointees-hold-posts (the API's own e2e and the replay scenario `handedOn`, not run; no web e2e), the-nazim-does-not-edit-his-own-post-the-chief-may
# (a unit spec and the API's own e2e; the replay scenarios `own` and `chief` are written, not run; no web e2e), a-stranger-leaves-no-audit-row (read from the code only, GRANTS-6),
# the-list-says-which-courses-it-leaves-out (grants#1 carries it as written, but with a seeded post that lapses on 2026-12-31: F-X-20; the replay scenario `note` is written, not run)

needs:
  - id: list-of-posts
    need: >-
      The köşk's nazım reads, in one table, who holds a ders nazırı post in the köşk's own courses: the person (name and address),
      the course, how many permissions and which, when the post ends (or that it does not), who gave it and on which day. A köşk
      with no post says so, and the list is read again after every write.
    evidence:
      - state: listed
      - node: rosterTable
      - node: emptyLine
      - node: rowPerson
      - node: rowAddress
      - node: rowCourse
      - node: rowCount
      - node: rowNames
      - node: rowNever
      - node: rowEnd
      - node: rowSameDay
      - node: rowGiver
      - node: rowGiverDay
      - node: count
      - source: apps/tedrisat/src/kosk/kosk-grants.controller.ts:69
      - source: apps/nizam/features/grants/components/grants-view.tsx:206
      - test: apps/nizam/e2e/grants.e2e.ts
        name: "nizam/38 — the list shows each ders nazırı with course, permission summary, end and giver, and names the medrese courses (criterion 1)"
      - test: apps/nizam/e2e/grants.e2e.ts
        name: "nizam/38 — after the gate 'Görevden al' ends the post and every permission at once, and 'Vazgeç' changes nothing (criterion 4)"
      - test: apps/tedrisat/test/e2e/kosk-grants.e2e.spec.ts
      - test: apps/nizam/test/kosk-grants.spec.tsx
    note: |-
      grants#1: a1-a8: date-bound, the seeded post ends 2026-12-31 and the list is empty after that day (F-X-20); the replay's
      `member` scenario starts from a post with an end 30 days ahead
      grants#8: a11, a12: after the dismissal the line "Henüz ders nazırı yok." is there
      apps/tedrisat/test/e2e/kosk-grants.e2e.spec.ts: :298, the list, the courses and the codes the caller may hand out
      apps/nizam/test/kosk-grants.spec.tsx: :234-303, the row, "siz", the empty line, the error state

  - id: the-list-says-which-courses-it-leaves-out
