  - id: the-nazim-does-not-edit-his-own-post-the-chief-may
    need: >-
      The köşk's nazım cannot widen or lengthen his own post (a co-nazım or the başnazım may; the server refuses him with
      SELF_GRANT_REFUSED), so his own row has no "İzinleri düzenle"; he may still end it. The başnazım is the one person who may
      rewrite his own post and the page offers it to him on every row.
    evidence:
      - node: editButton
      - node: revokeButton
      - state: listed
      - source: apps/nizam/features/grants/components/grants-view.tsx:181
      - source: libs/common/src/authz/self-grant.guard.ts:67
      - test: apps/nizam/test/kosk-grants.spec.tsx
