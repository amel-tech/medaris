  cancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: KoskGrantDialog.cancel }, in: [asking, searching, picked, ready, appointing, editReady, editNone, editPast, saving], emits: CANCEL, source: apps/nizam/features/grants/components/grant-dialog.tsx:153 } # on while the save is on its way, and does nothing then (CAPPOINT-1)
  save: { type: action, component: Button, role: button, intent: confirm, text: { key: KoskGrantDialog.save }, in: [asking, searching, picked, ready, appointing, editReady, editNone, editPast, saving], disabledIn: [asking, searching, picked, appointing, editNone, editPast, saving], emits: SAVE, source: apps/nizam/features/grants/components/grant-dialog.tsx:154 } # natively disabled until `canSaveGrant`, and nothing says why (F-X-3, CAPPOINT-2); busy in `appointing` and `saving`
  busy: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [appointing, saving, dismissing], source: libs/ui/src/mds/button.tsx:62 } # the hidden word of the busy button: neither dialog passes a loadingLabel

  # a refusal: an error toast over the dialog, which stays open; it stays until it is closed. One title for each dialog, one sentence for each code the page words
  toastAssignFailed: { type: status, component: Status, text: { key: KoskGrantDialog.assignFailed }, in: [ready], when: "toast in ['exists', 'refused']", source: apps/nizam/features/grants/components/grant-dialog.tsx:124 }
  toastEditFailed: { type: status, component: Status, text: { key: KoskGrantDialog.failed }, in: [editReady], when: "toast in ['gone', 'refused']", source: apps/nizam/features/grants/components/grant-dialog.tsx:124 }
  toastRevokeFailed: { type: status, component: Status, text: { key: KoskRevokeDialog.failed }, in: [revoking], when: "toast in ['gone', 'handedOn', 'refused']", source: apps/nizam/features/grants/components/revoke-dialog.tsx:296 }
  toastExists: { type: status, component: Status, text: { key: KoskGrantsPage.errors.exists }, in: [ready], when: "toast == 'exists'", source: apps/nizam/features/grants/present.ts:238 } # COURSE_NAZIR_EXISTS
  toastGone: { type: status, component: Status, text: { key: KoskGrantsPage.errors.notFound }, in: [editReady, revoking], when: "toast == 'gone'", source: apps/nizam/features/grants/present.ts:239 } # COURSE_NAZIR_NOT_FOUND
  toastHandedOn: { type: status, component: Status, text: { key: KoskGrantsPage.errors.handedOn }, in: [revoking], when: "toast == 'handedOn'", source: apps/nizam/features/grants/present.ts:243 } # DISMISS_SEAT_HANDED_ON
  toastRefused: { type: status, component: Status, text: { oneOf: [KoskGrantsPage.errors.exceeds, KoskGrantsPage.errors.unknownPermission, KoskGrantsPage.errors.courseInvalid, KoskGrantsPage.errors.expiryInvalid, KoskGrantsPage.errors.unknownAccount, KoskGrantsPage.errors.forbidden, KoskGrantsPage.errors.generic] }, in: [ready, editReady, revoking], when: "toast == 'refused'", source: apps/nizam/features/grants/present.ts:247 } # which sentence depends on the code (grantErrorKey); SELF_GRANT_REFUSED is the generic one (GRANTS-1); the binding gives them as one pattern

  # ---- the dialog "Görevden al" ----------------------------------------------------------------------------------------------------------
  revokeDialog: { type: page, component: Page, role: dialog, name: { labelledBy: revokeTitle }, in: [revoking, dismissing], initialFocus: revokeCancel, source: apps/nizam/features/grants/components/revoke-dialog.tsx:313 } # a form dialog (CNDIS-1), size sm; the scrim does not close it; the focus starts on "Vazgeç" (e2e grants#8 a1)
  revokeEyebrow: { type: text, component: Text, text: { key: composed.RevokeDialog.eyebrow, params: { title: course.title } }, in: [revoking, dismissing], source: apps/nizam/features/grants/components/revoke-dialog.tsx:321 } # the course's title above the title (data, not a message)
  revokeTitle: { type: text, component: Heading, role: heading, text: { key: KoskRevokeDialog.title }, in: [revoking, dismissing], source: apps/nizam/features/grants/components/revoke-dialog.tsx:322 } # h2
  revokeClose: { type: action, component: Button, role: button, intent: dismiss, name: { key: KoskRevokeDialog.close }, in: [revoking, dismissing], emits: CANCEL, source: apps/nizam/features/grants/components/revoke-dialog.tsx:323 } # ignored while the call is on and nothing marks it (CNDIS-3)
  revokeIntro: { type: text, component: Text, text: { key: KoskRevokeDialog.intro, params: { name: person.name, course: course.title } }, in: [revoking, dismissing], source: apps/nizam/features/grants/components/revoke-dialog.tsx:336 }
  revokeEffect: { type: text, component: Text, text: { key: KoskRevokeDialog.effect }, in: [revoking, dismissing], source: apps/nizam/features/grants/components/revoke-dialog.tsx:341 } # a caption
  revokeMeta: { type: text, component: Text, text: { key: KoskRevokeDialog.auditNote }, in: [revoking, dismissing], source: apps/nizam/features/grants/components/revoke-dialog.tsx:325 } # the footer's <p class=mds-dialog__meta>
  revokeCancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: KoskRevokeDialog.cancel }, in: [revoking, dismissing], emits: CANCEL, source: apps/nizam/features/grants/components/revoke-dialog.tsx:328 } # the focus starts here; while the call is on it does nothing and does not look off (CNDIS-3)
  confirmRevoke: { type: action, component: Button, role: button, intent: dismiss, text: { key: KoskRevokeDialog.submit }, in: [revoking, dismissing], disabledIn: [dismissing], emits: CONFIRM, source: apps/nizam/features/grants/components/revoke-dialog.tsx:329 } # "Görevden al", busy in `dismissing`

  # ---- the refusal: the title of the app's own screen, which nizam.shell.noAccessAndNotFound draws whole ------------------------------
  refusalPage: { type: page, component: Page, role: main, in: [refused, not_found], source: libs/ui/src/mds/app-shell.tsx:41 } # the shell's <main>; the face is a section inside it
  refusalTitle: { type: text, component: Heading, role: heading, text: { key: NoAccess.title }, in: [refused, not_found], source: libs/ui/src/mds/system-state.tsx:43 } # h1 "Bu bölüm için izniniz yok": the same words for the 403 and the 404 (app/not-found.tsx:6)

edges:
  - { labelledBy: [listRegion, listHeading] }
  - { labelledBy: [assignDialog, assignTitle] }
  - { labelledBy: [editDialog, editTitle] }
  - { labelledBy: [revokeDialog, revokeTitle] }
  - { labelledBy: [chosenRegion, chosenTitle] }
  - { labelledBy: [permissionsRegion, permissionsSection] }
  - { triggers: [assignButton, asking] }
  - { triggers: [editButton, editReady] }
  - { triggers: [revokeButton, revoking] }
  - { triggers: [save, appointing] }
  - { triggers: [save, saving] }
  - { triggers: [confirmRevoke, dismissing] }
  - { returnsFocus: [assignDialog, assignButton] } # Base UI returns the focus to the element that had it when the dialog opened: the header button, which outlives the refresh (not verified in a browser)
  - { returnsFocus: [editDialog, editButton] } # the row's button; after a save the list is read again and the row's button is a new element, so the focus may fall to the page (F-W2-10 is the same shape); not verified
  - { returnsFocus: [revokeDialog, revokeButton] } # a dismissed row's button is gone after the refresh, so the focus has nowhere to go (F-D2c-8 of nazar's table); not verified

rules:
  - id: focus-not-set
    rule: >-
      Nothing in features/grants moves the focus when the page opens or when a toast shows. The two dialogs "Ders nazırı ata" and "İzinleri düzenle" are opened with no
      `initialFocus` (grant-dialog.tsx:139-159, libs/ui/src/mds/dialog.tsx:138 gives Base UI `undefined` for a form), so the focus is on the close icon, not the e-mail field:
      the same as F-W2-12 of nizam.madrasahs.headMuderris. Only "Görevden al" names its first stop, "Vazgeç" (revoke-dialog.tsx:324; e2e grants#8 a1). Not verified in a browser.
  - id: F-W2-12
    rule: >-
      The assignment and the edit open on the header's close icon, one stop before the field a keyboard or screen-reader user came for (grant-dialog.tsx:139, libs/ui/src/mds/dialog.tsx:138).
      The graph draws `initialFocus: closeIcon`, from the code. Fix: pass the picker's input as `initialFocus` in the assignment and the first box in the edit.
  - id: F-W4-17
    rule: >-
      The tab's <title> is "İzinler" (generateMetadata, page.tsx:11-14), the same for every köşk: it names neither the köşk nor, once a dialog is open, what is being done, so
      two köşks' İzinler are two tabs and two history entries with one title. Fix: put the köşk's name in the title and, with the h1, in the line under it.
  - id: F-X-20
    rule: >-
      Two of the e2e checks cannot be carried as written. grants#1 asserts "31 Aralık 2026" for a post the seed makes with an end of 2026-12-31 (grants-seed.ts:117-123), which lapses
      after that day and leaves the list empty. grants#5 types 2026-11-15T12:00 as the new end (grants.e2e.ts:234-236) and expects "15 Kasım 2026": the clock is not fixed in that test,
      so from 15 Nov 2026 12:00 (Istanbul) the dialog refuses the end ("Bitiş zamanı şu andan sonra olmalı.", state `editPast`) and the test fails; today is 16 Nov. The graph carries the code's
      behaviour: the walk types an end computed from now (30 days ahead, 18:00), and the seed's post is not used.
  - id: F-X-3
    rule: >-
      "Kaydet" is natively disabled (grant-dialog.tsx:154: `disabled={!canSave}`) while a person, a course or a permission is missing and while the end is wrong, and nothing names the
      step: no line says "Önce bir kişi bulun", a keyboard user's Tab skips the button, and Enter in the form cannot send it. The same as CAPPOINT-2 of the hoca's dialog (decision D3). Fix: keep it
      enabled and name what is missing when it is pressed, or tie the reason to it with aria-describedby.
  - id: CAPPOINT-1
    rule: >-
      While a call is on, "Vazgeç", the close icon and Esc do nothing (`onOpenChange` ignores a close while `saving`, grant-dialog.tsx:141-143 and revoke-dialog.tsx:315-317), and are neither disabled nor
      marked; only "Kaydet" / "Görevden al" look busy and the boxes, the select and the end field are disabled. The same as CAPPOINT-1 and CNDIS-3. Fix: disable them with aria-disabled while it is pending.
  - id: CAPPOINT-3
    rule: >-
      The footer's "{n} izin seçili" is a plain <p class=mds-dialog__meta> (libs/ui/src/mds/dialog.tsx:114-116), not a live region: ticking a box changes it and a reader of the screen is told nothing
      (CAPPOINT-3, CNP-4). Here it also says "0 izin seçili" with no sentence for none, where the hoca's dialog says "İzin seçilmedi". Fix: role=status on it.
  - id: F-W2-open-8
    rule: >-
      The "*" of "Ders nazırı" and of "Ders" is drawn and aria-hidden (libs/ui/src/mds/field.tsx:42-45) and neither control carries `required` (head-picker.tsx:103-122, grant-dialog.tsx:196-204: the Field is
      `required` but the Select receives no `required`), so a reader of the screen is never told that a person and a course are needed. Fix: required and aria-required on both controls.
  - id: F-W2-3
    rule: >-
      The search has no button: it runs on Enter and when the field is left and the text is an address (head-picker.tsx:74-79, :121), the input is `disabled` while it searches so the focus it had drops
      (:112), and tedrisat writes every search to the audit log (F-X-14), which the help line says. A keyboard user who tabs through the field with an address in it, or presses "Vazgeç" (the blur comes first),
      writes an audit row nobody asked for. Fix: search on Enter or a button only; keep the input enabled with aria-busy; announce the result.
  - id: HEAD-3
    rule: >-
      A second search that finds nobody, or fails, while a person is chosen says nothing: the picker's message is the Field's `error`, dropped once `value` is set (head-picker.tsx:101), and no alert takes
      its place. The person stays chosen and the field keeps the typed address. Same picker as nizam.madrasahs.headMuderris.
  - id: F-UI-W1-1
    rule: >-
      Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:103-112), so the dialog's description is the picker, the select, 21 boxes and the end field (F-D2c-16 of the
      hoca's dialog). Fix: describe the dialog by the line above its first field only.
  - id: CNP-2
    rule: >-
      The "Bitiş" cell prints the day only ("16 Aralık 2026", formatDay, grants-view.tsx:148) and the caption "Görev ve izinler aynı gün biter." says the permissions end that day, while the dialog edits the day and
      the hour and the access ends at that hour (grant-dialog.tsx:75, :86-93). A post that ends today at 14:00 reads as ending today; the hour is visible only in the edit dialog. Fix: print the hour too.
  - id: CNP-3
    rule: >-
      Not verified. An error toast of a refused write is raised while the modal dialog is open and the dialog stays open (grant-dialog.tsx:123-128 with `duration: Infinity`). Whether Base UI's modal makes the toast
      region inert, so that the accessibility tree does not expose it, is not known from the code. The graph draws the toast in the dialog's state; the replay's `exposed` check will say.
  - id: CNDIS-1
    rule: >-
      The confirmation "Görevden al" is a `Dialog form`, so it is a role dialog; the kit says a confirmation that waits for an answer is an AlertDialog (libs/ui/src/mds/dialog.tsx:49-50). A reader of the screen
      is not told it is a confirmation. e2e grants#8 finds it as a dialog. Fix: AlertDialog with a busy confirm button, as nazar's Pano does.
  - id: GRANTS-1
    rule: >-
      New. SELF_GRANT_REFUSED, and every other code the page does not word, is "Bir şeyler ters gitti. Biraz sonra yeniden deneyin." (grantErrorKey, present.ts:234-253: the nine codes it names are not SELF_GRANT_REFUSED,
      VALIDATION_ERROR, KEYCLOAK_ADMIN_UNAVAILABLE or KOSK_NOT_FOUND). The nazım who types his own address is shown himself as "Seçilen ders nazırı" with no warning (HeadPicker knows no viewer; nazar's dialog warns before
      sending, "Kendinizi ders nazırı yapamazsınız."), picks a course and boxes, presses "Kaydet" and is told to try again later, when the server has refused him for good (kosk-grants.controller.ts:98-104) and written an
      audit row `permission.self_grant_refused`. The başnazım may do it (SYSTEM_ADMIN is not asked, self-grant.guard.ts:67). Fix: compare the person's id with `viewerId`, which the page has, and warn beside the person;
      give SELF_GRANT_REFUSED its own sentence (decision D1; HEAD-4 is the same habit on the medrese's pages).
  - id: GRANTS-2
    rule: >-
      New. A refused write re-reads nothing. On any failure each dialog shows a toast and returns (grant-dialog.tsx:123-129, revoke-dialog.tsx:295-300), with no `onSaved`, so the list stays as the page had it.
      COURSE_NAZIR_NOT_FOUND (a post that was ended elsewhere) leaves the dialog open on a row that is gone, and "Görevden al" can be pressed again with the same answer for ever; COURSE_NAZIR_EXISTS leaves the
      person off a list that does not show the post made elsewhere. nazar's page closes the dialog and reads the list again on both codes (CNP-1, CNDIS-4). Fix: on those two codes call `onSaved` and close, and
      keep the toast (decision D2).
  - id: GRANTS-3
    rule: >-
      New. Text that is no address does nothing and says nothing: HeadPicker.search returns when `isEmailLike` fails (head-picker.tsx:55; the pattern is features/madrasahs/present.ts:249, no space, one @,
      a dot and two letters after it), and Enter on an empty field is the same. "Kaydet" stays off and no line names the step. nazar's dialog says "Geçerli bir e-posta adresi yazın." on Enter (CAPPOINT-4 is the
      blur it does not say it on). Same picker as nizam.madrasahs.open and .headMuderris. Fix: say it on Enter and on blur.
  - id: GRANTS-4
    rule: >-
      New, from the code, not seen. A post that holds no permission (the hoca can make one from nazar's page, and tedrisat allows it) is listed as "0 izin" with nothing under it (grants-view.tsx:122-129:
      the count is always written, the names line is left out when empty), where the hoca's own page says "İzin yok"; and this page can edit it to something but never back to nothing (canSaveGrant needs one
      permission). Not reachable from nizam's own dialog. Fix: say "İzin yok" for 0, as nazar does.
  - id: GRANTS-5
    rule: >-
      New. "Görevden al" is on for a person who has appointed others (a ders nazırı who holds `course_nazir.assign`), and the refusal comes only after the nazım has confirmed: "Bu ders nazırının atadığı kişiler hâlâ görevde;
      önce onları görevden alın." (DISMISS_SEAT_HANDED_ON, revoke-dialog.tsx:295-300, present.ts:243), without naming them. nazar's table disables the button and counts them (CNDIS-2, with its own finding that a disabled button
      leaves the tab order). The list does show the appointees as rows with the giver's name, so the nazım can find them. Fix: mark the row, or name the appointees in the toast.
  - id: GRANTS-6
    rule: >-
      New, for the owner (security; ledger/security.md has the köşk nazımlar route's order, the other way round). The order of the server's checks on POST, PATCH and DELETE /kosks/:id/grants, read from the code and not run:
      (1) AuthGuard (401), then AuthzGuard (`@Authz(course_nazir.assign_kosk, byExistingKosk)`, kosk-grants.controller.ts:70, :90, :119, :154): the resolver answers 404 KOSK_NOT_FOUND for an unknown or malformed id before
      any permission is read (kosk.controller.ts:82-91), `assertOpen` 404s a hidden köşk to those who may not open it, then 403 AUTHZ_FORBIDDEN (libs/common/src/authz/authz.guard.ts:84-98); (2) the pipes: ParseUUIDPipe and the
      body, 400; (3) POST: the self-grant check on the person named, `always` (:98-104): for anyone but SYSTEM_ADMIN, 403 SELF_GRANT_REFUSED and an audit row `permission.self_grant_refused` (libs/common/src/authz/self-grant.guard.ts:67-95);
      PATCH: `holderOf` reads the post's holder first and the same check runs on him (:129-137), an unknown post being the service's 404; DELETE: no self-grant check; (4) the service: `grantable` (AUTHZ_FORBIDDEN unless the
      caller is SYSTEM_ADMIN or holds a KOSK_NAZIM seat in this köşk, kosk-grants.service.ts:71-86), PERMISSION_UNKNOWN, GRANT_EXCEEDS_GIVER (:163-176), GRANT_EXPIRY_INVALID (:178-184), the account (:236-242:
      KOSK_NAZIM_UNKNOWN_ACCOUNT or 503), then in the transaction GRANT_COURSE_INVALID and COURSE_NAZIR_EXISTS (kosk-grants.repository.ts:297-311) or COURSE_NAZIR_NOT_FOUND (:241) or DISMISS_SEAT_HANDED_ON.
      Consequences: unlike POST /kosks/:id/nazims (self-grant before permission, so anyone signed in can write the audit row) a caller with no right to this köşk writes no audit row here; a nazım naming himself is refused before the service
      asks whether he holds a seat or the codes, so SELF_GRANT_REFUSED can mask AUTHZ_FORBIDDEN for a caller who passes the guard without a seat; the başnazım may seat himself, edit his own post and end it, and a nazım may end his own
      post (no check on DELETE) but not widen or lengthen it (the API's own e2e, self-grant.e2e.spec.ts:613).
  - id: label-in-name
    rule: >-
      A row button's visible text is contained in its accessible name: "İzinleri düzenle" in "İzinleri düzenle: {name}" and "Görevden al" in "Görevden al: {name}" (WCAG 2.5.3). The close icons, named "Kapat", have no visible text. Holds.
  - id: hours-only-in-the-dialog
    rule: >-
      Not a finding. The dialog reads the clock once, when it opens (`setNow(new Date())`, grant-dialog.tsx:77), so an end that becomes past while the dialog stays open is caught only by the server (GRANT_EXPIRY_INVALID,
      the toast "Bitiş tarihi geçmişte."); the graph draws the page's own rule (`editPast`, `picked`) and the server's class `refused`.
