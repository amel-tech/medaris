# The screens of nizam.grants.appoint: "İzinler" (/kosks/<id>/izinler) with its table and the three dialogs that open over it, "Ders nazırı ata",
# "İzinleri düzenle" and "Görevden al", with the toasts of each write and the title of the refusal. Read from the code of PR #394 on 16 Nov 2026
# (apps/nizam/app/kosks/[id]/izinler/page.tsx, features/grants/components/{grants-view,grant-dialog,revoke-dialog}.tsx,
# features/grants/{present,actions,reads}.ts, features/madrasahs/components/head-picker.tsx, features/permissions/components/permission-boxes.tsx and
# libs/ui/src/mds (app-shell, dialog, field, select, input, checkbox, alert, table, button), libs/ui/src/components/sonner.tsx); the words are copied from
# libs/i18n/src/locales/tr/nizam.json (namespaces KoskGrantsPage, KoskGrantDialog, KoskRevokeDialog, HeadPicker, PermissionCatalog, NoAccess), key for key,
# by script. Nothing was walked in a browser: every behaviour is "from the code" until the walk phase; the unit specs apps/nizam/test/kosk-grants.spec.tsx
# and the e2e apps/nizam/e2e/grants.e2e.ts (named in needs.yaml) are the only runs.
#
# The page behind a dialog is drawn only where the dialog is closed: the dialog is modal, so the page is inert while it is open. The table's rows are data:
# the nodes marked `repeat` stand for one item per post, and the replay finds them through the binding. The graph draws one row (two for the köşk
# whose first ders nazırı has appointed another; the binding scopes a row's nodes to the person's own row).
#
# What the graph draws of a form of 21 boxes. The dialog draws the course's whole catalog (21 codes, in the API's order, in one section "Ders izinleri"); the
# graph draws three: "Celse ekle, tarihini değiştir, iptal et; toplantı bağlantısını gir" and "Başvuruyu onayla ya da reddet" (the two the e2e ticks, grants#4),
# and "Ders kaydı ekle, adlandır, gizle; görünürlüğünü değiştir" (the one the walk adds when it edits). The other eighteen are boxes like them; `world: open`
# leaves them out. No box has a help line (PermissionCatalog holds none for a course code).
#
# Composed text (built in code, in no i18n file), each a value the page puts where no message of its own is:
#   composed.GrantsPage.person       a person's name: the row header (grants-view.tsx:96)
#   composed.GrantsPage.address      their address, a <bdi dir=ltr> (grants-view.tsx:100)
#   composed.GrantsPage.course       the course's title (grants-view.tsx:112)
#   composed.GrantsPage.permissionNames   the short names of the codes held, in the API's order, joined with ", " with a capital first letter (grants-view.tsx:71-74, 127)
#   composed.GrantsPage.endDate      the day of the end, as formatDay writes it in the viewer's zone (grants-view.tsx:148, features/permissions/present.ts:34)
#   composed.GrantsPage.giver        the giver's name, and " (siz)" after it when the viewer gave (grants-view.tsx:160-163)
#   composed.GrantsPage.giverDay     the day it was given (grants-view.tsx:165)
#   composed.GrantDialog.person      a person's name: the chosen block (head-picker.tsx:140) and the post's card (grant-dialog.tsx:169)
#   composed.GrantDialog.address     their address (head-picker.tsx:145, grant-dialog.tsx:172)
#   composed.RevokeDialog.eyebrow    the course's title above the title of "Görevden al" (revoke-dialog.tsx:321)
#   composed.Button.loading          "Yükleniyor": the word the kit's Button writes in its hidden status while it is busy, `loadingLabel`'s default
#                                    (libs/ui/src/mds/button.tsx:62); none of these buttons passes one
# `changes` is the app's own sentence, KoskGrantDialog.chosenNote, which says what "Kaydet" does: "Kaydedince bu derste ders nazırı olur ve seçtiğiniz izinleri alır.".
# The success toasts of an edit and of a dismissal say what changed too ("{name} için izinler güncellendi.", "{name} artık {course} dersinin ders nazırı değil.").
#
# Samples are what the page prints for the person the walk appoints; the binding gives its own where a person, a course or a day is the walk's.
schema: delurio-graph/0
kind: ui
id: nizam.grants.appoint
flow: nizam.grants.appoint
status: captured
catalog: catalog/tr.json
locales: [tr]
changes: { key: KoskGrantDialog.chosenNote }
samples:
  course: Deneme dersi nzgrants
  title: Deneme dersi nzgrants
  name: Esma Başvuran
  email: e2e-basvuran-c@medaris.test
  giver: Cemal Köşk Nazımı
  by: Cemal Köşk Nazımı
  date: 16 Kasım 2026
  endDate: 16 Aralık 2026
  count: "2"
  list: Celseler, başvurular
  courses: Bina ve İzhar Şerhi ve İsâgûcî ile Mantığa Giriş

