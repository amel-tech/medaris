# The screens of nizam.inactive.viewContent: nizam-web's Pasif kapsamlar (/pasif-kapsamlar, app/pasif-kapsamlar/page.tsx) as far as
# "İçeriği gör" goes: the page's frame and notice, the table's first column (the scope's name and kind), the button of a köşk or
# course row while it is idle and while it is busy, and the toast that says a press was refused. Read from
# apps/nizam/features/inactive-scopes/components/inactive-view.tsx and present.ts on 15 Nov 2026; nothing was opened in a browser.
# The columns Neden, Ne zamandır and Son yönetici, the "… ata" buttons and their dialog, the filter and the read's failure box
# are nizam.inactive.reassign's. The shell around the page (sidebar, bell) is nizam.shell.menuPerPersona's.
#
# Words: every `InactivePage.*` key is copied from libs/i18n/src/locales/tr/nizam.json (the app reads it as `nizam.InactivePage`),
# `common.toast.close` from common.json, the key being the path inside each file. The two `composed.*` keys are NOT in any i18n
# file: they are texts the app builds in code, written here with their placeholders so that a replay can match them:
#   composed.InactivePage.name   the scope's name as the API gives it, in the first column (inactive-view.tsx:93)
#   composed.Button.loading      "Yükleniyor", the hidden status beside a busy button, a default of the component (libs/ui/src/mds/button.tsx:62)
# `changes` is the page's own notice: it already says what the press writes ("her açış denetim kaydına yazılır") and who may press.
# Samples are invented and neutral.
schema: delurio-graph/0
kind: ui
id: nizam.inactive.viewContent
flow: nizam.inactive.viewContent
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: InactivePage.noticeBody }
samples:
  name: Örnek Köşk
  kind: Ders
  kosk: Örnek Köşk

nodes:
  # ---- the page ----
  inactivePage: { type: page, component: Page, role: main, in: [listed, recording, viewFailed], source: libs/ui/src/mds/app-shell.tsx:41 } # the shell's one <main id="main">, no name and no initialFocus: nothing in features/inactive-scopes or app/pasif-kapsamlar moves the focus (rule focus-not-set)
  pageTitle: { type: text, component: Heading, role: heading, text: { key: InactivePage.title }, in: [listed, recording, viewFailed], source: apps/nizam/features/inactive-scopes/components/inactive-view.tsx:202 } # h1
  pageIntro: { type: text, component: Text, text: { key: InactivePage.intro }, in: [listed, recording, viewFailed], source: apps/nizam/features/inactive-scopes/components/inactive-view.tsx:203 }
  notice: { type: alert, component: Alert, role: status, text: { key: InactivePage.noticeTitle }, in: [listed, recording, viewFailed], source: apps/nizam/features/inactive-scopes/components/inactive-view.tsx:206 } # a neutral Alert: role=status, the title in a <p>
  noticeBody: { type: text, component: Text, text: { key: InactivePage.noticeBody }, in: [listed, recording, viewFailed], source: apps/nizam/features/inactive-scopes/components/inactive-view.tsx:207 } # who may open a passive scope, and that every opening is written to the audit log

  # ---- the list: the table and the first column of a row ----
  listSection: { type: page, component: Page, role: region, name: { labelledBy: listHeading }, in: [listed, recording, viewFailed], source: apps/nizam/features/inactive-scopes/components/inactive-view.tsx:210 }
  listHeading: { type: text, component: Heading, role: heading, text: { key: InactivePage.heading }, in: [listed, recording, viewFailed], source: apps/nizam/features/inactive-scopes/components/inactive-view.tsx:215 } # h2
  scopesTable: { type: list, component: List, role: table, name: { key: InactivePage.caption }, in: [listed, recording, viewFailed], source: apps/nizam/features/inactive-scopes/components/inactive-view.tsx:242 } # the caption is visually hidden; its words are the h2's
  rowName: { type: text, component: Text, role: rowheader, text: { key: composed.InactivePage.name, params: { name: scope.name } }, in: [listed, recording, viewFailed], repeat: scopes, source: apps/nizam/features/inactive-scopes/components/inactive-view.tsx:93 } # the row's <th scope=row>: the name, then its kind under it
  rowKind: { type: text, component: Text, text: { oneOf: [InactivePage.kinds.KOSK, InactivePage.kinds.MADRASAH, InactivePage.kindInKosk] }, in: [listed, recording, viewFailed], repeat: scopes, source: apps/nizam/features/inactive-scopes/components/inactive-view.tsx:94 } # "Köşk", "Medrese", or "Ders · <köşk>" for a course (kinds.COURSE joined to its köşk)

  # ---- "İçeriği gör": drawn for a köşk and a course row, never for a medrese ----
  viewButton: { type: action, component: Button, role: button, intent: secondary, name: { key: InactivePage.viewLabel, params: { name: scope.name } }, text: { key: InactivePage.view }, in: [listed, viewFailed], when: viewable, repeat: scopes.viewable, emits: PRESS, source: apps/nizam/features/inactive-scopes/components/inactive-view.tsx:181 } # a ghost button beside "… ata"; the visible words are in the name (WCAG 2.5.3)
  viewButtonBusy: { type: action, component: Button, role: button, intent: secondary, name: { key: InactivePage.viewLabel, params: { name: scope.name } }, text: { key: InactivePage.view }, in: [recording], disabledIn: [recording], when: viewable, source: apps/nizam/features/inactive-scopes/components/inactive-view.tsx:184 } # the pressed row only: aria-busy and aria-disabled, never `disabled`, so the focus stays on it
  viewBusyStatus: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [recording], when: viewable, source: libs/ui/src/mds/button.tsx:113 } # the hidden <output> beside the busy button: "Yükleniyor" is a default of the component, outside the catalog (F-UI-W1-3)

