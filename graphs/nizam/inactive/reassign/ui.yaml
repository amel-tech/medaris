# The screens of nizam.inactive.reassign: Pasif kapsamlar (/pasif-kapsamlar) and the "… ata" window over it. Read from
# apps/nizam/features/inactive-scopes/components/{inactive-view,assign-scope-dialog}.tsx and
# apps/nizam/features/madrasahs/components/head-picker.tsx on 15 Nov 2026; the words are copied from
# libs/i18n/src/locales/tr/nizam.json (namespaces InactivePage, InactiveAssignDialog, HeadPicker).
#
# What the graph draws and how to read it:
#   - One row of each kind (a köşk, a medrese, a course) is drawn; the stack may hold more of a kind, and the same nodes then
#     repeat. The three kinds are separate nodes because their words differ ("Köşk nazımı ata" / "Başmüderris ata" / "Hoca ata",
#     and the window's title, intro, label, note and button). `koskLeft`, `madrasahLeft` and `courseLeft` in the flow say which
#     rows an assignment has taken away; a row leaves the list once its scope has a manager (revalidatePath, actions.ts:26).
#   - The page behind the window is inert while the window is open, so no page node is listed in a window state (the window is
#     modal: Base UI's Dialog). The toasts are not part of the page and are drawn beside the window.
#   - A `{name}` of the catalog is the scope's name in the row buttons and the window's intro, and the person's in the picker:
#     one sample serves both here, and the binding fills what it needs by itself.
#   - Text that is data (a scope's name, a person's name, an address, a date) is a `composed.InactivePage.*` key made only of its
#     placeholder; it is in no i18n file. The code that prints it: inactive-view.tsx:92 (scope), :131 (since), :146 (last
#     manager); assign-scope-dialog.tsx:112 (the eyebrow); head-picker.tsx:140 (the chosen person), :145 (the address).
#   - `changes.key` is the one message that is not the app's: no app message says what an assignment changes for the three kinds
#     at once (the window's intro and note say it per kind, with a scope's name in it).
#   - The five column headers and the visually hidden caption are drawn; the row's date line, "İçeriği gör" and the reasons of a
#     term that ran out ("…_EXPIRED", the same words with "görev süresi doldu") are named in the flow's `outOfView`.
