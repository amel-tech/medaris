rules:
  - { id: no-default-accept, rule: "no page has initialFocus on an action with intent confirm: the window opens on the close icon, and no 'ata' button has the focus on arrival" }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): the row button says 'Köşk nazımı ata' and is named 'Köşk nazımı ata: <name>'" }
  - { id: focus-not-set, rule: "the page sets no initial focus on load (inactive-view.tsx, page.tsx), so the graph draws none" }
  - { id: F-W2-12, rule: "the window passes no initialFocus (assign-scope-dialog.tsx:104-110): Base UI starts on the first focusable element, the header's close icon, instead of the first field. The e-mail field is the second stop. Fix: initialFocus = the picker's input (the same defect in assign-head-dialog and permissions-dialog)" }
  - { id: F-W2-10, rule: "a successful assignment closes the window and takes the row away (onAssigned then onOpenChange(false), assign-scope-dialog.tsx:99-100; revalidatePath, actions.ts:26): the button that had the focus is gone, only the toast says what happened, and the focus falls to the page. Fix: move it to the next row's button or the list's heading (F-X-7 is the same family)" }
  - { id: F-W2-3, rule: "the e-mail lookup has no button: it runs on Enter and when the field is left (head-picker.tsx:116-121), and the field is disabled while it searches (:112), so the focus is lost; only a hidden <output> says 'Aranıyor' (:124) and the answers 'bulunamadı' and 'şu an yapılamıyor' are a Field error, not a live region (field.tsx:60). Fix: a visible 'Ara' button, keep the input enabled with aria-busy, announce the result with role=status" }
  - { id: F-X-14, rule: "the family of F-W2-3: the address is looked up when the field is left, and tedrisat writes every lookup, found or not, to the audit log (the help text says so); tabbing through the field makes audited lookups. Fix: search on Enter or on a button only" }
  - { id: F-X-3, rule: "the submit is natively disabled until a person is chosen and the end is right (assign-scope-dialog.tsx:122), and nothing near it says which is missing: the footer holds only the audit note. A keyboard or screen-reader user meets a dead button. Fix: say it in the footer (as the head window does) or tie a reason to the button with aria-describedby" }
  - { id: F-UI-W1-1, rule: "Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:103-112), so a screen reader reads the intro, the field and the picker as the window's description when it opens" }
  - { id: REASSIGN-1, rule: "new: once a person is chosen, a later search that finds nobody, or fails, says nothing. HeadPicker gives the Field its error only while nobody is chosen (`error={value ? undefined : problem}`, head-picker.tsx:101), so the second address typed in the field is silently ignored and the first person stays chosen. Fix: show the error beside the field whatever is chosen, or clear the choice when a new search starts" }
  - { id: REASSIGN-2, rule: "new: SELF_GRANT_REFUSED reads 'Bir şeyler ters gitti. Biraz sonra yeniden deneyin.' A Medaris nazımı who holds platform.inactive_scopes_manage and picks their own address is refused by the API (inactive-scope.service.ts:250-264, the başnazım is exempt), and `KNOWN` has four codes and not this one (present.ts:76-81), so the toast promises that trying again will help. Fix: a message of its own ('Kendinizi atayamazsınız.'), as nazar's ders nazırı dialog has ('Kendinizi ders nazırı yapamazsınız.', nazar.courseNazirs.appoint)" }
  - { id: REASSIGN-3, rule: "new: while the assignment is sent, 'Vazgeç', the close icon and Escape stay enabled and do nothing (`if (!saving) onOpenChange(next)`, assign-scope-dialog.tsx:106-108); a busy control is neither disabled nor marked (the same as F-W3-open-2 in nizam.kosks.open). Fix: disable them while sending, or let the window close and the answer arrive as a toast" }
  - { id: REASSIGN-4, rule: "new: when the API answers 404 INACTIVE_SCOPE_NOT_FOUND (someone gave the scope a manager meanwhile, or it was hidden) the window stays open with a sticky toast and the list is not read again (assign-scope-dialog.tsx:86-92 returns before onAssigned), so the stale row stays and the same button gives the same refusal until the person reloads. Fix: refresh the list on that code and close the window, as the other two dialogs that race do" }
  - { id: REASSIGN-5, rule: "new: choosing a kind changes the rows and the count with no live region (inactive-view.tsx:218-232): a screen-reader user hears nothing, and an empty kind says its words only if they go and read them. Fix: make the count a role=status, or announce 'N kapsam'" }
  - { id: F-W2-1, rule: "a Medaris nazımı who holds platform.inactive_scopes_manage may open this page (inactive-scope.service.ts:58-69) and is shown no menu entry for it: `inactive` is not in medarisGroups (apps/nizam/lib/shell-nav.ts:178-186, the permission map :302). They reach it by address only; the page's own notice says they may open a passive scope. Fix: add `inactive` to medarisGroups, or drop the permission" }
  - { id: inactive-scope-accepts-new-scope, rule: "security, from the code and not run: the list shows a scope only if it once had a manager and has none now (InactiveScopeRepository.lastPosts, inactive-scope.repository.ts:64-107, an assignment row must exist), but the two writes ask `isInactive` (inactive-scope.repository.ts:263-281), which is only 'the scope exists, is not hidden, and holds no manager now' and never asks for a past one (inactive-scope.service.ts:225-233 calls it for both assign and view). So a köşk, medrese or course that never had a manager passes the check on the API though the page never offers it, and assign seats a manager there (the same service, :246-286) with platform.inactive_scopes_manage alone. The API's own e2e is named 'answers 404 for a scope that is attended, hidden, new or missing' and its loop holds an attended köşk, a hidden one, an attended medrese and an id that does not exist, and no scope that never had a manager (apps/tedrisat/test/e2e/inactive-scope.e2e.spec.ts:492-504). Fix: ask lastPosts' question in mustBeInactive (a past post must exist) and put that scope in the loop. See ledger/security.md" }

