      apps/tedrisat/test/e2e/inactive-scope.e2e.spec.ts: :350-430, who passes and who does not, a lapsed appointment included

  - id: give-a-scope-its-manager-by-email
    need: >-
      The başnazım gives a köşk its nazım, a medrese its başmüderris and a course its hoca (who is also its imam and is put on its
      list of hocalar) by the exact e-mail address of an account in the realm, even one that never opened the app; the scope is
      active again, the row leaves the list, a toast names the person and the scope, and the assignment and the search are written
      to the audit log.
    evidence:
      - state: form
      - state: formReady
      - state: looking
      - state: saving
      - state: listed
      - state: empty
      - source: apps/tedrisat/src/inactive-scope/inactive-scope.controller.ts:84
      - source: apps/tedrisat/src/user/users.controller.ts:57
      - source: apps/nizam/features/inactive-scopes/components/assign-scope-dialog.tsx:69
      - source: apps/nizam/features/inactive-scopes/actions.ts:12
      - source: apps/tedrisat/src/inactive-scope/inactive-scope.repository.ts:288
      - test: apps/nizam/e2e/inactive.e2e.ts
        name: "nizam/14 — 'Köşk nazımı ata' gives the köşk its nazım, the row leaves the list and the köşk is active again (criterion 3)"
      - test: apps/nizam/e2e/inactive.e2e.ts
        name: "nizam/14 — 'Başmüderris ata' gives a medrese its başmüderris (criterion 3)"
      - test: apps/nizam/e2e/inactive.e2e.ts
        name: "nizam/14 — 'Müderris ata' gives a course its müderris, the imam, and puts them on the course's list"
      - test: apps/tedrisat/test/e2e/inactive-scope.e2e.spec.ts
    note: |-
      Also drawn as the assertion only-a-chosen-person-is-sent.
      inactive#6: a köşk: no address, a past end, the end ahead, the row gone, the post, the passive mark, the audit row
      inactive#7: a medrese: its başmüderris
      inactive#8: a course: its müderris, the imam, on the course's list ("Hoca ata" in the catalog, "Müderris ata" in the test's
      name)
      apps/tedrisat/test/e2e/inactive-scope.e2e.spec.ts: :431-520, the API's side of the three, the 404s and the refusals

  - id: an-end-is-optional-and-checked
    need: >-
      The başnazım may give the post an end; left empty it lasts until it is changed; an end in the past, and one half typed, are
