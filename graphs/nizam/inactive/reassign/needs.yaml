      - test: apps/nizam/e2e/inactive.e2e.ts
        name: "nizam/14 — 'Köşk nazımı ata' gives the köşk its nazım, the row leaves the list and the köşk is active again (criterion 3)"
      - test: apps/tedrisat/test/e2e/inactive-scope.e2e.spec.ts
    note: |-
      Also drawn as the assertion only-a-right-end-is-sent.
      inactive#6: "Bitiş zamanı şu andan sonra olmalı." and the button off, then the end ahead
      apps/tedrisat/test/e2e/inactive-scope.e2e.spec.ts: :506, the API refuses an end in the past

  - id: the-button-says-why-it-is-off
    need: >-
      A person who cannot send the window is told in words what is missing (nobody is chosen, the end is wrong), and a keyboard or
      screen-reader user can reach the button and the message.
    missing: "no Linear issue; F-X-3: the button is natively disabled and the footer says only that the assignment is audited"
    note: >-
      Drawn on the states form and settle, which the code has: they are not evidence, so that a replay still walks them (SPEC.md
