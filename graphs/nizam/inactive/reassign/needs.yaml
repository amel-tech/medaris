schema: delurio-graph/0
kind: needs
id: nizam.inactive.reassign
status: proposed
summary: >-
  What must exist for the başnazım to give a köşk, a medrese or a course with no manager one again: the flow's product list. Each
  need is what the product must do, from the flow's story (FLOWS.md), the inventory's findings (F-W2-1, F-W2-3, F-W2-10, F-W2-12,
  F-X-3, F-X-14) and the flow's own (REASSIGN-1 to REASSIGN-5, and the security rule inactive-scope-accepts-new-scope), not from
  what the page does today. Nothing planned in planned.md belongs to this flow.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# For the orchestrator's gaps merge (nothing here was replayed; the e2e checks, the API's e2e and the unit specs named under `walked` are
# the only runs, and the replay scenarios of binding.yaml, binding.race.yaml and binding.unfinished.yaml are written and not run):
# missing:  a-scope-that-never-had-a-manager-is-refused (none), a-permitted-medaris-nazim-has-a-menu-entry (none),
# the-window-starts-on-the-first-field (none), the-button-says-why-it-is-off (none), a-search-says-what-it-did (none),
# a-refusal-has-its-own-words (none), a-stale-row-goes-after-a-refusal (none), cancel-while-sending-answers (none),
# a-filter-says-what-it-did (none), the-focus-goes-somewhere-after-an-assignment (none)
# unwalked: the-scrim-does-nothing (e2e inactive#9 clicks at (5, 5); the replay cannot click at a position, so the transition CLICK_SCRIM
# is written and not driven), a-passive-medrese-from-passivate-shows-here (nizam.madrasahs.passivate starts this flow; no check
# reads the row after a "Pasife al"), the-list-says-why-and-since-when (e2e inactive#1 pins the clock and the dates with a seed
# of SQL rows; the replay reads the days it set with the same SQL, written and not run), a-person-who-named-themselves-is-refused
# (the API's own e2e walks it; the page words it as "Bir şeyler ters gitti", REASSIGN-2, and the walk uses the başnazım, who is
# exempt)

needs:
  - id: the-list-says-why-and-since-when
    need: >-
      The başnazım sees every köşk, medrese and course that once had a manager and has none now, oldest first, each with why (a
      term that ran out, or a post taken away and by whom), since which day and for how many days, and who the last manager was
      and in which role; a scope that has a manager, a hidden one and one that never had a manager are not on the list, and the
      count says how many rows there are.
    evidence:
      - state: listed
      - state: empty
      - source: apps/tedrisat/src/inactive-scope/inactive-scope.controller.ts:65
      - source: apps/nizam/features/inactive-scopes/components/inactive-view.tsx:196
      - source: apps/tedrisat/src/inactive-scope/inactive-scope.repository.ts:64
      - test: apps/nizam/e2e/inactive.e2e.ts
        name: "nizam/14 — the list shows the scopes with no manager, why, since when and who the last one was, and leaves out the attended and the new (criterion 1)"
      - test: apps/nizam/test/inactive-scopes.spec.tsx
      - test: apps/tedrisat/test/e2e/inactive-scope.e2e.spec.ts
    note: |-
      Also drawn as the assertion a-list-with-rows-shows-one.
      inactive#1: the three rows with their reason, day, "N gündür", last manager and role; the attended and the new left out; the
      count; clock pinned
      apps/nizam/test/inactive-scopes.spec.tsx: :162-225, the rows, the star, the empty and the error state
      apps/tedrisat/test/e2e/inactive-scope.e2e.spec.ts: :264-348, the list, the reason, the filter by type

  - id: filter-by-kind
    need: >-
      The başnazım narrows the list to köşks, medreses or courses and brings all of them back with "Tümü"; the count follows; a
      kind with nothing left says so in words, and a person who cannot see the result is told that it changed.
    evidence:
      - state: listed
      - state: empty
      - state: view
      - node: chipAll
      - node: chipKosk
      - node: chipMadrasah
      - node: chipCourse
      - source: apps/nizam/features/inactive-scopes/present.ts:22
      - source: apps/nizam/features/inactive-scopes/components/inactive-view.tsx:224
      - test: apps/nizam/e2e/inactive.e2e.ts
        name: "nizam/14 — the filter keeps one kind of scope, and 'Tümü' brings them all back (criterion 2)"
      - test: apps/nizam/test/inactive-scopes.spec.tsx
    note: |-
      inactive#2: "Ders", "Medrese", "Köşk" each leave one of the three, "1 kapsam", "Tümü" brings them back
      apps/nizam/test/inactive-scopes.spec.tsx: :85-92

  - id: a-filter-says-what-it-did
    need: When a chip changes the rows, the count or the empty line is announced to a screen reader.
    missing: "no Linear issue; REASSIGN-5: the count is a plain span and the rows change in silence"
    note: >-
      Drawn on the nodes count and emptyLine, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).

