# The frame of nizam-web (apps/nizam/components/shell, libs/ui/src/mds/app-shell.tsx, app-bar.tsx, scope-picker.tsx, nav-item.tsx)
# and the menu it draws for each kind of person, in the sidebar and on the phone's bar and sheet. Read from the code of the
# branch (the tree of PR #394) on 15 Nov 2026. Nothing here is approved, and nothing in it was seen in a browser by its writer:
# every behaviour is "from the code" unless a line says otherwise.
#
# What this flow draws and what its neighbours draw:
#   - nizam.nav draws where each menu entry leads and which entries a persona is offered. This flow draws what the person sees
#     of the menu (the groups, the entries, the numbers, the picker, the person's row, the bar and the sheet) and what is
#     absent for them (the entries of the other menus, the sign-out, Celseler/Talebeler/Ders kayıtları, a language menu).
#   - nizam.shell.landingByRole draws where "/" sends each person and the two screens of a person who has no menu (a person
#     with no role, a person with only medrese or course roles). Such a person's frame has no menu and no bell; this flow stops
#     at the roles read for them (`menu_not_drawn`).
#   - nizam.shell.noAccessAndNotFound draws the screens that say no and "Sayfa bulunamadı", which two entries of the
#     başnazım's menu open (F-P0-4).
#   - The page under the frame is another flow's: following an entry leaves this flow, and that page draws this frame again.
#
# Three kinds of person have a menu, each with the stack's own account (STACK.md) except the two that the walk makes:
#   chief         the başnazım (SYSTEM_ADMIN)                 17 entries in five groups
#   nazimCut      the seeded Medaris nazımı, who holds five permissions (kosk_create, madrasah_create, kosk_edit, audit_read,
#                 course_hide): 4 entries in two groups (Medreseler and Köşkler; no Denetim kaydı although audit_read is held: F-X-12)
#   nazimWide     a Medaris nazımı the walk appoints (a spare account) with the five permissions of shell.e2e.ts#10, which open
#                 every entry the Medaris menu has: 8 entries in four groups
#   koskMany      the seeded köşk nazımı. The stack's seed gives him TWO köşks (Süleymaniye and Kubbealtı: stack/lib/seed.mjs:60), so his
#                 picker is a menu; nizam.nav says one and is stale on this point
#   koskOne       a köşk nazımı the walk makes (a spare account, one köşk of the walk's own): the picker is a plain label
#
# Findings it carries (ui.yaml `rules` has the same ids): F-P0-8, F-UI-P0-1 (F-X-9), F-P0-4 (F-X-11), F-X-12, F-X-20 (shell#9 is
# stale), and six of its own, MENU-1 to MENU-6. MDRS-209 and MDRS-226 are in needs.yaml, as the plan says.
schema: delurio-graph/0
kind: flow
id: nizam.shell.menuPerPersona
status: captured
domain: medaris.api
ui: nizam.shell.menuPerPersona
title: Read the menu of the sidebar and of the phone's sheet
summary: >-
  Every signed-in page of nizam-web is drawn inside one frame, and the menu in it is the one of the person's variant, chosen
  on the server from what tedrisat says of them (GET /me/assignments and GET /me/roles), never from the session. The başnazım
  (the realm role SYSTEM_ADMIN) gets every entry: Genel, Platform, Talepler, Denetim and Ayarlar, seventeen in all. A Medaris
  nazımı gets the başnazım's menu cut to the entries their platform permissions open (GET /me/permissions): Medreseler and
  Köşkler, then Köşk başvuruları, Deste yayın istekleri, Kalıcı yasak talepleri and Yasaklamalar, and a group left empty
  goes; when the permissions cannot be read nothing is cut. A köşk nazımı gets the köşk's menu, Genel, Köşk and Yönetim, ten
  entries that follow one köşk, and above the menu a picker that is a menu button when they manage two köşks or more and a
  plain label when they manage one. Two entries carry a number when it is above zero: Bildirimler (the unread ban
  notifications) and, for a köşk nazımı, Başvurular (the applications waiting in the köşk in scope). From 768 px the frame is
  a sidebar with the brand, the picker, the menu "Ana menü" and the person's row; below it a bar with "Menü", the brand, the
  name of the page, a bell, and a sheet behind the button that holds the same picker, menu and person's row. The sheet opens
  on its head, Esc and "Kapat" close it, a followed link closes it, widening the window closes it, and it has no "Çıkış yap".

source: apps/nizam/components/shell/nizam-shell.tsx:44

scope:
  shows: >-
    the frame in its two windows (the sidebar; the bar and its sheet); the menu of each of three kinds of person, with its
    groups, its entries, its numbers and the entry of the page marked; the köşk picker closed and opened; the person's row; the
    bell; and what is absent from each menu
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "the page under the frame: every entry leads to a page of another flow, which draws this frame again. Ana sayfa and Bildirimler are the two pages this flow stays on (`place`)"
    - "a person with no menu: a person with no role and a person with only medrese or course roles get the frame with the brand and the person's row only, no menu and no bell, on /yetki-yok or /nazar-yonlendirme (nizam.shell.landingByRole); a visitor and the /auth pages get no frame at all"
    - "the brand and the theme toggle (common.shell.theme; F-UI-P0-3), and the privacy-notice link, which sits inside <main> (common.shell.privacyNotice; F-P0-5)"
    - "the reads that fail without an error: the unread count (0, so no number and a bell named \"Bildirimler\"), the list of köşks (an empty list leaves a köşk nazımı only the entry that names no köşk, Bildirimler, and no picker) and the waiting applications of a köşk (no number). Only the roles read and the permissions read have a branch here"
    - "a köşk nazımı of more than two köşks (the picker lists them all, up to 50) and a person who is both a Medaris nazımı and a köşk nazımı, who gets the Medaris menu: the widest role wins (shell-nav.ts:25-32)"
    - "the page a person opened by address, outside their menu: a Medaris nazımı reaches /denetim-kaydi with audit_read although the menu has no entry for it (F-X-12; nizam.nav `opensFor`)"
    - "narrowing the window with the sidebar open, which swaps one frame for the other and changes nothing the graph could name"
    - "the loading skeletons of each route while the shell reads (app/*/loading.tsx)"

decisions:
  D1:
    question: >-
      Which köşk should the menu follow on a page whose address names none (Bildirimler, Hesap), for a nazım of two köşks or
      more (MENU-2)? Today "/" sends them to the köşk of their oldest role, and a page with no köşk in its address names
      the NEWEST köşk the list gives (featured, then creation date), so the picker, "Ana sayfa" and every köşk entry
      silently change köşk between two clicks.
    recommend: >-
      Remember the köşk the person last worked in, as nazar-web does with its cookie, or carry it in the links; and make
      "/" and the fallback pick the same köşk.
    affects: [wide, kept, bar, sheet]
  D2:
    question: >-
      Should a Medaris nazımı see an entry for every permission that opens a page (F-X-12)? `ITEM_PERMISSIONS` lists
      appeals, audit-log, inactive, youtube, platform-settings and partners, but `medarisGroups` holds none of them, so a
      nazım holding platform.audit_read, which the API lets into the audit log, has no way there but the address.
    recommend: >-
      Yes: put those entries in the Medaris menu under their permissions, so that the cut by permission is the only cut.
    affects: [wide, sheet]
  D3:
    question: >-
      Should the menu keep the two entries whose pages do not exist (F-P0-4, F-X-11)? "Kalıcı yasak talepleri" and "YouTube
      bağlantısı" open "Sayfa bulunamadı"; the plan has a flow for each (nizam.moderation.decidePermanentBan,
      nizam.youtube.liveBroadcasts).
    recommend: >-
      Leave them out of the menu until the page exists, as the köşk menu does (shell-nav.ts:206-212 says it holds only pages
      that exist).
    affects: [wide, sheet]

context:
  opensAt:
    values: [wide, phone]
    initial: any
    say:
      wide: "the window is 768 px or wider when the page opens: the sidebar"
      phone: "the window is narrower than 768 px when the page opens: the bar, and the sheet behind its menu button"
  who:
    values: [chief, nazimCut, nazimWide, koskMany, koskOne]
    initial: any
    say:
      chief: "the Medaris başnazımı (SYSTEM_ADMIN): the whole menu, no picker"
      nazimCut: "the stack's Medaris nazımı, holding platform.kosk_create, madrasah_create, kosk_edit, audit_read and course_hide: the menu cut to Medreseler and Köşkler"
      nazimWide: "a Medaris nazımı holding platform.madrasah_edit, kosk_edit, kosk_application_decide, deck_publish and ban_account: every entry of the Medaris menu"
      koskMany: "a köşk nazımı of two köşks (the seeded one): the köşk menu and a picker that is a menu button"
      koskOne: "a köşk nazımı of one köşk: the köşk menu and a picker that is a plain label"
  unread:
    values: [some, none]
    initial: any
    say:
      some: "the person has unread ban notifications: Bildirimler carries a number and the bell is named \"Bildirimler, {count} okunmamış\""
      none: "nothing is unread: no number, and the bell is named \"Bildirimler\""
  waiting:
    values: [some, none]
    initial: any
    say:
      some: "applications wait in the köşk in scope: Başvurular carries a number (a köşk nazımı's menu only)"
      none: "nothing waits there, or the person has no Başvurular entry: no number"
  place:
    values: [home, notifications]
    initial: home
    say:
      home: "the page is Ana sayfa (\"/\" for the başnazım and a Medaris nazımı, the köşk's home for a köşk nazımı)"
      notifications: "the page is Bildirimler, whose address names no köşk"
  scope:
    values: [landing, newest]
    initial: landing
    say:
      landing: "the köşk that \"/\" opened: the one of the köşk nazımı's oldest role (GET /me/assignments is in the order the roles were given)"
      newest: "the newest köşk of the list (featured, then created first), which is the one the menu names on a page whose address names no köşk. A nazım of one köşk has one, and it is both"
  held:
    values: [read, unknown]
    initial: read
    say:
      read: "the permissions of the Medaris nazımı were read: the menu is cut by them"
      unknown: "GET /me/permissions failed: nothing is cut and the Medaris nazımı is offered the whole Medaris menu (tedrisat then refuses what is not theirs)"

# `who` folds the person with what they hold, because the pairs a case variable would allow are not all people the app has: a
# başnazım has no picker and a Medaris nazımı has no köşk menu. `unread` and `waiting` are separate from `who` because the same
# person meets both: they follow what the walk set up (a notification, an application waiting in a köşk).
guards:
  isChief: "who == 'chief'"
  isNazim: "who == 'nazimCut' or who == 'nazimWide'"
  isKosk: "who == 'koskMany' or who == 'koskOne'"
  pickerMenu: "who == 'koskMany'"
  koskCard: "who == 'koskOne'"
  platformMenu: "isChief or isNazim"
  widerMenu: "isChief or (isNazim and (who == 'nazimWide' or held == 'unknown'))"
  framed: "state in ['wide', 'picking', 'kept', 'bar', 'sheet', 'sheetPicking']"

effects:
  toNewest: { set: { scope: newest } } # the other row of the picker, when the person was on their landing köşk
  toLanding: { set: { scope: landing } } # the other row of the picker, when the person was on the newest
  backHome: { set: { place: home } }
  onNotifications: { set: { place: notifications, scope: newest } } # a page whose address names no köşk: the menu names the newest (MENU-2)
  permissionsUnknown: { set: { held: unknown } }

failures:
  reading: { from: getMyAssignments, unreadable: [] }
  readingPermissions: { from: getMyPermissions, unreadable: [] }
# `unreadable` stands for any answer but a refused token: the domain lists no refusal code for either read (a 401 is the
# guard's and is left out of the domain), and the shell answers a refused token (401) by leaving the frame without that data, not
# by signing in again, because the same layout wraps the sign-in page (nizam-shell.tsx:38-42).

# The story the frame tells first: the köşk nazımı of two köşks lands on his oldest köşk, opens the picker and closes it with Esc,
# opens it again and chooses the other köşk (the same page, the other köşk's), goes to Bildirimler (the menu now names the newest
# köşk, which here is the other one he just left: MENU-2), goes back to Ana sayfa and follows the entry Dersler.
main:
  given: { opensAt: wide, who: koskMany, unread: none, waiting: some }
  events: [DONE, OPEN_PICKER, ESCAPE, OPEN_PICKER, CHOOSE_KOSK, PICK_NOTIFICATIONS, PICK_HOME, PICK_PAGE]

initial: reading
states:
  reading:
    title: The roles are read
    description: >-
      The frame is drawn on the server, once for each request, by NizamShell. It asks tedrisat who the person is
      (GET /me/assignments and GET /me/roles together) and takes the variant from the answer: the realm role SYSTEM_ADMIN is
      the başnazım, else a MEDARIS_NAZIM assignment is a Medaris nazımı, else a KOSK_NAZIM assignment is a köşk nazımı, else
      none (the widest role wins). The session holds no roles. Then, for a person who has a menu, it reads the unread count
      (GET /notifications/unread-count, over the two ban types only), and for a köşk nazımı the köşks they manage
      (GET /kosks?managedBy=me, 50 at most, newest first) and, for each of them, the applications waiting there
      (GET /kosks/:id/enrollments/pending, every waiting applicant with name and e-mail, to count them: MENU-3). Each of those
      three reads that fails is left out without an error (a bell that says nothing beats a broken shell), so only the first
      has a branch here. A failed roles read gives the frame no menu and no bell, as for a person with no role. Nothing is on
      the screen: the loading skeleton is out of view.
    invoke: { action: getMyAssignments }
    on:
      DONE: classifying
      FAIL.unreadable: { target: menu_not_drawn, say: "the roles read failed: the frame is drawn with no menu and no bell, and \"/\" shows only \"Hoş geldiniz\" (F-P0-9; nizam.shell.landingByRole)", source: apps/nizam/features/assignments/reads.ts:31 }
    source: apps/nizam/components/shell/nizam-shell.tsx:63

  classifying:
    title: See whether the permissions matter
    description: Classification only. Only a Medaris nazımı's menu is cut by permissions, so only theirs reads GET /me/permissions.
    always:
      - { guard: isNazim, target: readingPermissions, say: "a Medaris nazımı: the menu is cut by what they hold", source: "apps/nizam/components/shell/nizam-shell.tsx:87" }
      - { target: arriving, say: "the başnazım's menu is never cut and a köşk nazımı's has no permissions", source: "apps/nizam/components/shell/nizam-shell.tsx:87" }
    source: apps/nizam/components/shell/nizam-shell.tsx:87

  readingPermissions:
    title: The permissions are read
    description: >-
      GET /me/permissions answers the codes the person holds in any scope. `filterByPermissions` keeps each entry whose
      permission list holds one of them and drops a group left with no entry. The two entries nobody can reach are cut like
      the others: Kalıcı yasak talepleri needs platform.ban_account (its page does not exist: F-P0-4), and the entries the
      map lists but the Medaris menu does not hold (appeals, audit-log, inactive, youtube, platform-settings, partners) are
      never in it, whatever the person holds (F-X-12). When the read fails the set is null and nothing is hidden.
    invoke: { action: getMyPermissions }
    on:
      DONE: arriving
      FAIL.unreadable: { target: arriving, effect: [permissionsUnknown], say: "the read failed: held is null and the whole Medaris menu is drawn", source: apps/nizam/lib/shell-nav.ts:317 }
    source: apps/nizam/components/shell/nizam-shell.tsx:88

  arriving:
    title: The page a person opens
    description: >-
      Classification only. Both frames are in the page and the style sheet shows one: the sidebar's <aside> is `max-md:hidden`
      and the bar is drawn below 768 px only. The page the walk opens is Ana sayfa: "/" for the başnazım and a Medaris nazımı,
      and for a köşk nazımı "/" redirects to the home of the köşk of their oldest role.
    always:
      - { guard: "opensAt == 'wide'", target: wide, source: apps/nizam/components/shell/shell-frame.tsx:187 }
      - { target: bar, source: apps/nizam/components/shell/shell-frame.tsx:201 }
    source: apps/nizam/components/shell/shell-frame.tsx:79

  wide:
    title: The sidebar
    by: human
    goal: true
    description: >-
      The sidebar is an <aside> (sticky, with no accessible name: MENU-5) holding, in order, the brand and the theme toggle, the
      köşk picker (a köşk nazımı only), the <nav aria-label="Ana menü"> and, at its foot, the person's row; beside it the page's
      own <main id="main">, which no skip link points at (F-UI-P0-1, F-X-9) and which takes no focus when the page opens. The
      brand, the person's row and the bell are plain <a>, so each is a full document load where the menu's own entries go
      through next/link (F-P0-8). The menu is the variant's. The başnazım: Genel (Ana sayfa, Bildirimler), Platform (Medreseler,
      Köşkler, Medaris nazımları, İzin grupları, Pasif kapsamlar), Talepler (Köşk başvuruları, Deste yayın istekleri, İtirazlar,
      Kalıcı yasak talepleri), Denetim (Yasaklamalar, Denetim kaydı, Arşiv) and Ayarlar (YouTube bağlantısı, Platform ayarları,
      Ortak uygulamalar): seventeen entries, two of which, Kalıcı yasak talepleri and YouTube bağlantısı, open "Sayfa bulunamadı"
      (F-P0-4, F-X-11). A Medaris nazımı: Genel and Platform (Medreseler, Köşkler) when the permissions are the stack's five, and
      with the five of the e2e also Talepler (Köşk başvuruları, Deste yayın istekleri, Kalıcı yasak talepleri) and Denetim
      (Yasaklamalar); no Medaris nazımları, İzin grupları, Pasif kapsamlar, İtirazlar, Denetim kaydı, Arşiv, YouTube bağlantısı,
      Platform ayarları and Ortak uygulamalar, whatever they hold (F-X-12). A köşk nazımı: Genel (Ana sayfa, Bildirimler), Köşk
      (Dersler, Başvurular, Ders talepleri, Köşk desteleri, Yasaklamalar, Arşiv) and Yönetim (İzinler, Köşk ayarları), each
      pointing at the köşk in scope; Celseler, Talebeler and Ders kayıtları, which the design draws, are left out until their
      pages exist (MDRS-211). The entry of the page is `aria-current="page"` (the longest address that matches), and the person's
      row shows the name and the role line (Medaris başnazımı, Medaris nazımı, Köşk nazımı) with ", Hesap" read after it. There
      is no "Çıkış yap" in the frame; it lives on Hesap. Bildirimler carries the unread number and Başvurular the pending number,
      each with a visually hidden word (okunmamış, bekleyen). The picker, for a köşk nazımı, shows the köşk in scope with
      "Köşk nazımı" beneath it, and is a button that opens a menu when they manage two köşks or more (MENU-1 for one). The köşk in
      scope is the köşk in the address when the person manages it, else the newest köşk of their list; "/" sends them to the köşk
      of their oldest role (MENU-2). Findings read here: F-P0-8, F-UI-P0-1, F-X-9, F-P0-4, F-X-11, F-X-12, MENU-1, MENU-2,
      MENU-3, MENU-5.
    on:
      OPEN_PICKER: { guard: pickerMenu, target: picking, say: "they press the picker's button", source: libs/ui/src/mds/scope-picker.tsx:60 }
      PICK_HOME: { target: wide, effect: [backHome], say: "Ana sayfa: the entry of the page is marked and, on Bildirimler, the home opens", source: apps/nizam/components/shell/shell-frame.tsx:126 }
      PICK_NOTIFICATIONS: { target: wide, effect: [onNotifications], say: "Bildirimler opens; its address names no köşk, so a köşk nazımı's menu now names the newest köşk (MENU-2)", source: apps/nizam/components/shell/shell-frame.tsx:126 }
      PICK_PAGE: { target: page_opened, say: "they follow another entry of the menu (Köşkler, or Dersler for a köşk nazımı); every entry is a link", source: apps/nizam/components/shell/shell-frame.tsx:126 }
      PICK_PERSON: { target: account_opened, say: "they follow the person's row to Hesap", source: apps/nizam/components/shell/shell-frame.tsx:159 }
      NAVIGATE: { target: left, say: "they follow a link of the page or leave" }
    source: apps/nizam/components/shell/shell-frame.tsx:187

  picking:
    title: The picker is opened
    by: human
    description: >-
      A Base UI Menu opens a popup next to the button. The popup is a menu named like its button (Base UI gives it
      aria-labelledby of the trigger: MenuRoot.js:429). It lists the köşks the person manages, each row an <a role="menuitem">,
      with the current köşk's row `aria-current="true"`; there is no heading and no note. Each row is a plain anchor, so choosing
      one is a whole page load and not a client navigation (MENU-4): on a köşk's home it opens that köşk's home
      (/kosks/<id>/ana-sayfa), anywhere else /kosks/<id>, which redirects a köşk nazımı to that köşk's Dersler. The popup does not
      make the page inert (Base UI leaves its focus manager non-modal for a plain menu: not seen here), so the sidebar stays in the
      accessibility tree. For the pointer the menu is modal all the same: Base UI lays a backdrop over the page with a hole for the
      button (MenuPositioner.js:242-256, `modal` defaults to true), so a press on the sidebar lands on the backdrop and only closes the
      popup, and a second press on the button closes it too. From the code, not seen in a browser.
    on:
      ESCAPE: { target: kept, say: "Esc closes the popup", source: libs/ui/src/mds/scope-picker.tsx:59 }
      OPEN_PICKER: { target: kept, say: "a second press on the button: the button is the hole in the backdrop, and its press toggles the popup shut", source: libs/ui/src/mds/scope-picker.tsx:60 }
      PICK_HOME: { target: kept, say: "a press on Ana sayfa lands on the menu's backdrop: the popup closes and the link is not followed", source: libs/ui/src/mds/scope-picker.tsx:59 }
      PICK_NOTIFICATIONS: { target: kept, say: "a press on Bildirimler lands on the backdrop: the popup closes, nothing opens", source: libs/ui/src/mds/scope-picker.tsx:59 }
      PICK_PAGE: { target: kept, say: "a press on another entry lands on the backdrop: the popup closes, nothing opens", source: libs/ui/src/mds/scope-picker.tsx:59 }
      PICK_PERSON: { target: kept, say: "a press on the person's row lands on the backdrop: the popup closes, Hesap does not open", source: libs/ui/src/mds/scope-picker.tsx:59 }
      CHOOSE_KOSK:
        - { guard: "place == 'notifications'", target: courses_opened, say: "on Bildirimler a row opens /kosks/<id>, which redirects to that köşk's Dersler", source: apps/nizam/components/shell/shell-frame.tsx:149 }
        - { guard: "scope == 'landing'", target: wide, effect: [toNewest], say: "on a köşk's home the other row opens that köşk's home, drawn in this frame again", source: apps/nizam/components/shell/shell-frame.tsx:149 }
        - { target: wide, effect: [toLanding], say: "the other row opens the other köşk's home", source: apps/nizam/components/shell/shell-frame.tsx:149 }
      NAVIGATE: { target: left, say: "they leave" }
    source: libs/ui/src/mds/scope-picker.tsx:59

  kept:
    title: The picker is closed again
    by: human
    description: >-
      The popup went away on Esc and Base UI returns the focus to the trigger (Base UI's menu; not seen here). The frame is the
      sidebar's, whatever the focus.
    on:
      OPEN_PICKER: { guard: pickerMenu, target: picking, say: "they press the button again", source: libs/ui/src/mds/scope-picker.tsx:60 }
      PICK_HOME: { target: wide, effect: [backHome], say: "Ana sayfa", source: apps/nizam/components/shell/shell-frame.tsx:126 }
      PICK_NOTIFICATIONS: { target: wide, effect: [onNotifications], say: "Bildirimler opens, and the menu names the newest köşk (MENU-2)", source: apps/nizam/components/shell/shell-frame.tsx:126 }
      PICK_PAGE: { target: page_opened, say: "they follow another entry of the menu", source: apps/nizam/components/shell/shell-frame.tsx:126 }
      PICK_PERSON: { target: account_opened, say: "they follow the person's row", source: apps/nizam/components/shell/shell-frame.tsx:159 }
      NAVIGATE: { target: left, say: "they leave" }
    source: libs/ui/src/mds/scope-picker.tsx:60

  bar:
    title: The phone's bar
    by: human
    goal: true
    description: >-
      Below 768 px the sidebar is hidden and a 56 px <header> is drawn: a "Menü" button (an icon named by its aria-label), the
      brand, the page's name in a <p> (the label of the active entry, else "Nizam": "Ana sayfa" or "Bildirimler" here), the theme
      toggle and the bell. The bell is a plain <a> named "Bildirimler", or "Bildirimler, {count} okunmamış" while something is
      unread, and shows no number of its own; it is drawn for every variant that has a menu (F-P0-8: a full document load). The
      page's <main> sits under the bar and takes no focus. The menu is not in the page for a reader and the sheet is not mounted
      until the button is pressed.
    on:
      OPEN_SHEET: { target: sheet, say: "they press Menü", source: libs/ui/src/mds/app-bar.tsx:64 }
      PICK_NOTIFICATIONS: { target: bar, effect: [onNotifications], say: "the bell opens Bildirimler, drawn in this frame again; its address names no köşk (MENU-2)", source: apps/nizam/components/shell/shell-frame.tsx:213 }
      NAVIGATE: { target: left, say: "they follow a link of the page or leave" }
    source: libs/ui/src/mds/app-bar.tsx:63

  sheet:
    title: The sheet holds the menu
    by: human
    description: >-
      A Base UI dialog named "Ana menü", the same words as the <nav> inside it (MENU-5), over a scrim; the page behind it is
      inert. It holds, in order, a head with the brand and "Kapat", the köşk picker (a köşk nazımı), the <nav> with the same
      groups and entries as the sidebar, and at its foot the person's row. It has no "Çıkış yap". Base UI focuses the first
      tabbable element of the popup, which is the brand link of the head and not "Kapat" (the e2e asserts only that the focus is
      inside the head: shell#8). Esc and "Kapat" close it and give the focus back to "Menü". A plain click on any link inside
      the nav closes it (a modified click, which opens a new tab, does not) and the next page opens beneath: a client
      navigation, because the menu's entries go through next/link. Widening the window to 768 px closes it too (a media-query
      listener). The picker's popup opens above the sheet.
    on:
      CLOSE_SHEET: { target: bar, say: "they press Kapat", source: libs/ui/src/mds/app-bar.tsx:82 }
      ESCAPE: { target: bar, say: "Esc closes the sheet", source: libs/ui/src/mds/app-bar.tsx:62 }
      OPEN_PICKER: { guard: pickerMenu, target: sheetPicking, say: "they press the picker's button inside the sheet", source: libs/ui/src/mds/scope-picker.tsx:60 }
      PICK_PAGE: { target: page_opened, say: "they follow an entry of the menu: the sheet closes and the page opens", source: libs/ui/src/mds/app-bar.tsx:92 }
      PICK_HOME: { target: home_opened, say: "Ana sayfa, in the sheet: the sheet closes and the page opens", source: libs/ui/src/mds/app-bar.tsx:92 }
      PICK_NOTIFICATIONS: { target: notifications_opened, say: "Bildirimler, in the sheet: the sheet closes and the page opens", source: libs/ui/src/mds/app-bar.tsx:92 }
      PICK_PERSON: { target: account_opened, say: "the person's row leads to Hesap", source: apps/nizam/components/shell/shell-frame.tsx:159 }
      WIDEN: { target: wide, say: "the window passes 768 px: the sheet closes and the sidebar shows (not walked: no action resizes the window)", source: libs/ui/src/mds/app-bar.tsx:50 }
      NAVIGATE: { target: left, say: "they leave" }
    source: libs/ui/src/mds/app-bar.tsx:78

  sheetPicking:
    title: The picker is opened inside the sheet
    by: human
    description: >-
      The same popup as the sidebar's, opened over the sheet. Esc closes the popup only and leaves the sheet open. Choosing a
      row loads a page and the sheet is gone with the old page, so the step is drawn as leaving for the new page and not as a
      return to the bar: a return would claim that the focus is on "Menü", and a whole page load leaves it on the document's
      start.
    on:
      ESCAPE: { target: sheet, say: "Esc closes the popup only", source: libs/ui/src/mds/scope-picker.tsx:59 }
      CLOSE_SHEET: { target: sheet, say: "a press on Kapat lands on the menu's backdrop: the popup closes and the sheet stays", source: libs/ui/src/mds/scope-picker.tsx:59 }
      OPEN_PICKER: { target: sheet, say: "a second press on the button closes the popup; the sheet stays", source: libs/ui/src/mds/scope-picker.tsx:60 }
      PICK_HOME: { target: sheet, say: "a press on Ana sayfa lands on the backdrop: the popup closes, the sheet stays, nothing opens", source: libs/ui/src/mds/scope-picker.tsx:59 }
      PICK_NOTIFICATIONS: { target: sheet, say: "a press on Bildirimler lands on the backdrop: the popup closes, the sheet stays", source: libs/ui/src/mds/scope-picker.tsx:59 }
      PICK_PAGE: { target: sheet, say: "a press on another entry lands on the backdrop: the popup closes, the sheet stays", source: libs/ui/src/mds/scope-picker.tsx:59 }
      PICK_PERSON: { target: sheet, say: "a press on the person's row lands on the backdrop: the popup closes, the sheet stays", source: libs/ui/src/mds/scope-picker.tsx:59 }
      CHOOSE_KOSK:
        - { guard: "place == 'notifications'", target: courses_opened, say: "a row opens /kosks/<id>, which redirects to that köşk's Dersler", source: apps/nizam/components/shell/shell-frame.tsx:149 }
        - { target: kosk_home_opened, say: "a row opens that köşk's home", source: apps/nizam/components/shell/shell-frame.tsx:149 }
      NAVIGATE: { target: left, say: "they leave" }
    source: libs/ui/src/mds/scope-picker.tsx:66

  menu_not_drawn:
    title: The frame is drawn with no menu
    description: "The roles could not be read: the frame has the brand and the person's row and no menu, no bell and no picker, as for a person with no role; \"/\" shows only \"Hoş geldiniz\" (F-P0-9). nizam.shell.landingByRole draws it."
    type: final

  page_opened:
    title: An entry of the menu opens its page
    description: "Köşkler, Dersler and the rest: each page is another flow's and draws this frame again; the menu is the same."
    type: final
    leavesPage: true

  courses_opened:
    title: A köşk is chosen from a page that names none
    description: "/kosks/<id> redirects a köşk nazımı to that köşk's Dersler (nizam.courses.list); the frame is drawn again there."
    type: final
    leavesPage: true

  kosk_home_opened:
    title: A köşk's home opens
    description: "/kosks/<id>/ana-sayfa: the köşk's home, drawn in this frame again (nizam.home.koskNazimLanding)."
    type: final
    leavesPage: true

  home_opened:
    title: Ana sayfa opens from the sheet
    description: "The Medaris home or the köşk's home, with this frame drawn again. The sheet closed with the click."
    type: final
    leavesPage: true

  notifications_opened:
    title: Bildirimler opens from the sheet
    description: "/bildirimler (nizam.notifications.triage draws the page), with this frame drawn again. The bell of the bar does the same without the sheet and stays in `bar`."
    type: final
    leavesPage: true

  account_opened:
    title: The person's row opens Hesap
    description: "/hesap, drawn in this frame again (nizam.account.settings)."
    type: final
    leavesPage: true

  left:
    title: They leave the page
    type: final
    leavesPage: true

assertions:
  - id: the-picker-opens-only-for-several-kosks
    never: "(state == 'picking' or state == 'sheetPicking') and not pickerMenu"
    say: The picker is a control only for a köşk nazımı of two köşks or more; with one köşk it is a plain label that cannot be opened.
    source: libs/ui/src/mds/scope-picker.tsx:55
  - id: a-cut-menu-is-never-the-whole-menu
    never: "framed and who == 'nazimCut' and held == 'read' and widerMenu"
    say: A Medaris nazımı whose permissions were read and who holds only some of them never gets Talepler or Denetim; the whole Medaris menu is drawn only when the permissions allow it or could not be read.
    source: apps/nizam/lib/shell-nav.ts:313
  - id: the-fallback-kosk-is-the-newest
    never: "framed and place == 'notifications' and scope == 'landing' and who == 'koskMany'"
    say: On a page whose address names no köşk the menu of a nazım of two köşks never names the köşk "/" opened, only the newest (MENU-2).
    source: apps/nizam/lib/shell-nav.ts:372
