schema: delurio-graph/0
kind: needs
id: nizam.shell.noAccessAndNotFound
status: proposed
summary: >-
  What must exist for a person of nizam-web to open something that is not theirs or not there and find their way back: the flow's
  product list. No replay has run: a `replay:` entry is named only once a scenario has passed, so none is named here, and an e2e
  check is the only evidence of a walk. An e2e check that cannot pass as written is not named as a walk (F-X-20): assignments#4
  and #6 end with an address regex that wants the /tr segment MDRS-248 removed.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# missing (no code): the-kalici-yasak-entry-opens-a-page (MDRS-140), the-youtube-entry-opens-a-page (MDRS-195),
# a-refusal-and-a-missing-page-are-announced-and-focused, a-refusal-is-served-as-a-refusal, a-face-names-its-tab,
# a-refusal-names-whom-to-ask-only-to-someone-who-can-ask
# unwalked (code, no e2e and no replay that passes): a-refusal-shows-the-account-and-the-way-back,
# a-refusal-names-the-chief-or-says-so-in-general, a-refusal-reads-without-a-name, an-address-no-page-owns-says-so,
# a-menu-person-keeps-the-shell-around-the-face

needs:
  - id: a-refusal-says-so
    need: >-
      A person who opens a page their account may not open is told so in plain words ("Bu bölüm için izniniz yok") and is shown
      none of the page's data, whatever their role: a köşk nazımı at a page of the başnazım, a Medaris nazımı at a page of the
      başnazım or of a permission they were not given, a person with no role at any page of a köşk.
    evidence:
      - state: noAccess
      - node: noAccessSection
      - node: noAccessTitle
      - source: apps/nizam/components/errors/no-access.tsx:19
      - source: apps/nizam/app/not-found.tsx:13
      - source: apps/nizam/app/forbidden.tsx:1
      - test: apps/nizam/e2e/bans-medaris.e2e.ts
        name: "nizam/48 — a signed-out visitor is sent to sign in and the köşk nazımı gets the no-access screen (criterion 6)"
      - test: apps/nizam/e2e/archive.e2e.ts
        name: "nizam/28 and 29 — a köşk nazım is refused the platform archive and another köşk's archive"
      - test: apps/nizam/e2e/deck-review.e2e.ts
        name: "nizam/16 — a köşk nazımı is shown the 'Bu bölüm için izniniz yok' screen"
      - test: apps/nizam/e2e/deck-review.e2e.ts
        name: "nizam/30 and 35 — a person who is no nazım gets the 'Bu bölüm için izniniz yok' screen (criteria 6)"
      - test: apps/nizam/e2e/permissions.e2e.ts
        name: "nizam/11 — a Medaris nazımı gets the 'izniniz yok' screen on both pages, not the list (criterion 4)"
      - test: apps/nizam/e2e/inactive.e2e.ts
        name: "nizam/14 — a köşk nazımı gets the 'izniniz yok' screen, not the list (criterion 5)"
      - test: apps/nizam/e2e/inactive.e2e.ts
        name: "nizam/14 — a Medaris nazımı without 'Pasif kapsamları yönet' gets that screen, one with it gets the list (criterion 5)"
      - test: apps/nizam/e2e/grants.e2e.ts
        name: "nizam/38 — a Medaris nazımı gets the 'izniniz yok' screen, not the list"
      - test: apps/nizam/e2e/bans.e2e.ts
        name: "nizam/42 — a signed-out visitor is sent to sign in, and the müderris of the course gets the no-access screen"
    note: |-
      Also drawn as the assertion a-refusal-is-not-a-missing-page.
      bans-medaris.e2e.ts bans-medaris#8 (a köşk nazımı at Yasaklamalar)
      archive.e2e.ts archive#6 (a köşk nazımı at Arşiv and at another köşk's Arşiv)
      deck-review.e2e.ts deck-review#5 (a köşk nazımı at Deste yayın istekleri), deck-review#10 (a person with no role at a köşk's
      Desteler)
      permissions.e2e.ts permissions#2 (a Medaris nazımı at Medaris nazımları and İzin grupları)
      inactive.e2e.ts inactive#4 (a köşk nazımı at Pasif kapsamlar), inactive#5 (a Medaris nazımı without the permission: the
      refusal half)
      grants.e2e.ts grants#2 (a Medaris nazımı at a köşk's İzinler)
      bans.e2e.ts bans#9 (a müderris at a köşk's Yasaklamalar)
      madrasahs#8 (a Medaris nazımı with no permission at Medreseler) builds that person with fixture.makeMedarisNazim; the seeded
      Medaris nazımı holds madrasah_create, so Medreseler opens for them and this flow's walks do not repeat the check
      (binding.medaris.yaml says so).

  - id: a-refusal-shows-the-account-and-the-way-back
    need: >-
      The refusal says which account the person is signed in with (a person on the wrong account sees why) and offers one way
      back, to the home page, which sends each person on by their roles; the frame of the app stays around it, so the menu and the
      person row still work.
    evidence:
      - state: noAccess
      - node: accountLabel
      - node: accountEmail
      - node: noAccessHome
      - state: home_opened
      - state: left
      - source: apps/nizam/components/errors/no-access.tsx:35
      - source: apps/nizam/components/shell/nizam-shell.tsx:51
    note: "unwalked: assignments#4 asserts the e-mail, the <aside> and the way back, and cannot pass (F-X-20)"

  - id: a-refusal-names-the-chief-or-says-so-in-general
    need: >-
      The refusal says that the permission is the Medaris başnazımı's to give and names them when the directory knows who that is;
      the name is read for any signed-in person (GET /nizam/chief-nazim answers every signed-in caller).
    evidence:
      - state: readingChief
      - node: noAccessBody
      - source: apps/tedrisat/src/assignment/nizam.controller.ts:26
      - source: apps/nizam/features/assignments/reads.ts:39
    note: "unwalked: the sentence was read from the served stream (\"... şu kişiden isteyin: <ad>.\"); no e2e checks it"

  - id: a-refusal-reads-without-a-name
    need: >-
      When the directory does not know the başnazım or does not answer, the refusal is still drawn, with a sentence that names
      nobody, and the person is not shown an error.
    evidence:
      - state: readingChief
      - node: noAccessBodyGeneric
      - source: apps/tedrisat/src/assignment/nizam.controller.ts:26
      - source: apps/nizam/features/assignments/reads.ts:39
    note: >-
      unwalked: the stack has the başnazım and the directory, and nothing here may take them away (binding.yaml, "Not bound")

  - id: a-foreign-and-a-missing-kosk-read-alike
    need: >-
      A köşk that is not the person's and one that is not there are one screen in the same words, so the page never tells which
      köşks exist; a page whose own read answers 403 or 404 gives that screen.
    evidence:
      - state: noAccess
      - source: apps/nizam/app/not-found.tsx:13
      - source: "apps/nizam/app/kosks/[id]/page.tsx:54"
      - test: apps/nizam/e2e/assignments.e2e.ts
        name: "a köşk id that does not exist shows the same screen"
      - test: apps/nizam/e2e/shell.e2e.ts
        name: "nizam/31 [seed] — another köşk's Başvurular is 'Bu bölüm için izniniz yok'"
      - test: apps/nizam/e2e/grants.e2e.ts
        name: "nizam/38 — a köşk that is not there looks the same"
    note: |-
      Also drawn as the assertion a-foreign-and-a-missing-kosk-read-alike.
      assignments.e2e.ts assignments#5 (an id no köşk has, and one that is no uuid)
      shell.e2e.ts shell#6 (another köşk's Başvurular)
      grants.e2e.ts grants#3 (a köşk that is not there)

  - id: a-person-without-a-role-is-refused-at-the-door
    need: >-
      A person who holds no nazım role and opens a page of a köşk is turned away before any page reads for them, with the same
      refusal; a person whose roles cannot be read is let through to the API's own refusal.
    evidence:
      - state: opening
      - state: noAccess
      - source: apps/nizam/app/kosks/layout.tsx:20
      - test: apps/nizam/e2e/deck-review.e2e.ts
        name: "nizam/30 and 35 — a person who is no nazım gets the 'Bu bölüm için izniniz yok' screen (criteria 6)"
      - test: apps/nizam/e2e/bans.e2e.ts
        name: "nizam/42 — a signed-out visitor is sent to sign in, and the müderris of the course gets the no-access screen"

  - id: an-address-no-page-owns-says-so
    need: >-
      An address no page owns, at any depth and for anyone signed in, says "Sayfa bulunamadı" with a way home, inside the frame of
      the app, and is never worded as a refusal (nobody can give a permission for a page that does not exist).
    evidence:
      - state: notFound
      - node: notFoundSection
      - node: notFoundBody
      - node: notFoundHome
      - source: "apps/nizam/app/[...rest]/page.tsx:8"
      - source: "apps/nizam/app/[...rest]/not-found.tsx:12"
      - source: apps/nizam/components/errors/page-not-found.tsx:14
    note: |-
      Also drawn as the assertion an-unknown-address-is-not-a-refusal.
      unwalked: assignments#6 asserts it and cannot pass (F-X-20)

  - id: a-menu-person-keeps-the-shell-around-the-face
    need: >-
      Both faces are drawn inside the app's frame (the sidebar and its menu), so the person can leave by the menu at once; the
      frame of a person with no menu is the brand and the person row.
    evidence:
      - node: shellSidebar
      - node: shellMain
      - source: apps/nizam/app/layout.tsx:54
      - source: libs/ui/src/mds/app-shell.tsx:81
    note: "unwalked: assignments#4 and #6 assert the <aside>, and cannot pass (F-X-20)"

  - id: the-kalici-yasak-entry-opens-a-page
    need: >-
      "Kalıcı yasak talepleri", which the başnazım's menu (and that of a Medaris nazımı holding the permission to ban an account)
      offers, opens the page where a permanent-ban request is decided, or the entry is not offered (F-P0-4, F-X-11, decision D2).
    missing: MDRS-140; findings F-P0-4, F-X-11
    note: >-
      Drawn on the state notFound and on the node notFoundBody, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: the-youtube-entry-opens-a-page
    need: >-
      "YouTube bağlantısı", which the başnazım's menu offers, opens the page where the platform's YouTube connection is set, or
      the entry is not offered (F-P0-4, F-X-11, decision D2).
    missing: MDRS-195; findings F-P0-4, F-X-11
    note: >-
      Drawn on the state notFound and on the node notFoundBody, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-refusal-and-a-missing-page-are-announced-and-focused
    need: >-
      A face that replaces what the person was reading is announced to a screen reader and gives the focus a place to be, by
      role="alert" or by focusing its heading, as /yetki-yok already does (NOACC-1).
    missing: no Linear issue; findings NOACC-1
    note: >-
      Drawn on the states noAccess and notFound, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).

  - id: a-refusal-is-served-as-a-refusal
    need: >-
      A refusal answers HTTP 403 and an address no page owns 404, whether or not the page has a loading skeleton, and neither is
      left to a noindex tag on a 200 (NOACC-2).
    missing: no Linear issue; findings NOACC-2
    note: >-
      Drawn on the states noAccess and notFound, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).

  - id: a-face-names-its-tab
    need: >-
      The tab names the face: "Bu bölüm için izniniz yok" for a refusal and "Sayfa bulunamadı" for a missing page, never the title
      of the page that refused, and never just "Nizam" (NOACC-3, WCAG 2.4.2).
    missing: no Linear issue; findings NOACC-3
    note: >-
      Drawn on the states noAccess and notFound, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).

  - id: a-refusal-names-whom-to-ask-only-to-someone-who-can-ask
    need: >-
      The refusal names the başnazım to a person who holds a management role and is therefore told whom to ask; a person with no
      role is told the app is not theirs, in the words of /yetki-yok, instead of being sent to ask a named person for a permission
      (decision D1).
    missing: no Linear issue
    note: >-
      Drawn on the node noAccessBody, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).
