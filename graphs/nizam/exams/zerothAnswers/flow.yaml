# Medaris management reads, in nizam-web, how the zeroth question of the online exams was answered, in aggregate: never one
# talebe's answer. PLANNED, NOT BUILT (MDRS-299, Backlog). Written needs-first on 21 November 2026 from the owner's rules and answers
# for online exams; the screens are drawn now (ui.yaml) and the API is sketched in domain/planned-exams.yaml. There is no code and no
# route: `status: proposed`, no state names code, and nothing here can be walked. An online exam is a LessonExam of the third format,
# MULTIPLE_CHOICE, shown as "Çoktan seçmeli" (the domain's header says why it is not called ONLINE).
#
# The owner's rule (21 Nov 2026): "'sıfırıncı soru' olacak, 'bizi aldatan bizden değildir' hadisi hakkında soru olacak her sınavda bu
# sıfırıncı soruda. mesela bu dönem 'bu hadisi ne zaman öğrendiniz' sorusu olacak, diğer dönem 'ne zaman ezberlersiniz' diye
# sorulacak. doğru yanlış cevabı olan bi soru değil." Asked who reads the answers: "Yönetim toplu, ekip talebe bazında". Each exam's
# preparer writes its zeroth question (nazar.exams.edit), so the questions differ from exam to exam; the course team reads its own
# talebe's answers in nazar.exams.results.
#
# Decided by the owner on 21 Nov 2026: a köşk nazımı reads the same page for the exams of their own köşk, and a count under five is
# shown as "5'ten az" ("Köşk nazımı kendi köşkünü").
#
# Drawn here, and not decided by the owner: the page is a page of its own in nizam, reached from the menu by a person who holds the
# proposed code exam.zeroth_read (the başnazım, a Medaris nazımı by grant, a köşk nazımı in their köşk); the span of dates is the last
# 90 days when the page opens; a köşk nazımı's köşk field holds their köşk and nothing else (ui.yaml rules).
schema: delurio-graph/0
kind: flow
id: nizam.exams.zerothAnswers
status: proposed
domain: medaris.api
ui: nizam.exams.zerothAnswers
title: Read how the zeroth question was answered, across exams
summary: >-
  The Medaris başnazımı, a Medaris nazımı who holds the grant, or a köşk nazımı for their own köşk, opens the zeroth question's
  page in nizam. It lists the zeroth questions of the online exams, with exams that asked the same words counted together, and for
  each how many talebe answered and how many chose each option. It filters by a span of dates, by köşk, by medrese and by course. No
  talebe's name and no single answer is shown, and a count under five is shown as "5'ten az".
scope:
  shows: one page of nizam-web
  world: open
  outOfView:
    - "the course team's view of its own talebe's answers, by name: nazar.exams.results"
    - "the menu of nizam, where the page's entry would sit: nizam.nav (captured from the code; the entry is planned and not drawn there)"
    - "a read that fails outright and an ended session (the page then says it could not be read, or sends the person to sign in: realm.auth.signIn)"
context:
  answers:
    values: [none, some]
    initial: any
    say:
      none: no zeroth question has been answered in the span chosen
      some: answers are counted
  toast:
    values: [none, gone]
    initial: none
    say:
      none: no toast
      gone: the toast says no exam in the span asks that question any more
effects:
  refilter: { havoc: [answers], set: { toast: none } }
  clearToast: { set: { toast: none } }
  toastGone: { set: { toast: gone } }
failures:
  opening:
    from: listZerothAnswerCounts
    forbidden: [AUTHZ_FORBIDDEN]
  questionReading:
    from: getZerothQuestionExams
    forbidden: [AUTHZ_FORBIDDEN]
    gone: [ZEROTH_QUESTION_NOT_FOUND]
main:
  given: { answers: some }
  events: [DONE, FILTER, DONE, OPEN, DONE]
initial: opening
states:
  opening:
    title: The page is opened
    description: >-
      The action listZerothAnswerCounts, GET /platform/exam-zeroth-answers, with the span and the place chosen (the last 90 days and
      every place the person may read, when the page opens): the zeroth questions, the same words counted together, each with how
      many exams asked it, how many talebe answered and how many chose each option, a count under five sent as "fewer than five". The
      read is audited. A person who holds exam.zeroth_read neither in the platform scope nor in a köşk is refused.
    invoke: { action: listZerothAnswerCounts }
    on:
      DONE: loaded
      FAIL.forbidden: forbidden
  loaded:
    title: The page is drawn as the read says
    description: A step with no screen of its own.
    always:
      - { guard: "answers == 'none'", target: empty, say: "no answer in the span" }
      - { target: listed, say: "answers are counted" }
  forbidden:
    title: Not allowed
    description: >-
      The page is not in the menu for this person, and opened by its address it shows the shell's own refusal, "Bu bölüm için izniniz
      yok"; the API refuses the counts.
    by: human
    on:
      GO_HOME: { target: home_opened, say: "'Ana sayfaya dön' goes to '/'" }
      NAVIGATE: left
  listed:
    title: The zeroth questions and their answers
    description: >-
      Each zeroth question, the same words of several exams counted together, with how many exams asked it, how many talebe answered,
      and how many chose each option, as a number and a percentage; a count under five reads "5'ten az" and its percentage is not
      shown.
    by: human
    goal: true
    on:
      FILTER: { target: opening, effect: [refilter], say: "they filter by dates, köşk, medrese or course: the counts are read again" }
      OPEN: { target: questionReading, effect: [clearToast], say: "they open a question" }
      NAVIGATE: left
  questionReading:
    title: Read one question's exams
    description: >-
      The action getZerothQuestionExams, GET /platform/exam-zeroth-answers/{questionKey}, in the same span and place: the exams that
      asked it, each with its counts, and the counts over them all. The read is audited.
    invoke: { action: getZerothQuestionExams }
    on:
      DONE: questionDetail
      FAIL.forbidden: forbidden
      FAIL.gone: { target: listed, effect: [toastGone], say: "no exam in the span asks it any more: a toast says so and the list stays as it was" }
  questionDetail:
    title: A zeroth question
    description: >-
      The exams that asked it, each with its course, its köşk and its date and the counts of its options, and the counts over them
      all; a count under five reads "5'ten az" here too.
    by: human
    on:
      BACK: listed
      NAVIGATE: left
  empty:
    title: No answer yet
    description: The page says no zeroth question has been answered in the span chosen.
    by: human
    on:
      FILTER: { target: opening, effect: [refilter], say: "they choose another span" }
      NAVIGATE: left
  home_opened:
    title: The home page is opened
    description: nizam's home page.
    type: final
  left:
    title: The person left the page
    type: final
    leavesPage: true
