rules:
  - { id: EXM-ZER-1, rule: "Every question of the list is a <section aria-labelledby> (zeroth-answers-view.tsx:266-269), so each is a region landmark named by its words: a screen reader's list of landmarks holds one per question, beside the page's own. Fix: an <article>, or no label on the section. Read from the code, not seen." }
  - { id: EXM-ZER-2, rule: "'Uygula' with a start after the end reads nothing and shows 'Başlangıç, bitişten sonra olamaz.' under Bitiş (zeroth-answers-view.tsx:116-121, :135-138); the error is the Field's description of the date input (libs/ui/src/mds/field.tsx:50-52), no live region, and the focus stays on Uygula, so a screen-reader user hears nothing happen. Fix: move the focus to the field, or announce the error. Read from the code, not seen." }
  - { id: EXM-ZER-focus, rule: "No code moves the focus (no focus() or autoFocus in features/zeroth-answers): after 'Sınavlar' and 'Sorulara dön' the page is drawn anew under a new address, and where the focus goes was not seen." }
  - { id: never-traced, rule: "No name, no user id and no single answer is on this page or in its reads (invariant zeroth-answers-never-traced). Every count is exact, 1 to 4 included: the owner, 22 Nov 2026, \"ben böyle bi karar vermedim, saçma bu zaten neden gizleyeyim tabi ki görünecek\" (#427)." }
  - { id: kosk-nazim-scope, rule: "On a köşk nazımı's page the köşk field holds their köşk alone and is disabled, every read sends that köşk (zeroth-answers-view.tsx:150-156, present.ts:90), and the medrese and course fields list what the counts name there. Platform management's page offers 'Bütün köşkler' first." }
  - { id: default-span, rule: "The page opens on the last 90 days (present.ts:13), each day from 00:00 to 23:59 at UTC+3 (present.ts:92-93). There is no term (dönem) in Medaris; a span of dates stands for one, as the owner's 'bu dönem ... diğer dönem' reads. The span, the place and the question opened stay in the page's address." }
  - { id: same-words-together, rule: "Two exams' zeroth questions are counted together when their words and their options are the same, letter for letter after spaces are trimmed; a question asked in other words, or with other options, is an item of its own. An item says in how many exams it was asked and opens them." }
  - { id: figures-as-text, rule: "Every count is said in numbers and words ('Bu derste: 97 talebe (%41)', the count alone when nobody answered); there is no bar. The exams' table has column headers and the course as each row's header, which a screen reader reads." }
  - { id: arabic-runs, rule: "The hadith is drawn as the talebe sees it, 'مَنْ غَشَّنَا فَلَيْسَ مِنَّا' with its meaning 'Bizi aldatan bizden değildir.' (the owner kept it as written: \"Böyle kalsın\", 22 Nov 2026), with lang=ar, dir=rtl and the Arabic class on its own element (zeroth-answers-view.tsx:105). A zeroth question or option the preparer wrote in Arabic is set with dir=auto only." }
  - { id: menu-entry, rule: "The page has its entry in nizam's menu, 'Sıfırıncı soru cevapları', for the platform (apps/nizam/lib/shell-nav.ts:141-146) and for a köşk (:263-269), shown only to a person who holds exam.zeroth_read (:321, filterByPermissions); nizam.nav draws the menu." }
