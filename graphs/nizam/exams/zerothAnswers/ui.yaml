# The screens of nizam.exams.zerothAnswers: "Sıfırıncı soru cevapları" in nizam-web, platform management's page
# (app/sifirinci-soru-cevaplari/page.tsx) and a köşk nazımı's (app/kosks/[id]/sifirinci-soru-cevaplari/page.tsx), both drawn by
# features/zeroth-answers/components/zeroth-answers-page.tsx on the server and zeroth-answers-view.tsx in the browser: the filters, the
# questions with their counts, one question's exams, and the shell's refusal. Every count is a number, with its percentage; nothing is
# hidden (the owner, 22 Nov 2026). The shell around the page (its menu, its bar) is nizam.nav's and nizam.shell's.
#
# Words: every `ZerothAnswersPage.*` and `NoAccess.*` key is copied from libs/i18n/src/locales/tr/nizam.json (the app reads it as
# `nizam.<key>`); the key is the path inside the file. The hadith is a literal of the code (ZEROTH_HADITH, zeroth-answers-view.tsx:25).
# The `composed.ZerothAnswersPage.*` keys are NOT in any i18n file: they are values the API gives, shown alone:
#   composed.ZerothAnswersPage.question   a zeroth question's words, dir=auto                                   (zeroth-answers-view.tsx:275, :366)
#   composed.ZerothAnswersPage.course     an exam's course, the row header, a <bdi>                             (zeroth-answers-view.tsx:336)
#   composed.ZerothAnswersPage.kosk       an exam's köşk, a <bdi>                                               (zeroth-answers-view.tsx:338)
#   composed.ZerothAnswersPage.date       an exam's day, Intl in the person's zone ("28 Kas 2026")              (zeroth-answers-view.tsx:81-87)
#   composed.ZerothAnswersPage.answered   how many answered an exam's question                                   (zeroth-answers-view.tsx:344)
# Not drawn: the error under Bitiş when the span is reversed and "Uygula" is pressed (:135-138; rule EXM-ZER-2), the two alerts of a
# read that failed (:213-239; flow scope.outOfView), and the table's scroll region on a narrow screen (libs/ui/src/mds/table.tsx:90).
