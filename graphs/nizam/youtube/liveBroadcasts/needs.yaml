    drawn: [waiting, live, weak]
    missing: none

  - id: the-talebes-player-shows-the-state
    need: >-
      The talebe's celse page shows the same state in its player, from the session read (tedris.celse.watchStream), and not the host's page, which does not exist
      before the broadcast starts. Today the server never learns that a stream has ended and keeps the link for a clock window (YT-2).
    drawn: [live]
    missing: MDRS-239

  - id: monitor-preview
    need: >-
      Optional: the hoca's panel shows the monitor preview (contentDetails.streamDetails.monitorStreamEmbedHtml) before the encoder starts.
