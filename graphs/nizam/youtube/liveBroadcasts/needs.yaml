    drawn: [missedStart, badgeMissed, missedHelp, panelStateMissed]
    missing: MDRS-239

  - id: youtube-starts-and-stops-by-itself
    need: >-
      No transition call is made: with auto start and auto stop YouTube starts the broadcast when the encoder starts and ends it about a minute after it stops. A
      "test before going live" flow (a monitor stream and manual transitions) is out of scope unless asked.
    drawn: [waiting, live, ended, autoNote]
    missing: MDRS-239

  - id: one-worker-shared-by-all-lessons
    need: >-
      One worker polls YouTube about every 30 seconds for all the lessons due (many ids in one call, 1 unit each), never one poll per screen or per viewer.
    drawn: []
    missing: MDRS-239

  - id: polling-or-sse
    need: >-
