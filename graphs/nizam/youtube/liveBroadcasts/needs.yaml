# What must exist for the Medaris channel to be connected once and for a hoca to run her live celses through YouTube without opening YouTube Studio:
# the flow's product list, written from MDRS-195 and its children (MDRS-237, 238, 239, 240; 241 is optional), from the planned items P-24, P-25 and P-26,
# and from the open decisions of flow.yaml (LAYOUT.md section 7). Read by people for now: no checker runs on this file.
#
# Everything here is PLANNED. `built` names only what exists today (the menu entry, the permission code, the manual stream link, the recording that a
# hoca adds by hand, and the notification the talebe get once); `walked` names only an e2e that passes today. No replay is named: this flow has no
# binding ("not walkable: no code"). `drawn` is where this graph draws the need: a state, or a node of ui.yaml.
#
# For needs.gaps (written 16 Nov 2026; MDRS-237 is the owner's own work, no code):
#   missing  MDRS-237: owner-setup-is-done, legal-pages-name-youtube-api-services
#   missing  MDRS-238: menu-entry-opens-the-page, connect-the-channel, only-a-holder-connects, connection-status-and-reconnect, the-connect-failures-are-told,
#            the-token-is-kept-encrypted, course-choice-youtube, visibility-is-stated-explicitly, a-broadcast-per-celse, one-stream-per-hoca,
#            the-quota-is-guarded, reschedule-and-cancel-reach-the-broadcast, every-call-on-the-channel-is-audited, the-stream-key-panel,
#            the-key-is-masked-shown-and-copied, only-the-streams-people-see-the-key, the-key-is-never-stored-logged-or-sampled
#   missing  MDRS-239: follow-the-life-of-the-broadcast, states-in-plain-words, missed-start-warns, youtube-starts-and-stops-by-itself,
#            the-talebes-player-shows-the-state, one-worker-shared-by-all-lessons, monitor-preview (optional)
#   missing  MDRS-240: attach-the-recording-when-the-broadcast-ends, ready-only-when-youtube-has-processed, a-failed-archive-is-told,
#            the-recording-visibility-follows-the-course
#   missing  MDRS-241 (optional): live-chat-feed-in-medaris-ui
#   missing  MDRS-147 (research): live-lesson-in-tedris-with-timestamp-and-chat
#   missing  MDRS-204 (deferred): publish-to-the-medaris-channel
#   missing  none (an open decision of the owner, D1 to D15 of flow.yaml): open-where-the-hoca-runs-it, a-celse-with-none-can-be-given-one,
#            how-the-key-is-shown-is-decided, whose-stream-a-ders-nazir-uses, public-broadcast-under-the-platform-policy, the-manual-link-beside-a-broadcast,
#            which-notification-the-talebe-get, a-hocas-recording-is-kept, disconnect-the-channel, where-the-callback-lives, polling-or-sse,
#            paid-courses-answer-is-recorded, who-else-may-connect, when-youtube-does-not-answer, a-never-started-broadcast
#   unwalked none: every need that is built has an e2e
kind: needs
flow: nizam.youtube.liveBroadcasts
status: proposed

needs:
  # ===================== the menu entry and phase 0 =====================
  - id: menu-entry-exists
    need: >-
      The başnazım finds "YouTube bağlantısı" under Ayarlar in the nizam menu.
    drawn: [menu, menuLink]
    built:
      - route: apps/nizam/lib/shell-nav.ts:149
    walked:
      - e2e: apps/nizam/e2e/shell.e2e.ts
        check: 'shell#9 (the başnazım''s whole menu, "YouTube bağlantısı" among Ayarlar; test nizam/50, :351)'

  - id: menu-entry-opens-the-page
    need: >-
      The entry opens a page, "YouTube bağlantısı" at /ayarlar/youtube, and not "Sayfa bulunamadı" (F-P0-4, F-W3-10, F-X-11). The page tells whether a channel is
      connected, and which.
    drawn: [reading, notConnected, connected, reconnect, pageMain, pageTitle, pageIntro, channelRegion]
    missing: MDRS-238

  - id: owner-setup-is-done
    need: >-
      Phase 0, the owner's own work, is done before any of this works: a Google Cloud project with YouTube Data API v3, the OAuth app in production and verified
      for the sensitive scope youtube.force-ssl (testing mode lasts 7 days and takes 100 users), the web-application client with tedrisat's dev and prod callback
      URLs, a Brand Account channel verified by phone with live streaming enabled, and the client id, secret and API key in Coolify. Until then the connect
      button says so.
    drawn: [starting, problemNotConfigured]
    missing: MDRS-237

  - id: legal-pages-name-youtube-api-services
    need: >-
      The privacy notice says Medaris uses YouTube API Services, links Google's privacy policy, says how the data is used, links the revocation page and gives a
      contact; the terms link YouTube's Terms of Service (the Developer Policies, III.A). The notice itself is built (MDRS-102, done); these words are not.
    drawn: []
    missing: MDRS-237

  - id: paid-courses-answer-is-recorded
    need: >-
      The owner records whether any course will be paid: the Developer Policies forbid charging users to watch content in an embedded YouTube player, and the
      answer decides whether a paid course may turn the choice on (D12).
    drawn: [courseSetting]
    missing: none # an owner decision; MDRS-237 item 9 asks for it

  # ===================== phase 1: connect the channel =====================
  - id: connect-the-channel
    need: >-
      The başnazım connects the Medaris channel once, through Google's consent, as the channel's owner or a Brand Account manager; Medaris keeps a refresh token
      (access_type offline, scope youtube.force-ssl) and the page shows the channel and whether YouTube has opened live streaming on it. A channel connected by
      channel permission only is refused with a reason.
    drawn: [notConnected, starting, atGoogle, connecting, connected, connectButton, connectHelp, channelName, connectedBy, toastConnected]
    missing: MDRS-238

  - id: only-a-holder-connects
    need: >-
      Only the başnazım, or a Medaris nazımı who holds platform.youtube_manage, reads or changes the connection; everybody else is told they may not. The code is
      in the catalogue and no handler asks for it today (MDRS-208), so the new routes are its first check.
    drawn: [reading, refused, refusedTitle, refusedHome]
    missing: MDRS-238

  - id: who-else-may-connect
    need: >-
      Whether the menu entry is shown to a Medaris nazımı who holds the code, or the code is kept from being granted: today the entry is the başnazım's alone and
      a holder would find the page only by its address (D13).
    drawn: [menu, reading]
    missing: none

  - id: connection-status-and-reconnect
    need: >-
      The page shows the connection's status: connected, or lost because the token was revoked or has expired, with a "Yeniden bağla" alert, and no new broadcast
      is made until it is fixed.
    drawn: [connected, reconnect, revokedAlert, revokedText, reconnectButton, statusConnected, statusRevoked, liveReady, liveWaiting]
    missing: MDRS-238

  - id: the-connect-failures-are-told
    need: >-
      A connect that fails says why on the page: the environment is not set up, the permission was not given, the account owns no channel, or Google refused.
      Nothing is stored in any of these.
    drawn: [problemNotConfigured, problemDenied, problemNoChannel, problemFailed]
    missing: MDRS-238

  - id: the-token-is-kept-encrypted
    need: >-
      The refresh token is stored encrypted, goes to no client and into no log or audit row.
    drawn: []
    missing: MDRS-238

  - id: disconnect-the-channel
    need: >-
      Whether the başnazım can disconnect the channel (delete and revoke the token); the issues have connect and reconnect only, and the policies ask for a link to
      the revocation page (D9).
    drawn: [connected]
    missing: none

  - id: where-the-callback-lives
    need: >-
      Where Google's callback is served: tedrisat, as MDRS-237 registers it, with a one-time state bound to the caller; or nizam's web app, which holds the session
      cookie (D10).
    drawn: [starting, connecting]
    missing: none

  # ===================== phase 1: the course's choice and a broadcast per celse =====================
  - id: open-where-the-hoca-runs-it
    need: >-
      Where the hoca and the ders nazırı run it: nazar-web (the hoca's app, drawn) or nizam's course pages (as MDRS-238 names), or both on one API (D1).
    drawn: [courseSetting, noBroadcast, waiting, panel]
    missing: none

  - id: course-choice-youtube
    need: >-
      A hoca (or a ders nazırı who holds course.settings) turns "YouTube ile canlı yayın" on or off for a course, in Ders ayarları; from then on every live celse she
      plans or generates in a batch gets a broadcast. Nothing changes for the celses already planned.
    drawn: [courseSetting, savingSetting, broadcastCard, useSwitch, saveButton, toastSettingSaved, toastSettingNotConnected, toastSettingForbidden, toastSettingFailed]
    missing: MDRS-238

  - id: visibility-is-stated-explicitly
    need: >-
      The choice says whether the broadcast is "Liste dışı" or "Herkese açık", explicitly and never by default: YouTube's policy asks that visibility and the
      actions taken on the user's behalf are shown with the user's consent.
    drawn: [privacyGroup, privacyLegend, radioUnlisted, radioPublic, unlistedHelp, publicHelp]
    missing: MDRS-238

  - id: public-broadcast-under-the-platform-policy
    need: >-
      Whether "Herkese açık" is refused while the platform policy "Ders kayıtları herkese açılamaz" is on (it says no recording "YouTube’a yüklenemez"): drawn as
      refused, with the sentence Ders ayarları already has (D5; nothing reads that policy for recordings today, RECADD-1).
    drawn: [savingSetting, toastSettingPolicy]
    missing: none

  - id: a-broadcast-per-celse
    need: >-
      When a live celse of a course that uses YouTube is planned, or generated in a batch, Medaris makes its YouTube broadcast (the celse's title and time, the
      course's visibility, embed on, made-for-kids off so that the chat works, auto start and auto stop, DVR and record-from-start on), binds it to the hoca's
      stream and writes the celse's stream link from the broadcast id, so that the talebe's page and "Katılım" read it as they read a pasted link.
    drawn: [creating, waiting, attendanceStream, badgeWaiting]
    missing: MDRS-238

  - id: a-celse-with-none-can-be-given-one
    need: >-
      A celse that has no broadcast (planned before the choice, or one whose first try failed) says why and has "YouTube yayını oluştur" for a holder of
      session.live_link: the story's "a hoca creates a broadcast per celse". The issues say made at plan; the button is this graph's reading of the story (D2).
    drawn: [noBroadcast, noBroadcastBadge, whyNotReady, whyQuota, whyFailed, createButton]
    missing: none

  - id: one-stream-per-hoca
    need: >-
      Each hoca has one reusable YouTube stream (RTMP, a fixed resolution and frame rate), made on her first YouTube lesson and kept; two lessons at the same time
      need two streams, so the stream is the hoca's and not the course's. Rotating the key is deleting and recreating the stream.
    drawn: [creating]
    missing: MDRS-238

  - id: whose-stream-a-ders-nazir-uses
    need: >-
      Whose stream a celse uses when a ders nazırı plans it or presses the button, or a course has several hocas (D4).
    drawn: [creating, revealingKey]
    missing: none

  - id: the-quota-is-guarded
    need: >-
      The day's budget (10,000 units; about 100 for a broadcast and 180 for the polling of a lesson) is checked before a call, and before a whole course's batch;
      a call that would pass it is not made and the row says the quota is spent.
    drawn: [creating, whyQuota]
    missing: MDRS-238

  - id: reschedule-and-cancel-reach-the-broadcast
    need: >-
      When a celse's time changes its broadcast is updated with the whole part, and when the celse is cancelled its broadcast is deleted and its stream link
      cleared. If YouTube does not answer, the celse's own change stands and the row warns that the broadcast still has the old time or stays on the channel (D14).
    drawn: [rescheduling, removing, cancelled.removed, cancelled.left_on_youtube, toastStale]
    missing: MDRS-238

  - id: when-youtube-does-not-answer
    need: >-
      Which wins when YouTube does not answer a reschedule or a cancel, and whether a later pass puts the broadcast right (D14).
    drawn: [rescheduling, removing]
    missing: none

  - id: every-call-on-the-channel-is-audited
    need: >-
      Every call made on the channel's behalf (connect, a stream made, a broadcast made, moved or deleted, a key read, a recording attached) is written to the audit
      log with who caused it: the Developer Policies ask that such actions are clearly identified.
    drawn: [starting, creating, rescheduling, removing, revealingKey, ended]
    missing: MDRS-238

  # ===================== phase 1: the stream key panel =====================
  - id: the-stream-key-panel
    need: >-
      A holder of session.live_link opens "Yayın bilgileri" on a celse and finds the RTMPS address (with a copy button), the stream key, the OBS settings that
      match the stream's resolution and frame rate, and a line that YouTube starts and ends the broadcast when OBS starts and stops. There is no go-live from the
      browser: a hoca needs OBS or an RTMP(S) phone app.
    drawn: [panel, panelDialog, panelTitle, addressValue, copyAddress, obsHeading, obsValues, autoNote, keyWarning, detailsButton, panelClose]
    missing: MDRS-238

  - id: the-key-is-masked-shown-and-copied
    need: >-
      The key is masked in the panel; "Göster" reads it from YouTube and shows it, "Kopyala" copies it, closing the dialog masks it again, and a toast says it was
      copied without saying what it was. The key is never stored by Medaris.
    drawn: [panel, revealingKey, panelShown, keyMasked, keyValue, revealButton, hideButton, copyKey, toastCopiedKey, toastKeyFailed]
    missing: MDRS-238

  - id: how-the-key-is-shown-is-decided
    need: >-
      How exactly the key is shown: once, masked with copy (the issue's words), copy without showing, a timeout that masks it again, a "new key" button to replace a
      leaked one, and whether each read is audited (D3).
    drawn: [panel, panelShown]
    missing: none

  - id: only-the-streams-people-see-the-key
    need: >-
      Only the stream's hoca and the course staff who hold session.live_link see the address and the key; a person who holds session.manage alone sees the state of
      the broadcast and no "Yayın bilgileri". The API decides, and the key is in no list answer.
    drawn: [detailsButton, revealingKey]
    missing: MDRS-238

  - id: the-key-is-never-stored-logged-or-sampled
    need: >-
      The stream key is a credential: it is in no log line, no audit detail, no notification, no catalog and no sample, and the answer that carries it is not cached.
    drawn: [keyValue, toastCopiedKey]
    missing: MDRS-238

  # ===================== phase 2: follow the broadcast =====================
  - id: follow-the-life-of-the-broadcast
    need: >-
      Medaris follows each broadcast from about 15 minutes before its time until about 15 minutes after the celse ends, reading YouTube's lifecycle (created, ready,
      testing, liveStarting, live, complete, revoked) and the stream's health, and shows it on the celse's row.
    drawn: [waiting, live, weak, ended, missedStart, neverWent, badgeWaiting, badgeLive, badgeWeak, badgeEnded]
    missing: MDRS-239

  - id: states-in-plain-words
    need: >-
      The row says "Yayın bekleniyor", "Yayında", "Bağlantı zayıf" or "Bitti", and the stream's configuration issues in plain words.
    drawn: [badgeWaiting, badgeLive, badgeWeak, weakHelp, badgeEnded, panelStateWaiting, panelStateLive, panelStateWeak]
    missing: MDRS-239

  - id: missed-start-warns
    need: >-
