    drawn: [neverWent, live]
    missing: none

  # ===================== phase 3: the recording =====================
  - id: attach-the-recording-when-the-broadcast-ends
    need: >-
      When YouTube says the broadcast is complete, Medaris writes the celse's recording: provider YOUTUBE, the broadcast's watch link (the broadcast id is the
      video id), the broadcast's title, status PROCESSING. A celse holds one recording.
    drawn: [ended, archiving, recordingTitle, providerChip]
    missing: MDRS-240

  - id: ready-only-when-youtube-has-processed
    need: >-
      The recording is READY, with its length from the video, only when YouTube reports processingStatus succeeded (videos.list with the owner's token); until then
      the row says "Hazırlanıyor" and keeps the sentence that it plays when YouTube has archived the stream, and the talebe cannot watch it and are not told. This is
      the answer to RECADD-2 of nazar.recordings.add, where "Yayını kayıt olarak ekle" stores the link READY at once.
    drawn: [archiving, processingBadge, processingNote, recorded, readyBadge]
    missing: MDRS-240

  - id: the-talebe-are-told-once-when-ready
