      - action: medaris.api:createLessonRecording
    walked:
      - e2e: apps/tedrisat/test/e2e/recording-write.e2e.spec.ts
        check: 'RECORDING_ADDED: tells the enrolled talebe once when a pasted link is saved, and not again when it is edited or replaced (:1148)'

  - id: which-notification-the-talebe-get
    need: >-
