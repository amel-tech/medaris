  statusConnected: { type: text, component: Text, text: { key: planned.Youtube.status.connected }, in: [connected] }
  statusRevoked: { type: text, component: Text, text: { key: planned.Youtube.status.revoked }, in: [reconnect] }
  noneBody: { type: text, component: Text, text: { key: planned.Youtube.noneBody }, in: [notConnected] }
  channelName: { type: text, component: Text, text: { key: planned.Youtube.channelName, params: { channel: channel.title } }, in: [connected, reconnect] } # the channel's title as the API gives it, printed bare
  connectedBy: { type: text, component: Text, text: { key: planned.Youtube.connectedBy, params: { person: connection.by, at: connection.at } }, in: [connected, reconnect] }
  liveReady: { type: text, component: Text, text: { key: planned.Youtube.liveReady }, in: [connected], when: "link == 'ready'" }
  liveWaiting: { type: alert, component: Alert, role: status, text: { key: planned.Youtube.liveWaiting }, in: [connected], when: "link == 'waiting'" } # a neutral Alert is a status, as the kit draws it today
