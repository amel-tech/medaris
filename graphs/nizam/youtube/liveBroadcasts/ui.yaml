rules:
  - { id: F-P0-4, rule: "The menu entry 'YouTube bağlantısı' (apps/nizam/lib/shell-nav.ts:149) is drawn, for the başnazım, in the first state, and leads today to 'Sayfa bulunamadı': no folder under apps/nizam/app/ayarlar for it, and apps/nizam/app/[...rest]/page.tsx:9 answers notFound() inside the shell (F-P0-4, F-W3-10, F-X-11; nizam nav page `youtube`, kind missing). Fix: build the page this graph draws, or drop the entry until then." }
  - { id: no-source-on-planned-nodes, rule: "Nothing under 'nizam: the page /ayarlar/youtube', 'the card Canlı yayın', 'the dialog Yayın bilgileri', the badges of the row and 'archiveFailedAlert' exists in the code, so none carries a `source:`; every node that does is a screen or control that is there today (the menu entry, the shell's refusal, nazar's three pages and the buttons and badges named in their comments)." }
  - { id: focus-undecided, rule: "Planned: no page sets an initial focus, and the dialog is given the kit's default (the close icon, as nazar-web's other dialogs). Whether a dialog that holds a secret should open on 'Göster', and whether the focus should go to the key after it is shown, is for the review. returnsFocus to the button that opened the dialog is the dialog pattern's, not verified against the kit." }
  - { id: the-key-is-not-a-word, rule: "The stream key is a credential: it is not in the catalog, its sample says it is not a key, its field is dots until 'Göster', the toast that says it was copied never says what it was, and it is in no list answer (invariant youtube-stream-key-is-a-credential). The RTMPS address is not secret. Open: shown once, masked with copy, or copy without showing (D3)." }
  - { id: the-secret-field-is-text, rule: "The masked key is drawn as read-only text of dots and the revealed one as text: a password input has no ARIA role and a copy button beside it would have nothing to name. A reader that wants the key announced must press 'Göster'; a screen reader hears 'Yayın anahtarı' and dots, never the key until then. Proposal, for the review." }
  - { id: RECADD-2, rule: "nazar.recordings.add's RECADD-2 (the one-click 'Yayını kayıt olarak ekle' stores a link READY at once, so the row says 'Hazır' and the talebe are told 'Kayıt eklendi' before YouTube has archived the video) is answered here for a broadcast Medaris follows: the row is written PROCESSING when YouTube says the broadcast is complete ('Hazırlanıyor', and the existing note 'YouTube yayını arşivleyince kayıt olarak oynar.' stays on the row), becomes READY, and the talebe are told once, only when YouTube reports the video processed (assertions the-talebe-are-told-only-when-ready, ready-only-after-processing). The one-click button remains for a link the hoca gives (D8)." }
  - { id: YT-1, rule: "New. MDRS-195, MDRS-238 and MDRS-239 put the hoca's controls in nizam (the course's settings, the stream key panel, the state of the broadcast) and were written on 3 Oct 2026, before nazar-web existed; the people the story names, a müderris and a ders nazırı, work in nazar-web, where 'Canlı yayın ekle' (MDRS-228's manual link, built for nizam) and 'Yayını kayıt olarak ekle' already are. This graph draws nazar-web (D1); the API is the same for both apps. From the issues and the code, not a defect." }
  - { id: YT-2, rule: "New. Today the server never learns that a stream has ended: getSession sends the stream link from the scheduled start until a recording is open to talebe, and at most LIVE_STREAM_HOURS_AFTER_END = 24 hours after the scheduled end when none replaces it, a bound the code itself labels 'A PROPOSAL, NOT AN OWNER DECISION', because 'the owner decided that a lesson ends when its stream ends, which only each viewer's player learns' (apps/tedrisat/src/course/domain/recording.ts:200-207, MDRS-285). Phase 2 (MDRS-239) makes the server learn it from YouTube's lifecycle, which a broadcast Medaris follows can use in place of the clock window; for a manual link nothing changes. A decision for whoever builds phase 2; drawn only as the state on the row and in the player (need the-talebes-player-shows-the-state)." }
  - { id: YT-3, rule: "New, the same family as POL-7 of nizam.platform.policies. The menu entry 'YouTube bağlantısı' is the başnazım's alone (lib/shell-nav.ts:149; medarisGroups keeps none of the Ayarlar group) while nav-permissions lists youtube: ['platform.youtube_manage'] (lib/shell-nav.ts:303) and the code can be granted (invariant grantable-codes-are-asked-for, MDRS-208): a Medaris nazımı who is given it would reach the page only by its address, and today no handler asks for it. Fix with the page: show the entry to a holder, or keep the code undelegable (D13)." }
  - { id: sonner-region-english, rule: "The toasts here are the kit's own (nazar's Status and Alert dialogs, nizam's sonner); the English label of sonner's region and the missing role of its toast are the findings F-X-5 of nizam.platform.policies and are not repeated." }
