  problemNotConfigured: { type: alert, component: Alert, role: alert, text: { key: planned.Youtube.errors.notConfigured }, in: [notConnected, reconnect], when: "problem == 'notConfigured'" } # phase 0 (MDRS-237) is not done in this environment
  problemDenied: { type: alert, component: Alert, role: alert, text: { key: planned.Youtube.errors.denied }, in: [notConnected, reconnect], when: "problem == 'denied'" }
  problemNoChannel: { type: alert, component: Alert, role: alert, text: { key: planned.Youtube.errors.noChannel }, in: [notConnected, reconnect], when: "problem == 'noChannel'" }
  problemFailed: { type: alert, component: Alert, role: alert, text: { key: planned.Youtube.errors.failed }, in: [notConnected, reconnect], when: "problem == 'failed'" }

  toastConnected: { type: status, component: Status, text: { key: planned.Youtube.connected }, in: [connected], when: "toast == 'connected'" } # a sonner toast has no role of its own
  toastConnectedBody: { type: text, component: Text, text: { key: planned.Youtube.connectedBody, params: { channel: channel.title } }, in: [connected], when: "toast == 'connected'" }
  toastConnectedClose: { type: action, component: Button, role: button, intent: dismiss, name: { key: common.toast.close }, in: [connected], when: "toast == 'connected'", emits: CLOSE_TOAST }

  loadFailedAlert: { type: alert, component: Alert, role: alert, text: { key: planned.Youtube.loadFailedTitle }, in: [loadFailed] }
  loadFailedText: { type: text, component: Text, text: { key: planned.Youtube.loadFailed }, in: [loadFailed] }
  retryButton: { type: action, component: Button, role: button, intent: secondary, text: { key: planned.Youtube.retry }, in: [loadFailed], emits: RETRY }

