# The screens of nizam.youtube.liveBroadcasts, PLANNED: nothing here was seen in a browser, and most of it does not exist. `status: proposed`; a node
# carries a `source:` only where the screen or the control it draws is there today:
#   - the nizam sidebar's entry "YouTube bağlantısı" (lib/shell-nav.ts:149), which leads to a page that is not there;
#   - the shell's <main> and its section refusal (NoAccess), which the new page would show to a person who may not manage the connection;
#   - nazar-web's Ders ayarları (the page; its new card "Canlı yayın" is planned), Celseler (the page, its table, its Katılım cell "YouTube yayını")
#     and Ders kayıtları (the page, a row's title, chip, state badge and buttons).
# Everything else is the simplest reading of the issues MDRS-238, 239 and 240, and its words are `planned.*`.
#
# Words. Every key that is not `planned.*`, `composed.*` or `Changes.note` is copied from libs/i18n/src/locales/tr (nizam.json for Shell.items.youtube
# and NoAccess.*, nazar.json for the rest, common.json for common.toast.close), the key being the path under each file's root key; where nizam.json and
# nazar.json hold the same key they hold the same words, and NoAccess is taken from nizam.json. Two `composed.*` keys are the existing ones of
# nazar.recordings.add: composed.PlatformChip.youtube, composed.Recordings.recordingTitle. `Changes.note` is authored here, as in every flow that writes
# (the app has no sentence that tells a hoca what connecting a channel changes). The new words are in `planned.Youtube.*` (the nizam page) and
# `planned.Broadcast.*` (the hoca's side); the report lists each as FOR REVIEW. The stream key is never a word: its field is dots, and the one sample
# of it says it is not a key. The RTMPS address is not secret; its sample is an address that does not exist.
schema: delurio-graph/0
kind: ui
id: nizam.youtube.liveBroadcasts
flow: nizam.youtube.liveBroadcasts
status: proposed
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  channel: "Deneme Kanalı"
  person: "Deneme Başnazım"
  at: "16 Kas 14:30"
  name: "Deneme dersi"
  when: "17 Kas Sal 21:00"
  week: "1"
  title: "Celse 1 yayını"
  session: "Celse 1"
  address: "rtmps://ornek.test/live2"
  streamKey: "(örnek, gerçek anahtar değil)"
  resolution: "1080p"
  frameRate: "30 fps"

# Focus. Planned screens set none: no `initialFocus` on a page (the shell's <main> takes none), and the dialog gets the kit's default (the first
# tabbable element, the close icon), which is what every dialog of nazar-web does today; whether the first focus should be "Göster" is a question for the
# review (rule focus-undecided). The dialog hands the focus back to the button that opened it.
nodes:
  # ===================== nizam: the menu entry that exists =====================
  menuLink: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: Shell.items.youtube }, text: { key: Shell.items.youtube }, in: [menu], emits: OPEN_YOUTUBE, source: apps/nizam/lib/shell-nav.ts:149 } # the sidebar's entry under Ayarlar (the başnazım's menu); it opens /ayarlar/youtube, which today falls to the catch-all (apps/nizam/app/[...rest]/page.tsx:9) and "Sayfa bulunamadı" (F-P0-4)

  # ===================== nizam: the page /ayarlar/youtube (planned) =====================
  pageMain: { type: page, component: Page, role: main, in: [notConnected, reconnect, connected, loadFailed] } # the shell's one <main>; no name, no initialFocus (rule focus-undecided)
  pageTitle: { type: text, component: Heading, role: heading, text: { key: Shell.items.youtube }, in: [notConnected, reconnect, connected, loadFailed] } # h1; the menu's words, as the page of the policies repeats its entry's
  pageIntro: { type: text, component: Text, text: { key: planned.Youtube.intro }, in: [notConnected, reconnect, connected, loadFailed] }

