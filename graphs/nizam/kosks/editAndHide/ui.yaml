rules:
  - { id: no-default-accept, rule: "no page has initialFocus on an action with intent confirm: the hide confirmation starts on Vazgeç" }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3)" }
  - { id: focus-not-set, rule: "The settings page sets no initial focus: nothing in kosk-settings.tsx or page.tsx moves it on load, so a keyboard or screen-reader user starts from the top of the document and tabs through the whole sidebar first (F-UI-P0-1). Not drawn as an initialFocus, because the app gives none." }
  - { id: F-W3-3, rule: "kosk-settings.tsx:223-244, admin-present.ts:416-428, kosk.service.ts:235: a köşk nazımı can untick 'Kayıt her zaman onaylı' or 'Ders kayıtları herkese açılamaz' while the platform policy of the same name is on. The box accepts it, 'Kaydet' sends it, tedrisat answers 409 PLATFORM_POLICY_LOCKED, and koskErrorKey has no entry for the code, so the toast says 'Ayarlar kaydedilemedi' with 'Bir şeyler ters gitti. Biraz sonra yeniden deneyin.' and the person is told to try again. The catalog has 'Bu ayar platform politikasıyla kapalı.' (KoskApplicationsPage.errors.locked), unused here. A köşk whose own value is off while the platform's is on reads 'off' though the rule is in force. Fix: map the code to its own sentence, and draw a locked box ticked and disabled with the reason beside it. The başnazım is never refused (kosk.service.ts:235)." }
  - { id: F-W3-9, rule: "app/kosks/[id]/ayarlar/page.tsx:15-18: the tab and history title is 'Köşk ayarları' for every köşk, and the h1 is the same; only the intro paragraph and, on a wide screen, the scope picker name the köşk. A nazım of several köşks cannot tell two settings tabs apart. Fix: put the köşk's name in the title (generateMetadata reading the köşk) and in the h1 or an eyebrow." }
  - { id: F-W3-13, rule: "kosk-settings.tsx:67-72, 129-133: the form is noValidate; 'Kaydet' pressed with a wrong name or tags sets `sent` and draws the message in the Field's error slot, and the focus stays on 'Kaydet'. Field.Error has no role=alert and no live region (libs/ui/src/mds/field.tsx:30-62: F-UI-W3-1, F-X-2), so the message is read only if the person goes back to the field, and nothing says which field. Fix: focus the first invalid control after a refused submit, or an error summary with role=alert." }
  - { id: F-UI-W3-1, rule: "libs/ui/src/mds/field.tsx:30-62: Field's error element has no role=alert and no live region: 'Bir ad yazın.', 'Ad en az 2 karakter olmalı.' and the tags messages are announced only if the focus moves to the field" }
  - { id: F-X-2, rule: "the family of F-UI-W3-1 and F-W3-13 in every form of the app" }
  - { id: F-UI-W1-3, rule: "libs/ui/src/mds/button.tsx: a busy button's hidden status says 'Yükleniyor' from a hard-coded default (neither 'Kaydet' nor 'Gizle' passes loadingLabel), and the toast's close button says 'Kapat' from the kit, not from the catalog" }
  - { id: F-UI-W1-2, rule: "libs/ui/src/components/sonner.tsx: the Sonner host region is named in English ('Notifications') and the three toasts of this flow (saved, refused, hidden) are announced in it" }
  - { id: F-W3-edit-1, rule: "new: kosk-settings.tsx:259: after an accepted save the form is the saved köşk again, so `disabled={!dirty}` turns the pressed 'Kaydet' off while it has the focus; in a browser a focused control that becomes disabled loses keyboard focus or keeps it on a dead button (the same as F-W3-6; not verified). The only word that the save worked is a toast of 6 seconds. Fix: keep the button enabled and busy, or move the focus to the toast's heading or the h1 after a save." }
  - { id: F-W3-hide-1, rule: "new: hide-kosk-dialog.tsx:59-61: 'Vazgeç' and the close icon stay enabled while the köşk is being hidden and do nothing (`if (!saving) onOpenChange(next)`); only 'Gizle' is busy. The same as F-W3-open-2 in the opening form. Fix: disable them while the call runs, or let them cancel the call." }
  - { id: F-W3-hide-2, rule: "new: kosk-settings.tsx:289, hide-kosk-dialog.tsx:52-53: after 'Gizle' the dialog closes and the page goes to /kosks. The page, 'Köşkü gizle' (the element Base UI would give the focus back to) and the dialog are all gone, so the focus is on nothing (not verified), and the person is told in a toast of 6 seconds that is announced by Sonner's English-named region. The list is the unfiltered 'Tümü'; the hidden köşk is among the others, not first (D2). A köşk nazımı has no menu link to this list, so nothing else tells them it exists. Fix: go to /kosks?durum=gizli and put the focus on the list's heading." }
