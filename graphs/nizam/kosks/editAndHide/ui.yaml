# The screens of nizam.kosks.editAndHide: Köşk ayarları, Genel (/kosks/<id>/ayarlar), the "Köşkü gizle" alertdialog over it, and the
# Köşkler list (/kosks) the page lands on. Read from apps/nizam/features/kosks/components/{kosk-settings,hide-kosk-dialog,
# kosks-directory}.tsx on 15 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nizam.json (namespaces KoskSettings,
# HideKoskDialog, KoskDirectory). The one message that is not the app's is Changes.note, which no app message replaces: it says what
# saving and hiding change. A text the app builds in code would be `composed.*`; there is none here.
#
# The dialog is modal, so the page behind it is inert: the page nodes are not listed in `confirmHide` or `hiding`. The three toasts that
# stand over the page (saved, refused, hidden) are Sonner's (libs/ui/src/components/sonner.tsx), a title and a body each; a Sonner toast
# has no role of its own, so they are `status` nodes and the binding finds them by their text.
#
# What a name is on this page: the köşk's own name, which changes with a save. The graph draws "Ayar Deneme Köşkü" (the köşk the walk
# makes); where the page says the name after a rename (the intro, the toast, the dialog, the list row) the binding matches the words
# that do not change.
schema: delurio-graph/0
kind: ui
id: nizam.kosks.editAndHide
flow: nizam.kosks.editAndHide
status: captured
catalog: catalog/tr.json
locales: [tr]
