rules:
  - { id: F-W3-4, rule: "A Medaris nazımı who holds only platform.kosk_edit is given the view by koskEntry (kosk-entry.ts:51) and meets what only the başnazım can use: 'Köşk nazımı ekle' (kosk-manage-page.tsx:555, not gated) ends in an error toast 'Köşk nazımı eklenemedi: Bunu yapma izniniz yok.' because POST /kosks/:id/nazims asks platform.kosk_nazim_manage (kosk-admin.service.ts:117); the hosting section's read asks kosk.hosting or platform.hosting_grant and answers 403, which the page turns into rights = null, the box 'Bölüm yüklenemedi' with a 'Yeniden dene' that can never succeed (page.tsx:90, kosk-manage-page.tsx:589); and the link 'Barındırma hakları' next to it opens the page that refuses the same person (app/kosks/[id]/ayarlar/barindirma/page.tsx:40-45 reads the same rights; the nav graph's koskHosting opensFor needs kosk.hosting or platform.hosting_grant). kosk-abilities.ts:1-12 says no visible button should end in a 403. Fix: pass the held codes to KoskManagePage, draw only what the person can call, and say 'izniniz yok' for a section whose read answers 403, with no retry (decision D1)." }
  - { id: MANAGE-1, rule: "new: 'Arşiv’e git' (kosk-manage-page.tsx:542, href /arsiv) is drawn for everyone who has the view, but the platform archive is the başnazım's alone (app/arsiv/page.tsx:24, archive.controller.ts, SYSTEM_ADMIN only) and the sentence above it says so ('yalnız Medaris başnazımı görür'). A Medaris nazımı with platform.kosk_edit presses it and meets 'Bu bölüm için izniniz yok'. The nav graph (nizam.nav entry koskManage->archive) draws it for the chief only; the code does not. Fix: draw the link for the başnazım alone, as the sentence implies." }
  - { id: MANAGE-2, rule: "new: when the API says the köşk is already in the state the person asked for (409 KOSK_ALREADY_HIDDEN on 'Gizle', 409 KOSK_NOT_HIDDEN on 'Köşkü geri al'), the page says so in a toast and is not read again (hide-kosk-dialog.tsx:41-47 returns; kosk-manage-page.tsx:105-111 returns), so it goes on offering the action it was told is done, and the hide dialog stays open over it, until the person reloads. The Dersler table does read again after its own stale refusal (kosk-course-table.tsx:68). Fix: router.refresh() on those two codes and close the dialog (decision D2)." }
  - { id: MANAGE-3, rule: "new, from the code and not verified in a browser: after each of the four writes the button that was pressed is replaced or off when the focus is handed back, so it falls to the page: 'Köşkü gizle' becomes 'Köşkü geri al' (kosk-manage-page.tsx:483-522), 'Köşkü geri al' becomes 'Köşkü gizle', 'Köşkü pasife al' is natively disabled once the köşk is passive (:531), and a revoked right's 'Barındırma hakkını geri al' leaves with its row. The only word of what happened is a toast of a few seconds (success) and nothing moves the focus to it or to the changed row. Fix: move the focus to the page's h1 or to the replaced control's successor, and say the result in a status line that stays." }
  - { id: F-W3-9, rule: "The tab and history title is 'Köşk' for every köşk (app/kosks/[id]/page.tsx:34-37, KoskManage.title): a nazım of several köşks, or the başnazım with two tabs open, cannot tell them apart by the tab; only the h1 names the köşk. Fix: put the köşk's name in generateMetadata." }
  - { id: F-W3-1, rule: "'Ekle' (add-nazim-dialog.tsx:124) and 'Barındırma hakkını geri al' (revoke-dialog.tsx:111-115) are natively disabled until the form is valid and nothing says why. The messages written for a submit try ('En az bir köşk nazımı seçin.' of the picker) can never show, since a disabled default button blocks implicit submission. A keyboard or screen-reader user meets a dead button. Fix: keep the button enabled and say what is missing on submit, or tie the reason to the button with aria-describedby." }
  - { id: F-X-3, rule: "The family of F-W3-1: natively disabled submit buttons with no reason given, here in the add and revoke dialogs, and 'Köşkü pasife al' of a hidden or passive köşk (deactivateOff), whose reason ('only an active köşk') is not said anywhere." }
  - { id: F-W3-14, rule: "The nazım's address is looked up when the field is left, not only on Enter (nazim-picker.tsx:59, onBlur), and tedrisat writes every lookup to the audit log; the help text says searches are audited. Tabbing through the field makes audited lookups. Fix: search on Enter or an explicit 'Ara' button." }
  - { id: F-X-14, rule: "The family of F-W3-14: e-mail lookups on blur in the four pickers of nizam." }
  - { id: F-W2-3, rule: "The picker's field is disabled while it searches (nazim-picker.tsx:121), so the focused field loses the focus, and 'not found' is an error that is not a live region while nobody is chosen." }
  - { id: F-UI-W1-1, rule: "Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx), so a screen reader reads the intro and every field as the dialog's description when it opens; true of the add and revoke dialogs here, and of the alertdialog." }
  - { id: F-5, rule: "'Köşk sayfasını gör' (kosk-manage-page.tsx:367) is drawn for a hidden and a passive köşk too and opens tedris-web's page for it: GET /kosks/:id answers a hidden köşk to the başnazım and to a kosk_edit holder, so the page opens, and on it POST /kosks/:id/follow takes a follow of a hidden köşk and answers 201 (kosk.service.ts:276 checks that the köşk exists, not that it is shown; ledger/security.md F-5, tedris.discover.followKosk). The management view offers the way in; the fix is the API's." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Barındırma hakkını geri al' in 'Barındırma hakkını geri al: {medrese}', 'Köşk sayfasını gör' in 'Köşk sayfasını gör (yeni sekmede açılır)' (WCAG 2.5.3). Holds. The link that opens a new tab says so in its name (the opposite of ACC-08)." }
  - { id: heading-order, rule: "h1 (the köşk's name), h2 (Köşk bilgileri, Yönetim eylemleri, Köşk nazımları, Medreseler ve barındırma hakları, Dersler), h3 inside the actions (Geri al or Listelerden gizle, Pasife al, Kalıcı silme): no level is skipped. Holds." }
  - { id: focus-not-set, rule: "Neither the view nor the box that stands for it sets a focus: no autoFocus or focus() in kosk-manage-page.tsx or load-failed.tsx, so the graph says nothing of the focus when they open (see MANAGE-3 for after a write). Recorded so the silence is not read as an omission." }
  - { id: no-permanent-delete-here, rule: "The page has no 'Kalıcı olarak sil' button and no row buttons in the course table ('manage' mode); the block 'Kalıcı silme' only explains that the delete is in the Arşiv and links there (e2e kosk-view#2: both absences). The graph draws no such control; the replay cannot check the absence of what is not drawn." }
  - { id: toast-is-the-only-word, rule: "The result of a write is said by a toast in the 'Bildirimler' live region: a success closes after a few seconds, an error stays until closed (duration Infinity). Nothing on the page says what was done, the page just changes (see MANAGE-3)." }
