# The screens of nizam.kosks.manage: the Medaris management's view of one köşk (/kosks/<id>, features/kosks/components/
# kosk-manage-page.tsx), the box that stands for it when it cannot be read, the four dialogs it opens (Köşkü gizle, Köşkü pasife
# al, Köşk nazımı ekle, Barındırma hakkını geri al) and the toasts of their answers. Read from apps/nizam/features/kosks/components/
# {kosk-manage-page,hide-kosk-dialog,add-nazim-dialog,nazim-picker,kosk-course-table,load-failed}.tsx, features/passivation/components/
# passivate-scope-dialog.tsx and features/hosting/components/revoke-dialog.tsx on 16 Nov 2026; the words are copied from
# libs/i18n/src/locales/tr/nizam.json (namespaces KoskManage, KoskNazims, KoskNazimPicker, HostingPage, KoskCourses, HideKoskDialog,
# PassivateScopeDialog, AddNazimDialog, RevokeDialog, KoskDirectory).
#
# The page behind a dialog is drawn only in the states where no dialog is open: a modal dialog makes the page inert. The shell
# (sidebar, menu, bell) is nizam.shell.menuPerPersona's; the view is drawn as the one <main>, which is the shell's own and has no name.
#
# Composed words, in no i18n file, are `composed.<Namespace>.<name>` and the catalog says so:
#   composed.KoskManage.name         "{kosk}": the köşk's name, as the h1, the last crumb and the dialogs' eyebrow draw it (kosk-manage-page.tsx:354,359)
#   composed.KoskManage.handle       "{handle}": "@" and the short name (admin-present.ts:165, kosk-manage-page.tsx:361)
#   composed.KoskManage.publicPageName  the public-page link's name: its text and the hidden "(yeni sekmede açılır)" (kosk-manage-page.tsx:375)
#   composed.KoskManage.breakdown    "{publishedLine} · {draftLine} · {hiddenLine}": three catalog messages joined (overview-present.ts:157)
#   composed.KoskManage.hostingNames "{medrese}": the names of the medreses that hold a right, joined (kosk-manage-page.tsx:433)
#   composed.KoskManage.opened       "{date} · {opener}": the opening date and who opened (kosk-manage-page.tsx:317)
#   composed.KoskManage.person       "{person}": a person's name in the nazım table and in the picker's chosen list
#   composed.RevokeDialog.medrese    "{medrese}": the dialog's eyebrow, the medrese's name (revoke-dialog.tsx:103)
#   composed.AddNazimDialog.required "* zorunlu alan": a star before the catalog's "zorunlu alan" (add-nazim-dialog.tsx:133)
# `Changes.note` is the one message authored here: no message of the app says what the five actions change together.
