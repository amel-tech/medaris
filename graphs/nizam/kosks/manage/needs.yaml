# What must exist for the Medaris management to read and run one köşk: nizam.kosks.manage, written on 16 Nov 2026 in the format of
# LAYOUT.md section 7. Each need is what the product must do, from the flow's story and the findings it touches; none is read off what
# the page does today. Nothing here comes from planned.md: no planned feature (P-nn) names this page. The gaps are reported to the
# orchestrator, who merges them into graphs/needs.gaps.yaml (this file does not edit it).
#
# No replay has run yet (the first walks are a later phase), so no `walked` entry names a replay scenario; the scenarios that will walk
# a need are named in a comment beside it ("bound, not run").
#
# Gaps of this file, for that merge:
#   missing:   the-view-offers-only-what-the-reader-can-do (F-W3-4, MANAGE-1), a-stale-page-is-read-again (MANAGE-2),
#              a-write-is-said-where-the-person-is (MANAGE-3), the-tab-names-the-kosk (F-W3-9), a-disabled-button-says-why
#              (F-W3-1, F-X-3), a-lookup-runs-on-request (F-W3-14, F-X-14), a-hidden-kosk-cannot-be-followed-from-here (F-5)
#   unwalked:  restore-at-once, add-a-nazim-from-here, a-hosting-only-nazim-is-sent-to-hosting, others-are-refused (code, no e2e of
#              this page; a replay of each is bound and has not run), an-unreadable-page-says-so (code, no e2e, no replay: the stack
#              cannot make the overview fail)
kind: needs
flow: nizam.kosks.manage
status: proposed

needs:
  - id: read-a-kosk-on-one-page
    need: >-
      The başnazım, or a Medaris nazımı who may edit köşks, reads one köşk on one page: how many courses it has and in what state,
      how many talebe are registered, how many nazımları and which medreses host in it, and its name, short name, description, status,
      visibility, opening and policies; and sees the nazımları, the hosting rights and the courses in tables.
    drawn: [viewing, only-the-chief-and-the-kosk-editor-see-the-view]
    built:
      - action: medaris.api:getKoskOverview
      - action: medaris.api:listKoskNazims
      - action: medaris.api:listKoskHostingRights
      - action: medaris.api:getKoskCourseRoster
      - route: apps/nizam/features/kosks/components/kosk-manage-page.tsx:73
    walked:
      - e2e: apps/nizam/e2e/kosk-view.e2e.ts
        check: 'kosk-view#1' # carried: the h1, the notice, the numbers' line, the medrese in the summary and in the hosting section; not carried: the comparisons with the database, the imam star and the tab counts of the course table (data the walk's köşk does not hold)
    # replay chief (bound, not run)

  - id: hide-asks-first
    need: >-
      Hiding a köşk asks once, names the köşk and who loses sight of it, says nothing is deleted and who can bring it back, and then
      hides it from every list; nothing changes if the person cancels.
    drawn: [hideConfirm, hiding, a-hidden-kosk-is-restored-not-hidden-again]
    built:
      - action: medaris.api:hideKosk
      - route: apps/nizam/features/kosks/components/hide-kosk-dialog.tsx:57
    walked:
      - e2e: apps/nizam/e2e/kosk-view.e2e.ts
        check: 'kosk-view#3' # carried: the dialog names the köşk, Vazgeç changes nothing, Gizle hides, the toast; not carried: the audit row, the köşk's row under "Gizli" in the directory (nizam.kosks.browse)
    # replay chief (bound, not run): HIDE, CONFIRM_HIDE, CANCEL, CLOSE

  - id: restore-at-once
    need: >-
      A hidden köşk is brought back with one press by the level that hid it or above, and comes back active, or passive when it has no
      nazım; nobody is offered a button the API would refuse.
    drawn: [restoring, viewing]
    built:
      - action: medaris.api:restoreKosk
      - route: apps/nizam/features/kosks/components/kosk-manage-page.tsx:100
    # walked: nothing of this page's. e2e kosks#3 brings a köşk back from the directory (nizam.kosks.browse). Replays hiddenStart and chief (bound, not run).

  - id: take-out-of-service-after-reading-what-it-takes
    need: >-
      Taking a köşk out of service shows first what it takes along (the nazımları who leave, the courses that close, the talebe who lose
      access, the live celses of the coming days) and is confirmed on those numbers; if they changed meanwhile, the fresh ones are shown
      and asked about again; nothing is hidden or deleted, and a nazım added brings the köşk back.
    drawn: [passiveLoading, passiveReady, passivating, passiveChanged, only-an-active-kosk-is-taken-out-of-service, a-passive-kosk-has-no-nazim]
    built:
      - action: medaris.api:previewKoskDeactivation
      - action: medaris.api:deactivateKosk
      - route: apps/nizam/features/passivation/components/passivate-scope-dialog.tsx:65
    walked:
      - e2e: apps/nizam/e2e/kosk-view.e2e.ts
        check: 'kosk-view#4' # carried: the dialog's words, "Yine de pasife al", the toast; not carried: the numbers of the e2e's own seed (2 talebe), the database and audit checks. The changed-numbers branch has no e2e (a replay, IMPACT_CHANGED, is bound, not run)

  - id: add-a-nazim-from-here
    need: >-
      The başnazım adds a köşk nazımı from the köşk's page by the person's exact e-mail address; a person who already is one is refused in
      words, a passive köşk becomes active again, and the page shows the new nazım.
    drawn: [addForm, looking, addReady, adding]
    built:
      - action: medaris.api:addKoskNazims
      - action: medaris.api:lookupUser
      - route: apps/nizam/features/kosks/components/add-nazim-dialog.tsx:109
    # walked: nothing of this page's. e2e kosks#12 and #13 add a nazım from the settings page (nizam.kosks.nazims). Replays chief, passiveStart, noRights (bound, not run).

  - id: revoke-a-hosting-right-from-here
    need: >-
      The başnazım takes a hosting right back from a medrese on the köşk's page and, when the medrese has open courses in the köşk,
      chooses what becomes of them: they go on, or they are hidden (and come back from the Arşiv); with none open there is nothing to
      ask; nothing changes if the person cancels.
    drawn: [revokeOpening, revokeForm, revokeReady, revoking, a-revoke-asks-what-becomes-of-open-courses]
    built:
      - action: medaris.api:revokeKoskHostingRight
      - route: apps/nizam/features/hosting/components/revoke-dialog.tsx:95
    walked:
      - e2e: apps/nizam/e2e/kosk-view.e2e.ts
        check: 'kosk-view#5' # carried with "Dersler sürsün"; not carried: the database check; "Dersleri gizle" and the right with no course are the replays' (bound, not run)
      - e2e: apps/nizam/e2e/madrasahs.e2e.ts
        check: 'madrasahs#11, #12' # the same dialog from the hosting page: nizam.hosting.grantAndRevoke carries them

  - id: a-kosks-own-nazim-is-sent-to-dersler
    need: A köşk's own nazımı who opens the Medaris management address is sent to the page they work in, and never sees the management view.
    drawn: [routing, dersler_opened, only-the-chief-and-the-kosk-editor-see-the-view]
    built:
      - route: apps/nizam/features/kosks/kosk-entry.ts:48
    walked:
      - e2e: apps/nizam/e2e/kosk-view.e2e.ts
        check: 'kosk-view#6' # carried: the redirect to /kosks/<id>/dersler; the heading "Dersler" is nizam.courses.list's

  - id: a-hosting-only-nazim-is-sent-to-hosting
    need: A Medaris nazımı who holds only the permission to give hosting rights is sent to the one köşk page their permission opens.
    drawn: [readingHosting, readingHeld, placing, hosting_opened]
    built:
      - route: apps/nizam/features/kosks/kosk-entry.ts:52
    # walked: no e2e (MDRS-137 has none for the redirect). Replay hostingOnly (bound, not run).

  - id: others-are-refused
    need: >-
      A person the köşk is not open to (a nazım of another köşk, a Medaris nazımı with neither permission) is told they have no
      permission, and the page does not say whether the köşk exists.
    drawn: [placing, no_access]
    built:
      - route: apps/nizam/features/kosks/kosk-entry.ts:52
    # walked: no e2e of this page (kosks#11 and grants#3 are other pages). Replay stranger (bound, not run); the screen is nizam.shell.noAccessAndNotFound's.

  - id: no-permanent-delete-here
    need: >-
      The Medaris management's view of a köşk has no way to delete it for good; the delete is in the Arşiv, for hidden köşks and for the
      başnazım alone, and the page says so.
    drawn: [viewing]
    built:
      - route: apps/nizam/features/kosks/components/kosk-manage-page.tsx:537
    walked:
      - e2e: apps/nizam/e2e/kosk-view.e2e.ts
        check: 'kosk-view#2' # carried in part: the link to the Arşiv is drawn; the two absences (no "Kalıcı olarak sil", no "Hocaları düzenle") hold by the drawing and cannot be checked by a replay (the rule no-permanent-delete-here)

  - id: the-view-offers-only-what-the-reader-can-do
    need: >-
      A Medaris nazımı who may edit köşks is shown only the buttons and sections they can use; a section whose read they are refused says
      they have no permission, and a link leads only where the person may go.
    drawn: [viewing, addForm, addReady, hostingUnavailable, the-editor-cannot-add-a-nazim]
    missing: none # F-W3-4 and MANAGE-1, decision D1 of the flow; no Linear issue

  - id: a-stale-page-is-read-again
    need: >-
      When the API says the köşk is already in the state the person asked for, the page is read again, so what it offers is true.
    drawn: [hideConfirm, hiding, restoring]
    missing: none # MANAGE-2, decision D2; no Linear issue

  - id: a-write-is-said-where-the-person-is
    need: >-
      After a write the person is told what happened where they are looking, and the focus goes somewhere that exists, not to the page's
      start because the pressed button was replaced.
    drawn: [viewing, toast-is-the-only-word]
    missing: none # MANAGE-3; no Linear issue

  - id: the-tab-names-the-kosk
    need: The tab and the history name the köşk, so that two köşks open in two tabs can be told apart.
    drawn: [koskTitle]
    missing: none # F-W3-9; no Linear issue

  - id: a-disabled-button-says-why
    need: A button that is off says what is missing, in words a screen reader reads, in every dialog of the page.
    drawn: [addSubmit, revokeSubmit, deactivateOff]
    missing: none # F-W3-1 and F-X-3; no Linear issue

  - id: a-lookup-runs-on-request
    need: A person's address is looked up when the person asks, not when the field is passed through, since every lookup is audited.
    drawn: [looking, addEmail]
    missing: none # F-W3-14 and F-X-14; no Linear issue

  - id: a-hidden-kosk-cannot-be-followed-from-here
    need: >-
      The public page the management view links to does not let anyone follow a köşk that is hidden, and the link says where it leads for a
      köşk the public cannot see.
    drawn: [publicPage]
    missing: none # F-5 (ledger/security.md), the API's; the link is this page's, the follow is tedris.discover.followKosk's

  - id: an-unreadable-page-says-so
    need: When the köşk cannot be read at all the page says so in place and offers to try again.
    drawn: [loadFailed]
    built:
      - route: apps/nizam/features/kosks/components/load-failed.tsx:23
    # walked: nothing. Not bound: the stack's API cannot be made to fail this read.
