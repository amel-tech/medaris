rules:
  - { id: no-default-accept, rule: "no page has initialFocus on an action with intent confirm: the form starts in Ad" }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3)" }
  - { id: F-W3-1, rule: "a submit button is not natively disabled while the form is incomplete with nothing saying what is missing. 'Köşk aç' is off until the name, the short name, the tags and a nazım are right; the messages written for a submit try ('En az bir köşk nazımı seçin.', the tags errors) can never show because a disabled default button blocks implicit submission, so `sent` is never set. A keyboard or screen-reader user meets a dead button. Fix: keep it enabled, validate on submit and focus the first problem, or tie the reason to the button with aria-describedby (F-X-3 is the same finding in every dialog)" }
  - { id: F-X-3, rule: "the family of F-W3-1: natively disabled submit buttons with no reason given, in this form and in every dialog of the app" }
  - { id: F-W3-14, rule: "the nazım's address is looked up when the field is left (onBlur), not only on Enter, and tedrisat writes every lookup, found or not, to the audit log; the help text says searches are audited. Tabbing through the field makes audited lookups. Fix: search on Enter or an explicit 'Ara' button only" }
  - { id: F-X-14, rule: "the family of F-W3-14: e-mail lookups that run on blur in the four pickers of nizam" }
  - { id: F-W2-3, rule: "the e-mail lookup has no button; the field is `disabled` while it searches, so the focused field loses the focus, and nothing says the search finished except a hidden <output> for a success; 'not found' and 'failed' are a Field error that is not a live region while nobody is chosen. Fix: a visible 'Ara' button, keep the input enabled with aria-busy, announce the result with role=status" }
  - { id: F-UI-W3-1, rule: "Field's error element has no role=alert and no live region (libs/ui/src/mds/field.tsx:50-53): the name, short-name and 'kısa adını başka bir köşk kullanıyor' errors are read only if the focus moves to the field, and after a refused submit it does not" }
  - { id: F-W3-13, rule: "after a submit the server refuses (the short name is taken) the error appears under the field, the focus stays on the submit button, which is then disabled until the field is edited, and nothing announces the error. Fix: focus the first invalid control, or an error summary with role=alert" }
  - { id: F-UI-W1-1, rule: "Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx), so a screen reader reads the intro and every field as the dialog's description when it opens" }
  - { id: F-W3-8, rule: "from a köşk application, opening the köşk is two writes (POST /kosks, then the approval); if the second fails the köşk exists and the page does not say so (nizam.applications.decide draws it)" }
  - { id: F-W3-open-1, rule: "new: the API lets a Medaris nazımı holding platform.kosk_create open a köşk (POST /kosks, @Authz platform.kosk_create), and the seeded Medaris nazımı holds it; the page gives 'Köşk aç' to the başnazım alone (`chief`, kosks-directory.tsx:293; `can.openKosk = chief`, apps/tedrisat/src/nizam-dashboard/dashboard-sections.ts:28), and the dialog is not even mounted for anyone else. A decision to take: offer it to the holders of the permission, or take the permission off the Medaris nazımı's defaults" }
  - { id: F-W3-open-2, rule: "new: the 'Vazgeç' and close buttons stay enabled while the köşk is being made and do nothing (`if (!saving) onOpenChange(next)`, open-kosk-dialog.tsx:126); a busy control is not disabled or marked" }
  - { id: F-W3-open-4, rule: "new, found by the replay: when the form is opened by the address /kosks?ac=1 (the home page's 'Köşk aç' link) no button was pressed, so closing it (Vazgeç, Escape, or after the köşk is made) gives the focus to nothing: it falls to the page itself, and a keyboard or screen-reader user starts again from the top. Opened with the page's 'Köşk aç' button it goes back to that button. Fix: focus the page's 'Köşk aç' button, or the h1, when a form opened by the address closes" }
  - { id: F-W3-open-3, rule: "new: the picker's live <output> keeps 'X seçildi' after X is removed from the list, and a removal moves no focus and says nothing (nazim-picker.tsx:77, 173)" }
