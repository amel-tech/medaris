# The screens of nizam.kosks.open: the Köşkler page (/kosks) behind, and the "Köşk aç" dialog over it. Read from
# apps/nizam/features/kosks/components/{kosks-directory,open-kosk-dialog,nazim-picker}.tsx on 15 Nov 2026; the words are
# copied from libs/i18n/src/locales/tr/nizam.json (namespaces KoskDirectory, OpenKoskDialog, KoskNazimPicker).
#
# The page behind the dialog is drawn only where the dialog is closed: the dialog is modal, so the page is inert while it
# is open. When the form is opened from a köşk application the page behind is the applications page, which
# nizam.applications.decide draws; here that start draws the dialog alone (the page nodes are `when: not fromApplication`).
