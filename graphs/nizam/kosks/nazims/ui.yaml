# The screens of nizam.kosks.nazims: "Köşk nazımları" (/kosks/<id>/ayarlar/nazimlar) with its table, and the "Köşk nazımı ekle" dialog over
# it. Read from apps/nizam/app/kosks/[id]/ayarlar/nazimlar/page.tsx, features/kosks/components/{nazims-view,add-nazim-dialog,nazim-picker}.tsx,
# features/kosks/admin-present.ts and libs/ui/src/mds (alert, breadcrumb, button, dialog, field, table, tabs) on 16 Nov 2026; the words are
# copied from libs/i18n/src/locales/tr/nizam.json (namespaces KoskNazims, AddNazimDialog, KoskNazimPicker). Nothing was walked in a browser
# (from the code); the unit specs apps/nizam/test/*nazim* exercise the same components.
#
# The page behind the dialog is drawn only where the dialog is closed: the dialog is modal, so the page is inert while it is open. The table's
# rows are data: the nodes marked `repeat` stand for one item per person added, and the replay finds them through the binding; the one
# standing row (the köşk's first nazım) and the second person of "one or more" are separate nodes, as their words differ.
#
# What the graph leaves out of a row, on purpose: the chosen person's remove button is drawn for each person chosen, but only the first
# one's press is a step (`removeFirst`, with one person chosen); the second person's remove button is not drawn and removing one of two is not walked. The tab counts
# ("Köşk nazımları1", "Barındırma hakları0") are not drawn (KNZ-6); the six lines of the card are.
#
# Composed text (built in code, in no i18n file), each a value the page puts in a place that has no message of its own. A sample is keyed by
# the placeholder's name, so each person and each date has a placeholder of its own:
#   composed.KoskNazims.standing          the köşk's first nazım, a <bdi> in the row header (nazims-view.tsx:74-76)
#   composed.KoskNazims.added             a person the başnazım added, the same cell
#   composed.KoskNazims.more              the second person of "one or more", the same cell
#   composed.KoskNazims.giver             the giver's name, a <bdi> (nazims-view.tsx:90)
#   composed.KoskNazims.date              the day of the post, grantedOn(): "15 Kasım 2026", in the viewer's zone (nazims-view.tsx:103)
#   composed.KoskNazims.term              the day a post ends, termLabel(): the same shape (admin-present.ts:381, nazims-view.tsx:113)
#   composed.KoskNazims.koskName          the köşk's name, the breadcrumb's link to its page (nazims-view.tsx:134)
#   composed.AddNazimDialog.eyebrow       the köşk's name above the dialog's title (add-nazim-dialog.tsx:117)
#   composed.AddNazimDialog.savedBody     AddNazimDialog.savedBody with its {kosk} named {koskGenitive}: the caption's {kosk} is the plain name
#                                         and one placeholder has one sample (add-nazim-dialog.tsx:99-102 passes the genitive)
#   composed.KoskNazimPicker.person       a chosen person's name, a <bdi> (nazim-picker.tsx:171)
#   composed.KoskNazimPicker.address      a chosen person's address, a <bdi dir=ltr> (nazim-picker.tsx:175)
#   composed.KoskNazimPicker.more         the second person chosen, the same <bdi>; their remove button is not drawn (one {name} has one sample)
#   composed.KoskNazimPicker.chosenMore   KoskNazimPicker.chosen ("{name} seçildi") with its {name} named {moreName}: the <output> says the last one
#   composed.AddNazimDialog.busy          "Yükleniyor", the default of Button's `loadingLabel` (libs/ui/src/mds/button.tsx:67), written into the
#                                         hidden <output> beside "Ekle" while it saves: the page passes none, so it is not a message of the app
# `changes` is the app's own sentence, AddNazimDialog.intro: "Eklediğiniz kişi hemen {köşk} köşk nazımı olur." It says nothing of a köşk that
# becomes active again (KNZ-1) or of the audit row (the footnote does, in another line).
#
# Samples: the köşk of the walk and its three people, from the seeded accounts' names; the binding gives the real ones from its helper.
