  submit: { type: action, component: Button, role: button, intent: confirm, text: { key: AddNazimDialog.submit }, in: [asking, askingReady, adding], disabledIn: [asking, adding], emits: SUBMIT, source: apps/nizam/features/kosks/components/add-nazim-dialog.tsx:124 } # natively disabled in `asking`, nothing says why (F-W3-1); busy (aria-disabled, aria-busy) in `adding`; not drawn in `looking`, where it keeps the state it had
