  removeFirst: { type: action, component: Button, role: button, intent: secondary, name: { key: KoskNazimPicker.remove, params: { name: added.addedName } }, in: [asking, askingReady, looking, adding], disabledIn: [adding], when: "chosen != 'none'", emits: REMOVE_NAZIM, duringStep: true, source: apps/nizam/features/kosks/components/nazim-picker.tsx:180 } # an icon button named by aria-label; no confirmation and the focus is not moved; pressed as a step only with one person chosen; live while a lookup runs (only the e-mail field is disabled): the remove is at once and holds, since a lookup that then finds somebody adds them to the list as it is when the answer comes (a state setter's update, nazim-picker.tsx:83; the remove itself, :186). Fixed 23 Nov 2026: the lookup once added to the list as it was when the search began, so the removed person came back (test: apps/nizam/test/course-create-in-flight.spec.tsx)

  # Görev bitiş tarihi ve saati (isteğe bağlı)
