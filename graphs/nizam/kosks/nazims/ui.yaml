edges:
  - { labelledBy: [dialog, dialogTitle] }
  - { triggers: [addButton, asking] }
  - { triggers: [submit, adding] }
  - { returnsFocus: [dialog, addButton] } # Base UI returns the focus to the element that was focused when the dialog opened: the page's "Köşk nazımı ekle"

rules:
  - { id: focus-not-set, rule: "the page sets no focus of its own on load (nothing in nazims-view.tsx or page.tsx does), so no node has initialFocus on the page and no `focus` is drawn; the dialog gives it to the e-mail field (`initialFocus={emailRef}`, add-nazim-dialog.tsx:120)" }
  - { id: no-default-accept, rule: "no page has initialFocus on an action with intent confirm: the dialog starts in the e-mail field" }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3)" }
  - { id: F-W3-1, rule: "a submit button is not natively disabled while the form is incomplete with nothing saying what is missing. 'Ekle' is off until somebody is chosen and the end is not in the past; the message written for a submit try ('En az bir köşk nazımı seçin.', KoskNazimPicker.required, add-nazim-dialog.tsx:79-81 and :139) can never show, because a disabled default button blocks implicit submission and `sent` is never set. A keyboard or screen-reader user meets a dead button. Fix: keep it enabled, validate on submit and focus the first problem, or tie the reason to the button with aria-describedby (F-X-3 is the same finding in every dialog)" }
  - { id: F-X-3, rule: "the family of F-W3-1: natively disabled submit buttons with no reason given, in this dialog and in every dialog of the app" }
  - { id: F-W3-14, rule: "the address is looked up when the field is left (onBlur, nazim-picker.tsx:145), not only on Enter, and tedrisat writes every lookup, found or not, to the audit log; the help text says every search is audited. Tabbing through the field, or pressing Vazgeç with an address typed, makes audited lookups nobody meant. Fix: search on Enter or an explicit 'Ara' button only" }
  - { id: F-X-14, rule: "the family of F-W3-14: e-mail lookups that run on blur in the four pickers of nizam" }
  - { id: F-W2-3, rule: "the e-mail field has no search button and is `disabled` while it searches (nazim-picker.tsx:132), so the focused field loses the focus, and nothing says the search finished except a hidden <output> for a success; 'not found' and 'failed' are a Field error that is not a live region while nobody is chosen. Fix: a visible 'Ara' button, keep the input enabled with aria-busy, announce the result with role=status" }
  - { id: F-UI-W3-1, rule: "Field's error element has no role=alert and no live region (libs/ui/src/mds/field.tsx:50-53): 'Bitiş zamanı şu andan sonra olmalı.' appears under the end field the moment a past end is typed and is read only if the focus moves to the field; the toast of a refusal is announced, the field's own message is not" }
  - { id: F-UI-W1-1, rule: "Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx), so a screen reader reads the intro and every field as the dialog's description when it opens" }
  - { id: F-W3-9, rule: "the <title> of the page is 'Köşk nazımları' for every köşk (nazimlar/page.tsx:12-15); a nazım of several köşks cannot tell the tabs or the history entries apart. The h1 and the breadcrumb do not name the köşk either for a nazım; the intro and the caption do. Fix: put the köşk's name in the title" }
  - { id: F-W3-open-3, rule: "the picker's live <output> keeps 'X seçildi' after X is removed from the list, and a removal moves no focus and says nothing (nazim-picker.tsx:84, 173); the same component as nizam.kosks.open's" }
  - { id: KNZ-1, rule: "new, from the code and the ledger's inactive-scope-accepts-new-scope: adding a nazım makes a passive köşk active again silently. addNazims clears passive_since and passive_reason in the same transaction for any köşk it adds to (kosk-admin.repository.ts:407-410), with no check that the köşk is passive, was ever managed, or is not hidden, the same family as the Pasif kapsamlar assign (inactive-scope.repository.ts:263, :306-312: any scope with no manager held now, a past manager not required). The page never shows a köşk's standing: a passive köşk's list is the empty line 'Bu köşkün köşk nazımı yok.', the dialog's help speaks only of the end of a post ('Süre dolunca başka köşk nazımı yoksa köşk pasifleşir.'), and the toast names the people. The başnazım passivated it with a 64-character confirmation that spelt out its courses, talebe and live celseler (deactivate, kosk-admin.repository.ts:702-755); reopening it, with every course below, needs one e-mail address and no confirmation. And 'passive' has two sources: the engine derives it from the role rows (a manager once, none now: role-assignments.ts:61-73), while the directory's status reads kosks.passive_since alone (kosk-admin.repository.ts:147), which only deactivate sets; a köşk whose last post simply ends is passive for the engine and 'Etkin' in the directory, and the help line's promise is kept for one and not the other. Fix: show the köşk's status on this page, say 'yeniden etkin' in the dialog and the toast, ask before reopening, and make the two notions one" }
  - { id: KNZ-2, rule: "new: the page and the API disagree on who may add. The API asks platform.kosk_nazim_manage (kosk-admin.service.ts:117), which the başnazım and a Medaris nazımı holding the code pass; the page gives 'Köşk nazımı ekle' to `me.roles.systemAdmin` alone (page.tsx:48, nazims-view.tsx:145). A Medaris nazımı who may add meets a read-only page; and the one who holds only platform.kosk_edit (the seeded one) is told 'Köşk nazımlarını Medaris yönetimi atar; bu listeyi buradan değiştiremezsiniz.' although they are the Medaris yönetimi. The management view /kosks/<id> goes the other way (the button for every holder of platform.kosk_edit, F-W3-4). The Swagger summary says 'SYSTEM_ADMIN only' and the e2e title agrees (inventory F-6). A decision to take (D2): give the button by the permission the API asks, and word the note for the person it is shown to" }
  - { id: KNZ-3, rule: "new, from the code: the error toast is raised with `toast.error` and no id, and a refusal's toast stays until it is closed (duration Infinity, add-nazim-dialog.tsx:92-95), so pressing 'Ekle' again after a 409 stacks a second identical toast, and an error toast stays on screen after a later attempt succeeds and the success toast appears beside it. Fix: give the toast an id per action, as the unified kit's notify does (libs/ui/src/mds/toast.tsx), or dismiss it on the next attempt" }
  - { id: KNZ-4, rule: "new, from the code: the picker has no limit and the API takes one to ten people (KOSK_MANAGERS_MAX = 10, kosk-field-rules.ts:42, ArrayMaxSize in kosk-admin.dto.ts:189). With an eleventh person chosen 'Ekle' is on, the server answers 400 VALIDATION_ERROR and the toast says 'Bir şeyler ters gitti. Biraz sonra yeniden deneyin.', not that ten is the most. Fix: stop the picker at ten and say so, or give the code its own sentence" }
  - { id: KNZ-5, rule: "new, from the code: the dialog does not know who is a nazım already, though the page has the list in hand (`nazims`); a person already on it is chosen like anyone and refused only after 'Ekle', in a toast that does not say which of the people it is, and the whole call is refused (all or nothing: nobody is added). kosks.e2e.ts#12 pins this ('Seçilen kişi zaten bu köşkün nazımı.'). Fix: tell the person at once, beside the chosen name, as the ders nazırı dialog of nazar does" }
  - { id: KNZ-6, rule: "new, from the code: the tab's link reads label and count with no space between ('Köşk nazımları1', 'Barındırma hakları0'), a count of 0 included, because the count is an inline <span> in the link (libs/ui/src/mds/tabs.tsx:76-82); the same as the nazar tabs' F-A-12. Fix: put the count in a visually hidden ' (1)' or give the link an aria-label" }
