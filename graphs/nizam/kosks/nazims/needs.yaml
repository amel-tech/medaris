# What must exist for a köşk's nazımları to be read and added: the product list of nizam.kosks.nazims, written from the flow's story and its
# open decisions, never from what the page does today. A need that is not met is a gap in graphs/needs.gaps.yaml (the orchestrator merges
# it; this file does not edit it). No replay has been run (the owner's word: replays happen once, after every graph is written), so
# `walked` names the e2e checks and unit specs that carry a need and no replay scenario; the scenarios bound in binding*.yaml are named in
# the comments (`adds`, `passive`, `notFound`, `again` in binding.yaml; `exists` in binding.exists.yaml; `nazim`, `medaris` and `stranger`
# each in a file of its own).
#
# Gaps of this file, for that merge:
#   missing:   the-page-says-a-passive-kosk-is-reopened (KNZ-1, decision D1), a-medaris-nazim-who-may-add-can-add-here (KNZ-2, decision
#              D2), a-person-who-is-a-nazim-already-is-told-at-once (KNZ-5), the-picker-stops-at-ten (KNZ-4); each with `none` (no Linear
#              issue)
#   unwalked:  several-people-in-one-call (the page's half: the e2e adds one person, and the cover of replay `adds` takes a second person
#              into the dialog but no walk presses "Ekle" with two; the API spec holds the all-or-nothing), the-read-failing-is-said-and-retried (the
#              unit spec only; nothing here can make GET /kosks/:id/nazims fail), a-refused-call-names-what-went-wrong (only the 409 of the
#              e2e; the others cannot be made on request), the-directory-is-searched-and-audited (the e2e reads the audit row of the
#              addition, not of the search; replay `adds` checks the search's row)
kind: needs
flow: nizam.kosks.nazims
status: proposed

needs:
  - id: the-chief-adds-nazims-by-email
    need: >-
      The başnazım adds a köşk's nazımları by their e-mail address: each person is found in the realm's directory by the exact address,
      shown by name before anything is written, and given the post at once. The list then has their rows, who gave the post and when,
      and every addition is written to the audit log.
    drawn: [listed, asking, askingReady, looking, adding, addButton, nazimField, chosenFirst, chosenFirstEmail, submit, toastSaved, toastSavedBody, rowAddedName, rowAddedGiver, rowAddedRole, rowAddedDate]
    built:
      - action: medaris.api:addKoskNazims
      - action: medaris.api:lookupUser
      - route: apps/nizam/features/kosks/components/add-nazim-dialog.tsx:109
      - route: apps/nizam/features/kosks/components/nazim-picker.tsx:59
    walked:
      - e2e: apps/nizam/e2e/kosks.e2e.ts
        check: 'kosks#12 (a1 to a-last)'

  - id: several-people-in-one-call
    need: >-
      The başnazım chooses more than one person in the same dialog and adds them all in one call, all or none: if any of them already is
      a nazım of the köşk nothing is written.
    drawn: [chosenSecond, rowMoreName, askingReady, adding, toastExists]
    built:
      - action: medaris.api:addKoskNazims
      - route: apps/nizam/features/kosks/components/nazim-picker.tsx:76
    walked:
      - e2e: apps/tedrisat/test/e2e/kosk-admin.e2e.spec.ts
        check: 'kosk-admin: refuses the whole call when anyone is a nazım already'

  - id: an-end-date-is-optional-and-ahead
    need: >-
      The post may end on a day and time the başnazım types, or last until the nazım is taken away. An end in the past is refused under
      its field before sending, and by the server if it has passed by then; an end that is kept is shown in the list in place of
      "Süresiz".
    drawn: [endField, endHelp, endPast, rowAddedNever, rowAddedEnd, toastEndPassed, submit]
    built:
      - action: medaris.api:addKoskNazims
      - route: libs/utils/src/end-instant.ts:141
      - route: apps/nizam/features/kosks/components/add-nazim-dialog.tsx:62
    walked:
      - e2e: apps/nizam/e2e/kosks.e2e.ts
        check: 'kosks#13 (a1 to a-last; the end is typed as 12:00 on the browser clock, Europe/Istanbul)'

  - id: adding-a-nazim-reopens-a-passive-kosk
    need: >-
      A köşk that was taken out of service, with no nazım, is active again as soon as the başnazım adds one: its passive mark is cleared
      in the same step as the post is given.
    drawn: [emptyLine, adding, listed]
    built:
      - action: medaris.api:addKoskNazims
      - route: apps/tedrisat/src/kosk/kosk-admin.repository.ts:407
    walked:
      - e2e: apps/tedrisat/test/e2e/kosk-admin.e2e.spec.ts
        check: 'kosk-admin: makes a passive köşk active again (the API only; replay `passive` is bound and checks the directory)'

  - id: the-page-says-a-passive-kosk-is-reopened
    need: >-
      The page says that the köşk is passive, before the başnazım adds anybody, and that adding somebody makes it active again, with
      its courses; the toast says so when it happened. Reopening what a confirmation closed does not go unsaid (KNZ-1, decision D1).
    drawn: [emptyLine, endHelp, toastSaved]
    missing: none

  - id: a-nazim-reads-the-list-read-only
    need: >-
      A nazım of the köşk reads who runs it, who gave each post, when, and until when, with "Siz" under their own name; the list is the
      Medaris yönetimi's to change, so there is no button to add and none to remove.
    drawn: [listed, rosterTable, rowName, rowYou, rowGiver, rowGiverRole, rowDate, rowNever, readOnlyNote, removeNever, addButton, tabGeneral, abilitiesHeading]
    built:
      - action: medaris.api:listKoskNazims
      - route: apps/nizam/features/kosks/components/nazims-view.tsx:123
    walked:
      - e2e: apps/nizam/e2e/kosks.e2e.ts
        check: 'kosks#10 (a1 to a11; the date is the day the walk made the köşk, not a seeded one), kosks#14 (a1)'

  - id: another-kosks-nazim-is-refused
    need: >-
      A nazım of another köşk cannot read the list: they meet "Bu bölüm için izniniz yok", the same screen as for a köşk that is not
      there, so the page never tells which köşks exist.
    drawn: [handed_over.no_access]
    built:
      - action: medaris.api:listKoskNazims
      - route: apps/nizam/app/kosks/[id]/ayarlar/nazimlar/page.tsx:36
    walked:
      - e2e: apps/nizam/e2e/kosks.e2e.ts
        check: 'kosks#11 (a1; a2 is /kosks/<id>/ayarlar, nizam.kosks.editAndHide)'

  - id: a-medaris-nazim-who-may-add-can-add-here
    need: >-
      A Medaris nazımı who holds platform.kosk_nazim_manage, which the API admits, gets "Köşk nazımı ekle" on this page, and one who
      holds only platform.kosk_edit reads a note that does not tell them the list is another office's to change (KNZ-2, decision D2).
    drawn: [addButton, readOnlyNote]
    missing: none

  - id: a-person-who-is-a-nazim-already-is-told-at-once
    need: >-
      When the person found already is a nazım of the köşk, the dialog says so beside their name before "Ekle" is pressed, and does not
      send them; the list is in the page already (KNZ-5).
    drawn: [chosenFirst, toastExists]
    missing: none

  - id: the-picker-stops-at-ten
    need: >-
      The picker takes no more people than the API does (one to ten) and says so, instead of an eleventh person ending in a generic
      "Bir şeyler ters gitti" after a full form (KNZ-4).
    drawn: [chosenSecond, toastGeneric]
    missing: none

  - id: the-directory-is-searched-and-audited
    need: >-
      The address is searched only on the person's own request, and every search is written to the audit log with the address and
      whether anybody was found, which the help line says. Tabbing through the field does not search (F-W3-14).
    drawn: [looking, nazimField, nazimHelp, pickerNotFound, pickerAlertAlready]
    built:
      - action: medaris.api:lookupUser
      - route: apps/nizam/features/kosks/components/nazim-picker.tsx:138
    walked:
      - e2e: apps/nizam/e2e/kosks.e2e.ts
        check: 'kosks#12 (the address no account has, then a real one; the audit row of the search is not read)'

  - id: the-read-failing-is-said-and-retried
    need: >-
      When the list cannot be read the page still draws, says so in an alert with "Yeniden dene", and reads again when it is pressed;
      the başnazım is never offered a dialog about a list that did not load without the page saying so.
    drawn: [listFailed, failAlert, failText, retry]
    built:
      - action: medaris.api:listKoskNazims
      - route: apps/nizam/features/kosks/components/nazims-view.tsx:181
    walked:
      - e2e: apps/nizam/test/kosk-views.spec.tsx
        check: 'kosk-views#NazimsView (unit spec of the component; no browser run reads it)'

  - id: a-refused-call-names-what-went-wrong
    need: >-
      A refusal of the call is one toast that names the cause in plain words: someone is a nazım already, an account is not in Medaris,
      the end has passed, the köşk is gone, no right. Whatever else is said as such, not as "something went wrong".
    drawn: [toastFailed, toastExists, toastUnknownAccount, toastEndPassed, toastGone, toastForbidden, toastGeneric]
    built:
      - action: medaris.api:addKoskNazims
      - route: apps/nizam/features/kosks/admin-present.ts:431
    walked:
      - e2e: apps/nizam/e2e/kosks.e2e.ts
        check: 'kosks#12 (a-last: only the 409 is read; replay `exists` is bound)'
