# nizam.kosks.browse, the refusal of "Geri al" that says the köşk is not hidden any more (409 KOSK_NOT_HIDDEN), in a binding of its own (it adds no transition to binding.yaml's scenarios and
# needs a `before` on the state `restoring`, which a scenario cannot carry):
#   flock <scratchpad>/replay.lock nice -n 10 node <engine>/src/cli.ts replay graphs/nizam/kosks/browse \
#     --bind graphs/nizam/kosks/browse/binding.notHidden.yaml --cover transitions --out <dir>
# The page is opened with the hidden köşk and its "Geri al"; when the walk presses it, the replay holds the server action (the `call` of
# `restoring`), runs the `before` below as a second person through the API, then lets the action go, so it meets the world that someone brought it back first.
# NOT RUN: written without a replay (the first walks are a later phase); the `before` and the answer are from the code
# (kosk-admin.service.ts:263-286, kosk-admin.repository.ts:489-541), never seen. Nothing outside the walk's own köşk is touched; `teardown` removes it.
schema: delurio-graph/0
kind: binding
extends: ./locators.binding.yaml
flow: nizam.kosks.browse

scenarios:
  notHidden:
    given: { viewer: chief, world: mixed, answer: notHidden, taught: none }
    as: systemAdmin
    open: '{nizam}/kosks'
    setup:
      - run: [node, ../nizam/kosks/browse/kosks.mjs, make, brsn, hidden]
        expect: '"tag":"brsn"'
    teardown:
      - run: [node, ../nizam/kosks/browse/kosks.mjs, remove, brsn]
        expect: 'kosk remove brsn removed'
    vars: { tag: brsn, typeActive: Süleymaniye, typePassive: brsn pasif, typeHidden: brsn gizli, typeNobody: zzz yok }

states:
  restoring:
    call: '{nizam}/kosks**'
    before:
      - run: [node, ../nizam/kosks/browse/kosks.mjs, restore, brsn]
        expect: 'restored brsn'
