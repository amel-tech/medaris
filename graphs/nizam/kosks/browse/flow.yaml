  restoring:
    title: The köşk is brought back
    description: >-
      The server action restoreKosk, POST /kosks/:id/restore: it asks which kademe the caller acts at (the başnazım and platform.kosk_edit as the
      platform, the köşk's nazımı as the köşk), refuses a restore by a level below the one that hid, and clears the hide, with an audit row. The row's
      button is busy (aria-disabled, aria-busy, and a hidden status that says "Yükleniyor" from a default of the button, F-A-14) and the rest of the
      page stays live. When it works a toast says "Köşk geri alındı" and the page reads again (router.refresh); when it does not, a toast that stays
      until it is closed says "Köşk geri alınamadı" with the sentence of the code, and the row is as it was.
    source: apps/nizam/features/kosks/components/kosks-directory.tsx:125
    invoke: { action: restoreKosk }
    on:
      DONE: { guard: "answer == 'restored'", target: readingDirectory, effect: [mended], say: "a toast says the köşk is back and the row is read again: it is an active köşk now (on the Gizli tab it leaves the table)", source: apps/nizam/features/kosks/components/kosks-directory.tsx:137 }
      FAIL.notHidden: { guard: "answer == 'notHidden'", target: listed, effect: [refused], say: "a toast: \"Bu köşk zaten gizli değil.\" (someone brought it back first); the row is not read again", source: apps/nizam/features/kosks/components/kosks-directory.tsx:131 }
      FAIL.gone: { guard: "answer == 'gone'", target: listed, effect: [refused], say: "a toast: \"Bu köşk artık yok.\"", source: apps/nizam/features/kosks/components/kosks-directory.tsx:131 }
      FAIL.level: { guard: "answer == 'level' and viewer == 'koskOwn'", target: listed, effect: [refused], say: "a toast: \"Bunu daha üst bir kademe gizlemiş; yalnız o kademe ya da üstü geri alabilir.\"", source: apps/nizam/features/kosks/components/kosks-directory.tsx:131 }
      FAIL.forbidden: { guard: "answer == 'forbidden' and viewer == 'koskOwn'", target: listed, effect: [refused], say: "a toast: \"Bunu yapma izniniz yok.\"", source: apps/nizam/features/kosks/components/kosks-directory.tsx:131 }
      FAIL.failed: { guard: "answer == 'failed'", target: listed, effect: [refused], say: "a toast with the generic sentence: \"Bir şeyler ters gitti. Biraz sonra yeniden deneyin.\"", source: apps/nizam/features/kosks/components/kosks-directory.tsx:131 }

