  handed_over.manage:
    title: The köşk's management page opens
    description: "A köşk's name is a link to /kosks/<id>. For the başnazım, and for a Medaris nazımı who holds platform.kosk_edit, it is the management view of one köşk: nizam.kosks.manage draws it. A Medaris nazımı who holds only platform.hosting_grant is sent on to Barındırma hakları; one who holds neither is refused (that flow)."
    type: final
    leavesPage: true
  handed_over.courses:
    title: The köşk's Dersler opens
    description: "A köşk nazımı who follows a köşk's name is sent on from /kosks/<id> to /kosks/<id>/dersler, the köşk's courses: nizam.courses.list draws it."
    type: final
    leavesPage: true
  handed_over.archive:
    title: The platform archive opens
    description: "\"Arşiv\" is a plain link (a full page load) to /arsiv, the başnazım's archive of everything hidden: nizam.moderation.restoreArchived draws it."
    type: final
    leavesPage: true
  handed_over.taught:
    title: The course opens
    description: "A taught course is a link to /kosks/<köşk>/courses/<ders>/edit, which redirects to the course's curriculum (F-X-19): nizam.courses.curriculum draws it."
    type: final
    leavesPage: true
  handed_over.no_access:
    title: The section refusal opens
    description: "The layout or the page calls forbidden() and the shell draws \"Bu bölüm için izniniz yok\" at the same address: nizam.shell.noAccessAndNotFound draws it."
    type: final
    leavesPage: true
  left:
    title: The person leaves the page
    type: final
    leavesPage: true

assertions:
  - id: a-person-the-app-refuses-meets-no-list
    never: "(viewer == 'outsider' or viewer == 'medarisBare') and state in ['listed', 'restoring', 'emptyFilter', 'emptyAll', 'loadFailed']"
    say: A person who is not Nizam's, or whom tedrisat refuses the directory, is never shown the table, the empty lines or the box; they get the section refusal.
    source: apps/nizam/app/kosks/layout.tsx:20
  - id: rows-mean-the-answer-holds-some
    never: "state == 'listed' and not rowsShown"
    say: The table is drawn with rows only when the tab, the chip, the text and the page leave some.
    source: apps/nizam/features/kosks/components/kosks-directory.tsx:378
  - id: nothing-fits-says-so
    never: "state == 'emptyFilter' and (rowsShown or world == 'empty')"
    say: The line "Sonuç yok" shows only when the answer holds some köşk and none fits.
    source: apps/nizam/features/kosks/components/kosks-directory.tsx:281
  - id: no-kosk-means-the-first-line
    never: "state == 'emptyAll' and world != 'empty'"
    say: The line "Henüz köşk yok." shows only when the viewer's whole scope holds no köşk.
    source: apps/nizam/features/kosks/components/kosks-directory.tsx:281
  - id: a-box-only-after-a-failed-read
    never: "state == 'loadFailed' and not failing"
    say: The box that says the list could not be read is drawn only when the directory read failed.
    source: apps/nizam/features/kosks/components/kosks-directory.tsx:365
  - id: a-kosk-nazim-sees-no-passive-kosk
    never: "state == 'listed' and yours and showsPassive"
    say: A passive köşk has no nazım, so a köşk nazımı never finds it in his own list.
    source: apps/tedrisat/src/kosk/kosk-admin.repository.ts:151
  - id: only-the-basnazim-opens-and-reads-the-archive
    never: "state in ['handed_over.open', 'handed_over.archive'] and viewer != 'chief'"
    say: "Köşk aç and Arşiv are the başnazım's alone: a Medaris nazımı who may open a köşk in the API is given no button (F-W3-open-1)."
    source: apps/nizam/features/kosks/components/kosks-directory.tsx:293
  - id: geri-al-only-where-the-kademe-reaches
    never: "state == 'restoring' and not mayRestore"
    say: A köşk nazımı is given no button on a köşk that Medaris yönetimi hid; the row names who hid it.
    source: apps/nizam/features/kosks/components/kosks-directory.tsx:255
  - id: a-toast-only-after-a-restore
    never: "(toast == 'ok' and answer != 'restored') or (toast == 'refused' and answer == 'restored')"
    say: The toast that says the köşk is back follows a restore that worked, and a refusal toast one that did not.
    source: apps/nizam/features/kosks/components/kosks-directory.tsx:137
  - id: a-second-page-needs-twelve-more
    never: "pageNo == 'last' and world != 'many'"
    say: The pager exists only when the answer holds more than one page of 12.
    source: apps/nizam/features/kosks/components/kosks-directory.tsx:382
