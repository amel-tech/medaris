  loadFailed:
    title: The list could not be read
    by: human
    description: >-
      The directory read failed for a reason other than a 403: where the table would be, an alert says "Köşkler yüklenemedi" and that the list cannot
      be read now, with "Yeniden dene", which reads the page again (router.refresh). The header, the buttons the viewer holds, the tabs (without
      numbers: the counts came with the answer), the chips and the search box stay. The stack can make tedrisat fail this read by an address: a page
      too large to be a number (?sayfa=100000000000000000000) answers 500, and "Yeniden dene", which reads the same address again, fails again
      (KBROWSE-2); a tab, a chip, a text or a page asks for another address (page 1) and answers. A retry that works, after a failure that was
