  - { labelledBy: [listingGroup, listingLegend] }

rules:
  - { id: focus-not-set, rule: "Köşkler sets no initial focus (no autoFocus and no focus() in features/kosks or app/kosks), so the page node has no `initialFocus`. A press on a tab or a chip, or typing, keeps the focus where it was (a soft navigation of the same page); the recorded silence is not a finding." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): the row button's aria-label is its visible words, a colon and the köşk's name, and a tab's name is its words followed by its number" }
  - { id: F-W3-12, rule: "searching, a tab, a chip or a page changes the table with only `aria-busy` on the panel's wrapper (kosks-directory.tsx:98-122, :331), which a screen reader does not read: nothing says how many köşks are left, that the list changed, or that a page past the last is empty. The e2e waits for the rows; a person who cannot see them does not know they changed. Fix: a visually hidden role=status line, \"<n> köşk\", that follows each read." }
  - { id: F-A-12, rule: "a tab's content is its label immediately followed by the count <span> with no space (libs/ui/src/mds/tabs.tsx:65-69, the component nazar's Arşiv tabs use too), so its name can read \"Etkin2\". The e2e finds the number by reading the tab's text and asks for the tab by /^Etkin/. Not verified in a browser. Fix: a visually hidden space, or the count in an aria-label." }
  - { id: F-W3-16, rule: "the \"Verdiğiniz dersler\" block (taught-courses.tsx:19-37) is the one part of the page still in shadcn-era classes (`text-muted-foreground`, `rounded-lg border`, `hover:bg-muted/40`) with two decorative icons from @medaris/icons/ssr that carry no aria-hidden (not verified); its <section> has no name, so it is not a landmark, and it sits outside the table's own section. Fix: design-system classes, aria-hidden icons, a name for the section." }
  - { id: F-X-7, rule: "after \"Geri al\" works, the row's button is unmounted (status Gizli turns Etkin, or the row leaves the Gizli tab), so the focus falls to the page and only a toast tells the result (kosks-directory.tsx:255, :140). The same pattern as the medrese's Geri al (F-W2-10) and every row that leaves after an action. Fix: move the focus to the row's name link, or the next row's control, or the heading." }
  - { id: F-A-14, rule: "a busy button passes no loadingLabel, so its hidden <output> says \"Yükleniyor\" from a default in libs/ui/src/mds/button.tsx:62, outside the catalog; every \"Geri al\" button carries that empty <output> all the time." }
  - { id: F-X-5, rule: "the toasts are Sonner's: the region is named by the library's English default (\"Notifications alt+T\") and polite, also for an error that stays until closed (\"Köşk geri alınamadı\"); the close button's name \"Kapat\" is a prop of the app's Toaster. The graph draws a toast as a status with no role (MDRS-233 for the close name)." }
  - { id: F-X-10, rule: "while the directory is read the page shows DirectorySkeleton, a plain <div aria-busy=true> whose children are aria-hidden skeletons: the loading state is silent (directory-skeleton.tsx:6). Out of view in the graph, listed here because every tab, chip and text navigation passes through it only when the whole page streams again." }
  - { id: F-W3-open-1, rule: "the API lets a Medaris nazımı who holds platform.kosk_create open a köşk (POST /kosks), and the seeded one holds it, yet this page gives \"Köşk aç\" to the başnazım alone (`chief`, kosks-directory.tsx:293; F-X-12): the Medaris nazımı reads the same list with no way to the form. The finding is nizam.kosks.open's; here it is the viewer `medaris` without the button, drawn." }
  - { id: F-5, rule: "related, not on this page: a hidden köşk can still be followed (POST /kosks/<id>/follow answers 201, ledger/security.md, seen by tedris.discover.followKosk). This directory has no follow control and its footnote says only that a hidden köşk leaves the lists talebe and visitors see; the list is where the başnazım and the köşk's nazımları learn which köşks are hidden and bring one back, so a hidden köşk that keeps its followers is one of the things \"Geri al\" restores." }
  - { id: KBROWSE-1, rule: "new: a page past the last (?sayfa=99999, a stale bookmark or a link from before köşks were removed) draws the table's one line \"Sonuç yok\" and no pager: the pager is drawn when the total is more than one page, and the total is the whole list's, which fits on one page (kosks-directory.tsx:382), so there is no \"Önceki\" to go back with. Seen with a GET: the API answers 200 with no rows, total 2, page 99999, and the served page holds the one line and no pager. The tab, the chip or the search resets to page 1; nothing says so. Not drawn (only a typed address reaches it). Fix: draw the pager when the page is above 1, or send the person to the last page." }
  - { id: KBROWSE-2, rule: "new: a page number too large to be a number (?sayfa=100000000000000000000) is sent to tedrisat as it is and answers 500 INTERNAL_ERROR (the OFFSET overflows): GET /kosks/directory?page=100000000000000000000&limit=12 was seen to answer 500 as the başnazım, and the served page then holds the box (role=alert) and no tab numbers. The page then draws \"Köşkler yüklenemedi\" with \"Yeniden dene\", a retry that can never work at that address, and the domain lists no such refusal (only HTTP_400). It is also how the graph makes the box walkable on the stack. Fix: clamp the page in filtersFromParams and answer 400 (not 500) for an out-of-range page in the controller." }
  - { id: KBROWSE-3, rule: "new: the tab numbers are the viewer's whole scope, whatever the chip and the text leave (statusCounts takes only the scope, kosk-admin.repository.ts:251; the domain says so), so \"Gizli 1\" can sit over a table that says \"Sonuç yok\" for Listelenen, and the numbers do not change when a text is typed. The same finding as MBROWSE-2 of Medreseler. Fix: say how many rows fit in the status line of F-W3-12, or count by the chip and the text." }
  - { id: KBROWSE-4, rule: "new: when the page's second read, GET /me, fails (page.tsx:35, getMe returns null), `chief` is false and `viewerId` null, so the başnazım loses \"Köşk aç\" and the Arşiv link and a köşk nazımı loses \"Siz\" and the block of taught courses, and nothing says the read failed (kosks-directory.tsx:293, :308). Not drawn and not walkable on the stack. Fix: keep the failure visible, or hide nothing." }
