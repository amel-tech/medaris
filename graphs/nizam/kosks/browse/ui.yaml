  tabAllCount: { type: text, component: Text, text: { key: composed.KoskDirectory.count }, in: [listed, restoring, emptyFilter, emptyAll], source: libs/ui/src/mds/tabs.tsx:67 } # the number of köşks in that state in the viewer's whole scope, whatever the chip and the text leave (KBROWSE-3); not drawn when the read failed
  tabActiveCount: { type: text, component: Text, text: { key: composed.KoskDirectory.count }, in: [listed, restoring, emptyFilter, emptyAll], source: libs/ui/src/mds/tabs.tsx:67 }
