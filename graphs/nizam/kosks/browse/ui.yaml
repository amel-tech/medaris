# The screens of nizam.kosks.browse: nizam-web's Köşkler (/kosks, app/kosks/page.tsx) as the başnazım, a Medaris nazımı who holds a köşk
# permission and a köşk nazımı meet it: the page (features/kosks/components/kosks-directory.tsx) with its header, the tabs and their numbers,
# the search box, the Görünürlük chips, the table with its rows, its one empty line and its pager, the box that says the list could not be
# read, the toasts of "Geri al" and the block of courses the viewer teaches elsewhere (taught-courses.tsx). The dialog "Köşk aç" is
# nizam.kosks.open's; the shell around the page (sidebar, person row, bell, skip link) is nizam.shell.menuPerPersona's. Read from the code on
# 16 Nov 2026; nothing was opened in a browser, but the HTML nizam-web serves for /kosks was read as the başnazım, the Medaris nazımı, the köşk
# nazımı and the talebe (the roles, names and data-labels the locators use).
#
# Words: every `KoskDirectory.*`, `HideLevel.locked` and `KosksPage.taught*` key is copied by script from libs/i18n/src/locales/tr/nizam.json
# (the app reads them as `nizam.KoskDirectory`, `nizam.HideLevel`, `nizam.KosksPage`), the key being the path inside that file;
# `common.toast.close` from common.json. The `composed.*` keys are NOT in any i18n file: they are texts the app builds in code from data,
# written here with their placeholders. No node names `params`: a row's name, its short name, its nazımları, its course count, a tab's number,
# a taught course's title, the "n / n" of the pager and the name inside a toast or a button's label are data, one text per row, so the sample
# below serves the check and the page, and the binding gives each of these nodes a locator of its own (locators.binding.yaml):
#   composed.KoskDirectory.name        a köşk's name, in <bdi> (kosks-directory.tsx:169)
#   composed.KoskDirectory.handle      "@" and its short name, in <bdi dir=ltr> (handleLabel, admin-present.ts; :177)
#   composed.KoskDirectory.nazims      the nazımları's names joined "A ve B" with Intl.ListFormat, in <bdi> (nazimNames; :195)
#   composed.KoskDirectory.courses     the number of the köşk's courses, every one (:207)
#   composed.KoskDirectory.count       a tab's number, a <span class=mds-tab__count> formatted for the page's language (tabs.tsx:67)
#   composed.KoskDirectory.courseTitle a taught course's title (taught-courses.tsx:30)
# "<tarih>’den beri" is the catalog's `since` with a date the page spells in the Turkish ablative (dateWithCase): matched by any text.
# `Changes.note` is the one entry not copied from the app: the app says only "Köşk geri alındı" / "<ad> yeniden listelerde." in a toast, and
# nothing of what else follows, so one short factual Turkish note was written (what comes back, what stays, the audit row).
# The table is Table responsive="stack": the table, its rows and its cells carry explicit roles and each cell a data-label, and the caption
# that names it is visually hidden (libs/ui/src/mds/table.tsx:94-132). The row's first cell is a <th scope=row> (a rowheader); it is not drawn
# as a node of its own, since its name is the whole cell (the link, the badge and the short name). The tab panel (role tabpanel), the
# aria-busy the panel's wrapper carries while a read is pending, and the cover swatch of a row are not drawn.
# Samples are invented and neutral.
