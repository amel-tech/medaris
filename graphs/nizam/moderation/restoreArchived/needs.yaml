# What must exist for the köşk's nazımı (and the başnazım) to read what was hidden and bring it back: the flow's product list (LAYOUT.md section 7). Each need is what the product must do, from the
# flow's story and what the e2e and the findings ask, not from what the page does today; the known gaps go to graphs/needs.gaps.yaml, which the orchestrator merges. Read by people for now: no
# checker runs on this file.
#
# Missing (no code): focus-follows-a-restore, every-row-is-reachable, the-type-filter-offers-only-what-can-list, a-flipped-row-names-the-real-level, every-refusal-has-turkish-words,
#   a-hidden-parent-is-named.
# Unwalked (code, and neither an e2e check nor a replay scenario that can drive it): a-failed-read-is-told-and-retried (the stack cannot make a read fail), the refusals ARCHIVE_FORBIDDEN and
#   COURSE_NOT_FOUND of a restore (inside a-stale-restore-says-why: nothing on the stack makes the caller act at no level on a row he is shown), the refused page itself (archive#6 is
#   nizam.shell.noAccessAndNotFound's), and the platform's "Daha fazla göster" and scope filter (archive#7, nizam.moderation.deleteArchived's).
# Nothing was replayed when this file was written (the first walks are a later phase), so every `replay:` below names the scenario that will walk it, not one that passed.
kind: needs
flow: nizam.moderation.restoreArchived
status: proposed

needs:
  - id: the-arsiv-lists-what-is-hidden
    need: >-
      The köşk's nazımı reads what was hidden in his köşk (its courses, weeks, sessions and decks, and what was hidden in the medrese courses it hosts), newest first, each row saying what it is, where it
      sat, who hid it with their role and when, in his own time zone, under a count; and only his köşk's, never another's. The başnazım reads the same for the whole platform, with the köşk and the
      medrese of each row. Nothing hidden is ever deleted by this page.
    drawn: [listed, archivePage, archiveTitle, introKosk, introPlatform, archiveTableKosk, archiveTablePlatform, rowTitle, rowContext, rowType, rowKosk, rowHider, rowHiderRole, rowWhen, archiveCount]
    built:
      - action: medaris.api:listKoskArchive
      - action: medaris.api:listPlatformArchive
      - route: apps/nizam/features/archive/components/archive-view.tsx:475
    walked:
      - e2e: apps/nizam/e2e/archive.e2e.ts
        check: 'archive#1'
      - replay: kosk
      - replay: platform

  - id: narrow-by-type-or-search
    need: >-
      The list can be narrowed by the kind of thing (course, week, session, deck) and by a fragment of its title, and the count follows; a narrowing that leaves nothing says so, in words that tell it from
      an Arşiv that holds nothing.
    drawn: [typeSelect, searchField, archiveCount, filtering, filteringKosk, filteringPlatform, listEmpty, emptyPlain, emptyFiltered]
    built:
      - action: medaris.api:listKoskArchive
      - route: apps/nizam/features/archive/components/archive-view.tsx:154
    walked:
      - e2e: apps/nizam/e2e/archive.e2e.ts
        check: 'archive#2'
      - replay: kosk
      - replay: empty

  - id: restore-brings-it-back-and-the-row-leaves
    need: >-
      "Geri al" brings an item back where it was, at once and with no question, because it gives something back and deletes nothing; the row leaves the list, the count follows, a toast says so, and the
      item is shown again in the places that list it (a course on the köşk's page and in the talebe's course list). Who restored it is on the audit record.
    drawn: [restoring, restoreButton, rowRestore, restoreBusy, toastRestored, toastRestoredBody, archiveCount]
    built:
      - action: medaris.api:restoreArchiveItem
      - route: apps/nizam/features/archive/components/archive-view.tsx:166
    walked:
      - e2e: apps/nizam/e2e/archive.e2e.ts
        check: 'archive#3'
      - replay: kosk
      - replay: platform

  - id: a-week-or-a-session-comes-back-too
    need: >-
      A session and a week come back like a course: the session to its week, the week to the course's programme with the sessions that were hidden with it at the same instant, and not one hidden on
      its own earlier.
    drawn: [restoreButton, rowType, restoring]
    built:
      - action: medaris.api:restoreArchiveItem
      - route: apps/tedrisat/src/archive/archive.repository.ts:514
    walked:
      - e2e: apps/nizam/e2e/archive.e2e.ts
        check: 'archive#4'
      - replay: session
      - replay: week

  - id: a-higher-kademe-keeps-what-it-hid
    need: >-
      What a higher kademe hid is not offered to a lower one: the row has a sentence that names the kademe in the button's place, so no button leads to a refusal. The başnazım, who acts at the highest
      kademe, finds a button on every row.
    drawn: [lockedAdmin, restoreButton]
    built:
      - action: medaris.api:listKoskArchive
      - route: apps/nizam/features/archive/components/archive-view.tsx:348
    walked:
      - replay: kosk # the sentence of the course the başnazım hid, and the API's `canRestore: false` for it
      - replay: platform # a button on every row

  - id: a-stale-restore-says-why
    need: >-
      When the item was brought back by someone else, or a higher kademe hid it again, since the list was read, the press is refused and the person is told plainly which, and the list shows the truth
      (the row gone, or the row a sentence that names the kademe that really hid it).
    drawn: [toastRestoreFailed, toastRestoreGone, toastRestoreLevel, lockedStale, settled]
    built:
      - action: medaris.api:restoreArchiveItem
      - route: apps/nizam/features/archive/present.ts:217
    walked:
      - replay: stale # FAIL.gone and FAIL.level; ARCHIVE_FORBIDDEN and COURSE_NOT_FOUND are unwalked: nothing on the stack makes them

  - id: a-hidden-parent-blocks-a-restore
    need: >-
      A course whose medrese is still hidden is not brought back by itself: the press is refused and nothing changes; the course returns with its medrese.
    drawn: [toastParentHidden, restoring]
    built:
      - action: medaris.api:restoreArchiveItem
      - route: apps/tedrisat/src/archive/restore-course.ts:52
    walked:
      - replay: parentHidden

  - id: the-arsiv-is-reachable-from-the-kosk-pages
    need: >-
      The köşk's Arşiv is one click from the köşk's menu and from the köşk's Dersler page, and the platform's from the başnazım's menu.
    drawn: [listed]
    built:
      - route: apps/nizam/lib/shell-nav.ts:253
      - route: apps/nizam/features/kosks/components/kosk-courses-view.tsx:161
    walked:
      - e2e: apps/nizam/e2e/archive.e2e.ts
        check: 'archive#5'
      - replay: fromCourses
      - replay: kosk
      - replay: platform

  - id: the-platform-archive-is-the-basnazims-alone
    need: >-
      Only the başnazım reads the platform's Arşiv, and a köşk's nazımı reads his own köşk's and no other's; anyone else is told they have no access.
    drawn: [refused]
    built:
      - action: medaris.api:listPlatformArchive
      - action: medaris.api:listKoskArchive
    walked:
      - e2e: apps/nizam/e2e/archive.e2e.ts
        check: 'archive#6' # carried by nizam.shell.noAccessAndNotFound, which owns the refusal screen

  - id: a-failed-read-is-told-and-retried
    need: >-
      When the Arşiv cannot be read the person is told so in place of the table, can try again, and the filters stay; a filter that cannot be read is told too.
    drawn: [loadFailed, failedAlert, failedBody, retryButton, toastLoadFailed]
    built:
      - route: apps/nizam/features/archive/components/archive-view.tsx:456
    walked: []
    # unwalked: the stack cannot make a read fail

  - id: focus-follows-a-restore
    need: >-
      After a restore the focus lands on a place a keyboard or screen-reader user can use (the next row's "Geri al" or the table's caption), and a line on the page, not only a toast of six seconds,
      says what was done (F-W5-5, F-X-7).
    drawn: [listed, toastRestored]
    missing: none # no issue: the pressed button leaves with its row and nothing moves the focus

  - id: every-row-is-reachable
    need: >-
      A köşk's Arşiv with more than 50 hidden rows lets the person reach every one of them, and says how many it shows of how many (RESTORE-1, decision D3).
    drawn: [listed, archiveCount, archiveShown]
    missing: none # no issue: the köşk's list reads 50 rows and draws no "Daha fazla göster"

  - id: the-type-filter-offers-only-what-can-list
    need: >-
      The "Tür" select offers only the kinds the API can put in the Arşiv; "Ders kaydı" (and "Medrese" on the platform) are left out until a recording or a medrese can be hidden into it (RESTORE-3,
      decision D1).
    drawn: [typeSelect, listEmpty, emptyFiltered]
    missing: none # no issue: the select names kinds nothing is stored for (archive-types.ts:8-11)

  - id: a-flipped-row-names-the-real-level
    need: >-
      A row turned to a sentence because a higher kademe hid it again says which kademe hid it now, not the one it had when the list was read (RESTORE-2).
    drawn: [lockedStale, toastRestoreLevel]
    missing: none # no issue: the sentence is built from the stale `hiddenLevel` (archive-view.tsx:187-192, 361-365)

  - id: every-refusal-has-turkish-words
    need: >-
      Every refusal of a restore is told in a Turkish sentence of the app's own, never the API's English message, and ARCHIVE_FORBIDDEN is not told as "a higher kademe hid it" (RESTORE-4).
    drawn: [toastRestoreRaw, toastRestoreLevel]
    missing: none # no issue: restoreErrorKey has no sentence for COURSE_NOT_FOUND or the 400s (present.ts:217-229)

  - id: a-hidden-parent-is-named
    need: >-
      When a restore is refused because the medrese or köşk it belongs to is hidden, the page names that parent and the kademe that brings it back, and marks the row as waiting for it, instead of
      leaving a button that is refused again (RESTORE-5, decision D2).
    drawn: [toastParentHidden, restoreButton]
    missing: none # no issue: ArchivePage.restoreParentHidden names nothing and the row keeps its button
