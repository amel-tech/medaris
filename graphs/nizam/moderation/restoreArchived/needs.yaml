schema: delurio-graph/0
kind: needs
id: nizam.moderation.restoreArchived
status: proposed
summary: >-
  What must exist for the köşk's nazımı (and the başnazım) to read what was hidden and bring it back: the flow's product list.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# Missing (no code): focus-follows-a-restore, every-row-is-reachable, the-type-filter-offers-only-what-can-list, a-flipped-row-names-the-real-level, every-refusal-has-turkish-words,
# a-hidden-parent-is-named.
# Unwalked (code, and neither an e2e check nor a replay scenario that can drive it): a-failed-read-is-told-and-retried (the stack cannot make a read fail), the refusals ARCHIVE_FORBIDDEN and
# COURSE_NOT_FOUND of a restore (inside a-stale-restore-says-why: nothing on the stack makes the caller act at no level on a row he is shown), the refused page itself (archive#6 is
# nizam.shell.noAccessAndNotFound's), and the platform's "Daha fazla göster" and scope filter (archive#7, nizam.moderation.deleteArchived's).
# Nothing was replayed when this file was written (the first walks are a later phase), so every `replay:` below names the scenario that will walk it, not one that passed.

needs:
  - id: the-arsiv-lists-what-is-hidden
    need: >-
      The köşk's nazımı reads what was hidden in his köşk (its courses, weeks, sessions and decks, and what was hidden in the
      medrese courses it hosts), newest first, each row saying what it is, where it sat, who hid it with their role and when, in
      his own time zone, under a count; and only his köşk's, never another's. The başnazım reads the same for the whole platform,
      with the köşk and the medrese of each row. Nothing hidden is ever deleted by this page.
    evidence:
      - state: listed
      - node: archivePage
      - node: archiveTitle
      - node: introKosk
      - node: introPlatform
      - node: archiveTableKosk
      - node: archiveTablePlatform
      - node: rowTitle
      - node: rowContext
      - node: rowType
      - node: rowKosk
      - node: rowHider
      - node: rowHiderRole
      - node: rowWhen
      - node: archiveCount
      - source: apps/tedrisat/src/archive/archive.controller.ts:103
      - source: apps/tedrisat/src/archive/archive.controller.ts:191
      - source: apps/nizam/features/archive/components/archive-view.tsx:475
      - test: apps/nizam/e2e/archive.e2e.ts
        name: "nizam/28 — the köşk archive lists what is hidden, by type, who and when, and only this köşk's"
      - scenario: kosk
      - scenario: platform
        binding: graphs/nizam/moderation/restoreArchived/binding.platform.yaml

  - id: narrow-by-type-or-search
    need: >-
      The list can be narrowed by the kind of thing (course, week, session, deck) and by a fragment of its title, and the count
      follows; a narrowing that leaves nothing says so, in words that tell it from an Arşiv that holds nothing.
    evidence:
      - node: typeSelect
      - node: searchField
      - node: archiveCount
      - state: filtering
      - state: filteringKosk
      - state: filteringPlatform
      - state: listEmpty
      - node: emptyPlain
      - node: emptyFiltered
      - source: apps/tedrisat/src/archive/archive.controller.ts:103
      - source: apps/nizam/features/archive/components/archive-view.tsx:154
      - test: apps/nizam/e2e/archive.e2e.ts
        name: "nizam/28 — the type filter narrows the list and the count follows"
      - scenario: kosk
      - scenario: empty
        binding: graphs/nizam/moderation/restoreArchived/binding.empty.yaml

  - id: restore-brings-it-back-and-the-row-leaves
    need: >-
      "Geri al" brings an item back where it was, at once and with no question, because it gives something back and deletes
      nothing; the row leaves the list, the count follows, a toast says so, and the item is shown again in the places that list it
      (a course on the köşk's page and in the talebe's course list). Who restored it is on the audit record.
    evidence:
      - state: restoring
      - node: restoreButton
      - node: rowRestore
      - node: restoreBusy
      - node: toastRestored
      - node: toastRestoredBody
      - node: archiveCount
      - source: apps/tedrisat/src/archive/archive.controller.ts:246
      - source: apps/nizam/features/archive/components/archive-view.tsx:166
      - test: apps/nizam/e2e/archive.e2e.ts
        name: "nizam/28 — 'Geri al' brings the course back and takes the row out of the list"
      - scenario: kosk
      - scenario: platform
        binding: graphs/nizam/moderation/restoreArchived/binding.platform.yaml

  - id: a-week-or-a-session-comes-back-too
    need: >-
      A session and a week come back like a course: the session to its week, the week to the course's programme with the sessions
      that were hidden with it at the same instant, and not one hidden on its own earlier.
    evidence:
      - node: restoreButton
      - node: rowType
      - state: restoring
      - source: apps/tedrisat/src/archive/archive.controller.ts:246
      - source: apps/tedrisat/src/archive/archive.repository.ts:515
      - test: apps/nizam/e2e/archive.e2e.ts
        name: "nizam/28 — a session and a week come back too"
      - scenario: session
        binding: graphs/nizam/moderation/restoreArchived/binding.session.yaml
      - scenario: week
        binding: graphs/nizam/moderation/restoreArchived/binding.week.yaml

  - id: a-higher-kademe-keeps-what-it-hid
    need: >-
      What a higher kademe hid is not offered to a lower one: the row has a sentence that names the kademe in the button's place,
      so no button leads to a refusal. The başnazım, who acts at the highest kademe, finds a button on every row.
    evidence:
      - node: lockedAdmin
      - node: restoreButton
      - source: apps/tedrisat/src/archive/archive.controller.ts:103
      - source: apps/nizam/features/archive/components/archive-view.tsx:348
      - scenario: kosk
      - scenario: platform
        binding: graphs/nizam/moderation/restoreArchived/binding.platform.yaml
    note: |-
      kosk: the sentence of the course the başnazım hid, and the API's `canRestore: false` for it
      platform: a button on every row

  - id: a-stale-restore-says-why
    need: >-
      When the item was brought back by someone else, or a higher kademe hid it again, since the list was read, the press is
      refused and the person is told plainly which, and the list shows the truth (the row gone, or the row a sentence that names
      the kademe that really hid it).
    evidence:
      - node: toastRestoreFailed
      - node: toastRestoreGone
      - node: toastRestoreLevel
      - node: lockedStale
      - state: settled
      - source: apps/tedrisat/src/archive/archive.controller.ts:246
      - source: apps/nizam/features/archive/present.ts:217
      - scenario: stale
        binding: graphs/nizam/moderation/restoreArchived/binding.stale.yaml
    note: "stale: FAIL.gone and FAIL.level; ARCHIVE_FORBIDDEN and COURSE_NOT_FOUND are unwalked: nothing on the stack makes them"

  - id: a-hidden-parent-blocks-a-restore
    need: >-
      A course whose medrese is still hidden is not brought back by itself: the press is refused and nothing changes; the course
      returns with its medrese.
    evidence:
      - node: toastParentHidden
      - state: restoring
      - source: apps/tedrisat/src/archive/archive.controller.ts:246
      - source: apps/tedrisat/src/archive/restore-course.ts:52
      - scenario: parentHidden
        binding: graphs/nizam/moderation/restoreArchived/binding.parentHidden.yaml

  - id: the-arsiv-is-reachable-from-the-kosk-pages
    need: >-
      The köşk's Arşiv is one click from the köşk's menu and from the köşk's Dersler page, and the platform's from the başnazım's
      menu.
    evidence:
      - state: listed
      - source: apps/nizam/lib/shell-nav.ts:253
      - source: apps/nizam/features/kosks/components/kosk-courses-view.tsx:161
      - test: apps/nizam/e2e/archive.e2e.ts
        name: "nizam/28 — the köşk page links to the archive for its nazım"
      - scenario: fromCourses
        binding: graphs/nizam/moderation/restoreArchived/binding.fromCourses.yaml
      - scenario: kosk
      - scenario: platform
        binding: graphs/nizam/moderation/restoreArchived/binding.platform.yaml

  - id: the-platform-archive-is-the-basnazims-alone
    need: >-
      Only the başnazım reads the platform's Arşiv, and a köşk's nazımı reads his own köşk's and no other's; anyone else is told
      they have no access.
    evidence:
      - state: refused
      - source: apps/tedrisat/src/archive/archive.controller.ts:191
      - source: apps/tedrisat/src/archive/archive.controller.ts:103
      - test: apps/nizam/e2e/archive.e2e.ts
        name: "nizam/28 and 29 — a köşk nazım is refused the platform archive and another köşk's archive"
    note: "archive#6: carried by nizam.shell.noAccessAndNotFound, which owns the refusal screen"

  - id: a-failed-read-is-told-and-retried
    need: >-
      When the Arşiv cannot be read the person is told so in place of the table, can try again, and the filters stay; a filter
      that cannot be read is told too.
    evidence:
      - state: loadFailed
      - node: failedAlert
      - node: failedBody
      - node: retryButton
      - node: toastLoadFailed
      - source: apps/nizam/features/archive/components/archive-view.tsx:456
    note: "unwalked: the stack cannot make a read fail"

  - id: focus-follows-a-restore
    need: >-
      After a restore the focus lands on a place a keyboard or screen-reader user can use (the next row's "Geri al" or the table's
      caption), and a line on the page, not only a toast of six seconds, says what was done (F-W5-5, F-X-7).
    missing: "no issue: the pressed button leaves with its row and nothing moves the focus"
    note: >-
      Drawn on the state listed and on the node toastRestored, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: every-row-is-reachable
    need: >-
      A köşk's Arşiv with more than 50 hidden rows lets the person reach every one of them, and says how many it shows of how many
      (RESTORE-1, decision D3).
    missing: "no issue: the köşk's list reads 50 rows and draws no \"Daha fazla göster\""
    note: >-
      Drawn on the state listed and on the nodes archiveCount and archiveShown, which the code has: they are not evidence, so that
      a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: the-type-filter-offers-only-what-can-list
    need: >-
      The "Tür" select offers only the kinds the API can put in the Arşiv; "Ders kaydı" (and "Medrese" on the platform) are left
      out until a recording or a medrese can be hidden into it (RESTORE-3, decision D1).
    missing: "no issue: the select names kinds nothing is stored for (archive-types.ts:8-11)"
    note: >-
      Drawn on the state listEmpty and on the nodes typeSelect and emptyFiltered, which the code has: they are not evidence, so
      that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-flipped-row-names-the-real-level
    need: >-
      A row turned to a sentence because a higher kademe hid it again says which kademe hid it now, not the one it had when the
      list was read (RESTORE-2).
    missing: "no issue: the sentence is built from the stale `hiddenLevel` (archive-view.tsx:187-192, 361-365)"
    note: >-
      Drawn on the nodes lockedStale and toastRestoreLevel, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: every-refusal-has-turkish-words
    need: >-
      Every refusal of a restore is told in a Turkish sentence of the app's own, never the API's English message, and
      ARCHIVE_FORBIDDEN is not told as "a higher kademe hid it" (RESTORE-4).
    missing: "no issue: restoreErrorKey has no sentence for COURSE_NOT_FOUND or the 400s (present.ts:217-229)"
    note: >-
      Drawn on the nodes toastRestoreRaw and toastRestoreLevel, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-hidden-parent-is-named
    need: >-
      When a restore is refused because the medrese or köşk it belongs to is hidden, the page names that parent and the kademe
      that brings it back, and marks the row as waiting for it, instead of leaving a button that is refused again (RESTORE-5,
      decision D2).
    missing: "no issue: ArchivePage.restoreParentHidden names nothing and the row keeps its button"
    note: >-
      Drawn on the nodes toastParentHidden and restoreButton, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).
