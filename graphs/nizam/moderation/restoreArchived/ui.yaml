# The screens of nizam.moderation.restoreArchived: the köşk's Arşiv (/kosks/<id>/arsiv) and the platform's (/arsiv), one component (ArchiveView, mode kosk or platform), with their
# filters, count, table, "Geri al", the sentences that stand where a higher kademe's rows have no button, the in-place error and the toasts that answer a restore. Read from the code of
# the branch (the tree of PR #394) on 16 Nov 2026: apps/nizam/features/archive/components/archive-view.tsx and its present.ts, hide-level.ts, reads.ts, actions.ts, apps/nizam/app/
# {arsiv,kosks/[id]/arsiv}/page.tsx, and libs/ui/src/mds (table, select, button, alert). Nothing was seen in a browser by its writer: every behaviour is "from the code" unless a rule
# says otherwise.
#
# What this file leaves to its neighbours (flow.yaml `scope.outOfView` names them): the confirmation window of "Kalıcı olarak sil" and the platform's scope filter in use and
# "Daha fazla göster" (nizam.moderation.deleteArchived), the column headers, the loading page, and the screen that refuses a person (nizam.shell.noAccessAndNotFound).
#
# Words: every key that has no `composed.` prefix is copied letter for letter from libs/i18n/src/locales/tr/nizam.json (the file the app reads as `nizam`; the key is the path under
# its root) by <scratchpad>/ra/catalog.py. The `changes` note is the app's own sentence on what a restore does and where each kind comes back to (ArchivePage.footer, drawn under the
# köşk's list), so no message is authored for this catalog. The `composed.*` keys are text the app builds in code from data and messages; each has its code line here, and a
# placeholder the binding gives no sample for matches any text:
#   composed.ArchivePage.rowTitle       "{title}"      a row's title, in a <bdi> (archive-view.tsx:276)
#   composed.ArchivePage.rowContext     "{context}"    the grey line under it: "2 hafta · 0 talebe" for a course, "Hafta 2 · <course>" for a week, "Hafta 1 · <course> · 17 Kas Sal 21:00" for a
#                                                      session; on the platform the kind's word comes first, "Ders · 2 hafta · 0 talebe" (archive-view.tsx:271-279, present.ts:100-139)
#   composed.ArchivePage.rowHider       "{hider}"      the hider's name, or "Bilinmiyor" (archive-view.tsx:326, present.ts:232-241)
#   composed.ArchivePage.rowHiderRole   "{role}"       the role line under the name: "Köşk nazımı", "Başmüderris", ...; none for the başnazım, who holds no role in a köşk (archive-view.tsx:327)
#   composed.ArchivePage.rowWhen        "{when}"       "Bugün 14:05", "Dün 10:40" or "29 Eyl 10:40" in the viewer's own zone (present.ts:51-74)
#   composed.ArchivePage.rowKosk        "{koskName}"   the platform's column "Kapsam": the köşk's name and, under it, the medrese's (archive-view.tsx:298-301)
#   composed.ArchivePage.rowMadrasah    "{madrasahName}"
#   composed.HideLevel.lockedKosk       HideLevel.locked with HideLevel.kosk put in: "Bunu köşk nazımı gizledi; yalnız o kademe ya da üstü geri alabilir." (archive-view.tsx:361-365)
#   composed.HideLevel.lockedPlatform   the same with HideLevel.platform: "Bunu Medaris yönetimi gizledi; ..."
#   composed.ArchivePage.restoreRaw     "{message}"    the API's own message, in English, where no sentence is written for the code (archive-view.tsx:193-197; RESTORE-4)
#   composed.Button.loading             "Yükleniyor"   the busy button's hidden status, a default of the kit (libs/ui/src/mds/button.tsx:62; F-UI-W1-3)
