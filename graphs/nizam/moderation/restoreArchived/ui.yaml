rules:
  - { id: F-W5-5, rule: "After 'Geri al' the restored row leaves the table and the button that had the focus is unmounted with it (archive-view.tsx:174-181, the same for ARCHIVE_ITEM_NOT_FOUND at :183-186): the focus falls to the page, a keyboard or screen-reader user starts again from the top, and the only word that it worked is a toast of 6 seconds in sonner's own region. Not measured here. Fix: move the focus to the next row's 'Geri al' or to the table's caption, and keep a status line on the page." }
  - { id: F-X-7, rule: "The family of F-W5-5: rows that leave a list after an action in nizam (this table, the deck requests, the applications, the notifications). Fix: one shared move of the focus to the next row's control or the list's heading." }
  - { id: F-X-5, rule: "Two toast hosts are mounted (client-providers.tsx:42-51): the unified kit's and sonner's. This page uses sonner's (archive-view.tsx:10), whose live-region label is its own default and whose semantics were not read; the nodes are drawn as plain status text and the binding finds them by [data-sonner-toast]. Fix: converge on one host and take its labels from the catalog." }
  - { id: F-UI-W1-3, rule: "The busy 'Geri al' passes no loadingLabel, so its hidden status says 'Yükleniyor' from the kit's hard-coded default (libs/ui/src/mds/button.tsx:62), outside the catalog; and, because `loading` is always given (a boolean), an empty <output> sits beside every 'Geri al' (button.tsx:113). Turkish only today." }
  - { id: F-X-10, rule: "Not drawn. The loading pages (app/arsiv/loading.tsx, app/kosks/[id]/arsiv/loading.tsx) are an aria-busy div whose only children are aria-hidden skeletons: nothing is said while the Arşiv is read, and the in-page skeleton of a filter that reads an empty list has a visually hidden 'Yükleniyor' (archive-view.tsx:468-469) that the page-level one lacks. Fix: a visually hidden status text in the loading components." }
  - { id: RESTORE-1, rule: "New finding, from the code; not seen in a browser. The köşk's list reads 50 rows (KOSK_ARCHIVE_PAGE_SIZE, reads.ts:24; loadArchive asks the same limit) and draws no 'Daha fazla göster': the footer with the 'Toplam N öğe, M tanesi gösteriliyor' line and the button is `platform &&` (archive-view.tsx:485-500). A köşk with more than 50 hidden rows shows the count of all of them ('60 gizli öğe') and the first 50, and the rest can be reached only by narrowing the list with a type or a search. Fix: draw the same footer in the köşk's mode, or page by 10 as the platform does." }
  - { id: RESTORE-2, rule: "New finding, from the code; not seen in a browser. When a restore is refused with ARCHIVE_RESTORE_LEVEL (a higher kademe hid the item again since the list was read) the row is flipped by hand to `canRestore: false` and keeps the `hiddenLevel` it had (archive-view.tsx:187-192), so its sentence is built from the old level: 'Bunu köşk nazımı gizledi; yalnız o kademe ya da üstü geri alabilir.' (archive-view.tsx:361-365) is said to the köşk's nazımı himself, while the toast beside it says a higher kademe hid it. The error's own context carries the real level (`hiddenAt`, archive.service.ts:342) and is not used. Fix: take the level from the refusal, or read the list again." }
  - { id: RESTORE-3, rule: "New finding, from the code. The select 'Tür süzgeci' offers 'Ders kaydı' (and on the platform 'Medrese') but the API stores nothing for them: the köşk's archive lists no recording and a hidden medrese is not a row of any list (archive-types.ts:8-11, 48-54). Choosing one always ends in 'Bu süzgece uyan gizli öğe yok', which says no row fits and not that none can exist. The same drawing for a feature the API does not have as HIDE-2 of nazar.archive.hideAndRestoreCourse. Fix: leave the two out until something can be hidden into them." }
  - { id: RESTORE-4, rule: "New finding, from the code. A refusal with no message written for its code (COURSE_NOT_FOUND, the 400s, and a thrown error that authenticatedAction turns into its message) puts the API's own English text in the toast: restoreErrorKey returns null for them (present.ts:217-229) and the toast falls back to `result.error` (archive-view.tsx:193-197, getErrorMessage). ARCHIVE_FORBIDDEN is told with the sentence of ARCHIVE_RESTORE_LEVEL, 'daha üst bir kademe gizledi', though it means the caller acts at no level on the item. Fix: a Turkish sentence per code, and a generic one as the fallback." }
  - { id: RESTORE-5, rule: "New finding, from the code. ARCHIVE_PARENT_HIDDEN is told as 'Bağlı olduğu öğe hâlâ gizli; önce onu geri alın.' (ArchivePage.restoreParentHidden), which names neither the medrese or köşk that is hidden nor who may bring it back, and the row keeps its 'Geri al' (nothing is changed on it: archive-view.tsx:193-197). A köşk's nazımı meets it for a course of a medrese its başmüderris hid: he cannot bring a medrese back (that is the başmüderris's, or Medaris yönetimi's, on the medrese's own pages), and the same press is refused again. nazar-web's Arşiv says it better ('... Medreseyi, onu gizleyen kademe ya da üstü geri getirir.'). Fix: name the parent and the kademe that restores it, and mark the row as waiting for it." }
  - { id: focus-not-set, rule: "Neither page sets a focus on load, so the page nodes carry no initialFocus and no focus; after a filter the select (which Base UI gives back its focus) and the search box keep theirs, which the graph does not say. The replay checks no focus on these states." }
  - { id: no-confirmation-before-a-restore, rule: "'Geri al' asks nothing: the page draws no dialog, because a restore gives a thing back and deletes nothing, and the audit log records who did it (`<type>.restore`). The one irreversible step of this page, 'Kalıcı olarak sil', does ask, in nizam.moderation.deleteArchived." }
  - { id: label-in-name, rule: "'Geri al' is contained in the name 'Geri al: <title>, <grey line>' (WCAG 2.5.3): the name carries the row's title and its context, so two rows with the same title are told apart by the line after it. Holds." }
  - { id: no-button-leads-to-a-refusal, rule: "A row the caller's kademe does not reach has a sentence in the button's place, never a button that will be refused (MDRS-108); the list's `canRestore` says it. It holds for the list as it was read: a hide that lands later is told by the refusal, and turns the row to a sentence by hand (RESTORE-2)." }
