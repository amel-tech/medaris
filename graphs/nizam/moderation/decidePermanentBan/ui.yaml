  page: { type: page, component: Page, role: main, in: [unreadable, empty, loadingTab, waitingDetail, decidedDetail], source: libs/ui/src/mds/app-shell.tsx:41 } # <main id="main">: no name, no initialFocus
  title: { type: text, component: Heading, role: heading, text: { key: Shell.items.permanentBans }, in: [unreadable, empty, loadingTab, waitingDetail, decidedDetail] } # h1, the menu's own words
