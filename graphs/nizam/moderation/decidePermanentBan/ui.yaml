# PLANNED, NOT WALKABLE: the screens of nizam.moderation.decidePermanentBan, the page "Kalıcı yasak talepleri" (/talepler/kalici-yasak) that the
# menu already offers and no code answers. Drawn from the three Talepler pages beside it, which are code (apps/nizam/features/platform-admin
# applications-view.tsx, features/deck-review deck-requests-view.tsx and reject-dialog.tsx, features/appeals appeals-view.tsx), as read on
# 16 Nov 2026. Nothing here has a `source` except what exists today: the menu (apps/nizam/lib/shell-nav.ts and the shell's <nav> and <main>
# in libs/ui/src/mds/app-shell.tsx). The entry "Kalıcı yasak talepleri" exists and opens "Sayfa bulunamadı" (F-P0-4, F-X-11); the page it
# should open does not.
#
# Words. Existing messages are copied letter for letter from libs/i18n/src/locales/tr/nizam.json, each under its own key:
#   Shell.nav, Shell.groups.requests, Shell.items.permanentBans   the menu and the page's title
#   Dashboard.permanentBans.empty                                 "Bekleyen kalıcı yasak talebi yok." (the Medaris home's card, which exists)
#   AppealsPage.*                                                 the neighbour's tab names, badges, "Kabul et", "Reddet", "Tekrar dene", the
#                                                                 "Karar kaydedilemedi" toast title, two of its refusals and "Karar notu" (decisionNote)
#   BansPage.columns.*, BansPage.scope.COURSE, BansPage.platformOnly   the ban list's column names, "Ders", and "Bu yasağı yalnız Medaris yönetimi kaldırabilir."
#   DeckReject.*                                                  the shared reject dialog's close, cancel, submit, "zorunlu alan", the empty-reason line, and
#                                                                 its note label "Karar notu" (appeal.reasonLabel)
# New words are `planned.PermanentBans.*` (Turkish only, short, in the app's voice), listed for review in the report. Two are not copied:
#   planned.PermanentBans.row, rowDecided, personValue, scopeValue, bannedByValue, requestedByValue, decidedByValue, reasonValue, noteValue,
#   personName, count   text the page would build in code from data, as its neighbours do (their `composed.*`); here they are planned words
#                       because no code line exists to name.
#   Changes.note        the one message written for this graph, as CONVENTIONS asks (`changes` below): no app message says what the two
#                       decisions change. It is the only entry that is neither copied nor under planned.
# The {scope} of a row and of the detail is a value the page would fill from the ban: "Ders" (the ban list's BansPage.scope.COURSE) or
# "Medrese"; it is a datum like {place}, so it is in the samples and in no catalog key.
# The reject dialog is the shared RejectDialog in a sixth kind (the neighbours use request, proposal, application, courseRequest, appeal,
# unpublish): `planned.PermanentBans.reject.*` stand for that kind's title, body and help.
schema: delurio-graph/0
kind: ui
id: nizam.moderation.decidePermanentBan
flow: nizam.moderation.decidePermanentBan
status: proposed
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note } # the one authored message of this catalog
samples:
  name: Örnek Talebe
  email: ornek.talebe@medaris.test
  scope: Ders
  place: Örnek Akaid Dersi
  date: 16 Kas 10:00
  outcome: Reddedildi
  by: Esma Başmüderris
  role: Başmüderris
  when: 16 Kasım 2026 Pazartesi 10:00
  reason: Derste defalarca uyarıldığı hâlde başkalarının çalışmasını bozdu.
  note: Yasak yeterli görüldü; kalıcı yasağa gerek yok.
  count: "2"

# The page sets no focus of its own in its neighbours (APPDEC-5), and nothing is decided for this one: no `initialFocus` on the page and no
# node has `focus` after a step (rule focus-open). The two dialogs' own focus is drawn, as theirs is.
nodes:
  # ---- the menu entry: EXISTS (shell-nav.ts), the page behind it does not -----------------------------------------------------------------
  menuNav: { type: page, component: Page, role: navigation, name: { key: Shell.nav }, in: [menu], source: libs/ui/src/mds/app-shell.tsx:98 } # the sidebar's <nav>, or the phone sheet's
  sectionRequests: { type: text, component: Text, text: { key: Shell.groups.requests }, in: [menu], source: apps/nizam/lib/shell-nav.ts:102 } # a group label, "Talepler"
  navPermanentBans: { type: action, component: LinkButton, role: link, name: { key: Shell.items.permanentBans }, in: [menu], emits: OPEN, source: apps/nizam/lib/shell-nav.ts:122 } # the başnazım's, and a Medaris nazımı's who holds platform.ban_account; today it opens "Sayfa bulunamadı" (F-P0-4)

