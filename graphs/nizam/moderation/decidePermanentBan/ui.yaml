  loadFailedAlert: { type: alert, component: Alert, role: alert, name: { key: planned.PermanentBans.loadFailedTitle }, text: { key: planned.PermanentBans.loadFailed }, in: [unreadable] } # tone error: role alert, announced when it appears
  retryButton: { type: action, component: Button, role: button, intent: secondary, text: { key: AppealsPage.retry }, in: [unreadable], emits: RETRY }

