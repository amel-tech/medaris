rules:
  - { id: planned-page, rule: "PLANNED: the page does not exist; this ui is drawn from its three neighbours and says what they do, not what a page of this kind is proven to do. `status: proposed`, no binding, nothing walkable. Every word that is not copied from nizam.json is `planned.PermanentBans.*` or `Changes.note` and awaits review." }
  - { id: F-P0-4, rule: "The menu entry 'Kalıcı yasak talepleri' (lib/shell-nav.ts:122; ITEM_PERMISSIONS 'permanent-bans': platform.ban_account) opens 'Sayfa bulunamadı' today: no folder under app/talepler/kalici-yasak, and app/[...rest]/page.tsx:9 calls notFound(). This is the `menu` state of the flow; the page is what this ui draws. Fix: build the page (MDRS-140), or remove the entry until then (F-W3-10)." }
  - { id: F-X-11, rule: "The family of F-P0-4: two menu entries with no page (this one and /ayarlar/youtube)." }
  - { id: F-W1-15, rule: "The Medaris home's card 'Kalıcı yasak talepleri' always says 'Bekleyen kalıcı yasak talebi yok.' (medaris-home.tsx:147-152) because tedrisat sends a constant 0 for pendingTotals.permanentBanRequests. Once the page exists the card must count the waiting requests and link to it; its empty line is the words this page's empty state reuses. Not drawn here: nizam.home.medarisNazimCut." }
  - { id: PBAN-1, rule: "New, from the code (not run): the audit page has a type 'Kalıcı yasak talebi ve kararı' (AuditPage.types.PERMANENT_BAN) that matches the action key `permanent_ban.%` (apps/tedrisat/src/audit/audit-types.ts:57), and no code writes such a key: requestPermanentBan writes `ban.permanent_request` (ban.repository.ts:787), which the BAN rule `ban.%` (:51) takes. So the filter is empty today. The planned decision rows are named `permanent_ban.approve` and `permanent_ban.reject` to fill it; the request's own row would move to `permanent_ban.request` for the same reason (an open choice, since changing a key splits the history)." }
  - { id: platform-ban-account-widens, rule: "Design finding, not a bug: platform.ban_account is held today for READING bans (listAllBans, listKoskBans, the menu entry) and the code's own comment says it 'bans nothing yet' (apps/tedrisat/src/ban/ban-codes.ts:33-35). Asking it for the account-closing decision means every Medaris nazımı who holds it for reading gains the power to close any account when this ships. Either say so to the başnazım before release, or give the decision a code of its own." }
  - { id: tabs-need-a-panel, rule: "Proposed, not to repeat F-X-1 and F-W3-5: the neighbours' Tabs have no TabsPanel, so a tab switch changes the list and the detail with no announcement. This page is drawn with the same component (tabList, tabWaiting, tabDecided) and nothing else is decided; the fix is a TabsPanel around the list, or links." }
  - { id: focus-open, rule: "No focus is drawn: no `initialFocus` on the page and no `focus` after a step. The neighbours move none after a decision (APPDEC-5): the row and the pressed button leave and the focus falls to the page. Proposed for this page: move it to the next row, or to the tab list when none is left. Nothing is decided; both dialogs draw the focus their shared components give (reason field; Vazgeç on the alert dialog)." }
  - { id: no-reason-in-notices, rule: "Proposed, not to repeat TRIAGE-2: the notice that a request was filed names the person and the medrese and carries no reason; the reason is read on this page, behind platform.ban_account. A new request is announced to the holders of that code and to the başnazım only (TRIAGE-1 is that the başnazım is never told of a ban today)." }
  - { id: F-X-3, rule: "'Reddet' of the shared reject dialog is natively disabled while the note is blank and nothing ties the note to the button; leaving the field empty draws 'Bir gerekçe yazın.' as a plain line (no live region, no move of the focus). Drawn as the shared component does it." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Bekleyen' in 'Bekleyen 2', 'Kabul et', 'Reddet', 'Hesabı kapat'. Holds (WCAG 2.5.3)." }
