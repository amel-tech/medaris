  # ---- the detail of the selected request --------------------------------------------------------------------------------------------
  detailRegion: { type: page, component: Page, role: region, name: { labelledBy: detailTitle }, in: [waitingDetail, decidedDetail] }
  detailEyebrow: { type: text, component: Text, text: { key: planned.PermanentBans.detailEyebrow }, in: [waitingDetail, decidedDetail] }
  detailTitle: { type: text, component: Heading, role: heading, text: { key: planned.PermanentBans.personName, params: { name: request.person.name } }, in: [waitingDetail, decidedDetail] } # h2
