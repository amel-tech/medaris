# nizam.moderation.decideBan at the köşk's list: the one-click "Köşkten de yasakla" on a ban that someone lifted behind the page still goes
# through (NDB-2). It carries no ban id (createBan with the course, the person and the reason), so nothing asks whether the ban on the page is
# still open: the toast says "Köşkten de yasaklandı" and a köşk ban stands over a person whose course ban has been lifted.
#   flock <scratchpad>/replay.lock nice -n 10 node /home/taha/delurio-wt/medaris-engine/apps/engine/src/cli.ts replay graphs/nizam/moderation/decideBan \
#     --bind graphs/nizam/moderation/decideBan/binding.stale.yaml --main --absent --out <dir>
# NOT RUN (the owner's word: replays come once, at the end). It loads (`--emit-spec --out <dir>`).
#
# How the page is made stale: `before` on `listed` runs when the walk reaches the state, after the page has been read and drawn and before the
# walk presses anything: the köşk nazım lifts the newest ban through the API (helpers/kosk-bans.mjs lift --newest), and the page, which was read before,
# still draws its row and its button. The same scenario `given` as binding.yaml's `decides`, so it has a file of its own. This is what the code
# does, not what it should do (it should refuse with 409 BAN_ALREADY_LIFTED, as extendBan does).
schema: delurio-graph/0
kind: binding
extends: ./locators.binding.yaml
flow: nizam.moderation.decideBan

states:
  listed:
    url: '{nizam}/kosks/*/yasaklamalar'
    before:
      - run: [node, helpers/kosk-bans.mjs, lift, decideBan, --who, 'APPLICANT_C,APPLICANT_D,APPLICANT_E', --newest]
        expect: 'APPLICANT_'
  empty: { url: '{nizam}/kosks/*/yasaklamalar' }
  widening: { call: '{nizam}/kosks/*/yasaklamalar' }

# the köşk ban stands, and the course ban of the person it was widened from is the one lifted behind the page
effects:
  createBan:
    - run: [node, helpers/kosk-bans.mjs, check, decideBan, --who, '{who}', --has, KOSK open]
      expect: 'has:'
    - run: [node, helpers/kosk-bans.mjs, check, decideBan, --who, '{who}', --has, COURSE lifted]
      expect: 'has:'

scenarios:
  staleWiden:
    given: { viewer: kosk, read: ok, row: low, answer: done, after: more }
    as: koskNazim
    open: '{nizam}/kosks/{seed.kosk2}/yasaklamalar'
    setup:
      - run: [node, helpers/course.mjs, make, decideBan, --kosk, '{seed.kosk2}', --weeks, '1', --lessons, '1', --talebe, applicantC, applicantD, applicantE]
        expect: '"tag":"decideBan"'
      - run: [node, helpers/kosk-bans.mjs, up, decideBan, --low, 'APPLICANT_C,APPLICANT_D,APPLICANT_E']
        expect: 'ready: 3 open'
    teardown:
      - run: [node, helpers/kosk-bans.mjs, down, decideBan, --people, 'APPLICANT_C,APPLICANT_D,APPLICANT_E']
        expect: removed
      - run: [node, helpers/course.mjs, remove, decideBan]
        expect: 'course remove decideBan'
    vars:
      reasonText: Yeniden değerlendirildi
      who: 'APPLICANT_C,APPLICANT_D,APPLICANT_E'
      liftHas: 'COURSE lifted'
      widenHas: KOSK open
