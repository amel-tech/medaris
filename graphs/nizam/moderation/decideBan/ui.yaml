  liftReason: { type: field, component: TextField, role: textbox, text: { key: LiftDialog.reasonLabel }, value: { literal: "" }, in: [form, formReady, lifting, extending], when: "kind == 'lift'", source: apps/nizam/features/bans/components/lift-dialog.tsx:173 } # a textarea of 4 rows, 500 characters, `required`; it stays enabled while the call runs (the focus stays)
  liftHelp: { type: text, component: Text, text: { key: LiftDialog.reasonHelp }, in: [form, formReady, lifting, extending], when: "kind == 'lift' and not (state == 'form' and touched)", source: apps/nizam/features/bans/components/lift-dialog.tsx:170 }
  extendReason: { type: field, component: TextField, role: textbox, text: { key: ExtendDialog.reasonLabel }, value: { literal: "" }, in: [form, formReady, lifting, extending], when: "kind == 'extend'", source: apps/nizam/features/bans/components/extend-dialog.tsx:138 }
  extendHelp: { type: text, component: Text, text: { key: ExtendDialog.reasonHelp }, in: [form, formReady, lifting, extending], when: "kind == 'extend' and not (state == 'form' and touched)", source: apps/nizam/features/bans/components/extend-dialog.tsx:135 }
  reasonRequired: { type: text, component: Text, text: { key: LiftDialog.reasonRequired }, in: [form], when: touched, source: apps/nizam/features/bans/components/lift-dialog.tsx:171 } # replaces the help line; plain text, no live region, the focus is not moved (F-W5-4, F-X-2); ExtendDialog.reasonRequired is the same words
  cancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: LiftDialog.cancel }, in: [form, formReady, lifting, extending], emits: CANCEL, source: apps/nizam/features/bans/components/lift-dialog.tsx:111 } # present and doing nothing while the call runs (NDB-7); ExtendDialog.cancel is the same word
  liftSubmit: { type: action, component: Button, role: button, intent: confirm, text: { key: LiftDialog.submit }, in: [form, formReady, lifting, extending], when: "kind == 'lift'", disabledIn: [form, lifting], emits: SUBMIT, source: apps/nizam/features/bans/components/lift-dialog.tsx:112 } # natively disabled while the reason is blank (F-X-3); busy (aria-disabled, aria-busy) while the call runs
  extendSubmit: { type: action, component: Button, role: button, intent: confirm, text: { key: ExtendDialog.submit }, in: [form, formReady, lifting, extending], when: "kind == 'extend'", disabledIn: [form, extending], emits: SUBMIT, source: apps/nizam/features/bans/components/extend-dialog.tsx:103 }
