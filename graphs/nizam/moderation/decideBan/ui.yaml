# The screens of nizam.moderation.decideBan: Yasaklamalar of a köşk (/kosks/<id>/yasaklamalar) and the Medaris list (/yasaklamalar), the rows'
# buttons, the Kaldırılan tab, the lift dialog and the widening dialog, the one-click widening and its busy button, and the toasts of a
# decision. Read from apps/nizam/features/bans/components/{bans-view,all-bans-view,lift-dialog,extend-dialog}.tsx and present.ts on 16 Nov
# 2026; the words are copied from libs/i18n/src/locales/tr/nizam.json (namespaces BansPage, AllBansPage, LiftDialog, ExtendDialog) by
# <scratchpad>/nbdecide-probe/catalog.mjs. Where the two dialogs share a word under two keys (Kapat, Vazgeç, "zorunlu alan", "Bir gerekçe
# yazın."), the node uses the LiftDialog key and the same word is ExtendDialog's.
#
# Authored, not copied: `Changes.note`, the one message of this catalog no app message stands for (the two dialogs each say what their
# own decision changes, nothing says what the three decisions change together).
# Composed in code, in no i18n file (each named by its line):
#   composed.Bans.count               libs/ui/src/mds/tabs.tsx:67 and :112 (the count, formatted by Intl, in a <span> inside the tab)
#   composed.Button.loading           libs/ui/src/mds/button.tsx:62 (the default loadingLabel of a busy Button, F-X-17)
#   composed.LiftDialog.eyebrow       lift-dialog.tsx:105 (the course the ban sits on, over the title; extend-dialog.tsx:96 the same)
#   composed.LiftDialog.person        lift-dialog.tsx:122 (the person's name); composed.LiftDialog.email :126 (their address)
#   composed.LiftDialog.summaryScope  lift-dialog.tsx:139 (bans-view.tsx:126, all-bans-view.tsx:177: "Ders · {ders}", with the köşk's name on the Medaris list)
#   composed.LiftDialog.summaryBannedBy  lift-dialog.tsx:140 (bans-view.tsx:127-128: "{ad}, {rol}" then " · {zaman}")
#   composed.LiftDialog.summaryReason lift-dialog.tsx:141 (the ban's reason)
#   composed.Dialog.required          lift-dialog.tsx:166 and extend-dialog.tsx:131 ("* " before the catalog's "zorunlu alan")
#   composed.BansPage.lifter          bans-view.tsx:284 and all-bans-view.tsx:318 (the lifter's name in the Kaldıran cell)
#   composed.BansPage.liftReason      bans-view.tsx:286-288 (the reason typed in the lift dialog, under the lifter)
# A row's own cells (the person's name and address, the reason, the course's title, the banner's name) are data, not messages, and are
# not drawn; the day and the role of who placed it are messages ("Bugün 21:04", "Hoca", "Medaris yönetimi") and are.
# The page behind a dialog is inert, so no page node is `in` a dialog state. Where a node says "repeat" the page draws it once per row;
# a row in flight (the one-click widening) gets nodes of its own.
