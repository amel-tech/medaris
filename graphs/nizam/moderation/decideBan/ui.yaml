rules:
  - { id: ban-staff-check-gaps, rule: "SECURITY. The Medaris list's widening never asks who the person is. extendBan (apps/tedrisat/src/ban/ban.service.ts:270-312) does not call rolesHeld, which createBan (:155-163) calls to refuse a person who runs the course (RUNS_COURSE_ROLES, ban-tier.ts:66-72) with 400 BAN_TARGET_INVALID; the only BAN_TARGET_INVALID in extendBan (:278-280) means 'Only a course ban can be widened'. And naming a müderris, a başmüderris, a köşk nazım or a Medaris nazım never looks at open bans (only madrasah-nazir.service.ts:115 and course-nazir.service.ts:223 do, for a medrese nazır and a ders nazırı). So a ban placed on a talebe before they were named hoca stays open, offers 'Yasağı genişlet', and the API opens a köşk ban over them; the page then says '{name} artık {köşk} içindeki hiçbir derse başvuramaz.' of a person who teaches. The graph draws it (extending, answer done, row staff) and not the refusal the code lacks. The brief names escalateBan; that is nazar's widening to the medrese (nazar.bans.decide). nizam's two widenings are extendBan and createBan scope KOSK. Read from the code; the scenario `staff` of binding.all.yaml walks what it does today. Fix: run rolesHeld in extendBan and refuse with BAN_TARGET_INVALID (the page words it already), and refuse to name a person who holds an open ban to a post that cannot be barred." }
  - { id: NDB-1, rule: "SECURITY, the one-click widening is half-checked. createBan reads the person's roles with the scopes of THE BAN'S OWN course: {kosk, that course, that course's medrese} plus the platform (ban.service.ts:128-133, rolesHeld ban.repository.ts:273). So 'Köşkten de yasakla' refuses a hoca of this course (BAN_TARGET_INVALID, the scenario `staffKosk`) and bars from the whole köşk a person who is hoca of ANOTHER course of the same köşk, which the widening is meant to protect (a köşk ban covers every course, ban-covers-by-scope). SYSTEM_ADMIN is a realm role with no role_assignments row, so rolesHeld never finds the başnazım either (the domain's invariant). The same code serves the radio 'Köşkten de yasakla' of the roster's ban dialog (nizam.moderation.banStudent). Fix: read the roles of every course of the köşk before a KOSK ban, and the realm role." }
  - { id: NDB-2, rule: "The one-click widening carries no ban id (bans-view.tsx:137-162 sends courseId, userId, reason to createBan). So it cannot be 'already lifted': a ban someone lifted behind the page is widened all the same, the köşk ban stands, and the toast says 'Köşkten de yasaklandı' (ban.service.ts:122-183 never reads the ban the page showed; compare extendBan's BAN_ALREADY_LIFTED at :277). It reuses the course ban's reason, so the köşk ban says nothing of why it was widened (F-W5-1), and it writes the audit row `ban.create` where the dialog writes `ban.extend` (ban.repository.ts:309, chosen by extendedFromBanId, which only extendBan sets), so the audit trail cannot tell a widening from a new köşk ban. Fix: open the dialog the Medaris list has and call extendBan." }
  - { id: NDB-3, rule: "The lift dialog says '... {ad} bu derse yeniden başvurabilir.' (LiftDialog.info) and the toast '{ad} yeniden başvurabilir.' (liftedBody) of every ban. True of a course ban. Lifting a köşk ban leaves the course ban it was widened from standing (ban-widen-keeps-the-narrow-ban: liftBan lifts one row, ban.repository.ts:339-365), so the person still cannot apply to that course; and a köşk ban placed from the roster never said 'this course'. Fix: a sentence for each scope, and for a widened ban say the course ban goes on." }
  - { id: NDB-4, rule: "The Medaris list draws a medrese-wide ban (scope MADRASAH, placed by nazar's başmüderris or by a widening to the medrese) as a 'Köşk' row with no köşk name (scopeParts has only the COURSE and the 'else' branch, present.ts:71-99; all-bans-view.tsx:233; a MADRASAH ban has koskName null). The file's own comment says Medrese chips wait for such bans (all-bans-view.tsx:59-63), which exist since PR #394. Its lift dialog then says 'Köşk' and 'bu derse'. The Kapsam chips offer only Ders and Köşk. The köşk's own list never shows it (it belongs to no köşk). Read from the code, not walked (this flow places no medrese ban). Found independently as REVBANS-2 in nizam.moderation.reviewBans. Fix: a Medrese label and chip, and the medrese's name." }
  - { id: NDB-5, rule: "cannotLiftNote (present.ts:51-58) knows two reasons: Medaris placed it ('yalnız Medaris yönetimi') or anything else ('yalnız onu koyan kademe ya da üstü'). A Medaris nazım holding only platform.ban_scoped has no lift code for a course ban (ban-codes.ts:45-53: LIFT_CODES[COURSE] has no platform code, and the e2e hands her ban.lift_course in every course by SQL), so on a ban a hoca placed she reads that only the kademe that placed it or higher may lift it, though she is higher; and under a ban of the başnazım she reads 'yalnız Medaris yönetimi' though she is Medaris administration. The note blames the kademe for a missing permission (found independently as REVBANS-3 in nizam.moderation.reviewBans). Fix: name the permission, or hand the nazım the code." }
  - { id: NDB-6, rule: "A refusal of either dialog leaves it open and does not read the list again: `if (!result.success) { toast.error(...); return; }` (lift-dialog.tsx:82-88, extend-dialog.tsx:71-77), whereas the toast of BAN_ALREADY_LIFTED and BAN_NOT_FOUND says 'sayfayı yenileyin' (BansPage.errors, nizam.json). The person must close the dialog and reload by hand; the row that was lifted meanwhile stays on screen with its button. nazar's dialog closes and reads the list again for the same codes. The error is a sticky toast of another portal and nothing inside the dialog says it (F-W5-3, F-X-4). Fix: close the dialog and read the list again for the two 'moved' codes." }
  - { id: NDB-7, rule: "While a call runs the dialog's 'Vazgeç', the close icon and Esc do nothing (`if (!saving) onOpenChange(next)`, lift-dialog.tsx:100-102, extend-dialog.tsx:91-93) and are drawn as usable; the busy submit has aria-disabled and a hidden 'Yükleniyor' output, nothing says the dialog cannot be left. The family of F-W3-open-2 (nizam.kosks.open) and BANDEC-1 (nazar.bans.decide). Fix: disable the three while saving, or let the call be abandoned." }
  - { id: NDB-8, rule: "The köşk's list words the viewer in the lift dialog from `me.roles.systemAdmin ? 'roles.SYSTEM_ADMIN' : 'roles.KOSK_NAZIM'` (app/kosks/[id]/yasaklamalar/page.tsx:46-50), so a Medaris nazım who reads a köşk's list (the route lets her: READ_KOSK_BANS_CODES, ban-codes.ts:61-65) is told 'köşk nazımı olarak kaldırabilirsiniz'. Not walked: whether a Medaris nazım passes the köşk layout guard was not verified. Fix: word the viewer from the role the API says she acts in." }
  - { id: NDB-9, rule: "After a lift the köşk's list empties its cache and reads again (`setLists({}); void load(status)`, bans-view.tsx:377-381): the table is replaced by three skeleton bars and a visually hidden 'Yükleniyor' that is no live region, and the pressed row's button, with the focus, goes with it; the Medaris list shows the skeleton too (all-bans-view.tsx:445-453). Base UI's return of the focus finds no opener and it falls to the page. Not verified in a browser. The graph draws no focus after a decision (the family of F-X-7, F-X-8, F-X-10). Fix: keep the old table until the new one arrives, and move the focus to the table's caption or the next row's button." }
  - { id: NDB-10, rule: "A decision changes the rows, the two tab counts and the 'yeni yasak' line with no announcement: the counts are plain spans inside the tabs (libs/ui/src/mds/tabs.tsx:112), the lines above the table plain paragraphs with no live region (bans-view.tsx:322, all-bans-view.tsx:332; the archive's count is aria-live, archive-view.tsx:449), and the empty line is a table cell. The only word is the toast (F-W5-10, the same gap as the search)." }
  - { id: REVBANS-1, rule: "Cited from nizam.moderation.reviewBans, and what it does to this flow's toast. The Medaris list builds its set of standing köşk bans from the rows of the page it read (ban.service.ts:250-254), so a course ban whose person already has an open köşk ban offers 'Yasağı genişlet' whenever the köşk row is not on that page (the Ders chip, or a long list's first page). Pressing it sends extendBan, which returns the standing ban with created false and writes nothing (ban.service.ts:294-311, ban.repository.ts:296-318): no row, no audit row, no notification, and the dialog's toast still says 'Yasak genişletildi'. Not walked. Fix: say the person was barred already, or read the standing bans of the whole list for the flag." }
  - { id: F-W5-1, rule: "'Köşkten de yasakla' on the köşk's list is one click: no confirmation, no reason prompt (it reuses the course ban's reason), unlike the same widening on the Medaris list, which opens ExtendDialog with a required reason (bans-view.tsx:137-160, all-bans-view.tsx:298-307). A person who presses it by mistake has barred someone from the whole köşk and can only lift it afterwards. Fix: open the dialog first (NDB-2)." }
  - { id: F-W5-3, rule: "A refused or failed write is told only by a sticky toast in another portal; nothing inside the open dialog says it failed and no field is marked (lift-dialog.tsx:82-88, extend-dialog.tsx:71-77, bans-view.tsx:148-153). A screen-reader user hears it only if the toast region announces it (sonner's, whose region is named by an English default, F-X-5). Fix: an Alert tone=error inside the dialog with the same text (F-X-4)." }
  - { id: F-W5-4, rule: "The reason field of both dialogs shows 'Bir gerekçe yazın.' only after blur, and the submit is natively disabled while the reason is blank (lift-dialog.tsx:112-113, :181), so a keyboard user who never leaves the field cannot reach the submit and meets no explanation; Field.Error has no role and no live region (libs/ui/src/mds/field.tsx; F-X-2, F-X-3). Fix: keep the submit on, validate on submit and move the focus to the field." }
  - { id: F-W5-10, rule: "The Medaris list's search re-queries after a pause with no announcement of the result count; the line above the table is a plain paragraph (all-bans-view.tsx:332). Touched here only as the place a decision's new count appears (NDB-10); the search is nizam.moderation.reviewBans'." }
  - { id: F-X-5, rule: "The ban pages use sonner's `toast` (@medaris/ui/components/sonner), not the kit's useToaster the köşk pages beside them use (use-decisions.ts): two toast hosts are mounted (client-providers.tsx:42-53), and sonner's region is named 'Notifications alt+T' in English by default (libs/ui/src/components/sonner.tsx, containerAriaLabel is not passed). Sonner draws a toast with no role, so the graph draws it as a status and the binding finds it by [data-sonner-toast]." }
  - { id: F-X-6, rule: "Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:107-116), so a screen reader may read the person, the ban's summary, the sentence and the field as the description when the dialog opens. Not verified how it is read." }
  - { id: F-X-7, rule: "After a lift or a widening the pressed row's button is gone (the row leaves the Etkin list, or loses its widening), so the focus falls to the page; only a toast says what happened (NDB-9). Not verified in a browser." }
  - { id: focus-not-set, rule: "The app sets no initial focus on either page (nothing in features/bans or app/yasaklamalar calls focus()), so no page node has `initialFocus` and none is drawn; the dialogs do (the reason field, via initialFocus={reasonRef})." }
  - { id: error-toast-stays, rule: "An error toast (every refusal here) stays until closed (duration Infinity, bans-view.tsx:151, lift-dialog.tsx:85), so a second decision in the same visit can leave the first one's error on the screen beside the second's; the graph draws the last (`last`). A success toast closes after 6 seconds." }
  - { id: label-in-name, rule: "A row button's visible text is contained in its accessible name: 'Yasağı kaldır' in 'Yasağı kaldır: {ad}', 'Köşkten de yasakla' in 'Köşkten de yasakla: {ad}', 'Yasağı genişlet' in 'Yasağı genişlet: {ad}' (WCAG 2.5.3). Holds." }
  - { id: reason-never-reaches-the-talebe, rule: "The reason of a ban and of its lift is read by those who list and lift bans, never by the talebe, who is told only 'erişimin kaldırıldı' when a widening bars a seat of theirs, and nothing when a ban is lifted (liftBan sends no notification). Holds; both dialogs' help lines say so." }
