# nizam.moderation.decideBan on the Medaris list as the başnazım, both dialogs answered 409 BAN_ALREADY_LIFTED (lifting FAIL.moved and extending
# FAIL.moved: the sticky toast "Bu yasak zaten kaldırılmış; sayfayı yenileyin.", the dialog stays open, the list is not read again, NDB-6).
#   flock <scratchpad>/replay.lock nice -n 10 node /home/taha/delurio-wt/medaris-engine/apps/engine/src/cli.ts replay graphs/nizam/moderation/decideBan \
#     --bind graphs/nizam/moderation/decideBan/binding.allMoved.yaml --cover transitions --absent --out <dir>
# NOT RUN (the owner's word: replays come once, at the end). It loads (`--emit-spec --out <dir>`).
#
# How the world is made to refuse: as in binding.moved.yaml. When a dialog's reason is filled in, the binding first has the köşk nazım lift the
# newest ban through the API (./bans.mjs lift --newest). The page is not read again after the refusal, so the next dialog is opened on the same
# first row, whose ban is lifted already: the lift and the widening both meet 409, whichever the helper lifts. `call` is left off.
schema: delurio-graph/0
kind: binding
extends: ./locators.binding.yaml
flow: nizam.moderation.decideBan

states:
  listed: { url: '{nizam}/yasaklamalar' }
  empty: { url: '{nizam}/yasaklamalar' }
  liftedTab: { url: '{nizam}/yasaklamalar' }

events:
  FILL_IN:
    - run: [node, ../nizam/moderation/decideBan/bans.mjs, lift, decideBan, --who, 'APPLICANT_C,APPLICANT_D,APPLICANT_E', --newest]
      expect: 'APPLICANT_'
    - fill: { role: textbox, within: { role: dialog }, value: '{reasonText}' }

scenarios:
  allMoved:
    given: { viewer: chief, read: ok, row: low, answer: moved, after: more }
    as: systemAdmin
    open: '{nizam}/yasaklamalar'
    setup:
      - run: [node, helpers/course.mjs, make, decideBan, --kosk, '{seed.kosk2}', --weeks, '1', --lessons, '1', --talebe, applicantC, applicantD, applicantE]
        expect: '"tag":"decideBan"'
      - run: [node, ../nizam/moderation/decideBan/bans.mjs, up, decideBan, --low, 'APPLICANT_C,APPLICANT_D,APPLICANT_E']
        expect: 'ready: 3 open'
    teardown:
      - run: [node, ../nizam/moderation/decideBan/bans.mjs, down, decideBan, --people, 'APPLICANT_C,APPLICANT_D,APPLICANT_E']
        expect: removed
      - run: [node, helpers/course.mjs, remove, decideBan]
        expect: 'course remove decideBan'
    vars:
      reasonText: Yeniden değerlendirildi
      who: 'APPLICANT_C,APPLICANT_D,APPLICANT_E'
      liftHas: 'COURSE lifted'
      widenHas: KOSK open
