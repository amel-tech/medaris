    title: The section refusal opens
    description: "The page calls forbidden() and the shell draws \"Bu bölüm için izniniz yok\" at the same address: nizam.shell.noAccessAndNotFound draws it."
    type: final
    leavesPage: true

  handed_over.lift:
    title: The lift dialog opens
    description: "\"Yasağı kaldır\" opens a dialog with the ban's summary and a required reason: nizam.moderation.decideBan draws it. The page stays at its address."
    type: final

  handed_over.extend:
    title: The widening dialog opens
    description: "\"Yasağı genişlet\" opens a dialog that asks for the new ban's own required reason: nizam.moderation.decideBan draws it. The page stays at its address."
    type: final

  left:
    title: They leave the page
    type: final
    leavesPage: true

assertions:
  - id: a-stranger-meets-no-list
    never: "viewer == 'stranger' and state in ['listed', 'empty', 'noMatch', 'narrowing', 'loadingMore', 'loadFailed']"
    say: A person the API refuses the list is never shown the table, the skeleton or the error alert; they get the section refusal.
    source: apps/nizam/app/yasaklamalar/page.tsx:25
  - id: decisions-only-on-open-bans
    never: "state in ['handed_over.lift', 'handed_over.extend'] and tab == 'LIFTED'"
    say: A row of the Kaldırılan tab offers no decision; the buttons are drawn only on an open ban.
    source: apps/nizam/features/bans/present.ts:143
  - id: a-reader-decides-nothing
    never: "viewer == 'reader' and state in ['handed_over.lift', 'handed_over.extend']"
    say: A Medaris nazımı who holds platform.ban_account alone is drawn no button, because the API answers every row with viewerMayLift and viewerMayExtend false.
    source: apps/tedrisat/src/ban/ban.service.ts:639
  - id: rows-mean-the-list-holds-something
    never: "state == 'listed' and not holds"
    say: The table is drawn with rows only when the narrowed list holds something.
    source: apps/nizam/features/bans/components/all-bans-view.tsx:340
  - id: empty-means-nothing-narrows
    never: "state == 'empty' and (holds or narrowed)"
    say: The tab's own empty line shows only when the platform holds no ban of the tab and no chip or search is set.
    source: apps/nizam/features/bans/components/all-bans-view.tsx:340
  - id: nothing-fits-means-a-filter-is-set
    never: "state == 'noMatch' and not narrowed"
    say: The "nothing fits" line shows only while a chip or a search is set.
    source: apps/nizam/features/bans/components/all-bans-view.tsx:340
  - id: more-needs-rows-left
    never: "state == 'loadingMore' and not moreButton"
    say: Rows are asked for only from a list that has rows left, in the Etkin tab.
    source: apps/nizam/features/bans/components/all-bans-view.tsx:343
