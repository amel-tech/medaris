# The screens of nizam.moderation.reviewBans: Yasaklamalar as Medaris administration meets it (nizam-web, /yasaklamalar), in both tabs, with its
# kind chips, its search, its "Daha fazla göster", its empty, narrowed-to-nothing, busy and unreadable states. Read on 16 Nov 2026 from
# apps/nizam/app/yasaklamalar/page.tsx, features/bans (all-bans-view.tsx, present.ts, reads.ts, actions.ts), libs/ui/src/mds (tabs, choice-chips,
# table, input, alert, button, skeleton) and tedrisat's ban module (ban.controller.ts, ban.service.ts, ban.repository.ts, ban-codes.ts). Nothing was
# opened in a browser: what the screen looks like, where the focus goes and what a screen reader says are from the code (marked in `rules`).
#
# Words. Every `BansPage.*` and `AllBansPage.*` key is copied, letter for letter, from libs/i18n/src/locales/tr/nizam.json by key (the file's root is the
# namespace `nizam`, so the key is the path inside it). The page reads them as `nizam.BansPage` and `nizam.AllBansPage`.
# The `composed.*` keys are in no i18n file: they are the cells the page builds from what the API sends, written with their placeholders so that a
# replay can match them (a placeholder with no sample matches any text):
#   composed.AllBansPage.activeCount / liftedCount  the tab's number, a <span class=mds-tab__count> (libs/ui/src/mds/tabs.tsx:67), Intl.NumberFormat of the
#                                                   page's locale; the platform's whole count, whatever the filters leave
#   composed.AllBansPage.person                     the name, else the e-mail, else "Bilinmiyor" (all-bans-view.tsx:164), in <bdi> (:202)
#   composed.AllBansPage.email                      the person's e-mail under the name, <bdi dir=ltr> (:208)
#   composed.AllBansPage.courseTitle / koskName     the course's title and the köşk's name under "Ders" (present.ts:80-89, with the köşk: withKosk)
#   composed.AllBansPage.reason                     the reason as the placer typed it (:250)
#   composed.AllBansPage.placedBy / role            the placer's name, and under it the role: "Hoca", "Köşk nazımı", "Medaris yönetimi", "Medaris nazımı"
#                                                   (BansPage.roles.*) or, for a ban the reader placed, "{role} (siz)" (BansPage.you; present.ts:41-48)
#   composed.AllBansPage.when                       "Bugün 14:30", "Dün 09:10" or "28 Eyl 16:10", the viewer's clock (features/archive/present.ts:51-73)
#   composed.AllBansPage.liftedBy / liftedWhen / liftReason   the Kaldırılan tab's last cell: who, when, why (:316-323)
#   composed.Button.loading                         "Yükleniyor", the hidden <output> of a busy Button (libs/ui/src/mds/button.tsx:62,114)
# No `changes`: the flow only reads (GET /bans). Samples are invented and neutral.
