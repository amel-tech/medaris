rules:
  - { id: focus-not-set, rule: "No code of features/bans sets the focus when the page opens, after a tab, a chip, the search or 'Daha fazla göster' (the tab, the chip and the button keep it until the row or the panel changes under them). Nothing is drawn as `initialFocus` or `focus`." }
  - { id: TRIAGE-2, rule: "Read from this side, from the code and from one API call on the stack (seen at the API, not in a browser): the page does NOT show every ban to every Medaris nazımı. Its list read asks platform.ban_scoped or platform.ban_account at the platform (ban.service.ts:233, ban-codes.ts:65-69; MEDARIS_NAZIM has no default permissions) and the seeded Medaris nazımı, who holds neither, is answered 403 BAN_FORBIDDEN, so the page draws the section refusal (page.tsx:25) while the notice of the same ban already told her the person's name and the reason (TRIAGE-2 of nizam.notifications.triage, whose title links to the köşk's own list, which she may not read either). The other side holds too: ONE of the two codes opens the whole platform's list, every köşk and every medrese's ban with the person's name, e-mail address and the reason, and nothing narrows it to a köşk or a medrese (ban.service.ts:228-262); platform.ban_account, which bans and lifts nothing, reads the reasons as fully as the başnazım. Fix: decide whether a reader of the platform list should see the reason and the e-mail address, and notify only those who may read (TRIAGE-2 decision D1)." }
  - { id: REVBANS-1, rule: "New, from the code (ban.service.ts:228-262), not seen in a browser. 'Yasağı genişlet' is drawn on an open course ban whose person ALREADY has an open köşk ban whenever that köşk ban is not among the rows of the page that was asked for: `widened` is built from the page's own items (the open list is read only for the Kaldırılan tab, where no row can be widened), so with the Ders chip on (scope COURSE sends no köşk row) or on a long list's first page while the köşk ban sits on the second, the button is there; with Tümü and both rows on the page it is not. The extend route hands back the standing ban, so nothing breaks, but the person who presses it is asked for a reason for a widening that already exists (nizam.moderation.decideBan). Fix: ask the repository for the page's persons' open köşk bans, not the page's rows." }
  - { id: REVBANS-2, rule: "The same finding as NDB-4 of nizam.moderation.decideBan, met here from the reading side; from the code (present.ts:71-99, all-bans-view.tsx:424-427, ban.repository.ts:394-412), not seen in a browser. The API lists a MEDRESE-wide ban (scope MADRASAH, placed from nazar) beside the köşk's and the course's, but scopeParts gives every scope that is not COURSE the label 'Köşk', with no köşk name (a medrese-wide ban has none) and, for a widened one, '{course} dersinden genişletildi'; and the chips only send COURSE and KOSK, so the same ban vanishes under both. The page's own comment says the Medrese and Platform chips 'wait for bans of those scopes', and e2e bans-medaris#3 pins that there is no 'Platform' chip, but the medrese scope exists now. Fix: label the scope 'Medrese' with the medrese's name and add the chip (the platform scope still waits for MDRS-113)." }
  - { id: REVBANS-3, rule: "The same finding as NDB-5 of nizam.moderation.decideBan, met here with the two Medaris nazım viewers; from the code (present.ts:51-58, ban-codes.ts:17-22, ban.service.ts:639-668). Where the row has no 'Yasağı kaldır' the page says 'Bu yasağı yalnız onu koyan kademe ya da üstü kaldırabilir.' (a ban of a lower kademe) or 'Bu yasağı yalnız Medaris yönetimi kaldırabilir.' (a ban Medaris placed). The first sentence is false for a Medaris nazımı holding only platform.ban_scoped, who is above the placer of a course ban but lifts no course ban (the permission is the reason, not the kademe), and for one holding only platform.ban_account, who lifts nothing at all and is told the same of every row. Fix: say which permission is missing when the kademe is not the reason." }
  - { id: REVBANS-4, rule: "New, from the code (all-bans-view.tsx:343-353), not seen in a browser. 'Daha fazla göster' is drawn only while rows are left; pressing it for the last page removes the button that has the focus, so the focus falls to the document, and nothing says that rows were added or how many (F-W5-10, F-X-7). Fix: move the focus to the first new row, or keep the button with a status that says 'tümü gösterildi'." }
  - { id: REVBANS-5, rule: "New, from the code (ban.repository.ts:419, all-bans-view.tsx:263-269). The Kaldırılan tab is ordered by when the ban was LIFTED (desc lifted_at), but its 'Zaman' column shows when it was PLACED, so a list that is sorted looks unsorted; the lift time is in the last column. The table carries no aria-sort in either tab. Fix: show the lift time in the column the order follows, or order by the placed time." }
  - { id: F-W5-10, rule: "The search is the server's (300 ms after the typing stops, loadAllBans), and neither it, a chip, a tab nor 'Daha fazla göster' says how many rows came: the only count text is the caption <p data-testid=all-bans-summary>, which is no live region, and the skeleton's 'Yükleniyor' sits in an aria-busy <div> that is not spoken (all-bans-view.tsx:332,446-451). The tab's number is the platform's whole count, not the filtered one, so 'Etkin 3' can sit over '1 etkin yasak'. Fix: a live status line '{n} yasak' after each answer." }
  - { id: F-W5-1, rule: "Touched, not owned by this flow: the widening from THIS page ('Yasağı genişlet') opens ExtendDialog and asks for a reason, where the same widening on the köşk's own list ('Köşkten de yasakla', bans-view.tsx:137-160) is one click with no reason; nizam.moderation.decideBan draws both. Fix: open the dialog on the köşk list too." }
  - { id: chips-toggle, rule: "The chips are Base UI toggles with aria-pressed (choice-chips.tsx:75-93), which no node of this graph can draw. Pressing the pressed 'Ders' or 'Köşk' turns it off and the list asks again for Tümü (onChange gets null, all-bans-view.tsx:429-436), and pressing 'Tümü' while it is pressed asks again for nothing new (every chip press makes a new query object, :153-158, so the list is read again and shows its skeleton)." }
  - { id: tabs-selected-not-drawn, rule: "The tabs are a tablist with panels (Tabs, mode tabs) and the selected tab has aria-selected, which no node of this graph can say; the graph says which tab is on by the table's caption and the summary line." }
  - { id: label-in-name, rule: "A row button's visible text is contained in its accessible name: 'Yasağı kaldır' in 'Yasağı kaldır: {name}', 'Yasağı genişlet' in 'Yasağı genişlet: {name}' (WCAG 2.5.3). Holds. The tab's name is its text then its count, 'Etkin 3'." }
  - { id: actions-absent-not-disabled, rule: "An action the API says the viewer may not take is not drawn (absent, not disabled), and a ban the viewer may not lift says so in a sentence (REVBANS-3); a lifted ban draws nothing. The 'Yeni' badge is text, not colour alone." }
