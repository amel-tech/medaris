rules:
  - { id: focus-not-set, rule: "No code of this page moves the focus: not when it opens, not after a tab is chosen or a row selected (F-W5-6), and not after a decision. The page node has no `initialFocus` on purpose." }
  - { id: reach-the-page, rule: "How a person comes to /talepler/itirazlar: the başnazım through the sidebar (and phone sheet) group 'Talepler', entry 'İtirazlar', which has no count badge (lib/shell-nav.ts:116-121, 178-186); the Medaris home counts waiting appeals in its greeting and has no card and no link for them (features/dashboard/present.ts:29-36; CHIEF-1); a Medaris nazımı who holds platform.appeal_decide is let in by the API and the page, and has neither a menu entry nor a card, so she reaches it by typing the address (MCUT-2, F-W5-12, F-X-12); nobody is notified when an appeal opens (DAPP-2). Fix: an İtirazlar card with a count and a link on the Medaris home, the entry in the menu of every holder of the permission, and a notification." }
  - { id: F-W5-5, rule: "features/appeals/components/appeals-view.tsx:97-105: after a decision the appeal leaves the list and the next one is selected (or the empty line replaces the card); the button that had focus ('Kabul et', or the card's 'Reddet' that the dialog gives the focus back to) is unmounted, so the focus falls to the document, and the card changes under the reader with no announcement. The only word is a toast of 6 seconds. Not verified in a browser. Fix: move the focus to the next row's button or the card's heading, and keep a status line." }
  - { id: F-W5-6, rule: "appeals-view.tsx:256-273: Tabs mode=tabs with no TabsPanel children, so the tabs control no panel (aria-controls points at nothing); the list and the card below are plain regions; a tab switch or a row selection changes the page with no announcement and no focus move. Fix: TabsPanel around the list, a polite status line '{n} itiraz', and a name for the list." }
  - { id: F-X-1, rule: "The same family as F-W5-6 across nizam's pages that draw Tabs without TabsPanel (libs/ui/src/mds/tabs.tsx:68-80 lets a caller leave the panel out)." }
  - { id: F-W5-7, rule: "appeals-view.tsx:150-160: the request list is a `ul` of `<button aria-current=\"true\">`; aria-current is not a selected state for a button group, so the selection is not announced, and the list has no name. Fix: links to `?secili=<id>` with aria-current, or a listbox." }
  - { id: F-W5-3, rule: "appeals-view.tsx:107-113 and reject-dialog.tsx: a refused or failed decision is told only by a sticky toast in another portal; nothing inside the open dialog (or beside 'Kabul et') says it failed. A screen-reader user hears it only if the toast region announces (sonner semantics not verified, F-P0-18). Fix: an Alert tone=error (role=alert) in the dialog and on the card with the same text. Same family as F-X-4." }
  - { id: F-W5-4, rule: "reject-dialog.tsx:92,104: the dialog's 'Reddet' is natively disabled while the note is blank, and 'Bir gerekçe yazın.' appears only after the field was left, so a keyboard user who never leaves the field cannot reach the button and hears no reason. Same family as F-X-2 and F-X-3. Fix: keep the button on, validate on press, and move the focus to the field." }
  - { id: F-X-2, rule: "libs/ui/src/mds/field.tsx: the note's error 'Bir gerekçe yazın.' is a Base UI Field.Error with no live region and no focus move, and the dialog's button is natively disabled while the note is blank, so a keyboard or screen-reader user hears nothing about why. Fix: keep the button on and say the error in a role=alert line on press, or announce it." }
  - { id: F-UI-W1-1, rule: "libs/ui/src/mds/dialog.tsx:103: the dialog's description is its whole body (BaseDialog.Description wraps the paragraphs and the field), so a screen reader reads all of it as the description." }
  - { id: F-W5-12, rule: "app/talepler/itirazlar/page.tsx and lib/shell-nav.ts:178-186, 297: the page is chief-only in the menu (medarisGroups carries 'deck-requests' and no 'appeals') while ITEM_PERMISSIONS lists appeals for platform.appeal_decide, so a Medaris nazımı who holds it is let in by tedrisat and has no entry; no e2e visits the page. The flow draws the page for the başnazım and the refusal for the seeded Medaris nazımı, who does not hold the code. Same as MCUT-2 and F-X-12." }
  - { id: DAPP-1, rule: "New. apps/nizam/features/appeals/components/appeals-view.tsx:115-129, :222: 'Kabul et' decides at once: no question, no note, no way back (the route has no body, appeal.controller.ts:139). One click sends the request back to the köşk for good, the appeal keeps no note, and the medrese reads 'Kabul edildi' and nothing else; 'Reddet' asks, demands a note and says who reads it. Fix: ask once in the words of what follows, and take an optional note (decision D2)." }
  - { id: DAPP-2, rule: "New. appeals-view.tsx:125-127, 139-141: the toasts say the request was 'yeniden köşkün kararına gönderildi' and the note 'medreseye iletildi', but acceptAppeal and rejectAppeal write the appeal and an audit row and nothing else (apps/tedrisat/src/appeal/appeal.repository.ts:239-284): no notification, no mail, to the medrese or the köşk's nazım; and nobody was told when the appeal opened. The medrese finds the answer only by opening its İtirazlar; the köşk's nazım finds the returned request only by opening Ders talepleri. Same decision as nazar.appeals.open D1 (F-B-appeals-5). Fix: notify, or word the toasts 'kaydedildi' (decision D1)." }
  - { id: DAPP-3, rule: "New. appeals-view.tsx:97-113: settle counts every appeal that leaves the waiting list as decided: after APPEAL_NOT_FOUND (an appeal that is gone, decided by nobody) the Karara bağlanan tab's number is one too high until that tab is read again. The twin of CREQ-5 (nizam.courseRequests.decide). Fix: add one only for an appeal that was decided." }
  - { id: DAPP-4, rule: "New. apps/nizam/features/platform-admin/components/course-requests-view.tsx:173-250 and apps/tedrisat/src/course-request: after 'Kabul et' the request is PENDING again and the köşk's 'Ders talepleri' draws it as any waiting request: the card says nothing of the appeal, the platform's decision or the earlier refusal (the card shows a reason only for a REJECTED request), and the list response carries no appeal. The köşk's nazım decides again without knowing it was sent back or why. Fix: a line on the card ('İtiraz kabul edildi') and the appeal's reason." }
  - { id: DAPP-5, rule: "New. apps/tedrisat/src/database/schema/appeal.schema.ts:44 (unique index appeals_course_request_uq), apps/nazar/features/appeals/appeals.ts:41 (canAppeal needs no appeal at all): a request is appealed once, so after 'Kabul et' a second refusal by the köşk is final: the medrese's row has an appeal and no 'İtiraz aç', and nothing says so to the başnazım before she accepts or to the medrese after (decision D3). Fix: say it, or allow one appeal for each refusal." }
  - { id: DAPP-6, rule: "New. appeals-view.tsx:222-227: only 'Kabul et' gets `loading`; while it runs 'Reddet' stays on and opens its dialog, so a second decision can be started on the same appeal. The API lets the first stand (APPEAL_NOT_PENDING, 'Bu itiraz az önce karara bağlanmış.'). Fix: turn both off while any decision runs." }
  - { id: DAPP-7, rule: "New. reject-dialog.tsx:104 with DeckReject.appeal: the field is called 'Karar notu' (the kind words its own label, `own`), but its error is the one every kind shares, 'Bir gerekçe yazın.'. The label says note, the error says reason. Fix: give the appeal kind its own error ('Bir karar notu yazın.')." }
  - { id: DAPP-8, rule: "New. appeals-view.tsx:184-236: the answer carries `createdBy` ({ id, name }, appeal.repository.ts:190-193) and the card never draws it: the person who decides is not told who appealed, unlike the köşk's card, which names the sender ('Talebi gönderen'). The card also shows no date for a waiting appeal (the list item does). Fix: draw the author and the day on the card." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Kabul et', 'Reddet', 'Tekrar dene', 'Vazgeç'. The row buttons are named by their whole content, which starts with the title (WCAG 2.5.3). Holds." }
  - { id: confirm-before-rejecting, rule: "Reddet asks first, in a form dialog whose note is required and whose button stays off until one is written (the API also requires it: RejectAppealDto, IsNotEmpty); Kabul et asks nothing (DAPP-1)." }
  - { id: toast-is-the-only-word, rule: "The result of a decision is said by a sonner toast (a list item in the Toaster's live region): the two success toasts close by themselves after 6 seconds, an error toast stays until it is closed. The page itself says nothing but the row leaving and the counts moving." }
  - { id: busy-label-not-in-the-catalog, rule: "The busy 'Kabul et' and the dialog's busy button pass no loadingLabel, so their hidden status says 'Yükleniyor' from a hard-coded default (libs/ui/src/mds/button.tsx:103)." }
