# The screens of nizam.moderation.decideAppeal: "İtirazlar" (/talepler/itirazlar) of nizam-web with its two tabs, the list and the card of an
# appeal, "Kabul et" and its busy state, the reject dialog and the toasts of a decision, and the screen that says "Bu bölüm için izniniz yok".
# Read from apps/nizam/features/appeals/components/appeals-view.tsx, apps/nizam/features/deck-review/components/reject-dialog.tsx and
# apps/nizam/components/errors/no-access.tsx on 16 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nizam.json (namespaces
# AppealsPage, DeckReject, NoAccess) and common.json (toast.close). Nothing was looked at in a browser: every node is "from the code".
#
# Text the page builds in code, in no i18n file, is `composed.AppealsPage.<name>` (one or two placeholders: the appeal's title, the medrese's
# and the köşk's names, the date, the reasons, the note, a tab's count) and `composed.Button.loading` (the hidden <output> of a busy button,
# "Yükleniyor", libs/ui/src/mds/button.tsx:113: a hard-coded default).
#
# The `changes` message, `Changes.note`, is the one catalog entry that is not copied from an app file: no message of the page says, for both
# buttons together, what a decision changes and who reads it (each toast says one outcome, and says "iletildi" where nothing is sent: DAPP-2).
# It is authored here, in Turkish, from what appeal.repository.ts does (decide, lines 239-284).
#
# The frame (the sidebar, the menu's entry "İtirazlar", the bell) is outside this view (scope.outOfView), so no node of it is drawn. While the
# reject dialog is open the page behind it is inert, so no page node is `in` a dialog state; the toasts live in their own portal and are.
