# The screens of nizam.moderation.reviewDeckPublication: the page "Deste yayın istekleri" (/talepler/deste-yayin-istekleri) with its tabs, its list and the
# detail of the selected request, the sample cards, the two reason dialogs, and the toasts of a decision. Read from apps/nizam/features/deck-review/
# components/deck-requests-view.tsx and reject-dialog.tsx on 16 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nizam.json (namespaces
# DeckRequestsPage and DeckReject).
#
# Two kinds of entries are not copied from the app:
#   Changes.note   the one message written for this graph: no app message says what the three decisions change (see `changes`).
#   composed.*     text the page builds in code from data and that is in no i18n file: the row's name (deck-requests-view.tsx:279-309, the buttons' content read
#                  in order), the tab counts (libs/ui/src/mds/tabs.tsx:63), the deck's title, owner, request time and refusal reason, each card's two
#                  sides, and the hidden "Yükleniyor" of a busy button (libs/ui/src/mds/button.tsx:62, a default of the kit). Each is one placeholder
#                  or the line the code joins with " · ".
#
# The detail of a request that has a description draws one more paragraph under the details (deck-requests-view.tsx:405); the decks this flow's walks
# make have none, so it is not drawn. The row's outcome ("Yayımlandı"/"Reddedildi") comes from `outcome.*`; the badge of the detail from `status.*`.
schema: delurio-graph/0
kind: ui
id: nizam.moderation.reviewDeckPublication
flow: nizam.moderation.reviewDeckPublication
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note } # the one authored message of this catalog: no app message says what a decision changes
