rules:
  - { id: F-W5-5, rule: "After a decision the request leaves the list and the next one is selected; the detail changes under the reader with no announcement, and the only word is a toast (6 seconds for a success, until closed for an error). The inventory says the pressed button is unmounted and the focus falls to the body; from the code (deck-requests-view.tsx:352-448) 'Yayımla' and 'Reddet' are the same elements for the next request, because the section keeps its shape, so the focus stays on them: it is lost only where the detail goes away (the last request leaves, or after a take-back the next answered request has no button). 'Bütün kartlar' does leave the page once pressed (showAll hides it). Fix: say what changed in a status line, and move the focus to the detail's heading. Not verified in a browser." }
  - { id: F-X-7, rule: "The family of F-W5-5: rows or items that leave a page after an action." }
  - { id: F-W5-6, rule: "The tabs 'Bekleyen' and 'Karara bağlanan' are `Tabs mode=tabs` with no `TabsPanel` (deck-requests-view.tsx:494-511): the tablist controls no panel, and a tab switch changes the list and the detail below with no announcement and no move of the focus. Fix: wrap the list in a TabsPanel, or use links; add a status line '{n} istek'." }
  - { id: F-X-1, rule: "The family of F-W5-6: Tabs with no TabsPanel in six pages of nizam (libs/ui/src/mds/tabs.tsx:52-125)." }
  - { id: F-W5-7, rule: "A request is a <button aria-current='true'> in a plain <ul> (deck-requests-view.tsx:283-293): `aria-current` is not a selected state for a button group, the selection is not announced, and the list has no name. Fix: links to `?secili=<id>` with aria-current, or a listbox." }
  - { id: F-X-3, rule: "'Reddet' and 'Yayından kaldır' of the dialog are natively disabled while the reason is blank and nothing ties the reason to the button; leaving the field empty draws 'Bir gerekçe yazın.' as a plain line (no live region, no move of the focus). The family of F-W3-1 (reject-dialog.tsx:92, :104)." }
  - { id: DECKREV-1, rule: "New: the page selects a request on its own and reads its sample cards at once, which tedrisat writes to the audit log (`deck.private-read`, deck-review.service.ts:102): on arrival (the first row), after every decision (settle selects the next, :204-209), on every return to 'Bekleyen' (the effect depends on the tab, :166-186) and on every tab switch. A reviewer who refuses ten requests in a row writes ten reads of private decks nobody opened, and the sentence 'kartlarını görmeniz denetim kaydına yazılır' stands over cards that were read and recorded before it was drawn. Fix: select nothing until the reviewer chooses a row, or read behind an explicit button; say it before the look (decision D2)." }
  - { id: DECKREV-2, rule: "New: `?secili=` is honoured only when the id is among the first twelve waiting requests the server read (`initial?.items.find`, deck-requests-view.tsx:84-88; DECK_PAGE_SIZE 12, present.ts:21); any other id, or an answered one, selects the first (oldest) request in silence and reads and audits its cards. The home page's 'İncele' names one of the three NEWEST waiting requests (nizam-dashboard.repository.ts:145, desc by request time) while this list is oldest first, so with more than twelve waiting the link opens another deck than the one it named. Fix: say that the request is not on the list, and select nothing." }
  - { id: DECKREV-3, rule: "New: when a read after the first fails, the error alert replaces the tabs, the list and the detail (`failed && lists[tab] === undefined`, deck-requests-view.tsx:485): after a failed read of 'Karara bağlanan' the person has no tab to go back with, only 'Tekrar dene' or a reload. Not verified in a browser (nothing makes the API fail on request). The same shape as APPDEC-4 of the köşk applications." }
  - { id: DECKREV-4, rule: "New: 'Yayımla' and 'Reddet' write no audit row (deck-review.repository.ts:243-282 update the deck only); the deck's decision columns (publishDecidedAt, publishDecidedBy, publishRejectReason) are the only record, and the owner's withdrawal or a new request clears them (CLEARED_DECISION, flashcard-deck.repository.ts:19, :220-257). Only 'Yayından kaldır' is audited, with who, the owner and the reason, in the transaction of the change (:286-326). So after an owner takes a published deck back, nothing says who published it. Fix: deck.approve and deck.reject audit rows in the same transaction (decision D3)." }
  - { id: DECKREV-5, rule: "New: the detail's 'İstendi' is the time of the request only while the request waits. The API clears the request time when it answers (publishRequestedAt: null, deck-review.repository.ts:249, :270) and the list reads `requestedAt ?? decidedAt ?? epoch` (:181), so an answered request says 'İstendi' with the time of the answer (and 1 Ocak 1970 for a deck that has neither). Fix: label it 'Karar verildi' on the answered tab, or keep the request time." }
  - { id: DECKREV-6, rule: "New: nothing gates the decision on the cards. 'Yayımla' and 'Reddet' are drawn and on while the sample is three skeleton blocks, after 'Kartlar okunamadı.', and for a deck with no card ('Bu destede henüz kart yok.'; the author's page lets an empty deck ask). The reviewer is told only that a look is recorded. A decision, not a defect (D1)." }
  - { id: focus-not-set, rule: "The page sets no initial focus and the app does not move it after a step: choosing a row, a tab, the arrival of the cards, a decision and the close of a dialog over a button that has gone all leave it where the browser puts it (F-W5-5). Not drawn." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Bekleyen' in 'Bekleyen 3', 'Bütün kartlar', 'Yayımla', 'Reddet', 'Yayından kaldır'. Holds (WCAG 2.5.3)." }
  - { id: publish-asks-nothing, rule: "'Yayımla' asks no question: the deck is public at once, visitors included, and the owner is told. It is reversible (the owner or the başnazım takes the deck back), so the page does not confirm; 'Reddet' and 'Yayından kaldır' ask for the reason the owner will read (deck-review#4). Holds." }
  - { id: toast-is-the-only-word, rule: "The result of a decision is said by a sonner toast: a success closes after 6 seconds, an error stays until it is closed (libs/ui/src/components/sonner.tsx:18-48). Nothing on the page itself says what was decided, and the row simply leaves." }
  - { id: answer-is-given-once, rule: "tedrisat answers a request once: approve and reject update `where publish_status = 'PENDING'` and no row means 409 DECK_REQUEST_NOT_PENDING (deck-review.repository.ts:243-282); a take-back updates `where PUBLISHED` and no row means 409 DECK_NOT_PUBLISHED. The page treats these and the 404s as 'it is settled': the row leaves and the toast says so (isGone, present.ts:138). Holds." }
