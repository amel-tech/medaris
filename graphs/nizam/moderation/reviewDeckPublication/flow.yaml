      published deck is visible to everyone, and the buttons "Yayımla" and "Reddet". A deck with no card shows "Bu destede henüz kart yok." in the
      grid's place. A toast of the last decision may be on. Choosing a row changes the detail with no announcement and moves no focus (F-W5-5, F-W5-6);
      the page has no initial focus (nothing sets one). Where the owner took the request back after the list was read, the page does not know: the
      row stays, and the next press is answered with a notice (`answer: gone`).
    source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:424
    on:
