  waitingDetail:
    title: A waiting request is read
    by: human
    goal: true
    description: >-
      The list on the left, the selected row marked (`aria-current`, F-W5-7), and on the right the request: eyebrow "YAYIN İSTEĞİ", the deck's title,
      the badge "Karar bekliyor", then Sahibi, Kart ("5 ezber kartı"), Kart türü and İstendi (the time of the request), "Örnek kartlar" with the button
