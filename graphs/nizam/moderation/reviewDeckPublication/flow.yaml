      TAB_DECIDED: { target: loadingTab, effect: [toDecided], source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:167, say: "they open Karara bağlanan" }
      NAVIGATE: { target: left, say: "they follow a link or the menu" }
      TAB_WAITING: { target: waitingDetail, source: libs/ui/src/mds/tabs.tsx:110, say: "they press Bekleyen, the tab shown: nothing happens (a Base UI tab ignores a press while it is selected)" }

