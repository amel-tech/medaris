        - { guard: "answer == 'forbidden'", target: waitingDetail, effect: [toastForbidden], source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:237, say: "a toast 'Bu işlem için izniniz yok.'; the request stays (her own deck, or a permission taken away)" }
      FAIL.other:
