# Reviewing a deck publication request: the page "Deste yayın istekleri" (/talepler/deste-yayin-istekleri) of nizam-web, read from the code of PR #394's
# branch on 16 Nov 2026 (apps/nizam/app/talepler/deste-yayin-istekleri/page.tsx, features/deck-review/{reads,actions,present}.ts and
# components/{deck-requests-view,reject-dialog}.tsx, and tedrisat's deck-review/*). The başnazım, or a Medaris nazımı who holds platform.deck_publish,
# finds the requests members made from Tedris (tedris.decks.publish starts this flow), reads three sample cards of the one that is selected (every
# read is written to the audit log), may open "Bütün kartlar", and then "Yayımla"s the deck or "Reddet"s it with a reason the owner will read. Later
# the başnazım alone may take a published deck back with "Yayından kaldır", also with a reason.
#
# The author's page reads the answer back: this flow starts tedris.decks.publish with the deck's new status when an answer is saved
# (`handsBackPublished`, `handsBackRefused`, `handsBackPrivate`), which is the REJECTED branch that flow draws and its two neighbours.
#
# What the page does today, and where it is wrong for its people (each finding is in ui.yaml `rules`):
#   - F-W5-5 = F-X-7  after a decision the request leaves the list and the next one is selected, and only a toast says what happened; the detail changes
#                     under the reader with no announcement. From the code the two buttons are the same elements for the next request (the section keeps
#                     its shape), so the focus is lost only where the detail goes away (the last request, or a decided request with no button): the
#                     inventory's "the button is unmounted" is too strong. Not verified in a browser.
#   - F-W5-6 = F-X-1  the tabs "Bekleyen" and "Karara bağlanan" have no tab panel.
#   - F-W5-7          a request is a <button aria-current> in a plain list: the selection is not a selected state.
#   - DECKREV-1 (new) the page selects the first request on its own, and so reads and audits the private cards of a deck nobody chose to open:
#                     on arrival, after every decision (the next one), on every return to "Bekleyen" and on every tab switch. The sentence that says
#                     the look is recorded stands over cards that were read already.
#   - DECKREV-2 (new) ?secili= is honoured only when the id is among the first twelve waiting requests; any other id falls back to the oldest one in
#                     silence and reads and audits its cards. The home page's "İncele" names one of the three NEWEST requests while the list is oldest
#                     first, so past twelve waiting requests the link opens another deck.
#   - DECKREV-3 (new) when the read of "Karara bağlanan" fails, the error replaces the tabs (and the list): no way back to "Bekleyen" but a reload.
#   - DECKREV-4 (new) "Yayımla" and "Reddet" write no audit row; the deck's own decision columns are the only record, and the author's withdrawal or
#                     a new request wipes them (CLEARED_DECISION). Only "Yayından kaldır" is audited with who and why.
#   - DECKREV-5 (new) a decided request says "İstendi" with the time of the decision: the API clears the request time when it answers and the list
#                     reads the decision time in its place (deck-review.repository.ts:181, :249, :270).
#   - DECKREV-6 (new) the buttons are not gated on the cards: "Yayımla" is on while the cards are still loading, after "Kartlar okunamadı.", and for a
#                     deck with no cards ("Bu destede henüz kart yok."). A decision, not a defect (D1).
# E2E carried (apps/nizam/e2e/deck-review.e2e.ts): #1 whole (the h1, both tab counts as the tabs' names, the detail's title, owner, "5 ezber kartı" and "Karar
# bekliyor", and the three sample cards), #2 whole (the audit rows are the binding's `effects` readDeckPublishRequestCards and allShown, read with SQL as the e2e
# reads them; "Bütün kartlar: 5 ezber kartı" and the five cards after READ_ALL), #3 in part (the toast "Deste yayımlandı", the request leaving the list and the
# deck row PUBLISHED and public, as the effect approveDeckPublishRequest; not carried: the public list before and after (GET /flashcard/decks, a reader's view:
# tedris.decks.explore)), #4 in part (the dialog, "Reddet" off until a reason is written, "İstek reddedildi", the row REJECTED and private with the reason, the
# answered tab's "Reddedildi" and its reason; not carried: the blank " " typed into the field, which the walk cannot type as a different state from the empty
# field: the model has `reason: empty`, `touched`, `typed` and a blank is `empty` to the button), #5 whole (`refused`, the köşk nazımı). Not carried from the
# file: #6-#10, which are nizam.decks.koskDecks'. The take-back, the Medaris nazımı's own-deck refusal and the answered-meanwhile notices have no e2e.
# Seen in a browser: nothing. Every behaviour below is from the code (the owner's order: no replay in this phase); where the page's markup or focus rests on
# the code alone the state or the rule says "not verified".
schema: delurio-graph/0
kind: flow
id: nizam.moderation.reviewDeckPublication
status: captured
domain: medaris.api
ui: nizam.moderation.reviewDeckPublication
title: Review a deck publication request
summary: >-
  The başnazım, or a Medaris nazımı who holds "Deste yayın istekleri", opens the requests of the members who want a deck of theirs made public.
  Two tabs, "Bekleyen" and "Karara bağlanan", each with its count, sit over a list of requests (the waiting ones oldest first, the answered ones
  newest first) and the detail of the selected one: the deck's title, its owner, its card count and type, and when it was asked for. A waiting
  request is selected on arrival (the first one, or the one `?secili=` names), and selecting it reads three sample cards, which is written to
  the audit log; "Bütün kartlar" reads every card, also on the record. "Yayımla" makes the deck public at once, with no question, and tells
  its owner. "Reddet" opens a dialog that asks for a reason the owner will read, and keeps the deck private. On "Karara bağlanan" a refused
  request shows its reason, and a published one gives the başnazım "Yayından kaldır", which asks for a reason too and takes the deck back to
  private. A request someone else answered or the owner took back meanwhile leaves the list with a notice. A Medaris nazımı never answers the
  request for her own deck.

scope:
  shows: >-
    the page with both tabs and their counts, the list and the detail of the selected request, the sample cards and "Bütün kartlar", the two
    reason dialogs, the toasts, the empty and failed pages, the refusal, and the three hand-backs to the author's page
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "the author's side: asking for a deck to be published, taking the request back, reading the answer on the deck's page: tedris.decks.publish (this flow starts it again when an answer is saved)"
    - "the notification the owner gets for every answer, with the reason: tedris.account.notifications and the bell of the frame"
    - "the home page's three newest requests and their 'İncele' link, which opens `?secili=`: nizam.home.chiefOverview; this flow draws the address"
    - "the sentence of the refusal screen and its button: nizam.shell.noAccessAndNotFound; the menu entry that leads here and who sees it: nizam.shell.menuPerPersona, nizam.nav"
    - "the deck as a reader sees it once it is public: tedris.decks.readAndCopy, tedris.decks.visitorPublicDeck, tedris.decks.explore"
    - "the köşk's own decks and the proposals of its müderrises, which are a different review: nizam.decks.koskDecks"
    - "'Daha fazla göster', which draws only past twelve rows of a tab (DECK_PAGE_SIZE, present.ts:21) and which no seed reaches: the next page is merged by id (present.ts:32)"
    - "a request with a description (the paragraph under the details, deck-requests-view.tsx:418); the decks this flow's walks make have none"
    - "an ended session: every call sends the person to sign in (realm.auth.signIn) instead of drawing an error"
    - "a dropped network on a decision call: the busy state is never cleared (the same as the other pages): not verified"

decisions:
  D1:
    question: >-
      Should the reviewer be able to publish a deck whose cards the page never showed? "Yayımla" and "Reddet" are on while the sample is loading,
      after "Kartlar okunamadı.", and for a deck with no cards; nothing asks the reviewer to have looked (DECKREV-6).
    recommend: >-
      Keep "Reddet" always on; turn "Yayımla" on once the sample has been drawn (or the deck is known to be empty, with a sentence that says so).
    affects: [selecting, readingAll, cardsFailed, waitingDetail]
  D2:
    question: >-
      The page selects the first request on arrival and reads its cards at once, so the audit log gets a read nobody asked for, and again after
      every decision and every return to "Bekleyen" (DECKREV-1, DECKREV-2). Should a request be selected only when the reviewer chooses one?
    recommend: >-
      Select nothing on arrival; read the sample when the reviewer opens a row or presses a "Kartlara bak"; say that the look is recorded before it
      is made. The same fix as the köşk applications page (APPDEC-2).
    affects: [opened, selecting, shown]
  D3:
    question: >-
      Should an approval and a refusal be written to the audit log, with who decided and the reason? Today only the sample look, the full look and
      "Yayından kaldır" are (DECKREV-4).
    recommend: >-
      Yes: deck.approve and deck.reject rows, in the transaction of the change, as deck.unpublish already is (deck-review.repository.ts:286).
    affects: [approving, rejecting]

context:
  read:
    values: [ok, refused, failed]
    initial: any
    say:
      ok: "the first read answers: the list of the waiting requests"
      refused: "tedrisat refuses the reader (403): they are neither the başnazım nor a Medaris nazımı with platform.deck_publish"
      failed: "the first read fails for any other reason, or answers 404: the page keeps its frame and says it could not be read"
  link:
    values: [none, waiting, gone]
    initial: any
    say:
      none: "they arrive on /talepler/deste-yayin-istekleri with no ?secili= (the menu)"
      waiting: "they arrive on ?secili= naming a request that is among the first twelve waiting ones (the home's 'İncele')"
      gone: "they arrive on ?secili= naming one that is not among them: answered, taken back, past twelve, or none"
  requested:
    values: [true, false]
    initial: any
    say:
      "true": "a request waits for a decision (tedris.decks.publish starts this flow with it)"
      "false": "no request waits"
  reviewer:
    values: [chief, medaris]
    initial: any
    say:
      chief: "the başnazım: the realm role SYSTEM_ADMIN, who may also take a published deck back and may answer the request for a deck of his own"
      medaris: "a Medaris nazımı holding platform.deck_publish: she lists, reads, publishes and refuses, never takes a deck back, and never answers the request for her own deck"
  decided:
    values: [published, rejected, none]
    initial: any
    say:
      published: "the newest answered request is a published deck"
      rejected: "the newest answered request is a refused one, with its reason"
      none: "nothing is answered yet"
  sample:
    values: [cards, none, unreadable]
    initial: any
    say:
      cards: "the selected deck holds cards: three are read as the sample"
      none: "the selected deck holds no card"
      unreadable: "the read of the selected deck's cards is refused (404: the request was taken back after the list was read)"
  answer:
    values: [done, answered, gone, forbidden, failed]
    initial: any
    say:
      done: "tedrisat takes the decision"
      answered: "someone answered or took back the request meanwhile (409 DECK_REQUEST_NOT_PENDING; for a take-back DECK_NOT_PUBLISHED)"
      gone: "the request is not there any more (404 DECK_REQUEST_NOT_FOUND)"
      forbidden: "the reader may not answer this request (403: a Medaris nazımı answering her own deck, or one who lost the permission)"
      failed: "any other refusal"
  tab:
    values: [waiting, decided]
    initial: waiting
    say: { waiting: "the tab Bekleyen", decided: "the tab Karara bağlanan" }
  cards:
    values: [sample, all]
    initial: sample
    say:
      sample: "the detail holds the three sample cards (and the button Bütün kartlar)"
      all: "Bütün kartlar was read: every card is shown and the button is gone"
  reason:
    values: [empty, touched, typed]
    initial: empty
    say:
      empty: "the dialog's reason is empty and untouched"
      touched: "the field was left empty: 'Bir gerekçe yazın.' stands under it"
      typed: "a reason is written"
  last:
    values: [nothing, published, rejected, unpublished, answered, gone, notPublished, forbidden, failed, loadFailed]
    initial: nothing
    say:
      nothing: "no toast of this page is on"
      published: "a toast says the deck is public and its owner was told"
      rejected: "a toast says the request was refused and the reason went to the owner"
      unpublished: "a toast says the deck is private again and the reason went to the owner"
      answered: "a toast says the request was answered or taken back meanwhile; the row left"
      gone: "a toast says the request is not there; the row left"
      notPublished: "a toast says the deck is not published any more; the row left"
      forbidden: "a toast says they may not do this"
      failed: "a toast says the decision could not be saved"
      loadFailed: "a toast says the requests could not be read"

guards:
  waitingEmpty: "tab == 'waiting' and not requested"
  decidedEmpty: "tab == 'decided' and decided == 'none'"
  onPublished: "tab == 'decided' and decided == 'published'"
  onRefused: "tab == 'decided' and decided == 'rejected'"
  cardsUnreadable: "sample == 'unreadable'"
  cardsReadable: "sample != 'unreadable'"

effects:
  clearNote: { set: { last: nothing } }
  pickRow: { set: { last: nothing, cards: sample } }
  freshSample: { set: { cards: sample } }
  allShown: { set: { cards: all } }
  toDecided: { set: { tab: decided, last: nothing } }
  toWaiting: { set: { tab: waiting, last: nothing } }
  openedDialog: { set: { reason: empty, last: nothing } }
  leftEmpty: { set: { reason: touched } }
  typedReason: { set: { reason: typed } }
  toastPublished: { set: { last: published, cards: sample }, havoc: [requested] } # other requests may still wait, or this was the last
  toastRejected: { set: { last: rejected, cards: sample, reason: empty }, havoc: [requested] }
  toastUnpublished: { set: { last: unpublished, reason: empty }, havoc: [decided] } # the row leaves the answered list; what is newest now is not known
  toastAnswered: { set: { last: answered, cards: sample, reason: empty }, havoc: [requested] }
  toastGone: { set: { last: gone, cards: sample, reason: empty }, havoc: [requested] }
  toastNotPublished: { set: { last: notPublished, reason: empty }, havoc: [decided] }
  toastGoneUnpublish: { set: { last: gone, reason: empty }, havoc: [decided] }
  toastForbidden: { set: { last: forbidden } }
  toastFailed: { set: { last: failed } }
  toastLoadFailed: { set: { last: loadFailed } }

failures:
  opened:
    from: listDeckPublishRequests
    forbidden: [DECK_REVIEW_FORBIDDEN]
    unavailable: [HTTP_400]
  retrying:
    from: listDeckPublishRequests
    unavailable: [DECK_REVIEW_FORBIDDEN, HTTP_400]
  loadingTab:
    from: listDeckPublishRequests
    unavailable: [DECK_REVIEW_FORBIDDEN, HTTP_400]
  selecting:
    from: readDeckPublishRequestCards
    unavailable: [DECK_REQUEST_NOT_FOUND, DECK_REVIEW_FORBIDDEN, HTTP_400]
  readingAll:
    from: readDeckPublishRequestCards
    unavailable: [DECK_REQUEST_NOT_FOUND, DECK_REVIEW_FORBIDDEN, HTTP_400]
  approving:
    from: approveDeckPublishRequest
    answered: [DECK_REQUEST_NOT_PENDING]
    gone: [DECK_REQUEST_NOT_FOUND]
    forbidden: [DECK_REVIEW_FORBIDDEN]
    other: [HTTP_400]
  rejecting:
    from: rejectDeckPublishRequest
    answered: [DECK_REQUEST_NOT_PENDING]
    gone: [DECK_REQUEST_NOT_FOUND]
    forbidden: [DECK_REVIEW_FORBIDDEN]
    other: [VALIDATION_ERROR, HTTP_400]
  unpublishing:
    from: unpublishDeck
    answered: [DECK_NOT_PUBLISHED]
    gone: [DECK_REQUEST_NOT_FOUND]
    other: [DECK_REVIEW_FORBIDDEN, VALIDATION_ERROR, HTTP_400]

# The story the page tells first: the başnazım arrives from the home's "İncele" (?secili=), reads the sample and every card of the first request, publishes
# it, refuses the next with a reason, then opens "Karara bağlanan" and takes the published deck back with a reason.
main:
  given: { read: ok, link: waiting, requested: true, reviewer: chief, decided: rejected, sample: cards, answer: done }
  events: [DONE, DONE, READ_ALL, DONE, APPROVE, DONE, DONE, REJECT, FILL_REASON, SUBMIT, DONE, DONE, TAB_DECIDED, DONE, SELECT_PUBLISHED, UNPUBLISH, FILL_REASON, SUBMIT, DONE]

initial: opened

states:
  opened:
    title: The waiting requests are read
    description: >-
      The page is a server component: it reads GET /nizam/deck-publish-requests?status=PENDING (twelve rows, the oldest request first, and both tab
      counts) and the caller's own record (getMe, for the başnazım's extra button) before it draws; `loading.tsx` is the skeleton meanwhile. tedrisat
      answers the başnazım and a Medaris nazımı holding platform.deck_publish; anyone else gets 403 and the page calls forbidden() (the exit
      `no_access`, deck-review#5 for a köşk nazımı). A read that fails or answers 404 gives the page nothing, and it draws its frame with the error
      "İstekler okunamadı" (`unreadable`). `?secili=` is read too: it selects the request it names only if that request is among the twelve rows
      read; any other id, or none, selects the first row without a word (DECKREV-2, deck-requests-view.tsx:84-88).
    source: apps/nizam/app/talepler/deste-yayin-istekleri/page.tsx:31
    invoke: { action: listDeckPublishRequests }
    on:
      DONE:
        - { guard: "read == 'ok' and link == 'waiting' and requested", target: shown, source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:85, say: "?secili= names a waiting request among the twelve: that one is selected (the home's 'İncele')" }
        - { guard: "read == 'ok' and link == 'gone'", target: shown, source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:86, say: "?secili= names one that is not among them: the first waiting request is selected, in silence (DECKREV-2)" }
        - { guard: "read == 'ok'", target: shown, source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:86, say: "no ?secili=: the oldest waiting request is selected" }
      FAIL.forbidden: { guard: "read == 'refused'", target: no_access, source: apps/nizam/app/talepler/deste-yayin-istekleri/page.tsx:32, say: "403: forbidden(), the screen 'Bu bölüm için izniniz yok'" }
      FAIL.unavailable: { guard: "read == 'failed'", target: unreadable, source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:498, say: "the read gave nothing: the frame, and an alert with 'Tekrar dene'" }

  shown:
    title: Which page, the list or nothing?
    description: >-
      Not a screen: after a read, a tab switch or a decision the page shows the list with a request selected, or says that nothing is there. A
      decision takes the row off the waiting list on the page itself and selects the next one; it does not read the list again, so a request
      made after the page opened is not on it until a reload. Selecting a waiting request reads its cards (`selecting`); a request of the answered
      tab reads nothing, its row already holds everything the page shows.
    source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:531
    always:
      - { guard: waitingEmpty, target: empty, say: "no request waits: 'Karar bekleyen deste yayın isteği yok.'" }
      - { guard: decidedEmpty, target: empty, say: "nothing was answered yet: 'Karara bağlanmış istek yok.'" }
      - { guard: onPublished, target: decidedPublished, say: "the newest answered request is a published deck: it is selected" }
      - { guard: onRefused, target: decidedRejected, say: "the newest answered request is a refused one: it is selected" }
      - { target: selecting, effect: [freshSample], say: "the first waiting request is selected and its sample cards are read" }

  unreadable:
    title: The requests could not be read
    by: human
    description: >-
      The h1, the intro and the notice stay; the tabs, the list and the detail are replaced by an error alert "İstekler okunamadı" with the sentence
      "Deste yayın istekleri şu anda alınamıyor. Biraz sonra yeniden deneyin." and a "Tekrar dene" button. When a read after the page opened failed
      (the retry, the answered tab) a toast of the same title stays on until it is closed. While the answered tab cannot be read the tabs are not
      drawn at all, so the person cannot go back to the waiting tab (DECKREV-3); only the button or a reload is left. Not walkable on the stack:
      nothing makes tedrisat's read fail on request.
    source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:498
    on:
      RETRY: { target: retrying, effect: [clearNote], source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:501, say: "they press Tekrar dene: the tab being shown is read again" }
      NAVIGATE: { target: left, say: "they leave the page" }

  retrying:
    title: The read is tried again
    description: >-
      loadDeckRequests(tab), a server action that calls GET /nizam/deck-publish-requests with the tab's status; the alert stays while it runs. On
      success both counts are replaced, the list is kept and its first row is selected.
    source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:106
    invoke: { action: listDeckPublishRequests }
    on:
      DONE: { target: shown, source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:127, say: "the list is there: the alert goes" }
      FAIL.unavailable: { target: unreadable, effect: [toastLoadFailed], source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:119, say: "again nothing: a toast that stays and the alert" }
      RETRY: { target: retrying, source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:501, say: "they press Tekrar dene again while the read runs: the button is not busy, and a second read is asked" }

  empty:
    title: Nothing is listed
    by: human
    description: >-
      The h1, the intro, the notice and the tabs, then one sentence: "Karar bekleyen deste yayın isteği yok." on the waiting tab, "Karara bağlanmış istek
      yok." on the answered one. The counts are in the tabs. A toast of the last decision may still be on. The waiting tab also shows this line
      when the last request was answered on this page.
    source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:531
    on:
      TAB_DECIDED: { guard: "tab == 'waiting'", target: loadingTab, effect: [toDecided], source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:167, say: "they open Karara bağlanan" }
      TAB_WAITING: { guard: "tab == 'decided'", target: shown, effect: [toWaiting], source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:167, say: "they go back to Bekleyen: the list read first is held, no read" }
      NAVIGATE: { target: left, say: "they leave the page" }

  loadingTab:
    title: The answered tab is read
    description: >-
      The first time "Karara bağlanan" is opened (and again after any decision on "Bekleyen", which throws the held answered list away,
      deck-requests-view.tsx:219) the page reads GET /nizam/deck-publish-requests?status=DECIDED through a server action and shows three skeleton
      rows meanwhile (`aria-busy`, no live region). A second visit with no decision between them finds the list held and skips this step (not
      drawn). The read also replaces both tab counts and selects the first (newest) answered request. Bekleyen pressed meanwhile shows the
      waiting list at once, and the read, when it lands, is dropped (a ticket, deck-requests-view.tsx:101-116, and a tab switch takes a new
      one, :168): it selects nothing, so no answered request's cards are read under Bekleyen (fixed 23 Nov 2026).
    source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:106
    invoke: { action: listDeckPublishRequests }
    on:
      DONE: { target: shown, source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:128, say: "the answered requests are there; the newest is selected" }
      FAIL.unavailable: { target: unreadable, effect: [toastLoadFailed], source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:119, say: "the read failed: the error replaces the tabs and a toast stays on (DECKREV-3)" }
      TAB_DECIDED: { target: loadingTab, source: libs/ui/src/mds/tabs.tsx:110, say: "they press Karara bağlanan, the tab shown while its list is read: nothing happens, the read goes on" }
      TAB_WAITING: { target: shown, effect: [toWaiting], source: apps/nizam/features/deck-review/components/deck-requests-view.tsx:168, say: "they go back to Bekleyen before the read is back: the waiting list shows at once, and the read is dropped when it lands" }

  selecting:
    title: The sample cards are read
    description: >-
      Whenever a waiting request becomes the selected one, whoever chose it (the page on load, after a decision, after a return to "Bekleyen", or the
      reader's click), an effect reads GET /nizam/deck-publish-requests/{id}/cards: three cards in creation order and the deck's total. tedrisat
      writes the look to the audit log (`deck.private-read`, scope `sample`) before the cards leave (DECKREV-1). The list, the detail's header and
      its buttons are drawn at once, the grid is three skeleton blocks (`aria-busy`, no live region) until the answer comes; "Yayımla" and
      "Reddet" are on meanwhile (DECKREV-6). Only a waiting request reads: the answered tab sets the cards aside.
