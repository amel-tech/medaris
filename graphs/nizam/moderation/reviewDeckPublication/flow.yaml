  approving:
    title: The publication is on its way
    description: >-
      approveDeckRequest, POST /nizam/deck-publish-requests/{id}/approve with no body, answered 204. "Yayımla" is busy (aria-disabled, a hidden status
      that says "Yükleniyor" from a hard-coded default) and "Reddet" is disabled; the rows stay live. The deck becomes PUBLISHED and public at once, the
