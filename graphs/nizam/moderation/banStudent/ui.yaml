rules:
  - { id: focus-not-set, rule: "Neither the Talebeler page nor Yasaklamalar sets the focus on arrival (nothing in features/applications or features/bans calls focus(); the shell's skip link is the shell's), so no page node has `initialFocus`; the window's own is the reason (ban-dialog.tsx:134)." }
  - { id: no-default-accept, rule: "No page has `initialFocus` on the action that sends: the window starts in the reason. The scrim does not close the form (libs/ui/src/mds/dialog.tsx:71, bans#3); Escape, Vazgeç and the close icon do, unless a ban is being sent (BANST-5)." }
  - { id: F-W5-2, rule: "The textarea is `disabled={saving}` (ban-dialog.tsx:202) and so are the radios (:172), so the focused reason loses the focus the moment the ban is sent and, after a refusal, nothing puts it back; the window's first control is not refocused and the toast, in another portal, is not focused either. Fix: keep the field enabled with `aria-busy`, or refocus it when the send fails." }
  - { id: F-W5-3, rule: "A refusal is told only by a sticky toast (ban-dialog.tsx:94-98, `duration: Infinity`): nothing inside the open window says it failed and no field is marked. A screen-reader user hears it only if the toast region announces (F-P0-18). Fix: put an Alert with role=alert inside the window with the same words (F-X-4 is the family)." }
  - { id: F-W5-4, rule: "The reason's error 'Bir gerekçe yazın.' appears only after the field was left (`touched && blank`, ban-dialog.tsx:75, :204) and the button is natively off while the reason is blank (:142), so a keyboard user who tabs on never reaches the button and is told nothing; the error is wired by aria-describedby and has no live region (libs/ui/src/mds/field.tsx:50-53, F-X-2). Fix: keep the button on, validate on send and move the focus to the reason." }
  - { id: F-X-3, rule: "The family of F-W5-4: a submit button natively disabled with no reason given, here and in the lift and widen windows of nizam." }
  - { id: F-UI-W1-1, rule: "Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:103-112), so a screen reader may read the intro, the person, every radio and the reason as the window's description when it opens." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Yasakla' in 'Yasakla: {name}' (WCAG 2.5.3). Holds. The window's name 'Talebeyi yasakla' and its submit 'Yasakla' are two words, so the replay finds the submit inside the window; the page behind it is inert." }
  - { id: BANST-1, rule: "new: the hoca cannot use this page, so 'the müderris bars the course only' is true of the API and of no screen here. The layout lets in a nazım or the başnazım only (`landingFor(me) !== 'nizam'` is `forbidden()`, the 'Bu bölüm için izniniz yok' screen, apps/nizam/app/kosks/layout.tsx:20, features/assignments/landing.ts:18-25: a person whose roles are a medrese's or a course's has the landing send them to Nazar; bans#9 pins the refusal at Yasaklamalar), and nazar's course Yasaklamalar refuses the hoca as well (F-D2c-3). The disabled köşk option and its note ('Köşkün bütün dersleri için yasağı yalnız köşk nazımı koyabilir.', ban-dialog.tsx:182-185, `mayBanWholeKosk`, present.ts:111-118) are drawn here as `scope: limited` and nobody can be that person; a Medaris nazımı holds no default permission (permissions.ts:356) and course work is not reached from a platform grant (effective-permissions.ts:159-166), so by role alone none reads a roster. Fix: decision D1." }
  - { id: BANST-2, rule: "new: a person already barred in that scope is answered with the standing ban and the same 201 (ban.service.ts:165-182, `created` false; ban.repository.ts:299-326), and the window cannot tell: it says 'Yasak kaydedildi' with '{name} artık bu derse erişemez.' (ban-dialog.tsx:100-106), so the nazım believes the reason just typed was recorded, when the standing ban keeps its own reason, banner and date, no row is added and nobody is notified. The roster hides 'Yasakla' on a barred row (`studentActions`, features/applications/present.ts:138-151), so only a stale page, or two nazım at once, meets it. The nazar twin is BAN-4. Fix: decision D2." }
  - { id: BANST-3, rule: "new: after a ban the row's buttons are `studentActions(ENROLLED, barred)`, that is 'Tamamladı say' and 'Yasağı kaldır', and each is keyed by its action (roster-table.tsx:223-235), so the 'Yasakla' that opened the window is unmounted by the refresh and Base UI has nothing to give the focus back to: it falls to the page, and a keyboard or screen-reader user starts again from the top (F-W5-5 is the family; F-X-7). After Vazgeç or Escape the button is still there and gets the focus. The graph draws `returnsFocus` for the second case only: the row's button is not a node of `savedRow`. Fix: focus the row's new 'Yasağı kaldır', or the toast." }
  - { id: BANST-4, rule: "new, from the code and not seen: `submit` awaits `createBan` outside a try (ban-dialog.tsx:85-91) and clears `saving` only after it (:91). A Server Action that rejects, as one does when the Next server cannot be reached, leaves `saving` true for good: the window stays busy, and Vazgeç, the close icon and Escape are all no-ops (`if (!saving)`, :126), so it cannot be closed without a reload. A refusal by the API is not this: `authenticatedAction` turns every ResponseError into `{ success: false }` (lib/authenticated-action.ts:47-72). Fix: `try/finally` around the call." }
  - { id: BANST-5, rule: "new: while the ban is sent, Vazgeç, the close icon and Escape stay enabled and do nothing (`if (!saving) onOpenChange(next)`, ban-dialog.tsx:126), and the busy button is aria-disabled, not disabled; the nazar twin is BAN-3, the köşk-opening twin F-W3-open-2. Fix: disable them with the rest of the form while `saving`." }
  - { id: BANST-6, rule: "new, for nizam.courses.roster, from the code and not walked: the row's badge reads `e.ban.scope === 'KOSK' ? 'Yasaklı · Köşk' : 'Yasaklı · Bu ders'` (roster-table.tsx:164), but the roster marks a ban over the whole medrese too (ban.repository.ts:239-261, `bans.madrasahId = courseMadrasah`), so a medrese-wide ban placed in Nazar reads 'Bu ders' on the köşk nazımı's roster of a medrese's course, and the row then offers 'Yasağı kaldır', which the API refuses the köşk nazımı (a medrese ban is lifted with madrasah.ban or platform.ban_scoped, ban-codes.ts:38-53). Fix: a third label, 'Yasaklı · Medrese', and no lift button the viewer may not use." }
  - { id: ban-staff-check-gaps, rule: "Security finding (ledger/security.md), drawn as the code does it on this page's route and nothing more. createBan checks who the person is only by `repo.rolesHeld(userId, {koskId, courseId, madrasahId})` (ban.service.ts:155-163), which reads `role_assignments` rows held at the platform, the köşk, the course and the medrese (ban.repository.ts:273-290); the list of roles it refuses is `RUNS_COURSE_ROLES`, and `RUNS_MADRASAH_ROLES` for a medrese's course (ban-tier.ts:66-85). So: SYSTEM_ADMIN is named in both lists and can never be found, because the başnazım is a realm role with no row; and a role held at another course of the same köşk is at none of the four scopes, so it is not found for a ban of the whole köşk. A person who is both a talebe of this course and one of those is barred without BAN_TARGET_INVALID. The page lists only enrolled talebe, so it offers 'Yasakla' for such a person only if they hold a seat here. Not walked; no request that uses the gap is proposed. extendBan and escalateBan skip the check altogether (nazar.bans.decide, nizam.moderation.decideBan)." }
  - { id: BANDEC-3, rule: "Security finding (ledger/security.md): createMadrasahBan, the medrese route, reads no course or köşk role for a medrese-wide ban, so a hoca can be barred from a whole medrese on creation. NOT reachable from this page: its window posts to the course route (POST /courses/{courseId}/bans, features/bans/actions.ts:22-31), which reads all four scopes (BANDEC-3 belongs to nazar.bans.ban's route)." }
  - { id: TRIAGE-2-seen-from-here, rule: "The window promises 'Yasak, gerekçesiyle köşk nazımlarına ve Medaris yönetimine görünür' (BanDialog.visibility) and the notice does reach every Medaris nazımı with the talebe's name and the reason, whether or not they hold a ban permission (ban.repository.ts:435-455); the başnazım, who is Medaris yönetimi, is never told (TRIAGE-1, TRIAGE-2 in nizam.notifications.triage)." }
