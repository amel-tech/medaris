# The screens of nizam.moderation.banStudent: a course's Talebeler page (/kosks/<id>/courses/<id>/students) on its tabs Başvurular and
# Kayıtlı, the "Talebeyi yasakla" window over it with its toasts, the row after the ban, and the köşk's Yasaklamalar (/kosks/<id>/yasaklamalar)
# with the new row. Read from apps/nizam/features/bans/components/{ban-dialog,bans-view}.tsx, features/applications/components/{students-tabs,
# roster-table}.tsx, the page of the Talebeler tab and libs/ui/src/mds on 16 Nov 2026; the words are copied from libs/i18n/src/locales/tr/
# nizam.json (namespaces BanDialog, StudentsRoster, StudentsPage, BansPage, Shell), letter for letter.
#
# `changes` is the window's own intro ("Yasak hemen geçerli olur. …"), which tells the person what the ban does; no message was written for this
# flow. Entries built in code that belong to no i18n file are `composed.*` with their placeholders (each a data value set in a node):
#   composed.BanDialog.eyebrow           the course's title above the window's title            (ban-dialog.tsx:131)
#   composed.BanDialog.personName        the talebe's name in the person block                   (ban-dialog.tsx:153)
#   composed.BanDialog.personEmail       their e-mail, drawn only when they have one            (ban-dialog.tsx:157)
#   composed.StudentsRoster.person       the name in the row's first cell                        (roster-table.tsx:161)
#   composed.BansPage.count              a tab's number, a <span class=mds-tab__count>           (libs/ui/src/mds/tabs.tsx:67)
#   composed.BansPage.person / email     the name and the e-mail in a ban's first cell           (bans-view.tsx:168, :179)
#   composed.BansPage.scopeDetail        the second line of the scope cell: the course's title, or the köşk's name, then "· {course} dersinden
#                                        genişletildi" for a widened ban, joined by " · "          (present.ts:157-185, bans-view.tsx:204)
#   composed.BansPage.reason / bannedBy / time   the reason as typed (trimmed), the name of who barred, "Bugün 21:04"  (bans-view.tsx:214, :222, :232)
#   composed.Button.loading              the busy button's hidden <output>, a default of libs/ui/src/mds/button.tsx:62
#
# The page behind the window is drawn only where the window is closed: the window is modal, so the page is inert while it is open. There is
# one window, drawn for the three states that show it; its first focus is the reason, its way back is the row's "Yasakla".
