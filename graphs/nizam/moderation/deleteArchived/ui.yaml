edges:
  - { labelledBy: [archiveRegion, regionHeading] }
  - { labelledBy: [deleteDialog, dialogTitle] }
  - { triggers: [deleteButton, readingImpact] }
  - { triggers: [dialogConfirm, deleting] }
  - { returnsFocus: [deleteDialog, deleteButton] } # Vazgeç, Esc or the close icon: Base UI hands the focus back to the element that had it when the dialog opened, the row's button, which is still there; not verified in a browser

rules:
  - { id: focus-not-set, rule: "The page sets no initial focus: nothing in archive-view.tsx or page.tsx moves it on load, so a keyboard or screen-reader user starts from the top of the document and tabs through the whole sidebar first (F-UI-P0-1). Not drawn as an initialFocus, because the app gives none." }
  - { id: F-W5-5, rule: "archive-view.tsx:228-241: after a delete (and after a restore) the pressed 'Kalıcı olarak sil' leaves with its row, the dialog closes and nothing moves the focus, so it falls to the page (not verified). What a screen reader hears is the live count 'N gizli öğe' (aria-live polite) and a toast of six seconds in Sonner's English-named region. Fix: move the focus to the table caption, the next row's button or the count after a delete, and keep the count live." }
  - { id: F-W5-3, rule: "archive-view.tsx:244-247: a delete the server refuses leaves the dialog open and is told by a toast alone: 'Silinemedi' that stays until it is closed, whose text is the server's own message (result.error, English, in no catalog), in another portal than the dialog; nothing inside the dialog says it failed and no node is marked. While a modal dialog is open Base UI makes the rest of the document inert, so the toast may be unreachable by keyboard and hidden from assistive technology (not verified). Fix: an Alert tone=error inside the dialog body with a message from the catalog, keyed by the code." }
  - { id: MDRS-244, rule: "archive.repository.ts:748-813: purging a hidden WEEK or SESSION deletes its notes, questions, resources, hand-ins, homework and lessons but not its recording (a course's purge does: course-purge.ts:90-103), so a week or session with a recording is refused by the foreign key and the call answers a server error. The dialog counts it as deletable (its `recordings` count is a constant 0), the person presses 'Kalıcı olarak sil', and gets the toast of F-W5-3. Drawn as `deleting` FAIL.other for item blockedWeek. Fix: delete the recording row in the week's and the session's purge, and count it." }
  - { id: PURGE-1, rule: "new: archive.repository.ts:630-682 and present.ts:169-195: the dialog says '<title> ve ona bağlı her şey kalıcı olarak silinecek' and then lists weeks, talebe records and celses; the API's `recordings` is a constant 0 (:678), so the line 'N ders kaydı' of dialog.recordings can never show, and the notes, questions, homework with the talebe's files, exams, course resources and role assignments that purgeCourses deletes (course-purge.ts) are not counted at all. A course with recordings, hand-ins and files reads like one with only its syllabus. Fix: count each kind the purge deletes, or say which kinds the count leaves out." }
  - { id: PURGE-2, rule: "new: archive-view.tsx:228-230, 490-497: after a delete the page removes the row from its own list and counts the total down, and reads nothing again. 'Daha fazla göster' then asks for page (page + 1) of a list that is one row shorter, so the row that moved up into the gap is never loaded; and a row someone else hid meanwhile is not in the list until the page is reloaded. The same applies after 'Geri al'. Not drawn (a list of more than ten rows). Fix: read the list again after a delete, or ask for the next page by the number of rows already held." }
  - { id: PURGE-3, rule: "new: archive-view.tsx:225-241: an item that is gone already (ARCHIVE_ITEM_NOT_FOUND: deleted by someone else, or brought back) is told with the error toast 'Silinemedi' / 'Bu öğe zaten silinmiş ya da artık gizli değil.' that stays until it is closed, while the dialog closes and the row leaves the list as for a success. The person asked for the item to be gone and it is; and 'artık gizli değil' (it was brought back) is the opposite and is not told apart from it. Fix: a neutral notice that closes by itself, and a different sentence for an item that is shown again." }
  - { id: PURGE-4, rule: "new: archive-view.tsx:509-511: 'Vazgeç', the close icon and Esc stay enabled while the delete runs and do nothing (`if (!open && !deleting) closeDialog()`); only 'Kalıcı olarak sil' is busy. The same as F-W3-hide-1 in the köşk's hide dialog and HIDE-3 in Nazar's. Fix: disable them while the call runs, or let them wait for it." }
  - { id: PURGE-5, rule: "new: archive-view.tsx:200-209: askDelete takes no ticket (fetchPage does, :123): if the dialog of one row is closed before its count arrives and another row's dialog is open, the late answer replaces `impact` and the second dialog lists the first item's counts under the second item's name, with 'Kalıcı olarak sil' on. A window of a few hundred milliseconds; not reproduced. Fix: compare the target before setting the count." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Kalıcı olarak sil' in 'Kalıcı olarak sil: {title}, {context}' (WCAG 2.5.3). Holds." }
  - { id: confirm-before-delete, rule: "The delete asks first, in an alertdialog whose focus starts on 'Vazgeç', that says it cannot be undone, counts what goes and says it is written to the audit log under the person's name; the confirm is natively off until the count is read. Holds." }
  - { id: F-UI-W1-3, rule: "libs/ui/src/mds/button.tsx:62: the busy confirm's hidden status says 'Yükleniyor' from a hard-coded default (the dialog passes no loadingLabel), and the dialog's close icon says 'Kapat' from the catalog but a toast's close button says it from the kit." }
  - { id: scope-list-is-flat, rule: "archive-view.tsx:257-267: the scope select lists the köşks and then the medreses of the archive in one list, each by its name alone and with no group or kind, so a köşk and a medrese that share a word in their names cannot be told apart. Product wording, not a defect of the walk." }
