# The screens of nizam.moderation.deleteArchived: Arşiv for the başnazım (/arsiv, features/archive/components/archive-view.tsx in its
# "platform" mode) with its two selects and its table, the alertdialog "Dersi kalıcı olarak sil" over it with the count of what goes,
# and the toasts that answer a delete. Read from apps/nizam/app/arsiv/page.tsx, apps/nizam/features/archive/{components/archive-view.tsx,
# present.ts} and libs/ui/src/mds/{alert-dialog,button,select,table,alert}.tsx on 16 Nov 2026. Nothing was seen in a browser by its
# writer: every behaviour is "from the code" unless a rule says otherwise.
#
# What this file leaves to its neighbours (flow.yaml `scope.outOfView` names them): "Geri al" and the sentence of a higher kademe
# (nizam.moderation.restoreArchived, which draws the same page), the köşk's own archive, the search box typed in, "Daha fazla göster",
# the table's column headers, a refused or failed first read, and a row of another kind than a course or a week.
#
# Words: every key that has no `composed.` prefix is copied letter for letter from libs/i18n/src/locales/tr/nizam.json (the file the app
# reads as `nizam`; the key is the path under its root), by <scratchpad>/mkcat/mkcat-deleteArchived.py, except `Changes.note`, the one
# authored message of this catalog: the app says in two places what a delete does (the dialog's body: "ve ona bağlı her şey kalıcı olarak
# silinecek. Bu işlem geri alınamaz." and its audit sentence) but in none that names what goes and says it in one breath, so the note is
# made of the app's own words (dialog.body, dialog.weeks, dialog.sessions, dialog.students, dialog.audit). The `composed.*` keys are text
# the app builds in code from data and messages; each has its code line here, and a placeholder the binding gives no sample for matches
# any text:
#   composed.ArchivePage.rowTitle       "{title}"    the item's title, <bdi class="font-semibold"> in the row header (archive-view.tsx:276)
#   composed.ArchivePage.rowLine        "{line}"     the grey line under it: the kind, then what it holds, joined with " · ": "Ders · 2 hafta · 3 talebe"
#                                                    (archive-view.tsx:271-278, present.ts contextParts)
#   composed.ArchivePage.rowKosk        "{kosk}"     the Kapsam cell: the köşk's name (and the medrese's under it, which a köşk's course has none of)
#                                                    (archive-view.tsx:298)
#   composed.ArchivePage.rowHider       "{who}"      the Gizleyen cell: the hider's name (archive-view.tsx:326); the başnazım holds no role in any scope,
#                                                    so there is no second line under it
#   composed.ArchivePage.scopeOption    "{kosk}"     the scope select's text once a köşk is chosen: the option's label is the köşk's own name (archive-view.tsx:259-262)
#   composed.ArchivePage.dialogEyebrow  "{kosk}"     the köşk's name above the dialog's title (archive-view.tsx:512)
#   composed.ArchivePage.deleteError    "{message}"  the failed delete's toast text: whatever the API answered, in the API's language (archive-view.tsx:245)
#   composed.Button.loading             "Yükleniyor" the busy button's hidden status, a default of the kit (libs/ui/src/mds/button.tsx:62)
# The dialog's body, "<b>{title}</b> ve ona bağlı her şey kalıcı olarak silinecek. ...", is a rich-text message (tm.rich with <b>); the
# graph draws it as one text node and the binding finds it by its ending.
#
# The dialog is modal, so the page behind it is inert: the page nodes are not listed in the four dialog states. The toasts are Sonner's
# (libs/ui/src/components/sonner.tsx): a title and a body each, no role of their own, so they are `status` nodes that the binding finds by
# their text.
