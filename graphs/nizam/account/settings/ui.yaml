rules:
  - { id: F-W1-7, rule: "Both time-zone selects are `disabled={busy}` while PATCH /me runs (time-zone-form.tsx:88, 109), so the combobox that holds the focus is disabled in the middle of the interaction and the focus is lost; nothing says 'saving' until the toast. The graph draws the lists disabled in savingZone (disabledIn). From the code, not seen in a browser. Fix: keep the select enabled with aria-busy, or give the focus back when the save ends, and add a status line." }
  - { id: F-W1-8, rule: "app/hesap/loading.tsx:8 is an aria-busy <div> whose only children are aria-hidden skeletons: a screen-reader user hears nothing while the page loads. Not drawn in this graph (a skeleton is no state of the flow). Fix: a visually hidden role=status 'Yükleniyor' with a catalog key." }
  - { id: F-W1-9, rule: "The permission groups are h4 under the h2 'Etkin izinleriniz' (permissions-list.tsx:88, 111): a level is skipped. The graph says the level in comments on chiefGroupTitle and groupTitle. Fix: h3 with the mds-h6 class." }
  - { id: F-W1-9b, rule: "e2e account#5 a4 to a6 expect a read-only field 'Dil' = 'Türkçe' and the sentence 'Medaris şimdilik yalnız Türkçe görünür.'; the page has neither (a grep of features/account finds no language field), and AccountPage.language and languageHelp are in the catalog and used by nothing. Those three assertions are STALE and are not carried; a1 to a3 (the address and its help line) hold. Fix: delete a4 to a6 and the two dead keys." }
  - { id: F-W1-14, rule: "'Nazar’da aç' opens a new tab (target=_blank, account-page.tsx:247-251) and nothing says so: its icon is decorative and its name is the words alone. Drawn only for a person who holds a hoca's role. Fix: a visually hidden '(yeni sekmede açılır)' from the catalog." }
  - { id: F-UI-W1-3, rule: "The toast's close button is named by the literal aria-label 'Kapat' (libs/ui/src/mds/toast.tsx:97) and its region by the literal 'Bildirimler' (:127), not by the catalog, so neither can follow another locale. Cross-cutting. Fix: accept the labels from the catalog." }
  - { id: NIZSET-1, rule: "A refused save of a choice made in the FIRST list, when the zone held is outside the eight and the second list was open, leaves the page inconsistent: onChange hides the second list before the save (`setFull(false)`, time-zone-form.tsx:95) and the rollback puts the zone back (:66) but not the list, so the second list is gone and the first list holds a zone that none of its nine options names (Base UI Select shows whatever it shows for a value no item carries; not seen). A reload draws the second list again (needsFullList). Tedris's Hesap draws its lists from one state and does not have this. From the code; no way to make the save refuse on the stack. Fix: derive the second list's presence from the zone held (needsFullList(confirmed)) after a refusal, or set it back with the zone. New finding, proposed id." }
  - { id: NIZSET-2, rule: "A Medaris nazımı reads 'Size ayrıca verilmiş bir izin grubu yok.' under 'Etkin izinleriniz' and no sentence at all, although GET /me/effective-permissions answers the group MEDARIS_NAZIM with five codes for the seeded one (platform.kosk_create, kosk_edit, course_hide, madrasah_create, audit_read) and the Medaris home lists permissions in words: the catalog has no sentence for any platform.* code, so visibleGroups drops the group (account-view.ts:114-125) and the card empties itself. test/account.spec.tsx:365 pins the empty card as the design; the sentence still tells a person who holds permissions that they hold none. Seen on the stack as data (a GET), not in a browser. Fix: write the sentences for the platform.* codes, or word the empty card as 'listed on Ana sayfa'. New finding, proposed id; product wording." }
  - { id: NIZSET-3, rule: "Every permission group is a <section aria-labelledby> (permissions-list.tsx:83-86, 106-110), that is a region landmark; with several roles the page gets as many regions as groups next to the cards' own. The same shape as nazar's F-E-19. Fix: a div with the heading, and keep landmarks for the cards. New finding for nizam, proposed id." }
  - { id: NIZSET-4, rule: "When any one of the three reads fails, getAccountData answers null (reads.ts:34-38) and the page keeps only its title, one alert and 'Yeniden dene' (app/hesap/page.tsx:30-42): the time-zone card, the e-mail and the sign-out card go with it, though none of them needs the failed read, and the sign-out link on this page is the only link to /auth/signout in nizam (grep of apps/nizam), so a person whose read fails can leave only by typing the address. The same shape as tedris's HESAP-1. Not seen: the stack cannot make a read fail. Fix: draw the sign-out card outside the null branch. New finding, proposed id." }
  - { id: focus-not-set, rule: "Hesap sets no initial focus (no autoFocus and no focus() in features/account), so the page node has no `initialFocus` and the graph says nothing of the focus when the page opens; after a pick, after the toast and after the star's bubble closes the focus is Base UI's (the list's button, the star) and was not seen. Recorded so the silence is not read as an omission." }
  - { id: saves-at-once, rule: "There is no Kaydet on this page: a zone chosen from either list is saved at that moment (e2e account#4: no Kaydet is looked for, and the help line says 'Seçtiğiniz an kaydedilir.'). The toast and that line are the only words about it; the graph carries the rule by sending every pick straight to savingZone." }
  - { id: label-in-name, rule: "Where a control's visible text is part of its name, the name contains it (WCAG 2.5.3): 'Çıkış yap', 'Nazar’da aç', 'Yeniden dene' and 'Kapat' are their own names, and the star's name is its words 'Dersin imamı'. Holds." }
