# The screens of nizam.account.settings: nizam-web's Hesap ve ayarlar (/hesap, app/hesap/page.tsx) with its three cards and its
# aside, the two time-zone lists, the toasts of a save, the imam star's bubble, and the page that takes the cards' place when a read
# fails. Read from apps/nizam/features/account (account-page, assignments-table, permissions-list, time-zone-form, account-view) and
# the kit's Select, Table, Toast, Alert and ImamStar (libs/ui/src/mds) on 15 Nov 2026; the words are copied from
# libs/i18n/src/locales/tr/nizam.json (namespace AccountPage) and common.json (imamStar). The frame around the page (the sidebar, the
# phone bar, the person row that links here) is nizam.shell.menuPerPersona's and is not drawn.
#
# Words that are in no i18n file are `composed.*`, with the line of the code that makes each:
#   composed.AccountPage.scope, scopeMeta, scopeMetaKosk, grantor, grantedAt   values the API gives, shown as they are
#                                      (assignments-table.tsx:65, 82, 93, 97; account-view.ts:59-64; scopeMeta joins the köşk and the medrese with " · ")
#   composed.AccountPage.groupTitle    "<scope> · <role in lower case>" (permissions-list.tsx:34, 89)
#   composed.AccountPage.personName / roleLine / email   the profile's name (or the session's), the roles held joined by " · ", and the
#                                      address (account-page.tsx:116-118, 226, 233)
#   composed.AccountPage.listedZone    a zone of the second list: its id with the underscores as spaces, "Asia/Tokyo" (time-zone-form.tsx:106)
#   composed.Toast.close               the toast's close button, a literal of the kit (libs/ui/src/mds/toast.tsx:97; F-UI-W1-3)
# `changes` is the app's own help line under the first list: what the choice sets, and that it is saved at that moment. No message was
# authored for this catalog. AccountPage.language and AccountPage.languageHelp are in the app's file and are used by nothing (F-W1-9b): not copied.
# Samples are invented and neutral; the binding gives each scenario the real person's name, roles and e-mail.
