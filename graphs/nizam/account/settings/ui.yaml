  kosk: Örnek köşk
  madrasah: Örnek medrese
  grantor: Örnek kişi
  granted: 3 Kasım 2026
  date: 3 Aralık 2026
  role: köşk nazımı
  names: Örnek köşk ve Başka köşk
  name: Örnek Kişi
  roles: Köşk nazımı
  email: kisi@ornek.test
  zone: Asia/Tokyo

