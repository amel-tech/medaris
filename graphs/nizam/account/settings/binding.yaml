# nizam.account.settings on the local stack: Hesap ve ayarlar of nizam-web (http://localhost:4001/hesap) as six of the seeded people,
# four of them arriving by the person row of the sidebar (the nizam navigation graph's entry frame:shell->account), the two hocas by
# the address, because the nav graph's goal for this flow names no hoca persona.
#   flock <scratchpad>/replay.lock nice -n 10 node apps/engine/src/cli.ts replay graphs/nizam/account/settings \
#     --bind graphs/nizam/account/settings/binding.yaml [--cover transitions] --out <dir>
# NOT RUN: the graphs were written without a replay (the first walks are a later phase). Every locator below, the names of the
# people, and what the stack shows each of them come from the code, the catalog and GET /me, /me/assignments and
# /me/effective-permissions read as each person on 15 Nov 2026; none was looked at in a browser. Loaded with
# `replay <dir> --bind <dir>/binding.yaml --emit-spec --out <scratchpad>/emit/nizam.account.settings` (it walks nothing).
#
# What each scenario starts from (the stack's seed, STACK.md; `--cover transitions` walks one path for each transition of the
# `sorted` router, so each scenario is walked at least to the page):
#   koskNazim     KOSK_NAZIM, 'Cemal Köşk Nazımı': two rows 'Köşk nazımı' (Süleymaniye Köşkü and Kubbealtı Köşkü, both given by the
#                 başnazım, 'Süresiz'), one group of nine sentences that names both köşks. The main story, and the only scenario that
#                 chooses a zone: its `setup` keeps what the account holds (GET /me answers timeZone null: the page shows İstanbul), sets
#                 Europe/Istanbul, and its `teardown` puts the kept value back (helpers/zone.mjs). It is first in the
#                 file so that the picks, which any scenario could walk, are walked here and nowhere else.
#   chief         SYSTEM_ADMIN, 'Vedat Başnazım': no assignment, the page's own row ('Medaris başnazımı', 'Platform', 'Giriş sisteminde
#                 tanımlı', 'Süresiz'), the one group 'Bütün izinler, her kapsamda.' (e2e account#8)
#   medarisNazim  MEDARIS_NAZIM, 'Selma Medaris Nazımı': one row 'Medaris nazımı' on 'Platform'; the engine answers five platform.* codes
#                 and none has a sentence, so the card says there is no group (NIZSET-2)
#   none          OTHER, 'Fikret Misafir': no role, no enrolment: 'Henüz bir göreviniz yok.', no permissions card, no role line
#   hoca          MUDERRIS, 'Hamdi Müderris': three course rows (Yayında, the köşk and the medrese; the third course has no medrese), one
#                 group 'Hoca' over the three courses, the Hocalık card with 'Nazar’da aç' (NIZAM__NAZAR_URL is set on the stack: the key
#                 is there, its value was not read); no star, because each course has one hoca
#   hocaImam      the same hoca with a course of the walk's own that has a second hoca: a fourth row with the star after 'Hoca'. The course
#                 is made by helpers/course.mjs (tag nizacc, one week of one celse, the seed's second köşk, the hoca its imam) and the
#                 başmüderris is seated beside the hoca by seat-hoca.mjs; `teardown` removes the course with its hocas.
# What a walk writes, and how it is taken away: the main story writes the zone of KOSK_NAZIM (users.time_zone, PATCH /me) and puts it
# back as it was; the last scenario makes and removes one course (and its invitation mails, which course.mjs clears). Nothing else is
# written. What it cannot undo: nothing known. A walk that crashed leaves graphs/.local/made/zone-KOSK_NAZIM.json
# (the zone kept: the next `keep` leaves it alone and the next `restore` uses it) and possibly the course (course.mjs make removes an
# old one of its tag first).
# The scenarios of one batch run one at a time under the replay lock; the zone is KOSK_NAZIM's own and no other flow of the stack reads it.
#
# Not walked, with the reason:
#   FAIL.failed        a save that fails (e2e has none; nothing in the stack makes PATCH /me refuse, and a binding cannot abort a request);
#                      so NIZSET-1 and the toast 'Saat dilimi kaydedilemedi.' are drawn from the code
#   FAIL.signedOut     a session that ends under the save
#   read: meFailed, assignmentsFailed, permissionsFailed  no way to make a read of the API fail; the state loadFailed (NIZSET-4) is unbound
#   holds: a person drawn from another seed (a role that ends, a group of grants only, a başmüderris, a medrese nazırı or a ders nazırı
#          opening the page, a person who is a başnazım and a köşk nazımı at once)
schema: delurio-graph/0
kind: binding
extends: ../../../bindings/local.nizam.binding.yaml
flow: nizam.account.settings

# course.mjs writes the made course here; the last scenario reads {made.course}
data:
  made: { json: ../.local/made/nizacc.json }

# `samples` give each person's name, roles and e-mail, which the catalog takes as placeholders. The names are the ones the seed invented
# (STACK.md; the name of the person card is given + family name of GET /me, read as each person).
scenarios:
  koskNazim:
    given: { holds: koskNazim, read: ok }
    as: koskNazim
    open: '{nizam}/'
    enter: { nav: ../../nav, bind: ../../nav/binding.yaml, entry: 'frame:shell->account' }
    samples: { name: 'Cemal Köşk Nazımı', roles: 'Köşk nazımı', email: '{secret.E2E_KOSK_NAZIM_EMAIL}' }
    setup:
      - run: [node, helpers/zone.mjs, keep, koskNazim]
        expect: 'zone kept KOSK_NAZIM'
      - run: [node, helpers/zone.mjs, set, koskNazim, Europe/Istanbul]
        expect: 'zone set KOSK_NAZIM Europe/Istanbul'
    teardown:
      - run: [node, helpers/zone.mjs, restore, koskNazim]
        expect: 'zone restored KOSK_NAZIM'
  chief:
    given: { holds: chief, read: ok }
    as: systemAdmin
    open: '{nizam}/'
    enter: { nav: ../../nav, bind: ../../nav/binding.yaml, entry: 'frame:shell->account' }
    samples: { name: 'Vedat Başnazım', roles: 'Medaris başnazımı', email: '{secret.E2E_SYSTEM_ADMIN_EMAIL}' }
  medarisNazim:
    given: { holds: medarisNazim, read: ok }
    as: medarisNazim
    open: '{nizam}/'
    enter: { nav: ../../nav, bind: ../../nav/binding.yaml, entry: 'frame:shell->account' }
    samples: { name: 'Selma Medaris Nazımı', roles: 'Medaris nazımı', email: '{secret.E2E_MEDARIS_NAZIM_EMAIL}' }
  none:
    given: { holds: none, read: ok }
    as: other
    open: '{nizam}/'
    enter: { nav: ../../nav, bind: ../../nav/binding.yaml, entry: 'frame:shell->account' }
    samples: { name: 'Fikret Misafir', roles: 'Köşk nazımı', email: '{secret.E2E_OTHER_EMAIL}' } # no role line is drawn: the `roles` sample is not read
  hoca:
    given: { holds: hoca, read: ok }
    as: muderris
    open: '{nizam}/hesap'
    samples: { name: 'Hamdi Müderris', roles: 'Hoca', email: '{secret.E2E_MUDERRIS_EMAIL}' }
  hocaImam:
    given: { holds: hocaImam, read: ok }
    as: muderris
    open: '{nizam}/hesap'
    samples: { name: 'Hamdi Müderris', roles: 'Hoca', email: '{secret.E2E_MUDERRIS_EMAIL}' }
    setup:
      - run: [node, helpers/course.mjs, make, nizacc, --weeks, '1', --lessons, '1', --hoca, MUDERRIS]
        expect: '"tag":"nizacc"'
      - run: [node, helpers/seat-hoca.mjs, '{made.course}', basmuderris]
        expect: 'seat-hoca MEDRESE_BASMUDERRIS'
    teardown:
      - run: [node, helpers/course.mjs, remove, nizacc]
        expect: 'course remove nizacc'

events:
  DISMISS: [{ key: Escape }] # the open list closes
  CLOSE_STAR: [{ key: Escape }] # the star's bubble closes; the focus is on the star since the press that opened it
  RELOAD: [{ reload: true }]
  NAVIGATE: [{ goto: 'about:blank' }]
  # the picks (PICK_ISTANBUL, PICK_BERLIN, PICK_OTHER, PICK_TOKYO), OPEN_ZONES, OPEN_LISTED, OPEN_STAR, OPEN_NAZAR, CLOSE_ALERT, RETRY and
  # SIGN_OUT are sent by nodes (the options, the two lists' buttons, the star, the links, the toast's Kapat)

states:
  settings: { url: '{nizam}/hesap' }
  starOpen: { url: '{nizam}/hesap' }
  loadFailed: { url: '{nizam}/hesap' } # not reachable on the stack
  # the save is a Next server action: a POST to the page's own address, held while the busy page is checked; the answer is 200
  # whatever the API said, so no FAIL status is compared here
  savingZone: { call: '{nizam}/hesap' }
  # the link goes to the app's confirmation page in the same tab; nothing ends there
  handed_over.sign_out: { url: '{nizam}/auth/signout' }
  left: { url: 'about:blank' }

# What a save leaves outside the screen: what tedrisat holds for the account, read through the API as that account.
effects:
  savedIstanbul:
    - run: [node, helpers/zone.mjs, get, koskNazim]
      expect: 'zone KOSK_NAZIM Europe/Istanbul'
  savedBerlin:
    - run: [node, helpers/zone.mjs, get, koskNazim]
      expect: 'zone KOSK_NAZIM Europe/Berlin'
  savedTokyo:
    - run: [node, helpers/zone.mjs, get, koskNazim]
      expect: 'zone KOSK_NAZIM Asia/Tokyo'

# Where role and name cannot find a node. Hesap's <main> is found by its subtitle, because the page a walk leaves for has a <main> of its
# own. The table's cells are found by the kit's own hooks (data-testid on the role and the scope, the cells' places); the permission
# sentences by a pattern of all thirty-one of them (the engine finds a `oneOf` node by its first text only). The lists' buttons are found
# by their label, and by the words they show, which is how the page says which zone it holds.
nodes:
  accountPage: { role: main, hasText: 'Görevleriniz, izinleriniz ve saat diliminiz.' }
  failedPage: { role: main, hasText: 'Hesabınız yüklenemedi' }
  accountTitle: { role: heading, name: '/^Hesap$/' } # 'Hesap ve ayarlar' is the h1 and contains it
  accountAside: { role: complementary, name: '/^Hesap$/' }
  tasksRegion: { role: region, name: '/^Görevleriniz$/', hasText: 'Her görev bir kapsamda geçerlidir.' } # the table's scroll frame can be a region of the same name
  columnRole: { role: columnheader, name: '/^Görev$/' }
  # the başnazım's own row
  chiefRole: { testId: assignment-role, hasText: Medaris başnazımı }
  chiefScope: { testId: assignment-scope, hasText: Platform }
  chiefGrantor: { css: 'td:nth-of-type(3) bdi', hasText: Giriş sisteminde tanımlı }
  chiefExpires: { css: 'td:nth-of-type(4)', hasText: Süresiz }
  # the rows of the assignments
  rowRole: { testId: assignment-role, hasText: '/^(Medaris nazımı|Köşk nazımı|Medrese başmüderrisi|Medrese nazırı|Hoca|Ders nazırı)/' }
  imamStar: { role: button, name: Dersin imamı, within: { testId: assignment-role }, count: 1 } # the row's own star
  rowScope: { testId: assignment-scope }
  rowBadge: { text: '/^(Yayında|Taslak|Gizli)$/' }
  rowMeta: { css: 'td span.mds-caption' }
  rowGrantor: { css: 'td:nth-of-type(3) bdi' } # "Kendiniz", the giver's name or "Bilinmiyor": whatever the API gave
  rowGranted: { css: 'td:nth-of-type(3) time', hasText: '/^\d{1,2} [^ ]+ \d{4}$/' }
  rowExpires: { css: 'td:nth-of-type(4)', hasText: '/^(Süresiz|\d{1,2} [^ ]+ \d{4} tarihine kadar)$/' }
  # the permission groups
  permissionsRegion: { role: region, name: '/^Etkin izinleriniz$/' }
  permissionsEmpty: { testId: permissions-empty }
  chiefGroup: { role: region, name: '/^Platform · medaris başnazımı$/' }
  chiefGroupTitle: { role: heading, name: '/^Platform · medaris başnazımı$/' }
  chiefPermissions: { css: '[data-testid=permission-group] > p', hasText: 'Bütün izinler, her kapsamda.' }
  permissionGroup: { testId: permission-group }
  groupTitle: { css: '[data-testid=permission-group] h4' }
  groupScopeLine: { css: '[data-testid=permission-group] > p.mds-body-sm', hasText: '/ olduğunuz /' }
  permissionLine: { css: 'li[data-permission]', hasText: '/^(Talebeyi dersten yasakla \(dersin yasak listesini görmeyi kapsar\)|Ders yasağını gerekçeyle kaldır|Ders ve köşk düzeyinde yasakla ya da yasağı gerekçeyle kaldır; ders yasağını köşke genişlet|Dersi düzenle: başlık, tanıtım, müfredat, saat dilimi|Köşkteki derslerin içeriğini, celselerini, ders kayıtlarını ve başvurularını yönet|Ders nazırı ata; izin ya da grup ver, kendi izinlerini aşmadan|Köşkün medrese dışı derslerinde ders nazırı ata ve izin ver, kendi izinlerini aşmadan|Medrese dışı ders aç; hocaları ve imamı seç|Ortak uygulama kodlarını köşkün derslerine bağla|Dersi yayımla ya da taslağa çek|Ders ayarlarını ve kapalı ders bayrağını değiştir|Taslak ya da gizli dersi gör|Ders destesini aç ve düzenle|Köşk destesini aç ve düzenle|Köşk destesi öner|Talebeyi dersi tamamlamış say|Başvuruyu onayla ya da reddet|Talebeyi gerekçeyle dersten çıkar|Barındırma hakkı ver ya da geri al|Köşkü düzenle, gizle ya da geri al|İzin grubu tanımla|Talebelerin sorularını gör ve yanıtla|Ders kaydı ekle, adlandır, gizle; görünürlüğünü değiştir|Ders kaydı yükle|Yalnız kayıtlılara açık ders kayıtlarını izle|Canlı yayın bağlantısını celseye ekle|Celse ekle, tarihini değiştir, iptal et; toplantı bağlantısını gir|Celse içeriğini ve toplantı bağlantılarını gör|Talebelerin celselere yüklediği ödevleri gör, indir ve değerlendir|E-postayla kullanıcı bul|Hafta ve celse gizle, geri al)$/' }
  permissionKoskManage: { css: 'li[data-permission="kosk.manage"]' }
  permissionUserLookup: { css: 'li[data-permission="user.lookup"]' }
  permissionNote: { css: 'li[data-permission] span.mds-caption', hasText: '/^(Üst kademenin koyduğu yasağı kaldıramazsınız\.|İçerik okumaların denetim kaydına yazılır\.|Medrese derslerinde izni medrese kadrosu verir\.|Her arama denetim kaydına yazılır\.)$/' }
  defaultsNote: { css: '[data-testid=permission-group] > p.mds-caption', hasText: '/^(Köşk nazımının|Hocanın) varsayılan izinleri/' }
  expiryLine: { testId: expiry-note }
  # the time card: both lists are comboboxes named by their labels; what each shows is told by its text
  timeRegion: { role: region, name: '/^Saat dilimi$/' }
  timeTitle: { role: heading, name: '/^Saat dilimi$/' }
  zoneField: { role: combobox, name: '/^Saat dilimi/' }
  zoneReadsIstanbul: { role: combobox, name: '/^Saat dilimi/', hasText: İstanbul }
  zoneReadsBerlin: { role: combobox, name: '/^Saat dilimi/', hasText: Berlin }
  zoneReadsOther: { role: combobox, name: '/^Saat dilimi/', hasText: 'Diğer…' }
  zoneOtherField: { role: combobox, name: '/^Tüm saat dilimleri/' }
  zoneOtherReads: { role: combobox, name: '/^Tüm saat dilimleri/', hasText: '/(Europe\/Istanbul|Europe\/Berlin|Asia\/Tokyo)/' }
  optTokyo: { role: option, name: '/^Asia\/Tokyo$/' }
  # the person card: the name and the roles are the only things of their kinds in the aside
  personName: { testId: account-name }
  roleLine: { css: 'aside[aria-label=Hesap] span.mds-caption' }
  emailField: { testId: account-email } # the label and the value; the engine does not read `readonly` (e2e account#5 a2)
  openNazar: { css: 'a[target=_blank]', hasText: Nazar’da aç }
  signOutLink: { role: link, name: '/^Çıkış yap$/' }
  # the toasts: Base UI's roots carry the kit's classes; the close button is inside the error one
  toastZoneSaved: { css: '.mds-toast--success', hasText: Saat diliminiz kaydedildi. }
  toastSavedTitle: { css: '.mds-toast--success .mds-toast__title' }
  toastSavedText: { css: '.mds-toast--success .mds-toast__desc' }
  toastZoneFailed: { css: '.mds-toast--error', hasText: Saat dilimi kaydedilemedi }
  toastFailedTitle: { css: '.mds-toast--error .mds-toast__title' }
  toastFailedText: { css: '.mds-toast--error .mds-toast__desc' }
  toastClose: { role: button, name: Kapat, within: { css: '.mds-toast--error' } }
  # the star's bubble: a Popover popup, a dialog named by its title
  starBubble: { role: dialog, name: Dersin imamı }
  # the page that stands in for a failed read
  failedAlert: { role: alert, hasText: Hesabınız yüklenemedi }
  retry: { role: link, name: Yeniden dene }
