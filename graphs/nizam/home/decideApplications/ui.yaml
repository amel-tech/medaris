rules:
  - { id: F-W1-4, rule: "After Onayla the pressed button leaves with its row; after a Reddet that is saved the dialog closes but its opener left with the row, so Base UI has nothing connected to give the focus back to and it falls to <body> (kosk-home.tsx:124-129, 145-198). The only word is a toast. Fix: after `settled`, focus the next row's first button, else the 'Son başvurular' heading (tabindex -1), and keep the toast. Read from the code and Base UI's FloatingFocusManager, not seen in a browser." }
  - { id: F-X-7, rule: "The family of F-W1-4: rows that leave the page after an action and take the focus with them (here Onayla and Reddet, kosk-home.tsx:121-129). The fix is one: move the focus to the next row's control or the list heading after the update." }
  - { id: F-W1-13, rule: "A failed Reddet (a 403 or an unknown failure) keeps the dialog open and the typed reason, as the unit spec pins (test/kosk-home-decisions.spec.tsx:196), but says so only in a toast of another portal (kosk-home.tsx:134-143, 187); inside the dialog nothing says the save failed. A high-priority toast also writes a hidden role=alert, so a reader of the screen is told; a sighted keyboard user finds the dialog unchanged. Fix: an Alert (error) inside the dialog body with the same text." }
  - { id: F-X-4, rule: "The shared form of F-W1-13: a refused or failed write is told only by a toast while the dialog stays open (here toastRefused and toastFailed in confirmReject). Show an Alert tone=error (role=alert) inside the dialog." }
  - { id: F-UI-W1-1, rule: "BaseDialog.Description wraps the whole dialog body (libs/ui/src/mds/dialog.tsx:107-116), so 'Başvuruyu reddet' is described by its sentence, the field's label and its help together. Not verified with a screen reader. Fix: describe the dialog by its lead paragraph only." }
  - { id: F-UI-W1-3, rule: "The busy button's status text 'Yükleniyor' (libs/ui/src/mds/button.tsx:62) and the toast's close label 'Kapat' (libs/ui/src/mds/toast.tsx:97) are hard-coded Turkish: they cannot follow another locale and are in no catalog (here the composed.Button.loading message names the first). Fix: take both as props from the catalog." }
  - { id: HOME-1, rule: "A barred talebe's approval is refused with BAN_ACTIVE, which tedrisat answers as 403 (ban-errors.ts:35, course.service.ts:1671); decisionErrorKey words every 403 as errorForbidden (features/applications/present.ts:183), so the nazım is told 'Bu başvuruya karar verme yetkiniz yok.' although she has the authority and the talebe is the one who is barred. The page draws the row like any other (the API's list carries no ban). New finding (not in the inventory). Fix: map BAN_ACTIVE to a sentence of its own ('Bu talebe dersten yasaklı') and, better, draw a barred row with no Onayla; the walk is binding.barred.yaml." }
  - { id: HOME-2, rule: "`applications` and `pendingCount` are `useState(data…)` copies made once (kosk-home.tsx:84-87); `router.refresh()` after a decision renews the server parts, so the sidebar's badge follows, but the page's own list and number keep what they have. The API sends the five newest only: with eight waiting, five decisions leave 'Bekleyen başvuru yok.' on the card while the number and the sidebar still say 3; a decision another nazım makes in the meantime is not in the number either. Not seen in a browser (the walk's data has four rows). Fix: derive both from `data`, or reset the state when `data` changes. New finding." }
  - { id: HOME-3, rule: "One `busy` key serves the table (kosk-home.tsx:88, 146, 153, 366): a second Onayla pressed while a first call runs sets it to the second row, which brings the first row's buttons back on while its call is still in flight, and the first call's answer then clears the second row's mark while its own call runs. Not seen in a browser. The same shape as nazar.roster.decide's ROSTER-3. Fix: keep a set of busy rows. New finding." }
  - { id: HOME-4, rule: "The dialog says the reason 'denetim kaydında tutulur, talebeye gönderilmez' (nizam.json Dashboard.reject.body), but tedrisat puts the reason into the talebe's notice too: course.service.ts:1720 hands it to CourseNotifier.enrollmentRejected (course-notifier.ts:56-69), and tedris words that notice 'Gerekçe: {reason}' (notification-view.ts:166, tedris.json NotificationsPage.types.ENROLLMENT_REJECTED.bodyReason). A nazım who writes a private note is wrong about who reads it. Read from the code, the notice not opened in a browser. Fix: decision D1 of the flow; change the sentence or stop the API. New finding." }
  - { id: HOME-5, rule: "The sentences that stand in place of the buttons (passiveScope, errorForbidden; kosk-home.tsx:356-363) show only where `canDecide` is false, and the engine leaves a köşk's nazım every right in a passive scope (effective-permissions.ts:337-357: 'köşk nazımı zaten bir tür platform yöneticisi'), so for the köşk's own nazım a passive course's applications keep their buttons; a viewer who manages the köşk by a grant and is no nazım has the passive rows left out of the list (kosk-dashboard.service.ts:93). The API's comment (kosk-dashboard.service.ts:148-155) says a passive scope closes enrollment.decide to everyone but platform management. Only the unit spec makes the sentences appear. binding.passive.yaml walks a passive course as the nazım and expects the buttons. New finding. Fix: drop the sentences, or make the engine and the comment agree." }
  - { id: HOME-6, rule: "A Medaris nazım who reads the page by platform.kosk_edit alone gets `contentLocked`: the numbers say N applications wait, and the card is not drawn at all (kosk-home.tsx:499), with no sentence saying why there is none or where the applications are. She is refused the Başvurular page too. New finding. Fix: draw the card with a line such as 'Başvurular yalnızca köşk nazımına açıktır'." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Onayla' in 'Onayla: {name}, {course}' and 'Reddet' in 'Reddet: {name}, {course}' (WCAG 2.5.3). Holds." }
  - { id: confirm-before-rejecting, rule: "Reddet asks first, in a form dialog whose focus starts on the reason field; Onayla does not ask, because an approval gives a seat and a refusal can be taken back by applying again. The dialog's 'Reddet' is never held back by an empty reason (dashboard#6)." }
  - { id: toast-is-the-only-word, rule: "The result of a decision is said by a toast (a dialog in the 'Bildirimler' live region): it closes after 6 seconds for a success and stays for an error; nothing on the page itself says what was decided, and the number and the badge fall silently." }
