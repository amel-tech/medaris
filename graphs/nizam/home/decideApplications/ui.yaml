# The screens of nizam.home.decideApplications: the card "Son başvurular" of a köşk's home (/kosks/<id>/ana-sayfa), its dialog
# "Başvuruyu reddet" and the toasts of a decision. Read from apps/nizam/features/dashboard/components/{kosk-home,reject-application-dialog,
# home-parts}.tsx on 15 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nizam.json (namespaces Dashboard and Shell).
# Three messages are text the page builds in code and are in no i18n file, so they are `composed.*`: the number of the Stat
# ("{count}", kosk-home.tsx:445), the dialog's eyebrow ("{name} · {course}", kosk-home.tsx:556) and the busy button's hidden
# "Yükleniyor" (a default of libs/ui/src/mds/button.tsx:62). `Changes.note` is the one message of this catalog that is authored here: no
# message of the app says what the two decisions change and what follows (the toasts name only the success).
#
# What this graph does not draw of the page: the greeting and the week's sentence, the alert about a celse nobody can attend, the
# three other numbers, the Celse listesi, the Hocalar card and "Ders aç" (nizam.home.koskNazimLanding). While the dialog is open
# the page behind it is inert, so no page node is `in` confirmReject or rejecting; the toasts, which live in their own portal, are.
# The app sets no initial focus on this page (nothing in features/dashboard does; FocusHeading is used only on the pages that are
# only a state), so the page node has no `initialFocus` and no `focus` is given: the graph says nothing of what the code does not say.
