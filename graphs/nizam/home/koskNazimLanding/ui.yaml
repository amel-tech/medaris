  tabCancelled: { type: action, component: Button, role: tab, intent: secondary, text: { key: Dashboard.sessions.tabs.CANCELLED }, in: [home, readingTab, tabUnreadable], emits: OPEN_CANCELLED, source: libs/ui/src/mds/tabs.tsx:110 }
