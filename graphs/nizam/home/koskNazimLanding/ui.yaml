  countsRegion: { type: page, component: Page, role: region, name: { key: Dashboard.counts.koskTitle }, in: [home, readingTab, tabUnreadable], source: apps/nizam/features/dashboard/components/kosk-home.tsx:434 } # <section aria-label>
  statCourse: { type: text, component: Text, text: { key: Dashboard.counts.course }, in: [home, readingTab, tabUnreadable], source: apps/nizam/features/dashboard/components/kosk-home.tsx:439 }
  valueCourse: { type: text, component: Text, text: { key: composed.Dashboard.number, params: { n: counts.courses } }, in: [home, readingTab, tabUnreadable], source: apps/nizam/features/dashboard/components/kosk-home.tsx:439 } # the köşk's courses that are not hidden, drafts included
  statStudents: { type: text, component: Text, text: { key: Dashboard.counts.students }, in: [home, readingTab, tabUnreadable], source: apps/nizam/features/dashboard/components/kosk-home.tsx:440 }
  valueStudents: { type: text, component: Text, text: { key: composed.Dashboard.number, params: { n: counts.students } }, in: [home, readingTab, tabUnreadable], source: apps/nizam/features/dashboard/components/kosk-home.tsx:440 } # distinct talebe with a seat in a course of the köşk
  statUpcoming: { type: text, component: Text, text: { key: Dashboard.counts.upcoming }, in: [home, readingTab, tabUnreadable], source: apps/nizam/features/dashboard/components/kosk-home.tsx:441 }
  valueUpcoming: { type: text, component: Text, text: { key: composed.Dashboard.number, params: { n: counts.upcoming } }, in: [home, readingTab, tabUnreadable], source: apps/nizam/features/dashboard/components/kosk-home.tsx:441 } # the celse that start in the next seven days and are not cancelled
  statPending: { type: text, component: Text, text: { key: Dashboard.counts.pendingApplications }, in: [home, readingTab, tabUnreadable], source: apps/nizam/features/dashboard/components/kosk-home.tsx:445 }
