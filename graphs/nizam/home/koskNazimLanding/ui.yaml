# The screens of nizam.home.koskNazimLanding: nizam-web's köşk home (/kosks/<id>/ana-sayfa, app/kosks/[id]/ana-sayfa/page.tsx, drawn by
# features/dashboard/components/kosk-home.tsx and home-parts.tsx), the screen it gives for a köşk that is not the person's
# (components/errors/no-access.tsx), the box that says it could not be read (features/kosks/components/load-failed.tsx) and the
# phone's menu sheet (libs/ui/src/mds/app-bar.tsx). The shell around the page (the sidebar's entries, the köşk picker, the person
# row, the bell) is nizam.shell.menuPerPersona's; the card "Son başvurular" is nizam.home.decideApplications's. Read from the code on
# 15 Nov 2026; nothing was opened in a browser.
#
# Words: every `Dashboard.*`, `NoAccess.*`, `Sessions.*` and `Shell.*` key is copied from libs/i18n/src/locales/tr/nizam.json (the app
# reads them as `nizam.<key>`), the key being the path inside the file. The `composed.*` keys are NOT in any i18n file: they are texts
# the app builds in code from messages and data, written here with their placeholders so a replay can match them:
#   composed.Dashboard.number          a Stat's big number and the Talebe cell, formatted for the page's language (libs/ui/src/mds/stat.tsx:47)
#   composed.Dashboard.when            a celse's time, "17 Kas Sal 21:00" (features/dashboard/present.ts:90, Intl, the viewer's zone)
#   composed.Dashboard.courseLine      the line under a course's name: "Hafta N[, telafi celsesi] · <hocalar> · <medrese>", the parts that
#                                      are empty left out (kosk-home.tsx:227-254)
#   composed.Dashboard.ways            the ways in a Katılım cell names, joined by " · ": "Yüz yüze", the meeting platform (Zoom, Google
#                                      Meet, Jitsi Meet, YouTube, or "Bilinmeyen platform" and the host), "YouTube yayını" or "Yalnız
#                                      yayın" (features/courses/components/attendance-cell.tsx:41-80)
#   composed.Dashboard.name            a hoca's name, as the API gives it (kosk-home.tsx:532)
#   composed.Dashboard.muderrisCaption "<medrese> · N ders · N talebe", the medrese left out for a hoca who teaches the köşk's own courses
#                                      (kosk-home.tsx:533-541; Dashboard.muderris.courses and .students are "{count} ders" and "{count} talebe")
#   composed.Dashboard.greetingNone / Some / Missing   <p data-testid="home-greeting">: Dashboard.greetingKosk, a space, and one of
#                                      Dashboard.week.none, .some, .missing (kosk-home.tsx:200-211, 408)
#   composed.Dashboard.dash            the Katılım cell of a cancelled celse: a bare "—" (kosk-home.tsx:272)
#   composed.NoAccess.account          "Giriş yaptığınız hesap:" and the account's e-mail address, in a <code> (no-access.tsx:33-37)
# Dashboard.missingAlert.title is an ICU plural as the app has it, and the binding finds its node by a pattern. The sentence of
# Dashboard.week.missing holds one too ("{missing, plural, =1 {birinin} other {# tanesinin}} katılım yolu eksik"): composed.Dashboard.
# greetingMissing writes its result as {missing} ("birinin", "3 tanesinin"), because a plural in the middle of a message is not read.
# Samples are invented and neutral.
schema: delurio-graph/0
kind: ui
id: nizam.home.koskNazimLanding
flow: nizam.home.koskNazimLanding
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples:
  name: Örnek Kişi
  count: "4"
  missing: 3 tanesinin
  course: Örnek Ders
  when: 17 Kas Sal 21:00
  n: "3"
  line: Hafta 3 · Örnek Kişi · Örnek Medrese
  ways: Zoom
  action: Toplantı bağlantısı ekle
  madrasah: Örnek Medrese
  courses: 3 ders
  students: 2 talebe
  email: ornek@example.test

nodes:
  # ---- the page: the shell's <main>, the h1, the greeting and the way to a new course ----
  homePage: { type: page, component: Page, role: main, in: [home, readingTab, tabUnreadable], source: libs/ui/src/mds/app-shell.tsx:41 } # <main id="main">: no name, no initialFocus (rule focus-not-set); the binding finds it by the page's own data-testid inside it
  pageTitle: { type: text, component: Heading, role: heading, text: { key: Dashboard.title }, in: [home, readingTab, tabUnreadable], source: apps/nizam/features/dashboard/components/kosk-home.tsx:406 } # h1
  greetingNone: { type: text, component: Text, text: { key: composed.Dashboard.greetingNone, params: { name: person.name } }, in: [home, readingTab, tabUnreadable], when: "data == 'empty'", source: apps/nizam/features/dashboard/components/kosk-home.tsx:407 } # one <p data-testid="home-greeting">: the greeting, then how many celse the week holds
  greetingSome: { type: text, component: Text, text: { key: composed.Dashboard.greetingSome, params: { name: person.name, count: upcoming.count } }, in: [home, readingTab, tabUnreadable], when: "data == 'covered'", source: apps/nizam/features/dashboard/components/kosk-home.tsx:407 }
  greetingMissing: { type: text, component: Text, text: { key: composed.Dashboard.greetingMissing, params: { name: person.name, count: upcoming.count, missing: upcoming.missing } }, in: [home, readingTab, tabUnreadable], when: "data == 'seeded'", source: apps/nizam/features/dashboard/components/kosk-home.tsx:407 } # "...; birinin katılım yolu eksik." or "...; # tanesinin katılım yolu eksik." (an ICU plural)
  openCourse: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Dashboard.openCourse }, in: [home, readingTab, tabUnreadable], emits: OPEN_COURSE, source: apps/nizam/features/dashboard/components/kosk-home.tsx:411 } # a plus icon beside the words; /kosks/<id>/courses/new

  # ---- the menu on a wide window and on a phone ----
  sidebar: { type: page, component: Page, role: complementary, in: [home, readingTab, tabUnreadable, refused, loadFailed], when: "not onPhone", source: libs/ui/src/mds/app-shell.tsx:81 } # the shell's <aside>: hidden below 768 px by CSS (max-md:hidden). It has no name of its own; its entries are nizam.shell.menuPerPersona's. Drawn here for e2e dashboard#7 a4, which asserts it hidden on a phone
  menuButton: { type: action, component: Button, role: button, intent: secondary, name: { key: Shell.menu }, in: [home, readingTab, tabUnreadable, refused, loadFailed], when: onPhone, emits: OPEN_SHEET, source: libs/ui/src/mds/app-bar.tsx:64 } # an icon button named by its aria-label; the sheet's trigger and the node the focus comes back to

  # ---- the warning: some celse of the week has no way in ----
  missingAlert: { type: alert, component: Alert, role: status, text: { key: Dashboard.missingAlert.title, params: { count: upcoming.missing } }, in: [home, readingTab, tabUnreadable], when: "data == 'seeded'", source: apps/nizam/features/dashboard/components/kosk-home.tsx:420 } # a warning tone is role=status, which is not announced when the page loads, only when it changes. The title is an ICU plural: "Bir celsenin..." or "# celsenin katılım yolu eksik"
  missingBody: { type: text, component: Text, text: { key: Dashboard.missingAlert.body, params: { course: upcoming.firstMissing.course, when: upcoming.firstMissing.when } }, in: [home, readingTab, tabUnreadable], when: "data == 'seeded'", source: apps/nizam/features/dashboard/components/kosk-home.tsx:424 } # <p data-testid="home-missing-link">: it names the first such celse only, and holds no link (decision D2)

