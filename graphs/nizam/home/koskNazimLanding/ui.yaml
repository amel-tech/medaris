rules:
  - { id: focus-not-set, rule: "No page of this flow moves the focus when it opens, and nothing moves it when a tab changes: the page nodes carry no `initialFocus` and there is no `focus`. Nothing in apps/nizam/features/dashboard or app/kosks/[id]/ana-sayfa calls focus() or sets autoFocus; the köşk home, the refusal and the box are drawn by whatever the browser or Next's router does after a load. Recorded so the silence is not read as an omission; the inventory does not call it a finding." }
  - { id: sheet-focus, rule: "The app sets no initial focus in the sheet. Base UI focuses its first tabbable element, and the brand link (the Logo is an <a href=/>, shell-frame.tsx:182) comes before 'Kapat' in the sheet's head (app-bar.tsx:80-87), so the focus is probably on the brand link, not on 'Kapat' as nazar's sheet gives it. Not verified in a browser. The graph draws no `initialFocus` for it." }
  - { id: F-X-1, rule: "The tabs of the celse list are a Base UI tablist with `Tabs` used with no `TabsPanel` (kosk-home.tsx:450-464): the tabs announce as tabs, `aria-controls` is empty and the table below is not a tab panel (libs/ui/src/mds/tabs.tsx:52-125 expects panels). The same family is in Bildirimler, deck requests, appeals, köşk applications and course requests. Fix: put the table in a TabsPanel, or make the tabs links or chips." }
  - { id: F-W1-2, rule: "The same finding on this page, with two more things: `activateOnFocus` makes each arrow key select a tab and ask the server for its list (kosk-home.tsx:92-119), and a switch of tab is announced nowhere: only `aria-busy` on a wrapper while it loads, then the table changes under the reader. Fix: render the table inside <TabsPanel value={tab}> and add a visually hidden role=status line, 'Geçmiş celseler: N', updated after the load." }
  - { id: F-X-10, rule: "Every loading.tsx is an `aria-busy=true` <div> whose children are `aria-hidden` skeletons (app/kosks/[id]/ana-sayfa/loading.tsx:8; libs/ui/src/mds/skeleton.tsx:12-23): while the home is read a screen reader hears nothing. Fix: add a visually hidden status text 'Yükleniyor' to the skeleton (it needs a catalog key)." }
  - { id: F-W1-8, rule: "The same finding on the home's own loading file (app/kosks/[id]/ana-sayfa/loading.tsx:8) and four others: aria-busy on a plain div that holds nothing a reader can reach." }
  - { id: F-W1-10, rule: "The row's button promises an action: 'Toplantı bağlantısı ekle', 'Düzenle', 'Celseyi gör'. It is a plain link to /kosks/<id>/courses/<course>/sessions, the same address for every celse of that course (kosk-home.tsx:299-314). A keyboard user lands on a list and must find the celse again. Fix: deep-link with the celse (?celse=, as 'İncele' does with ?secili=) or name the button 'Celselere git: ...'." }
  - { id: F-W1-11, rule: "The Katılım cell of a cancelled celse is a bare '—' with no text alternative (kosk-home.tsx:270-273); the shared AttendanceCell hides a null view behind 'Katılım bilgisi gösterilmez'. Fix: reuse <AttendanceCell view={null}> or write 'İptal edildi'. The seeded köşk has no cancelled celse, so the walk does not see it." }
  - { id: KOSKHOME-1, rule: "Proposed id; not in the inventory. Opening Geçmiş or İptal edilen asks for the whole home again (Server Action loadKoskSessions -> GET /kosks/:id/dashboard?sessions=PAST|CANCELLED, features/dashboard/actions.ts:13) and the page keeps only `sessions` of the answer (kosk-home.tsx:118). tedrisat writes the audit rows of a full read before it answers: course.roster_read for the applications it hands out and course.content_read for each course whose link it hands out (kosk-dashboard.service.ts:93, :196-240), so every tab switch records a roster read of applicants the page then throws away, and the audit log says the köşk nazımı read names they were not shown. Fix: a read for a tab's sessions alone that writes nothing about applicants." }
  - { id: KOSKHOME-2, rule: "Proposed id; not in the inventory. The badges of Geçmiş and İptal edilen are `sessionCounts.past` and `.cancelled`, every celse there has ever been, but each tab lists the newest 20 (TAB_ROWS, kosk-dashboard.repository.ts:29), with no pager and no 'Tümünü gör': the köşk-wide Celseler page is not built (MDRS-211, kosk-home.tsx:448). A köşk with 25 past celse says 25 and shows 20, and nothing says so. The seeded köşk has 6, so the walk does not see it. Fix: say 'En yeni 20 celse' under a badge above 20 and link the rest when the page exists (decision D1)." }
  - { id: KOSKHOME-3, rule: "Proposed id; not in the inventory. When the read fails, the köşk home is an error Alert alone in <main> (load-failed.tsx:19-35; page.tsx:32-43): no h1, no heading of any kind, and the tab still says 'Ana sayfa' (generateMetadata runs before the read). A screen-reader user who opens the page by its address finds no heading to land on, and the same box serves every köşk page that reads (F-W1-1 is the same lack on '/')." }
  - { id: MENU-2, rule: "Cited, not new: it is nizam.shell.menuPerPersona's finding (its ui.yaml). A köşk nazımı of two köşks lands, by '/', on the köşk of their OLDEST role (page.tsx:56-59; GET /me/assignments is ordered by creation, assignment.repository.ts:115), and the menu on a page whose address names no köşk (Bildirimler, Hesap, and the screen refusedBox draws here) names the NEWEST köşk (shell-nav.ts:372-379). The stack's köşk nazımı holds two, so '/' opens Süleymaniye Köşkü and the menu around the refusal names Kubbealtı Köşkü." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): the row's button says 'Toplantı bağlantısı ekle' and is named 'Toplantı bağlantısı ekle: <course>, <when>'" }
