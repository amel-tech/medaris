  - id: refusal-only-for-a-foreign-kosk
    never: "state == 'refused' and arrival != 'foreign'"
    say: "The screen 'Bu bölüm için izniniz yok' is drawn only when the read was refused"
    source: "apps/nizam/app/kosks/[id]/ana-sayfa/page.tsx:30"
  - id: a-failed-read-draws-no-home
