# What must exist for a Medaris nazımı who reads Ana sayfa with only some of the platform's permissions: the product list of
# nizam.home.medarisNazimCut, written from the flow's story and its open decisions, never from what the page does today. A need
# that is not met is a gap in graphs/needs.gaps.yaml (the orchestrator merges it; this file does not edit it). No replay has been run
# (the owner's word: replays happen once, after every graph is written), so `walked` names the e2e checks that carry a need and no
# replay scenario; the replays bound in binding*.yaml are named in the comments.
#
# Gaps of this file, for that merge:
#   missing:   an-open-page-stops-offering-what-was-taken, the-home-greets-the-person, every-counted-request-has-a-way-in,
#              permanent-ban-requests-exist-before-they-are-offered (MDRS-194), the-footnote-names-who-gave,
#              the-menu-and-the-permissions-agree
#   unwalked:  a-nazim-with-no-permission-is-told-so (no e2e; replay `bare` is bound), a-failed-grants-read-is-said (code and unit spec;
#              nothing here can make GET /me/grants fail)
kind: needs
flow: nizam.home.medarisNazimCut
status: proposed

needs:
  - id: home-cut-to-permissions
    need: >-
      A Medaris nazımı reads a home that shows only the queues her permissions open, and each section she does not hold is not in the
      page at all, not hidden: no card, no link, no number for it.
    drawn: [homeShown, applicationsCard, decksCard, permanentBansCard, passiveCard, bansCard, openKosk, passiveAlert, statCourse, statStudents]
    built:
      - action: medaris.api:getNizamDashboard
      - route: apps/nizam/features/dashboard/components/medaris-home.tsx:349
      - route: apps/tedrisat/src/nizam-dashboard/dashboard-sections.ts:22
    walked:
      - e2e: apps/nizam/e2e/dashboard.e2e.ts
        check: 'dashboard#8 (a1, a5, a7)'

  - id: menu-cut-to-permissions
    need: >-
      Her menu offers Ana sayfa and Bildirimler and, besides, only the entries a permission of hers opens; a group with no entry left is
      not drawn, and the başnazım's own entries (Medaris nazımları, İzin grupları, Denetim kaydı, Platform ayarları, YouTube bağlantısı)
      are never there.
    drawn: [menu, groupGeneral, groupPlatform, groupRequests, groupAudit, menuApplications, menuDecks, menuBans, menuNazims, menuGrants, menuAuditLog, menuYoutube, menuPlatformSettings]
    built:
      - action: medaris.api:getMyPermissions
      - route: apps/nizam/lib/shell-nav.ts:313
      - route: apps/nizam/components/shell/nizam-shell.tsx:87
    walked:
      - e2e: apps/nizam/e2e/dashboard.e2e.ts
        check: 'dashboard#8 (a3, a4)'

  - id: numbers-and-greeting-count-her-queues
    need: >-
      The greeting says how many requests wait for her decision, counting only the queues she may decide, and says that none waits when
      none does; the platform numbers are the köşk and medrese counts, and the course and student numbers are the başnazım's.
    drawn: [greetingPending, greetingNone, stats, statKosk, statMadrasah, nothing-waits-without-a-permission]
    built:
      - route: apps/nizam/features/dashboard/present.ts:29
      - route: apps/nizam/features/dashboard/components/medaris-home.tsx:298
    walked:
      - e2e: apps/nizam/e2e/dashboard.e2e.ts
        check: 'dashboard#8 (a2, a16)'

  - id: grants-are-read-in-words
    need: >-
      She reads what the başnazım gave her under "İzinleriniz": each permission or ready group in the words of the permission
      catalogue, who gave it and on which day, and until when (or that it has no end).
    drawn: [grantsCard, grantsTitle, grantApplications, grantDecks, grantBansAccount, grantsNote]
    built:
      - action: medaris.api:getMyGrants
      - route: apps/nizam/features/dashboard/components/medaris-home.tsx:373
      - route: apps/nizam/features/dashboard/present.ts:232
    walked:
      - e2e: apps/nizam/e2e/dashboard.e2e.ts
        check: 'dashboard#8 (a8, a9, a10, a11)'

  - id: no-open-kosk-for-a-nazim
    need: >-
      "Köşk aç" is the başnazım's alone: a Medaris nazımı is never offered it on her home, and the page does not follow the API, which
      lets a nazım who holds platform.kosk_create open a köşk (the decision is F-X-12's: the menu, the page and tedrisat must agree).
    drawn: [openKosk]
    built:
      - route: apps/nizam/features/dashboard/components/medaris-home.tsx:307
      - route: apps/tedrisat/src/nizam-dashboard/dashboard-sections.ts:28
    walked:
      - e2e: apps/nizam/e2e/dashboard.e2e.ts
        check: 'dashboard#8 (a6), dashboard#9'

  - id: a-page-not-hers-says-so-and-takes-her-home
    need: >-
      A page her permissions do not open says so in words that name who to ask, shows the e-mail she signed in as, keeps her menu, and
      has a way back to her home.
    drawn: [noAccess, noAccessTitle, noAccessBody, noAccessAccount, noAccessBack]
    built:
      - route: apps/nizam/components/errors/no-access.tsx:27
      - route: apps/nizam/app/izin-gruplari/page.tsx:40
    walked:
      - e2e: apps/nizam/e2e/dashboard.e2e.ts
        check: 'dashboard#8 (a12)'

  - id: a-taken-permission-is-gone-after-a-reload
    need: >-
      When the başnazım takes a permission away from a Medaris nazımı, her next read of the home has no card, no menu entry, no grant and
      no share of the number for it, and the group caption goes with its last entry.
    drawn: [homeStale, homeCut, taken, revoke-needs-the-permission, the-cut-page-has-no-deck-count]
    built:
      - action: medaris.api:setMedarisNazimGrants
      - route: apps/tedrisat/src/nizam-dashboard/nizam-dashboard.service.ts:49-52
    walked:
      - e2e: apps/nizam/e2e/dashboard.e2e.ts
        check: 'dashboard#8 (a13, a14, a15, a16)'

  - id: a-nazim-with-no-permission-is-told-so
    need: >-
      A Medaris nazımı whom the başnazım has given no permission (or whose last one was taken away) reads a home of two numbers, a menu of
      two entries and "Size verilmiş bir izin yok.", and is told that nothing waits for her.
    drawn: [homeShown, grantsEmpty, greetingNone, menuHome, menuNotifications]
    built:
      - route: apps/nizam/features/dashboard/components/medaris-home.tsx:396
    walked: [] # no e2e; replay `bare` (binding.bare.yaml) is bound and not run

  - id: a-failed-grants-read-is-said
    need: >-
      When her grants cannot be read the page says so under "İzinleriniz" and keeps the rest, and she can try again.
    drawn: [grantsFailed, grantsFailedText]
    built:
      - route: apps/nizam/features/dashboard/components/medaris-home.tsx:392
    walked: [] # the box has no retry button (the inventory's observation), and nothing here can make the read fail

  - id: an-open-page-stops-offering-what-was-taken
    need: >-
      A page that a Medaris nazımı left open when the başnazım took a permission away does not go on offering it: she learns of the loss
      before she acts on it, or the refusal she meets says why.
    drawn: [homeStale]
    missing: none # nothing pushes the change to an open page; no Linear issue

  - id: the-home-greets-the-person
    need: >-
      The greeting uses the form that belongs to the person it greets, so a woman who is a Medaris nazımı is not read "Bey".
    drawn: [greetingPending, greetingNone]
    missing: none # MCUT-1, decision D1; the inventory's open question to the owner; no Linear issue

  - id: every-counted-request-has-a-way-in
    need: >-
      Every request the greeting counts for a Medaris nazımı has a card or a menu entry that leads her to it, so the number never counts
      something she can reach only by typing an address (appeals, for platform.appeal_decide).
    drawn: [greetingPending, menuAppeals]
    missing: none # MCUT-2, decision D2 (and F-X-12); no Linear issue

  - id: permanent-ban-requests-exist-before-they-are-offered
    need: >-
      The home card and the menu entry for permanent-ban requests are offered only when the requests exist and can be decided, and the
      entry leads to a page.
    drawn: [permanentBansCard, permanentBansEmpty, menuPermanentBans, permanent_bans_opened]
    missing: MDRS-194 # F-W1-15, F-P0-4, F-X-11: the card says nothing waits and the entry opens "Sayfa bulunamadı"

  - id: the-footnote-names-who-gave
    need: >-
      The line under "İzinleriniz" names who gave the permissions in a sentence that reads right whether or not the giver has a name.
    drawn: [grantsNote]
    missing: none # MCUT-3; no Linear issue

  - id: the-menu-and-the-permissions-agree
    need: >-
      Every permission that gives a Medaris nazımı a page or a card has a menu entry that leads to it, and every menu entry leads to a
      page that exists.
    drawn: [menuInactive, menuAppeals, passiveCard, passiveAll, menuPermanentBans]
    missing: none # F-X-12 (and F-P0-4 for the entry with no page); no Linear issue, the owner decides the intended menu
