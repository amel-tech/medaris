rules:
  - { id: focus-not-set, rule: "Ana sayfa sets no initial focus (no autoFocus and no focus() in features/dashboard or app/(home)), neither on a first load nor after a reload, and the screen for a page she may not open sets none either (only NoRolePage uses FocusHeading). The page nodes have no `initialFocus`, so the graph says nothing of the focus; recorded so the silence is not read as an omission. The inventory does not call it a finding." }
  - { id: F-W1-15, rule: "The permanent-ban card is drawn for a nazım who holds platform.ban_account and always says \"Bekleyen kalıcı yasak talebi yok.\" (medaris-home.tsx:147-152), because tedrisat sends the constant 0 (nizam-dashboard.service.ts:83-85: the model does not exist), and the menu entry \"Kalıcı yasak talepleri\" leads to /talepler/kalici-yasak, which has no route, so it answers \"Sayfa bulunamadı\" (lib/shell-nav.ts:122-127). Fix: hide both until the feature exists, or say it is not available yet. The walk presses the entry: the exit permanent_bans_opened." }
  - { id: F-P0-4, rule: "The same missing page seen from the menu: lib/shell-nav.ts:125 points at a path no route answers (F-X-11 groups it with the card of F-W1-15). Carried here only as the exit permanent_bans_opened." }
  - { id: F-X-12, rule: "The menu and the permission map disagree: ITEM_PERMISSIONS names appeals, audit-log, inactive, youtube, platform-settings and partners (lib/shell-nav.ts:282-306) and medarisGroups holds none of them (:178-187), so a nazım who holds platform.inactive_scopes_manage gets a passive scopes card with links into /pasif-kapsamlar and no menu entry for it, and one who holds platform.appeal_decide or audit_read has no entry at all. The `never` menu nodes record what the code does. Fix: decide the menu each permission is meant to open and align medarisGroups, kosk-abilities.ts and tedrisat." }
  - { id: F-W1-10, rule: "The buttons that promise an action on a card row (\"Köşk nazımı ata\", \"Başmüderris ata\", \"Hoca ata\") are links to a list, the same address for every row, and \"İncele\" opens the list with ?secili=. Carried from nizam.home.chiefOverview: the rows are drawn there; here only the cards' own links are." }
  - { id: F-W1-12, rule: "The köşk application rows name the application's field with FIELD_LABELS, hard-coded Turkish in code and not in the catalog (features/platform-admin/present.ts:51-65, read by medaris-home.tsx:81). The rows are not drawn here (nizam.home.chiefOverview); recorded because a nazım's card carries them too." }
  - { id: MCUT-1, rule: "The greeting says \"Selâmün aleyküm, {name} Bey.\" to every Medaris nazımı (Dashboard.greeting, medaris-home.tsx:55-57): the honorific is in the catalog, not derived from the person. The stack's own Medaris nazımı is a woman and the story's persona is \"she\", so she is read \"Bey\". The registration form asks for the gender (required), so the data exists. Fix: derive the form from the profile's gender, or greet with the name alone. Proposed id (the inventory calls the sentence an observation, and asks the owner in its open questions); the same sentence is on the başnazım's page (nizam.home.chiefOverview, D1)." }
  - { id: MCUT-2, rule: "A nazım who holds platform.appeal_decide has \"Karar bekleyen N talep var.\" counting the waiting appeals (pendingTotal adds pendingTotals.appeals, present.ts:29-36) while the page has no card for appeals (medaris-home.tsx has no appeals section) and the menu no İtirazlar entry (medarisGroups, F-X-12): the number counts something she cannot reach from any page, only by typing /talepler/itirazlar. The başnazım has the entry; the nazım does not (the same count with no card is CHIEF-1 in nizam.home.chiefOverview). Fix: an İtirazlar card and menu entry for platform.appeal_decide, or leave appeals out of the sum. Proposed id; the flow's decision D2." }
  - { id: MCUT-3, rule: "The footnote under \"İzinleriniz\" reads \"İzinleri Medaris başnazımı {givers} verdi\" and, when no giver has a name (grantedBy.displayName is null for every card), fills {givers} with Dashboard.grants.chief, which is \"Medaris başnazımı\" again: \"İzinleri Medaris başnazımı Medaris başnazımı verdi; … tarihinde verildi.\" (medaris-home.tsx:435-440, the keys' texts). The fallback was written for a sentence that does not already name the title. Fix: make the fallback the whole sentence (\"İzinleri Medaris başnazımı verdi; …\"), or fill {givers} with a person's name only. Proposed id; not reproduced (needs a giver the directory cannot name)." }
  - { id: MCUT-4, rule: "Observation, not a defect, from the code: the dashboard answers null for each queue the viewer may not see, but the numbers under \"Platform sayıları\" are the platform's own and the \"Biri pasif\" caption under Medrese counts the passive medreses for a nazım who does not hold platform.inactive_scopes_manage (nizam-dashboard.service.ts:91, inactiveMadrasah is computed from the unfiltered InactiveScopeService.brief() read at :67). The names and the card are cut; the number is not. The domain's own description calls these four fields always present, so it may be intended. Proposed id." }
  - { id: section-needs-a-code, rule: "a card, a menu entry and a grant are drawn only for a permission she holds, and a section she does not hold is not in the DOM (tedrisat sends it as null and the page renders nothing for it), not hidden by a style: e2e dashboard#8 asserts toHaveCount(0)" }
  - { id: label-in-name, rule: "a link's visible text is contained in its accessible name (WCAG 2.5.3): \"İncele\" is in \"İncele: {name}\"" }
