# The screens of nizam.home.medarisNazimCut: nizam-web's Ana sayfa ("/") as a Medaris nazımı reads it (features/dashboard/components/
# medaris-home.tsx, its `data-testid="home-medaris"` branch), the shell's sidebar around it (components/shell/shell-frame.tsx,
# lib/shell-nav.ts) and the screen of a page she may not open (components/errors/no-access.tsx). Read from the code on 15 Nov 2026.
#
# Words: every key that does not start with `composed.` is copied from libs/i18n/src/locales/tr/nizam.json, the key being the path in
# that file (the app reads it as `nizam.<Namespace>…`). The two `composed.*` keys are NOT in any i18n file: they are the greeting's
# paragraph, which the app builds from two messages and writes into one <p data-testid="home-greeting"> (medaris-home.tsx:302-305:
# `{greeting} {total > 0 ? pending : pendingNone}`), written here with their placeholders so a replay can match them (a placeholder
# with no sample matches any text). Samples are invented and neutral.
#
# What the page cuts, and by what: tedrisat's `sectionsFor` (apps/tedrisat/src/nizam-dashboard/dashboard-sections.ts) turns a code
# into a section, the shell's ITEM_PERMISSIONS (lib/shell-nav.ts:282) turns a code into a menu entry, and a section tedrisat sends as
# `null` is not rendered at all (`data.latestDeckRequests ? <HomeSection/> : null`), so an absent card is absent from the DOM, not hidden.
#   platform.kosk_application_decide  the applications card, the menu's "Köşk başvuruları", a share of the greeting's number
#   platform.deck_publish             the deck requests card, "Deste yayın istekleri", a share of the number
#   platform.appeal_decide            a share of the number and nothing else: no card, no menu entry (MCUT-2, F-X-12)
#   platform.ban_account              the permanent-ban card, "Kalıcı yasak talepleri", the bans card, "Yasaklamalar"
#   platform.ban_scoped               the bans card and "Yasaklamalar"
#   platform.inactive_scopes_manage   the passive scopes card and no menu entry (F-X-12)
#   madrasah_create | head_muderris_manage | madrasah_edit   "Medreseler"
#   kosk_create | kosk_nazim_manage | kosk_edit | hosting_grant   "Köşkler" (and never "Köşk aç": can.openKosk is the başnazım's)
# The nodes marked "never" have `when: "false"`: the graph says no Medaris nazımı is ever shown them, so a replay with --absent checks
# they are not in the page (e2e dashboard#8 assertions 4, 5, 6 and 7, and dashboard#9).
