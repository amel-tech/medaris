# The screens of nizam.home.chiefOverview: nizam-web's Ana sayfa ("/", app/(home)/page.tsx) as the başnazım meets it: the Medaris home
# (features/dashboard/components/medaris-home.tsx, home-parts.tsx), the box that says it could not be read
# (features/kosks/components/load-failed.tsx) and the bare line the page falls back to (page.tsx:90). The shell around the page
# (sidebar, person row, bell, skip link) is nizam.shell.menuPerPersona's and is not drawn here. Read from the code on 15 Nov 2026;
# nothing was opened in a browser.
#
# Words: every `Dashboard.*` key is copied from libs/i18n/src/locales/tr/nizam.json (the app reads it as `nizam.Dashboard`), the key
# being the path inside the file's `nizam` root; `common.welcome` is from common.json. The `composed.*` keys are NOT in any i18n file:
# they are texts the app builds in code from messages and data, written here with their placeholders so a replay can match them
# (a placeholder with no sample matches any text):
#   composed.Dashboard.number            a Stat's big number, formatted for the page's language (libs/ui/src/mds/stat.tsx:41)
#   composed.Dashboard.name              the name of a row's köşk, deck, scope or person, shown as the API gives it (home-parts.tsx:87)
#   composed.Dashboard.applicationCaption  "<field> · <applicant> · <moment>", joined in medaris-home.tsx:80-85; the field is spelled by
#                                        FIELD_LABELS in features/platform-admin/present.ts:51-65 (F-W1-12), the applicant is the name or
#                                        Dashboard.unknownPerson, the moment is "Bugün 08:45", "Dün 16:30" or "29 Eyl 14:20" (present.ts:69-87)
#   composed.Dashboard.deckCaption       "<owner> · <N ezber kartı> · <moment>", medaris-home.tsx:123-128 (Dashboard.decks.cards)
#   composed.Dashboard.passiveCaption    "<kind> · <why> · <since>", medaris-home.tsx:171-183: the kind is InactivePage.kinds.<TYPE>
#                                        ("Köşk", "Medrese", "Ders") or InactivePage.kindInKosk ("Ders · Süleymaniye Köşkü"), the why is
#                                        InactivePage.reasons.<TYPE>_<REASON>, the since is Dashboard.passive.since
#   composed.Dashboard.banCaption        "<ban> · <placed by> · <moment>", medaris-home.tsx:205-212: Dashboard.bans.courseBan or koskBan,
#                                        Dashboard.bans.placedBy, the moment as above
# The three plural messages (Dashboard.counts.unlisted, counts.passive, passive.alertTitle) are ICU plurals as the app has them; the
# binding finds their nodes by a pattern.
# Samples are invented and neutral.
