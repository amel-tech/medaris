rules:
  - { id: focus-not-set, rule: "Ana sayfa sets no initial focus: no autoFocus and no focus() in app/(home) or features/dashboard, and it does not use the FocusHeading that the no-role page uses (features/assignments/components/no-role-page.tsx:44). So the page node has no `initialFocus` and the graph says nothing of the focus when the page opens. After a link the browser loads a new document and the focus is at its start; 'Yeniden dene' re-renders in place and the focus stays on the button. Recorded so the silence is not read as an omission; the inventory does not call it a finding." }
  - { id: F-W1-1, rule: "When the roles cannot be read (me === null) \"/\" falls through to `<div>{t(\"common.welcome\")}</div>` (app/(home)/page.tsx:90): a bare \"Hoş geldiniz\" inside the shell, with no <h1>, no error and no retry, and the shell has no menu either, for a person who may be the başnazım. The user cannot tell the roles failed to load. Fix: draw LoadFailed as at page.tsx:71, and give the fallthrough a heading. nizam.shell.landingByRole draws the same page as F-P0-9." }
  - { id: F-W1-10, rule: "The passive scopes' row buttons promise an action (\"Köşk nazımı ata\", \"Başmüderris ata\", \"Hoca ata\") and are plain links to /pasif-kapsamlar, the same address for every row (medaris-home.tsx:185-197). A keyboard user lands on a list and must find the scope again. Fix: deep-link with the scope (?secili=, as \"İncele\" does for applications and decks) or name the button \"Pasif kapsamlara git: …\". The köşk home's row buttons are the same finding (nizam.home.koskNazimLanding)." }
  - { id: F-W1-12, rule: "The field of a köşk application in the card's caption (\"Arapça dil ilimleri\", \"Belâgat\", \"Fıkıh\", …) is spelled by FIELD_LABELS, a table of Turkish literals in features/platform-admin/present.ts:51-65, not by the catalog (medaris-home.tsx:81); another locale would show Turkish, and a code the table lacks is shown raw (`FIELD_LABELS[code] ?? code`). Fix: move the labels to nizam.json." }
  - { id: F-X-17, rule: "The family of F-W1-12: text outside the catalog. On this page the field labels above, the tab title (the page has no generateMetadata, so the tab says \"Nizam\", app/layout.tsx:15-18) and the busy button's \"Yükleniyor\" (libs/ui/src/mds/button.tsx:62, F-UI-W1-3), which 'Yeniden dene' shows while it runs." }
  - { id: F-W1-15, rule: "Touches this flow only from the side: the permanent-ban card is the Medaris nazımı's (`pendingTotals.permanentBanRequests != null && !chief`, medaris-home.tsx:147-152), so the başnazım's home draws none and the card's always-empty sentence is nizam.home.medarisNazimCut's. The başnazım's menu still holds the entry that leads to a missing page (nizam.shell.menuPerPersona). The başnazım's greeting adds `permanentBanRequests`, which is the constant 0 for them (nizam-dashboard.service.ts:85)." }
  - { id: CHIEF-1, rule: "New. The greeting's \"Karar bekleyen N talep var.\" is the sum of four queues: köşk applications, deck publish requests, appeals and permanent-ban requests (features/dashboard/present.ts:29-36). The home has a card for the first two and none for appeals (the permanent-ban requests are always 0), yet `pendingTotals.appeals` is the real count of pending appeals (nizam-dashboard.repository.ts:59-65). A başnazım whose only waiting item is an appeal reads \"1 talep var\" over four cards that say nothing waits, and no link on the page leads to the İtirazlar list (the menu does). e2e dashboard#1 assertion 4 computes the sum from applications and deck requests alone and its comment says the appeal model comes later; the model exists. Fix: add an appeals card or a link, or leave appeals out of the sum until the home shows them. Decision D2." }
  - { id: CHIEF-2, rule: "New, the family of F-W1-10. \"İncele: {name}\" on a ban row is a plain link to /yasaklamalar for every row (medaris-home.tsx:228-237), and the page takes no ban to select (app/yasaklamalar/page.tsx reads no `secili`), while the same words on an application or a deck request open that very row (?secili=<id>). The accessible name says \"İncele: Örnek Kişi\" and the person lands on the whole list. Fix: let /yasaklamalar select a ban from the address, as the two other queues do, or name the link after what it does." }
  - { id: CHIEF-3, rule: "New. The warning's title counts every scope with no manager (`inactiveScopeCount`, \"5 kapsamın yöneticisi yok\") but its sentence names only the scopes of the card, which the API cuts at three (`passive.slice(0, 3)`, nizam-dashboard.service.ts:101; medaris-home.tsx:323), then says \"… pasif; içerikleri kayıtlı talebelere de kapalı.\" With five scopes the sentence names three and reads as if those were the passive ones. Not seen in a browser: from the code. Fix: say \"ve N tane daha\" after the names, or name none and point at the card." }
  - { id: CHIEF-4, rule: "New. When the home cannot be read the page draws only the error Alert (page.tsx:67-77, load-failed.tsx:23): there is no <h1> on the page, the title is a <p>, and no focus is set. LoadFailed is shared by every köşk page, so the same page has no heading wherever it is drawn. The shell around it is intact. The role=alert is announced when it appears, which a server-rendered first paint may not do. Fix: give the box a heading (\"Ana sayfa\") above the Alert, as the page has in the success branch, or move the focus to it. nizam.shell.landingByRole's inventory makes the same remark for /yetki-yok (F-P0-6)." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): \"İncele: {name}\" starts with \"İncele\", and the assign button's name starts with its text" }
  - { id: one-h1-per-page, rule: "The home has one h1 (\"Ana sayfa\") and one h2 per card; the numbers are a region named by an aria-label with no heading. The box and the bare line have none (CHIEF-4, F-W1-1)." }
