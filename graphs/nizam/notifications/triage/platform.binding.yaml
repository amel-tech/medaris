# nizam.notifications.triage as the Medaris nazımı and as the başnazım: two scenarios that add no transition to the köşk nazımı's (the same
# page, a different subtitle, a different set of rows), so they are walked from a file of their own (walk.common.binding.yaml says why).
#   flock <scratchpad>/replay.lock nice -n 10 node apps/engine/src/cli.ts replay graphs/nizam/notifications/triage \
#     --bind graphs/nizam/notifications/triage/platform.binding.yaml --cover transitions --out <dir>
# NOT RUN in the writing phase. `platform` is the person every ban notice is written for besides the köşk's nazımları; its title link leaves
# for a page the seeded Medaris nazımı may not read (TRIAGE-2). `chief` is the başnazım, for whom no notice is ever written (TRIAGE-1).
schema: delurio-graph/0
kind: binding
extends: walk.common.binding.yaml
flow: nizam.notifications.triage

scenarios:
  # The Medaris nazımı: the same rows a ban writes for every Medaris nazımı, the subtitle "Köşklerde konan yasaklar." (e2e notifications#7's
  # second half reads this page for one ban), and a title that leads to a page the seeded nazım may not read.
  platform:
    given: { read: ok, scope: platform, holds: several, pages: one, answer: ok }
    as: medarisNazim
    open: '{nizam}/'
    enter: { nav: ../../nav, bind: ../../nav/binding.yaml, entry: 'frame:shell->notifications' }
    vars: { person: medarisNazim }
    setup:
      - run: [node, ../nizam/notifications/triage/triage.mjs, up, medarisNazim, --set, platform]
        expect: 'ready: platform total=4 unread=2'
    teardown:
      - run: [node, ../nizam/notifications/triage/triage.mjs, down, medarisNazim]
        expect: 'removed'

  # The başnazım: the page is drawn for them and no producer writes for them (TRIAGE-1), so it is empty with the Medaris subtitle. `up --set
  # empty` makes nothing; it only stops if the başnazım holds a ban notice that is not the walk's.
  chief:
    given: { read: ok, scope: platform, holds: nothing, pages: one, answer: ok }
    as: systemAdmin
    open: '{nizam}/'
    enter: { nav: ../../nav, bind: ../../nav/binding.yaml, entry: 'frame:shell->notifications' }
    vars: { person: systemAdmin }
    setup:
      - run: [node, ../nizam/notifications/triage/triage.mjs, up, systemAdmin, --set, empty]
        expect: 'ready: empty total=0 unread=0'
    teardown:
      - run: [node, ../nizam/notifications/triage/triage.mjs, down, systemAdmin]
        expect: 'removed'
