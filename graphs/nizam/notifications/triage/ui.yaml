# The screens of nizam.notifications.triage: nizam-web's Bildirimler (/bildirimler), as it draws a nazım's ban notices
# (apps/nizam/features/notifications): the heading and the subtitle, the tabs and the chips, the day groups, the rows, the busy
# button, the error boxes and the toast of a refused mark; and, from the frame around it, the entry "Bildirimler" with the number it
# carries and the bell's name (the rest of the frame is nizam.shell.menuPerPersona's; the page a title leads to is
# nizam.moderation.reviewBans's).
#
# Words: every `NotificationsPage.*` and `Shell.*` key is copied letter for letter from libs/i18n/src/locales/tr/nizam.json (the app
# reads it as `nizam.NotificationsPage` and `nizam.Shell`), the key being the path inside that file. The `composed.*` keys are NOT in
# any i18n file: they are the texts the app builds in code or the kit writes, written here with their placeholders so that a replay
# can match them:
#   composed.NotificationsPage.source  "{source}"  the köşk's name in a row's caption, in a <bdi> before the separator "·"
#                                                  (notification-row.tsx:75; the producer writes it as `source`, ban.service.ts:342)
#   composed.NotificationsPage.time    "{time}"    the <time> of a row: "21:10" for today and yesterday, "29 Eyl 21:10" for an older
#                                                  day, in the person's zone (notification-view.ts:276-294, notification-row.tsx:81)
#   composed.Toast.close               "Kapat"     the toast's close button, a constant of the kit (libs/ui/src/mds/toast.tsx:97)
#   composed.Button.loading            "Yükleniyor" the hidden word of the first retry's busy button: the kit's default `loadingLabel`
#                                                  (libs/ui/src/mds/button.tsx:62), where the load-more button passes its own (loadingMore)
# `Changes.note` is the one message of this catalog that is not the app's: no message of the page says what a mark does or that it is
# kept, so one short, factual Turkish sentence is authored here.
# Samples are invented and neutral. A row's sentence is drawn from one node (rowBody) whose six wordings take the names of the
# people, the course and the köşk as placeholders; the check wants a sample for each, and the binding spells the six wordings as one
# pattern, so the samples are only what the page and a video would say.
schema: delurio-graph/0
kind: ui
id: nizam.notifications.triage
flow: nizam.notifications.triage
status: captured
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  title: Yeni ders yasağı
  time: "21:10"
  source: Örnek Köşk
  count: "3"
  actorName: Nuri Örnek
  talebeName: Mert Deneme
  courseTitle: Örnek ders
  koskName: Örnek Köşk
  reason: Tekrarlanan kural ihlali.

# No code gives the page a focus when it opens or moves it after a mark (no autoFocus, no FocusHeading and no focus() in
# features/notifications or app/bildirimler), so there is no `initialFocus` on the page and no `focus` here: the graph says nothing of
# what the code does not say (rule focus-not-set).
nodes:
  # ---- the page, its title and its subtitle ---------------------------------------------------------------------------------------
  page: { type: page, component: Page, role: main, in: [readFailed, retrying, emptyAll, listed, allRead, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], source: apps/nizam/app/bildirimler/page.tsx:31 } # the shell's one <main id="main">; it has no name and nothing moves the focus into it
  pageTitle: { type: text, component: Heading, role: heading, text: { key: NotificationsPage.title }, in: [readFailed, retrying, emptyAll, listed, allRead, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], source: apps/nizam/features/notifications/components/notifications-page.tsx:310 } # h1
  subtitleKosk: { type: text, component: Text, text: { key: NotificationsPage.subtitleKosk }, in: [readFailed, retrying, emptyAll, listed, allRead, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], when: "scope == 'kosk'", source: apps/nizam/features/notifications/components/notifications-page.tsx:311 } # chosen by the person's menu variant (page.tsx:39)
  subtitlePlatform: { type: text, component: Text, text: { key: NotificationsPage.subtitlePlatform }, in: [readFailed, retrying, emptyAll, listed, allRead, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], when: "scope == 'platform'", source: apps/nizam/features/notifications/components/notifications-page.tsx:312 }

  # ---- the frame's entry and bell: the unread number ----------------------------------------------------------------------------------
  menuLink: { type: action, component: LinkButton, role: link, text: { key: Shell.items.notifications }, in: [readFailed, retrying, emptyAll, listed, allRead, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], source: apps/nizam/lib/shell-nav.ts:64 } # the sidebar's entry; aria-current="page" here; its name carries the number below, so it is found by its beginning
  menuCount: { type: text, component: Text, text: { key: Shell.countLabels.unread }, in: [listed, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], source: libs/ui/src/mds/nav-item.tsx:61 } # the number is drawn only above zero; this is its hidden word. It is the server's count, read again after a successful mark, so it lags a press (markingLast, markingAll)
  bell: { type: action, component: LinkButton, role: link, name: { key: Shell.bell }, in: [emptyAll, allRead], source: apps/nizam/components/shell/shell-frame.tsx:214 } # in the phone's app bar only (below 768 px), a link with no visible number: its name is all a person is told
  bellUnread: { type: action, component: LinkButton, role: link, name: { key: Shell.bellUnread, params: { count: unread.count } }, in: [listed, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], source: apps/nizam/components/shell/nizam-shell.tsx:118 } # the same link with the count in its name, from the same read as the menu's number

  # ---- "Tümünü okundu say", the tabs and the chips ------------------------------------------------------------------------------------
  markAll: { type: action, component: Button, role: button, intent: secondary, text: { key: NotificationsPage.markAllRead }, in: [listed, allRead, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], disabledIn: [allRead, markingLast, markingAll], emits: READ_ALL, source: apps/nizam/features/notifications/components/notifications-page.tsx:316 } # not drawn at 0 total or while the first read has failed; natively `disabled` at 0 unread (F-W1-6), with no busy state of its own
  tabList: { type: list, component: List, role: tablist, name: { key: NotificationsPage.tabsLabel }, in: [readFailed, retrying, emptyAll, listed, allRead, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], source: apps/nizam/features/notifications/components/notifications-page.tsx:327 } # Base UI tabs, activateOnFocus: the arrow keys move and select, and each one reads the list again
  tabAll: { type: action, component: Button, role: tab, text: { key: NotificationsPage.tabAll }, in: [readFailed, retrying, emptyAll, listed, allRead, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], emits: OPEN_ALL, source: apps/nizam/features/notifications/components/notifications-page.tsx:333 } # its name is this word and the total (the count is a span right after it, none while the first read has failed; the exact join is not verified)
  tabUnread: { type: action, component: Button, role: tab, text: { key: NotificationsPage.tabUnread }, in: [readFailed, retrying, emptyAll, listed, allRead, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], emits: OPEN_UNREAD, source: apps/nizam/features/notifications/components/notifications-page.tsx:338 } # the same, with the unread count
  chipGroup: { type: list, component: List, role: group, name: { key: NotificationsPage.typeLegend }, in: [readFailed, retrying, emptyAll, listed, allRead, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], source: apps/nizam/features/notifications/components/notifications-page.tsx:345 } # a Base UI toggle group named by a visually hidden legend
  chipAll: { type: action, component: Button, role: button, intent: secondary, text: { key: NotificationsPage.filters.all }, in: [readFailed, retrying, emptyAll, listed, allRead, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], emits: CHOOSE_EVERY_TYPE, source: libs/ui/src/mds/choice-chips.tsx:83 } # a toggle with aria-pressed (rule chip-pressed-state-not-drawn); pressing it while it is the chosen one does nothing
  chipBans: { type: action, component: Button, role: button, intent: secondary, text: { key: NotificationsPage.filters.bans }, in: [readFailed, retrying, emptyAll, listed, allRead, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], emits: CHOOSE_BANS, source: libs/ui/src/mds/choice-chips.tsx:83 } # pressing it again unpresses it, which reads as "Tümü" and reads the list again (notifications-page.tsx:200-208, TRIAGE-3)
  panelAll: { type: page, component: Page, role: tabpanel, name: { key: NotificationsPage.tabAll }, in: [readFailed, retrying, emptyAll, listed, allRead, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], when: "tab == 'all'", source: apps/nizam/features/notifications/components/notifications-page.tsx:355 } # a hand-made div with an aria-label and aria-live="polite", not the tab's own panel (F-W1-3, F-X-1)
  panelUnread: { type: page, component: Page, role: tabpanel, name: { key: NotificationsPage.tabUnread }, in: [readFailed, retrying, emptyAll, listed, allRead, loadingList, listFailed, markingOne, markingLast, markingAll, loadingMore, moreFailed], when: "tab == 'unread'", source: apps/nizam/features/notifications/components/notifications-page.tsx:355 }

  # ---- the first read failed, or a tab or a chip could not be read ----------------------------------------------------------------------
  failedBox: { type: page, component: Page, role: region, name: { labelledBy: failedTitle }, in: [readFailed, retrying, listFailed], source: libs/ui/src/mds/system-state.tsx:33 } # SystemState with `shell` is a <section aria-labelledby> inside the panel
  failedTitle: { type: text, component: Heading, role: heading, text: { key: NotificationsPage.errorTitle }, in: [readFailed, retrying, listFailed], source: libs/ui/src/mds/system-state.tsx:43 } # an h2 (headingLevel 2): the page keeps its one h1
  failedText: { type: text, component: Text, text: { key: NotificationsPage.errorText }, in: [readFailed, retrying, listFailed], source: libs/ui/src/mds/system-state.tsx:46 }
  retry: { type: action, component: Button, role: button, intent: secondary, text: { key: NotificationsPage.retry }, in: [readFailed, retrying, listFailed], disabledIn: [retrying], emits: RETRY, source: apps/nizam/features/notifications/components/notifications-page.tsx:220 } # busy only on the first read's box (aria-disabled, aria-busy); the list's box has no busy state
  retryBusy: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [retrying], source: libs/ui/src/mds/button.tsx:113 } # the visually hidden <output> the kit draws beside a button that has `loading`

  # ---- the panel while a tab or a chip is read, and when it holds nothing --------------------------------------------------------------------
  listBusy: { type: status, component: Status, in: [loadingList], source: apps/nizam/features/notifications/components/notifications-page.tsx:367 } # a <div aria-busy="true"> of three aria-hidden bars: no role, no text (F-W1-8)
  emptyText: { type: text, component: Text, text: { key: NotificationsPage.emptyTitle }, in: [emptyAll], when: "tab == 'all'", source: apps/nizam/features/notifications/components/notifications-page.tsx:249 } # an EmptyState: a bell icon and one sentence, with no heading
  emptyUnreadText: { type: text, component: Text, text: { key: NotificationsPage.emptyUnreadTitle }, in: [emptyAll, allRead, markingLast, markingAll], when: emptyUnreadShown, source: apps/nizam/features/notifications/components/notifications-page.tsx:249 }

  # ---- the rows, in day groups ----------------------------------------------------------------------------------------------------------
  dayGroup: { type: page, component: Page, role: region, name: { labelledBy: dayHeading }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingMore, moreFailed], when: rowsShown, repeat: groups, source: apps/nizam/features/notifications/components/notifications-page.tsx:257 } # a <section aria-labelledby>; a day with no row is not drawn
  dayHeading: { type: text, component: Heading, role: heading, text: { oneOf: [NotificationsPage.groupToday, NotificationsPage.groupYesterday, NotificationsPage.groupEarlier] }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingMore, moreFailed], when: rowsShown, repeat: groups, source: apps/nizam/features/notifications/components/notifications-page.tsx:262 } # h2, class mds-eyebrow; the day is the calendar day in the viewer's zone, against the server's clock
  rowList: { type: list, component: List, role: list, name: { key: NotificationsPage.listLabel }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingMore, moreFailed], when: rowsShown, repeat: groups, source: apps/nizam/features/notifications/components/notifications-page.tsx:272 } # every day's <ul> has this same name (TRIAGE-6)
  rowItem: { type: list, component: ListItem, role: listitem, in: [listed, allRead, markingOne, markingLast, markingAll, loadingMore, moreFailed], when: rowsShown, repeat: rows, source: apps/nizam/features/notifications/components/notification-row.tsx:46 } # data-testid="notification-row", data-type, data-unread while unread
