  rowBadge: { type: text, component: Text, text: { key: NotificationsPage.new }, in: [listed, markingOne, loadingMore, moreFailed], when: rowsShown, repeat: rows.unread, source: apps/nizam/features/notifications/components/notification-row.tsx:69 } # an info Badge with the word, not colour alone
  rowBody: { type: text, component: Text, text: { oneOf: [NotificationsPage.types.COURSE_BAN_PLACED.body, NotificationsPage.types.COURSE_BAN_PLACED.bodyReason, NotificationsPage.types.KOSK_BAN_PLACED.body, NotificationsPage.types.KOSK_BAN_PLACED.bodyReason, NotificationsPage.types.KOSK_BAN_PLACED.bodyAnyKosk, NotificationsPage.types.KOSK_BAN_PLACED.bodyReasonAnyKosk] }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingMore, moreFailed], when: rowsShown, repeat: rows, source: apps/nizam/features/notifications/components/notification-row.tsx:71 } # who barred whom from which course or köşk, with "Gerekçe:" when the producer wrote one; the köşk-wide wording without a köşk name says "köşkün tüm derslerinden"
  rowSource: { type: text, component: Text, text: { key: composed.NotificationsPage.source, params: { source: row.source } }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingMore, moreFailed], when: rowsShown, repeat: rows, source: apps/nizam/features/notifications/components/notification-row.tsx:75 } # a <bdi> and a decorative " · "; drawn only when the producer wrote a source, which tedrisat always does for a ban
  rowTime: { type: text, component: Text, text: { key: composed.NotificationsPage.time, params: { time: row.time } }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingMore, moreFailed], when: rowsShown, repeat: rows, source: apps/nizam/features/notifications/components/notification-row.tsx:81 } # a <time dateTime=ISO>
  rowMarkRead: { type: action, component: Button, role: button, intent: secondary, text: { key: NotificationsPage.markRead }, name: { key: NotificationsPage.markReadLabel, params: { title: row.title } }, in: [listed, markingOne, loadingMore, moreFailed], when: rowsShown, repeat: rows.unread, emits: READ_ROW, source: apps/nizam/features/notifications/components/notification-row.tsx:86 } # a ghost button, small, only on an unread row; it marks and is gone: its row is read, or on Okunmamış left the list (F-W1-5)

  # ---- the next page ------------------------------------------------------------------------------------------------------------------------------
  loadMore: { type: action, component: Button, role: button, intent: secondary, text: { key: NotificationsPage.loadMore }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingMore, moreFailed], when: "pages == 'several' and fetched == 'first' and tab == 'all'", disabledIn: [loadingMore], emits: LOAD_MORE, source: apps/nizam/features/notifications/components/notifications-page.tsx:287 } # drawn only while the API gave a further cursor (the cursor is kept after a mark); busy is aria-disabled and aria-busy, and it unmounts under the focus when the last page is added
  loadMoreBusy: { type: status, component: Status, role: status, text: { key: NotificationsPage.loadingMore }, in: [loadingMore], source: libs/ui/src/mds/button.tsx:113 } # the visually hidden <output> beside the busy button, with the word the page passes
  moreAlert: { type: alert, component: Alert, role: alert, text: { key: NotificationsPage.errorText }, in: [moreFailed], source: apps/nizam/features/notifications/components/notifications-page.tsx:296 } # a <p class="mds-error" role="alert"> under the button, in the first-read box's own words

  # ---- the toast of a refused mark (the kit's Toaster, Base UI): an error toast stays until it is closed ------------------------------
  rowFailedToast: { type: alert, component: Alert, role: alertdialog, name: { labelledBy: rowFailedTitle }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingList, listFailed, loadingMore, moreFailed], when: "notice == 'rowFailed'", source: libs/ui/src/mds/toast.tsx:77 } # Base UI gives a high-priority toast the role alertdialog and a hidden role=alert copy while its region is not focused; its region is named "Bildirimler" like the page, the menu entry and the bell (F-UI-W1-3); not verified in a browser
  rowFailedTitle: { type: text, component: Text, text: { key: NotificationsPage.markReadFailedTitle }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingList, listFailed, loadingMore, moreFailed], when: "notice == 'rowFailed'", source: apps/nizam/features/notifications/components/notifications-page.tsx:165 } # a <p>
  rowFailedText: { type: text, component: Text, text: { key: NotificationsPage.markReadFailedText }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingList, listFailed, loadingMore, moreFailed], when: "notice == 'rowFailed'", source: apps/nizam/features/notifications/components/notifications-page.tsx:166 } # a <p>
