  allFailedToast: { type: alert, component: Alert, role: alertdialog, name: { labelledBy: allFailedTitle }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingList, listFailed, loadingMore, moreFailed], when: "notice == 'allFailed'", source: libs/ui/src/mds/toast.tsx:77 }
