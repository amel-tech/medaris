  allFailedText: { type: text, component: Text, text: { key: NotificationsPage.markAllFailedText }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingList, listFailed, loadingMore, moreFailed], when: "notice == 'allFailed'", source: apps/nizam/features/notifications/components/notifications-page.tsx:188 }
  allFailedClose: { type: action, component: Button, role: button, intent: dismiss, name: { key: composed.Toast.close }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingList, listFailed, loadingMore, moreFailed], when: "notice == 'allFailed'", emits: CLOSE_TOAST, source: libs/ui/src/mds/toast.tsx:95 }

edges:
  - { labelledBy: [failedBox, failedTitle] }
  - { labelledBy: [dayGroup, dayHeading] }
  - { labelledBy: [rowFailedToast, rowFailedTitle] }
  - { labelledBy: [allFailedToast, allFailedTitle] }
  - { triggers: [retry, retrying] }
  - { triggers: [tabUnread, loadingList] }
  - { triggers: [chipBans, loadingList] }
  - { triggers: [markAll, markingAll] }
  - { triggers: [rowMarkRead, markingOne] }
  - { triggers: [rowLinkUnread, markingLink] }
  - { triggers: [loadMore, loadingMore] }

rules:
  - { id: F-W1-3, rule: "Tabs is used with no TabsPanel, so the tab's aria-controls is empty, and a hand-made <div role=tabpanel aria-label aria-live=polite aria-busy> stands in that is not tied to the tabs by id (notifications-page.tsx:327-362; libs/ui/src/mds/tabs.tsx:129-144). The whole list region is live, so a tab switch, a chip, \"more\" or a mark may be read out wholesale. Read from the code, not verified with a screen reader. Fix: render the list in TabsPanel and keep one small role=status sentence for outcomes." }
  - { id: F-X-1, rule: "The family of F-W1-3: a tablist whose tabs control no panel, in six pages of this app (this one: notifications-page.tsx:327)." }
  - { id: F-W1-5, rule: "Pressing a row's \"Okundu say\" removes that button, and on Okunmamış the whole row (notification-row.tsx:84-95, notification-state.ts:54-70), so the focus is lost; success is silent, the badge and the numbers change and no word says a mark was made (a toast exists only for the failures: notifications-page.tsx:163-167). Fix: move the focus to the next row's control or the day's heading, and announce \"Okundu olarak işaretlendi\" through a status region." }
  - { id: F-W1-6, rule: "\"Tümünü okundu say\" is natively disabled once the unread count is 0, i.e. right after it is pressed, so the focused button disables and the focus is lost (notifications-page.tsx:316-322); the kit's Button has an aria-disabled busy mode so that focus survives (libs/ui/src/mds/button.tsx:126), which this is not. It has no busy state while the call is out either. Not verified in a browser. Fix: aria-disabled, or move the focus to the tab list." }
  - { id: F-X-8, rule: "The family of F-W1-6: a control that becomes disabled or is replaced under its own action, so the focus drops to the page (here also the \"Daha fazla göster\" that leaves the DOM when the last page is added, and the pressed row's button)." }
  - { id: F-W1-8, rule: "aria-busy on a plain <div> whose only children are aria-hidden skeletons (app/bildirimler/loading.tsx:8, notifications-page.tsx:367-372): a screen-reader user hears nothing while a page or a tab loads. Fix: a visually hidden role=status \"Yükleniyor\"." }
  - { id: F-W1-16, rule: "\"Yeniden dene\" on the first-read box: when either read fails again the function returns silently (notifications-page.tsx:138), the same box stays and the button only stops being busy; nothing says the retry ran. Fix: show the error again, or say \"Yine olmadı\"." }
  - { id: F-W1-17, rule: "A click on an unread row's title starts the optimistic read and the Server Action (notification-row.tsx:61) while next/link navigates: the answer's refusal toast and rollback land on a page that is on its way out (a toast is dismissed on a path change), so a refused mark leaves the row unread with nobody told. Read from the code; which finishes first was not checked. Fix: mark the notice read on the Yasaklamalar page, or await the action before navigating (decision D2)." }
  - { id: F-UI-W1-3, rule: "The toast's close button is aria-label=\"Kapat\", its region is named \"Bildirimler\" (libs/ui/src/mds/toast.tsx:97,127) and the busy button's hidden word defaults to \"Yükleniyor\" (libs/ui/src/mds/button.tsx:62): literals of the kit that cannot follow another locale, and the region has the same name as the page, the menu entry and the bell. Fix: accept the labels as props from the catalog." }
  - { id: TRIAGE-1, rule: "New. The başnazım is never told of a ban. `announce` writes one notification per id of `nazimRecipients(koskId)`, which selects the köşk's KOSK_NAZIM rows and every MEDARIS_NAZIM row of role_assignments (apps/tedrisat/src/ban/ban.repository.ts:430-454, ban.service.ts:350-380); the başnazım is the Keycloak realm role SYSTEM_ADMIN and holds no row, so the repository's own comment says it \"is not reached\". nizam-web draws the menu entry, the bell and this page for the başnazım all the same, with the subtitle \"Köşklerde konan yasaklar.\" (app/bildirimler/page.tsx:39): the person who runs every köşk meets \"Bildirim yok\" for good. Read from the code, not seen in a browser. Fix: write for the realm role's holders too, or draw their list from the bans (listAllBans) and say so on the empty page (decision D1)." }
  - { id: TRIAGE-2, rule: "New. `announce` tells EVERY held MEDARIS_NAZIM, whatever permissions they hold, who barred whom, from which course or köşk and why (ban.service.ts:355-380), and a row's title is a link to /kosks/<id>/yasaklamalar (notification-view.ts:165-176) whose API read asks for ban.manage_kosk, platform.ban_scoped or platform.ban_account (ban-codes.ts:61-65, ban.service.ts:197-204). A Medaris nazımı with none of them, the seeded one among them (it holds kosk_create, madrasah_create, kosk_edit, audit_read and course_hide), is told the talebe's name and the reason and then meets BAN_FORBIDDEN, which the page draws as \"Bu bölüm için izniniz yok\" (app/kosks/[id]/yasaklamalar/page.tsx:42). Read from the code, not seen in a browser. Fix: notify only those who may read bans, or leave the name and the reason out of the others' sentence (decision D1)." }
  - { id: TRIAGE-3, rule: "New. The chip \"Yasaklar\" narrows nothing: both chips ask for the same two types, because every type this app words is a ban type (notification-view.ts:145-148; e2e notifications#5 says so in a comment). Pressing it shows the skeleton and the same rows; pressing it again unpresses it, which the code reads as \"Tümü\" (notifications-page.tsx:200-208); pressing \"Tümü\" while it is the chosen one does nothing. The group promises a filter that cannot filter. Fix: draw the chips when a second kind exists (decision D3)." }
  - { id: TRIAGE-4, rule: "New. read() and readAll() roll back with setState(rollBack(s, before, sameList)), where `before` is the page's whole state taken when the mark began (notifications-page.tsx:149-168, :172-190, notification-state.ts:92-97). When a second mark starts before the first has answered and the first is refused on the same list, the snapshot taken before the first replaces the state: the second row goes back to unread on the page although the API marked it. Read from the code, not verified in a browser. Fix: roll back only the row the refused mark touched." }
  - { id: TRIAGE-5, rule: "New. A read or a mark that never reaches Next (the network, a dead server) is not caught: `void loadNotifications(...).then(...)`, `void markNotificationRead(...).then(...)` and `void markAllNotificationsRead().then(...)` have no catch (notifications-page.tsx:99-110, :153-168, :176-190), and authenticatedAction turns every answer into a result, so only an action that never arrives throws (lib/authenticated-action.ts:35-80). A tab or chip read then leaves `loading` true and the skeleton on screen for good, and a mark leaves the optimistic change with no rollback and no toast. nazar's page catches the same case. Read from the code, not verified. Fix: catch and treat as a refusal." }
  - { id: TRIAGE-6, rule: "New. Every day's list is named \"Bildirim listesi\" (notifications-page.tsx:272), inside a region already named by its day, so a list navigator hears the same name up to three times and only the region tells them apart (tedris's page has the same, its NOTIF-2). Fix: name each list by its day's heading, or leave the lists unnamed." }
  - { id: not-live, rule: "The page reads once and keeps the result in the browser's state: `useState(initial)` ignores the new props that router.refresh() brings (notifications-page.tsx:75), so a notice that arrives while the page is open appears only when it is read again. router.refresh() after a mark serves the layout only (the menu's number and the bell); it is why those two lower after a success and not before." }
  - { id: focus-not-set, rule: "Bildirimler sets no initial focus (no autoFocus, FocusHeading or focus() in features/notifications or app/bildirimler), so the page node has no `initialFocus` and the graph says nothing of the focus when the page opens or after a mark. Recorded so the silence is not read as an omission." }
  - { id: user-id-unused, rule: "The API's list and mark answers carry the owner's `userId`, outside the published contract (ledger/security.md; read on the stack for tedris's page, the same endpoints). This page neither reads, shows nor sends it: the client type has none (libs/services NotificationResponse) and no file of features/notifications names `userId`. The graph draws nothing of it." }
  - { id: chip-pressed-state-not-drawn, rule: "The two chips are Base UI toggles that carry aria-pressed (libs/ui/src/mds/choice-chips.tsx:75-93). The ui format has no key for a pressed state (`checked` is for checkbox, radio, switch and the like), so the graph names the chips and says nothing of which one is pressed." }
  - { id: label-in-name, rule: "A control's visible text is contained in its accessible name (WCAG 2.5.3): the tabs' names start with their visible word, a title link's name is its own text, and the row's button is named \"Okundu say: <title>\", which starts with its visible \"Okundu say\". Holds." }
  - { id: toast-is-the-only-word, rule: "The only word the page ever says about a mark is the error toast of a refusal (it stays until closed, and is lost on a title link, F-W1-17); a taken mark changes numbers only (F-W1-5)." }
