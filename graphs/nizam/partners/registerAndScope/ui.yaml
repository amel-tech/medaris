rules:
  - { id: focus-not-set, rule: "Nothing in features/partners moves the focus when the page loads, after an add, after a switch or when a dialog closes by itself; the page has no `initialFocus`. After a successful add the new row can be anywhere in a list sorted by name, and the toast ('Şimdi çalışacağı köşkleri seçin.') is the only thing that says it was made (F-W3-partners-3)." }
  - { id: label-in-name, rule: "A control's visible text is contained in its accessible name: 'Açık' in 'Açık {name}', 'Köşkleri seç' in 'Köşkleri seç {name}', 'Adını değiştir' in 'Adını değiştir {name}' (a visually hidden name follows the word). Holds (WCAG 2.5.3)." }
  - { id: no-default-accept, rule: "no dialog has initialFocus on an action with intent confirm: the focus starts on the close icon (F-W3-partners-1)" }
  - { id: F-W3-6, rule: "The row's Switch is `disabled={busy.has(p.clientId)}` (partners-view.tsx:156) while its save is out, and disabling the control that has the focus drops the keyboard focus to the page body; nothing puts it back, and only a toast says the switch was saved or went back. Fix: keep it enabled with aria-busy (the shared Button has a busy mode), or restore the focus after the answer." }
  - { id: F-X-8, rule: "the family of F-W3-6: a control that becomes `disabled` while its own save runs, so the focused element is lost (the switch here, the two fields of the add form while Ekle is busy, the rename field, the boxes of the köşks dialog)." }
  - { id: F-W3-13, rule: "The add form is `noValidate`: its errors appear after Ekle, in the Field slot (Base UI Field.Error, no role, no aria-live), and the focus stays on the button, so a screen reader says nothing and the first wrong field is not focused. The server's 'Bu istemci kimliğiyle kayıtlı…' and 'Bu istemci Medaris'in kendi…' land in the same place. Fix: focus the first invalid field after a refused submit, or an error summary with role=alert." }
  - { id: F-UI-W3-1, rule: "Field's error element has no role=alert and no live region (libs/ui/src/mds/field.tsx:50-53): the add form's sentences and the rename dialog's ('Bir ad yazın.', the server's) are read only if the focus moves to the field, and it does not." }
  - { id: F-X-2, rule: "the family of F-UI-W3-1: inline validation errors that are silent when they appear, in every form of the app." }
  - { id: F-W3-15, rule: "Unticking a köşk in 'Çalıştığı köşkler' and pressing Kaydet deletes the partner's codes in that köşk's courses for good ('köşk yeniden seçilse de geri gelmez'), one audit row each, with no confirmation, no count of the codes and no list of the courses; the intro paragraph is the only warning (partners-view.tsx:512). Fix: a confirmation that says how many codes in how many courses go (decision D2)." }
  - { id: F-UI-W1-1, rule: "Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:97-104), so a screen reader reads the intro, the field or every box as the dialog's description when it opens." }
  - { id: F-W3-partners-1, rule: "new: neither dialog passes `initialFocus` (partners-view.tsx:402, 491), so Base UI focuses the first tabbable element of the popup, the header's close icon ('Kapat'), which comes before the body in the DOM (libs/ui/src/mds/dialog.tsx:84-107, floating-focus-manager default). The person who opened 'Adını değiştir' to type a name starts on the close icon and must Tab once to reach the field; on a touch screen Base UI focuses the popup itself. Not verified in a browser. Fix: pass a ref to the name field, and to the first box of the köşks dialog." }
  - { id: F-W3-partners-2, rule: "new: while the name or the köşks are saved, 'Vazgeç', the close icon and Escape do nothing (`if (!next && !pending) onClose()`, partners-view.tsx:405, 494) and stay enabled and unmarked; nothing says the dialog cannot be closed. The same shape as F-W3-open-2. Fix: disable them while pending, or keep them live and let the call finish in the background." }
  - { id: F-W3-partners-3, rule: "new: while Ekle is busy both fields of the add form are `disabled` (partners-view.tsx:327, 346), so a person who pressed Enter in a field loses the focus, and after a success the fields are cleared (setClientId(''), setName('')) and nothing focuses the new row, its 'Köşkleri seç' or the form again; only the toast tells the person what to do next. Fix: leave the inputs enabled and set aria-busy, and after an add focus the new row's 'Köşkleri seç' or announce it in a status line." }
  - { id: F-W3-partners-4, rule: "new: both fields carry a `maxLength` (128 for the client id, 100 for the name, partners-view.tsx:322, 344), so a pasted text over the length is cut by the browser without a word, and 'Ad en çok 100 karakter olabilir.' (errors.name.long) can never be shown: nameProblem's 'long' branch (present.ts:21) is unreachable from the form. A client id pasted with 140 characters is registered with its first 128 if they are allowed ones. Fix: drop the maxLength and let the check say it, or keep it and drop the dead sentence. From the code, not seen in a browser." }
  - { id: F-W3-partners-5, rule: "new: the error Alert of the köşks dialog is set when a save fails and is never cleared (setError(null) is not called on a change of the boxes or on a new press, partners-view.tsx:457, 477), so after a refused save it stays above the boxes while the person changes them and presses Kaydet again, until the dialog is closed or a save succeeds. Fix: clear it when a box changes and when Kaydet is pressed." }
  - { id: F-W3-partners-6, rule: "new: the switch's accessible name carries its own state ('Açık {name}' while it is on, 'Kapalı {name}' while it is off, partners-view.tsx:149-153) beside the role's own on/off, so a screen reader says the state twice, and the name changes when the switch is pressed. The column header 'Durum' is not part of the name. Not verified with a screen reader. Fix: name the switch by the partner ('{name}') and let the role say on or off, with 'Açık' / 'Kapalı' as the visible text." }
  - { id: toast-is-the-only-word, rule: "A switch, a rename and a choice of köşks are told by a toast only (success: 6 s; an error: until closed); the row is the only other place that shows what they did. A choice that changes nothing closes the dialog with no toast." }
