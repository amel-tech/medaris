  nameField: { type: field, component: TextField, role: textbox, text: { key: PartnersPage.nameLabel }, value: { literal: "" }, in: [listed, addProblem, adding, turningOff, turningOn, renamed], disabledIn: [adding], source: apps/nizam/features/partners/components/partners-view.tsx:341 } # required, maxLength 100
  nameHelp: { type: text, component: Text, text: { key: PartnersPage.nameHelp }, in: [listed, addProblem, adding, turningOff, turningOn, renamed], when: "said not in ['empty', 'noName']", source: apps/nizam/features/partners/components/partners-view.tsx:337 }
