# The screens of nizam.partners.registerAndScope: Ortak uygulamalar (/ayarlar/ortak-uygulamalar) with its add form, its table and the
# toasts of a write, the "Adını değiştir" dialog and the "Çalıştığı köşkler" dialog. Read from apps/nizam/features/partners/
# components/partners-view.tsx and app/ayarlar/ortak-uygulamalar/page.tsx on 15 Nov 2026, with libs/ui/src/mds/{dialog,field,input,
# button,switch,table,checkbox,alert,empty-state}.tsx and libs/ui/src/components/sonner.tsx; nothing was seen in a browser. The words
# are copied from libs/i18n/src/locales/tr/nizam.json (namespace PartnersPage).
#
# Twelve messages are not from an i18n file, and the catalog keeps them under `composed.` (a placeholder of the sample is the whole
# of most of them: the app writes a name into a cell with no words of its own):
#   composed.PartnersPage.partnerName      "{name}"         the partner's name in the row's header cell, in a dialog's eyebrow and in the rename field (partners-view.tsx:117, 409, 499)
#   composed.PartnersPage.clientIdText     "{clientId}"     the client id in its <bdi dir=ltr> (partners-view.tsx:123)
#   composed.PartnersPage.koskName         "{kosk}"         a köşk's name in the row and beside its box (partners-view.tsx:138, 529)
#   composed.PartnersPage.switchOnName     "Açık {name}"    the switch's name: its word and a visually hidden " {name}" (partners-view.tsx:149-153)
#   composed.PartnersPage.switchOffName    "Kapalı {name}"  the same with the other word
#   composed.PartnersPage.chooseName       "Köşkleri seç {name}"   the button's word and a hidden name (partners-view.tsx:172-173)
#   composed.PartnersPage.renameName       "Adını değiştir {name}" the same (partners-view.tsx:181-182)
#   composed.PartnersPage.kosksCountNone   "0 köşk seçili"  PartnersPage.kosksCount with 0 (partners-view.tsx:502); samples hold one value a placeholder, so a second node says the other count
#   composed.PartnersPage.kosksSavedBodyNone "{name} artık 0 köşkle çalışıyor."  PartnersPage.kosksSavedBody with count 0 (partners-view.tsx:483)
#   composed.PartnersPage.renamedName      "{renamed}"      the new name, which the row carries after a rename; a placeholder of its own so that its sample differs from the first name
#   composed.PartnersPage.renamedBody      "Bundan sonra {renamed} adı görünür."  PartnersPage.renamedBody with the new name in its own placeholder (partners-view.tsx:397)
#   composed.Button.loading                "Yükleniyor"     the busy button's hidden <output>, a default of the kit (libs/ui/src/mds/button.tsx:62)
# `Changes.note` is the one message the app has no equivalent of: no sentence of the page says, once, what registering, closing and
# choosing köşks change (PartnersPage.kosksIntro says it for the köşks only), so this graph carries one short Turkish text of its own.
#
# The page behind a dialog is drawn only where the dialog is closed: the dialog is modal, so the page is inert while it is open.
# `renamed` draws the page without the row's controls: their names carry the partner's name, which has just changed.
schema: delurio-graph/0
kind: ui
id: nizam.partners.registerAndScope
flow: nizam.partners.registerAndScope
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  name: Deneme kayıt uygulaması # the partner application the walk registers
  clientId: deneme-kayit-uygulamasi
  kosk: Kubbealtı Köşkü # the seed's second köşk
  count: "1"
  renamed: Deneme kayıt uygulaması 2

