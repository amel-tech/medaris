# The course page's enrollment card (apps/tedris/features/courses/components/course-aside.tsx), its received dialog
# (enrollment-received-dialog.tsx) and the leave dialog of the ··· menu (course-actions-menu.tsx), as built today.
# The toasts are Sonner's, in a polite live region: drawn as status nodes.
schema: delurio-graph/0
kind: ui
id: medaris.enrollment
flow: medaris.enrollment
status: proposed
catalog: catalog/tr.json
locales: [tr, en]
samples: { when: "bugün 10:02", title: "Fıkıh Usulü", date: "28 Eylül 2026’da" }
changes: { key: Changes.note }

nodes:
  card:
    type: page
    component: Page
    role: complementary # an <aside> with no accessible name of its own
    in: [visitor, apply, enrolling, pending, withdrawing, enrolled, confirmLeave, leaving, completed, revoked]
    source: apps/tedris/features/courses/components/course-aside.tsx:324
  registerTitle:
    type: text
    component: Heading
    role: heading
    text: { key: CoursePage.registerCard }
    in: [visitor, apply, enrolling, pending, withdrawing]
    source: apps/tedris/features/courses/components/course-aside.tsx:326
  approvalFact:
    type: text
    component: Text
    text: { key: CoursePage.approvalNotice }
    when: approvalShown
    in: [visitor, apply, enrolling]
    source: apps/tedris/features/courses/components/course-aside.tsx:127
  openFact:
    type: text
    component: Text
    text: { key: CoursePage.openEnrollNotice }
