edges:
  - { labelledBy: [receivedDialog, receivedTitle] }
  - { labelledBy: [leaveDialog, leaveTitle] }
  - { triggers: [applyButton, enrolling] }
  - { triggers: [enrollButton, enrolling] }
  - { triggers: [withdrawButton, withdrawing] }
  - { triggers: [leaveItem, confirmLeave] }
  - { triggers: [leaveConfirm, leaving] }

rules:
  - { id: no-default-accept, rule: "no dialog that changes something opens with focus on its confirming action" }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3)" }
  - { id: confirm-before-leaving, rule: "leaving a seat asks first, in an alertdialog whose focus starts on Vazgeç; withdrawing a request does not ask" }
