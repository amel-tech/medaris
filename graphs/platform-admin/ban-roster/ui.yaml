rules:
  - { id: offered-only-where-allowed, rule: "a row's Yasağı kaldır is drawn only where the viewer's permission and kademe reach the ban (the Yasaklamalar pages read viewerMayLift; the roster has no such flag)" }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3)" }
