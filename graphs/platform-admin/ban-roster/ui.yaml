# The screens of medaris.ban-roster: nizam's course Talebeler page (/kosks/:id/courses/:courseId/students) with its
# Başvurular and Kayıtlı tabs, and the two dialogs it opens. The words are nizam's own (libs/i18n, nizam.json).
# The MDS Dialog is Base UI's: role dialog, named by its title, focus trapped and returned to the opener; the scrim
# does not close a form dialog (libs/ui/src/mds/dialog.tsx:46). Both dialogs start their focus in the reason field.
schema: delurio-graph/0
kind: ui
id: medaris.ban-roster
flow: medaris.ban-roster
status: proposed
catalog: catalog/tr.json
locales: [tr, en]
samples: { course: "Emsile ve Bina", name: "Rümeysa Nur Karaca", kosk: "Nûruosmaniye Köşkü", when: "21 Ekim Salı 19:00" }
changes: { key: Changes.note }

