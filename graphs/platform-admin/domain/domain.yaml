invariants:
  - { id: one-open-ban-per-scope, rule: "A person has at most one open ban per course, per köşk and per medrese; a second request returns the first", source: "apps/tedrisat/src/database/schema/ban.schema.ts:71" }
  - { id: ban-kademe, rule: "A ban is lifted only with the permission for its level, held where it sits, by a role whose tier is at or above bannedTier", source: "apps/tedrisat/src/ban/ban.service.ts:333" }
  - { id: reason-never-to-the-talebe, rule: "No course, enrolment, roster or notification response a talebe reads carries a ban's reason", source: "apps/tedrisat/src/ban/ban.controller.ts:61" }
  - { id: hide-kademe, rule: "A hidden item is brought back only by the level that hid it or a higher one, compared under the row lock", source: "apps/tedrisat/src/archive/archive.repository.ts:376" }
  - { id: purge-is-chief-only, rule: "Only SYSTEM_ADMIN deletes for real, and only a hidden item, with a deletion record in the same transaction", source: "apps/tedrisat/src/archive/archive.service.ts:363" }
  - { id: audit-append-only, rule: "Nothing updates or deletes an audit_log row and no route could", source: "apps/tedrisat/src/database/schema/audit.schema.ts:17" }
  - { id: one-course-per-code, rule: "A partner's code is mapped to at most one course", source: "apps/tedrisat/src/database/schema/partner-enrollment.schema.ts:39" }
  - { id: barred-never-seated-by-a-partner, rule: "A barred person is not seated by a partner's registration", source: "apps/tedrisat/src/course/bulk-enrollment.service.ts:184" }
