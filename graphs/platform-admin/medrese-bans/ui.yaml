rules:
  - { id: offered-only-where-allowed, rule: "Yasakla is drawn only for who may ban in the medrese (Yasaklamalar does so by drawing it only when the list could be read; Talebeler does not)" }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3)" }
