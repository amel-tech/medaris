# The screens of medaris.medrese-bans in nazar: the medrese's Talebeler (/medrese/:id/talebeler, nazir/10) and
# Yasaklamalar (/medrese/:id/yasaklamalar, nazir/11) with the Yasakla dialog and the three reason dialogs. Words from
# libs/i18n nazar.json. MDS Dialogs are Base UI's (role dialog, named by the title); each starts its focus in its first
# field: the e-mail address when no one is picked yet, else the reason.
