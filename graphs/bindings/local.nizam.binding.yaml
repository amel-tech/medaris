# The local stack as nizam-web's bindings see it: everything local.base.binding.yaml shares, with nizam-web as the
# first app, where a navigation replay opens its pages. Mailpit's API is `mail`, for the `effects` that read a mail.
schema: delurio-graph/0
kind: binding
extends: local.base.binding.yaml

apps:
  nizam: http://localhost:4001
  tedris: http://localhost:4000
  nazar: http://localhost:4002
  landing: http://localhost:4003
  keycloak: http://localhost:8080
  mail: http://localhost:8025

# Every persona signs in here, at nizam-web, whatever app they usually work in, so a nizam flow can walk as any of
# them. A step another person takes in another app (`as:` on an action) starts with that app's own /auth/signin, which
# Keycloak's session answers without a form.
signIn:
  - goto: '{nizam}/auth/signin'
  - waitUrl: '{keycloak}/realms/medaris/**'
  - fill: { css: '#username', value: '{address}' }
  - fill: { css: '#password', value: '{password}' }
  - click: { css: 'button[type=submit]' }
  - waitUrl: '{nizam}/**'
