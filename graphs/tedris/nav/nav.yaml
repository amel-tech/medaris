# The navigation graph of tedris-web, the talebe's app (apps/tedris, Nx project tedris-web). Written 15 Nov 2026 from the
# code of the branch (the code of PR #394), over the generated nav.extracted.yaml (`extract`, adapter tedris).
#
# What the generated half holds, and what this file corrects or adds (the extractor's misses are in the report of the
# batch, V1):
#   - generated: the 30 pages of app/ with the ids given under extract.names, their frames, the sign-in gate read from
#     lib/public-paths.ts, the five items of the top bar and the redirects of the five legacy pages;
#   - here: every route parameter written as `:name` (the form a replay fills from `samples`; the extractor writes
#     `{name}`), the page titles the extractor read as the app's default "Medaris Tedris" (SHL-01), the facts, the
#     personas, the pages that are not routes of app/ (not found, the other apps, Keycloak, the route handlers), the
#     redirect of `/` and of /home for a visitor, and the links and buttons from page to page, none of which the
#     extractor reads.
# The words are in catalog/tr.json: the extractor's keys and the keys of the three other files the app reads
# (tedris-account.json, tedris-learn.json, common.json). The app shows Turkish only (lib/i18n/routing.ts:6).
#
# Rules this file follows, so that a replay can check it:
#   - an entry offered to the talebe that needs no item is labelled with the app's own words (a catalog key that is
#     the control's accessible name); an entry whose control only exists with data (a row, a card, a state) says
#     `data: true` and is labelled in plain words, except where two entries share their ends and their `how` and a
#     binding must tell them apart: the label is then the only handle (SPEC section 7). Derslerim's card is labelled in
#     plain words, "the course card's title" (its name is the course's own title, built in code at my-courses-page.tsx:102),
#     since the extractor keeps only the app's own keys in the catalog;
#   - a link the code draws for a visitor to a page that refuses a visitor does not exist: such an entry is
#     `when: signedIn`.
schema: delurio-graph/0
kind: nav
id: tedris.nav
title: Tedris
status: captured
locale: tr
catalog: catalog/tr.json
extends: nav.extracted.yaml

summary: >-
  The pages of the talebe's app: Ana sayfa, Keşfet with the köşk and medrese pages, the course page with its celse and
  watch pages, Derslerim and Programım, the decks, Hesap with the calendar subscription, and Bildirimler. The app
  checks no role: the one thing that decides what a person sees is whether they are signed in, and each page decides
  the rest from the API's answer (an enrolment, a deck's author). Signing in, registering and signing out go through
  Keycloak; the other Medaris apps are reached from Hesap.

source:
  repo: EsTharian/medaris
  app: apps/tedris
  menu: apps/tedris/components/phone-menu/desktop-bar.tsx
  locales:
    - libs/i18n/src/locales/{locale}/tedris.json
    - libs/i18n/src/locales/{locale}/tedris-account.json
    - libs/i18n/src/locales/{locale}/tedris-learn.json
    - libs/i18n/src/locales/{locale}/common.json

extract:
  adapter: tedris
  locales: [tr]
  entries:
    # The header's account menu and bell, the bar's bell and initials, and the member phone menu render only with a session
    # (header.tsx:31, desktop-bar.tsx:81, phone-chrome.tsx:42); the extractor does not read that condition.
    frame:app->account link: { when: signedIn }
    frame:app->notifications link: { when: signedIn }
    # the header's account menu, "Çıkış yap" with it, renders only with a session (header.tsx:31, user-header-menu.tsx:82); no other chrome of the app links to the sign-out page
    frame:app->signOut link: { when: signedIn }

    # ---- generated entries that repeat an entry written below (same ends, same control), or that name a control by the sentence beside it ----
    # Decks: the owner's overview renders only for the author (deck-detail-page.tsx:44-53,71); a visitor gets DeckPublicView (app/decks/(medaris)/[id]/page.tsx:39-50), a signed-in reader DeckReaderView
    # deck-owner-overview.tsx:160-166, the "Bütün kartlar" link; written below (:161) with when: signedIn
    deck->deckCards Decks.allCards: { skip: "written below (deck-owner-overview.tsx:161), where it is signedIn: the owner's overview is not drawn for a visitor" }
    # deck-owner-overview.tsx:170,181: the EmptyState and its sentence, not a control; the button in it is "Kart ekle" (:173-178), written below (:174) with when: signedIn
    deck->deckCards Decks.emptyCards: { skip: "the sentence of the EmptyState (deck-owner-overview.tsx:181), not a control: the button in it is Decks.addCard (:173), written below" }
    # deck-owner-overview.tsx:173-178, the "Kart ekle" button; written below (:174) with when: signedIn
    deck->deckCards Decks.addCard: { skip: "written below (deck-owner-overview.tsx:174), where it is signedIn: the owner's overview is not drawn for a visitor" }
    # deck-owner-overview.tsx:170,181 again, on the edit page, which draws the same overview with the dialog over it (edit/page.tsx:28-34, deck-detail-page.tsx:71-72)
    deckEdit->deckCards Decks.emptyCards: { skip: "the sentence of the EmptyState (deck-owner-overview.tsx:181), not a control: the button in it is Decks.addCard (:173), which the extractor also writes for this page" }
    # deck-owner-overview.tsx:240-247, the owner's "Düzenle"; written below (:241) with when: signedIn
    deck->deckEdit Decks.edit: { skip: "written below (deck-owner-overview.tsx:241), where it is signedIn: the owner's overview is not drawn for a visitor" }
    # deck-owner-overview.tsx:90, the push to /decks after the delete dialog's confirm (:259-262); written below (:90) as Decks.delete with when: signedIn
    deck->decks button: { skip: "written below as Decks.delete (deck-owner-overview.tsx:90), where it is signedIn: the owner's overview is not drawn for a visitor" }
    # deck-unavailable.tsx:26: DeckUnavailable is drawn only after isSignedIn() (app/decks/(medaris)/[id]/page.tsx:39,53); a visitor is sent to sign in instead (:42)
    deck->decks DeckUnavailable.backToDecks: { skip: "written below (deck-unavailable.tsx:26) with when: signedIn: a visitor never gets the unavailable screen" }
    # deck-unavailable.tsx:26 again, on the study page (app/decks/(medaris)/study/[id]/page.tsx:38,59)
    deckStudy->decks DeckUnavailable.backToDecks: { skip: "written below (deck-unavailable.tsx:26) with when: signedIn: a visitor never gets the unavailable screen" }
    # copy-card-dialog.tsx:96, the dialog's "Deste oluştur" button; the dialog is opened by DeckReaderView (deck-reader-view.tsx:225), which a visitor never gets (app/decks/(medaris)/[id]/page.tsx:39-50); written below (:94) with when: signedIn
    deck->decksCreate Decks.create: { skip: "written below (copy-card-dialog.tsx:96), where it is signedIn: the dialog belongs to the reader view, not to a visitor's page" }
    # copy-card-dialog.tsx:82,106: the Dialog and its sentence, not a control; the button is Decks.create (:94), written below
    deck->decksCreate Decks.noOwnDecks: { skip: "the sentence of the dialog (copy-card-dialog.tsx:106), not a control: the button is Decks.create (:94), written below" }
    # create-deck-page.tsx:207-209, "Vazgeç"; written below (:197) with back: true (the generated twin has no back, so the check reads its words against the page's title)
    decksCreate->decks Decks.cancel: { skip: "written below (create-deck-page.tsx:207) with back: true" }
    # study-session.tsx:135-137, "Çalışmayı bitir"; written below (:135) with back: true
    deckStudy->deck tedrisLearn.Study.finish: { skip: "written below as Study.finish (study-session.tsx:135) with back: true" }
    # study-session.tsx:156,163 and :167,174: an EmptyState and its title (<strong>), not a control; the button in each is Study.backToDeck (:158-160, :169-171), already an entry
    deckStudy->deck tedrisLearn.Study.nothingTitle: { skip: "the title of the EmptyState (study-session.tsx:163), not a control: the button in it is Study.backToDeck (:158)" }
    deckStudy->deck tedrisLearn.Study.doneTitle: { skip: "the title of the EmptyState (study-session.tsx:174), not a control: the button in it is Study.backToDeck (:169)" }

    # Keşfet, the course page, Derslerim, the köşk and the medrese
    # discover-page.tsx:203: the application card renders only when signedIn (a visitor gets the invitation, :210-218); written below (:206) with when: signedIn
    discover->newKoskApplication DiscoverPage.applyLink: { skip: "written below (discover-page.tsx:206), where it is signedIn" }
    # course-aside.tsx:200: the "revoked" card is the state of an enrolment (state, :56-63; the visitor's is :350); written below (:214) with when: signedIn
    course->myCourses CoursePage.backToMyCourses: { skip: "written below (course-aside.tsx:214), where it is signedIn: only a person with an enrolment is in this state" }
    # course-aside.tsx:226: the "completed" card is the state of an enrolment; written below (:258) with when: signedIn
    course->celse CoursePage.openSession: { skip: "written below (course-aside.tsx:258), where it is signedIn: only a person with an enrolment is in this state" }
    # course-aside.tsx:271: the seat card (state enrolled, :133) is the state of an enrolment; written below (:289) with when: signedIn
    course->celse CoursePage.continue: { skip: "written below (course-aside.tsx:289), where it is signedIn: only a person with a seat is in this state" }
    # my-courses-page.tsx:100-103: a card's link is its title (written below at :102); "İlerlemen" is the progress bar's label inside it (:142-144)
    myCourses->course MyCoursesPage.progress: { skip: "the card's link is its title, written below (my-courses-page.tsx:102); the extractor named it by the progress label (:143)" }
    # my-courses-page.tsx:224,231: the EmptyState and its sentence, not a control; the button in it is MyCoursesPage.goDiscover (:226), written below
    myCourses->discover MyCoursesPage.noCourses: { skip: "the sentence of the EmptyState (my-courses-page.tsx:231), not a control: the button in it is MyCoursesPage.goDiscover (:226), written below" }
    # madrasah-page.tsx:69: a course card's link is its title; "Yüz yüze" is a badge in its body (:119-121); the card is written below (:71)
    madrasah->course MadrasahPage.inPerson: { skip: "the card's link is its title, written below as the course card (madrasah-page.tsx:71); the extractor named it by the badge (:121)" }
    # kosk-page.tsx:73: the same card on the köşk page, written below (:75); the badge is at :107-109
    kosk->course KoskPage.inPerson: { skip: "the card's link is its title, written below as the course card (kosk-page.tsx:75); the extractor named it by the badge (:109)" }

  names:
    /: start
    /home: home
    /start: legacyStart
    /welcome: legacyWelcome
    /learning: learning
    /learning/my-courses: learningMyCourses
    /learning/calendar: learningCalendar
    /auth/signin: signIn
    /auth/register: register
    /auth/signout: signOut
    /discover: discover
    /kosks/{koskId}: kosk
    /madrasahs/{madrasahId}: madrasah
    /courses/{courseId}: course
    /courses/{courseId}/lessons/{lessonId}: celse
    /courses/{courseId}/lessons/{lessonId}/izle: celseWatch
    /my-courses: myCourses
    /schedule: schedule
    /kosk-applications/new: newKoskApplication
    /decks: decks
    /decks/explore: decksExplore
    /decks/create: decksCreate
    /decks/{id}: deck
    /decks/{id}/cards: deckCards
    /decks/{id}/edit: deckEdit
    /decks/study/{id}: deckStudy
    /account: account
    /account/calendar: accountCalendar
    /account/public-profile: accountPublicProfile
    /notifications: notifications

frames:
  app:
    title: >-
      Every page of the app that draws the system's chrome (PhoneChrome): at 768 px and wider the top bar (the logo, the
      five places, the theme switch, the bell and Hesabım, or Giriş yap and Kayıt ol for a visitor); below 768 px the
      app bar with a menu sheet that lists the same five places. The footer with the privacy notice is on every page.
    menu: Ana menü
    source: apps/tedris/components/phone-menu/phone-chrome.tsx:20
  none:
    title: A redirect page, which draws nothing of its own because the browser is sent on at once
  outside:
    title: Not tedris-web (Keycloak, another Medaris app, the landing site), reached by a link or a redirect
  endpoints:
    title: >-
      The route handlers of tedris-web (app/api and app/calendar): answers that are files, feeds or redirects, never a
      screen. They are listed so that every route is in the graph; a replay does not open them.

facts:
  signedIn:
    values: [false, true]
    say: whether the person has a usable session (lib/auth.ts:13-24); the app reads no role, so nothing else about the person changes what a page offers

personas:
  visitor:
    title: Visitor
    say: someone with no session, or whose session has ended; may read Keşfet, a köşk, a medrese, a course and a public deck, and is sent to sign in from everything else
    facts: { signedIn: false }
  talebe:
    title: Talebe
    say: anyone signed in. The app draws the same chrome for every account and calls each of them "Talebe" (SHL-09); staff reach their own apps from Hesap
    facts: { signedIn: true }

pages:
  # ---- generated pages, corrected: the address as a replay fills it, and the title where the extractor read the app's default ----
  start:
    evidence: next.config.js:87-95 sends / to /home (308) before app/page.tsx runs, and /home sends a visitor on to /discover (app/home/page.tsx:27), so a signed-in person lands on Ana sayfa and a visitor on Keşfet; app/page.tsx:13 makes the same choice in one step but is never reached (SHL-05)
  learning:
    opensFor: signedIn
    refusal: sends the visitor to sign in, before the redirect to /discover runs
    evidence: not in lib/public-paths.ts, so proxy.ts asks for a session before the page runs
  learningMyCourses:
    opensFor: signedIn
    refusal: sends the visitor to sign in, before the redirect to /my-courses runs
    evidence: not in lib/public-paths.ts, so proxy.ts asks for a session before the page runs
  learningCalendar:
    opensFor: signedIn
    refusal: sends the visitor to sign in, before the redirect to /account/calendar runs
    evidence: not in lib/public-paths.ts, so proxy.ts asks for a session before the page runs
  legacyStart:
    opensFor: signedIn
    refusal: sends the visitor to sign in, before the redirect to / runs
    evidence: not in lib/public-paths.ts, so proxy.ts asks for a session before the page runs
  legacyWelcome:
    opensFor: signedIn
    refusal: sends the visitor to sign in, before the redirect to / runs
    evidence: not in lib/public-paths.ts, so proxy.ts asks for a session before the page runs
  home:
    title: PhoneMenu.home # the extractor read the app's default tab title "Medaris Tedris": the page sets none (SHL-01)
    opensFor: signedIn # the extractor read a public path (lib/public-paths.ts:14) and a screen; the page redirects a visitor before it draws anything
    refusal: sends the visitor to Keşfet
    evidence: a public path (lib/public-paths.ts:14) whose page redirects a visitor to /discover (app/home/page.tsx:26-28); signed in it is the greeting, the next celse and three sections that each read for themselves
  kosk:
    route: /kosks/:koskId
    title: KoskPage.eyebrow # the kind's name; the tab title is the köşk's own name (features/courses/intro-metadata.ts)
    evidence: public (one segment, lib/public-paths.ts:30); an unlisted köşk answers the not-found page to a caller with no token
  madrasah:
    route: /madrasahs/:madrasahId
    title: MadrasahPage.eyebrow # the kind's name; the tab title is the medrese's own name
  course:
    route: /courses/:courseId
    title: KoskPage.courses # the kind's name ("Ders"); the tab title is the course's own title
    evidence: public (one segment); the tabs (mufredat, kayitlar, deste, sorularim, notlarim, muderrisler) are one page, because ?tab= only picks the tab it opens on, and switching tabs does not change the address (course-page.tsx:194-198); a draft answers the not-found page unless the caller may edit it, who gets the preview; the layout reads the course before it streams, so an unknown id is a real 404
  celse:
    route: /courses/:courseId/lessons/:lessonId
    title: CourseQuestions.sessionLabel
    evidence: not public (lib/public-paths.ts:29-38 lists only /courses/<id>); a signed-in person with no seat gets the locked card (LessonLocked), not a refusal
  celseWatch:
    route: /courses/:courseId/lessons/:lessonId/izle
    title: "Watch page of a celse (its stream or its recording)" # no text of the app names it; its tab title is the app default (SHL-01)
    evidence: sends anyone with no seat, and any celse with nothing to watch, back to the celse page (izle/page.tsx:31-33)
  newKoskApplication:
    title: KoskApplication.title
  deckStudy:
    route: /decks/study/:id
    title: Study.title
    evidence: public for a uuid (lib/public-paths.ts:37), so a visitor studies a public deck with no saved progress; a deck a visitor may not read sends them to sign in and back (app/decks/(medaris)/study/[id]/page.tsx:41)
  deck:
    route: /decks/:id
    title: CoursePage.deckGridPick # the text "Deste" (the app has no key that names the page; this one is the legend of the course page's deck grid); the tab title is "<deck> | Desteler"
    evidence: public for a uuid (lib/public-paths.ts:36); a visitor reads a public deck and is sent to sign in and back from a private one (app/decks/(medaris)/[id]/page.tsx:39-43); signed in, the author gets the owner view and everyone else the reader view
  deckCards:
    route: /decks/:id/cards
    title: Decks.tabCards
    evidence: the author only; anyone else who may read the deck gets the forbidden screen (ForbiddenState); a deck that is missing or private to another person answers the not-found page, and the unavailable screen (DeckUnavailable) is drawn only for an API 403 (deck-page-data.ts:36-37)
  deckEdit:
    route: /decks/:id/edit
    title: Decks.editTitle # the deck's own page with the edit dialog open over it; its tab title is the app default (SHL-01)
    evidence: the author only, like the cards page
  accountPublicProfile:
    kind: missing # LAYOUT.md planned `placeholder`; the format's `missing` is the kind that says "the server answers not found", which is what the page does
    title: PublicProfile.title
    evidence: app/account/public-profile/page.tsx:25 calls notFound() before it reads anything while PUBLIC_PROFILE_ENABLED is false (features/public-profile/availability.ts:14, MDRS-141), the Hesap card that links to it is left out (account-settings.tsx:434), and the API answers 404 for the same routes until API__PUBLIC_PROFILE_ENABLED is true
  signIn:
    title: Auth.signIn # the tab title is the app default (SHL-01); the phone bar says "Giriş yap"
    evidence: public; on mount it sends the browser on to Keycloak by itself ("Devam et" only forces it), and an error code shows a box with a way back (features/auth/auth-entry.tsx)
  register:
    title: Auth.register
    evidence: the same page as sign-in with intent=register; the start route adds prompt=create
  signOut:
    title: Auth.signOutConfirm # the heading is "Çıkış yapılsın mı?" (Auth.signOutTitle); the phone bar says "Çıkış yap"
    evidence: public, so a session that ended under it still shows it (lib/public-paths.ts:6-11)

  # ---- a page that is not a route of app/ ----
  notFound:
    route: /:address
    title: SystemPages.notFoundTitle
    kind: screen
    frame: app
    source: apps/tedris/app/not-found.tsx
    evidence: every address no page owns and every notFound() a page throws (a private deck, a draft course, an unlisted köşk); HTTP 404, or 200 under a loading.tsx boundary because the shell is streamed first. The error page (app/error.tsx) and the global error document (app/global-error.tsx) have no address and are not drawn here

  # ---- outside tedris-web ----
  realmSignIn:
    route: Keycloak's sign-in page, realm medaris, on the Medaris theme (login.ftl)
    title: Keycloak sign-in page
    kind: external
    frame: outside
  realmRegister:
    route: Keycloak's registration page (register.ftl, prompt=create)
    title: Keycloak registration page
    kind: external
    frame: outside
  realmProfileUpdate:
    route: Keycloak's update-profile page, opened by /api/auth/signin?action=UPDATE_PROFILE and returning to /account
    title: Keycloak profile page (gender)
    kind: external
    frame: outside
  realmAccountConsole:
    route: Keycloak's account console, <issuer>/account/applications
    title: Connected applications
    kind: external
    frame: outside
  nizamApp:
    route: Nizam, the nazım app (NIZAM_URL); a köşk nazımı's row opens /kosks/<id>
    title: Nizam
    kind: external
    frame: outside
  nazarApp:
    route: Nazar, the app of the medrese and course staff (NAZAR_URL)
    title: Nazar
    kind: external
    frame: outside
  landingPrivacyNotice:
    route: The privacy notice on the landing site (LANDING_URL/aydinlatma-metni), in a new tab
    title: common.legal.privacyNotice
    kind: external
    frame: outside

  # ---- the route handlers of tedris-web ----
  authApi:
    route: /api/auth/*
    title: "Sign-in routes: signin, callback/keycloak, signout, session, backchannel-logout"
    kind: external
    frame: endpoints
    source: apps/tedris/app/api/auth/[...auth]/route.ts
    evidence: outside the proxy (proxy.ts:42-44) except session; GET signin starts the round trip to Keycloak, GET callback/keycloak takes its answer, POST signout ends the session here and there (GET signout answers 405), backchannel-logout takes GET and POST, anything else under /api/auth is 404
  filesCourseResource:
    route: /api/files/courses/:courseId/resources/:resourceId
    title: A course resource's file
    kind: external
    frame: endpoints
    source: apps/tedris/app/api/files/courses/[courseId]/resources/[resourceId]/route.ts
    evidence: GET, streamed from tedrisat with the token added on the server, as an attachment; a refusal comes back as ?fileError= on the course page
  filesLessonResource:
    route: /api/files/lessons/:lessonId/resources/:resourceId
    title: A celse resource's file
    kind: external
    frame: endpoints
    source: apps/tedris/app/api/files/lessons/[lessonId]/resources/[resourceId]/route.ts
  filesLessonAssignment:
    route: /api/files/lessons/:lessonId/assignment/:fileId
    title: A file of the homework set on a celse
    kind: external
    frame: endpoints
    source: apps/tedris/app/api/files/lessons/[lessonId]/assignment/[fileId]/route.ts
  filesSubmissionFile:
    route: /api/files/lessons/:lessonId/submission/files/:fileId
    title: One of the talebe's own homework files
    kind: external
    frame: endpoints
    source: apps/tedris/app/api/files/lessons/[lessonId]/submission/files/[fileId]/route.ts
  filesSubmissionUpload:
    route: /api/files/lessons/:lessonId/submission/files
    title: Add a file to the talebe's homework (POST, multipart)
    kind: external
    frame: endpoints
    source: apps/tedris/app/api/files/lessons/[lessonId]/submission/files/route.ts
    evidence: called by the upload of the "Ödevim" card, never followed as a link; proxy.ts matches it so that the session is renewed on the way
  filesReviewFile:
    route: /api/files/lessons/:lessonId/submission/review-files/:fileId
    title: A file the course team returned with a review
    kind: external
    frame: endpoints
    source: apps/tedris/app/api/files/lessons/[lessonId]/submission/review-files/[fileId]/route.ts
  lessonCalendar:
    route: /api/lessons/:id/calendar
    title: The .ics file of one celse
    kind: external
    frame: endpoints
    source: apps/tedris/app/api/lessons/[id]/calendar/route.ts
    evidence: GET with ?locale=; a person with no session is redirected to sign-in and back to this address
  calendarFeed:
    route: /calendar/:file
    title: The personal calendar feed (<token>.ics)
    kind: external
    frame: endpoints
    source: apps/tedris/app/calendar/[file]/route.ts
    evidence: outside the proxy; the token in the address is the credential (MDRS-120), so no session is read
  deckSample:
    route: /api/decks/sample
    title: The import template (xlsx or csv)
    kind: external
    frame: endpoints
    source: apps/tedris/app/api/decks/sample/route.ts
  deckExport:
    route: /api/decks/:id/export
    title: A deck's cards as a file
    kind: external
    frame: endpoints
    source: apps/tedris/app/api/decks/[id]/export/route.ts
    evidence: only the deck's author gets a file
  deckImport:
    route: /api/decks/:id/import
    title: Import cards into a deck (POST, CSV or Excel)
    kind: external
    frame: endpoints
    source: apps/tedris/app/api/decks/[id]/import/route.ts
    evidence: called by the import dialog, never followed as a link
  legacyDecksApi:
    route: /api/decks
    title: Legacy read handler, no caller (DCK-22)
    kind: external
    frame: endpoints
    source: apps/tedris/app/api/decks/route.ts
    evidence: no component or page calls it
  legacyDeckApi:
    route: /api/decks/:id
    title: Legacy read handler, no caller (DCK-22)
    kind: external
    frame: endpoints
    source: apps/tedris/app/api/decks/[id]/route.ts
  legacyDeckCardsApi:
    route: /api/decks/:id/cards
    title: Legacy read handler, no caller (DCK-22)
