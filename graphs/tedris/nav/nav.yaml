notModeled:
  - "the phone's menu sheet lists the same five places as the top bar and is a second drawing of the same frame (the extractor's repo check compares desktop-bar.tsx with member-phone-menu.tsx); below 768 px the sheet also holds the account row \"Hesabım: {name}\", and \"Çıkış yap\" is deliberately not in it"
  - "the Medaris logo in the bar links to /home for a member and /discover for a visitor, the same places as the first two menu items"
  - "the not-found page is drawn once (notFound); the segment error page (app/error.tsx), the global error document (app/global-error.tsx) and the loading skeletons have no address; tedris.shell.systemPages draws them"
  - "links that leave for a platform that is not Medaris: the meeting link of a celse, a resource that is a link, a recording host, Google Calendar (\"Takvime ekle\"), the YouTube chat pop-out"
  - "the legacy header and tab row (components/header, components/tab-view) are hidden by PhoneChrome's style on every page that mounts it; app/error.tsx is the root boundary and mounts none, so on the error page they show (a search box wired to nothing, a menu with /account and /auth/signout, the bell, and for a visitor Giriş yap and Kayıt ol)"
  - "the course page's tabs are one page (?tab= only picks the tab it opens on); the deck's Genel and Kartlar tabs are two pages (/decks/<id> and /decks/<id>/cards)"
  - "the language: the app is Turkish only (lib/i18n/routing.ts:6); an old address with a language in front (/tr/…, /en/…, /ar/…) is moved to the same page without it by proxy.ts:22-29 and is not a page of its own"
  - "a visitor reaches a public deck (/decks/<uuid>, /decks/study/<uuid>) only by a link from outside the app: no page a visitor can open links to a deck, so the visitor has no way to it here and tedris.decks.visitorPublicDeck has no goal"
  - "tedris.account.publicProfile is switched off: its page answers not found, so no goal can be reached and none is written; the way in is the typed address"
  - "the legacy handlers /api/decks, /api/decks/<id>, /api/decks/<id>/cards and /api/cards/<id> have no caller (DCK-22); they are pages of the endpoints frame with no way in"
  - "a session that ends under a page sends the person to sign in and back by three routes: a Server Action's `unauthenticated` result (sendToSignIn), the server's redirectToSignIn with reauth when tedrisat refuses the token (lib/tedrisat-api.ts:45), and the session provider's reload; none is drawn as an entry from each page"
  - "self links that stay on the page: Programım's \"Sonraki yedi günü göster\" (/schedule?from=) and \"Bugüne dön\", and the retry buttons of Ana sayfa, Derslerim, Programım, Keşfet and the köşk page"
  - "/api/auth/signin (authApi) sits between a page and Keycloak and between Keycloak and the page it returns to; the entries go from the page to the Keycloak page directly, and the way back from Keycloak is told by realm.auth.signIn"
  - "the route handlers have no outgoing entries: lessonCalendar redirects a visitor to sign-in and back, and the file handlers answer 303 to sign-in or back to the page with ?fileError= (libs/services/src/file-proxy/file-proxy.ts:357-422); the uploads (filesSubmissionUpload, deckImport) are fetches of a dialog, not links"
  - "when the profile read of Hesap fails, none of the controls of AccountSettings is drawn (Takvim bağlantını yönet, Çıkış yap, Bağlı uygulamaları gör, the gender link): the page shows only the error box and the roles section (app/account/page.tsx:44-58)"
