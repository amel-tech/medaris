# The screens of tedris.decks.editOrDelete: the owner's page of a deck (/decks/<id>) behind, the "Desteyi düzenle" dialog (opened by the route
# /decks/<id>/edit) and the "Desteyi sil?" alertdialog over it, and the toasts. Read from apps/tedris/features/flashcards/components/{deck-detail-page,
# deck-header,deck-owner-overview,deck-edit-dialog}.tsx and the kit's libs/ui/src/mds/{dialog,alert-dialog,button,field,toast}.tsx on 15 Nov 2026,
# not seen in a browser; the words are copied from libs/i18n/src/locales/tr/tedris.json (namespace Decks, read by the app as tedris.Decks).
#
# Words that are not in the app's i18n file (catalog keys `composed.*`, each with the code line it comes from):
#   composed.Deck.name            "{title}"          the deck's name, drawn as data: the h1 (deck-header.tsx:54-56) and the name box's value (deck-edit-dialog.tsx:52)
#   composed.Deck.newName         "{newTitle}"       the same after a save, with the name the walk typed
#   composed.Deck.description     "{description}"    the deck's description, drawn as data (deck-header.tsx:105-107, deck-edit-dialog.tsx:53)
#   composed.Deck.newDescription  "{newDescription}" the same after a save
#   composed.Dialog.close         "Kapat"            the close icon of both dialogs: the kit's default `closeLabel` (libs/ui/src/mds/dialog.tsx:64, alert-dialog.tsx:50)
#   composed.AlertDialog.cancel   "Vazgeç"           the delete dialog's cancel button: the kit's default `cancelLabel` (libs/ui/src/mds/alert-dialog.tsx:44)
#   composed.Button.loading       "Yükleniyor"       the busy buttons' hidden status: the kit's default `loadingLabel` (libs/ui/src/mds/button.tsx:62)
# Changes.note is the one entry that is NOT copied from the app: the app has no message that says what the flow changes for both its writes ("Deste
# güncellendi" only confirms a save, and a delete has none), so it is one short, factual Turkish sentence written for this flow.
#
# What is not drawn (the world is open): the app's top bar and footer (tedris.shell.frame), the owner's header (breadcrumb, caption, tabs, "Çalış"), the
# progress and sample-card sections and the aside's "Kimler görebilir" card with its publication buttons (tedris.decks.publish), the dialog's eyebrow (the
# deck's name again) and the toasts' close buttons.
schema: delurio-graph/0
kind: ui
id: tedris.decks.editOrDelete
flow: tedris.decks.editOrDelete
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  title: "Deneme destesi: düzenleme"
  newTitle: "Deneme destesi: düzenlendi"
  description: Düzenlemeden önceki açıklama.
  newDescription: Düzenlemeden sonraki açıklama.
  count: "3"
  min: "5"

