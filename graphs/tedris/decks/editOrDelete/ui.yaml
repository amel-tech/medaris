rules:
  - { id: DCK-18, rule: "The edit dialog is a route opened by a link: 'Düzenle' is an <a href=\"/decks/<id>/edit\"> (deck-owner-overview.tsx:240), so opening it is a full page load, and every way out ('Vazgeç', the close icon, Esc, a save) is router.replace('/decks/<id>') (deck-edit-dialog.tsx:58,92). Base UI has no opener element to restore the focus to, so the focus lands on nothing after the dialog closes, and the graph draws no returnsFocus edge for it. Not verified in a browser. Fix: after the replace, focus the page heading or the 'Düzenle' link." }
  - { id: DCK-06, rule: "A refused name shows its message under the field and returns without moving the focus (deck-edit-dialog.tsx:69-73); Base UI's Field.Error has no role and no aria-live (libs/ui/src/mds/field.tsx:50-58), so the error is read only when the person tabs back to the field. Not verified with a screen reader. Fix: focus the field on a refused submit, or make the message a live region." }
  - { id: DCK-07, rule: "`Field required` only draws a decorative '*' (libs/ui/src/mds/field.tsx:42-46); the name box does not carry `required` or `aria-required` (deck-edit-dialog.tsx:126), so assistive technology is not told it is required; the sentence '* zorunlu alan' says so for sighted people. Fix: pass `required` to the Input." }
  - { id: DCK-23, rule: "Words not in the catalog: the close icons' 'Kapat' and the delete dialog's 'Vazgeç' are the kit's defaults (libs/ui/src/mds/dialog.tsx:64, alert-dialog.tsx:44,50; the deck delete passes neither), and the busy buttons' 'Yükleniyor' is the kit's (button.tsx:62); the toasts' close button 'Kapat' is toast.tsx:97. Harmless while the app is Turkish only. Fix: pass closeLabel, cancelLabel and loadingLabel from the catalog." }
  - { id: DCK-24, rule: "The whole body of a Dialog (here the form) is the Base UI Dialog.Description (libs/ui/src/mds/dialog.tsx:107-116), and the delete dialog's text is its AlertDialog description, so aria-describedby points at the whole content. Not verified with a screen reader. Fix: describe the dialog with a short sentence only." }
  - { id: DCK-26, rule: "readDeck has no reauthIfRefused (features/flashcards/reads.ts:69-87), which the list, explore and study reads have: a token tedrisat refuses (401) on /decks/<id> or /decks/<id>/edit lands on the segment's error page instead of re-authenticating. Not verified end to end." }
  - { id: DCK-28, rule: "app/decks/(medaris)/[id]/edit/page.tsx has no generateMetadata, so the tab title while the edit dialog is open is the app's root 'Medaris Tedris' (measured on the refusal screens of the same route by tedris.decks.accessRefusals), while /decks/<id> says '<name> | Desteler'. After the replace the title changes to the deck's. Fix: add one." }
  - { id: DCK-30, rule: "Fixed on 23 Nov 2026. While 'Desteyi sil' was working, 'Vazgeç', 'Kapat' and Esc still closed the dialog and the request was not cancelled: the deck was deleted and the page left for /decks although the person chose to cancel. Now the window's dismissDisabled is `deleting` (deck-owner-overview.tsx:262): Vazgeç and the close icon are disabled and Esc does nothing until the answer; test: deck-detail-page.spec.ts, 'while the deck is deleted, Vazgeç, Kapat and Esc are off (DCK-30)'. The state deletingClosed is gone with it." }
  - { id: EDITDEL-1, rule: "new, provisional id; fixed on 23 Nov 2026. While 'Kaydet' was busy, 'Vazgeç', 'Kapat' and Esc called close() = router.replace('/decks/<id>') and nothing cancelled the server action, so the save finished with the dialog gone and a refusal said 'yazdıkların korundu' over a page with no form. Now the dialog's dismissDisabled is `busy` and Vazgeç is disabled (deck-edit-dialog.tsx:104, 111), so the dialog stays until the answer; test: deck-detail-page.spec.ts, 'while the save runs, Vazgeç, Kapat and Esc are off, so a refusal keeps the typed name in sight (EDITDEL-1)'. The state savingClosed is gone with it, and the two fields are read-only while the save runs (:132, 142)." }
  - { id: EDITDEL-2, rule: "new, provisional id. A successful delete says nothing: remove() calls router.push('/decks') with no toast (deck-owner-overview.tsx:88-92), where a save raises 'Deste güncellendi' and a card's delete raises 'Kart silindi' (Decks.cardDeletedTitle). The catalog has no 'deckDeleted' message. The only sign is the page changing, which a screen-reader user hears as a new page and a sighted one sees as a list with one row fewer; the most final write of the screen is the only one that confirms nothing. Fix: a success toast on /decks (the DismissStaleToasts rule keeps a toast fired just before the push)." }
  - { id: EDITDEL-3, rule: "new, provisional id, derived by reading and not run. The API does not trim or reject a blank name: UpdateFlashcardDeckDto takes the create DTO's @MinLength(5) on the raw string (apps/tedrisat/src/flashcard/dto/create-flashcard-deck.dto.ts:16-19), so PATCH or POST with a title of five spaces is accepted and stored, and the deck is listed with a blank name. This page trims first (actions/index.ts:56-58) and refuses an empty name (deck-model.ts:157), so only an API client reaches it. Fix: @Transform to trim, then validate." }
  - { id: EDITDEL-4, rule: "new, provisional id, NOT VERIFIED in a browser. deleteDeck calls revalidateDecks() (actions/index.ts:19-24), which revalidates /decks/[id] and /decks/[id]/cards; in a Server Action Next re-renders the page the person is on in the same response, and the deck behind /decks/<id> is already gone, so loadDeckPage calls notFound() (deck-page-data.ts:36). The page may draw 'Sayfa bulunamadı' for the time between the action's answer and the router.push('/decks') of remove(), with the dialog gone. decks#16 asserts only the final address. Fix: revalidate only /decks and /decks/explore after a delete, or push before revalidating." }
  - { id: deck-edit-updated-at, rule: "API, the domain's invariant deck-edit-bumps-updated-at holds: false. PATCH /flashcard/decks/{id} sets only the fields sent: the column `updated_at` has no onUpdate (apps/tedrisat/src/database/schema/flashcard-deck.schema.ts:84) and FlashcardDeckRepository.update does not set it (flashcard-deck.repository.ts:203-218), so an edit never bumps it, although the köşk's deck list is ordered by it (deck-review.repository.ts:358) and nizam's köşk decks view shows it (apps/nizam/features/deck-review/components/kosk-decks-view.tsx:209). Nothing on this page shows the date, so the talebe does not see it; a nazım's deck list is stale. Not walked: the effect check reads the title and the status, and does not assert the date." }
  - { id: accepted-write-500, rule: "API, the domain's invariant accepted-write-never-500 holds: false. PATCH /flashcard/decks/{id} with the empty body {} passes the DTO and leaves drizzle no value to set (flashcard-deck.repository.ts:203-218), so it answers 500; so does a JSON null title or tags (derived by reading, not run). This page cannot send it: updateDeck always sends a trimmed title and a description (actions/index.ts:53-59), and the form sends nothing when nothing changed (deck-edit-dialog.tsx:74). It is drawn as the failure class `failed` (INTERNAL_ERROR) of `saving` and is not bound." }
  - { id: focus-not-set, rule: "The deck's page sets no focus on load or after a dialog closes: no autoFocus and no focus() in features/flashcards other than the dialogs' initialFocus. The page node has no `initialFocus` and no `focus` entry names a state; recorded so that the silence is not read as an omission." }
  - { id: label-in-name, rule: "A button's or link's visible text is contained in its accessible name (WCAG 2.5.3): 'Düzenle', 'Desteyi sil', 'Kaydet', 'Vazgeç' carry no other name. The icon buttons 'Kapat' have a name and no text. Holds." }
  - { id: confirm-before-deleting, rule: "'Desteyi sil' on the page opens an alertdialog and sends nothing; the confirmation's focus starts on 'Vazgeç' and the scrim does not close it (kit AlertDialog); the delete is sent only by the destructive button inside it (decks#16). The words 'Bu işlem geri alınamaz.' are true: the deck is deleted for good." }
