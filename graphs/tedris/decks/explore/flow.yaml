# Desteleri keşfet (tedris-web /decks/explore): a signed-in talebe reads the decks of their courses and the published decks, narrows them by card type
# (the address carries it) and by a word (in the browser), and adds a deck to their collection or takes it out. Read from the code of the branch (the
# tree of PR #394) on 15 Nov 2026; nothing here is approved. What it leaves to other flows is in scope.outOfView.
#
# Findings this flow touches (ui.yaml `rules` carries the same ids):
#   DCK-08  the collection button is swapped for another control and the focus is lost; a success is silent (explore-decks-page.tsx:135-166, :75-98)
#   DCK-11  the counts and the empty sentence change as the person types or presses a chip, with no live region (explore-decks-page.tsx:183-185)
#   DCK-12  the read-failure state has no h1 and its retry has no busy state (explore-decks-page.tsx:113-125)
#   DCK-23  "Yükleniyor" and the toast's "Kapat" are not in the catalog (libs/ui/src/mds/button.tsx:62, toast.tsx:97)
#   DCK-25  the loading skeleton has no status text (loading.tsx:5-9)
#   EXPL-1, EXPL-2  this flow's own, proposed (ui.yaml `rules`): the overrides are never cleared, and every refusal is the same toast
#   DCK-09 and DCK-10, which FLOWS.md lists for this flow, are about the reader's page of a deck (deck-reader-view.tsx): tedris.decks.readAndCopy.
# E2E carried: decks#6 (the page, its two sections and counts, the course deck's kind badge and context line, the add button, the person's own deck with
# "Senin desten"), decks#7 (the chips and the address, and an unknown ?type= as no filter) and decks#8 (add, reload, remove). Not carried, and why:
# the stranger's private deck and the person's private deck being absent (decks#6 a10, a11: the stack's seed has no stranger's deck here; a graph says
# only what is listed); "Koleksiyonum" on Desteler after the add (decks#8 a3, a5: that page is tedris.decks.browse's; the walk reads the row instead).
# Scenarios the stack can make: `mixed` (the seeded course deck, the person's own published deck, two published decks of another person) and
# `publicOnly` (a person in no course). `courseOnly` and `bare` need a platform with no published deck at all, which other walks keep from being true.
schema: delurio-graph/0
kind: flow
id: tedris.decks.explore
status: captured
domain: medaris.api
ui: tedris.decks.explore
title: Explore decks and collect them
summary: >-
  A signed-in talebe opens "Desteleri keşfet". The page reads GET /flashcard/decks/explore and draws two sections: "Derslerinin desteleri" (other
  people's private decks that the person's courses, köşks and medreses share with them, each with a badge of where it comes from) and "Herkese açık
  desteler" (every published deck, the person's own among them, marked "Senin desten"), each with a count. A search box narrows both sections by the
  words of a deck's name or description, in the browser; three chips, "Tümü", "Kelime" and "Hadis", narrow them by card type, and the choice is
  written to the address (?type=), so a narrowed page is a link; an address with another value is no filter. On a deck of somebody else's, "Koleksiyona
  ekle: X" flips at once to the badge "Koleksiyonunda" and a button "Çıkar", while the server writes the row (POST /flashcard/decks/:id/collections);
  the page is read again and, if the API refuses, the control flips back and a toast says "Deste eklenemedi", which stays until it is closed. "Çıkar"
  does the reverse (DELETE). The collection itself is read on Desteler, where the deck now shows under "Koleksiyonum". A deck's link opens its page, a
  new document; the breadcrumb leads back to Desteler. When the read fails, a box with "Desteler yüklenemedi" and "Yeniden dene" replaces the page.
source: apps/tedris/app/decks/(medaris)/(liste)/explore/page.tsx

scope:
  shows: the page's two sections, the box and the chips, the collection button of one deck and its toast, the read that fails, and the three ways out of the page
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "a visitor: the page sends them to sign in before it runs, with this address, ?type= included, as callbackUrl (page.tsx:28-30; seen with a GET with no cookie on the stack, 15 Nov 2026: 307 to /auth/signin?callbackUrl=%2Fdecks%2Fexplore%3Ftype%3DHADEETH); and a token tedrisat refuses, which sends the person to sign in again with `reauth` (reauthIfRefused): tedris.decks.visitorPublicDeck, realm.auth.signIn, realm.auth.sessionEnded. The refused token is the exit sent_to_sign_in"
    - "a deck's own page, /decks/<id>: the reader's view of somebody else's deck, with its six cards at a time and the copy of a card (tedris.decks.readAndCopy), and the author's page of the person's own deck (tedris.decks.publish, tedris.decks.editOrDelete)"
    - "Desteler, /decks, where the added deck shows under \"Koleksiyonum\" and where the person studies it (tedris.decks.browse, tedris.decks.study)"
    - "the progress bar and the \"{n} yeni kart\" caption that a collected or an own deck's card carries (deck-summary-card.tsx:132-149), and the description line of a card"
    - "a card of a köşk deck or a medrese deck: the badge says \"Köşk destesi\" or \"Medrese destesi\" and the card is otherwise the same; the stack seeds neither"
    - "the other decks' collection buttons: the flow draws the controls of one published deck of somebody else's, and the seeded course deck's \"Koleksiyona ekle\", read and not pressed"
    - "more than one toast on the page at once (the provider keeps up to three) and the toast going away when the route changes (DismissStaleToasts closes it on a new pathname, which a ?type= change is not)"
    - "a refresh that fails after a write that worked (router.refresh() reading the page again can end on the failed-read box), and a deck that was hidden or made private after the page was drawn (its card stays until the page is read again, and its button then refuses)"
    - "the phone layout: one column of cards, and the breadcrumb showing only its parent as a back link"
    - "the system bar above the page, the footer and the toast host (tedris.shell.frame); the skeleton (liste)/loading.tsx draws while a read runs, a <main aria-busy> with grey bars and no words (DCK-25)"
    - "pagination: the two lists have none, and the API reads every deck (flashcard-deck-summary.repository.ts:132-163); a need, not a screen"

decisions:
  D1:
    question: >-
      Should adding or removing a deck say so, and keep the focus where the person pressed?
    recommend: >-
      Yes: keep one button and change its name and state, or move the focus to the new control, and say the result in a polite status or a success toast.
      Today only a refusal is announced, and the pressed button is replaced, so a keyboard or screen-reader user is left on <body> with no word (DCK-08).
    affects: [adding, removing]

context:
  read:
    values: [ok, failed]
    initial: any
    say:
      ok: "GET /flashcard/decks/explore answers"
      failed: "the read fails (a 5xx, a network error, a 4xx the page does not know), so the page has no decks to draw"
  world:
    values: [mixed, courseOnly, publicOnly, bare]
    initial: any
    say:
      mixed: "the person is in a course with a deck of Kelime type, owns a published deck of Kelime type, and other people have published one deck of each type (a Hadis deck whose name has a word no other deck's has)"
      courseOnly: "the person is in a course with a deck and nobody has published a deck"
      publicOnly: "the person is in no course, owns nothing published, and other people have published decks of both types"
      bare: "the person is in no course with a deck and nobody has published one"
  cardType:
    values: [all, VOCABULARY, HADEETH]
    initial: all
    say:
      all: "the address has no ?type= (or one that is neither of the two): no filter, the chip \"Tümü\""
      VOCABULARY: "?type=VOCABULARY: the API leaves out the decks of the other kind, the chip \"Kelime\""
      HADEETH: "?type=HADEETH: the chip \"Hadis\""
  typed:
    values: [none, word, nothing]
    initial: none
    say:
      none: "the search box is empty"
      word: "the box holds a word that only the Hadis deck of another person has (in its name)"
      nothing: "the box holds a word that no deck has"
  collected:
    values: [no, yes]
    initial: no
    say:
      no: "the button says \"Koleksiyona ekle\": the Hadis deck of another person is not in the person's collection"
      yes: "the badge says \"Koleksiyonunda\" and the button \"Çıkar\": it is in the collection, or the button has just been pressed and the answer is awaited"
  notice:
    values: [none, addFailed, removeFailed]
    initial: none
    say:
      none: "no toast"
      addFailed: "the last toast says the deck could not be added; it stays until it is closed"
      removeFailed: "the last toast says the deck could not be taken out; it stays until it is closed"

guards:
  publicWorld: "world in ['mixed', 'publicOnly']"
  courseWorld: "world in ['mixed', 'courseOnly']"
  # the course deck is of Kelime type and the box's word is in no course deck, so the section is empty under "Hadis" and under any word
  courseShown: "courseWorld and cardType != 'HADEETH' and typed == 'none'"
  # the section holds the decks of both types, so only a word that nothing has, or that only the Hadis deck has under "Kelime", empties it
  publicShown: "publicWorld and typed != 'nothing' and not (typed == 'word' and cardType == 'VOCABULARY')"
  # the deck the flow acts on, a published Hadis deck of somebody else's: it is gone under "Kelime" and under a word that is not in its name
  deckListed: "publicWorld and typed != 'nothing' and cardType != 'VOCABULARY'"
  # the person's own published deck is of Kelime type; the box's word is not in its name
  ownListed: "world == 'mixed' and cardType != 'HADEETH' and typed == 'none'"
  somethingListed: "courseShown or publicShown"

effects:
  typeAll: { set: { cardType: all } }
  typeVocabulary: { set: { cardType: VOCABULARY } }
  typeHadeeth: { set: { cardType: HADEETH } }
  typedWord: { set: { typed: word } }
  typedNothing: { set: { typed: nothing } }
  clearedSearch: { set: { typed: none } }
  flipOn: { set: { collected: yes } }
  flipOff: { set: { collected: no } }
  toastAddFailed: { set: { notice: addFailed } }
  toastRemoveFailed: { set: { notice: removeFailed } }
  clearNotice: { set: { notice: none } }
  newDocument: { set: { cardType: all, typed: none, notice: none } } # an address typed or followed: a new document, so what the page remembered is gone
  reloaded: { set: { typed: none, notice: none } } # a reload keeps the address (?type=) and the API's collection, and loses the box and the toast
  again: { havoc: [read] } # a page read again may come out another way

failures:
  reading: { from: exploreDecks, signedOut: [], unreadable: [] }
  adding: { from: collectDeck, signedOut: [], refused: [DECK_NOT_FOUND, DECK_FORBIDDEN, HTTP_400] }
  removing: { from: uncollectDeck, signedOut: [], refused: [HTTP_400] }
# `signedOut` is a refused token or a session that ended: the page sends the person to sign in and back (reauthIfRefused for the read, sendToSignIn for the
# writes), and draws nothing. `unreadable` stands for every other failure of the read: the domain lists only HTTP_400 for it, which the page cannot cause
# (it sends cardType only when it is one of the two), and the page treats a 5xx, a network error and a 4xx alike (reads.ts:49-54). `refused` is every
# answer but a refused token, and a request that never arrived: one toast whatever the code (EXPL-2).

# The main story, as e2e decks#7 and #8 walk it together: narrow to Hadis, then Kelime, open the page again with an address that is no filter, type a word
# that one deck has and empty the box, add that deck, reload and see it held, and take it out again.
main:
  given: { read: ok, world: mixed }
  events: [DONE, PICK_HADEETH, DONE, PICK_VOCABULARY, DONE, OPEN_BAD_TYPE, DONE, TYPE_WORD, CLEAR_SEARCH, ADD, DONE, RELOAD, DONE, REMOVE, DONE]

initial: reading
states:
  reading:
    title: Read the decks
    description: >-
      The page's server side reads GET /flashcard/decks/explore, with ?cardType= when the address holds ?type=VOCABULARY or ?type=HADEETH (any other value
      is no filter: page.tsx:15-27), and gives the page the two lists, or null when the read failed. The graph draws it for the first load, for a chip
      (router.push to the same path with the query), for an address typed or followed, for a reload and for "Yeniden dene". A token tedrisat refuses is
      not a failed read: the page sends the person to sign in again (exit sent_to_sign_in). While it runs after a chip the page's own skeleton may
      show (DCK-25); the graph draws no screen for it, and the page component is not remounted, so the box keeps its word and the focus its place (the
      same router.push on /discover, observed there; not verified here).
    source: apps/tedris/features/flashcards/reads.ts:44
    invoke: { action: exploreDecks }
    on:
      DONE: { guard: "read == 'ok'", target: explored, source: apps/tedris/app/decks/(medaris)/(liste)/explore/page.tsx:33 }
      FAIL.signedOut: sent_to_sign_in
      FAIL.unreadable: { guard: "read == 'failed'", target: readFailed, say: "the read returned null: the page draws the box in place of its lists", source: apps/tedris/features/flashcards/reads.ts:50 }

  explored:
    title: Desteleri keşfet
    by: human
    goal: true
    description: >-
      The page: the breadcrumb "Desteler / Desteleri keşfet", the h1 "Desteleri keşfet" and its sentence, a search landmark holding the box "Ad ya da
      açıklamada ara" and the chips "Tümü", "Kelime", "Hadis" (the pressed one is aria-pressed, which the graph cannot draw), then the section "Derslerinin
      desteleri" and the section "Herkese açık desteler", each with its hint, its count "{n} deste" and either a grid of cards or one empty sentence. A card
      is one link (the name, inside an h3), a line of where it comes from (course sections only: the badge "Ders destesi" and "<course>·<hoca>"), "{n}
      kart·Kelime" or "·Hadis", and at the foot "Koleksiyona ekle", or "Koleksiyonunda" with "Çıkar", or "Senin desten" for a deck the person wrote.
      The empty sentences are "Kayıtlı olduğun derslerin desteleri burada görünür." and "Henüz herkese açık deste yok." (nothing there), "Aramana uyan deste
      yok." (the box holds something and nothing in the section matches). A deck's card is gone from the list when the chip or the box leaves it out, and the
      counts follow without a word to a screen reader (DCK-11). The words a card is matched on are its name and its description, lower-cased the Turkish way;
      every word typed must be in one of them (deck-model.ts:26-40). The page sets no initial focus (rule focus-not-set). A toast of a refusal stays on the
      page until it is closed (notice). What the page says of a deck's collection state is the person's last press, not the row that the page is read again
      with (EXPL-1). The stale case, a deck that is not there any more, is not drawn.
    source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:45
    on:
      PICK_ALL: { guard: "cardType != 'all'", target: reading, effect: [typeAll, again], say: "\"Tümü\": router.push to the bare path, the API is asked without a card type", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:100 }
      PICK_VOCABULARY:
        - { guard: "cardType != 'VOCABULARY'", target: reading, effect: [typeVocabulary, again], say: "\"Kelime\": the address becomes ?type=VOCABULARY (a history entry); the box keeps its word", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:100 }
        - { guard: "cardType == 'VOCABULARY'", target: reading, effect: [typeAll, again], say: "the pressed chip pressed again clears the filter", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:101 }
      PICK_HADEETH:
        - { guard: "cardType != 'HADEETH'", target: reading, effect: [typeHadeeth, again], say: "\"Hadis\": the address becomes ?type=HADEETH", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:100 }
        - { guard: "cardType == 'HADEETH'", target: reading, effect: [typeAll, again], say: "the pressed chip pressed again clears the filter", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:101 }
      OPEN_BAD_TYPE: { target: reading, effect: [newDocument, again], say: "an address with ?type=QUIZ (or any value that is neither): no filter, both decks of the stack are listed; it is a new document, so the box and the toast are gone (e2e decks#7)", source: apps/tedris/app/decks/(medaris)/(liste)/explore/page.tsx:27 }
      TYPE_WORD: { guard: "publicWorld and typed != 'word'", target: explored, effect: [typedWord], say: "they type a word that only the Hadis deck has: every other deck leaves both lists, at each key, with no read", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:128 }
      TYPE_NOTHING: { guard: "typed != 'nothing'", target: explored, effect: [typedNothing], say: "they type a word nothing has: both sections say \"Aramana uyan deste yok.\" and count \"0 deste\"", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:128 }
      CLEAR_SEARCH: { guard: "typed != 'none'", target: explored, effect: [clearedSearch], say: "they empty the box: the lists are what the chip leaves", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:128 }
      ADD: { guard: "deckListed and collected == 'no'", target: adding, effect: [flipOn], say: "\"Koleksiyona ekle: X\": the control flips to the badge and \"Çıkar\" before the answer", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:157 }
      REMOVE: { guard: "deckListed and collected == 'yes'", target: removing, effect: [flipOff], say: "\"Koleksiyondan çıkar: X\": the control flips back to \"Koleksiyona ekle\" before the answer", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:144 }
      OPEN_DECK: { guard: somethingListed, target: deck_opened, starts: { flow: tedris.decks.readAndCopy }, say: "a card's name is a link to /decks/<id>, a new document: the reader's page of somebody else's deck (e2e decks#6 asserts the link, the walk presses it)", source: apps/tedris/features/flashcards/components/deck-summary-card.tsx:72 }
      OPEN_OWN_DECK: { guard: ownListed, target: own_deck_opened, starts: { flow: tedris.decks.publish }, say: "the person's own published deck opens the author's page, where \"Özele çek\" takes it back", source: apps/tedris/features/flashcards/components/deck-summary-card.tsx:72 }
      OPEN_DECKS: { target: decks_opened, starts: { flow: tedris.decks.browse }, say: "the breadcrumb's \"Desteler\" is a plain link to /decks: a new document", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:221 }
      CLOSE_TOAST: { guard: "notice != 'none'", target: explored, effect: [clearNotice], say: "\"Kapat\" on the toast", source: libs/ui/src/mds/toast.tsx:97 }
      RELOAD: { target: reading, effect: [reloaded, again], say: "the page is read again at the same address: ?type= is kept, the box and the toast are gone, and the buttons say what the API holds (e2e decks#8)", source: apps/tedris/app/decks/(medaris)/(liste)/explore/page.tsx:25 }
      NAVIGATE: left

  adding:
    title: Add the deck to the collection
    description: >-
      The control has already flipped to the badge "Koleksiyonunda" and "Çıkar", which is `loading` (aria-disabled, aria-busy, a hidden "Yükleniyor" status that is
      not in the catalog, DCK-23)
      while the server action addDeckToCollection, POST /flashcard/decks/:id/collections, is out; a second press on the same deck is ignored. The API writes a
      decks_users row and answers 201, also when the row was there. The answer is silent: the page is read again (router.refresh) and the control stays as
      it is, with no toast and no status (DCK-08). A refusal, or a request that never reached the server, flips the control back and raises the error
      toast "Deste eklenemedi" (EXPL-2). A session that is over sends the person to sign in and back, and the control stays busy until the browser leaves.
    source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:80
    invoke: { action: collectDeck }
    on:
      DONE: { target: explored, say: "the control stays flipped; nothing is said", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:88 }
      FAIL.signedOut: sent_to_sign_in
      FAIL.refused: { target: explored, effect: [flipOff, toastAddFailed], say: "the flip is undone and the toast stays", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:92 }

  removing:
    title: Take the deck out of the collection
    description: >-
      The control has already flipped back to "Koleksiyona ekle", `loading` while removeDeckFromCollection, DELETE /flashcard/decks/:id/collections, is out. The
      route is exempt from the permission check on purpose, so that leaving does not depend on still being allowed to read the deck; it deletes the person's
      own row and answers 200, also when there was none. Success is silent. A refusal flips the control back to the badge and "Çıkar" and raises the toast
      "Deste çıkarılamadı". The deck stays in the section either way; only its control changes.
    source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:80
    invoke: { action: uncollectDeck }
    on:
      DONE: { target: explored, say: "the control stays flipped; nothing is said", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:88 }
      FAIL.signedOut: sent_to_sign_in
      FAIL.refused: { target: explored, effect: [flipOn, toastRemoveFailed], say: "the flip is undone and the toast stays", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:92 }

  readFailed:
    title: The decks could not be read
    by: human
    description: >-
      The page's <main> holds one section: the h2 "Desteler yüklenemedi" (the page has no h1, DCK-12), "Bir şeyler ters gitti. Birazdan yeniden dene." and a
      button "Yeniden dene". The breadcrumb, the box, the chips and both sections are gone. The button is router.refresh(): no busy state and no word
      while it reads, and the page asks again with whatever the address held (the filter is kept). The page sets no initial focus.
    source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:111
    on:
      RETRY: { target: reading, effect: [again], say: "\"Yeniden dene\" reads the page again; it may fail again", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:118 }
      NAVIGATE: left

  deck_opened:
    title: A deck of somebody else's is opened
    type: final
    leavesPage: true
    description: >-
      /decks/<id>, a new document. The deck is a published one or one of the person's course, köşk or medrese: the page is the reader's view
      (tedris.decks.readAndCopy). An id the person may not read gives the not-found page (tedris.decks.accessRefusals).

  own_deck_opened:
    title: The person's own published deck is opened
    type: final
    leavesPage: true
    description: >-
      /decks/<id>, a new document, as the author: the owner's page, with "Yayında" and "Özele çek" (tedris.decks.publish, tedris.decks.editOrDelete).

  decks_opened:
    title: The person goes to Desteler
    type: final
    leavesPage: true
    description: /decks, a new document; the added deck is under "Koleksiyonum" there (tedris.decks.browse).

  sent_to_sign_in:
    title: The session is over
    type: final
    leavesPage: true
    description: >-
      The read or a write answered "unauthenticated": reauthIfRefused (reads.ts:38, :51) or sendToSignIn (attempt.ts:28) sends the person to sign in and
      back to this address, ?type= included, and draws no toast and no box. realm.auth.signIn takes over.

  left:
    title: The person goes to another page
    type: final
    leavesPage: true

assertions:
  - id: the-flip-comes-before-the-answer
    never: "(state == 'adding' and collected == 'no') or (state == 'removing' and collected == 'yes')"
    say: "While a write is out the control already says the new state, and a refusal is what puts it back"
    source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:79
  - id: box-only-after-a-failed-read
    never: "state == 'readFailed' and read == 'ok'"
    say: "The box that says the decks could not be read is drawn only when the read failed"
    source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:111
  - id: a-failed-read-draws-no-decks
    never: "state == 'explored' and read == 'failed'"
    say: "A failed read never leaves a list on the page"
    source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:111
