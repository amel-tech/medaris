  crumbDecks: { type: action, component: LinkButton, role: link, text: { key: Decks.title }, in: [explored, adding, removing], emits: OPEN_DECKS, source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:221 } # a plain <a href="/decks">: a new document
  pageTitle: { type: text, component: Heading, role: heading, text: { key: Decks.explore }, in: [explored, adding, removing], source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:223 } # h1
  pageSubtitle: { type: text, component: Text, text: { key: Decks.exploreSubtitle }, in: [explored, adding, removing], source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:224 }

