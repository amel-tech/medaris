# The screens of tedris.decks.explore: "Desteleri keşfet" (tedris-web /decks/explore, features/flashcards/components/explore-decks-page.tsx), as a
# signed-in talebe meets it: the head with its breadcrumb, the search box and the card-type chips, the two sections of decks ("Derslerinin desteleri"
# and "Herkese açık desteler") with their counts, the collection controls of a deck, the toast of a refused change, and the box that takes the page's
# place when the read fails. The deck's own page (/decks/<id>) is another flow's (tedris.decks.readAndCopy, tedris.decks.publish).
#
# Words: every `Decks.*` key is copied from libs/i18n/src/locales/tr/tedris.json (the app reads it as `tedris.Decks`), the key being the path inside that
# file, by script, letter for letter. Five more kinds of entry, none of them in an i18n file:
#   composed.Deck.title        a deck's name, which the API gives: the card's link (deck-summary-card.tsx:73-78; a value, not a message)
#   composed.Decks.context     "<course or köşk or medrese>·<müderris with the unvan they carry there>", the first line of a card in "Derslerinin desteleri"
#                              (deck-summary-card.tsx:113-125; the "·" is decorative, aria-hidden)
#   composed.Decks.footer      "<n> kart·<Kelime|Hadis>": `Decks.cards`, a decorative "·" and `Decks.cardTypeX`, put together (deck-summary-card.tsx:82-88)
#   composed.Button.loading    "Yükleniyor", the kit's own default for a busy button's hidden status (libs/ui/src/mds/button.tsx:62; DCK-23)
#   composed.Toast.close       "Kapat", the toast's close button, a constant of the kit (libs/ui/src/mds/toast.tsx:97; DCK-23)
# and `Changes.note`, the one entry that is NOT copied from the app: the app has no message that says what adding a deck to the collection changes
# (`Decks.exploreSubtitle` only tells the person to do it), so this one factual sentence is written for `changes`; every word of it is what the code does.
# Samples are keyed by the catalog placeholder and are invented and neutral (`title` is the name of the one deck the flow acts on). The replay does not read
# them: it takes its samples from the binding, which also overrides the locators of the nodes that name another deck (binding.yaml).
schema: delurio-graph/0
kind: ui
id: tedris.decks.explore
flow: tedris.decks.explore
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  title: Zümrüt hadis seçkisi
  course: Bina ve İzhar Şerhi
  hoca: Örnek Hoca
  count: "1"
  kind: Hadis

nodes:
