  courseMeta: { type: text, component: Text, text: { key: composed.Decks.footer, params: { count: deck.cardCount, kind: deck.kind } }, in: [explored, adding, removing], when: courseShown, repeat: decks.course, source: apps/tedris/features/flashcards/components/deck-summary-card.tsx:82 }
  courseAdd: { type: action, component: Button, role: button, intent: secondary, text: { key: Decks.add }, name: { key: Decks.addLabel, params: { title: courseDeck.title } }, in: [explored, adding, removing], when: courseShown, source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:157 } # the seeded course deck's own button, which e2e decks#6 asserts; the walk reads it and does not press it. It is the deck of the course the person is in, collected by nobody on the stack

