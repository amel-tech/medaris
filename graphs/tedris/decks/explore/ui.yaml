  courseEmptySearch: { type: text, component: Text, text: { key: Decks.emptySearch }, in: [explored, adding, removing], when: "not courseShown and typed != 'none'", source: apps/tedris/features/flashcards/components/explore-decks-page.tsx:261 } # the same sentence in both sections while the box holds something
