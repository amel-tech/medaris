rules:
  - { id: DCK-08, rule: "\"Koleksiyona ekle\" and \"Çıkar\" swap the whole control (a Button for a span with a badge and a Button, and back), so the button that was pressed is gone and the focus falls to <body>; a success is shown only as the changed control and is never announced, and only a refusal raises a toast (explore-decks-page.tsx:135-166, :75-98). The graph draws the swap as the same two states (the button before, the badge and \"Çıkar\" after) and says nothing of the focus afterwards, because no node has it. Fix: keep one button and change its name, or move the focus to the new control, and add a polite success message" }
  - { id: DCK-11, rule: "the \"{n} deste\" counts change as the person types in the box or presses a chip, and the sentence \"Aramana uyan deste yok.\" appears, with no live region and no status (explore-decks-page.tsx:183-185); filtering is silent. Fix: role=status on the count" }
  - { id: DCK-12, rule: "the read-failure state draws SystemState with headingLevel 2 inside <main>, so the page has no h1 (explore-decks-page.tsx:113-125), and \"Yeniden dene\" is router.refresh() with no busy state and no word while it reads. Fix: headingLevel 1 and a status while it reads" }
  - { id: DCK-23, rule: "two words of this page are not in the catalog: the busy status \"Yükleniyor\" (libs/ui/src/mds/button.tsx:62, the kit's default, which the page does not override) and the toast's close button \"Kapat\" (libs/ui/src/mds/toast.tsx:97, an aria-label constant); the toast's region name \"Bildirimler\" is a default parameter too (toast.tsx:127; ToastHost passes none). Harmless while tr is the only locale a screen can show (the same as MDRS-233)" }
  - { id: DCK-25, rule: "while the page reads again after a chip, (liste)/loading.tsx is a <main aria-busy=\"true\"> of three aria-hidden skeleton bars with no status text (loading.tsx:5-9); whether it is drawn at all when only the query string changes is not verified in a browser. The graph draws no node for it: `reading` has none" }
  - { id: EXPL-1, rule: "new, provisional id. `overrides` (explore-decks-page.tsx:52,72-73,79) is never cleared: once a deck has been added or removed on this page, the page shows what the person last pressed and ignores what router.refresh() brings back for that deck (`overrides[deck.id] ?? deck.inCollection`). With two tabs, or after the deck was removed from the collection on Desteler, this tab keeps saying \"Koleksiyonunda\" until it is reloaded. Read from the code, not seen in a browser. Fix: drop the override once the refreshed row agrees with it, or read from the refreshed row alone" }
  - { id: EXPL-2, rule: "new, provisional id. Every refusal of the two writes, whatever the API said (404 for a deck that was hidden or made private meanwhile, 403, 409, 5xx, or a request that never arrived), draws the one toast \"Deste eklenemedi\" or \"Deste çıkarılamadı\" with \"Bir sorun oluştu. Yeniden dene.\" (explore-decks-page.tsx:92-97; attempt.ts:16-30): a deck that is gone is told to be tried again, and the card stays in the list until the page is read again. Read from the code. Fix: map DECK_NOT_FOUND to a sentence that says the deck is no longer there, and read the page again" }
  - { id: focus-not-set, rule: "Desteleri keşfet sets no initial focus (no autoFocus and no focus() in explore-decks-page.tsx or its page), so the page node has no `initialFocus` and the graph says nothing of the focus when the page opens. After a chip press the page component is not remounted (the same router.push on /discover keeps the focus in its box, observed in tedris.discover.browse), so the focus stays on the chip; not verified here. Recorded so the silence is not read as an omission; the inventory does not call it a finding" }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): the two collection buttons' names are the visible text, a colon and the deck's name (\"Çıkar\" sits inside \"Koleksiyondan çıkar\", compared without case)" }
