edges:
  - { labelledBy: [addDialog, addTitle] }
  - { labelledBy: [editDialog, editTitle] }
  - { labelledBy: [confirmDialog, confirmTitle] }
  - { labelledBy: [deletingDialog, confirmTitle] }
  - { labelledBy: [toastSaveFailed, toastSaveFailedTitle] }
  - { labelledBy: [toastDeleteFailed, toastDeleteFailedTitle] }
  - { triggers: [headerAdd, addForm] }
  - { triggers: [emptyAdd, addForm] }
  - { triggers: [editButton, editForm] }
  - { triggers: [deleteButton, confirmDelete] }
  - { triggers: [addSubmit, adding] }
  - { triggers: [editSubmit, updating] }
  - { triggers: [confirmDo, deleting] }
  - { returnsFocus: [addDialog, headerAdd] } # Base UI gives it back to the element that had it: the header's button (from the code). Opened from the empty state's button, it has nothing to return to once the first card is there (DCK-17)
  - { returnsFocus: [editDialog, editButton] } # the row's own button, which a save keeps (from the code)
  - { returnsFocus: [confirmDialog, deleteButton] } # on "Vazgeç"; after "Kartı sil" the row is gone and nothing is claimed (`deletingDialog`)

rules:
  - { id: focus-not-set, rule: "the page sets no initial focus (deck-cards-page.tsx:75): a keyboard or screen-reader user arrives at the top of the document; the graph draws none (not verified in a browser)" }
  - { id: no-default-accept, rule: "no dialog starts its focus on an action with intent confirm: the form starts in 'Ön yüz' and the confirmation on 'Vazgeç'" }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): 'Düzenle' in 'Düzenle: kart n', 'Sil' in 'Sil: kart n'" }
  - { id: toast-aria-hidden, rule: "Base UI renders an error toast with role=alertdialog and aria-hidden until it is focused and announces it through the viewport's own role=alert (measured by tedris.learning.addToCalendar); it stays until closed, so it is on the page after its form is gone. Screen reader not verified. A success toast is a dialog in the 'Bildirimler' region and closes after 6 seconds" }
  - { id: DCK-06, rule: "a failed submit (a blank face, a face under three characters) shows the Field errors and returns without moving the focus (card-form-dialog.tsx:61-67); Base UI's Field.Error has no role or aria-live (@base-ui/react/field/error), so the message is read only when the control is focused. Fix: focus the first invalid face, or a role=alert summary" }
  - { id: DCK-07, rule: "Field's `required` only draws a decorative `*` (libs/ui/src/mds/field.tsx:42-46); the two textareas carry no `required` or aria-required (card-form-dialog.tsx:118,136), so assistive technology does not know the faces are required. Fix: pass `required` to the Textarea (the form is validated by hand anyway)" }
  - { id: DCK-17, rule: "after 'Kartı sil' succeeds the row, and its 'Sil' button, the dialog's opener, is gone (deck-cards-page.tsx:69-71), and after the first card is added the empty state's 'Kart ekle' is gone (:111-120): Base UI has nothing to give the focus back to and it falls to the document. Not verified in a browser. Fix: after the refresh move the focus to the table's caption or the h1" }
  - { id: DCK-19, rule: "does not apply here: the add and edit dialog pass `initialFocus` (card-form-dialog.tsx:98, the first face) and the confirmation starts on 'Vazgeç'; only the import and copy dialogs have none. Said so because FLOWS.md lists the id for this flow" }
  - { id: DCK-23, rule: "words that are not in the catalog: the dialogs' 'Kapat' and 'Vazgeç' (libs/ui/src/mds/dialog.tsx:62, alert-dialog.tsx:42,47: the delete confirmation passes neither), the busy label 'Yükleniyor' (button.tsx:62) and the toast's 'Kapat' (toast.tsx:97). Harmless while tr is the only locale a screen can show" }
  - { id: DCK-24, rule: "the whole dialog body, the form included, is the Base UI Dialog.Description (libs/ui/src/mds/dialog.tsx:103-112), so a screen reader reads the caption and the fields as the dialog's description when it opens. Not verified with a screen reader" }
  - { id: DCK-26, rule: "readDeck has no reauthIfRefused (features/flashcards/reads.ts:69-87), so a token tedrisat refuses (401) on /decks/<id>/cards lands on the segment's error page and not on sign-in. Not verified end to end" }
  - { id: DCK-31, rule: "holds in this table: the 'Ön yüz' cells are row headers (`rowHeader: true`, deck-cards-page.tsx:134); in the public view's table they are not (deck-public-view.tsx:101-107)" }
  - { id: MCARDS-1, rule: "new, provisional id: 'Kartı sil?' says 'Bu kart ve karta kayıtlı ilerlemen silinecek' (the key Decks.cardDeleteText), but DELETE /flashcard/cards/{id} deletes the card only and its FlashcardProgress rows stay (the progress table has no foreign key to cards; flashcard.repository.ts:134-141; domain invariant progress-orphans). They are invisible, never cleaned and no longer count, so the harm is small, but the words promise a deletion that does not happen. Fix: delete the author's progress rows with the card, or say only 'Bu kart silinecek'" }
