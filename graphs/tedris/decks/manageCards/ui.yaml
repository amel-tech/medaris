  arabicFace: { type: text, component: Text, in: [list], source: apps/tedris/features/flashcards/components/card-face.tsx:24 } # a front in Arabic script is a span with dir=rtl and lang=ar (e2e decks#19); every card of the walks' decks has one, the binding finds the first
  editButton: { type: action, component: Button, role: button, intent: secondary, name: { key: Decks.editLabel, params: { n: card.n } }, text: { key: Decks.edit }, in: [list], repeat: cards, emits: EDIT_CARD, source: apps/tedris/features/flashcards/components/deck-cards-page.tsx:170 } # the visible "Düzenle" is inside the name "Düzenle: kart n"; n is the row's position, and the order is the API's (MCARDS-3)
  deleteButton: { type: action, component: Button, role: button, intent: secondary, name: { key: Decks.deleteLabel, params: { n: card.n } }, text: { key: Decks.deleteShort }, in: [list], repeat: cards, emits: DELETE_CARD, source: apps/tedris/features/flashcards/components/deck-cards-page.tsx:179 }

