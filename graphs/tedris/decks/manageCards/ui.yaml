  cardsPage: { type: page, component: Page, role: main, in: [emptyList, list], source: apps/tedris/features/flashcards/components/deck-cards-page.tsx:75, script: actions } # server-drawn: the table reads without JavaScript, the three buttons and the dialogs need it. No name, no initial focus: the page sets none (focus-not-set). A bare role=main is also on the page a walk leaves for: the binding tells it by the sentence under the header
  deckTitle: { type: text, component: Heading, role: heading, text: { key: composed.ManageCards.deckTitle, params: { title: deck.title } }, in: [emptyList, list], source: apps/tedris/features/flashcards/components/deck-header.tsx:54 } # h1, dir=auto
  tabsNav: { type: list, component: List, role: navigation, name: { key: Decks.tabsLabel }, in: [emptyList, list], source: apps/tedris/features/flashcards/components/deck-header.tsx:113 } # the kit's Tabs in `links` mode: a nav of two links, plain <a href>
  tabOverview: { type: action, component: LinkButton, role: link, text: { key: Decks.tabOverview }, in: [emptyList, list], source: apps/tedris/features/flashcards/components/deck-header.tsx:119 } # leads to /decks/<id>; not walked here
  tabCards: { type: action, component: LinkButton, role: link, text: { key: composed.ManageCards.tabCards, params: { count: cards.count } }, in: [emptyList, list], source: apps/tedris/features/flashcards/components/deck-header.tsx:120 } # aria-current=page; the count is the number of cards the page read (e2e decks#18: "Kartlar 1", "Kartlar 0"), so the binding reads it from the walk's own data
  headerAdd: { type: action, component: Button, role: button, intent: confirm, text: { key: Decks.addCard }, in: [emptyList, list], emits: ADD_CARD, source: apps/tedris/features/flashcards/components/deck-cards-page.tsx:98 } # first of the page's "Kart ekle" buttons (the e2e presses the first)
  cardsNote: { type: text, component: Text, text: { key: Decks.cardsNote }, in: [emptyList, list], source: apps/tedris/features/flashcards/components/deck-cards-page.tsx:108 } # a caption; e2e decks#19 asserts it

  # ---- an empty deck ----
  emptyText: { type: text, component: Text, text: { key: Decks.emptyCards }, in: [emptyList], source: apps/tedris/features/flashcards/components/deck-cards-page.tsx:122 } # the kit's EmptyState: an icon (decorative) and a paragraph
  emptyAdd: { type: action, component: Button, role: button, intent: confirm, text: { key: Decks.addCard }, in: [emptyList], emits: ADD_CARD, source: apps/tedris/features/flashcards/components/deck-cards-page.tsx:114 } # the second button of the same name; once the first card is added it is gone (DCK-17)

