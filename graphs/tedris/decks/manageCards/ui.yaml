# The screens of tedris.decks.manageCards: the author's card list of one deck (/decks/<id>/cards), its three dialogs and the toasts of the three writes. Read from
# apps/tedris/features/flashcards/components/{deck-cards-page,deck-header,card-form-dialog,card-face,deck-badges}.tsx, the kit's dialog, alert-dialog, table and
# toast, and app/decks/(medaris)/[id]/cards/page.tsx on 15 Nov 2026. Nothing was seen in a browser. The page's frame (the bar, the footer, the toast host), the
# header's "Dışa aktar" and "İçe aktar" (tedris.decks.importExport) and the breadcrumb and the deck's badges are other flows' and are not drawn.
# The words are copied from libs/i18n/src/locales/tr/tedris.json (the namespace `Decks`; the key is the path inside that file), by script, letter for letter.
# Five entries are not in any i18n file:
#   composed.ManageCards.deckTitle  "{title}"        the h1: the deck's own name (deck-header.tsx:54)
#   composed.ManageCards.tabCards   "Kartlar {count}" the tab's name: the label and the count span, which the browser joins with a space (deck-header.tsx:120-125)
#   composed.ManageCards.front      "{front}"        the card's front, in the edit form's field (card-form-dialog.tsx:48)
#   composed.ManageCards.back       "{back}"         the card's back, in the edit form's field (card-form-dialog.tsx:49)
#   composed.Kit.close, .cancel, .loading   "Kapat", "Vazgeç", "Yükleniyor": the kit's own defaults (libs/ui/src/mds/dialog.tsx:62, alert-dialog.tsx:42, button.tsx:62), DCK-23
# and one is the only entry authored for this flow, because the app has no message that says what the three writes change:
#   Changes.note   "Kart eklemek destene yeni bir kart koyar, düzenlemek kartın yüzlerini değiştirir, silmek kartı destenden kaldırır; silinen kart geri alınamaz."
# Samples are invented: the deck is the walk's own, "Kart yönetimi denemesi"; the card of the edit form is the Arabic card the main story adds.
schema: delurio-graph/0
kind: ui
id: tedris.decks.manageCards
flow: tedris.decks.manageCards
status: captured
catalog: catalog/tr.json
locales: [tr]
samples:
  title: Kart yönetimi denemesi
  n: "1"
  count: "0"
  min: "3"
  front: قَرَأَ يَقْرَأُ
  back: Okudu, okur.
changes: { key: Changes.note }

nodes:
