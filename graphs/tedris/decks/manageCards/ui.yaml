  editFrontHelp: { type: text, component: Text, text: { oneOf: [Decks.frontHelpVOCABULARY, Decks.frontHelpHADEETH] }, in: [editForm, updating], source: apps/tedris/features/flashcards/components/card-form-dialog.tsx:112 }
