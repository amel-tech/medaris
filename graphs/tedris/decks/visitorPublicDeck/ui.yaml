  signInLink: { type: action, component: LinkButton, role: link, text: { key: PublicDeck.signIn }, in: [deckPage, studying, studyOver], emits: SIGN_IN, source: apps/tedris/features/flashcards/components/deck-public-view.tsx:73 } # /auth/signin?callbackUrl=%2Fdecks%2F<id> (the study page: %2Fdecks%2Fstudy%2F<id>); a next/link with prefetch off
  cardsSection: { type: page, component: Page, role: region, name: { labelledBy: cardsHeading }, in: [deckPage], source: apps/tedris/features/flashcards/components/deck-public-view.tsx:78 } # a <section aria-labelledby="deck-cards">
  cardsHeading: { type: text, component: Heading, role: heading, text: { key: Decks.tabCards }, in: [deckPage], source: apps/tedris/features/flashcards/components/deck-public-view.tsx:83 } # h2 "Kartlar"
  cardsCaption: { type: text, component: Text, text: { key: Decks.cards, params: { count: deck.cards } }, in: [deckPage], source: apps/tedris/features/flashcards/components/deck-public-view.tsx:86 } # "12 kart", drawn for an empty deck too ("0 kart")
  emptyNote: { type: text, component: Text, text: { key: Decks.emptyCards }, in: [deckPage], when: emptyDeck, source: apps/tedris/features/flashcards/components/deck-public-view.tsx:92 } # the EmptyState of a deck with no card, with a cards icon
  cardsTable: { type: list, component: List, role: table, name: { key: Decks.tableCaption, params: { title: deck.title } }, in: [deckPage], when: hasCards, source: apps/tedris/features/flashcards/components/deck-public-view.tsx:96 } # the kit's Table with `responsive="stack"`, named by its visually hidden caption; its cells carry explicit roles
  frontHeader: { type: text, component: Text, role: columnheader, text: { key: Decks.frontLabel }, in: [deckPage], when: hasCards, source: apps/tedris/features/flashcards/components/deck-public-view.tsx:104 }
  backHeader: { type: text, component: Text, role: columnheader, text: { key: Decks.backLabel }, in: [deckPage], when: hasCards, source: apps/tedris/features/flashcards/components/deck-public-view.tsx:110 }
  frontCell: { type: text, component: Text, role: cell, text: { key: composed.PublicDeck.front, params: { front: card.front } }, in: [deckPage], when: hasCards, repeat: cards, source: apps/tedris/features/flashcards/components/deck-public-view.tsx:106 } # a plain cell, not the row's header (DCK-31); an Arabic face is lang=ar dir=rtl in its own run
  backCell: { type: text, component: Text, role: cell, text: { key: composed.PublicDeck.back, params: { back: card.back } }, in: [deckPage], when: hasCards, repeat: cards, source: apps/tedris/features/flashcards/components/deck-public-view.tsx:114 } # dir=auto, with the card's source under it when it has one (out of view)
  showing: { type: text, component: Text, text: { key: Decks.showing, params: { total: deck.cards, shownText: rows.shown } }, in: [deckPage], when: hasCards, source: apps/tedris/features/flashcards/components/deck-public-view.tsx:128 } # "12 karttan 6’sı gösteriliyor", and "12 karttan 12’si gösteriliyor" after the last press: the Turkish possessive is built by countOf (deck-model.ts:399); the caption changes with no announcement (DCK-10)
  loadMore: { type: action, component: Button, role: button, intent: secondary, text: { key: Decks.loadMore }, in: [deckPage], when: moreRows, emits: MORE_ROWS, source: apps/tedris/features/flashcards/components/deck-public-view.tsx:135 } # shows six more rows; after the last press it is removed from the page and the focus falls to the document (DCK-10)
  aboutTitle: { type: text, component: Heading, role: heading, text: { key: Decks.aboutTitle }, in: [deckPage], source: apps/tedris/features/flashcards/components/deck-public-view.tsx:150 } # h2 in the aside's card
  aboutText: { type: text, component: Text, text: { key: Decks.aboutPublic }, in: [deckPage], source: apps/tedris/features/flashcards/components/deck-public-view.tsx:151 }
  # what a signed-in reader of the same deck has and a visitor does not: drawn behind `signedIn`, which the visitor's session never satisfies
  collectButton: { type: action, component: Button, role: button, text: { key: Decks.add }, in: [deckPage], when: signedIn, source: apps/tedris/features/flashcards/components/deck-reader-view.tsx:99 } # "Koleksiyona ekle"; e2e learn#13 asserts it is absent
  copyButton: { type: action, component: Button, role: button, text: { key: Decks.copy }, in: [deckPage], when: signedIn, source: apps/tedris/features/flashcards/components/deck-reader-view.tsx:175 } # "Kendi desteme kopyala" (named "…: kart n"), one per visible row; e2e learn#13 asserts none
  readerProgressTitle: { type: text, component: Heading, role: heading, text: { key: Decks.progressTitle }, in: [deckPage], when: signedIn, source: apps/tedris/features/flashcards/components/deck-reader-view.tsx:204 } # h2 "Çalışma durumun" in the reader's aside

  # ---- the study page: /decks/study/<id> for a visitor ----
  studyMain: { type: page, component: Page, role: main, in: [studying, studyOver], source: apps/tedris/features/flashcards/components/study-session.tsx:118 } # the page's own <main>, with no name and no initial focus (rule focus-not-set); the study segment's loading.tsx draws another <main aria-busy> before it (DCK-25)
  crumbDeck: { type: action, component: LinkButton, role: link, text: { key: composed.PublicDeck.title, params: { deck: deck.title } }, in: [studying, studyOver], emits: OPEN_DECK, source: apps/tedris/features/flashcards/components/study-session.tsx:124 } # the deck's name, a link to /decks/<id>
  crumbStudyHere: { type: text, component: Text, text: { key: Study.title }, in: [studying, studyOver], source: libs/ui/src/mds/breadcrumb.tsx:37 } # the current crumb, "Çalışma"
  studyTitle: { type: text, component: Heading, role: heading, text: { key: Study.title }, in: [studying, studyOver], source: apps/tedris/features/flashcards/components/study-session.tsx:130 } # h1
  studySubtitle: { type: text, component: Text, text: { key: Study.subtitleAll, params: { deck: deck.title, count: round.total } }, in: [studying, studyOver], source: apps/tedris/features/flashcards/components/study-session.tsx:115 } # a visitor, or a round of none, gets "{deck} · {n} kart", n being the round's length (at most ten): never the due count, which a visitor has not got
  finishLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Study.finish }, in: [studying, studyOver], emits: FINISH, source: apps/tedris/features/flashcards/components/study-session.tsx:135 } # a ghost link-button to /decks/<id>, a full page load; there on every screen of the page
  roundBar: { type: status, component: Status, role: progressbar, name: { key: Study.round, params: { done: round.done, total: round.total } }, in: [studying], source: apps/tedris/features/flashcards/components/study-session.tsx:179 } # Base UI Progress named by its visible label; moves forward after each rating, the card's number with it
