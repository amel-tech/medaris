  cardCaption: { type: text, component: Text, text: { key: Study.cardOf, params: { n: round.index, total: round.total } }, in: [studying], source: apps/tedris/features/flashcards/components/study-session.tsx:191 } # the same words again, as a caption on the card
  cardStatus: { type: text, component: Text, text: { key: Decks.statusNEW }, in: [studying], when: signedIn, source: apps/tedris/features/flashcards/components/study-session.tsx:194 } # the card's status badge is a member's: the visitor's cards have none
  frontFace: { type: text, component: Text, text: { key: composed.PublicDeck.front, params: { front: card.front } }, in: [studying], source: apps/tedris/features/flashcards/components/study-session.tsx:208 } # CardFace in a <div> with onClick and no role or tab stop (DCK-05); an Arabic front is dir=rtl lang=ar and large
  showBack: { type: action, component: Button, role: button, intent: secondary, text: { key: Study.showBack }, in: [studying], when: faceFront, emits: REVEAL, source: apps/tedris/features/flashcards/components/study-session.tsx:238 } # secondary, right aligned; unmounted when pressed, and the focus falls to the document (DCK-01)
  backEyebrow: { type: text, component: Text, text: { key: Decks.backLabel }, in: [studying], when: faceBack, source: apps/tedris/features/flashcards/components/study-session.tsx:213 } # "Arka yüz", the eyebrow of the back, which nothing announces (DCK-03)
  backFace: { type: text, component: Text, text: { key: composed.PublicDeck.back, params: { back: card.back } }, in: [studying], when: faceBack, source: apps/tedris/features/flashcards/components/study-session.tsx:214 } # dir=auto
  difficulty: { type: text, component: Text, text: { key: Study.difficulty }, in: [studying], when: faceBack, source: apps/tedris/features/flashcards/components/study-session.tsx:223 } # "Ne kadar zordu?", a caption, not a group label
  rateHard: { type: action, component: Button, role: button, intent: secondary, text: { key: Study.hard }, in: [studying], when: faceBack, emits: RATE, source: apps/tedris/features/flashcards/components/study-session.tsx:226 } # outline; for a visitor the three buttons are one: the card moves on and the rating is not kept
  rateMedium: { type: action, component: Button, role: button, intent: secondary, text: { key: Study.medium }, in: [studying], when: faceBack, emits: RATE, source: apps/tedris/features/flashcards/components/study-session.tsx:226 }
  rateEasy: { type: action, component: Button, role: button, intent: secondary, text: { key: Study.easy }, in: [studying], when: faceBack, emits: RATE, source: apps/tedris/features/flashcards/components/study-session.tsx:226 }
  # the end of the round, and a round of none: one EmptyState each, a <p> with a <strong> and a text, then a link
  doneTitle: { type: text, component: Text, text: { key: Study.doneTitle }, in: [studyOver], when: hasCards, source: apps/tedris/features/flashcards/components/study-session.tsx:174 } # <strong class="block">; no focus move, no announcement (DCK-04)
  doneText: { type: text, component: Text, text: { key: Study.doneText, params: { count: round.total } }, in: [studyOver], when: hasCards, source: apps/tedris/features/flashcards/components/study-session.tsx:175 } # "{n} kartı çalıştın.", the round's length
  nothingTitle: { type: text, component: Text, text: { key: Study.nothingTitle }, in: [studyOver], when: emptyDeck, source: apps/tedris/features/flashcards/components/study-session.tsx:163 } # "Bugün için bitti", also for a deck with no card at all (DCK-27)
  nothingText: { type: text, component: Text, text: { key: Study.nothingText }, in: [studyOver], when: emptyDeck, source: apps/tedris/features/flashcards/components/study-session.tsx:164 } # "Bugün tekrar bekleyen kartın yok. Yarın yeniden bak.": a member's sentence
  backToDeck: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Study.backToDeck }, in: [studyOver], emits: BACK_TO_DECK, source: apps/tedris/features/flashcards/components/study-session.tsx:169 } # outline link to /decks/<id>, the only action of either EmptyState (study-session.tsx:158 for the round of none)

edges:
  - { labelledBy: [cardsSection, cardsHeading] }

rules:
  - { id: focus-not-set, rule: "neither page gives the focus to anything when it opens: no autoFocus and no .focus() in deck-public-view.tsx, deck-header.tsx or study-session.tsx, so the pages have no `initialFocus` and the graph says nothing of the focus where the code says nothing. Recorded so the silence is not read as an omission; the inventory does not call it a finding (SYS-3 of tedris.shell.systemPages has the same cause)" }
  - { id: VPD-1, rule: "new, provisional id: a deck the API does not give a visitor is a redirect the page makes after its segment's loading.tsx has streamed, so the document answers HTTP 200 and carries the redirect in the stream: a <meta http-equiv=\"refresh\" content=\"1;url=/auth/signin?callbackUrl=…\"> and the framework's NEXT_REDIRECT marker, under a skeleton <main aria-busy=\"true\"> with no words, and with the page's title \"Desteler | Tedris\" ([id]/page.tsx:42, study/[id]/page.tsx:41; [id]/loading.tsx). Measured with curl as a visitor on the stack's dev server on 15 Nov 2026: 200 for the seeded private deck, for an unknown uuid and for the study address of each; 307 for /decks, /decks/create, /decks/explore, /decks/<id>/cards, /decks/<id>/edit and for an id that is no uuid, which the proxy answers. So a client without script waits a second on an empty page, and a client that reads only the status is told the page exists (200); the body holds nothing of the deck (its name and its cards are not in it). Not verified in a production build. Fix: read the deck where the status can still be set, before the segment's loading boundary, as the celse layout means to (SYS-2 of tedris.shell.systemPages has the same cause), or let the proxy decide with the API" }
  - { id: DCK-10, rule: "\"Daha fazla göster\" is removed from the DOM after the last page (the focus falls to the document), and the new rows and the caption \"{total} karttan {n’sı} gösteriliyor\" appear without announcement (deck-public-view.tsx:126-142). Fix: keep the button or hand the focus to the first new row, and make the caption role=status" }
  - { id: DCK-25, rule: "both pages stream behind a loading.tsx that is a <main aria-busy=\"true\"> of aria-hidden skeleton bars: an empty, unnamed main with no status text ([id]/loading.tsx:11-14, study/[id]/loading.tsx:10-13; libs/ui/src/mds/skeleton.tsx). While a redirect for a closed deck is on its way (VPD-1) this is all the visitor sees. Fix: add a visually hidden status text" }
  - { id: DCK-26, rule: "readDeck has no reauthIfRefused (reads.ts:69-87; the list, explore and study reads have it), so a person whose session cookie holds a token that tedrisat refuses (401) is counted as signed in by `isSignedIn()` and lands on the segment's error page on /decks/<id>, instead of being sent to sign in again. It is not this flow's visitor, whose branch reads with no token and cannot be refused for lack of one; recorded here because both branches call readDeck. Not verified end to end. Fix: call reauthIfRefused in the member branch" }
  - { id: DCK-27, rule: "a visitor's round of 0 cards says \"Bugün için bitti\" and \"Bugün tekrar bekleyen kartın yok. Yarın yeniden bak.\" for a public deck that has no card, where \"come back tomorrow\" is wrong (study-session.tsx:155-165); the deck's page says \"Bu destede henüz kart yok.\" for the same deck. A public deck with no card is possible (publishing it does not ask for a card). Fix: add copy for \"this deck has no cards\"" }
  - { id: DCK-31, rule: "in the public view's table the \"Ön yüz\" cells are not row headers, while the reader's and the owner's tables set rowHeader: true on that column (deck-public-view.tsx:101-107 against deck-reader-view.tsx:140, deck-cards-page.tsx:134). Fix: set rowHeader: true" }
  - { id: DCK-01, rule: "pressing \"Arka yüzü göster\" removes that button (the footer swaps to \"Zor / Orta / Kolay\") and rating swaps the footer back, so the focused element disappears and the focus falls to the document twice per card; the window's Space handler is then the only keyboard way until the person tabs in again (study-session.tsx:221-245). Shared with tedris.decks.study. Fix: move the focus on reveal to the back or the first rating" }
  - { id: DCK-03, rule: "the revealed back and the next card appear with no live region, no focus move and no announcement (study-session.tsx:201-218). Shared with tedris.decks.study. Fix: an aria-live region or focus the back" }
  - { id: DCK-04, rule: "the end of the round (\"Tur bitti\") and the empty round replace the card with no announcement and no focus move (study-session.tsx:155-176). Shared with tedris.decks.study. Fix: focus the summary or give it role=status" }
  - { id: DCK-05, rule: "turning the card by clicking its face is a div with onClick and no role or tab stop, and Space is a window listener with no visible hint and no aria-keyshortcuts (study-session.tsx:74-84, :202-209). The graph draws only the Space key (FLIP) and the button. Shared with tedris.decks.study. Fix: say the shortcut or make the face a toggle button" }
  - { id: public-deck-hidden-still-given, rule: "see ACCREF-1 of tedris.decks.accessRefusals: hiding a deck that is public does not stop the API giving it to a caller with no token (findVisibility selects no archived_at, flashcard-deck.repository.ts:82-99), so a visitor with the address still reads it here. Not walked: the stack has no public deck to hide and hiding one is the başnazım's act in another app" }
