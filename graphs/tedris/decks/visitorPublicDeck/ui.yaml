# The screens of tedris.decks.visitorPublicDeck: a public deck's page (DeckPublicView) and its study page (StudySession with signedIn false)
# as a person with no session meets them. The bar around the page (tedris.shell.frame), the toast host, the loading skeletons (DCK-25)
# and the sign-in page itself (realm.auth.signIn) are not drawn; nor is any state of the redirects, which have no screen.
#
# Words: every key is copied from libs/i18n/src/locales/tr/tedris.json (the app reads it as `tedris.<key>`: `Decks.*`, `PhoneMenu.discover`)
# or from tedris-learn.json (read as `tedrisLearn.<key>`: `Study.*`, `PublicDeck.*`), the key being the path inside that file, copied
# letter for letter by <scratchpad>/vpd-probe/catalog.mjs. The `composed.PublicDeck.*` keys are NOT in any i18n file: they are what the app
# builds in code from a value the API gives, written here with their placeholders so a replay can match them:
#   composed.PublicDeck.title   the deck's name, a value the API gives (h1, the breadcrumb's current page and its link on the study page)
#                                                                          deck-header.tsx:54, study-session.tsx:124
#   composed.PublicDeck.front   a card's front, a value the API gives (a table cell, and the face of the card being studied)
#                                                                          deck-public-view.tsx:106, study-session.tsx:208
#   composed.PublicDeck.back    a card's back, a value the API gives                                  deck-public-view.tsx:114, study-session.tsx:214
# Words the code does not take from the catalog and the graph keeps out: the breadcrumb's name "Sayfa yolu" is the catalog's `Decks.breadcrumbLabel`.
# The flow invokes only a read, so it writes nothing for a visitor. `check --strict` still wants a `changes` note, because the domain lists an
# audit row on getDeck for the başnazım's read of another person's private deck, which a visitor never makes. The note is the app's own
# message: PublicDeck.note, "Giriş yapmadan çalışırsan ilerlemen kaydedilmez.", the very sentence both pages show. No entry of the catalog
# is authored for this flow.
# `samples` are keyed by the catalog's placeholder, as the checker reads them, so a placeholder that two messages share has one value: the
# deck of the walk has twelve cards (`count`, `total`), and the round is cut to ten (`Kart 1 / 10`, `{n} kartı çalıştın`). The binding
# gives the numbers its own way where they differ, and a regex where they change with each card. The deck is the one public-deck.mjs
# makes: twelve Arabic words with their Turkish meaning.
schema: delurio-graph/0
kind: ui
id: tedris.decks.visitorPublicDeck
flow: tedris.decks.visitorPublicDeck
status: captured
catalog: catalog/tr.json
locales: [tr]
changes: { key: PublicDeck.note }
samples:
  deck: Açık deste denemesi
  title: Açık deste denemesi
  count: "12"
  total: "12"
  shownText: 6’sı
  done: "0"
  n: "1"
  front: كتاب
  back: kitap

# Nothing on either page sets a focus: no autoFocus and no focus() in deck-public-view.tsx or study-session.tsx, and the buttons that
# had it are unmounted by the next step (DCK-01, DCK-10). So no page has an `initialFocus` and the file has no `focus`.
nodes:
  # ---- the deck's page: /decks/<id> for a visitor ----
  deckMain: { type: page, component: Page, role: main, in: [deckPage], source: apps/tedris/features/flashcards/components/deck-public-view.tsx:50 } # the page's own <main>, with no name and no initial focus (rule focus-not-set); the segment's loading.tsx draws another <main aria-busy> before it (DCK-25)
  crumbs: { type: page, component: Page, role: navigation, name: { key: Decks.breadcrumbLabel }, in: [deckPage, studying, studyOver], source: libs/ui/src/mds/breadcrumb.tsx:25 } # the kit's Breadcrumb, an ordered list; a visitor's root is "Keşfet"
  crumbDiscover: { type: action, component: LinkButton, role: link, text: { key: PhoneMenu.discover }, in: [deckPage, studying, studyOver], emits: OPEN_DISCOVER, source: apps/tedris/features/flashcards/components/deck-header.tsx:48 } # /discover, a plain anchor; study-session.tsx:123 draws the same
  crumbDeckHere: { type: text, component: Text, text: { key: composed.PublicDeck.title, params: { deck: deck.title } }, in: [deckPage], source: libs/ui/src/mds/breadcrumb.tsx:37 } # the current crumb, aria-current="page", never a link
  deckTitle: { type: text, component: Heading, role: heading, text: { key: composed.PublicDeck.title, params: { deck: deck.title } }, in: [deckPage], source: apps/tedris/features/flashcards/components/deck-header.tsx:54 } # h1, dir=auto
  publicBadge: { type: text, component: Text, text: { key: Decks.public }, in: [deckPage], source: apps/tedris/features/flashcards/components/deck-header.tsx:74 } # an outline badge; the owner's header has the status badge instead and a reader's has "Koleksiyonunda" besides
  deckCount: { type: text, component: Text, text: { key: Decks.cardsMeta, params: { count: deck.cards } }, in: [deckPage], source: apps/tedris/features/flashcards/components/deck-header.tsx:87 } # "12 ezber kartı", the first piece of the caption
  deckKind: { type: text, component: Text, text: { key: Decks.cardTypeVOCABULARY }, in: [deckPage], source: apps/tedris/features/flashcards/components/deck-header.tsx:91 } # the second piece, after a decorative "·": "Kelime", or "Hadis" for a deck of hadith cards (out of view: the walk's deck is a vocabulary deck)
  studyLink: { type: action, component: LinkButton, role: link, text: { key: Decks.study }, in: [deckPage], emits: STUDY, source: apps/tedris/features/flashcards/components/deck-public-view.tsx:59 } # a large link-button with a play icon to /decks/study/<id>, a full page load
  # the note and its link are drawn on the study page too: the same Alert, with the study page as the page to come back to
