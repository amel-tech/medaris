# tedris.decks.study, a round of three cards none of which was ever studied: the caption counts "3 yeni kart" and every badge says "Yeni". A file of its
# own because it reaches the states of the main story with other nodes, and adds no transition (the walk takes a scenario's file only with `--to`).
#   flock <scratchpad>/replay.lock nice -n 10 node apps/engine/src/cli.ts replay graphs/tedris/decks/study \
#     --bind graphs/tedris/decks/study/binding.unstarted.yaml --to finished --out <dir>
# Written and NOT RUN. The deck is the walk's own (study-data.mjs make applicantD unstarted) and is removed with its rows.
schema: delurio-graph/0
kind: binding
extends: walk.common.binding.yaml
flow: tedris.decks.study

scenarios:
  unstarted:
    given: { deck: unstarted, answer: saved }
    as: applicantD
    open: '{tedris}/decks/study/{study.deck}'
    setup:
      - run: [node, ../tedris/decks/study/study-data.mjs, make, applicantD, unstarted]
        expect: 'study-data make APPLICANT_D unstarted deck'
    teardown:
      - run: [node, ../tedris/decks/study/study-data.mjs, remove, applicantD]
        expect: 'study-data remove APPLICANT_D'

states:
  rating: { call: '{tedris}/decks/study/**' }
