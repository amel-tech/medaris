# The screens of tedris.decks.study: the study page of a deck for a signed-in talebe (/decks/study/<id>, study-session.tsx), its two refusal screens
# ("Sayfa bulunamadı" and "Bu desteye ulaşılamıyor"), and the error toast of a refused rating. The system bar above the page, the footer and the
# toast host are tedris.shell.frame's; the deck page the links lead to is other flows'.
#
# Words: every key is copied letter for letter from libs/i18n/src/locales/tr/tedris-learn.json (`tedrisLearn.Study.*` as `Study.*`) and
# libs/i18n/src/locales/tr/tedris.json (`tedris.Decks.*` as `Decks.*`, `tedris.SystemPages.*` as `SystemPages.*`, `tedris.DeckUnavailable.*` as
# `DeckUnavailable.*`), by <scratchpad>/study-probe/catalog.mjs, which fails on a missing key. Four entries are not the app's:
#   composed.Study.face      "{front}"  the front of the card on screen, data the API gives, set in a <span> by CardFace (card-face.tsx:9-47)
#   composed.Study.back      "{back}"   the back of the card, in a <p class="mds-reading" dir="auto"> (study-session.tsx:214)
#   composed.Study.crumbDeck "{deck}"   the deck's name, the breadcrumb's middle link (study-session.tsx:124)
#   composed.Toast.close     "Kapat"    the toast's close button, written in the kit (libs/ui/src/mds/toast.tsx:97)
# and `Changes.note`, authored for this flow because the page writes (saveCardProgress): the app has no message that says what a rating changes,
# so it is one short, factual Turkish sentence, said so here.
# The kit's progress bar and the card's section are named by their visible words, so their node names carry the counters as `params`; the numbers
# change with every card and the binding gives regexes for them. Samples are the walk's own deck, "Deneme destesi study".
schema: delurio-graph/0
kind: ui
id: tedris.decks.study
flow: tedris.decks.study
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  deck: Deneme destesi study
  count: "2"
  done: "0"
  total: "3"
  n: "1"
  front: فعل
  back: fiil

# Nothing on the study page sets a focus: no autoFocus, no focus() in study-session.tsx, and the buttons that had it are unmounted by the next
# step (DCK-01, DCK-04). So the page has no `initialFocus` and the file has no `focus`: the graph says nothing of the focus where the code says nothing.
nodes:
  # ---- the page: one <main> that holds a header and the card ----
  studyPage: { type: page, component: Page, role: main, in: [front, back, rating, stuck, finished, nothing], source: apps/tedris/features/flashcards/components/study-session.tsx:118 } # the page's own <main>, with no name and no initial focus (rule focus-not-set); the segment's loading.tsx draws another <main aria-busy> before it
  crumbs: { type: page, component: Page, role: navigation, name: { key: Decks.breadcrumbLabel }, in: [front, back, rating, stuck, finished, nothing], source: libs/ui/src/mds/breadcrumb.tsx:25 } # the kit's Breadcrumb, an ordered list: Desteler / the deck's name / Çalışma
  crumbRoot: { type: action, component: LinkButton, role: link, text: { key: Decks.title }, in: [front, back, rating, stuck, finished, nothing], source: apps/tedris/features/flashcards/components/study-session.tsx:123 } # /decks (a visitor's root is "Keşfet", out of view)
  crumbDeck: { type: action, component: LinkButton, role: link, text: { key: composed.Study.crumbDeck, params: { deck: studyDeck.title } }, in: [front, back, rating, stuck, finished, nothing], source: apps/tedris/features/flashcards/components/study-session.tsx:124 } # /decks/<id>
  crumbCurrent: { type: text, component: Text, text: { key: Study.title }, in: [front, back, rating, stuck, finished, nothing], source: libs/ui/src/mds/breadcrumb.tsx:37 } # the current crumb, aria-current="page", never a link
  studyTitle: { type: text, component: Heading, role: heading, text: { key: Study.title }, in: [front, back, rating, stuck, finished, nothing], source: apps/tedris/features/flashcards/components/study-session.tsx:130 } # h1
  subtitleDue: { type: text, component: Text, text: { key: Study.subtitleDue, params: { deck: studyDeck.title, count: round.due } }, in: [front, back, rating, stuck, finished], when: "deck == 'waiting'", source: apps/tedris/features/flashcards/components/study-session.tsx:111 } # the caption names the round as it began; the number counts the repeats only, while the round holds the new cards too ("Bu tur: 0 / 3 kart" under "... 2 kart", STUDY-2)
  subtitleNew: { type: text, component: Text, text: { key: Study.subtitleNew, params: { deck: studyDeck.title, count: round.fresh } }, in: [front, back, rating, stuck, finished], when: "deck in ['unstarted', 'single']", source: apps/tedris/features/flashcards/components/study-session.tsx:113 } # no card waits: the caption counts the new cards
  subtitleAll: { type: text, component: Text, text: { key: Study.subtitleAll, params: { deck: studyDeck.title, count: round.total } }, in: [nothing], source: apps/tedris/features/flashcards/components/study-session.tsx:115 } # "{deck} · 0 kart": the count of an empty round
  finishLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Study.finish }, in: [front, back, rating, stuck, finished, nothing], emits: FINISH, source: apps/tedris/features/flashcards/components/study-session.tsx:135 } # a ghost link-button to /decks/<id>, a full page load; there on every screen of the page

  # ---- the bar and the card ----
  roundBar: { type: status, component: Status, role: progressbar, name: { key: Study.round, params: { done: round.done, total: round.total } }, in: [front, back, rating, stuck], source: apps/tedris/features/flashcards/components/study-session.tsx:179 } # Base UI Progress named by its visible label; the percent is aria-valuetext and the visible number is aria-hidden; moves forward after each saved rating
  cardRegion: { type: page, component: Page, role: region, name: { key: Study.cardOf, params: { n: round.index, total: round.total } }, in: [front, back, rating, stuck], source: apps/tedris/features/flashcards/components/study-session.tsx:185 } # <section aria-label="Kart n / total">; a region the focus is never sent to
  cardCaption: { type: text, component: Text, text: { key: Study.cardOf, params: { n: round.index, total: round.total } }, in: [front, back, rating, stuck], source: apps/tedris/features/flashcards/components/study-session.tsx:191 } # the same words again, as a caption on the card
  badgeLearning: { type: text, component: Text, text: { key: Decks.statusLEARNING }, in: [front, back, rating, stuck], when: waitingCard, source: apps/tedris/features/flashcards/components/study-session.tsx:194 } # the card's own status for this person: a started card (a MASTERED one that is due again would say "Tamamlandı", out of view)
  badgeNew: { type: text, component: Text, text: { key: Decks.statusNEW }, in: [front, back, rating, stuck], when: "not waitingCard", source: apps/tedris/features/flashcards/components/study-session.tsx:194 } # a card no one studied: no progress row is NEW
  frontFace: { type: text, component: Text, text: { key: composed.Study.face, params: { front: card.front } }, in: [front, back, rating, stuck], source: apps/tedris/features/flashcards/components/study-session.tsx:208 } # CardFace in a <div> with onClick and no role or tab stop (DCK-05); an Arabic front is dir=rtl lang=ar and large
  backEyebrow: { type: text, component: Text, text: { key: Decks.backLabel }, in: [back, rating, stuck], source: apps/tedris/features/flashcards/components/study-session.tsx:213 } # "Arka yüz": the eyebrow of the back, which nothing announces (DCK-03)
  backFace: { type: text, component: Text, text: { key: composed.Study.back, params: { back: card.back } }, in: [back, rating, stuck], source: apps/tedris/features/flashcards/components/study-session.tsx:214 } # dir="auto"
  showBack: { type: action, component: Button, role: button, intent: secondary, text: { key: Study.showBack }, in: [front], emits: REVEAL, source: apps/tedris/features/flashcards/components/study-session.tsx:238 } # secondary, right aligned; it is unmounted when pressed, and the focus falls to the document (DCK-01)
  difficulty: { type: text, component: Text, text: { key: Study.difficulty }, in: [back, rating, stuck], source: apps/tedris/features/flashcards/components/study-session.tsx:223 } # "Ne kadar zordu?", a caption, not a group label: the three buttons are in no group (DCK-05)
  hard: { type: action, component: Button, role: button, intent: secondary, text: { key: Study.hard }, in: [back, rating, stuck], disabledIn: [rating, stuck], emits: RATE_HARD, source: apps/tedris/features/flashcards/components/study-session.tsx:226 } # outline; natively `disabled` while a write is out, not the kit's `loading` (DCK-02)
  medium: { type: action, component: Button, role: button, intent: secondary, text: { key: Study.medium }, in: [back, rating, stuck], disabledIn: [rating, stuck], emits: RATE_MEDIUM, source: apps/tedris/features/flashcards/components/study-session.tsx:226 }
  easy: { type: action, component: Button, role: button, intent: secondary, text: { key: Study.easy }, in: [back, rating, stuck], disabledIn: [rating, stuck], emits: RATE_EASY, source: apps/tedris/features/flashcards/components/study-session.tsx:226 }

  # ---- the end of the round, and a round with no card: one EmptyState each, a <p> with a <strong> and a text, then a link ----
  doneTitle: { type: text, component: Text, text: { key: Study.doneTitle }, in: [finished], source: apps/tedris/features/flashcards/components/study-session.tsx:174 } # <strong class="block"> inside the empty state's <p>; no focus move, no announcement (DCK-04)
  doneText: { type: text, component: Text, text: { key: Study.doneText, params: { count: round.total } }, in: [finished], source: apps/tedris/features/flashcards/components/study-session.tsx:175 } # "{n} kartı çalıştın.", the round's total, also for cards rated "Zor"
  doneBack: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Study.backToDeck }, in: [finished], emits: BACK_TO_DECK, source: apps/tedris/features/flashcards/components/study-session.tsx:169 } # outline link to /decks/<id>
  nothingTitle: { type: text, component: Text, text: { key: Study.nothingTitle }, in: [nothing], source: apps/tedris/features/flashcards/components/study-session.tsx:163 } # "Bugün için bitti", also for a deck with no card at all (DCK-27)
  nothingText: { type: text, component: Text, text: { key: Study.nothingText }, in: [nothing], source: apps/tedris/features/flashcards/components/study-session.tsx:164 }
  nothingBack: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Study.backToDeck }, in: [nothing], emits: BACK_TO_DECK, source: apps/tedris/features/flashcards/components/study-session.tsx:158 }

  # ---- the error toast of a refused rating (the unified kit's Toaster): it stays until it is closed, and a retry does not take it off ----
  failedToast: { type: alert, component: Alert, role: alertdialog, name: { labelledBy: failedTitle }, in: [front, back, rating, stuck, finished], when: toasted, source: libs/ui/src/mds/toast.tsx:77 } # tone "error": timeout 0, priority high. Base UI gives a high-priority toast the role alertdialog and aria-hidden until it is focused, and announces it through the viewport's own role=alert (measured by another flow, not here; not verified with a screen reader). Its region is "Bildirimler"
  failedTitle: { type: text, component: Text, text: { key: Study.saveFailedTitle }, in: [front, back, rating, stuck, finished], when: toasted, source: apps/tedris/features/flashcards/components/study-session.tsx:100 } # a <p>
  failedText: { type: text, component: Text, text: { key: Study.saveFailedText }, in: [front, back, rating, stuck, finished], when: toasted, source: apps/tedris/features/flashcards/components/study-session.tsx:101 } # "Kart yerinde duruyor. Yeniden dene.": said for a 404 or a 403 too, which no retry changes (STUDY-1)
  failedClose: { type: action, component: Button, role: button, intent: dismiss, name: { key: composed.Toast.close }, in: [front, back, rating, stuck, finished], when: toasted, emits: CLOSE_TOAST, duringStep: true, source: libs/ui/src/mds/toast.tsx:97 } # an icon button named by a constant of the kit (aria-label="Kapat"), aria-hidden with the toast until it is focused. Live while a rating is written: in the app it closes the toast at once, and a refusal then raises a second one (out of view); drawn handled once the answer is in

  # ---- "Sayfa bulunamadı": no such deck, a malformed id, another person's private deck, a hidden shared deck ----
  notFoundPage: { type: page, component: Page, role: region, name: { labelledBy: notFoundTitle }, in: [notFound], source: apps/tedris/features/errors/system-page.tsx:49 } # SystemState with `shell` is a <section>; no <main> around it on /decks (DCK-16); no initialFocus (rule focus-not-set)
  notFoundTitle: { type: text, component: Heading, role: heading, text: { key: SystemPages.notFoundTitle }, in: [notFound], source: apps/tedris/features/errors/system-page.tsx:52 } # h1
  notFoundText: { type: text, component: Text, text: { key: SystemPages.notFoundText }, in: [notFound], source: apps/tedris/features/errors/system-page.tsx:59 }
  goHome: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: SystemPages.notFoundAction }, text: { key: SystemPages.notFoundAction }, in: [notFound], emits: GO_HOME, source: apps/tedris/features/errors/system-page.tsx:54 } # /home for a signed-in person

  # ---- "Bu desteye ulaşılamıyor": the API said 403 (not reachable on the stack) ----
  # A plain <div> with a Card from the old shadcn kit: no landmark, so no page node (DCK-16).
  unavailableTitle: { type: text, component: Heading, role: heading, text: { key: DeckUnavailable.title }, in: [unavailable], source: apps/tedris/features/flashcards/components/deck-unavailable.tsx:23 } # h1
  unavailableText: { type: text, component: Text, text: { key: DeckUnavailable.description }, in: [unavailable], source: apps/tedris/features/flashcards/components/deck-unavailable.tsx:24 }
  backToDecks: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: DeckUnavailable.backToDecks }, text: { key: DeckUnavailable.backToDecks }, in: [unavailable], emits: BACK_TO_DECKS, source: apps/tedris/features/flashcards/components/deck-unavailable.tsx:26 } # /decks

edges:
  - { labelledBy: [notFoundPage, notFoundTitle] }
  - { labelledBy: [failedToast, failedTitle] }

rules:
  - { id: DCK-01, rule: "Pressing \"Arka yüzü göster\" unmounts that button (the footer swaps to the three ratings), and a rating swaps the footer back, so the focused element is removed twice per card and the focus falls to the document (study-session.tsx:221-245, :86-107). The window-level space handler (:74-84) is then the only keyboard way until the person tabs in again. Fix: move the focus on the reveal to the back text or the first rating, and after a rating to the card, or keep one persistent button. Read from the code; not measured in a browser." }
  - { id: DCK-02, rule: "rateFlashcard is awaited bare (study-session.tsx:94) where every other deck write goes through attempt() (attempt.ts:16-30), whose comment describes exactly this failure. When the Server Action call rejects (the network is down), `busy` is never reset: the three buttons stay natively disabled and no toast comes. Native `disabled` can also drop the keyboard focus from the pressed button, which the kit says a busy button must not do (libs/ui/src/mds/button.tsx:29: `loading`, never `disabled`). Fix: try/finally or attempt(), the existing \"İlerlemen kaydedilemedi\" toast, and `loading={busy}`. Read from the code; `stuck` is not reachable on the stack." }
  - { id: DCK-03, rule: "The revealed back and the next card appear with no live region, no focus move and no announcement: a screen-reader user hears nothing after turning a card or rating it (only the bar's value changes). Fix: put the back and \"Kart n / total\" in an aria-live=polite region, or focus the revealed back (study-session.tsx:201-218)." }
  - { id: DCK-04, rule: "The end of the round (\"Tur bitti\") and \"Bugün için bitti\" replace the card with no announcement and no focus move, and the rating button that had the focus is gone (study-session.tsx:155-176). Fix: focus the summary text (tabindex -1) or give it role=status." }
  - { id: DCK-05, rule: "Turning the card by a click is a <div> with onClick, no role and no tab stop (study-session.tsx:202-209, both lint rules switched off). The space bar is a window listener with no visible hint and no aria-keyshortcuts; it turns the card back as well, and is ignored whenever the focus is on a button, a link or a field. The three ratings sit in no group: \"Ne kadar zordu?\" is a caption, not their label. Fix: say the shortcut in the page and add aria-keyshortcuts=\"Space\", or make the face a real toggle button, and group the ratings with the caption as their name." }
  - { id: DCK-27, rule: "A round of no card says \"Bugün için bitti. Bugün tekrar bekleyen kartın yok. Yarın yeniden bak.\" also for a deck with no card at all, where \"look again tomorrow\" is wrong (study-session.tsx:155-165). Fix: add words for \"this deck has no cards\" and a way to add one." }
  - { id: DCK-14, rule: "ForbiddenState's words call a deck public that the person may read through a course, a köşk or a medrese (system-page.tsx:97-99). It is the cards and edit pages' screen, not this page's: this page never draws it. Cited so that the same screen is not read as this flow's; the home of the finding is tedris.decks.accessRefusals." }
  - { id: DCK-15, rule: "The comments of deck-unavailable.tsx:7-12 say a missing deck and a refused one render the same copy on purpose; in code a 404 or a 400 is notFound() (\"Sayfa bulunamadı\", study/[id]/page.tsx:58) and only a 403 is DeckUnavailable (\"Bu desteye ulaşılamıyor\", :59): two screens. The round's read answers 404 for every refusal a person can meet, so the second is reached only by the API's second lock (a race) and no fixture reaches it. Same finding, same home: tedris.decks.accessRefusals." }
  - { id: DCK-16, rule: "Neither refusal screen has a main landmark on /decks: NotFoundState is a <section> (SystemState `shell`) that relies on a shell <main>, which TabView leaves out for /decks (components/tab-view/index.tsx:18), and DeckUnavailable is a plain <div>. The skeleton study/[id]/loading.tsx does draw a <main aria-busy>, so the landmark disappears when the answer comes. Same finding, same home: tedris.decks.accessRefusals." }
  - { id: STUDY-1, rule: "New, provisional id. A rating the API refuses can be neither saved nor skipped. rate() returns after the toast with the card, its back and the buttons as they were (study-session.tsx:97-104) and the page has no way to the next card. The toast says \"Kart yerinde duruyor. Yeniden dene.\" for every refusal, but a 404 (CARD_NOT_FOUND: the author deleted the card while the round was open) and a 403 (AUTHZ_FORBIDDEN: the deck stopped being readable, flashcard.service.ts:238-244) give the same answer to every retry. The only way past the card is \"Çalışmayı bitir\", which gives up the rest of the round. Read from the code and the service; the refusal was not made on the stack. Decision D2." }
  - { id: STUDY-2, rule: "New, provisional id. The caption says \"{deck} · Bugün tekrar bekleyen {n} kart\" with n the repeats only (counts.due, study-session.tsx:111-112), while the round also holds up to ten cards the person has never studied and the bar says \"Bu tur: 0 / {total} kart\" with the whole total. Seen on the seeded fixture of e2e learn#7, which asserts exactly this pair (\"... 2 kart\" and \"0 / 3 kart\"). Low: the caption is true and incomplete. Fix: name both numbers, or the total." }
  - { id: ACCREF-1, rule: "Proposed by tedris.decks.accessRefusals, which measured it on GET /flashcard/decks/{id}: hiding a deck hides it only from the people it was shared with (a course, köşk or medrese deck stops being readable), while a public deck that was hidden is still served to anyone who has its address, because the guard lets a public deck through before it asks anything else (tedrisat-role-resolver.service.ts:305). The round's route (GET /flashcard/decks/{id}/due, deck.view through the same resolver) is guarded the same way, so by the code a hidden public deck can still be studied, with its progress written. Not measured on this route." }
  - { id: focus-not-set, rule: "The study page sets no focus on load, none after a card is turned, none after a rating, none at the end of the round, and none on its refusal screens: no autoFocus and no focus() in study-session.tsx, system-page.tsx or deck-unavailable.tsx, so the nodes carry no initialFocus and the file no `focus`. Recorded so the silence is not read as an omission; DCK-01 and DCK-04 are the findings that follow from it." }
  - { id: rating-is-immediate, rule: "A rating is written the moment its button is pressed and cannot be taken back: there is no \"next\" and no undo, and one press is one PUT. A card rated by mistake keeps its schedule until it is studied again (HARD is due in a day, MEDIUM in three or more, EASY in seven or more). Stated so the page's Changes.note is read against the code (actions/index.ts:186-197)." }
  - { id: unified-kit-toast, rule: "The error toast is the unified kit's, from the host the decks segment carries (app/decks/(medaris)/layout.tsx:18): role alertdialog and aria-hidden until it is focused, closed by a button whose name \"Kapat\" is a constant of the kit and not a catalog message (the same default as ADDCAL-2 of tedris.learning.addToCalendar). It is not closed by the next successful rating." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): the three ratings, \"Arka yüzü göster\", \"Çalışmayı bitir\" and \"Desteye dön\" are named by their visible text" }
