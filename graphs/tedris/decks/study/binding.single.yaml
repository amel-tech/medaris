# tedris.decks.study, a round of one card: the first rating ends the round ("1 kartı çalıştın."). A file of its own because `opening` goes to the one-card
# branch only from this start (left: one at once).
#   flock <scratchpad>/replay.lock nice -n 10 node apps/engine/src/cli.ts replay graphs/tedris/decks/study \
#     --bind graphs/tedris/decks/study/binding.single.yaml --to finished --out <dir>
# Written and NOT RUN. The deck is the walk's own (study-data.mjs make applicantD single) and is removed with its rows.
schema: delurio-graph/0
kind: binding
extends: walk.common.binding.yaml
flow: tedris.decks.study

scenarios:
  single:
    given: { deck: single, answer: saved }
    as: applicantD
    open: '{tedris}/decks/study/{study.deck}'
    setup:
      - run: [node, ../tedris/decks/study/study-data.mjs, make, applicantD, single]
        expect: 'study-data make APPLICANT_D single deck'
    teardown:
      - run: [node, ../tedris/decks/study/study-data.mjs, remove, applicantD]
        expect: 'study-data remove APPLICANT_D'

states:
  rating: { call: '{tedris}/decks/study/**' }
