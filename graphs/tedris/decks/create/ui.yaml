rules:
  - { id: focus-not-set, rule: "The page sets no focus: no autoFocus and no focus() in create-deck-page.tsx, so the page has no `initialFocus` and the graph says nothing of the focus when it opens, after a failed press or after a refusal. Recorded so the silence is not read as an omission; from the code, not measured (the other pages of this app were measured to leave it on the document, tedris.discover.applyForKosk)." }
  - { id: DCK-06, rule: "A failed press of \"Oluştur\" shows the field errors and moves no focus (create-deck-page.tsx:74-79); Base UI's Field.Error has no role and no live region (libs/ui/src/mds/field.tsx:50-58), so \"Bir deste adı yaz.\", \"Deste adı en az 5 karakter olmalı.\" and the two tags messages are read only when the person tabs back to the field. The radio message does have role=alert (create-deck-page.tsx:179) but the radios are not marked invalid or described by it, although the kit's RadioGroup has an `error` prop that does both (radio-group.tsx:92-95,115-123). Inconsistent inside one form. Fix: focus the first invalid control (or a summary with role=alert) and pass the message to RadioGroup `error`." }
  - { id: DCK-07, rule: "Does not hold on this page, and is recorded so that the inventory's finding is not read as touching it: the name input carries `required` (create-deck-page.tsx:134, so assistive technology is told) and the radio group carries `required` (:153). The finding is about the card, edit and import dialogs, where Field `required` only draws the decorative asterisk (field.tsx:42-46). The description and tags are optional and say so in their help." }
  - { id: DCK-23, rule: "Two words are written in the kit and not in the catalog: the busy label \"Yükleniyor\" (button.tsx:62, create-deck-page.tsx passes no `loadingLabel`) and the toast's close button \"Kapat\" (toast.tsx:97). Harmless while the app is Turkish only." }
  - { id: DCKCREATE-1, rule: "New, proposed id, from the code (not run): the page counts the name in UTF-16 units and the API counts characters, so a name the page takes is refused. titleProblem (deck-model.ts:155-162) is trimmed.length, the number of UTF-16 units, against 5; the API's @MinLength(5) (create-flashcard-deck.dto.ts:16) is class-validator's, which calls validator.js isLength (class-validator's decorator/string/MinLength.js, validator/lib/isLength.js), and that counts a surrogate pair as one character and drops a variation selector (U+FE0E, U+FE0F). A name of three emoji (\"😀😀😀\") is six units on the page and three characters at the API: the page sends it, the API answers 400 VALIDATION_ERROR, and the person gets the one toast \"Deste oluşturulamadı / Bir sorun oluştu; yazdıkların korundu. Yeniden dene.\" (create-deck-page.tsx:92-97) with nothing naming the name, and retrying can never succeed: the page throws the API's code and message away (`result.error` is not read). The same count is used the other way for the tags and the maxLength of the inputs (too strict, never harmful). Fix: count the way the API counts, `[...trimmed].length` less the selectors, or name the refused field from the 400 as the toast does for nothing today. The same count is in the edit dialog (deck-edit-dialog.tsx:60, the same titleProblem) and the card dialog (faceProblem against the API's @MinLength(3), deck-model.ts:263-267): two emoji are four units and two characters. Not drawn here; tedris.decks.editOrDelete and tedris.decks.manageCards draw those dialogs." }
  - { id: DCKCREATE-2, rule: "New, proposed id, from the code (not run), low: choosing a kind changes the preview's heading, the sample card and its back with no live region, no focus move and no sentence (create-deck-page.tsx:216-239), so a screen-reader user who picks Hadis is not told that the preview changed. The preview is only an example and the choice itself is announced by the radio, so this is low. Fix: none needed beyond `aria-live=\"polite\"` on the heading, or say nothing and let the preview be a landmark that is read on request." }
  - { id: deck-born-private, rule: "The form draws no visibility choice, the server action sends none (`createFlashcardDeckDto` has title, description, cardType, tags: actions/index.ts:36-43), the API refuses a body that names isPublic (the DTO has no such property and the pipe forbids unknown ones, create-flashcard-deck.dto.ts:20-23) and the repository writes isPublic false and publishStatus PRIVATE whatever it is given (flashcard-deck.repository.ts:169-181). The notice \"Deste özel başlar\" says so in words. Making it public is a request the başnazım answers (tedris.decks.publish). The node `publicChoice` is never shown: a replay with --absent checks that \"Herkese açık\" is nowhere on the page (decks#9 a4)." }
  - { id: deck-limits, rule: "The page checks what the API checks, except for the count in DCKCREATE-1: a name of 5 to 100 characters (deck-model.ts:149-162, DTO :16-17), a description of at most 1000 (maxLength; :48-52), at most 20 tags of at most 40 characters each, trimmed, blanks dropped, repeats dropped in the Turkish alphabet (deck-model.ts:125-147, DTO :35-46, flashcard-deck.service.ts:25-36). The API repeats the tag rules, so a body that does not come from the page gets the same. Only the author reads the tags back." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): every field's label is its name; the radios' names are their labels (aria-labelledby the label span, not the sentence under it); the form's name \"Deste oluştur\" is the h1's words" }
