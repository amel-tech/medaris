# The screens of tedris.decks.create: the page "Deste oluştur" (/decks/create), drawn in the three states the form is on (before "Oluştur" has been
# pressed, after it, and while the deck is made), and the toast of a refusal. Read from apps/tedris/app/decks/(medaris)/create/page.tsx and
# apps/tedris/features/flashcards/components/create-deck-page.tsx, with the kit's field.tsx, radio-group.tsx, alert.tsx, button.tsx,
# breadcrumb.tsx and toast.tsx, on 15 Nov 2026. Everything here is "from the code": nothing was looked at in a browser. The toast's role
# (a high-priority Base UI toast is an alertdialog, aria-hidden until it is focused) is taken from the same kit as seen on
# tedris.discover.applyForKosk, not seen here.
# The system bar (PhoneChrome), the footer and the toast host's own region belong to tedris.shell.frame; the new deck's page and the list
# of Desteler are other flows'. Only the nodes of this flow are drawn.
#
# Words: every key is copied, letter for letter, from libs/i18n/src/locales/tr/tedris.json (the app reads it as `tedris.Decks.*`), the key
# being the path inside that file. `composed.Decks.sampleFrontVOCABULARY` and `composed.Decks.sampleFrontHADEETH` are the two Arabic
# sentences of the preview, which the app keeps in code and in no catalog (create-deck-page.tsx:30-33: "the same words in every
# language, so not messages"). Two words are written in the kit and not in a catalog: the busy label "Yükleniyor" (button.tsx:62,
# DCK-23) and the toast's close button "Kapat" (toast.tsx:97, DCK-23); they are literals here.
# `{min}` of Decks.nameTooShort is 5 and `{max}` is 20 in Decks.tagsTooMany and 40 in Decks.tagsTooLong (deck-model.ts:125-126,149-151): one
# sample can hold one value, so it holds 20 and the scenario of the long tag gives its own `samples: { max: '40' }`.
# `changes` is the app's own message that tells the person who sees the deck and how it becomes public (Decks.noticeText): the app has no
# other message for "what this flow makes", and a graph never invents one.
schema: delurio-graph/0
kind: ui
id: tedris.decks.create
flow: tedris.decks.create
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples: { min: "5", max: "20" }
changes: { key: Decks.noticeText }

