  trail: { type: page, component: Page, role: navigation, name: { key: Decks.breadcrumbLabel }, in: [form, formAttempted, creating], source: apps/tedris/features/flashcards/components/create-deck-page.tsx:104 } # the kit's Breadcrumb: a list of "Desteler" (a link) and the page's own name (aria-current="page")
  trailDecks: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Decks.title }, in: [form, formAttempted], emits: BREADCRUMB, source: libs/ui/src/mds/breadcrumb.tsx:43 } # a plain <a href="/decks">: a full page load. Not in `creating`: while the deck is made the item is given no href (create-deck-page.tsx:107), so the kit draws it as plain text (breadcrumb.tsx:52), as leaving would not stop the deck
  trailCurrent: { type: text, component: Text, text: { key: Decks.create }, in: [form, formAttempted, creating], source: libs/ui/src/mds/breadcrumb.tsx:36 } # the same words as the h1; the binding finds it by aria-current
  title: { type: text, component: Heading, role: heading, text: { key: Decks.create }, in: [form, formAttempted, creating], source: apps/tedris/features/flashcards/components/create-deck-page.tsx:111 } # h1; the tab title is "Deste oluştur | Tedris" (page.tsx:10)
  subtitle: { type: text, component: Text, text: { key: Decks.createSubtitle }, in: [form, formAttempted, creating], source: apps/tedris/features/flashcards/components/create-deck-page.tsx:112 }

