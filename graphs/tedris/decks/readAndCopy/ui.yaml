# The screens of tedris.decks.readAndCopy: the reader's page of a deck (/decks/<id>, deck-reader-view.tsx with the header of deck-header.tsx), its
# copy dialog (copy-card-dialog.tsx) and the toasts that follow a write. The author's view, the visitor's view and the pages around are other
# flows' (flow.yaml scope.outOfView).
# The words are copied from libs/i18n/src/locales/tr/tedris.json (keys kept, the root `tedris` removed) by <scratchpad>/readAndCopy-probe/catalog.mjs,
# letter for letter. Nine entries are in no i18n file:
#   composed.Deck.title          "{title}"        the deck's name, which the API gives: the h1 and the breadcrumb's last item (deck-header.tsx:54)
#   composed.Deck.description    "{description}"  the deck's description, the author's own text (deck-header.tsx:104-108)
#   composed.DeckHeader.meta     "{count} ezber kartı·{kind}"  the caption the code builds from two messages, `cardsMeta` and `cardTypeHADEETH` or
#                                `cardTypeVOCABULARY`, and an aria-hidden "·" between them (deck-header.tsx:86-102)
#   composed.Card.front / .back / .source   "{front}" "{back}" "{source}"  a card's two faces and its source line, the author's own texts (deck-reader-view.tsx:141-155)
#   composed.Button.loading      "Yükleniyor"     the busy button's hidden <output>, a default of the kit (libs/ui/src/mds/button.tsx:62; DCK-23)
#   composed.Dialog.close        "Kapat"          the dialog's close icon, a default of the kit (libs/ui/src/mds/dialog.tsx:62; DCK-23)
#   composed.Toast.close         "Kapat"          the toast's close button, a constant of the kit (libs/ui/src/mds/toast.tsx:97; DCK-23)
# `Changes.note` is the one entry not copied from the app, and `changes` needs one because the flow writes (collectDeck, uncollectDeck, createCards):
# the app has a sentence for the copy (`copyHelp`, "Kart, seçtiğin destene olduğu gibi eklenir; bu deste değişmez.") and none for the collection, so
# one factual sentence says both. It names the section "Koleksiyonum" of Desteler (`collectionTitle`), which is what the code does.
# Samples are invented and neutral; the replay reads each one back from the screen, so the binding gives the same values (its `samples`).
schema: delurio-graph/0
kind: ui
id: tedris.decks.readAndCopy
flow: tedris.decks.readAndCopy
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  title: Hadis okuma denemesi
  description: Niyet ve amel üzerine seçme hadisler.
  count: "8"
  total: "8"
  shownText: 6’sı
  kind: Hadis
  n: "1"
  done: "0"
  deck: Kendi hadis destem
  front: إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ
  back: Ameller niyetlere göredir.
  source: Buhârî, Müslim

# The page sets no focus when it opens (rule focus-not-set), so the page node has no `initialFocus`; the only focus the graph draws is the dialog's.
nodes:
  # ---- the page and its header (deck-reader-view.tsx, deck-header.tsx) ----
  readerMain: { type: page, component: Page, role: main, in: [reader, collecting, uncollecting], source: apps/tedris/features/flashcards/components/deck-reader-view.tsx:83, script: actions } # the page's own <main> (TabView leaves /decks without one); no name, no initial focus; server-drawn, the buttons need JavaScript (not run with --no-js)
  breadcrumbDecks: { type: action, component: LinkButton, role: link, text: { key: Decks.title }, in: [reader, collecting, uncollecting], emits: OPEN_DECKS, source: apps/tedris/features/flashcards/components/deck-header.tsx:48 } # in the nav "Sayfa yolu"; the back arrow is decorative; the trail's last item is the deck's name as the current page
  deckTitle: { type: text, component: Heading, role: heading, text: { key: composed.Deck.title, params: { title: title } }, in: [reader, collecting, uncollecting], source: apps/tedris/features/flashcards/components/deck-header.tsx:54 } # h1, dir=auto
  publicBadge: { type: text, component: Text, text: { key: Decks.public }, in: [reader, collecting, uncollecting], when: isPublic, source: apps/tedris/features/flashcards/components/deck-header.tsx:73 } # an outline badge; a shared deck has none, and nothing says it is shared except the sentence beside the cards
  collectedBadge: { type: text, component: Text, text: { key: Decks.inCollection }, in: [reader, collecting, uncollecting], when: "collected == 'yes'", source: apps/tedris/features/flashcards/components/deck-header.tsx:76 } # a success badge with a check icon, which follows the button at once (DCK-09: nothing else says it)
  metaLine: { type: text, component: Text, text: { key: composed.DeckHeader.meta, params: { count: count, kind: kind } }, in: [reader, collecting, uncollecting], source: apps/tedris/features/flashcards/components/deck-header.tsx:86 } # one span: "8 ezber kartı", an aria-hidden "·", "Hadis"; a reader's line has no "Senin desten"
  deckDescription: { type: text, component: Text, text: { key: composed.Deck.description, params: { description: description } }, in: [reader, collecting, uncollecting], source: apps/tedris/features/flashcards/components/deck-header.tsx:104 } # only when the deck has one
  collectButton: { type: action, component: Button, role: button, intent: secondary, text: { key: Decks.add }, in: [reader, uncollecting], when: "collected == 'no'", disabledIn: [uncollecting], emits: COLLECT, source: apps/tedris/features/flashcards/components/deck-reader-view.tsx:92 } # outline, large, a plus icon; busy is aria-disabled, not disabled (the kit's `loading`), so the focus stays on it
  uncollectButton: { type: action, component: Button, role: button, intent: secondary, text: { key: Decks.removeFromCollection }, in: [reader, collecting], when: "collected == 'yes'", disabledIn: [collecting], emits: UNCOLLECT, source: apps/tedris/features/flashcards/components/deck-reader-view.tsx:92 } # the same element as collectButton with its label swapped
