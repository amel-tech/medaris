edges:
  - { labelledBy: [cardsRegion, cardsHeading] }
  - { labelledBy: [copyDialogPage, copyTitle] }
  - { labelledBy: [addFailedToast, addFailedTitle] }
  - { labelledBy: [removeFailedToast, removeFailedTitle] }
  - { labelledBy: [copyFailedToast, copyFailedTitle] }
  - { triggers: [collectButton, collecting] }
  - { triggers: [uncollectButton, uncollecting] }
  - { triggers: [copyButton, copyDialog] }
  - { triggers: [copySubmit, copying] }
  - { returnsFocus: [copyDialogPage, copyButton] } # Vazgeç, the icon, Esc and a finished copy all close the dialog; Base UI hands the focus back to the button that had it (the row's), also when the parent unmounts the dialog. Read from the code, not seen (rule focus-returns)

rules:
  - { id: DCK-09, rule: "adding a deck to the collection and taking it out keep the same button (good: the kit's `loading` gives aria-disabled, not `disabled`, so the focus stays) but success is told only by the badge \"Koleksiyonunda\" coming or going and the button's name changing (deck-reader-view.tsx:61-81); there is no toast, no status line and no live region, so a screen-reader user hears nothing but, perhaps, the name change of the focused button. The list pages swap the control for another element (DCK-08; tedris.decks.explore). Read from the code, not tried with a screen reader. Fix: a polite status line or a success toast." }
  - { id: DCK-10, rule: "\"Daha fazla göster\" is removed from the page after the last rows (deck-reader-view.tsx:189-196), and the focus that was on it is lost; the new rows and the caption \"{n} karttan {m}’sı gösteriliyor\" appear with no announcement (the caption is a plain <p>). Read from the code. Fix: move the focus to the first new row, make the caption role=status." }
  - { id: DCK-19, rule: "CopyCardDialog passes no `initialFocus` (copy-card-dialog.tsx:81-101), so Base UI gives the focus to the dialog's first tabbable element, which is the header's close icon \"Kapat\" (Base UI's default `true`, popupStoreUtils.js createDefaultInitialFocus), where the kit's rule 13 says the first field. The graph draws `initialFocus: copyClose`. Read from the code, not seen in a browser. Fix: pass a ref to the first radio." }
  - { id: DCK-23, rule: "three words are the kit's own, in no catalog: the dialog's close icon \"Kapat\" (dialog.tsx:62), the busy button's \"Yükleniyor\" (button.tsx:62) and the toast's close \"Kapat\" (toast.tsx:97); the page passes no closeLabel or loadingLabel. Latent while tr is the only locale a screen can show. Fix: pass them from the catalog." }
  - { id: DCK-24, rule: "the whole body of the form dialog is Base UI's Dialog.Description (dialog.tsx:103-112), so the dialog's aria-describedby points at the sentence, the radio group and the error line together. Not verified with a screen reader. Fix: describe the dialog with the sentence alone." }
  - { id: DCK-06, rule: "(the radios' half) \"Bir hedef deste seç.\" is a role=alert paragraph below the group (copy-card-dialog.tsx:124-128), announced when it appears; but the radios are not marked invalid or described by it although the kit's RadioGroup has an `error` prop that does exactly that (radio-group.tsx:92-95), and the focus stays on \"Kopyala\" (not verified in a browser). Fix: pass the message to RadioGroup `error`." }
  - { id: DCK-31, rule: "the reader's table gives the front cell the row-header role (rowHeader: true, deck-reader-view.tsx:140); the visitor's table does not (deck-public-view.tsx:101-107, tedris.decks.visitorPublicDeck). This graph's front cells are `rowheader`. No fix here." }
  - { id: MDRS-224, rule: "the table's caption, \"{title} destesinin kartları\", and the toast's sentence, \"“{deck}” destesine eklendi.\", append \"destesi\" to a name, so a deck called \"... destesi\" reads \"... destesi destesinin kartları\" (the planned.md umbrella item on copy). The walks' decks are named without the word." }
  - { id: READCOPY-1, rule: "new, provisional id. \"Vazgeç\", the close icon and Esc close the copy dialog while the call is out (copy-card-dialog.tsx:83-85 and :92 are not disabled while `busy`), but the call is not cancelled: submit goes on, the card is copied, the success toast is raised and router.refresh() runs after the person chose to cancel (:61-76). The same shape as DCK-30 on the delete dialog. The graph marks Vazgeç and the close icon `duringStep`: their press is drawn as handled where the call's answer leads, which is where the page ends too. Read from the code, not seen. Fix: ignore the close while `busy`, or abort the call." }
  - { id: READCOPY-2, rule: "new, provisional id. The page decides reader or owner by the token's subject against the deck's author only (deck-page-data.ts:38-39), but the API lets more people read a deck than the enrolled: the course's staff (resolveDeckRole returns PUBLIC for a holder of deck.manage_course, tedrisat-role-resolver.service.ts:304-312) and the başnazım (an audited read). Such a person is given this reader's view with \"Koleksiyona ekle\" and the sentence \"Bu deste, kayıtlı olduğun bir dersin ... destesi\", which is untrue of them; POST /flashcard/decks/{id}/collections asks assertReadable with no staff exception (flashcard-deck.controller.ts:318) and answers 403 DECK_FORBIDDEN (the domain's own note on collectDeck), and the toast says \"Bir sorun oluştu. Yeniden dene.\" Read from the code and the domain; not run (no replay in this phase). Fix: hide the button and say who the person is, or let the API collect for staff; decision D1." }
  - { id: refusals-say-try-again, rule: "every refusal of the three writes, whatever its status (404 for a deck that stopped being readable, 403, a network failure turned into a refusal by `attempt`), gives the same toast with \"Bir sorun oluştu. Yeniden dene.\" (no screen of the deck pages maps a code), although a retry cannot help for a 404 or a 403. The inventory's shared mechanics say so. The graph draws one FAIL.refused for each write." }
  - { id: toast-aria-hidden, rule: "Base UI renders a high-priority (error) toast with role=alertdialog, tabindex=0 and aria-hidden=true until it is focused, and says it again in a visually hidden role=alert of the viewport; a replay finds it by its role attribute. Whether a screen reader announces it is not verified (the same as tedris.learning.addToCalendar's toast-aria-hidden)." }
  - { id: focus-not-set, rule: "The page sets no initial focus (no autoFocus and no focus() in deck-reader-view.tsx or deck-header.tsx), so `readerMain` has no `initialFocus` and the graph says nothing of the focus when it opens. Recorded so the silence is not read as an omission." }
  - { id: focus-returns, rule: "returnsFocus is drawn for the copy dialog from the code (Base UI's FloatingFocusManager returns the focus to the element that had it when the popup opened, and does so when the parent unmounts the dialog); the inventory says the same; it was not seen in a browser in this phase, so the replay of the later phase is its first check." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): the row buttons' name \"Kendi desteme kopyala: kart n\" holds their visible \"Kendi desteme kopyala\"; the other buttons' names are their visible text. Holds." }
