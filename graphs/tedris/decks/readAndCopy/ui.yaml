  targetMissing: { type: alert, component: Alert, role: alert, text: { key: Decks.targetRequired }, in: [copyDialog, copying], when: "attempted == 'yes' and picked == 'no'", source: apps/tedris/features/flashcards/components/copy-card-dialog.tsx:124 } # a <p class="mds-error" role="alert"> below the group; it goes when a radio is chosen; the radios are not marked invalid and the focus does not move (DCK-06)
