  studyLink: { type: action, component: LinkButton, role: link, intent: confirm, text: { key: Decks.study }, in: [reader, collecting, uncollecting], emits: STUDY, source: apps/tedris/features/flashcards/components/deck-reader-view.tsx:101 } # primary, a play icon; /decks/study/<id>

