  cardsTable: { type: list, component: List, role: table, name: { key: Decks.tableCaption, params: { title: title } }, in: [reader, collecting, uncollecting], when: hasCards, source: apps/tedris/features/flashcards/components/deck-reader-view.tsx:131 } # `responsive="stack"` gives it explicit table roles; named by its visually hidden caption (MDRS-224: "X destesi destesinin kartları" when the title ends in "destesi")
