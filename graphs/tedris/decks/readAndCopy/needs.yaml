schema: delurio-graph/0
kind: needs
id: tedris.decks.readAndCopy
status: proposed
summary: >-
  What must exist for a talebe who reads a deck somebody else wrote, collects it and copies a card: the flow's product list, from
  its story and from the decisions of the inventory, never from what the page does today. Gender separation is given and does not
  touch this flow: a deck has no seats, so no kontenjan and no per-gender count is asked here.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# Written in the owner's no-replay phase, so no scenario of binding*.yaml has been walked: `walked` names e2e checks only, and a need that no e2e check
# carries is `unwalked` even where a scenario is bound for it (the walk phase will name the scenarios that pass).
# Missing or unwalked, for the gaps merge:
# missing   staff-and-the-bashnazim-are-not-offered-the-collection (READCOPY-2, a defect, no Linear key), a-refusal-tells-its-cause (refusals-say-try-again),
# closing-the-dialog-stops-the-copy (READCOPY-1), changes-are-announced (DCK-09, DCK-10), the-copy-dialog-starts-in-its-form (DCK-19, DCK-06, DCK-24, DCK-23)
# unwalked  no-deck-to-copy-into-sends-to-create (a unit spec only; binding.yaml's noTarget is bound), a-refused-write-puts-the-page-back (no e2e;
# binding.refused.yaml is bound)

needs:
  - id: read-a-deck-and-not-change-it
    need: >-
      A signed-in person who did not write a deck and may read it (it is public, or it belongs to a course, a köşk or a medrese
      they are enrolled in) sees its name, kind and size, its cards six at a time with their sources and their own progress, and
      can ask for six more. Nothing on the page changes the deck: no edit, no delete, no new card, no import or export, no
      publication request. Which of the two kinds of access it is, public or shared, is said on the page.
    evidence:
      - state: reader
      - node: readerMain
      - node: deckTitle
      - node: publicBadge
      - node: metaLine
      - node: cardsTable
      - node: cardFrontFirst
      - node: cardFrontAll
      - node: cardSource
      - node: showingPart
      - node: showingAll
      - node: loadMoreButton
      - node: progressBar
      - node: aboutPublicText
      - node: aboutSharedText
      - node: emptyCards
      - source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:184
      - source: apps/tedrisat/src/flashcard/flashcard.controller.ts:148
      - source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:109
      - source: apps/tedris/features/flashcards/components/deck-reader-view.tsx:83
      - source: apps/tedris/features/flashcards/deck-page-data.ts:30
      - test: apps/tedris/e2e/decks.e2e.ts
        name: "shows a deck of somebody else's with no way to change it"
      - test: apps/tedris/e2e/decks.e2e.ts
        name: "shows six cards at a time, with their source"
    note: >-
      decks#22's "no button and no link named Düzenle, Desteyi sil, Kart ekle or İsteği geri çek" is carried by `--absent` only,
      in the sense that the graph draws no such node; its fixed fixture (8 cards, 2 mastered, "2 yeni kart" in explore) is the
      walk's own data. The empty deck has no e2e check and no unit spec on this page (binding.empty.yaml is bound).

  - id: a-deck-of-an-enrolled-course-is-read-never-written
    need: >-
      A talebe enrolled in a course (ENROLLED or COMPLETED, the course published and not hidden) opens the course's, köşk's or
      medrese's deck, which is not public, reads and collects it and copies its cards, and can write nothing in it; a talebe who
      is not enrolled, or whose seat is waiting or revoked, is told it does not exist.
    evidence:
      - state: reader
      - node: aboutSharedText
      - node: collectButton
      - node: copyButton
      - source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:184
      - source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:303
      - source: apps/tedrisat/src/flashcard/deck-sharing.ts:35
      - test: apps/tedris/e2e/decks.e2e.ts
        name: "a deck of a course the caller is enrolled in opens, and cannot be changed"
    note: >-
      decks#26's `response.status() == 200` is not carried (the engine does not compare the status of a page). The refusal for a
      person who is not enrolled is tedris.decks.accessRefusals'. The domain invariant is `deck-shared-with-enrolled-read`.

  - id: collect-a-deck-and-take-it-out
    need: >-
      A reader puts the deck in their collection and takes it out again from the deck's page; the page says at once which it is
      (the button and the badge), the collection holds it after a reload and Desteler lists it under "Koleksiyonum", and a refused
      change puts the page back as it was.
    evidence:
      - state: reader
      - state: collecting
      - state: uncollecting
      - node: collectButton
      - node: uncollectButton
      - node: collectedBadge
      - node: collectBusy
      - source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:303
      - source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:457
      - source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:109
      - source: apps/tedris/features/flashcards/components/deck-reader-view.tsx:61
      - test: apps/tedris/e2e/decks.e2e.ts
        name: "'Koleksiyondan çıkar' takes the badge away and 'Koleksiyona ekle' brings it back"
    note: >-
      decks#25 asserts the database through `expect.poll` on decks_users; this flow reads the row with SQL in
      `effects.collectDeck` and `effects.uncollectDeck` instead. The same control on Keşfet's and Desteler's cards is
      tedris.decks.explore's.

  - id: copy-a-card-into-my-own-deck
    need: >-
      A reader copies one card of the deck into one of their own decks of the same kind (Kelime or Hadis), chosen on purpose: with
      nothing chosen the dialog says so and sends nothing; the card goes as it is, front, back, type and source; the deck being
      read is not changed; and the person is told the card was copied and into which deck.
    evidence:
      - state: copyDialog
      - state: copying
      - node: copyButton
      - node: copyDialogPage
      - node: targetGroup
      - node: targetOption
      - node: targetMissing
      - node: copySubmit
      - node: copiedToast
      - source: apps/tedrisat/src/flashcard/flashcard.controller.ts:199
      - source: apps/tedris/features/flashcards/components/copy-card-dialog.tsx:46
      - test: apps/tedris/e2e/decks.e2e.ts
        name: "'Kendi desteme kopyala' puts the card into the chosen own deck and leaves the source alone"
    note: >-
      decks#24's database assertions (the copy keeps `content_front` and `content_meta.source`; the source deck still has its
      cards) are carried by `effects.createCards` (two SQL checks); "only the own deck of the same kind is offered" is carried by
      `count: 1` on the radio node, the walk's reader holding a Hadis and a Kelime deck.

  - id: no-deck-to-copy-into-sends-to-create
    need: >-
      A reader with no own deck of the card's kind is told so in the dialog and is led to Deste oluştur; an own deck of the other
      kind is not an offer.
    evidence:
      - state: copyDialog
      - node: noTargetsText
      - node: createLink
      - state: create_opened
      - source: apps/tedris/features/flashcards/components/copy-card-dialog.tsx:93
    note: >-
      Carried by a unit spec only (apps/tedris/test/deck-detail-page.spec.ts, "without an own deck of that kind it says to create
      one"), no e2e check. binding.yaml's `noTarget` is bound for it and was not walked in this phase.

  - id: a-refused-write-puts-the-page-back
    need: >-
      When tedrisat refuses the collection or the copy (the deck is no longer readable, the target deck is gone), the button and
      the badge go back to what is held, the dialog stays open with what was chosen, and the person is told it did not work.
    evidence:
      - state: collecting
      - state: copying
      - node: addFailedToast
      - node: copyFailedToast
      - source: apps/tedris/features/flashcards/components/deck-reader-view.tsx:74
      - source: apps/tedris/features/flashcards/components/copy-card-dialog.tsx:62
    note: >-
      No e2e check; a unit spec checks the two toasts (deck-detail-page.spec.ts "undoes the collection change when the API
      refuses", "a refused copy is a toast and the dialog stays"). binding.refused.yaml makes both refusals on the stack by a
      change the page does not know of; not walked in this phase. The refusal of an uncollect cannot be made on the stack (the
      route answers 200 whether or not there was a row).

  - id: staff-and-the-bashnazim-are-not-offered-the-collection
    need: >-
      A person who may read the deck without being enrolled in it (the course's staff who did not write it, the Medaris başnazımı)
      is shown a page whose words and buttons are true of them: no "Koleksiyona ekle", which the API refuses with 403, and no
      sentence that says they are enrolled.
    evidence:
      - source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:303
      - source: apps/tedris/features/flashcards/deck-page-data.ts:38
    missing: READCOPY-2, a defect, no Linear key; code exists in part
    note: |-
      Drawn on the states reader and collecting and on the nodes aboutSharedText, collectButton and addFailedToast, which the code
      has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).
      A defect of a built page (READCOPY-2, decision D1), not planned work, so no Linear key. Read from the code and the domain's
      note on collectDeck; not run.

  - id: a-refusal-tells-its-cause
    need: >-
      A refused collection or copy says what is wrong in words that name neither a status nor the server: the deck is no longer
      there, or the person may not collect it, instead of "Bir sorun oluştu. Yeniden dene." for every answer.
    missing: no Linear issue; refusals-say-try-again
    note: |-
      Drawn on the nodes addFailedToast, removeFailedToast, copyFailedToast and addFailedHint, which the code has: they are not
      evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).
      Finding `refusals-say-try-again` (no screen of the deck pages maps a refusal code, the inventory's shared mechanics); a
      defect of built screens, no Linear key.

  - id: closing-the-dialog-stops-the-copy
    need: >-
      "Vazgeç", the close icon and Esc on the copy dialog do what they say: while the call is out they are ignored, or they stop
      it, so the card is never copied after the person chose not to.
    missing: no Linear issue; READCOPY-1
    note: |-
      Drawn on the state copying and on the nodes copyCancel and copyClose, which the code has: they are not evidence, so that a
      replay still walks them (SPEC.md §13 leaves out what only missing needs name).
      READCOPY-1 (decision D2), the same shape as DCK-30 on the delete dialog; a defect, no Linear key. Read from the code, not
      seen.

  - id: changes-are-announced
    need: >-
      The collection change, the six new rows and the new caption "n karttan m'si gösteriliyor" are announced where a
      screen-reader user can hear them, and the focus survives "Daha fazla göster" when it leaves the page.
    missing: no Linear issue; DCK-09, DCK-10
    note: |-
      Drawn on the nodes collectedBadge, collectButton, uncollectButton, loadMoreButton, showingPart and showingAll, which the
      code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).
      DCK-09 and DCK-10, defects of a built page, no Linear key. Read from the code, not tried with a screen reader.

  - id: the-copy-dialog-starts-in-its-form
    need: >-
      The copy dialog gives the focus to its first radio when it opens, marks the radios invalid and describes them by "Bir hedef
      deste seç." when nothing is chosen, describes itself by a sentence and not by its whole body, and its words ("Kapat",
      "Yükleniyor") come from the catalog.
    missing: no Linear issue; DCK-19, DCK-06, DCK-24, DCK-23
    note: |-
      Drawn on the nodes copyDialogPage, copyClose, targetGroup, targetMissing and collectBusy, which the code has: they are not
      evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).
      DCK-19, DCK-06 (the radios' half), DCK-24 and DCK-23, defects of a built dialog, no Linear key. Read from the code and the
      kit, not seen in a browser.
