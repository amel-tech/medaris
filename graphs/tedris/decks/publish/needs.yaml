schema: delurio-graph/0
kind: needs
id: tedris.decks.publish
status: proposed
summary: >-
  What must exist for the author of a deck who asks for it to be published: the flow's product list, from its story and from the
  review the story names, never from what the page does today. Nothing here is planned in planned.md for this flow (MDRS-148, deck
  publication, was not fetched in full, planned.md:159), so a need that the code does not meet is `missing: none`, with the
  finding that names it.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# Missing (no code, no Linear key): refused-deck-says-why-and-asks-again (DCK-13, PUB-3), stale-page-tells-the-truth (PUB-1, PUB-2),
# course-deck-is-not-offered-to-the-public (PUB-4)
# Unwalked (code, and no e2e and no replay that has passed): take-a-public-deck-back, author-is-told-of-the-answer, reviewers-find-a-waiting-request
# (its e2e is nizam's deck-review, another flow's)
# No replay has been run in this phase, so no `walked` names a scenario; the e2e names are the inventory's.

needs:
  - id: ask-and-wait-for-review
    need: >-
      The author of a private deck can ask for it to be made public. The author is told the request went in and when, the deck
      stays private while the request waits (nobody but the author reads it), and the Medaris reviewers get the request.
    evidence:
      - state: privateDeck
      - state: requesting
      - state: reachesReviewers
      - state: pendingDeck
      - node: requestButton
      - node: whoPending
      - source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:336
      - source: apps/tedris/features/flashcards/components/deck-owner-overview.tsx:60
      - test: apps/tedris/e2e/decks.e2e.ts
        name: "shows the author's progress, sample cards and the publication state"
      - test: apps/tedris/e2e/decks.e2e.ts
        name: "'İsteği geri çek' makes the deck private, and 'Yayın iste' asks again"

  - id: take-the-request-back
    need: The author can take a waiting request back at any time, is told the deck is private again, and can ask again.
    evidence:
      - state: pendingDeck
      - state: withdrawingPending
      - state: privateDeck
      - node: withdrawButton
      - node: withdrawnToast
      - source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:439
      - source: apps/tedris/features/flashcards/components/deck-owner-overview.tsx:66
      - test: apps/tedris/e2e/decks.e2e.ts
        name: "'İsteği geri çek' makes the deck private, and 'Yayın iste' asks again"

  - id: take-a-public-deck-back
    need: The author of a published deck can take it back to private whenever they like, and the deck is private from that moment.
    evidence:
      - state: publishedDeck
      - state: takingBackPublished
      - node: makePrivateButton
      - source: apps/tedrisat/src/flashcard/flashcard-deck.controller.ts:439
      - source: apps/tedris/features/flashcards/components/deck-owner-overview.tsx:222
    note: |-
      decks#15 takes back a waiting request, not a published deck; the seeded published deck of decks.e2e.ts is not taken back by
      any test
      Also drawn as the rule take-back-asks-nothing.

  - id: author-is-told-of-the-answer
    need: >-
      When a reviewer publishes the deck, refuses the request or takes the deck back, the author is told, with the reason of a
      refusal or of a take-back, and the author's page shows the new status.
    evidence:
      - state: pendingDeck
      - state: rejectedDeck
      - state: publishedDeck
      - node: whoPublished
      - source: apps/tedrisat/src/deck-review/nizam-deck-requests.controller.ts:128
      - source: apps/tedrisat/src/deck-review/nizam-deck-requests.controller.ts:147
      - source: apps/tedris/features/notifications/notification-view.ts:181
    note: >-
      the notification is built and carries the reason; the page shows the new status only after a reload
      (stale-page-tells-the-truth)

  - id: refused-deck-says-why-and-asks-again
    need: >-
      The author of a refused request is told on the deck's own page that it was refused and why, and can ask again from there
      with one press.
    missing: no Linear issue; DCK-13, PUB-3
    note: |-
      Drawn on the states rejectedDeck and withdrawingRejected, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).
      Also drawn as the rule DCK-13, the rule PUB-3, the open decision D1.

  - id: stale-page-tells-the-truth
    need: >-
      A page that no longer matches the deck (a reviewer answered, the deck was taken back in another tab) says so when the
      author's press is refused, and shows the deck's real status instead of inviting the same refused press again; a second press
      while the first is settling does nothing.
    missing: no Linear issue; PUB-1, PUB-2
    note: |-
      Drawn on the states requesting, withdrawingPending, takingBackPublished and withdrawingRejected, which the code has: they
      are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).
      Also drawn as the rule PUB-1, the rule PUB-2, the open decision D2.

  - id: reviewers-find-a-waiting-request
    need: >-
      The Medaris başnazımı and a Medaris nazımı who may review decks find a waiting request on their list and as a count on their
      home page; they read it before deciding and each read is on the record.
    evidence:
      - state: reachesReviewers
      - source: apps/tedrisat/src/deck-review/nizam-deck-requests.controller.ts:74
      - source: apps/tedrisat/src/deck-review/nizam-deck-requests.controller.ts:109
      - source: apps/nizam/app/talepler/deste-yayin-istekleri/page.tsx:31
    note: its e2e is nizam's deck-review#1-#5, carried by nizam.moderation.reviewDeckPublication

  - id: course-deck-is-not-offered-to-the-public
    need: >-
      A deck that belongs to a course is published and taken down only through the course's own routes: the page of the hoca who
      wrote it offers no "Yayın iste", and the API refuses the request.
    missing: no Linear issue; PUB-4
    note: |-
      Drawn on the state privateDeck, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).
      Also drawn as the rule PUB-4.
