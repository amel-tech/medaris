# The screens of tedris.decks.importExport: the author's card list (/decks/<id>/cards) as far as its two file controls, the import dialog
# over it, and the toast that follows a clean import. Read from apps/tedris/features/flashcards/components/{deck-cards-page,import-cards-dialog,
# deck-header}.tsx and libs/ui/src/mds/{dialog,field,alert,button,toast}.tsx on 15 Nov 2026. Nothing was seen in a browser: every behaviour is from the code.
# The card list's other parts (the add, edit and delete dialogs, the status column, the tab row, the breadcrumb) are tedris.decks.manageCards'; the
# system bar above the page, the footer and the toast host are tedris.shell.frame's. The page behind the dialog is inert, so no page node is
# `in` a dialog state.
#
# Words: every `Decks.*` key is copied from libs/i18n/src/locales/tr/tedris.json (the app reads it as `tedris.Decks.<key>`), the key being the path inside
# that file, by <scratchpad>/importExport-probe/catalog.mjs. Text the code builds or the kit hard-codes is `composed.<Namespace>.<name>`:
#   composed.Decks.sampleXlsx    "Excel (.xlsx)"                the first template link, a literal in import-cards-dialog.tsx:137 (DCK-23)
#   composed.Decks.sampleCsv     "CSV (.csv)"                   the second, import-cards-dialog.tsx:143
#   composed.Decks.importRowLine "Satır {row}: {problems}"      one row of the alert: <strong>{importRow}</strong> then ": " and the problems joined with
#                                                               "; " (import-cards-dialog.tsx:154-157); each problem is Decks.importProblem* with a field
#                                                               name from Decks.importField*: "Ön yüz en az 3 karakter olmalı", "Arka yüz boş", "Tür geçersiz",
#                                                               "Bir alan geçersiz" (deck-model.ts:285-334)
#   composed.Dialog.close        "Kapat"                        the dialog's close icon, the kit's default `closeLabel` (libs/ui/src/mds/dialog.tsx:62)
#   composed.Toast.close         "Kapat"                        the toast's close button (libs/ui/src/mds/toast.tsx:97)
#   composed.Button.loading      "Yükleniyor"                   what the busy button's hidden <output> says (libs/ui/src/mds/button.tsx:62,114)
# `changes.key` is the app's own message after a clean import ("{count} kart eklendi."); the flow's only writing step is the import, which has one.
# The deck's name on the page is data: "Aktarma denemesi" is the name the binding's helper gives the deck it makes. Samples are invented and neutral.
schema: delurio-graph/0
kind: ui
id: tedris.decks.importExport
flow: tedris.decks.importExport
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Decks.importedText }
samples:
  title: Aktarma denemesi # the deck's name: the table's caption "{title} destesinin kartları"
  count: '2' # rows with a problem in the alert, and cards added in the toast
  row: '2' # a row of the spreadsheet; the header is row 1
  problems: Ön yüz en az 3 karakter olmalı; Arka yüz en az 3 karakter olmalı

nodes:
  # ---- the author's card list: the two file controls and what a clean import changes ----
  cardsMain: { type: page, component: Page, role: main, in: [cards, exporting, imported, abandoned], source: apps/tedris/features/flashcards/components/deck-cards-page.tsx:75 } # no name and no initial focus: the page sets none (rule focus-not-set)
  deckTitle: { type: text, component: Heading, role: heading, text: { literal: Aktarma denemesi }, in: [cards, exporting, imported, abandoned], source: apps/tedris/features/flashcards/components/deck-header.tsx:54 } # h1, the deck's own name
  exportLink: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: Decks.export }, text: { key: Decks.export }, in: [cards, exporting, imported, abandoned], emits: EXPORT, duringStep: true, source: apps/tedris/features/flashcards/components/deck-cards-page.tsx:83 } # <a download href="/api/decks/<id>/export?format=xlsx">; a refusal is a JSON body behind it and nothing on the page says so (DCK-21); never busy: pressed while an abandoned import is out, the file comes beside it and the page shows only the import's answer (`duringStep`)
  importButton: { type: action, component: Button, role: button, intent: secondary, name: { key: Decks.import }, text: { key: Decks.import }, in: [cards, exporting, imported, abandoned], emits: OPEN_IMPORT, source: apps/tedris/features/flashcards/components/deck-cards-page.tsx:91 }
  emptyText: { type: text, component: Text, text: { key: Decks.emptyCards }, in: [cards, exporting, imported, abandoned], when: "listed == 'none'", source: apps/tedris/features/flashcards/components/deck-cards-page.tsx:122 } # the EmptyState, which also holds a "Kart ekle" button (tedris.decks.manageCards)
  cardsTable: { type: list, component: List, role: table, name: { key: Decks.tableCaption }, in: [cards, exporting, imported, abandoned], when: "listed == 'some'", source: apps/tedris/features/flashcards/components/deck-cards-page.tsx:125 } # named by a visually hidden caption; its rows are tedris.decks.manageCards'

  # ---- the success toast (the unified kit's Toaster, Base UI; a success closes itself after 6 s) ----
  importedToast: { type: status, component: Status, in: [imported], source: libs/ui/src/mds/toast.tsx:77 } # a low-priority Base UI toast is a role=dialog (aria-modal=false) named by its title in the region "Bildirimler"; found in the binding by its class
  importedTitle: { type: text, component: Text, text: { key: Decks.importedTitle }, in: [imported], source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:81 }
  importedText: { type: text, component: Text, text: { key: Decks.importedText }, in: [imported], source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:82 } # "{count} kart eklendi."
  toastClose: { type: action, component: Button, role: button, intent: dismiss, name: { key: composed.Toast.close }, in: [imported], source: libs/ui/src/mds/toast.tsx:97 } # the kit's own word, not a catalog message (DCK-23)

  # ---- the import dialog (a kit `Dialog form`, size md) ----
  importDialog: { type: page, component: Page, role: dialog, name: { labelledBy: importTitle }, in: [dialog, importing, sampling], initialFocus: closeIcon, source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:102 } # initialFocus is Base UI's first tabbable element, the close icon, because the dialog passes none (DCK-19; not seen); a click on the scrim does not close it
  importTitle: { type: text, component: Heading, role: heading, text: { key: Decks.importTitle }, in: [dialog, importing, sampling], source: libs/ui/src/mds/dialog.tsx:87 } # h2 (Base UI Dialog.Title)
  closeIcon: { type: action, component: Button, role: button, intent: dismiss, name: { key: composed.Dialog.close }, in: [dialog, importing, sampling], emits: CANCEL, source: libs/ui/src/mds/dialog.tsx:97 } # an icon button; it stays live while the file is being sent (IMPEXP-5)
  fileField: { type: field, native: file, component: TextField, text: { key: Decks.importFile }, in: [dialog, importing, sampling], source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:127 } # <input type=file name=file accept=".csv,.xlsx,..."> in a Field; the input has no ARIA role and no `required` (DCK-07), and the `*` after "Dosya" is decorative
  fileHelp: { type: text, component: Text, text: { key: Decks.importHelp }, in: [dialog, importing, sampling], when: "said != 'noFile'", source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:123 } # the help line, which the field's error replaces
  fileError: { type: text, component: Text, text: { key: Decks.importNoFile }, in: [dialog, importing, sampling], when: "said == 'noFile'", source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:124 } # Base UI Field.Error: no role, no live region, and the focus is not moved (DCK-06)
  sampleLead: { type: text, component: Text, text: { key: Decks.importSample }, in: [dialog, importing, sampling], source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:135 } # "Örnek şablonu indir" and a colon the code adds, in the same <p> as the two links
  sampleXlsx: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: composed.Decks.sampleXlsx }, text: { key: composed.Decks.sampleXlsx }, in: [dialog, importing, sampling], emits: SAMPLE_XLSX, duringStep: true, source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:136 } # <a download href="/api/decks/sample?format=xlsx">, a plain link, not a kit button; its name is "Excel (.xlsx)" and says nothing of a template (DCK-23); live while a file is sent, the template coming beside it (`duringStep`)
  sampleCsv: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: composed.Decks.sampleCsv }, text: { key: composed.Decks.sampleCsv }, in: [dialog, importing, sampling], emits: SAMPLE_CSV, duringStep: true, source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:142 } # <a download href="/api/decks/sample?format=csv">; live while a file is sent, as the other link

  # what stands under the form after a send: the row alert or the failure alert (role=alert, so both are announced)
  rowAlert: { type: alert, component: Alert, role: alert, in: [dialog, sampling], when: "said == 'rowErrors'", source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:147 }
  rowAlertTitle: { type: text, component: Text, text: { key: Decks.importRowErrors }, in: [dialog, sampling], when: "said == 'rowErrors'", source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:149 } # "{count} satırda sorun var; hiçbir kart eklenmedi." ({count} is the number of rows with a problem)
  rowList: { type: list, component: List, role: list, in: [dialog, sampling], when: "said == 'rowErrors'", source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:151 }
  rowItem: { type: text, component: ListItem, role: listitem, text: { key: composed.Decks.importRowLine }, in: [dialog, sampling], when: "said == 'rowErrors'", repeat: rows, source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:153 } # one per row with a problem, "Satır 2: Ön yüz en az 3 karakter olmalı; ..."; a file of more than 1000 rows gives the one row 1002, "Bir alan geçersiz" (IMPEXP-2); the binding matches the pattern, not the sample
  failedAlert: { type: alert, component: Alert, role: alert, in: [dialog, sampling], when: "said == 'failed'", source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:164 }
  failedTitle: { type: text, component: Text, text: { key: Decks.importFailedTitle }, in: [dialog, sampling], when: "said == 'failed'", source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:164 }
  failedText: { type: text, component: Text, text: { key: Decks.tryAgain }, in: [dialog, sampling], when: "said == 'failed'", source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:165 } # the same sentence for every refusal, whatever the file or the status (DCK-20)

  # the footer
  cancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: Decks.cancel }, in: [dialog, importing, sampling], emits: CANCEL, source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:113 } # stays live while the file is being sent (IMPEXP-5)
  submit: { type: action, component: Button, role: button, intent: confirm, text: { key: Decks.import }, in: [dialog, importing, sampling], disabledIn: [importing], emits: SUBMIT, source: apps/tedris/features/flashcards/components/import-cards-dialog.tsx:114 } # busy while the file is out: aria-disabled and aria-busy, never `disabled`; the same words as the button on the page, which is inert while the dialog is open
  busy: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [importing], source: libs/ui/src/mds/button.tsx:114 } # the hidden <output> beside the button; empty when idle

edges:
  - { labelledBy: [importDialog, importTitle] }
  - { triggers: [exportLink, exporting] }
  - { triggers: [importButton, dialog] }
  - { triggers: [sampleXlsx, sampling] }
  - { triggers: [sampleCsv, sampling] }
  - { triggers: [submit, importing] }
  - { returnsFocus: [importDialog, importButton] } # Base UI returns the focus to the element that had it when the dialog opened, "İçe aktar" on the page (from the code, not seen)

rules:
  - { id: DCK-06, rule: "a send with no file says \"Bir dosya seç.\" as a kit Field error: Base UI's Field.Error has no role and no live region, and the focus is not moved (import-cards-dialog.tsx:62-66,124; libs/ui/src/mds/field.tsx:50-58), so it is read only when the person tabs back to the field. The two alerts below it are role=alert and are announced, so the field's error is the one answer of the dialog that is not. Fix: focus the field, or say it in a role=alert line." }
  - { id: DCK-07, rule: "the file field is marked required only by the decorative `*` after \"Dosya\" (field.tsx:42-46) and the input carries neither `required` nor aria-required (import-cards-dialog.tsx:127-132), so assistive technology does not know the field is needed. Fix: pass `required` to the Input (the form is noValidate anyway)." }
  - { id: DCK-19, rule: "ImportCardsDialog passes no `initialFocus` (import-cards-dialog.tsx:102-110), so Base UI gives the focus to the first tabbable element of the popup, the close icon \"Kapat\" (not seen in a browser); the kit's own rule 13 says the first field, and the card dialogs do pass it. The graph draws the focus on the close icon. Fix: pass a ref to the file input." }
  - { id: DCK-20, rule: "the dialog says \"en çok 5 MB\" and checks nothing before sending (import-cards-dialog.tsx:62-99); then every refusal that is not a 422 with rows (400 for an empty file, a file over 5 MB or of another type, 401, 403, 404, 429 with a Retry-After the route passes on and the dialog ignores, 500, 502, a network error) is the one alert \"Dosya içe aktarılamadı\" / \"Bir sorun oluştu. Yeniden dene.\" (:88-95,163-167), and a session that has ended is not sent to sign in (the fetch bypasses `attempt` and `sendToSignIn`). Fix: map 400, 401, 413, 429 to sentences of their own." }
  - { id: DCK-21, rule: "\"Dışa aktar\" is <a download href=\"/api/decks/<id>/export?format=xlsx\"> (deck-cards-page.tsx:83-90): a refusal (401, 403, 404, 429, 502) is a JSON body the browser is told to download, and the page shows nothing; what the browser does with a non-2xx answer behind a download link was not seen. The route also gives CSV (export/route.ts:12) and only xlsx is offered. Fix: fetch the file, show the generic error toast on a refusal, and offer both formats." }
  - { id: DCK-23, rule: "words that are not in the catalog: the template links \"Excel (.xlsx)\" and \"CSV (.csv)\" (import-cards-dialog.tsx:137,143), the close icon's \"Kapat\" (dialog.tsx:62), the toast's \"Kapat\" (toast.tsx:97) and the busy button's \"Yükleniyor\" (button.tsx:62). Harmless while the app is Turkish only (the en and ar catalogs exist). The two link names also do not say they are the template: the sentence before them does. Fix: pass the words from the catalog; name the links \"Şablonu indir (Excel)\" and \"Şablonu indir (CSV)\"." }
  - { id: DCK-24, rule: "the whole dialog body, the file field, the two links and the alerts included, is the Base UI Dialog.Description (dialog.tsx:103-112), so aria-describedby of the dialog points at all of it (not verified with a screen reader). Fix: describe the dialog with one short sentence." }
  - { id: IMPEXP-1, rule: "new, from the code: a CSV is read as an Excel workbook when the browser reports its type as application/vnd.ms-excel, which a browser on Windows with Excel installed does for a .csv file (browser behaviour from general knowledge; not seen, and the e2e and the replay send text/csv). The route forwards the file with the type the browser gave (import/route.ts:18); tedrisat's type check accepts application/vnd.ms-excel (flashcard.controller.ts:492-496) but detectFormat takes every type but text/csv, text/plain and application/octet-stream for xlsx (excel.service.ts:257-264), so the CSV goes to the xlsx reader (:182-183), which throws, and the answer is a 500 INTERNAL_ERROR that the dialog tells as \"Dosya içe aktarılamadı\" like any other refusal. A legacy .xls file, which that type also names, ends the same way. The picker offers .csv and .xlsx only (accept=...). Fix: choose the format by the file's extension (or its first bytes), not only by the type; map a file that cannot be opened to a 400 that says so. The domain records the same 500 on importCards." }
  - { id: IMPEXP-2, rule: "new, from the code: the dialog never says what the file must hold. The help line gives 5 MB and \"İlk satır başlık olmalı\"; the file needs the three English header names Card Type, Content Front and Content Back (matched without regard to case, any other column is ignored), a Card Type of VOCABULARY or HADEETH (not compared with the deck's own type, the domain's `no-card-type-match`), and at most 1000 data rows. A file with no Card Type column is told row by row as \"Tür geçersiz\". A file with other header names has no data row for the API (headerMap is empty, excel.service.ts:203-215) and is a 400 \"no data rows\" the dialog tells as the generic failure; a file with more than 1000 rows is a 422 BULK_ROW_LIMIT_EXCEEDED with one error on row 1002, field \"cards\" (bulk-row-limit.error.ts), which the dialog's importRowErrors words as \"1 satırda sorun var\" and \"Satır 1002: Bir alan geçersiz\" (deck-model.ts:285-334): a row that does not exist and a problem that is not one. Fix: say the columns, the types and both limits in the help line, and give the row limit its own sentence." }
  - { id: IMPEXP-3, rule: "new, from the code and Excel's documented behaviour; not run: the CSV is written as UTF-8 with no byte-order mark, comma-separated, with the type text/csv and no charset (excel.service.ts:140-166,169-173; fast-csv's defaults), and read as comma-separated (csv.read with no parserOptions, :186). Excel on a Turkish system reads such a file in the local code page, so the template's Arabic example rows and the export's cards show as garbage, and saves a CSV with semicolons (the Turkish list separator): a file saved that way has one column named \"Card Type;Content Front;Content Back\", no header matches, no data row, and the answer is a 400 told as the generic failure (IMPEXP-2). Fix: write a byte-order mark, read the delimiter from the header row, or offer the .xlsx alone." }
  - { id: IMPEXP-4, rule: "new, from the code; not run: a cell that is not text reaches the validator as a number, a date or an object, and importKindOf reads \"must be a string\" as \"required\" (deck-model.ts:298-302), so a front or back that is a number (the CSV reader turns digit-only and ISO-date texts into numbers and dates, exceljs lib/csv/csv.js:55-83), a formula or a rich-text cell (an object, parseSheet keeps `cell.value` as it is) is told as \"Ön yüz boş\" or \"Arka yüz boş\" though the cell is full. Fix: read every cell as its text (`cell.text`), and tell \"not text\" as its own problem." }
  - { id: IMPEXP-5, rule: "new, from the code: Vazgeç, the close icon and Esc stay live while the file is being sent (`onOpenChange` closes whenever it is asked, import-cards-dialog.tsx:104-106, and the Vazgeç and the icon are not disabled while `busy`), and the request is not aborted: the dialog goes, the cards are added all the same, the toast \"Kartlar içe aktarıldı\" and the new rows appear later, and a refusal is lost because the component that would have shown it is gone. The graph draws it as the state `abandoned`. \"İçe aktar\" on the page opens a new dialog meanwhile, and a 201 of the old request then calls the old dialog's onClose, the page's close() (deck-cards-page.tsx:54), which shuts whatever dialog is open by then, the new import dialog included (from the code, not seen; not drawn). The same family as DCK-30 (the deck's delete dialog) and F-W3-open-2 (nizam's köşk form). Fix: ignore a close request while `busy`, or abort the fetch." }
  - { id: IMPEXP-6, rule: "new, from the code: the export's file name is the deck's name with every character outside a-z, 0-9, \"_\" and \"-\" turned into \"_\" (excel.service.ts:106), unquoted in the header (:109): \"Sarf Kavramları\" is saved as Sarf_Kavramlar_.xlsx, and a deck named only in Arabic or with Turkish capitals comes out as underscores. Fix: send filename* (RFC 5987) with the deck's real name beside an ASCII fallback." }
  - { id: focus-not-set, rule: "the card list sets no initial focus (no autoFocus and no focus() in deck-cards-page.tsx), so `cardsMain` has no initialFocus, and nothing is drawn of where the focus is after a download, after a template link or after a clean import (the dialog's own return of the focus to \"İçe aktar\" is the one exception, drawn as returnsFocus). Recorded so the silence is not read as an omission." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): the links and buttons are named by their own words" }
