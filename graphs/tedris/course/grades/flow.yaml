# What a talebe who holds a seat reads of their own grades in a course: the tab "Notlarım" of tedris-web's course page, with the exams
# (a score only once the course team has released the results) and the memorisation marks. Written from the code of the branch (the
# tree of PR #394) on 15 Nov 2026; captured, nothing here is a plan and nothing is approved.
#
# The tab has no call of its own: `GET /courses/:id/my-grades` is read by the page's server side with the course, and the tab is drawn
# from that answer, so the graph draws the read, then the page, then the tab. The other half of the story, the course team entering
# the scores and opening the results, is nazar.evaluation.examScores (which starts this flow with `released: true`) and the marks are
# nazar.evaluation.markRecited's. The exam's own mark and countdown on a row of Müfredat ("Sınav · 3 gün kaldı") is drawn by
# tedris.course.readProgramme, which also carries e2e exam#1.
#
# Findings this flow carries (ui.yaml `rules` has the same ids):
#   PROG-1     the tab is not in the address: a reload after a click on Notlarım lands on Müfredat (readProgramme's finding, seen here too)
#   GRADES-1   (new, provisional id) nothing in the app leads to Notlarım: the release notification says "Notlarım’da görebilirsin" and
#              opens the celse page, whose page has no link to the tab; only a typed `?tab=notlarim` opens it
#   GRADES-2   (new, provisional id) a read that fails or is refused takes the tab out of the list and says nothing: the talebe is told
#              neither that the grades could not be read nor, with `?tab=notlarim`, that the address was not honoured
#   GRADES-3   (new, provisional id) a talebe who completed the course reads the grades but is not told when they are released: the
#              release notifies the ENROLLED seats only
#   GRADES-4   (new, provisional id) "Notlarım" is also the name of the panel of a talebe's private notes on a celse (LessonNotes.title)
# E2E carried: exam#2 (the released score "17/20", the closed exam's "Sonuç henüz açıklanmadı", and that the entered score 64 is not on
# the page, which the binding checks at the API: the page cannot hide what it is never sent). Not carried here: exam#1 (the countdown
# badge on a row of Müfredat), which tedris.course.readProgramme carries.
schema: delurio-graph/0
kind: flow
id: tedris.course.grades
status: captured
domain: medaris.api
ui: tedris.course.grades
title: Read my exam results and memorisation marks
summary: >-
  A talebe who holds a seat (ENROLLED, or COMPLETED) in a course opens the tab "Notlarım" of its page. The tab has two parts, each drawn
  only when it has rows: "Sınavlar", one row per exam of the course with the week and the title ("Telafi" after the title of a retake)
  and, on the right, "Sonuç henüz açıklanmadı" while the course team has not opened the results, then, once they have, the score
  ("17/20"), the badge "Girmedi" when the talebe was marked absent or "Girilmedi" when no result was entered; and "Ezberler", one row
  per memorisation homework with the badge "Tam", "Eksik" or "Vermedi", or "Bekliyor" while the hoca has not marked it. A course with
  neither says "Henüz sınav ya da ezber yok.". The tab is read-only. If the page's read of the grades does not answer, or is refused
  (a passive scope shuts a talebe's content), the tab is not in the list at all and nothing says why.

scope:
  shows: the read of the grades, the tab Notlarım with its two parts and its empty note, and the course page without the tab
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "the rest of the course page (the header, the card, the resources, the other tabs): tedris.course.readProgramme, .recordings, .deckTab and tedris.learn.questions"
    - "the exam's mark and countdown on a row of Müfredat: tedris.course.readProgramme (exam#1)"
    - "the course team entering the results and the marks, and opening the results (\"Sonuçları talebelere aç\"): nazar.evaluation.examScores and nazar.evaluation.markRecited, which start this flow"
    - "what a visitor, a waiting application and a taken-away seat meet: they hold no seat, the grades are not read and the tab is not there (tedris.course.readProgramme)"
    - "the exam's own block on its celse page (\"Sınav\", written or oral, out of how much, where): tedris.celse.attend"
    - "the memorisation mark and the hoca's note on the celse page: tedris.learn.homeworkMemorize"
    - "the phone layout and the loading skeleton while the page reads (CRS-08)"

decisions:
  D1:
    question: >-
      Should the release of the results lead the talebe to Notlarım, and should the tab say when its read failed?
    recommend: >-
      Yes to both: the notification EXAM_RESULTS_RELEASED should open `/courses/<id>?tab=notlarim` (it opens the celse page today), and a
      seat holder whose read failed should find the tab with a line that says the grades could not be read, as Hesap does for the roles.
    affects: [curriculum, noGradesTab]

context:
  read:
    values: [ok, refused]
    initial: any
    say:
      ok: "GET /courses/:id/my-grades answers"
      refused: "the read does not answer: the scope is passive and the content is shut to the talebe (403 GRADES_FORBIDDEN), or any other failure, which the page treats alike"
  tabParam:
    values: [none, grades]
    initial: any
    say:
      none: "the address has no `?tab=`, or one that names no tab the person has; the page opens on Müfredat"
      grades: "the address is `?tab=notlarim`"
  released:
    values: [true, false]
    initial: any
    say:
      "true": "an exam of the course has its results released: the talebe reads the score, or that they were absent, or that none was entered"
      "false": "no exam of the course has its results released"
  closed:
    values: [true, false]
    initial: any
    say:
      "true": "an exam of the course is listed with its results still closed: the page says so and the API sends no score, whatever the course team has entered"
      "false": "no exam is listed with its results closed"
  marks:
    values: [true, false]
    initial: any
    say:
      "true": "the course has memorisation homework: each row says what the hoca marked or that it waits"
      "false": "the course has no memorisation homework"

guards:
  nothingListed: "not released and not closed and not marks"
  hasExams: "released or closed"

failures:
  reading:
    from: getMyGrades
    refused: [GRADES_FORBIDDEN, COURSE_NOT_FOUND]
# `refused` stands for any answer but the grades: the page reads through `orNull` (features/courses/public-reads.ts:49-56), which turns every
# failure into null, a thrown network error too. The two codes are the ones the domain lists for the route.

# The main story: a talebe opens the course page on Müfredat, presses Notlarım, reads the released score, the closed exam and the marks,
# then reloads the page and is back on Müfredat (PROG-1).
main:
  given: { read: ok, tabParam: none, released: true, closed: true, marks: true }
  events: [DONE, OPEN_GRADES, RELOAD, DONE]

initial: reading

states:
  reading:
    title: Read my grades with the course
    description: >-
      The course page's server side reads the course and, for a talebe whose enrolment makes a seat (ENROLLED or COMPLETED), GET
      /courses/:id/my-grades with no cache, and keeps the answer for the tab. Any failure becomes null (`orNull`) and the page draws
      without the tab. The API shows a caller only their own grades, an exam's score and absence only once its results are released, and
      refuses a caller whose scope is passive (403 GRADES_FORBIDDEN). Nothing is on the screen of this step.
    includes: ["each exam of the course with released, score and absent, and each memorisation homework with the talebe's own mark"]
    source: apps/tedris/app/courses/[courseId]/page.tsx:80
    invoke: { action: getMyGrades }
    on:
      DONE: { guard: "read == 'ok'", target: sorting }
      FAIL.refused: { guard: "read == 'refused'", target: noGradesTab, say: "the page has no grades, so the tab is left out of the list" }

  sorting:
    title: Choose the tab the page opens on
    description: >-
      Classification only. The page opens on the tab its address names when the person has that tab (`?tab=notlarim`), else on Müfredat;
      what the tab will hold depends on whether the read listed anything.
    source: apps/tedris/features/courses/components/course-page.tsx:194
    always:
      - { guard: "tabParam == 'grades' and nothingListed", target: gradesEmpty, say: "the address asks for Notlarım and the read listed nothing" }
      - { guard: "tabParam == 'grades'", target: gradesShown, say: "the address asks for Notlarım" }
      - { target: curriculum, say: "the page opens on Müfredat, the tab it opens on without an address that says otherwise" }

  curriculum:
    title: The course page on Müfredat, with Notlarım in the list
    by: human
    description: >-
      The course page as a seat holder meets it, with the tab Notlarım among the tabs. The programme under Müfredat, the header and the
      card are tedris.course.readProgramme's; this step draws only the tab list. No code sets the focus when the page opens.
    source: apps/tedris/features/courses/components/course-page.tsx:190
    on:
      OPEN_GRADES:
        - { guard: nothingListed, target: gradesEmpty, say: "they press Notlarım, and there is nothing to list", source: apps/tedris/features/courses/components/exam-grades.tsx:57 }
        - { target: gradesShown, say: "they press Notlarım: the tab is chosen in place, the address does not change (PROG-1)", source: apps/tedris/features/courses/components/course-page.tsx:469 }
      NAVIGATE: { target: left, say: "they use the bar, the address or the footer" }

  gradesShown:
    title: Read my results and marks
    by: human
    goal: true
    description: >-
      The panel of Notlarım. "Sınavlar" when the course has an exam: a row each with "{n}. hafta", the title (and " · Telafi" for a
      retake) and the value: "Sonuç henüz açıklanmadı" while the results are closed, whatever the course team has entered, and once they are
      released the score "17/20", the badge "Girmedi" (absent) or "Girilmedi" (no result entered). "Ezberler" when the course has
      memorisation homework: a row each with the badge "Tam", "Eksik" or "Vermedi", or "Bekliyor" while it is not marked. Read only: no
      control but the tabs. The focus stays on the tab that was pressed. Findings read here: GRADES-1 (nothing leads here), GRADES-3
      (a completed talebe is not told of the release), GRADES-4 (the name is also a celse panel's).
    source: apps/tedris/features/courses/components/exam-grades.tsx:81
    on:
      OPEN_CURRICULUM: { target: curriculum, say: "the tab Müfredat, in place; the address is not touched", source: libs/ui/src/mds/tabs.tsx:110 }
      RELOAD: { target: reading, say: "the page is read again and chooses its tab from the address once more: Müfredat, unless the address says notlarim (PROG-1)", source: apps/tedris/features/courses/components/course-page.tsx:194 }
      NAVIGATE: { target: left, say: "they use the bar, the address or the footer" }

  gradesEmpty:
    title: Read that there is nothing to grade
    by: human
    description: >-
      The panel of Notlarım for a course with no exam and no memorisation homework: one sentence, "Henüz sınav ya da ezber yok.", and
      no section. The tab is there all the same, because the read answered.
    source: apps/tedris/features/courses/components/exam-grades.tsx:57
    on:
      OPEN_CURRICULUM: { target: curriculum, say: "the tab Müfredat, in place", source: libs/ui/src/mds/tabs.tsx:110 }
      RELOAD: { target: reading, say: "the page is read again", source: apps/tedris/features/courses/components/course-page.tsx:194 }
      NAVIGATE: { target: left, say: "they use the bar, the address or the footer" }

  noGradesTab:
    title: The course page with no Notlarım
    by: human
    description: >-
      The course page when the read of the grades did not answer: the tab list has Müfredat and the others but no Notlarım, and the page
      is on Müfredat even when the address says `?tab=notlarim`. Nothing tells the talebe that grades exist and could not be read, or
      why (GRADES-2). A talebe of a passive scope meets this too, with the rest of what PROG-2 describes.
    source: apps/tedris/features/courses/components/course-page.tsx:190
    on:
      RELOAD: { target: reading, say: "the page is read again", source: apps/tedris/features/courses/components/course-page.tsx:194 }
      NAVIGATE: { target: left, say: "they use the bar, the address or the footer" }

  left: { type: final, title: The person leaves the course page, leavesPage: true }

assertions:
  - id: tab-needs-the-read
    never: "state in ['curriculum', 'gradesShown', 'gradesEmpty'] and read == 'refused'"
    say: "The tab Notlarım is in the list only when the page's read of the grades answered"
    source: apps/tedris/features/courses/components/course-page.tsx:190
  - id: no-tab-after-a-refused-read
    never: "state == 'noGradesTab' and read == 'ok'"
    say: "The course page has no Notlarım only after a read that did not answer"
    source: apps/tedris/features/courses/components/course-page.tsx:190
  - id: empty-only-with-nothing-listed
    never: "state == 'gradesEmpty' and not nothingListed"
    say: "The empty sentence is drawn only when the read lists no exam and no memorisation"
    source: apps/tedris/features/courses/components/exam-grades.tsx:57
  - id: sections-only-with-rows
    never: "state == 'gradesShown' and nothingListed"
    say: "The sections are drawn only when the read lists something"
    source: apps/tedris/features/courses/components/exam-grades.tsx:57
