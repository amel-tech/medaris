# The screens of tedris.course.draftPreview: the course page of a DRAFT course for the people the API lets open it, which is the preview
# (features/courses/components/course-page.tsx), and the not-found page that everyone else gets (app/not-found.tsx, features/errors/system-page.tsx).
# Only what the preview adds to the course page is drawn: the page's own header, its tabs and its programme are the course page's, which the
# neighbouring flows draw (flow.yaml scope.outOfView). The bar and the footer belong to tedris.shell.frame.
#
# Words: every key that does not start with `composed.` is copied by script from libs/i18n/src/locales/tr/tedris.json (the app reads it as
# `tedris.<key>`), the key being the path inside that file. The `composed.*` keys are texts the app builds from data, in no i18n file,
# written with their placeholders so a replay can match them (a placeholder the binding gives no sample for matches any text):
#   composed.CoursePage.courseTitle         the course's title, as the API gives it (course-page.tsx:283)
#   composed.CoursePage.firstSessionTime    the earliest dated celse as "12 Ekim Pazartesi 21:00": the day, the month, the weekday and the
#                                           clock, in the course's zone (formatFirstSession, features/courses/preview.ts:26; course-page.tsx:369)
# CoursePage.apply is the label of the control this page never draws (the node `applyButton`, which is shown in no state).
# Samples are invented and neutral. This flow changes nothing (getCourse only reads), so it has no `changes` note.
schema: delurio-graph/0
kind: ui
id: tedris.course.draftPreview
flow: tedris.course.draftPreview
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples:
  title: Örnek Ders
  when: 12 Ekim Pazartesi 21:00

nodes:
  # ---- the preview: the page, then what it adds to the course page ----
  previewPage: { type: page, component: Page, role: main, in: [previewShown, previewUnscheduled], source: apps/tedris/features/courses/components/course-page.tsx:237 } # the course page owns its <main> (tab-view/index.tsx lists /courses/<id>); no name and no initialFocus: nothing sets focus when the page opens (rule focus-not-set)
  previewBanner: { type: alert, component: Alert, role: status, text: { key: CoursePage.previewBannerText }, in: [previewShown, previewUnscheduled], source: apps/tedris/features/courses/components/course-page.tsx:248 } # a neutral Alert is a status, not an alert (libs/ui/src/mds/alert.tsx:23); it is in the page as it loads (what a screen reader does with it was not tested)
  previewBannerTitle: { type: text, component: Text, text: { key: CoursePage.previewBannerTitle }, in: [previewShown, previewUnscheduled], source: apps/tedris/features/courses/components/course-page.tsx:248 } # the banner's <p class=mds-alert__title>, not a heading; the card's badge says the same word
  draftBadge: { type: text, component: Text, text: { key: CoursePage.draftBadge }, in: [previewShown, previewUnscheduled], source: apps/tedris/features/courses/components/course-page.tsx:275 } # an outline badge before the title; its text carries the meaning
  courseTitle: { type: text, component: Heading, role: heading, text: { key: composed.CoursePage.courseTitle, params: { title: course.title } }, in: [previewShown, previewUnscheduled], source: apps/tedris/features/courses/components/course-page.tsx:282 } # h1

  previewAside: { type: page, component: Page, role: complementary, in: [previewShown, previewUnscheduled], source: apps/tedris/features/courses/components/course-page.tsx:357 } # the <aside> that holds the card; it has no name. In a published course the same place holds the enrolment card (tedris.course.apply)
  previewCardTitle: { type: text, component: Heading, role: heading, text: { key: CoursePage.previewCardTitle }, in: [previewShown, previewUnscheduled], source: apps/tedris/features/courses/components/course-page.tsx:359 } # h2 of the card
  previewCardBadge: { type: text, component: Text, text: { key: CoursePage.previewCardBadge }, in: [previewShown, previewUnscheduled], source: apps/tedris/features/courses/components/course-page.tsx:361 } # an outline badge in the card's header
  previewCardText: { type: text, component: Text, text: { key: CoursePage.previewCardText }, in: [previewShown, previewUnscheduled], source: apps/tedris/features/courses/components/course-page.tsx:363 }
  firstSessionLabel: { type: text, component: Text, text: { key: CoursePage.firstSession }, in: [previewShown], source: apps/tedris/features/courses/components/course-page.tsx:366 } # the eyebrow over the time; drawn only when a celse has a time
  firstSessionTime: { type: text, component: Text, role: time, text: { key: composed.CoursePage.firstSessionTime, params: { when: course.firstSession } }, in: [previewShown], source: apps/tedris/features/courses/components/course-page.tsx:368 } # a <time>; the earliest dated celse of all weeks, not the first one listed
  backToEditing: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: CoursePage.backToEditingLabel, params: { title: course.title } }, text: { key: CoursePage.backToEditing }, in: [previewShown, previewUnscheduled], emits: OPEN_NAZAR, source: apps/tedris/features/courses/components/course-page.tsx:375 } # an <a> to NAZAR_URL in this tab; the accessible name is the longer aria-label, which holds the visible words (CRS-10: it promises the curriculum, the address is the origin)

  # A control the page never draws: any button that applies for the course. It is shown in no state, so a replay with --absent checks
  # that none is there, which is e2e system-pages#5 a5 (no button whose name starts "Kayıt").
  applyButton: { type: action, component: Button, role: button, intent: confirm, text: { key: CoursePage.apply }, unless: [reading, previewShown, previewUnscheduled, notFound, nazar_opened, home_opened, sign_in_asked, left], source: apps/tedris/features/courses/components/course-page.tsx:356 }

  # ---- the not-found page: the system's bar (tedris.shell.frame), then the box ----
  notFoundSection: { type: page, component: Page, role: region, name: { labelledBy: notFoundTitle }, in: [notFound], source: apps/tedris/features/errors/system-page.tsx:49 } # SystemState with `shell` is a <section>; at /courses nothing around it is a <main> (SYS-1)
  notFoundTitle: { type: text, component: Heading, role: heading, text: { key: SystemPages.notFoundTitle }, in: [notFound], source: apps/tedris/features/errors/system-page.tsx:52 } # h1
  notFoundText: { type: text, component: Text, text: { key: SystemPages.notFoundText }, in: [notFound], source: apps/tedris/features/errors/system-page.tsx:59 }
  homeLink: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: SystemPages.notFoundAction }, text: { key: SystemPages.notFoundAction }, in: [notFound], emits: GO_HOME, source: apps/tedris/features/errors/system-page.tsx:54 } # href /home for a member and / for a visitor (system-page.tsx:33); the graph has no key for an address

edges:
  - { labelledBy: [notFoundSection, notFoundTitle] }

rules:
  - { id: CRS-10, rule: "\"Düzenlemeye dön\" is given the bare address of Nazar (page.tsx:99, course-page.tsx:375-383) and its accessible name says \"Düzenlemeye dön: <course>, Nazar’da Müfredat\" (CoursePage.backToEditingLabel), which promises this course's curriculum. Seen in a browser on 15 Nov 2026: the href is exactly NAZAR_URL (e2e system-pages#5 a7 asserts that), and the click lands on Nazar's landing for the hoca, which was a different course (\"Bina ve İzhar Şerhi\", /ders/<its id>), not the draft being previewed. Fix: link to NAZAR_URL + /ders/<id>/mufredat (decision D1)." }
  - { id: CRS-15, rule: "In a preview the programme row of a celse marked as the sample still links to #ornek-celse (course-programme.tsx:148-154, SAMPLE_ANCHOR), but the section \"Örnek celse\" needs !preview (course-page.tsx:153), so the link goes nowhere. Read from the code and not walked: the draft of the walk has no celse marked as the sample. Fix: do not link sample rows in a preview." }
  - { id: DRAFT-1, rule: "Proposed id; not in the inventory. Fixed in the code of this branch by MDRS-248's unlisted course (#401), read from the code and the spec and not walked. It was: a staff member whose only session is Nazar's is a visitor to Tedris, which keeps its own session and does not take Keycloak's by itself, and the API answers a visitor 404 for a draft, so the link to the draft met \"Sayfa bulunamadı\" and nothing said that signing in would show it (seen in a browser on 15 Nov 2026: signed in to Nazar as the hoca only, /courses/<draft> in Tedris answered 404). Nazar links to a course's Tedris page this way (course-settings.ts:164, \"Tanıtım sayfasını gör\" in a new tab; \"Tedris’te aç\" of the course overview). Now the course segment sends every visitor the API gives no course to /auth/signin?callbackUrl=/courses/<id> (load-course.ts:26-34; test/load-course.spec.ts), which Keycloak answers without a form while the Nazar session lasts, and the person comes back signed in to the preview. The API's 404 to a visitor stays, so no draft is announced: a missing course sends a visitor to sign in too." }
  - { id: DRAFT-2, rule: "Proposed id; not in the inventory. The page's metadata is read with no token (public-reads.ts:61-64; generateMetadata, page.tsx:29-45), so for a draft it is the generic title \"Tedris\" (intro-metadata.ts:15-45): the tab of a preview has neither the course's title nor the word \"Önizleme\", and several previews open at once read the same (WCAG 2.4.2). Seen: document.title is \"Tedris\" on the preview. Fix: name the page from the caller's own read of the course, for a preview only, as \"Önizleme: <course> · Tedris\"." }
  - { id: focus-not-set, rule: "Neither face sets focus when it opens: no autoFocus or focus() in course-page.tsx, the layout or features/errors, so a page opened by address leaves it on the body (seen on the preview and on the not-found page). Recorded so the silence is not read as an omission." }
  - { id: SYS-1, rule: "Finding of tedris.shell.systemPages, seen on this address: the not-found page of /courses/<id> has no <main>, only the bar and a region (main count 0). The preview has its own <main>." }
