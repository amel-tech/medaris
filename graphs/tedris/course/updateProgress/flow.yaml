# A talebe who holds a seat in a course writes down how far they are, in the window "İlerlemeni güncelle" of the enrolled card.
# Written from the code of the branch (captured); nothing here is a plan. What it leaves to other flows is in scope.outOfView.
#
# Findings this flow touches (ui.yaml `rules` carries the same ids):
#   CRS-01      an invalid number is said only as a Field error, which is a plain div with no role and no live region; the focus
#               stays on "Kaydet", so a screen reader says nothing (progress-dialog.tsx:37-40, libs/ui/src/mds/field.tsx:50-53)
#   CRS-02      the field relies on React autoFocus and the kit's own initialFocus is not passed (progress-dialog.tsx:92-93,
#               libs/ui/src/mds/dialog.tsx:145); measured by the replay on the dev server: the field has the focus on opening
#   CRS-03      a 409 says "Sayfa yenilendi" and nothing refreshes the page (progress-dialog.tsx:44-48)
#   CRS-04      the action is called with no try/catch (progress-dialog.tsx:42-52)
#   CRS-13      the toast has no role of its own and its region has the library's English name
#   PROGRESS-1  (new, provisional id) a talebe whose seat has ended since the page was drawn is refused at the API's guard with
#               403 and told "İşlem tamamlanamadı. Biraz sonra yeniden dene.": trying again never works, the window stays open over a
#               card that still says "Devam ediyor", and nothing refreshes the page (progress-dialog.tsx:45-48)
#   PROGRESS-3  (new, provisional id, measured by the first replay) after a successful save the focus is on nothing, not on the
#               button the window was opened from
#   PROGRESS-2  (new, provisional id, read from the code, not walked) at 100 the bar and its aria-valuetext read "%100 tamamlandı"
#               (libs/ui/src/mds/progress.tsx:40-41, the kit's default `completeLabel`) while the badge still says "Devam ediyor" and
#               the note says the course team confirms the completion
# E2E carried: course#7 (the refusal of 101, the stored value unchanged, the save of 55, the reload; its stored-value assertions are
# the binding's `effects`). Not carried: nothing of it. The e2e enrols the talebe at 40 and so does the binding.
schema: delurio-graph/0
kind: flow
id: tedris.course.updateProgress
status: captured
domain: medaris.api
ui: tedris.course.updateProgress
title: Update my own progress in a course
summary: >-
  A talebe with an ENROLLED seat opens the course page. The card shows the bar "Ders ilerlemen" with its percent, the note that
  the talebe enters the progress and the course team confirms the completion, and the link-style button "İlerlemeni güncelle". The
  button opens a window with one field, "İlerleme (yüzde)", that holds the current number. A number that is not a whole number
  from 0 to 100 is refused by the page itself, with a line under the field, and nothing is sent. A good number is sent
  (PUT /courses/:id/progress, the number alone): the window closes, a toast says "İlerlemen güncellendi." and the card shows the
  new percent, which is still there after the page is read again. Reaching 100 does not complete the course; that stays with the
  course team. If the API refuses, the window stays open and a toast says why in one of three sentences.

scope:
  shows: the bar, the note and the button of the enrolled card, the window "İlerlemeni güncelle", and the toasts of its save
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "the rest of the enrolled card and of the course page (next celse, calendar menu, programme, tabs): tedris.course.readProgramme"
    - "leaving the seat from the \"...\" menu: tedris.course.leave"
    - "the course team completing the course, or taking the talebe out: nazar.roster.complete, nazar.roster.remove"
    - "the second opening of the window after a save (the field then holds the new number); the window is the same one"
    - "a request that never reaches the server (CRS-04): what the person sees is not verified"
    - "typing again after a refused save by the API: the window is open and the field is editable, which is the window as drawn"
    - "the completed, pending and revoked cards, which have no bar and no button"

context:
  typed:
    values: [current, invalid, valid]
    initial: current
    say:
      current: "the field holds what it was opened with, the seat's current progress"
      invalid: "the field holds something that is not a whole number from 0 to 100 (\"101\", \"abc\", nothing at all)"
      valid: "the field holds a whole number from 0 to 100"
  standing:
    values: [seated, ended]
    initial: seated
    say:
      seated: "the seat is ENROLLED, as the page was drawn"
      ended: "the seat has ended since the page was drawn (the talebe left from another tab, or the course team took them out); this page does not know"
  notice:
    values: [none, saved, gone, conflict, failed]
    initial: none
    say:
      none: "no toast"
      saved: "a toast says \"İlerlemen güncellendi.\""
      gone: "a toast says the course is no longer found"
      conflict: "a toast says the enrolment changed"
      failed: "a toast says the action could not be completed"

guards:
  typedInvalid: "typed == 'invalid'"
  holdsSeat: "standing == 'seated'"
  lostSeat: "standing == 'ended'"

effects:
  resetField: { set: { typed: current } } # the opener puts the current number in the field and clears the error; a toast stays
  typeInvalid: { set: { typed: invalid } }
  typeValid: { set: { typed: valid } }
  refuseNumber: { set: { typed: invalid } } # the page's own refusal: nothing was sent, which the binding's `effects` check reads from the database
  seatEnds: { set: { standing: ended } }
  clearNotice: { set: { notice: none } }
  toastSaved: { set: { notice: saved } }
  toastGone: { set: { notice: gone } }
  toastConflict: { set: { notice: conflict } }
  toastFailed: { set: { notice: failed } }

failures:
  saving:
    from: updateCourseProgress
    signedOut: [HTTP_401]
    gone: [ENROLLMENT_NOT_FOUND]
    conflict: [ENROLLMENT_STATE_CONFLICT]
    other: [AUTHZ_FORBIDDEN]

# The main story is the e2e's: refuse 101, save 55, read the page again.
main:
  events: [OPEN, TYPE_INVALID, SAVE, TYPE_VALID, SAVE, DONE, RELOAD]

initial: card
states:
  card:
    title: The enrolled card, with the progress bar
    by: human
    goal: true
    source: apps/tedris/features/courses/components/course-aside.tsx:271
    description: >-
      The card of a talebe whose enrolment is ENROLLED (the page's state `enrolled`, features/courses/course-view.ts:21-38): the
      badge "Devam ediyor", the bar "Ders ilerlemen" with its percent beside it, the note "İlerlemeni sen girersin; dersi
      tamamladığını ders kadrosu onaylar." and the button "İlerlemeni güncelle", a link-style button that opens the window. The
      next celse, the "..." menu and the calendar menu above them are the course page's (readProgramme, leave). The percent is
      drawn by the kit's Progress from the stored number, in the page's language ("%40"). A toast of an earlier failed save may
      still be on the page: an error toast never closes on its own. No code sets the focus when the page opens (not verified in a
      browser).
    on:
      OPEN: { target: dialog, effect: [resetField], source: "apps/tedris/features/courses/components/progress-dialog.tsx:59" }
      NAVIGATE: left

  dialog:
    title: The window "İlerlemeni güncelle"
    by: human
    source: apps/tedris/features/courses/components/progress-dialog.tsx:67
    description: >-
      A form dialog of the kit (Base UI): modal, the page behind it inert, the header's "Kapat", the field "İlerleme (yüzde)" with
      the help line "0 ile 100 arasında bir tam sayı." and the footer "Vazgeç" and "Kaydet". The opener has just put the current
      number in the field and cleared any error, so every opening starts the same way. A form dialog ignores the scrim, so only
      "Vazgeç", "Kapat" and Esc close it. Which element has the focus when it opens is measured by the replay: the field has React's
      `autoFocus` and the kit's `initialFocus` is not passed; the replay measured that the field has the focus (CRS-02: it works
      by React's autoFocus alone, not by the kit's own mechanism). Typing changes the field and clears an error on the next keystroke; pressing "Kaydet" with Enter in
      the field does the same as the button.
    on:
      TYPE_INVALID: { target: dialog, effect: [typeInvalid], say: "something that is not a whole number from 0 to 100 is typed" }
      TYPE_VALID: { target: dialog, effect: [typeValid], say: "a whole number from 0 to 100 is typed" }
      SEAT_ENDS: { target: dialog, effect: [seatEnds], say: "the seat ends in another place; this page does not know" }
      SAVE:
        - { guard: typedInvalid, target: refused, effect: [refuseNumber], say: "the page refuses the number itself", source: "apps/tedris/features/courses/components/progress-dialog.tsx:37" }
        - { guard: "not typedInvalid", target: saving, source: "apps/tedris/features/courses/components/progress-dialog.tsx:42" }
      CANCEL: card
      DISMISS: card
      NAVIGATE: left

  refused:
    title: The field says the number is not allowed
    by: human
    source: apps/tedris/features/courses/components/progress-dialog.tsx:37
    description: >-
      The page's own refusal (`parseProgress`, features/courses/course-view.ts:324-329, accepts only one to three ASCII digits worth
      0 to 100): the line "0 ile 100 arasında bir tam sayı yaz." takes the place of the help line under the field, and no request
      is sent (the stored number is unchanged). The line is a plain div with no role and no live region, and the focus stays on
      "Kaydet", so a screen reader user hears nothing (CRS-01). The error clears on the next keystroke, which moves the window back
      to its first look.
    on:
      TYPE_INVALID: { target: dialog, effect: [typeInvalid], say: "the next keystroke clears the line" }
      TYPE_VALID: { target: dialog, effect: [typeValid], say: "the next keystroke clears the line" }
      SAVE: { target: refused, effect: [refuseNumber], say: "the same number is refused again" }
      CANCEL: card
      DISMISS: card
      NAVIGATE: left

  saving:
    title: Send the progress
    source: apps/tedris/features/courses/components/progress-dialog.tsx:42
    description: >-
      The server action updateCourseProgress, PUT /courses/:id/progress with the number alone (the page never sends a status, so
      the API's refusal of a status change cannot happen here). "Kaydet" is busy: aria-disabled and aria-busy, never disabled, and
      a hidden status beside it says "Yükleniyor" (the kit's default word, not the page's). The window stays open while it runs, unless the talebe
      closes it: "Vazgeç", "Kapat" and Esc stay live (only `pending` on "Kaydet" changes), and the call goes on, so its toast and its refresh
      land on the card. The graph marks the two buttons `duringStep`: their press is drawn where the call's outcome leads (after a refusal,
      the window then closes on the card with the toast); the moment between, the window closed while the call runs, is not drawn.
      On success: a toast "İlerlemen güncellendi.", the window closes and the page is read again. On a refusal the window stays
      open and a toast says it in the page's words by the status alone: 404 "Bu ders artık bulunamıyor.", 409 "Kaydının durumu
      değişmiş. Sayfa yenilendi, güncel hâline bak." (nothing refreshes: CRS-03), anything else "İşlem tamamlanamadı. Biraz sonra
      yeniden dene.". A talebe whose seat has ended is stopped at the API's guard (course.view_details) with 403, which is the
      "anything else" (measured on the stack: a direct call as a talebe with no row answers 403 AUTHZ_FORBIDDEN, and the replay
      of the ended seat saw "İşlem tamamlanamadı." come up over the open window: PROGRESS-1). The 404 of the domain (ENROLLMENT_NOT_FOUND) is
      only a race inside the service. A session that is over sends the person to sign in and back to this course. A request that
      never reaches the server is not caught (CRS-04).
    invoke: { action: updateCourseProgress }
    on:
      DONE: { guard: holdsSeat, target: updated, effect: [toastSaved], say: "the API answers 200 with the enrolment; the window closes and the page is read again", source: "apps/tedris/features/courses/components/progress-dialog.tsx:49" }
      FAIL.signedOut: sent_to_sign_in
      FAIL.gone: { target: failed, effect: [toastGone], source: "apps/tedris/features/courses/components/progress-dialog.tsx:46" }
      FAIL.conflict: { target: failed, effect: [toastConflict], say: "the toast promises a refresh that does not happen (CRS-03)", source: "apps/tedris/features/courses/components/progress-dialog.tsx:46" }
      FAIL.other: { guard: lostSeat, target: failed, effect: [toastFailed], say: "the seat ended: the API's guard answers 403 (PROGRESS-1)", source: "apps/tedris/features/courses/components/progress-dialog.tsx:46" }

  updated:
    title: The card shows the new progress
    by: human
    source: apps/tedris/features/courses/components/progress-dialog.tsx:49
    description: >-
      The window has closed, the toast "İlerlemen güncellendi." is up (Sonner, closes by itself after 6 s) and the page has been
      read again, so the bar and the percent beside it show the new number. The button "İlerlemeni güncelle" is the one the
      window was opened from; the focus is not on it: the first replay found it on nothing, the page itself (PROGRESS-3), so
      the graph says nothing of the focus here. A toast of an earlier failed save stays beside this one and is
      not drawn (the context keeps one notice). At 100 the percent reads "%100 tamamlandı" while the badge
      still says "Devam ediyor" (PROGRESS-2, read from the code, not walked). Pressing the button again opens the same window, with
      the new number in the field (not drawn).
    on:
      RELOAD: { target: reloaded, effect: [clearNotice], say: "the page is loaded again; the number is the one stored" }
      NAVIGATE: left

  reloaded:
    title: The page, loaded again, still shows the new progress
    type: final
    source: apps/tedris/features/courses/components/course-aside.tsx:312
    description: >-
      The page read from the server: the bar and the percent are the stored number, and no toast is left. This is the e2e's last
      assertion (course#7 a4 and a5: "%55" after a reload, and the same number in the database).

  failed:
    title: The API refused; the window stays open
    by: human
    source: apps/tedris/features/courses/components/progress-dialog.tsx:45
    description: >-
      The window is still open with the number the talebe typed, "Kaydet" is ready again, and an error toast says in one of three
      sentences that it did not work. An error toast stays until it is closed (`TOAST_DURATION` is infinite for errors,
      libs/ui/src/components/sonner.tsx). Nothing refreshes the page, so after a 409 the toast's "Sayfa yenilendi" is not true
      (CRS-03), and after the seat ended the card behind the window still says "Devam ediyor" and offers the same button, with the
      same refusal waiting (PROGRESS-1). Typing in the field is the window as drawn in `dialog` and is not repeated here.
    on:
      SAVE: { target: saving, say: "the same number is sent again", source: "apps/tedris/features/courses/components/progress-dialog.tsx:42" }
      CANCEL: card
      DISMISS: card
      NAVIGATE: left

  left:
    title: The person goes to another page
    type: final
    leavesPage: true

  sent_to_sign_in:
    title: The session is over
    type: final
    leavesPage: true
    description: >-
      The action answered "unauthenticated": sendToSignIn (lib/send-to-sign-in.ts) sends the person to sign in and back to
      exactly this address, and draws no toast. realm.auth.signIn takes over.

assertions:
  - id: nothing-is-sent-for-a-refused-number
    never: "state == 'saving' and typed == 'invalid'"
    say: "a number the page refuses is never sent to the API"
    source: apps/tedris/features/courses/components/progress-dialog.tsx:37
  - id: a-seat-that-ended-is-never-saved
    never: "state == 'updated' and standing == 'ended'"
    say: "a save is never told as done for a seat that has ended: the API's guard stops it"
    source: apps/tedris/features/courses/components/progress-dialog.tsx:49
