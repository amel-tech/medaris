# The way into tedris.course.updateProgress: the köşk's page, then the course card of the köşk's own course. tedris.nav's own binding
# gives no locator for an entry that needs an item (`data: true`), because the item is the walk's to choose, so this file extends
# it and names the course the walk is seated in (the scenario's `course` variable), found by its address. 
schema: delurio-graph/0
kind: binding
nav: tedris.nav
extends: ../../nav/binding.yaml

entries:
  kosk->course: { css: 'a[href="/courses/{course}"]' }
