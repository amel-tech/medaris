# tedris.course.updateProgress on the local stack (graphs/README.md, "The stack and the bindings"), as the spare talebe `applicantA`
# (a woman, every profile attribute set, no enrolment anywhere) whom `setup` seats at 40 in "Nahiv Metinleri", the köşk's own course
# that takes anyone (seed.courses.standalone):
#   node apps/engine/src/cli.ts replay graphs/tedris/course/updateProgress --bind graphs/tedris/course/updateProgress/binding.yaml --out <dir>
#
# Replay data. Nothing of the seed is touched: `applicantA` holds no row before and after. The course is the köşk's own one, not the
# two that tedris.course.leave and tedris.course.apply walk with (open and approval): the first replay of this flow ran on the open
# course and another flow's setup took the seat away mid-walk (the effect read an empty row, the reload drew the apply card), so
# the data is kept apart. `setup` first leaves the course (a row of an earlier walk that died goes), then applies (the course takes
# anyone, so the seat is ENROLLED at once) and writes 40 through the
# API as the talebe, the number the e2e (course#7) seats its talebe at. `teardown` leaves again and empties the account's mailbox,
# because seating and leaving a course makes tedrisat's invitation sweep mail the session invitations and cancellations
# (graphs/bindings/helpers/README.md). No SQL writes: the helpers use the HTTP API. Two `effects` READ the stored number with SQL
# (sql.mjs, the stack's own Postgres container), as the e2e's fixture does, because no route gives it back alone.
#
# The second person's step: SEAT_ENDS is the talebe leaving from another tab (leave.mjs as `applicantA`, the person's own call), which
# is what a course team's removal would do to this page too: it does not know. The next save is then stopped at the API's guard.
# Not bound, so the replay cannot reach them (reported): FAIL.gone and FAIL.conflict (races inside the service, nothing makes them),
# the session that is over (sent_to_sign_in), and the numbers that end on 100.
schema: delurio-graph/0
kind: binding
extends: ../../../bindings/local.tedris.binding.yaml
flow: tedris.course.updateProgress

scenarios:
  # The main story (e2e course#7): refuse 101, save 55, read the page again. Comes in through the köşk's page, the way a person
  # reaches a course the köşk gives itself (a course card of the köşk page).
  seatedAtForty:
    as: applicantA
    open: '{tedris}/kosks/{seed.kosk}'
    enter: { nav: ../../nav, bind: enter.nav.binding.yaml, entry: kosk->course }
    vars: { course: '{seed.courses.standalone}' }
    setup:
      - run: [node, helpers/leave.mjs, applicantA, '{course}']
      - run: [node, helpers/apply.mjs, applicantA, '{course}']
        expect: ENROLLED
      - run: [node, helpers/api.mjs, applicantA, PUT, '/courses/{course}/progress', '{"progress":40}']
        expect: '"progress":40'
    teardown:
      - run: [node, helpers/leave.mjs, applicantA, '{course}']
      - run: [node, helpers/mail.mjs, clear, 'to:{address}']

events:
  # the number is typed with `fill`, which replaces what the field holds; 101 is the e2e's refused number, 55 its saved one
  TYPE_INVALID: [{ fill: { role: textbox, name: 'İlerleme (yüzde)', value: '101' } }]
  TYPE_VALID: [{ fill: { role: textbox, name: 'İlerleme (yüzde)', value: '55' } }]
  RELOAD: [{ reload: true }]
  DISMISS: [{ key: Escape }]
  NAVIGATE: [{ goto: '{tedris}/discover' }]
  # the talebe leaves from another tab; this page is not told
  SEAT_ENDS:
    - run: [node, helpers/leave.mjs, applicantA, '{course}']
      expect: done

states:
  # the server action is a POST to the page's own address; the page's reads are GETs with a query, so this matches only the POST.
  # It holds the call to see the busy button. (A Next server action answers 200 on the page's own URL, so a FAIL walk's status
  # cannot be compared here: the engine limit tedris.course.apply names.)
  saving: { call: '{tedris}/courses/{course}' }
  left: { url: '{tedris}/discover' }

effects:
  # e2e course#7 a2: after the refused 101 the stored number is still 40
  refuseNumber:
    - run: [node, helpers/sql.mjs, "select progress from enrollments where user_id = '{secret.E2E_APPLICANT_A_SUB}' and course_id = '{course}'"]
      expect: '"progress":40'
  # e2e course#7 a5: after the save the stored number is 55
  updateCourseProgress:
    - run: [node, helpers/sql.mjs, "select progress from enrollments where user_id = '{secret.E2E_APPLICANT_A_SUB}' and course_id = '{course}'"]
      expect: '"progress":55'

nodes:
  # the card's badge; the week in progress carries "Devam ediyor" too, lower on the page
  enrolledBadge: { text: Devam ediyor, within: { role: complementary } }
  # the percent beside the bar's label: an aria-hidden span of the kit's Progress, found by its class and its text
  percentBefore: { css: 'aside .mds-progress__value', hasText: '%40' }
  percentAfter: { css: 'aside .mds-progress__value', hasText: '%55' }
  # Sonner's toast has no role: found by its own attribute and its words
  savedToast: { css: '[data-sonner-toast]', hasText: 'İlerlemen güncellendi.' }
  goneToast: { css: '[data-sonner-toast]', hasText: 'Bu ders artık bulunamıyor.' }
  conflictToast: { css: '[data-sonner-toast]', hasText: 'Kaydının durumu değişmiş.' }
  failedToast: { css: '[data-sonner-toast]', hasText: 'İşlem tamamlanamadı.' }
  toastClose: { css: '[data-sonner-toast] [data-close-button]' }
  # the title of the window is the dialog's heading; the card behind it is inert
  dialogTitle: { role: heading, name: İlerlemeni güncelle }
  # an error toast stays and has its own "Kapat": the window's header button is found inside the dialog (the `to-failed` replay met
  # two buttons named "Kapat" and stopped there)
  closeX: { role: button, name: Kapat, within: { role: dialog } }
