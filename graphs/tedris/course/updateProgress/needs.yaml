schema: delurio-graph/0
kind: needs
id: tedris.course.updateProgress
status: proposed
summary: >-
  What must exist for a talebe who records their own progress in a course: the flow's product list, from its story and from the 1
  October decision (MDRS-105: only the course team completes a course; the talebe writes the number), never from what the page
  does today. Missing (code is half built, a defect, `missing: none`): completion-is-the-teams, a-refused-number-is-announced.
  Unwalked: a-failed-save-says-what-happened (the ended seat was walked as far as the toast, but the walk did not pass: the call's
  status cannot be compared on a Next server action, and one binding locator was fixed and not run again; the 404, 409 and
  session-over answers cannot be made on the stack). planned.md carries no item for this flow, so nothing here is a Linear key;
  the defects are findings, not features.

needs:
  - id: record-own-progress
    need: >-
      A talebe with a seat tells the platform how far they are, as a whole number from 0 to 100. A number outside that is refused
      where they typed it and nothing is stored; a good number is stored, the talebe is told it was, and the course page shows it
      the next time it is read.
    evidence:
      - state: card
      - state: dialog
      - state: refused
      - state: saving
      - state: updated
      - state: reloaded
      - source: apps/tedrisat/src/course/course.controller.ts:821
      - source: apps/tedris/features/courses/components/progress-dialog.tsx:35
      - source: apps/tedris/features/courses/course-view.ts:324
      - test: apps/tedris/e2e/course.e2e.ts
        name: "updates the progress, refuses a number over 100"
      - scenario: seatedAtForty

  - id: completion-is-the-teams
    need: >-
      Only the course team completes a course for a talebe. A number the talebe writes, 100 included, never completes it, and the
      card never says it has: it says what the talebe entered and that the team confirms.
    evidence:
      - source: apps/tedrisat/src/course/course.controller.ts:821
      - source: apps/tedris/features/courses/components/course-aside.tsx:313
    missing: no Linear issue; findings PROGRESS-2; code exists in part
    note: |-
      Drawn on the states card and updated, which the code has: they are not evidence, so that a replay still walks them (SPEC.md
      §13 leaves out what only missing needs name).
      Half built. The API keeps the status (invariant "progress never completes", MDRS-105) and the note says the team confirms,
      but at 100 the bar reads "%100 tamamlandı" (PROGRESS-2). A defect, not a planned feature, so no Linear key. Read from the
      code, not walked.

  - id: a-refused-number-is-announced
    need: >-
      A talebe who types a number that is not allowed is told so in a way every person perceives, including by a screen reader,
      and is taken to the field that needs the change.
    evidence:
      - source: apps/tedris/features/courses/components/progress-dialog.tsx:87
    missing: no Linear issue; findings CRS-01, CRS-02; code exists in part
    note: |-
      Drawn on the state refused, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves
      out what only missing needs name).
      Half built: the sentence under the field is drawn, but it is a plain div with no live region and the focus stays on the
      button (CRS-01). Also CRS-02: which element has the focus when the window opens is a kit default. A defect (accessibility),
      so no Linear key; I did not search Linear.

  - id: a-failed-save-says-what-happened
    need: >-
      When the platform refuses a save, the talebe is told the truth and the page shows what their seat now is. A seat that ended
      since the page was drawn is not met with "try again soon"; the page is read again, so the card says the seat is gone and
      offers the way back to the course.
    evidence:
      - source: apps/tedrisat/src/course/course.controller.ts:821
      - source: apps/tedris/features/courses/components/progress-dialog.tsx:45
    missing: >-
      no Linear issue; the ended seat was walked as far as the toast, but the walk did not pass: the call's status cannot be
      compared on a Next server action, and one binding locator was fixed and not run again; the 404, 409 and session-over answers
      cannot be made on the stack; code exists in part
    note: |-
      Drawn on the states saving and failed, which the code has: they are not evidence, so that a replay still walks them (SPEC.md
      §13 leaves out what only missing needs name).
      Half built: three sentences by status alone, and no refresh on any of them (CRS-03, PROGRESS-1). Unwalked: the replay of the
      ended seat (`--to failed`) reached the toast "İşlem tamamlanamadı." over the open window but did not pass (the HTTP status
      of a Next server action cannot be compared, and one locator was fixed afterwards and not run again). The 404 and 409
      sentences and the session that ends are races or states nothing in the stack makes. A request that never reaches the server
      is not caught (CRS-04).
