# A talebe leaves a course they hold a seat in, or takes back an application that still waits, from the course page
# (/courses/<id>) or from Derslerim (/my-courses). Written from the code of the branch (captured); nothing here is a plan.
# What it leaves to other flows is in scope.outOfView.
#
# Findings this flow touches (ui.yaml `rules` carries the same ids):
#   DSC-03   Derslerim's "Başvuruyu geri çek" calls leaveCourse, not withdrawEnrollment: it deletes an approved seat too,
#            with no confirmation, when the team approved the application while the page was open (application-row.tsx:42)
#   DSC-04   no focus is placed and no word says it worked after a withdrawn row, and the focus falls to body after a left card
#   CRS-04   no try/catch around the calls: a request that never reaches the server is not drawn
#   CRS-05   the focus is lost when the card the leave button lived in is replaced
#   LEAVE-1  (new, provisional id) the row does not leave "at once": setGone(true) is inside a transition, so the row stays,
#            busy, until the answer (measured)
#   LEAVE-2  (new, provisional id) the window's "Kapat" and the busy "Yükleniyor" are the kit's Turkish defaults, not catalog messages
#   LEAVE-3  (new, provisional id) the window does not say that leaving deletes the progress, the reason the code gives for asking
#   LEAVE-4  (new, provisional id) the row reads a 404 or a 409 like any failure: "try again", the row stays, the page is not read again
# E2E carried: discover#26 in part (a pending row taken back from Derslerim: the row is off the list; the e2e's reload and its title,
# "at once", are not carried: LEAVE-1). The e2e cannot tell the two API calls apart, so the graph's `invoke` says which one runs.
# Not carried: nothing in any e2e or unit spec touches "Dersten ayrıl" (apps/tedris/test/my-courses.spec.ts checks only the sections
# and the dates of Derslerim), so the menu, the window and the toasts have no check of their own except this graph's replay.
schema: delurio-graph/0
kind: flow
id: tedris.course.leave
status: captured
domain: medaris.api
ui: tedris.course.leave
title: Leave a course, or take back an application, and see what is left
summary: >-
  A talebe who holds a seat opens the "···" menu on the course page (the enrolled card) or on the card in Derslerim,
  chooses "Dersten ayrıl" and meets a confirmation window that names the access that ends and the cards that stay. The
  focus starts on "Vazgeç"; Vazgeç, the close button and Esc all hand the focus back to the "···" button, and the scrim
  does nothing. "Dersten ayrıl" deletes the seat and its progress: a toast says "Dersten ayrıldınız.", the window closes and
  the page is read again. On the course page the card becomes the apply card (tedris.course.apply takes over); on Derslerim
  the card is gone. A request that is still waiting is taken back from Derslerim with "Başvuruyu geri çek: <course>", which
  asks nothing and says nothing when it works, and calls the same leave endpoint (DSC-03). Where the row or seat changed
  while the page was open, the toast says the enrolment changed and the page is read again.

scope:
  shows: the "···" menu in its two places, the confirmation window, the application row of Derslerim, and the toasts and pages that follow
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "the rest of the course page (header, programme, tabs, the next celse and the progress bar of the enrolled card) and the rest of Derslerim (the other cards, the completed section, the calendar link): tedris.course.readProgramme and tedris.learning.myCourses"
    - "the application card, its window and its own withdraw button on the course page (leave-course.tsx, DELETE /courses/:id/enroll): tedris.course.apply; this flow starts that one when the course page becomes the apply card"
    - "the completed and the revoked cards a stale page ends on after a 409: tedris.course.readProgramme"
    - "a course that no longer exists: the page read again answers its not-found page (a 404 COURSE_NOT_FOUND ends where a 404 ENROLLMENT_NOT_FOUND does here, with the same toast), tedris.shell.systemPages"
    - "a talebe who is barred from the course: the seat stays while the ban does and the leave answers BAN_ACTIVE (403); the toast says the action could not be completed (the `other` class)"
    - "a request that never reaches the server (CRS-04): what the person sees is not verified"
    - "the data on the card (title, medrese, köşk, hocalar, next celse, progress value) and the second ongoing course or application a talebe may hold: the graph draws the card and the row the flow acts on"
    - "kontenjan: leaving a seat frees no count today, because enrolment keeps none (invariants seat-quota-per-gender and gender-always-known); needs.yaml carries it as missing (MDRS-284)"

context:
  place:
    values: [course, ongoing, application]
    initial: any
    say:
      course: "the talebe is on the course page of a course they hold a seat in, and uses the \"···\" button of the enrolled card"
      ongoing: "the talebe is on Derslerim and uses the \"···\" button of the card of a seat"
      application: "the talebe is on Derslerim and uses \"Başvuruyu geri çek\" on the row of an application that waits"
  others:
    values: [kept, none]
    initial: any
    say:
      kept: "Derslerim lists both a seat and an application, so what the step does not take stays on the page"
      none: "Derslerim lists only the one the talebe acts on, so the step takes the only course the page has and the page shows its empty state"
  settled:
    values: [waiting, approved]
    initial: waiting
    say:
      waiting: "the application on the row still waits"
      approved: "the course team approved the application after Derslerim was drawn; the row is still on the page"
  notice:
    values: [none, left, conflict, failed, withdrawFailed]
    initial: none
    say:
      none: "no toast"
      left: "a toast says \"Dersten ayrıldınız.\""
      conflict: "a toast says the enrolment changed and the page was read again"
      failed: "a toast says the action could not be completed"
      withdrawFailed: "a toast says the application could not be taken back"

guards:
  onCourse: "place == 'course'"
  viaCard: "place == 'ongoing'"
  viaRow: "place == 'application'"
  keeps: "others == 'kept'"
  hasCard: "viaCard or keeps"
  hasRow: "viaRow or keeps"
  stillWaiting: "settled == 'waiting'"
  staleApproved: "settled == 'approved'"

effects:
  clearNotice: { set: { notice: none } }
  toastLeft: { set: { notice: left } }
  toastConflict: { set: { notice: conflict } }
  toastFailed: { set: { notice: failed } }
  toastWithdrawFailed: { set: { notice: withdrawFailed } }
  teamApproves: { set: { settled: approved } }

failures:
  leaving:
    from: leaveCourse
    signedOut: [HTTP_401]
    gone: [ENROLLMENT_NOT_FOUND, COURSE_NOT_FOUND]
    settled: [ENROLLMENT_STATE_CONFLICT]
    other: [BAN_ACTIVE, HTTP_400]
  withdrawing:
    from: leaveCourse
    signedOut: [HTTP_401]
    refused: [ENROLLMENT_NOT_FOUND, COURSE_NOT_FOUND, ENROLLMENT_STATE_CONFLICT, BAN_ACTIVE, HTTP_400]

# The main story: from Derslerim, open the menu of a card, ask to leave, change your mind once, ask again and confirm.
main:
  given: { place: ongoing, others: kept }
  events: [OPEN_MENU, CHOOSE_LEAVE, CANCEL, OPEN_MENU, CHOOSE_LEAVE, CONFIRM, DONE]

initial: arriving
states:
  arriving:
    title: The page opens
    source: apps/tedris/app/my-courses/page.tsx:13
    description: >-
      A step with no screen: the talebe is on the course page of a course they hold a seat in (place course), or on Derslerim
      (place ongoing or application). Nothing here is drawn; the two pages are.
    always:
      - { guard: onCourse, target: courseCard }
      - { target: listed }

  courseCard:
    title: The enrolled card on the course page
    by: human
    goal: true
    source: apps/tedris/features/courses/components/course-aside.tsx:271
    description: >-
      The card of a talebe whose enrolment is ENROLLED: the badge "Devam ediyor" and, beside it, the "···" button named
      "Diğer işlemler" (it carries no course title, where Derslerim's does). Under it the next celse, "Derse devam et", "Takvime
      ekle" and the progress, which tedris.course.readProgramme draws. A failed leave ends here with the error toast (the
      page is the one the person left).
    on:
      OPEN_MENU: courseMenu
      NAVIGATE: left

  courseMenu:
    title: The menu on the course page
    by: human
    source: apps/tedris/features/courses/components/course-actions-menu.tsx:67
    description: >-
      Base UI's menu: a popup named by its trigger with one item, "Dersten ayrıl". The page behind is not inert and the focus
      is on the popup, not on the item (menu-focus-on-popup). Esc, pressing the button again or choosing the item closes it.
    on:
      CHOOSE_LEAVE: confirm
      OPEN_MENU: { target: courseCard, say: "the button toggles: pressing it again closes the menu" }
      CLOSE_MENU: courseCard

  listed:
    title: Derslerim, with the card or the row the talebe acts on
    by: human
    goal: true
    source: apps/tedris/features/courses/components/my-courses-page.tsx:179
    description: >-
      Derslerim: "Devam eden dersler" with the card of the seat (its badge "Devam ediyor" and its "···" button, named
      "Diğer işlemler: <course>"), "Başvurularım" with the row of the application ("Onay bekliyor", the date, and the button
      "Başvuruyu geri çek: <course>"), and "Tamamladığın dersler". The page is not live: when the course team approves the
      application while it is open, the row stays as it is, and its button then deletes the seat (DSC-03). A failed step ends
      here with its toast: the error toast of the window (failed), or the row's own (withdrawFailed). The page sets no focus
      of its own on load (focus-not-set).
    on:
      OPEN_MENU: { guard: viaCard, target: cardMenu, source: apps/tedris/features/courses/components/course-actions-menu.tsx:67 }
      WITHDRAW: { guard: viaRow, target: withdrawing, effect: [clearNotice], source: apps/tedris/features/courses/components/application-row.tsx:39 }
      TEAM_APPROVES: { guard: "viaRow and stillWaiting", target: listed, effect: [teamApproves], say: "the course team approves the application, in nazar or in nizam (nazar.roster.decide); this page does not know", source: apps/tedrisat/src/course/course.service.ts:1642 }
      NAVIGATE: left

  cardMenu:
    title: The menu on a card of Derslerim
    by: human
    source: apps/tedris/features/courses/components/course-actions-menu.tsx:67
    description: >-
      The same menu, named "Diğer işlemler: <course>". The page behind is not inert; the focus is on the popup.
    on:
      CHOOSE_LEAVE: confirm
      OPEN_MENU: { target: listed, say: "the button toggles: pressing it again closes the menu" }
      CLOSE_MENU: listed

  confirm:
    title: The window "Dersten ayrıl"
    by: human
    source: apps/tedris/features/courses/components/course-actions-menu.tsx:79
    description: >-
      A modal alertdialog named by its title, with the course's title above it. It says which access ends (celses, meeting
      links, recordings and the course deck, and the celses leave the calendar) and that the cards copied into the talebe's own
      deck stay and that they may apply again; it does not say that the progress is deleted (LEAVE-3). The focus starts on
      "Vazgeç", is trapped, and returns to the "···" button when the window closes without a leave (measured for Vazgeç and Esc;
      Kapat is the same Base UI close). The scrim does not close it. The menu item that opened it is not a trigger of the
      dialog, which is controlled by the page's own state.
    on:
      CONFIRM: { target: leaving, effect: [clearNotice] }
      CANCEL:
        - { guard: onCourse, target: courseCard }
        - { target: listed }
      CLOSE:
        - { guard: onCourse, target: courseCard }
        - { target: listed }
      DISMISS:
        - { guard: onCourse, target: courseCard }
        - { target: listed }

  leaving:
    title: Delete the seat
    source: apps/tedris/features/courses/components/course-actions-menu.tsx:51
    description: >-
      The server action leaveCourse, DELETE /courses/:id/enrollment, which deletes the caller's own ENROLLED or PENDING row, and
      with it the progress (LEAVE-3). "Dersten ayrıl" is busy and disabled with a hidden status "Yükleniyor"; "Vazgeç" and
      the close button stay live and closing the window does not stop the call. A session that is over sends the person to
      sign in and back, and draws no toast. Otherwise the window closes first and the toast follows. Success: "Dersten
      ayrıldınız." and the page is read again. A 404 or a 409 (the row went, or is COMPLETED or REVOKED now): "Kaydının durumu
      değişmiş. Sayfa yenilendi, güncel hâline bak." and the page is read again, which draws what the enrolment is now. Any
      other refusal (a ban) says "İşlem tamamlanamadı. Biraz sonra yeniden dene." and the page stays as it was.
    invoke: { action: leaveCourse }
    on:
      DONE:
        - { guard: onCourse, target: apply_card, effect: [toastLeft], starts: { flow: tedris.course.apply }, say: "the card is replaced by the apply card, which tedris.course.apply draws", source: apps/tedris/features/courses/components/course-actions-menu.tsx:61 }
        - { guard: keeps, target: seat_left, effect: [toastLeft], source: apps/tedris/features/courses/components/course-actions-menu.tsx:61 }
        - { target: nothing_left, effect: [toastLeft], source: apps/tedris/features/courses/components/course-actions-menu.tsx:61 }
      FAIL.signedOut: sent_to_sign_in
      FAIL.gone:
        - { guard: onCourse, target: apply_card, effect: [toastConflict], starts: { flow: tedris.course.apply }, say: "no row is left, so the page read again is the apply card", source: apps/tedris/features/courses/components/course-actions-menu.tsx:55 }
        - { guard: keeps, target: seat_left, effect: [toastConflict], source: apps/tedris/features/courses/components/course-actions-menu.tsx:55 }
        - { target: nothing_left, effect: [toastConflict], source: apps/tedris/features/courses/components/course-actions-menu.tsx:55 }
      FAIL.settled:
        - { guard: onCourse, target: course_read_again, effect: [toastConflict], starts: { flow: tedris.course.readProgramme }, say: "the row is COMPLETED or REVOKED, which the page read again draws as its own card", source: apps/tedris/features/courses/components/course-actions-menu.tsx:55 }
        - { target: seat_left, effect: [toastConflict], say: "the course is still on the page, in another section", source: apps/tedris/features/courses/components/course-actions-menu.tsx:55 }
      FAIL.other:
        - { guard: onCourse, target: courseCard, effect: [toastFailed], source: apps/tedris/features/courses/components/course-actions-menu.tsx:56 }
        - { target: listed, effect: [toastFailed], source: apps/tedris/features/courses/components/course-actions-menu.tsx:56 }

  withdrawing:
    title: Take the application back, with the leave call
    source: apps/tedris/features/courses/components/application-row.tsx:40
    description: >-
      The row's button calls the server action leaveCourse, DELETE /courses/:id/enrollment (DSC-03), not withdrawEnrollment.
      The code sets the row gone at once and restores it if the call fails, but that update is inside a transition, so the
      row stays, its button disabled and a hidden status "Yükleniyor" beside it, until the answer arrives (LEAVE-1). Success:
      the page is read again and the row is gone, with no toast (DSC-04). Because the call is the leave call, it also deletes
      an application the team approved meanwhile: the seat and its progress go, with no window and no word, and the card of
      that seat never appeared on this page. Any refusal (404, 409, a ban) draws "Başvuru geri çekilemedi. Biraz sonra
      yeniden dene." and the row stays; a 404 is not read as "settled elsewhere" and nothing refreshes the page, where the
      window above and the course page's withdraw do both (LEAVE-4).
    invoke: { action: leaveCourse }
    on:
      DONE:
        - { guard: "keeps and stillWaiting", target: application_withdrawn, source: apps/tedris/features/courses/components/application-row.tsx:49 }
        - { guard: "keeps and staleApproved", target: application_withdrawn, say: "DSC-03: the row's call deleted a seat the team had approved; the page cannot tell it from a withdrawn application", source: apps/tedris/features/courses/components/application-row.tsx:42 }
        - { guard: "not keeps and stillWaiting", target: nothing_left, source: apps/tedris/features/courses/components/application-row.tsx:49 }
        - { guard: "not keeps and staleApproved", target: nothing_left, say: "DSC-03: the same, and the page is now empty", source: apps/tedris/features/courses/components/application-row.tsx:42 }
      FAIL.signedOut: sent_to_sign_in
      FAIL.refused: { target: listed, effect: [toastWithdrawFailed], source: apps/tedris/features/courses/components/application-row.tsx:44 }

  apply_card:
    title: The course page is the apply card
    type: final
    source: apps/tedris/features/courses/components/course-aside.tsx:324
    description: >-
      The page is read again and the aside is the card "Derse kayıt" with the button that applies (its words depend on whether
      the course asks for approval, which tedris.course.apply draws). The button that had the focus is gone and nothing moves
      the focus (CRS-05). After a leave a toast says "Dersten ayrıldınız."; after a stale 404 it says the enrolment changed.
      A step of tedris.course.apply starts here.

  course_read_again:
    title: The course page is read again and shows what the enrolment is now
    type: final
    source: apps/tedris/features/courses/components/course-aside.tsx:236
    description: >-
      After a 409 (the row is COMPLETED or REVOKED) the page is read again and the aside is the completed or the revoked card,
      which tedris.course.readProgramme draws, with the error toast "Kaydının durumu değişmiş. Sayfa yenilendi, güncel hâline bak.".

  seat_left:
    title: Derslerim without the card
    type: final
    source: apps/tedris/features/courses/components/my-courses-page.tsx:235
    description: >-
      Derslerim read again: the card is gone from "Devam eden dersler" (which says "Devam eden dersin yok." when it was the
      last, and counts "0 ders"); the toast says "Dersten ayrıldınız." or that the enrolment changed (after a 404 or a 409;
      after a 409 the course is in the completed or revoked section). The focus is on body (DSC-04); no code moves it.

  application_withdrawn:
    title: Derslerim without the row
    type: final
    source: apps/tedris/features/courses/components/my-courses-page.tsx:264
    description: >-
      Derslerim read again: the row is gone from "Başvurularım" (which says "Onay bekleyen başvurun yok." when it was the last,
      and counts "0 başvuru onay bekliyor"). No toast, and the focus is on body (DSC-04).

  nothing_left:
    title: Derslerim is empty
    type: final
    source: apps/tedris/features/courses/components/my-courses-page.tsx:223
    description: >-
      The step took the only course the talebe had on Derslerim, so the page is read again and shows its empty state,
      "Henüz bir derse kayıtlı ya da başvurulu değilsin.", with "Keşfet'e git". The sections are gone with it. After a leave
      the toast says "Dersten ayrıldınız."; after a withdrawn row nothing says anything.

  sent_to_sign_in:
    title: The session is over
    type: final
    leavesPage: true
    description: >-
      The action answered "unauthenticated": sendToSignIn (lib/send-to-sign-in.ts) sends the person to sign in and back to
      exactly this address, and draws no toast; the window stays as it was until the page goes. realm.auth.signIn takes over.

  left:
    title: The person goes to another page
    type: final
    leavesPage: true

assertions:
  - id: asks-only-for-a-seat
    never: "state == 'confirm' and place == 'application'"
    say: "the confirmation window belongs to the card's menu; the application row never opens it"
    source: apps/tedris/features/courses/components/course-actions-menu.tsx:79
  - id: a-stale-answer-leaves-the-page-read-again
    never: "state == 'listed' and notice == 'conflict'"
    say: "a stale answer (404 or 409) reads the page again and never leaves the person on the page they left with the enrolment toast"
    source: apps/tedris/features/courses/components/course-actions-menu.tsx:58
