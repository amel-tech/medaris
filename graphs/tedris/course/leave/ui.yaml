# The screens of tedris.course.leave: the "···" menu of the enrolled card on the course page, the same menu on a card of
# Derslerim, the confirmation window "Dersten ayrıl", the application row of Derslerim with "Başvuruyu geri çek", and the
# toasts that follow. What the course page draws around its card is tedris.course.readProgramme's; the apply card the page
# shows afterwards is tedris.course.apply's (flow.yaml scope.outOfView).
# The words are copied from libs/i18n/src/locales/tr/tedris.json (keys kept, root removed) and common.json (common.*) by
# <scratchpad>/leave-probe/catalog.mjs. Four texts are built in code and are in no i18n file, so they are `composed.*`:
#   composed.Button.loading            "Yükleniyor"        the busy button's hidden status, a default of the kit (libs/ui/src/mds/button.tsx:62)
#   composed.AlertDialog.close         "Kapat"             the window's close button, a default of the kit (libs/ui/src/mds/alert-dialog.tsx:36)
#   composed.AlertDialog.eyebrow       "{title}"           the line above the window's title, the course's title (course-actions-menu.tsx:82)
#   composed.MyCoursesPage.withdrawNamed  "Başvuruyu geri çek: {title}"  the row button's aria-label (application-row.tsx:65)
# `changes` borrows the app's own words for what leaving does: the window says what access ends and what stays. It says
# nothing of the progress, which the call deletes (LEAVE-3).
schema: delurio-graph/0
kind: ui
id: tedris.course.leave
flow: tedris.course.leave
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples:
  title: Örnek Ders
  date: 15 Kasım 2026
changes: { key: CoursePage.leaveBodyCards }

nodes:
  # ---- the course page of a talebe with a seat: only the card's top row and the page around the apply card it becomes ----
  courseMain: { type: page, component: Page, role: main, in: [courseCard, courseMenu, apply_card, course_read_again], source: apps/tedris/features/courses/components/course-page.tsx:229, script: actions } # no name, no initial focus: the page sets none (focus-not-set)
  seatBadge: { type: text, component: Text, text: { key: CoursePage.statusInProgress }, in: [courseCard, courseMenu], source: apps/tedris/features/courses/components/course-aside.tsx:277 } # "Devam ediyor", beside the trigger
  courseTrigger: { type: action, component: Button, role: button, intent: secondary, name: { key: CoursePage.moreActions }, in: [courseCard, courseMenu], emits: OPEN_MENU, source: apps/tedris/features/courses/components/course-actions-menu.tsx:67 } # an icon only; the name has no course in it where Derslerim's has (the card's own page says which course). aria-haspopup=menu
  courseMenuList: { type: list, component: List, role: menu, name: { key: CoursePage.moreActions }, in: [courseMenu], source: libs/ui/src/mds/menu.tsx:64 } # Base UI popup named by its trigger; it takes the focus itself, not its first item (menu-focus-on-popup)
  cardLeaveItem: { type: action, component: Button, role: menuitem, intent: secondary, text: { key: CoursePage.leaveCourse }, in: [courseMenu, cardMenu], emits: CHOOSE_LEAVE, source: apps/tedris/features/courses/components/course-actions-menu.tsx:72 } # the menu's one item

  # ---- Derslerim (my-courses-page.tsx): the page, its two sections, the seat's card and the application's row ----
  listMain: { type: page, component: Page, role: main, in: [listed, cardMenu, withdrawing, seat_left, application_withdrawn, nothing_left], source: apps/tedris/features/courses/components/my-courses-page.tsx:199, script: actions } # no name, no initial focus: the page sets none (focus-not-set)
  listTitle: { type: text, component: Heading, role: heading, text: { key: MyCoursesPage.title }, in: [listed, cardMenu, withdrawing, seat_left, application_withdrawn, nothing_left], source: apps/tedris/features/courses/components/my-courses-page.tsx:202 } # h1
  ongoingRegion: { type: page, component: Page, role: region, name: { labelledBy: ongoingHeading }, in: [listed, cardMenu, withdrawing, seat_left, application_withdrawn], source: apps/tedris/features/courses/components/my-courses-page.tsx:235 }
  ongoingHeading: { type: text, component: Heading, role: heading, text: { key: MyCoursesPage.ongoingTitle }, in: [listed, cardMenu, withdrawing, seat_left, application_withdrawn], source: apps/tedris/features/courses/components/my-courses-page.tsx:241 } # h2
  applicationsRegion: { type: page, component: Page, role: region, name: { labelledBy: applicationsHeading }, in: [listed, cardMenu, withdrawing, seat_left, application_withdrawn], source: apps/tedris/features/courses/components/my-courses-page.tsx:264 }
  applicationsHeading: { type: text, component: Heading, role: heading, text: { key: MyCoursesPage.applicationsTitle }, in: [listed, cardMenu, withdrawing, seat_left, application_withdrawn], source: apps/tedris/features/courses/components/my-courses-page.tsx:270 } # h2

  # the seat's card (OngoingCard): the badge and the menu trigger, which carries the course's title in its name. The card is on the
  # page when the talebe acts on it, and when the talebe acts on the application and holds a seat too (`hasCard`); a final state
  # that follows a step of the row keeps it, one that follows a step of the card has lost it
  ongoingBadge: { type: text, component: Text, text: { key: MyCoursesPage.statusEnrolled }, in: [listed, cardMenu, withdrawing, application_withdrawn], when: hasCard, source: apps/tedris/features/courses/components/my-courses-page.tsx:107 }
  cardTrigger: { type: action, component: Button, role: button, intent: secondary, name: { key: CoursePage.moreActionsFor, params: { title: title } }, in: [listed, cardMenu, withdrawing, application_withdrawn], when: hasCard, emits: OPEN_MENU, source: apps/tedris/features/courses/components/course-actions-menu.tsx:67 } # the same menu as the course page's, named for the course
  cardMenuList: { type: list, component: List, role: menu, name: { key: CoursePage.moreActionsFor, params: { title: title } }, in: [cardMenu], source: libs/ui/src/mds/menu.tsx:64 }
  ongoingEmpty: { type: text, component: Text, text: { key: MyCoursesPage.ongoingEmpty }, in: [listed, cardMenu, withdrawing, application_withdrawn, seat_left], when: "not hasCard or state == 'seat_left'", source: apps/tedris/features/courses/components/my-courses-page.tsx:247 } # the section's line when it holds nothing (this flow's world holds at most one card)

  # the application's row (ApplicationRow): its badge, the date and the button; the button's name carries the title. The row is on the
  # page when the talebe acts on it and when the talebe acts on the seat and holds an application too (`hasRow`)
  applicationBadge: { type: text, component: Text, text: { key: MyCoursesPage.statusPending }, in: [listed, cardMenu, withdrawing, seat_left], when: hasRow, source: apps/tedris/features/courses/components/my-courses-page.tsx:296 }
  appliedOn: { type: text, component: Text, text: { key: MyCoursesPage.appliedOn, params: { date: date } }, in: [listed, cardMenu, withdrawing, seat_left], when: hasRow, source: apps/tedris/features/courses/components/my-courses-page.tsx:307 } # the date is the application's own, so a replay matches it by pattern (binding)
  rowWithdraw: { type: action, component: Button, role: button, intent: secondary, name: { key: composed.MyCoursesPage.withdrawNamed, params: { title: title } }, text: { key: MyCoursesPage.withdraw }, in: [listed, cardMenu, withdrawing, seat_left], when: hasRow, disabledIn: [withdrawing], emits: WITHDRAW, source: apps/tedris/features/courses/components/application-row.tsx:61 } # no confirmation. Busy: disabled, the row stays on the page until the answer (LEAVE-1)
  rowBusy: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [withdrawing], source: libs/ui/src/mds/button.tsx:113 } # the visually hidden <output> of the busy button, "Yükleniyor" from the kit's default
  applicationsEmpty: { type: text, component: Text, text: { key: MyCoursesPage.applicationsEmpty }, in: [listed, cardMenu, withdrawing, seat_left, application_withdrawn], when: "not hasRow or state == 'application_withdrawn'", source: apps/tedris/features/courses/components/my-courses-page.tsx:276 }

  # ---- the confirmation window "Dersten ayrıl" (AlertDialog, libs/ui/src/mds/alert-dialog.tsx) ----
  leaveDialog: { type: page, component: Page, role: alertdialog, name: { labelledBy: leaveTitle }, in: [confirm, leaving], initialFocus: leaveCancel, source: apps/tedris/features/courses/components/course-actions-menu.tsx:79 } # Base UI AlertDialog: never closed by the scrim; the focus starts on Vazgeç
  leaveEyebrow: { type: text, component: Text, text: { key: composed.AlertDialog.eyebrow, params: { title: title } }, in: [confirm, leaving], source: libs/ui/src/mds/alert-dialog.tsx:69 } # the course's title above the window's title
  leaveTitle: { type: text, component: Heading, role: heading, text: { key: CoursePage.leaveTitle }, in: [confirm, leaving], source: libs/ui/src/mds/alert-dialog.tsx:74 } # h2
  leaveBody: { type: text, component: Text, text: { key: CoursePage.leaveBody, params: { title: title } }, in: [confirm, leaving], source: apps/tedris/features/courses/components/course-actions-menu.tsx:89 } # the title is in <strong><bdi>
  leaveBodyCards: { type: text, component: Text, text: { key: CoursePage.leaveBodyCards }, in: [confirm, leaving], source: apps/tedris/features/courses/components/course-actions-menu.tsx:90 } # nothing here about the progress (LEAVE-3)
  leaveClose: { type: action, component: Button, role: button, intent: dismiss, name: { key: composed.AlertDialog.close }, in: [confirm, leaving], emits: CLOSE, source: libs/ui/src/mds/alert-dialog.tsx:82 } # an icon only; Esc does the same, the scrim does not
  leaveCancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: CoursePage.leaveCancel }, in: [confirm, leaving], emits: CANCEL, source: libs/ui/src/mds/alert-dialog.tsx:95 } # the focus starts here; it stays live while the call runs
  leaveConfirm: { type: action, component: Button, role: button, intent: confirm, text: { key: CoursePage.leaveConfirm }, in: [confirm, leaving], disabledIn: [leaving], emits: CONFIRM, source: libs/ui/src/mds/alert-dialog.tsx:101 } # primary, not destructive-styled; busy while the call runs
  leaveBusy: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [leaving], source: libs/ui/src/mds/button.tsx:113 }

  # ---- what the page says after a step: Sonner toasts (libs/ui/src/components/sonner.tsx). None says anything after a withdrawn row (DSC-04) ----
  leftToast: { type: status, component: Status, text: { key: CoursePage.left }, in: [apply_card, seat_left, nothing_left], when: "notice == 'left'", source: apps/tedris/features/courses/components/course-actions-menu.tsx:61 } # success, 6 seconds
  conflictToast: { type: status, component: Status, text: { key: CoursePage.actionConflict }, in: [apply_card, course_read_again, seat_left, nothing_left], when: "notice == 'conflict'", source: apps/tedris/features/courses/components/course-actions-menu.tsx:56 } # an error toast: it stays until closed. The page is read again after it
  failedToast: { type: status, component: Status, text: { key: CoursePage.actionFailed }, in: [courseCard, listed], when: "notice == 'failed'", source: apps/tedris/features/courses/components/course-actions-menu.tsx:56 }
  withdrawFailedToast: { type: status, component: Status, text: { key: MyCoursesPage.withdrawFailed }, in: [listed], when: "notice == 'withdrawFailed'", source: apps/tedris/features/courses/components/application-row.tsx:46 }
  toastClose: { type: action, component: Button, role: button, name: { key: common.toast.close }, in: [courseCard, listed, apply_card, course_read_again, seat_left, nothing_left], when: "notice != 'none'", source: libs/ui/src/components/sonner.tsx:55 } # a close button on each toast, "Kapat" in every language

  # ---- the pages the person lands on after a step ----
  applyCardTitle: { type: text, component: Heading, role: heading, text: { key: CoursePage.registerCard }, in: [apply_card], source: apps/tedris/features/courses/components/course-aside.tsx:326 } # h2 of the card tedris.course.apply draws; the course page is read again and is the apply card now
  emptyAll: { type: text, component: Text, text: { key: MyCoursesPage.noCourses }, in: [nothing_left], source: apps/tedris/features/courses/components/my-courses-page.tsx:231 } # the page's empty state: nothing at all is left on it
  discoverLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: MyCoursesPage.goDiscover }, in: [nothing_left], source: apps/tedris/features/courses/components/my-courses-page.tsx:226 } # to /discover

edges:
  - { labelledBy: [leaveDialog, leaveTitle] }
  - { labelledBy: [ongoingRegion, ongoingHeading] }
  - { labelledBy: [applicationsRegion, applicationsHeading] }
  - { triggers: [courseTrigger, courseMenu] }
  - { triggers: [cardTrigger, cardMenu] }
  - { triggers: [cardLeaveItem, confirm] }
  - { triggers: [leaveConfirm, leaving] }
  - { triggers: [rowWithdraw, withdrawing] }
  - { returnsFocus: [leaveDialog, courseTrigger] } # Vazgeç, Kapat and Esc all hand the focus back to the "···" button (measured on the stack for Vazgeç and Esc); the menu item that opened the window has already gone
  - { returnsFocus: [leaveDialog, cardTrigger] } # the same on Derslerim

rules:
  - { id: DSC-03, rule: "'Başvuruyu geri çek' on Derslerim calls the server action leaveCourse (application-row.tsx:42), DELETE /courses/:id/enrollment, not withdrawEnrollment (DELETE /courses/:id/enroll). The leave route deletes an ENROLLED row too: Derslerim is not live, so when the course team approves an application while the page is open, the button deletes the new seat and its progress with no confirmation and no toast. Measured on the API: after an approval DELETE /enroll answers 404 ENROLLMENT_NOT_FOUND and DELETE /enrollment answers 200 and the seat is gone. Fix: call withdrawEnrollment and treat 404 as 'changed meanwhile, read the page again', as the course page does (leave-course.tsx:34-41)." }
  - { id: DSC-04, rule: "After 'Başvuruyu geri çek' succeeds the row is gone from the page and no code moves the focus: it falls to the document (document.activeElement is body, measured); and nothing says that it worked (no toast; the count and the empty line change on the page). After a successful 'Dersten ayrıldınız.' the card is also gone and the focus is also on body. Fix: focus the section's heading (tabIndex -1) or the next row, and say it with a status." }
  - { id: CRS-04, rule: "The window's call and the row's call are made with no try/catch (course-actions-menu.tsx:49-63, application-row.tsx:39-50): a request that never reaches the server rejects instead of answering the toast 'İşlem tamamlanamadı'; what the person sees is not verified and the graph draws none of it." }
  - { id: CRS-05, rule: "After a successful leave the course page's card is replaced by the apply card and nothing moves the focus (document.activeElement is body, measured on the course page); the toast is the only word." }
  - { id: LEAVE-1, rule: "new, provisional id. The code says the row 'leaves the list at once and comes back if the API refuses' (application-row.tsx:41, the inventory, and the e2e title of discover#26), but setGone(true) runs inside startTransition, so React holds it with the rest of the transition: measured with the call held for two seconds, the row stays with its button disabled and a hidden status 'Yükleniyor' until the answer, and goes only when the page has been read again. The graph draws what is measured (withdrawing shows the row). The e2e keeps passing because it waits." }
  - { id: LEAVE-2, rule: "new, provisional id. The window's close button 'Kapat' and the busy status 'Yükleniyor' are Turkish defaults of the kit (alert-dialog.tsx:36, button.tsx:62), not messages of the catalog; the page passes neither a closeLabel nor a loadingLabel, so they would stay Turkish in en and ar (MDRS-233 is the same default on the toast). Latent while tr is the only locale a screen can show." }
  - { id: LEAVE-3, rule: "new, provisional id. The component's comment says the window asks first 'because leaving also deletes the talebe's progress (MDRS-105)' (course-actions-menu.tsx:21-26), and DELETE /enrollment does delete the row that holds the progress (measured: progress 40 before leaving, 0 after applying again). The window's two paragraphs name the access that ends and the cards that stay and say nothing of the progress. Fix: add a sentence to leaveBody or leaveBodyCards." }
  - { id: LEAVE-4, rule: "new, provisional id. The row treats every refusal alike (application-row.tsx:44-47): a 404 (the team rejected the application, so the row is gone) or a 409 draws 'Başvuru geri çekilemedi. Biraz sonra yeniden dene.', keeps the row and reads nothing again, so the button can only fail again until the person reloads; the window (course-actions-menu.tsx:55-58) and the course page's withdraw (leave-course.tsx:34-41) answer a 404 with 'Kaydının durumu değişmiş' and read the page again. Read from the code; not walked (the stack cannot make the row's call answer 404)." }
  - { id: withdraw-asks-nothing, rule: "taking an application back asks nothing first, as on the course page (leave-course.tsx), while leaving a seat asks in an alertdialog. The two are separate controls with separate calls except that the row reuses the leave call (DSC-03)." }
  - { id: menu-focus-on-popup, rule: "Opened with the pointer, the menu puts the focus on its popup, not on the item (measured: document.activeElement is the popup's div with the item as its text). Base UI's behaviour for a pointer open; opened with the keyboard it is not verified. Not drawn." }
  - { id: focus-not-set, rule: "Neither page sets a focus on load (document.activeElement is body, measured), so the pages carry no initialFocus; only the window's initialFocus, on Vazgeç, is drawn." }
  - { id: label-in-name, rule: "The row button's visible text 'Başvuruyu geri çek' is contained in its name 'Başvuruyu geri çek: {title}' (WCAG 2.5.3). Holds. The card's trigger is an icon: its name is 'Diğer işlemler: {title}' on Derslerim and only 'Diğer işlemler' on the course page, which the page's heading names but a list of such buttons would not." }
