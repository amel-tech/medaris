# The screens of tedris.course.readProgramme: tedris-web's course page (/courses/<id>, app/courses/[courseId]/page.tsx, body
# features/courses/components/course-page.tsx) with the tab Müfredat selected (state `curriculum`) and with Hocalar selected
# (state `teachers`). The header, the card, the resources and the tab list are the page's and belong to both states; the card
# is one of five, chosen by `who`.
# Not drawn here (flow.yaml scope.outOfView): the panels of Ders kayıtları, Ders destesi, Sorularım and Notlarım, the menus the
# card opens, the visitor's card, the apply card and its window. The card's progress and the rows' watch marks (MDRS-248) are drawn
# here since tedris.course.updateProgress was retired on 23 Nov 2026 with its window.
#
# The words are copied from libs/i18n/src/locales/tr/tedris.json (the app reads it as `tedris.CoursePage`; keys kept, root removed)
# and common.json (`common.*`). The `composed.Programme.*` keys are NOT in any i18n file: they are what the app draws from a value
# the API gives, or from a word of the kit that is in no catalog (CRS-12), written here with placeholders so that a replay matches
# them. A placeholder with no sample matches any text. The code line that builds each:
#   composed.Programme.breadcrumb   the nav's name, the kit's own default "Sayfa yolu" (libs/ui/src/mds/breadcrumb.tsx:18, CRS-12)
#   composed.Programme.course       the course's title, the page's h1                                (course-page.tsx:282)
#   composed.Programme.kosk         the köşk's name, in the breadcrumb and in the line under the title (course-page.tsx:223, :256)
#   composed.Programme.hoca         a müderris's name with the unvan of this course                   (course-page.tsx:493)
#   composed.Programme.celse        a celse's title, in the card, in a row, in the sample             (course-programme.tsx:133, course-page.tsx:521)
#   composed.Programme.nextWhen     the card's "17 Kasım Salı 21:00 · 60 dk": the day and clock, a separator, the length (course-aside.tsx:160)
#   composed.Programme.nextDay      the card's badge: "Öbür gün", "Yarın", "3 gün sonra"           (course-aside.tsx:138)
#   composed.Programme.weekName     a week button's name: "Hafta 2 Devam ediyor Okuma 3 celse · 180 dk" (week-accordion.tsx:115-146)
#   composed.Programme.sampleRow    the sample row's link: the title and the kit's ", tamamlandı" once it is over (lesson-row.tsx:189, CRS-12)
#   composed.Programme.sampleMark   "Örnek celse · Canlı ders": CoursePage.sampleMark, " · " and CoursePage.typeLive (course-programme.tsx:137)
#   composed.Programme.exam         "Sınav · 3 gün kaldı": CoursePage.examBadge, " · " and the countdown  (exam-grades.tsx:37-38)
#   composed.Programme.cancelNote   the hoca's reason for a cancelled celse, one line                       (lesson-row.tsx:113)
#   composed.Programme.resource     a resource's name; a link also holds the hidden " (yeni sekmede açılır)" and its meta (course-resources.tsx:158-166)
#   composed.Programme.agendaStep   a step of the sample celse's flow, a time and its title             (course-page.tsx:556)
#   composed.Programme.sampleSource a celse's `kaynak`, a value the API gives                           (course-page.tsx:571)
# Samples are invented: the course, the köşk and the celse names are those of the course the binding makes for its walk.
schema: delurio-graph/0
kind: ui
id: tedris.course.readProgramme
flow: tedris.course.readProgramme
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples:
  course: Okuma düzeni denemesi
  kosk: Kubbealtı Köşkü
  hoca: Hamdi Müderris Hoca
  celse: İkinci okuma
  when: 17 Kasım Salı 21:00
  minutes: "60"
  day: Öbür gün
  weekLabel: Hafta 2
  weekState: Devam ediyor
  weekTitle: Okuma
  weekMeta: 3 celse · 180 dk
  sampleTitle: Tanışma
  countdown: 3 gün kaldı
  note: Hoca yolda.
  resource: Okuma listesi
  agendaTime: "21:30"
  agendaTitle: Birinci fasıl
  sampleSourceText: Birinci fasıl
  count: "3"
  weeks: "4"
  sessions: "7"
  city: İstanbul
  number: "1"
  week: "2"
  date: 24 Kasım
  percent: "63"
  time: "0:12"

