  courseTitle: { type: text, component: Heading, role: heading, text: { key: composed.Programme.course, params: { course: course } }, in: [curriculum, teachers], source: apps/tedris/features/courses/components/course-page.tsx:282 } # h1, dir=auto
  koskLink: { type: action, component: LinkButton, role: link, text: { key: composed.Programme.kosk, params: { kosk: kosk } }, in: [curriculum, teachers], emits: OPEN_KOSK, source: apps/tedris/features/courses/components/course-page.tsx:223 } # in the line under the title, beside the same name in the breadcrumb
