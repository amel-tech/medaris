rules:
  - { id: PROG-1, rule: "The tab is not in the address. `?tab=` is read once, when the page is drawn (course-page.tsx:202-206, page.tsx:105), and a click on a tab only sets component state (course-page.tsx:402-405), so the address never changes. After a click on Hocalar a reload, or a shared link, lands on Müfredat, and the way back does not undo the tab (a click pushes no history entry: read from the code, not walked); after `?tab=muderrisler` and a click on Müfredat the address still says muderrisler, so a reload lands on Hocalar. Walked on the stack: the main story reloads on Hocalar and meets Müfredat, and a browser probe saw `?tab=muderrisler` then a click on Müfredat leave the address as it was. Proposed id; not in the inventory. Fix: replaceState the `?tab=` when a tab is chosen (decision D1)." }
  - { id: PROG-2, rule: "A talebe whose scope is passive holds an ENROLLED row, and the API answers them `contentLocked` as it does a stranger (course.service.ts:406-412, the engine's view_details is withheld by a passive scope). The page reads the seat from the enrolment and the content from the API, so it says \"Devam ediyor\", links every week that has begun and offers \"Derse devam et\", while no exam, homework, source or cancel note is drawn, the resources lose their addresses under \"Kaynakları derse kayıtlı talebeler açar.\" (said to an enrolled talebe), and Sorularım and Notlarım are gone. Nothing on the page says why. The card also says \"Toplantı bağlantısı henüz eklenmedi.\" under the next celse whatever the hoca added, because it tests `!next.lesson.meetingUrl` and the API removed that key (course-aside.tsx:167; read from the code, not walked with a link). The links lead to the locked celse page, which offers an application that changes nothing (MDRS-265, tedris.celse.locked). Walked on the stack by revoking the course's only müderris role (a passive scope): the card, the tabs and the missing marks were read, and the walk's last step followed \"Derse devam et\" to the celse page, which says \"Ders içerikleri, toplantı bağlantıları ve ders kayıtları kayıtlı talebelere açıktır. Derse kaydolduğunda görebilirsin.\" over the button \"Kayıt başvurusu yap\" to this enrolled talebe. Proposed id; not in the inventory. Fix: decision D2." }
  - { id: PROG-3, rule: "A week whose title is the default \"Hafta N\" (what the batch route and the seed give) is drawn as the eyebrow \"Hafta N\" and the title \"Hafta N\", and the button's name says it twice (\"Hafta 4 Hafta 4 24 Kasım tarihinde açılır …\"). The recordings tab drops a title that only repeats the number (`isPlainWeekTitle`, recordings-model.ts:289, MDRS-280); the programme does not call it (course-programme.tsx:243-249, week-accordion.tsx:119-135). Seen on the seeded course in a browser on 15 Nov 2026. Proposed id; not in the inventory. Fix: pass the title only when it is not plain." }
  - { id: MDRS-265, rule: "An enrolled talebe of a passive course is told to apply on the celse page, with an application that changes nothing (lesson-lock.ts:17-28, expected failure of lesson-notes#15). This flow's half is PROG-2: the page leads them there with \"Derse devam et\" and the linked rows. The celse page is tedris.celse.locked's." }
  - { id: CRS-08, rule: "loading.tsx draws a div aria-busy=\"true\" of aria-hidden skeletons: no landmark, no name, no live text, so nothing is announced while the page's reads run (app/courses/[courseId]/loading.tsx:10-12). It has no screen in this graph: the state `reading` is a step with none." }
  - { id: CRS-12, rule: "Words of the kit that are in no catalog: the breadcrumb's name \"Sayfa yolu\" (breadcrumb.tsx:18) and the hidden \", tamamlandı\" and \"senin saatinle\" of a row (lesson-row.tsx:189, :191) and \"Bu hafta için henüz celse eklenmedi.\" of an empty week (week-accordion.tsx:71), none passed from the catalog (course-programme.tsx:131-169, :243-258). The week's own words are passed. Correct Turkish today; they would stay Turkish if English or Arabic came back." }
  - { id: CRS-14, rule: "An enrolled card with no next celse, on a course with no resources, has no h2: the enrolled card has no title of its own, and only its next-celse block, the resources card and some tab panels have one, so the weeks' h3 follow the h1 (course-aside.tsx:270-317, week-accordion.tsx:64). With a celse ahead the next celse's title is the h2 (seatNextTitle). Read from the code; the walk's course always has a celse ahead." }
  - { id: CRS-15, rule: "In a draft's preview the sample row still links to #ornek-celse, which the preview does not draw (course-programme.tsx:151-153, course-page.tsx:153). This flow draws no preview (tedris.course.draftPreview); the row is drawn here only for a person with no seat on a published course, where the section exists." }
  - { id: CRS-17, rule: "The cover is a div whose Arabic label (a `<p lang=ar>`) is exposed to assistive technology: a course with a `coverLabel` has it read before the h1 (course-page.tsx:267, libs/ui/src/mds/cover-pattern.tsx:60-84). The walk's course has no coverLabel, so it is read from the code and not drawn." }
  - { id: focus-not-set, rule: "The page sets no initial focus: no autoFocus and no focus() in the course page's components outside the dialogs the card opens, so the page node has no `initialFocus`. The browser's focus stays on the document body after the page loads (seen on the stack: document.activeElement is the BODY), and a click on a tab or a week keeps the focus on that button." }
  - { id: label-in-name, rule: "A card button's visible text is in its accessible name: \"Derse devam et\", \"Takvime ekle\" and \"Derslerime dön\" are named by their words. \"Diğer işlemler\" is an icon, named by its aria-label." }
  - { id: PROGRESS-2, rule: "Carried from tedris.course.updateProgress (retired 23 Nov 2026) and read from the code, not walked: at 100 the bar's value text and its aria-valuetext read \"%100 tamamlandı\" (libs/ui/src/mds/progress.tsx:38-41, the kit's default `completeLabel`, which course-aside.tsx:311 does not override) while the badge still says \"Devam ediyor\", the API does not complete the course (reaching 100 never does: domain invariant course-completion-is-the-teams) and the note says the course team confirms it. Since MDRS-248 the number reaches 100 when the talebe has watched every celse the programme counts (progressOf, lesson-view.repository.ts:55-56), so a talebe who watched them all is told on the card that the course is completed. Fix: pass completeLabel with a word that is not \"tamamlandı\", or none." }
  - { id: PROGRESS-4, rule: "New, provisional id, read from the code and from the PR's own notes (#402, 'Not verified, and follow-ups'), not walked: the enrolment's `progress` is worked out again only by the report that completes a celse, in the same transaction (lesson-view.repository.ts:138-174); nothing else writes it. A celse the course team adds, hides or cancels later changes the share only at the talebe's next completed celse, so the bar can say %100 over a new celse not watched, or less than the share after one was cancelled; and a seat that has completed no celse since MDRS-248 keeps the number typed by hand in the removed window, or written through PUT /courses/:id/progress, which is deprecated and still answers (course.controller.ts:822), until its first completion overwrites it. The card says nothing of when the number was worked out. Fix: work the share out when the page reads it, or again when the programme changes." }
  - { id: content-is-the-apis, rule: "What a person may read is the API's: for a waiting, a taken-away and a passive seat, and for a visitor, `contentLocked` removes the exam, the homework, the source, the cancel note and the resources' addresses before the page draws, so the page has nothing to hide (course-content.ts:44-89). The sample celse keeps its source and agenda for everyone." }
