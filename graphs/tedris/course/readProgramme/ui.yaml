  moreMenu: { type: action, component: Button, role: button, intent: secondary, text: { key: CoursePage.moreActions }, in: [curriculum, teachers], when: enrolledCard, emits: OPEN_LEAVE_MENU, source: apps/tedris/features/courses/components/course-aside.tsx:277 } # an icon only; its name is the aria-label; opens the menu with "Dersten ayrıl" (tedris.course.leave)
