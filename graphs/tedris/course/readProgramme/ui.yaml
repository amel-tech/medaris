  completedNote: { type: text, component: Text, text: { key: CoursePage.completedNote }, in: [curriculum, teachers], when: completedCard, source: apps/tedris/features/courses/components/course-aside.tsx:248 } # "Ders kadrosu 28 Eylül 2026’da onayladı. …"; left out when the date cannot be read
  seatNextEyebrow: { type: text, component: Text, text: { key: CoursePage.nextSession }, in: [curriculum, teachers], when: "seat and celseAhead", source: apps/tedris/features/courses/components/course-aside.tsx:154 } # a paragraph, not a heading
  seatNextDay: { type: text, component: Text, text: { key: composed.Programme.nextDay }, in: [curriculum, teachers], when: "seat and celseAhead", source: apps/tedris/features/courses/components/course-aside.tsx:138 } # a badge
  seatNextTitle: { type: text, component: Heading, role: heading, text: { key: composed.Programme.celse }, in: [curriculum, teachers], when: "seat and celseAhead", source: apps/tedris/features/courses/components/course-aside.tsx:157 } # h2: the one heading of the card; with no next celse an enrolled card has none (CRS-14)
  seatNextWhen: { type: text, component: Text, text: { key: composed.Programme.nextWhen }, in: [curriculum, teachers], when: "seat and celseAhead", source: apps/tedris/features/courses/components/course-aside.tsx:160 }
