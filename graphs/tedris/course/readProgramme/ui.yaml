  homeworkMark: { type: text, component: Text, text: { key: CoursePage.assignmentBadge }, in: [curriculum], when: "rich and contentOpen", source: apps/tedris/features/courses/components/course-programme.tsx:198 } # homework set, handed in, or to be recited to the hoca

