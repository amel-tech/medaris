# The screens of tedris.account.calendarFeed: tedris-web's Takvim aboneliği (/account/calendar, app/account/calendar/page.tsx and
# features/courses/components/calendar-subscription.tsx) as it draws a person with no link, with a link that cannot be shown again,
# with a status it could not read, and with a link just made, the confirmation dialog before a renewal, and the two toasts of the
# copy buttons. The bars above the page belong to tedris.shell.frame.
#
# Words: every `CalendarSubscription.*` key is copied from libs/i18n/src/locales/tr/tedris.json (the app reads it as
# `tedris.CalendarSubscription`), the key being the path inside that file, by <scratchpad>/calfeed/gen-catalog.py. Four texts are in
# no i18n file and are `composed.*`, written with the words the page shows:
#   composed.CalendarSubscription.mask  the 32 bullets of a hidden link, calendar-subscription.tsx:22
#   composed.Button.loading             "Yükleniyor", the busy status of a button, libs/ui/src/mds/button.tsx:62 (CALFEED-1)
#   composed.AlertDialog.close          "Kapat", the dialog's cross, libs/ui/src/mds/alert-dialog.tsx:47 (CALFEED-1)
#   composed.Toast.close                "Kapat", the toast's cross, libs/ui/src/mds/toast.tsx:97 (CALFEED-1, as ADDCAL-2)
# `changes` is the app's own message that says what renewing does (confirmText): the step that cannot be undone is the renewal, and the
# first link replaces nothing. No message is authored for this flow.
# The date in "Oluşturuldu: {date}" is the viewer's long date and short time; its sample is one made-up moment and the binding finds the
# text by its prefix. Samples are invented.
schema: delurio-graph/0
kind: ui
id: tedris.account.calendarFeed
flow: tedris.account.calendarFeed
status: captured
catalog: catalog/tr.json
locales: [tr]
changes: { key: CalendarSubscription.confirmText }
samples:
  date: 15 Kasım 2026 Pazar 21:00
# The two buttons that keep the focus through a call: "Bağlantı oluştur" while busy (aria-disabled, never `disabled`), and the dialog's
# "Yenile". What happens to the focus on the other steps is `returnsFocus` below or nothing: the page sets no focus on load, and a
# button that was pressed keeps it (focus-not-set).
focus:
  issuing: create
  renewing: confirm

