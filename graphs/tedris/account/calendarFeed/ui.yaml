rules:
  - { id: ACC-11, rule: "While a link exists the two read-only fields hold 32 bullets as their value (calendar-subscription.tsx:22, :62), and the copy buttons beside them are `disabled`. A screen reader reads a long run of \"bullet\" (or nothing) as the value of \"Google Takvim için\"; the sentence that says the link is hidden is a separate paragraph, not the field's description. Fix: draw the hidden state as text outside the input, or give the field a short value such as \"Gizli, yeniden gösterilmez\"." }
  - { id: ACC-12, rule: "`issue()` calls the Server Action inside `startTransition(async ...)` with no try/catch (calendar-subscription.tsx:122-135). A request that never reaches Next rejects, React hands the rejection to the nearest error boundary, and the person ends on app/error.tsx instead of the page's own \"Bağlantı oluşturulamadı\" alert. The inventory lists ACC-12 for account-settings.tsx, public-profile-page.tsx and notifications-page.tsx, not for this file. Not seen in a browser. Fix: catch the rejection and treat it as a refusal." }
  - { id: CALFEED-1, rule: "Four words of this page are constants of the kit and in no catalog: the dialog's cross is named \"Kapat\" (alert-dialog.tsx:47, `closeLabel` is not passed), the busy status says \"Yükleniyor\" (button.tsx:62, `loadingLabel` is not passed), the toast's cross is \"Kapat\" (toast.tsx:97) and the Toaster's region is \"Bildirimler\" (toast.tsx:127). They stay Turkish in en and ar; latent while tr is the only locale a screen can show. New, provisional id; the same family as LEAVE-2, ADDCAL-2 and MDRS-233. Fix: pass the labels from the catalog." }
  - { id: CALFEED-2, rule: "A refused renewal closes the dialog and draws \"Bağlantı oluşturulamadı. Lütfen tekrar dene.\" (calendar-subscription.tsx:127-131, :233-237): the words of a failed creation, for a call that changed nothing. It never says that the old link is still the one that works, and a link shown in this visit stays on the page, unmasked, under its \"Bağlantını şimdi kopyala\" warning, with the red alert below. The inventory notes the missing sentence but gives it no id. New, provisional id. Fix: after a refused renewal say that the old link is unchanged." }
  - { id: CALFEED-3, rule: "\"Bağlantı oluştur\" shows the new link and its \"Bağlantını şimdi kopyala\" warning by rendering them: the warning is a role=status node that arrives with its text (alert.tsx:23), which a live region does not reliably announce, and nothing else says it worked. The focus stays on the button, whose name changes from \"Bağlantı oluştur\" to \"Bağlantıyı yenile\" (the same <Button> in the same place, calendar-subscription.tsx:210-228). Not verified with a screen reader. New, provisional id. Fix: mount a status region first and write the sentence into it, or move the focus to the warning." }
  - { id: focus-not-set, rule: "The page sets no initial focus (no autoFocus and no focus() in app/account/calendar or in calendar-subscription.tsx), so the page node has no `initialFocus`, and no state names a focus except the busy buttons. Recorded so the silence is not read as an omission; the inventory does not call it a finding." }
  - { id: toast-aria-hidden, rule: "The warning toast \"Kopyalanamadı. Alan seçili; elle kopyalayabilirsin.\" is high priority: Base UI gives it role=alertdialog and aria-hidden until it is focused (ToastRoot: `aria-hidden: isHighPriority && !focused`), and announces it through the viewport's own live region. Whether a screen reader says it was not verified; the replay finds it by its attribute, not by role." }
  - { id: renewing-can-be-dismissed, rule: "While the renewing call runs the dialog's Vazgeç, its cross and Esc still close it (the AlertDialog's onOpenChange(false) is not blocked by `pending`); the call goes on and, when it ends, `setConfirming(false)` and the new link or the red alert are applied to a page the person thinks they left unchanged. The graph does not draw this: the `renewing` state has no CANCEL, CLOSE_DIALOG or ESCAPE. From the code, not seen." }
  - { id: label-in-name, rule: "The visible text of a button is contained in its accessible name: \"Kopyala\" in \"Google Takvim bağlantısını kopyala\" and \"Apple Takvim bağlantısını kopyala\" (case aside); the other buttons have no aria-label (WCAG 2.5.3). Holds. The two buttons look the same, so a voice-control user who says \"Kopyala\" meets two." }
  - { id: renewal-asks-first, rule: "\"Bağlantıyı yenile\" never calls the API: it opens a dialog that says what stops working, with the focus on Vazgeç; only \"Yenile\" calls. \"Bağlantı oluştur\" asks nothing, and only when the page knows there is no link (`needsConfirmation`, calendar-subscription.tsx:139): an unreadable status makes the first link a renewal." }
