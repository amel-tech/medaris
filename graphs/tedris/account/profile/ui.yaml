# The screens of tedris.account.profile: tedris-web's Hesap (/account, app/account/page.tsx) as it draws the cards of
# features/account/components/account-settings.tsx (Kişisel bilgiler, Bağlı uygulamalar, Saat dilimi, Takvim and the sign-out card),
# the two lists of the time-zone select, the toasts of the three saves and the box that takes the cards' place when GET /me fails.
# The roles section under them is tedris.account.rolesOverview's; the card "Herkese açık profil" is not drawn (the switch
# PUBLIC_PROFILE_ENABLED is false, availability.ts:14). Read from the code of the branch on 15 Nov 2026; nothing here was looked at in
# a browser, and every note "from the code" says so.
#
# Words: every `AccountPage.*` key is copied from libs/i18n/src/locales/tr/tedris.json (the app reads it as `tedris.AccountPage`), and
# every `AccountProfile.*` and `PublicProfile.*` key from libs/i18n/src/locales/tr/tedris-account.json (read as
# `tedrisAccount.AccountProfile.*`, through lib/i18n/loose.ts); the key is the path inside that file, the root removed. Three kinds of
# text are not in an i18n file:
#   composed.AccountProfile.givenNameValue / familyNameValue / emailValue   what the three boxes hold when the page opens: GET /me's
#                                                                          givenName, familyName and email (page.tsx:46-48)
#   composed.Toast.close  "Kapat"   the toast's close button, written in the kit (libs/ui/src/mds/toast.tsx:97, ACC-23)
#   Changes.note          the one message of this catalog that is not the app's. The flow writes with three actions of one route
#                         and the app has a sentence for each (nameSaved, zoneSaved, invitationsOn/Off) but none that says what
#                         the page changes as a whole, so the note joins what its own help lines already say (nameHelp,
#                         timeZoneHelp, invitationsHelp): who sees the name, what the zone decides, what the switch stops.
# Samples are invented and neutral; the three that name the account are overridden by each scenario of the binding.
