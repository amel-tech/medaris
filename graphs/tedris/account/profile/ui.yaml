rules:
  - { id: focus-not-set, rule: "Hesap sets no initial focus (no autoFocus and no focus() in features/account or app/account), so the page node has no `initialFocus` and the graph says nothing of the focus when the page opens or after a save. Recorded so the silence is not read as an omission. From the code, not looked at in a browser." }
  - { id: ACC-02, rule: "a blank name draws 'Adını yaz.' or 'Soyadını yaz.' as a Field error with no role and no live region (account-settings.tsx:107-112,135-160; Base UI's Field.Error has none), the focus stays on Kaydet instead of going to the first invalid box, and the line is not cleared when the person types: only the next press of Kaydet clears it. A screen-reader user who presses Kaydet hears nothing. Fix: focus the first invalid box, clear its line in onChange, or give the lines role=alert." }
  - { id: ACC-07, rule: "'Adın ve soyadın kaydedildi.' is true only for tedrisat's own copy (user_profiles, written by PATCH /me, user.service.ts:69-93): the name in the bars and in Ana sayfa's greeting comes from the sign-in token and does not change, so the person sees the old name next to a success message; and the Keycloak form that 'Değiştir' opens from this same page holds the sign-in names too (HESAP-2). Decision D2. Fix: read the bars' name from GET /me, or say in the toast that the name seen elsewhere changes at the next sign-in." }
  - { id: ACC-09, rule: "the link 'Değiştir' (or 'Ekle') has no name that says what it changes when it is read in a list of links: it relies on the read-only field above it (account-settings.tsx:77-86). It also leaves the app for Keycloak with no warning. Fix: aria-label 'Cinsiyetini hesabında değiştir'." }
  - { id: ACC-10, rule: "the invitation switch is natively disabled while its save is out (account-settings.tsx:321, Base UI sets aria-disabled and takes it out of the tab order), so the focused switch loses the keyboard focus for the length of the call; the kit's own Button avoids this on purpose with aria-disabled (button.tsx:29,82). From the code: the browser's behaviour is not verified. Fix: use aria-disabled or readOnly for the busy state." }
  - { id: ACC-12, rule: "no try/catch around the three server actions (account-settings.tsx:113-127,204-223,278-299): when the browser cannot reach Next at all, the promise rejects; inside a transition (the name and the zone) React hands it to the error boundary, which replaces the page with app/error.tsx, and in the switch's chain (a .then without a .catch) nothing is drawn and the switch stays flipped. The page draws 'could not be saved' only for a refusal the server answered. From the code. Fix: wrap each call and treat a rejection as a refusal (the rollback and the same error toast)." }
  - { id: ACC-16, rule: "the e2e check profile#1 expects an input[name=language] holding 'Türkçe' and read-only (profile.e2e.ts:80-85); the page has no such field (account-settings.tsx draws givenName, familyName, email and the gender; test/account-profile.spec.ts:137 asserts the field is absent), so that check cannot pass. The graph draws what the code does and carries the rest of profile#1. Fix: delete the two assertions and the title's 'language' (and the unused AccountProfile.language and languageHelp keys)." }
  - { id: ACC-19, rule: "the tab title is 'Hesap' with no ' | Tedris' suffix, where the calendar page's is 'Takvim aboneliği | Tedris' (app/account/page.tsx:14-17). A title is not a node; recorded because it is this page's." }
  - { id: ACC-20, rule: "choosing 'Diğer…' reveals the second list with no announcement and no focus move, and the zone stays as it was until one is chosen there, so a keyboard user who stops at 'Diğer…' sees the first list say 'Diğer…' while the stored zone is still the old preset (account-settings.tsx:184-258). From the code. Fix: move the focus to the new list, or keep it in the tree with an aria-live help line." }
  - { id: ACC-21, rule: "the two name boxes have no maxLength although tedrisat refuses a name over 100 characters (update-me.dto.ts:22-45), and the refusal is told as the one error toast 'Adın ve soyadın kaydedilemedi.' with 'Sunucu isteği tamamlayamadı.', which names neither the box nor the limit. Fix: maxLength={100} on both boxes." }
  - { id: ACC-23, rule: "the toasts' close button is named 'Kapat' and their region 'Bildirimler' by constants of the kit (libs/ui/src/mds/toast.tsx:97,127), not by catalog messages; the region's name is also the notifications page's and the bell's. Latent while tr is the only locale a screen can show; the same finding as ADDCAL-2 and LEAVE-2." }
  - { id: HESAP-1, rule: "new, provisional id. When GET /me fails, page.tsx:44-58 draws only the box 'Hesabın yüklenemedi' in place of the whole of AccountSettings: the name form, the e-mail and gender lines, Bağlı uygulamalar, Saat dilimi, Takvim with its switch and the sign-out card, although the last four take no data from GET /me (the nav writer's finding). The box has no button to try again, and 'Çıkış yap' is nowhere else in tedris (the phone sheet and the bar have none, the legacy menu is hidden), so a signed-in person whose profile cannot be read reaches the confirmation page only by typing /auth/signout. From the code, not looked at in a browser: the stack has no way to make GET /me fail. Fix: draw the sign-out card and the two link cards outside the `profile ?` branch, and give the box a 'Yeniden dene' (decision D1)." }
  - { id: HESAP-2, rule: "new, provisional id. The only door from Hesap to Keycloak's profile page is the link under the gender, named 'Değiştir' or 'Ekle', and that page edits more than the gender: the realm lets the person edit firstName, lastName, gender and e-mail (config/keycloak/user-profile.json:11,22,37,56, permissions.edit user), and the form draws Ad, Soyad, the two gender radios, E-posta and the notice (realm.auth.profileUpdate). Hesap says none of it: the e-mail line says 'buradan değiştirilemez' with no pointer to where it can be, the gender's help line mentions only the gender, and the names a person types in Hesap's own boxes are another copy than the names on that form (ACC-07). A person can therefore hold two names and change the address without the page ever telling them. From the code, the realm's file and realm.auth.profileUpdate's own reading; not looked at in a browser. Fix: name the link for what it opens and say under the e-mail line where it is changed (decision D3)." }
  - { id: unreadable-input-500, rule: "the domain's finding of PATCH /me: a body whose givenName or familyName is null passes validation (IsOptional lets null through) and user.service.ts:75 calls trim on it, answering 500 INTERNAL_ERROR instead of 400 (invariant unreadable-input-is-a-400, holds: false). Hesap cannot send it: validateName (profile-model.ts:96-104) stops a blank or whitespace name before the call, and the trimmed strings are never null. Recorded here because this is the page that calls the route; the fix is the API's." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): every box's label is its name, the three links and the button carry their own words; the time-zone combobox is named 'Saat dilimi' (aria-label) while its visible words are the zone chosen, as every Select of the kit is" }
