# The screens of tedris.account.notifications: tedris-web's Bildirimler (/notifications), as it draws a person's list (apps/tedris/features/notifications),
# the tabs, the row's menu, the busy button, the error boxes and the toast of a refused mark. The bar around it (the bell excepted, for SHL-04) is
# tedris.shell.frame's; the pages the rows lead to are other flows'.
#
# Words: every `NotificationsPage.*` key is copied letter for letter from libs/i18n/src/locales/tr/tedris.json (the app reads it as
# `tedris.NotificationsPage`), the key being the path inside that file; `PhoneMenu.notifications` is the bell's. The `composed.*` keys are NOT in
# any i18n file: they are the texts the app builds in code or the kit writes, written here with their placeholders so that a replay can match them:
#   composed.NotificationsPage.rowLink  "{title} {body}"   a row's link is its title paragraph and its sentence paragraph, so its accessible name
#                                                          is both (notification-row.tsx:54-63); a type with no sentence is the title alone
#   composed.NotificationsPage.time     "{time}"           <time> of a row: "HH:mm" in Today and Yesterday, "d MMMM" in Earlier, in the viewer's
#                                                          zone (notification-view.ts:235-246, notification-row.tsx:81)
#   composed.Toast.close                "Kapat"            the toast's close button, a constant of the kit (libs/ui/src/mds/toast.tsx:97, ACC-23)
#   composed.Button.loading             "Yükleniyor"       the hidden word of the retry button while it is busy: the kit's default `loadingLabel`
#                                                          (libs/ui/src/mds/button.tsx:62), where the load-more button passes its own (loadingMore)
# `Changes.note` is the one message of this catalog that is not the app's: the page has no message that tells the person what a mark does (the
# catalog's "Tüm bildirimler okundu." is never shown, ACC-05), so one short, factual Turkish sentence is authored here.
# Samples are invented and neutral. The messages of every type are drawn from one node each (rowTitle, rowBody), so a placeholder with no sample
# matches any text; the samples below are for the node that names a row (rowLink, rowMenu).
schema: delurio-graph/0
kind: ui
id: tedris.account.notifications
flow: tedris.account.notifications
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples:
  title: Başvurun onaylandı
  body: Örnek ders dersine kaydın onaylandı.
  time: "14:05"
  courseTitle: Örnek ders
  sessionAt: Çar 18 Kasım 21:00
  makeupAt: Cmt 21 Kasım 21:00
  previousAt: Sal 17 Kasım 21:00
  sessionLabel: Hafta 1 · Celse 1
  koskName: Örnek köşk
  deckTitle: Örnek deste
  reason: Örnek gerekçe
  outcome: approved
changes: { key: Changes.note }

