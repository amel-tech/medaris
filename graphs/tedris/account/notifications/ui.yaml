rules:
  - { id: SHL-04, rule: "The visible bell is named \"Bildirimler\" whatever is unread: PhoneChrome never reads the count (phone-chrome.tsx:20-48) and desktop-bar.tsx:83-89 and member-phone-menu.tsx:86-92 pass the static message PhoneMenu.notifications. The name MDRS-167 asks for, \"Bildirimler, 3 okunmamış\" (UserNotifications.labelUnread, bellLabel in notification-view.ts:249), exists only in the older header's bell (components/header/user-notification-menu.tsx:12-25), which PhoneChrome hides with display:none and which still asks GET /notifications/unread-count on every signed-in render. The graph's `bell` is named \"Bildirimler\" in every state, with seven rows unread and with none; the mark that follows lowers the tab counts and the bell says nothing. tedris.shell.frame measured the same on the stack (the seeded talebe, one unread: \"Bildirimler\"). Fix: read the count once in PhoneChrome, give both bars bellLabel(unread), delete the older header. Same as ACC-01." }
  - { id: ACC-03, rule: "\"Yeniden dene\" on the first-read box (notifications-page.tsx:99-112): when the retry fails again, the function returns with no message, no toast and no alert; the button only stops being busy and the box stays as it was (retryingFirst -> readFailed). The tab's retry (:186) has no busy state at all. Fix: set a visible, announced failure on a failed retry." }
  - { id: ACC-04, rule: "After \"Okundu say\" in a row's menu the row turns read, the \"…\" that held the focus is unmounted (the menu is drawn only for an unread row, notification-row.tsx:85-97), and the focus falls to <body>; under Okunmamış the whole row leaves the list. Read from the code and Base UI, not verified in a browser. Fix: move the focus to the next row's link or menu, or to the list's heading." }
  - { id: ACC-05, rule: "A mark is silent: the badges, the counts and the button change and nothing says so (notifications-page.tsx:114-150). The catalog holds \"Tüm bildirimler okundu.\" (markAllDone) and \"Geri al\" (undo), and the page's own comment still speaks of undo toasts; neither is used. Only a refusal toasts. Fix: announce a success with a polite status (markAllDone) and move the focus to a stable place." }
  - { id: ACC-06, rule: "COURSE_BAN_PLACED and KOSK_BAN_PLACED, which tedrisat writes for a köşk nazımı and a Medaris nazımı, have no entry in the page's ICONS (notification-view.ts:16-32): the row is titled \"Bildirim\" with no sentence, still a link (the target is a course or a köşk), with a bell icon, and counted as unread. A person cannot tell what happened. The walk's data stands in for it with a row of this type on a talebe's list. Fix: give both a title and a sentence in `types.*`, or leave the Nizam-side types out of tedris's list with the `types` filter." }
  - { id: ACC-10, rule: "\"Tümünü okundu say\" is natively `disabled` once counts.unread is 0 (notifications-page.tsx:270), and the press that causes it leaves the person on it: the focus can drop to <body> (browser dependent, not verified in a browser). The kit's own Button avoids this with aria-disabled (button.tsx:29,82). Fix: aria-disabled, or move the focus to a stable neighbour when the button is turned off." }
  - { id: ACC-12, rule: "The two marks are `.then()` chains with no catch (notifications-page.tsx:118-130, :137-149): if the browser cannot reach Next at all the promise rejects, which is an unhandled rejection; the optimistic change stays, with no rollback and no message. The first-read retry and the tab reads run inside startTransition, where a rejection reaches the error boundary (app/error.tsx). The page draws \"could not be marked\" only for a refusal the server answered. Not drawn; not verified. Fix: wrap the calls in try/catch and treat a rejection as a refusal." }
  - { id: ACC-15, rule: "\"Neler bildirilir\" lists eight kinds (notification-aside.tsx:17-30); the page also words SUBMISSION_REVIEWED (\"Ödevin değerlendirildi\"), EXAM_SCHEDULED (\"Sınav planlandı\"), EXAM_REMINDER (\"Yaklaşan sınav\") and EXAM_RESULTS_RELEASED (\"Sınav sonucun açıklandı\"). The aside's own comment says it lists only what tedrisat sends; it is out of date. Fix: add the four kinds and their keys." }
  - { id: ACC-18, rule: "The page's loading states, app/notifications/loading.tsx (a <div aria-busy=\"true\"> of skeleton bars, no <main>) and the tab's ListSkeleton (notifications-page.tsx:311), have no word and no accessible name. A screen-reader user is told nothing while the page or the tab reads. Fix: a visually hidden \"Yükleniyor\" in an <output>." }
  - { id: ACC-19, rule: "The document title is \"Bildirimler\" with no site suffix (app/notifications/page.tsx:11), while the calendar and public-profile pages are \"… | Tedris\". Fix: one pattern for all." }
  - { id: ACC-23, rule: "The toast's close button \"Kapat\" (libs/ui/src/mds/toast.tsx:97) and the toaster region \"Bildirimler\" (:127, a default parameter) are literals of the kit, not catalog messages; the region has the page's own name and the bell's. Latent while tr is the only locale a screen can show. Fix: let the app pass labels from the catalog and name the region apart from the page." }
  - { id: FRAME-2, rule: "tedris.shell.frame's finding, in force here: on /notifications the bar marks nothing as current, so the bell, which leads to the very page the person is on, has no aria-current=\"page\" (phone-chrome.tsx is mounted with section={null}, layout.tsx:28)." }
  - { id: NOTIF-1, rule: "New, proposed id. The row's link marks an unread row read in its onClick (notification-row.tsx:56 -> read, notifications-page.tsx:114) and the browser goes on to the target at once. The mark is a server action whose answer is handled after the page is gone: a refusal restores the list and calls toaster.notify on a toaster that left with the /notifications segment (NotificationsProviders is in app/notifications/layout.tsx:29), so nobody is told and the row stays unread. Read from the code, not verified in a browser; a success is unaffected. Fix: wait for the mark before navigating, or make the destination page mark it." }
  - { id: NOTIF-2, rule: "New, proposed id. Every day group's list carries the same name \"Bildirim listesi\" (notifications-page.tsx:223), inside a region already named by its day: a list navigator hears the same name for the three lists and only the region tells them apart. Fix: name each list by its day (aria-labelledby the group's heading) or leave the list unnamed." }
  - { id: NOTIF-3, rule: "New, proposed id. read() and readAll() roll back with setState(before), where `before` is the whole page's state taken when the mark began (notifications-page.tsx:115, :134). When a second mark starts before the first has answered and the first is refused, the snapshot taken before the first replaces the state: the second row goes back to unread on the page although the API marked it, and the counts are wrong until the page is read again. Read from the code, not verified in a browser. Fix: undo only the row (or all) that was refused." }
  - { id: NOTIF-4, rule: "New, proposed id. The API answers a notification with the whole row: GET /notifications and POST /notifications/<id>/read carry `userId` in each item (read on the stack, GET /notifications?limit=1 as the seeded talebe), though NotificationResponse declares no such field (notification/dto/notification-response.dto.ts:8-46) and the generated client and the domain's result schema leave it out. It is the caller's own id, so nothing leaks to another person, but the published contract is not what the wire carries. Fix: map the row to the DTO in the service, or declare the field." }
  - { id: notification-types-code-dropped, rule: "The domain's finding (invariant notification-types-code-reaches-the-client, holds: false). GET /notifications, /unread-count and POST /read-all refuse an unknown `types` entry with the code INVALID_NOTIFICATION_TYPES, and the global exception filter keeps only the message of an HttpException, so the client sees HTTP_400 (notification.controller.ts:104, global-exception.filter.ts:61-74). This page never sends `types`, so it cannot meet it; the nazar and nizam notification pages do." }
  - { id: unreadable-input-500, rule: "The domain's finding (invariant unreadable-input-is-a-400, holds: false). A `types` given twice (types=A&types=B) reaches parseNotificationTypes as an array and raw.trim throws (notification-types.ts:67): a TypeError, answered 500 INTERNAL_ERROR instead of 400. This page never sends `types`; any other client can." }
  - { id: focus-not-set, rule: "Bildirimler sets no initial focus (no autoFocus and no focus() in features/notifications or app/notifications), so the page node has no `initialFocus` and the graph says nothing of the focus when the page opens or after a mark. Recorded so the silence is not read as an omission." }
  - { id: not-live, rule: "The page is read once and kept in the browser's state: a notification that arrives while it is open appears only when the page is read again. router.refresh() after a mark re-reads the server tree but the client's state ignores the new props (useState(initial), notifications-page.tsx:62), so the refresh serves the older header's request and nothing the person sees." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): the tabs' names start with their visible word, and a row's link name is its two paragraphs" }
