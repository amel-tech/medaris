# The screens of tedris.shell.home: tedris-web's Ana sayfa (/home, app/home/page.tsx) as a signed-in talebe meets it: the greeting and
# its sentence, the next celse with its join card, the celses after it, and the three sections "Kaldığın yerden devam et", "Bugün
# çalışılacak desteler" and "Takip ettiğin köşklerden", each with its empty and failed look. The chrome around the page (the wide bar,
# the phone sheet, the footer) is tedris.shell.frame's and is not drawn here.
#
# Words: every `PhoneMenu.*`, `SessionPage.*`, `SchedulePage.*`, `AddToCalendar.*`, `MyCoursesPage.*` and `Decks.*` key is copied from
# libs/i18n/src/locales/tr/tedris.json (the app reads it as `tedris.<key>`), every `Home.*` key from tedris-learn.json (the app reads
# it as `tedrisLearn.Home.<key>`); the key is the path inside the file. The `composed.Home.*` keys are NOT in any i18n file: they are
# the texts the app builds in code from messages and data, written here with their placeholders so a replay can match them (a
# placeholder with no sample matches any text):
#   composed.Home.countdown          the badge of the card before the start, Intl.RelativeTimeFormat ("22 saat sonra", "Yarın")    libs/ui/src/mds/session-join.tsx:47
#   composed.Home.celseTitle         the title of a celse, a value the API gives                                                  home-sessions.tsx:137
#   composed.Home.joinDay            the day and hour of the card, Intl ("16 Kasım Pazartesi 20:30")                              session-join.tsx:205
#   composed.Home.joinLength         the length, a number and the unit SessionPage.minuteUnit ("60 dk")                           session-join.tsx:244
#   composed.Home.platformChip       the platform's label and, for an unknown platform, its host                                  session-join.tsx:295-306
#   composed.Home.joinName           SessionPage.joinAction and the hidden SessionPage.newTab, which make the link's name         session-join.tsx:353-354
#   composed.Home.courseTitle        a course's title, a value the API gives                                                      home-sessions.tsx:126, home-sections.tsx:150
#   composed.Home.kosk               a köşk's name, a value the API gives                                                         home-sessions.tsx:129
#   composed.Home.laterCaption       PhoneMenu.liveBadge, the course, SchedulePage.week and the moment (formatSessionMoment)      home-sessions.tsx:198-219
#   composed.Home.hoca               formatHocaName: the name with the unvan of this course, "Hoca" when it has none               home-sections.tsx:96-121
#   composed.Home.meetingMadrasah    the medrese and the köşk of a course card                                                    home-sections.tsx:157-160
#   composed.Home.nextSession        Home.nextSessionShort and the weekday and hour of the course's next celse                    home-sections.tsx:163-166
#   composed.Home.deckTitle          a deck's title, a value the API gives                                                        home-sections.tsx:304
#   composed.Home.deckCaption        the deck's kind (Decks.yours, Decks.kind*) and Decks.dueCount or Decks.added                 home-sections.tsx:306-313
#   composed.Home.followedCaption    the köşk and the hoca of a followed köşk's course                                            home-sections.tsx:352-371
# Samples are invented and neutral.
