rules:
  - { id: SHL-05, rule: "`/` takes a permanent redirect (308, cached by browsers) to /home from next.config.js:87-95, and /home sends a visitor on to /discover (307, no-store) from app/home/page.tsx:26-28, so a visitor takes two hops; the choice app/page.tsx:12-14 makes (a visitor to /discover) is never reached. Measured on the stack with curl: `/` 308 location /home, `/home` 307 location /discover. Fix: drop the redirects entry or the page's own redirect." }
  - { id: SHL-08, rule: "The box of a failed section carries \"Yeniden dene\", drawn as `Button href=\"\"` (home-sections.tsx:56): an <a href=\"\"> to the page's own address. Pressing it reloads the whole page and the two other sections with it, where the sentence above it promises to read the section again. Fix: a button that calls router.refresh(), or name it \"Sayfayı yenile\" (decision D1). Read from the code and the unit spec home-sections.spec.ts; the stack cannot make a read fail, so it was not pressed." }
  - { id: SHL-04, rule: "The bell in the page's frame is named \"Bildirimler\" and not with the unread count that MDRS-167 asks for (desktop-bar.tsx:83-89, member-phone-menu.tsx:86-92); the frame is tedris.shell.frame's, recorded here because the inventory lists it for Ana sayfa. Not drawn in this graph." }
  - { id: SHL-09, rule: "The phone sheet's foot calls every signed-in account \"Talebe\" (member-phone-menu.tsx:106) and the link's name \"Hesabım: <name>\" leaves it out; the frame is tedris.shell.frame's, recorded here because the inventory lists it for Ana sayfa. Not drawn in this graph." }
  - { id: SHL-01, rule: "app/home/page.tsx and app/home/layout.tsx export no metadata, so the tab and a screen reader say \"Medaris Tedris\" on Ana sayfa as on every page with no title of its own (WCAG 2.4.2); the phone bar's title and the nav graph's page title are \"Ana sayfa\". Measured on the stack: document.title is \"Medaris Tedris\". Fix: a generateMetadata from PhoneMenu.home." }
  - { id: focus-not-set, rule: "Ana sayfa sets no initial focus (no autoFocus and no focus() in app/home, features/home or features/schedule/components/home-sessions.tsx), so the page node has no `initialFocus` and the graph says nothing of the focus when the page opens. Measured on the stack: document.activeElement is the <body> after the page loads. Recorded so the silence is not read as an omission." }
  - { id: HOME-1, rule: "When the read of the celses fails (`getMyUpcomingLessons` answers null) the page says it in one <p> under the greeting, \"Celselerin şu an okunamadı.\" (home-sessions.tsx:86-87): no alert and no live region, no retry, and \"Sıradaki celse\" and \"Sonraki celseler\" are simply absent, so a person cannot tell a failed read from \"Planlı bir celsen görünmüyor.\" except by the words. The three sections below get an error box with a link (SHL-08). Fix: the same box, announced, in place of the two celse blocks (decision D2). Proposed id; read from the code, not walked (the stack cannot make the read fail)." }
  - { id: HOME-2, rule: "The join card's eyebrow is SessionPage.joinLabel, \"Canlı ders\", and so is the first piece of every caption in \"Sonraki celseler\" (home-sessions.tsx:208), whatever the celse is: for an in-person celse the card's body says it is held face to face while its label calls it a live lesson. The celse page says \"Yüz yüze\" (SessionPage.inPersonKind, session-action-card.tsx:339). Fix: the same label choice on Ana sayfa as on the celse page. Proposed id; read from the code, not walked (the stack has no in-person celse)." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): \"Çalış\" is inside \"Çalış: <deck>\" and \"Celseye katıl\" is inside \"Celseye katıl (yeni sekmede açılır)\"" }
  - { id: sections-fail-alone, rule: "the three sections read for themselves inside their own Suspense and each answers null on a failed read, so one that fails or is slow does not hold back the others (page.tsx:40-57, reads.ts:20-33, unit spec home-sections.spec.ts \"the sections are independent\")" }
