rules:
  - { id: overview-exposes-head-id, rule: "GET /madrasahs/{id}/overview gives headMuderris.id, the başmüderris's account id, to a caller with no token (madrasah.controller.ts:355-367 applies no mask, madrasah.repository.ts:1220-1226 builds the object with id: headId), though GET /madrasahs/{id} masks createdBy and nazirIds for the same caller because \"a person's id is not for the public\" (anonymous-mask.ts:3-8). THIS PAGE reads the whole object (public-reads.ts:81-84, with the viewer's token or none) and uses only `name` and `courseCount` (madrasah-page.tsx:175-184,252-256); it passes strings to its children, so the id goes to nobody. Checked on the stack on 15 Nov 2026 with no token: the API answered 200 and the id was in the body (it equals the başmüderris's account id, compared in a script that printed no id); the visitor's page, its flight payload (an RSC request) and a signed-in person's page (DOM and the six same-origin responses of the load) did not contain it. So the leak is the API's and not the page's; a browser that calls the API directly (or anyone with the address) reads it. Fix: drop `id` from MadrasahHeadMuderrisResponse, since no page reads it, or mask it as the medrese read does, and add the test the köşk response has (public-pages.e2e.spec.ts:273)." }
  - { id: DSC-10, rule: "Every failure of the two reads is `null` (public-reads.ts:49-55) and drawn as the not-found page (layout.tsx:20, page.tsx:63), so an outage of tedrisat reads as \"Sayfa bulunamadı. Aradığın sayfa yok ya da artık burada değil.\" and a person who follows a good link is told the medrese is gone. The köşk page tells the two apart (\"Köşk yüklenemedi\"). Not walked: the stack's API answers every read. Fix: throw on anything but a 404 and draw the segment's error state." }
  - { id: DSC-12, rule: "NOT seen on this page. The inventory records that a course cover prints the course's Arabic label as an unnamed <p> before the card title; on this page courseCover(course) reads `coverLabel`, which MadrasahCourseResponse does not carry (it has `category`), so the cover prints nothing (checked on the stack: no .mds-cover__label on the page). The finding holds on the köşk page and on Derslerim; it would reach this page the day the overview carries `coverLabel`." }
  - { id: MAD-1, rule: "The fixed notice \"Her dersin kendi hocaları vardır. Medresenin derslerine kayıt onaylıdır: başvurduğunda, dersin kadrosu onaylayınca kaydın kesinleşir.\" is drawn for every medrese and says every course asks for approval (madrasah-page.tsx:199, MadrasahPage.approvalNotice). It reads neither the medrese's policyAlwaysApproval nor a course's requiresApproval. On the stack the seeded medrese has no such policy and its course \"Bina ve İzhar Şerhi\" takes anyone: its own page says \"Kayıt onay gerektirmez\" and its button is \"Kayıt ol\" (seen as a signed-in person with no seat, 15 Nov 2026); only \"İsâgûcî ile Mantığa Giriş\" says \"Kayıt onaya bağlı\". Proposed id; not in the inventory. Fix: say it per card, or only where it is true (decision D1)." }
  - { id: MAD-2, rule: "The line under the title is two <span>s with an aria-hidden separator between them and no text node between them (madrasah-page.tsx:173-186). The accessibility tree reads it as one run, \"2 dersBaşmüderris Nuri ...\" (Playwright's snapshot of the page); whether a screen reader says the two words apart was NOT verified. Proposed id; low. Fix: a visually hidden space or a comma between the spans." }
  - { id: MAD-3, rule: "The side list is named \"{name} medresesinin derslerini açtığı köşkler\" (MadrasahPage.kosksLabel). A medrese whose name ends in \"Medresesi\" (the seeded one does) is read \"Hadis ve Siyer Medresesi medresesinin ...\", the word twice. Proposed id; low. Fix: \"Derslerini açtığı köşkler: {name}\"." }
  - { id: MAD-4, rule: "On the not-found page this address answers there is no <main> landmark: NotFoundState draws SystemState with `shell`, which makes a <section> because the shell is expected to own <main> (libs/ui/src/mds/system-state.tsx:34-36), and app/not-found.tsx draws no shell around it (seen on the stack as a visitor: 0 <main> in the document, the region \"Sayfa bulunamadı\" is the page's only landmark besides the bar and the footer). Proposed id; belongs to tedris.shell.systemPages, recorded here because this flow ends on that page. Fix: draw SystemState without `shell` in not-found.tsx." }
  - { id: focus-not-set, rule: "The page sets no initial focus (no autoFocus and no focus() in features/courses or in the segment), so no node has `initialFocus`; checked on the stack: document.activeElement is the body after the load. Recorded so the silence is not read as an omission; the inventory does not call it a finding." }
