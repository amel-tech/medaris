# The screens of tedris.discover.readMadrasah: tedris-web's medrese page (/madrasahs/<id>, app/madrasahs/[madrasahId]/page.tsx and
# features/courses/components/madrasah-page.tsx) for a visitor and for a signed-in person, with no course, and the not-found page every
# failed read ends on. The frame around it (the bar, the theme switch, the footer) is tedris.shell.frame's.
#
# Words: every `MadrasahPage.*` and `SystemPages.*` key is copied from libs/i18n/src/locales/tr/tedris.json (the app reads it as `tedris`),
# the key being the path inside that file. The `composed.*` keys are NOT in any i18n file: they are texts the app builds in code from data or
# from a message with its rich-text tags resolved, written here with their placeholders so a replay can match them:
#   composed.Breadcrumb.label            the landmark's name, the default of the kit's Breadcrumb (libs/ui/src/mds/breadcrumb.tsx:19), no catalog
#   composed.MadrasahPage.name           the medrese's name, as the heading and as the breadcrumb's last item (madrasah-page.tsx:161,170)
#   composed.MadrasahPage.headLine       "Başmüderris" + the name, madrasah-page.tsx:183-184 (the message MadrasahPage.headMuderris and a <bdi>)
#   composed.MadrasahPage.description    one paragraph of the medrese's own description, split on blank lines (:151-154,196-198)
#   composed.MadrasahPage.course         a course's title, in its card and as a caption in the side list (:72,286)
#   composed.MadrasahPage.hocas          the hocas of a course, each with their unvan (:34-49,124)
#   composed.MadrasahPage.kosk           a köşk's name (:92,280)
#   composed.MadrasahPage.nextTime       "Paz 21:00": weekday and clock of the next celse (next-session.ts:41-55)
#   composed.MadrasahPage.headName       the başmüderris's name in the side card (:252)
#   composed.AnonymousInvite.apply/.signIn/.register   the message AnonymousInvite.apply ("... <signIn>giriş yap</signIn> ya da
#                                        <register>kayıt ol</register>.") with its two tags resolved: the sentence and its two link texts
#                                        (components/anonymous-invite.tsx:54-60)
# A node that the two pages differ in (the badge, the hint, the invitation) is `in` both states with a `when`, so the replay checks that it is
# gone where the graph says so, with or without --absent.
# Samples are neutral; the binding overrides the ones that must match what the stack seeds.
schema: delurio-graph/0
kind: ui
id: tedris.discover.readMadrasah
flow: tedris.discover.readMadrasah
status: captured
catalog: catalog/tr.json
locales: [tr]
samples:
  name: Örnek medrese
  head: Örnek başmüderris
  description: Örnek tanıtım yazısı.
  count: "2"
  course: Örnek ders
  hoca: Örnek hoca
  kosk: Örnek köşk
  next: Sal 21:00

nodes:
  # ---- the page and its head ----
  madrasahPage: { type: page, component: Page, role: main, in: [readByVisitor, readByMember], source: apps/tedris/features/courses/components/madrasah-page.tsx:156 } # no name and no initialFocus: the <main> is not labelled and nothing moves the focus when the page opens (rule focus-not-set)
  breadcrumb: { type: page, component: Page, role: navigation, name: { key: composed.Breadcrumb.label }, in: [readByVisitor, readByMember], source: apps/tedris/features/courses/components/madrasah-page.tsx:158 } # an <ol>: "Keşfet / <medrese adı>"
  breadcrumbDiscover: { type: action, component: LinkButton, role: link, text: { key: MadrasahPage.discover }, in: [readByVisitor, readByMember], emits: OPEN_DISCOVER, source: apps/tedris/features/courses/components/madrasah-page.tsx:160 } # a plain <a>, so a full page load
  breadcrumbCurrent: { type: text, component: Text, text: { key: composed.MadrasahPage.name, params: { name: madrasah.name } }, in: [readByVisitor, readByMember], source: apps/tedris/features/courses/components/madrasah-page.tsx:161 } # aria-current=page, never a link
  eyebrow: { type: text, component: Text, text: { key: MadrasahPage.eyebrow }, in: [readByVisitor, readByMember], source: apps/tedris/features/courses/components/madrasah-page.tsx:168 }
  title: { type: text, component: Heading, role: heading, text: { key: composed.MadrasahPage.name, params: { name: madrasah.name } }, in: [readByVisitor, readByMember], source: apps/tedris/features/courses/components/madrasah-page.tsx:169 } # h1
  coursesCount: { type: text, component: Text, text: { key: MadrasahPage.coursesCount, params: { count: courses.length } }, in: [readByVisitor, readByMember], source: apps/tedris/features/courses/components/madrasah-page.tsx:174 } # "2 ders", counted over the listed courses
  headLine: { type: text, component: Text, text: { key: composed.MadrasahPage.headLine, params: { head: headMuderris.name } }, in: [readByVisitor, readByMember], when: headNamed, source: apps/tedris/features/courses/components/madrasah-page.tsx:183 } # the two spans run together in the accessibility tree: "2 dersBaşmüderris Nuri ..." (MAD-2)
  about: { type: text, component: Text, text: { key: composed.MadrasahPage.description, params: { description: madrasah.description } }, in: [readByVisitor, readByMember], repeat: description.paragraphs, source: apps/tedris/features/courses/components/madrasah-page.tsx:196 }
  approvalNotice: { type: text, component: Text, text: { key: MadrasahPage.approvalNotice }, in: [readByVisitor, readByMember], source: apps/tedris/features/courses/components/madrasah-page.tsx:199 } # the same sentence for every medrese and every course (MAD-1)

  # ---- "Dersler" ----
  coursesSection: { type: page, component: Page, role: region, name: { labelledBy: coursesTitle }, in: [readByVisitor, readByMember], source: apps/tedris/features/courses/components/madrasah-page.tsx:202 }
  coursesTitle: { type: text, component: Heading, role: heading, text: { key: MadrasahPage.courses }, in: [readByVisitor, readByMember], source: apps/tedris/features/courses/components/madrasah-page.tsx:207 } # h2
  coursesHintVisitor: { type: text, component: Text, text: { key: MadrasahPage.coursesHintAnonymous }, in: [readByVisitor, readByMember], when: isVisitor, source: apps/tedris/features/courses/components/madrasah-page.tsx:210 }
  coursesHintMember: { type: text, component: Text, text: { key: MadrasahPage.coursesHint }, in: [readByVisitor, readByMember], when: "not isVisitor", source: apps/tedris/features/courses/components/madrasah-page.tsx:210 }
  noCourses: { type: text, component: Text, text: { key: MadrasahPage.noCourses }, in: [readByVisitor, readByMember], when: "listing == 'none'", source: apps/tedris/features/courses/components/madrasah-page.tsx:219 }

  # a card per listed course (the Card kit component: one link, in its title, that covers the whole card)
  courseTitle: { type: text, component: Heading, role: heading, text: { key: composed.MadrasahPage.course, params: { course: course.title } }, in: [readByVisitor, readByMember], when: hasCourses, repeat: courses, source: apps/tedris/features/courses/components/madrasah-page.tsx:72 } # h3; the cover above it is decorative and, on this page, prints no label (DSC-12 not seen)
  courseLink: { type: action, component: LinkButton, role: link, name: { key: composed.MadrasahPage.course, params: { course: course.title } }, in: [readByVisitor, readByMember], when: hasCourses, repeat: courses, emits: OPEN_COURSE, source: apps/tedris/features/courses/components/madrasah-page.tsx:71 }
  statusBadge: { type: text, component: Text, text: { oneOf: [MadrasahPage.statusEnrolled, MadrasahPage.statusPending, MadrasahPage.statusCompleted] }, in: [readByVisitor, readByMember], when: badged, repeat: courses.held, source: apps/tedris/features/courses/components/madrasah-page.tsx:84 } # a badge in the card's header: brand "Devam ediyor", warning with a clock "Onay bekliyor", success "Tamamlandı"; only on a card in which the person holds something
  inPersonBadge: { type: text, component: Text, text: { key: MadrasahPage.inPerson }, in: [readByVisitor, readByMember], when: heldInPerson, repeat: courses.inPerson, source: apps/tedris/features/courses/components/madrasah-page.tsx:121 } # MDRS-283; public, like the title
  hocaLine: { type: text, component: Text, text: { key: composed.MadrasahPage.hocas, params: { hoca: course.muderris } }, in: [readByVisitor, readByMember], when: hasCourses, repeat: courses, source: apps/tedris/features/courses/components/madrasah-page.tsx:124 }
  koskLink: { type: action, component: LinkButton, role: link, name: { key: composed.MadrasahPage.kosk, params: { kosk: course.koskName } }, in: [readByVisitor, readByMember], when: hasCourses, repeat: courses, emits: OPEN_KOSK, source: apps/tedris/features/courses/components/madrasah-page.tsx:91 } # a second link inside the card, which stays a separate tab stop
  nextCelse: { type: text, component: Text, text: { key: MadrasahPage.nextSession }, in: [readByVisitor, readByMember], when: plannedCelse, repeat: courses, source: apps/tedris/features/courses/components/madrasah-page.tsx:101 }
  nextCelseTime: { type: text, component: Text, text: { key: composed.MadrasahPage.nextTime, params: { next: course.nextSessionAt } }, in: [readByVisitor, readByMember], when: plannedCelse, repeat: courses, source: apps/tedris/features/courses/components/madrasah-page.tsx:102 } # a <time datetime>; never the meeting link
  noNextCelse: { type: text, component: Text, text: { key: MadrasahPage.noNextSession }, in: [readByVisitor, readByMember], when: unplannedCelse, repeat: courses, source: apps/tedris/features/courses/components/madrasah-page.tsx:111 }

  # the invitation under the cards, a visitor's only
  invite: { type: text, component: Text, text: { key: composed.AnonymousInvite.apply }, in: [readByVisitor, readByMember], when: isVisitor, source: apps/tedris/components/anonymous-invite.tsx:55 }
  inviteSignIn: { type: action, component: LinkButton, role: link, text: { key: composed.AnonymousInvite.signIn }, in: [readByVisitor, readByMember], when: isVisitor, emits: OPEN_SIGN_IN, source: apps/tedris/components/anonymous-invite.tsx:41 } # /auth/signin?callbackUrl=%2Fmadrasahs%2F<id>
  inviteRegister: { type: action, component: LinkButton, role: link, text: { key: composed.AnonymousInvite.register }, in: [readByVisitor, readByMember], when: isVisitor, emits: OPEN_REGISTER, source: apps/tedris/components/anonymous-invite.tsx:46 } # /auth/register

  # ---- the side cards ----
  aside: { type: page, component: Page, role: complementary, in: [readByVisitor, readByMember], source: apps/tedris/features/courses/components/madrasah-page.tsx:245 }
  headTitle: { type: text, component: Heading, role: heading, text: { key: MadrasahPage.headMuderris }, in: [readByVisitor, readByMember], when: headNamed, source: apps/tedris/features/courses/components/madrasah-page.tsx:247 } # h2, Card headingLevel 2
  headName: { type: text, component: Text, text: { key: composed.MadrasahPage.headName, params: { head: headMuderris.name } }, in: [readByVisitor, readByMember], when: headNamed, source: apps/tedris/features/courses/components/madrasah-page.tsx:252 }
  headCount: { type: text, component: Text, text: { key: MadrasahPage.headMuderrisCourses, params: { count: headMuderris.courseCount } }, in: [readByVisitor, readByMember], when: headNamed, source: apps/tedris/features/courses/components/madrasah-page.tsx:255 } # how many of the listed courses the head teaches; 0 is drawn as "0 dersinde"
  kosksTitle: { type: text, component: Heading, role: heading, text: { key: MadrasahPage.kosks }, in: [readByVisitor, readByMember], when: hasCourses, source: apps/tedris/features/courses/components/madrasah-page.tsx:264 } # h2
  kosksHint: { type: text, component: Text, text: { key: MadrasahPage.kosksHint }, in: [readByVisitor, readByMember], when: hasCourses, source: apps/tedris/features/courses/components/madrasah-page.tsx:265 }
  kosksList: { type: list, component: List, role: list, name: { key: MadrasahPage.kosksLabel, params: { name: madrasah.name } }, in: [readByVisitor, readByMember], when: hasCourses, source: apps/tedris/features/courses/components/madrasah-page.tsx:266 } # named "<medrese adı> medresesinin derslerini açtığı köşkler" (MAD-3)
  koskAsideLink: { type: action, component: LinkButton, role: link, name: { key: composed.MadrasahPage.kosk, params: { kosk: kosk.name } }, in: [readByVisitor, readByMember], when: hasCourses, repeat: kosks, emits: OPEN_KOSK, source: apps/tedris/features/courses/components/madrasah-page.tsx:279 }
