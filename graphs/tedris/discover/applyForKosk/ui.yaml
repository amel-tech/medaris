rules:
  - { id: focus-not-set, rule: "no page here sets an initial focus: after the load of Keşfet and of the form page the focus is on the document (measured: document.activeElement is the <body>); after a choice in the list or Esc it is on the box again (measured); after an empty send it stays on \"Başvuruyu gönder\" (measured); after the send the button is gone and the focus is on the document (DSC-07). The graph says nothing of the focus" }
  - { id: DSC-05, rule: "pressing \"Başvuruyu gönder\" with a required field empty shows each error as a plain <div class=mds-error> under its field (no role, no live region) and leaves the focus on the button; only aria-invalid on the boxes marks them (kosk-application-page.tsx:60-65, libs/ui/src/mds/field.tsx:33-53; measured: the focus is on the button, the errors are not alerts). A screen-reader user hears nothing after the try. Fix: focus the first invalid control, or give the errors role=alert and add an error summary" }
  - { id: DSC-06, rule: "= SHL-16. /kosk-applications is missing from ownsItsMain (components/tab-view/index.tsx:12-22), so the shell wraps the page in <main data-legacy-main> and the page draws its own <main> inside it (page.tsx:24): two main landmarks (measured: getByRole(\"main\") finds two; the inventory had not verified it). Fix: add pathname.startsWith(\"/kosk-applications\") to ownsItsMain" }
  - { id: DSC-07, rule: "after a successful send the form is replaced by the card \"Başvurun alındı\" (kosk-application-page.tsx:83-97): the focused button is unmounted, the focus falls to the document, and the success alert comes in with the card, which many screen readers do not announce. Fix: move the focus to the card's h2 (tabIndex=-1) after setSent(true)" }
  - { id: DSC-08, rule: "any refusal of POST /kosk-applications gives one toast, \"Başvurun gönderilemedi. Biraz sonra yeniden dene.\" with \"Sunucu isteği tamamlayamadı.\", whatever the API said: its code and message are thrown away (kosk-application-page.tsx:71-77); a refused field is never named. Fix: map a 400 to a message that names the field" }
  - { id: DSC-15, rule: "the privacy link opens a new tab (target=_blank, rel=noopener noreferrer, kosk-application-page.tsx:215-220) and its words do not say so" }
  - { id: APPLYKOSK-1, rule: "new, provisional id, measured: the page's address check (^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$, model.ts:37) accepts \"ad@alan.c\"; the API's @IsEmail (create-kosk-application.dto.ts:48) refuses it with 400 VALIDATION_ERROR on the property email, and the person gets the toast of DSC-08, which names nothing. Fix: make the page's check the API's, or name the refused field from the 400" }
  - { id: no-way-back, rule: "after the send the person has no page that lists the application and no way to take it back (the API has no such route; kosk-application.controller.ts has only POST), and nothing limits how many a person files (kosk-application.service.ts:10). The page says the outcome reaches them as a notification (step 3 of the aside), and that notification names the köşk without a link (F-3)" }
  - { id: F-3, rule: "the approval names no köşk link. nizam.applications.decide draws the approval; here it is noted because this flow's row is what it acts on: approveKoskApplication records koskId without checking the köşk was opened from this application or is not attached to another (kosk-application-review.service.ts:156-181), and the notification it sends the applicant, KOSK_APPLICATION_RESULT, carries the köşk's name and no target (kosk-application-review.service.ts:225-229), although tedris's notification page can lead to /kosks/<id> from a KOSK target (features/notifications/notification-view.ts:71). Read from the code; this flow ends before the approval" }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): every field's label is its name; the combobox's name is \"Alan\" and its visible words are \"Alan seç\" until a field is chosen, after which they are the field's own name and the name is still \"Alan\" (aria-label, measured)" }
