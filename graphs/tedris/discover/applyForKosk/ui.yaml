# The screens of tedris.discover.applyForKosk: the card at the end of Keşfet, the page "Köşk açma başvurusu" (breadcrumb, h1,
# the form, the aside), its list of fields, the busy send, the refusal toast and the sent card "Başvurun alındı". Read from
# apps/tedris/features/discover/components/discover-page.tsx and apps/tedris/features/kosk-application/ on 15 Nov 2026, and
# looked at in a browser as the spare talebe (a probe, not the replay). Everything else on Keşfet is tedris.discover.browse's.
# The words are copied from libs/i18n/src/locales/tr/tedris.json (DiscoverPage.*) and tedris-account.json (KoskApplication.*,
# where the app reads them as `tedrisAccount.KoskApplication.*`), keys kept, root removed. `composed.KoskApplication.accountEmail`
# is the one text the app does not keep in a file: the e-mail field starts with the account's own address (page.tsx:39); its
# sample is overridden by the replay's scenario with the account's real address.
# `changes` is the app's own message that says what the send does and what follows (KoskApplication.sentText): the app has no
# message for "what this flow changes", and a graph never invents one.
