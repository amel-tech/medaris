rules:
  - { id: focus-not-set, rule: "none of the four pages gives the focus to anything when it opens: no autoFocus and no .focus() in discover-page.tsx, kosk-page.tsx, madrasah-page.tsx or course-page.tsx's own code, and in a browser on the stack the focus is on the document after each load. The graph says nothing of the focus and gives no page an initialFocus" }
  - { id: SHL-05, rule: "`/` takes a permanent redirect to /home from next.config.js:87 and /home sends a visitor on to /discover (app/home/page.tsx:26), so Keşfet is two hops from the front door and app/page.tsx:13's own choice is never reached; this flow starts at /discover and tedris.shell.home draws the hops" }
  - { id: DSC-09, rule: "a köşk that fails to read is drawn as a box with no h1 and a breadcrumb of one item, which draws nothing (kosk-page.tsx:293, breadcrumb.tsx:22); not drawn here: tedris.discover.readKosk" }
  - { id: DSC-12, rule: "a card's cover (size sm) is not hidden from assistive technology and prints the course's Arabic label as a paragraph before the title (kosk-page.tsx:77, madrasah-page.tsx:73; cover-pattern.tsx:75). The seeded courses have none, so nothing in the replay shows it; not verified here" }
  - { id: DSC-19, rule: "each of the four pages has a loading.tsx of aria-hidden skeletons inside an aria-busy container with no text (app/discover/loading.tsx:7, app/kosks/[koskId]/loading.tsx:7, app/madrasahs/[madrasahId]/loading.tsx:7), and the course page's says the same (CRS-08, app/courses/[courseId]/loading.tsx:10): nothing says \"loading\" to a screen reader. The graph draws the loaded pages" }
  - { id: CRS-12, rule: "words the code does not take from the catalog: the breadcrumb's name \"Sayfa yolu\" (breadcrumb.tsx:18), and the row's \", tamamlandı\" (lesson-row.tsx:189; course-programme.tsx passes no doneLabel). The graph names neither as a node" }
  - { id: CRS-17, rule: "the cover of the course page is not hidden and prints the course's Arabic label before the h1 (course-page.tsx:267, cover-pattern.tsx:60). The seeded courses have none; not verified here" }
  - { id: VISIT-1, rule: "new, provisional id: the medrese page says \"Medresenin derslerine kayıt onaylıdır\" for every medrese (MadrasahPage.approvalNotice, madrasah-page.tsx:199), but the API asks for approval for a medrese's course only where the medrese's own policy is on (policy_always_approval, default false: course.repository.ts:1931, course.service.ts:1568; madrasah.schema.ts:62). The seeded medrese says it above the card of a course whose own card says \"Kayıt onay gerektirmez\" and whose enrolment gives the seat at once. Measured on the stack with a visitor" }
  - { id: VISIT-2, rule: "new, provisional id: the programme prints a week's label and its title side by side, so a week whose title is only \"Hafta N\" (the stack's seed, and the title a week starts with) reads \"Hafta 1 Hafta 1\" in its heading and its name. The recordings tab of the same page drops such a title (isPlainWeekTitle, recordings-tab.tsx:149, MDRS-280); the programme does not (course-programme.tsx:243, week-accordion.tsx:121,135). Measured on the stack" }
