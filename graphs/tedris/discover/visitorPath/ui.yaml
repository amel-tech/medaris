# The screens of tedris.discover.visitorPath: Keşfet, a köşk page, a medrese page and a course's introduction (programme tab and
# recordings tab) as a person with no session meets them. The bar around the page (tedris.shell.frame), the filters and the pager of
# Keşfet (tedris.discover.browse) and everything a signed-in person adds are not drawn.
#
# Words: every key is copied from libs/i18n/src/locales/tr/tedris.json (the app reads it as `tedris.<key>`: `DiscoverPage.*`,
# `KoskPage.*`, `MadrasahPage.*`, `CoursePage.*`, `AnonymousInvite.*`) or from tedris-learn.json (`RecordingsTab.*`, read as
# `tedrisLearn.RecordingsTab.<key>`), the key being the path inside that file. The `composed.VisitorPath.*` keys are NOT in any
# i18n file: they are what the app builds in code from messages and data, written here with their placeholders so a replay can
# match them (a placeholder with no sample matches any text):
#   composed.VisitorPath.kosk            a köşk's name, a value the API gives                                         kosk-card.tsx:31, kosk-page.tsx:166
#   composed.VisitorPath.madrasah        a medrese's name, a value the API gives                                      madrasah-card.tsx:32, madrasah-page.tsx:170
#   composed.VisitorPath.course          a course's title, a value the API gives                                      kosk-page.tsx:76, course-page.tsx:283
#   composed.VisitorPath.inviteSignIn    the text of the first link inside AnonymousInvite.*, a part of the message    anonymous-invite.tsx:41
#   composed.VisitorPath.inviteRegister  the text of the second link inside it                                         anonymous-invite.tsx:46
#   composed.VisitorPath.cardRegister    the text of the link inside CoursePage.noAccount                              course-aside.tsx:354
#   composed.VisitorPath.sampleMark      CoursePage.sampleMark, " · " and CoursePage.typeLive: the row's type label    course-programme.tsx:137
#   composed.VisitorPath.sampleRow       the sample row's link: the celse's title and the kit's hidden ", tamamlandı"  lesson-row.tsx:216 (default :189)
#   composed.VisitorPath.agendaStep      the title of an agenda step, a value the API gives                           course-page.tsx:560
#   composed.VisitorPath.sampleSource    a celse's `kaynak`, a value the API gives                                    course-page.tsx:571
#   composed.VisitorPath.resource        the name of a course resource, a value the API gives                         course-resources.tsx:89
#   composed.VisitorPath.recordingOpen   RecordingsTab.open and RecordingsTab.openLabel: the row link's aria-label    recordings-tab.tsx:297
#   composed.VisitorPath.provider        a recording host's name (RECORDING_PROVIDER_NAMES)                           recordings-model.ts:133
# Words the code does not take from the catalog and the graph keeps as `literal`: the breadcrumb's name "Sayfa yolu" is the kit's own
# default (CRS-12) and is said only in the binding's locators, never as a node.
# Samples are invented and neutral; the binding gives the seed's own titles where it needs the real ones.
