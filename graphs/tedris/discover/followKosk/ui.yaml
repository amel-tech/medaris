rules:
  - { id: DSC-01, rule: "the button is set `disabled` while the request is out (follow-button.tsx:59); the kit's rule (libs/ui/src/mds/button.tsx:29) is `loading`, so that focus survives. Seen in Chromium on the local stack (a one-off probe, not the replay): Enter on the focused button on Keşfet, and on the köşk page, leaves document.activeElement on <body> at the first sample (80 ms) and it stays there once the request has ended. The graph draws the button disabled in the four busy states and says nothing of the focus afterwards, because no node has it. Fix: `loading={pending}` with a loadingLabel" }
  - { id: DSC-02, rule: "the name flips between \"Takip et: X\" and \"Takip ediliyor: X\" and aria-pressed flips as well (follow-button.tsx:60-61), so a screen reader says the state twice (\"Takip ediliyor: X, toggle button, pressed\"). The graph draws two nodes by name; aria-pressed has no key on a button node. The e2e relies on both names. Fix: keep one name with aria-pressed, or drop aria-pressed, and update the e2e" }
  - { id: DSC-14, rule: "the two actions are awaited in startTransition with no try/catch (follow-button.tsx:41-53); a request that never reaches tedris rejects instead of drawing the failure toast. What the person sees is not verified and not drawn. Fix: catch and use the toast of a refusal" }
  - { id: DSC-20, rule: "the failure toast goes through Sonner, whose region keeps its English default name (\"Notifications alt+T\") and is polite although an error stays until it is closed (libs/ui/src/components/sonner.tsx:59-76); the close button is \"Kapat\" in every language. Fix: pass containerAriaLabel from the catalog and move the toast to the kit's own toaster" }
  - { id: F-5, rule: "POST /kosks/:id/follow checks that the köşk exists, not that it is shown (apps/tedrisat/src/kosk/kosk.service.ts:276; the guard's closure covers courses only), so a signed-in caller whose page was drawn before the köşk was hidden, or who keeps its id, can follow a köşk that answers 404 to them. The graph draws it as the stale card (world hidden): the follow succeeds and the card is gone after the refresh. Seen on the local stack on 15 Nov 2026 (a one-off API call and a Chromium probe, not the replay): GET /kosks/<id> answered 404 KOSK_NOT_FOUND to the talebe and POST /kosks/<id>/follow answered 201 true; pressing \"Takip et\" on the stale card made one POST (200), the card left the list at once with no toast, and the follow row was there. The domain records it as invariant kosk-hidden-cannot-be-followed (holds: false). Fix: run the same visibility check as GET /kosks/:id (assertMayOpenHidden) in the service" }
  - { id: FOLLOW-1, rule: "new, provisional id: success is silent. A follow or an unfollow that works draws no toast and no status, and the page is read again; what tells the person is the flipped name of the button, and the focus has left that button (DSC-01, seen in Chromium), so a keyboard or screen-reader user is told nothing and restarts from the top of the page. Read from the code (follow-button.tsx:47-52) and the DSC-01 probe; not tried with assistive technology. Fix: a polite status line, or keep the focus on the button by `loading`" }
  - { id: focus-not-set, rule: "neither page sets an initial focus (not verified in a browser), so the graph names none; after a follow the focus is on <body> (DSC-01), which the graph does not draw because no node has it" }
