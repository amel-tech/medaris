# The screens of tedris.discover.followKosk: the köşk's card on Keşfet, the head of the köşk's page, the follow button on both, and the toast
# of a refusal. The rest of both pages is another flow's (flow.yaml scope.outOfView).
# The words are copied from libs/i18n/src/locales/tr/tedris.json (keys kept, root removed) and common.json (common.*), by script, letter for
# letter. Three more kinds of entry, none of them in an i18n file:
#   composed.FollowButton.follow / .following   the button's accessible name, which the code builds from the two messages and the köşk's
#                                               name: `${shown ? labels.following : labels.follow}: ${koskName}` (follow-button.tsx:61)
#   composed.Kosk.name                          the köşk's own name, which the API gives: the card's link and the page's h1 (a value, not a message)
#   Changes.note                                the only entry not copied from the app: the app has no message that says what following does, so
#                                               this one factual sentence is written for `changes` (it names Ana sayfa's section, Home.followedTitle,
#                                               and that the follow can be stopped; both are what the code does)
