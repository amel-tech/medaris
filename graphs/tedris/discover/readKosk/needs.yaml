schema: delurio-graph/0
kind: needs
id: tedris.discover.readKosk
status: proposed
summary: >-
  What must exist for a person who opens a köşk's page: tedris.discover.readKosk. Each need is what the product must do, from the
  flow's story; none is read off what the page does today. No planned feature (P-nn) names this page.

needs:
  - id: read-without-an-account
    need: >-
      A person with no account reads who a köşk is, what it offers and who looks after it, and goes on to a course, without
      signing in; the page invites them to sign in or register when they want to apply, and does not offer what needs an account
      (following, the köşk's decks).
    evidence:
      - state: koskShown
      - node: invite
      - node: inviteSignIn
      - node: inviteRegister
      - source: apps/tedrisat/src/kosk/kosk.controller.ts:261
      - source: apps/tedrisat/src/course/course.controller.ts:152
      - source: apps/tedris/features/courses/components/kosk-page.tsx:135
      - test: apps/tedris/e2e/anonymous.e2e.ts
        name: "shows the köşk, its manager and its published courses, with no follow button and no decks"
      - test: apps/tedris/e2e/anonymous.e2e.ts
        name: "labels the course a medrese opened, and invites the visitor"
      - test: apps/tedris/e2e/anonymous.e2e.ts
        name: "opens a course from the köşk page without signing in"
      - scenario: visitor
    note: |-
      Also drawn as the assertion decks-are-for-the-signed-in.
      anonymous.e2e.ts anonymous#10 (a2-a4, a6, a7), anonymous#11 (a1, a2), anonymous#12
      visitor: the page, then the link "giriş yap" to Keycloak's authorization endpoint (--to sign_in_opened)

  - id: a-seat-is-worn-on-the-course
    need: >-
      A signed-in person sees, on each course of the köşk, whether they are in it, waiting to be, or have completed it, in words.
    evidence:
      - node: enrollmentBadge
      - source: apps/tedris/features/courses/madrasah-enrollment.ts:17
      - source: apps/tedris/features/courses/components/kosk-page.tsx:78
      - test: apps/tedris/e2e/discover.e2e.ts
        name: "badges the enrolled courses 'Devam ediyor' and the others not"
      - scenario: member
    note: |-
      discover.e2e.ts discover#15 (a1, a2)
      member: three "Devam ediyor" badges, counted against the API's own answer

  - id: a-person-reads-their-waiting-application
    need: A person whose application is still waiting reads "Onay bekliyor" on that course and is not shown the köşk's decks.
    evidence:
      - node: enrollmentBadge
      - node: decksSection
      - source: apps/tedris/features/courses/madrasah-enrollment.ts:27
    note: >-
      walked: nothing. The scenario `applicant` of the binding (applicantA applies to the course that asks for approval) is
      written and was not run in the writing phase; no e2e checks a PENDING badge on the köşk page.

  - id: each-course-says-who-opened-it-who-teaches-it-and-when
    need: >-
      Each course card names the medrese that opened it (as a way to that medrese), its hocas, whether it is in person, and its
      next celse or that none is planned.
    evidence:
      - node: madrasahLine
      - node: madrasahLink
      - node: inPersonBadge
      - node: hocaLine
      - node: nextSession
      - node: noNextSession
      - source: apps/tedris/features/courses/components/kosk-page.tsx:55
      - source: apps/tedris/features/courses/next-session.ts:7
      - test: apps/tedris/e2e/discover.e2e.ts
        name: "shows the köşk as the API has it, with its three published courses"
      - test: apps/tedris/e2e/discover.e2e.ts
        name: "names the medrese that opened a course, and the next session"
      - scenario: member
    note: |-
      discover.e2e.ts discover#14 (a1, a4), discover#16 (a1-a3, a5, a6)
      member: medrese line and link x2, hoca lines x3, next celse x3, no in-person label (counted against the API)

  - id: the-kosks-decks-are-for-the-kosks-people
    need: >-
      A person the köşk knows (a seat that is ENROLLED or COMPLETED, a hoca of one of its courses, its nazım) reads its decks and
      sees which are already in their collection; everybody else, a visitor included, sees no deck block and is not told that one
      exists.
    evidence:
      - node: decksSection
      - node: decksEmpty
      - node: deckLink
      - node: deckInCollection
      - source: apps/tedrisat/src/kosk/kosk.controller.ts:281
      - source: apps/tedris/features/courses/components/kosk-page.tsx:240
      - test: apps/tedris/e2e/discover.e2e.ts
        name: "shows the köşk's decks to its own talebe, with the collection mark"
      - test: apps/tedris/e2e/discover.e2e.ts
        name: "leaves the deck block out"
      - scenario: member
    note: |-
      Also drawn as the assertion decks-are-for-the-signed-in.
      discover.e2e.ts discover#17 (a1), discover#20 (a1, a2)
      id was the-köşks-decks-are-for-the-köşks-people (the format takes ASCII kebab-case)
      member: the block and "Bu köşkün henüz destesi yok." (the seed makes no köşk deck); the deck cards (`memberDecks`) are not
      walked

  - id: unlisted-by-link
    need: >-
      A köşk can be left out of every list and still be opened by its link by a signed-in person, who is told it is unlisted; a
      visitor who follows the link is told no such page exists, so that the köşk's existence is not given away.
    evidence:
      - state: koskShown
      - node: privateBadge
      - state: notFound
      - source: apps/tedrisat/src/kosk/kosk.controller.ts:261
      - source: apps/tedris/features/courses/components/kosk-page.tsx:172
      - scenario: visitorUnlisted
    note: |-
      Also drawn as the assertion unlisted-is-nobodys-for-a-visitor.
      visitorUnlisted: a visitor at the unlisted köşk's link meets the not-found page (--to notFound)
      The signed-in half (scenario `unlisted`: "Liste dışı", "Bu köşk henüz ders açmadı.", no deck block) is written and was not
      run: --to reaches a state by its shortest way and the visitor's is shorter. No e2e: discover#4 claims it in its title and
      does not assert it (the seed has no unlisted köşk).

  - id: no-such-kosk-says-so
    need: >-
      An address that no köşk has (an unknown or malformed id, a hidden köşk the person may not open) is answered as a page that
      does not exist, and offers the way home.
    evidence:
      - state: notFound
      - source: apps/tedris/app/not-found.tsx:5
      - test: apps/tedris/e2e/discover.e2e.ts
        name: "an unknown köşk is the not-found state"
      - test: apps/tedris/e2e/anonymous.e2e.ts
        name: "answers a köşk that does not exist with the not-found page"
      - scenario: visitorUnlisted
    note: |-
      Also drawn as the assertion not-found-only-for-no-such-kosk.
      visitorUnlisted: the same page, reached by the link of an unlisted köşk; the scenario `unknownId` (an address no köşk has)
      is not run

  - id: a-failed-read-is-not-a-missing-page
    need: >-
      When the köşk or its courses cannot be read, the person is told so and offered another try; they are never told the page
      does not exist, and a shelf that could not be read is never shown as empty.
    evidence:
      - state: loadFailed
      - node: loadFailedAlert
      - node: retry
      - source: apps/tedris/features/courses/components/kosk-page.tsx:293
      - source: apps/tedris/features/courses/actions/index.ts:51
    note: |-
      Also drawn as the assertion failed-box-only-after-a-failed-read, the assertion a-failed-shelf-is-not-an-empty-one, the
      assertion an-unreadable-kosk-is-not-a-missing-one.
      walked: nothing. No e2e makes tedrisat fail and the stack has no way to; the failed-read box has no unit spec either.

  - id: the-way-on-to-a-course
    need: From a course card a person, a visitor included, opens that course.
    evidence:
      - node: courseLink
      - state: course_opened
      - source: apps/tedris/features/courses/components/kosk-page.tsx:75
      - test: apps/tedris/e2e/anonymous.e2e.ts
        name: "opens a course from the köşk page without signing in"
      - scenario: member
    note: "member: \"Bina ve İzhar Şerhi\"'s title, the first card, to /courses/<id>"

  - id: the-way-on-to-a-medrese
    need: From the medrese named on a course card a person opens that medrese's page.
    evidence:
      - node: madrasahLink
      - state: madrasah_opened
      - source: apps/tedris/features/courses/components/kosk-page.tsx:116
    note: >-
      walked: nothing. The link is found and counted by the main story; no walk presses it and no e2e follows it (discover#16
      asserts only that it is visible).

  - id: the-way-on-to-a-deck
    need: From a deck card a person the köşk knows opens that deck.
    evidence:
      - node: deckLink
      - state: deck_opened
      - source: apps/tedris/features/courses/components/kosk-page.tsx:259
    note: "walked: nothing. The seed makes no köşk deck and no helper does."

  - id: follow-from-the-page
    need: A signed-in person follows the köşk from its page, sees that they do, and the choice holds after a reload.
    evidence:
      - node: followButton
      - source: apps/tedrisat/src/kosk/kosk.controller.ts:470
      - source: apps/tedris/features/courses/components/kosk-page.tsx:183
      - test: apps/tedris/e2e/discover.e2e.ts
        name: "the follow state is kept after a reload"
      - scenario: member
    note: |-
      discover#18: carried by tedris.discover.followKosk, which the transition FOLLOW starts
      member: the button is found, enabled and named; it is not pressed here

  - id: the-manager-is-named-and-not-identified
    need: The page names the köşk's nazım, so the person knows who looks after it, and gives no person's id to the browser.
    evidence:
      - node: managerLine
      - source: apps/tedris/features/courses/components/kosk-page.tsx:176
      - test: apps/tedris/e2e/anonymous.e2e.ts
        name: "names the manager and hides who they are"
      - scenario: member
    note: |-
      anonymous.e2e.ts anonymous#18 (a2, a3: the API, for a visitor; not a browser check)
      member: the line reads the API's own managerName; effect getKosk reads what the same reader was answered, without the ids

  - id: kosk-ids-of-people-stay-off-reads
    need: >-
      Nothing but a name of a köşk's creator or nazım reaches a caller of the public köşk reads, whoever they are; the ids are
      given where a page needs them.
    missing: >-
      F-4: tedrisat answers a signed-in caller ownerId and managerIds on GET /kosks and GET /kosks/{id}; this page does not use or
      ship them (flow header); no Linear issue
    note: >-
      Drawn on the node managerLine, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).

  - id: failed-read-box-has-a-heading-and-a-way-back
    need: When the köşk cannot be read, the page still has a heading and a way back to Keşfet.
    missing: DSC-09 a, no Linear issue
    note: >-
      Drawn on the state loadFailed and on the node loadFailedPage, which the code has: they are not evidence, so that a replay
      still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: cover-label-is-not-read-aloud
    need: A course's decorative cover is not read to a screen-reader user as if it were text.
    missing: DSC-12, no Linear issue
    note: >-
      Drawn on the node courseHeading, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).

  - id: loading-says-so
    need: While the page loads, a person using a screen reader is told that it is loading.
    missing: DSC-19, no Linear issue
    note: >-
      Drawn on the node koskPage, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves
      out what only missing needs name).

  - id: not-found-has-a-main
    need: The page that says there is no such köşk has a main landmark, as every other page of the app has.
    missing: READKOSK-1, proposed; no Linear issue
    note: >-
      Drawn on the state notFound and on the node notFoundSection, which the code has: they are not evidence, so that a replay
      still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: nazim-sees-which-course-is-a-draft
    need: >-
      The köşk's nazım, whose shelf also holds the köşk's draft courses, can tell which card is a draft, and the count agrees with
      the shelf.
    missing: decision D1 of the flow; no Linear issue
    note: >-
      Drawn on the state koskShown and on the node courseCount, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).
