# The screens of tedris.discover.readKosk: tedris-web's köşk page (/kosks/<id>, features/courses/components/kosk-page.tsx) for a visitor, a
# stranger, an applicant and a member; the not-found page it can become (app/not-found.tsx) and the failed-read box (KoskLoadError).
# Only this address's nodes are drawn; the bar and the footer belong to tedris.shell.frame.
#
# Words: every `KoskPage.*`, `AnonymousInvite.*` and `SystemPages.*` key is copied by script from libs/i18n/src/locales/tr/tedris.json (the
# app reads it as `tedris.KoskPage` and so on), the key being the path inside that file. `AnonymousInvite.apply` keeps its two tags
# (<signIn>, <register>): the app turns them into the two links, and the binding finds the sentence by a pattern. The `composed.*` keys
# are NOT in any i18n file: they are the texts the app builds in code from messages and data, written with their placeholders so a
# replay can match them (a placeholder with no sample in the binding matches any text):
#   composed.KoskPage.breadcrumbLabel     "Sayfa yolu": the kit's default label (libs/ui/src/mds/breadcrumb.tsx:19); the page passes none
#   composed.KoskPage.koskName            the köşk's name, as the API gives it (kosk-page.tsx:157,166)
#   composed.KoskPage.description         its description, as given (kosk-page.tsx:199)
#   composed.KoskPage.followLabel         "<KoskPage.follow>: <köşk>", the button's aria-label (follow-button.tsx:61)
#   composed.KoskPage.followingLabel      "<KoskPage.following>: <köşk>", the same once it is followed
#   composed.KoskPage.courseTitle         a course's title (kosk-page.tsx:76)
#   composed.KoskPage.madrasahName        the medrese's name in the link (kosk-page.tsx:116-118)
#   composed.KoskPage.madrasahLine        "<medrese> <KoskPage.madrasahCourse>": the link and the word after it, one line (kosk-page.tsx:112-121)
#   composed.KoskPage.hocaLine            the hocas' names with their unvan, joined (muderrisLine, kosk-page.tsx:38-53; formatHocaName of @medaris/utils)
#   composed.KoskPage.nextSessionLine     "<KoskPage.nextSession> <weekday and clock>" (kosk-page.tsx:95-99; formatNextSession, next-session.ts:7-21)
#   composed.KoskPage.deckTitle           a deck's title (kosk-page.tsx:263)
#   composed.KoskPage.deckMetaLine        "<KoskPage.deckMeta>·<KoskPage.cardsCount>": two messages and a hidden separator (kosk-page.tsx:272-278)
#   composed.AnonymousInvite.applySignIn / applyRegister   the two chunks of AnonymousInvite.apply between its tags
# Samples are invented and neutral.
schema: delurio-graph/0
kind: ui
