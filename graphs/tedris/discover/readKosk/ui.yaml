  hocaLine: { type: text, component: Text, text: { key: composed.KoskPage.hocaLine, params: { hocas: course.hocas } }, in: [koskShown], when: hasCourses, repeat: courses, source: apps/tedris/features/courses/components/kosk-page.tsx:123 } # the unvan of this course before each name; the imam's star only among more than one hoca (out of view)
