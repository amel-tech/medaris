rules:
  - { id: F-4, rule: "tedrisat answers a signed-in caller on GET /kosks/{id} with the creator's id (ownerId) and every nazım's id (managerIds) (kosk.controller.ts:261; anonymous-mask.ts:13 masks them only for a caller with no token): the domain's invariant kosk-person-ids-stay-off-public-reads holds: false. This page does not show or ship them: it renders managerName only, and the served HTML (document and RSC payload) for a visitor, a stranger and a member contains neither the creator's nor the nazım's id (looked for by value, 15 Nov 2026), because KoskPage runs on the server and FollowButton, the only client component, is handed the id, the name and the flag. The leak is the API's; the fix is there: mask ownerId and managerIds for every caller of the public reads. The binding's effect getKosk reads the same answer the page read." }
  - { id: DSC-09, rule: "The failed-read box has no heading (its title is a <p> inside the Alert) and its breadcrumb is given one item, which Breadcrumb draws as nothing (libs/ui/src/mds/breadcrumb.tsx:22), so the page is an alert, a link and no way back but the bar (kosk-page.tsx:293-310). Fix: draw an h1 and a two-item breadcrumb." }
  - { id: DSC-12, rule: "A course card's cover is not hidden and prints the course's Arabic label as a <p> before the card's title when the course has a coverLabel (cover-pattern.tsx:76-84, kosk-page.tsx:77); a screen reader reads an unexplained Arabic word before the course. The seeded courses have no label, so the replay does not meet it. Fix: pass aria-hidden to the media cover." }
  - { id: DSC-19, rule: "app/kosks/[koskId]/loading.tsx is a <main aria-busy> of aria-hidden skeletons with no text, so nothing says the page is loading; aria-busy is not announced. Not drawn: the reads are too quick for a replay to stop on it. Fix: add a visually hidden \"Yükleniyor\" status." }
  - { id: READKOSK-1, rule: "The not-found state of this address has no <main> landmark: /kosks is in tab-view's ownsItsMain list (components/tab-view/index.tsx:12-22), so the shell leaves its <main> off, and NotFoundState draws a <section> (SystemState shell, system-page.tsx:49). Served page of /kosks/<unknown>: no <main> at all (the same for /madrasahs/<unknown>); an unknown top-level address is wrapped in the legacy <main>. Proposed id; not in the inventory. Fix: give NotFoundState a <main> when it is not inside one, or leave the wrapper on for the not-found boundary." }
  - { id: focus-not-set, rule: "The köşk page sets no initial focus (no autoFocus and no focus() in kosk-page.tsx), so the page node has no `initialFocus` and the graph says nothing of the focus when the page opens. Recorded so the silence is not read as an omission; the inventory does not call it a finding." }
  - { id: label-in-name, rule: "the follow button's visible text (\"Takip et\" or \"Takip ediliyor\") is contained in its accessible name (\"Takip et: <köşk>\"), as WCAG 2.5.3 asks" }
  - { id: badge-with-text, rule: "a seat's badge says it in words (\"Devam ediyor\", \"Onay bekliyor\", \"Tamamlandı\"); the colour and the clock icon of the waiting one are not the only sign" }
  - { id: unlisted-by-link, rule: "an unlisted köşk opens by its link for a signed-in person and is marked \"Liste dışı\"; for a visitor the same link is the not-found page, and the browser tab's title is \"Tedris\" for everyone, because the metadata is read with no token (public-reads.ts:57, intro-metadata.ts:26)" }
