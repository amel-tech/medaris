  # --- Yaklaşan ------------------------------------------------------------------------------------------------------------------------
  comingRegion: { type: page, component: Page, role: region, name: { labelledBy: comingTitle }, in: [listed], when: "comingGroup == 'some'", source: apps/tedris/features/online-exams/components/my-exams-page.tsx:79 }
  comingTitle: { type: text, component: Heading, role: heading, text: { key: MyExams.groupComing }, in: [listed], when: "comingGroup == 'some'", source: apps/tedris/features/online-exams/components/my-exams-page.tsx:84 } # h2
