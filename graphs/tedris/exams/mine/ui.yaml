  comingFormat: { type: text, component: Text, text: { oneOf: [MyExams.formatMultipleChoice, MyExams.formatWritten, MyExams.formatOral] }, in: [listed], when: "comingGroup == 'some'", repeat: exams.coming, source: apps/tedris/features/online-exams/components/my-exams-page.tsx:143 }
