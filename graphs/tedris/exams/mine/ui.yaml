# The screens of tedris.exams.mine: tedris-web's Sınavlarım (/my-exams, app/my-exams/page.tsx and
# features/online-exams/components/my-exams-page.tsx, with the pure rules of my-exams-model.ts) as a signed-in talebe meets it: the exams
# of their courses in up to three groups, the sentence for none, and the box for a failed read. The page is drawn on the server and is
# made of links, so it is read and followed without JavaScript. The chrome around it (the wide bar, the phone sheet) is
# tedris.shell.frame's; only the menu entry "Sınavlarım" is drawn here.
#
# Words: every `MyExams.*` key is copied from libs/i18n/src/locales/tr/tedris-learn.json (the app reads it as
# `tedrisLearn.MyExams.<key>`), and `PhoneMenu.exams` from tedris.json; the key is the path inside the file. The `composed.MyExams.*` keys
# are NOT in any i18n file: they are values the API gives, shown alone, written with their placeholder so a replay can match them:
#   composed.MyExams.course   the exam's course, a caption with dir=auto                                     (my-exams-page.tsx:136-138)
#   composed.MyExams.title    the exam's title, the row's h3 with dir=auto                                   (my-exams-page.tsx:140-142)
# `zone` is zoneLabel of the talebe's time zone (features/courses/session-model.ts), and every time on the page is Intl's medium date
# and short time in that zone (my-exams-page.tsx:46-51); `score` is scoreText (my-exams-model.ts:72), `max` the exam's maxScore or 100.
# The rows of a group come in the API's order (my-exams-model.ts:18-26); a group with no exam is not drawn.
schema: delurio-graph/0
kind: ui
id: tedris.exams.mine
flow: tedris.exams.mine
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples:
  zone: İstanbul
  course: Fıkıh Usulü
  title: Ara sınav
  minutes: "60"
  count: "50"
  until: 24 Kas 2026 22:10
  when: 28 Kas 2026 20:00
  place: Çevrimiçi
  score: "86,5"
  max: "100"

