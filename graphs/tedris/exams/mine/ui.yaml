rules:
  - { id: EXM-MINE-1, rule: "A written or oral exam leaves \"Yaklaşan\" the moment its celse starts: from then it is \"Geçmiş\", says \"Sonuç henüz açıklanmadı\" and links to Notlarım, while the celse is still running and to a talebe who did not attend (domain/my-exams.ts:95-97 in apps/tedrisat/src/online-exam, my-exams-model.ts:63-65). Fix: keep it coming, or open, until its celse ends. Read from the code, not seen." }
  - { id: EXM-MINE-2, rule: "The empty state puts two <p> inside the EmptyState's own <p class=mds-empty__text> (my-exams-page.tsx:73-76, libs/ui/src/mds/empty-state.tsx:20): a <p> cannot hold a <p>, so the browser's parser closes the outer one and React's hydration fails. Read from the code, and seen on the stack (24 Nov 2026): the walk of a talebe with no exam gets the page error 'Hydration failed because the server rendered HTML didn't match the client' on /my-exams, and React draws the page again in the browser. Fix: pass the sentence as children and the hint beside it, or a fragment of spans." }
  - { id: EXM-MINE-3, rule: "An exam in progress shows its earliest start alone, with no word beside it (heldAt is \"{when}\"; my-exams-page.tsx:154-158), where an open one says \"En geç … başlanabilir\" and a coming one \"… tarihinde açılır\". Fix: say what the time is, or show the latest start. Read from the code, not seen." }
  - { id: EXM-MINE-focus, rule: "The page sets no initial focus (no autoFocus and no focus() in my-exams-page.tsx), so the page node has no `initialFocus`; the browser's own focus after a load was not seen." }
  - { id: state-in-words, rule: "Each row says its format in a word (a Badge) and, where it has one, its standing in a sentence: \"Devam ediyor\", \"Sonuç henüz açıklanmadı\", \"Girmedin\", the score, \"Sonuç açıklandı\". An open exam not started and a coming one have no standing line; their time line says it (\"En geç … başlanabilir\", \"… tarihinde açılır\")." }
  - { id: one-action-per-row, rule: "A row has at most one link, named by its course and title (Notlarım by its course alone), so a list of links read alone says which exam each opens (my-exams-page.tsx:166-180). They are links drawn as buttons: Sınava gir and Devam et primary, the rest secondary." }
  - { id: never-a-draft, rule: "A draft online exam is never a row, nor a cancelled or hidden celse: listMyExams does not send them (apps/tedrisat/src/online-exam/my-exams.controller.ts:41)." }
