  comingWhen: { type: text, component: Text, text: { key: MyExams.opensAt, params: { when: row.when } }, in: [listed], when: "comingGroup == 'some'", repeat: exams.coming, source: apps/tedris/features/online-exams/components/my-exams-page.tsx:155 }
  comingPlace: { type: text, component: Text, text: { key: MyExams.place, params: { place: row.place } }, in: [listed], when: "comingGroup == 'some' and writtenOrOral == 'some'", repeat: exams.coming.writtenOrOralWithPlace, source: apps/tedris/features/online-exams/components/my-exams-page.tsx:162 }
  viewLink: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: MyExams.viewLabel, params: { course: row.course, title: row.title } }, text: { key: MyExams.view }, in: [listed], when: "comingGroup == 'some'", repeat: exams.coming.online, emits: ENTER, source: apps/tedris/features/online-exams/components/my-exams-page.tsx:168 } # a coming written or oral exam has no link

  # --- Geçmiş --------------------------------------------------------------------------------------------------------------------------
