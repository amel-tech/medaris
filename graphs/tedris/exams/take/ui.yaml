# The screens of tedris.exams.take: the online exam's own page in tedris-web (/courses/<id>/lessons/<id>/sinav, the server page
# app/courses/[courseId]/lessons/[lessonId]/sinav/page.tsx and the client component features/online-exams/components/exam-take.tsx),
# from "Bilmeniz gerekenler" and the zeroth question to "Sınav bitti". The celse's layout (lessons/[lessonId]/layout.tsx) settles that the
# celse exists for the caller and mounts the toast host; the phone's top bar is tedris.shell.frame's. While resuming, rereading and
# timeUp run, the page shows what it showed before them, and the graph names no node there.
#
# Words: every `OnlineExam.*` key is copied from libs/i18n/src/locales/tr/tedris-learn.json (the app reads it as
# `tedrisLearn.OnlineExam.<key>`); the key is the path inside the file. `changes` borrows the app's own sentence that says what the
# flow changes (OnlineExam.factSaved), as the app has no message for it. The `composed.*` keys are NOT in any i18n file:
#   composed.OnlineExam.course          the exam's course, a value the API gives                                    (exam-take.tsx:818)
#   composed.OnlineExam.title           the exam's title, the briefing's h1                                          (exam-take.tsx:819-821)
#   composed.OnlineExam.instructions    the team's own words, pre-line                                               (exam-take.tsx:853-855)
#   composed.OnlineExam.zerothQuestion  the preparer's zeroth question, the legend of its options                    (exam-take.tsx:873)
#   composed.OnlineExam.option          an option's text, the label of its radio or check box                        (exam-take.tsx:677, 698, 878)
#   composed.OnlineExam.question        the question's text, the card's h1                                           (exam-take.tsx:664-670)
#   composed.OnlineExam.timeLeft        the countdown, clockText ("23:41", "1:02:05")                                (take-model.ts:29)
#   composed.OnlineExam.number          a question's number in the list                                              (exam-take.tsx:759)
#   composed.Button.loading             the default loadingLabel of a busy Button                                    (libs/ui/src/mds/button.tsx:62)
#   composed.AlertDialog.close          the dialog's close icon, a literal of the kit                                (libs/ui/src/mds/alert-dialog.tsx:50)
#   composed.Toast.close                a toast's close button, a literal aria-label of the kit                      (libs/ui/src/mds/toast.tsx:97)
# A− and A+ are literals of exam-take.tsx (:651, :660). Times are Intl in the browser's own zone (:129-137; rule EXM-TAKE-11). The
# toasts are the kit's (libs/ui/src/mds/toast.tsx): each a dialog, an error one an alertdialog that stays until closed. Not drawn:
# the warning toast "Medaris güncellendi" after a zeroth answer or a start on a stale page (:152-159), and the toast a refused resume
# gives (:229).
