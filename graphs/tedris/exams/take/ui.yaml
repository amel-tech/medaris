rules:
  - { id: EXM-TAKE-1, rule: "A lost connection is left only on the browser's own 'online' event (exam-take.tsx:421-426): a 5xx, or one dropped call while the browser stays online, leaves 'Bağlantı koptu' up and the countdown and the clock's calls stopped (:326) with nothing to press, while choices are still saved; the attempt never runs out of time until a reload. Fix: retry the resume on a timer, or on the next save that gets through, and offer a button. Read from the code, not seen." }
  - { id: EXM-TAKE-2, rule: "Nothing waits for a save: Önceki, Sonraki, Soruyu atla, the list and Sınavı bitir stay on while it runs (exam-take.tsx:703-723), and Bitir ends the attempt at once (:472-475). A Bitir pressed right after a choice can reach the server first; the save is then refused with ATTEMPT_ENDED and that last answer is lost. Fix: wait for the pending saves (pending > 0) before finishExamAttempt, or send them with it. Read from the code, not seen." }
  - { id: EXM-TAKE-3, rule: "A save the server refuses for another reason than the connection (ANSWER_INVALID, QUESTION_NOT_FOUND) gives only the toast 'Bir şeyler ters gitti…' (exam-take.tsx:229, :259); the choice stays drawn as chosen and the list says 'Cevaplandı', though the server does not hold it. Fix: put the question back as the server holds it, and say at the question that it is not saved. Read from the code, not seen." }
  - { id: EXM-TAKE-4, rule: "After a call refused with ATTEMPT_ENDED or ATTEMPT_NOT_FOUND the page re-reads the briefing and opens 'Sınav bitti' only when that read succeeds (exam-take.tsx:203-210, :221-223); when the read fails nothing on the page changes, the question stays usable and nothing says the exam has ended. Fix: end the page as timeUp does, with 'Sınavın kaydedilen cevaplarla bitti.'. Read from the code, not seen." }
  - { id: EXM-TAKE-5, rule: "'Son 5 dakika' is a span inside the countdown's role=timer element (exam-take.tsx:582-595); a timer is not a live region, so a screen reader is not told when five minutes are left, and the red is the only change it does not hear. Fix: a polite status, outside the timer, that says it once. Read from the code, not seen." }
  - { id: EXM-TAKE-6, rule: "Before the earliest start the page is one alert with no exam title, no course and no link (exam-take.tsx:790-800), and nothing moves it on when the start comes: the talebe has to reload; the same for 'Başlama süresi geçti' (:802-808). Fix: show the title and course, a way back to the celse, and switch to the briefing at the start. Read from the code, not seen." }
  - { id: EXM-TAKE-7, rule: "'{unanswered} soru cevapsız, {skipped} soru atlandı' counts the skipped questions in both numbers (exam-take.tsx:510-515: unanswered is every question not answered), so 3 and 2 means 3 questions, not 5. Fix: count unanswered without the skipped ones, or say 'bunların 2'si atlandı'. Read from the code, not seen." }
  - { id: EXM-TAKE-8, rule: "'Soruyu atla' on an answered question takes the answer back without a word (exam-take.tsx:535-540), and after the last question Sonraki goes to the first skipped one and from there to the next question in order, answered or not, not to the next skipped one (take-model.ts:55-65), where the briefing says the skipped ones come back. Fix: skip without erasing, and walk the skipped ones in turn. Read from the code, not seen." }
  - { id: EXM-TAKE-9, rule: "The options' radio group and fieldset are named 'Şıklar' (optionsLegend, exam-take.tsx:673, :693), not by the question, so a screen reader entering the group hears 'Şıklar' and not what is asked; the question's h1 labels its section only. Fix: aria-labelledby the question's h1. Read from the code, not seen." }
  - { id: EXM-TAKE-10, rule: "No code moves the focus (no focus() or autoFocus in exam-take.tsx): after Sınava başla the button that had it is gone and the focus falls to the document; after Önceki, Sonraki, Soruyu atla or a pick in the list it stays on the button, and the new question is not read; the screens Sınav bitti and 'Sınav başka bir yerde açık' replace the page under the focus. The hint under Sınava başla is not tied to it (no aria-describedby). Fix: focus the question's h1 on every move, and the end screen's h1. Read from the code, not seen." }
  - { id: EXM-TAKE-11, rule: "The page writes times in the browser's own zone (Intl with no timeZone, exam-take.tsx:129-137), and the client component is first drawn on the server, in the server's zone; Sınavlarım writes them in the talebe's configured zone and names it (my-exams-page.tsx:45-59). The two pages can give one exam two times, and the first paint can differ from the hydrated one. Fix: pass the talebe's time zone, as Sınavlarım does. Read from the code, not seen." }
  - { id: EXM-TAKE-12, rule: "A read the API refuses with 401 is drawn as 'Sınav okunamadı. Bağlantını kontrol edip sayfayı yeniden aç.' (reads.ts:32-39), not sent to sign in as Sınavlarım's reads are (my-reads.ts, reauthIfRefused). Verified in the code: a signed-out visitor never gets here, as /courses/<id>/lessons/<id>/sinav is not a public path and the proxy sends them to sign in (lib/public-paths.ts:21-32). Not verified: a session whose token tedrisat refuses, which is what reaches this line. Fix: reauthIfRefused before deciding. Read from the code, not seen." }
  - { id: EXM-TAKE-13, rule: "Two quick choices of the zeroth question are two calls with no count (exam-take.tsx:428-446, answerZerothQuestion takes the option only), so the server keeps whichever arrives last while the page shows the last one chosen, and a failure of the first after the second puts the page back to the choice before both. Fix: a seq, as saveExamAnswer has. Read from the code, not seen." }
  - { id: list-colours, rule: "The list's numbers are plain when unanswered, blue (the info bold fill) when answered and dark yellow (the warning bold fill) when skipped, set inline (exam-take.tsx:88-107); the one shown has a brand ring and aria-current=step, and each number's name says its state in words ('12. soru, Cevaplandı'), so colour is not the only cue. The owner, 22 Nov: \"cevap verilmemiş sorular düz olsun, cevap verilmiş sorular mavi olsun, atlanan sorular koyu sarı kalsın\"." }
  - { id: text-size, rule: "A− and A+ zoom the whole exam area (the bar, the question, its buttons and the list) in four steps, 100, 115, 130 and 150 %, widening it at each step and spanning the screen at the largest (exam-take.tsx:545-577); the step is kept in the tab (sessionStorage, take-model.ts:100-127), and the smallest and the largest disable their button. The steps are my choice (#421)." }
  - { id: away-counts, rule: "A switch is counted on the way back when the page was hidden (another tab) or its window lost the focus (another window or application), for two seconds or more (exam-take.tsx:374-418, #425); one away period is one switch, and a toast says it was counted." }
  - { id: new-version, rule: "A save, a clock count or a resume whose server action is gone after a new version of Medaris was deployed shows 'Medaris güncellendi' with 'Sayfayı yenile' in place of the connection alert (exam-take.tsx:612-620); the choices not yet taken are kept in the tab and sent once the attempt is taken back after the reload (take-model.ts:129-162, #429)." }
  - { id: arabic-runs, rule: "A question or an option whose text is Arabic gets lang=ar, dir=rtl, the Arabic face at 1rem or more and its leading on its own element (arabic.ts, textProps); the hadith gets lang=ar dir=rtl and the Arabic class (exam-take.tsx:868)." }
  - { id: the-key-stays-on-the-server, rule: "Nothing the page holds says which options are correct or what an answer scores: the server sends the options in the talebe's own order and scores the exam at the end (getExamBriefing, startExamAttempt, invariant online-exam-correct-options-stay-hidden)." }
  - { id: list-under-the-card, rule: "The list Sorular is a nav under the question card on every screen width; there is no button for it on a phone (exam-take.tsx:728-765)." }
