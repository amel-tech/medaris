# A talebe takes an online multiple-choice exam in tedris-web: the briefing ("Bilmeniz gerekenler") with the zeroth question, the
# questions, the countdown, the question list, skipping, finishing, and what a lost connection, a switch to another tab or window and a
# new version of Medaris do. Written from the code (captured): apps/tedris/app/courses/[courseId]/lessons/[lessonId]/sinav/page.tsx with
# features/online-exams/components/exam-take.tsx and take-model.ts (MDRS-299, PR #416 and its follow-ups #418, #421, #425, #429); its
# server steps are the actions of domain/online-exams.yaml.
#
# The server steps: the page reads the exam (getExamBriefing), saves the zeroth answer (answerZerothQuestion), starts the attempt
# (startExamAttempt) or takes it over where it stopped (resumeExamAttempt), saves every answer (saveExamAnswer), counts a switch
# (recordTabSwitch) and ends it (finishExamAttempt). The clock is the server's: the page calls tickExamClock every 10 s while it holds the
# attempt and the connection is up, and its answers are the events FIVE_MINUTES_LEFT, TIME_UP and MOVED_ELSEWHERE. Önceki, Sonraki and a pick
# in the list move on the page only; a choice and a skip are saved.
#
# The owner's words this flow carries:
#   - 21 Nov: "çoktan seçmeli, soru ve cevap sıraları karışık olacak her talebe için"; "sınav sırasında talebe koparsa kaldığı yerden devam
#     edecek"; "sınav ekranında geri sayım olacak, son 5 dk kala geri sayım mesela kırmızı olacak"; "her soruda cevap seçildiğinde ilerle
#     geri git dendiğinde otomatik kaydolacak cevap, verilen cevap kabul edilecek"; "sınava girerken talebeye 'bilmeniz gerekenler'
#     ekranı gösterilecek"; "soruların indicator'ü olabilir solda veya sağda falan, istediği soruya geri dönebilir"; "soruyu atla
#     seçeneği olacak, son soruya gelindiğinde atlanan sorulara dönülecek"; "en son sınavı bitir butonuyla sınav bitecek"; the zeroth
#     question, "'bizi aldatan bizden değildir' hadisi hakkında soru olacak … doğru yanlış cevabı olan bi soru değil".
#   - The clock stops while the connection is lost: "talebeye güvenilecek burada, böyle bi yolla kandırırsa Allah Teâlâ'ya hesap verir".
#   - A switch is only counted (22 Nov, relayed from those who asked for exams; D1, answered): "tab değiştirme meselesinde sıfırlanıp
#     baştan başlamayacak, sadece tab değişikliğini sayacağız". The first draft started the exam again; that is gone. Another window
#     taking the focus counts too, once the page has been away two seconds (his report "başka ekranlara geçtim sekme değiştirmedim ama
#     saymamış" led to it, #425; the two seconds are my choice).
#   - The indicators: "cevaplanmamışsa sarı olsun, atlanmışsa turuncu olsun, cevaplanmışsa beyaz/dark olsun" (22 Nov), then "cevap
#     verilmemiş sorular düz olsun, cevap verilmiş sorular mavi olsun, atlanan sorular koyu sarı kalsın" (#435): plain, the info bold
#     fill and the warning bold fill (the design system has no orange).
#   - Arabic and the text size: "arapça font boyutu küçük kalıyor … 1 rem yapalım. bir de sınav sırasında soruların bi yerine yazı boyutu
#     büyütme küçültme butonu ekleyelim. sınav öncesi bilmeniz gerekenler listesinde bu yazsın butonların neye benzediğini de göstersin"
#     (22 Nov): A− and A+ in the question's header, four steps (100, 115, 130, 150 %, my choice), kept in the tab; the briefing draws them.
#   - The hadith: "Böyle kalsın", with no source line (22 Nov).
#
# Choices made in the code that are not his: the zeroth answer cannot change after the start (ZEROTH_ANSWER_LOCKED); "Sınavı bitir" on
# an attempt that has already ended answers how it ended; an attempt whose page never comes back stays in progress until the team closes
# the exam early (the clock runs only while the page calls); a new version of Medaris during the exam says "Medaris güncellendi" and keeps
# the unsent choices in the tab, sent after the reload (#429); a choice shows at once and is saved in the background, and nothing waits
# for a save; "Soruyu atla" takes back a choice made on the question.
schema: delurio-graph/0
kind: flow
id: tedris.exams.take
status: captured
domain: medaris.api
ui: tedris.exams.take
title: Take an online exam
summary: >-
  A talebe who holds a seat in the exam's course opens an exam between its earliest and its latest start. "Bilmeniz gerekenler"
  says how long it lasts, how many questions it has, that every answer is saved when it is chosen, that a lost connection resumes
  where it stopped with the clock stopped meanwhile, and that a switch to another tab or window is counted for the team. Under it
  stands the zeroth question, about the hadith "Bizi aldatan bizden değildir", which has to be answered before "Sınava başla" starts
  the clock. The talebe gets the questions, and each question's options, in an order of their own. A countdown is always on the
  screen and turns red, and says so, in the last five minutes. The list of the questions under the question card takes the talebe
  to any of them. "Soruyu atla" leaves a question for later, and after the last question the skipped ones
  come back. Every choice is saved at once; there is no "send". "Sınavı bitir" asks once and ends the exam; the time running out ends
  it as well, with the answers saved so far.
scope:
  shows: the exam's own page in tedris-web, from the briefing to the end screen
  world: open
  outOfView: [the list it is entered from (tedris.exams.mine), the result (tedris.exams.result)]
context:
  read:
    values: [ok, gone, failed]
    initial: any
    say:
      ok: the briefing is read
      gone: the briefing is refused with 404 or 403
      failed: the briefing cannot be read for another reason
  window:
    values: [before, open, closed]
    initial: any
    say:
      before: the earliest start has not come yet
      open: it is between the earliest and the latest start
      closed: the latest start has passed
  attempt:
    values: [none, inProgress, finished]
    initial: any
    say:
      none: the talebe has not started the exam
      inProgress: the talebe started the exam and has not finished it
      finished: the talebe finished the exam, or its time ran out
  zeroth:
    values: [unanswered, answered]
    initial: unanswered
    say:
      unanswered: the zeroth question is not answered
      answered: the zeroth question is answered
  instructions:
    values: [none, some]
    initial: any
    say:
      none: the team wrote no instructions of its own
      some: the team wrote instructions, read in the briefing
  mode:
    values: [single, multiple]
    initial: any
    say:
      single: the question shown is answered with radio buttons (one choice)
      multiple: the question shown is answered with check boxes (any number of marks)
  position:
    values: [inside, first, last]
    initial: any
    say:
      inside: the question shown is neither the first nor the last one of the talebe's order
      first: the question shown is the first one of the talebe's order
      last: the question shown is the last one of the talebe's order
  length:
    values: [more, two]
    initial: any
    say:
      more: the exam has three questions or more, so a step from the first or the last lands inside the order
      two: the exam has two questions, so a step from the first lands on the last and back
  textSize:
    values: [s100, s115, s130, s150]
    initial: s100
    say:
      s100: the exam is drawn at 100 %, where A− is off (a new tab)
      s115: the exam is drawn at 115 %
      s130: the exam is drawn at 130 %
      s150: the exam is drawn at 150 % and spans the screen, where A+ is off
  connection:
    values: [up, lost]
    initial: up
    say:
      up: the page's calls get through
      lost: a call got no answer or a 5xx; the page says so over the question, and the clock stops
  resumeFrom:
    values: [briefing, question, elsewhere]
    initial: briefing
    say:
      briefing: the resume was asked as the page opened, with the briefing drawn
      question: the resume was asked from the question, the connection being back
      elsewhere: the resume was asked from "Sınav başka bir yerde açık"
  version:
    values: [current, stale]
    initial: any
    say:
      current: the page is Medaris's current version
      stale: a new version of Medaris was deployed while the page was open, so its server actions are gone
  skipped:
    values: [none, some]
    initial: any
    say:
      none: no question but the one shown is skipped
      some: a question other than the one shown is skipped and still unanswered (Sonraki brings it back after the last)
  clock:
    values: [running, lastFive]
    initial: running
    say:
      running: more than five minutes are left
      lastFive: five minutes or less are left
  notice:
    values: [none, resumed, skippedFollow, notSaved, zerothRefused]
    initial: none
    say:
      none: the page shows no line of its own
      resumed: a line under the bar says the exam goes on where it stopped
      skippedFollow: a line under the bar says the skipped questions follow, and how many
      notSaved: the zeroth question says its answer could not be saved
      zerothRefused: the zeroth question says its answer could not be saved, and a toast says why
  toast:
    values: [none, zerothRefused, startFailed, switched, failed, taken]
    initial: none
    say:
      none: no toast
      zerothRefused: an error toast says why the zeroth answer was refused
      startFailed: an error toast says why the exam could not be started
      switched: an info toast says the switch to another tab or window was counted
      failed: "an error toast says \"Bir şeyler ters gitti. Biraz sonra yeniden dene.\""
      taken: an error toast says the exam is taken once
  saved:
    values: ["no", "yes"]
    initial: "no"
    say:
      "no": the bar says nothing of a save
      "yes": the bar says "Cevabın kaydedildi." for the question shown
  savedHere:
    values: ["yes", "no"]
    initial: "yes"
    say:
      "yes": the save on its way is the question shown's
      "no": the page has moved on from the question whose save is on its way
  endedBy:
    values: [talebe, time, team, unknown]
    initial: talebe
    say:
      talebe: the talebe ended the exam with Bitir
      time: the time ran out
      team: the team closed the exam early (nazar.exams.publish)
      unknown: the attempt has ended and the page could not read how
  pending:
    values: [none, choice]
    initial: none
    say:
      none: every choice made on this page has reached the server, or was refused
      choice: a choice was made while the connection was gone; the page keeps it and sends it when the connection is back
guards:
  notYetOpen: "window == 'before'"
  isClosed: "window == 'closed' and attempt != 'inProgress'"
  isFinished: "attempt == 'finished'"
  inProgress: "attempt == 'inProgress'"
  zerothGiven: "zeroth == 'answered'"
  atLast: "position == 'last'"
  lastWithSkipped: "position == 'last' and skipped == 'some'"
  notLastFive: "clock == 'running'"
  hasInstructions: "instructions == 'some'"
  hasPending: "pending == 'choice'"
  online: "connection == 'up'"
  offlineNow: "connection == 'lost'"
  zerothError: "notice == 'notSaved' or notice == 'zerothRefused'"
  toastShown: "toast != 'none'"
effects:
  zerothAnswered: { set: { zeroth: answered, notice: none } }
  zerothBack: { havoc: [zeroth], set: { notice: notSaved } }
  zerothRefusedNotice: { havoc: [zeroth], set: { notice: zerothRefused, toast: zerothRefused } }
  takenNotice: { havoc: [endedBy], set: { toast: taken } }
  connectionLost: { set: { connection: lost } }
  # where a resume was asked from: a resume that gets no answer leaves the page where it was (exam-take.tsx:310-319)
  fromBriefing: { set: { resumeFrom: briefing } }
  fromQuestion: { set: { resumeFrom: question } }
  fromElsewhere: { set: { resumeFrom: elsewhere } }
  lostWithChoice: { set: { connection: lost, pending: choice } }
  chosen: { set: { notice: none, saved: "no", savedHere: "yes" } }
  moveOn: { havoc: [position, mode], set: { notice: none, saved: "no" } }
  skipMove: { havoc: [position, mode], set: { skipped: some, notice: none, saved: "no", savedHere: "no" } }
  skipToFirst: { havoc: [position, mode], set: { skipped: some, notice: skippedFollow, saved: "no", savedHere: "no" } }
  skipStay: { set: { saved: "no", savedHere: "yes" } }
  stepInside: { havoc: [mode], set: { position: inside, notice: none, saved: "no" } }
  stepLast: { havoc: [mode], set: { position: last, notice: none, saved: "no" } }
  stepFirst: { havoc: [mode], set: { position: first, notice: none, saved: "no" } }
  skipInside: { havoc: [mode], set: { position: inside, skipped: some, notice: none, saved: "no", savedHere: "no" } }
  skipLast: { havoc: [mode], set: { position: last, skipped: some, notice: none, saved: "no", savedHere: "no" } }
  toFirstSkipped: { havoc: [position, mode], set: { notice: skippedFollow, saved: "no" } }
  lastFiveMinutes: { set: { clock: lastFive } }
  startOver: { havoc: [mode], set: { skipped: none, position: first, clock: running, notice: none, pending: none, connection: up, saved: "no", savedHere: "yes" } }
  resumedNotice: { havoc: [position, mode, skipped], set: { notice: resumed, connection: up, saved: "no" } }
  savedNotice: { set: { saved: "yes" } }
  switchedNotice: { set: { toast: switched } }
  startFailedNotice: { set: { toast: startFailed } }
  failedNotice: { set: { toast: failed } }
  endedRead: { havoc: [endedBy] }
  endedUnknown: { set: { endedBy: unknown } }
  choiceSent: { set: { pending: none } }
  to115: { set: { textSize: s115 } }
  to130: { set: { textSize: s130 } }
  to150: { set: { textSize: s150 } }
  to100: { set: { textSize: s100 } }
failures:
  reading:
    from: getExamBriefing
    gone: [EXAM_NOT_FOUND, AUTHZ_FORBIDDEN]
    other: [HTTP_401, network, timeout, 5xx]
  savingZeroth:
    from: answerZerothQuestion
    signedOut: [HTTP_401]
    refused: [EXAM_NOT_OPEN, ZEROTH_ANSWER_LOCKED, ZEROTH_OPTION_NOT_FOUND, EXAM_NOT_FOUND, VALIDATION_ERROR]
    offline: [network, timeout, 5xx]
  starting:
    from: startExamAttempt
    signedOut: [HTTP_401]
    taken: [EXAM_ALREADY_TAKEN]
    other: [EXAM_NOT_OPEN, ZEROTH_UNANSWERED, EXAM_NOT_FOUND, VALIDATION_ERROR, network, timeout, 5xx]
  resuming:
    from: resumeExamAttempt
    signedOut: [HTTP_401]
    ended: [ATTEMPT_NOT_FOUND, ATTEMPT_ENDED]
    offline: [network, timeout, 5xx]
  saving:
    from: saveExamAnswer
    signedOut: [HTTP_401]
    elsewhere: [ATTEMPT_HELD_ELSEWHERE]
    ended: [ATTEMPT_ENDED, ATTEMPT_NOT_FOUND]
    offline: [network, timeout, 5xx]
    other: [ANSWER_INVALID, QUESTION_NOT_FOUND, VALIDATION_ERROR]
  notingSwitch:
    from: recordTabSwitch
    signedOut: [HTTP_401]
    elsewhere: [ATTEMPT_HELD_ELSEWHERE]
    ended: [ATTEMPT_NOT_FOUND, ATTEMPT_ENDED]
    offline: [network, timeout, 5xx]
    other: [VALIDATION_ERROR]
  finishing:
    from: finishExamAttempt
    signedOut: [HTTP_401]
    elsewhere: [ATTEMPT_HELD_ELSEWHERE]
    ended: [ATTEMPT_NOT_FOUND]
    offline: [network, timeout, 5xx]
    other: [VALIDATION_ERROR]
  timeUp:
    from: getExamBriefing
    signedOut: [HTTP_401]
    other: [EXAM_NOT_FOUND, AUTHZ_FORBIDDEN, network, timeout, 5xx]
  rereading:
    from: getExamBriefing
    signedOut: [HTTP_401]
    other: [EXAM_NOT_FOUND, AUTHZ_FORBIDDEN, network, timeout, 5xx]
# A refusal that sends the talebe to sign in is a call that answered "unauthenticated" (sendToSignIn); a lost connection is a call that
# got no answer or a 5xx (exam-take.tsx:60-63). A lost connection is no screen of its own: the alert is drawn over the question
# (connection), which stays usable.
# The main story: a talebe opens an open exam, answers the zeroth question, starts, answers a question, goes on, and finishes.
main:
  given: { read: ok, window: open, attempt: none, mode: single, instructions: none, version: current, position: inside, skipped: none, length: more }
  events: [DONE, ANSWER_ZEROTH, DONE, START, DONE, CHOOSE, DONE, NEXT, FINISH, CONFIRM, DONE]
initial: reading
states:
  reading:
    title: The exam is read
    source: apps/tedris/features/online-exams/reads.ts:27
    description: >-
      The server page reads getExamBriefing, GET /lessons/{id}/online-exam: the exam's title and course, its length, its question
      count, the earliest and the latest start, the team's instructions, the zeroth question with its options and the talebe's answer
      to it, and the talebe's attempt if there is one. No question and no option of the exam is sent here. Only a talebe who holds an
      ENROLLED seat in the course gets an answer; a 404 or a 403 is "no such exam", any other failure a read that failed.
    invoke: { action: getExamBriefing }
    on:
      DONE: { guard: "read == 'ok'", target: opening, say: "the briefing is read" }
      FAIL.gone: { guard: "read == 'gone'", target: notFound, say: "it is refused with 404 or 403" }
      FAIL.other: { guard: "read == 'failed'", target: readFailed, say: "it fails for another reason" }
  opening:
    title: The exam's page is opened
    source: apps/tedris/features/online-exams/components/exam-take.tsx:108
    description: >-
      A step with no screen of its own: the page goes where the read says. An attempt that has ended opens on "Sınav bitti". An attempt
      in progress is taken up here (resumeExamAttempt) as soon as the page runs, and while that call runs the page draws the briefing;
      opened while the exam is open in another tab or on another device, the exam moves here, and the other place is told on its next
      call.
    always:
      - { guard: isFinished, target: already_finished, effect: [endedRead], say: "the talebe's attempt has ended" }
      - { guard: inProgress, target: resuming, effect: [fromBriefing], say: "an attempt is in progress: it goes on where it stopped", source: "apps/tedris/features/online-exams/components/exam-take.tsx:297" }
      - { guard: notYetOpen, target: notOpen, say: "the earliest start has not come" }
      - { guard: isClosed, target: closed, say: "the latest start has passed" }
      - { target: briefing, say: "the exam can be started" }
  notFound:
    title: There is no such exam
    source: apps/tedris/features/online-exams/reads.ts:37
    description: >-
      The read was refused with a 404 or a 403: the celse is no published multiple-choice exam, or the person holds no ENROLLED seat
      in its course or may not view it. The server page draws a neutral alert "Böyle bir sınav yok", "Bu sınav yok ya da sana açık
      değil.", and the link "Celseye dön"; nothing of the exam is shown.
    by: human
    on:
      NAVIGATE: { target: left, say: "they follow Celseye dön, or leave" }
  readFailed:
    title: The exam could not be read
    source: apps/tedris/features/online-exams/reads.ts:39
    description: >-
      The read failed for another reason (the network, the server, a refused token). The server page draws an alert "Sınav okunamadı",
      "Bağlantını kontrol edip sayfayı yeniden aç.", and the link "Celseye dön"; there is no button to try again, the talebe reloads
      the page.
    by: human
    on:
      NAVIGATE: { target: left, say: "they follow Celseye dön, or leave" }
  notOpen:
    title: The exam cannot be started yet
    source: apps/tedris/features/online-exams/components/exam-take.tsx:757
    description: >-
      An alert "Sınav henüz açılmadı" says from when until when the exam can be started, in the browser's own time zone, and nothing
      else: no start, no link. Nothing changes on the page when the earliest start comes; the talebe opens the page again.
    by: human
    on:
      NAVIGATE: left
  closed:
    title: The time to start has passed
    source: apps/tedris/features/online-exams/components/exam-take.tsx:769
    description: An alert "Başlama süresi geçti" says the exam could be started until its latest start, and that the talebe did not take it.
    by: human
    on:
      NAVIGATE: left
  briefing:
    title: Bilmeniz gerekenler
    source: apps/tedris/features/online-exams/components/exam-take.tsx:779
    description: >-
      Before anything starts: the course, the exam's title (h1) and "Bilmeniz gerekenler": how long it lasts and that the full length
      is given whenever it is started, how many questions it has and that the points are out of 100, how radio buttons and check boxes
      are answered, that every answer is saved the moment it is chosen and there is no "send", that a lost connection or a closed page
      resumes where it stopped and the clock stops meanwhile, that a switch to another tab or window is counted and the team sees it,
      how skipping and the question list work, the list's colours, A− and A+ (drawn beside the sentence), that "Sınavı bitir" ends it,
      and the team's own instructions under "Hazırlayanın notu". Under it "Sıfırıncı soru": the hadith in Arabic and its meaning, the
      preparer's question as the legend of its options, and the note that it scores nothing. "Sınava başla" is off, with "Sınava
      başlamak için önce sıfırıncı soruyu cevapla.", until an option is chosen; the choice shows at once, before the server has it, so
      the start turns on while the answer is on its way (exam-take.tsx:845).
    by: human
    on:
      ANSWER_ZEROTH: { target: savingZeroth, effect: [zerothAnswered], say: "they choose an option of the zeroth question: it shows as chosen at once" }
      START: { guard: zerothGiven, target: starting, say: "they press Sınava başla" }
      RECONNECTED: { guard: offlineNow, target: resuming, effect: [fromBriefing], say: "the resume as the page opened got no answer, and the browser says it is online again: the attempt is taken up", source: "apps/tedris/features/online-exams/components/exam-take.tsx:401" }
      NAVIGATE: left
  savingZeroth:
    title: Save the zeroth answer
    source: apps/tedris/features/online-exams/components/exam-take.tsx:411
    description: >-
      The action answerZerothQuestion, PUT /lessons/{id}/online-exam/zeroth-answer, with the option chosen; a second choice replaces
      it until the attempt starts. The options and "Sınava başla" stay on while the call runs. The calls carry no count, so of two
      quick choices the server keeps the one it gets last.
    invoke: { action: answerZerothQuestion }
    on:
      ANSWER_ZEROTH: { target: savingZeroth, effect: [zerothAnswered], say: "they choose another option before the answer comes: it is sent too" }
      START: { target: starting, say: "they press Sınava başla before the answer comes" }
      DONE: { target: briefing, say: "the answer is saved" }
      FAIL.signedOut: sent_to_sign_in
      FAIL.refused: { target: briefing, effect: [zerothRefusedNotice], say: "the answer is refused: the choice goes back to what it was, the question says \"Cevabın kaydedilemedi; yeniden seç.\", and a toast says why, such as \"Bu sınav şu an açık değil.\" once the late window has passed", source: "apps/tedris/features/online-exams/components/exam-take.tsx:416" }
      FAIL.offline: { target: briefing, effect: [zerothBack], say: "the call gets no answer or a 5xx: the choice goes back to what it was and the question says \"Cevabın kaydedilemedi; yeniden seç.\", with no toast", source: "apps/tedris/features/online-exams/components/exam-take.tsx:414" }
  starting:
    title: Start the attempt
    source: apps/tedris/features/online-exams/components/exam-take.tsx:429
    description: >-
      The action startExamAttempt, POST /lessons/{id}/online-exam/attempt, with the id this tab holds the attempt by (sessionStorage,
      take-model.ts:68). The server puts the questions, and each question's options, in an order of this talebe's own and starts the
      clock; the answer is everything the page needs to run, and never which options are correct. "Sınava başla" is busy while the
      call runs.
    invoke: { action: startExamAttempt }
    on:
      DONE: { target: question, effect: [startOver], say: "the first question of the talebe's own order is shown and the clock runs" }
      FAIL.signedOut: sent_to_sign_in
      FAIL.taken: { target: already_finished, effect: [takenNotice], say: "the attempt has ended already: a toast says \"Bu sınava girdin; bir sınava bir kez girilir.\" and the briefing, read again, opens Sınav bitti", source: "apps/tedris/features/online-exams/components/exam-take.tsx:440" }
      FAIL.other: { target: briefing, effect: [startFailedNotice], say: "the start is refused or does not get through: a toast says why (\"Bu sınav şu an açık değil.\", \"Sınava başlamak için önce sıfırıncı soruyu cevapla.\", or \"Sınav başlatılamadı. Biraz sonra yeniden dene.\") and the briefing stays", source: "apps/tedris/features/online-exams/components/exam-take.tsx:432" }
  resuming:
    title: The attempt goes on where it stopped
    source: apps/tedris/features/online-exams/components/exam-take.tsx:282
    description: >-
      The action resumeExamAttempt, POST /lessons/{id}/online-exam/attempt/resume: the same order of questions and options, every
      answer that was saved, the question the talebe was on, and the time that was left. This page holds the attempt from now on, and
      the place that held it before is told on its next call. The page says "Sınav kaldığın yerden devam ediyor.". The resume writes no
      answer: a choice the page kept in the tab while the connection was gone is laid over the server's and sent next, with
      saveExamAnswer. Any other refusal (EXAM_NOT_FOUND) is a toast "Bir şeyler ters gitti. Biraz sonra yeniden dene." and the page
      stays as it was (exam-take.tsx:230).
    invoke: { action: resumeExamAttempt }
    on:
      DONE:
        - { guard: hasPending, target: saving, effect: [resumedNotice], say: "the choice kept while the connection was gone is sent now" }
        - { target: question, effect: [resumedNotice], say: "the question they were on is shown, with the time left" }
      FAIL.signedOut: sent_to_sign_in
      FAIL.ended: { target: rereading, say: "the attempt ended meanwhile, by the time or by an early close" }
      FAIL.offline:
        - { guard: "resumeFrom == 'briefing'", target: briefing, effect: [connectionLost], say: "the resume as the page opened gets no answer: the briefing stays drawn, with no alert, until the browser is online again", source: "apps/tedris/features/online-exams/components/exam-take.tsx:287" }
        - { guard: "resumeFrom == 'elsewhere'", target: elsewhere, effect: [connectionLost], say: "Burada aç gets no answer: the page still says the exam is open in another place" }
        - { target: question, effect: [connectionLost], say: "the connection is still gone: the alert stays over the question" }
  question:
    title: A question of the exam
    source: apps/tedris/features/online-exams/components/exam-take.tsx:482
    description: >-
      A bar with the countdown (a timer, red with "Son 5 dakika" beside it in the last five minutes), "Soru 12/50" and the save's
      word; the question card with its points, A− and A+, the question (h1) and its options, as radio buttons or as check boxes as the
      preparer chose, then "Önceki", "Soruyu atla", "Sonraki" and "Sınavı bitir"; under it "Sorular", the list of the questions, each
      number coloured and named by its state (answered, skipped, not answered) and the one shown marked as current. Nothing says
      whether several options are correct. "Önceki" is off on the first question, and "Sonraki" on the last when no question is
      skipped. When a call got no answer or a 5xx, an alert "Bağlantı koptu" stands over the question and says the clock has
      stopped and the choices are kept on this device ("Medaris güncellendi" with "Sayfayı yenile" after a new version of Medaris);
      the countdown and the clock's calls stop (exam-take.tsx:334), and the question stays usable: each choice is sent, and one that
      does not get through is kept in the tab and sent after the resume. The alert goes only on the browser's own "online" event, or
      a reload (rule EXM-TAKE-1).
    by: human
    goal: true
    on:
      CHOOSE: { target: saving, effect: [chosen], say: "they choose an option, or mark or clear one: it shows at once, and the line under the bar goes" }
      NEXT:
        - { guard: lastWithSkipped, target: skippedTurn, say: "they press Sonraki on the last question, with questions skipped" }
        - { guard: "position == 'first' and length == 'more'", target: question, effect: [stepInside], say: "they press Sonraki on the first question: the second shows (the choice was saved when it was made)" }
        - { guard: "position == 'first' and length == 'two'", target: question, effect: [stepLast], say: "they press Sonraki on the first of two: the last shows" }
        - { guard: "position == 'inside'", target: question, effect: [moveOn], say: "they press Sonraki: the next question shows" }
      PREVIOUS:
        - { guard: "position == 'last' and length == 'more'", target: question, effect: [stepInside], say: "they press Önceki on the last question: the one before shows" }
        - { guard: "position == 'last' and length == 'two'", target: question, effect: [stepFirst], say: "they press Önceki on the last of two: the first shows" }
        - { guard: "position == 'inside'", target: question, effect: [moveOn], say: "they press Önceki" }
      SKIP:
        - { guard: lastWithSkipped, target: saving, effect: [skipToFirst], say: "they skip the last question with others skipped: the skip is saved and the first skipped one shows", source: "apps/tedris/features/online-exams/components/exam-take.tsx:511" }
        - { guard: "position == 'first' and length == 'more'", target: saving, effect: [skipInside], say: "they skip the first question: it is saved as skipped and the second shows", source: "apps/tedris/features/online-exams/components/exam-take.tsx:511" }
        - { guard: "position == 'first' and length == 'two'", target: saving, effect: [skipLast], say: "they skip the first of two: it is saved as skipped and the last shows" }
        - { guard: "position == 'inside'", target: saving, effect: [skipMove], say: "they press Soruyu atla: the question is saved as skipped, a choice made on it taken back, and the next one shows", source: "apps/tedris/features/online-exams/components/exam-take.tsx:511" }
        - { target: saving, effect: [skipStay], say: "they skip the last question with none other skipped: it is saved as skipped and stays on the screen, and Bitir stands in Sonraki's place (take-model.ts:61)" }
      JUMP: { target: question, effect: [moveOn], say: "they pick a question in the list" }
      FIVE_MINUTES_LEFT: { guard: "notLastFive and online", target: question, effect: [lastFiveMinutes], say: "five minutes are left: the countdown turns red and says so" }
      TIME_UP: { guard: online, target: timeUp, say: "the countdown reaches 0, or the clock's call says the attempt has ended" }
      FINISH: { target: confirmFinish, say: "they press Sınavı bitir" }
      CONNECTION_LOST: { guard: online, target: question, effect: [connectionLost], say: "the clock's call gets no answer or a 5xx: the alert says so and the clock stops" }
      RECONNECTED: { guard: offlineNow, target: resuming, effect: [fromQuestion], say: "the browser says it is online again: the attempt is taken up and the kept choices sent", source: "apps/tedris/features/online-exams/components/exam-take.tsx:401" }
      RELOAD: { target: reading, say: "they press Sayfayı yenile: the page is loaded again", source: "apps/tedris/features/online-exams/components/exam-take.tsx:610" }
      SWITCHED_AWAY: { target: notingSwitch, say: "they go to another tab or window for two seconds or more and come back", source: "apps/tedris/features/online-exams/components/exam-take.tsx:370" }
      TEXT_BIGGER:
        - { guard: "textSize == 's100'", target: question, effect: [to115], say: "they press A+: the exam grows to 115 %" }
        - { guard: "textSize == 's115'", target: question, effect: [to130], say: "they press A+: the exam grows to 130 %" }
        - { guard: "textSize == 's130'", target: question, effect: [to150], say: "they press A+: the exam grows to 150 % and spans the screen" }
      TEXT_SMALLER:
        - { guard: "textSize == 's150'", target: question, effect: [to130], say: "they press A−: the exam shrinks to 130 %" }
        - { guard: "textSize == 's130'", target: question, effect: [to115], say: "they press A−: the exam shrinks to 115 %" }
        - { guard: "textSize == 's115'", target: question, effect: [to100], say: "they press A−: the exam shrinks to 100 %" }
      MOVED_ELSEWHERE: { guard: online, target: elsewhere, say: "the clock's call is refused: another tab or device holds the attempt" }
      NAVIGATE: { target: left, say: "they close the page or leave it: the attempt stays in progress and its clock stops" }
  saving:
    title: Save the answer
    source: apps/tedris/features/online-exams/components/exam-take.tsx:216
    description: >-
      The action saveExamAnswer, PUT /lessons/{id}/online-exam/attempt/answers/{questionId}, with the options chosen (none, and
      skipped, for "Soruyu atla"), the question, and the page's own count of its calls (seq); the server writes nothing at or under the
      count it holds, so a late answer to an earlier call never replaces a later choice. The bar says "Kaydediliyor…" while any save
      runs, and "Cevabın kaydedildi." once the answer to the page's latest call has come, under the question it was for. Nothing waits
      for it: Önceki, Sonraki, Soruyu atla, the list and Sınavı bitir stay on (exam-take.tsx:737-757), so the page moves on, and the
      attempt can be ended, before the last choice is on the server (rule EXM-TAKE-2). The graph takes such a press after the save's
      answer (the controls are `duringStep`): the screen it leads to is the same, as the save's answer changes only the bar.
    invoke: { action: saveExamAnswer }
    on:
      DONE:
        - { guard: "savedHere == 'yes'", target: question, effect: [savedNotice, choiceSent], say: "the answer comes: the bar says it is saved, under the question it was for" }
        - { target: question, effect: [choiceSent], say: "the answer comes for a question the page has moved on from: the bar says nothing" }
      FAIL.signedOut: sent_to_sign_in
      FAIL.elsewhere: { target: elsewhere, effect: [choiceSent], say: "another tab or device has opened the exam since" }
      FAIL.ended: { target: rereading, effect: [choiceSent], say: "the exam ended before the answer came: the answer is refused" }
      FAIL.offline: { target: question, effect: [lostWithChoice], say: "the call gets no answer or a 5xx: the alert says so, and the choice is kept in the tab and sent after the resume", source: "apps/tedris/features/online-exams/components/exam-take.tsx:230" }
      FAIL.other: { target: question, effect: [failedNotice, choiceSent], say: "the answer is refused: a toast says so, and the choice stays drawn as chosen though the server does not hold it" }
  skippedTurn:
    title: The skipped questions come back
    source: apps/tedris/features/online-exams/components/exam-take.tsx:505
    description: >-
      Sonraki on the last question goes to the first skipped question that is still unanswered (take-model.ts:61), and a line says
      "Son soruya geldin. Atladığın {skipped} soru şimdi sırayla gelecek.". From there Sonraki goes on to the question after it in the
      talebe's order, answered or not (take-model.ts:60), not to the next skipped one.
    always:
      - { target: question, effect: [toFirstSkipped], say: "the first skipped question is shown" }
  elsewhere:
    title: The exam is open in another place
    source: apps/tedris/features/online-exams/components/exam-take.tsx:470
    description: >-
      A call was refused with ATTEMPT_HELD_ELSEWHERE: another tab or device opened the exam, and the attempt moved there (not a switch:
      nothing is erased). The page says "Sınav başka bir yerde açık" and that the answers are saved there now, and offers "Burada aç".
    by: human
    on:
      OPEN_HERE: { target: resuming, effect: [fromElsewhere], say: "they press Burada aç: the attempt is taken back here", source: "apps/tedris/features/online-exams/components/exam-take.tsx:476" }
      RECONNECTED: { guard: offlineNow, target: resuming, effect: [fromElsewhere], say: "Burada aç got no answer, and the browser says it is online again: the attempt is taken back here", source: "apps/tedris/features/online-exams/components/exam-take.tsx:401" }
      NAVIGATE: left
  notingSwitch:
    title: Count the switch
    source: apps/tedris/features/online-exams/components/exam-take.tsx:372
    description: >-
      The action recordTabSwitch, POST /lessons/{id}/online-exam/attempt/switch, called when the talebe comes back to the page after it
      was hidden (another tab) or its window lost the focus (another window or application) for two seconds or more: the switch is kept
      with its time for the team (nazar.exams.results). Nothing is erased and the exam goes on where it was (D1, decided on 22 Nov
      2026).
    invoke: { action: recordTabSwitch }
    on:
      DONE: { target: question, effect: [switchedNotice], say: "the switch is counted: a toast says so and the question is where it was" }
      FAIL.signedOut: sent_to_sign_in
      FAIL.elsewhere: { target: elsewhere, say: "the switch was to another tab of the exam, which now holds it" }
      FAIL.ended: { target: rereading, say: "the attempt had ended meanwhile" }
      FAIL.offline: { target: question, effect: [connectionLost], say: "the call gets no answer or a 5xx: the alert says so" }
      FAIL.other: { target: question, effect: [failedNotice], say: "the call is refused: a toast says so" }
  confirmFinish:
    title: Sınavı bitir?
    source: apps/tedris/features/online-exams/components/exam-take.tsx:734
    description: >-
      An alert dialog: "{unanswered} soru cevapsız, {skipped} soru atlandı. Kalan süren {timeLeft}. Bitirdikten sonra hiçbir cevap
      değişmez.", where the unanswered count holds the skipped ones too (exam-take.tsx:518-533). "Bitir" ends the exam; "Sınava dön"
      goes back to the question.
    by: human
    on:
      CONFIRM: { target: finishing, say: "they press Bitir" }
      CANCEL: { target: question, say: "they press Sınava dön" }
      TIME_UP: { guard: online, target: timeUp, say: "the time runs out while they decide" }
  finishing:
    title: End the attempt
    source: apps/tedris/features/online-exams/components/exam-take.tsx:453
    description: >-
      "Bitir" closes the dialog at once (exam-take.tsx:481), and the action finishExamAttempt, POST
      /lessons/{id}/online-exam/attempt/finish, with this tab's holder id, ends the attempt with the answers saved so far; the server
      scores it, and no talebe reads the score before the team releases the results. Nothing is busy meanwhile: the question screen is
      back under the call. A page the attempt has moved away from cannot end it.
    invoke: { action: finishExamAttempt }
    on:
      DONE: { target: finished, say: "the exam is handed in, and the briefing is read again for how it ended", source: "apps/tedris/features/online-exams/components/exam-take.tsx:455" }
      FAIL.signedOut: sent_to_sign_in
      FAIL.elsewhere: { target: elsewhere, say: "another tab or device has opened the exam since: nothing ends from this page" }
      FAIL.ended: { target: rereading, say: "the attempt is gone" }
      FAIL.offline: { target: question, effect: [connectionLost], say: "the call gets no answer or a 5xx: the alert says so, the attempt is still in progress, and Sınavı bitir can be pressed again" }
      FAIL.other: { target: question, effect: [failedNotice], say: "the call is refused: a toast says so, and the attempt is still in progress" }
  timeUp:
    title: The attempt has ended
    source: apps/tedris/features/online-exams/components/exam-take.tsx:337
    description: >-
      The countdown reached 0, or a call of the clock answered FINISHED (exam-take.tsx:343): the time ran out, or the team closed the
      exam early. The page reads the briefing again (readExamBriefing), whose attempt says how it ended (finishedBy), and opens "Sınav
      bitti" whatever that read gives.
    invoke: { action: getExamBriefing }
    on:
      DONE: { target: finished, effect: [endedRead], say: "the read says how it ended: by Bitir, by the time or by the team" }
      FAIL.signedOut: sent_to_sign_in
      FAIL.other: { target: finished, effect: [endedUnknown], say: "the read fails: the page says the exam has ended, with the answers saved so far" }
  rereading:
    title: Read how the attempt ended
    source: apps/tedris/features/online-exams/components/exam-take.tsx:191
    description: >-
      A call was refused with ATTEMPT_ENDED or ATTEMPT_NOT_FOUND (a save, the clock, a switch, a resume or Bitir): the page reads the
      briefing again (exam-take.tsx:204) and opens "Sınav bitti" only when that read says the attempt has FINISHED. When the read
      fails, nothing on the page changes and nothing says the exam has ended.
    invoke: { action: getExamBriefing }
    on:
      DONE: { target: finished, effect: [endedRead], say: "the read says the attempt has ended, and how" }
      FAIL.signedOut: sent_to_sign_in
      FAIL.other: { target: question, say: "the read fails: the page stays as it was (the briefing, if the resume of a page just opened was refused), with no word that the exam has ended" }
  finished:
    title: Sınav bitti
    type: final
    source: apps/tedris/features/online-exams/components/exam-take.tsx:888
    description: >-
      Nothing can be changed any more: "Sınav bitti", a line that says at what time it ended and how ("Sınavı … saatinde bitirdin.",
      "Süre doldu; …", "Ders kadrosu sınavı … erken bitirdi; …", or "Sınavın kaydedilen cevaplarla bitti." when the read did not say),
      "Sonucun, ders kadrosu sonuçları açıkladığında görünür.", and two links, "Sınavlarım" and "Celseye dön".
  already_finished:
    title: The exam was finished before
    type: final
    source: apps/tedris/features/online-exams/components/exam-take.tsx:466
    description: >-
      The talebe took it already: an exam is taken once. The page shows the same "Sınav bitti", with how and when it ended, and leads to
      Sınavlarım and to the celse, not to the result itself.
  left:
    title: The talebe left the page
    type: final
    leavesPage: true
  sent_to_sign_in:
    title: The session is over
    type: final
    leavesPage: true
    description: >-
      A call answered "unauthenticated": sendToSignIn (apps/tedris/lib/send-to-sign-in.ts:25) sends the talebe to sign in and back to
      exactly this address, and draws no toast. realm.auth.signIn takes over.
