# A talebe takes an online multiple-choice exam in tedris-web: the briefing ("Bilmeniz gerekenler") with the zeroth question, the
# questions, the countdown, the question list, skipping, finishing, and what a lost connection and a switch to another tab do.
# PLANNED, NOT BUILT (MDRS-299, Backlog). Written needs-first on 21 November 2026 from the owner's rules for online exams, then drawn
# with its screens (ui.yaml) and its server steps on the planned API (domain/planned-exams.yaml): there is no code, no route and no
# table, so no state and no node has a `source`, and nothing here can be walked (no binding, no replay). `status: proposed`.
# The exam is a LessonExam of the third format, MULTIPLE_CHOICE, shown "Çoktan seçmeli" beside "Yazılı" and "Şifahi" (the domain's
# header says why it is not called ONLINE).
#
# The server steps: the page reads the exam (getExamBriefing), saves the zeroth answer (answerZerothQuestion), starts the attempt
# (startExamAttempt) or takes it over where it stopped (resumeExamAttempt), saves every answer (saveExamAnswer), starts it again after
# a switch (restartExamAttempt) and ends it (finishExamAttempt). The clock is the server's: the page calls tickExamClock every few
# seconds while it holds the attempt and is connected, and its answers are the events FIVE_MINUTES_LEFT, TIME_UP and MOVED_ELSEWHERE
# (drawn as events, not as a state of their own). Önceki, Sonraki, Soruyu atla and a pick in the list send the position with the same
# saveExamAnswer; the graph draws that call once, at a choice.
#
# The owner's rules this flow carries (21 Nov 2026, his words):
#   - "çoktan seçmeli, soru ve cevap sıraları karışık olacak her talebe için"
#   - "sınav sırasında talebe koparsa kaldığı yerden devam edecek, bilerek sekme veya pencere değiştirirse sınav baştan başlayacak
#     (bu mantıklı gelmiyor bana ama öyle istendi, tekrar sorarız)"
#   - "sınav süresi defaultta 1 saat olacak"; "sınav ekranında geri sayım olacak, son 5 dk kala geri sayım mesela kırmızı olacak"
#   - "her soruda cevap seçildiğinde ilerle geri git dendiğinde otomatik kaydolacak cevap, verilen cevap kabul edilecek"
#   - "sınava girerken talebeye 'bilmeniz gerekenler' ekranı gösterilecek"
#   - "soruların indicator'ü olabilir solda veya sağda falan, istediği soruya geri dönebilir"
#   - "soruyu atla seçeneği olacak, son soruya gelindiğinde atlanan sorulara dönülecek"
#   - "en son sınavı bitir butonuyla sınav bitecek"
#   - "'sıfırıncı soru' olacak, 'bizi aldatan bizden değildir' hadisi hakkında soru olacak her sınavda bu sıfırıncı soruda. mesela bu
#     dönem 'bu hadisi ne zaman öğrendiniz' sorusu olacak, diğer dönem 'ne zaman ezberlersiniz' diye sorulacak. doğru yanlış cevabı
#     olan bi soru değil."
#
# Decided by the owner on 21 Nov 2026, when he read the first draft:
#   - The switch rule stays for now ("kural kalsın şimdilik"); it is asked again of those who asked for it, with this flow's video (D1).
#     A restart starts the exam truly anew: the full length again, and a new order of questions and options ("Tam süre, yeni sıra").
#   - The clock does not run while the connection is lost: "talebeye güvenilecek burada, böyle bi yolla kandırırsa Allah Teâlâ'ya
#     hesap verir".
#   - An exam opened in a second tab or on a second device moves there; that is not a switch.
#   - The zeroth question is answered on the briefing, before the clock starts, and is required. It has options, no correct one and
#     no points; the hadith is shown above it, its Arabic and its meaning, the same in every exam.
#   - A question may have several correct options. The preparer shows it with radio buttons (one choice; any correct option gets the
#     points) or with check boxes (several choices, scored all or nothing, or in shares with a wrong mark taking one off). Nothing
#     tells the talebe whether a question has several correct options, or how many.
#   - A talebe may start any time between the earliest and the latest start the team sets, and always gets the full length
#     (nazar.exams.publish).
#   - When the time runs out, the exam ends by itself with the answers saved so far, and the talebe is told it ended because the time
#     ran out (asked whether it should, he answered "önerdiğin gibi").
schema: delurio-graph/0
kind: flow
id: tedris.exams.take
status: proposed
domain: medaris.api
ui: tedris.exams.take
title: Take an online exam
summary: >-
  A talebe who holds a seat in the exam's course opens an exam between its earliest and its latest start. "Bilmeniz gerekenler"
  says how long it lasts, how many questions it has, that every answer is saved when it is chosen, that a lost connection resumes
  where it stopped with the clock stopped meanwhile, and that switching to another tab or window starts the exam again. Under it
  stands the zeroth question, about the hadith "Bizi aldatan bizden değildir", which has to be answered before "Sınava başla" starts
  the clock. The talebe gets the questions, and each question's options, in an order of their own. A countdown is always on the
  screen and turns red, and says so, in the last five minutes. A list of the questions beside the question (behind a button on a
  phone) takes the talebe to any of them. "Soruyu atla" leaves a question for later, and after the last question the skipped ones
  come back. Every choice is saved at once; there is no "send". "Sınavı bitir" asks once and ends the exam; the time running out ends
  it as well, with the answers saved so far.
scope:
  shows: the exam's own page in tedris-web, from the briefing to the end screen
  world: open
  outOfView: [the list it is entered from (tedris.exams.mine), the result (tedris.exams.result)]
decisions:
  D1:
    question: >-
      Is starting the exam again after a deliberate switch to another tab or window what those who asked for exams want, once they
      see it in the flow's video?
    recommend: >-
      The owner keeps the rule for now (21 Nov 2026) and asks again with the video. Show them that a closed and reopened tab is a lost
      connection and resumes, so the rule only catches an open switch, and that a phone call or a notification also hides the page;
      counting the switches and showing them to the team (nazar.exams.results) is the other way.
    affects: [question, restarted, briefing]
context:
  window:
    values: [before, open, closed]
    initial: any
    say:
      before: the earliest start has not come yet
      open: it is between the earliest and the latest start
      closed: the latest start has passed
  attempt:
    values: [none, inProgress, finished]
    initial: any
    say:
      none: the talebe has not started the exam
      inProgress: the talebe started the exam and has not finished it
      finished: the talebe finished the exam, or its time ran out
  zeroth:
    values: [unanswered, answered]
    initial: unanswered
    say:
      unanswered: the zeroth question is not answered
      answered: the zeroth question is answered
  instructions:
    values: [none, some]
    initial: any
    say:
      none: the team wrote no instructions of its own
      some: the team wrote instructions, read in the briefing
  mode:
    values: [single, multiple]
    initial: any
    say:
      single: the question shown is answered with radio buttons (one choice)
      multiple: the question shown is answered with check boxes (any number of marks)
  position:
    values: [inside, last]
    initial: inside
    say:
      inside: the question shown is not the last one of the talebe's order
      last: the question shown is the last one of the talebe's order
  skipped:
    values: [none, some]
    initial: none
    say:
      none: no question is skipped
      some: at least one question is skipped and still unanswered
  clock:
    values: [running, lastFive]
    initial: running
    say:
      running: more than five minutes are left
      lastFive: five minutes or less are left
  notice:
    values: [none, resumed, saved, skippedFollow, notSaved, startFailed]
    initial: none
    say:
      none: the page shows no notice
      resumed: the page says the exam goes on where it stopped
      saved: the question says its answer is saved
      skippedFollow: the page says the skipped questions follow, and how many
      notSaved: the page says the answer, or the zeroth answer, could not be saved
      startFailed: the briefing says the exam could not be started
  endedBy:
    values: [talebe, time, team, unknown]
    initial: talebe
    say:
      talebe: the talebe ended the exam with Bitir
      time: the time ran out
      team: the team closed the exam early (nazar.exams.publish)
      unknown: the attempt has ended and the page could not read how
  pending:
    values: [none, choice]
    initial: none
    say:
      none: every choice made on this page has reached the server, or was refused
      choice: a choice was made while the connection was gone; the page keeps it and sends it when the connection is back
guards:
  notYetOpen: "window == 'before'"
  isClosed: "window == 'closed' and attempt != 'inProgress'"
  isFinished: "attempt == 'finished'"
  inProgress: "attempt == 'inProgress'"
  zerothGiven: "zeroth == 'answered'"
  atLast: "position == 'last'"
  lastWithSkipped: "position == 'last' and skipped == 'some'"
  notLastFive: "clock == 'running'"
  hasInstructions: "instructions == 'some'"
  hasPending: "pending == 'choice'"
effects:
  zerothAnswered: { set: { zeroth: answered, notice: none } }
  moveOn: { havoc: [position, mode], set: { notice: none } }
  markSkipped: { set: { skipped: some } }
  toFirstSkipped: { set: { position: inside, notice: skippedFollow } }
  lastFiveMinutes: { set: { clock: lastFive } }
  startOver: { set: { skipped: none, position: inside, clock: running, notice: none, pending: none } }
  resumedNotice: { set: { notice: resumed } }
  savedNotice: { set: { notice: saved } }
  notSavedNotice: { set: { notice: notSaved } }
  startFailedNotice: { set: { notice: startFailed } }
  endedRead: { havoc: [endedBy] }
  endedUnknown: { set: { endedBy: unknown } }
  keepChoice: { set: { pending: choice } }
  choiceSent: { set: { pending: none } }
failures:
  reading:
    from: getExamBriefing
    gone: [EXAM_NOT_FOUND, LESSON_NOT_FOUND]
    other: [HTTP_400, HTTP_401, network, timeout, 5xx]
  savingZeroth:
    from: answerZerothQuestion
    closed: [EXAM_NOT_OPEN]
    other: [ZEROTH_OPTION_NOT_FOUND, EXAM_NOT_FOUND, VALIDATION_ERROR, HTTP_401, network, timeout, 5xx]
  starting:
    from: startExamAttempt
    closed: [EXAM_NOT_OPEN]
    taken: [EXAM_ALREADY_TAKEN]
    zeroth: [ZEROTH_UNANSWERED]
    other: [EXAM_NOT_FOUND, VALIDATION_ERROR, HTTP_401, network, timeout, 5xx]
  resuming:
    from: resumeExamAttempt
    ended: [ATTEMPT_NOT_FOUND]
    gone: [EXAM_NOT_FOUND]
    offline: [network, timeout, 5xx]
    other: [HTTP_401]
  saving:
    from: saveExamAnswer
    elsewhere: [ATTEMPT_HELD_ELSEWHERE]
    ended: [ATTEMPT_ENDED, ATTEMPT_NOT_FOUND]
    offline: [network, timeout, 5xx]
    other: [ANSWER_INVALID, VALIDATION_ERROR, HTTP_401]
  restarting:
    from: restartExamAttempt
    elsewhere: [ATTEMPT_HELD_ELSEWHERE]
    ended: [ATTEMPT_NOT_FOUND]
    offline: [network, timeout, 5xx]
    other: [HTTP_401]
  finishing:
    from: finishExamAttempt
    elsewhere: [ATTEMPT_HELD_ELSEWHERE]
    ended: [ATTEMPT_NOT_FOUND]
    offline: [network, timeout, 5xx]
    other: [HTTP_401, VALIDATION_ERROR]
  timeUp:
    from: getExamBriefing
    other: [EXAM_NOT_FOUND, LESSON_NOT_FOUND, HTTP_400, HTTP_401, network, timeout, 5xx]
# The main story: a talebe opens an open exam, answers the zeroth question, starts, answers a question, goes on, and finishes.
main:
  given: { window: open, attempt: none, mode: single }
  events: [DONE, ANSWER_ZEROTH, DONE, START, DONE, CHOOSE, DONE, NEXT, FINISH, CONFIRM, DONE]
initial: reading
states:
  reading:
    title: The exam is read
    description: >-
      The action getExamBriefing, GET /lessons/{id}/online-exam: the exam's title and course, its length, its question count, the
      earliest and the latest start, the team's instructions, the zeroth question with its options and the talebe's answer to it, and
      the talebe's attempt if there is one. No question and no option of the exam is sent here. Only a talebe who holds an ENROLLED
      seat in the course, with no bar, gets an answer; to anyone else there is no such exam.
    invoke: { action: getExamBriefing }
    on:
      DONE: opening
      FAIL.gone: notFound
      FAIL.other: readFailed
  opening:
    title: The exam's page is opened
    description: >-
      A step with no screen of its own: the page goes where the read says. Opened while it is open in another tab or on another device,
      the exam moves here (resumeExamAttempt), and the other place says it is open elsewhere.
    always:
      - { guard: isFinished, target: already_finished, say: "the talebe finished it already" }
      - { guard: inProgress, target: resuming, say: "an attempt is in progress: it goes on where it stopped" }
      - { guard: notYetOpen, target: notOpen, say: "the earliest start has not come" }
      - { guard: isClosed, target: closed, say: "the latest start has passed" }
      - { target: briefing, say: "the exam can be started" }
  notFound:
    title: There is no such exam
    description: >-
      The read was refused with EXAM_NOT_FOUND or LESSON_NOT_FOUND: the celse is no multiple-choice exam, it is a draft, or the person
      holds no ENROLLED seat in its course. The page says there is no such exam, and nothing of it is shown.
    by: human
    on:
      NAVIGATE: left
  readFailed:
    title: The exam could not be read
    description: The read failed for another reason (the network, the server, an ended session). The page says so and offers to try again.
    by: human
    on:
      RETRY: { target: reading, say: "they press Yeniden dene" }
      NAVIGATE: left
  notOpen:
    title: The exam cannot be started yet
    description: The page says from when and until when the exam can be started, in the talebe's own time zone, and offers no start.
    by: human
    on:
      OPENS: { target: briefing, say: "the earliest start comes while the page is open" }
      NAVIGATE: left
  closed:
    title: The time to start has passed
    description: The page says the exam could be started until its latest start, and that the talebe did not take it.
    by: human
    on:
      NAVIGATE: left
  briefing:
    title: Bilmeniz gerekenler
    description: >-
      Before anything starts: the exam's title and course, how long it lasts and that the full length is given whenever it is started,
      how many questions it has and how the points are given, that every answer is saved the moment it is chosen and there is no
      "send", that a lost connection or a closed page resumes where it stopped and the clock stops meanwhile, that switching to another
      tab or window starts the exam again, how skipping and the question list work, that "Sınavı bitir" ends it, and the team's own
      instructions. Under it the zeroth question: the hadith in Arabic and its meaning, the preparer's question about it and its
      options. "Sınava başla" is off until the zeroth question is answered, and starts the clock.
    by: human
    on:
      ANSWER_ZEROTH: { target: savingZeroth, say: "they choose an option of the zeroth question" }
      START: { guard: zerothGiven, target: starting, say: "they press Sınava başla" }
      NAVIGATE: left
  savingZeroth:
    title: Save the zeroth answer
    description: >-
      The action answerZerothQuestion, PUT /lessons/{id}/online-exam/zeroth-answer, with the option chosen; a second choice replaces it
      until the attempt starts. The options stay where they are while the call runs.
    invoke: { action: answerZerothQuestion }
    on:
      ANSWER_ZEROTH: { target: savingZeroth, say: "they choose another option before the answer comes: the new choice is sent, and the last call wins" }
      DONE: { target: briefing, effect: [zerothAnswered], say: "the answer is saved and Sınava başla turns on" }
      FAIL.closed: { target: closed, say: "the latest start passed meanwhile" }
      FAIL.other: { target: briefing, effect: [notSavedNotice], say: "the answer could not be saved; the page says so and keeps the start off" }
  starting:
    title: Start the attempt
    description: >-
      The action startExamAttempt, POST /lessons/{id}/online-exam/attempt, with an id the page draws for itself. The server puts the
      questions, and each question's options, in an order of this talebe's own and starts the clock; the answer is everything the page
      needs to run, and never which options are correct. The button is busy while the call runs.
    invoke: { action: startExamAttempt }
    on:
      DONE: { target: question, effect: [startOver], say: "the first question of the talebe's own order is shown and the clock runs" }
      FAIL.closed: { target: closed, say: "the latest start passed meanwhile" }
      FAIL.taken: { target: already_finished, say: "the exam was finished in another place meanwhile" }
      FAIL.zeroth: { target: briefing, effect: [startFailedNotice], say: "the zeroth answer is not on the server" }
      FAIL.other: { target: briefing, effect: [startFailedNotice], say: "the exam could not be started; the briefing says so" }
  resuming:
    title: The attempt goes on where it stopped
    description: >-
      The action resumeExamAttempt, POST /lessons/{id}/online-exam/attempt/resume: the same order of questions and options, every
      answer that was saved, the question the talebe was on, and the time that was left when the connection was lost. This page holds
      the attempt from now on, and the place that held it before is told on its next call. The page says the exam was resumed. The
      resume writes no answer: a choice the page kept while the connection was gone is sent next, with saveExamAnswer, and is shown
      as saved only when the server has it.
    invoke: { action: resumeExamAttempt }
    on:
      DONE:
        - { guard: hasPending, target: saving, effect: [resumedNotice], say: "the choice kept while the connection was gone is sent now" }
        - { target: question, effect: [resumedNotice], say: "the question they were on is shown, with the time left" }
      FAIL.ended: { target: timeUp, say: "the attempt ended meanwhile, by the time or by an early close" }
      FAIL.gone: notFound
      FAIL.offline: { target: offline, say: "the connection is still gone" }
      FAIL.other: { target: readFailed, say: "the session has ended: the page says it could not go on" }
  question:
    title: A question of the exam
    description: >-
      One question with its options, as radio buttons or as check boxes as the preparer chose, its number and the count ("12/50"),
      the points it carries, the countdown, "Önceki", "Sonraki", "Soruyu atla" and "Sınavı bitir", and the list of questions with each
      one's state (answered, skipped, not seen yet). Nothing says whether several options are correct.
    by: human
    goal: true
    on:
      CHOOSE: { target: saving, say: "they choose an option, or mark one" }
      NEXT:
        - { guard: lastWithSkipped, target: skippedTurn, say: "they press Sonraki on the last question, with questions skipped" }
        - { target: question, effect: [moveOn], say: "they press Sonraki: the answer is saved and the next question shows" }
      PREVIOUS: { target: question, effect: [moveOn], say: "they press Önceki" }
      SKIP:
        - { guard: atLast, target: skippedTurn, effect: [markSkipped], say: "they skip the last question" }
        - { target: question, effect: [markSkipped, moveOn], say: "they press Soruyu atla" }
      JUMP: { target: question, effect: [moveOn], say: "they pick a question in the list" }
      FIVE_MINUTES_LEFT: { guard: notLastFive, target: question, effect: [lastFiveMinutes], say: "five minutes are left: the countdown turns red and says so" }
      TIME_UP: { target: timeUp, say: "the time runs out" }
      FINISH: { target: confirmFinish, say: "they press Sınavı bitir" }
      CONNECTION_LOST: { target: offline, say: "the connection is lost" }
      SWITCHED_AWAY: { target: restarting, say: "they switch to another tab or window and come back" }
      MOVED_ELSEWHERE: { target: elsewhere, say: "the clock's call says another tab or device has opened the exam" }
      NAVIGATE: { target: left, say: "they close the page or leave it: the attempt stays in progress and its clock stops" }
  saving:
    title: Save the answer
    description: >-
      The action saveExamAnswer, PUT /lessons/{id}/online-exam/attempt/answers/{questionId}, with the options chosen and the question
      shown, and the page's own count of its calls (seq); the last call wins by that count, so a late answer to an earlier call never
      replaces a later choice. The question stays on the screen and the talebe can go on choosing: another choice is sent at once, and
      only the answer to the page's latest call says it is saved.
      Önceki, Sonraki, Soruyu atla, the list and Sınavı bitir wait for the answer (disabled while it runs), so the exam never moves on
      or ends before the last choice is saved. Nothing is shown as saved before the server answers.
    invoke: { action: saveExamAnswer }
    on:
      CHOOSE: { target: saving, say: "they choose again before the answer comes: the new choice is sent, and the last call wins" }
      DONE: { target: question, effect: [savedNotice, choiceSent], say: "the answer to the latest call comes: the question says its answer is saved" }
      FAIL.elsewhere: { target: elsewhere, effect: [choiceSent], say: "another tab or device has opened the exam since" }
      FAIL.ended: { target: timeUp, effect: [choiceSent], say: "the exam ended before the answer came: the answer is refused" }
      FAIL.offline: { target: offline, effect: [keepChoice], say: "the connection is gone: the choice is kept and sent when it is back" }
      FAIL.other: { target: question, effect: [notSavedNotice, choiceSent], say: "the answer was refused; the question says it is not saved" }
  skippedTurn:
    title: The skipped questions come back
    description: >-
      After the last question, the first skipped question is shown, and the page says that the skipped ones follow and how many
      there are.
    always:
      - { target: question, effect: [toFirstSkipped], say: "the first skipped question is shown" }
  offline:
    title: The connection is lost
    description: >-
      The page says the connection is lost and that the clock has stopped, keeps the choice the talebe made, and sends it when the
      connection is back; nothing is shown as saved that the server does not hold.
    by: human
    on:
      RECONNECTED: { target: resuming, say: "the connection is back: the attempt is taken up again and the clock goes on" }
      NAVIGATE: left
  elsewhere:
    title: The exam is open in another place
    description: >-
      Another tab or device opened the exam, and the attempt moved there (not a switch: nothing is erased). This page takes no more
      answers and says so; it offers to take the exam back here.
    by: human
    on:
      OPEN_HERE: { target: reading, say: "they press Burada aç: the exam is read again and moves back here" }
      NAVIGATE: left
  restarting:
    title: Start the attempt again
    description: >-
      The action restartExamAttempt, POST /lessons/{id}/online-exam/attempt/restart, called when the talebe comes back from another tab
      or window: every answer of the attempt is erased, a new order of questions and options is drawn, and the full length is given
      again; the zeroth answer stays. The switch is kept, with its time, for the team (D1).
    invoke: { action: restartExamAttempt }
    on:
      DONE: { target: restarted, say: "the attempt is started again on the server" }
      FAIL.elsewhere: { target: elsewhere, say: "the switch was to another tab of the exam, which now holds it: not a restart" }
      FAIL.ended: { target: timeUp, say: "the attempt had ended meanwhile" }
      FAIL.offline: { target: offline, say: "the connection is gone" }
      FAIL.other: { target: readFailed, say: "the session has ended: the page says it could not go on" }
  restarted:
    title: The exam starts again
    description: >-
      A deliberate switch to another tab or window: the talebe is told why the exam starts again and what was lost (how many answers
      were erased) before the briefing shows again, with the full length and a new order of questions and options (D1). The zeroth
      question keeps its answer.
    by: human
    on:
      CONTINUE: { target: briefing, effect: [startOver], say: "they press Anladım: the briefing is shown again" }
  confirmFinish:
    title: Sınavı bitir?
    description: >-
      One question before the end: how many questions are unanswered or skipped, and how much time is left. "Bitir" ends the exam;
      "Sınava dön" goes back to the question.
    by: human
    on:
      CONFIRM: { target: finishing, say: "they press Bitir" }
      CANCEL: { target: question, say: "they press Sınava dön" }
      TIME_UP: { target: timeUp, say: "the time runs out while they decide" }
  finishing:
    title: End the attempt
    description: >-
      The action finishExamAttempt, POST /lessons/{id}/online-exam/attempt/finish, with this page's holderId: the attempt ends with the
      answers saved so far and the server scores it; no talebe reads the score before the team releases the results. A page the
      attempt has moved away from cannot end it. The button is busy while the call runs.
    invoke: { action: finishExamAttempt }
    on:
      DONE: { target: finished, say: "the exam is handed in" }
      FAIL.elsewhere: { target: elsewhere, say: "another tab or device has opened the exam since: nothing ends from this page" }
      FAIL.ended: { target: timeUp, say: "it had ended meanwhile, by the time or by an early close" }
      FAIL.offline: { target: offline, say: "the connection is gone: the attempt is still in progress, and Bitir can be pressed again" }
      FAIL.other: { target: readFailed, say: "the session has ended: the attempt is still in progress, and the page says it could not end it" }
  timeUp:
    title: The attempt has ended
    description: >-
      The attempt ended with no answer to this page's Bitir: tickExamClock answers FINISHED, an answer is refused because the attempt
      has ended, or the attempt is gone when the page comes back (the time ran out, the team closed the exam early, or a Bitir whose
      answer was lost on the way). The page reads the exam again, getExamBriefing, whose attempt says how it ended (finishedBy), and
      the talebe is told that, with the answers saved so far.
    invoke: { action: getExamBriefing }
    on:
      DONE: { target: finished, effect: [endedRead], say: "the read says how it ended: by Bitir, by the time or by the team" }
      FAIL.other: { target: finished, effect: [endedUnknown], say: "the read fails: the page says the exam has ended, with the answers saved so far" }
  finished:
    title: Sınav bitti
    description: >-
      The exam is handed in and nothing can be changed: the page says when it was handed in, whether by "Bitir" or by the time, and
      when and where the result can be read (Sınavlarım).
    type: final
  already_finished:
    title: The exam was finished before
    description: "The talebe took it already: an exam is taken once, and the page leads to its result."
    type: final
  left:
    title: The talebe left the page
    type: final
    leavesPage: true
