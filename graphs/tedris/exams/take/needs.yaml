# What must exist for a talebe to take an online exam: written needs-first on 21 November 2026 from the owner's rules (quoted at the
# top of flow.yaml), then met by the code of MDRS-299 (#416 and its follow-ups): each met need names the code or the test that shows it.
# One need is still missing: nobody has walked the page with the keyboard alone or a screen reader.
schema: delurio-graph/0
kind: needs
id: tedris.exams.take
status: proposed
needs:
  - id: briefing-before-the-start
    need: >-
      Before the exam starts, the talebe reads "Bilmeniz gerekenler": how long the exam lasts, how many questions it has and how the
      points are given, that the full length is given whenever the exam is started, that each answer is saved when it is chosen and
      there is nothing to send at the end, that a lost connection resumes where it stopped and the clock stops meanwhile, what a
      switch to another tab or window does, how skipping and the question list work, and that "Sınavı bitir" ends it. The clock starts
      only when they press "Sınava başla".
    evidence:
      - state: briefing
      - node: briefingFacts
      - node: startButton
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:829
      - test: apps/tedris/test/exam-take.spec.ts
        name: "says in the briefing what A− and A+ do, and draws them"
    note: "Owner: \"sınava girerken talebeye 'bilmeniz gerekenler' ekranı gösterilecek\"."

  - id: the-zeroth-question-first
    need: >-
      Under the briefing, before the clock starts, stands the zeroth question: the hadith "مَنْ غَشَّنَا فَلَيْسَ مِنَّا" with its
      meaning "Bizi aldatan bizden değildir", the same in every exam, then the question the preparer wrote about it and its options.
      The talebe chooses one; "Sınava başla" is off until they have, and says why. The answer is saved at once, has no correct one
      and no points, and is not part of the score.
    evidence:
      - state: briefing
      - node: hadithArabic
      - node: zerothOptions
      - node: startHint
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:873
      - test: apps/tedris/test/exam-take.spec.ts
        name: "asks for the zeroth answer before the start"
      - test: apps/tedrisat/test/e2e/exam-attempts.e2e.spec.ts
        name: "starts only with the zeroth question answered, in an order of the talebe's own"
    note: >-
      Owner: "'sıfırıncı soru' olacak, 'bizi aldatan bizden değildir' hadisi hakkında soru olacak her sınavda bu sıfırıncı soruda.
      mesela bu dönem 'bu hadisi ne zaman öğrendiniz' sorusu olacak, diğer dönem 'ne zaman ezberlersiniz' diye sorulacak. doğru yanlış
      cevabı olan bi soru değil." His answers: each exam's preparer writes it; it has options; it is answered before the start and is
      required; the hadith is shown in Arabic and in its meaning, fixed. Who reads the answers: nazar.exams.results and
      nizam.exams.zerothAnswers.

  - id: only-the-course-s-talebe
    need: >-
      Only a talebe who holds a seat in the exam's course, and is not barred from it, opens and takes the exam; to anyone else it is
      no exam at all, and the server refuses every call of theirs to it.
    evidence:
      - state: opening
      - state: notFound
      - node: notFoundAlert
      - source: apps/tedrisat/src/online-exam/exam-attempt.controller.ts:75
      - test: apps/tedrisat/test/e2e/exam-attempts.e2e.spec.ts
        name: "briefs the enrolled talebe with no question, and no one else"
    note: As the course's other content is read (an ENROLLED seat; a ban or a passive scope shuts it).

  - id: started-between-the-earliest-and-the-latest
    need: >-
      A talebe may start the exam at any time between its earliest and its latest start, and always gets its full length. Before the
      earliest start, the page says from when and until when it can be started, in the talebe's own time zone, and offers no start;
      it can be started at that time without a reload. After the latest start, the page says the time to start has passed and that
      the talebe did not take it. An attempt started in time goes on to its end.
    evidence:
      - state: notOpen
      - state: closed
      - node: notOpenAlert
      - node: closedAlert
      - source: apps/tedrisat/src/online-exam/exam-attempt.controller.ts:120
      - test: apps/tedrisat/test/e2e/exam-attempts.e2e.spec.ts
        name: "refuses to start before the earliest start and after the latest"
    note: >-
      Owner: "şimdilik 'en erken şu saatte en geç şu saatte sınava başlanmalı' olsun, süre kısalmasın, bunu da soralım"
      (nazar.exams.publish D1, decided on 22 Nov 2026: the latest start is the earliest plus 10 minutes by default, for lateness).

  - id: taken-once
    need: An exam is taken once. A talebe who finished it cannot start it again, and opening it leads to its result.
    evidence:
      - state: already_finished
      - node: alreadyTaken
      - source: apps/tedrisat/src/online-exam/errors/exam-attempt.errors.ts:46
    note: >-
      Not one of the owner's rules; it follows from "verilen cevap kabul edilecek". A second chance is a make-up exam, as exam
      celses have one today (LessonExam.isRetake).

  - id: own-order-of-questions-and-options
    need: >-
      Every talebe gets the questions in an order of their own, and each question's options in an order of their own, so that two
      talebe side by side do not see the same question or the same option in the same place.
    evidence:
      - state: question
      - test: apps/tedrisat/test/e2e/exam-attempts.e2e.spec.ts
        name: "starts only with the zeroth question answered, in an order of the talebe's own"
    note: "Owner: \"çoktan seçmeli, soru ve cevap sıraları karışık olacak her talebe için\". The order is drawn by the server when the attempt starts."

  - id: the-order-stays-for-the-attempt
    need: >-
      The order a talebe got stays the same for the whole attempt: after a reload, a lost connection or coming back later, the same
      questions are in the same places with their options in the same order.
    evidence:
      - state: resuming
      - state: question
      - source: apps/tedrisat/src/online-exam/exam-attempt.service.ts:372
      - test: apps/tedris/test/exam-take.spec.ts
        name: "goes on with an attempt in progress where the talebe was"

  - id: answered-as-the-question-asks
    need: >-
      Each question shows its text and its options, as radio buttons (the talebe chooses one) or as check boxes (the talebe marks as
      many as they think right), as the preparer chose. Nothing tells the talebe whether several options are correct, or how many.
      They can change their answer as long as the exam has not ended.
    evidence:
      - state: question
      - node: radioOptions
      - node: checkOptions
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:682
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:699
      - test: apps/tedrisat/test/e2e/exam-attempts.e2e.spec.ts
        name: "saves every answer by the page's count, and only what fits the question"
    note: >-
      Owner: "en az iki şık, üst limit yok, default'ta tek doğru ama istenirse birden fazla doğru olabilir"; "5 şıklı, 2'si doğru bi
      soruda sadece radio button olabilir. istenirse checkbox da olur"; asked whether the talebe is told: "Hiçbir şey söylenmez".
      How each is scored is nazar.exams.edit's.

  - id: saved-when-chosen
    need: >-
      Choosing an option saves it at once, and so does going on or back. There is no "send all answers": what the server holds when
      the exam ends is the talebe's answer. The question says that its answer is saved.
    evidence:
      - state: question
      - node: savedLine
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:246
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:614
      - test: apps/tedris/test/exam-take.spec.ts
        name: "shows a choice at once, and a late answer to an earlier save does not take it back"
    note: "Owner: \"her soruda cevap seçildiğinde ilerle geri git dendiğinde otomatik kaydolacak cevap, verilen cevap kabul edilecek direk 'sınav bitti tüm cevapları tek seferde gönder' demeye gerek yok\"."

  - id: an-answer-not-saved-is-said
    need: >-
      When an answer cannot be saved because the connection is gone, the page says so at that question, keeps the choice, and sends
      it as soon as it can. It never shows an answer as saved that the server does not hold.
    evidence:
      - state: question
      - node: offlineAlert
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:629
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:620
      - test: apps/tedris/test/exam-take.spec.ts
        name: "says Medaris was updated when a save names a gone Server Action, and keeps the choice for the reload"
    note: >-
      Built as a notice over the page, not at the question: "Bağlantı koptu" with the clock stopped, or "Medaris güncellendi" with
      "Sayfayı yenile" when a new version was deployed while the exam was open (#429). The unsent choices are kept in the tab and sent
      after the resume.

  - id: the-countdown-is-always-there
    need: >-
      A countdown of the time left, in minutes and seconds, is always on the screen, on a phone too. The time left is the server's
      count, so setting the device's clock gives no time; it does not run while the connection is lost.
    evidence:
      - state: question
      - node: timer
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:596
      - test: apps/tedris/test/exam-take.spec.ts
        name: "asks the server for the clock every 10 seconds while the countdown runs (EXM-TAKE-15)"
    note: "Owner: \"sınav ekranında geri sayım olacak\"."

  - id: the-last-five-minutes-stand-out
    need: >-
      When five minutes are left, the countdown turns red and says so in words as well ("Son 5 dakika"), so colour is not the only
      sign, and a screen reader is told once that five minutes are left, not every second.
    evidence:
      - state: question
      - node: lastFive
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:600
    note: "Owner: \"son 5 dk kala geri sayım mesela kırmızı olacak ki anlaşılsın\"."

  - id: the-time-running-out-ends-it
    need: >-
      When the time runs out, the exam ends by itself with the answers saved so far, and the talebe is told it ended because the
      time ran out.
    evidence:
      - state: timeUp
      - state: finished
      - node: finishedByTime
      - test: apps/tedris/test/exam-take.spec.ts
        name: "ends the exam when the time runs out, with the answers saved"
      - test: apps/tedrisat/test/e2e/exam-attempts.e2e.spec.ts
        name: "runs the clock only while the page calls, and ends the attempt when the time is up"
    note: >-
      Not one of the owner's first rules: without it an exam would never end for a talebe who stays on the page. Asked whether it
      should end by itself, the owner answered "önerdiğin gibi" (21 Nov 2026).

  - id: the-question-list
    need: >-
      A list of the questions, beside the question on a wide screen and behind a button on a phone, shows every question by its
      number and whether it is answered, skipped or not seen yet, marks the one shown, and takes the talebe to any question.
    evidence:
      - state: question
      - node: questionList
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:735
      - test: apps/tedris/test/exam-take.spec.ts
        name: "colours the question list: unanswered plain, answered blue, skipped dark yellow, the current one ringed"
    note: "Owner: \"soruların indicator'ü olabilir solda veya sağda falan, istediği soruya geri dönebilir böylece\"."

  - id: previous-and-next
    need: '"Önceki" and "Sonraki" move one question back or on, in the talebe''s own order.'
    evidence:
      - state: question
      - node: previousButton
      - node: nextButton
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:715
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:728

  - id: skip-a-question
    need: >-
      "Soruyu atla" leaves a question unanswered, marks it as skipped in the question list, and shows the next one. A skipped question
      can still be answered at any time.
    evidence:
      - state: question
      - node: skipButton
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:717
    note: "Owner: \"soruyu atla seçeneği olacak\"."

  - id: the-skipped-come-back-after-the-last
    need: >-
      After the last question, the talebe is taken to the first skipped question, and the page says that the skipped ones follow and
      how many there are. When none is skipped, the last question offers "Sınavı bitir".
    evidence:
      - state: skippedTurn
      - node: skippedNotice
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:536
    note: "Owner: \"son soruya gelindiğinde atlanan sorulara dönülecek\"."

  - id: finish-asks-once
    need: >-
      "Sınavı bitir" can be pressed at any time. It asks once, saying how many questions are unanswered or skipped and how much time
      is left; "Bitir" ends the exam and nothing can be changed after, "Sınava dön" goes back to the question.
    evidence:
      - state: confirmFinish
      - state: finished
      - node: finishButton
      - node: finishDialog
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:778
    note: "Owner: \"en son sınavı bitir butonuyla sınav bitecek\"."

  - id: resume-after-a-lost-connection
    need: >-
      If the connection is lost, the page is closed by accident or the device stops, the talebe opens the exam again and goes on
      where they stopped: the same question, every saved answer, and the time that was left when the connection was lost, since the
      clock does not run meanwhile. The page says the exam was resumed.
    evidence:
      - state: question
      - state: resuming
      - node: resumedNotice
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:430
      - test: apps/tedris/test/exam-take.spec.ts
        name: "sends the choices kept before a reload once the attempt is taken back"
    note: >-
      Owner: "sınav sırasında talebe koparsa kaldığı yerden devam edecek"; asked whether the clock runs meanwhile: "talebeye
      güvenilecek burada, böyle bi yolla kandırırsa Allah Teâlâ'ya hesap verir".

  - id: a-switch-is-counted
    need: >-
      A deliberate switch to another tab or window during the exam is counted, with its time, for the team. Nothing is erased: the
      exam goes on where it was, and the talebe is told the switch was counted.
    evidence:
      - state: notingSwitch
      - node: switchedNotice
      - test: apps/tedrisat/test/e2e/exam-attempts.e2e.spec.ts
        name: "counts a switch to another tab with its time, and erases nothing"
      - test: apps/tedris/test/exam-take.spec.ts
        name: "counts going to another window, not only another tab"
      - test: apps/tedris/test/exam-take.spec.ts
        name: "counts a hidden tab once, though both the tab and the window come back"
    note: >-
      The first draft started the exam again after a switch. Those who asked for exams answered, as the owner relayed on 22 Nov 2026:
      "tab değiştirme meselesinde sıfırlanıp baştan başlamayacak, sadece tab değişikliğini sayacağız" (D1, closed). Another window
      taking the focus counts as well, once the page has been away two seconds (#425, after the owner's "başka ekranlara geçtim sekme
      değiştirmedim ama saymamış"; the two seconds are my choice). Every switch is shown to the team with its time
      (nazar.exams.results).

  - id: the-switch-rule-is-told-first
    need: >-
      The briefing says, before the start, what a switch to another tab or window does. A talebe who comes back after a switch reads
      what happened, at once and in words.
    evidence:
      - state: briefing
      - state: notingSwitch
      - node: factSwitch
      - node: switchedNotice
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:836

  - id: one-place-at-a-time
    need: >-
      The exam is open in one tab on one device at a time. Opening it in a second place moves it there, and the first place says it
      is open elsewhere and takes no more answers.
    evidence:
      - state: opening
      - state: question
      - state: elsewhere
      - node: elsewhereAlert
      - test: apps/tedris/test/exam-take.spec.ts
        name: "says the exam is open elsewhere when another tab has taken it"
      - test: apps/tedrisat/test/e2e/exam-attempts.e2e.spec.ts
        name: "moves the attempt to the last page that opens it, which alone saves and finishes"
    note: "Owner, asked what a second tab or device does: \"Yeni yere taşınsın\". It is not counted as a switch."

  - id: the-key-never-reaches-the-browser
    need: >-
      The browser never receives which option is correct, nor the points of the answers, while the attempt is open: the server
      scores the exam. No talebe can read another's order or answers.
    evidence:
      - state: question
      - source: apps/tedrisat/src/online-exam/exam-attempt.service.ts:311
      - test: apps/tedrisat/test/e2e/exam-attempts.e2e.spec.ts
        name: "starts only with the zeroth question answered, in an order of the talebe's own"

  - id: answers-only-while-it-is-open
    need: >-
      The server takes an answer only from the talebe's own attempt, while it is in progress and its time is not over; an answer that
      comes later is refused, and the page says the exam has ended.
    evidence:
      - state: question
      - state: timeUp
      - test: apps/tedrisat/test/e2e/exam-attempts.e2e.spec.ts
        name: "refuses to start before the earliest start and after the latest"
      - test: apps/tedrisat/test/e2e/exam-attempts.e2e.spec.ts
        name: "finishes the attempts of an exam the team closed early"

  - id: arabic-in-questions
    need: >-
      A question or an option may be in Arabic, or mix Arabic and Turkish. Arabic is set right to left in the interface's Arabic face,
      and a quoted ayet in the Qur'an's face. A long question or option wraps and stays readable on a phone.
    evidence:
      - state: question
      - source: apps/tedris/features/online-exams/arabic.ts
      - test: apps/tedris/test/exam-take.spec.ts
        name: "zooms the whole exam step by step, spans the screen at the largest, and keeps it for a reload"
    note: The faces are the design system's (Scheherazade New for the Qur'an, Noto Naskh Arabic for other Arabic).

  - id: in-the-talebe-s-language
    need: >-
      The exam's own words, the briefing, the buttons, the countdown and the messages, are in the talebe's interface language
      (Turkish, English or Arabic), right to left in Arabic. The questions are in the language the course team wrote them in.
    evidence:
      - state: briefing
      - state: question
      - source: libs/i18n/src/locales/ar/tedris-learn.json
      - source: libs/i18n/src/locales/en/tedris-learn.json

  - id: keyboard-and-screen-reader
    need: >-
      The exam can be taken with the keyboard alone and with a screen reader. The options are a group of radio buttons named by the
      question, the question's number and the count are said ("12/50"), going to a question puts the focus on its text, and the
      question list says each question's state in words, not by colour alone.
    evidence:
      - node: radioOptions
      - node: questionListItem
    missing: "MDRS-299: built with roles and names (the options as a radio group or check boxes, the list's numbers named with their state, the countdown a timer), but not walked with the keyboard alone or with a screen reader"
    note: >-
      It is about the state question, which is built. Read from the code, not walked: the options' group is named "Şıklar", not by the
      question, and nothing moves the focus to a question (rules EXM-TAKE-9, EXM-TAKE-10).

  - id: the-end-says-what-comes-next
    need: >-
      After the end, the page says the exam is handed in and when, whether it ended by "Bitir" or by the time, and when and where the
      result can be read (Sınavlarım).
    evidence:
      - state: finished
      - node: resultWhere
      - node: toMine
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:938
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:940

  - id: the-text-size-can-change
    need: >-
      During the exam the talebe can make the text of the questions and their options bigger or smaller, from the question itself, and
      the briefing says so and shows what the buttons look like. Arabic is drawn at a size that reads.
    evidence:
      - state: question
      - node: textSmallerButton
      - node: textBiggerButton
      - node: factTextSize
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:654
      - test: apps/tedris/test/exam-take.spec.ts
        name: "zooms the whole exam step by step, spans the screen at the largest, and keeps it for a reload"
      - test: apps/tedris/test/exam-take.spec.ts
        name: "says in the briefing what A− and A+ do, and draws them"
    note: >-
      Owner, 22 Nov 2026: "arapça font boyutu küçük kalıyor, biraz büyütmemiz lazım 1 rem yapalım. bir de sınav sırasında soruların
      bi yerine yazı boyutu büyütme küçültme butonu ekleyelim. sınav öncesi bilmeniz gerekenler listesinde bu yazsın butonların neye
      benzediğini de göstersin".

  - id: the-list-says-each-state-by-colour
    need: >-
      The question list shows at a glance which questions are not answered, which are skipped and which are answered, and says the
      same in words; the briefing names the colours.
    evidence:
      - state: question
      - node: questionListItem
      - node: factColors
      - test: apps/tedris/test/exam-take.spec.ts
        name: "colours the question list: unanswered plain, answered blue, skipped dark yellow, the current one ringed"
      - test: apps/tedris/test/exam-take.spec.ts
        name: "names the list's colours among what to know before the start"
    note: >-
      Owner, 22 Nov 2026: "sınavlarda altta soru indicatorleri cevaplanmamışsa sarı olsun, atlanmışsa turuncu olsun, cevaplanmışsa
      beyaz/dark olsun". The design system has no orange; skipped uses the warning's bold fill.

  - id: a-new-version-loses-no-choice
    need: >-
      When a new version of Medaris is deployed while the exam is open, the page says so and how to go on, and no choice made on it is
      lost.
    evidence:
      - state: question
      - source: apps/tedris/features/online-exams/components/exam-take.tsx:620
      - test: apps/tedris/test/exam-take.spec.ts
        name: "says Medaris was updated when a save names a gone Server Action, and keeps the choice for the reload"
      - test: apps/tedris/test/exam-take.spec.ts
        name: "sends the choices kept before a reload once the attempt is taken back"
