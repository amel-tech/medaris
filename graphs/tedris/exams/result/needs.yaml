# What must exist for a talebe's own screen of a past online exam: written needs-first on 21 November 2026 from the owner's rules,
# then met by MDRS-299 (#418); each met need names its code or test. One is still missing: Notlarım does not link here.
schema: delurio-graph/0
kind: needs
id: tedris.exams.result
status: proposed
needs:
  - id: the-talebe-s-own-screen
    need: >-
      The screen is the talebe's own: it shows their attempt only, and of the others only counts: how many took the exam, the talebe's
      place among them and how many share it. To anyone but the talebe it is no screen at all.
    evidence:
      - state: opening
      - state: resultShown
      - node: notFoundAlert
      - source: apps/tedrisat/src/online-exam/my-exams.controller.ts:65
      - test: apps/tedrisat/test/e2e/my-exams.e2e.spec.ts
        name: "says how many took the exam and where the talebe stands, ties shared, in the exam and in each topic"
    note: >-
      The first draft showed no rank. The owner, 22 Nov 2026: "talebe sınav sonucunu gördüğünde 'sınava şu kadar kişi girdi, senin
      puanın şu, bu kadar kişiden şu sıradasınız' diye görülsün. aynı şekilde konu başına da bu sıralama olsun. eşit puan alanlar 'şu
      sıradasınız şu kadar kişi sizinle aynı puanı aldı' görsün".

  - id: waits-for-the-release
    need: >-
      Until the results are released, the screen says the exam was handed in and when, and "Sonuç henüz açıklanmadı", and shows no
      score and no answer.
    evidence:
      - state: awaitingRelease
      - node: handedIn
      - node: awaitingText
      - source: apps/tedris/features/online-exams/components/my-exam-result.tsx:166
      - test: apps/tedris/test/my-exams.spec.ts
        name: "before the release says only that it was handed in"
      - test: apps/tedrisat/test/e2e/my-exams.e2e.spec.ts
        name: "says before the release only that the exam was taken, when and how it ended"
    note: "Owner, asked whether the team releases the results as today: \"evet\"."

  - id: the-score-out-of-100
    need: >-
      Once released, the screen shows the score out of 100 (with at most two decimals), how many answers were right, wrong and left
      blank, when the exam was handed in, and whether the time ended it.
    evidence:
      - state: resultShown
      - node: scoreText
      - node: countsText
      - node: handedIn
      - source: apps/tedris/features/online-exams/components/my-exam-result.tsx:143
      - test: apps/tedris/test/my-exams.spec.ts
        name: "after the release shows the score, the counts and the topics, the weakest first"
    note: The points of each question are nazar.exams.edit's; a blank or a skipped question gets no points.

  - id: standing-by-topic
    need: >-
      For each topic of the exam, the talebe sees the percentage of the points its questions carry that they got, and how many of
      those questions they answered right and wrong, the weakest topic first. A question that carries two topics counts in both.
    evidence:
      - state: resultShown
      - node: topicLine
      - node: topicBar
      - source: apps/tedris/features/online-exams/components/my-exam-result.tsx:178
      - test: apps/tedrisat/test/e2e/my-exams.e2e.spec.ts
        name: "scores and stands by topic once released, and opens the answers once closed for everyone"
    note: "Owner: \"konulara göre talebe hangi konularda ne durumda olduğunu görebilecek\"; asked how it is shown: \"Yalnız yüzde\"."

  - id: standing-across-the-course
    need: The talebe sees their percentage in each topic of the course over all the course's exams that carried it.
    evidence:
      - state: resultShown
      - node: courseTopicLine
      - source: apps/tedris/features/online-exams/components/my-exam-result.tsx:233
      - test: apps/tedrisat/test/e2e/my-exams.e2e.spec.ts
        name: "adds the standing up across the course's released exams"
    note: "The topics are the course's (owner, asked whose they are: \"dersin\"), so they add up across exams."

  - id: own-answers-beside-the-correct-ones
    need: >-
      Once the results are released and the exam has closed for everyone, the talebe reads each question again, in their own order,
      with their answer, the correct one, and the points got.
    evidence:
      - state: resultShown
      - node: givenAnswer
      - node: correctAnswer
      - node: pointsGot
      - test: apps/tedris/test/my-exams.spec.ts
        name: "once closed for everyone opens the answers with the correct options"
      - test: apps/tedrisat/test/e2e/my-exams.e2e.spec.ts
        name: "scores and stands by topic once released, and opens the answers once closed for everyone"
    note: "Owner, asked whether the talebe reads their answers with the correct ones: \"evet\"."

  - id: in-notlarim-with-the-other-exams
    need: >-
      The score also stands in the course's "Notlarım" tab beside the course's other exams, and reaches this screen from there.
    evidence:
      - source: apps/tedris/app/my-exams/[lessonId]/page.tsx:15
    missing: "MDRS-299: the score is written to the celse's ExamResult (#417), so Notlarım lists it with the other exams, but Notlarım does not link to this screen yet"
    note: tedris.course.grades lists exam celses today, and an online exam is one (owner, 21 Nov 2026). It is about the state resultShown, which is built.

  - id: words-and-numbers-not-colour-alone
    need: >-
      Every standing is said in words and numbers; a bar or a colour only repeats it, and a chart has the same figures as text for a
      screen reader.
    evidence:
      - state: resultShown
      - node: topicLine
      - node: courseTopicLine
      - source: apps/tedris/features/online-exams/components/my-exam-result.tsx:195
