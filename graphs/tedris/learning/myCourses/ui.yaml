  ongoingRegion: { type: page, component: Page, role: region, name: { labelledBy: ongoingHeading }, in: [listed], source: apps/tedris/features/courses/components/my-courses-page.tsx:235 }
  ongoingHeading: { type: text, component: Heading, role: heading, text: { key: MyCoursesPage.ongoingTitle }, in: [listed], source: apps/tedris/features/courses/components/my-courses-page.tsx:44 } # h2, id my-ongoing
  ongoingCount: { type: text, component: Text, text: { key: MyCoursesPage.ongoingCount, params: { count: ongoingCount } }, in: [listed], source: apps/tedris/features/courses/components/my-courses-page.tsx:47 } # "{n} ders", beside the h2, not inside it (a span.mds-caption)
  ongoingEmpty: { type: text, component: Text, text: { key: MyCoursesPage.ongoingEmpty }, in: [listed], when: "not hasCard", source: apps/tedris/features/courses/components/my-courses-page.tsx:247 }
