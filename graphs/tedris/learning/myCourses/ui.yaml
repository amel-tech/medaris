  cardBadge: { type: text, component: Text, text: { key: MyCoursesPage.statusEnrolled }, in: [listed], when: hasCard, repeat: courses.ongoing, source: apps/tedris/features/courses/components/my-courses-page.tsx:107 } # "Devam ediyor", a brand badge
  cardTrigger: { type: action, component: Button, role: button, intent: secondary, name: { key: CoursePage.moreActionsFor, params: { title: course.title } }, in: [listed], when: hasCard, repeat: courses.ongoing, emits: OPEN_MENU, source: apps/tedris/features/courses/components/my-courses-page.tsx:108 } # an icon only, aria-haspopup=menu; the menu it opens is tedris.course.leave's
  cardPlace: { type: text, component: Text, text: { key: composed.MyCoursesPage.place, params: { place: course.place } }, in: [listed], when: hasCard, repeat: courses.ongoing, source: apps/tedris/features/courses/components/my-courses-page.tsx:138 }
  cardProgress: { type: text, component: Text, role: progressbar, name: { key: MyCoursesPage.progress }, in: [listed], when: hasCard, repeat: courses.ongoing, source: apps/tedris/features/courses/components/my-courses-page.tsx:142 } # Base UI Progress, named by its visible label; aria-valuenow is the value, aria-valuetext the percent
  cardPercent: { type: text, component: Text, text: { key: composed.MyCoursesPage.percent, params: { percent: course.percent } }, in: [listed], when: hasCard, repeat: courses.ongoing, source: apps/tedris/features/courses/components/my-courses-page.tsx:142 } # the visible value, aria-hidden (the bar's aria-valuetext says it)
  nextLabel: { type: text, component: Text, text: { key: MyCoursesPage.nextSession }, in: [listed], when: "hasCard and nextPlanned", repeat: courses.ongoing, source: apps/tedris/features/courses/components/my-courses-page.tsx:121 } # the first words of the card's footer
  nextTime: { type: text, component: Text, role: time, text: { key: composed.MyCoursesPage.moment, params: { moment: course.nextSession } }, in: [listed], when: "hasCard and nextPlanned", repeat: courses.ongoing, source: apps/tedris/features/courses/components/my-courses-page.tsx:125 } # a <time datetime> in the viewer's zone
  nextWeek: { type: text, component: Text, text: { key: MyCoursesPage.week, params: { week: course.nextSession.week } }, in: [listed], when: "hasCard and nextPlanned", repeat: courses.ongoing, source: apps/tedris/features/courses/components/my-courses-page.tsx:131 }
  noNext: { type: text, component: Text, text: { key: MyCoursesPage.noNextSession }, in: [listed], when: "hasCard and nextNone", repeat: courses.ongoing, source: apps/tedris/features/courses/components/my-courses-page.tsx:134 }

  # ---- "Başvurularım": a row for each PENDING application ----
  applicationsRegion: { type: page, component: Page, role: region, name: { labelledBy: applicationsHeading }, in: [listed], source: apps/tedris/features/courses/components/my-courses-page.tsx:264 }
  applicationsHeading: { type: text, component: Heading, role: heading, text: { key: MyCoursesPage.applicationsTitle }, in: [listed], source: apps/tedris/features/courses/components/my-courses-page.tsx:44 } # h2, id my-applications
  applicationsCount: { type: text, component: Text, text: { key: MyCoursesPage.applicationsCount, params: { count: applicationsCount } }, in: [listed], source: apps/tedris/features/courses/components/my-courses-page.tsx:47 } # "{n} başvuru onay bekliyor"
  applicationsEmpty: { type: text, component: Text, text: { key: MyCoursesPage.applicationsEmpty }, in: [listed], when: "not hasRow", source: apps/tedris/features/courses/components/my-courses-page.tsx:276 }
  applicationLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: composed.MyCoursesPage.title, params: { title: course.title } }, in: [listed], when: hasRow, repeat: courses.applications, emits: OPEN_APPLIED, source: apps/tedris/features/courses/components/my-courses-page.tsx:163 } # a link of class mds-h4, not a heading (MYC-1)
  applicationPlace: { type: text, component: Text, text: { key: composed.MyCoursesPage.place, params: { place: course.place } }, in: [listed], when: hasRow, repeat: courses.applications, source: apps/tedris/features/courses/components/my-courses-page.tsx:166 }
  appliedOn: { type: text, component: Text, text: { key: MyCoursesPage.appliedOn, params: { date: course.appliedAt } }, in: [listed], when: hasRow, repeat: courses.applications, source: apps/tedris/features/courses/components/my-courses-page.tsx:307 } # the date of the enrolment's createdAt, in the viewer's zone
  applicationBadge: { type: text, component: Text, text: { key: MyCoursesPage.statusPending }, in: [listed], when: hasRow, repeat: courses.applications, source: apps/tedris/features/courses/components/my-courses-page.tsx:292 } # a warning badge with a clock icon, so the state is not colour only
  rowWithdraw: { type: action, component: Button, role: button, intent: secondary, name: { key: composed.MyCoursesPage.withdrawNamed, params: { title: course.title } }, text: { key: MyCoursesPage.withdraw }, in: [listed], when: hasRow, repeat: courses.applications, emits: WITHDRAW, source: apps/tedris/features/courses/components/application-row.tsx:61 } # ghost, small; asks nothing; its call is the leave call (DSC-03), which tedris.course.leave draws

  # ---- "Erişiminin kaldırıldığı dersler": drawn only when the course team took a seat away ----
  revokedRegion: { type: page, component: Page, role: region, name: { labelledBy: revokedHeading }, in: [listed], when: hasRevoked, source: apps/tedris/features/courses/components/my-courses-page.tsx:322 }
  revokedHeading: { type: text, component: Heading, role: heading, text: { key: MyCoursesPage.revokedTitle }, in: [listed], when: hasRevoked, source: apps/tedris/features/courses/components/my-courses-page.tsx:44 } # h2, id my-revoked
  revokedCount: { type: text, component: Text, text: { key: MyCoursesPage.revokedCount, params: { count: revokedCount } }, in: [listed], when: hasRevoked, source: apps/tedris/features/courses/components/my-courses-page.tsx:47 }
