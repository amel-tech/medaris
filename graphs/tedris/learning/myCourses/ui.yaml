  completedBadge: { type: text, component: Text, text: { key: MyCoursesPage.statusCompleted }, in: [listed], when: hasCompleted, repeat: courses.completed, source: apps/tedris/features/courses/components/my-courses-page.tsx:397 } # a success badge with a check
  recordingsLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: MyCoursesPage.recordings }, in: [listed], when: hasCompleted, repeat: courses.completed, emits: OPEN_RECORDINGS, source: apps/tedris/features/courses/components/my-courses-page.tsx:403 } # ghost, small; every row has one with the same name, and it opens the course page, not the recordings (DSC-11)

edges:
  - { labelledBy: [ongoingRegion, ongoingHeading] }
  - { labelledBy: [applicationsRegion, applicationsHeading] }
  - { labelledBy: [revokedRegion, revokedHeading] }
  - { labelledBy: [completedRegion, completedHeading] }
  - { triggers: [calendarLink, calendar_opened] }
  - { triggers: [discoverLink, discover_opened] }
  - { triggers: [retryLink, reading] }
  - { triggers: [cardLink, course_opened] }
  - { triggers: [cardTrigger, handed_over.leave_menu] }
  - { triggers: [rowWithdraw, handed_over.withdraw] }

rules:
  - { id: DSC-03, rule: "\"Başvuruyu geri çek\" on a row calls the server action leaveCourse (application-row.tsx:42), DELETE /courses/:id/enrollment, not withdrawEnrollment (DELETE /courses/:id/enroll). The leave route also deletes an ENROLLED row: Derslerim is read once and is not live, so when the course team approves an application while the page is open the button deletes the new seat and its progress with no confirmation, and the row looks the same as before. The transition WITHDRAW hands over to tedris.course.leave, which draws the call and its outcomes. Fix: call withdrawEnrollment and treat a 404 as 'changed meanwhile, read the page again', as the course page does (leave-course.tsx:34-41)." }
  - { id: DSC-04, rule: "After a row is withdrawn, or a card is left, the control that had the focus is gone and no code moves the focus: it falls to the document, and the withdrawn row says nothing (no toast). Drawn by tedris.course.leave; recorded here because this page is where the keyboard user is left. Fix: focus the section's h2 (tabIndex -1) or the next row, and say it with a status." }
  - { id: DSC-11, rule: "Every row of \"Tamamladığın dersler\" has a link \"Ders kayıtlarına git\" whose accessible name is the same on every row (a list of links reads N identical names), and its address is /courses/<id>, the course page, not its recordings tab (my-courses-page.tsx:403-409). Fix: aria-label \"Ders kayıtlarına git: {ders}\" and /courses/<id>?tab=kayitlar, which the course page already reads (course-page.tsx:121). Decision D1 of the flow." }
  - { id: DSC-12, rule: "An ongoing card's cover is passed as the Card's `media` at size sm with no aria-hidden (my-courses-page.tsx:104), and CoverPattern draws the course's Arabic label as a <p class=\"mds-eyebrow mds-cover__label\"> for every size but xs (cover-pattern.tsx:75-85), so a screen reader reads an unexplained Arabic word before the card's title; the other three sections' covers are xs and aria-hidden. Read from the code: the seed's courses have no coverLabel, so the walk does not show it. Fix: aria-hidden=\"true\" on the cover." }
  - { id: DSC-19, rule: "The loading state, app/my-courses/loading.tsx:7, is a <main aria-busy=\"true\"> of Skeletons with no heading and no word, so nothing tells a screen reader the page is loading (aria-busy is not announced). It is not a state of this flow's graph. Fix: a visually hidden \"Yükleniyor\" status." }
  - { id: MYC-1, rule: "new, proposed id. A course is an h3 heading (the card's title) in \"Devam eden dersler\" and a plain link of class mds-h4 in the other three sections (my-courses-page.tsx:163), so a heading list holds only the ongoing courses and the three other sections' courses are reachable only by links or by reading. Fix: draw the titles of the rows as headings of the same level, or draw none of them as headings." }
  - { id: focus-not-set, rule: "Derslerim sets no focus when it opens (no autoFocus and no focus() in the page or in its components; document.activeElement is body, measured), so the page node has no `initialFocus` and the graph says nothing of the focus when the page opens. Recorded so the silence is not read as an omission; the inventory does not call it a finding." }
  - { id: label-in-name, rule: "The row button's visible text \"Başvuruyu geri çek\" is contained in its name \"Başvuruyu geri çek: {ders}\" (WCAG 2.5.3). Holds. The card's \"···\" button is an icon only and its name \"Diğer işlemler: {ders}\" says which course it belongs to; on the course page the same button is named \"Diğer işlemler\" alone (tedris.course.leave)." }
  - { id: not-live, rule: "The page is read once on the server and has no live region and no refresh timer: a seat the course team approves, or a course that is completed, while it is open stays where it was drawn until the page is read again (by a reload, by a leave or a withdrawal, which revalidate it). This is what DSC-03 relies on." }
