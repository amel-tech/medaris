# The screens of tedris.learning.myCourses: tedris-web's Derslerim (/my-courses, app/my-courses/page.tsx), drawn by
# features/courses/components/my-courses-page.tsx and its application-row.tsx: the page with its four sections, the page with nothing on it, and the
# alert that takes the sections' place when the read fails. The "···" menu, its window and the row's own call are tedris.course.leave's; this
# file draws their buttons and no more. The frame (bar, footer) is tedris.shell.frame's.
#
# Words: every `MyCoursesPage.*`, `CalendarSubscription.link` and `CoursePage.*` key is copied letter for letter from
# libs/i18n/src/locales/tr/tedris.json (the app reads it as `tedris`), the key being the path inside that file. The `composed.*` keys are NOT in any
# i18n file: they are the texts the app builds in code from data and messages, written here with their placeholders (a placeholder the binding
# gives no sample for matches any text):
#   composed.MyCoursesPage.title         "{title}"    a course's title, as the API gives it (card title my-courses-page.tsx:103, a row's link :164)
#   composed.MyCoursesPage.place         "{place}"    the line "<medrese> · <köşk> · <hocas>" (placeAndTeachers, my-courses-page.tsx:57-85); a course of
#                                                     no medrese has no first part, the imam's star is out of view
#   composed.MyCoursesPage.moment        "{moment}"   the celse's day, weekday and clock in the viewer's zone ("17 Kas Sal 21:00"), my-courses.ts:62
#   composed.MyCoursesPage.percent       "{percent}"  the progress as Intl writes it in Turkish ("%40"), libs/ui/src/mds/progress.tsx:40-43
#   composed.MyCoursesPage.withdrawNamed "Başvuruyu geri çek: {title}"  the row button's aria-label, application-row.tsx:65
# No catalog entry is authored here: the page changes nothing by itself (the actions it hands over are tedris.course.leave's, which has `changes`).
schema: delurio-graph/0
kind: ui
id: tedris.learning.myCourses
flow: tedris.learning.myCourses
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples:
  title: Örnek Ders
  place: Örnek Medrese · Örnek Köşk · Örnek Hoca
  moment: 17 Kas Sal 21:00
  percent: '%40'
  week: '3'
  date: 15 Kasım 2026
  count: '1'

nodes:
  # ---- the page and what every state of it draws: the title, the subtitle and the link to the subscription ----
  listMain: { type: page, component: Page, role: main, in: [empty, listed, loadFailed], source: apps/tedris/features/courses/components/my-courses-page.tsx:199 } # no name and no initial focus: the <main> is not labelled and nothing moves the focus when the page opens (rule focus-not-set)
  listTitle: { type: text, component: Heading, role: heading, text: { key: MyCoursesPage.title }, in: [empty, listed, loadFailed], source: apps/tedris/features/courses/components/my-courses-page.tsx:202 } # h1
  listSubtitle: { type: text, component: Text, text: { key: MyCoursesPage.subtitle }, in: [empty, listed, loadFailed], source: apps/tedris/features/courses/components/my-courses-page.tsx:203 }
  calendarLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: CalendarSubscription.link }, in: [empty, listed, loadFailed], emits: OPEN_CALENDAR, source: apps/tedris/features/courses/components/my-courses-page.tsx:205 } # a link drawn as a button, with a calendar icon; to /account/calendar

  # ---- when the read failed: an alert in place of every section ----
  loadFailedAlert: { type: alert, component: Alert, role: alert, text: { key: MyCoursesPage.loadErrorTitle }, in: [loadFailed], source: apps/tedris/features/courses/components/my-courses-page.tsx:215 } # tone error, so role alert; it takes no focus
  loadFailedText: { type: text, component: Text, text: { key: MyCoursesPage.loadError }, in: [loadFailed], source: apps/tedris/features/courses/components/my-courses-page.tsx:216 }
  retryLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: MyCoursesPage.retry }, in: [loadFailed], emits: RELOAD, source: apps/tedris/features/courses/components/my-courses-page.tsx:218 } # href="": the page's own address, so the whole page is read again

  # ---- a person with no seat at all: one sentence and the way to Keşfet ----
  emptyText: { type: text, component: Text, text: { key: MyCoursesPage.noCourses }, in: [empty], source: apps/tedris/features/courses/components/my-courses-page.tsx:231 }
  discoverLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: MyCoursesPage.goDiscover }, in: [empty], emits: OPEN_DISCOVER, source: apps/tedris/features/courses/components/my-courses-page.tsx:226 }

