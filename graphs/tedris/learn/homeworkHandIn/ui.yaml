# The screens of tedris.learn.homeworkHandIn: the section "Ödev" of tedris-web's celse page (/courses/<course>/lessons/<celse>,
# features/courses/components/session-homework.tsx, mounted at session-page.tsx:151), as an enrolled talebe meets it. The page around it
# (the header, the join card, the notes, the agenda, the resources, the pager) is tedris.celse.attend's and its siblings'; here only the
# page's <main> and the section are drawn. A homework recited to the hoca (kind MEMORIZE) draws another section: tedris.learn.homeworkMemorize.
#
# Words: every `Homework.*` key is copied letter for letter from libs/i18n/src/locales/tr/tedris-learn.json (the app reads it as
# `tedrisLearn.Homework.*`); the key is the path inside that file. `Changes.note` is the one message of this catalog that is NOT the app's:
# the app has none that says what the section does to the person's data (its own "Not kaydedildi." tells only of the note), so one short,
# factual Turkish sentence is authored here: what is kept, who reads it, what can be changed and what cannot be undone. The
# `composed.HomeworkHandIn.*` keys are texts the app builds in code from a value the API gives, written with their placeholders so a replay
# can match them (a placeholder with no sample matches any text):
#   composed.HomeworkHandIn.description     the hoca's description, as written                                  session-homework.tsx:802
#   composed.HomeworkHandIn.assignmentFile  a hoca's file link: its name + the hidden " (indirilir)"           session-homework.tsx:848-851
#   composed.HomeworkHandIn.ownFile         a talebe's file link: its name + the hidden " (indirilir)"         session-homework.tsx:924-927
#   composed.HomeworkHandIn.changedAt       the day and the time of the last change, Intl in the viewer's zone  session-homework.tsx:644
# `{name}`, `{file}`, `{maxFiles}` and `{maxSize}` take one sample each: a state that shows two different file names (a refused row beside a
# stored file) reads as the sample twice, and a walk gives such files one name. The size and type chips of the file rows are not drawn.
schema: delurio-graph/0
kind: ui
id: tedris.learn.homeworkHandIn
flow: tedris.learn.homeworkHandIn
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples:
  description: Üçüncü bâbın mâzî çekimlerini deftere yaz ve sonraki derse getir.
  assignmentFile: ders-notu.pdf
  file: ödev.pdf
  name: ödev.pdf
  updatedAt: 15 Kasım 21:34
  maxFiles: "10"
  maxSize: 25 MB
changes: { key: Changes.note }

