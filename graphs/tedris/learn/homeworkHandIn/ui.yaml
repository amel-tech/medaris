rules:
  - { id: focus-not-set, rule: "The section sets no focus: opening the page leaves it at the document's start, and session-homework.tsx has no autoFocus and no .focus() call (grep verified). The graph draws no initialFocus and no focus. There is no dialog: the removal question is an inline row." }
  - { id: no-storage-locally, rule: "File storage (Bunny Storage) is not set on the local stack, so tedrisat's upload gate answers 503 STORAGE_NOT_CONFIGURED to every file before it reads the body (apps/tedrisat/src/storage/upload.ts:113): the row says \"Dosyalar şu an kaydedilemiyor...\". The graph draws both outcomes of a file (`file: stored`, `file: noStorage`); a local walk can reach only the second, and downloads answer 503 the same way. A file row for a removal walk is written into the database by SQL, because the upload route is the only way in. Not a defect of the app." }
  - { id: WRT-01, rule: "session-homework.tsx:938-971, 599-606: the trash button, \"Kaldır\", \"Vazgeç\" and a failed row's \"Kapat: <file>\" each unmount the button that had the focus and nothing moves it: the question does not take the focus, a removed row leaves it on the document. Fix: focus the question's first button on confirm and the row's trigger or the list on the way out. Not verified in a browser; the graph says nothing of the focus in these states." }
  - { id: WRT-03, rule: "session-homework.tsx:1056, 1085-1089: the note's refusal is a paragraph with role alert after the form: announced when it appears, but the textarea is only marked invalid (the kit's `invalid` is meant for a reason shown elsewhere) and does not point at it. Fix: pass the sentence as the Field's `error`." }
  - { id: WRT-07, rule: "session-homework.tsx:589-592: \"Yükleniyor…\" is a plain span with aria-busy, which announces nothing; the progress of an upload is silent until \"<file> eklendi.\" (the polite output) or the alert. Fix: put the text in the polite status or give the list aria-busy." }
  - { id: WRT-08, rule: "apps/tedris/features/courses/file-model.ts:178-212: SUBMISSION_FILES_NOT_TAKEN (409, the homework became recited while the page was open) is not mapped by its code, so status 409 reads as the quota: \"En çok 10 dosya ekleyebilirsin. Yenisi için birini kaldır.\" The graph's `file: overQuota` stands for both. Rare. Fix: map the code to its own message." }
  - { id: WRT-09, rule: "session-homework.tsx:112-113: the component's doc says \"at most 5\" files and test/homework-card.spec.ts:132 mocks the API's limit as 5; the limit is 10 (libs/services/src/file-rules/file-rules.ts:15, apps/tedrisat/src/lesson-submission/dto/lesson-submission.dto.ts:7, MDRS-296) and the page prints the API's number. Documentation only; the graph says 10." }
  - { id: WRT-10, rule: "libs/services/src/file-proxy/file-proxy.ts:351-370: a refused download of the hoca's file, of one's own or of a returned one is a 303 back to this page: the whole page loads again, focus and scroll reset, a note typed and not saved is lost, and the reason shows as a Sonner toast whose region is named \"Notifications alt+T\", an English default. tedris.files.download draws it." }
