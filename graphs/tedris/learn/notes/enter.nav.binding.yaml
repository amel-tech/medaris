# The way into tedris.learn.notes: the course page of the walk's own course, then the link to its next celse ("Devam et"). The nav
# binding gives no locator for an entry that needs an item (`data: true`), so this file names the celse by its address.
schema: delurio-graph/0
kind: binding
nav: tedris.nav
extends: ../../nav/binding.yaml

entries:
  'course->celse CoursePage.continue': { css: 'a[href="/courses/{course}/lessons/{lesson}"]', nth: 0 }
