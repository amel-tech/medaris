# What must exist for a talebe to recite a homework to the hoca and read the mark: the flow's product list, from its story and from the
# domain's rules, never from what the card does today. A need not met is a known gap (graphs/needs.gaps.yaml, merged by the orchestrator).
#
# Missing or unwalked, for the orchestrator's gaps merge:
#   missing:  told-when-marked (none), failed-read-can-be-retried (none; WRT-06), mark-is-named-as-the-hocas (none; MEMO-2),
#             earlier-heading-says-what-it-lists (none; MEMO-3), kind-of-homework-is-content (none; the domain finding
#             evaluation-probe-leaks-homework-kind)
#   unwalked: see-what-to-recite (code, no e2e and no replay run yet), earlier-work-stays-readable (unit spec only; a file cannot be stored
#             on the local stack), a-completed-talebe-reads-the-mark (no data, no walk), refused-read-is-told (bound nowhere: the stack cannot
#             make the read fail)
# Nothing here is walked by a replay yet: the owner moved every replay to the end, so `walked` holds only e2e checks that exist today.
# The binding's scenarios (waits, marked, incomplete, absent, note, reviewed) are written and load; they are walked in the walk phase.
# Nothing here carries a kontenjan or a gender rule: a mark has neither.
kind: needs
flow: tedris.learn.homeworkMemorize
status: proposed

needs:
  - id: see-what-to-recite
    need: >-
      A talebe who holds a seat in the course sees, on the celse, what the hoca has asked them to recite, and is told in so many words that
      nothing is handed in for it: the hoca listens and marks. There is no field or button to hand anything in.
    drawn:
      - waiting
      - marked
    built:
      - action: medaris.api:getSession
      - route: apps/tedris/features/courses/components/session-homework.tsx:173
    walked: []

  - id: no-file-for-a-recital
    need: >-
      A homework that is recited takes no file: the card offers no way to hand one in, and tedrisat refuses one that is sent anyway,
      so that a talebe never has a hand-in that nobody reads.
    drawn:
      - waiting
    built:
      - action: medaris.api:addMySubmissionFile
      - route: apps/tedris/features/courses/components/session-homework.tsx:173
    walked:
      - e2e: apps/nazar/e2e/evaluation.e2e.ts
        check: 'evaluation#3'

  - id: read-own-mark
    need: >-
      A talebe reads their own mark of the recital, and only their own: "Bekliyor" until the hoca has marked, then "Tam", "Eksik" or
      "Vermedi", with the hoca's note when they wrote one.
    drawn:
      - reading
      - waiting
      - marked
    built:
      - action: medaris.api:getMyEvaluation
      - route: apps/tedris/features/courses/components/session-homework.tsx:189
    walked:
      - e2e: apps/nazar/e2e/evaluation.e2e.ts
        check: 'evaluation#1'
      - e2e: apps/nazar/e2e/evaluation.e2e.ts
        check: 'evaluation#3'

  - id: talebe-cannot-mark-themselves
    need: >-
      Only the course team marks a recital: a talebe cannot save a mark, their own included, and reads no board of the others.
    drawn:
      - waiting
    built:
      - action: medaris.api:saveEvaluation
    walked:
      - e2e: apps/nazar/e2e/evaluation.e2e.ts
        check: 'evaluation#3'

  - id: told-when-marked
    need: >-
      When the hoca has marked the recital the talebe is told, and a card that is open shows the mark without a reload, as a homework
      review and a released exam both reach the talebe (SUBMISSION_REVIEWED, EXAM_RESULTS_RELEASED).
    drawn:
      - waiting
    missing: none

  - id: failed-read-can-be-retried
    need: >-
      When the mark cannot be read, the card says so and offers to read it again, as the notes, the questions and the file card do.
    drawn:
      - loadFailed
    missing: none

  - id: mark-is-named-as-the-hocas
    need: >-
      The mark says, to a person who cannot see the layout, whose mark it is and of what: not the word "Tam" alone beside the heading.
    drawn:
      - waiting
      - marked
    missing: none

  - id: kind-of-homework-is-content
    need: >-
      Which celses carry a recited homework is read only by those who may read the course's content, as the list of grades does for a
      caller it is closed to; a stranger of an open course learns nothing from the read of a mark.
    drawn:
      - reading
    missing: none

  - id: earlier-work-stays-readable
    need: >-
      What a talebe handed in before the hoca switched the homework to recited stays theirs: it is listed, the files can be downloaded and
      removed, the note is read-only, and the hoca's review of it stays readable; nothing new can be added.
    drawn:
      - waiting
      - marked
    built:
      - action: medaris.api:getMySubmission
      - route: apps/tedris/features/courses/components/session-homework.tsx:283
    walked: []

  - id: earlier-heading-says-what-it-lists
    need: >-
      The heading over the earlier work says what is listed: a talebe who handed in only a note is not told they handed in files.
    drawn:
      - waiting
      - marked
    missing: none

  - id: a-completed-talebe-reads-the-mark
    need: >-
      A talebe who has completed the course still reads their mark and the hoca's note on the celse (the card is drawn for an ENROLLED or a
      COMPLETED seat).
    drawn:
      - marked
    built:
      - route: apps/tedris/features/courses/lesson-note-model.ts:21
    walked: []

  - id: refused-read-is-told
    need: >-
      A mark that the API refuses (the course's scope has turned passive, or the homework is no longer recited) is told to the talebe in
      words, not left as a card with no mark.
    drawn:
      - loadFailed
    built:
      - action: medaris.api:getMyEvaluation
      - route: apps/tedris/features/courses/components/session-homework.tsx:270
    walked: []
