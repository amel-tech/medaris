# A talebe who holds a seat moves through the celses of the course from the bottom row of a celse page: the card of the previous celse,
# the card of the next one, and the button "Müfredat" between them, which opens the whole programme in a popup. Written from the code of
# the branch (captured); nothing here is a plan. What it leaves to other flows is in scope.outOfView.
#
# Findings this flow touches (ui.yaml `rules` carries the same ids):
#   CLS-04   the button says aria-haspopup="listbox" but the popup is an unnamed div that holds a link, a search field and the listbox
#            (session-curriculum.tsx:360, :398-502)
#   CLS-05   "Bu aramaya uyan celse yok." comes in with no live region and no count (session-curriculum.tsx:443-445)
#   CLS-09   a row's mark ("Şu an canlı", "Bu celse", "iptal", "sona erdi") is worked out once on the server and never moves while the
#            page is open (session-pager.tsx:106-147); not walked
#   SE-01    the e2e (session.e2e.ts:187) expects the listbox to have the focus when the popup opens; the code focuses the selected
#            option inside it (session-curriculum.tsx:238-249); measured on the stack with a probe of a browser (no replay was run in the writing phase)
#   BROWSE-1 (new, provisional id) the popup's title reads "Müfredat8 celse" in the accessibility tree (measured on a course of eight celses): the separator between the two
#            words is aria-hidden and no space stands in its place (session-curriculum.tsx:410-418); measured with a snapshot, not
#            heard with a screen reader
# E2E carried: session#5 (the pager: the cancelled celse skipped, a card is followed) and session#7 (the popup: this celse selected, the
# cancelled one marked, the link to the programme, Esc gives the focus back, a query and Enter), with the one change that session#7 a2
# is STALE (SE-01) and the graph says what the code does. Not carried: celse-states#2 (the row of a celse on air reads "Bu celse" and
# "Şu an canlı"): it needs a celse that is on air now, which tedris.celse.attend moves one to.
schema: delurio-graph/0
kind: flow
id: tedris.celse.browseCurriculum
status: captured
domain: medaris.api
ui: tedris.celse.browseCurriculum
title: Move through a course's celses from the celse page
summary: >-
  An enrolled talebe is on a celse page. The last thing on it is a row, "Celseler arasında", with three parts: the card of the previous
  celse ("Önceki · Hafta 3", its title, its day), the button "Müfredat: Hafta 4 / 6, ..." with a thin bar, and the card of the next celse.
  A cancelled celse is never a neighbour: the cards skip it. The first celse of a course has no card before it and the last has none
  after it. A card is a plain link and loads the other celse's page in full. The button opens a popup, with the mouse or with the
  Down and Up arrows once the button has the focus: the title "Müfredat · 6 celse", the link "Ders sayfasında aç" (the programme tab of
  the course page), a search field "Celse ara", and a list of every celse of the course in programme order, this one selected and
  holding the focus. A row says where its celse stands: done, "Bu celse", "İptal edildi", or nothing for a celse still ahead. Typing in
  the search field keeps the rows that answer ("hafta 2" finds the week 2 celse; a number is a week or a number standing alone in a
  title); a query that finds nothing says "Bu aramaya uyan celse yok.". Enter in the field, or in the list on another row, goes to that
  celse; Enter on this celse's own row only closes the popup. Esc closes it and gives the focus back to the button. The popup is not a
  window: the page behind it stays alive.

scope:
  shows: the row "Celseler arasında" of the celse page (the two cards and the button) and the popup the button opens
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "the rest of the celse page (header, the card with the join link, the exam, notes, homework, agenda, resources): tedris.celse.attend, tedris.learn.notes, tedris.files.download"
    - "a celse on air or a celse with a recording: the row's marks \"Şu an canlı\" and \"Kayıt var\" (celse-states#2): tedris.celse.attend, tedris.celse.watchRecording"
    - "the cancelled celse's own page and the make-up link: tedris.celse.cancelled"
    - "the same row on the page of a talebe with no seat: the locked page has no pager: tedris.celse.locked"
    - "the keys that move inside the list (arrows, Home, End, Page keys), Space on a row, a typed letter that starts a search, Backspace: they move the active row or the query, and the popup stays in one of the states drawn"
    - "closing without Esc, other than by the button or a card: a press outside the popup (closes; the focus goes to the button only when the press landed on nothing focusable), Tab out of the popup (closes, the focus goes on to the next control)"
    - "a click on a row, which the pointer-move highlights first: the same step as Enter on that row"
    - "the clock: nothing here moves while the page is open (CLS-09); a row's mark is the one the page was drawn with"
    - "the course page's programme tab the link leads to: tedris.course.readProgramme"
    - "a phone's layout, where the button takes the row to itself and the cards share the row under it (session-pager.tsx, class order-first); the same elements and the same order of reading"

context:
  place:
    values: [middle, first, last]
    initial: any
    say:
      middle: "the celse has one before it and one after it that are not cancelled, so both cards are drawn"
      first: "the celse is the first of the course: the API sends no `previous`, so there is no card before the button"
      last: "the celse is the last of the course: the API sends no `next`, so there is no card after the button"
  firstHit:
    values: [other, current]
    initial: other
    say:
      other: "the first row the search keeps is another celse"
      current: "the first row the search keeps is the celse the page shows"

guards:
  hasPrevious: "place != 'first'"
  hasNext: "place != 'last'"
  hitIsOther: "firstHit == 'other'"
  hitIsThis: "firstHit == 'current'"

effects:
  startFresh: { set: { firstHit: other } } # show() clears the query (session-curriculum.tsx:160-166)
  typedOther: { set: { firstHit: other } }
  typedThis: { set: { firstHit: current } }

# The main story is the e2e's (session#7), with the keyboard added: open with the mouse, close with Esc, open again with the Down arrow,
# a query that finds nothing, "hafta 2", Enter.
main:
  given: { place: middle }
  events: [OPEN_POPUP, CLOSE, OPEN_BY_KEY, TYPE_NOTHING, TYPE_QUERY, ENTER_FIRST]

initial: page
states:
  page:
    title: The celse page, with the row between celses
    by: human
    goal: true
    source: apps/tedris/features/courses/components/session-pager.tsx:199
    description: >-
      The celse page of a seat holder, down to its last block (the row is always last, session-page.tsx:388). The row is a nav named
      "Celseler arasında" with the card of the previous celse, the button "Müfredat: Hafta 4 / 6, <title>" and the card of the next one.
      A card holds an eyebrow ("Önceki · Hafta 3", hidden from the accessibility tree), the celse's title as a link whose name is
      "Önceki celse: Hafta 3, <title>", and a line with its day and time that is outside the link's name. The cancelled celses are not
      offered: the API names the neighbouring live celses with the cancelled ones skipped. At the first celse of the course there is
      no card before the button and at the last none after it, and the button takes the room (place). The button shows the eyebrow
      "Müfredat", this celse's title, "Bu celse", a thin bar (no progressbar role) and "Hafta 4 / 6". It says it opens a listbox and
      that it is closed. No code sets the focus when the page opens: the first Tab stop is the chrome (measured: the focus is on the
      document). When the popup closes by Esc, by a row or by Enter on this celse's row the focus is on the button.
    on:
      OPEN_POPUP: { target: popup, effect: [startFresh], say: "the button is pressed with the mouse", source: apps/tedris/features/courses/components/session-curriculum.tsx:364 }
      OPEN_BY_KEY: { target: popup, effect: [startFresh], say: "the button has the focus and the Down or Up arrow is pressed", source: apps/tedris/features/courses/components/session-curriculum.tsx:366 }
      PREVIOUS: { guard: hasPrevious, target: previous_opened, say: "the card of the previous celse is followed", source: apps/tedris/features/courses/components/session-pager.tsx:80 }
      NEXT: { guard: hasNext, target: next_opened, say: "the card of the next celse is followed", source: apps/tedris/features/courses/components/session-pager.tsx:80 }
      NAVIGATE: left

  popup:
    title: The popup is open, this celse's row selected and focused
    by: human
    source: apps/tedris/features/courses/components/session-curriculum.tsx:398
    description: >-
      A `div.mds-popup` under the button when it fits there, else above it (measured on open and again on resize and scroll). It is not
      a dialog and not a listbox: a plain div with no role and no name, so the popup the button announces is nothing a screen reader can
      find (CLS-04). It holds the title "Müfredat · 6 celse" (a paragraph, not a heading; the accessibility tree runs the two words together,
      "Müfredat8 celse" when it was measured with eight celses, BROWSE-1), the link "Ders sayfasında aç", the search field "Celse ara" (empty, the placeholder says "Hafta ya da başlık
      ara"), and the listbox "Müfredat" with a row for every celse of the course in programme order, a cancelled one included: "Hafta 1
      Celse 1, sona erdi, 29 Eki", ..., "Hafta 4 Celse 4, 19 Kas, Bu celse" (aria-selected), "Hafta 5 Celse 5, 26 Kas, İptal edildi", and the
      ones ahead with their day and no word. The list scrolls past about 380 px. The focus is on the selected row, an option with
      tabindex 0 and the other rows at -1 (a roving focus). The e2e (session#7 a2) expects the listbox itself to have the focus: that
      is stale, the code focuses the row (SE-01; measured with a probe, not yet by a replay). The marks of the rows were worked out when the page was drawn and do
      not move (CLS-09). Keys on the focused row: Down, Up, Home, End, Page Down and Page Up move the focus and the active row; Enter
      or Space goes to the row; Esc closes; Backspace or a printable key starts a query and moves the focus to the field.
    on:
      TYPE_QUERY: { target: filtered, effect: [typedOther], say: "a query that keeps rows, the first one another celse (\"hafta 2\")", source: apps/tedris/features/courses/components/session-curriculum.tsx:179 }
      TYPE_QUERY_THIS: { target: filtered, effect: [typedThis], say: "a query that keeps rows, the first one this celse (\"hafta 4\")", source: apps/tedris/features/courses/components/session-curriculum.tsx:179 }
      TYPE_NOTHING: { target: noMatch, say: "a query that keeps no row", source: apps/tedris/features/courses/components/session-curriculum.tsx:179 }
      CHOOSE_CURRENT: { target: page, say: "Enter on this celse's own row: the popup closes and nothing is loaded; the focus goes to the button", source: apps/tedris/features/courses/components/session-curriculum.tsx:173 }
      CHOOSE_OTHER: { target: celse_opened, say: "Enter on another row (or a click on it): router.push to that celse, a soft navigation", source: apps/tedris/features/courses/components/session-curriculum.tsx:175 }
      OPEN_PROGRAMME: { target: programme_opened, say: "the link \"Ders sayfasında aç\" is followed", source: apps/tedris/features/courses/components/session-curriculum.tsx:419 }
      CLOSE: { target: page, say: "Esc: the popup closes and the focus goes back to the button", source: apps/tedris/features/courses/components/session-curriculum.tsx:297 }
      OPEN_POPUP: { target: page, say: "a second press on the button closes the popup; the focus stays on it", source: apps/tedris/features/courses/components/session-curriculum.tsx:364 }
      PREVIOUS: { guard: hasPrevious, target: previous_opened, say: "a press on the previous card: the pointerdown outside closes the popup, and the click follows the link, a full page load", source: apps/tedris/features/courses/components/session-curriculum.tsx:257 }
      NEXT: { guard: hasNext, target: next_opened, say: "a press on the next card: the same, forward", source: apps/tedris/features/courses/components/session-curriculum.tsx:257 }
      NAVIGATE: left

  filtered:
    title: A query keeps some rows
    by: human
    source: apps/tedris/features/courses/components/session-curriculum.tsx:179
    description: >-
      The field holds what was typed and the list shows only the rows that answer it, each word of the query having to be found
      (session-model.ts:128-148): "hafta 2" keeps the one row of week 2, because a number is the week or a number standing alone in a
      title, and "hafta" is in every row's "Hafta N". The first row kept is the active one (highlighted, not focused): the focus stays
      in the field, where it was typed. A row that was kept shows the same marks as before. The popup's other parts are as in `popup`.
      Enter in the field goes to the active row, or to the first one, so after "hafta 2" it goes to the week 2 celse; when the first
      row kept is this celse ("hafta 4") it only closes the popup. Esc in the field closes and gives the focus to the button.
    on:
      TYPE_QUERY: { target: filtered, effect: [typedOther], say: "another query that keeps rows, the first another celse", source: apps/tedris/features/courses/components/session-curriculum.tsx:179 }
      TYPE_QUERY_THIS: { target: filtered, effect: [typedThis], say: "another query that keeps rows, the first this celse", source: apps/tedris/features/courses/components/session-curriculum.tsx:179 }
      TYPE_NOTHING: { target: noMatch, say: "a query that keeps no row", source: apps/tedris/features/courses/components/session-curriculum.tsx:179 }
      ENTER_FIRST:
        - { guard: hitIsOther, target: celse_opened, say: "Enter goes to the first row kept: router.push to that celse", source: apps/tedris/features/courses/components/session-curriculum.tsx:322 }
        - { guard: hitIsThis, target: page, say: "the first row kept is this celse: the popup closes and nothing is loaded", source: apps/tedris/features/courses/components/session-curriculum.tsx:322 }
      OPEN_PROGRAMME: { target: programme_opened, say: "the link \"Ders sayfasında aç\" is followed", source: apps/tedris/features/courses/components/session-curriculum.tsx:419 }
      CLOSE: { target: page, say: "Esc in the field: the popup closes and the focus goes back to the button", source: apps/tedris/features/courses/components/session-curriculum.tsx:325 }
      OPEN_POPUP: { target: page, say: "a second press on the button closes the popup; the focus stays on it", source: apps/tedris/features/courses/components/session-curriculum.tsx:364 }
      PREVIOUS: { guard: hasPrevious, target: previous_opened, say: "a press on the previous card: the pointerdown outside closes the popup, and the click follows the link, a full page load", source: apps/tedris/features/courses/components/session-curriculum.tsx:257 }
      NEXT: { guard: hasNext, target: next_opened, say: "a press on the next card: the same, forward", source: apps/tedris/features/courses/components/session-curriculum.tsx:257 }
      NAVIGATE: left

  noMatch:
    title: A query keeps no row
    by: human
    source: apps/tedris/features/courses/components/session-curriculum.tsx:443
    description: >-
      The list is empty (the listbox is still in the page, with no row and no height) and a paragraph says "Bu aramaya uyan celse yok.".
      The paragraph is in no live region and says no count, so a screen reader user who types hears nothing change (CLS-05). The focus is
      in the field. Enter finds no row and does nothing. Backspace or typing again changes the query: a query that keeps rows brings
      the list back. Esc closes and gives the focus to the button.
    on:
      TYPE_QUERY: { target: filtered, effect: [typedOther], say: "a query that keeps rows, the first another celse", source: apps/tedris/features/courses/components/session-curriculum.tsx:179 }
      TYPE_QUERY_THIS: { target: filtered, effect: [typedThis], say: "a query that keeps rows, the first this celse", source: apps/tedris/features/courses/components/session-curriculum.tsx:179 }
      OPEN_PROGRAMME: { target: programme_opened, say: "the link \"Ders sayfasında aç\" is followed", source: apps/tedris/features/courses/components/session-curriculum.tsx:419 }
      CLOSE: { target: page, say: "Esc in the field: the popup closes and the focus goes back to the button", source: apps/tedris/features/courses/components/session-curriculum.tsx:325 }
      OPEN_POPUP: { target: page, say: "a second press on the button closes the popup; the focus stays on it", source: apps/tedris/features/courses/components/session-curriculum.tsx:364 }
      PREVIOUS: { guard: hasPrevious, target: previous_opened, say: "a press on the previous card: the pointerdown outside closes the popup, and the click follows the link, a full page load", source: apps/tedris/features/courses/components/session-curriculum.tsx:257 }
      NEXT: { guard: hasNext, target: next_opened, say: "a press on the next card: the same, forward", source: apps/tedris/features/courses/components/session-curriculum.tsx:257 }
      NAVIGATE: left

  previous_opened:
    title: The previous celse's page
    type: final
    leavesPage: true
    description: >-
      The card is a plain link (`<a href="/courses/<c>/lessons/<id>">`), so the whole page is loaded again, with the other celse. This
      flow starts over there, with a different `place` when the celse it lands on is the first or the last of the course.

  next_opened:
    title: The next celse's page
    type: final
    leavesPage: true
    description: >-
      The same as `previous_opened`, forward. The cancelled celse between this one and it is skipped by the API, not by the page.

  celse_opened:
    title: Another celse's page, chosen in the popup
    type: final
    leavesPage: true
    description: >-
      `router.push` to the row's address: a soft navigation (the page is not loaded in full), so the popup is closed and the focus is
      put on the button just before the new page replaces this one (session-curriculum.tsx:173-176). This flow starts over on that celse.

  programme_opened:
    title: The course page, on the programme tab
    type: final
    leavesPage: true
    description: >-
      A plain link to `/courses/<c>?tab=mufredat`, the course page with the tab Müfredat selected. Its reading is tedris.course.readProgramme.

  left:
    title: The person goes to another page
    type: final
    leavesPage: true

assertions:
  - id: no-card-before-the-first-celse
    never: "state == 'previous_opened' and place == 'first'"
    say: "the first celse of a course has no card before the button, so the previous celse is never followed from it"
    source: apps/tedris/features/courses/components/session-pager.tsx:205
  - id: no-card-after-the-last-celse
    never: "state == 'next_opened' and place == 'last'"
    say: "the last celse of a course has no card after the button, so the next celse is never followed from it"
    source: apps/tedris/features/courses/components/session-pager.tsx:234
  - id: this-celse-is-never-loaded-again
    never: "state == 'celse_opened' and firstHit == 'current'"
    say: "choosing this celse's own row only closes the popup: nothing is navigated to"
    source: apps/tedris/features/courses/components/session-curriculum.tsx:175
