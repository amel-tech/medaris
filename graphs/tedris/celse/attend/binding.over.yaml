# tedris.celse.attend, the standing `over` (a celse that ended two hours ago and has no recording row). Same data, exits and locators as binding.yaml (see locators.binding.yaml).
#   node apps/engine/src/cli.ts replay graphs/tedris/celse/attend --bind graphs/tedris/celse/attend/binding.over.yaml --to over --out <dir>
schema: delurio-graph/0
kind: binding
extends: ./locators.binding.yaml
flow: tedris.celse.attend

samples:
  title: Biten celse
  previous: Yüz yüze yayınlı celse
  next: Sonraki celse

scenarios:
  over:
    given: { access: open, standing: over, means: none, place: online, agenda: none, resources: none, exam: none, neighbours: both }
    as: applicantE
    open: '{tedris}/courses/{att.course}/lessons/{att.over}'
    vars: { steps: 3 }
    setup:
      - run: [node, ../tedris/celse/attend/attend-data.mjs, up]
        expect: 'attend-data up'
    teardown:
      - run: [node, ../tedris/celse/attend/attend-data.mjs, down]
      - run: [node, helpers/mail.mjs, clear, 'to:{address}']
