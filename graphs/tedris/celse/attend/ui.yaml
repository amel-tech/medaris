# The screens of tedris.celse.attend: the celse page of tedris-web (/courses/<course>/lessons/<celse>, app/courses/[courseId]/lessons/[lessonId]/
# page.tsx and features/courses/components/session-page.tsx) as a talebe with a seat reads it in its four standings: `ahead` (the join window is
# closed), `opening` (it is open), `live` and `over`. The chrome around the page (the wide bar, the phone's app bar and sheet, the footer) is
# tedris.shell.frame's and is not drawn here. The panels "Notlarım" and "Ödev", the Müfredat popup and the calendar menu are other flows'.
#
# Words: every `SessionPage.*`, `CoursePage.*` and `AddToCalendar.*` key is copied from libs/i18n/src/locales/tr/tedris.json (the app reads it as
# `tedris.<key>`); the key is the path inside the file. The `composed.Attend.*` keys are NOT in any i18n file: they are the texts the app builds in
# code from messages and data, written here with their placeholders so a replay can match them (a placeholder with no sample matches any text):
#   composed.Attend.kosk          the first crumb, the köşk's name, a value the API gives                                   session-join-labels.ts:112
#   composed.Attend.course        the second crumb, the course's title                                                      session-join-labels.ts:114
#   composed.Attend.title         the celse's title (the h1)                                                                session-header.tsx:62
#   composed.Attend.countdown     the badge before the start, Intl.RelativeTimeFormat ("8 dakika sonra", "Yarın")           libs/ui/src/mds/session-join.tsx:47
#   composed.Attend.when          the day and the hours on the course's clock, "15 Kasım Pazar · 22:55–00:25"               session-join-labels.ts:136
#   composed.Attend.hoca          formatHocaName: the name with the unvan, "Hoca" when it has none                          session-header.tsx:98
#   composed.Attend.weekday       the date block's three lines, Intl on the course's clock                                  session-action-card.tsx:321-323
#   composed.Attend.date
#   composed.Attend.clock
#   composed.Attend.platformChip  the platform's label and, for an unknown platform, its host                               session-action-card.tsx:216, libs/ui/src/mds/platform-chip.tsx:46-61
#   composed.Attend.joinOpens     SessionPage.joinOpensText with JOIN_WINDOW_MINUTES (10) put in                            session-action-card.tsx:20, :221-224
#   composed.Attend.joinName      SessionPage.joinMeeting and the hidden SessionPage.newTab, which make the link's name     session-action-card.tsx:201-202
#   composed.Attend.meetingUrl    the raw address behind "Bağlantıyı göster", a value the API gives                          session-action-card.tsx:210
#   composed.Attend.posterProvider the host the poster names, "YouTube"                                                     session-page.tsx:110 (RECORDING_PROVIDER_NAMES, liveEmbedUrlOf)
#   composed.Attend.agendaStep    a step's time and title                                                                   session-agenda.tsx:62-66
#   composed.Attend.kaynakLine    SessionPage.readingPlace and the kaynak the API gives                                     session-resources.tsx:88-92
#   composed.Attend.resourceLink  a resource's name and the hidden SessionPage.newTab                                       course-resources.tsx:124
#   composed.Attend.examPlace     the exam's place, a value the API gives                                                   session-exam.tsx:35
#   composed.Attend.examTopics    the exam's topics, a value the API gives                                                  session-exam.tsx:44
#   composed.Attend.previousLink  SessionPage.previousSr and the previous celse's title                                     session-pager.tsx:82-86
#   composed.Attend.nextLink      SessionPage.nextSr and the next celse's title                                             session-pager.tsx:82-86
# Samples are invented and neutral; they are the walk's own data (attend-data.mjs): the celse that begins in eight minutes. Where a walk's
# text moves with the clock or with the celse (a countdown, the minutes that have passed, a title) the binding finds the node by a pattern.
