rules:
  - { id: ATT-1, rule: "The stream card's eyebrow is always SessionPage.joinLabel, \"Canlı ders\" (session-action-card.tsx:297), where the date card chooses it by `inPerson` and says \"Yüz yüze\" with a users icon (:339). A celse that is held in a room and streamed turns, when it begins, from \"Yüz yüze\" to \"Canlı ders\" over a heading that says it is running and a line that says \"Bu celse yüz yüze yapılıyor ve YouTube'da canlı yayınlanıyor\". Ana sayfa's HOME-2 is the same choice made once more (tedris.shell.home); this page's date card is right and only its stream card is wrong. Measured on the stack with an in-person celse that has a stream (attend-data.mjs, `inPersonStream`): the eyebrow reads \"Canlı ders\". Fix: choose the stream card's eyebrow as the date card's (decision D1). Proposed id." }
  - { id: CLS-17, rule: "The ten-minute join window is a rule of display. `meetingUrl` is a prop of the client component whatever the time (session-page.tsx:227) and the API sends it for an upcoming celse (session-action-card.tsx:181 only decides whether it is drawn). Measured on the stack: the raw HTML of a celse two days ahead, fetched with no JavaScript, holds the meeting address once, while no link is on the page. A graph that says \"no meeting link before T-10\" says the drawn link only (decision D3)." }
  - { id: CLS-15, rule: "The badge, the card, the agenda's \"şimdi\" and the join link all change by a 30-second clock (use-celse-clock.ts:10-18) and no part of the page is a live region or a status: grep of session-*.tsx finds no aria-live and no role=status. A person who stays on the page is never told that the window opened, that the celse began or that it ended; the three CLOCK transitions are silent (decision D2). Read from the code; the clock's flip was not waited for in the walk." }
  - { id: CLS-07, rule: "The poster of the stream card is a second link with the same name as \"Yayını izle\" (session-action-card.tsx:239-246). tabIndex -1 takes it out of the tab order but not out of a screen reader's list of links, which names the destination twice. Measured: the accessibility tree has two links named \"Yayını izle\" in the card. Fix: aria-hidden on the poster." }
  - { id: CLS-03, rule: "The celse page and the watch page export no metadata, so the tab and a screen reader say \"Medaris Tedris\" on every celse (WCAG 2.4.2); the phone bar's title is the celse's. Measured on the stack: document.title is \"Medaris Tedris\". Fix: generateMetadata with the celse's title." }
  - { id: CLS-01, rule: "getSession answers null on any failure (public-reads.ts:50-56, :93-98) and the layout turns null into the 404 page (layout.tsx:27), so a tedrisat outage on a celse reads as a missing celse with no retry. Measured on the stack: a celse id that does not exist answers HTTP 200 with the not-found page, not 404 (`next dev`; the layout's own comment promises a real 404 and the e2e's comment says it stays 200, session.e2e.ts#8: a production build was not measured)." }
  - { id: CLS-13, rule: "The page calls the uncached getCourse (page.tsx:19) where the layout calls the per-request loadCourse (layout.tsx:25), so GET /courses/{id} is made twice per request. An avoidable load, not an accessibility defect. Read from the code." }
  - { id: CLS-09, rule: "The pager's state line (\"Şu an canlı\", \"İptal edildi\") and the Müfredat rows are computed once on the server at render (session-pager.tsx:51-56, :122-148) and never move, while the badge and the card tick every 30 seconds: a tab left open shows \"Canlı · 12 dk\" in the header and a pager that still lists the neighbour as it was. Read from the code." }
  - { id: focus-not-set, rule: "The celse page sets no initial focus (no autoFocus and no focus() in session-*.tsx, calendar-menu.tsx or the page) and the first Tab stop is the chrome, so the page node has no `initialFocus` and the graph says nothing of the focus when the page opens. Measured on the stack: document.activeElement is the <body> after the page loads. There is no skip link in the app (CLS-14, tedris.shell.frame). Recorded so the silence is not read as an omission." }
  - { id: label-in-name, rule: "a node's visible text is contained in its accessible name (WCAG 2.5.3): \"Toplantıya katıl\" is inside \"Toplantıya katıl (yeni sekmede açılır)\"" }
  - { id: no-attendance-write, rule: "Pressing \"Toplantıya katıl\" calls nothing: grep of session-*.tsx finds no join call and no attendance write, and the link is a plain <a target=_blank>. The app learns nothing of who joined; attendance is marked by the course team in nazar (apps/nazar/features/sessions/attendance.ts). The exit `meeting_opened` is where this app's part ends." }
  - { id: in-person-names-no-place, rule: "A celse held face to face says only \"Bu celse yüz yüze yapılır. Kaydı eklenirse burada yayımlanır.\" The page has no field for where (the model has none: `inPerson` is a boolean), so the one place a talebe can read is the exam's location. The sentence also talks about the recording, which a person walking to a room did not ask. Read from the code and measured on the stack; the product need is in needs.yaml." }
