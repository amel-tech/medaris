  dateWeekday: { type: text, component: Text, text: { key: composed.Attend.weekday, params: { weekday: session.weekday } }, in: [ahead, opening, live, over], when: dateCard, source: apps/tedris/features/courses/components/session-action-card.tsx:321 }
