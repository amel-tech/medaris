  crumbWeek: { type: text, component: Text, text: { key: SessionPage.week, params: { number: week.number } }, in: [ahead, opening, live, over], source: apps/tedris/features/courses/session-join-labels.ts:115 } # the current crumb, aria-current="page", never a link
  eyebrowWeek: { type: text, component: Text, text: { key: SessionPage.weekCelse, params: { week: week.number, number: celse.number } }, in: [ahead, opening, live, over], source: apps/tedris/features/courses/components/session-header.tsx:57 } # "Hafta 1 · 2. celse"; "Hafta 1" alone when the course does not list the celse
  title: { type: text, component: Heading, role: heading, text: { key: composed.Attend.title, params: { title: session.title } }, in: [ahead, opening, live, over], source: apps/tedris/features/courses/components/session-header.tsx:58 } # h1, dir="auto"
  badgeCountdown: { type: status, component: Status, text: { key: composed.Attend.countdown, params: { countdown: session.startsAt } }, in: [ahead, opening], source: apps/tedris/features/courses/components/session-state-badge.tsx:59 } # a <time> in a secondary badge with a clock icon; moved on by a 30-second clock, never announced (CLS-15)
  badgeLive: { type: status, component: Status, text: { key: SessionPage.liveBadge, params: { minutes: elapsed } }, in: [live], source: apps/tedris/features/courses/components/session-state-badge.tsx:47 } # "Canlı · 12 dk", a live badge; no role="status" and no aria-live (CLS-15)
  badgeEnded: { type: status, component: Status, text: { key: SessionPage.endedLabel }, in: [over], source: apps/tedris/features/courses/components/session-state-badge.tsx:54 } # a secondary badge with a check icon
  metaWhen: { type: text, component: Text, text: { key: composed.Attend.when, params: { day: session.day, clock: session.clock } }, in: [ahead, opening, live, over], source: apps/tedris/features/courses/components/session-header.tsx:82 } # a <time>, then "İstanbul saatiyle" (SessionPage.courseZone) in the same span
  metaLength: { type: text, component: Text, text: { key: SessionPage.minutes, params: { count: session.durationMinutes } }, in: [ahead, opening, live, over], source: apps/tedris/features/courses/components/session-header.tsx:90 }
