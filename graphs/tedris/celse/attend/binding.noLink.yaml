# tedris.celse.attend, the standing `noLink` (a celse with no meeting link, no stream and not in person, two days ahead: it says no link has been added (e2e session#4)). Same data, exits and locators as binding.yaml (see locators.binding.yaml).
#   node apps/engine/src/cli.ts replay graphs/tedris/celse/attend --bind graphs/tedris/celse/attend/binding.noLink.yaml --to ahead --out <dir>
schema: delurio-graph/0
kind: binding
extends: ./locators.binding.yaml
flow: tedris.celse.attend

samples:
  title: Bağlantısız celse
  previous: Sonraki celse
  next: Yüz yüze celse

scenarios:
  noLink:
    given: { access: open, standing: ahead, means: none, place: online, agenda: none, resources: none, exam: none, neighbours: both }
    as: applicantE
    open: '{tedris}/courses/{att.course}/lessons/{att.noLink}'
    vars: { steps: 3 }
    setup:
      - run: [node, ../tedris/celse/attend/attend-data.mjs, up]
        expect: 'attend-data up'
    teardown:
      - run: [node, ../tedris/celse/attend/attend-data.mjs, down]
      - run: [node, helpers/mail.mjs, clear, 'to:{address}']
