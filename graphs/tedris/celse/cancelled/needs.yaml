schema: delurio-graph/0
kind: needs
id: tedris.celse.cancelled
status: proposed
summary: >-
  What must exist for an enrolled talebe who opens a celse the hoca cancelled: tedris.celse.cancelled. Each need is what the
  product must do, from the flow's story; none is read off what the page does today. Nothing here comes from planned.md: no
  planned feature (P-nn) names this page.

needs:
  - id: cancelled-says-so
    need: >-
      A talebe who opens a celse that was cancelled is told so in words at once, in the header and on the card, and the celse
      stays in its place in the programme, so that nobody turns up for it and the weeks do not renumber.
    evidence:
      - state: cancelledShown
      - node: badgeCancelled
      - node: blockCaption
      - node: cancelledHeading
      - node: eyebrowWeek
      - source: apps/tedrisat/src/course/lesson.controller.ts:230
      - source: apps/tedris/features/courses/components/session-action-card.tsx:343
      - test: apps/tedris/e2e/session.e2e.ts
        name: "shows the cancellation, the make-up link and no way to join"
      - test: apps/tedris/e2e/lesson-notes.e2e.ts
        name: "no panel on a cancelled session (MDRS-266)"
      - scenario: noteAndMakeUp
    note: |-
      session.e2e.ts session#6 (a1)
      lesson-notes.e2e.ts lesson-notes#13 (a1, a2)

  - id: note-reaches-the-talebe
    need: >-
      The note the hoca wrote when cancelling reaches the talebe of the course, whole and on the celse's own page, and nobody who
      may not read the course's content.
    evidence:
      - node: noteLine
      - source: apps/tedrisat/src/course/lesson.controller.ts:230
      - source: apps/tedris/features/courses/components/session-page.tsx:162
      - scenario: noteAndMakeUp
    note: |-
      noteAndMakeUp: the note is found by its hook and its words (the API's cancelReason is a content key: the locked card has
      none)
      e2e session#6 (a6) and session#10 (a2) assert the opposite, that "Müderris hasta" is not on the page. They are STALE since
      MDRS-248 (4a57871f "note to talebe on cancelled session"): the page shows the note, as the seed of those specs gives one.
      Carried: the code.

  - id: makeup-announced-and-reachable
    need: >-
      When the hoca names a make-up celse, the cancelled celse says on which day and at what time it is held and leads to its page
      in one step.
    evidence:
      - node: makeUpLine
      - node: makeUpLink
      - state: makeUpPage
      - node: makeUpTitle
      - source: apps/tedrisat/src/course/lesson.controller.ts:230
      - source: apps/tedris/features/courses/components/session-page.tsx:164
      - test: apps/tedris/e2e/session.e2e.ts
        name: "shows the cancellation, the make-up link and no way to join"
      - scenario: noteAndMakeUp
    note: session.e2e.ts session#6 (a2, a7, a8)

  - id: no-makeup-says-where-to-look
    need: >-
      When no make-up is set, the cancelled celse says that the hoca may set a new time and where it will then show, instead of
      leaving the talebe with nothing.
    evidence:
      - node: noMakeUpLine
      - source: apps/tedris/features/courses/components/session-page.tsx:184
      - scenario: noNoteNoMakeUp
        binding: graphs/tedris/celse/cancelled/binding.bare.yaml
    note: "noNoteNoMakeUp: binding.bare.yaml"

  - id: no-notes-or-calendar-on-a-cancelled-celse
    need: >-
      A cancelled celse offers no "Takvime ekle" and no panel for notes, because there is nothing to attend and nothing to write
      about.
    evidence:
      - node: calendarButton
      - node: notesPanel
      - source: apps/tedris/features/courses/components/session-page.tsx:132
      - source: apps/tedris/features/courses/components/session-action-card.tsx:384
      - test: apps/tedris/e2e/session.e2e.ts
        name: "shows the cancellation, the make-up link and no way to join"
      - test: apps/tedris/e2e/lesson-notes.e2e.ts
        name: "no panel on a cancelled session (MDRS-266)"
      - scenario: noteAndMakeUp
    note: |-
      session.e2e.ts session#6 (a5)
      lesson-notes.e2e.ts lesson-notes#13 (a3)
      noteAndMakeUp: `--absent`: both are drawn on the make-up's page and are looked for, and not found, on the cancelled one

  - id: meeting-link-never-sent-for-a-cancelled-celse
    need: >-
      The meeting link of a cancelled celse is withheld by tedrisat, even from the course's own talebe, so that no page, payload
      or share of it can lead anyone to a meeting that will not happen.
    evidence:
      - node: cancelledJoinText
      - source: apps/tedrisat/src/course/lesson.controller.ts:230
      - test: apps/tedris/e2e/session.e2e.ts
        name: "never sends the meeting link of a cancelled session"
      - scenario: noteAndMakeUp
    note: |-
      session.e2e.ts session#10 (a1)
      session#10 (a1): the e2e reads the page's HTML; the replay reads the API answer the page is made from
      noteAndMakeUp: effect getSession: `"meetingUrl":null`

  - id: no-join-or-homework-on-a-cancelled-celse
    need: A cancelled celse offers no way to join, no homework to hand in and no exam card.
    evidence:
      - state: cancelledShown
      - source: apps/tedris/features/courses/components/session-page.tsx:151
      - source: apps/tedris/features/courses/components/session-page.tsx:274
      - test: apps/tedris/e2e/session.e2e.ts
        name: "shows the cancellation, the make-up link and no way to join"
    note: |-
      session.e2e.ts session#6 (a4)
      unwalked by replay: the join link, the "Ödev" panel and the exam card are drawn on no state of the graph, so `--absent` has
      no node to look for. The API half (no meetingUrl) is walked by meeting-link-never-sent-for-a-cancelled-celse.

  - id: told-of-the-cancellation
    need: >-
      A talebe with a seat is told when a celse is cancelled, with the note, without having to open the page, so the page is read
      to find the make-up and not to find out.
    evidence:
      - state: cancelledShown
      - source: apps/tedrisat/src/course/lesson.controller.ts:389
      - scenario: noteAndMakeUp
    note: |-
      medaris.api:cancelLesson: notification SESSION_CANCELLED to the enrolled seats, and a CANCEL calendar mail
      noteAndMakeUp: effect getSession: two SESSION_CANCELLED rows for the talebe; how the notification reads is
      tedris.account.notifications

  - id: cancelled-celse-recording-is-offered
    need: >-
      A talebe who opens a celse that was recorded and then cancelled is shown the recording they can watch, or told where it is,
      and not only that the celse was cancelled (decision D1).
    missing: >-
      D1, measured: no link to /izle on the page, one in the course's Ders kayıtları tab, and /izle opens; no Linear issue
    note: >-
      Drawn on the state cancelledShown, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).

  - id: title-says-which-celse
    need: >-
      A person with several celse pages open can tell them apart by the tab's title, the cancelled one and its make-up included.
    missing: CLS-03; no Linear issue
    note: >-
      Drawn on the states cancelledShown and makeUpPage, which the code has: they are not evidence, so that a replay still walks
      them (SPEC.md §13 leaves out what only missing needs name).

  - id: whole-note-from-the-row
    need: >-
      The hoca's note is readable in full from where a talebe first sees the cancellation (the row on Programım), by keyboard and
      by touch, or the row says that the whole note is on the celse's page.
    missing: no Linear issue; DSC-17, owned by tedris.learning.schedule; this page is the way round
    note: >-
      Drawn on the node noteLine, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves
      out what only missing needs name).

  - id: read-failure-is-not-a-missing-celse
    need: >-
      A tedrisat outage while a celse is read is told as an outage, with a way to try again, and not as a celse that does not
      exist.
    missing: CLS-01; no Linear issue
    note: >-
      Drawn on the state notFound, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).

  - id: cancel-only-a-live-celse
    need: >-
      The hoca can cancel only a celse (a live lesson), so that no lesson of the programme is marked "İptal edildi" and then links
      to a page that answers not found.
    evidence:
      - source: apps/tedrisat/src/course/lesson.controller.ts:389
    missing: >-
      no Linear issue; domain invariant session-cancel-takes-live-sessions-only (holds: false), finding cancel-no-type-check;
      measured here with a cancelled VIDEO lesson; code exists in part
    note: >-
      Drawn on the state notFound, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).

  - id: refusal-says-why-in-its-own-words
    need: >-
      When the hoca adds a recording to a cancelled celse, the refusal says that the celse is cancelled and that it takes no
      recording, in the words of what was refused, not in the words of the live stream.
    evidence:
      - source: apps/tedrisat/src/course/recording.controller.ts:102
    missing: >-
      no Linear issue; domain invariant session-cancelled-message-fits-its-route (holds: false), finding
      lesson-cancelled-text-streams-only; measured here; code exists in part
    note: >-
      Drawn on the state cancelledShown, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).
