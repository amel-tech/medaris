schema: delurio-graph/0
kind: needs
id: tedris.celse.watchRecording
status: proposed
summary: >-
  What tedris.celse.watchRecording needs from the product, from its story (a talebe watches a celse's recording once it is open;
  the course team plays it early; a person with no seat does not), and what the code and the walks hold of it today. Nothing here
  is read by `check`; a YAML parser reads it.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# Missing or unwalked, for the orchestrator's gaps merge (every other need has a walk phase scenario of this folder's binding.yaml, not yet replayed):
# missing:  recording-public-honours-medrese-policy (no code: the policy is stored and never asked; the domain's own finding), failed-recording-seen-by-team (no code: MDRS-259), notes-position-on-bunny (MDRS-264)
# unwalked: bunny-recording-plays (code, needs Bunny), recording-failed-read-is-not-found (code, the stack cannot refuse the read), recording-with-stream-link (code, tedris.celse.watchStream walks it)
# Walks: no replay was run in this phase ("walk phase"): `walked` lists the scenarios of binding.yaml that will walk each need, with the e2e checks that exist, never a scenario that has passed.
#
# Added on 23 Nov 2026 for the counter (MDRS-248, #402): watching-is-recorded and back-to-where-they-stopped (met, walked by nothing: the
# stack's browser does not play YouTube), bunny-watching-is-recorded (missing: Bunny was not played, the Player.js path has only the
# parser spec), the-counter-is-perceived-by-everyone (missing: COUNTER-2, COUNTER-3) and a-failed-save-says-what-happened, carried from the
# retired tedris.course.updateProgress, where it was the window's save; the reports are the saves now (missing: COUNTER-1).

needs:
  - id: talebe-watches-an-open-recording
    need: >-
      A talebe who holds a seat opens a celse that is over and watches its recording, with the recording's title, date and length,
      and their own questions and notes beside it, whether it was added as a YouTube, a Drive, a Bunny or another link.
    evidence:
      - state: celseCard
      - state: playerTalebe
      - source: "apps/tedris/app/courses/[courseId]/lessons/[lessonId]/izle/page.tsx:34"
      - source: apps/tedris/features/courses/components/watch-view.tsx:223
      - source: apps/tedrisat/src/course/lesson.controller.ts:230
      - test: apps/tedris/e2e/celse-states.e2e.ts
        name: "tedris/17: a session that is over leads to its recording on the watch page (MDRS-285)"
      - test: apps/tedris/e2e/lesson-notes.e2e.ts
        name: "on a YouTube recording's watch page, reached by Kaydı izle: adds a note with a time and one without, edits, deletes, and finds them after a reload"
      - scenario: talebeOpen
    note: |-
      celse-states#3: STALE: expects youtube-nocookie.com, the app frames www.youtube.com since MDRS-293
      talebeOpen: walk phase

  - id: link-that-cannot-be-framed
    need: >-
      A recording whose link cannot be put in a frame (a host with no embed) is still reachable from the watch page: a placeholder
      and a link to the host.
    evidence:
      - state: playerTalebe
      - state: playerTeam
      - source: apps/tedris/features/courses/components/media-player.tsx:74
      - scenario: talebeLink
    note: "talebeLink: walk phase"

  - id: recording-opens-when-released
    need: >-
      A recording opens to talebe only when it is ready, its celse has begun and the release time the course team set has passed;
      before that the talebe is told when it opens (on the celse page) and is not played anything, and the address of the watch
      page does not play it either.
    evidence:
      - state: celseHeld
      - state: sorting
      - source: apps/tedrisat/src/course/recording.controller.ts:147
      - source: apps/tedrisat/src/course/recording.controller.ts:102
      - source: apps/tedrisat/src/course/domain/recording.ts:100
      - source: apps/tedris/features/courses/components/session-action-card.tsx:357
      - scenario: talebeHeld
    note: "talebeHeld: walk phase"

  - id: recording-being-prepared-offers-nothing
    need: >-
      A recording still being prepared offers no link anywhere, says so on the celse page, and sends its watch page's address back
      to the celse page.
    evidence:
      - state: celsePreparing
      - source: apps/tedris/features/courses/components/session-action-card.tsx:361
      - test: apps/tedris/e2e/celse-states.e2e.ts
        name: "tedris/17: a recording still being prepared has no player, no watch page, and links to the tab"
      - scenario: talebePreparing
    note: "talebePreparing: walk phase"

  - id: team-plays-a-held-recording-early
    need: >-
      The course team plays a recording that is held back, and is told when it opens to talebe, so that they can check it before
      it is released.
    evidence:
      - state: celseCard
      - state: playerTeam
      - source: apps/tedrisat/src/course/domain/recording.ts:150
      - source: apps/tedris/features/courses/components/watch-view.tsx:237
      - scenario: teamHeld
    note: "teamHeld: walk phase"

  - id: no-seat-no-watch-page
    need: >-
      A person with no seat, or a signed-out visitor, is never played a recording on the watch page, whatever the recording's
      visibility; a visitor is asked to sign in first.
    evidence:
      - state: detail_locked
      - state: sign_in_asked
      - source: "apps/tedris/app/courses/[courseId]/lessons/[lessonId]/izle/page.tsx:31"
      - test: apps/tedris/e2e/celse-states.e2e.ts
        name: "tedris/19: the locked session names no link, no stream and no recording, and apply opens the window of tedris/07"
      - scenario: outsider
      - scenario: visitor
    note: |-
      outsider: walk phase
      visitor: walk phase

  - id: public-recording-of-a-sample-celse
    need: >-
      The PUBLIC recording of a sample celse is the one recording a person with no seat may be played, on the locked celse page;
      no ENROLLED or other recording is.
    evidence:
      - state: lockedPlayer
      - source: apps/tedrisat/src/course/course.service.ts:701
      - source: apps/tedris/features/courses/components/lesson-locked.tsx:139
      - scenario: outsiderSample
    note: "outsiderSample: walk phase"

  - id: recording-public-honours-medrese-policy
    need: >-
      A medrese that switches "Ders kayıtları herkese açılamaz" on keeps its courses' PUBLIC recordings from everyone who has no
      seat, as the platform's and the köşk's switches do (the domain's recording-public-honours-medrese-policy and
      policy-no-public-recordings-inert).
    missing: "no Linear issue; no code: the policy is stored and never asked; the domain's own finding"
    note: >-
      Drawn on the state lockedPlayer, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).

  - id: failed-recording-seen-by-team
    need: A failed Bunny upload is shown to the course team with its reason and a retry, instead of vanishing (MDRS-259).
    missing: "no code: MDRS-259"
    note: >-
      Drawn on the state celsePreparing, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).

  - id: notes-position-on-bunny
    need: The notes read the player's position and seek on a Bunny recording, instead of a typed time (MDRS-264).
    missing: MDRS-264; findings MDRS-264
    note: >-
      Drawn on the state playerTalebe, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).

  - id: bunny-recording-plays
    need: A recording uploaded to Bunny plays on the watch page in Bunny's player, on a link signed for this viewer.
    evidence:
      - state: playerTalebe
      - state: playerTeam
      - source: apps/tedris/features/courses/components/media-player.tsx:12
      - source: apps/tedrisat/src/course/course.service.ts:196
    note: "walked: []: needs Bunny (STACK.md): the stack has no library keys"

  - id: recording-failed-read-is-not-found
    need: A celse that cannot be read because tedrisat is down is told apart from a celse that does not exist (CLS-01).
    evidence:
      - state: not_found
      - source: apps/tedris/features/courses/public-reads.ts:50
    note: "walked: []: the stack cannot make tedrisat refuse the read"

  - id: recording-with-stream-link
    need: >-
      A celse that holds a recording that is not yet open and also has a live stream link plays the stream on the watch page, with
      the recording's opening time beside it.
    evidence:
      - state: stream_opened
      - source: apps/tedris/features/courses/watch-model.ts:47
    note: "walked: []: tedris.celse.watchStream walks it"

  - id: watching-is-recorded
    need: >-
      A talebe's watching of a celse's recording is recorded while they watch, with nothing to do: where they are in it, and, once they
      reach its end or nine tenths of it, that they watched it, a mark that stays when they watch it again; the course page counts
      their progress from it.
    evidence:
      - state: playerTalebe
      - state: reporting
      - source: apps/tedris/features/courses/components/watch-progress.tsx:56
      - source: apps/tedrisat/src/lesson-view/lesson-view.controller.ts:66
      - source: apps/tedrisat/src/lesson-view/lesson-view.repository.ts:41
      - test: apps/tedrisat/test/e2e/lesson-view.e2e.spec.ts
        name: "keeps where the player is and reads it back"
      - test: apps/tedrisat/test/e2e/lesson-view.e2e.spec.ts
        name: "marks a celse watched at nine tenths, and keeps the mark"
      - test: apps/tedrisat/test/e2e/lesson-view.e2e.spec.ts
        name: "marks a celse watched when the player ended, length or not"
      - test: apps/tedrisat/test/e2e/lesson-view.e2e.spec.ts
        name: "refuses everyone but an active talebe"
      - test: apps/tedris/test/watch-progress-model.spec.ts
        name: "sends whole seconds, and a length only when the player knows it"
      - test: apps/tedris/test/watch-page.spec.ts
        name: "frames a YouTube recording with the player API for a talebe's notes, and says what it is"
    note: |-
      For a YouTube recording; Bunny's is bunny-watching-is-recorded, and a Drive frame or a link that cannot be framed is not counted.
      Unwalked: no browser e2e and no scenario. The stack's browser does not play YouTube, so a replay cannot make a report; #402 says
      it played a YouTube recording to the end on a local stack by hand (PR description), which is not a walk of this graph.

  - id: bunny-watching-is-recorded
    need: >-
      The same for a recording uploaded to Bunny: the position of Bunny's player is heard and recorded as YouTube's is, and its end
      counts the celse watched.
    evidence:
      - source: apps/tedris/features/courses/bunny-player.ts:56
      - test: apps/tedris/test/watch-progress-model.spec.ts
        name: "reads the time, the pause, the end and the ready"
      - test: apps/tedris/test/watch-page.spec.ts
        name: "plays a Bunny recording in the link signed for this viewer; the notes get no position, the counter listens"
    missing: >-
      no Linear issue; Bunny was not played: the stack has no Bunny library, so the Player.js path (bunny-player.ts, useBunnyPlayer) is
      covered only by the parser spec (bunnyEventOf) and was never seen working against Bunny's player; whether Bunny's embed answers
      postMessage is the open question of MDRS-264's spike for the notes; code exists
    note: |-
      Drawn on the states playerTalebe and reporting, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).
      #402 names it under "Not verified": "worth one look on dev with a Bunny recording before release".

  - id: back-to-where-they-stopped
    need: >-
      On the watch page a talebe is told whether they already watched the celse, or where they stopped in it, and goes back there
      with one press.
    evidence:
      - state: playerTalebe
      - node: watchedNote
      - node: resumeNote
      - node: resumeButton
      - source: apps/tedris/features/courses/components/watch-progress.tsx:143
      - source: apps/tedris/features/courses/components/watch-page.tsx:71
      - test: apps/tedris/test/watch-progress-model.spec.ts
        name: "goes back to where the player was, not to the start or the last seconds"
    note: |-
      Unwalked: no browser e2e and no scenario; the binding's data records no watch, and the stack's browser does not play YouTube. The
      line is drawn from the record the page read when it was drawn, so a celse played in another tab shows at the next read. The
      focus after the press and the unannounced change are the-counter-is-perceived-by-everyone.

  - id: the-counter-is-perceived-by-everyone
    need: >-
      A talebe who uses a keyboard or a screen reader is told when the celse is counted watched, and keeps their place when they go
      back to where they stopped.
    evidence:
      - source: apps/tedris/features/courses/components/watch-progress.tsx:143
    missing: no Linear issue; findings COUNTER-2, COUNTER-3; code exists in part
    note: |-
      Drawn on the state playerTalebe and on the nodes watchedNote and resumeButton, which the code has: they are not evidence, so that
      a replay still walks them (SPEC.md §13 leaves out what only missing needs name).
      Read from the code, not walked: the button removes itself and the focus falls to the page (COUNTER-2); the line is no live region
      (COUNTER-3). Defects, not planned work, so no Linear key.

  - id: a-failed-save-says-what-happened
    need: >-
      When the platform does not record a talebe's watching, because their seat ended while the page was open or their session is
      over, the talebe is told so under the player, and is not left watching as if it were counted.
    evidence:
      - source: apps/tedris/features/courses/components/watch-progress.tsx:62
    missing: no Linear issue; findings COUNTER-1; code exists in part
    note: |-
      Drawn on the states reporting and playerTalebe, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).
      Carried from tedris.course.updateProgress (retired 23 Nov 2026), where it asked the window's save to say why it was refused
      (PROGRESS-1); the counter's reports are the saves now. Half built: the line says "Bu celseyi izledin" only when the API stored the
      mark (watch-progress.tsx:63, :143), so it never claims a count that did not happen; but a refused or lost report is dropped
      without a word (COUNTER-1). Dropping a lost one is right, since the next report carries a newer position; a refusal that every next
      report meets is not. Read from the code, not walked.
