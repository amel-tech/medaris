# What tedris.celse.watchRecording needs from the product, from its story (a talebe watches a celse's recording once it is open; the course team plays it
# early; a person with no seat does not), and what the code and the walks hold of it today. Nothing here is read by `check`; a YAML parser reads it.
#
# Missing or unwalked, for the orchestrator's gaps merge (every other need has a walk phase scenario of this folder's binding.yaml, not yet replayed):
#   missing:  recording-public-honours-medrese-policy (no code: the policy is stored and never asked; the domain's own finding), failed-recording-seen-by-team (no code: MDRS-259), notes-position-on-bunny (MDRS-264)
#   unwalked: bunny-recording-plays (code, needs Bunny), recording-failed-read-is-not-found (code, the stack cannot refuse the read), recording-with-stream-link (code, tedris.celse.watchStream walks it)
# Walks: no replay was run in this phase ("walk phase"): `walked` lists the scenarios of binding.yaml that will walk each need, with the e2e checks that exist, never a scenario that has passed.
kind: needs
flow: tedris.celse.watchRecording
status: proposed
needs:
  - id: talebe-watches-an-open-recording
    need: >-
      A talebe who holds a seat opens a celse that is over and watches its recording, with the recording's title, date and length, and their own questions and
      notes beside it, whether it was added as a YouTube, a Drive, a Bunny or another link.
    drawn: [celseCard, playerTalebe]
    built:
      - route: apps/tedris/app/courses/[courseId]/lessons/[lessonId]/izle/page.tsx:34
      - route: apps/tedris/features/courses/components/watch-view.tsx:205
      - action: medaris.api:getSession
    walked:
      - e2e: apps/tedris/e2e/celse-states.e2e.ts
        check: 'celse-states#3'   # STALE: expects youtube-nocookie.com, the app frames www.youtube.com since MDRS-293
      - e2e: apps/tedris/e2e/lesson-notes.e2e.ts
        check: 'lesson-notes#1'
      - replay: talebeOpen   # walk phase
  - id: link-that-cannot-be-framed
    need: >-
      A recording whose link cannot be put in a frame (a host with no embed) is still reachable from the watch page: a placeholder and a link to the host.
    drawn: [playerTalebe, playerTeam]
    built:
      - route: apps/tedris/features/courses/components/media-player.tsx:71
    walked:
      - replay: talebeLink   # walk phase
  - id: recording-opens-when-released
    need: >-
      A recording opens to talebe only when it is ready, its celse has begun and the release time the course team set has passed; before that the talebe is told when it opens
      (on the celse page) and is not played anything, and the address of the watch page does not play it either.
    drawn: [celseHeld, sorting]
    built:
      - action: medaris.api:setLessonRecordingAvailability
      - action: medaris.api:createLessonRecording
      - route: apps/tedrisat/src/course/domain/recording.ts:100
      - route: apps/tedris/features/courses/components/session-action-card.tsx:357
    walked:
      - replay: talebeHeld   # walk phase
  - id: recording-being-prepared-offers-nothing
    need: >-
      A recording still being prepared offers no link anywhere, says so on the celse page, and sends its watch page's address back to the celse page.
    drawn: [celsePreparing]
    built:
      - route: apps/tedris/features/courses/components/session-action-card.tsx:361
    walked:
      - e2e: apps/tedris/e2e/celse-states.e2e.ts
        check: 'celse-states#4'
      - replay: talebePreparing   # walk phase
  - id: team-plays-a-held-recording-early
    need: >-
      The course team plays a recording that is held back, and is told when it opens to talebe, so that they can check it before it is released.
    drawn: [celseCard, playerTeam]
    built:
      - route: apps/tedrisat/src/course/domain/recording.ts:150
      - route: apps/tedris/features/courses/components/watch-view.tsx:219
    walked:
      - replay: teamHeld   # walk phase
  - id: no-seat-no-watch-page
    need: >-
      A person with no seat, or a signed-out visitor, is never played a recording on the watch page, whatever the recording's visibility; a visitor is asked to sign in first.
    drawn: [detail_locked, sign_in_asked]
    built:
      - route: apps/tedris/app/courses/[courseId]/lessons/[lessonId]/izle/page.tsx:31
    walked:
      - e2e: apps/tedris/e2e/celse-states.e2e.ts
        check: 'celse-states#6'
      - replay: outsider   # walk phase
      - replay: visitor   # walk phase
  - id: public-recording-of-a-sample-celse
    need: >-
      The PUBLIC recording of a sample celse is the one recording a person with no seat may be played, on the locked celse page; no ENROLLED or other recording is.
    drawn: [lockedPlayer]
    built:
      - route: apps/tedrisat/src/course/course.service.ts:697
      - route: apps/tedris/features/courses/components/lesson-locked.tsx:139
    walked:
      - replay: outsiderSample   # walk phase
  - id: recording-public-honours-medrese-policy
    need: >-
      A medrese that switches "Ders kayıtları herkese açılamaz" on keeps its courses' PUBLIC recordings from everyone who has no seat, as the platform's and the köşk's switches do
      (the domain's recording-public-honours-medrese-policy and policy-no-public-recordings-inert).
    drawn: [lockedPlayer]
    missing: none
  - id: failed-recording-seen-by-team
    need: A failed Bunny upload is shown to the course team with its reason and a retry, instead of vanishing (MDRS-259).
    drawn: [celsePreparing]
    missing: MDRS-259
  - id: notes-position-on-bunny
    need: The notes read the player's position and seek on a Bunny recording, instead of a typed time (MDRS-264).
    drawn: [playerTalebe]
    missing: MDRS-264
  - id: bunny-recording-plays
    need: A recording uploaded to Bunny plays on the watch page in Bunny's player, on a link signed for this viewer.
    drawn: [playerTalebe, playerTeam]
    built:
      - route: apps/tedris/features/courses/components/media-player.tsx:12
      - route: apps/tedrisat/src/course/course.service.ts:196
    walked: []   # needs Bunny (STACK.md): the stack has no library keys
  - id: recording-failed-read-is-not-found
    need: A celse that cannot be read because tedrisat is down is told apart from a celse that does not exist (CLS-01).
    drawn: [not_found]
    built:
      - route: apps/tedris/features/courses/public-reads.ts:49
    walked: []   # the stack cannot make tedrisat refuse the read
  - id: recording-with-stream-link
    need: A celse that holds a recording that is not yet open and also has a live stream link plays the stream on the watch page, with the recording's opening time beside it.
    drawn: [stream_opened]
    built:
      - route: apps/tedris/features/courses/watch-model.ts:143
    walked: []   # tedris.celse.watchStream walks it
