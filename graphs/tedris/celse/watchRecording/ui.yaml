rules:
  - { id: focus-not-set, rule: "Neither the celse page nor the watch page moves the focus when it opens, by a link or by address: no autoFocus in session-*.tsx, watch-*.tsx, media-player.tsx or lesson-locked.tsx (read, and the focus measured on the stack: document.activeElement is the body after every load). The page nodes have no `initialFocus`; the silence is not read as an omission. The first Tab stop is the chrome (the desktop bar or the phone's Menü button)." }
  - { id: CLS-07, rule: "The poster of the recording card is a second link named \"Kaydı izle\" to the same address as the button (session-action-card.tsx:238-246). tabIndex -1 takes it out of the tab order, not out of a screen reader's list of links, so the same destination is listed twice (measured: two links of that name in the page's accessibility tree). Fix: aria-hidden on the poster, or fold it into the button's hit area." }
  - { id: CLS-06, rule: "On a phone the video is shown first but is third in the DOM and tab order (back link, h1, \"Celse ayrıntıları\" come before it): max-md:order-1/2/3 on the watch page's three blocks (watch-view.tsx:205-247). WCAG 1.3.2 and 2.4.3. Not walked: the replay's window is 1280 px wide. Fix: put the player first in the DOM and move the header row with CSS." }
  - { id: CLS-09, rule: "The celse page decides what its recording block says (the link, the sentence that says when it opens, the sentence that says it is being prepared) once, on the server, from `new Date()` at render (page.tsx:49), and no client island refreshes it (session-page.tsx:116-125, 240-245). A tab left open across a release time keeps saying \"Ders kaydı <day> açılır.\" until it is read again, and the watch page's address redirects it back until then." }
  - { id: CLS-01, rule: "A failed read of the celse, whatever the cause (a 5xx, a timeout, a refused token), is the not-found page (public-reads.ts:49-55, layout.tsx:80): a tedrisat outage on a celse reads like a celse that does not exist, with no retry. Not walked: the stack cannot make tedrisat refuse the read. Fix: throw on a status that is not 400, 403 or 404, as getCourse does." }
  - { id: WATCH-1, rule: "A YouTube recording is framed with enablejsapi=1 for an enrolled talebe (watch-page.tsx:57-58, 70) so the notes can read the position, and youtube-player.ts then makes a YT.Player of the frame. YouTube's script sets the frame's `title` to \"YouTube video player\": measured on this stack with the script loaded, the frame the page rendered with the recording's title (\"Birinci okuma kaydı\") had that name; with www.youtube.com/iframe_api blocked it kept the recording's title, and the course team's frame (no player API) keeps it too. The frame's accessible name is then generic and the same for every recording (WCAG 4.1.2, 2.4.6). Provisional id, not in the inventory. Fix: set the title again once the player is ready, or give the frame an aria-label." }
  - { id: WATCH-2, rule: "A READY Bunny recording that tedrisat cannot sign a player link for (the library's token key is not set, BunnyStreamClient.embedUrl answers null: course.service.ts:196-208) reaches the page as a recording with no link and no release time, which the celse page tells as \"Ders kaydı hazırlanıyor.\" and the watch page redirects: a recording that is ready and cannot be played reads as one still being prepared, for the talebe and for the course team alike. Measured on this stack with a BUNNY row written by SQL (no keys, so no signature): the celse page of a talebe said \"Ders kaydı hazırlanıyor.\" and the watch page redirected to it; a person on the course team met the same. Production has the keys, so this is what a misconfigured or expired token key would look like. Provisional id, not in the inventory. Fix: have the API answer the recording with a status the page can tell from PROCESSING, or an error the course team can see." }
  - { id: WATCH-3, rule: "The page reads no `visibility` of the recording: a talebe, or the course team, is played an ENROLLED and a PUBLIC recording alike (grep of session-*.tsx, watch-*.tsx, media-player.tsx: none). Visibility matters only to what tedrisat sends a person who may not read the content: nothing, except the PUBLIC recording of a sample celse (course.service.ts:697-761), which the locked page then plays. That one is cut by three rules (a closed course, the platform's RECORDINGS_NEVER_PUBLIC, the köşk's recordingsNeverPublic: publicRecordingsAllowed, course.service.ts:857-867) and not by the medrese's \"Ders kayıtları herkese açılamaz\" (madrasah_settings.policy_no_public_recordings), which is stored, shown, saved with an audit row and loaded into the engine (tedrisat-authz-context.service.ts:155,224, where it would close setting.recordings_public) and asked by nothing. So a signed-in person with no seat, on a medrese's sample celse, is played a PUBLIC recording with the switch on, against the settings page's own promise (nazar.json Settings.policies.noPublicRecordings.help). The domain's own findings: recording-public-honours-medrese-policy (holds: false) and policy-no-public-recordings-inert; MDRS-207 left the guard for the recordings work and it was not wired (tedris.course.recordings carries the same finding as RECS-1 for the list). Read from the code, every consumer of the column searched; the sample celse's public recording was measured on the stack (a köşk course, no medrese): a signed-in person with no seat was played it, and the watch page's address redirected them. The medrese's switch was not switched on: that needs a medrese course of its own on a shared medrese. Provisional id, not in the inventory. Fix: ask the medrese's switch in publicRecordingsAllowed, and refuse a PUBLIC write while the engine closes setting.recordings_public." }
  - { id: MDRS-259, rule: "visibleRecordings leaves a FAILED recording out for every caller (domain/recording.ts:176-190), so neither page shows one: a Bunny upload that could not be encoded reads as no recording at all (\"Bu celsede henüz ders kaydı yok.\"), the course team included. Needs Bunny to walk; not walked." }
  - { id: MDRS-264, rule: "The notes read the player's position only from a YouTube frame (youtube-player.ts); beside a Bunny player, or a link that cannot be framed, the time is typed (watch-page.tsx:57-58). Open as MDRS-264 \"Notes and questions on a Bunny recording\" (a spike on whether Bunny's embed answers postMessage). Needs Bunny to walk; not walked." }
  - { id: iframe-not-walked, rule: "The player is a third-party frame: the replay finds the frame and its title and the page around it, and does not play the video. The YouTube frames on the stack's browser are drawn and left idle; whether YouTube answers them is not asserted." }
