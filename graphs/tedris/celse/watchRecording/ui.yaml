  endedBadge: { type: text, component: Text, text: { key: SessionPage.endedLabel }, in: [celseCard, celseHeld, celsePreparing], source: apps/tedris/features/courses/components/session-header.tsx:67 } # the header's badge (data-testid=session-state), on the celse's own clock

