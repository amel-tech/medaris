# The screens of tedris.celse.watchRecording: the recording block of tedris-web's celse page (features/courses/components/session-action-card.tsx),
# the watch page (app/courses/<id>/lessons/<id>/izle, features/courses/components/watch-view.tsx, media-player.tsx) for a talebe and for the course team,
# and the recording the locked celse page plays (lesson-locked.tsx). The rest of the celse page (the header's badge and meta line, the pager, the
# Müfredat popup, the agenda, the resources, the homework and the notes panel) is drawn only as far as the page's name and heading, and belongs to
# tedris.celse.attend, tedris.celse.browseCurriculum and tedris.learn.*; the locked page's other parts belong to tedris.celse.locked.
#
# Words: every key that does not start with `composed.` is copied from libs/i18n/src/locales/tr/tedris.json (the app reads it as `tedris.<key>`:
# `SessionPage.*`, `LessonLocked.*`) or tedris-learn.json (`tedrisLearn.<key>`: `WatchPage.*`, `RecordingRelease.*`, `LessonNotes.*`), the key
# being the path inside that file. The `composed.*` keys are NOT in any i18n file: they are what the code writes from messages and data, with their
# placeholders so a replay can match them (a placeholder with no sample matches any text):
#   composed.WatchRecording.celseTitle     "{title}", the celse's own title as the API gives it                              session-header.tsx:58
#   composed.WatchRecording.cardLine       the recording's day and its length ("{recordedOn} {length}", length = SessionPage.minutes)   session-action-card.tsx:286-292
#   composed.WatchRecording.backName       WatchPage.backSr, then the course's title                                      watch-view.tsx:230-231
#   composed.WatchRecording.facts          WatchPage.recordingBadge, " · ", the day, " · ", WatchPage.minutes              watch-page.tsx:93-99
#   composed.WatchRecording.recordingTitle "{recording}", the recording's own title as the API gives it                    media-player.tsx:92
#   composed.WatchRecording.frameTitle     "{recording}", the frame's title (for a Bunny frame WatchPage.bunnyFrameTitle, "Ders kaydı oynatıcısı: {recording}", which this stack cannot draw)   media-player.tsx:68
#   composed.WatchRecording.lockedFacts    SessionPage.recordingKind, " · ", the day with its weekday, " · ", SessionPage.minutes   lesson-locked.tsx:257-267
# `changes` is the app's own sentence for what the counter's reports (recordLessonView, the state `reporting`) change: "Bu celseyi izledin"
# (WatchPage.watchedNote), the line under the player once the API counted the celse watched. The page says nothing before that of what
# playing records, nor that the course page counts the progress from it (CoursePage.progressNote says so there).
# Samples are invented and neutral; the binding gives the walk's own titles where it needs the real ones.
schema: delurio-graph/0
