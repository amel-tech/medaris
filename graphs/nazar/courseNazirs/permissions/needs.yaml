schema: delurio-graph/0
kind: needs
id: nazar.courseNazirs.permissions
status: proposed
summary: "What must exist for the hoca of a course to change a ders nazırı's permissions and end: the flow's product list."

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# missing  (no code): nothing-changed-says-so (none, F-D2c-18), keyboard-starts-on-the-work (none, F-D2c-15), end-problem-is-announced (none, F-D2c-4),
# the-end-shows-the-hour (none, CNP-2), count-is-announced (none, CNP-4), focus-after-a-stale-save (none, CNP-1),
# closing-asks-when-the-form-changed (none, decision D2, product choice)
# unwalked (code, no e2e and no replay that passed): a-refused-save-keeps-the-form, nothing-changed-writes-nothing, an-end-not-ahead-is-refused-on-the-page
# (each has a unit test only), every-change-is-audited (the dialog says so, nothing reads the audit log)
# walked elsewhere: the-person-meets-the-new-set-at-once is walked by course-nazirs#5 a8-a12, which nazar.access.dersNazirPages carries, not this flow

needs:
  - id: edit-the-whole-post-in-one-save
    need: >-
      The hoca changes everything a ders nazırı holds in her course in one save: ticks and unticks any of the course's permissions
      she holds herself, and the post's end; what is ticked is what the person holds from then on, and the list says it at once
      ("{n} izin" and the sentences).
    evidence:
      - node: editButton
      - state: editing
      - node: permRecording
      - node: permSession
      - node: permSettings
      - node: summary
      - state: saving
      - node: toastSaved
      - node: rowCount
      - node: rowSentences
      - source: apps/tedrisat/src/course/nazir/course-nazir.controller.ts:126
      - source: apps/nazar/features/course-nazirs/components/course-nazir-dialog.tsx:157
      - test: apps/nazar/e2e/course-nazirs.e2e.ts
        name: "the müderris takes a permission and then the end away, and the page it opened shuts (criterion 3)"
      - test: apps/nazar/test/course-nazir-dialog.spec.tsx
      - test: apps/nazar/test/course-nazir-dialog.spec.tsx
        name: "turns the boxes off while the save is on its way, so what is sent is what is shown"

  - id: lift-or-move-the-end
    need: >-
      The hoca gives the post an end on her own clock, moves it, or lifts it ("Süresiz"); the post and its permissions end
      together at that moment, and a field she leaves alone sends the stored instant back unchanged.
    evidence:
      - node: endBox
      - node: endHelp
      - node: rowEnd
      - node: rowForever
      - source: apps/tedrisat/src/course/nazir/course-nazir.controller.ts:126
      - source: libs/utils/src/end-instant.ts:141
      - test: apps/nazar/e2e/course-nazirs.e2e.ts
        name: "the müderris takes a permission and then the end away, and the page it opened shuts (criterion 3)"
      - test: libs/utils/test/end-instant.spec.ts

  - id: an-end-not-ahead-is-refused-on-the-page
    need: >-
      An end that is not after now is refused before anything is sent, and the reason stays beside the field while she corrects
      it; the server refuses it too.
    evidence:
      - node: endError
      - source: apps/tedrisat/src/course/nazir/course-nazir.controller.ts:126
      - source: apps/nazar/features/course-nazirs/components/course-nazir-dialog.tsx:154
      - test: apps/nazar/test/course-nazir-dialog.spec.tsx
    note: Also drawn as the assertion a-blocked-form-is-never-sent.

  - id: a-stale-post-is-told-and-the-list-read-again
    need: >-
      A post that was ended elsewhere while the dialog was open is not an error of hers: she is told the post is gone, the dialog
      closes and the list is read again without the row.
    evidence:
      - node: toastGone
      - state: postGone
      - node: emptyLine
      - source: apps/nazar/features/course-nazirs/course-nazirs.ts:256
      - test: apps/nazar/e2e/course-nazirs.e2e.ts
        name: "a person appointed elsewhere while the dialog is open is worded from the API's 409, and the list is read again"
    note: Also drawn as the assertion the-empty-table-follows-a-gone-post.

  - id: a-refused-save-keeps-the-form
    need: >-
      When the server refuses the save (she lost her seat, a code is not hers to give, the course is gone) the form stays as she
      left it and the toast says why in words, never the server's own message.
    evidence:
      - node: toastRefused
      - node: toastFailed
      - state: editing
      - state: saving
      - source: apps/nazar/features/course-nazirs/course-nazirs.ts:219
      - test: apps/nazar/test/course-nazir-dialog.spec.tsx

  - id: nothing-changed-writes-nothing
    need: >-
      "Kaydet" with the same permissions and the same end writes nothing, so that the audit log is not given a line for no change.
    evidence:
      - node: save
      - source: apps/nazar/features/course-nazirs/course-nazirs.ts:208
      - test: apps/nazar/test/course-nazirs.spec.ts
    note: Also drawn as the assertion an-unchanged-form-is-never-sent.

  - id: nothing-changed-says-so
    need: >-
      "Kaydet" with nothing changed tells the hoca that nothing was saved, not only closes the dialog (F-D2c-18, decision D1).
    missing: no Linear issue; F-D2c-18
    note: >-
      Drawn on the state listed and on the node save, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).

  - id: the-person-meets-the-new-set-at-once
    need: >-
      What the ders nazırı may open follows the save at once: a permission taken away shuts its page and the end shuts them all,
      with no delay.
    evidence:
      - state: saving
      - source: apps/tedrisat/src/course/nazir/course-nazir.controller.ts:126
      - test: apps/nazar/e2e/course-nazirs.e2e.ts
        name: "the müderris takes a permission and then the end away, and the page it opened shuts (criterion 3)"
    note: "course-nazirs#5: a8-a12, which nazar.access.dersNazirPages carries"

  - id: every-change-is-audited
    need: >-
      Every permission given and taken back, and every end moved, is written to the audit log with who did it and what it was
      before, as the dialog's note says.
    evidence:
      - node: note
      - source: apps/tedrisat/src/course/nazir/course-nazir.controller.ts:126

  - id: keyboard-starts-on-the-work
    need: >-
      The edit dialog starts the keyboard on the first box, not on the header's close button, and is described by its intro line,
      not by the whole form (F-D2c-15, F-D2c-16).
    missing: no Linear issue; F-D2c-15
    note: >-
      Drawn on the nodes editor and closeIcon, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).

  - id: end-problem-is-announced
    need: The message about an end that is not ahead is announced when it appears, or the focus moves to the field (F-D2c-4).
    missing: no Linear issue; F-D2c-4
    note: >-
      Drawn on the node endError, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves
      out what only missing needs name).

  - id: the-end-shows-the-hour
    need: >-
      The "Bitiş" cell of the list says the hour at which the access ends, not only the day, because the hoca sets it to the
      minute and the access stops at that minute (CNP-2).
    missing: no Linear issue; CNP-2
    note: >-
      Drawn on the node rowEnd, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves
      out what only missing needs name).

  - id: count-is-announced
    need: The count of the permissions ticked ("2 izin seçili") is announced as the boxes change (CNP-4).
    missing: no Linear issue; CNP-4
    note: >-
      Drawn on the node summary, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves
      out what only missing needs name).

  - id: focus-after-a-stale-save
    need: >-
      After the dialog closes because the post is gone, the focus lands on something a keyboard or screen-reader user can use, not
      on the document's start (CNP-1; the same as F-D2c-8 for a dismissal).
    missing: no Linear issue; CNP-1
    note: >-
      Drawn on the state postGone, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).

  - id: closing-asks-when-the-form-changed
    need: >-
      Closing the dialog after a box was ticked or an end typed asks first, or says that nothing was saved (decision D2: a product
      choice; the scrim already does not close it).
    missing: no Linear issue; decision D2, product choice
    note: >-
      Drawn on the nodes cancel and closeIcon, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).
