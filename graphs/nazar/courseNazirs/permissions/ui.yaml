# The screens of nazar.courseNazirs.permissions: the page "Ders nazırları" of a course (/ders/<id>/nazirlar) as the hoca reads it, the dialog
# "İzinleri düzenle" over it, and the toasts of a save. Read from apps/nazar/features/course-nazirs (course-nazirs-page.tsx,
# course-nazirs-table.tsx, course-nazir-dialog.tsx, course-nazirs.ts, actions.ts), apps/nazar/features/nazirs/components/permission-section.tsx and
# libs/ui/src/mds (dialog, checkbox, field, button, table, toast); the words are copied from libs/i18n/src/locales/tr/nazar.json, key for key.
# Nothing was seen in a browser: every node is "from the code" until the walk phase.
#
# What the graph draws of a form of 21 boxes. The course catalog has 21 codes; the graph draws three of them, the ones the walk meets: "Ders kaydı
# ekle..." (held, never changed here), "Celse ekle..." (held, ticked and unticked) and "Ders ayarlarını..." (not held, never ticked here). The other
# eighteen are boxes like them; `world: open` leaves them out. The dialog is the same one nazar.courseNazirs.appoint opens (`row === null`): this graph
# is its edit half, so the e-mail field, the person search and "Seçilen ders nazırı" are that flow's.
#
# Composed text (not in any i18n file), each a value the page puts in a place with no message of its own:
#   composed.Row.person       the <bdi> of the nazır's name in the table (course-nazirs-table.tsx:48)
#   composed.Row.email        her address, a <bdi dir=ltr> (course-nazirs-table.tsx:51)
#   composed.Row.permissions  the sentences of the codes held, joined with " · " (course-nazirs.ts:125-128, shown at course-nazirs-table.tsx:68)
#   composed.Row.endDate      the <time> of the end, a date as dayFormat(locale, zone) writes it (course-nazirs-table.tsx:81); no time of day (CNP-2)
#   composed.Row.giver        the <bdi> of who appointed (course-nazirs-table.tsx:93)
#   composed.Editor.eyebrow   the course's title above the dialog's title (course-nazir-dialog.tsx:235)
#   composed.Editor.person    the nazır's name in the dialog's header (course-nazir-dialog.tsx:268)
#   composed.Editor.email     her address, a <bdi dir=ltr> (course-nazir-dialog.tsx:271)
#   composed.Editor.roleLine  "Ders nazırı · Atayan: {giver} · {date}": the message dialog.role, " · " and the sentence of appointedBy that
#                             course-nazirs.ts:137 builds (course-nazir-dialog.tsx:276)
# The one message that is authored here is `Changes.note`: no app message says what saving a post changes (see the report).
#
# Samples: the replay reads the binding's samples (the nazır's name and address, the course's title, the dates) and matches any text where it has none.
schema: delurio-graph/0
kind: ui
id: nazar.courseNazirs.permissions
flow: nazar.courseNazirs.permissions
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note } # the one authored message of this catalog: the app has no sentence for what an edit of a post changes
samples:
  course: Deneme dersi cnperm
  name: Rıza Başvuran
  email: e2e-basvuran-h@medaris.test
  count: "2"
  list: Ders kaydı ekle, adlandır, gizle; görünürlüğünü değiştir · Celse ekle, tarihini değiştir, iptal et; toplantı bağlantısını gir
  endDate: 15 Aralık 2026
  giver: Hamdi Müderris
  date: 15 Kasım 2026

# The page sets no focus when it loads (nothing in features/course-nazirs does), so the page node has no `initialFocus` and there is no `focus`
# (rule focus-not-set). The dialog opens with the focus on its close icon, the first thing Base UI can focus, because edit mode gives it none
# (course-nazir-dialog.tsx:242); that is the code's doing, not verified in a browser (F-D2c-15).
nodes:
