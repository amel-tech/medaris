# nazar.courseNazirs.permissions, the post is ended elsewhere while the dialog is open (e2e course-nazirs#7, second half). Written without a replay;
# see locators.binding.yaml for the data and the locators every file shares.
#   flock <scratchpad>/replay.lock nice -n 10 node <engine>/src/cli.ts replay graphs/nazar/courseNazirs/permissions \
#     --bind graphs/nazar/courseNazirs/permissions/binding.gone.yaml --cover transitions --absent --out <dir>
# The dialog was opened on the post and the walk pressed "Kaydet": `before` on it dismisses the post as the başnazım would (post-data.mjs dismiss: DELETE
# /courses/:id/nazirs/:postId, the e2e's `api(...)` of a8), so the PATCH meets no post (COURSE_NAZIR_NOT_FOUND, 404). The page says "İzinler kaydedilemedi" /
# "Bu ders nazırı artık yok; liste yenilendi.", closes the dialog and reads the list again without the row: the table says "Bu derste henüz ders nazırı
# yok." (e2e a9-a12). A path that presses "Kaydet" and stops on the page (an end that is not ahead, nothing changed) runs the hook too: the post is gone
# behind the page and the page does not know, as in the walk; `held same` then finds `gone`, which is what the helper recorded.
schema: delurio-graph/0
kind: binding
extends: ./locators.binding.yaml
flow: nazar.courseNazirs.permissions

scenarios:
  gone:
    given: { post: dated, answer: gone }
    as: muderris
    open: '{nazar}/ders/{cn.course}'
    enter: { nav: ../../nav, bind: ../../nav/binding.yaml, entry: 'frame:ders->dersNazirs' }
    setup:
      - run: [node, ../nazar/courseNazirs/permissions/post-data.mjs, down]
        expect: post-data down
      - run: [node, helpers/course.mjs, make, cnperm, --weeks, '1', --lessons, '1']
        expect: '"tag":"cnperm"'
      - run: [node, ../nazar/courseNazirs/permissions/post-data.mjs, up]
        expect: post-data up
    teardown:
      - run: [node, ../nazar/courseNazirs/permissions/post-data.mjs, down]
        expect: post-data down
      - run: [node, helpers/course.mjs, remove, cnperm]
        expect: course remove cnperm

nodes:
  save:
    role: button
    name: '/^Kaydet$/'
    within: { role: dialog, name: İzinleri düzenle }
    before: [{ run: [node, ../nazar/courseNazirs/permissions/post-data.mjs, dismiss], expect: post-data dismiss }]
