# What must exist for the hoca of a course to appoint a ders nazırı, give them permissions and an end, and see who holds a post: the flow's
# product list (LAYOUT.md section 7). Each need is what the product must do, from the flow's story (FLOWS.md), the inventory's findings
# (F-D2c-4, F-D2c-5, F-D2c-6, F-D2c-12, F-D2c-16) and the flow's own (CAPPOINT-1 to CAPPOINT-4), not from what the page does today. Read by
# people for now: no checker runs on this file yet. Nothing planned in planned.md belongs to this flow (P-15, MDRS-201, is the dismissal's;
# MDRS-133's "no re-delegation" is built: a holder of course_nazir.assign by a grant appoints with no permission, nazar.access.dersNazirPages).
#
# For the orchestrator's gaps merge (nothing here was replayed; the e2e checks, the API's e2e and the unit specs named under `walked` are the
# only runs, and the replay scenarios of binding.yaml, binding.race.yaml and binding.head.yaml are written and not run):
#   missing:  search-only-on-purpose (none), a-search-says-what-it-did (none), kaydet-says-why-it-is-off (none),
#             cancel-while-pending-answers (none), selection-count-is-announced (none)
#   unwalked: barred-person-is-refused (a unit test of the wording and the API's own e2e; no web e2e; the replay scenario `barred` is
#             written and not run), past-end-is-told (unit specs only; the replay path TYPE_PAST_END is written and not run),
#             ceiling-cuts-what-is-given (e2e course-nazirs#14 walks it, but the stack cannot be made to cut a ceiling without changing a
#             seeded medrese, so no replay: `person: overreach` is not bound)
kind: needs
flow: nazar.courseNazirs.appoint
status: proposed

needs:
  - id: find-by-exact-address
    need: >-
      The hoca finds a person by their exact e-mail address in the realm's directory, which holds people who never opened the app, sees
      who was found by name and address before doing anything, and is told when the text is no address, when no account has the address
      and when the directory does not answer; nobody is chosen from an unknown address.
    drawn: [asking, searching, picked, emailField, emailNotEmail, emailNobody, emailDown, searchingStatus, chosenRegion, chosenTitle, chosenName, chosenAddress, removePerson]
    built:
      - action: medaris.api:lookupUser
      - route: apps/nazar/features/course-nazirs/components/course-nazir-dialog.tsx:107
    walked:
      - e2e: apps/nazar/e2e/course-nazirs.e2e.ts
        check: 'course-nazirs#10' # a2, a3: "Bu adresle bir hesap bulunamadı." and "Kaydet" off
      - test: apps/nazar/test/course-nazir-dialog.spec.tsx # :207-241, Enter and not a key, no address, no account, the directory

  - id: appoint-with-permissions-and-an-end
    need: >-
      The hoca makes a person ders nazırı with the permissions she ticks (only ones she holds herself) and, if she wants, an end; the post and
      its permissions end together, the appointment is written to the audit log, and the list says what was given: "{n} izin", the sentences
      of the codes, the end or "Süresiz", who appointed and when.
    drawn: [appointing, listed, permSession, permRecording, endField, summaryNone, summaryCount, save, toastAppointed, rowCount, rowPermissionsLine, rowEnd, rowNever, rowGiver, rowGiverDay]
    built:
      - action: medaris.api:createCourseNazir
      - route: apps/nazar/features/course-nazirs/actions.ts:33
      - route: apps/nazar/features/course-nazirs/course-nazirs.ts:106
    walked:
      - e2e: apps/nazar/e2e/course-nazirs.e2e.ts
        check: 'course-nazirs#3' # a1-a8: the person, two boxes, an end, "2 izin", the day, "(siz)", the post's end and each grant's
      - test: apps/nazar/test/course-nazir-dialog.spec.tsx # :263-279 and :310-357
      - test: apps/tedrisat/test/e2e/course-nazirs.e2e.spec.ts # the API: post, grants, end, audit row

  - id: post-may-start-empty
    need: >-
      A person can be made ders nazırı holding nothing and be given permissions later, so that appointing and giving are two steps when the
      hoca wants them to be; the list says "İzin yok" for such a post.
    drawn: [appointing, listed, summaryNone, rowNoPerms, rowNever]
    built:
      - action: medaris.api:createCourseNazir
      - route: apps/nazar/features/course-nazirs/course-nazirs.ts:124
    walked:
      - e2e: apps/nazar/e2e/course-nazirs.e2e.ts
        check: 'course-nazirs#7' # a3, a6: a post made with no permission reads "İzin yok" (made through the API there)
      - test: apps/nazar/test/course-nazirs.spec.ts # :89, the row of a post that holds none

  - id: empty-list-says-so
    need: >-
      A course with no ders nazırı says so, and the button to appoint is there; the page does not show a placeholder or a blank table.
    drawn: [listed, emptyLine, appointButton, rosterTable]
    built:
      - route: apps/nazar/features/course-nazirs/components/course-nazirs-table.tsx:154
    walked:
      - e2e: apps/nazar/e2e/course-nazirs.e2e.ts
        check: 'course-nazirs#2' # a1-a4; a5 (the aside link's aria-current) is the shell's

  - id: holder-is-told-before-sending
    need: >-
      A person who holds a post in the course already is shown as one, with a line that says so, and cannot be appointed again; the API
      refuses a second post with a 409 as well.
    drawn: [pickedMember, alreadyAlert, save]
    built:
      - action: medaris.api:createCourseNazir
      - route: apps/nazar/features/course-nazirs/course-nazirs.ts:192
    walked:
      - e2e: apps/nazar/e2e/course-nazirs.e2e.ts
        check: 'course-nazirs#6' # a2-a6
      - test: apps/nazar/test/course-nazir-dialog.spec.tsx # :243-261

  - id: appointed-elsewhere-is-worded
    need: >-
      A person who becomes a ders nazırı through someone else while the dialog is open is met by a refusal in words ("Bu kişi bu dersin ders
      nazırı zaten."), the dialog closes and the list is read again with the post that now exists, so the hoca is not left on a stale form.
    drawn: [appointing, listed, toastExists, rowNoPerms, rowNever]
    built:
      - action: medaris.api:createCourseNazir
      - route: apps/nazar/features/course-nazirs/course-nazirs.ts:256
    walked:
      - e2e: apps/nazar/e2e/course-nazirs.e2e.ts
        check: 'course-nazirs#7' # the first half, a1-a7; the second half (the post ended while the edit dialog is open) is nazar.courseNazirs.permissions'
      - test: apps/nazar/test/course-nazir-dialog.spec.tsx # :374-385

  - id: nobody-appoints-themselves
    need: >-
      Nobody appoints themselves a ders nazırı, whatever route let them in: the dialog says so before sending, and the API refuses with a
      403 and writes nothing but the audit row of the refusal.
    drawn: [pickedSelf, selfAlert, save]
    built:
      - action: medaris.api:createCourseNazir
      - route: apps/nazar/features/course-nazirs/course-nazirs.ts:197
    walked:
      - e2e: apps/nazar/e2e/course-nazirs.e2e.ts
        check: 'course-nazirs#9' # a2-a5

  - id: seat-holder-is-refused
    need: >-
      A person who already holds a seat over the course (the köşk's nazım, a Medaris nazımı, a medrese's staff) cannot be made a ders nazırı,
      because their permissions could not be told from the post's; the refusal says why in words and the dialog stays open.
    drawn: [appointing, picked, toastHoldsSeat]
    built:
      - action: medaris.api:createCourseNazir
      - route: apps/nazar/features/course-nazirs/course-nazirs.ts:240
    walked:
      - e2e: apps/nazar/e2e/course-nazirs.e2e.ts
        check: 'course-nazirs#8' # a2-a6
      - test: apps/nazar/test/course-nazir-dialog.spec.tsx # :359-372

  - id: barred-person-is-refused
    need: >-
      A person barred from the course, its köşk or its medrese cannot be made a ders nazırı (the post would undo the ban), and the refusal says
      why in words the hoca understands; the dialog stays open.
    drawn: [appointing, picked, toastBarred]
    built:
      - action: medaris.api:createCourseNazir
      - route: apps/nazar/features/course-nazirs/course-nazirs.ts:242
    walked:
      - test: apps/nazar/test/course-nazirs.spec.ts # :311, the wording only
      - test: apps/tedrisat/test/e2e/course-nazirs.e2e.spec.ts # the API's refusal

  - id: unknown-account-is-told
    need: >-
      An account that is gone between the search and the save is refused with the sentence "Bu hesap bulunamadı." and the dialog stays open;
      the API answers 404 and writes nothing.
    drawn: [appointing, picked, toastUnknown]
    built:
      - action: medaris.api:createCourseNazir
      - route: apps/nazar/features/course-nazirs/course-nazirs.ts:238
    walked:
      - e2e: apps/nazar/e2e/course-nazirs.e2e.ts
        check: 'course-nazirs#10' # a4, a5: the API answers 404 COURSE_NAZIR_UNKNOWN_ACCOUNT to a random id (the dialog never sends it)

  - id: ceiling-cuts-what-is-given
    need: >-
      The hoca gives only the permissions she holds in the course now: a box she may not give is off, one she ticked before her ceiling was cut
      is refused by the API with a sentence that says so (a passive medrese, a policy, a medrese course cut what she holds), and the dialog
      stays open.
    drawn: [appointing, picked, toastExceeds, permSession, permRecording]
    built:
      - action: medaris.api:createCourseNazir
      - route: apps/nazar/features/course-nazirs/course-nazirs.ts:166
    walked:
      - e2e: apps/nazar/e2e/course-nazirs.e2e.ts
        check: 'course-nazirs#14' # a1-a13; a14-a20 are the appointee's pages (nazar.access.dersNazirPages), and a20 is stale (F-D2c-14)
      - test: apps/nazar/test/course-nazirs.spec.ts # :207-243, the boxes

  - id: past-end-is-told
    need: >-
      An end that is not after now is told in the dialog before anything is sent, and an end left half typed is told too; the typed moment is
      read on the viewer's own clock.
    drawn: [picked, endField, endError, endHelp]
    built:
      - route: apps/nazar/features/course-nazirs/components/course-nazir-dialog.tsx:145
    walked:
      - test: apps/nazar/test/course-nazir-dialog.spec.tsx # :310-357, with the clock held

  - id: row-buttons-lead-on
    need: >-
      The row of the person just appointed offers "İzinleri düzenle" and "Görevden al" at once, so that appointing, giving and ending are one
      errand and not three searches.
    drawn: [editButton, endButton, handed_over.permissions, handed_over.dismiss]
    built:
      - route: apps/nazar/features/course-nazirs/components/course-nazirs-table.tsx:113
    walked:
      - e2e: apps/nazar/e2e/course-nazirs.e2e.ts
        check: 'course-nazirs#5' # context: the edit button on the row (nazar.courseNazirs.permissions carries it)
      - e2e: apps/nazar/e2e/course-nazirs.e2e.ts
        check: 'course-nazirs#11' # context: the end button on the row (nazar.courseNazirs.dismiss carries it)

  - id: search-only-on-purpose
    need: >-
      The e-mail address is searched only when the hoca asks (Enter or an explicit button), never when the field is left or the dialog is
      closed, because every search is written to the audit log (F-D2c-6, decision D1).
    drawn: [asking, searching]
    missing: none

  - id: a-search-says-what-it-did
    need: >-
      The search tells a reader of the screen that it ran and how it ended (found, nobody, not available, not an address), also when the field
      is left, keeps the field enabled and gives the focus back: the person found is announced and focused, and "Başka birini seç" returns to
      the field (F-D2c-4, F-D2c-5, CAPPOINT-4).
    drawn: [asking, searching, picked, emailNotEmail, emailNobody, emailDown, searchingStatus, removePerson]
    missing: none

  - id: kaydet-says-why-it-is-off
    need: >-
      "Kaydet" says what is missing while it cannot be pressed (find a person first), the e-mail field is marked required for a reader of the
      screen, and the dialog is described by its first line and not by the whole form (CAPPOINT-2, F-D2c-12, F-D2c-16, decision D2).
    drawn: [asking, save, emailField, dialog]
    missing: none

  - id: cancel-while-pending-answers
    need: >-
      While the appointment is on its way, "Vazgeç", the close icon and Esc are marked as not available, or closing is allowed and the outcome
      is told in the toast (CAPPOINT-1).
    drawn: [appointing, cancel, closeIcon]
    missing: none

  - id: selection-count-is-announced
    need: >-
      The footer's count of the permissions ticked ("2 izin seçili", "İzin seçilmedi") is announced as it changes, so a reader of the screen
      knows what "Kaydet" will give (CAPPOINT-3).
    drawn: [summaryNone, summaryCount, permSession, permRecording]
    missing: none
