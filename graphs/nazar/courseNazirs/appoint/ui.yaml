# The screens of nazar.courseNazirs.appoint: "Ders nazırları" (/ders/<id>/nazirlar) with its table, and the "Ders nazırı ata" dialog over
# it. Read from apps/nazar/features/course-nazirs/components/{course-nazirs-page,course-nazirs-table,course-nazir-dialog}.tsx,
# course-nazirs.ts, the permission section of features/nazirs and libs/ui/src/mds (dialog, field, input, checkbox, alert, table, toast) on
# 15 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nazar.json, key for key. Nothing was walked in a browser (from the
# code); the unit specs named in needs.yaml exercise the same components.
#
# The page behind the dialog is drawn only where the dialog is closed (the dialog is modal, so the page is inert while it is open). The
# table's rows are data: the nodes marked `repeat` stand for one item per post, and the replay finds them through the binding. The other
# rows and columns of the roster are other flows' (flow.yaml, outOfView).
#
# What the graph draws of a form of 21 boxes. The dialog draws the course's whole catalog (21 codes, in the API's order); the graph draws
# two of them, the ones the walk ticks: "Celse ekle, tarihini değiştir, iptal et; toplantı bağlantısını gir" and "Ders kaydı ekle,
# adlandır, gizle; görünürlüğünü değiştir" (e2e course-nazirs#3). The other nineteen are boxes like them; `world: open` leaves them out. A
# box the caller may not give is `disabled`; a graph checks a field's `checked` and not its disabled state, so that is said in the
# comments.
#
# Composed text (built in code, in no i18n file), each a value the page puts in a place that has no message of its own:
#   composed.CourseNazirs.course     the course's title above the dialog's title (course-nazir-dialog.tsx:235, `eyebrow`)
#   composed.CourseNazirs.person     a person's name: in the table's name cell (course-nazirs-table.tsx:48) and in the chosen block (:294)
#   composed.CourseNazirs.address    a person's address, a <bdi dir=ltr> (course-nazirs-table.tsx:52; course-nazir-dialog.tsx:297)
#   composed.CourseNazirs.permissionsLine   the sentences of the codes held, joined with " · " (course-nazirs.ts:127)
#   composed.CourseNazirs.endDate    the <time> of the end, a day as dayFormat(locale, zone) writes it (course-nazirs-table.tsx:81)
#   composed.CourseNazirs.giverYou   the giver's name and, when the viewer appointed, " (siz)" (course-nazirs-table.tsx:92-95)
#   composed.CourseNazirs.giverDay   the day of the appointment, a <time> (course-nazirs-table.tsx:96)
# The one message not authored here is none: `changes` is the app's own CourseNazirs.dialog.chosenNote.
#
# Samples: only where the page needs one. The replay reads the binding's samples (the made course, the spare account, the days the helper
# computed) and matches any text where it has none.
schema: delurio-graph/0
kind: ui
id: nazar.courseNazirs.appoint
flow: nazar.courseNazirs.appoint
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: CourseNazirs.dialog.chosenNote } # the app's own sentence says what "Kaydet" does: "Kaydedince bu derste ders nazırı olur ve seçtiğiniz izinleri alır."
