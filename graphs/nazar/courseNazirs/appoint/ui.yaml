  course: Deneme dersi nzappoint
  name: Dilek Başvuran
  email: e2e-basvuran-g@medaris.test
  giver: Hamdi Müderris
  date: 15 Kasım 2026
  endDate: 15 Aralık 2026
  count: "2"
  list: Celse ekle, tarihini değiştir, iptal et; toplantı bağlantısını gir · Ders kaydı ekle, adlandır, gizle; görünürlüğünü değiştir

