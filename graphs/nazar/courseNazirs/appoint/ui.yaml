rules:
  - { id: focus-not-set, rule: "No code of features/course-nazirs sets the focus when the page opens or when a toast shows; the dialog's `initialFocus={emailRef}` (course-nazir-dialog.tsx:242) and Base UI's return of the focus are the only focus moves. Not verified in a browser." }
  - { id: F-D2c-4, rule: "The search's answers ('Geçerli bir e-posta adresi yazın.', 'Bu adresle bir hesap bulunamadı.', 'Arama şu an yapılamıyor…') and the end's ('Bitiş zamanı şu andan sonra olmalı.') are a Field error with no role and no live region (libs/ui/src/mds/field.tsx:51-53; course-nazir-dialog.tsx:325-330, :389-399), so a reader of the screen is told none of them unless they go back to the field; after 'Kaydet' with a bad end the focus stays on the button. Fix: render Field errors with role=alert in the kit, or move the focus to the offending control." }
  - { id: F-D2c-5, rule: "The e-mail input is `disabled` while it searches (course-nazir-dialog.tsx:341), so the focus it had drops to the page; when a person is found it is unmounted (:281-323) and nothing moves the focus to 'Kaydet' or to the heading 'Seçilen ders nazırı'; 'Başka birini seç' removes itself and gives the focus to nothing (:302-304); the only live text is 'Aranıyor…' (:354-356), so the result is not announced. Not verified in a browser. Fix: `readOnly` plus aria-busy instead of `disabled`; focus the chosen heading (tabIndex=-1) after a pick and the e-mail field after 'Başka birini seç'; say the result in the existing <output>." }
  - { id: F-D2c-6, rule: "The help line says 'Adresi tam yazıp Enter'a basın.', but leaving the field also runs the search when the text is an address (`onBlur={() => void find(false)}`, course-nazir-dialog.tsx:350), and tedrisat audits every search. A keyboard user who tabs past the field, or presses 'Vazgeç' with an address typed in it (the blur comes before the click), writes an audit row nobody asked for. Fix: say it in the help line, or search on Enter or a button only (decision D1)." }
  - { id: F-D2c-9, rule: "Does not apply to this flow. FLOWS.md lists it here, but F-D2c-9 is the partner-code card's input that is `disabled={busy}` (partner-codes-card.tsx:197), which is nazar.courseSettings.partnerCodes'. The same pattern in this dialog is F-D2c-5." }
  - { id: F-D2c-12, rule: "The visible '*' of 'E-posta adresi' is aria-hidden and the input carries no `required` (course-nazir-dialog.tsx:325-352; libs/ui/src/mds/field.tsx draws the star and passes nothing on, though its comment says the control carries `required`), so a reader of the screen is never told the field is required. Fix: required and aria-required on the input." }
  - { id: F-D2c-15, rule: "Does not apply to the appoint mode: the dialog sets `initialFocus={row ? undefined : emailRef}` (course-nazir-dialog.tsx:242), so the e-mail field has the focus. It is the edit mode's (no initial focus, so Base UI's first tabbable, the close icon) and the course ban dialog's: nazar.courseNazirs.permissions. Not verified in a browser." }
  - { id: F-D2c-16, rule: "Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:103-112), so aria-describedby is the whole form: the field, 21 checkboxes and the end field; a reader of the screen may read all of it when the dialog opens. Not verified how NVDA and VoiceOver treat it. Fix: describe the dialog by the line above the field only." }
  - { id: F-D2c-13, rule: "Does not apply to the appoint dialog: 'Kaydet' passes `loadingLabel={t(\"CourseNazirs.dialog.saving\")}` (course-nazir-dialog.tsx:256), so its busy word is 'Kaydediliyor…' from the catalog. The kit default 'Yükleniyor' is the dismissal's (end-course-nazir.tsx:97)." }
  - { id: MDRS-233, rule: "The close button of every toast, the one of 'Ders nazırı atandı' and of the refusals, is named 'Kapat' by a literal in libs/ui/src/mds/toast.tsx:97 (`aria-label=\"Kapat\"`), outside the catalog; it is the same in every language. Register: F-L-6, DCK-23, ACC-23." }
  - { id: CAPPOINT-1, rule: "New. While the save is on its way 'Vazgeç', the close icon and Esc do nothing (`onOpenChange` ignores a close while `pending`, course-nazir-dialog.tsx:229-231) and are neither disabled nor marked, so a control that looks live does not answer; the end field is the only control disabled. The same as the medrese roster's APPOINT-1. Fix: disable them with aria-disabled while it is pending, or let the person close the dialog and tell them the outcome in the toast." }
  - { id: CAPPOINT-2, rule: "New. 'Kaydet' is natively disabled (`disabled={!ready}`, course-nazir-dialog.tsx:257) until a person is found, and nothing says why when no one is chosen: no line names the step ('Önce bir kişi bulun'), a keyboard user's Tab skips it, and the form cannot be sent by Enter. For the viewer and a holder the warning beside the person says why, but it is not tied to the button. The same family as nizam's F-X-3. Fix: keep it enabled and say what is missing, or tie the reason to it with aria-describedby (decision D2)." }
  - { id: CAPPOINT-3, rule: "New. The footer's 'İzin seçilmedi' / '{n} izin seçili' is a plain <p class=mds-dialog__meta> (libs/ui/src/mds/dialog.tsx:115), not a live region: ticking a box changes it and a reader of the screen is told nothing. The same as the medrese editor's PERM-2. Fix: role=status on it." }
  - { id: CAPPOINT-4, rule: "New. Text that cannot be an address is told only on Enter ('Geçerli bir e-posta adresi yazın.', `find(true)`, course-nazir-dialog.tsx:110); left with Tab (`find(false)`) it is neither searched nor told, and Enter on an empty field says nothing; 'Kaydet' stays off and the person is left with no word why. Fix: say it on blur too." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'İzinleri düzenle' in 'İzinleri düzenle: {name}' and 'Görevden al' in 'Görevden al: {name}' (WCAG 2.5.3). The close icon, named 'Kapat', has no visible text. Holds." }
  - { id: no-default-accept, rule: "The dialog's initial focus is the e-mail field, not 'Kaydet': a keyboard user cannot appoint by pressing Enter on arrival, and Enter in the field searches and does not send the form (course-nazir-dialog.tsx:132-137). Holds." }
