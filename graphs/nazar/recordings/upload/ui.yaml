edges:
  - { labelledBy: [weekRegion, weekTitle] }
  - { labelledBy: [dialog, dialogTitle] }
  - { triggers: [rowAdd, choosing] }
  - { triggers: [rowEdit, linkForm] }
  - { triggers: [rowResume, choosing] }
  - { triggers: [tabLink, linkForm] }
  - { triggers: [tabUpload, choosing] }
  - { triggers: [cancelUpload, stopped] }
  - { returnsFocus: [dialog, rowAdd] } # Vazgeç, Esc or the close icon: the row's own button is where the focus was before the dialog opened; Base UI's fallback, since the dialog has no trigger (F-C-course-a-25); not verified in a browser
  - { returnsFocus: [dialog, rowEdit] }

rules:
  - { id: focus-not-set, rule: "No code of features/recordings moves the focus when the page opens, when the dialog opens (no `initialFocus`: the first tabbable element, the close icon) or after a write. The graph draws no focus for the page and gives the dialog the close icon, from Base UI's default (not verified in a browser)." }
  - { id: F-C-course-a-01, rule: "recording-dialog.tsx:426-435: a Field error (the file's 'Bir video dosyası seçin.', 'Bu bir video dosyası değil.', the size) has no role and no live region, so a screen-reader user who presses Yükle hears nothing. Fix: role=alert on the error, or move the focus to the field." }
  - { id: F-C-course-a-07, rule: "recording-dialog.tsx:426-443: `Field required` draws only an aria-hidden '*'; the file input carries no `required`/`aria-required` (the form is noValidate), so 'required' is never announced." }
  - { id: F-C-course-a-21, rule: "recordings-table.tsx:138, use-refresh-while.ts:6-29: while a Bunny upload is PROCESSING the page reads itself again every 10 seconds; 'Hazırlanıyor' becoming 'Hazır', or the row going, is not announced (no live region, no toast). Fix: a status around the badge, or a toast when it flips." }
  - { id: F-C-course-a-22, rule: "recordings-table.tsx:242-252: the recording's 'Aç' link opens a new tab and its name 'Kaydı aç: {title}' says nothing of it. Belongs to nazar.recordings.add; named here because `encoded` draws the link." }
  - { id: F-C-course-a-25, rule: "recording-dialog.tsx:553-570: the dialog is controlled with no trigger, so where the focus goes when it closes is Base UI's fallback to the element that had it (not verified); after a successful upload the row's button is gone or changed and the focus is lost (see F-C-course-a-15). Fix: pass the opener as finalFocus, and focus the row's new state." }
  - { id: F-C-course-a-26, rule: "recording-dialog.tsx:555-557: while the release time is written or the upload is busy, Esc and the close icon do nothing and say nothing, and 'Vazgeç' is not drawn; only 'İptal' works, and it does nothing while only tedrisat is asked (before an upload object exists). Fix: say why, or ask whether to stop the upload." }
  - { id: F-C-course-a-29, rule: "recordings-table.tsx:139, 280-301, 388: the Durum, Görünürlük and İşlemler cells of a celse with no recording hold an aria-hidden dash, so they are empty to a screen reader. Not drawn here: the graph draws only what the upload needs of a row." }
  - { id: MDRS-259, rule: "A failed or stalled upload vanishes. The encoding poll sets a Bunny recording FAILED when Bunny reports an error or the upload's 24 hours pass with no file (recording-encoding.poller.ts:131-153, bunny-signature.ts:136-160), and `visibleRecordings` lists a FAILED recording to no one, the course team included (domain/recording.ts:185). The row reads 'Kayıt yok' with 'Kayıt ekle' again, so staff never learn that an upload failed or why; the page's own sentence for an expired upload says it ('Kayıt kısa süre içinde düşer'). Retrying works only because a FAILED row is replaced by the next upload (domain/recording.ts:61-65). Fix: list a FAILED recording to the course team with its reason and a retry. Decision D2." }
  - { id: upload-on-cancelled-session, rule: "A cancelled celse takes an upload. POST /lessons/:id/recordings/uploads never looks at cancelled_at (recording-upload.service.ts:73-107, recording.repository.ts:445-545), where a pasted link is refused with 409 LESSON_CANCELLED (recording.repository.ts:894-896). Through this page it is reachable on a cancelled celse that already holds a recording: recordingWeeks lists a cancelled celse only then (recordings.ts:99), and its 'Düzenle' offers the upload. uploadErrorKey has no sentence for LESSON_CANCELLED (recordings.ts:688-722). Not a flow state; the domain carries it as the invariant recording-upload-refuses-cancelled-session. Decision D1." }
  - { id: UPLOAD-1, rule: "An orphan Bunny video: `start` creates the video in Bunny before it writes the row (recording-upload.service.ts:91-93), and the transaction can still refuse after that (the celse archived or a recording that appeared in between: recording.repository.ts:456, 473). The empty video stays in the library and nothing queues its deletion; a video whose upload never began, or FAILED, is deleted only when a later upload replaces it. From reading; not run (the domain notes it on startRecordingUpload). Fix: queue the video for deletion when the write refuses, and clear videos no recording holds (MDRS-260)." }
  - { id: UPLOAD-2, rule: "'Devam et' is offered on every Bunny recording that is PROCESSING (recordings.ts:238), which is true while Bunny only encodes a finished upload too. The dialog opens with 'Yükleme bittiyse ... bir şey yapmanız gerekmez', but pressing 'Devam et' finds nothing in this browser's tus storage (tus clears it on success) and answers 'Bu dosyanın yarım kalan yüklemesi bu tarayıcıda bulunamadı. ... aynı dosyayı seçin', which sends a person whose upload finished to look for it in another browser (bunny-upload.ts:343, recordings.ts:711). Fix: offer it only while the upload is unfinished, or say 'işleniyor' in that case." }
  - { id: UPLOAD-3, rule: "The release time is written before the upload starts and nothing says so: a changed 'Talebe kaydı ne zaman izlesin' choice goes out as PUT /lessons/:id/recording-availability first (recording-dialog.tsx:259-275), and when the upload is then refused (the library not configured, Bunny not answering) the alert says only 'Video yüklenemedi' while the celse's release time has already changed, and closing the dialog reads the page again with the new time. No toast says the time was saved. Fix: say it in the alert, or write it after the upload starts." }
  - { id: UPLOAD-4, rule: "recording-dialog.tsx:596-598: while a video is being made or exists, a press on the other tab is ignored in code, but the tabs are not disabled and carry no aria-disabled, so a keyboard or screen-reader user presses a tab that does nothing and is told nothing. Not verified in a browser." }
  - { id: label-in-name, rule: "A button's visible text is in its accessible name: 'Kayıt ekle' in 'Kayıt ekle: {celse}', 'Düzenle' in 'Kaydı düzenle: {celse}' (the order differs but the words are all there), 'Devam et' in 'Yüklemeye devam et: {celse}' (WCAG 2.5.3 holds, case ignored; the visible words are not at the start of the name for 'Düzenle' and 'Devam et', which it recommends and does not require)." }
  - { id: upload-is-said-at-each-step, rule: "The steps are said by the dialog itself: an <output> 'Yükleme hazırlanıyor…', a progressbar with its percent as aria-valuetext, an info Alert (status) for a stop and an error Alert (role=alert) for a failure. The success is a toast of a few seconds and the dialog closes; the row then says 'Hazırlanıyor' with no live region (F-C-course-a-21). Holds, except for the flip." }
