# The screens of nazar.recordings.upload: Ders kayıtları (/ders/<id>/kayitlar) as a holder of recording.upload reads it, and the one
# dialog that "Kayıt ekle", "Düzenle" and "Devam et" open, in the steps of a video's upload to Bunny Stream. Read from
# apps/nazar/features/recordings (recordings-page.tsx, recordings-table.tsx, recording-dialog.tsx, bunny-upload.ts); the words are copied
# from libs/i18n/src/locales/tr/nazar.json, except `Changes.note`, the one authored message of this catalog (no app message says what an
# upload changes: the toast says only "Bunny’de işleniyor").
# Where a node says "repeat", the page draws it once per row; the stack's walk makes a course of one celse, so each appears once.
# The sample `name` is the course's title in the subtitle ("Deneme dersi recup", the title of the walk's own course); it is also the file's
# name in "{name} · {size}", which no walk reaches.
schema: delurio-graph/0
kind: ui
id: nazar.recordings.upload
flow: nazar.recordings.upload
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  name: Deneme dersi recup
  session: Celse 1
  title: Hafta 1
  week: "1"
  recorded: "0"
  missing: "1"
  max: 10 GB
  size: 1,2 GB
  sent: 600 MB
  total: 1,2 GB

# Nothing in features/recordings moves the focus when the page opens (no autoFocus), so the page has no `initialFocus`. The dialog is Base UI's
# and takes no `initialFocus` either, so the focus lands on the first tabbable element of the popup, which is the close icon in its header
# (the header comes first in the DOM): from the code and Base UI's default, not seen in a browser.
nodes:
  # --- the page (Ders kayıtları) ----------------------------------------------------------------------------------------------
  recordingsPage: { type: page, component: Page, role: main, in: [listed, processing, encoded, vanished, forbidden], source: libs/ui/src/mds/app-shell.tsx:41 } # the shell's one <main id="main">; it has no name
  pageTitle: { type: text, component: Heading, role: heading, text: { key: Recordings.title }, in: [listed, processing, encoded, vanished, forbidden], source: apps/nazar/features/recordings/components/recordings-page.tsx:82 } # level 1
  pageSubtitle: { type: text, component: Text, text: { key: Recordings.subtitle, params: { name: course.title } }, in: [listed, processing, encoded, vanished, forbidden], source: apps/nazar/features/recordings/components/recordings-page.tsx:85 }
  uploadNote: { type: text, component: Text, text: { key: Recordings.upload.note }, in: [listed, processing, encoded, vanished], when: "can in ['both', 'uploadOnly']", source: apps/nazar/features/recordings/components/recordings-page.tsx:90 } # e2e course-scope#5 a3 reads "dosya tarayıcınızdan doğrudan Bunny"
  manageNote: { type: text, component: Text, text: { key: Recordings.note }, in: [listed, processing, encoded, vanished], when: "can == 'manageOnly'", source: apps/nazar/features/recordings/components/recordings-page.tsx:90 } # "Burada yükleme yoktur": a holder of recording.manage and not of recording.upload
  forbiddenAlert: { type: alert, component: Alert, role: status, name: { key: Problems.forbiddenTitle }, text: { key: Problems.forbidden }, in: [forbidden], source: apps/nazar/features/shell/components/page-problem.tsx:23 } # a neutral Alert is a status, not an alert
  summary: { type: text, component: Text, text: { key: Recordings.summary, params: { recorded: counts.recorded, missing: counts.missing } }, in: [listed, processing, encoded, vanished], source: apps/nazar/features/recordings/components/recordings-table.tsx:401 } # data-testid recording-counts

  # --- the week and its row ---------------------------------------------------------------------------------------------------
  weekRegion: { type: page, component: Page, role: region, name: { labelledBy: weekTitle }, in: [listed, processing, encoded, vanished], repeat: course.weeks, source: apps/nazar/features/recordings/components/recordings-table.tsx:405 }
  weekTitle: { type: text, component: Heading, role: heading, text: { key: Recordings.weekHeadingTitled, params: { week: week.number, title: week.title } }, in: [listed, processing, encoded, vanished], repeat: course.weeks, source: apps/nazar/features/recordings/components/recordings-table.tsx:410 } # level 2; "Hafta {week}" alone for a week with no title
  weekTable: { type: list, component: List, role: table, name: { key: Recordings.weekCaption, params: { week: week.number } }, in: [listed, processing, encoded, vanished], repeat: course.weeks, source: apps/nazar/features/recordings/components/recordings-table.tsx:418 } # the caption is visually hidden
