  processingEdit: { type: action, component: Button, role: button, intent: secondary, name: { key: Recordings.editLabel, params: { session: session.title } }, text: { key: Recordings.edit }, in: [processing, encoded], source: apps/nazar/features/recordings/components/recordings-table.tsx:337 } # opens the same dialog again (not drawn further)
  processingResume: { type: action, component: Button, role: button, intent: secondary, name: { key: Recordings.upload.resumeLabel, params: { session: session.title } }, text: { key: Recordings.upload.resume }, in: [processing], source: apps/nazar/features/recordings/components/recordings-table.tsx:323 } # still offered while Bunny only encodes (UPLOAD-2)
