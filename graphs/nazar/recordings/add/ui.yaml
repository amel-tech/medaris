# The screens of nazar.recordings.add: Ders kayıtları of a course (/ders/<id>/kayitlar), the "Kayıt ekle" and "Kaydı düzenle" dialogs
# (link form), the "Kayıt erişimi" dialog and the toasts of their writes. Read from apps/nazar/features/recordings (PR #394's code);
# the words are copied from libs/i18n/src/locales/tr/nazar.json. Nothing here was seen in a browser.
#
# Where a node says "repeat", the page draws it once per row (one row per celse, in a table per week); the replay finds the rows through the
# binding. Three kinds of text are built in code and so are not in nazar.json; each has its own key `composed.<Namespace>.<name>`:
#   composed.Recordings.session         "{session}": the celse's title as the API gives it, printed bare (recordings-table.tsx:189, recording-dialog.tsx:560)
#   composed.Recordings.recordingTitle  "{title}": the recording's title, printed bare (recordings-table.tsx:231)
#   composed.Recordings.startsAt        "{startsAt}": the celse's time, `whenLabel(..., "short")` (recordings-table.tsx:194)
#   composed.Recordings.newTitle        "{session} kaydı": `${sessionTitle} ${suffix}` with Recordings.titleSuffix (recordings.ts:496-503)
#   composed.Recordings.releaseTimeName "Açılış tarihi ve saati Saat": the time box is named by the date box's label and "Saat" (date-time-field.tsx:198-204)
#   composed.PlatformChip.youtube / .drive  "YouTube" / "Google Drive": the chip's labels are hard-coded in the kit (libs/ui/src/mds/platform-chip.tsx:5-11)
#   composed.Recordings.host            "{host}": a link's host when the provider has no chip (recordings-table.tsx:237)
# `Changes.note` is the one message authored here: no message of the app tells a hoca what adding a recording changes.
schema: delurio-graph/0
kind: ui
id: nazar.recordings.add
flow: nazar.recordings.add
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  name: Deneme dersi
  session: Celse 1
  title: Celse 1 kaydı
  startsAt: Sal, 10 Kas 21:00
  host: example.test
  week: "1"
  recorded: "1"
  missing: "2"
  when: 24 Kasım 12:00’de
  zone: İstanbul

