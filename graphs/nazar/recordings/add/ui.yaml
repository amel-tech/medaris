rules:
  - { id: F-C-course-a-21, rule: "Not drawn here (nazar.recordings.upload). While a Bunny upload is PROCESSING the page reads itself again every 10 seconds and the change from 'Hazırlanıyor' to 'Hazır' is not announced (recordings-table.tsx:138, use-refresh-while.ts); the pasted links of this flow are READY at once, so nothing here refreshes by itself." }
  - { id: F-C-course-a-27, rule: "Not drawn here (nazar.sessions.manage). Opened from Celseler the 'Kayıt erişimi' dialog has the long date as its eyebrow and its toast names the date, not the celse; opened from this page both name the celse's title (recordings-table.tsx:448), as the graph draws them." }
  - { id: F-C-course-a-22, rule: "The recording's 'Aç' link opens a new tab (target=_blank) and its aria-label 'Kaydı aç: {title}' says nothing of it, unlike the overview's links (recordings-table.tsx:241-252). Fix: add a visually hidden '(yeni sekmede açılır)'." }
  - { id: F-C-course-a-25, rule: "The three dialogs are controlled (`open`) with no trigger element, so where the focus returns when one closes is Base UI's fallback to the element that had it, not the code's; after a write the pressed row's button is gone (a recorded row has no 'Kayıt ekle'; a refreshed row may be a new element), so the focus is probably lost. The graph draws `returnsFocus` and the walk will say. Fix: pass the opener as finalFocus, or render the dialogs with a DialogTrigger." }
  - { id: F-C-course-a-26, rule: "While a write runs (pending), Esc, the close icon and 'Vazgeç' are ignored (recording-dialog.tsx:555-557, release-dialog.tsx:111-113) and nothing says why: only the submit button shows it is busy. Fix: disable the close controls with aria-disabled and say so." }
  - { id: F-C-course-a-28, rule: "Hard-coded outside the catalog: the busy text 'Yükleniyor' of every `loading` button that passes no loadingLabel (the stream button, 'Kaydı ekle', 'Kaydet' of both dialogs), and the link field's placeholder 'https://…' (recording-dialog.tsx:542). The chip labels 'YouTube' and 'Google Drive' are in the kit too. Fix: pass loadingLabel={t(...)} and a catalogued placeholder." }
  - { id: F-C-course-a-29, rule: "A row with no recording draws an aria-hidden '—' in Durum, Görünürlük and (for a person who may not act) İşlemler (recordings-table.tsx:139,280-301,388), so those cells are empty to a screen reader, where Celseler says a hidden sentence. Fix: a visually hidden 'Yok'." }
  - { id: RECADD-1, rule: "New. The medrese's policy 'Ders kayıtları herkese açılamaz' (Settings: 'Açıkken hiçbir kayıt herkese açık yapılamaz ve YouTube’a yüklenemez') is stored and shown but nothing reads it here: the 'Herkese açık' switch is locked only by the course being closed (switchLocked, recordings.ts:487-493), and neither createLessonRecording nor updateRecording refuses PUBLIC while setting.recordings_public is closed, so a hoca of a medrese that forbids it can still publish a recording, and tedrisat shows it to visitors (domain findings policy-no-public-recordings-inert and medrese-recordings-policy-unread; tedris.course.recordings RECS-1). Read from the code, not run. Fix: pass the policy to this page, lock the switch with a reason, and refuse PUBLIC in the write." }
  - { id: RECADD-2, rule: "New. 'Yayını kayıt olarak ekle' stores the stream's YouTube link as a READY recording at once, and the table then says 'Hazır' and 'Açık' like any other, although the link plays only when YouTube has archived the stream. The one warning is the row's caption 'YouTube yayını arşivleyince kayıt olarak oynar.', which is drawn only on a row with no recording, so it goes with the press; the other is a toast of six seconds. By the domain's rule the enrolled talebe are told 'Kayıt eklendi' at that moment as well (RECORDING_ADDED is sent once the recording is READY, released and the celse has begun). Read from the code, not run. Fix: keep the caption on the row until the stream is known to be archived, or hold the recording back." }
  - { id: RECADD-3, rule: "New. The add dialog of a hoca who holds recording.upload and recording.manage opens on the 'Bunny’ye yükle' tab every time (recording-dialog.tsx:173-175); where the video library is not set up the only way on is to switch to 'Bağlantı yapıştır', and the upload fails only after a file is chosen (BUNNY_STREAM_NOT_CONFIGURED, 'Şimdilik kaydın bağlantısını yapıştırın.'). Not an accessibility defect. Fix: open on the link tab when the library is not configured, or remember the last tab." }
  - { id: focus-not-set, rule: "Nothing in features/recordings sets the focus when the page opens, after a toast, after a write or after a refused submit (no autoFocus, no .focus(); the Base UI Form of the dialogs may move it to an invalid field on a second press: not verified). The graph draws only the dialogs' own initial focus (the close icon, Base UI's first stop) and `returnsFocus`, none of it seen in a browser." }
  - { id: field-errors-not-announced, rule: "The messages under the title, link and time fields are Field errors, not live regions: they are shown once 'Kaydı ekle' or 'Kaydet' is pressed with a problem, and Base UI's Field marks the control invalid, which a screen reader reads when the control takes focus; the focus stays on the button (not moved to the field). Read from the code; not verified with a screen reader." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Kayıt ekle' in 'Kayıt ekle: {celse}', 'Düzenle' in 'Kaydı düzenle: {celse}', 'Değiştir' in 'Kayıt erişimini değiştir: {celse}', 'Yayını kayıt olarak ekle' in 'Yayını kayıt olarak ekle: {celse}', 'Aç' in 'Kaydı aç: {başlık}' (WCAG 2.5.3). Holds." }
  - { id: toast-is-the-only-word, rule: "What a write did is said by a toast (a dialog in the 'Bildirimler' live region) that closes after 6 seconds for a success, and stays for an error; the row's new state (title, chip, 'Hazır', the badge, the access cell) is the lasting word." }
