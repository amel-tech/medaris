# The events no node of the screen sends. Pressing a button, a tab or the switch is the walk's own.
events:
  # the title and the link of a new recording
  FILL_IN:
    - fill: { role: textbox, name: Başlık, value: '{title}' }
    - fill: { role: textbox, name: Bağlantı, value: '{link}' }
  # the same on the edit form: a new title, and the link it already holds (or one the page refuses)
  FILL_IN_EDIT:
    - fill: { role: textbox, name: Başlık, value: '{newTitle}' }
    - fill: { role: textbox, name: Bağlantı, value: '{editLink}' }
  # "Şu tarih ve saatte", then the date and the time (the boxes read what is typed when they are left)
  SET_RELEASE:
    - click: { role: radio, name: Şu tarih ve saatte }
    - fill: { role: textbox, name: '/^Açılış tarihi ve saati\s*$/', value: '{releaseDate}' }
    - key: Tab
    - fill: { role: textbox, name: '/^Açılış tarihi ve saati Saat$/', value: '{releaseTime}' }
    - key: Tab
  # Vazgeç, the close icon and Esc all send CANCEL; the buttons are the walk's own
  NAVIGATE:
    - goto: '{nazar}/'

states:
  listed: { url: '{nazar}/ders/*/kayitlar' }
  empty: { url: '{nazar}/ders/*/kayitlar' }
  forbidden: { url: '{nazar}/ders/*/kayitlar' }
  # the writes are Next server actions: a POST to the page's own address, held while the busy state is checked
  adding: { call: '{nazar}/ders/*/kayitlar' }
  saving: { call: '{nazar}/ders/*/kayitlar' }
  addingStream: { call: '{nazar}/ders/*/kayitlar' }
  releasing: { call: '{nazar}/ders/*/kayitlar' }
  # NAVIGATE goes to the portal's root, which sends the person on to the first scope they hold
  left: { url: '{nazar}/**' }

# Where role and name cannot find a node. The page is the course's whole list, so the rows are found by what they say; a toast has a
# "Kapat" and is a dialog too, so a dialog is found by its exact name and the close icon by the dialog's own class.
nodes:
  recordingsPage: { role: main, hasText: Ders kayıtları }
  pageTitle: { role: heading, name: '/^Ders kayıtları$/' }
  # the sidebar's entry, found by the attribute the e2e checks (course-scope#5 a4): it is the current page
  menuRecordings: { css: 'aside a[aria-current="page"]', hasText: '/^Ders kayıtları/' }
  # "{n} celsenin kaydı var, {m} celsenin yok."
  counts: { testId: recording-counts, hasText: '/^\d+ celsenin kaydı var, \d+ celsenin yok\.$/' }
  weekSection: { css: 'section[aria-labelledby^="week-"]' }
  # "Hafta 1 · Hafta 1": the week's number and its title (the walk's weeks are titled "Hafta n")
  weekHeading: { css: 'h2[id^="week-"]', hasText: '/^Hafta \d+/' }
  weekTable: { role: table, name: '/^Hafta \d+: celseler ve kayıtları$/' }
  slotTitle: { role: rowheader, name: '/^Celse \d/' }
  slotStart: { css: 'th[scope=row] time' }
  noRecording: { text: '/^Kayıt yok$/' }
  notYet: { text: '/^Celse henüz yapılmadı$/' }
  recordingTitle: { css: 'td span.font-semibold bdi' }
  providerChip: { css: 'td .mds-platform-chip' }
  openLink: { role: link, name: '/^Kaydı aç: /' }
  stateBadge: { css: 'td .mds-badge', hasText: '/^Hazır$/' }
  visibilityBadge: { css: 'td .mds-badge', hasText: '/^(Herkese açık|Kayıtlı talebe)$/' }
  # the cell "Erişim": "Açık", "24 Kasım 12:00’de açılır" or "Hazır olunca açılır", and the "Değiştir" button inside it
  access: { css: 'td[data-label="Erişim"]', hasText: '/Açık|açılır/' }
  # one "Değiştir" a row, Celse 3's first (the weeks are newest first)
  changeAccess: { role: button, name: '/^Kayıt erişimini değiştir: /' }
  # the first one is the walk's: a celse that is over (Celse 1, or Celse 2 where Celse 1 holds a recording)
  add: { role: button, name: '/^Kayıt ekle: Celse [12]$/' }
  # just before the press, what another person does meanwhile (nothing, except in `streamMoved`): Celse 2 is recorded
  addStream: { role: button, name: '/^Yayını kayıt olarak ekle: Celse 2$/', before: [{ run: [node, ../nazar/recordings/add/data.mjs, meanwhile, '{meanwhile}', '{made.course}', '{made.lessons.1}'], expect: 'recordings-add meanwhile' }] }
  rowStream: { role: button, name: '/^Yayını kayıt olarak ekle: Celse 2$/' }
  # the first one is Celse 1's, the recording the müderris added
  edit: { role: button, name: '/^Kaydı düzenle: /' }

  # the dialogs: the toasts are dialogs too, and "Kayıt ekle" is the start of "Kayıt eklendi", so each name is anchored
  addDialog: { role: dialog, name: '/^Kayıt ekle$/' }
  editDialog: { role: dialog, name: '/^Kaydı düzenle$/' }
  releaseDialog: { role: dialog, name: '/^Kayıt erişimi$/' }
  addTitle: { role: heading, name: '/^Kayıt ekle$/' }
  editTitle: { role: heading, name: '/^Kaydı düzenle$/' }
  releaseTitle: { role: heading, name: '/^Kayıt erişimi$/' }
  dialogEyebrow: { css: 'p.mds-eyebrow', hasText: '/^Celse \d/' }
  dialogClose: { role: button, name: Kapat, within: { css: '.mds-dialog' } }
  uploadSubmit: { role: button, name: '/^Yükle$/' }
  # the three submits, each with the hook of its write: another person records Celse 1 (`exists`), or the grant is taken off (`refused*`)
  submitAdd: { role: button, name: Kaydı ekle, before: [{ run: [node, ../nazar/recordings/add/data.mjs, meanwhile, '{meanwhile}', '{made.course}', '{made.lessons.0}'], expect: 'recordings-add meanwhile' }] }
  submitEdit: { role: button, name: Kaydet, before: [{ run: [node, ../nazar/recordings/add/data.mjs, meanwhile, '{meanwhileEdit}', '{made.course}', '{made.lessons.0}'], expect: 'recordings-add meanwhile' }] }
  submitRelease: { role: button, name: Kaydet, before: [{ run: [node, ../nazar/recordings/add/data.mjs, meanwhile, '{meanwhileRelease}', '{made.course}', '{made.lessons.2}'], expect: 'recordings-add meanwhile' }] }
  detectedChip: { css: '.mds-platform-chip', hasText: YouTube, within: { css: '.mds-dialog' } }
  # the time box is named by the date's label and "Saat": the date's name must not match it
  whenDate: { role: textbox, name: '/^Açılış tarihi ve saati\s*$/' }
  whenTime: { role: textbox, name: '/^Açılış tarihi ve saati Saat$/' }

  # the toasts: a dialog (an error one an alertdialog) named by its title, its words by the walk's own celse
  toastAdded: { role: dialog, name: '/^Kayıt eklendi$/', hasText: '/celsesinin kaydı eklendi\.$/' }
  toastSaved: { role: dialog, name: '/^Kayıt kaydedildi$/', hasText: '/güncellendi\.$/' }
  toastFromStream: { role: dialog, name: '/^Yayın kayıt olarak eklendi$/', hasText: '/Celse 2 celsesinin kaydı, YouTube yayını arşivleyince oynar\.$/' }
  toastReleasedAt: { role: dialog, name: '/^Kayıt erişimi kaydedildi$/', hasText: '/celsesinin kaydı talebeye .+ açılır\.$/' }
  toastMoved: { role: alertdialog, name: '/^Kayıt kaydedilemedi$/', hasText: '/zaten bir kaydı var|İptal edilmiş|artık yok/' }
  toastLinkInvalid: { role: alertdialog, name: '/^Kayıt kaydedilemedi$/', hasText: '/YouTube bağlantısı bir videoyu göstermiyor/' }
  toastRefused: { role: alertdialog, name: '/^Kayıt kaydedilemedi$/', hasText: 'Bunu yapma izniniz yok.' }
  toastReleaseRefused: { role: alertdialog, name: '/^Kayıt erişimi kaydedilemedi$/', hasText: 'Bunu yapma izniniz yok.' }

# What a write leaves outside the screen, read through the API as the müderris.
effects:
  createLessonRecording:
    - run: [node, helpers/api.mjs, muderris, GET, '/courses/{made.course}/recordings']
      expect: '"provider":"YOUTUBE"'
  updateRecording:
    - run: [node, helpers/api.mjs, muderris, GET, '/courses/{made.course}/recordings']
      expect: '"title":"{newTitle}"'
  # the first "Değiştir" is Celse 3's, the third celse of the programme
  setLessonRecordingAvailability:
    - run: [node, helpers/sql.mjs, "select recording_available_at is not null as held from lessons where id = '{made.lessons.2}'"]
      expect: '"held":true'
