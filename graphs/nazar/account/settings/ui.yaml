rules:
  - { id: F-E-3, rule: "The Dil field was removed (commit 1c9cbdc7) and the page has no language control, but its two messages are still in the catalog: Account.language and Account.languageHelp (libs/i18n/src/locales/tr/nazar.json:198-199), used nowhere, and not copied here. e2e account#3 a3 to a5 ('Dil' reads 'Türkçe', is read-only, 'Medaris şimdilik yalnız Türkçe görünür.') are STALE and are not carried; test/account-page.spec.tsx:258-262 asserts the opposite. Fix: delete a3 to a5 and the two dead keys." }
  - { id: F-E-4, rule: "For the başnazım with no seat the person card's role line falls back to 'Talebe' (account-page.tsx:109) while the layout's own frame says 'Medaris başnazımı' (portal-layout.tsx:73-74) and the table is empty: two answers for one person. Seen as the data: GET /me/assignments is [] and /me says systemAdmin true for the seeded başnazım. Fix: use the layout's SYSTEM_ADMIN fallback here." }
  - { id: F-E-11, rule: "The skeleton under 'Etkin izinleriniz' is an <output aria-busy> with only aria-hidden bars (account-page.tsx:81-89): silent while the card streams, unlike the root skeleton, which has a hidden 'Yükleniyor'. Not drawn in this graph. Fix: add the hidden Shell.loadingLabel." }
  - { id: F-E-12, rule: "The time-zone lists have no pending state: useTransition's `pending` is discarded (time-zone-form.tsx:44), so both stay enabled while PATCH /me runs and a second choice races the first and its rollback; and choosing 'Diğer…' draws the second list with no announcement and no move of focus. Fix: mark the card busy during the save and focus (or announce) the second list when it appears." }
  - { id: F-E-13, rule: "A person with no row (the başnazım with no seat) reads 'Bu listede henüz bir şey yok.', the kit Table's hard-coded default (libs/ui/src/mds/table.tsx:54), not a message of this app. Fix: pass `empty` from nazar.Account (assignments-table.tsx:107-113)." }
  - { id: F-E-14, rule: "The toast's close button is named by the literal aria-label 'Kapat' and the region by the literal 'Bildirimler' (libs/ui/src/mds/toast.tsx:97,127), not by the catalog; the region has the same name as this app's notification page and bell, which a screen-reader user hears as two things called 'Bildirimler'. Cross-cutting (the lead's). Fix: pass catalog labels and a distinct region name." }
  - { id: F-E-16, rule: "When only the permissions read fails the alert is titled 'Görevleriniz yüklenemedi' (account-page.tsx:62-65) although the roles table above loaded: the wording says more failed than did. Fix: title it for the permissions ('İzinleriniz yüklenemedi'). Not seen on the stack: no way to make the read fail." }
  - { id: F-E-18, rule: "'Çıkış yap' posts to /api/auth/signout at once (sign-out-button.tsx:26-29); the confirmation page /auth/signout exists and nothing links to it, and e2e account#7 still names the confirmation window in its title though it asserts none. Fix: link the button to /auth/signout (decision D2 of the flow and of realm.auth.signOut)." }
  - { id: F-E-19, rule: "Every permission group is a <section aria-labelledby> (permissions-list.tsx:47-51), that is a region landmark; with several roles and courses the page gets many landmarks next to the four cards' regions. Fix: a div with the h3, and keep landmarks for the cards." }
  - { id: NAZSET-1, rule: "A failed save of a choice made in the second list, where the zone before was one of the eight, takes the second list out of the page (time-zone-form.tsx:72 setOpenOther(!isCommonZone(previous))) while its button holds the focus, so the focus falls to the document; the toast is all that says anything, and the person has lost the list they had opened (tedris's Hesap puts it back). From the code; not seen in a browser (no way to make the save fail on the stack). Fix: keep the second list open after a refusal, or move the focus to the first list. New finding, proposed id." }
  - { id: NAZSET-2, rule: "A medrese nazırı who has been given no permission reads 'Görevlerinizden gelen ya da size verilmiş bir izin henüz yok.' under 'Etkin izinleriniz' and nothing says who gives one, although the Pano's refusal names the başmüderris ('İzne ihtiyacınız varsa medresenin başmüderrisine başvurun'). Seen on the stack: GET /me/effective-permissions answers no group for the seeded nazır. Fix: end the sentence with whom to ask. New finding, proposed id; product wording." }
  - { id: focus-not-set, rule: "Hesap sets no initial focus (no autoFocus and no focus() in features/account), so the page node has no `initialFocus` and the graph says nothing of the focus when the page opens; after a pick, after the toast and after the star's bubble closes the focus is Base UI's (the list's button, the star) and was not seen. Recorded so the silence is not read as an omission." }
  - { id: saves-at-once, rule: "There is no Kaydet on this page: a zone chosen from either list is saved at that moment (e2e account#4 a2 asserts no button matching /Kaydet/). The toast and the help line 'Seçtiğiniz an kaydedilir.' are the only words about it; the graph carries the rule by sending every pick straight to savingZone." }
  - { id: label-in-name, rule: "Where a control's visible text is part of its name, the name contains it (WCAG 2.5.3): 'Çıkış yap', 'Kapat' and the star's 'Dersin imamı'. Holds." }
