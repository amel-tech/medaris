# The screens of nazar.account.settings: nazar-web's Hesap ve ayarlar (/hesap, app/(global)/hesap/page.tsx) with its four cards,
# the two time-zone lists, the toasts of a save, and the imam star's bubble. Read from apps/nazar/features/account and the kit's
# Select, Table, Toast and ImamStar (libs/ui/src/mds); the words are copied from libs/i18n/src/locales/tr/nazar.json and common.json.
# The frame around the page (sidebar, picker, menu, the person row that links here) is nazar.shell.scopeAndMenu's and is not drawn.
#
# Words that are in no i18n file are `composed.*`, with the line of the code that makes each:
#   composed.Account.scope, grantor, grantedAt, expiresAt   a value the API gives, shown as it is (assignments-table.tsx:54, 86, 88, 99)
#   composed.Account.scopeMeta / scopeMetaKosk              the köşk and the medrese joined by " · " (assignments-table.tsx:60;
#                                                           assignments-view.ts:35-40)
#   composed.Account.groupTitle                             "<scope> · <role in lower case>" (permissions.ts:47)
#   composed.Account.personName / roleLine / email          the session's name, the roles held joined by " · ", the session's e-mail
#                                                           (account-page.tsx:173, 175, 180)
#   composed.Account.tableEmpty                             the kit Table's own default text (libs/ui/src/mds/table.tsx:54; F-E-13)
#   composed.Account.zones.*                                the eight cities' names, from the kit (libs/ui/src/mds/locale.tsx:94-103)
#   composed.Account.listedZone                             a zone of the second list, "Asia / Tokyo" (time-zone.ts:otherZoneLabel)
#   composed.Toast.close                                    the toast's close button, a literal of the kit (libs/ui/src/mds/toast.tsx:97; F-E-14)
# `changes` is the app's own help line under the first list: what the choice sets, and that it is saved at that moment. No message
# was authored for this catalog.
# Samples are invented and neutral; the binding gives each scenario the real person's name, roles and e-mail.
schema: delurio-graph/0
kind: ui
id: nazar.account.settings
flow: nazar.account.settings
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Account.timeZoneHelp }
samples:
  scope: Örnek ders
  kosk: Örnek köşk
  madrasah: Örnek medrese
  grantor: Örnek kişi
  granted: 3 Kasım 2026
  expires: 3 Aralık 2026
  date: 3 Aralık 2026
  role: hoca
  names: Örnek ders ve Başka ders
  name: Örnek Kişi
  roles: Hoca
  email: kisi@ornek.test
  zone: Asia / Tokyo

