# What must exist for the hoca of a course to hide a week or a celse and bring it back from the course's Arşiv: the flow's product list
# (LAYOUT.md section 7). Each need is what the product must do, from the flow's story, the domain's invariants and the planned work in the
# inventory (planned.md), not from what the page does today; the known gaps go to graphs/needs.gaps.yaml, which the orchestrator merges. Read by
# people for now: no checker runs on this file yet.
#
# Missing (no code, or the code does not do it):
#   gate-the-hide-page, hoca-who-may-hide-reads-the-archive, archive-is-one-click-from-the-hide-page, focus-follows-hide-and-restore,
#   restore-says-what-came-back, a-course-gone-is-worded, a-failed-call-is-told, delete-a-hidden-week-with-a-recording
# Unwalked (code exists; no e2e covers it and no replay has run: the walks of binding.yaml and refusals.binding.yaml are written and not run,
# so no scenario is named under `walked`):
#   hide-a-week-or-a-celse, a-week-hides-with-its-celses, see-what-is-hidden, restore-by-kademe, restore-a-week-brings-its-celses,
#   an-answer-that-came-late-is-told
kind: needs
flow: nazar.curriculum.hideRestore
status: proposed

needs:
  - id: hide-a-week-or-a-celse
    need: >-
      The hoca of a course takes a week, or one celse of it, out of the course in one confirmed step: the talebe stop seeing it, the celse
      leaves their calendars, nothing is deleted, and she is told what happened and where it went. A person who may hide a celse and not a week
      (session.manage) is refused the week and not the celse.
    drawn: [listed, confirmWeek, confirmSession, hidingWeek, hidingSession, weekSettled, toastWeekHidden, toastSessionHidden, toastWeekRefused, a-week-is-hidden-only-by-week-hide, a-celse-is-hidden-only-by-its-codes]
    built:
      - action: medaris.api:hideCourseWeek
      - action: medaris.api:archiveLesson
      - route: apps/nazar/features/curriculum-hide/components/curriculum-list.tsx:43
    walked:
      - test: apps/nazar/test/curriculum-hide.spec.tsx

  - id: a-week-hides-with-its-celses
    need: >-
      A week hides together with the celses it holds at one stroke, so no celse is left live under a hidden week, and none of them is deleted
      (their recordings, resources and homework are kept).
    drawn: [hidingWeek, weekSettled]
    built:
      - action: medaris.api:hideCourseWeek
      - route: apps/tedrisat/src/course/course.repository.ts:1687
    walked:
      - test: apps/nazar/test/curriculum-hide.spec.tsx

  - id: see-what-is-hidden
    need: >-
      The course's Arşiv lists what the course's team hid, in three tabs with their counts, newest first, each row with its kind, who hid it and
      when; a celse hidden under a hidden week is not listed until the week is brought back.
    drawn: [archive, archiveEmpty, tabAll, tabWeeks, tabSessions, archiveTable, a-covered-celse-needs-a-hidden-week]
    built:
      - action: medaris.api:listCourseArchive
      - route: apps/nazar/features/course-archive/components/course-archive-page.tsx:71
    walked:
      - test: apps/nazar/test/course-archive.spec.tsx

  - id: restore-by-kademe
    need: >-
      "Geri al" is offered where the person's kademe reaches the one that hid the row, and where it does not the page says which kademe hid it, so
      no button leads to a refusal; a restore asks nothing first and says that it was done.
    drawn: [restoreWeek, restoreSession, lockedKosk, lockedAdmin, restoringWeek, restoringSession, toastRestored]
    built:
      - action: medaris.api:restoreArchiveItem
      - route: apps/nazar/features/archive/components/archive-list.tsx:152
    walked:
      - test: apps/nazar/test/course-archive.spec.tsx

  - id: restore-a-week-brings-its-celses
    need: >-
      Bringing a week back brings back the celses that were hidden with it, and only those: a celse hidden on its own earlier stays hidden and
      has its own row in the Arşiv.
    drawn: [restoringWeek, restoreWeek, restoreSession, a-covered-celse-needs-a-hidden-week]
    built:
      - action: medaris.api:restoreArchiveItem
      - route: apps/tedrisat/src/archive/archive.repository.ts:514

  - id: an-answer-that-came-late-is-told
    need: >-
      When what the person asked to hide is already hidden, or what she asked to bring back is already back (someone did it in another tab),
      she is told so in plain words and the page is read again; it is not an error.
    drawn: [toastWeekGone, toastSessionGone, toastRestoreGone]
    built:
      - route: apps/nazar/features/curriculum-hide/curriculum.ts:51
      - route: apps/nazar/features/archive/archive.ts:277
    walked:
      - test: apps/nazar/test/curriculum-hide.spec.tsx

  - id: gate-the-hide-page
    need: >-
      The hide page offers each person only what she may do: the buttons are drawn for week.hide (a week and a celse) and session.manage (a
      celse), and a ders nazırı with neither is told so before the question, not after it (F-C-course-a-17, decision D1). It has a title of its
      own ("Müfredat: gizle") and a way back to the editor.
    drawn: [listed, toastWeekRefused, toastSessionRefused]
    missing: none # no issue: the page asks nothing, the API's 403 arrives as a toast (curriculum-page.tsx:19-58)

  - id: hoca-who-may-hide-reads-the-archive
    need: >-
      A person who may hide a celse can see what she hid and bring it back: the Arşiv reads for session.manage as well, listing the celses she
      may restore, or the hide of a celse is left to week.hide (HIDEREST-3, decision D2).
    drawn: [archiveRefused, archiveRefusal, the-archive-is-read-only-with-week-hide]
    missing: none # no issue: GET /courses/:id/archive asks week.hide only (archive.controller.ts:132)

  - id: archive-is-one-click-from-the-hide-page
    need: >-
      The hide page and its toasts lead to the Arşiv: a link in the sentence that names it and an action on the toast, as the design's toasts
      allow (HIDEREST-2, decision D3).
    drawn: [hideIntro, archiveLink, toastWeekHidden, toastSessionHidden]
    missing: none # no issue: the intro and the toasts say "Arşiv" and link nowhere; only the sidebar's entry leads there

  - id: focus-follows-hide-and-restore
    need: >-
      After a hide or a restore the focus lands on a place a keyboard or screen-reader user can use (the next week's heading, the table's
      caption or the next row's button), and a line on the page, not only a toast of six seconds, says what was done (F-C-course-a-15 and -23).
    drawn: [listed, archive, toastWeekHidden, toastRestored]
    missing: none

  - id: restore-says-what-came-back
    need: >-
      The toast that brings a week back says which celses came with it and that one hidden on its own earlier is still hidden (HIDEREST-4), or the
      week is brought back whole.
    drawn: [toastRestored, restoringWeek]
    missing: none

  - id: a-course-gone-is-worded
    need: >-
      A hide that meets a course that was deleted or hidden meanwhile says so, and does not tell the person to try again before the page turns
      into a 404 (HIDEREST-1).
    drawn: [hidingWeek, hidingSession]
    missing: none

  - id: a-failed-call-is-told
    need: >-
      When a hide or a restore cannot reach the server at all, the button stops being busy and the person is told to try again
      (F-C-course-a-19).
    drawn: [hidingWeek, hidingSession, restoringWeek, restoringSession, toastWeekFailed, toastSessionFailed, toastRestoreFailed]
    missing: none

  - id: delete-a-hidden-week-with-a-recording
    need: >-
      The başnazım can delete for real a hidden week or celse that has a recording attached; today the delete fails (MDRS-244). It is the
      end of the road of what this flow hides, drawn in nizam.moderation.deleteArchived.
    drawn: [archive]
    missing: MDRS-244
