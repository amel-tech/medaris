# The screens of nazar.curriculum.sessionHomework: Müfredat of a course (/ders/<id>/mufredat) as far as the block "Ödev" of one celse
# needs it, with the block, its upload panel, its two confirmations and the toasts of its writes. Read from
# apps/nazar/features/curriculum/components/{curriculum-page,curriculum-editor,lesson-assignment-editor}.tsx, features/files/components/
# {file-upload,file-link}.tsx and libs/ui/src/mds/{switch,choice-chips,alert-dialog,button,field,toast}.tsx on 15 Nov 2026; everything here
# is from the code, nothing was seen in a browser. The words are copied from libs/i18n/src/locales/tr/nazar.json.
#
# Two kinds of message are not copied from an i18n file:
#   - `Changes.note`, the one authored message of this catalog: no message of the app says what the homework's writes change, who sees
#     the homework, and what taking it off takes with it (the dialog's own sentence leaves out the recital's marks, HWSET-1).
#   - `composed.*`: text the app builds in code from parts, which is in no i18n file. composed.Files.fileName is a file's name written
#     between <bdi> tags (file-link.tsx:36 for the list's link, lesson-assignment-editor.tsx:427 for the dialog's body);
#     composed.Curriculum.kindLineFile and composed.Curriculum.kindLineMemorize are "{Teslim şekli}: {Dosya|Ezber}" joined by the
#     read-only block (lesson-assignment-editor.tsx:255-258) from Curriculum.assignmentKindLabel and assignmentKindFile or assignmentKindMemorize.
#
# The page behind a dialog is drawn only where the dialog is closed: the dialog is modal and the page is inert while it is open. The
# toast nodes are Base UI toasts, a dialog in the region "Bildirimler" (an error toast is an alertdialog and stays until closed).
# The description's own text (what the hoca wrote) is data, not a message, and is not drawn as a node; the textarea's `value` is not
# claimed either, since it holds the stored description or the draft.
schema: delurio-graph/0
kind: ui
id: nazar.curriculum.sessionHomework
flow: nazar.curriculum.sessionHomework
status: captured
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  name: ders-notu.pdf
  size: 47 KB

# The page sets no focus of its own on load (nothing in features/curriculum does), and none after a write: a turned switch, a chosen
# chip, a saved description, an upload and a removal leave it where it was or on a button that is gone (HWSET-5, F-C-course-a-14,
# F-C-course-a-15). So there is no `initialFocus` on the page and no `focus`; only the two dialogs say where their focus starts and
# where it is meant to return.
nodes:
  # --- the page ---------------------------------------------------------------------------------------------------------
  page: { type: page, component: Page, role: main, in: [folded, off, turningOn, on, drafting, savingDescription, choosingFile, choosingRecital, takingOff, picking, picked, uploading, viewing], source: libs/ui/src/mds/app-shell.tsx:41 } # the shell's one <main id="main">; it has no name
  pageTitle: { type: text, component: Heading, role: heading, text: { key: Curriculum.title }, in: [folded, off, turningOn, on, drafting, savingDescription, choosingFile, choosingRecital, takingOff, picking, picked, uploading, viewing], source: apps/nazar/features/curriculum/components/curriculum-editor.tsx:327 } # <h1>
  readOnlyNote: { type: alert, component: Alert, role: status, text: { key: Curriculum.readOnly }, in: [folded, off, turningOn, on, drafting, savingDescription, choosingFile, choosingRecital, takingOff, picking, picked, uploading], when: "holds == 'sessionOnly'", source: apps/nazar/features/curriculum/components/curriculum-editor.tsx:336 } # an info Alert (role status): it says the page is read-only to a person who holds session.manage and may change this very block (HWSET-2)
  sessionsNote: { type: alert, component: Alert, role: status, text: { key: Curriculum.sessionsNote }, in: [folded, viewing], when: "holds == 'editOnly'", source: apps/nazar/features/curriculum/components/curriculum-editor.tsx:340 }
  detailsShow: { type: action, component: Button, role: button, intent: secondary, text: { key: Curriculum.detailsShow }, in: [folded], emits: SHOW_DETAILS, source: apps/nazar/features/curriculum/components/curriculum-editor.tsx:744 } # one per celse (the walk's course has one); aria-expanded=false, and the block below is in a `hidden` div
  detailsHide: { type: action, component: Button, role: button, intent: secondary, text: { key: Curriculum.detailsHide }, in: [off, turningOn, on, drafting, savingDescription, choosingFile, choosingRecital, takingOff, picking, picked, uploading, viewing], source: apps/nazar/features/curriculum/components/curriculum-editor.tsx:765 } # the same button, now aria-expanded=true; folding again only hides the block, which keeps its state (not drawn as a step)

  # --- the block "Ödev": a fieldset of its own under "Celsenin kaynakları" ------------------------------------------------------
  blockGroup: { type: text, component: Text, role: group, name: { labelledBy: blockLegend }, in: [off, turningOn, on, drafting, savingDescription, choosingFile, choosingRecital, takingOff, picking, picked, uploading, viewing], source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:201 } # <fieldset> in <div data-testid="assignment-lesson-<w>-<l>">; the celse is not named in it (F-C-course-a-04)
  blockLegend: { type: text, component: Text, text: { key: Curriculum.assignmentTitle }, in: [off, turningOn, on, drafting, savingDescription, choosingFile, choosingRecital, takingOff, picking, picked, uploading, viewing], source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:202 } # the <legend>, with an icon; not a heading
  caption: { type: text, component: Text, text: { key: Curriculum.assignmentIntro }, in: [off, turningOn, on, drafting, savingDescription, choosingFile, choosingRecital, takingOff, picking, picked, uploading], source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:206 }
  captionView: { type: text, component: Text, text: { key: Curriculum.assignmentSessions }, in: [viewing], source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:194 }
  homeworkSwitch: { type: field, component: TextField, role: switch, text: { key: Curriculum.assignmentToggle }, checked: homeworkOn, in: [off, turningOn, on, drafting, savingDescription, choosingFile, choosingRecital, takingOff, picking, picked, uploading, viewing], disabledIn: [turningOn, savingDescription, choosingFile, choosingRecital, takingOff, viewing], emits: TURN_ON, source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:209 } # a <span role=switch> with a hidden input; it presses TURN_ON where it is off, and TURN_OFF (the binding's event) where it is on; disabled for the length of any write of the block (HWSET-5), and for a reader who may not change it
  switchHelp: { type: text, component: Text, text: { key: Curriculum.assignmentToggleHelp }, in: [off, turningOn, on, drafting, savingDescription, choosingFile, choosingRecital, takingOff, picking, picked, uploading, viewing], source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:211 } # the switch's description; "hemen kaydedilir" holds for the switch, the chips and the files, not for the description (HWSET-8)

  # --- "Teslim şekli" -----------------------------------------------------------------------------------------------------------
  kindGroup: { type: text, component: Text, role: group, name: { labelledBy: kindLegend }, in: [on, drafting, savingDescription, choosingFile, choosingRecital, takingOff, picking, picked, uploading], source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:229 } # Base UI ToggleGroup: a group named by the legend div
  kindLegend: { type: text, component: Text, text: { key: Curriculum.assignmentKindLabel }, in: [on, drafting, savingDescription, choosingFile, choosingRecital, takingOff, picking, picked, uploading], source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:230 }
  kindFile: { type: action, component: Button, role: button, intent: secondary, text: { key: Curriculum.assignmentKindFile }, in: [on, drafting, savingDescription, choosingFile, choosingRecital, takingOff, picking, picked, uploading], disabledIn: [savingDescription, choosingFile, choosingRecital, takingOff], emits: KIND_FILE, source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:234 } # a toggle button (aria-pressed), not a radio (HWSET-7); pressed while the kind is "Dosya", which the graph does not say
  kindRecital: { type: action, component: Button, role: button, intent: secondary, text: { key: Curriculum.assignmentKindMemorize }, in: [on, drafting, savingDescription, choosingFile, choosingRecital, takingOff, picking, picked, uploading], disabledIn: [savingDescription, choosingFile, choosingRecital, takingOff], emits: KIND_RECITAL, source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:240 }
