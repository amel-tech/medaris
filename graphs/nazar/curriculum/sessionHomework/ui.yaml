rules:
  - { id: F-C-course-a-03, rule: "The block's controls carry the same accessible names in every celse of the page ('Bu celsenin ödevi var', 'Açıklamayı kaydet', 'Dosya yükle', 'Dosya', 'Ezber'), and a file's own controls carry its name only. A screen-reader user in a list of buttons or switches cannot tell which celse a control acts on. Fix: name the control by the celse ('Bu celsenin ödevi var: {title}'), as the hide page names its rows." }
  - { id: F-C-course-a-04, rule: "The block 'Ödev' is a <fieldset> whose legend is only 'Ödev', inside an <li> that is not a group and whose <h3> has no id, so the fieldset, its switch, its field and its buttons repeat in every celse with nothing that names the celse. Fix: give the <li> role=group with aria-labelledby the heading's id, or put the celse's title in the legend." }
  - { id: F-C-course-a-05, rule: "'Ödevin dosyaları' is an <h4> directly under the celse's <h3>, which is itself at the week's own <h3> level; the levels do not nest (lesson-assignment-editor.tsx:325). Fix: pass headingLevel so that weeks are h3, celses h4 and the files' heading h5." }
  - { id: F-C-course-a-07, rule: "The upload panel's file field is marked required by an aria-hidden asterisk only; the input has no `required` or aria-required, so 'required' is never announced (file-upload.tsx:189-202)." }
  - { id: F-C-course-a-01, rule: "'Bir dosya seçin.' appears under the panel's field after Yükle with no file, as a Field error that has no role or aria-live and takes no focus; a screen-reader user hears nothing and does not know that nothing was sent (file-upload.tsx:102-105, 193)." }
  - { id: F-C-course-a-30, rule: "The page's Kaydet is disabled while a file goes up (`uploads > 0`, curriculum-editor.tsx:1021) and nothing says why; the block's own controls stay live meanwhile. Not a finding of the block, but the panel causes it." }
  - { id: F-C-course-a-14, rule: "'Dosya yükle' unmounts itself when it opens the panel and sets no focus: the focus falls to <body>; closing the panel (Vazgeç, or a success) remounts the opener with no focus either (file-upload.tsx:147-168). Fix: focus the file field on open and the opener on close." }
  - { id: F-C-course-a-15, rule: "A removed file's trash button leaves with its row and no code moves the focus (lesson-assignment-editor.tsx:176-186, 350-366), and the removal says nothing: no toast and no status, only the row going. Fix: move the focus to the heading 'Ödevin dosyaları' or the next row and say 'Dosya silindi'." }
  - { id: F-C-course-a-25, rule: "Both dialogs are controlled (`open`) with no trigger element, so where the focus returns on close is Base UI's fallback to what had it before; for the switch (disabled while the call ran) and for the trash button (gone after Sil) that is not verified (lesson-assignment-editor.tsx:397-433). Fix: pass the opener as finalFocus." }
  - { id: F-C-course-a-28, rule: "The confirm button of each dialog is busy with the Button's default hidden label 'Yükleniyor', which is outside the catalog (alert-dialog.tsx:104-110 passes no loadingLabel; lesson-assignment-editor.tsx:415). Fix: pass loadingLabel from the catalog." }
  - { id: MDRS-233, rule: "A toast's close button is named 'Kapat' in every language (toast.tsx:97); the toasts of this block show it. Not an accessibility defect in Turkish." }
  - { id: HWSET-1, rule: "Turning the switch off asks only when a description or a file exists (lesson-assignment-editor.tsx:216-223), and the dialog's words name those two ('açıklaması ve dosyalarıyla birlikte kalıcı olarak silinir'). The API also deletes the course team's marks of a recital homework (assignment_evaluations, lesson-assignment.repository.ts:190-193; the audit row says how many). A recital homework ('Ezber') takes no hand-in file and often has no description (the walk's own has none), so it is then taken off with no question at all and its Tam, Eksik and Vermedi marks go with it, said nowhere; one that has a description gets a question that does not name the marks either. Fix: ask whenever a mark exists and name it in the sentence; the course read carries no mark count today, so the page needs one (decision D1). New finding; the domain's invariant taking-homework-off-keeps-hand-ins states what goes." }
  - { id: HWSET-2, rule: "A person who holds session.manage and not course.edit (the stack's seeded ders nazırı) is told by an info alert that 'bu sayfa yalnız okunur' (curriculum-editor.tsx:334-337), while the block 'Ödev' is editable for exactly that person (`editable={can.sessions}`, :917) and stores each change at once. The note is true of the form and false of the homework. Fix: word the note by what each part allows (decision D2). New finding." }
  - { id: HWSET-3, rule: "The description's length error 'Açıklama en çok 4000 karakter olabilir.' (and the toast that VALIDATION_ERROR would draw with it) can never be seen: the textarea's maxLength equals the limit (lesson-assignment-editor.tsx:98, 271-283), and the API's check is on the trimmed text, which is never longer. The branch is dead code, and the field would not announce its error anyway (F-C-course-a-01). New finding, from the code; not drawn." }
  - { id: HWSET-4, rule: "A write carries no version and the page holds what it read when it opened. Turning the switch on sends { description: null }, which clears a description that someone else stored since (lesson-assignment-editor.tsx:143, tedrisat lesson-assignment.repository.ts:154-167: the description is replaced whenever it differs); a kind chip sends the description the page read, which puts back what someone else changed. The last writer wins, silently. The page is also not told that the homework appeared or went elsewhere: a stale switch says off over a homework that exists. New finding; not verified in a browser." }
  - { id: HWSET-5, rule: "Every write disables the control that was pressed and the whole block with it (`off` includes `busy`, lesson-assignment-editor.tsx:97, 213, 238-244, 285, 297, 357), although the Button's own `loading` was made to keep the focus alive (button.tsx:34-37, 'never disabled, so focus survives'); a disabled switch (a span), chip or button may drop the focus, which is not verified. Turning the homework on, choosing a kind and a file's removal then say nothing: no toast and no status, only the block changing. New finding." }
  - { id: HWSET-6, rule: "'Açıklamayı kaydet' is busy when `busy && dirty` (lesson-assignment-editor.tsx:298), whichever write is running: a kind chip, the switch or a removal pressed while the description has unsaved edits makes the description's button announce 'Kaydediliyor…' for a write that does not store it; and the chips send the description as stored while the draft stays in the field, which nothing says. New finding; the graph draws the kind chip only from a clean description." }
  - { id: HWSET-7, rule: "'Teslim şekli' is two toggle buttons (aria-pressed) in a group, not a radiogroup (choice-chips.tsx:75-92): one choice is expressed as two independent-looking buttons, and pressing the chosen one does nothing and says nothing (the page ignores it, lesson-assignment-editor.tsx:164-167, 247-251). The same pattern is F-C-course-a-12 on the planner. Fix: radios in a RadioGroup. New finding." }
  - { id: HWSET-8, rule: "The description is stored by its own button and by nothing else, yet the page's strip 'Kaydedilmemiş değişiklikler var' and its Kaydet do not count it (curriculumDirty reads the course form only, curriculum.ts:331-334), and the editor is keyed by the course version (curriculum-page.tsx:64): when Kaydet saves some other edit the page is read again, the editor starts anew and the typed description is lost, with no warning (the same happens after 'Güncel dersi yükle'). The switch's help 'Açınca ve kapatınca hemen kaydedilir; müfredatı ayrıca kaydetmeniz gerekmez.' does not say that the text is the exception. New finding; not verified in a browser." }
  - { id: HWSET-9, rule: "`run` has a `finally` that clears `busy` but no `catch`, and the callers are `void`ed (lesson-assignment-editor.tsx:108-136, 215, 300): a call that throws (a dropped network) gives back the controls and says nothing, no toast, while the rejection goes unhandled. Unlike Kaydet's F-C-course-a-19 the block does not stay locked. New finding; not verified at runtime." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name (WCAG 2.5.3): 'Dosya yükle' and 'Yükle', 'Vazgeç', 'Açıklamayı kaydet', and the file link ('ders-notu.pdf' in '… dosyasını indir'). The trash button has no visible text. Holds." }
  - { id: confirm-before-losing, rule: "Taking a file off and taking the homework off (with a description or a file) ask first, in an alertdialog whose focus starts on 'Vazgeç'; turning the homework on, choosing a kind and storing a description do not, because none of them loses anything the person cannot type again. Taking off with nothing in sight asks nothing (HWSET-1)." }
  - { id: stored-at-once, rule: "Four of the block's writes store at once and one does not: the switch, a kind chip, a file's upload and its removal write when pressed; the description needs 'Açıklamayı kaydet'. Only the first four are said to (the switch's help and the upload note); the strip and Kaydet of the page know nothing of the block (HWSET-8)." }
