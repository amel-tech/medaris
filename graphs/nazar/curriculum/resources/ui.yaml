rules:
  - { id: F-C-course-a-03, rule: "Every row has the same names: 'Kaynağı çıkar' on the course's rows and the celse's, 'Yukarı taşı' and 'Aşağı taşı', and 'Celse ekle' in each week; a screen-reader user in a list of buttons cannot tell which row one acts on. The catalog has `Curriculum.hideSessionLabel`-style messages with the row's title for the hide page only. Fix: name each button with its row (aria-label with the resource's name or its number)." }
  - { id: F-C-course-a-01, rule: "A refused 'Kaydet' and a refused file ('Bir dosya seçin.', 'Bu dosya boş…', 'Bu dosya 25 MB’tan büyük…') only reveal Field errors, linked by aria-describedby and aria-invalid but with no role and no live region, and the focus does not move: a screen-reader user hears nothing and does not know the save did not happen (resources-editor.tsx:162-168, file-upload.tsx:189-194). Fix: on a refused submit move the focus to the first field with an error, or announce the errors." }
  - { id: F-C-course-a-07, rule: "'Kaynak adı', 'Bağlantı' and the panel's 'Dosya' are marked with an asterisk that is aria-hidden; no control is `required` or `aria-required` (the form is noValidate), so a reader of the screen is never told they are required." }
  - { id: F-C-course-a-14, rule: "Opening 'Dosya yükle' unmounts its own button and moves no focus into the panel; closing the panel or finishing an upload mounts the button again and does not give it the focus back: the focus falls to the page both ways (file-upload.tsx:147-168, 170-274). Fix: focus the file field on open and the opener on close. Not walked: the replay's focus check is of the graph, which says nothing here." }
  - { id: F-C-course-a-15, rule: "'Kaynağı çıkar' removes its own row (and, on a file, the dialog's 'Çıkar' does), so the focus goes with it to the page; no code moves it to the list or the next row (resources-editor.tsx:153-155, lesson-resources-editor.tsx:165-167). Fix: focus the list's heading or the next row's button." }
  - { id: F-C-course-a-25, rule: "The removal dialog is controlled and has no trigger element, so where the focus goes after 'Vazgeç' depends on Base UI's fallback to the previously focused element; the edge returnsFocus above says so and was not verified." }
  - { id: F-C-course-a-28, rule: "The address field's placeholder 'https://…' and a busy button's hidden 'Yükleniyor' are not in the catalog (resources-editor.tsx:222, lesson-resources-editor.tsx:235, libs/ui/src/mds/button.tsx:62); the Turkish and the other locales read the same." }
  - { id: F-C-course-a-30, rule: "'Kaydet' is off while a file uploads, while the page is read again and while a conflict is pending, with no stated reason; only 'nothing changed' explains itself (curriculum-editor.tsx:1021). The other list's 'Dosya yükle' is off for as long, also with no reason (file-upload.tsx:154)." }
  - { id: F-C-course-a-19, rule: "No try/catch around `await saveCurriculum`: when the call itself fails (the network) the save bar stays locked and nothing is said. A failed upload is caught (`NETWORK`, 'Bağlantı koptu…'). Not verified at runtime." }
  - { id: F-C-course-a-13, rule: "The page's links ('Haftalık celse üret', 'Hafta ve celse gizle') and the menu leave the page with an unsaved change and no question; the graph's NAVIGATE says so. They are nazar.curriculum.edit's." }
  - { id: RESOURCES-1, rule: "The course's list has no move buttons; only a celse's rows can be reordered ('Yukarı taşı', 'Aşağı taşı', lesson-resources-editor.tsx:145-158, nothing in resources-editor.tsx). tedrisat stores the order as the editor sends it, and the talebe sees it, so the only way to change the course's order is to take rows out and add them again, which deletes a file for good. New finding (not in the inventory)." }
  - { id: RESOURCES-2, rule: "After a successful 'Kaydet' the page is read again and the editor is keyed by the course version (curriculum-page.tsx:64), so a new editor starts: every celse the person had opened folds shut, the week accordion starts over and the focus, which was on the save button that is gone, falls to the page; the toast is the only word. A person who saves a celse's link has to open the celse again to see it. From the code; not verified in a browser. New finding (not in the inventory)." }
  - { id: upload-says-why-it-is-off, rule: "A celse added on this page has 'Dosya yükle' off and says why in a sentence linked by aria-describedby ('Yeni celseye dosya yüklemek için önce müfredatı kaydedin.'). Holds." }
  - { id: file-removal-asks, rule: "Taking a file row off asks first, in an alertdialog whose focus starts on 'Vazgeç' and which the scrim does not close, because the save that follows deletes the file for good; a link goes at once and 'Vazgeç' puts it back. Holds. The question names the file but not the list it leaves." }
  - { id: upload-failure-is-announced, rule: "A file the server refuses ends in an alert 'Dosya yüklenemedi' (role alert) with a sentence worded from the server's code; the server's own message never reaches the page. Holds. On this stack the answer is 503 STORAGE_NOT_CONFIGURED, which reads 'Dosya deposu henüz kurulmadı. Yöneticiye haber verin.'; not verified (no upload can be made here)." }
