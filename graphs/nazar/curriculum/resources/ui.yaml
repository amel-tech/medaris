# The screens of nazar.curriculum.resources: the two resource lists of Müfredat (/ders/<id>/mufredat), their save bar and toasts,
# the inline upload panel, the question before a file row leaves, and the celse that has no id yet. Read from
# apps/nazar/features/curriculum and features/files; the words are copied from libs/i18n/src/locales/tr/nazar.json by script.
# `Changes.note` is the one message of this catalog that is not the app's: no app message says what Kaydet, a removed resource and an
# upload change, so it is written here in the words of the app's own `Curriculum.resourcesIntro` and `Files.removeNote`.
# Where a node says "repeat", the page draws it once per row; the replay finds the rows through the binding. The two lists are told
# apart by their test ids (`resources` is the course's, `resources-lesson-<week>-<celse>` a celse's).
schema: delurio-graph/0
kind: ui
id: nazar.curriculum.resources
flow: nazar.curriculum.resources
status: captured
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  name: Deneme dersi resources
  n: "1"
  size: 12 KB

