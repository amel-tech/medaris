# (F-C-course-a-14), and a removed row takes its focus with it (F-C-course-a-15), so there is no `initialFocus` on the page and no
# `focus` here; the graph says nothing of what the code does not say. The one dialog gives the focus to "Vazgeç" (Base UI's
