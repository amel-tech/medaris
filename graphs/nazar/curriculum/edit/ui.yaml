# The screens of nazar.curriculum.edit: Müfredat of a course (/ders/<id>/mufredat) in nazar-web, its notes for a caller who may not edit,
# the field errors of a blank title, the conflict warning and the toasts of a save. Read from apps/nazar/features/curriculum (the page,
# the editor and its rules) on 15 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nazar.json (namespaces Curriculum, Nav,
# Problems) by script, letter for letter. The one message that is not the app's is `Changes.note`: no app message says what Kaydet
# changes (what it hides, what it deletes, what a conflict leaves), so one short, factual Turkish note is authored for it.
# Where a node says "repeat", the page draws it once per week or per celse; the replay finds them through the binding. Not drawn, and
# said in the flow's `scope.outOfView`: Bağlı kaynaklar, Celsenin kaynakları and Ödev (their own flows) and the buttons that take a
# week or celse out of the draft.
schema: delurio-graph/0
kind: ui
id: nazar.curriculum.edit
flow: nazar.curriculum.edit
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  name: Akaid Okuması
  weeks: "1"
  sessions: "2"
  zone: İstanbul

# Nothing in features/curriculum sets the focus on load or moves it after a step (`focus-not-set`), so the page node has no
