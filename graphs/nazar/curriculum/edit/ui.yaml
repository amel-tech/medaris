rules:
  - { id: focus-not-set, rule: "Nothing in features/curriculum sets the focus on load or moves it after a step (no autoFocus, no .focus(); the page node has no initialFocus), so after navigation, a refused Kaydet, a save, a reload and an added week or celse the focus is wherever the browser leaves it, not verified in a browser." }
  - { id: F-C-course-a-01, rule: "A refused Kaydet only reveals Field errors (`sent`) and opens the celses with a problem (curriculum-editor.tsx:278-311, errors :195-222); it moves no focus, and `Field.Error` has no role or aria-live, so a screen-reader user hears nothing and does not know the save did not happen. Fix: focus the first invalid control and/or show an Alert tone error (role=alert) that lists the errors (decision D1)." }
  - { id: F-C-course-a-02, rule: "The 'Kapak rengi' RadioGroup has no `disabled` (curriculum-editor.tsx:387-402), so a caller without course.edit, who has no Kaydet, and everyone while the form is sent, can still change it: a control that does nothing. Fix: pass disabled={locked}." }
  - { id: F-C-course-a-03, rule: "Identical names on every row: 'Celse ekle' and 'Haftayı kopyala' and 'Haftayı gizle' on every week, 'Gizle' on every celse, 'Kaynağı çıkar' and 'Yukarı taşı' on every resource (curriculum-editor.tsx:624-639, 954-987; resources-editor.tsx:147-158; lesson-resources-editor.tsx:145-170). A screen-reader user in a list of buttons cannot tell which row one acts on. The catalog has Curriculum.hideWeekLabel and hideSessionLabel, used only by the hide page. Fix: an aria-label with the week's or celse's title." }
  - { id: F-C-course-a-04, rule: "The fields of one celse (Tarih, Saat, Süre, Celse başlığı, Kaynak, Toplantı bağlantısı) repeat the same labels in every celse; the <li> is not a group and the heading has no id (curriculum-editor.tsx:586-592), so a field's celse is not announced. Fix: role=group with aria-labelledby the heading's id." }
  - { id: F-C-course-a-05, rule: "Heading order: the celse's heading is an <h3> inside the week panel whose own heading is also an <h3> (curriculum-editor.tsx:592; libs/ui/src/mds/week-accordion.tsx:64,111), and the homework files heading is an <h4> straight under it. Fix: weeks h3, celses h4 (homework files h5), or the celse heading a <p>." }
  - { id: F-C-course-a-06, rule: "The week body list mixes list items of different meaning in one <ol>: the first <li> holds the week's title and summary fields, the last one the buttons (curriculum-editor.tsx:532-569, 928-988); the accordion's 'no celse' line (Curriculum.weekEmpty) can never show, since the children list is never empty. Fix: the fields and the buttons outside the <ol>." }
  - { id: F-C-course-a-07, rule: "`Field required` draws only an aria-hidden star and none of these controls carries `required` or aria-required (libs/ui/src/mds/field.tsx:42-46; curriculum-editor.tsx:373-378, 534-537, 669-672, 690-693, 711-714, 781-784), so 'required' is never announced; the form is noValidate. Fix: pass required to the control." }
  - { id: F-C-course-a-13, rule: "'Haftalık celse üret', 'Hafta ve celse gizle' (links) leave the page with unsaved edits and no guard (curriculum-editor.tsx:456-472); the only warning is the caption Curriculum.generateNote, which is not a live region and is drawn only while a celse exists (:494-496). Fix: beforeunload while dirty, or make the caption role=status and disable the links." }
  - { id: F-C-course-a-15, rule: "A control that removes its own row ('Gizle' on a celse, 'Haftayı gizle', 'Kaynağı çıkar') leaves the focus on a removed element (curriculum-editor.tsx:624-639, 974-987; resources-editor.tsx:153-155). Not drawn here (the buttons are out of view); written against them. Fix: move the focus to the list's heading or the next row." }
  - { id: F-C-course-a-16, rule: "'Gizle' and 'Haftayı gizle' in the editor only take the row out of the draft; the real hide happens at Kaydet (features/curriculum/curriculum.ts:573-583), and no text on the button or in the dirty line says so, while the same word on /mufredat/gizle hides at once after a confirmation. Not drawn here. Fix: say 'kaydedince gizlenir' in the dirty line or on the button, or hide through the confirmed route." }
  - { id: F-C-course-a-19, rule: "No try/catch around `await saveCurriculum(...)` (curriculum-editor.tsx:285-290): when the call itself fails (the network is down) `saving` stays true, the form stays locked with a spinner and nothing is said. Not verified at runtime. Fix: try/catch/finally and the generic error toast." }
  - { id: F-C-course-a-30, rule: "'Kaydet' is disabled while an upload runs, a conflict is pending or the page is read again, with no reason stated (curriculum-editor.tsx:1021); only `!dirty` explains itself. Fix: aria-describedby to the reason, or `loading`." }
  - { id: EDIT-1, rule: "A successful save and 'Güncel dersi yükle' both end in router.refresh(), and the page gives the editor `key={course.data.version}` (curriculum-page.tsx:64), so the whole editor is unmounted and a new one mounted: the pressed button and its focus are gone (the focus falls to the page), the form is rebuilt from the course, and the only word of a save is a toast of 6 seconds (curriculum-editor.tsx:304-310). The form is locked while the page is read again. Not seen in a browser: from the code. New finding (not in the inventory's F-C-course-a list); decision D2. Fix: keep the editor mounted and give the new rows their ids, or move the focus to the h1 or a status line." }
  - { id: EDIT-2, rule: "The conflict warning is an Alert tone warning, a role=status that is inserted already holding its text (curriculum-editor.tsx:344-360), and no code moves the focus to it; Kaydet goes off for good with no other word. A screen reader may not announce a live region that appears with its content: not verified with one. New finding. Fix: render the warning as role=alert or focus it when it appears." }
  - { id: EDIT-3, rule: "The note 'bu sayfa yalnız okunur' (Curriculum.readOnly, curriculum-editor.tsx:334-337) is not true for a caller with session.manage and no course.edit, which is the ders nazırı the seed makes: each celse's 'Ödev' block is `editable={can.sessions}` (curriculum-editor.tsx:917), so its switch, description and file upload are live under the celse's details and each writes at once, never by Kaydet. Said nowhere on the page. New finding; decision D3. Fix: say in the note that the homework is kept apart, or draw the block read-only too." }
  - { id: EDIT-4, rule: "'Hafta ekle' and 'Celse ekle' are silent: the pressed button keeps the focus, nothing announces the new week or celse, and the new celse is appended above the button, which moves down (curriculum-editor.tsx:473-491, 932-953); the week is scrolled to the top of the viewport (libs/ui/src/mds/week-accordion.tsx:181-188) and gets no focus. New finding. Fix: focus the new row's first field, or a status line that says 'Hafta {n} eklendi'." }
