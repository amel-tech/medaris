rules:
  - { id: focus-not-decided, rule: "No code of the page moves the focus: not on load, not after publishing or taking back, when the section turns into the published exam or back (exam-workspace.tsx:34-49) and the pressed button is gone. The two alert dialogs are the kit's AlertDialog, whose focus starts on Vazgeç (alert-dialog.tsx:70). So no state names a focus. Read from the code, not seen." }
  - { id: latest-start-ten-minutes, rule: "The late window is asked in minutes, 10 by default (LATEST_START_DEFAULT_MINUTES, exam-publish.tsx:26; the owner, 22 Nov: \"defaultta 10 dakika sonra olacak\"; \"belki 10 dk değil 20 dk seçecek hoca\"), and counted from the exam's real opening: the press for Şimdi yayınla, so minutes spent before pressing do not shorten it (#431). Under the field, the time it comes to." }
  - { id: time-zones, rule: "The dates are typed and shown on the team member's clock (resolveTimeZone of the viewer's profile, exam-page.tsx:71), named under the form by its IANA name. A talebe whose zone differs is shown their own time (tedris.exams.mine, tedris.exams.take)." }
  - { id: MDRS-233, rule: "The toasts' close button is named by the literal aria-label 'Kapat' and their region by the literal 'Bildirimler' (libs/ui/src/mds/toast.tsx:97, 127), not by the catalog. Cross-cutting, the kit's." }
  - { id: EXM-PUB-1, rule: "What keeps the exam from being published is the page's own reckoning for the length and the questions, but the points total and the zeroth question are taken from the read (exam-editor.tsx:738-740). Own points changed on the page leave \"Puanların toplamı 100 değil\" standing, or offer the button while the total is off, until the page is read again; a zeroth question written meanwhile on the Sınavlar page likewise. The API's EXAM_NOT_READY then reads the page again. Fix: reckon the total on the page from the shares it already draws (sharesOf). Read from the code, not seen." }
  - { id: EXM-PUB-2, rule: "Each problem is a plain line (exam-publish.tsx:70-74), not a link to the field or the question it is about; with 50 questions the team looks for \"7. sorunun doğru şıkkı işaretli değil.\" by scrolling. Fix: link each line to its question's row, or to Ayarlar for the length. Need checked-before-it-is-published is missing for it. Read from the code, not seen." }
  - { id: EXM-PUB-3, rule: "The form speaks to the person in two ways: \"1 ile 10080 arasında bir dakika yaz.\" and \"… yayınladığın andan … şimdi yayınlarsan …\" (OnlineExams.lateMinutesInvalid, OnlineExams.lateMinutesHelpNow) say sen, where every other sentence of the section says siz (\"tamamlayın\", \"seçin\"). Fix: siz throughout. Read from the code, not seen." }
