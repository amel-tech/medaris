# The screens of nazar.exams.publish: the section "Yayınla" under a draft's questions (what keeps it from being published, or the form
# that publishes it now or at a day and time, and its question), the exam's page once it is published (scheduled with "Taslağa al" and
# its question, open, over), the toasts that answer a write, and the page's refusal and failed read. Read from the code of MDRS-299
# (#415, #431) on 24 Nov 2026: apps/nazar/features/online-exams/components/exam-page.tsx, exam-workspace.tsx, exam-publish.tsx, the
# queue and the toasts of exam-editor.tsx, and libs/ui/src/mds (alert, alert-dialog, radio-group, field, input, button, toast). The
# editor above the section is nazar.exams.edit's. Nothing was seen in a browser by its writer: every behaviour is "from the code" unless
# a rule says otherwise.
#
# Words: every key that has no `composed.` prefix is copied letter for letter from libs/i18n/src/locales/tr/nazar.json (the key is the
# path under its root), except `Changes.note`, the one authored message of this catalog (the app has no one place that says what
# publishing and taking back change). The `composed.*` keys are text the page builds in code; each has its code line here, and a
# placeholder the binding gives no sample for matches any text:
#   composed.Exams.title          "{title}"         the exam's title, the page's h1 (exam-page.tsx:57)
#   composed.Exams.text           "{text}"          a question's text, or an option's (exam-publish.tsx:418, 423)
#   composed.Exams.optionCorrect  "{text} · Doğru"  a correct option, its text and " · " and OnlineExams.correct in one <li> (exam-publish.tsx:423-424)
#   composed.Button.loading       "Yükleniyor"      the busy button's hidden status, a default of the kit (libs/ui/src/mds/button.tsx:62)
#   composed.Toast.close          "Kapat"           the toast's close button, a literal of the kit (libs/ui/src/mds/toast.tsx:97)
