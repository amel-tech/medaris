# The screens of nazar.exams.publish: the publishing page of one online exam, at /ders/<courseId>/sinav/<lessonId>/yayin (proposed).
# PLANNED, NOT BUILT (MDRS-299): the page, its form, its dialogs and its toasts do not exist, and no node carries a `source`. Its API is
# publishOnlineExam, unpublishOnlineExam, closeOnlineExamEarly and getOnlineExamDraft of domain/planned-exams.yaml.
#
# The page shows the exam as it stands. A draft that lacks something lists each problem, a link to it in the editor; a complete draft
# offers "Şimdi yayınla", with the latest start beside it, and "İleri bir tarihte yayınla", a form of two dates. A scheduled exam says
# when it opens and until when it can be started, and can be moved, changed or taken back; an open one counts who started and offers
# "Taslağa al" (refused once someone has started) and "Erken bitir". The date fields are native datetime-local inputs (`native`). The
# words are `planned.Exams.*` (Turkish only, for review), the app's own where they exist (Sessions.formCancel "Vazgeç",
# Sessions.failed, Problems.*), and `composed.Exams.*` for a value shown alone. Samples are invented and neutral.
schema: delurio-graph/0
kind: ui
id: nazar.exams.publish
flow: nazar.exams.publish
status: proposed
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  title: Ara sınav
  when: "28 Kas Cum 21:00"
  latest: "28 Kas Cum 23:00"
  n: "7"
  total: "98,00"
  course: Nahiv I
  duration: "60"
  count: "50"
  zone: İstanbul (UTC+3)
  started: "18"
  inProgress: "4"
  finished: "14"

nodes:
  # --- the page, its title and where the exam stands -----------------------------------------------------------------------------------
  publishPage: { type: page, component: Page, role: main, in: [notReady, choose, publishingNow, scheduleForm, scheduling, scheduleRefused, scheduled, open, unpublishing, unpublishRefused, closeAsk, closingEarly, closed, forbidden, loadFailed] } # the shell's one <main>; whether the page moves the focus on load is not decided (rule focus-not-decided)
  examTitle: { type: text, component: Heading, role: heading, text: { key: composed.Exams.title, params: { title: exam.title } }, in: [notReady, choose, publishingNow, scheduleForm, scheduling, scheduleRefused, scheduled, open, unpublishing, unpublishRefused, closeAsk, closingEarly, closed] } # h1
  formatBadge: { type: status, component: Status, text: { key: planned.Exams.formatMultipleChoice }, in: [notReady, choose, publishingNow, scheduleForm, scheduling, scheduleRefused, scheduled, open, unpublishing, unpublishRefused, closeAsk, closingEarly, closed] }
  closedBadge: { type: status, component: Status, text: { key: planned.Exams.statusClosed }, in: [closed] } # "Bitti": every attempt has ended
  draftBadge: { type: status, component: Status, text: { key: planned.Exams.statusDraft }, in: [notReady, choose, publishingNow, scheduleForm, scheduling, scheduleRefused], when: "status == 'draft'" }
  scheduledBadge: { type: status, component: Status, text: { key: planned.Exams.statusScheduled, params: { when: exam.startsAt } }, in: [scheduled, unpublishing, scheduleForm, scheduling, scheduleRefused], when: isScheduled }
  openBadge: { type: status, component: Status, text: { key: planned.Exams.statusOpen }, in: [open, unpublishRefused, closeAsk, closingEarly, unpublishing], when: isOpen }
  changedNotice: { type: alert, component: Alert, role: status, text: { key: planned.Exams.changedMeanwhile }, in: [notReady, choose, scheduled, open], when: "notice == 'changed'" } # the exam changed between the read and the publish: it was checked again

  # --- not ready: what keeps it from being published -----------------------------------------------------------------------------------
  notReadyAlert: { type: alert, component: Alert, role: alert, name: { key: planned.Exams.notReadyTitle }, text: { key: planned.Exams.notReadyBody }, in: [notReady] }
  problemsList: { type: list, component: List, role: list, name: { key: planned.Exams.notReadyTitle }, in: [notReady] }
  problemLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { oneOf: [planned.Exams.problemNoQuestion, planned.Exams.problemNoCorrect, planned.Exams.problemNoTopic, planned.Exams.problemFewOptions, planned.Exams.problemPoints, planned.Exams.problemNoZeroth] }, in: [notReady], emits: FIX, repeat: exam.problems } # one per problem; each leads to the editor, at the question it is about

  # --- publish now, or at a day and time -----------------------------------------------------------------------------------------------
  chooseRegion: { type: page, component: Page, role: region, name: { labelledBy: chooseTitle }, in: [choose, publishingNow] }
  chooseTitle: { type: text, component: Heading, role: heading, text: { key: planned.Exams.publish }, in: [choose, publishingNow] } # h2
  publishSummary: { type: text, component: Text, text: { key: planned.Exams.publishSummary, params: { course: exam.courseTitle, duration: exam.durationMinutes, count: exam.questionCount } }, in: [choose, publishingNow] } # what the talebe will see
  latestNowField: { type: field, component: TextField, native: datetime-local, text: { key: planned.Exams.latestStartLabel }, in: [choose, publishingNow], disabledIn: [publishingNow] } # the latest start when it opens now; no default (D1 asks whether it has one)
  latestHelp: { type: text, component: Text, text: { key: planned.Exams.latestStartHelp }, in: [choose, publishingNow, scheduleForm, scheduling, scheduleRefused] }
  latestBeforeError: { type: alert, component: Text, role: alert, text: { key: planned.Exams.latestBefore }, in: [choose], when: "notice == 'latestBefore'" } # under the latest start's field
  publishNow: { type: action, component: Button, role: button, intent: confirm, text: { key: planned.Exams.publishNow }, in: [choose, publishingNow], disabledIn: [publishingNow], emits: PUBLISH_NOW } # the exam celse's date and time become now; the talebe of the course are told
  scheduleLater: { type: action, component: Button, role: button, intent: secondary, text: { key: planned.Exams.publishLater }, in: [choose], emits: SCHEDULE }
  chooseCancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: Sessions.formCancel }, in: [choose], emits: CANCEL } # back to the editor

  # --- the day and time it opens -------------------------------------------------------------------------------------------------------
  scheduleRegion: { type: page, component: Page, role: region, name: { labelledBy: scheduleTitle }, in: [scheduleForm, scheduling, scheduleRefused] }
  scheduleTitle: { type: text, component: Heading, role: heading, text: { key: planned.Exams.publishLater }, in: [scheduleForm, scheduling, scheduleRefused] } # h2
  earliestField: { type: field, component: TextField, native: datetime-local, text: { key: planned.Exams.earliestStartLabel }, in: [scheduleForm, scheduling, scheduleRefused], disabledIn: [scheduling] } # it becomes the exam celse's date and time
  earliestHelp: { type: text, component: Text, text: { key: planned.Exams.earliestStartHelp }, in: [scheduleForm, scheduling, scheduleRefused] }
  latestField: { type: field, component: TextField, native: datetime-local, text: { key: planned.Exams.latestStartLabel }, in: [scheduleForm, scheduling, scheduleRefused], disabledIn: [scheduling] }
  timeZoneNote: { type: text, component: Text, text: { key: planned.Exams.timeZoneNote, params: { zone: viewer.timeZone } }, in: [scheduleForm, scheduling, scheduleRefused] } # the talebe's own time is shown beside each where their time zone differs (tedris.exams.mine)
  timePassedError: { type: alert, component: Text, role: alert, text: { key: planned.Exams.timePassed }, in: [scheduleRefused] } # under the field it is about; nothing is scheduled
  fixTime: { type: action, component: Button, role: button, intent: secondary, text: { key: planned.Exams.changeTime }, in: [scheduleRefused], emits: FIX }
  scheduleConfirm: { type: action, component: Button, role: button, intent: confirm, text: { key: planned.Exams.scheduleConfirm }, in: [scheduleForm, scheduling], disabledIn: [scheduling], emits: CONFIRM }
  scheduleCancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: Sessions.formCancel }, in: [scheduleForm], emits: CANCEL }

  # --- scheduled: until it opens -------------------------------------------------------------------------------------------------------
  scheduledAlert: { type: alert, component: Alert, role: status, name: { key: planned.Exams.statusScheduledTitle }, text: { key: planned.Exams.scheduledBody, params: { when: exam.startsAt, latest: exam.latestStartAt } }, in: [scheduled, unpublishing], when: isScheduled }
  notifiedNote: { type: text, component: Text, text: { key: planned.Exams.notifiedNote }, in: [scheduled] }
  moveButton: { type: action, component: Button, role: button, intent: secondary, text: { key: planned.Exams.move }, in: [scheduled], emits: MOVE } # publishing again moves it, and its reminder
  editButton: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: planned.Exams.edit }, in: [scheduled], emits: EDIT } # a scheduled exam can be changed until it opens
  toDraftScheduled: { type: action, component: Button, role: button, intent: dismiss, text: { key: planned.Exams.toDraft }, in: [scheduled, unpublishing], when: isScheduled, disabledIn: [unpublishing], emits: TO_DRAFT }

  # --- open: started until the latest start, each with the full length -----------------------------------------------------------------
  openAlert: { type: alert, component: Alert, role: status, name: { key: planned.Exams.statusOpen }, text: { key: planned.Exams.openBody, params: { latest: exam.latestStartAt } }, in: [open, unpublishRefused, closeAsk, closingEarly, unpublishing], when: isOpen }
  openCounts: { type: status, component: Status, role: status, text: { key: planned.Exams.openCounts, params: { started: counts.started, inProgress: counts.inProgress, finished: counts.finished } }, in: [open, unpublishRefused, closeAsk, closingEarly] } # read again as talebe start and finish
  resultsLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: planned.Exams.results }, in: [open], emits: RESULTS }
  takeBack: { type: action, component: Button, role: button, intent: dismiss, text: { key: planned.Exams.toDraft }, in: [open, unpublishing], when: isOpen, disabledIn: [unpublishing], emits: TAKE_BACK } # refused once a talebe has started
  closeEarly: { type: action, component: Button, role: button, intent: secondary, text: { key: planned.Exams.closeEarly }, in: [open], when: someoneIn, emits: CLOSE_EARLY } # only once a talebe has started
  unpublishRefusedDialog: { type: alert, component: Alert, role: alertdialog, name: { key: planned.Exams.unpublishRefusedTitle }, text: { key: planned.Exams.unpublishRefusedBody, params: { inProgress: counts.inProgress } }, in: [unpublishRefused] }
  refusedCloseEarly: { type: action, component: Button, role: button, intent: confirm, text: { key: planned.Exams.closeEarly }, in: [unpublishRefused, closingEarly], disabledIn: [closingEarly], emits: CLOSE_EARLY }
  refusedKeepOpen: { type: action, component: Button, role: button, intent: dismiss, text: { key: planned.Exams.keepOpen }, in: [unpublishRefused], emits: CANCEL }
  closeDialog: { type: alert, component: Alert, role: alertdialog, name: { key: planned.Exams.closeEarlyTitle }, text: { key: planned.Exams.closeEarlyBody, params: { inProgress: counts.inProgress } }, in: [closeAsk] } # cannot be undone
  closeConfirm: { type: action, component: Button, role: button, intent: confirm, text: { key: planned.Exams.closeEarly }, in: [closeAsk], emits: CONFIRM }
  closeCancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: Sessions.formCancel }, in: [closeAsk], emits: CANCEL }

  # --- a refusal, a failed read, a failed write ----------------------------------------------------------------------------------------
  forbiddenAlert: { type: alert, component: Alert, role: status, name: { key: Problems.forbiddenTitle }, text: { key: Problems.forbidden }, in: [forbidden] } # as the pages' own PageProblem draws it
  loadFailedAlert: { type: alert, component: Alert, role: alert, name: { key: planned.Exams.loadFailedTitle }, text: { key: Problems.actionGeneric }, in: [loadFailed] }
  retry: { type: action, component: Button, role: button, intent: secondary, text: { key: planned.Exams.retry }, in: [loadFailed], emits: RETRY }
  failedToast: { type: alert, component: Alert, role: alertdialog, name: { key: Sessions.failed }, text: { key: Problems.actionGeneric }, in: [choose, scheduleForm, scheduled, open], when: "notice == 'failed'" } # an alert dialog that stays until closed, as the session pages' failures

edges:
  - { labelledBy: [chooseRegion, chooseTitle] }
  - { labelledBy: [scheduleRegion, scheduleTitle] }
  - { triggers: [publishNow, publishingNow] }
  - { triggers: [scheduleConfirm, scheduling] }
  - { triggers: [toDraftScheduled, unpublishing] }
  - { triggers: [refusedCloseEarly, closingEarly] }
  - { triggers: [closeConfirm, closingEarly] }
  - { triggers: [problemLink, editor_opened] }
  - { triggers: [resultsLink, results_opened] }

rules:
  - { id: focus-not-decided, rule: "Proposal, not drawn: the page opens on its h1; a refused time moves the focus to the field it is about; a dialog takes the focus and gives it back to the button that opened it. Nothing is built, so the graph sets no initialFocus." }
  - { id: no-default-latest-start, rule: "The latest start has no default value: whether it has one is asked with D1, so the field is empty until the team fills it, and nothing is published without it." }
  - { id: time-zones, rule: "The dates are typed and shown in the team member's time zone, named beside them; a talebe whose time zone differs is shown their own time as well (tedris.exams.mine, tedris.exams.take)." }
  - { id: planned-words, rule: "Every key planned.Exams.* and Changes.note is a proposal for the owner to review; Sessions.* and Problems.* are the app's own." }
