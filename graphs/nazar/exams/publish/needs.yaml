# What must exist for the course team to publish, schedule and take back an online exam: written needs-first on 21 November 2026
# from the owner's rules and his answers of the same day (at the top of flow.yaml). Every need is missing: there is no code.
schema: delurio-graph/0
kind: needs
id: nazar.exams.publish
status: proposed
needs:
  - id: the-four-statuses
    need: >-
      An exam is a draft, scheduled ("<gün> <saat>'te yayında"), open ("Yayında") or closed ("Bitti"), and says which wherever it is
      listed, in nazar and in tedris.
    evidence:
      - state: scheduled
      - state: open
      - state: closed
      - node: draftBadge
      - node: scheduledBadge
      - node: openBadge
    missing: "MDRS-299: online exams, planned on 21 Nov 2026; no code yet"
    note: "Owner: \"sınav hazırlanırken taslak, yayında, 'şu gün şu saat yayında' gibi durumlar olacak\"."

  - id: checked-before-it-is-published
    need: >-
      Publishing is refused while a question has no correct answer, no topic or fewer than two options, while the points do not
      total 100, while there is no zeroth question, or while the exam has no question. Each problem is listed with a link to it, and
      nothing is published.
    evidence:
      - state: checking
      - state: notReady
      - node: problemLink
    missing: "MDRS-299: online exams, planned on 21 Nov 2026; no code yet"

  - id: publish-now
    need: >-
      "Şimdi yayınla" opens the exam at once, with a latest start, after saying what the talebe will see: the course, the length and
      the question count. The exam celse's date and time become now.
    evidence:
      - state: choose
      - state: open
      - node: publishSummary
      - node: latestNowField
      - node: publishNow
    missing: "MDRS-299: online exams, planned on 21 Nov 2026; no code yet"

  - id: publish-at-a-day-and-time
    need: >-
      The team chooses the earliest start, a day and a time, which is the exam celse's own, and the latest start, in its own time
      zone, with the talebe's shown beside it where they differ. A time that has passed, or a latest start before the earliest, is
      refused with why.
    evidence:
      - state: scheduleForm
      - state: scheduleRefused
      - state: scheduled
      - node: earliestField
      - node: latestField
      - node: timeZoneNote
      - node: timePassedError
    missing: "MDRS-299: online exams, planned on 21 Nov 2026; no code yet"
    note: "Owner: \"'şu gün şu saat yayında'\"; asked how the celse's time and the start relate: \"Celse saati = en erken\"."

  - id: opens-by-itself
    need: >-
      A scheduled exam opens by itself at its day and time, with no one on the page, and the talebe who have its page open see it
      open without reloading.
    evidence:
      - state: scheduled
      - state: open
      - node: scheduledAlert
    missing: "MDRS-299: online exams, planned on 21 Nov 2026; no code yet"

  - id: moved-or-taken-back-until-it-opens
    need: >-
      Until it opens, a scheduled exam can be moved to another day and time, or taken back to a draft; talebe meanwhile see only when
      it opens.
    evidence:
      - state: scheduled
      - state: draft_again
      - node: moveButton
      - node: toDraftScheduled
    missing: "MDRS-299: online exams, planned on 21 Nov 2026; no code yet"

  - id: started-until-the-latest-start-with-the-full-length
    need: >-
      Talebe start the exam at any time until its latest start, and each gets the full length. After the latest start no one starts
      it, the attempts in progress go on, and the exam is over ("Bitti") when the last of them has ended.
    evidence:
      - state: scheduleForm
      - state: open
      - state: closed
      - node: latestHelp
      - node: openAlert
    missing: "MDRS-299: online exams, planned on 21 Nov 2026; no code yet"
    note: >-
      Owner: "şimdilik 'en erken şu saatte en geç şu saatte sınava başlanmalı' olsun, süre kısalmasın, bunu da soralım" (D1). Asked of
      those who asked for exams, relayed by the owner on 22 Nov 2026: "sınava en geç başlama saati" defaultta 10 dakika sonra olacak; the medrese: "sadece gecikme için bunu kullanacağız, mazereti olan bize gelir duruma göre bakarız". The latest start is filled
      with the earliest start plus 10 minutes, and the team may change it.

  - id: taken-back-only-before-anyone-starts
    need: >-
      An open exam can be taken back to a draft only while no talebe has started it. After that the page says how many are in
      progress, and offers to close it early, which ends every attempt with the answers saved so far.
    evidence:
      - state: open
      - state: unpublishRefused
      - node: unpublishRefusedDialog
      - node: closeDialog
    missing: "MDRS-299: online exams, planned on 21 Nov 2026; no code yet"
    note: "Owner, asked whether it can be taken back after a talebe has started: \"Geri alınamaz, erken bitirilir\"."

  - id: the-talebe-are-told
    need: >-
      The talebe of the course are told when an exam is scheduled or opened, in their notifications and by e-mail as their settings
      allow, and are reminded 24 hours before it opens. Moving the exam moves the reminder.
    evidence:
      - state: scheduled
      - state: open
      - node: notifiedNote
    missing: "MDRS-299: online exams, planned on 21 Nov 2026; no code yet"
    note: "Owner: \"Zamanlanınca + 24 saat önce\"; as exam celses are reminded today (LessonExam.remindedAt)."

  - id: only-the-course-team-and-audited
    need: >-
      Only the course team that may prepare the exam publishes, schedules, moves, takes back or closes it, and each of these is
      audited: who, when, and what it was before.
    evidence:
      - state: choose
      - node: forbiddenAlert
    missing: "MDRS-299: online exams, planned on 21 Nov 2026; no code yet"
