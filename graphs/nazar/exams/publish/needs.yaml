# What must exist for the course team to publish an online exam: written needs-first on 21 November 2026 from the owner's rules, then met
# by MDRS-299 (#415, #431); each met need names its code or test. Still missing: moving a scheduled exam in place, a page that redraws
# itself when the exam opens, a notification when it opens (the one when it is scheduled is sent), and problems that link to what they
# are about (EXM-PUB-2, read from the code on 24 Nov 2026).
schema: delurio-graph/0
kind: needs
id: nazar.exams.publish
status: proposed
needs:
  - id: the-four-statuses
    need: >-
      An exam is a draft, scheduled ("<gün> <saat>'te yayında"), open ("Yayında") or closed ("Bitti"), and says which wherever it is
      listed, in nazar and in tedris.
    evidence:
      - state: scheduled
      - state: open
      - state: closed
      - node: scheduledBadge
      - node: openBadge
      - source: apps/nazar/features/online-exams/components/exams-page.tsx:49
    note: "Owner: \"sınav hazırlanırken taslak, yayında, 'şu gün şu saat yayında' gibi durumlar olacak\"."

  - id: checked-before-it-is-published
    need: >-
      Publishing is refused while a question has no correct answer, no topic or fewer than two options, while the points do not
      total 100, while there is no zeroth question, or while the exam has no question. Each problem is listed with a link to it, and
      nothing is published.
    evidence:
      - node: problemLink
      - source: apps/nazar/features/online-exams/components/exam-publish.tsx:42
      - test: apps/tedrisat/test/e2e/online-exam-publish.e2e.spec.ts
        name: "lists every problem of an exam that is not ready, and plans nothing"
      - test: apps/nazar/test/exam-publish.spec.tsx
        name: "lists what keeps it from being published, and offers no button"
    missing: "MDRS-299, EXM-PUB-2: each problem is listed and nothing is published, but the lines are not links to what they are about"

  - id: publish-now
    need: >-
      "Şimdi yayınla" opens the exam when the button is pressed, with a late window in minutes, after saying what the talebe will see:
      the length and the question count. The exam celse is made at that time.
    evidence:
      - state: choose
      - state: open
      - node: publishSummary
      - node: lateMinutesField
      - node: publishNow
      - test: apps/nazar/test/exam-publish.spec.tsx
        name: "publishes now with the late window counted from the press, twenty minutes when the hoca says so"
      - test: apps/tedrisat/test/e2e/online-exam-publish.e2e.spec.ts
        name: "counts the late window in minutes from the start it sets, now included"

  - id: publish-at-a-day-and-time
    need: >-
      The team chooses the earliest start, a day and a time, which is the exam celse's own, and the late window in minutes, in its own
      time zone, which the form names. A time that has passed is refused with why.
    evidence:
      - state: choose
      - state: scheduled
      - node: earliestField
      - node: lateMinutesField
      - node: timeZoneNote
      - node: timePassedError
      - test: apps/nazar/test/exam-publish.spec.tsx
        name: "schedules it at the day and time chosen, the latest start ten minutes later"
      - test: apps/tedrisat/test/e2e/online-exam-publish.e2e.spec.ts
        name: "plans the celse at the start, with its exam row, and locks the exam"
    note: "Owner: \"'şu gün şu saat yayında'\"; asked how the celse's time and the start relate: \"Celse saati = en erken\"."

  - id: opens-by-itself
    need: >-
      A scheduled exam opens by itself at its day and time, with no one on the page, and the talebe who have its page open see it
      open without reloading.
    evidence:
      - node: scheduledAlert
      - source: apps/tedrisat/src/online-exam/domain/exam-attempt.ts
    missing: "MDRS-299: the exam opens by its time (the window is reckoned on every read), but a page left open is not drawn again when it opens"
    note: "It is about the states scheduled and open: the team's page stays on scheduled until it is read again."

  - id: moved-or-taken-back-until-it-opens
    need: >-
      Until it opens, a scheduled exam can be moved to another day and time, or taken back to a draft; talebe meanwhile see only when
      it opens.
    evidence:
      - state: draft_again
      - node: toDraftScheduled
      - test: apps/tedrisat/test/e2e/online-exam-publish.e2e.spec.ts
        name: "takes it back until it opens: the celse goes and the draft stays"
      - test: apps/nazar/test/exam-publish.spec.tsx
        name: "takes a scheduled exam back to a draft, and gives the editor back"
    missing: "MDRS-299: taking it back to a draft is built; moving a scheduled exam in place is not (it is taken back, then published again)"
    note: "It is about the state scheduled, which offers Taslağa al and no move."

  - id: started-until-the-latest-start-with-the-full-length
    need: >-
      Talebe start the exam at any time until its latest start, and each gets the full length. After the latest start no one starts
      it, the attempts in progress go on, and the exam is over ("Bitti") when the last of them has ended.
    evidence:
      - state: choose
      - state: open
      - state: closed
      - node: latestHelp
      - node: openAlert
      - test: apps/tedrisat/test/e2e/exam-attempts.e2e.spec.ts
        name: "refuses to start before the earliest start and after the latest"
    note: >-
      Owner: "şimdilik 'en erken şu saatte en geç şu saatte sınava başlanmalı' olsun, süre kısalmasın" (21 Nov). Relayed on 22 Nov
      2026 (D1, answered): "'sınava en geç başlama saati' de defaultta 10 dakika sonra olacak. şu anki medresemiz 'sadece gecikme için
      bunu kullanacağız, mazereti olan bize gelir duruma göre bakarız' dedi"; and "belki 10 dk değil 20 dk seçecek hoca": the late
      window is asked in minutes, 10 by default.

  - id: taken-back-only-before-anyone-starts
    need: >-
      A published exam can be taken back to a draft only until it opens. After that it can be closed early, which ends every attempt
      with the answers saved so far.
    evidence:
      - state: scheduled
      - state: open
      - node: toDraftScheduled
      - source: apps/tedrisat/src/online-exam/errors/online-exam.errors.ts:27
      - test: apps/tedrisat/test/e2e/online-exam-results.e2e.spec.ts
        name: "closes early: an attempt in progress ends with its saved answers, and nothing starts or closes again"
    note: "Owner, asked whether it can be taken back after a talebe has started: \"Geri alınamaz, erken bitirilir\"."

  - id: the-talebe-are-told
    need: >-
      The talebe of the course are told when an exam is scheduled, in their notifications and by e-mail as their settings
      allow, it goes into their calendar, and they are reminded 24 hours before it opens. Moving the exam moves the reminder.
    evidence:
      - state: scheduled
      - state: open
      - node: notifiedNote
      - source: apps/tedrisat/src/course/course.service.ts:1424
      - test: apps/tedrisat/test/e2e/online-exam-publish.e2e.spec.ts
        name: "plans the celse at the start, with its exam row, and locks the exam"
    note: "Owner, 22 Nov, asked whether a notification goes when it is scheduled: \"evet, takvime de düşsün\". Publishing plans the exam celse through createExamSession, which sends EXAM_SCHEDULED and queues the celse's calendar invitation (a CANCEL when it is taken back); the 24-hour reminder is LessonExam.remindedAt. No notification is sent when it opens."

  - id: only-the-course-team-and-audited
    need: >-
      Only the course team that may prepare the exam publishes, schedules, moves, takes back or closes it, and each of these is
      audited: who, when, and what it was before.
    evidence:
      - state: choose
      - node: forbiddenAlert
      - test: apps/tedrisat/test/e2e/online-exam-publish.e2e.spec.ts
        name: "publishes only with exam.prepare"
      - source: apps/tedrisat/src/online-exam/online-exam.service.ts:165
