# The course team publishes an online exam in nazar-web, now or at a day and time, takes it back to a draft until it opens, and closes
# it early after. BUILT (MDRS-299, #415, #431): the "Yayınla" section under the questions of the exam's page and, once published, the
# page's read-only view (features/online-exams/components/exam-publish.tsx in exam-workspace.tsx); closing early is on the results page
# (nazar.exams.results). Its actions are publishOnlineExam, unpublishOnlineExam and closeOnlineExamEarly of domain/online-exams.yaml.
# Written graph-first on 21 November 2026; `status: proposed`, so no state names code.
#
# Publishing makes the exam celse ("Celsesiz taslak", the owner, 22 Nov 2026): at the start, lasting the length plus the late window,
# with its LessonExam of format MULTIPLE_CHOICE; the course's or the medrese's zeroth question is copied into the exam.
#
# The owner's words this flow carries:
#   - 21 Nov: "sınav hazırlanırken taslak, yayında, 'şu gün şu saat yayında' gibi durumlar olacak"; "şimdilik 'en erken şu saatte en geç
#     şu saatte sınava başlanmalı' olsun, süre kısalmasın"; the celse's time is the earliest start ("Celse saati = en erken").
#   - The late window (D1, answered): "'sınava en geç başlama saati' de defaultta 10 dakika sonra olacak. şu anki medresemiz 'sadece
#     gecikme için bunu kullanacağız, mazereti olan bize gelir duruma göre bakarız' dedi" (22 Nov, relayed) and "belki 10 dk değil 20 dk
#     seçecek hoca, bunun da mümkün olması gerekmez mi sence" (22 Nov): the form asks for the minutes, 10 by default, counted from the
#     real opening, the press itself for "Şimdi yayınla" (#431).
#   - The length is required: "o olmadan sınav yayına alınamasın" (22 Nov, NO_DURATION).
#
# Not built: moving a scheduled exam in place, or changing it in the editor while scheduled (it is taken back to a draft first); a
# notification when the exam opens. Publishing does tell the course's talebe it is scheduled (EXAM_SCHEDULED) and puts it in their
# calendar through the celse's invitation, as every exam celse does (the owner, 22 Nov: "evet, takvime de düşsün").
# Choices made in the code that are not his: "Taslağa al" deletes the celse; it is offered until the exam opens; "İleri bir tarihte"
# starts at the next whole hour; one confirmation before publishing.
schema: delurio-graph/0
kind: flow
id: nazar.exams.publish
status: proposed
domain: medaris.api
ui: nazar.exams.publish
title: Publish or schedule an online exam
summary: >-
  From the editor, the team presses "Yayınla". The exam is first checked: a question with no correct answer, with no topic or with
  fewer than two options, points that do not total 100, or no question at all, are each listed with a way to them, and nothing is
  published. A complete exam is opened at once ("Şimdi yayınla") or at a day and time ("<gün> <saat>'te yayınla"), with a latest
  start. A scheduled exam says when it opens, opens by itself at that time, and can be moved or taken back to a draft until then.
  Talebe start it until the latest start, each with the full length; it ends when the last attempt has ended. It can be taken back
  only while no talebe has started it, and closed early after. The talebe of the course are told when it is scheduled or opened, and
  reminded 24 hours before.
scope:
  shows: publishing, scheduling, moving, taking back and closing early one exam in nazar-web
  world: open
  outOfView:
    - "writing the exam and fixing what keeps it from being published: nazar.exams.edit, which each problem leads to"
    - "who started and finished, and their scores: nazar.exams.results"
    - "the notifications themselves and the 24-hour reminder: the existing remindDueExams, and the talebe's own page (tedris.exams.mine)"
    - "an ended session (every call then sends the person to sign in: realm.auth.signIn)"
context:
  status:
    values: [draft, scheduled, open, closed]
    initial: any
    say:
      draft: the exam is a draft
      scheduled: the exam is set to open at a day and time
      open: the exam can be started, or attempts are in progress
      closed: every attempt has ended
  complete:
    values: [yes, no]
    initial: any
    say:
      yes: every question is complete, the points total 100 and the zeroth question is written
      no: something keeps the exam from being published
  when:
    values: [future, past]
    initial: any
    say:
      future: the day and time chosen are ahead
      past: the day and time chosen have passed
  started:
    values: [nobody, someone]
    initial: any
    say:
      nobody: no talebe has started the exam
      someone: at least one talebe has started it
  notice:
    values: ["none", latestBefore, changed, failed]
    initial: "none"
    say:
      "none": nothing is said
      latestBefore: the latest start's field says it cannot come before the earliest start
      changed: the page says the exam changed meanwhile and was checked again
      failed: an alert says it could not be done
guards:
  someoneIn: "started == 'someone'"
  isDraft: "status == 'draft'"
  isScheduled: "status == 'scheduled'"
  isOpen: "status == 'open'"
effects:
  clearNotice: { set: { notice: "none" } }
  someoneStarted: { set: { started: someone } }
  nowScheduled: { set: { status: scheduled, notice: "none" } }
  nowOpen: { set: { status: open, notice: "none" } }
  latestBefore: { set: { notice: latestBefore } }
  changed: { set: { notice: changed } }
  failed: { set: { notice: failed } }
failures:
  reading:
    from: getOnlineExamDraft
    forbidden: [AUTHZ_FORBIDDEN]
    gone: [EXAM_NOT_FOUND]
    other: [network, timeout, 5xx]
  publishingNow:
    from: publishOnlineExam
    forbidden: [AUTHZ_FORBIDDEN]
    notReady: [EXAM_NOT_READY]
    timePassed: [EXAM_TIME_PASSED]
    changed: [EXAM_LOCKED, EXAM_STALE]
    other: [EXAM_NOT_FOUND, network, timeout, 5xx]
  scheduling:
    from: publishOnlineExam
    forbidden: [AUTHZ_FORBIDDEN]
    notReady: [EXAM_NOT_READY]
    timePassed: [EXAM_TIME_PASSED]
    changed: [EXAM_LOCKED, EXAM_STALE]
    other: [EXAM_NOT_FOUND, network, timeout, 5xx]
  unpublishing:
    from: unpublishOnlineExam
    forbidden: [AUTHZ_FORBIDDEN]
    started: [EXAM_LOCKED]
    other: [EXAM_NOT_PUBLISHED, EXAM_STALE, EXAM_NOT_FOUND, network, timeout, 5xx]
  closingEarly:
    from: closeOnlineExamEarly
    forbidden: [AUTHZ_FORBIDDEN]
    notOpen: [EXAM_NOT_OPEN]
    other: [EXAM_NOT_FOUND, network, timeout, 5xx]

# The main story: a complete draft is published now, with a latest start.
main:
  given: { status: draft, complete: yes }
  events: [DONE, PUBLISH_NOW, DONE]
initial: reading
states:
  reading:
    title: The exam is read
    description: >-
      The action getOnlineExamDraft, GET /online-exams/{examId}: where the exam stands, whether it is complete and what keeps it
      from being published, its length and question count, its dates, and how many talebe have started. Only the course team that may
      prepare the exam (exam.prepare) is answered.
    invoke: { action: getOnlineExamDraft }
    on:
      DONE: loaded
      FAIL.forbidden: forbidden
      FAIL.gone: notFound
      FAIL.other: loadFailed
  loaded:
    title: The page is drawn as the exam stands
    description: A step with no screen of its own.
    always:
      - { guard: isDraft, target: checking, say: "a draft is checked before anything is offered" }
      - { guard: isScheduled, target: scheduled, say: "a scheduled exam" }
      - { guard: isOpen, target: open, say: "an open exam" }
      - { target: closed, say: "an exam that has closed" }
  checking:
    title: The exam is checked
    description: >-
      Before anything is published, the exam is checked as a whole, from the read: every question complete, the points totalling 100,
      the zeroth question written, at least one question. The API checks it again when it is published.
    always:
      - { guard: "complete == 'no'", target: notReady, say: "something keeps it from being published" }
      - { target: choose, say: "the exam is complete" }
  notReady:
    title: The exam cannot be published yet
    description: >-
      Each problem is listed with a link to it: a question with no correct answer, with no topic, or with fewer than two options;
      points that do not total 100; no zeroth question; no question at all. Nothing is published.
    by: human
    on:
      FIX: { target: editor_opened, say: "they follow a problem to the editor" }
      NAVIGATE: left
  choose:
    title: Publish now or at a day and time
    description: >-
      What the talebe will see is said: the length and the question count. "Şimdi yayınla" opens it when the button is pressed;
      "İleri bir tarihte" asks for a day and a time (the next whole hour first). Both ask "Geç kalanlar kaç dakika sonrasına kadar
      başlayabilir", 10 by default, and say under it the time that comes to; one confirmation asks before it is published.
    by: human
    on:
      PUBLISH_NOW: { target: publishingNow, effect: [clearNotice], say: "they press Yayınla with Şimdi yayınla chosen, and confirm: the earliest start is the press" }
      SCHEDULE: { target: scheduleForm, effect: [clearNotice], say: "they choose a day and time" }
      CANCEL: { target: editor_opened, say: "they go back to the editor" }
  publishingNow:
    title: Publish it now
    description: >-
      The action publishOnlineExam, POST /online-exams/{examId}/publish, with no earliest start (the server's now) and the late window in
      minutes, counted from that now. The exam celse is made at that time.
    invoke: { action: publishOnlineExam }
    on:
      DONE: { target: open, effect: [nowOpen], say: "the exam is open; the talebe are told" }
      FAIL.notReady: { target: notReady, say: "the API found a problem the page had not" }
      FAIL.timePassed: { target: choose, effect: [latestBefore], say: "the latest start is not after now" }
      FAIL.changed: { target: reading, effect: [changed], say: "the exam changed meanwhile: it is read and checked again" }
      FAIL.forbidden: forbidden
      FAIL.other: { target: choose, effect: [failed] }
  scheduleForm:
    title: The day and time it opens
    description: >-
      The earliest start, a day and a time, which becomes the exam celse's, and the late window in minutes; in the team's time zone,
      which the form names.
    by: human
    on:
      CONFIRM:
        - { guard: "when == 'past'", target: scheduleRefused, say: "they choose a time that has passed" }
        - { target: scheduling, effect: [clearNotice], say: "they confirm the day and time" }
      CANCEL:
        - { guard: isScheduled, target: scheduled, say: "they leave the scheduled time as it was" }
        - { target: choose, say: "they go back" }
  scheduling:
    title: Schedule it
    description: >-
      The action publishOnlineExam with the earliest start and the late window in minutes. The exam celse is made at that day and time,
      and its 24-hour reminder runs as for every exam celse.
    invoke: { action: publishOnlineExam }
    on:
      DONE: { target: scheduled, effect: [nowScheduled], say: "the exam is scheduled; the talebe are told when it opens" }
      FAIL.timePassed: { target: scheduleRefused, say: "the time chosen has passed, or the latest start is before the earliest" }
      FAIL.notReady: { target: notReady }
      FAIL.changed: { target: reading, effect: [changed] }
      FAIL.forbidden: forbidden
      FAIL.other: { target: scheduleForm, effect: [failed] }
  scheduleRefused:
    title: That time cannot be taken
    description: The field says why, and nothing is scheduled.
    by: human
    on:
      FIX: { target: scheduleForm, say: "they choose another time" }
  scheduled:
    title: "<gün> <saat>'te yayında"
    description: >-
      The page shows the exam read-only: when it opens and until when it can be started. "Taslağa al" takes it back to a draft until
      then; it is not moved or changed in place (not built: take it back, then publish again). Talebe see when it opens and nothing of
      its questions.
    by: human
    on:
      OPENS: { target: open, effect: [nowOpen], say: "the day and time come: it opens by itself" }
      MOVE: { target: scheduleForm, effect: [clearNotice], say: "(not built) they move it in place" }
      EDIT: { target: editor_opened, say: "(not built) they change it in the editor while scheduled" }
      TO_DRAFT: { target: unpublishing, effect: [clearNotice], say: "they press Taslağa al" }
      NAVIGATE: left
  open:
    title: Yayında
    description: >-
      Talebe of the course start the exam until its latest start, each with the full length; after the latest start no one starts it,
      and the attempts in progress go on. The page counts who started, who is in it and who finished, and leads to the results
      (nazar.exams.results).
    by: human
    goal: true
    on:
      TAKE_BACK: { target: unpublishRefused, say: "an open exam is not taken back: the page offers no Taslağa al once it has opened" }
      CLOSE_EARLY: { target: closeAsk, effect: [clearNotice], say: "they press Sınavı erken bitir on the results page" }
      SOMEONE_STARTS: { target: open, effect: [someoneStarted], say: "a talebe starts the exam" }
      CLOSES: { target: closed, say: "the latest start has passed and the last attempt has ended" }
      RESULTS: { target: results_opened, say: "they open the results" }
      NAVIGATE: left
  unpublishing:
    title: Take it back to a draft
    description: >-
      The action unpublishOnlineExam, POST /online-exams/{examId}/unpublish: refused once the exam has opened (EXAM_LOCKED), whatever the
      page showed. The celse it was published with is deleted, and the talebe get the calendar's CANCEL.
    invoke: { action: unpublishOnlineExam }
    on:
      DONE: { guard: "started == 'nobody'", target: draft_again, say: "it is a draft again" }
      FAIL.started: { target: unpublishRefused, effect: [nowOpen], say: "it opened meanwhile" }
      FAIL.forbidden: forbidden
      FAIL.other:
        - { guard: isScheduled, target: scheduled, effect: [failed] }
        - { target: open, effect: [failed] }
  unpublishRefused:
    title: It cannot be taken back
    description: >-
      The page says an open exam is not taken back to a draft; it can be closed early instead.
    by: human
    on:
      CLOSE_EARLY: { target: closingEarly, effect: [clearNotice], say: "they close it early: every attempt ends with its saved answers" }
      CANCEL: { target: open, say: "they leave it open" }
  closeAsk:
    title: Close it early?
    description: >-
      An alert dialog says how many talebe are in the exam now, that their attempts end with the answers saved so far, and that no one
      can start it after; it cannot be undone.
    by: human
    on:
      CONFIRM: { target: closingEarly, say: "they press Erken bitir" }
      CANCEL: { target: open, say: "they leave it open" }
  closingEarly:
    title: Close it early
    description: >-
      The action closeOnlineExamEarly, POST /online-exams/{examId}/close, from the results page: every attempt in progress ends with
      its saved answers and is scored (finished by the team); no one starts it any more.
    invoke: { action: closeOnlineExamEarly }
    on:
      DONE: { target: closed, say: "the exam is over" }
      FAIL.notOpen: { target: closed, say: "it had closed meanwhile" }
      FAIL.forbidden: forbidden
      FAIL.other: { target: open, effect: [failed] }
  forbidden:
    title: Not allowed
    description: The page's heading and the neutral alert "Bu sayfaya izniniz yok"; the API refuses every write of such a person.
    by: human
    on:
      NAVIGATE: left
  loadFailed:
    title: The exam could not be read
    description: The page says so and offers to try again.
    by: human
    on:
      RETRY: { target: reading, say: "they press Yeniden dene" }
      NAVIGATE: left
  notFound:
    title: The exam is not found
    description: "The read answered 404: the celse is not an online exam, or it was archived. nazar.shell.errorStates draws the page."
    type: final
  draft_again:
    title: The exam is a draft again
    description: No talebe sees it any more; it can be changed and published again.
    type: final
  closed:
    title: Bitti
    description: The exam has closed; every attempt in progress ended with the answers saved so far.
    type: final
  editor_opened:
    title: The editor is opened
    description: nazar.exams.edit.
    type: final
  results_opened:
    title: The results are opened
    description: nazar.exams.results.
    type: final
  left:
    title: The person left the page
    type: final
    leavesPage: true

assertions:
  - id: taken-back-only-before-it-opens
    never: "state == 'draft_again' and status == 'open'"
    say: "An exam that has opened is never taken back to a draft: it can only be closed early"
