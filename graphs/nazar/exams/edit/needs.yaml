# What must exist for the course team to prepare an online exam: written needs-first on 21 November 2026 from the owner's rules, then met
# by MDRS-299 (#408 to #428); each met need names its code or test. Still missing: the count against 50 questions, renaming a topic on
# the page, the count and filter per topic, the preview, copying an earlier exam, changing a scheduled exam in place, and a walk with the
# keyboard and a screen reader; and, read from the code on 24 Nov 2026, what a question lacks said at its fields, the others' share
# before own points are saved, a total, and when the draft was last saved.
schema: delurio-graph/0
kind: needs
id: nazar.exams.edit
status: proposed
needs:
  - id: only-the-course-team-prepares
    need: >-
      Only a hoca of the exam's course, or a ders nazırı the hoca has given the grant to prepare exams, opens its editor and changes
      it; to anyone else the exam is not there, and the API refuses every write of theirs. Every change is audited, as the course's
      other writes are.
    evidence:
      - state: opening
      - state: forbidden
      - node: forbiddenAlert
      - test: apps/tedrisat/test/e2e/online-exams.e2e.spec.ts
        name: "asks exam.prepare on the course: a hoca and a nazır given it, not session.manage or a talebe"
    note: "Owner, asked who prepares: \"Hoca + yetkili ders nazırı\". The grant is new, granular and may be time-limited, as the others are."

  - id: an-exam-celse-of-the-online-format
    need: >-
      An online exam is an exam celse of its course in a third format, beside written and oral, made when the exam is published (a
      draft has no celse). It sits in the curriculum, Programım and the calendar as exam celses do, and its celse's date and time are
      the exam's earliest start.
    evidence:
      - state: editor
      - test: apps/tedrisat/test/e2e/online-exam-publish.e2e.spec.ts
        name: "plans the celse at the start, with its exam row, and locks the exam"
    note: >-
      Owner: "üçüncü" (21 Nov); "Celsesiz taslak" (22 Nov 2026).

  - id: a-draft-is-the-team-s-alone
    need: >-
      A new online exam is a draft with no celse, so no talebe sees it or anything of it until it is published; from then they see its
      date, and nothing of its questions until it opens.
    evidence:
      - state: examsList
      - node: statusBadge
      - test: apps/tedrisat/test/e2e/online-exams.e2e.spec.ts
        name: "opens a draft with no celse, and keeps a question as written"
    note: "Owner: \"sınav hazırlanırken taslak, yayında, 'şu gün şu saat yayında' gibi durumlar olacak\"; asked whether a draft's celse shows: \"Zamanlanana kadar gizli\"."

  - id: one-hour-and-fifty-questions-by-default
    need: >-
      An exam has no length until the team types one, and is not published without it. 50 questions are suggested: the editor counts
      "n/50 soru" and does not stop the team at fewer or more.
    evidence:
      - node: durationField
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "starts a new exam's length blank, and sends a cleared length as none"
      - test: apps/tedrisat/test/e2e/online-exam-publish.e2e.spec.ts
        name: "lists every problem of an exam that is not ready, and plans nothing"
    missing: "MDRS-299: the length is built as he decided on 22 Nov (no default, required to publish); the count against 50 suggested questions is not built"
    note: >-
      Owner, 21 Nov 2026: "sınav süresi defaultta 1 saat olacak, soru sayısı da 50 önerilecek"; then, 22 Nov 2026: "sınav süresinin
      varsayılanı olmasın, zorunlu olsun ama boş kalsın o olmadan sınav yayına alınamasın".

  - id: any-length
    need: The team sets the length in whole minutes; any length above zero is taken.
    evidence:
      - state: editor
      - node: durationField
      - node: durationError
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "does not send a length of zero, and says why"
      - test: apps/tedrisat/test/e2e/online-exam-publish.e2e.spec.ts
        name: "answers a length or a version past the column as invalid, not as a failure"
    note: "Owner, asked for bounds: \"Sınır yok\"."

  - id: the-instructions-of-the-briefing
    need: >-
      The team may write instructions of its own, which the talebe reads in the briefing under what every exam says ("Bilmeniz
      gerekenler").
    evidence:
      - state: editor
      - node: instructionsField
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "queues the settings after a question save, with the version that save gave"

  - id: the-zeroth-question
    need: >-
      Every online exam asks a zeroth question about the hadith "Bizi aldatan bizden değildir", with its options, at least two, none
      of them correct, and no points: the course's own, or else its medrese's, copied into the exam when it is published. Above it the
      hadith is shown as the talebe will see it, in Arabic and in its meaning, which no one changes. An exam with neither is not
      published.
    evidence:
      - state: zerothForm
      - node: hadithArabic
      - node: hadithMeaning
      - node: zerothQuestionField
      - node: zerothOptionField
      - test: apps/nazar/test/course-zeroth-section.spec.tsx
        name: "shows the medrese's by default, and saves one for the course from it"
      - test: apps/tedrisat/test/e2e/course-zeroth-question.e2e.spec.ts
        name: "asks the medrese's by default, the course's own once it has one, and the medrese's again once that is taken off"
      - test: apps/tedrisat/test/e2e/course-zeroth-question.e2e.spec.ts
        name: "publishes a köşk's own course only with a question of its own"
    note: >-
      Owner: the zeroth question (21 Nov 2026); madrasah-wide, "şu an vize dönemindeyiz, soruyu her sınavda aynı soralım, finalde de
      soruyu değiştiririz her dersin sınavında o yeni soru sorulur" (22 Nov, relayed); per course, "ders özelinde sıfırıncı soru
      mümkün olsun, medreseninki default olur ders özelinde değişebilir" (22 Nov); the hadith "Böyle kalsın", no source (22 Nov).

  - id: topics-first-from-the-course-s-list
    need: >-
      Before the questions, the exam picks its topics, about six or seven, from the course's list of topics: short names of one to
      three words. A topic not yet on the list is typed here and joins the course's list. A name is required, is not given twice in
      the course, and a name longer than three words is refused with why.
    evidence:
      - state: editor
      - node: topicsGroup
      - node: newTopicField
      - node: topicTooLongError
      - node: topicExistsError
      - test: apps/tedrisat/test/e2e/online-exams.e2e.spec.ts
        name: "numbers the course's topics, and refuses a name or a number twice"
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "shows a new topic with its number at once"
    note: "Owner: \"bunun için önce sınav konuları girilecek 1-3 kelimelik 6-7 tane mesela\"; asked whose list it is: \"dersin\"."

  - id: topics-renamed-and-unpicked
    need: >-
      A topic can be renamed, for the whole course, and every exam and question keeps it. Unpicking a topic that questions of the exam
      carry says how many and asks first; those questions keep their other topics, or are marked incomplete when it was their only one.
    evidence:
      - state: renamingTopic
      - node: topicNameField
      - test: apps/tedrisat/test/e2e/online-exams.e2e.spec.ts
        name: "deletes a topic no question carries, and refuses one that questions carry, naming them"
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "takes a topic off at once, and puts it back naming the questions that carry it"
    missing: "MDRS-299: a topic is deleted from the page (not one that questions carry: TOPIC_IN_USE); renaming it is in the API (renameCourseTopic) but the page offers no control yet"
    note: >-
      Owner, 22 Nov 2026: "konu silebilmek de lazım sadece ekleme var". That a topic questions carry is refused, not taken off them,
      is my choice.

  - id: a-multiple-choice-question
    need: >-
      A question has its text and its options, at least two and as many as the preparer wants, with one marked correct unless the
      preparer marks more; a new question starts with five option fields. A question or an option may be in Arabic, or mix Arabic
      and Turkish, and is set right to left where it is Arabic.
    evidence:
      - state: questionForm
      - node: questionText
      - node: optionField
      - node: optionCorrect
      - node: addOption
      - test: apps/tedrisat/test/e2e/online-exams.e2e.spec.ts
        name: "opens a draft with no celse, and keeps a question as written"
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "shows a saved question at once, and sends it in the background"
    note: "Owner: \"çoktan seçmeli\"; asked how many options and correct ones: \"en az iki şık, üst limit yok, default'ta tek doğru ama istenirse birden fazla doğru olabilir\". Asked how many option fields a new question starts with: \"5 şık\"."

  - id: how-a-question-with-several-correct-is-answered
    need: >-
      A question with more than one correct option is answered with radio buttons unless the preparer chooses check boxes. With radio
      buttons the talebe chooses one, and any correct option gets the question's points. With check boxes the preparer chooses how it
      is scored: all or nothing (every correct option and no other), or in shares, where each correct mark gets an equal share of the
      question's points, each wrong mark takes a share off, and the question never goes below 0.
    evidence:
      - state: questionForm
      - node: modeGroup
      - node: scoringGroup
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "asks how a question with two correct options is answered and scored, and sends it"
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "offers check boxes where any correct one is enough, and sends it"
    note: >-
      Owner, 21 Nov 2026: radio buttons or check boxes, all or nothing or in shares; 22 Nov: "doğru cevaplardan herhangi birini
      işaretlemesi de yeterli olsun puanı tam alması için" (ANY_CORRECT; that a wrong mark then gives nothing is my choice).

  - id: every-question-has-its-topics
    need: Each question is marked with one or more of the exam's topics.
    evidence:
      - state: questionForm
      - node: questionTopicNumbers
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "sends a topic added on the page by the id the server gave it"
    note: "Owner: \"her soru için hangi konu hakkında olduğu işaretlenecek ... her soru için bu konular işaretlenecek\"."

  - id: what-a-question-lacks-is-said
    need: >-
      A question that lacks its text, a second option, a correct one or a topic is saved as incomplete, says what it lacks at the
      field, and keeps the exam from being published; the focus goes to the first thing missing.
    evidence:
      - node: rowState
      - test: apps/tedrisat/test/e2e/online-exam-publish.e2e.spec.ts
        name: "lists every problem of an exam that is not ready, and plans nothing"
    missing: "MDRS-299: an incomplete question is saved, its row says \"Eksik\" and the section Yayınla lists what it lacks; nothing is said at the question's fields and the focus does not move"

  - id: points-shared-equally
    need: >-
      The exam is out of 100, and by default the points are shared equally over the questions: 50 questions get 2 each. Adding or
      removing a question shares the points again over the questions that have no points of their own. The zeroth question has none.
    evidence:
      - state: editor
      - node: rowPoints
      - test: apps/tedrisat/test/e2e/online-exams.e2e.spec.ts
        name: "shares the points left exactly, and refuses own points past 100"
    note: "Owner: \"100 puan üzerinden default'ta eşdeğer ağırlıkta her soruya puan dağıtılacak\"."

  - id: a-question-s-own-points
    need: >-
      A question can be given points of its own, and the points left are shared equally over the questions that have none. With 50
      questions at 2 each, giving one 5 leaves 95 for the other 49 (1,94 each); then giving one of them 10 leaves 85 for the other 48
      (1,77 each). Before it is saved, the field says what each other question will get.
    evidence:
      - node: ownPointsField
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "shows own points at once, and sets them after the save with the version the save gave"
    missing: "MDRS-299: a question takes points of its own and every share follows once it is saved; the field does not say beforehand what each other question will get"
    note: >-
      Owner: "örneğin 50 soru var her soru otomatik 2 puan, bi soruya geleceğiz 2'yi 5 yapacağız, kalan 95 puan da 49 soruya eşit
      dağılacak. sonra başka soruya geleceğiz 1.94 puanı 10 yapacağız kalan 85 puan da kalan 48 soruya eşit dağılacak".

  - id: back-into-the-share
    need: A question's own points can be cleared, and the question goes back into the equal share.
    evidence:
      - state: questionForm
      - node: ownPointsField
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "puts a question back into the equal share when its own points are cleared"

  - id: points-never-pass-100
    need: >-
      Points of its own that would take the total over 100, or leave nothing for the questions that share, are refused, with how many
      points are left to give. When every question has points of its own, they must add up to 100 before the exam can be published.
    evidence:
      - state: editor
      - node: pointsRefusedError
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "keeps the typed points when they do not fit, and says how many are left"
      - test: apps/tedrisat/test/e2e/online-exams.e2e.spec.ts
        name: "shares the points left exactly, and refuses own points past 100"

  - id: exact-points-shown-with-two-decimals
    need: >-
      A shared point is kept exact and shown with two decimals ("1,94"), as is whether it is the question's own or shared; the editor
      shows the total, which is always 100. A talebe's score is reckoned from the exact points and rounded to two decimals once, so two
      talebe with the same answers always get the same score.
    evidence:
      - node: rowPoints
      - test: apps/tedrisat/test/e2e/online-exams.e2e.spec.ts
        name: "shares the points left exactly, and refuses own points past 100"
    missing: "MDRS-299: a share is kept exact, shown with two decimals and said to be its own or shared; the editor shows no total"
    note: "Owner, asked how to round: \"Kesin tut, 2 ondalık göster\"."

  - id: the-questions-at-a-glance
    need: >-
      The list of questions shows the start of each one's text, its topics, its points, how it is answered and whether it is complete,
      how many questions each topic has, and filters by topic, so the team sees which topics the exam covers and how much.
    evidence:
      - node: questionsTable
      - source: apps/nazar/features/online-exams/components/exam-editor.tsx
    missing: "MDRS-299: each question's row shows its text, topics, points, mode and whether it is complete; the count per topic and the filter by topic are not built"

  - id: removing-a-question-asks
    need: Removing a question asks first, and its points are shared again over the others.
    evidence:
      - state: removeAsk
      - node: removeDialog
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "deletes on the server a question taken off while it was being made"

  - id: saved-as-the-team-works
    need: >-
      The draft is saved as the team works, and the editor says when it was last saved; a closed page loses nothing. Two people
      editing the same exam are told when the other has changed it, and neither overwrites the other unseen.
    evidence:
      - node: savingLine
      - node: readAgainToast
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "shows a saved question at once, and sends it in the background"
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "keeps what was typed when the save fails, and offers it again"
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "brings back the questions not saved before a reload, to try again"
      - test: apps/nazar/test/exam-editor.spec.tsx
        name: "keeps a question being saved when the page is drawn again with a newer read"
    missing: "MDRS-299: the draft is written as the team works, kept in the browser when a write fails, and a change made by someone else is said and read again; the editor never says when it was last saved"
    note: >-
      Owner, 22 Nov 2026: "optimistic ui yok diyorum" (#409). Kept in the browser and offered again after a reload (#426); not started
      over when the router draws the page again after a session renewal (#428).

  - id: seen-as-a-talebe-sees-it
    need: >-
      The team sees the exam as a talebe will, the briefing with the zeroth question and the questions with options in a drawn order,
      with nothing saved and no clock running.
    evidence:
      - state: preview
      - node: previewNote
      - node: previewQuestion
    missing: "MDRS-299: the preview is not built"

  - id: copy-an-earlier-exam
    need: >-
      An earlier online exam of the same course can be copied into a new draft, with its topics, questions, points and zeroth
      question, and the editor asks the team to read the zeroth question again, since it changes from term to term.
    evidence:
      - state: readingCopies
      - state: copyPick
      - state: copying
      - node: copyDialog
    missing: "MDRS-299: copying an earlier exam is not built"
    note: "Owner, asked about reusing questions: \"Aynı dersin önceki sınavını kopyala\". A question bank and a file import come later."

  - id: changed-until-it-opens-and-never-after
    need: >-
      A scheduled exam can still be changed until it opens. Once it has opened, its questions, options, points, topics, zeroth question
      and length cannot be changed: the editor shows them read only, says why, and leads to the results.
    evidence:
      - test: apps/tedrisat/test/e2e/online-exam-publish.e2e.spec.ts
        name: "plans the celse at the start, with its exam row, and locks the exam"
    missing: "MDRS-299: a published exam is read only (EXAM_LOCKED) and is taken back to a draft until it opens; changing it in place while scheduled is not built"
    note: "Owner, asked whether a scheduled exam can be changed: \"Açılana kadar evet\"."

  - id: by-keyboard-and-screen-reader
    need: >-
      The editor can be used with the keyboard alone and with a screen reader: each field is named, the correct options are check boxes
      named by the option, the topics are check boxes, and what is missing or refused is said where it is and announced.
    evidence:
      - node: optionCorrect
      - node: questionTopicNumbers
    missing: "MDRS-299, EXM-EDIT-4, EXM-EDIT-5, EXM-EDIT-6: not walked with the keyboard alone or a screen reader; read from the code, the Doğru boxes and the rows' buttons are not named by what they act on, and a topic's pick is said by colour alone"
