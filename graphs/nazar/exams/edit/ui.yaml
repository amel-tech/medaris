rules:
  - { id: optimistic-editor, rule: "The editor saves in the background (#409, #410): a topic or a question shows at once, \"Kaydediliyor…\" says a write is on its way, the writes run in order and each names the version the one before handed back (exam-editor.tsx:278-284); nothing is disabled while they run, and leaving the page meanwhile asks first (exam-editor.tsx:178-183). A failed write keeps what was typed on its row, says \"Kaydedilemedi\" and offers \"Yeniden dene\"; a refused topic is the exception (EXM-EDIT-3)." }
  - { id: kept-in-the-browser, rule: "The questions not saved yet are kept in localStorage per exam and come back after a reload with an info toast (exam-editor.tsx:188-198); a save that names a Server Action a new version of Medaris no longer has says \"Medaris güncellendi\" with \"Yenile\" (#426, exam-editor.tsx:261-272). A newer read of the page, drawn again by the router after a save that renewed the session or after a refusal that reads again, is taken only when nothing is on its way and no question form is open (#428, exam-editor.tsx:220-238)." }
  - { id: no-default-length, rule: "A new draft has no length; \"Süre (dakika)\" is empty and required to publish (the owner, 22 Nov 2026). The three settings are saved by one \"Ayarları kaydet\" (a choice of the code)." }
  - { id: lacks-in-the-publish-section, rule: "A question that lacks its text, a second option, a correct one or a topic is saved all the same; its row says \"Eksik\" and the section Yayınla lists what each lacks by question number. Nothing is said at the question's fields and no focus moves (need what-a-question-lacks-is-said is missing for it)." }
  - { id: topics-by-number, rule: "Each topic of the course has a number, shown before its name (\"3. Kıyas\"). In a question, the team types the topics' numbers (\"3, 7\") instead of searching for them (the owner, 22 Nov 2026: \"Konuların konu numarası da olsun ismi ile beraber, hoca aramadan direk konunun numarasını girebilsin kolayca\"); the field names them under it, and saving the question picks them for the exam. A number with no topic is said at the field and Kaydet is off." }
  - { id: focus-not-decided, rule: "No code of the pages moves the focus: not on load, not when a question's form opens or closes, not after a refusal, not when the pressed row is taken off. The alert dialogs are the kit's AlertDialog, whose focus starts on Vazgeç (alert-dialog.tsx:70). So no state names a focus. Read from the code, not seen." }
  - { id: hadith-fixed, rule: "The hadith above the zeroth question is the same everywhere and no one edits it: the Arabic \"مَنْ غَشَّنَا فَلَيْسَ مِنَّا\", a constant of the code (ZEROTH_HADITH, features/settings/zeroth-question.ts:14), and its meaning \"Bizi aldatan bizden değildir.\" (Settings.zeroth.hadithMeaning). The owner, 22 Nov: \"Böyle kalsın\"." }
  - { id: arabic-runs, rule: "A question's or an option's text in Arabic only (no Latin letter) gets lang=\"ar\", dir=\"rtl\", the Arabic font, never under 1rem, its leading and its own isolation on the element itself (textProps, libs/tokens/arabic.js:72), as the Medaris design system says. A text with a Latin letter, whatever it starts with, is not one block and takes the interface's direction, not its first letter's as dir=\"auto\" would: its box states no dir and so takes the page's (paragraphDir, libs/tokens/arabic.js:61; features/online-exams/components/exam-editor.tsx:1418), left to right for a Turkish question even when it opens with a hadith, right to left on an Arabic interface; and each Arabic run in it, with the brackets and quotes around it (« », ( ), [ ], ‹ ›, “ ”, a touching straight quote; ﴿ ﴾ are Arabic already), gets the Arabic props on its own isolated right-to-left element (arabicRuns, libs/tokens/arabic.js:134; ArabicText, features/online-exams/components/arabic-text.tsx:15)." }
  - { id: points-exact, rule: "The page draws the shares with the API's rule, half up to two decimals, from the own points (sharesOf, online-exams.ts:139-155), and shows them with a Turkish decimal comma (\"1,94\"); it shows no total. An own point is typed with a comma or a point and at most two places, from 0,01 to 100." }
  - { id: MDRS-233, rule: "The toasts' close button is named by the literal aria-label 'Kapat' and their region by the literal 'Bildirimler' (libs/ui/src/mds/toast.tsx:97, 127), not by the catalog. Cross-cutting, the kit's." }
  - { id: EXM-EDIT-1, rule: "Every VALIDATION_ERROR is worded as the points' refusal, \"Puanı sıfırdan büyük, en çok 100 ve en çok iki ondalıklı bir sayı olarak yazın.\" (onlineExamErrorKey, online-exams.ts:53-54), whatever was sent: a new exam's title (new-exam-form.tsx:35), the settings, a question, a topic, the zeroth question (course-zeroth-section.tsx:60) and publishing (nazar.exams.publish). Fix: word VALIDATION_ERROR by the write it answers. Read from the code, not seen." }
  - { id: EXM-EDIT-2, rule: "A question someone else deleted answers QUESTION_NOT_FOUND, which is worded as \"Bir şeyler ters gitti\" (online-exams.ts:57-58) and does not read the page again (READS_AGAIN, online-exams.ts:87-92): the row stays \"Kaydedilemedi\", and \"Yeniden dene\" sends the same id and fails the same way every time. Fix: read the page again on QUESTION_NOT_FOUND, and offer the kept text as a new question. Read from the code, not seen." }
  - { id: EXM-EDIT-3, rule: "\"Konu ekle\" empties the two fields at once (exam-editor.tsx:887-888) and a refusal takes the chip off (exam-editor.tsx:528): a name refused as taken, as longer than three words or as a number taken is gone, and must be typed again from the toast's words. The editor's own rule is that a failed write keeps what was typed. Fix: give the name and the number back to the fields on a refusal. Read from the code, not seen." }
  - { id: EXM-EDIT-4, rule: "Each option's \"Doğru\" box is a Checkbox labelled \"Doğru\" (exam-editor.tsx:1196-1202), so every box of a question has the same accessible name and none says which option it marks; the option's field beside it is named \"<n>. şık\". Fix: name each box by its option, \"Doğru: 3. şık\". Read from the code, not seen." }
  - { id: EXM-EDIT-5, rule: "Each row's \"Düzenle\" and \"Sil\" have no name of their own (exam-editor.tsx:1069-1076): in a list of buttons a screen-reader user hears fifty \"Düzenle\" and fifty \"Sil\". Fix: an aria-label with the question's number, \"3. soruyu düzenle\". Read from the code, not seen." }
  - { id: EXM-EDIT-6, rule: "Whether a topic is picked for this exam is said by the chip's colour alone, brand or outline (exam-editor.tsx:902); its words and its delete button's name are the same either way. Fix: say it in words, or as a hidden text beside the chip. Read from the code, not seen." }
  - { id: EXM-EDIT-7, rule: "Only one question's form is open at a time (`editing`, exam-editor.tsx:164): pressing another row's \"Düzenle\", or \"Soru ekle\", while a form is open replaces it, and what was typed there is dropped without a word (exam-editor.tsx:500, 708). Fix: ask first, or keep the open form's text as an unsaved change. Read from the code, not seen." }
  - { id: EXM-EDIT-9, rule: "\"Yeni sınav\" and the zeroth question's \"Kaydet\" await their server action with no try/catch (new-exam-form.tsx:28-29, course-zeroth-section.tsx:84-85), and so does \"Medresenin sorusuna dön\" (course-zeroth-section.tsx:105): a call that never reaches the server, or a new version of Medaris deployed meanwhile, rejects, the button stays busy for good and nothing is said. The editor's writes catch the same failure and say \"Kaydedilemedi\" (exam-editor.tsx:260-275). Fix: catch it as the editor does. Read from the code, not seen." }
  - { id: EXM-EDIT-8, rule: "Two of the editor's sentences say sen where the others say siz: \"Kaydedilmemiş {count} soru geri getirildi; \\\"Yeniden dene\\\" ile kaydedebilirsin.\" (OnlineExams.restored) and \"Kaydetmek için sayfayı yenile.\" (OnlineExams.staleBody), beside \"Sınavın adı boş bırakılamaz.\" and the seçin of the rest. Fix: siz throughout. Read from the code, not seen." }
