# The screens of nazar.exams.edit: the course's Sınavlar page (/ders/<courseId>/sinavlar) with "Yeni sınav", its exams and the section
# "Sıfırıncı soru" with the course's own question's form, and a draft's page (/ders/<courseId>/sinavlar/<examId>) with its three
# sections, Ayarlar, Konular and the questions, a question's form in place of its row, the two alert dialogs that ask before a delete,
# the toasts that answer a write, and the page's refusal and failed read. Read from the code of MDRS-299 (#408 to #428) on 24 Nov 2026:
# apps/nazar/features/online-exams/components/exams-page.tsx, new-exam-form.tsx, course-zeroth-section.tsx, exam-page.tsx,
# exam-workspace.tsx, exam-editor.tsx, features/settings/components/zeroth-question-fields.tsx, and libs/ui/src/mds (field, input,
# textarea, checkbox, radio-group, badge, icon-button, alert-dialog, button, toast, system-state). The section "Yayınla" under the
# questions is nazar.exams.publish's. Nothing was seen in a browser by its writer: every behaviour is "from the code" unless a rule says
# otherwise.
#
# Words: every key that has no `composed.` or `planned.` prefix is copied letter for letter from libs/i18n/src/locales/tr/nazar.json
# (the key is the path under its root), except `Changes.note`, the one authored message of this catalog (the app has no one place that
# says what the editor's writes change). The `planned.Exams.*` keys are the plan's words of what is not built (copying an earlier exam,
# the preview, renaming a topic): those nodes are drawn only in the four states that are not built and draw something (copyPick,
# copying, renamingTopic, preview), which only missing needs name, and they carry no `source`. The `composed.*` keys are text the page
# builds in code; each has its code line here, and a placeholder the binding gives no sample for matches any text:
#   composed.Exams.title          "{title}"   an exam's title: the list's link and the exam page's h1 (exams-page.tsx:89, exam-page.tsx:57)
#   composed.Exams.text           "{text}"    a question's or an option's text, the zeroth question's and its options (exam-editor.tsx:1041,
#                                             1052; course-zeroth-section.tsx:180, 186)
#   composed.Exams.namedTopics    "{topics}"  the topics typed by number, "3. Kıyas · 7. Fiil cümlesi" (exam-editor.tsx:1276)
#   composed.Exams.hadith         the hadith, ZEROTH_HADITH (features/settings/zeroth-question.ts:14), a constant of the code, not a message
#   composed.Button.loading       "Yükleniyor" the busy button's hidden status, a default of the kit (libs/ui/src/mds/button.tsx:62)
#   composed.Toast.close          "Kapat"     the toast's close button, a literal of the kit (libs/ui/src/mds/toast.tsx:97)
