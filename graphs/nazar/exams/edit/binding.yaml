    as: muderris
    open: '{nazar}/ders/{xnEdMain.course}/sinavlar'
    vars:
      course: '{xnEdMain.course}'
      newTitle: Deneme sınavı xnEdMain
      zQuestion: Bu hadisi daha önce duydun mu?
