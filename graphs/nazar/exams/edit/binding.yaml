# nazar.exams.edit on the local stack: the Sınavlar page of a course the walk makes and the editor of a draft online exam on it, as
# the course's hoca (muderris), at http://localhost:4002.
#   node apps/engine/src/cli.ts replay graphs/nazar/exams/edit --bind graphs/nazar/exams/edit/binding.yaml --cover transitions --out <dir>
# NOT RUN: written without a replay. Every behaviour below is from the code, none seen in a browser.
#
# Each scenario makes its own course with helpers/course.mjs (published, in the seed's second köşk, the müderris as its hoca, one week
# of one celse, no talebe); all but `fresh` also make a draft with helpers/exams.mjs ("Deneme sınavı xnEqOld": 20 minutes, three
# complete questions "Soru n" in the topic "1. Deneme konusu", whose right option is "Doğru n", and the course's own zeroth question
# "Bu hadisi daha önce duydun mu?" with "Evet", "Hayır" and "Emin değilim"). The teardown removes the course, with every exam on it,
# the walk's own included. The scenarios on the draft share its tags (xnEdOld, xnEqOld): walks as one account go one at a time, and
# `make` removes what a crashed walk left. Tags begin with xn; none is the start of another.
#   fresh       the main story, on "Deneme dersi xnEdMain", which has no exam and no zeroth question: the course's own zeroth question
#               is written, "Yeni sınav" makes "Deneme sınavı xnEdMain", its length is saved, the topic "Deneme konusu xnEdMain" is
#               added, a question is written and saved, and the team turns to publishing. Its writes are also made to fail.
#   draft       the draft "Deneme sınavı xnEqOld": a question edited with points of its own (50, a second write), a question
#               deleted, the topic its questions carry refused, the settings saved and made to fail, then tried again.
#   twoRight    the same draft with a second right option in its first question (SQL in `setup`): "Cevaplama" is asked, and
#               "Çoklu seçim" asks "Puanlama".
#   noTitle, zeroMinutes   the same draft with its title cleared, or 0 typed as its length: the field says why, and nothing is sent.
#   badTopic, badPoints    a question with a topic number the course has not (99), or points that are not a number: the field says
#               why and Kaydet is off.
#   topicTaken, topicLong  "Deneme konusu" typed again, or a name of four words: tedrisat refuses it, the chip is taken off and the
#               name is gone (EXM-EDIT-3).
#   allPoints   100 own points for one question of three: nothing is left to share, so tedrisat refuses them (POINTS_OVER_TOTAL).
#   zerothEmpty the same course, its zeroth question's text cleared: "Soruyu yazın."
#   published   "Deneme sınavı xnEqLive", published two hours ahead: its page is nazar.exams.publish's, and the list leads to Sonuçlar.
#   shutOut     the seeded ders nazırı (dersNazir) with no code on "Deneme dersi xnEdShut": the Sınavlar page refuses her.
# Not bound, and why:
#   - the states that are not built (readingCopies, copyPick, copying, renamingTopic, preview), and COPY, RENAME_TOPIC, PREVIEW.
#   - FAIL.readAgain, FAIL.forbidden, FAIL.invalid, FAIL.mode and TOPIC_NUMBER_TAKEN of the writes: the page checks what it can before
#     it sends, and nothing on the stack makes tedrisat refuse in between (someone else's write, a grant taken away). FAIL.other of
#     each of the editor's writes is walked by aborting the page's server action in the browser (`fail: abort`): the toast says
#     "Kaydedilemedi". Not that of "Yeni sınav" and of the zeroth question's Kaydet: they do not catch an aborted call (EXM-EDIT-9).
#   - FAIL.gone and FAIL.other of the two reads, loadFailed's RETRY, and the exam's page refused (opening's FAIL.forbidden): a
#     person refused the list never sees an exam's link.
#   - removeAsk's CONFIRM on a question never saved: a new question's form drops it on Vazgeç before a row with "Sil" is drawn.
# What a walk leaves that its teardown cannot undo: the audit rows of the writes.
schema: delurio-graph/0
kind: binding
extends: ../../../bindings/local.nazar.binding.yaml
flow: nazar.exams.edit

browser: { width: 1440, height: 900 }

data:
  xnEdMain: { json: ../.local/made/xnEdMain.json }
  xnEdOld: { json: ../.local/made/xnEdOld.json }
  xnEqOld: { json: ../.local/made/xnEqOld.json }
  xnEdLive: { json: ../.local/made/xnEdLive.json }
  xnEqLive: { json: ../.local/made/xnEqLive.json }
  xnEdShut: { json: ../.local/made/xnEdShut.json }

samples:
  title: Deneme sınavı xnEqOld

