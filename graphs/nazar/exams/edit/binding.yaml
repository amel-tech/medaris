# What the walk types, from the scenario's vars; the presses are the nodes' own.
events:
  NAVIGATE: [{ goto: '{nazar}/bildirimler' }]
  TYPE_TITLE: [{ fill: { role: textbox, name: Yeni sınavın adı, value: '{newTitle}' } }]
  TYPE_ZEROTH:
    - fill: { role: textbox, name: Soru, value: '{zQuestion}', within: { role: form, name: Bu derse özel sıfırıncı soru } }
    - fill: { role: textbox, name: 1. seçenek, value: '{zOption1}' }
    - fill: { role: textbox, name: 2. seçenek, value: '{zOption2}' }
  TYPE_SETTINGS:
    - fill: { role: textbox, name: Sınavın adı, value: '{sTitle}' }
    - fill: { role: textbox, name: Süre (dakika), value: '{sMinutes}' }
  TYPE_TOPIC: [{ fill: { role: textbox, name: Konu (bir ile üç kelime), value: '{topicName}' } }]
  TYPE_QUESTION:
    - fill: { role: textbox, name: Soru, value: '{qText}', within: { role: form, name: '/^\d+\. soru$/' } }
    - fill: { role: textbox, name: 1. şık, value: '{qOption1}' }
    - fill: { role: textbox, name: 2. şık, value: '{qOption2}' }
    - fill: { role: textbox, name: Konu numaraları, value: '{qTopics}' }
    - fill: { role: textbox, name: Kendi puanı, value: '{qPoints}' }
  # the section "Yayınla" is under the questions, on the same page: the team turns to it
  PUBLISH: [{ waitText: Yayınla }]

# The writes are server actions: a POST to the page's own address (the list's, or the exam's; their reads are GETs with a query, so
# the anchored glob matches only the POST). The editor's writes run in its queue, so a step that writes twice (a new question is
# added, then saved, then given its points) makes one POST per state. `abort` makes the browser's fetch fail: the page keeps what was
# typed and says "Kaydedilemedi".
states:
  examsList: { url: '{nazar}/ders/*/sinavlar' }
  zerothForm: { url: '{nazar}/ders/*/sinavlar' }
  # no `fail` here: an aborted call is not caught by these two (EXM-EDIT-9), so the walk would wait on a button busy for good
  creating: { call: '{nazar}/ders/*/sinavlar' }
  savingZeroth: { call: '{nazar}/ders/*/sinavlar' }
  editor: { url: '{nazar}/ders/*/sinavlar/*' }
  questionForm: { url: '{nazar}/ders/*/sinavlar/*' }
  removeAsk: { url: '{nazar}/ders/*/sinavlar/*' }
  removeTopicAsk: { url: '{nazar}/ders/*/sinavlar/*' }
  savingSettings: { call: '{nazar}/ders/*/sinavlar/*', fail: { FAIL.other: abort } }
  addingTopic: { call: '{nazar}/ders/*/sinavlar/*', fail: { FAIL.other: abort } }
  removingTopic: { call: '{nazar}/ders/*/sinavlar/*', fail: { FAIL.other: abort } }
  addingQuestion: { call: '{nazar}/ders/*/sinavlar/*', fail: { FAIL.other: abort } }
  savingQuestion: { call: '{nazar}/ders/*/sinavlar/*', fail: { FAIL.other: abort } }
  settingPoints: { call: '{nazar}/ders/*/sinavlar/*', fail: { FAIL.other: abort } }
  removingQuestion: { call: '{nazar}/ders/*/sinavlar/*', fail: { FAIL.other: abort } }
  left: { url: '{nazar}/bildirimler' }
  publish_opened: { url: '{nazar}/ders/*/sinavlar/*', text: Yayınla }
  results_opened: { url: '{nazar}/ders/*/sinavlar/*/sonuclar' }

# What a write leaves: "Yeni sınav" makes the course's one exam.
effects:
  createOnlineExam:
    - run: [node, helpers/sql.mjs, "select count(*)::int as n from online_exams where course_id = '{course}'"]
      expect: '"n":1'

nodes:
  zerothShownText: { text: Bu hadisi daha önce duydun mu? }
  zerothShownOption: { role: listitem, within: { testId: course-zeroth } }
  zerothRemoveOption: { role: button, name: '/^\d+\. seçeneği kaldır$/', count: '{zRemovable}' }
  zerothBusy: { css: output, hasText: Kaydediliyor… }
  newExamBusy: { css: output, hasText: Yükleniyor }
  topicChip: { text: '/^\d+\. .+$/', within: { role: region, name: Konular } }
  rowMode: { text: '/^(Tek seçim|Çoklu seçim)/' }
  rowPoints: { text: '/puan · (eşit pay|kendi puanı)$/' }
  rowText: { text: '/^(Soru \d+|Soru metni yok\.)$/' }
  rowOption: { text: '/^(Doğru|Yanlış) \d+(-[ab])?$/' }
  rowCorrect: { text: Doğru, within: { role: region, name: '/^Sorular \(/' }, count: '{rightBadges}' }
  topicNumbersHelp: { text: '/^(\d+\. .+|Örneğin 3, 7)$/' }
  removeTopicX: { role: button, name: Kapat, within: { role: alertdialog, name: '/^\d+\. (?!soru silinsin).+ silinsin mi\?$/' } }
  removeTopicCancel: { role: button, name: Vazgeç, within: { role: alertdialog, name: '/^\d+\. (?!soru silinsin).+ silinsin mi\?$/' } }
  removeTopicConfirm: { role: button, name: Sil, within: { role: alertdialog, name: '/^\d+\. (?!soru silinsin).+ silinsin mi\?$/' } }
  removeX: { role: button, name: Kapat, within: { role: alertdialog, name: '/^\d+\. soru silinsin mi\?$/' } }
  removeCancel: { role: button, name: Vazgeç, within: { role: alertdialog, name: '/^\d+\. soru silinsin mi\?$/' } }
  removeConfirm: { role: button, name: Sil, within: { role: alertdialog, name: '/^\d+\. soru silinsin mi\?$/' } }
  toastClose: { role: button, name: Kapat, within: { role: region, name: Bildirimler } }
