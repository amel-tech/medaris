edges:
  - { labelledBy: [closeDialog, closeTitle] }
  - { labelledBy: [releaseDialog, releaseTitle] }
  - { triggers: [openTalebe, readingAnswers] }
  - { triggers: [releaseButton, confirmRelease] }
  - { triggers: [releaseConfirm, releasing] }
  - { triggers: [closeEarlyButton, closeAsk] }
  - { triggers: [closeConfirm, closingEarly] }
  - { triggers: [backToResults, opening] }

rules:
  - { id: focus-not-decided, rule: "No code of these pages moves the focus: not on load, not after the release or the close, when the pressed button is replaced by a badge or is gone. The two alert dialogs are the kit's AlertDialog, whose focus starts on Vazgeç (alert-dialog.tsx:70); where it goes when they close was not verified. So no state names a focus. Read from the code, not seen." }
  - { id: release-while-open, rule: "Drawn, not decided by the owner: 'Sonuçları talebelere aç' is on whenever the person may release and the exam celse has its Değerlendirme row (exam-results.service.ts:267), whatever the exam's time, as Değerlendirme's button is (releaseExamResults checks no time). The question then says how many talebe are still in it; a talebe who finishes after the release reads their score at once, and the answers with the correct ones only once the exam has closed for everyone (getMyExamResult)." }
  - { id: release-asks-first, rule: "The release asks once, with what it does and that it cannot be undone (need release-the-results). Değerlendirme releases with one press today (nazar.evaluation.examScores, finding F-D1-28); the two should end up the same." }
  - { id: live-refresh, rule: "While the read says the exam has not closed for everyone the page reads getOnlineExamResults again every 30 seconds (RESULTS_REFRESH_MS, results-view.tsx:21) and says so in a polite live line; a refresh never moves the focus or the scroll, and the counts sentence is not a live region." }
  - { id: zeroth-no-score, rule: "The zeroth answer is shown as the option chosen and its counts, with a note that it has no right or wrong answer and no part in the score: no colour, no tick and no cross marks one. The team reads its own talebe's answers; Medaris management reads them only in aggregate (nizam.exams.zerothAnswers), where a count under five is hidden." }
  - { id: arabic-runs, rule: "On the results page a question's or an option's text only gets dir=\"auto\" (results-view.tsx:416, 422). On a talebe's page a text that starts in Arabic gets lang=\"ar\", dir=\"rtl\", the Arabic font, never under 1rem, and its leading on the element itself (textProps, features/online-exams/arabic.ts:27-33); a text that starts in another script gets dir=\"auto\"." }
  - { id: MDRS-233, rule: "The toasts' close button is named by the literal aria-label 'Kapat' and their region by the literal 'Bildirimler' (libs/ui/src/mds/toast.tsx:97, 127), not by the catalog. Cross-cutting, the kit's." }
  - { id: EXM-RSLT-1, rule: "A scheduled exam has a results page: the exam's page and the Sınavlar list link to it for every status but a draft (exam-page.tsx:58, exams-page.tsx:97). There, before anyone can have started, the page says \"Sınav sürüyor; bu sayfa kendiliğinden yenilenir.\" (results-view.tsx:104, 295: `open` is only `!closed`) and offers \"Sonuçları talebelere aç\" (results-view.tsx:327; `releasable` is `lessonExamId !== null`, exam-results.service.ts:267), so results can be released for an exam that has not opened. Fix: word the scheduled state apart, and offer the release only once the exam has opened. Read from the code, not seen." }
  - { id: EXM-RSLT-2, rule: "A refresh that fails is dropped without a word (results-view.tsx:109-111): an ended session or a grant taken away leaves the page showing an old read while it says it refreshes itself, and the next write is the first to tell. Fix: say that the page could not be read again, and send an unauthenticated read to sign in as the writes do. Read from the code, not seen." }
  - { id: EXM-RSLT-3, rule: "Scores and points are shown as the API gives them, with a decimal point: \"82.50\" in the table and \"Puan: 82.50 / 100\", \"2.00 puan\", \"Sınıf ortalaması: 71.40 / 100\" (results-view.tsx:230, 310, 410; talebe-answers-view.tsx:60, 126), where the editor writes \"1,94\" with a Turkish comma (format.number). Fix: format the strings with the locale's number format. Read from the code, not seen." }
  - { id: EXM-RSLT-4, rule: "What the needs ask and the pages do not draw: the talebe's page says nothing of when the attempt started or was handed in (talebe-answers-view.tsx:43-80); the table of the talebe does not sort (results-view.tsx:343, no `sort` passed to the kit's Table); a topic has no view of its questions and of the talebe from the weakest to the strongest (results-view.tsx:353-392 lists each topic's average and question count only); the release line says when, not by whom (results-view.tsx:322). Needs every-talebe-and-where-they-are, the-topics-across-the-talebe, a-talebe-s-attempt and release-the-results are missing for it. Read from the code, not seen." }
