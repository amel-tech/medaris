# The screens of nazar.exams.results: the exam's Sonuçlar page (/ders/<courseId>/sinavlar/<examId>/sonuclar) with its counts, its
# tables, "Sınavı erken bitir", "Sonuçları talebelere aç", their two alert dialogs and the toasts that answer them, and a talebe's
# answers page under it (sonuclar/<talebeId>). Read from the code of MDRS-299 (#417, #423) on 24 Nov 2026:
# apps/nazar/features/online-exams/components/results-page.tsx, results-view.tsx, talebe-answers-page.tsx, talebe-answers-view.tsx, and
# libs/ui/src/mds (alert-dialog, toast, table, badge, button, alert). Nothing was seen in a browser by its writer: every behaviour is
# "from the code" unless a rule says otherwise.
#
# Words: every key that has no `composed.` prefix is copied letter for letter from libs/i18n/src/locales/tr/nazar.json (the key is the
# path under its root), except `Changes.note`, the one authored message of this catalog (the app has no one place that says what a
# release and an early close change). The `composed.*` keys are text the page builds in code from data; each has its code line here,
# and a placeholder the binding gives no sample for matches any text:
#   composed.ExamResults.name         "{name}"    a talebe's name; ExamResults.unnamed when there is none (results-view.tsx:211, 214)
#   composed.ExamResults.score        "{score}"   the API's score as it comes, "87.50" with a point (results-view.tsx:230; EXM-RSLT-3)
#   composed.ExamResults.count        "{count}"   a number of answers or of questions, String(n) (results-view.tsx:193, 387)
#   composed.ExamResults.switchTimes  "{times}"   the switches' times, each HH:mm:ss, joined by ", " (results-view.tsx:262)
#   composed.ExamResults.zerothOption "{option}"  the zeroth option a talebe chose (results-view.tsx:275)
#   composed.ExamResults.text         "{text}"    a question's or an option's text, or the zeroth question (results-view.tsx:417, 446;
#                                                 talebe-answers-view.tsx:132, 148)
#   composed.ExamResults.examTitle    "{title}"   the exam's title under a talebe's name (talebe-answers-page.tsx:70)
#   composed.ExamResults.answer       "{answer}"  the zeroth option the talebe chose, on their page (talebe-answers-view.tsx:76)
#   composed.Toast.close              "Kapat"     the toast's close button, a literal of the kit (libs/ui/src/mds/toast.tsx:97)
