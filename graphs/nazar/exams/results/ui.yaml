rules:
  - { id: focus-not-decided, rule: "No code of these pages moves the focus: not on load, not after the release or the close, when the pressed button is replaced by a badge or is gone. The two alert dialogs are the kit's AlertDialog, whose focus starts on Vazgeç (alert-dialog.tsx:70); where it goes when they close was not verified. So no state names a focus. Read from the code, not seen." }
  - { id: release-ends-the-exam, rule: "The owner's, 24 Nov 2026 (\"Önerini uygula\"): releasing an online exam's results ends it for everyone, in the release's transaction, as Sınavı erken bitir does (ExamResultsService.closingForRelease, exam-results.service.ts:429; ExamRepository.release, exam.repository.ts:319): each attempt in progress ends with the answers saved so far, the exam is closed early at the release's time and no one starts it any more, so each talebe reads their answers with the correct ones at once (getMyExamResult). An exam that has closed for everyone already keeps its close as it was. 'Sonuçları talebelere aç' is offered once the exam has opened (hasOpened, results-view.tsx:76: closed for everyone, or open to an early close), and tedrisat refuses it before (EXAM_NOT_OPEN, exam-results.service.ts:436). The question says the release ends the exam while it has not closed, and, while talebe are taking it, '{inProgress} talebenin sınavı devam ediyor' (the owner: never 'talebe sınavda', which reads as failing it). The page shows the exam over at once, as for the early close, and reads the scores after (results-view.tsx:165-191). Read from the code and the specs; not walked." }
  - { id: release-asks-first, rule: "The release asks once, with what it does and that it cannot be undone (need release-the-results). Değerlendirme asks the same on an online exam's column since 24 Nov 2026, in these words (releaseConfirmTitle, releaseEndsExam, releaseConfirmBody; nazar.evaluation.examScores, state confirmRelease, evaluation-board.tsx:663-678), because there too the release ends the exam for everyone (rule release-ends-the-exam); it cannot say how many talebe's exams are still going on, and says that the release ends the exam whether or not it still goes on. A refusal before the exam opens says why there too (EXAM_NOT_OPEN, evaluation-board.tsx:172-175). A written or oral exam's column still releases with one press (finding F-D1-28)." }
  - { id: live-refresh, rule: "While the read says the exam has not closed for everyone the page reads getOnlineExamResults again every 30 seconds (RESULTS_REFRESH_MS, results-view.tsx:23) and says so in a polite live line; a refresh never moves the focus or the scroll, and the counts sentence is not a live region." }
  - { id: zeroth-no-score, rule: "The zeroth answer is shown as the option chosen and its counts, with a note that it has no right or wrong answer and no part in the score: no colour, no tick and no cross marks one. The team reads its own talebe's answers; Medaris management reads them only in aggregate (nizam.exams.zerothAnswers), where a count under five is hidden." }
  - { id: arabic-runs, rule: "On the results page and on a talebe's page a question's text is drawn by the Arabic text standard (ArabicText, features/online-exams/components/arabic-text.tsx:15; results-view.tsx:438-439), and an option's line, composed with its count, gets the direction of the option's text (results-view.tsx:444). A text in Arabic only (no Latin letter) gets lang=\"ar\", dir=\"rtl\", the Arabic font, never under 1rem, and its leading on the element itself (textProps, libs/tokens/arabic.js:72); a text with a Latin letter, whatever it starts with, takes the interface's direction (paragraphDir, libs/tokens/arabic.js:61) and draws each Arabic run, its brackets and quotes with it, on its own isolated right-to-left element (arabicRuns, libs/tokens/arabic.js:134)." }
  - { id: MDRS-233, rule: "The toasts' close button is named by the literal aria-label 'Kapat' and their region by the literal 'Bildirimler' (libs/ui/src/mds/toast.tsx:97, 127), not by the catalog. Cross-cutting, the kit's." }
  - { id: EXM-RSLT-1, rule: "A scheduled exam has a results page: the exam's page and the Sınavlar list link to it for every status but a draft (exam-page.tsx:58, exams-page.tsx:97). There, before anyone can have started, the page says \"Sınav sürüyor; bu sayfa kendiliğinden yenilenir.\" (results-view.tsx:116, 310: `open` is only `!closed`). Fix: word the scheduled state apart. Read from the code, not seen. Its release part is fixed in the code of this branch (24 Nov 2026), read from the code and the specs and not walked: 'Sonuçları talebelere aç' is offered only once the exam has opened (results-view.tsx:344), and the API refuses the release before (EXAM_NOT_OPEN, exam-results.service.ts:436). It was: the button was offered whatever the exam's time (`releasable` is `lessonExamId !== null`, exam-results.service.ts:288), and the API released an exam that had not opened." }
  - { id: EXM-RSLT-2, rule: "A refresh that fails is dropped without a word (results-view.tsx:121-123): an ended session or a grant taken away leaves the page showing an old read while it says it refreshes itself, and the next write is the first to tell. Fix: say that the page could not be read again, and send an unauthenticated read to sign in as the writes do. Read from the code, not seen." }
  - { id: EXM-RSLT-3, rule: "Scores and points are shown as the API gives them, with a decimal point: \"82.50\" in the table and \"Puan: 82.50 / 100\", \"2.00 puan\", \"Sınıf ortalaması: 71.40 / 100\" (results-view.tsx:247, 327, 427; talebe-answers-view.tsx:61, 125), where the editor writes \"1,94\" with a Turkish comma (format.number). Fix: format the strings with the locale's number format. Read from the code, not seen." }
  - { id: EXM-RSLT-4, rule: "What the needs ask and the pages do not draw: the talebe's page says nothing of when the attempt started or was handed in (talebe-answers-view.tsx:44-79); the table of the talebe does not sort (results-view.tsx:360, no `sort` passed to the kit's Table); a topic has no view of its questions and of the talebe from the weakest to the strongest (results-view.tsx:370-409 lists each topic's average and question count only); the release line says when, not by whom (results-view.tsx:339). Needs every-talebe-and-where-they-are, the-topics-across-the-talebe, a-talebe-s-attempt and release-the-results are missing for it. Read from the code, not seen." }
