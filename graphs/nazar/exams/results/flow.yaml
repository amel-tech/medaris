# The course team's screens of an open or past online exam in nazar-web: who took it, the scores, the topics, the questions, each
# talebe's answers, closing early, and releasing the results to the talebe. BUILT (MDRS-299, #417, #423): the exam's "Sonuçlar" page
# (/ders/<courseId>/sinavlar/<examId>/sonuclar, features/online-exams/components/results-view.tsx) and each talebe's page under it
# (sonuclar/<talebeId>); its actions are getOnlineExamResults, getOnlineExamTalebeAnswers and closeOnlineExamEarly of
# domain/online-exams.yaml, and the existing releaseExamResults. Written graph-first on 21 November 2026; `status: proposed`.
#
# The owner's words this flow carries:
#   - 21 Nov: "geçmiş sınavlar hakkında kendilerine özel ekranları da görebilecekler"; "konulara göre talebe hangi konularda ne durumda
#     olduğunu görebilecek" (here, the team sees the same by talebe and by topic); the switches, "Evet, sayı ve zaman".
#   - 22 Nov: those who prepare the exam see its results, "görebilsin, soruları hazırlayanlar için değerli olabilir sonraki hazırlamada"
#     (the read asks exam.prepare); the release stays with releaseExamResults (session.manage, mayRelease).
#   - 22 Nov: "sınav sonuçlarında talebeye tıklayıp hangi soruya ne cevap verdiğini ayrıca görebilmek lazım": a talebe's name opens
#     their answers, question by question (talebeDetail).
#
# Choices made in the code that are not his: the release asks once; the page reads again every 30 seconds while the exam is open;
# Değerlendirme keeps whole scores (87.50 is written as 88; the page shows the exact score); a result the team entered by hand is never
# replaced; closing early asks exam.prepare; the talebe's page lists the questions in the exam's order, not the talebe's.
schema: delurio-graph/0
kind: flow
id: nazar.exams.results
status: proposed
domain: medaris.api
ui: nazar.exams.results
title: Read an exam's results and release them
summary: >-
  The team opens an open or past exam from Sınavlarım. The overview lists every talebe of the course with where they are (not
  started, in progress, handed in, ended by the time), the score out of 100, the right, wrong and blank answers, the switches
  counted, and the answer to the zeroth question; it shows the average of each topic and the share of talebe right on each question.
  A talebe opens their attempt question by question; a question opens which options were chosen how often. The scores stand in
  Değerlendirme too, and "Sonuçları talebelere aç" releases them, after one question, after which the talebe read their own screen
  (tedris.exams.result).
scope:
  shows: the team's screens of one exam in nazar-web
  world: open
  outOfView:
    - "Sınavlarım, where the exam is opened from: nazar.exams.mine"
    - "closing an open exam early, and taking it back: nazar.exams.publish"
    - "Değerlendirme, where the same scores stand beside the course's other exams and can be released too: nazar.evaluation.examScores"
    - "a read that fails outright and an ended session (the page then says it could not be read, or sends the person to sign in: realm.auth.signIn)"
context:
  attempts:
    values: [none, some]
    initial: any
    say:
      none: no talebe has started the exam
      some: at least one talebe has started it
  exam:
    values: [open, closed]
    initial: any
    say:
      open: talebe can still start it or are still in it
      closed: the exam has closed for everyone
  results:
    values: [closed, opened]
    initial: any
    say:
      closed: the results are not released yet
      opened: the results are released to the talebe
  mayRelease:
    values: [yes, no]
    initial: any
    say:
      yes: the person may release the results (session.manage on the course, as releaseExamResults asks)
      no: the person prepares the course's exams (exam.prepare) but may not release their results
  toast:
    values: [none, released, refused, failed]
    initial: none
    say:
      none: no toast
      released: the toast says the results were released
      refused: the release was refused
      failed: the release could not be done
guards:
  stillOpen: "exam == 'open'"
  notReleased: "results == 'closed'"
  releasable: "results == 'closed' and mayRelease == 'yes'"
effects:
  clearToast: { set: { toast: none } }
  releasedNow: { set: { results: opened, toast: released } }
  toastRefused: { set: { toast: refused } }
  toastFailed: { set: { toast: failed } }
  attemptsMove: { havoc: [attempts, exam, results] }
  releaseUnsure: { havoc: [results], set: { toast: none } }
failures:
  opening:
    from: getOnlineExamResults
    forbidden: [AUTHZ_FORBIDDEN]
    gone: [EXAM_NOT_FOUND]
  releasing:
    from: releaseExamResults
    forbidden: [AUTHZ_FORBIDDEN]
    unsure: [network, timeout, 5xx]
    other: [EXAM_NOT_FOUND, LESSON_NOT_FOUND, COURSE_NOT_FOUND]
main:
  given: { attempts: some, exam: closed, results: closed, mayRelease: yes }
  events: [DONE, RELEASE, CONFIRM, DONE]
initial: opening
states:
  opening:
    title: The exam's results are read
    description: >-
      The action getOnlineExamResults, GET /online-exams/{examId}/results: every talebe with a seat in the course and where they
      are, the scores, the switches with their times, the zeroth answers, and over them all the counts, the topics and the questions.
      To a person outside the course team the exam's results are not there: the API refuses them. The read also says whether the
      results are released (by this page or by Değerlendirme), and whether the person may release them. The screens of a talebe, a
      topic and a question are drawn from this one read; nothing else is called.
    invoke: { action: getOnlineExamResults }
    on:
      DONE: loaded
      FAIL.forbidden: forbidden
      FAIL.gone: notFound
  loaded:
    title: The page is drawn as the read says
    description: A step with no screen of its own.
    always:
      - { guard: "attempts == 'none'", target: empty, say: "no talebe has started it" }
      - { target: overview, say: "attempts are read" }
  forbidden:
    title: Not allowed
    description: >-
      The page's own refusal, "Bu sayfaya izniniz yok": exam.prepare is not held on the course. Reached by an address typed or kept by
      someone outside the team, or by a person whose grant ended since Sınavlarım was read.
    by: human
    on:
      NAVIGATE: left
  notFound:
    title: No such exam
    description: The celse is not an online exam, or no longer one; the page says the exam was not found.
    by: human
    on:
      NAVIGATE: left
  empty:
    title: No attempt yet
    description: >-
      The page says no talebe has started the exam, and lists the course's talebe as not started. While the exam is open it is read
      again, so the first start shows.
    by: human
    on:
      REFRESH: { guard: stillOpen, target: opening, effect: [attemptsMove], say: "the exam is open: the page reads it again a little later" }
      NAVIGATE: left
  overview:
    title: The exam's results
    description: >-
      Every talebe of the course with where they are, the score, the right, wrong and blank answers, the switches counted and the
      answer to the zeroth question; the average of each topic; the share of talebe right on each question, and how the zeroth question
      was answered. While the exam is open, it is read again as attempts move. "Sonuçları talebelere aç" until the results are
      released, and after it when and by whom they were.
    by: human
    goal: true
    on:
      SORT: { target: overview, say: "they sort the talebe by another column: nothing is read again" }
      OPEN_TALEBE: { target: talebeDetail, effect: [clearToast], say: "they open a talebe's attempt" }
      OPEN_TOPIC: { target: topicDetail, effect: [clearToast], say: "they open a topic" }
      OPEN_QUESTION: { target: questionDetail, effect: [clearToast], say: "they open a question" }
      RELEASE: { guard: releasable, target: confirmRelease, effect: [clearToast], say: "they press Sonuçları talebelere aç" }
      REFRESH: { guard: stillOpen, target: opening, effect: [attemptsMove, clearToast], say: "the exam is open: the page reads it again a little later" }
      NAVIGATE: left
  talebeDetail:
    title: A talebe's answers
    description: >-
      A page of its own (sonuclar/<talebeId>), read with getOnlineExamTalebeAnswers, GET /online-exams/{examId}/results/{userId}: each
      question in the exam's order with its options, the talebe's choice marked "✓ (seçtiği)", the correct one with the "Doğru" badge,
      "Atladı, boş kaldı" or "Boş bıraktı", and the points got; their answer to the zeroth question; how the attempt ended; each switch
      with its time. Only a talebe who started has the link; one with no attempt or no seat is not found.
    by: human
    on:
      BACK: overview
      NAVIGATE: left
  topicDetail:
    title: A topic
    description: The topic's questions, the average share of points got, and the talebe from the weakest in it to the strongest.
    by: human
    on:
      BACK: overview
      NAVIGATE: left
  questionDetail:
    title: A question
    description: >-
      The question with its options, how often each option was chosen and how many left it blank, so that a question that misled is
      found.
    by: human
    on:
      BACK: overview
      NAVIGATE: left
  confirmRelease:
    title: Sonuçlar talebelere açılsın mı?
    description: >-
      One question before the release: every talebe will read their score and their standing in the topics, and is told; the release
      cannot be undone. While the exam is open it also says how many talebe are still in it.
    by: human
    on:
      CONFIRM: { target: releasing, say: "they press Sonuçları aç" }
      CANCEL: { target: overview, say: "they press Vazgeç" }
  releasing:
    title: Release the results
    description: >-
      The existing action releaseExamResults, POST /lessons/{id}/exam-results/release, the one Değerlendirme calls: the first call sets
      resultsReleasedAt and tells the course's enrolled talebe; a repeat changes nothing. The button is busy while it runs.
    invoke: { action: releaseExamResults }
    on:
      DONE: { target: released, effect: [releasedNow], say: "the results are released" }
      FAIL.forbidden: { target: overview, effect: [toastRefused], say: "the release is refused: nothing is released" }
      FAIL.unsure: { target: opening, effect: [releaseUnsure], say: "no answer came: the release may have been done, so the page reads the exam again and says what it holds" }
      FAIL.other: { target: overview, effect: [toastFailed], say: "the release could not be done: nothing is released" }
  released:
    title: The results are released
    description: >-
      After a question that says the talebe will read their scores, the results are released, once and for all; the page says when
      and by whom.
    always:
      - { target: overview, say: "the overview says the results are released" }
  left:
    title: The person left the page
    type: final
    leavesPage: true
