  sidebar: { type: page, component: Page, role: complementary, in: [wide, picking, kept], source: libs/ui/src/mds/app-shell.tsx:81 } # an <aside> with no name that wraps the primary <nav> (F-L-2); hidden below 768 px
  mainPage: { type: page, component: Page, role: main, in: [wide, picking, kept, bar], source: libs/ui/src/mds/app-shell.tsx:41 } # <main id="main">: no name, no initialFocus (rule focus-not-set), no skip link points at it (F-L-1)
  menuNav: { type: page, component: Page, role: navigation, name: { key: Shell.navLabel }, in: [wide, picking, kept, sheet, sheetPicking], source: libs/ui/src/mds/app-shell.tsx:98 } # the sidebar's, or the sheet's (app-bar.tsx:92): one is visible at a time

  # ---- the phone's bar -------------------------------------------------------------------------------------------------------------
  appBar: { type: page, component: Page, role: banner, in: [bar], source: libs/ui/src/mds/app-bar.tsx:63 } # <header class="mds-appbar">, drawn below 768 px only
  menuButton: { type: action, component: Button, role: button, intent: secondary, name: { key: Shell.menu }, in: [bar], emits: OPEN_SHEET, source: libs/ui/src/mds/app-bar.tsx:64 } # an icon named by its aria-label; the sheet's trigger and the node the focus returns to
  barTitleMedrese: { type: text, component: Text, text: { key: Nav.general.pano }, in: [bar], when: "scope == 'medrese' and place == 'home'", source: apps/nazar/features/shell/components/portal-menu.tsx:78 } # a <p>, not a heading: the active item's label
  barTitleCourse: { type: text, component: Text, text: { key: Nav.ders.overview }, in: [bar], when: "scope == 'ders' and place == 'home'", source: apps/nazar/features/shell/components/portal-menu.tsx:78 }
  barTitleNotifications: { type: text, component: Text, text: { key: Nav.general.notifications }, in: [bar], when: "place == 'notifications'", source: apps/nazar/features/shell/components/portal-menu.tsx:78 }
  bell: { type: action, component: LinkButton, role: link, name: { key: Shell.bell }, in: [bar], emits: PICK_NOTIFICATIONS, source: apps/nazar/features/shell/components/portal-menu.tsx:90 } # an icon, no visible number (shell#7); "Bildirimler, {count} okunmamış" while something is unread (out of view)

  # ---- the sheet: a Base UI dialog; the page behind it is inert, so nothing of the bar or the page is listed here ----------------------
  sheet: { type: page, component: Page, role: dialog, name: { key: Shell.navLabel }, in: [sheet, sheetPicking], initialFocus: sheetClose, source: libs/ui/src/mds/app-bar.tsx:78 } # aria-label "Ana menü", the same words as the <nav> inside it (F-L-3)
