# The screens of nazar.shell.scopeAndMenu: nazar-web's frame (apps/nazar/features/shell, libs/ui/src/mds/app-shell.tsx and app-bar.tsx),
# in the sidebar and on the phone's bar and sheet, with the scope picker closed and opened and the menu of a medrese and of a course.
# The page under the frame is not drawn: its `<main>` is the one node of it, with no name and no focus.
#
# Words: every `Shell.*`, `Nav.*`, `Roles.*` and `Account.*` key is copied from libs/i18n/src/locales/tr/nazar.json (the app reads it as
# `nazar.<key>`), the key being the path inside that file. Three messages are built in code and are in no i18n file, so they are
# `composed.*`, each with its code line:
#   composed.Shell.scopeName     "{name}"            the scope's name in the picker's card and in a row (scope-picker.tsx:67, <bdi>)
#   composed.Shell.courseDetail  "{role}·{kosk}"     the second line of a course's row: the role and the köşk, the dot a separate aria-hidden
#                                                    span (scope-option.ts:22, scope-picker.tsx:70, libs/ui/src/mds/locale.tsx:64)
#   composed.Shell.personName    "{person}"          the person's name in the row at the foot (user-row.tsx:34, <bdi>)
# The samples are the seed's own names (STACK.md) for the page and the video: the medrese, the başmüderris, the köşk. The replay reads
# the binding's `samples`, not these, so a node whose whole text is a placeholder is found by a locator of the binding (a name that a
# walk makes, a course "Deneme dersi scopeA", or that differs by person, is found there with a pattern).
# `changes` is absent on purpose: the flow invokes one read and nothing that writes (the cookie is the browser's, not an action).
schema: delurio-graph/0
kind: ui
id: nazar.shell.scopeAndMenu
flow: nazar.shell.scopeAndMenu
status: captured
catalog: catalog/tr.json
locales: [tr]
samples:
  name: Hadis ve Siyer Medresesi
  person: Nuri Başmüderris
  role: Hoca
  kosk: Süleymaniye Köşkü

focus:
  kept: pickerButton # Esc closes the popup and Base UI's menu returns the focus to its trigger (shell#1 a8; not seen here)

nodes:
