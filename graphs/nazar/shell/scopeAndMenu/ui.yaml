edges:
  - { labelledBy: [groupMedrese, groupMedreseLabel] }
  - { labelledBy: [groupCourses, groupCoursesLabel] }
  - { triggers: [pickerButton, picking] }
  - { triggers: [pickerButton, sheetPicking] }
  - { triggers: [menuButton, sheet] }
  - { returnsFocus: [sheet, menuButton] } # Esc and "Kapat" give the focus back to the trigger, as Base UI's dialog does; a followed link leaves the page, so the focus is on the body there

rules:
  - { id: F-L-1, rule: "There is no skip link: <main id=\"main\"> exists and nothing points at it (libs/ui/src/mds/app-shell.tsx:41; grep finds none in libs/ui or apps/nazar). A keyboard or screen-reader user passes the brand, the theme toggle, the picker and 9 to 15 menu links on every page load. Fix: a first-child <a href=\"#main\"> in AppShell, visible on focus, and tabIndex -1 on the main." }
  - { id: F-L-2, rule: "The sidebar is an <aside> (a complementary landmark) with no accessible name, and it wraps the primary <nav aria-label=\"Ana menü\">: the landmark list reads complementary (unnamed) then navigation (libs/ui/src/mds/app-shell.tsx:81-103). Fix: make it a <div> or a <header>, or name it." }
  - { id: F-L-3, rule: "The phone sheet's dialog and the <nav> inside it carry the same name, \"Ana menü\" (libs/ui/src/mds/app-bar.tsx:78 and :92): a screen reader says \"Ana menü, dialog … Ana menü, navigation\". shell#5 a2 depends on the dialog's name. Fix: name the dialog \"Menü\" (the menuLabel) and keep the nav \"Ana menü\"." }
  - { id: F-L-4, rule: "No menu entry can reach the placeholder page any more: every segment of both menus has a route folder of its own (7 of the medrese, 12 of the course) and a static folder wins over [bolum], so PlaceholderPage and Shell.placeholder (\"Bu sayfa henüz hazır değil.\") are dead code and an unknown segment is a 404. shell#4 a3 asserts the placeholder for İtirazlar and cannot hold; the graph carries the entry as the link it is. Fix: delete the placeholder and fix shell#4 (keep its 404 half)." }
  - { id: F-L-5, rule: "e2e/shell.e2e.ts:49-63 lists 13 course entries (DERS_ITEMS). The code draws 15 for a hoca and 12 for a ders nazırı with no grant (Ödevler, Değerlendirme and Ders destesi are cut by permission: nav.ts:115-134), and 13 with session.manage. shell#2 a3, shell#6 a1 and shell#9 a1 compare against a list that matches no person; the graph draws the code's lists. Fix: make the expectation per person." }
  - { id: F-L-6, rule: "The toast region is named \"Bildirimler\" in a hard-coded string (libs/ui/src/mds/toast.tsx:127-131), the same word as the menu entry and the bell, so a reader hears one name for two things; its \"Kapat\" is hard-coded too. A locator for the link \"Bildirimler\" must say it is a link. Not drawn (no toast in this flow)." }
  - { id: F-L-14, rule: "With one scope the picker is a plain card whose imam star is an interactive Popover button, with two or more it is a menu button and the star is no longer interactive (scope-picker.tsx:100-111, 134-137): the same person has a different control according to how many scopes they hold. Acceptable; drawn as `pickerCard` and `pickerButton`, which the guard `pickerMenu` tells apart." }
  - { id: F-L-19, rule: "Four assertions of the shell e2e are stale and are not carried as they stand: shell#2 a3, shell#4 a3, shell#6 a1 and shell#9 a1 (F-L-4, F-L-5). shell#9 also expects the ders nazırı's account to hold nothing; the stack's seed gives her three grants, so the walk makes the bare post itself." }
  - { id: F-L-20, rule: "The menu draws entries whose page then refuses: for a medrese nazır with no grant all nine (MDRS-223), for a hoca Yasaklamalar (F-D2c-3), for a ders nazırı with no grant Ders nazırları and Ders ayarları (F-D2c-2) and most of the rest; only Ödevler, Değerlendirme and Ders destesi are filtered by a permission (nav.ts:115-134). The nav check reports the same as `menu-refused`; its `link-refused` is another case, a link inside Genel bakış (the \"Sıradaki celse\" box sends a ders nazırı without session.manage to Celseler, which refuses her), and nazar.course.overview draws it. Fix: give every entry the permission its page asks (decision D1)." }
  - { id: MDRS-223, rule: "A medrese nazır with no grant is offered every medrese entry and each opens \"Bu sayfaya izniniz yok\" (the role matrix gives MEDRESE_NAZIR no default permission). His badge count is refused as well, so Dersler carries no number and no alert (shell#8 a2-a3). Tracked by MDRS-223." }
  - { id: SCOPE-1, rule: "The picker's rows are Menu.LinkItem, which draws a plain <a href> (scope-picker.tsx:158): choosing a scope is a whole page load, where the menu's own links go through next/link since MDRS-258 so that the shell is not streamed again as skeletons. Each choice therefore streams app/loading.tsx (the shell in skeletons) before the layout reads the roles again, and the focus ends on the document's start, not on anything of the page. New finding, from the code; not seen in a browser. Fix: render the rows with next/link (decision D2)." }
  - { id: SCOPE-2, rule: "A hoca who holds no medrese seat is given two links to one page in the course's menu: Pano falls back to the course's own address (panoHref, scope.ts:214-218) and Genel bakış is that address, so the menu has two entries for one page, and only the later one is marked current (nav.ts:237-251). By design, but a screen-reader user hears two destinations that are one. New finding, low. Fix: leave Pano out of a course's menu when the person runs no medrese." }
  - { id: SCOPE-3, rule: "The picker's button is named by an aria-label, \"Kapsam değiştir: {name}\" (scope-picker.tsx:129), which replaces its content: the visible role line (\"Medrese başmüderrisi\", \"Hoca\") is not in the accessible name, so speech-input users cannot say it and WCAG 2.5.3 (label in name) is not met for that part of the label. Read from the code (shell#1 a1 shows the role is visible). New finding, low. Fix: put the role in the name, or leave the aria-label off and let the content name it." }
  - { id: focus-not-set, rule: "Nothing in features/shell gives the page a focus when it opens: no autoFocus, no focus() (F-L-17), so the page nodes carry no `initialFocus`, and the graph says nothing of the focus after a page loads or a scope is chosen (a whole load leaves it on the document's start; the replay's `loaded` mark covers that). The frame moves it in three places only: into the sheet's \"Kapat\" on opening, back to \"Menü\" on Esc and \"Kapat\", and back to the picker's button when its popup closes (Base UI; not seen here)." }
  - { id: scope-memory, rule: "The cookie \"nazar-scope\" (kind:id, a year, SameSite=Lax, no Secure and not HttpOnly) is written from the browser by ScopeMemory after hydration, on a scoped page of a scope the person holds (`remember`), never for a scope opened by address and never on Hesap or Bildirimler (portal-layout.tsx:101, :118; scope-memory.tsx:14). So the frame of those two pages is the last scope's, and `/` opens it while the person still holds it (scope.ts:186-198; nazar.access.landingScope). Recorded; not a finding." }
  - { id: label-in-name, rule: "A link's visible text is in its accessible name for every entry of the menu, the bell and the picker's rows. It is not for the picker's button (SCOPE-3), and the person's row is named by its content, name, roles and a hidden \", ayarlar\", which includes what it shows. Holds except SCOPE-3." }
