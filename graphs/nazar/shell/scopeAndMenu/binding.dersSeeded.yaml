# nazar.shell.scopeAndMenu for a ders nazırı holding the stack's seeded grants, on the local stack, in a wide window (1440 x 900):
# "Rukiye Ders Nazırı" with enrollment.decide, session.manage and course.view_unpublished (what seed.sh gives her in "Bina ve İzhar
# Şerhi"). The course menu has thirteen entries: Değerlendirme is drawn for session.manage, Ödevler (submission.read) and Ders destesi
# (deck.manage_course) are not; and the numbers are readable, because enrollment.decide brings course.staff_read: Celseler 1 and
# Talebeler 1 (nothing of the seeded courses has either, so the walk makes them).
#   node apps/engine/src/cli.ts replay graphs/nazar/shell/scopeAndMenu --bind graphs/nazar/shell/scopeAndMenu/binding.dersSeeded.yaml \
#     --to wide --to picking --absent --out <dir>
# NOT RUN: written without a replay. `setup` opens "Deneme dersi scopeS" in the medrese with the başmüderris as its hoca, with one celse
# tomorrow that has no way in and one application waiting from applicantG, then appoints her with the seeded set
# (helpers/course-nazir-grants.mjs `--codes seed`, `--as basmuderris`); `teardown` takes applicantG off and deletes the course, and the
# post with it. The post of the seeded course is not touched. A ders nazırı holding submission.read or deck.manage_course draws Ödevler
# or Ders destesi: nazar.access.dersNazirPages walks those.
schema: delurio-graph/0
kind: binding
extends: ./locators.binding.yaml
flow: nazar.shell.scopeAndMenu

browser: { width: 1440, height: 900 }

data:
  madeS: { json: ../.local/made/scopeS.json }

scenarios:
  dersSeeded:
    given: { opensAt: wide, who: dersSeeded, counts: some }
    as: dersNazir
    open: '{nazar}/ders/{madeS.course}'
    setup:
      - run: [node, helpers/course.mjs, make, scopeS, --madrasah, '{seed.madrasah}', --hoca, basmuderris, --weeks, '1', --lessons, '1', --approval, --talebe, applicantG]
        expect: '"APPLICANT_G":"PENDING"'
      - run: [node, helpers/course-nazir-grants.mjs, --course, '{madeS.course}', --nazir, dersNazir, --codes, seed, --as, basmuderris]
        expect: 'course-nazir-grants DERS_NAZIR'
    teardown:
      - run: [node, helpers/course.mjs, remove, scopeS]
        expect: 'course remove scopeS'

nodes:
  pickerButton: { role: button, name: '/^Kapsam değiştir: (Bina ve İzhar Şerhi|Deneme dersi scopeS)$/' }
  rowCourse: { css: '[role=menuitem][href^="/ders/"]', hasText: '/^(Bina ve İzhar Şerhi|Deneme dersi scopeS)/' }
  courseDetail: { css: '[role=menuitem][href^="/ders/"] .mds-caption', hasText: '/^Ders nazırı\s*·\s*Süleymaniye Köşkü$/' }
  currentCourseRow: { css: '[role=menuitem][href^="/ders/"][aria-current=true]', hasText: Deneme dersi scopeS }
  sessionsBadge: { css: '.mds-nav-item__count', hasText: '/^1\s*katılım yolu eksik$/', within: { role: navigation, name: Ana menü } }
  studentsBadge: { css: '.mds-nav-item__count', hasText: '/^1\s*bekleyen başvuru$/', within: { role: navigation, name: Ana menü } }
