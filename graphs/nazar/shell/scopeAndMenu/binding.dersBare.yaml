# nazar.shell.scopeAndMenu for a ders nazırı with no grant, on the local stack, in a wide window (1440 x 900): "Rukiye Ders Nazırı",
# DERS_NAZIR of "Bina ve İzhar Şerhi" (the seed's post) and, for this walk, of a course of the walk's own. The course menu has twelve
# entries: Ödevler, Değerlendirme and Ders destesi are cut because she holds none of submission.read, session.manage and
# deck.manage_course (e2e shell#9, which lists 13 and is stale: F-L-5); no number is drawn, because the count of Celseler and Talebeler
# is refused without course.staff_read; and Ders nazırları and Ders ayarları are offered though the pages refuse her (F-D2c-2, F-L-20).
#   node apps/engine/src/cli.ts replay graphs/nazar/shell/scopeAndMenu --bind graphs/nazar/shell/scopeAndMenu/binding.dersBare.yaml \
#     --to wide --to picking --to kept --absent --out <dir>
# NOT RUN: written without a replay. The walk makes its own course instead of changing the seeded post's grants (the seed gives her
# enrollment.decide, session.manage and course.view_unpublished in "Bina ve İzhar Şerhi", which other flows read): `setup` opens
# "Deneme dersi scopeN" in the medrese with the başmüderris as its hoca, then appoints her with no permission, as the hoca does on Ders
# nazırları (helpers/course-nazir-grants.mjs, `--as basmuderris`: she is the course's müderris there). `teardown` deletes the course,
# and the post with it; `make` removes a tag made before, so a crashed walk leaves nothing. She holds two course scopes during the
# walk (the seeded one and this one), so her picker is a menu with the Dersler group alone.
schema: delurio-graph/0
kind: binding
extends: ./locators.binding.yaml
flow: nazar.shell.scopeAndMenu

browser: { width: 1440, height: 900 }

data:
  madeN: { json: ../.local/made/scopeN.json }

scenarios:
  dersBare:
    given: { opensAt: wide, who: dersBare, counts: none }
    as: dersNazir
    open: '{nazar}/ders/{madeN.course}'
    setup:
      - run: [node, helpers/course.mjs, make, scopeN, --madrasah, '{seed.madrasah}', --hoca, basmuderris, --weeks, '1', --lessons, '1']
        expect: '"title":"Deneme dersi scopeN"'
      - run: [node, helpers/course-nazir-grants.mjs, --course, '{madeN.course}', --nazir, dersNazir, --codes, none, --as, basmuderris]
        expect: 'course-nazir-grants DERS_NAZIR'
    teardown:
      - run: [node, helpers/course.mjs, remove, scopeN]
        expect: 'course remove scopeN'

nodes:
  pickerButton: { role: button, name: '/^Kapsam değiştir: (Bina ve İzhar Şerhi|Deneme dersi scopeN)$/' }
  rowCourse: { css: '[role=menuitem][href^="/ders/"]', hasText: '/^(Bina ve İzhar Şerhi|Deneme dersi scopeN)/' }
  courseDetail: { css: '[role=menuitem][href^="/ders/"] .mds-caption', hasText: '/^Ders nazırı\s*·\s*Süleymaniye Köşkü$/' }
  currentCourseRow: { css: '[role=menuitem][href^="/ders/"][aria-current=true]', hasText: Deneme dersi scopeN }
