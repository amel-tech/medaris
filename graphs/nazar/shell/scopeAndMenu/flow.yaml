assertions:
  - id: a-picker-opens-only-with-several-scopes
    never: "(state == 'picking' or state == 'sheetPicking') and not pickerMenu"
    say: The picker is a control only for a person who holds two scopes or more; a medrese nazır's is a card that cannot be opened (F-L-14).
    source: apps/nazar/features/shell/components/scope-picker.tsx:100
  - id: the-menu-is-of-a-scope-the-person-holds
    never: "framed and ((scope == 'medrese' and not hasMedrese) or (scope == 'ders' and who == 'nazir'))"
    say: A person with no medrese seat never has the medrese's menu, and a medrese nazır never has a course's. Pano of a course leads to a medrese only for someone who holds a seat in one.
    source: apps/nazar/features/shell/scope.ts:214
