flow: nazar.shell.errorStates
status: captured
catalog: catalog/tr.json
locales: [tr]
samples: {}

# No face sets a focus: nothing in app/not-found.tsx, error.tsx, global-error.tsx or load-failed.tsx autofocuses or calls focus(),
# so there is no `initialFocus` on a page and no `focus` here (rule focus-not-set).
