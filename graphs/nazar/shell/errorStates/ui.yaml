  rolesTitle: { type: text, component: Heading, role: heading, text: { key: Shell.loadFailedTitle }, in: [rolesUnreadable], source: libs/ui/src/mds/system-state.tsx:43 } # h1
  rolesText: { type: text, component: Text, text: { key: Shell.loadFailed }, in: [rolesUnreadable], source: libs/ui/src/mds/system-state.tsx:46 }
  rolesRetry: { type: action, component: Button, role: button, intent: secondary, text: { key: Shell.retry }, in: [rolesUnreadable], emits: RETRY, source: apps/nazar/features/shell/components/load-failed.tsx:33 } # busy while the retry runs (loading={pending}): aria-busy and a hidden <output> "Yükleniyor" from the Button's own default, never disabled

