# The screens of nazar.shell.errorStates: the roles face (PortalUnavailable, a SystemState that is the page's <main>), the box a page
# draws for its own failed read (LoadFailed with `shell`, a <section> inside the shell's <main>, with İtirazlar standing for
# every page), the root 404 page (app/not-found.tsx), the root error page (app/error.tsx) and the root error document
# (app/global-error.tsx). All of them are the kit's SystemState (libs/ui/src/mds/system-state.tsx): <main> or <section> labelled by
# its own <h1>, one <p> and the action. The shell is drawn only as three landmarks (the sidebar, its menu and the shell's <main>), so
# that "inside the shell" and "outside the shell" are something a replay can check; the sidebar's content is
# nazar.shell.scopeAndMenu's.
#
# Words: every key is copied from libs/i18n/src/locales/tr/nazar.json (the app reads it as `nazar.<key>`), except
# `common.globalError.*`, which is libs/i18n/src/locales/tr/common.json (app/global-error.tsx:25 reads it without next-intl). No key is
# composed in code. Nothing here changes data, so there is no `changes` note.
