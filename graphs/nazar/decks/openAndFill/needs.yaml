      - test: apps/nazar/test/decks.spec.ts

  - id: staff-change-every-card-of-a-course-deck
    need: >-
      Whoever holds deck.manage_course in a course can read, add, edit and delete the cards of every deck of the course, whoever
      opened the deck; today the deck routes allow it and the card routes answer 404 to anyone but the deck's author (OPENFILL-1).
    missing: "no issue: the domain's course-deck-staff-card-routes-404 (apps/tedrisat/src/flashcard/flashcard.service.ts:86)"
    note: >-
      Drawn on the states savingCard, editFailed, removing and removeFailed, which the code has: they are not evidence, so that a
      replay still walks them (SPEC.md §13 leaves out what only missing needs name).

