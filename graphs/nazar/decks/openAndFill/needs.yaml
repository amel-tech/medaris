schema: delurio-graph/0
kind: needs
id: nazar.decks.openAndFill
status: proposed
summary: >-
  What must exist for the staff of a course to open a deck and fill it with cards: the flow's product list. No e2e check of
  nazar-web touches Ders desteleri, and no replay has been run, so no `walked` entry names one: the unit spec
  apps/nazar/test/decks.spec.ts, which pins the page's rules (the title and the faces, the paste, the body of a create), is listed
  as `test:`, not as e2e or replay.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# missing (no code, Linear key `none`): staff-change-every-card-of-a-course-deck, a-refusal-says-why, a-saved-edit-says-so,
# writes-are-announced, required-fields-are-said, cards-have-names, a-failed-call-is-told, the-dialog-starts-in-the-title,
# a-deck-page-is-told-by-its-title
# unwalked (code, no e2e and no replay yet): see-the-decks-of-the-course, open-a-deck, fill-a-deck-with-the-keyboard, paste-a-batch,
# edit-a-card-in-place, delete-a-card-after-asking, the-talebe-see-the-published-deck

needs:
  - id: see-the-decks-of-the-course
    need: >-
      Whoever holds deck.manage_course in a course sees the course's decks, drafts included, each with its size, its type, its
      week, whether the talebe see it yet and how much of it they have mastered, and the totals above them; a course with no deck
      says so and says how to begin.
    evidence:
      - state: emptyList
      - state: deckList
      - node: listSummary
      - node: emptyTitle
      - node: emptyBody
      - node: deckCard
      - node: importButton
      - node: newButton
      - source: apps/tedrisat/src/flashcard/course-decks.controller.ts:68
      - source: apps/nazar/features/decks/components/decks-page.tsx:30
      - test: apps/nazar/test/decks.spec.ts

  - id: open-a-deck
    need: >-
      The same person opens a deck of the course from the list: a title of 5 to 100 characters, an optional description, a card
      type, an optional week and whether it is a draft; the deck exists at once, the person is told, and lands on its page. A
      title that is not acceptable is refused before anything is sent.
    evidence:
      - state: newDeck
      - state: newDeckProblem
      - state: creating
      - node: titleField
      - node: draftBox
      - node: newDeckSubmit
      - node: toastCreated
      - state: deck
      - node: deckPublished
      - node: deckDraftLine
      - source: apps/tedrisat/src/flashcard/course-decks.controller.ts:86
      - source: apps/nazar/features/decks/components/deck-form-dialog.tsx:74
      - test: apps/nazar/test/decks.spec.ts

  - id: fill-a-deck-with-the-keyboard
    need: >-
      Cards go in one after the other with the keyboard alone: both faces typed, Enter, the boxes empty and the focus back on the
      first, and a line says the card is added; a blank card is refused and the line says so. The cards are on the page as soon as
      they are added.
    evidence:
      - state: deck
      - state: faceProblem
      - state: addingCard
      - state: cardAdded
      - node: addFront
      - node: addBack
      - node: lineAdded
      - node: lineRequired
      - node: cardsHeading
      - node: tileFront
      - node: tileBack
      - source: apps/tedrisat/src/flashcard/flashcard.controller.ts:199
      - source: apps/nazar/features/decks/components/card-quick-add.tsx:65
      - test: apps/nazar/test/decks.spec.ts

  - id: paste-a-batch
    need: >-
      Two columns copied from a spreadsheet become cards in one press; the lines that are no card are named by their number so
      that the person can correct them, and a paste with no usable line adds nothing and says so. All the cards of a batch are
      added or none.
    evidence:
      - state: batchReady
      - state: batchEmpty
      - state: addingBatch
      - state: batchAdded
      - state: batchFailed
      - node: batchSummary
      - node: batchNone
      - node: batchAddAll
      - node: batchDrop
      - node: lineBatchAdded
      - source: apps/tedrisat/src/flashcard/flashcard.controller.ts:199
      - source: apps/nazar/features/decks/components/card-quick-add.tsx:87
      - test: apps/nazar/test/decks.spec.ts

  - id: edit-a-card-in-place
    need: >-
      A card is changed where it stands: its two faces open as a form, Enter or "Kaydet" stores them, Escape or "Vazgeç" leaves
      them as they were, and a face that is not acceptable is refused in the form.
    evidence:
      - state: editing
      - state: savingCard
      - node: editForm
      - node: editFront
      - node: editBack
      - node: editSave
      - node: editCancel
      - source: apps/tedrisat/src/flashcard/flashcard.controller.ts:291
      - source: apps/nazar/features/decks/components/card-tile.tsx:46
      - test: apps/nazar/test/decks.spec.ts

  - id: delete-a-card-after-asking
    need: >-
      A card is deleted only after the person is asked once, in words that say what happens, and the deck's page and its count
      follow at once; the person is told it is gone.
    evidence:
