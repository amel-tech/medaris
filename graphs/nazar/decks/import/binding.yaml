  # a deck's own page, reached by its card on the list (the first deck, A): the dialog has no deck field and the cards go to A
  onDeckPage:
    given: { entry: deckPage, template: served, file: clean }
    as: muderris
    open: '{nazar}/ders/{made.course}/deste'
    enter: { nav: ../../nav, bind: ./enter.nav.binding.yaml, entry: 'dersDeck->dersDeckOne' }
    vars: { upload: '{files.clean}', cardsAfter: '2', hadeeth: '0' }
    setup:
