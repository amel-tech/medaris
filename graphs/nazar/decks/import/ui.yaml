# The screens of nazar.decks.import: Ders desteleri (/ders/<id>/deste) as far as its "Excel'den aktar" button, a deck's own page
# (/ders/<id>/deste/<deckId>) as far as the same button, the dialog "Excel'den aktar" over either, the deck list inside it, the toast
# that follows a clean file, and the page after it. Read from apps/nazar/features/decks/components/{decks-page,decks-actions,
# deck-detail-page,deck-detail-screen,import-cards-dialog}.tsx, features/decks/{actions,decks}.ts, app/api/decks/sample/route.ts and the
# kit's Dialog, Field, Select, Input, Alert, Button and Toast (libs/ui/src/mds) on 15 Nov 2026. Nothing was seen in a browser: every
# focus, role and name below is "from the code" unless a node says otherwise. The deck cards, the new-deck dialog and the rest of a
# deck's page are nazar.decks.openAndFill's; the sidebar, the scope picker and the toast host are nazar.shell.scopeAndMenu's.
# The page behind a dialog is inert (Base UI), so no page node is `in` a dialog state.
#
# Words: every `Decks.*` key is copied letter for letter from libs/i18n/src/locales/tr/nazar.json (the app reads it as `nazar.Decks.<key>`),
# by <scratchpad>/import-nazar/catalog.mjs. Text the code builds or the kit hard-codes is `composed.<Namespace>.<name>`:
#   composed.Decks.importRowLine  "Satır {row}: {messages}"  one row of the alert: <strong>Decks.importRow</strong>, then ": " and the API's own
#                                                            messages joined with "; " (import-cards-dialog.tsx:149-156). The messages are NOT
#                                                            catalog text (F-D1-19): class-validator's defaults for the API's DTO, in English, with
#                                                            the DTO's property names (flashcard/dto/create-flashcard.dto.ts); the sample is what
#                                                            a one-letter front and back give, read from the code and not run
#   composed.Decks.cardsHeading   "Kartlar · {count}"        the h2 of a deck's page: Decks.cardsTitle, " · " and the card count
#                                                            (deck-detail-screen.tsx:64-66)
#   composed.Dialog.close         "Kapat"                    the dialog's close icon, the kit's default `closeLabel` (libs/ui/src/mds/dialog.tsx:64)
#   composed.Toast.close          "Kapat"                    the toast's close button (libs/ui/src/mds/toast.tsx:97)
#   composed.Button.loading       "Yükleniyor"               what the busy button's hidden <output> says (libs/ui/src/mds/button.tsx:62)
# `changes.key` is the app's own message after a clean import ("{count} kart eklendi"); the flow's only writing step is the import and it has
# one, so no `Changes.note` is authored. It does not say which deck got the cards (IMPORT-5).
# The deck names ("Aktarma denemesi A" and "B") are the data the binding's helper makes; samples are invented and neutral.
schema: delurio-graph/0
kind: ui
id: nazar.decks.import
flow: nazar.decks.import
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Decks.importDone }
samples:
  decks: '2' # the decks of the walk's course
  noDecks: '0'
  cards: '0' # the cards the decks hold before the import (the summary's total, a deck's own count)
  cardsAfter: '2' # what the clean files add
  students: '0' # nobody is enrolled in the walk's course
  count: '2' # rows with a problem in the alert, and cards added in the toast
  row: '2' # a row of the spreadsheet; the header is row 1
  messages: contentFront must be longer than or equal to 3 characters; contentBack must be longer than or equal to 3 characters

nodes:
  # ---- the page: the list of decks or one deck, as far as the import button ----
  pageMain: { type: page, component: Page, role: main, in: [list, listNoDeck, deckPage, imported, abandoned], source: libs/ui/src/mds/app-shell.tsx:41 } # the shell's one <main id="main">; no name, and no initial focus (rule focus-not-set)
  listTitle: { type: text, component: Heading, role: heading, text: { key: Decks.title }, in: [list, listNoDeck, imported, abandoned], when: "entry != 'deckPage'", source: apps/nazar/features/decks/components/decks-page.tsx:78 } # h1 of the list
  summaryNoDeck: { type: text, component: Text, text: { key: Decks.summary, params: { decks: noDecks, cards: cards, students: students } }, in: [listNoDeck], source: apps/nazar/features/decks/components/decks-page.tsx:79 } # "0 deste · 0 kart · kayıtlı 0 talebe görür"
  summaryBefore: { type: text, component: Text, text: { key: Decks.summary, params: { decks: decks, cards: cards, students: students } }, in: [list, imported, abandoned], when: "entry == 'list' and not added", source: apps/nazar/features/decks/components/decks-page.tsx:79 } # the totals of the decks the page was drawn with
  summaryAfter: { type: text, component: Text, text: { key: Decks.summary, params: { decks: decks, cards: cardsAfter, students: students } }, in: [list, imported, abandoned], when: "entry == 'list' and added", source: apps/nazar/features/decks/components/decks-page.tsx:79 } # router.refresh() reads the decks again: the card total has moved (the deck cards' own counts are nazar.decks.openAndFill's)
  emptyTitle: { type: text, component: Text, text: { key: Decks.emptyTitle }, in: [listNoDeck], source: apps/nazar/features/decks/components/decks-page.tsx:94 } # the EmptyState of a course with no deck
  emptyBody: { type: text, component: Text, text: { key: Decks.emptyBody }, in: [listNoDeck], source: apps/nazar/features/decks/components/decks-page.tsx:95 }
  # duringStep on "Excel'den aktar" and "Deste aç": after the dialog was closed under a send (`abandoned`) both are live and open their
  # dialog at once. The old send's success then calls its onClose (import-cards-dialog.tsx:66), which is the page's setOpen(null)
  # (decks-actions.tsx:43, :47; deck-detail-screen.tsx:108), so it closes whichever dialog is open by then: worth a look.
  importButton: { type: action, component: Button, role: button, intent: secondary, name: { key: Decks.importButton }, text: { key: Decks.importButton }, in: [list, listNoDeck, deckPage, imported, abandoned], disabledIn: [listNoDeck], emits: OPEN_IMPORT, duringStep: true, source: apps/nazar/features/decks/components/decks-actions.tsx:28 } # on a deck's page the same button is deck-detail-screen.tsx:71; `disabled` with no deck and no word to say why (F-D1-15)
  newButton: { type: action, component: Button, role: button, intent: confirm, text: { key: Decks.newButton }, in: [list, listNoDeck, imported, abandoned], when: "entry != 'deckPage'", emits: NEW_DECK, duringStep: true, source: apps/nazar/features/decks/components/decks-actions.tsx:35 } # primary; the new-deck dialog is nazar.decks.openAndFill's
  deckTitle: { type: text, component: Heading, role: heading, text: { literal: Aktarma denemesi A }, in: [deckPage, imported, abandoned], when: "entry == 'deckPage'", source: apps/nazar/features/decks/components/deck-detail-page.tsx:82 } # h1, the deck's own name, with lang="auto" which is no language tag (F-D1-14)
  cardsHeadingNone: { type: text, component: Heading, role: heading, text: { key: composed.Decks.cardsHeading, params: { count: cards } }, in: [deckPage, imported, abandoned], when: "entry == 'deckPage' and not added", source: apps/nazar/features/decks/components/deck-detail-screen.tsx:64 } # h2 "Kartlar · 0"
  cardsHeadingAdded: { type: text, component: Heading, role: heading, text: { key: composed.Decks.cardsHeading, params: { count: cardsAfter } }, in: [deckPage, imported, abandoned], when: "entry == 'deckPage' and added", source: apps/nazar/features/decks/components/deck-detail-screen.tsx:64 } # h2 "Kartlar · 2"; the cards themselves are tiles (nazar.decks.openAndFill)
  cardsEmpty: { type: text, component: Text, text: { key: Decks.cardsEmpty }, in: [deckPage, imported, abandoned], when: "entry == 'deckPage' and not added", source: apps/nazar/features/decks/components/deck-detail-screen.tsx:79 } # "Bu destede henüz kart yok." (fdc6e995 shortened it: it no longer names Excel)

  # ---- the dialog "Excel'den aktar" (a kit `Dialog form`, size md) ----
  importDialog: { type: page, component: Page, role: dialog, name: { labelledBy: importTitle }, in: [dialog, choosingDeck, sampling, sending], initialFocus: closeIcon, source: apps/nazar/features/decks/components/import-cards-dialog.tsx:75 } # initialFocus is Base UI's first tabbable element, the close icon, because the dialog passes none (IMPORT-2; not seen); a click on the scrim does not close it
  importTitle: { type: text, component: Heading, role: heading, text: { key: Decks.importTitle }, in: [dialog, choosingDeck, sampling, sending], source: libs/ui/src/mds/dialog.tsx:90 } # h2 (Base UI Dialog.Title)
  # duringStep on the dialog's controls: while a template is saved (`sampling`, the browser's download) nothing in the dialog is busy, so
  # each acts at once. While the file is sent "Aktar" is busy and "Vazgeç" and the close icon are handled (`abandoned`), but "Hedef
  # deste" (no `disabled`, import-cards-dialog.tsx:96) and the template links stay live: a deck picked then does not change where the
  # file being sent goes, for the call took the deck it was sent with (:58).
  closeIcon: { type: action, component: Button, role: button, intent: dismiss, name: { key: composed.Dialog.close }, in: [dialog, choosingDeck, sampling, sending], emits: CANCEL, duringStep: true, source: libs/ui/src/mds/dialog.tsx:100 } # the kit's own word (F-D1-24); live while the file is being sent (IMPORT-1)
  deckField: { type: field, component: TextField, role: combobox, text: { key: Decks.importDeck }, in: [dialog, choosingDeck, sampling, sending], when: "entry != 'deckPage'", emits: OPEN_DECKS, duringStep: true, source: apps/nazar/features/decks/components/import-cards-dialog.tsx:95 } # the kit's Select, a button that shows the chosen deck's title; drawn only on the list, where no deck is fixed; the `*` is decorative and the Select gets no `required` (F-D1-03)
  deckShownFirst: { type: text, component: Text, text: { literal: Aktarma denemesi A }, in: [dialog, choosingDeck, sampling, sending], when: "entry != 'deckPage' and target == 'first'", source: apps/nazar/features/decks/components/import-cards-dialog.tsx:39 } # the field starts at the first deck of the list (week order, then creation order), chosen by the page and not by the person (IMPORT-5)
  deckShownSecond: { type: text, component: Text, text: { literal: Aktarma denemesi B }, in: [dialog, choosingDeck, sampling, sending], when: "entry != 'deckPage' and target == 'second'", source: apps/nazar/features/decks/components/import-cards-dialog.tsx:103 }
  fileField: { type: field, native: file, component: TextField, text: { key: Decks.importFile }, in: [dialog, choosingDeck, sampling, sending], source: apps/nazar/features/decks/components/import-cards-dialog.tsx:121 } # <input type=file name=file accept=".csv,.xlsx,text/csv,...">; no ARIA role, no `required` (F-D1-03)
  fileHelp: { type: text, component: Text, text: { key: Decks.importHelp }, in: [dialog, choosingDeck, sampling, sending], when: "not fieldWrong", source: apps/nazar/features/decks/components/import-cards-dialog.tsx:109 } # "Excel (.xlsx) ya da CSV. En çok 5 MB."; the help line, which the field's error replaces; it says nothing of the columns or of the 1000 rows (IMPORT-2)
  errNoFile: { type: text, component: Text, text: { key: Decks.importNoFile }, in: [dialog, choosingDeck, sampling, sending], when: "sent and chosen == 'none'", source: apps/nazar/features/decks/components/import-cards-dialog.tsx:111 } # Base UI Field.Error: no role, no live region, and the focus stays on "Aktar" (F-D1-16, F-L-12)
  errType: { type: text, component: Text, text: { key: Decks.importType }, in: [dialog, choosingDeck, sampling, sending], when: "chosen == 'badType'", source: apps/nazar/features/decks/components/import-cards-dialog.tsx:113 } # shown at once, when the file is chosen, from its name alone
  errSize: { type: text, component: Text, text: { key: Decks.importSize }, in: [dialog, choosingDeck, sampling, sending], when: "chosen == 'tooBig'", source: apps/nazar/features/decks/components/import-cards-dialog.tsx:115 }
  sampleLead: { type: text, component: Text, text: { key: Decks.importSample }, in: [dialog, choosingDeck, sampling, sending], source: apps/nazar/features/decks/components/import-cards-dialog.tsx:133 } # "Örnek şablon" and a colon the code adds, in the same <p> as the two links
  sampleXlsx: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: Decks.importSampleXlsx }, text: { key: Decks.importSampleXlsx }, in: [dialog, choosingDeck, sampling, sending], emits: SAMPLE_XLSX, duringStep: true, source: apps/nazar/features/decks/components/import-cards-dialog.tsx:134 } # <a href="/api/decks/sample?format=xlsx" download>, a plain link
  sampleCsv: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: Decks.importSampleCsv }, text: { key: Decks.importSampleCsv }, in: [dialog, choosingDeck, sampling, sending], emits: SAMPLE_CSV, duringStep: true, source: apps/nazar/features/decks/components/import-cards-dialog.tsx:138 } # <a href="/api/decks/sample?format=csv" download>

  # what stands under the form after a send: the row alert or the failure alert (role=alert, so both are announced). A send clears both first.
  rowAlert: { type: alert, component: Alert, role: alert, in: [dialog, choosingDeck, sampling], when: "said == 'rows'", source: apps/nazar/features/decks/components/import-cards-dialog.tsx:143 }
  rowAlertTitle: { type: text, component: Text, text: { key: Decks.importRowErrors }, in: [dialog, choosingDeck, sampling], when: "said == 'rows'", source: apps/nazar/features/decks/components/import-cards-dialog.tsx:145 } # "{count} satırda hata var. Hiçbir kart eklenmedi; dosyayı düzeltip yeniden yükleyin."; {count} is the number of rows with a problem
  rowList: { type: list, component: List, role: list, in: [dialog, choosingDeck, sampling], when: "said == 'rows'", source: apps/nazar/features/decks/components/import-cards-dialog.tsx:147 }
  rowItem: { type: text, component: ListItem, role: listitem, text: { key: composed.Decks.importRowLine }, in: [dialog, choosingDeck, sampling], when: "said == 'rows'", repeat: rows, source: apps/nazar/features/decks/components/import-cards-dialog.tsx:149 } # one per row with a problem, in the API's English (F-D1-19); a file of more than 1000 rows gives the one row 1002 (IMPORT-2); the binding matches the pattern, not the sample
  failedAlert: { type: alert, component: Alert, role: alert, in: [dialog, choosingDeck, sampling], when: "said == 'failed'", source: apps/nazar/features/decks/components/import-cards-dialog.tsx:161 } # no title, one sentence, whatever the refusal was (IMPORT-3)
  failedText: { type: text, component: Text, text: { key: Decks.failed }, in: [dialog, choosingDeck, sampling], when: "said == 'failed'", source: apps/nazar/features/decks/components/import-cards-dialog.tsx:161 }

  # the footer
  cancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: Decks.cancel }, in: [dialog, choosingDeck, sampling, sending], emits: CANCEL, duringStep: true, source: apps/nazar/features/decks/components/import-cards-dialog.tsx:86 } # the kit's DialogClose with the catalog's word; live while the file is being sent (IMPORT-1)
  submit: { type: action, component: Button, role: button, intent: confirm, text: { key: Decks.import }, in: [dialog, choosingDeck, sampling, sending], disabledIn: [sending], emits: SUBMIT, duringStep: true, source: apps/nazar/features/decks/components/import-cards-dialog.tsx:87 } # "Aktar": never disabled for a wrong form; busy (aria-disabled, aria-busy) while the file is out
  busy: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [sending], source: libs/ui/src/mds/button.tsx:114 } # the hidden <output> beside the button; empty when idle; the word is the kit's default (F-D1-24, F-L-11)

  # ---- the deck list, open (the kit's Select popup) ----
  deckList: { type: list, component: List, role: listbox, in: [choosingDeck], source: libs/ui/src/mds/select.tsx:80 } # no name of its own (rule list-has-no-name)
  optionFirst: { type: field, component: ListItem, role: option, text: { literal: Aktarma denemesi A }, checked: "target == 'first'", in: [choosingDeck], emits: PICK_FIRST, source: apps/nazar/features/decks/components/import-cards-dialog.tsx:99 } # one option per deck of the course, by its title
  optionSecond: { type: field, component: ListItem, role: option, text: { literal: Aktarma denemesi B }, checked: "target == 'second'", in: [choosingDeck], emits: PICK_OTHER, source: apps/nazar/features/decks/components/import-cards-dialog.tsx:99 }

  # ---- the toast after a clean file (the kit's Toaster, Base UI; a success closes itself after 6 s) ----
  importedToast: { type: status, component: Status, role: dialog, name: { key: Decks.importDone, params: { count: count } }, text: { key: Decks.importDone, params: { count: count } }, in: [imported], source: apps/nazar/features/decks/components/import-cards-dialog.tsx:61 } # a low-priority Base UI toast is a role=dialog named by its title, in the region "Bildirimler" (F-L-6); only a title, no description, and no deck named (IMPORT-5)
  toastClose: { type: action, component: Button, role: button, intent: dismiss, name: { key: composed.Toast.close }, in: [imported], source: libs/ui/src/mds/toast.tsx:97 } # the kit's own word, not a catalog message (F-L-6)

edges:
  - { labelledBy: [importDialog, importTitle] }
  - { triggers: [importButton, dialog] }
  - { triggers: [deckField, choosingDeck] }
  - { triggers: [sampleXlsx, sampling] }
  - { triggers: [sampleCsv, sampling] }
  - { triggers: [submit, sending] }
  - { returnsFocus: [importDialog, importButton] } # Base UI returns the focus to the element that had it when the dialog opened, "Excel'den aktar" on the page; the page unmounts the dialog itself on close (from the code, not seen)

rules:
  - { id: F-D1-15, rule: "\"Excel'den aktar\" is `disabled` when the course has no deck (decks-actions.tsx:28-34, `disabled={decks.length === 0}`) and nothing says why: the button sits dead beside \"Deste aç\", which is the only way on. Drawn as the state `listNoDeck`, where `importButton` is disabledIn. Fix: keep it on and say in the dialog that a deck is needed first (with a link to \"Deste aç\"), or add an aria-describedby hint." }
  - { id: F-D1-18, rule: "the dialog accepts a file of up to 5 MB (decks.ts:300-301) and sends it as the FormData of a Server Action (actions.ts:175-197), but next.config.js sets only `experimental.proxyClientMaxBodySize` and no `experimental.serverActions.bodySizeLimit`, and the installed Next 16.4.2 reads its default as 1 MB (apps/nazar/node_modules/next/dist/server/app-render/action-handler.js:513-515; the body over it is an ApiError 413 at :539-540, :625-626, :652-653). So a file of 1 to 5 MB is refused before `importCards` runs: the handler answers the fetch with a 500 whose flight body carries a rejected action result (:911-931, the TODO there says the 413 is not sent), `await importCards(...)` rejects in the browser, nothing in the dialog catches it (F-D1-20) and the person meets the error page \"Sayfa açılamadı\" (nazar.shell.errorStates) in place of the dialog's own sentences. Drawn as `sending` FAIL.tooLarge -> the exit `error_page` for the `midSize` file; read from the code, NOT VERIFIED at runtime (no file was sent). Fix: set `serverActions.bodySizeLimit` to at least 6mb, or post the file to an `app/api` route as the Müfredat uploads do." }
  - { id: F-D1-19, rule: "two words nobody wrote for this app. (1) The template links are plain `<a download>` to GET /api/decks/sample (import-cards-dialog.tsx:134-141); the route answers an empty 502 for every failure, tedrisat's refusals included (app/api/decks/sample/route.ts:28-32), so a failed download is the browser's own message and the dialog says nothing (drawn as `sampling` FAIL.refused; not walkable, no stack condition makes tedrisat fail). Tedris's route differs: it answers 400 for another format and relays tedrisat's status and body (domain: webDownloadCardSample). (2) The rows of a refused file are the API's own strings (decks.ts:268-296, import-cards-dialog.tsx:149-156): class-validator's English defaults naming the DTO's properties, \"contentFront must be longer than or equal to 3 characters; contentBack must be longer than or equal to 3 characters\", not the dialog's catalog words, nor the headers of the template (\"Content Front\"), nor the labels the person sees elsewhere (\"Ön yüz\"). Only \"Satır {row}\" and the title are catalog text. The page's own comment says the server's message never reaches the browser (actions.ts:12-15); the import is the exception. Read from the code and class-validator 0.15.1's defaults; not run. Fix: fetch the template and toast on a failure; map the API's field and constraint to catalog sentences." }
  - { id: F-D1-03, rule: "`Field required` draws only an aria-hidden asterisk (libs/ui/src/mds/field.tsx:42-46); the Select and the file input get no `required` (import-cards-dialog.tsx:95-130), so a screen reader is never told \"Hedef deste\" and \"Dosya\" are needed. Fix: pass `required` to both controls." }
  - { id: F-D1-16, rule: "the file field's three errors (\"Bir dosya seçin.\", \"Yalnızca .xlsx ya da .csv dosyası seçilebilir.\", \"Dosya 5 MB'den büyük olamaz.\") are Field errors, which replace the help line and are tied to the box by aria-describedby; \"Aktar\" with nothing chosen leaves the focus on the button, so a screen-reader user hears nothing after pressing it (import-cards-dialog.tsx:48-54,107-118). Fix: focus the file field on a refused press." }
  - { id: F-L-12, rule: "Field error text has no role=alert and no live region (libs/ui/src/mds/field.tsx:50-53; Base UI's FieldError adds none), so the three file errors are read only when the person tabs back to the field. The two alerts below them (the row list and the failure) are role=alert and are announced, so the field's error is the one answer of the dialog that is not." }
  - { id: F-D1-20, rule: "no try/catch around the awaited server action (import-cards-dialog.tsx:57-71): when the call itself rejects (the browser is offline, or Next refuses the body: F-D1-18), the rejection leaves the transition, the busy state is never reset and the page may reach app/error.tsx. NOT VERIFIED. Fix: catch, and say it in the dialog (Files.errors.network exists)." }
  - { id: F-D1-24, rule: "words that are not in the catalog: the close icon \"Kapat\" (dialog.tsx:64, no `closeLabel` is passed) and the busy button's hidden \"Yükleniyor\" (button.tsx:62, no `loadingLabel`, F-L-11). Harmless while the app is Turkish only (the en and ar catalogs exist). Fix: pass Shell.close and a loadingLabel from the catalog." }
  - { id: F-L-6, rule: "the toast's region is named \"Bildirimler\", the same word as the menu entry and the bell, and its close button is named \"Kapat\" in the kit, outside the catalog (libs/ui/src/mds/toast.tsx:97,127-131)." }
  - { id: F-A-13, rule: "the dialog's whole body, the deck field, the file field, the two template links and the alerts included, is the Base UI Dialog.Description (libs/ui/src/mds/dialog.tsx:107-116), so the dialog's aria-describedby points at all of it (not verified with a screen reader). Fix: describe the dialog with one short sentence." }
  - { id: F-D1-14, rule: "on a deck's own page the h1 is the deck's title with `lang=\"auto\"` (deck-detail-page.tsx:82), which is no language tag; the same in each deck card of the list (decks-page.tsx:117). Fix: dir=\"auto\" and no lang." }
  - { id: F-D1-17, rule: "neither deck route has a loading.tsx (app/ders/[dersId]/deste/ and deste/[desteId]/), so the page that opens falls through to the portal-wide app/loading.tsx, a whole-shell skeleton (NOT VERIFIED visually). Only the first paint of this flow's two pages." }
  - { id: IMPORT-1, rule: "new, from the code: Vazgeç, the close icon and Esc stay live while the file is being sent. `onOpenChange` closes whenever it is asked (import-cards-dialog.tsx:77-79) and the dialog has no pending guard (the only guard is on the form's own submit, :50); the page then drops the component (decks-actions.tsx:46-48), but the transition it started goes on (:57-71) and nothing aborts the request. The cards are added all the same: the toast \"{count} kart eklendi\" and the refreshed page arrive over a page the person had left, and a refusal is lost, because `setRows` and `setFailed` write to a component that is gone, so the person is told nothing. Drawn as the state `abandoned`. The same family as IMPEXP-5 of tedris.decks.importExport; the reverse of nazar.nazirs.appoint's APPOINT-1 (there the close does nothing and is not marked). Fix: refuse a close while the file is out and mark it, or abort the request." }
  - { id: IMPORT-2, rule: "new, from the code: the dialog never says what the file must hold, and its first focus is not on a field. The help line gives the formats and 5 MB (Decks.importHelp); the file needs the three English header names Card Type, Content Front and Content Back (matched without regard to case, any other column is ignored), a Card Type that is VOCABULARY or HADEETH, and at most 1000 data rows (apps/tedrisat/src/flashcard/flashcard-bulk.service.ts:54, libs/common/src/excel/excel.service.ts:203-215): only the template says the first two, and nothing says the third. A file with more than 1000 rows is a 422 whose one error is on row 1002, field \"cards\", message \"A bulk request may contain at most 1000 cards; received 1001\" (bulk-row-limit.error.ts): the alert counts \"1 satırda hata var\" and lists \"Satır 1002\", a row that does not exist, in English. And the dialog passes no `initialFocus` (import-cards-dialog.tsx:75-92), so Base UI gives the focus to the first tabbable element, the close icon (not seen; the kit's own rule 13 says the first field). Fix: say the columns and both limits in the help line; give the row limit its own sentence; pass a ref to the deck field or the file input." }
  - { id: IMPORT-3, rule: "new, from the code and from the API's source: a file the dialog accepts can still be one the API cannot read, and every such refusal is the one sentence \"İşlem tamamlanamadı. Tekrar deneyin.\" (import-cards-dialog.tsx:70,161; `importRowProblems` finds no row). (a) A CSV that the browser calls `application/vnd.ms-excel` (what Windows with Excel installed gives a .csv; general knowledge, not seen) is read as a workbook and answers 500 (apps/tedrisat/src/flashcard/flashcard.controller.ts:492-496, libs/common/src/excel/excel.service.ts:257-264); the dialog's own check looks at the file's name alone (decks.ts:303-311). (b) A CSV saved by Excel in a Turkish locale has semicolons: no header matches, no data row, 400 \"no data rows\" (flashcard.controller.ts:520-523); the template CSV is written as UTF-8 with no byte-order mark and commas, which Excel on such a system opens in the local code page (the Arabic example row garbles), the same as IMPEXP-3 of tedris.decks.importExport. (c) A file with a header and no data row, or with other header names, is the same 400. Nothing tells the person to try anything but the same thing again. Fix: choose the format by the file's extension, read the delimiter from the header row, and map a 400 and a 500 to sentences that say what to change." }
  - { id: IMPORT-4, rule: "new, from the code: nothing compares a row's Card Type with the deck's own type (the domain's finding no-card-type-match), and the template's two example rows are one HADEETH and one VOCABULARY (apps/tedrisat/src/flashcard/dto/config-excel.dto.ts examples). The template imported as it is therefore puts a hadith card into a \"Kelime\" deck; the deck field names decks by title only, not by type (import-cards-dialog.tsx:99-102). The walk's `sends` scenario imports the unedited template into a Kelime deck and reads the types it left. Fix: refuse a row whose type is not the deck's, or take the deck's type for a row that leaves it out and say so." }
  - { id: IMPORT-5, rule: "new, from the code: the dialog starts with the first deck of the list selected (`useState(fixedDeckId ?? decks[0]?.id)`, import-cards-dialog.tsx:39-41; the Select's placeholder \"Seçin\" can never show), and after a clean file the toast says only \"{count} kart eklendi\" (Decks.importDone) and the list's totals line moves: no sentence names the deck that received them. A person who did not open the field sends the cards to whichever deck the course lists first, and cannot tell where they went without opening decks one by one. Fix: start with no choice (or say \"Hedef deste: X\" in the dialog's help) and name the deck in the toast (\"{count} kart {deck} destesine eklendi\")." }
  - { id: focus-not-set, rule: "neither page sets an initial focus (no autoFocus and no focus() in decks-page.tsx, decks-actions.tsx, deck-detail-page.tsx or deck-detail-screen.tsx), so `pageMain` has no initialFocus; nothing is drawn of where the focus goes after a template link, after a clean import (the dialog's own return to \"Excel'den aktar\" is the one exception, drawn as returnsFocus) or after the page is read again. Recorded so the silence is not read as an omission." }
  - { id: list-has-no-name, rule: "the open list of decks is an unnamed listbox: the kit's Select sets no aria-label on BaseSelect.List (libs/ui/src/mds/select.tsx:80), as in nazar.offsite.requestCourse and tedris.discover.applyForKosk. Fix: name the list with the field's label in the kit." }
  - { id: label-in-name, rule: "the visible text of every button and link is its accessible name or in it (WCAG 2.5.3): \"Excel'den aktar\", \"Deste aç\", \"Aktar\", \"Vazgeç\", \"Excel (.xlsx)\", \"CSV (.csv)\". The two template links say what format they are and not that they are the template; the sentence before them in the same paragraph does (\"Örnek şablon:\")." }
