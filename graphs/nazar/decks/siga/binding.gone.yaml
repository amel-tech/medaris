# nazar.decks.siga, the deck gone before the save: the müderris has the dialog open on a deck that is deleted meanwhile (by someone who
# holds deck.manage_course too, here by the same account through the API), so POST /flashcard/decks/:deckId/cards answers DECK_NOT_FOUND and
# the dialog says "İşlem tamamlanamadı. Tekrar deneyin." under the drafts and stays (SIGA-7: told to try again, though nothing helps).
#   flock <scratchpad>/replay.lock nice -n 10 node /home/taha/delurio-wt/medaris-engine/apps/engine/src/cli.ts replay graphs/nazar/decks/siga \
#     --bind graphs/nazar/decks/siga/binding.gone.yaml --cover transitions --out <dir>
# A file of its own for what binding.yaml's header says: `before` on a state is shared by every scenario of its file. The deck is deleted when
# the walk reaches the form (`rootTyped`), which is after the page was read and before the save, and the dialog's own steps call nothing: the
# drafts are built in the browser. `helpers/course-deck.mjs gone` says "already gone" the second time, since the walk reaches `rootTyped` again after "Geri".
# NOT RUN in the writing phase. The seat is the same as binding.yaml's: its `setup` and `teardown` run again here, and `helpers/course-deck.mjs remove`
# finds nothing left to delete for the deck.
schema: delurio-graph/0
kind: binding
extends: walk.common.binding.yaml
flow: nazar.decks.siga

states:
  rootTyped:
    before:
      - run: [node, helpers/course-deck.mjs, gone, siga]
        expect: 'deck'

scenarios:
  # A deck that is gone when she saves: the failure line under the drafts, the drafts kept, and the call is held while the busy button is checked.
  deckGone:
    given: { root: fine, meanings: typed, tenses: both, answer: gone }
    as: muderris
    open: '{nazar}/ders/{made.course}/deste'
    enter: { nav: ../../nav, bind: enter.nav.binding.yaml, entry: 'dersDeck->dersDeckOne' }
    vars:
      course: '{made.course}'
      deck: '{deck.deck}'
      rootText: 'ن ص ر'
      maziMeaning: 'yardım etti'
      muzariMeaning: 'yardım ediyor'
      goodRoot: 'ن ص ر'
      edited: 'O yardım etti'
      expectCards: 'cards 28 VOCABULARY metas=28 kips=mazi,muzari kok=ن ص ر bab=nasara first=نَصَرَ'
    setup:
      - run: [node, helpers/course-deck.mjs, remove, siga]
        expect: 'deck remove siga'
      - run: [node, helpers/course.mjs, make, siga, --weeks, '1', --lessons, '1', --hoca, MUDERRIS]
        expect: '"course"'
      - run: [node, helpers/course-deck.mjs, make, siga]
        expect: '"deck"'
    teardown:
      - run: [node, helpers/course-deck.mjs, remove, siga]
        expect: 'deck remove siga'
      - run: [node, helpers/course.mjs, remove, siga]
        expect: 'course remove siga'
