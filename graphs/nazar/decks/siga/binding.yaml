      - run: [node, helpers/course.mjs, make, siga, --weeks, '1', --lessons, '1', --hoca, MUDERRIS]
        expect: '"course"'
      - run: [node, ../nazar/decks/siga/deck.mjs, make, siga]
        expect: '"deck"'
    teardown:
      - run: [node, ../nazar/decks/siga/deck.mjs, remove, siga]
        expect: 'deck remove siga'
