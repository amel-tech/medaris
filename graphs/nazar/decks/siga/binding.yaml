        expect: 'course remove siga'

  # A weak letter (قول, with a waw): 'Hemzeli ya da illetli kök bu üreticide yok; yalnız sâlim fiil.'
  rootWeak:
    given: { root: weak, meanings: typed, tenses: both, answer: created }
    as: muderris
    open: '{nazar}/ders/{made.course}/deste'
    enter: { nav: ../../nav, bind: enter.nav.binding.yaml, entry: 'dersDeck->dersDeckOne' }
