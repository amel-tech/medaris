  rootLetters: { type: text, component: Text, text: { key: Decks.siga.rootLetters }, in: [rootTyped], when: "said == 'letters'", source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:259 }
  rootWeak: { type: text, component: Text, text: { key: Decks.siga.rootWeak }, in: [rootTyped], when: "said == 'weak'", source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:259 }
  rootDoubled: { type: text, component: Text, text: { key: Decks.siga.rootDoubled }, in: [rootTyped], when: "said == 'doubled'", source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:259 }

  babSelect: { type: field, component: TextField, role: combobox, text: { key: Decks.siga.bab }, in: [rootStep, rootTyped], source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:285 } # a Base UI select, six options named in Latin ("Nasara – yensuru" ... "Hasibe – yahsibu", siga.ts:87-127); the asterisk is not given to it (F-D1-03)
  babHelpNasara: { type: text, component: Text, text: { key: composed.Decks.siga.babNameNasara }, in: [rootStep, rootTyped], when: "bab == 'nasara'", source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:279 } # the model verb of the chosen bâb, `lang="ar"`
  babHelpDaraba: { type: text, component: Text, text: { key: composed.Decks.siga.babNameDaraba }, in: [rootTyped], when: "bab == 'daraba'", source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:279 }

  kipsGroup: { type: list, component: List, role: group, name: { key: Decks.siga.kips }, in: [rootStep, rootTyped], source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:294 } # a <fieldset> and its <legend>
  kipMazi: { type: field, component: TextField, role: checkbox, text: { key: composed.Decks.siga.kipCountMazi }, checked: "kips != 'none'", in: [rootStep, rootTyped], emits: UNTICK_MAZI, source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:298 }
  kipMuzari: { type: field, component: TextField, role: checkbox, text: { key: composed.Decks.siga.kipCountMuzari }, checked: "kips == 'both'", in: [rootStep, rootTyped], emits: UNTICK_MUZARI, source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:307 }
  kipsRequired: { type: text, component: Text, text: { key: Decks.siga.kipsRequired }, in: [rootStep, rootTyped], when: "kips == 'none' and said != 'none'", source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:316 } # a bare <p class="mds-error"> tied to both boxes by aria-describedby and aria-invalid; not a live region (SIGA-4)

  maziMeaningField: { type: field, component: TextField, role: textbox, text: { key: Decks.siga.maziMeaning }, value: { literal: "" }, in: [rootStep, rootTyped], when: "kips != 'none'", source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:327 } # drawn while its tense is ticked; optional here (SIGA-3)
  maziMeaningHelp: { type: text, component: Text, text: { key: Decks.siga.maziMeaningHelp }, in: [rootStep, rootTyped], when: "kips != 'none'", source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:325 }
  muzariMeaningField: { type: field, component: TextField, role: textbox, text: { key: Decks.siga.muzariMeaning }, value: { literal: "" }, in: [rootStep, rootTyped], when: "kips == 'both'", source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:339 }
  muzariMeaningHelp: { type: text, component: Text, text: { key: Decks.siga.muzariMeaningHelp }, in: [rootStep, rootTyped], when: "kips == 'both'", source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:337 }

  cancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: Decks.cancel }, in: [rootStep, rootTyped], emits: CANCEL, source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:182 } # "Vazgeç" is a DialogClose: it closes and never submits
  previewButton: { type: action, component: Button, role: button, intent: confirm, text: { key: Decks.siga.preview }, in: [rootStep, rootTyped], emits: PREVIEW, source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:183 } # the form's submit; never disabled

  # ---- step 2: the drafts ------------------------------------------------------------------------------------------------------
  previewHint: { type: text, component: Text, text: { key: Decks.siga.previewHint }, in: [preview, saving], source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:190 } # says the cards are saved as corrected; "Geri" does not keep the corrections (SIGA-5)
  maziHeading: { type: text, component: Heading, role: heading, text: { key: Decks.siga.kipMazi }, in: [preview, saving], source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:195 } # h3
  muzariHeading: { type: text, component: Heading, role: heading, text: { key: Decks.siga.kipMuzari }, in: [preview, saving], when: "kips == 'both'", source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:195 } # h3
  draftFront: { type: field, component: TextField, role: textbox, text: { key: Decks.siga.front }, in: [preview, saving], repeat: drafts, source: apps/nazar/features/decks/components/siga-generator-dialog.tsx:215 } # one per sîga, lang=ar dir=rtl, in a <fieldset> whose <legend> is the sîga ("Gâib · müfred"): 28 groups with the same two labels
