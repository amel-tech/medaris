# The screens of nazar.decks.siga: one deck's page (/ders/<id>/deste/<deckId>) behind, and the dialog "Sîga üretici" over it, in its two
# steps. Read from apps/nazar/features/decks/components/{deck-detail-page,deck-detail-screen,siga-generator-dialog}.tsx and
# features/decks/siga.ts on 15 Nov 2026. Every key without a `composed.` prefix is copied letter for letter from
# libs/i18n/src/locales/tr/nazar.json (namespaces Decks, Shell) by script. The `composed.*` keys are text the code builds, found in no
# message file:
#   composed.Decks.cardsHeading            "Kartlar · {count}"          Decks.cardsTitle, " · " and the number of cards in one <h2> (deck-detail-screen.tsx:64-66)
#   composed.Decks.siga.kipCountMazi       "Mâzî · 14 sîga"             Decks.siga.kipCount filled with Decks.siga.kipMazi (siga-generator-dialog.tsx:298-301)
#   composed.Decks.siga.kipCountMuzari     "Muzâri · 14 sîga"           the same with Decks.siga.kipMuzari (siga-generator-dialog.tsx:307-310)
#   composed.Decks.siga.babNameNasara      "نَصَرَ يَنْصُرُ"            the Arabic model verb of the bâb, under the select (siga.ts:91, siga-generator-dialog.tsx:279-281)
#   composed.Decks.siga.babNameDaraba      "ضَرَبَ يَضْرِبُ"            (siga.ts:98)
# The one message that is not the app's is `Changes.note`: no app message says what "N kartı kaydet" changes (every card is added at
# once, a published deck shows them to the talebe, no button takes them back together), so one short, factual Turkish note is authored.
#
# The page behind is drawn only where the dialog is closed: the dialog is modal, so the page is inert while it is open.
# The numbers in the samples are the main story's: 28 cards, the 14 of one tense is a scenario's own `samples` in the binding.
schema: delurio-graph/0
kind: ui
id: nazar.decks.siga
flow: nazar.decks.siga
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  count: "28"
  min: "3"
  max: "5000"

# Nothing in features/decks gives the page a focus on load, and nothing gives one back after the dialog is gone. The dialog passes no
# `initialFocus`, so Base UI's own default takes the first tabbable element of the popup, which is the close icon of its header
# (document order; not verified in a browser). It is drawn as the app's behaviour, not as its choice (rule focus-not-set).
nodes:
  # ---- the deck page, the dialog closed ----------------------------------------------------------------------------------------
  deckPage: { type: page, component: Page, role: main, in: [deck, saved], source: libs/ui/src/mds/app-shell.tsx:42 } # the shell's one <main id="main">; it has no name
  deckTitle: { type: text, component: Heading, role: heading, text: { literal: "Sîga denemesi" }, in: [deck, saved], source: apps/nazar/features/decks/components/deck-detail-page.tsx:82 } # h1, the deck's own title, with `lang="auto"`, which is not a language tag (F-D1-14); the walk's deck is named like this
  deckState: { type: text, component: Text, text: { key: Decks.draftState }, in: [deck, saved], source: apps/nazar/features/decks/components/deck-detail-page.tsx:86 } # the deck is a draft in every walk: the talebe never see it
  cardsHeading: { type: text, component: Heading, role: heading, text: { key: composed.Decks.cardsHeading, params: { count: cards.length } }, in: [deck, saved], when: "cards == 'some'", source: apps/nazar/features/decks/components/deck-detail-screen.tsx:64 } # h2 "Kartlar · 28"; "Kartlar · 0" while the deck holds none (not drawn)
  sigaButton: { type: action, component: Button, role: button, intent: secondary, text: { key: Decks.siga.button }, in: [deck, saved], emits: OPEN_SIGA, source: apps/nazar/features/decks/components/deck-detail-screen.tsx:68 }
  cardsEmpty: { type: text, component: Text, text: { key: Decks.cardsEmpty }, in: [deck], when: "cards == 'none'", source: apps/nazar/features/decks/components/deck-detail-screen.tsx:79 }
  cardsGrid: { type: list, component: List, role: list, in: [deck, saved], when: "cards == 'some'", source: apps/nazar/features/decks/components/deck-detail-screen.tsx:81 } # a <ul> of tiles; each tile has Düzenle and Sil icon buttons named alike on every tile (F-D1-25, nazar.decks.openAndFill)
  cardTile: { type: list, component: ListItem, role: listitem, in: [deck, saved], when: "cards == 'some'", repeat: cards.items, source: apps/nazar/features/decks/components/deck-detail-screen.tsx:83 } # the Arabic front and the Turkish back of one card; a sîga's own group is not shown on this page

