  savingStatus: { type: status, component: Status, role: status, text: { literal: "Yükleniyor" }, in: [saving], source: libs/ui/src/mds/button.tsx:114 } # the button's hidden <output>, from a default outside the catalog (F-D1-24)

edges:
  - { labelledBy: [dialog, dialogTitle] }
  - { triggers: [sigaButton, rootStep] }
  - { triggers: [saveAll, saving] }
  - { triggers: [backButton, rootTyped] }
  - { returnsFocus: [dialog, sigaButton] } # Base UI returns the focus to what had it when the dialog opened; here the dialog is unmounted by its parent, not closed, so this is not verified in a browser

rules:
  - { id: focus-not-set, rule: "Nothing in features/decks gives the page a focus on load, nothing moves it into the first field when the dialog opens (no `initialFocus` is passed, so Base UI's default, the close icon of the header, applies; not verified) and nothing places it when the dialog closes or after a save (the dialog is unmounted by the parent; whether Base UI hands the focus back to 'Sîga üret' is not verified). Fix: pass `initialFocus` the root box, and focus the button or the cards' heading after a save." }
  - { id: F-D1-21, rule: "`dismissible={!pending}` makes a click on the scrim close step 2 while it is idle, so a stray click throws away 28 edited drafts; every other form dialog of this part keeps the scrim inert (the form default is `dismissible` false). Esc and the close icon close it too, with no question, and the drafts and what was typed in step 1 go with them. Switching between the steps replaces the footer's buttons ('Vazgeç', 'Önizle' for 'Geri', '28 kartı kaydet'), so the focused button unmounts and the focus falls to the dialog (siga-generator-dialog.tsx:156, 161-186). Fix: drop `dismissible`, ask before closing step 2, keep the focus on the dialog title between steps." }
  - { id: F-D1-03, rule: "`Field required` draws an `aria-hidden` asterisk on 'Kök' and 'Bâb' and the controls carry no `required` or `aria-required`, so a screen reader is never told they are required (siga-generator-dialog.tsx:254-284). Fix: pass `required` to the Input and the Select." }
  - { id: F-D1-24, rule: "The dialog passes no `closeLabel`, so the close icon's 'Kapat' comes from the primitive's hard-coded default (dialog.tsx:64), not from the catalog; the busy save button announces 'Yükleniyor' from a default too (button.tsx:114, no `loadingLabel` at siga-generator-dialog.tsx:176). Fix: pass `Shell.close` and a `loadingLabel` from the catalog." }
  - { id: F-D1-20, rule: "No try/catch around `createCards` in the `startTransition(async ...)` of save (siga-generator-dialog.tsx:113-134): when the browser cannot reach Next, the rejection escapes, the busy button is never cleared and nothing is said. Not verified in a browser. Fix: wrap it, and say 'Files.errors.network'." }
  - { id: F-D1-14, rule: "The deck's title is an `<h1 lang=\"auto\">`; `auto` is not a language tag (the intent is `dir=\"auto\"`) and can confuse a screen reader's voice choice (deck-detail-page.tsx:82). Drawn on the page behind the dialog." }
  - { id: F-B-12, rule: "The dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:107-116), so `aria-describedby` points at everything inside it, in step 2 at 56 boxes. Not verified how a screen reader treats it. Fix: describe the dialog with the scope sentence or the hint only." }
  - { id: SIGA-1, rule: "New. The dialog is given the deck's id and card type and none of its cards (deck-detail-screen.tsx:97-101), the API has no uniqueness rule on a card, and so a second run of the same root and bâb writes 28 more cards. tedris-web lays the first card of each cell in the sarf table and puts the second into the plain grid (apps/tedris/features/courses/siga-table.ts, sigaLayout), so the talebe sees every sîga twice. Fix: pass the cards, say in step 2 which sîgas the deck already holds, and leave them out unless she keeps them (D2). Not walked: the walk adds the cards once." }
  - { id: SIGA-2, rule: "New, from the domain finding no-card-type-match. Every card is written with `type: deck.cardType` (siga-generator-dialog.tsx:117) and the generator is offered in a 'Hadis' deck too, so a hadis deck can hold conjugation cards typed HADEETH. Nothing compares the type with anything, and a PUT of the deck can later change the deck's cardType (put-deck-changes-card-type) without touching its cards. The deck page never shows the deck's type. A sîga card is recognised only by its `contentMeta` (D1). Fix: decide the type of a sîga card, and offer or refuse the generator by the deck's type." }
  - { id: SIGA-3, rule: "New. The two meaning fields are optional in step 1 (no asterisk, no word), 'Önizle' builds 28 drafts with empty meanings, and `sigaDraftProblems` then stops the save (an emptied back is one of the problems, siga.ts:396-408): only after '28 kartı kaydet' is pressed does each 'Anlam' say 'Bu alan 3 ile 5000 karakter arasında olmalı.', 28 times, with the focus on the button and nothing announced. The person must type 28 meanings or go back. A meaning that does not end in -dı, -tı, -yor or -r is copied unchanged after every person ('O (erkek) yardım edecek', 'Ben yardım edecek'). Fix: say in step 1 that the meaning is needed, or let the back stay empty (D3)." }
  - { id: SIGA-4, rule: "New, the family of F-D1-16 in this dialog. The root's four messages and the one under 'Kipler' show after 'Önizle', and the 28 length messages after save, as `Field.Error` or a bare `<p>` with no role and no live region (libs/ui/src/mds/field.tsx), and the focus stays on the pressed button, so a screen-reader user hears nothing after pressing it. The root's message also replaces its hint (with the example root). In step 2 the first message can be far above the button. Fix: focus the first invalid control, or give the messages `role=alert`." }
  - { id: SIGA-5, rule: "New. 'Geri' keeps the root, the bâb, the tenses and the meanings of step 1 but drops the drafts (`setDrafts(null)`, siga-generator-dialog.tsx:168-172), and the next 'Önizle' builds every draft again from them, so a vowel or a meaning corrected in step 2 is lost without a word, while the hint above the drafts says the cards are saved as corrected. Fix: keep the drafts while the typed values are unchanged, or say that going back drops the corrections." }
  - { id: SIGA-6, rule: "New. The footer's submit is the form's default button, so Enter in any of the 56 boxes of step 2 saves all 28 cards at once, with no question (`submit` calls `save` when there are drafts, siga-generator-dialog.tsx:137-141); a person pressing Enter to leave a corrected box writes 28 cards, which cannot be taken back together. Fix: save only from the button, or ask first." }
  - { id: SIGA-7, rule: "New. A refused save draws one sentence, 'İşlem tamamlanamadı. Tekrar deneyin.', whatever the reason (`deckErrorKey` knows two, and only COURSE_DECK_NOT_DRAFT, which this call cannot raise, is not the generic one, decks.ts:255-258): a deck that was deleted meanwhile (DECK_NOT_FOUND) or a permission that was withdrawn (AUTHZ_FORBIDDEN) is told to try again. The line is the last child of the dialog's scrolling body, below the 28 drafts, while the focus stays on the footer's button. It is `role=alert`, so it is announced; a sighted person at the top of the list does not see it. Fix: say the reason, and place the line where the button is." }
  - { id: drafts-are-grouped, rule: "Each draft's two boxes sit in a `<fieldset>` whose `<legend>` names the sîga ('Gâib · müfred', 'Mütekellim · maa'l-gayr'), the Arabic box is `lang=ar dir=rtl`, and the two kips are under h3 headings inside the h2 of the dialog: so the 56 boxes with two labels are told apart. Holds." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name ('Önizle', 'Geri', 'N kartı kaydet', 'Sîga üret'); the checkboxes are named by their visible label. Holds." }
