    title: The list of the course's decks
    type: final
    description: >-
      The page the course's decks are listed on (nazar.decks.openAndFill draws it): "← Ders desteleri" leads here, and so does a delete, which brings the toast
      "Deste silindi" with it (the stale-toast rule keeps a toast fired after the press; libs/ui/src/hooks/use-dismiss-stale-toasts.ts). The deck is not on the list.
