# The screens of nazar.notifications.inbox: nazar-web's Bildirimler (/bildirimler), as it draws a person's list
# (apps/nazar/features/notifications), the tabs, the three kinds of row, the busy button, the error boxes and the toast of a refused
# mark; and, from the frame around it, the entry "Bildirimler" with the number it carries and the bell's name (the rest of the frame is
# nazar.shell.scopeAndMenu's; the pages the rows lead to are Tedris's).
#
# Words: every `Notifications.*`, `Nav.*`, `Shell.*` and `Problems.*` key is copied letter for letter from
# libs/i18n/src/locales/tr/nazar.json (the app reads it as `nazar.Notifications`), the key being the path inside that file. The
# `composed.*` keys are NOT in any i18n file: they are the texts the app builds in code or the kit writes, written here with their
# placeholders so that a replay can match them:
#   composed.Notifications.rowName     "{title} {time}"          a row's accessible name: its sentence and its time, for a read row
#                                                                (notifications-list.tsx:295-302)
#   composed.Notifications.rowNameNew  "{title} {time} {new}"    the same for an unread row, with the badge's word at the end
#                                                                (notifications-list.tsx:303; the order is the browser's, not verified)
#   composed.Notifications.time        "{time}"                  the <time> of a row: "3 Eki 2026 21:00" in the person's zone
#                                                                (notifications.ts:87-92, notifications-list.tsx:299)
#   composed.Toast.close               "Kapat"                   the toast's close button, a constant of the kit (libs/ui/src/mds/toast.tsx:97)
#   composed.Button.loading            "Yükleniyor"              the hidden word of the first retry's busy button: the kit's default `loadingLabel`
#                                                                (libs/ui/src/mds/button.tsx:62), where the load-more button passes its own (loadingMore)
# `Changes.note` is the one message of this catalog that is not the app's: no message of the page says what a mark does or that it is
# kept (INBOX-4), so one short, factual Turkish sentence is authored here.
# Samples are invented and neutral. The sentence of every kind is drawn from one node (rowTitle), so a placeholder with no sample
# matches any text; `outcome` is the value the two select messages of the catalog read.
schema: delurio-graph/0
kind: ui
id: nazar.notifications.inbox
flow: nazar.notifications.inbox
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  title: Ders başvurunuz onaylandı
  time: 3 Eki 2026 21:00
  new: Yeni
  count: "3"
  outcome: approved

# No code gives the page a focus when it opens or moves it after a mark (no autoFocus and no focus() in features/notifications), so
# there is no `initialFocus` on the page and no `focus` here: the graph says nothing of what the code does not say (rule focus-not-set).
nodes:
  # ---- the page and its title -------------------------------------------------------------------------------------------------
  page: { type: page, component: Page, role: main, in: [forbidden, readFailed, retrying, emptyAll, listed, allRead, loadingTab, tabFailed, markingOne, markingLast, markingLink, markingAll, loadingMore, moreFailed], source: apps/nazar/features/notifications/components/notifications-page.tsx:29 } # the shell's one <main id="main">; it has no name and nothing moves the focus into it
  pageTitle: { type: text, component: Heading, role: heading, text: { key: Notifications.title }, in: [forbidden, readFailed, retrying, emptyAll, listed, allRead, loadingTab, tabFailed, markingOne, markingLast, markingLink, markingAll, loadingMore, moreFailed], source: apps/nazar/features/notifications/components/notifications-page.tsx:31 } # h1, drawn above the body in every state

  # ---- the frame's entry and bell: the unread number the stack's accounts never had ---------------------------------------------
  menuLink: { type: action, component: LinkButton, role: link, text: { key: Nav.general.notifications }, in: [forbidden, readFailed, retrying, emptyAll, listed, allRead, loadingTab, tabFailed, markingOne, markingLast, markingLink, markingAll, loadingMore, moreFailed], source: apps/nazar/features/shell/nav.ts:58 } # the sidebar's entry; aria-current="page" here; its name carries the number below, so it is found by its beginning
  menuCount: { type: text, component: Text, text: { key: Shell.countUnread }, in: [listed, markingOne, markingLast, markingLink, markingAll, loadingTab, tabFailed, loadingMore, moreFailed], source: libs/ui/src/mds/nav-item.tsx:61 } # the number is drawn only above zero; this is its hidden word. It is the server's count, read again after a successful mark, so it lags a press (markingLast, markingAll)
  bell: { type: action, component: LinkButton, role: link, name: { key: Shell.bell }, in: [emptyAll, allRead], source: apps/nazar/features/shell/components/portal-menu.tsx:88 } # below 768 px only, a link with no visible number: its name is all a person is told
  bellUnread: { type: action, component: LinkButton, role: link, name: { key: Shell.bellUnread, params: { count: unread.count } }, in: [listed, markingOne, markingLast, markingLink, markingAll, loadingTab, tabFailed, loadingMore, moreFailed], source: apps/nazar/features/shell/components/portal-frame.tsx:109 } # the same link with the count in its name, from the same read as the menu's number

  # ---- the first read failed, or was refused ------------------------------------------------------------------------------------
  forbiddenAlert: { type: alert, component: Alert, role: status, name: { key: Problems.forbiddenTitle }, text: { key: Problems.forbidden }, in: [forbidden], source: apps/nazar/features/shell/components/page-problem.tsx:23 } # a neutral Alert is a status, not an alert
  failedBox: { type: page, component: Page, role: region, name: { labelledBy: failedTitle }, in: [readFailed, retrying], source: libs/ui/src/mds/system-state.tsx:33 } # SystemState draws a <section aria-labelledby> inside the shell
  failedTitle: { type: text, component: Heading, role: heading, text: { key: Notifications.loadFailedTitle }, in: [readFailed, retrying], source: libs/ui/src/mds/system-state.tsx:43 } # an h1 as well (F-E-10)
  failedText: { type: text, component: Text, text: { key: Notifications.loadFailed }, in: [readFailed, retrying], source: libs/ui/src/mds/system-state.tsx:46 }
  firstRetry: { type: action, component: Button, role: button, intent: secondary, text: { key: Shell.retry }, in: [readFailed, retrying], disabledIn: [retrying], emits: RETRY, source: apps/nazar/features/shell/components/load-failed.tsx:33 } # busy while the page is read again (aria-disabled, aria-busy)
  firstRetryBusy: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [retrying], source: libs/ui/src/mds/button.tsx:113 }

  # ---- the tabs and the button that marks every row read ----------------------------------------------------------------------------
  tabList: { type: list, component: List, role: tablist, name: { key: Notifications.tabsLabel }, in: [emptyAll, listed, allRead, loadingTab, tabFailed, markingOne, markingLast, markingLink, markingAll, loadingMore, moreFailed], source: apps/nazar/features/notifications/components/notifications-list.tsx:236 } # Base UI tabs, activateOnFocus: the arrow keys move and select
  tabAll: { type: action, component: Button, role: tab, text: { key: Notifications.tabAll }, in: [emptyAll, listed, allRead, loadingTab, tabFailed, markingOne, markingLast, markingLink, markingAll, loadingMore, moreFailed], duringStep: true, emits: OPEN_ALL, source: apps/nazar/features/notifications/components/notifications-list.tsx:242 } # its name is this word and the total (the count is a span right after it; the exact join is not verified in a browser)
  tabUnread: { type: action, component: Button, role: tab, text: { key: Notifications.tabUnread }, in: [emptyAll, listed, allRead, loadingTab, tabFailed, markingOne, markingLast, markingLink, markingAll, loadingMore, moreFailed], duringStep: true, emits: OPEN_UNREAD, source: apps/nazar/features/notifications/components/notifications-list.tsx:243 } # the same, with the unread count
  markAll: { type: action, component: Button, role: button, intent: secondary, text: { key: Notifications.markAllRead }, in: [listed, markingOne, markingLast, markingAll, allRead, loadingTab, tabFailed, loadingMore, moreFailed], disabledIn: [markingLast, markingAll, allRead], duringStep: true, emits: READ_ALL, source: apps/nazar/features/notifications/components/notifications-list.tsx:247 } # not drawn at 0 total; natively `disabled` at 0 unread (F-E-9), with no busy state of its own
  panelAll: { type: page, component: Page, role: tabpanel, name: { key: Notifications.tabAll }, in: [emptyAll, listed, allRead, loadingTab, tabFailed, markingOne, markingLast, markingLink, markingAll, loadingMore, moreFailed], when: "tab == 'all'", source: apps/nazar/features/notifications/components/notifications-list.tsx:257 } # a hand-made div with an aria-label and aria-live="polite", not the tab's own panel (F-E-6)
  panelUnread: { type: page, component: Page, role: tabpanel, name: { key: Notifications.tabUnread }, in: [emptyAll, listed, allRead, loadingTab, tabFailed, markingOne, markingLast, markingLink, markingAll, loadingMore, moreFailed], when: "tab == 'unread'", source: apps/nazar/features/notifications/components/notifications-list.tsx:257 }

  # ---- the rows: a list of three kinds ----------------------------------------------------------------------------------------------
  rowList: { type: list, component: List, role: list, name: { key: Notifications.listLabel }, in: [listed, allRead, markingOne, markingLast, markingLink, markingAll, loadingMore, moreFailed], when: rowsShown, source: apps/nazar/features/notifications/components/notifications-list.tsx:197 } # a <ul> in a card
  rowItem: { type: list, component: ListItem, role: listitem, in: [listed, allRead, markingOne, markingLast, markingLink, markingAll, loadingMore, moreFailed], when: rowsShown, repeat: rows, source: apps/nazar/features/notifications/components/notifications-list.tsx:307 } # data-testid="notification-row", data-unread while unread
  rowLinkUnread: { type: action, component: LinkButton, role: link, name: { key: composed.Notifications.rowNameNew, params: { title: row.title, time: row.time, new: row.badge } }, in: [listed, loadingMore, moreFailed], when: "row == 'link'", repeat: rows.unreadLinks, emits: OPEN_LINK, source: apps/nazar/features/notifications/components/notifications-list.tsx:313 } # an <a href> on Tedris: the click is cancelled for every key (F-E-5), the row is marked, the same tab goes on (INBOX-1, F-E-21)
  rowButton: { type: action, component: Button, role: button, intent: secondary, name: { key: composed.Notifications.rowNameNew, params: { title: row.title, time: row.time, new: row.badge } }, in: [listed, markingOne, loadingMore, moreFailed], when: "row == 'button'", repeat: rows.unreadButtons, duringStep: true, emits: PRESS_ROW, source: apps/nazar/features/notifications/components/notifications-list.tsx:321 } # an unread row with no address: it marks and goes; the pressed button is unmounted under the focus (F-E-8)
  rowLinkRead: { type: action, component: LinkButton, role: link, name: { key: composed.Notifications.rowName, params: { title: row.title, time: row.time } }, in: [listed, allRead, markingOne, markingLast, markingLink, markingAll, loadingMore, moreFailed], when: "tab == 'all'", repeat: rows.readLinks, emits: OPEN_LINK, source: apps/nazar/features/notifications/components/notifications-list.tsx:313 } # a read row with an address is still a link, which leads on and marks nothing
  rowText: { type: text, component: Text, text: { key: composed.Notifications.rowName, params: { title: row.title, time: row.time } }, in: [listed, allRead, markingOne, markingLast, markingLink, markingAll, loadingMore, moreFailed], when: "tab == 'all'", repeat: rows.readPlain, source: apps/nazar/features/notifications/components/notifications-list.tsx:329 } # a read row with no address is a <div>: not interactive
  rowTitle: { type: text, component: Text, text: { oneOf: [Notifications.types.ENROLLMENT_APPROVED, Notifications.types.ENROLLMENT_REJECTED, Notifications.types.REMOVED_FROM_COURSE, Notifications.types.COURSE_ACCESS_REMOVED, Notifications.types.SESSION_RESCHEDULED, Notifications.types.SESSION_CANCELLED, Notifications.types.SESSION_ADDED, Notifications.types.RECORDING_ADDED, Notifications.types.KOSK_APPLICATION_RESULT, Notifications.types.DECK_PUBLISH_RESULT, Notifications.types.SUBMISSION_REVIEWED, Notifications.types.COURSE_BAN_PLACED, Notifications.types.KOSK_BAN_PLACED, Notifications.unknownTitle] }, in: [listed, allRead, markingOne, markingLast, markingLink, markingAll, loadingMore, moreFailed], when: rowsShown, repeat: rows, source: apps/nazar/features/notifications/components/notifications-list.tsx:296 } # one sentence per kind and nothing else (INBOX-3); the three EXAM_* kinds read "Bildirim" (F-E-20); bold while unread
  rowTime: { type: text, component: Text, text: { key: composed.Notifications.time, params: { time: row.time } }, in: [listed, allRead, markingOne, markingLast, markingLink, markingAll, loadingMore, moreFailed], when: rowsShown, repeat: rows, source: apps/nazar/features/notifications/components/notifications-list.tsx:299 } # a <time dateTime=ISO>
  rowNew: { type: text, component: Text, text: { key: Notifications.new }, in: [listed, markingOne, loadingMore, moreFailed], repeat: rows.unread, source: apps/nazar/features/notifications/components/notifications-list.tsx:303 } # an info Badge with the word, not colour alone

  # ---- the panel when it holds no rows, or is busy, or failed ------------------------------------------------------------------------
  emptyText: { type: text, component: Text, text: { key: Notifications.empty }, in: [emptyAll], when: "tab == 'all'", source: apps/nazar/features/notifications/components/notifications-list.tsx:190 } # an EmptyState: a bell icon and one sentence, with no heading
  emptyUnreadText: { type: text, component: Text, text: { key: Notifications.emptyUnread }, in: [emptyAll, allRead, markingLast, markingAll, markingLink], when: emptyUnreadShown, source: apps/nazar/features/notifications/components/notifications-list.tsx:190 }
  tabBusy: { type: status, component: Status, in: [loadingTab], source: apps/nazar/features/notifications/components/notifications-list.tsx:165 } # a <div aria-busy="true"> of two aria-hidden bars: no role, no text (F-E-7)
  tabAlert: { type: alert, component: Alert, role: alert, text: { key: Notifications.loadFailed }, in: [tabFailed], source: apps/nazar/features/notifications/components/notifications-list.tsx:174 } # a <p class="mds-error" role="alert">
  tabRetry: { type: action, component: Button, role: button, intent: secondary, text: { key: Notifications.retry }, in: [tabFailed], emits: RETRY, source: apps/nazar/features/notifications/components/notifications-list.tsx:177 } # outline, small; not busy: pressing it draws the loading panel
  loadMore: { type: action, component: Button, role: button, intent: secondary, text: { key: Notifications.loadMore }, in: [listed, markingOne, loadingMore, moreFailed], when: "pages == 'several' and tab == 'all'", disabledIn: [loadingMore], duringStep: true, emits: LOAD_MORE, source: apps/nazar/features/notifications/components/notifications-list.tsx:218 } # drawn only while the API gave a further cursor; busy is aria-disabled and aria-busy, and it unmounts under the focus when the last page is added (F-E-8)
  loadMoreBusy: { type: status, component: Status, role: status, text: { key: Notifications.loadingMore }, in: [loadingMore], source: libs/ui/src/mds/button.tsx:113 } # the visually hidden <output> beside the busy button, with the word the page passes
  moreAlert: { type: alert, component: Alert, role: alert, text: { key: Notifications.loadMoreFailed }, in: [moreFailed], source: apps/nazar/features/notifications/components/notifications-list.tsx:214 } # a <p class="mds-error" role="alert"> above the button

  # ---- the toast of a refused mark (the kit's Toaster, Base UI): an error toast stays until it is closed ---------------------------------
  rowFailedToast: { type: alert, component: Alert, role: alertdialog, name: { labelledBy: rowFailedTitle }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingTab, tabFailed, loadingMore, moreFailed], when: "notice == 'rowFailed'", source: libs/ui/src/mds/toast.tsx:77 } # Base UI gives a high-priority toast the role alertdialog and a hidden role=alert copy while its region is not focused; its region is named "Bildirimler" like the page, the menu entry and the bell (F-E-14); not verified in a browser
  rowFailedTitle: { type: text, component: Text, text: { key: Notifications.markReadFailed }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingTab, tabFailed, loadingMore, moreFailed], when: "notice == 'rowFailed'", source: apps/nazar/features/notifications/components/notifications-list.tsx:129 } # a <p>; the toast has no description
  rowFailedClose: { type: action, component: Button, role: button, intent: dismiss, name: { key: composed.Toast.close }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingTab, tabFailed, loadingMore, moreFailed], when: "notice == 'rowFailed'", duringStep: true, emits: CLOSE_TOAST, source: libs/ui/src/mds/toast.tsx:95 } # an icon only, named by a literal of the kit (F-E-14)
  allFailedToast: { type: alert, component: Alert, role: alertdialog, name: { labelledBy: allFailedTitle }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingTab, tabFailed, loadingMore, moreFailed], when: "notice == 'allFailed'", source: libs/ui/src/mds/toast.tsx:77 }
  allFailedTitle: { type: text, component: Text, text: { key: Notifications.markAllFailed }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingTab, tabFailed, loadingMore, moreFailed], when: "notice == 'allFailed'", source: apps/nazar/features/notifications/components/notifications-list.tsx:159 }
  allFailedClose: { type: action, component: Button, role: button, intent: dismiss, name: { key: composed.Toast.close }, in: [listed, allRead, markingOne, markingLast, markingAll, loadingTab, tabFailed, loadingMore, moreFailed], when: "notice == 'allFailed'", duringStep: true, emits: CLOSE_TOAST, source: libs/ui/src/mds/toast.tsx:95 }

edges:
  - { labelledBy: [failedBox, failedTitle] }
  - { labelledBy: [rowFailedToast, rowFailedTitle] }
  - { labelledBy: [allFailedToast, allFailedTitle] }
  - { triggers: [firstRetry, retrying] }
  - { triggers: [tabUnread, loadingTab] }
  - { triggers: [markAll, markingAll] }
  - { triggers: [rowButton, markingOne] }
  - { triggers: [rowLinkUnread, markingLink] }
  - { triggers: [loadMore, loadingMore] }

rules:
  - { id: F-E-5, rule: "A row link's onClick calls preventDefault() for every click, Ctrl, Cmd and Shift included, then navigates the same tab with window.location.assign (notifications-list.tsx:138, open-address.ts:2): \"open in a new tab\" and \"copy the address\" by the keyboard or the mouse are lost for the one place that leaves for another app. Fix: skip the handler when event.button !== 0 or a modifier key is down, and mark read without cancelling the default." }
  - { id: F-E-6, rule: "The role=tabpanel is hand-written with only an aria-label (notifications-list.tsx:257-264) and Tabs is rendered without TabsPanel (libs/ui/src/mds/tabs.tsx:129-144), so the tab's aria-controls and the panel's labelledby are not set (not verified in a browser). The whole panel is aria-live=\"polite\", so a tab switch, \"more\" or a mark re-announces the list wholesale. Fix: render the list in TabsPanel and keep a short live status (\"3 okunmamış bildirim\") instead of a live list." }
  - { id: F-E-7, rule: "While a tab loads the panel holds two Skeleton bars (aria-hidden, libs/ui/src/mds/skeleton.tsx:20) in a div with aria-busy and no text (notifications-list.tsx:163-169): aria-busy on a div is not announced, so nothing is. The route's loading.tsx does carry a hidden \"Yükleniyor\". Fix: a visually hidden Shell.loadingLabel in an <output>." }
  - { id: F-E-8, rule: "Focus is lost after three actions: a button row marked on Okunmamış is removed from the DOM under focus (notifications.ts:124-140); \"Tümünü okundu say\" disables itself under focus (and empties the list on Okunmamış); \"Daha fazla göster\" unmounts under focus when the last page is added (notifications-list.tsx:211). Read from the code, not verified in a browser. Fix: move focus to the list, the active tab or the first remaining row, and use aria-disabled for the bulk button." }
  - { id: F-E-9, rule: "\"Tümünü okundu say\" is natively disabled at 0 unread with no stated reason (notifications-list.tsx:250) and not drawn at 0 total (:246): two ways to say nothing to mark. Fix: keep it focusable with aria-disabled and a description, or hide it in both cases." }
  - { id: F-E-10, rule: "On a failed first read the page has two <h1>: \"Bildirimler\" (notifications-page.tsx:31) and \"Bildirimler yüklenemedi\", because LoadFailed shell passes no headingLevel to SystemState, whose default is 1 (load-failed.tsx:28, libs/ui/src/mds/system-state.tsx:24,43). Root cause F-L-16, shared by every page that renders PageProblem under its own h1. Fix: LoadFailed passes headingLevel={2} when shell." }
  - { id: F-E-14, rule: "The toast's close button is aria-label=\"Kapat\" and its region is named \"Bildirimler\", both literals of the kit (libs/ui/src/mds/toast.tsx:97,127), and the region has the same name as this page, the menu entry and the bell: a screen-reader user hears one word for two things. Cross-cutting (F-L-6). Fix: pass catalog labels and a distinct region name (\"Bildirim mesajları\")." }
  - { id: F-E-20, rule: "EXAM_SCHEDULED, EXAM_REMINDER and EXAM_RESULTS_RELEASED are written by tedrisat (apps/tedrisat/src/notification/notification-types.ts:28-30) and have no sentence here (WORDED_TYPES, notifications.ts:15-29): they read \"Bildirim\" and, with a COURSE target, are links. A person cannot tell what happened. Whether a nazar person ever receives them is not verified. Fix: add the three sentences or filter the types." }
  - { id: F-E-21, rule: "When the mark answers \"unauthenticated\", handleUnauthenticated starts the sign-in redirect and `open` still calls openAddress(href) because `read`'s false is ignored (notifications-list.tsx:116,139-140): the address overrides the sign-in. Fix: return early when `read` reports the session over." }
  - { id: INBOX-1, rule: "New. A refused mark on a link row is told to nobody: `open` awaits `read`, which adds the error toast, and then calls openAddress(href) whatever came back (notifications-list.tsx:139-140), so the page leaves in the same tick, the toast goes with it (not verified in a browser) and the row stays unread on a page the person has already left. The button row keeps its toast. Read from the code, not verified in a browser. Fix: follow the link only after a taken mark, or let the browser follow it and mark in the background (decision D1)." }
  - { id: INBOX-2, rule: "New. read() and readAll() roll back with setState(before), where `before` is the page's whole state taken when the mark began (notifications-list.tsx:110, :144). When a second mark starts before the first has answered and the first is refused, the snapshot taken before the first replaces the state: the second row goes back to unread on the page although the API marked it. Read from the code, not verified in a browser. Fix: roll back only the row the refused mark touched." }
  - { id: INBOX-3, rule: "New, a product gap. A row says what kind of event happened and when, and never which course, celse or deck: titleValues reads only `outcome` from the params (notifications.ts:38-45) and the row draws a title and a time (notifications-list.tsx:293-305). A person with two courses is told \"Celse iptal edildi\" and must open the row to learn which; an unread row with no address (a ban notice, an application's answer) is a button that can only be marked, so nothing ever says which. Tedris's page words a sentence with the course's name per kind. Fix: add a second line from the params (courseTitle, sessionAt, koşk name)." }
  - { id: INBOX-4, rule: "New. A mark is silent: the badge, the counts and the button change and no word says a mark was made, because Notifications.* has no message for it (only markReadFailed and markAllFailed exist, notifications-list.tsx:129,159); after \"Tümünü okundu say\" the button disables itself under focus and the live panel re-reads wholesale (F-E-6, F-E-8). Fix: a polite status line (\"Tüm bildirimler okundu\"), and a stable place for the focus." }
  - { id: not-live, rule: "The page reads once and keeps the result in the browser's state: `useState(initial)` ignores the new props that router.refresh() brings (notifications-list.tsx:56), so a notification that arrives while the page is open appears only when it is read again. router.refresh() after a mark serves the layout only (the menu's number and the bell); it is why those two lower after a success and not before." }
  - { id: focus-not-set, rule: "Bildirimler sets no initial focus (no autoFocus and no focus() in features/notifications or app/(global)/bildirimler), so the page node has no `initialFocus` and the graph says nothing of the focus when the page opens or after a mark. Recorded so the silence is not read as an omission." }
  - { id: label-in-name, rule: "A control's visible text is contained in its accessible name (WCAG 2.5.3): the tabs' names start with their visible word and a row's name is its sentence, its time and the badge's word. Holds." }
  - { id: toast-is-the-only-word, rule: "The only word the page ever says about a mark is the error toast of a refusal (it stays until closed, and is lost on a link row, INBOX-1); a taken mark changes numbers only (INBOX-4)." }
