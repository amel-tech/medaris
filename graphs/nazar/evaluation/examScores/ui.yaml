# The screens of nazar.evaluation.examScores: Değerlendirme of a course (/ders/<id>/degerlendirme) as the hoca meets it with an exam in the course: the
# table with the exam's column, the exam's own screen with its boxes and its release, the toasts, and the three ways the page is empty or refused. Read from
# apps/nazar/features/evaluation; the words are copied from libs/i18n/src/locales/tr/nazar.json by key. Three texts are in no i18n file and are named
# `composed.*`: the talebe's name in a cell and in a toast (`<bdi>{row.name}</bdi>`, evaluation-board.tsx:248, :726), the score cell "{score}/{max}"
# (evaluation-board.tsx:284-286) and the busy label "Yükleniyor", the default of the Button's `loadingLabel` (libs/ui/src/mds/button.tsx:84, F-A-14). The one
# message authored for this catalog is Changes.note: the app's only message about a release is the toast after it ("Sonuçlar talebelere açıldı."), which
# says neither what a save does nor who is told nor that it cannot be undone. The question an online exam's release asks (MDRS-299, 24 Nov 2026) is in
# the words of the exam's results page, the `ExamResults.*` keys of the same file, which the page reads as they are.
# Where a node says "repeat", the page draws it once per talebe; the replay finds the rows through the binding. The sample `name` fills every {name} in
# this catalog, the course's name in the subtitle and a talebe's name in a box label alike, so the page draws them with one neutral word; the binding finds
# the real ones by pattern.
schema: delurio-graph/0
kind: ui
id: nazar.evaluation.examScores
flow: nazar.evaluation.examScores
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  name: Deneme
  week: "1"
  title: Ara sınav
  max: "100"
  entered: "1"
  total: "2"
  score: "85"

# The page gives no focus to anything when it opens and moves it nowhere on opening the exam, going back or releasing (F-D1-12): there is no `initialFocus`
# and no `focus` here. The one move the code makes, Enter in a box focusing the next row's box, goes from one item of a repeated node to the next and is said
# in the description of `scoring`.
nodes:
  # --- the page: heading, subtitle and the shell's main ---------------------------------------------------------------------------------
  evaluationPage: { type: page, component: Page, role: main, in: [overview, noColumns, noTalebe, forbidden, loadFailed, scoring, savingScore, savingAbsent, releasing], source: libs/ui/src/mds/app-shell.tsx:41 } # the shell's one <main id="main">; it has no name
  heading: { type: text, component: Heading, role: heading, text: { key: Evaluation.title }, in: [overview, noColumns, noTalebe, forbidden, loadFailed, scoring, savingScore, savingAbsent, releasing], source: apps/nazar/features/evaluation/components/evaluation-page.tsx:41 } # the page's h1, above every state, also the refusal and the retry
  subtitle: { type: text, component: Text, text: { key: Evaluation.subtitle, params: { name: course.title } }, in: [overview, noColumns, noTalebe, scoring, savingScore, savingAbsent, releasing], source: apps/nazar/features/evaluation/components/evaluation-page.tsx:44 } # "{course} dersinin ezber ve sınavları" (it said "ezber ödevleri" only until fdc6e995, EXAM-1); drawn when the course read answered

  # --- the table ---------------------------------------------------------------------------------------------------------------------------
  downloadLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Evaluation.download }, in: [overview], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:303 } # a plain <a href="/api/files/courses/<id>/evaluations">; it never works and says nothing (F-D1-13): nazar.files.download
  evaluationTable: { type: list, component: List, role: table, name: { key: Evaluation.caption }, in: [overview], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:313 } # named by the hidden caption "Talebeler, ezberler ve sınavlar" (it said "ezber ödevleri" only until fdc6e995, EXAM-1)
  colTalebe: { type: text, component: Text, role: columnheader, text: { key: Evaluation.talebe }, in: [overview], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:246 }
  examHeading: { type: action, component: Button, role: button, intent: secondary, name: { key: Evaluation.examColumnTitle, params: { week: exam.weekNumber, title: exam.title, max: exam.maxScore } }, in: [overview], emits: OPEN_EXAM, source: apps/nazar/features/evaluation/components/evaluation-board.tsx:255 } # variant=link, inside the column's <th>; data-testid evaluation-open-<lessonId>; pressing it unmounts the table (F-D1-12)
  examBadge: { type: text, component: Text, text: { key: Evaluation.examBadge }, in: [overview], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:269 } # "Telafi" (retakeBadge) for a make-up exam; not drawn here
  talebeCell: { type: text, component: Text, role: cell, text: { key: composed.Evaluation.talebeName, params: { name: row.name } }, repeat: board.talebe, in: [overview], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:248 } # a plain <td>, not a row header (F-D1-22)
  resultCell: { type: text, component: Text, role: cell, text: { oneOf: [Evaluation.pending, Evaluation.absentExam, composed.Evaluation.score] }, repeat: board.talebe, in: [overview], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:276 } # "Bekliyor" until a result is entered, then "85/100" or the badge "Girmedi"; the cells follow what was typed at once

  # --- the exam's screen -----------------------------------------------------------------------------------------------------------------
  examRegion: { type: page, component: Page, role: region, name: { labelledBy: examTitle }, in: [scoring, savingScore, savingAbsent, releasing], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:611 } # <section aria-labelledby>; data-testid exam-column
  examTitle: { type: text, component: Heading, role: heading, text: { key: Evaluation.examColumnTitle, params: { week: exam.weekNumber, title: exam.title, max: exam.maxScore } }, in: [scoring, savingScore, savingAbsent, releasing], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:626 } # h2; nothing focuses it (F-D1-12)
  # None of the exam screen's controls waits for a call: the saves and the release are the board's (useCellSaves and release,
  # evaluation-board.tsx:120-181), so "Bütün ödevler" unmounts the screen at once and the call lands in the board behind it,
  # "Girmedi" sends a second save beside the first, and "Sonuçları talebelere aç" is busy only while its own call runs. The flow takes
  # such a press once the running call is answered (`duringStep`).
  backButton: { type: action, component: Button, role: button, intent: dismiss, text: { key: Evaluation.back }, in: [scoring, savingScore, savingAbsent, releasing], emits: BACK, duringStep: true, source: apps/nazar/features/evaluation/components/evaluation-board.tsx:618 } # "Bütün ödevler", worded for homework (EXAM-1); variant=ghost with an arrow icon
  count: { type: status, component: Status, role: status, text: { key: Evaluation.entered, params: { entered: exam.entered, total: exam.total } }, in: [scoring, savingScore, savingAbsent, releasing], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:639 } # <output aria-live=polite data-testid=exam-count>; a "Girmedi" counts as entered; it follows a press at once
  releaseButton: { type: action, component: Button, role: button, intent: confirm, text: { key: Evaluation.release }, in: [scoring, savingScore, savingAbsent, releasing], when: "results == 'closed'", disabledIn: [releasing], emits: RELEASE, duringStep: true, source: apps/nazar/features/evaluation/components/evaluation-board.tsx:651 } # data-testid exam-release; busy (aria-disabled, aria-busy) while the call is out; no confirmation (F-D1-28)
  releaseBusy: { type: status, component: Status, role: status, text: { key: composed.Shell.loadingDefault }, in: [releasing], source: libs/ui/src/mds/button.tsx:84 } # the Button's hidden <output>, "Yükleniyor" from a hard-coded default outside the catalog (F-A-14)
  releasedBadge: { type: text, component: Text, text: { key: Evaluation.released }, in: [scoring, savingScore, savingAbsent, releasing], when: "results == 'opened'", source: apps/nazar/features/evaluation/components/evaluation-board.tsx:647 } # data-testid exam-released; replaces the button for good (e2e exam#2 a6)
  keysHint: { type: text, component: Text, text: { key: Evaluation.examKeysHint }, in: [scoring, savingScore, savingAbsent, releasing], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:679 } # a paragraph tied to nothing by aria-describedby (F-D1-27)
  talebeList: { type: list, component: List, role: list, in: [scoring, savingScore, savingAbsent, releasing], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:680 } # a <ul> with no name (the mark screen's is "Talebeler"); its rows are not focusable
  scoreBox: { type: field, component: TextField, role: spinbutton, text: { key: Evaluation.scoreLabel, params: { name: row.name } }, repeat: board.talebe, in: [scoring, savingScore, savingAbsent, releasing], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:764 } # type=number, min 0, max the full mark, "/{max}" after it (aria-hidden); aria-label only, no visible label; aria-invalid and no aria-describedby while it is refused (EXAM-3)
  absentChip: { type: action, component: Button, role: button, intent: secondary, text: { key: Evaluation.absentExam }, repeat: board.talebe, in: [scoring, savingScore, savingAbsent, releasing], emits: PRESS_ABSENT, duringStep: true, source: apps/nazar/features/evaluation/components/evaluation-board.tsx:790 } # a chip with aria-pressed (true once the talebe is "Girmedi"); the pressed state is not drawn here
  problemOver: { type: text, component: Text, role: alert, text: { key: Evaluation.scoreTooHigh, params: { max: exam.maxScore } }, in: [scoring, releasing], when: "problem == 'over'", source: apps/nazar/features/evaluation/components/evaluation-board.tsx:784 } # <p role=alert> under the box that was typed in (e2e exam#2 a1)
  problemInvalid: { type: text, component: Text, role: alert, text: { key: Evaluation.scoreInvalid }, in: [scoring, releasing], when: "problem == 'invalid'", source: apps/nazar/features/evaluation/components/evaluation-board.tsx:784 }

  # --- the toasts: a region "Bildirimler", each toast a dialog; an error toast is an alertdialog and stays until closed -------------------------------
  toastReleased: { type: status, component: Status, role: dialog, name: { key: Evaluation.releasedToast }, text: { key: Evaluation.releasedToast }, in: [scoring], when: "last == 'released'", source: apps/nazar/features/evaluation/components/evaluation-board.tsx:180 } # tone success: it closes by itself after six seconds
  toastReleaseFailed: { type: alert, component: Alert, role: alertdialog, name: { key: Evaluation.releaseFailed }, text: { key: Evaluation.releaseFailed }, in: [scoring], when: "last == 'releaseFailed'", source: apps/nazar/features/evaluation/components/evaluation-board.tsx:168 }
  toastReleaseNotOpen: { type: alert, component: Alert, role: alertdialog, name: { key: Evaluation.releaseFailed }, text: { key: ExamResults.notOpen }, in: [scoring], when: "last == 'releaseNotOpen'", source: apps/nazar/features/evaluation/components/evaluation-board.tsx:172 } # the same title, and under it why: the online exam has not opened (EXAM_NOT_OPEN)
  toastSaveFailed: { type: alert, component: Alert, role: alertdialog, name: { key: Evaluation.saveFailed }, text: { key: composed.Evaluation.talebeName, params: { name: talebe.name } }, in: [scoring], when: "last == 'saveFailed'", source: apps/nazar/features/evaluation/components/evaluation-board.tsx:134 } # the title "Kaydedilemedi", the talebe's name as its description

  # --- "Sonuçlar talebelere açılsın mı?": the kit's AlertDialog, on an online exam's column only (MDRS-299) -------------------------------------------
  releaseDialog: { type: page, component: Page, role: alertdialog, name: { labelledBy: releaseTitle }, in: [confirmRelease], initialFocus: releaseCancel, source: apps/nazar/features/evaluation/components/evaluation-board.tsx:664 } # modal: the page behind is inert, so no page node is drawn in this state
  releaseTitle: { type: text, component: Heading, role: heading, text: { key: ExamResults.releaseConfirmTitle }, in: [confirmRelease], source: libs/ui/src/mds/alert-dialog.tsx:80 } # Base UI's Title, an h2
  releaseEndsExam: { type: text, component: Text, text: { key: ExamResults.releaseEndsExam }, in: [confirmRelease], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:675 } # said whether or not the exam still goes on: the board does not read it
  releaseBody: { type: text, component: Text, text: { key: ExamResults.releaseConfirmBody }, in: [confirmRelease], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:676 } # no count of the talebe still taking it: the board does not know it
  releaseX: { type: action, component: Button, role: button, intent: dismiss, name: { key: Shell.close }, in: [confirmRelease], emits: CANCEL, source: libs/ui/src/mds/alert-dialog.tsx:88 } # an icon only, named by its aria-label
  releaseCancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: ExamResults.cancel }, in: [confirmRelease], emits: CANCEL, source: libs/ui/src/mds/alert-dialog.tsx:102 } # the focus starts here (alert-dialog.tsx:70)
  releaseConfirm: { type: action, component: Button, role: button, intent: confirm, text: { key: ExamResults.releaseConfirm }, in: [confirmRelease], emits: CONFIRM, source: libs/ui/src/mds/alert-dialog.tsx:109 }

  # --- the page is empty, refused or could not be read ---------------------------------------------------------------------------------------
  emptyNoColumns: { type: text, component: Text, text: { key: Evaluation.noColumns }, in: [noColumns], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:210 } # tells the hoca to choose "Ezber" in Müfredat; an exam is not named (EXAM-1)
  emptyNoTalebe: { type: text, component: Text, text: { key: Evaluation.noTalebe }, in: [noTalebe], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:215 }
  forbiddenAlert: { type: alert, component: Alert, role: status, text: { key: Problems.forbiddenTitle }, in: [forbidden], source: apps/nazar/features/shell/components/page-problem.tsx:25 } # a neutral Alert is a status, not an alert
  forbiddenText: { type: text, component: Text, text: { key: Problems.forbidden }, in: [forbidden], source: apps/nazar/features/shell/components/page-problem.tsx:26 }
  failedRegion: { type: page, component: Page, role: region, name: { labelledBy: failedTitle }, in: [loadFailed], source: libs/ui/src/mds/system-state.tsx:31 } # <section aria-labelledby> of the SystemState
  failedTitle: { type: text, component: Heading, role: heading, text: { key: Evaluation.loadFailedTitle }, in: [loadFailed], source: libs/ui/src/mds/system-state.tsx:43 } # an h1 again: the page's second (F-D1-01)
  failedText: { type: text, component: Text, text: { key: Evaluation.loadFailed }, in: [loadFailed], source: apps/nazar/features/shell/components/load-failed.tsx:42 }
  retryButton: { type: action, component: Button, role: button, intent: secondary, text: { key: Shell.retry }, in: [loadFailed], emits: RETRY, source: apps/nazar/features/shell/components/load-failed.tsx:33 } # router.refresh() in a transition; busy while it runs

edges:
  - { labelledBy: [examRegion, examTitle] }
  - { labelledBy: [failedRegion, failedTitle] }
  - { triggers: [examHeading, scoring] }
  - { triggers: [backButton, overview] }
  - { triggers: [releaseButton, releasing] }
  - { triggers: [releaseButton, confirmRelease] }
  - { triggers: [releaseConfirm, releasing] }
  - { labelledBy: [releaseDialog, releaseTitle] }
  - { triggers: [retryButton, opening] }

rules:
  - { id: F-D1-12, rule: "Opening the exam, 'Bütün ödevler' and 'Sonuçları talebelere aç' each replace the screen or the button the person pressed, so the focus falls to the document; no heading is focused on the exam screen and the badge that replaces the release button is not either (evaluation-board.tsx:255-260, :596-603, :624-640). Fix: focus the exam's h2 (tabIndex -1) on opening, the column's heading button on the way back, and the badge after the release." }
  - { id: F-D1-13, rule: "'Excel indir' is a plain link to /api/files/courses/<id>/evaluations. A refusal is a 303 back to this page with ?fileError=..., and the page mounts no FileErrorNotice, so it is silent and the parameter stays in the address (evaluation-page.tsx has none). Worse, the link can never be served: the route asks tedrisat for a path with a query and the proxy refuses it with a 400 INVALID_PATH (nazar.files.download, evaluation-export-invalid-path). Fix: mount FileErrorNotice here, and send the language in a way the proxy accepts." }
  - { id: F-D1-28, rule: "On a written or oral exam, 'Sonuçları talebelere aç' opens every score to every seated talebe, tells them, and cannot be undone, with one press and no question (evaluation-board.tsx:651-659); it is on with 0/N entered, so each talebe then reads 'Girilmedi'. The page has no way back and the API releases once. Fix: an AlertDialog that says how many are entered of how many, that the talebe will read them and be told, and that it cannot be undone, the focus starting on Vazgeç (the shape of Reddet on the Pano). Partly fixed in the code of this branch (24 Nov 2026), read from the code and the spec and not walked: an online exam's column asks first (confirmRelease, evaluation-board.tsx:663-678), because its release also ends the exam for everyone, in the words of the exam's results page (releaseConfirmTitle, releaseEndsExam, releaseConfirmBody); it does not say how many are entered, and a refusal before the exam opens now says why (EXAM_NOT_OPEN, evaluation-board.tsx:172-175)." }
  - { id: F-D1-22, rule: "The table's first column is a plain <td>; the roster tables mark theirs rowHeader, so a score cell has no row header for a screen reader (evaluation-board.tsx:244-249). Fix: rowHeader: true." }
  - { id: F-D1-27, rule: "The exam's hint 'Puanı yazıp Enter’a basın; kaydedilir, alt satıra geçer' is a <p> tied to the boxes by nothing (no aria-describedby), as the mark screen's hint is; its list has no name and its rows are not focusable. Enter then moves the focus to the next row's box, which only a sighted keyboard user is told of. Input is used with no Field, outside the primitive's own contract (evaluation-board.tsx:679-783)." }
  - { id: F-D1-01, rule: "A failed read draws LoadFailed with `shell`, whose SystemState defaults to headingLevel 1 (system-state.tsx:24; load-failed.tsx:28 passes none), under the page's own h1 'Değerlendirme': two h1 while the read has failed. Root cause F-L-16 (shared by every page of this part). Read from the code, not seen: nothing in the stack makes the read fail. Fix: LoadFailed passes headingLevel 2 when `shell`." }
  - { id: F-D1-20, rule: "The release has no try/catch: `await onRelease()` then `setReleasing(false)` (evaluation-board.tsx:653-655), and `release` awaits a server action that rejects when the browser cannot reach Next. The button then stays busy for good and no toast says so. A save does catch (useCellSaves, :73-77), so the cell goes back with an error toast; only the release is bare. Read from the code, not seen; F-D1-20's list does not name this component. Fix: catch around the call and clear `releasing` in a finally." }
  - { id: F-A-14, rule: "A busy release button passes no loadingLabel, so its hidden status says 'Yükleniyor' from the Button's hard-coded default (button.tsx:84), outside the catalog." }
  - { id: EXAM-1, rule: "New, partly fixed by fdc6e995 (MDRS-248: 'Değerlendirme's subtitle and table caption name exams as well as ezber'). The page spoke of recited homework only although an exam is a column too. The subtitle now says '{ders} dersinin ezber ve sınavları' (Evaluation.subtitle) and the table's caption 'Talebeler, ezberler ve sınavlar' (Evaluation.caption). Still open: the way back from an exam says 'Bütün ödevler' (Evaluation.back), and the empty page says 'Bu derste henüz ezber ödevi yok. Müfredat’ta ... Ezber’i seçin.' and never says that an exam is planned on Celse planla, so a hoca with a Sınav and no homework is told the course has none. Fix: word the way back for both, and let the empty sentence give both ways in." }
  - { id: EXAM-2, rule: "New. The exam screen stays live after the release: the boxes and the 'Girmedi' chips still take a score (the ExamScreen keeps its rows, only the button becomes the badge, evaluation-board.tsx:646-697) and the API accepts it (saveResult checks no resultsReleasedAt, exam.repository.ts:155-256, 'no time window' in exam-result-rules). The talebe reads the changed score on their next read and nobody is told, the talebe or the hoca; a typo after the release is silently final or silently fixed. From the code, not seen. Fix: decide it (D2), then either lock the rows with the badge and refuse the write, or say 'Düzeltildi' and notify again." }
  - { id: EXAM-3, rule: "New. A refused score is a <p role=alert> under its box and the box gets aria-invalid, but no aria-describedby ties the two (evaluation-board.tsx:770-788): the alert is read once when it appears and the box, read again, says only 'geçersiz'. The e2e finds the message by the row's alert (exam#2 a1). Fix: give the paragraph an id and set aria-describedby on the box." }
  - { id: EXAM-4, rule: "New, GRADES-3 seen from here. The release tells the course's ENROLLED seat holders except the caller (exam.repository.ts, course-notifier.ts:187-197); a COMPLETED talebe is on the board, can be given a score, reads the grades, and is not told when they are open. From the code, not seen. Fix: tell COMPLETED seats too." }
  - { id: focus-not-set, rule: "The page sets no initial focus and, but for Enter in a box (which focuses the next row's box when the score was accepted or the box blank, evaluation-board.tsx:780-782 and :655-657), moves none: a refused score leaves the focus in the box, an accepted one or a blank box sends it down (Enter only), and the last row keeps it. Nothing is drawn for focus except this rule." }
  - { id: toasts-announce-the-result, rule: "The result of a release is a toast of six seconds; a failed save or release is an error toast that stays. A successful save says nothing at all: the cell and the count are drawn before the call answers, so a save that has not yet answered looks like one that has, and only a failure draws it back with a toast (useCellSaves). The count is a polite live region, which is the only word that a save happened." }
  - { id: label-in-name, rule: "Each button's visible text is its accessible name ('Girmedi', 'Bütün ödevler', 'Sonuçları talebelere aç', 'Yeniden dene'), and the exam heading's name is its text (WCAG 2.5.3). Holds. The number boxes are named by aria-label only, '{name} puanı', with no visible label: the name sits in the row beside them (F-D1-26 is the same pattern on the deck's quick-add boxes)." }
