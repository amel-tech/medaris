    evidence:
      - source: apps/nazar/features/evaluation/components/evaluation-page.tsx:44
      - source: apps/nazar/features/evaluation/components/evaluation-board.tsx:314
    missing: >-
      no Linear issue; EXAM-1, decision D3: in part. The subtitle and the caption name exams since fdc6e995; the way back ("Bütün
      ödevler") and the empty sentence still speak of homework only
    note: |-
      Drawn on the state noColumns and on the nodes subtitle, evaluationTable, backButton and emptyNoColumns, which the code has:
      they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).
      apps/nazar/features/evaluation/components/evaluation-page.tsx:44: the subtitle "{ders} dersinin ezber ve sınavları":
      fdc6e995
      apps/nazar/features/evaluation/components/evaluation-board.tsx:314: the caption "Talebeler, ezberler ve sınavlar": fdc6e995

  - id: keyboard-and-focus-follow-the-person
    need: >-
      After opening the exam, going back and releasing, the focus lands on something the person can use; a refused score is tied
      to its box and read with it; the exam's hint and list are tied to the boxes.
    missing: no Linear issue; F-D1-12, F-D1-27, EXAM-3
    note: >-
      Drawn on the states scoring and overview and on the nodes problemOver, problemInvalid, keysHint and talebeList, which the
      code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: the-board-can-be-downloaded
    need: >-
      "Excel indir" gives the board as a spreadsheet, a row for each talebe and a column for each recited homework and exam, in
      the viewer's language.
    missing: >-
