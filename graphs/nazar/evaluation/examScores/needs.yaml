# What must exist for the course team to enter the scores of an exam and release the results to the talebe: nazar.evaluation.examScores, written on 15 Nov
# 2026 in the format of LAYOUT.md section 7. Each need is what the product must do, from the flow's story and from the domain's rules
# (exam-result-rules, exam-results-are-released-once), never from what the page does today. The one planned item that touches this flow is planned.md
# P-P2 (İmtihan: the question bank, timed exams, automatic marking), which is PRD only (MDRS-248 built the "Sınav" celse and its scores, and nothing of the rest).
# The gaps it leaves are reported to the orchestrator, who merges them into graphs/needs.gaps.yaml:
#   missing:  release-asks-first (none; F-D1-28), a-score-change-after-release-is-told (none; EXAM-2), completed-talebe-is-told (none; EXAM-4),
#             page-speaks-of-exams (none; EXAM-1), keyboard-and-focus-follow-the-person (none; F-D1-12, F-D1-27, EXAM-3), the-board-can-be-downloaded (none;
#             evaluation-export-invalid-path), a-refused-download-is-worded (none; F-D1-13), question-bank-and-timed-exams (none; P-P2, PRD only)
#   unwalked: enter-moves-to-the-next-row (a unit spec only), the-table-shows-the-results (a unit spec only), no-talebe-says-so (a unit spec only),
#             girmedi-for-a-talebe-who-did-not-sit (the API's suite only: the chip has no browser check), the-score-is-read-by-the-talebe-after-release
#             (e2e exam#2 a7 is the check; the replay is bound and was not run)
# Nothing here is walked by a replay yet: the owner moved every replay to the end, so `walked` holds only e2e checks that exist today. The binding's
# scenarios (scores, reopened, noTalebe, noColumns, forbidden) are written and load; they are walked in the walk phase.
# Nothing here carries a kontenjan or a gender rule: a score decides no seat (MDRS-284 does not apply).
kind: needs
flow: nazar.evaluation.examScores
status: proposed

needs:
  - id: exam-is-planned-before-it-is-scored
    need: >-
      An exam is a celse planned as "Sınav", with a date, a place or none, a full mark and a title, before anyone enters a score; the course team sees it as
      a column of Değerlendirme the moment it is planned, in its week.
    drawn: [overview, examHeading, examBadge]
    built:
      - action: medaris.api:createSessionBatch
      - route: apps/tedrisat/src/course/course.service.ts:1386
    walked:
      - e2e: apps/nazar/e2e/exam.e2e.ts
        check: 'exam#1 (carried by nazar.sessions.plan: a1 the exam section, a2 no weekly repeat, a3 the address, a4 the lesson_exams row)'

  - id: score-within-full-mark
    need: >-
      The course team gives each seated talebe a score as a whole number from 0 to the exam's full mark. A score above the full mark, below 0, a fraction or none
      is refused where it is typed, in words, and nothing is saved.
    drawn: [scoring, problemOver, problemInvalid, scoreBox]
    built:
      - action: medaris.api:saveExamResult
      - route: apps/nazar/features/evaluation/evaluation.ts:190
    walked:
      - e2e: apps/nazar/e2e/exam.e2e.ts
        check: 'exam#2 (a1: "En çok 100 puan", a2: nothing saved)'
      - e2e: apps/tedrisat/test/e2e/exams.e2e.spec.ts
        check: 'exams.e2e.spec.ts:331 (the API refuses 101, -1, a fraction and none; nothing is written)'

  - id: score-is-kept-as-typed
    need: >-
      A score typed and confirmed (Enter, or leaving the box) is kept at once, the cell and the count follow it, and the same score is not sent twice; a save that
      fails puts the cell back and says so.
    drawn: [scoring, savingScore, scoreBox, count, resultCell]
    built:
      - action: medaris.api:saveExamResult
      - route: apps/nazar/features/evaluation/components/evaluation-board.tsx:686
    walked:
      - e2e: apps/nazar/e2e/exam.e2e.ts
        check: 'exam#2 (a3: 85 is kept, a4: "1/1 girildi")'
      - e2e: apps/tedrisat/test/e2e/exams.e2e.spec.ts
        check: 'exams.e2e.spec.ts:289 (a score up to tam puan is kept) and :314 (first saves made at once take turns: one write)'

  - id: enter-moves-to-the-next-row
    need: >-
      Enter after a score that is kept (or on a blank box) moves the focus to the next talebe's box, so a whole class is scored without the mouse; after a
      refused score the focus stays where it is.
    drawn: [scoring, scoreBox]
    built:
      - route: apps/nazar/features/evaluation/components/evaluation-board.tsx:647
    # unwalked: apps/nazar/test/evaluation.spec.tsx ("refuses a score above tam puan, saves one within it with Enter and moves down") is a unit spec; no e2e and no passed replay

  - id: girmedi-for-a-talebe-who-did-not-sit
    need: >-
      A talebe who did not sit the exam is marked "Girmedi": no score is kept, the cell says so, the count counts it as entered, and the talebe reads "Girmedi" after
      the release.
    drawn: [scoring, savingAbsent, absentChip, resultCell, count]
    built:
      - action: medaris.api:saveExamResult
      - route: apps/nazar/features/evaluation/components/evaluation-board.tsx:746
    walked:
      - e2e: apps/tedrisat/test/e2e/exams.e2e.spec.ts
        check: 'exams.e2e.spec.ts:289 (Girmedi keeps no score, even when one is sent with it); the chip itself has no browser check'

  - id: the-table-shows-the-results
    need: >-
      The table shows the course's talebe against the exam: "Bekliyor" until a result is entered, then the score out of the full mark or "Girmedi", and the cells follow
      what is typed.
    drawn: [overview, evaluationTable, talebeCell, resultCell]
    built:
      - action: medaris.api:getEvaluationBoard
      - route: apps/nazar/features/evaluation/components/evaluation-board.tsx:265
    # unwalked: apps/tedrisat/test/e2e/exams.e2e.spec.ts:444 reads the board's EXAM column at the API; the page's cells have a unit spec only

  - id: no-talebe-says-so
    need: >-
      A course with an exam and no seated talebe says so in one sentence, and offers no table to score.
    drawn: [noTalebe, emptyNoTalebe]
    built:
      - route: apps/nazar/features/evaluation/components/evaluation-board.tsx:202
    # unwalked: a unit spec only

  - id: results-stay-closed-until-released
    need: >-
      Until the course team releases an exam's results, the talebe reads no score, not even their own, and is told only that the result is not announced yet,
      whatever the team has entered.
    drawn: [scoring, savingScore]
    built:
      - action: medaris.api:getMyGrades
      - route: apps/tedrisat/src/exam/exam.repository.ts:386
    walked:
      - e2e: apps/nazar/e2e/exam.e2e.ts
        check: 'exam#2 (a5: released false, score null)'
      - e2e: apps/tedrisat/test/e2e/exams.e2e.spec.ts
        check: 'exams.e2e.spec.ts:368 (a talebe''s score is kept from them until released, then shown to them alone)'

  - id: release-opens-the-results
    need: >-
      The course team opens an exam's results to its talebe with one action; from then on every seated talebe reads their own score, or "Girmedi", on Notlarım, and the
      exam screen says the results are open.
    drawn: [scoring, releasing, releaseButton, releasedBadge, toastReleased]
    built:
      - action: medaris.api:releaseExamResults
      - route: apps/nazar/features/evaluation/components/evaluation-board.tsx:161
    walked:
      - e2e: apps/nazar/e2e/exam.e2e.ts
        check: 'exam#2 (a6: the badge "Sonuçlar açık", a7: released true, score 85)'

  - id: the-score-is-read-by-the-talebe-after-release
    need: >-
      The talebe's own page, Notlarım, shows the released score out of the full mark: the score the course team entered, not another's and not a closed one.
    drawn: [releasing]
    built:
      - action: medaris.api:getMyGrades
      - route: apps/tedris/features/courses/components/exam-grades.tsx:96
    # unwalked: e2e exam#2 a7 reads it at the API (released true, score 85); tedris.course.grades draws the page, started from here with released true

  - id: release-tells-the-talebe-once
    need: >-
      The first release tells every ENROLLED talebe of the course, except the one who released, that the results are open; a second release changes nothing and
      tells nobody.
    drawn: [releasing]
    built:
      - action: medaris.api:releaseExamResults
      - route: apps/tedrisat/src/exam/exam.repository.ts:297
    walked:
      - e2e: apps/tedrisat/test/e2e/exams.e2e.spec.ts
        check: 'exams.e2e.spec.ts:430 (tells the talebe once, and a second release changes nothing)'

  - id: only-the-course-team-scores
    need: >-
      Only the course team scores: a talebe, a stranger, the hoca of another course and a ders nazırı with no session.manage can neither read the board nor enter
      a score nor release.
    drawn: [forbidden, forbiddenAlert]
    built:
      - action: medaris.api:saveExamResult
      - route: apps/nazar/features/evaluation/components/evaluation-page.tsx:33
    walked:
      - e2e: apps/tedrisat/test/e2e/exams.e2e.spec.ts
        check: 'exams.e2e.spec.ts:340 (the course team''s alone, on this course''s exam, for its own talebe)'
      - e2e: apps/nazar/e2e/evaluation.e2e.ts
        check: 'evaluation#2 (a ders nazırı with no session.manage: "Bu sayfaya izniniz yok"; carried by nazar.access.dersNazirPages)'

  # ---- not built, or built and wrong ----
  - id: release-asks-first
    need: >-
      Before the results are opened the course team is asked once, and told how many scores are entered of how many, that the talebe will read them and be told, and that
      it cannot be undone.
    drawn: [scoring, releaseButton, releasing]
    missing: none # F-D1-28, decision D1: the button releases at once, with 0/N entered too

  - id: a-score-change-after-release-is-told
    need: >-
      Once the results are open, a change of a score is a decision of the product: either the boxes are read-only, or a correction is marked and the talebe told.
    drawn: [scoring, savingScore, releasedBadge]
    missing: none # EXAM-2, decision D2: the boxes stay live, the API takes the change, nobody is told

  - id: completed-talebe-is-told
    need: >-
      A talebe who has completed the course, and so reads the grades, is told when an exam's results are open, like the talebe who is still enrolled.
    drawn: [releasing]
    missing: none # EXAM-4 (GRADES-3 of tedris.course.grades): the notification goes to the ENROLLED seats only

  - id: page-speaks-of-exams
    need: >-
      The page's subtitle, caption and way back, and its empty sentence, name exams as well as recited homework, and the empty sentence says an exam is planned on Celse
      planla.
    drawn: [subtitle, evaluationTable, backButton, noColumns, emptyNoColumns]
    missing: none # EXAM-1, decision D3

  - id: keyboard-and-focus-follow-the-person
    need: >-
      After opening the exam, going back and releasing, the focus lands on something the person can use; a refused score is tied to its box and read with it; the exam's
      hint and list are tied to the boxes.
    drawn: [scoring, overview, problemOver, problemInvalid, keysHint, talebeList]
    missing: none # F-D1-12, F-D1-27, EXAM-3

  - id: the-board-can-be-downloaded
    need: >-
      "Excel indir" gives the board as a spreadsheet, a row for each talebe and a column for each recited homework and exam, in the viewer's language.
    drawn: [downloadLink]
    missing: none # evaluation-export-invalid-path: tedrisat serves the sheet (exams.e2e.spec.ts:476) and the page offers the link, but the web route between them is refused by the file proxy's path check on every call (nazar.files.download)

  - id: a-refused-download-is-worded
    need: >-
      A refused download of the sheet says why on Değerlendirme, as it does on Ödevler, and takes ?fileError= out of the address.
    drawn: [downloadLink]
    missing: none # F-D1-13

  - id: question-bank-and-timed-exams
    need: >-
      The İmtihan of the PRD: a bank of questions, an exam the talebe sits on the screen against a timer, marked by hand and by machine (planned.md P-P2). Today a "Sınav"
      is a celse with a full mark whose scores the course team types.
    drawn: [scoring]
    missing: none # PRD only (planned.md P-P2): no Linear issue
