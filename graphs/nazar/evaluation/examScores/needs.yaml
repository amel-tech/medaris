  - id: a-refused-download-is-worded
    need: >-
      A refused download of the sheet says why on Değerlendirme, as it does on Ödevler, and takes ?fileError= out of the address.
    missing: no Linear issue; F-D1-13
    note: >-
      Drawn on the node downloadLink, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).

  - id: question-bank-and-timed-exams
    need: >-
      The İmtihan of the PRD: a bank of questions, an exam the talebe sits on the screen against a timer, marked by hand and by
      machine (planned.md P-P2). Today a "Sınav" is a celse with a full mark whose scores the course team types.
    missing: "PRD only (planned.md P-P2): no Linear issue"
    note: >-
      Drawn on the state scoring, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves
      out what only missing needs name).
