  backButton: { type: action, component: Button, role: button, intent: secondary, text: { key: Evaluation.back }, in: [column, noting, marking], emits: BACK, duringStep: true, source: apps/nazar/features/evaluation/components/evaluation-board.tsx:375 } # a ghost button with an arrow icon; the screen goes and the focus falls to the document (F-D1-12)
  count: { type: status, component: Status, role: status, text: { key: Evaluation.count }, in: [column, noting], when: "verdict != 'full'", source: apps/nazar/features/evaluation/components/evaluation-board.tsx:391 } # an <output aria-live=polite>, test id evaluation-count: "{n}/{total} tam" with n the rows marked Tam; the walk's course has one talebe, so it reads 0/1 here (e2e evaluation#1 a5, a9)
  countAll: { type: status, component: Status, role: status, text: { key: Evaluation.count }, in: [column, noting], when: "verdict == 'full'", source: apps/nazar/features/evaluation/components/evaluation-board.tsx:391 } # the same output once the talebe is marked Tam: 1/1 (e2e evaluation#1 a6); drawn with the sample numbers, the binding reads the real ones
