# The screens of nazar.evaluation.markRecited: Değerlendirme of a course (/ders/<id>/degerlendirme), read from apps/nazar/features/evaluation and
# libs/ui/src/mds (table, button, empty-state, system-state, alert, toast). The words are copied letter for letter from
# libs/i18n/src/locales/tr/nazar.json by a script that fails on a missing key (the key is the path inside the file: the app reads it as
# `nazar.Evaluation`, `nazar.Problems`). Two messages are not in any i18n file:
#   composed.Evaluation.noteText  the note itself, as the hoca typed it: the visible words of the note toggle once a note exists, in a
#                                 <bdi> cut to 20 characters by the stylesheet (evaluation-board.tsx:530-532)
#   Changes.note                  the ONE message authored for this graph, not copied: no message of the app says what a save changes and what
#                                 follows (a save has no toast and no confirmation), and a flow whose steps write must carry one. It is written in
#                                 Turkish, from the code (the audit row, the missing notification, the three marks and no way back to "Bekliyor")
# Only the screens of one talebe's row are drawn: the story follows one talebe, so every node "repeat" is drawn once per talebe, and the count
# is "{n}/{total} tam" for the board's own numbers. The line under the h1 that names the course (Evaluation.subtitle) is not a node: its {name}
# is the course's, and the same placeholder is the talebe's name in the rows, and a sample is one value per placeholder.
# The talebe's name is never an `aria-label` this graph can quote, so the binding finds the rows by their test id.
schema: delurio-graph/0
kind: ui
id: nazar.evaluation.markRecited
flow: nazar.evaluation.markRecited
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  week: "1"
  title: Celse 1
  name: Örnek Talebe
  note: Son iki satır eksik.
  full: "18"
  total: "30"

# The page sets no focus when it opens, and none when a homework is opened, closed or marked (the pressed button stays focused after a mark, and
# the screen's buttons are unmounted by a change of screen): there is no `initialFocus` and no `focus` for them (`focus-not-set`, F-D1-12). The one
# place the code moves it is the note box: an effect focuses its textbox as soon as it is mounted (evaluation-board.tsx:485-487).
focus: { noting: noteInput }

nodes:
  # --- the page ---------------------------------------------------------------------------------------------------------
  evalPage: { type: page, component: Page, role: main, in: [overview, column, noting, marking, noColumns, noTalebe, forbidden, loadFailed], source: libs/ui/src/mds/app-shell.tsx:41 } # the shell's one <main id="main">; it has no name
  evalTitle: { type: text, component: Heading, role: heading, text: { key: Evaluation.title }, in: [overview, column, noting, marking, noColumns, noTalebe, forbidden, loadFailed], source: apps/nazar/features/evaluation/components/evaluation-page.tsx:41 } # h1; it stays over a refusal and over a failed read (e2e evaluation#1 a1, evaluation#2 a1)
  menuEvaluation: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.ders.evaluation }, in: [overview, column, noting, marking, noColumns, noTalebe, loadFailed], source: apps/nazar/features/shell/nav.ts:122 } # the sidebar's entry for this page, drawn only for a holder of session.manage; it carries aria-current=page, which a graph cannot say (e2e evaluation#1 a2)

  # --- the page cannot be shown -----------------------------------------------------------------------------------------------
  forbiddenAlert: { type: alert, component: Alert, role: status, text: { key: Problems.forbiddenTitle }, in: [forbidden], source: apps/nazar/features/shell/components/page-problem.tsx:23 } # a neutral Alert is a status, not an alert; its title is a <p>, not a heading (e2e evaluation#2 a2)
  forbiddenText: { type: text, component: Text, text: { key: Problems.forbidden }, in: [forbidden], source: apps/nazar/features/shell/components/page-problem.tsx:26 } # says whom to ask and gives no way to
  failedRegion: { type: page, component: Page, role: region, name: { labelledBy: failedTitle }, in: [loadFailed], source: libs/ui/src/mds/system-state.tsx:33 } # a <section aria-labelledby> inside the shell, which owns <main>
  failedTitle: { type: text, component: Heading, role: heading, text: { key: Evaluation.loadFailedTitle }, in: [loadFailed], source: libs/ui/src/mds/system-state.tsx:43 } # h1: a second one on the page, under "Değerlendirme" (the same finding as nazar.bans.review's BANS-4)
  failedText: { type: text, component: Text, text: { key: Evaluation.loadFailed }, in: [loadFailed], source: libs/ui/src/mds/system-state.tsx:46 }
