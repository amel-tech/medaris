rules:
  - { id: focus-not-set, rule: "No code of features/evaluation sets the focus when the page opens, when a homework is opened or closed, or after a mark: the opened screen and the board replace each other and the pressed button leaves with the one it was on (F-D1-12). The only thing that moves it is the note box, whose textbox an effect focuses when it is mounted (evaluation-board.tsx:485-487): drawn as `focus.noting`." }
  - { id: evaluation-export-invalid-path, rule: "'Excel indir' can never work. Its route (apps/nazar/app/api/files/courses/[courseId]/evaluations/route.ts:24) asks the shared file proxy for /courses/<id>/evaluations/export?lang=tr, and the proxy's isProxiablePath refuses any path with a query (libs/services/src/file-proxy/file-proxy.ts:106-112), so every call answers 400 INVALID_PATH, 'Not a file address', before tedrisat is asked. Seen on the running app with curl, no session: GET answers 400 {code: INVALID_PATH}, and with Sec-Fetch-Dest: document and a same-origin Referer a 303 back to the page with ?fileError=notFound. No spec or e2e downloads the sheet. Fix: send lang as a path-safe segment, or let the proxy take a query the route builds itself; and a test that downloads it." }
  - { id: F-D1-13, rule: "A refused 'Excel indir' is answered by the proxy with a 303 back to this page with ?fileError=<reason>, but the page does not mount FileErrorNotice (only Müfredat and Ödevler do): the person sees the board again, with ?fileError=notFound left in the address, and no word. With the finding above it is the only thing this link ever does. Fix: mount <FileErrorNotice /> in EvaluationPage, and make the link work." }
  - { id: F-D1-12, rule: "Opening a homework ('1. hafta · …'), 'Bütün ödevler' and a change of screen unmount the button the person pressed, so the focus falls to the document; no heading of the new screen is focused (evaluation-board.tsx:255-260, :364-371). Fix: focus the new screen's h2 (tabIndex -1) on open and the column's heading button on the way back." }
  - { id: F-D1-22, rule: "The overview's first column, the talebe's name, is a plain <td> (render <bdi>); the roster tables mark theirs `rowHeader` (roster-table.tsx:115-118), so a marked cell has no row header for a screen reader. Fix: rowHeader: true on the 'talebe' column (evaluation-board.tsx:244-249)." }
  - { id: F-D1-27, rule: "Each row is a focusable <li tabIndex aria-label> that handles the keys 1, 2, 3 and the arrows, inside a <ul> with no role that says so (listbox or grid); the hint under the title is a <p> not linked to it by aria-describedby, and aria-keyshortcuts sits on the chips, which do not receive the keys. The note box's Input is also used without a Field, outside the primitive's own contract (libs/ui/src/mds/input.tsx). Fix: give the list a role and describe it by the hint, or document the grid pattern." }
  - { id: MARK-1, rule: "New. A save the API refuses, whatever the cause, is one toast, 'Kaydedilemedi', with the talebe's name (evaluation-board.tsx:134-139, :192-194): the page never learns the code (saveEvaluation answers `success: false`). A homework that was switched back to a file homework (404 MEMORIZATION_NOT_FOUND), a talebe who left (404 EVALUATION_TALEBE_NOT_FOUND) and a permission taken away (403) are different sentences, and each will refuse every later press the same way, while the column goes on offering the chips. Each failed save adds another toast that stays until closed. Fix: keep the code in the outcome, say it in words, and read the board again after a 404. Decision D2." }
  - { id: MARK-2, rule: "New. Enter in the note box blurs it (evaluation-board.tsx:557): the note is kept, the box stays open and the focus falls to the document. The keys 1, 2, 3 and the arrows are handled on the list (onKeyDown on the <ul>, :392) and reach it only from inside it, so after a note the keyboard model stops working until the person puts the focus back in the list (where a Tab goes from a blurred box is the browser's; not verified). Escape is kinder: it moves the focus to the toggle (:549, through a ref since c0ca032d). Fix: after Enter put the focus on the row's <li>. Decision D3." }
  - { id: MARK-3, rule: "New. The note's limit is `maxLength=280` on the input (evaluation-board.tsx:551): typing stops at 280 with no counter, no help text and no word, and the placeholder is the one word 'Not'. Inside the box the keys 1, 2 and 3 are text (the handler returns for an INPUT, :340), which the hint under the title does not say." }
  - { id: MARK-4, rule: "New. A save has no success word, by design (evaluation-board.tsx:49-54): the pressed chip and the count are the confirmation. The count counts only 'Tam', and a mark made with a key leaves the focus on the row's <li>, not on a chip, so a screen-reader user hears nothing when 2 or 3 is pressed, or when 'Eksik' replaces 'Vermedi'; only a change in the number of 'Tam' is read aloud. Not verified with a screen reader. Fix: a polite status line that names the talebe and the mark." }
  - { id: label-in-name, rule: "A chip's visible text is its accessible name ('Tam', 'Eksik', 'Vermedi'; the group names the talebe). The note toggle's visible words 'Not' or the note are contained in its name ('{name} için not', '{name} için not: {note}'), WCAG 2.5.3. Holds." }
  - { id: no-confirmation-and-no-way-back, rule: "A mark is saved at once on a press, with no confirmation, and cannot be taken back to 'Bekliyor' from the page: the only way off a mark is another mark (the API has no delete of one; taking the homework off deletes every mark of it, tedrisat-learning deleteLessonAssignment). The same press on the pressed chip sends nothing. By design; said in `changes`." }
