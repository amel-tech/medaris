  chipIncompleteOn: { type: action, component: Button, role: button, text: { key: Evaluation.incomplete }, in: [column, noting], when: "verdict == 'incomplete'", source: apps/nazar/features/evaluation/components/evaluation-board.tsx:448 } # pressed: aria-pressed=true
  chipAbsentOn: { type: action, component: Button, role: button, text: { key: Evaluation.absent }, in: [column, noting], when: "verdict == 'absent'", source: apps/nazar/features/evaluation/components/evaluation-board.tsx:448 } # pressed: aria-pressed=true
