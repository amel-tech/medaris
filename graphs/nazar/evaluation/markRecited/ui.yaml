  # --- nothing to mark ---------------------------------------------------------------------------------------------------------------
  noColumnsLine: { type: text, component: Text, text: { key: Evaluation.noColumns }, in: [noColumns], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:210 } # an EmptyState with an icon: one sentence that says where to set the homework, with no link to the Müfredat
  noTalebeLine: { type: text, component: Text, text: { key: Evaluation.noTalebe }, in: [noTalebe], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:215 }

