  cellFull: { type: text, component: Text, role: cell, text: { key: Evaluation.full }, in: [overview], when: "verdict == 'full'", source: apps/nazar/features/evaluation/components/evaluation-board.tsx:291 } # a success badge
  cellIncomplete: { type: text, component: Text, role: cell, text: { key: Evaluation.incomplete }, in: [overview], when: "verdict == 'incomplete'", source: apps/nazar/features/evaluation/components/evaluation-board.tsx:291 } # a warning badge
  cellAbsent: { type: text, component: Text, role: cell, text: { key: Evaluation.absent }, in: [overview], when: "verdict == 'absent'", source: apps/nazar/features/evaluation/components/evaluation-board.tsx:291 } # an error badge: the talebe "Vermedi"

  # --- one homework opened --------------------------------------------------------------------------------------------------------------
  columnRegion: { type: text, component: Text, role: region, name: { labelledBy: columnTitle }, in: [column, noting, marking], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:368 } # a <section aria-labelledby>
  columnTitle: { type: text, component: Heading, role: heading, text: { key: Evaluation.columnTitle, params: { week: column.weekNumber, title: column.title } }, in: [column, noting, marking], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:383 } # h2; nothing moves the focus to it (F-D1-12)
