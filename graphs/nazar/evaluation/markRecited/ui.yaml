  talebeRow: { type: list, component: ListItem, role: listitem, in: [column, noting, marking], repeat: board.talebe, source: apps/nazar/features/evaluation/components/evaluation-board.tsx:502 } # a focusable <li tabIndex> named by the talebe's own name (an aria-label, no catalog message), test id evaluation-row-<talebe's id>; the one in focus is the one Tab stops at
