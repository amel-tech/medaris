rules:
  - { id: F-B-5, rule: "After 'Grubu kaydet' with no name, or with a name the server finds taken, nothing is announced and the focus stays on the button: the name error is a Field.Error with no role and no live region (libs/ui/src/mds/field.tsx:56, group-dialog.tsx:209-214, :126-131, :145-149). Only 'En az bir izin seçin.' is a role=alert (group-dialog.tsx:345). Fix: focus the first invalid control, or give the errors role=alert." }
  - { id: F-B-7, rule: "The name input is not marked required: Field carries `required` for the decorative aria-hidden star, the Input has none (group-dialog.tsx:296-311), so a screen reader is never told the name is required. Fix: required and aria-required on the input; the form is noValidate, so no native bubble appears." }
  - { id: F-B-10, rule: "A box that the scope 'Ders' switches off, or that the caller may not give, is a disabled checkbox with no word saying why (group-dialog.tsx:384-386, permission-section.tsx:49); a disabled control is skipped by Tab. The locked boxes of the permissions dialog carry 'Gruptan gelir.'. Fix: a description ('Ders kapsamında yok.' / 'Bu izni veremezsiniz.')." }
  - { id: F-B-12, rule: "Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:103-112), so a screen reader may read the name, the scope and 34 boxes as the dialog's description when it opens; the question does the same with its radios (alert-dialog.tsx:84). Not verified in NVDA or VoiceOver. Fix: describe the dialog by its intro sentence only." }
  - { id: F-B-2, rule: "A busy 'Grubu kaydet' and a busy confirm of the question pass no loadingLabel, so their hidden status says 'Yükleniyor' from the primitive's hard-coded default, outside the catalog (group-dialog.tsx:289, :419; libs/ui/src/mds/button.tsx:62)." }
  - { id: F-B-9, rule: "After a delete the card, and with it the 'Düzenle' that opened the dialog, is gone when the page reads again, so Base UI has no element to give the focus back to and it falls to the document (permission-groups.tsx:88-97). Not verified in a browser. Fix: move the focus to the section's heading or the next card's button, and say so in the toast." }
  - { id: GROUPS-1, rule: "New: the scope is not stored. The API works it out from the codes (MADRASAH when any code is a medrese code, else COURSE: apps/tedrisat/src/madrasah/nazir/madrasah-permission.service.ts:115; createGroup picks the allowed codes from the scope sent and then forgets it, :348-351), so a group made as 'Medrese' with course permissions only is edited as 'Ders' with the medrese boxes off, and the footer says 'Ders kapsamı'; and PATCH takes any of the 34 codes whatever scope the group was made with (updateGroup passes ANY_CODE, :383), so the form's rule of the scope is the form's alone. Fix: store the scope, or drop the choice." }
  - { id: GROUPS-2, rule: "New: while a save or a delete runs, 'Vazgeç' and the close icons of the dialog and of the question stay enabled and do nothing (`if (!next && !pending)`, group-dialog.tsx:257-259, :402-404); a busy control is neither disabled nor marked (the same as nizam's F-W3-open-2). Fix: mark them aria-disabled while pending." }
  - { id: GROUPS-3, rule: "New: the API checks the people before the name (madrasah-permission.service.ts updateGroup throws USERS_POLICY_REQUIRED at :401-402 before nameTaken at :404), so a change of permissions of a used group together with a rename into a taken name gets the question first and is refused only after the person has answered; the question then closes and the name error stands in the form (group-dialog.tsx:145-149). Fix: check the name first." }
  - { id: GROUPS-4, rule: "New, not verified: a refusal other than a taken name is an error toast raised while a modal dialog is open (group-dialog.tsx:150-154); the toast region sits in its own portal outside the dialog, which Base UI's modal makes inert, so a screen reader may not announce it and the keyboard cannot reach it. Fix: say the refusal inside the dialog as an Alert." }
  - { id: focus-not-set, rule: "The page sets no focus when it loads, and after a save, a cancel or a delete only Base UI's return of the focus applies (see F-B-9); the graph draws no focus the code does not give." }
  - { id: label-in-name, rule: "'Düzenle' is contained in the card button's accessible name 'Düzenle: {name}' (WCAG 2.5.3), and 'Grubu sil', 'Grubu kaydet' and 'Vazgeç' are their own names. Holds." }
  - { id: confirm-before-delete, rule: "A delete always asks: a plain 'Grubu sil' for a group nobody holds, and a question with an answer to choose for a group people hold, with the button off and 'Vazgeç' focused until then. A rename never asks, and a change of permissions asks only where people hold the group." }
  - { id: toast-is-the-only-word, rule: "What a save or a delete did is said by a toast of 6 seconds (a dialog in the 'Bildirimler' live region); the page itself says nothing more than the card that appears, changes or goes." }
