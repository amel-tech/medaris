# The screens of nazar.nazirs.groups: the section "İzin grupları" of /medrese/<id>/nazirlar, the dialog "İzin grubu tanımla" or
# "İzin grubunu düzenle", the question "Bu grubu N kişi kullanıyor" and the toasts. Read from apps/nazar/features/nazirs
# (permission-groups.tsx, group-dialog.tsx, permission-section.tsx, nazirs-page.tsx, permissions.ts); the words are copied from
# libs/i18n/src/locales/tr/nazar.json, by their key. The one message that is not from the app is Changes.note: no app message
# says what a group's change does to the people who hold it, so one short factual Turkish note is written for it.
# The `composed.*` keys are texts the code builds from data and that no i18n file holds:
#   composed.Groups.eyebrow     the medrese's name above a dialog's title (group-dialog.tsx:263)
#   composed.Groups.cardName    a group's name, in a card and as the eyebrow of the question (permission-groups.tsx:80, group-dialog.tsx:405)
#   composed.Groups.cardSummary the first four permissions as sentences joined by " · ", then "ve N izin daha" (permissions.ts:422)
# The 34 permission boxes are drawn alike (a checkbox named by its sentence from Account.permissions.*): the graph names the four
# the e2e and the walk press, and says in the flow that there are 34, not the 33 that groups#2 still counts.
# The section is drawn only where the dialogs are closed: a modal dialog makes the page behind it inert, and the question makes the
# group's dialog behind it inert, so each draws alone in its states.
