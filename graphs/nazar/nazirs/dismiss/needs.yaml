# What must exist for the başmüderris of a medrese to dismiss one of its nazırs and answer for what that nazır handed on: the flow's product list
# (LAYOUT.md section 7). Each need is what the product must do, from the flow's story and the planned work in the inventory (planned.md P-15), not from
# what the page does today; the known gaps go to graphs/needs.gaps.yaml, which the orchestrator merges. Read by people for now: no checker runs on this file.
#
# For needs.gaps.yaml (nazar.nazirs.dismiss):
#   missing:  adopt-edit-or-drop-each-grant (MDRS-201), each-answer-names-its-person (none), focus-after-a-dismissal (none),
#             an-already-gone-nazir-is-not-an-error (none), not-appointed-by-you-is-worded (none)
#   unwalked: a-refusal-is-told-in-the-dialog, a-moved-list-is-asked-again, a-dropped-seat-with-a-grantee-asks-first, a-failed-read-can-be-retried
#             (code, no e2e; a walk cannot make the API refuse: the walk phase may drive them with a second browser or a stale list)
# No replay is named below: none has run (the walk phase is later); the scenarios of binding.yaml, binding.holder.yaml and binding.drop.yaml are added to
# `walked` as each passes.
kind: needs
flow: nazar.nazirs.dismiss
status: proposed

needs:
  - id: dismiss-a-nazir
    need: >-
      The başmüderris ends a medrese nazır's seat from the nazırs' roster in one confirmed act: the seat and every permission the nazır held in the medrese
      and its courses end at once, the row leaves the roster, and a message says who is no longer a nazır.
    drawn: [roster, dismissThis, dismissDialog, dismissing, settled, toastDismissed]
    built:
      - action: medaris.api:removeMadrasahNazir
      - route: apps/nazar/features/nazirs/components/dismiss-dialog.tsx:112
    walked:
      - e2e: apps/nazar/e2e/dismiss.e2e.ts
        check: 'dismiss#3'

  - id: dismiss-from-every-row
    need: >-
      "Görevden al" is on the row of every nazır the başmüderris runs, whatever the date (the October version gate was lifted by MDRS-215); a nazır who
      holds only madrasah.nazir_appoint has it on the rows they seated and no other.
    drawn: [dismissRow, dismissThis]
    built:
      - route: apps/nazar/features/nazirs/components/nazirs-table.tsx:44
      - route: apps/nazar/features/nazirs/components/nazirs-table.tsx:166
    walked:
      - e2e: apps/nazar/e2e/dismiss.e2e.ts
        check: 'dismiss#1'

  - id: ask-for-everyone-handed-on
    need: >-
      Before the seat ends, the başmüderris is shown every person the nazır gave a role or permission to, what each was given and for how long, and
      answers for each one, Devral (it stays, under her name) or Düşür (it is taken back at once); nothing is chosen for her, and the confirmation stays
      off until every person has an answer.
    drawn: [asking, choosing, partlyAnswered, answered, givenPerson, personRole, answerGroup, takeOver, drop, answersNote, gateNote, submit, choice-only-when-something-was-given, one-row-has-no-partial-answer]
    built:
      - action: medaris.api:getMadrasahNazirGrants
      - action: medaris.api:removeMadrasahNazir
      - route: apps/nazar/features/nazirs/components/dismiss-dialog.tsx:187
      - route: apps/nazar/features/nazirs/nazirs.ts:273
    walked:
      - e2e: apps/nazar/e2e/dismiss.e2e.ts
        check: 'dismiss#2'
      - e2e: apps/nazar/e2e/dismiss.e2e.ts
        check: 'dismiss#3'

  - id: permission-rows-in-the-list
    need: >-
      A person the nazır gave a single permission or a group is listed with it ('1 izin: Başvuruyu onayla ya da reddet'), like a person given a role.
      No API route lets a nazır give a permission (MDRS-108), so a walk cannot make such a row; the e2e seeds it by SQL.
    drawn: [givenPerson]
    built:
      - route: apps/nazar/features/nazirs/components/dismiss-dialog.tsx:234
      - route: apps/nazar/features/nazirs/nazirs.ts:91
    walked:
      - e2e: apps/nazar/e2e/dismiss.e2e.ts
        check: 'dismiss#2'

  - id: nothing-to-ask-when-nothing-was-given
    need: >-
      A nazır who gave nobody anything is dismissed without a choice step: the dialog says there is nothing to choose and what falls with the seat, and
      the confirmation is ready at once.
    drawn: [nothingToAsk, introNoneText, dropNothing, dropSummary, no-choice-when-nothing-was-given]
    built:
      - route: apps/nazar/features/nazirs/components/dismiss-dialog.tsx:182
      - route: apps/nazar/features/nazirs/nazirs.ts:316
    walked:
      - e2e: apps/nazar/e2e/dismiss.e2e.ts
        check: 'dismiss#4'

  - id: cancel-writes-nothing
    need: >-
      "Vazgeç", Esc and the close icon close the dialog and change nothing; the scrim does not close it, so a stray click loses no answers.
    drawn: [dismissCancel, dismissClose, dismissDialog, roster]
    built:
      - route: apps/nazar/features/nazirs/components/dismiss-dialog.tsx:147
      - route: libs/ui/src/mds/dialog.tsx:126
    walked:
      - e2e: apps/nazar/e2e/dismiss.e2e.ts
        check: 'dismiss#5'
      - e2e: apps/nazar/e2e/dismiss.e2e.ts
        check: 'dismiss#2'

  - id: adopt-edit-or-drop-each-grant
    need: >-
      Beside Devral and Düşür the başmüderris can edit a grant before the seat ends (a third answer per row, or a link to the permission editor), as the
      removal of a role is specified in MDRS-201 (planned.md P-15). Today there are two answers and the design's "Düzenle" is not drawn (decision D1).
    drawn: [choosing]
    missing: MDRS-201

  - id: each-answer-names-its-person
    need: >-
      Every Devral and Düşür button carries the person in its accessible name ('Devral: {person}'), so a list of buttons or voice control can tell the rows
      apart (F-B-3).
    drawn: [takeOver, drop, answerGroup]
    missing: none

  - id: focus-after-a-dismissal
    need: >-
      After a dismissal the focus lands on a place a keyboard or screen-reader user can use (the table's caption or the next row's button), not on the
      document, because the pressed button left with its row (F-B-9).
    drawn: [settled, toastDismissed]
    missing: none

  - id: an-already-gone-nazir-is-not-an-error
    need: >-
      When the nazır is already gone, the dismissal says so as a notice that closes by itself, not as an error titled 'Görevden alınamadı' that stays
      until closed (DISMISS-1).
    drawn: [toastGone]
    missing: none

  - id: not-appointed-by-you-is-worded
    need: >-
      A nazır who dismisses someone they did not seat is told so in a sentence of its own, not 'Bir şeyler ters gitti. Biraz sonra yeniden deneyin.'
      which invites a retry (F-B-15).
    drawn: [toastFailed]
    missing: none

  - id: a-refusal-is-told-in-the-dialog
    need: >-
      A refused dismissal (no permission, a taking-over of a row the caller gave themselves, any other failure) keeps the dialog and every answer and says
      why in a toast that stays.
    drawn: [backToDialog, toastRefused, toastSelfGrant, toastFailed]
    built:
      - route: apps/nazar/features/nazirs/components/dismiss-dialog.tsx:129
      - route: apps/nazar/features/nazirs/nazirs.ts:357

  - id: a-moved-list-is-asked-again
    need: >-
      When what the nazır handed on changed while the dialog was open, nothing is written, the answers are cleared, the list is read again and a toast
      says to choose again.
    drawn: [asking, toastChanged]
    built:
      - action: medaris.api:removeMadrasahNazir
      - route: apps/nazar/features/nazirs/components/dismiss-dialog.tsx:134

  - id: a-dropped-seat-with-a-grantee-asks-first
    need: >-
      A Düşür that would leave what a dropped seat's holder handed on with no seat is refused, and the toast tells the başmüderris to dismiss that person
      first or take their seat over.
    drawn: [toastCascade]
    built:
      - action: medaris.api:removeMadrasahNazir
      - route: apps/nazar/features/nazirs/nazirs.ts:361

  - id: a-failed-read-can-be-retried
    need: >-
      When the list of what the nazır gave cannot be read, the dialog says so with a retry and the confirmation stays off.
    drawn: [loadFailed, loadFailedAlert, retry]
    built:
      - route: apps/nazar/features/nazirs/components/dismiss-dialog.tsx:173
