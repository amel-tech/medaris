  dropNothing: { type: alert, component: Alert, role: status, text: { key: Dismiss.drops.nothing, params: { name: nazir.name } }, in: [nothingToAsk, dismissing], when: "nazir == 'bare'", source: apps/nazar/features/nazirs/components/dismiss-dialog.tsx:269 }

edges:
  - { labelledBy: [dismissDialog, dismissTitle] }
  - { triggers: [dismissThis, asking] }
  - { triggers: [submit, dismissing] }
  - { returnsFocus: [dismissDialog, dismissThis] } # Vazgeç, Esc or the close icon: the row's button is still there; not verified in the browser. After a success the button is gone (F-B-9) and the graph says nothing of the focus

rules:
  - { id: focus-not-set, rule: "Nothing in features/nazirs moves the focus when the roster loads, so the page has no initialFocus; the dialog's focus is on 'Vazgeç' (dismiss-dialog.tsx:156) from the moment it opens, while the list is still being read." }
  - { id: F-B-3, rule: "In a list of N people the chips are N pairs of buttons all named 'Devral' and 'Düşür'; the person is only in each group's aria-labelledby hidden legend (libs/ui/src/mds/choice-chips.tsx:70-79), so a button list or voice control cannot tell them apart and the e2e has to scope by person. Fix: give each chip an accessible name with the person, like the row buttons do ('Devral: {person}')." }
  - { id: F-B-9, rule: "After a success the dialog closes and the roster is read again; the pressed 'Görevden al: {name}' button is gone with its row, so Base UI's return focus (DialogPopup.js:96) has no target and the focus falls to the document (not verified in a browser). Fix: move the focus to the table's caption or the next row's button, and say so in the toast." }
  - { id: F-B-15, rule: "NAZIR_NOT_APPOINTED_BY_YOU (403, a nazır holding madrasah.nazir_appoint dismissing one they did not seat) has no case in nazirErrorKey (nazirs.ts:357-389), so it reads 'Bir şeyler ters gitti. Biraz sonra yeniden deneyin.', which wrongly invites a retry. The roster never offers the button on such a row, so only a stale list reaches it. Not verified that the API sends it as `code`. Fix: a case with 'bu görevi siz atamadınız'. Not drawn as its own toast: it is toastFailed." }
  - { id: DISMISS-1, rule: "A dismissal that finds the person already gone (MADRASAH_NAZIR_NOT_FOUND) shows an error toast titled 'Görevden alınamadı' with 'Bu kişi artık bu medresenin nazırı değil.', and closes the dialog and reads the roster again (dismiss-dialog.tsx:129-140). The outcome is the one the başmüderris wanted, yet the toast is tone error, so it never closes by itself and its title says it failed; the Pano's equivalent for an application someone decided first is an info toast that closes (apps/nazar/features/pano/components/pano-tables.tsx:198). New finding, not in the inventory. Fix: tone info with a title like 'Zaten görevden alınmış'." }
  - { id: DISMISS-2, rule: "While the call is in flight the dialog keeps 'Vazgeç', the close icon and Esc live to the eye: onOpenChange ignores a close while `pending` (dismiss-dialog.tsx:148) but DialogClose has no disabled state, so a press does nothing and nothing says why; only 'Görevden al' is busy. New finding, not in the inventory; not verified in a browser. Fix: disable them while pending, or let the cancel stop the wait." }
  - { id: scrim-does-not-close, rule: "A click on the scrim does not close the dialog (a form dialog sets disablePointerDismissal, dialog.tsx:61), so a stray click does not lose the answers; Esc and Vazgeç do close it (dismiss#2 a4). Holds." }
  - { id: no-date-gate, rule: "dismiss#2 is still titled 'after the gate', and both specs pin the browser's clock (BEFORE 2026-10-02, AFTER 2026-10-05) so dates are stable: the 4 Ekim 2026 version gate is gone (MDRS-215) and nothing in nazirs-table.tsx or dismiss-dialog.tsx reads a date, so 'Görevden al' is on every row today. The graph carries the code's behaviour and does not pin a clock (the dates the dialog shows are those of the walk's own rows)." }
  - { id: label-in-name, rule: "The row button's visible text 'Görevden al' is contained in its accessible name 'Görevden al: {name}' (WCAG 2.5.3); the dialog's own 'Görevden al' is named the same as its text. Holds. The e2e needs exact:true to tell the two apart." }
  - { id: confirm-with-consequences, rule: "The dismissal asks once, in a dialog that lists what the nazır handed on and what falls with the seat, with the focus on 'Vazgeç'; the button stays off until every row is answered. Nothing is written until 'Görevden al' (dismiss#5)." }
