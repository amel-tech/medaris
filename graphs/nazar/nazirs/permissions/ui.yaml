  permWeekHide: { type: field, component: TextField, role: checkbox, text: { key: Account.permissions.week_hide }, checked: "extra == 'course'", in: [editing, saving], emits: TICK_COURSE_PERMISSION, source: apps/nazar/features/nazirs/components/permission-editor.tsx:290 } # the single permission of the main story
  fromGroup: { type: text, component: Text, text: { key: Editor.fromGroup }, in: [editing, saving], when: "group == 'course'", source: apps/nazar/features/nazirs/components/permission-section.tsx:47 } # the description of each locked box ("Gruptan gelir."), here two of them; a locked box is disabled, so the keyboard skips it (PERM-4)

