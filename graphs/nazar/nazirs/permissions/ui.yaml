# The screens of nazar.nazirs.permissions: the roster "Medrese nazırları" (/medrese/<id>/nazirlar) with its band and the nazır's row, and the
# dialog "İzinleri düzenle" over it, with the toasts of a save. Read from apps/nazar/features/nazirs (nazirs-page, nazirs-table,
# permission-editor, permission-section, permissions.ts, nazirs.ts) and libs/ui/src/mds (dialog, select, checkbox, field, input, toast);
# the words are copied from libs/i18n/src/locales/tr/nazar.json, key for key, and nothing was walked in a browser.
#
# What the graph draws of a form of 34 boxes. The dictionary has 11 permissions of the medrese and 23 of its courses; the graph draws four
# of them, the ones the walk ticks or meets locked: "Başvuruyu onayla ya da reddet" and "Talebeyi dersi tamamlamış say" (the two of the walk's
# group), "Hafta ve celse gizle, geri al" (the single permission of the main story) and "Medrese nazırı ata" (the single permission of the
# past-end story, e2e permissions#4). The other thirty are boxes like them; `world: open` leaves them out. A box that a group locks is a
# `disabled` checkbox: a graph checks a field's `checked` and not its disabled state, so the lock is said in each node's comment.
#
# Composed text (not in any i18n file), each a value the page puts in a place with no message of its own:
#   composed.Nazirs.groupName     the <bdi> of a group's name in the row's chips (nazirs-table.tsx:86)
#   composed.Nazirs.endDate       the <time> of the end in the row (nazirs-table.tsx:112), a date as dayFormat(locale, zone) writes it
#   composed.Editor.eyebrow       the medrese's name above the dialog's title (permission-editor.tsx:204)
#   composed.Editor.personEmail   the nazır's address in the dialog's header, a <bdi dir=ltr> (permission-editor.tsx:225)
#   composed.Editor.courseTitle   the <bdi> of a course's title as the label of its box (permission-editor.tsx:344)
# The one message that is authored here is none: `changes` is the app's own Editor.note.
#
# Samples: only where the page needs one. The replay reads the binding's samples and matches any text where it has none, so the names (the
# nazır, the person who appointed her, the medrese) are `name` and friends here for the page tool and the replay is left loose there.
schema: delurio-graph/0
kind: ui
id: nazar.nazirs.permissions
flow: nazar.nazirs.permissions
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Editor.note } # the app's own words for what a save does: "Aldığı izni başkasına veremez. Verilen ve geri alınan her izin denetim kaydına yazılır."
samples:
  name: Tahsin Başvuran
  email: e2e-basvuran-f@medaris.test
  madrasah: Hadis ve Siyer Medresesi
  groupName: Deneme izin grubu
  courseTitle: Deneme dersi nzperm
  endDate: 16 Aralık 2026
  count: "1"
  group: "2"
  extra: "1"
  list: Hafta ve celse gizle, geri al
  names: Seher Medrese Nazırı ve Tahsin Başvuran
  appointer: Nuri Başmüderris
  dateLocative: 15 Kasım’da
  date: 15 Kasım 2026

