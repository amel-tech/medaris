  limitHelpNeeds: { type: text, component: Text, text: { key: Editor.whereNeedsCoursePermission }, in: [editing, saving], when: "limit == 'chosen' and not coursePermission", source: apps/nazar/features/nazirs/components/permission-editor.tsx:307 } # no course permission is given, so the choice counts for nothing; the save then goes through as every course
  courseList: { type: text, component: Text, role: group, name: { key: Editor.courses }, in: [editing, saving], when: "limit == 'chosen'", source: apps/nazar/features/nazirs/components/permission-editor.tsx:331 } # a <fieldset data-testid=chosen-courses> with a <legend>, one box per course of the medrese
  courseBox: { type: field, component: TextField, role: checkbox, text: { key: composed.Editor.courseTitle, params: { courseTitle: course.title } }, checked: "courses == 'some'", in: [editing, saving], when: "limit == 'chosen'", emits: TICK_COURSE, source: apps/nazar/features/nazirs/components/permission-editor.tsx:342 } # the walk's own course; the seeded courses have boxes of their own, not drawn
  coursesProblem: { type: alert, component: Alert, role: alert, text: { key: Editor.coursesProblem }, in: [editing, saving], when: "tried and noCourseChosen", source: apps/nazar/features/nazirs/components/permission-editor.tsx:353 } # a <p role=alert>: announced, the one message of the dialog that is

  # the end
