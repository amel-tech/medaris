  editButton: { type: action, component: Button, role: button, intent: secondary, name: { key: Nazirs.editPermissionsLabel, params: { name: nazir.name } }, text: { key: Nazirs.editPermissions }, in: [listed], when: "held != 'nothing'", emits: OPEN_EDITOR, source: apps/nazar/features/nazirs/components/nazirs-table.tsx:147 } # the same Button in the same cell: only its words change after a save
