  rowAppointed: { type: text, component: Text, text: { key: Nazirs.appointedBy, params: { name: nazir.appointer, date: nazir.appointedOn } }, in: [listed], when: "held == 'nothing'", source: apps/nazar/features/nazirs/components/nazirs-table.tsx:78 }
  rowGroup: { type: text, component: Text, text: { key: composed.Nazirs.groupName, params: { groupName: group.name } }, in: [listed], when: "held == 'profile'", source: apps/nazar/features/nazirs/components/nazirs-table.tsx:86 } # a Badge; the group's card under the table says the name too
