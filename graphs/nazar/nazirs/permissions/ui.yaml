  closeIcon: { type: action, component: Button, role: button, intent: dismiss, name: { key: Shell.close }, in: [opening, editing, saving, loadFailed], emits: CLOSE, source: apps/nazar/features/nazirs/components/permission-editor.tsx:206 } # an icon button named only by aria-label; while a save runs it stays on and does nothing (permission-editor.tsx:199)
  editorPerson: { type: text, component: Text, text: { key: composed.Editor.personEmail, params: { email: nazir.email } }, in: [opening, editing, saving, loadFailed], source: apps/nazar/features/nazirs/components/permission-editor.tsx:225 } # beside the name and the line "Medrese nazırı · Atayan: ..."

