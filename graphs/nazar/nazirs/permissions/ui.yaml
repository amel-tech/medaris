  title: { type: text, component: Heading, role: heading, text: { key: Nazirs.title }, in: [forbidden, listed], source: apps/nazar/features/nazirs/components/nazirs-page.tsx:57 } # h1
  intro: { type: text, component: Text, text: { key: Nazirs.intro }, in: [forbidden, listed], source: apps/nazar/features/nazirs/components/nazirs-page.tsx:58 }
  appointButton: { type: action, component: Button, role: button, intent: secondary, text: { key: Nazirs.appoint }, in: [listed], source: apps/nazar/features/nazirs/components/appoint-nazir.tsx:128 } # nazar.nazirs.appoint; left out where the roster read is refused

  forbiddenAlert: { type: alert, component: Alert, role: status, name: { key: Problems.forbiddenTitle }, text: { key: Problems.forbidden }, in: [forbidden], source: apps/nazar/features/shell/components/page-problem.tsx:23 } # a neutral Alert is a status, not an alert (F-B-13)

