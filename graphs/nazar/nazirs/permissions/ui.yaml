  loadFailedAlert: { type: alert, component: Alert, role: alert, name: { key: Editor.loadFailedTitle }, text: { key: Editor.loadFailed }, in: [loadFailed], source: apps/nazar/features/nazirs/components/permission-editor.tsx:245 }
