  rowCourseScope: { type: text, component: Text, text: { key: Nazirs.courseScope, params: { list: nazir.courseList } }, in: [listed], when: "held == 'profile'", source: apps/nazar/features/nazirs/nazirs.ts:141 } # "Ders izinleri yalnız şu derslerde: <the walk's course>"
  rowEnd: { type: text, component: Text, text: { key: composed.Nazirs.endDate, params: { endDate: nazir.endDate } }, in: [listed], when: "held == 'profile'", source: apps/nazar/features/nazirs/components/nazirs-table.tsx:112 } # a <time>; "Süresiz" when the end is left empty, which this row never says (a profile has an end)

  toastSaved: { type: status, component: Status, role: dialog, name: { key: Editor.saved }, text: { key: Editor.savedBody, params: { name: nazir.name } }, in: [listed], when: "toast == 'saved'", source: apps/nazar/features/nazirs/components/permission-editor.tsx:167 } # a toast is a dialog in the "Bildirimler" live region; it closes by itself after 6 seconds
  toastGroupGone: { type: alert, component: Alert, role: alertdialog, name: { key: Editor.failedTitle }, text: { key: Problems.groupGone }, in: [listed, opening, editing, saving, loadFailed], when: "toast == 'groupGone'", source: apps/nazar/features/nazirs/components/permission-editor.tsx:176 } # an error toast stays (timeout 0), over the dialog and, once the dialog is closed, over the page; while a dialog is modal, so whether the accessibility tree exposes it is not verified (PERM-5)
  toastRefused: { type: alert, component: Alert, role: alertdialog, name: { key: Editor.failedTitle }, text: { oneOf: [Problems.actionForbidden, Problems.exceedsGiver, Problems.selfGrant, Problems.permissionUnknown, Problems.courseScope, Problems.expiryInvalid, Problems.actionGeneric] }, in: [listed, opening, editing, saving, loadFailed], when: "toast == 'refused'", source: apps/nazar/features/nazirs/nazirs.ts:357 } # which sentence depends on the code (nazirErrorKey); the binding gives them as one pattern

