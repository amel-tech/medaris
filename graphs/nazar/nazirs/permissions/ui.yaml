  bandOne: { type: alert, component: Alert, role: status, name: { key: Nazirs.awaitingTitle, params: { name: awaiting.name } }, text: { key: Nazirs.awaiting, params: { appointer: nazir.appointer, dateLocative: nazir.appointedOn } }, in: [listed], when: "held != 'nothing'", source: apps/nazar/features/nazirs/nazirs.ts:199 } # only the seeded Seher Medrese Nazırı holds nothing: "Seher Medrese Nazırı henüz izin almadı" and who appointed her

