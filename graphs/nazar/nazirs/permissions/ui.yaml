  cancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: Editor.cancel }, in: [opening, editing, saving, loadFailed], emits: CANCEL, source: apps/nazar/features/nazirs/components/permission-editor.tsx:210 } # while a save runs it does nothing (permission-editor.tsx:199)
