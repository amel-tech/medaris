edges:
  - { labelledBy: [editor, editorTitle] }
  - { triggers: [giveButton, opening] }
  - { triggers: [editButton, opening] }
  - { triggers: [retry, opening] }
  - { triggers: [save, saving] }
  - { returnsFocus: [editor, giveButton] } # Vazgeç, Esc or the close icon: Base UI gives the focus back to what had it, the row's button; not verified in a browser
  - { returnsFocus: [editor, editButton] } # after a save the same button has the other words; the row is read again by router.refresh() (F-B-9: not verified that it keeps its place)

rules:
  - { id: focus-not-set, rule: "The page sets no focus when it loads, and the dialog sets none of its own either: Base UI focuses the first thing it can (the close icon) and permission-editor.tsx:125 moves the focus to the group box once the four reads are in. The graph draws the close icon as the `initialFocus` and says nothing of the second move: a refused save (state `editing` again) leaves the focus on 'Kaydet', so one `focus` of `editing` would be wrong half the time." }
  - { id: F-B-5, rule: "After 'Kaydet' against a bad end the message 'Bitiş zamanı şu andan sonra olmalı.' is a Field.Error with no role and no live region, and the focus stays on the button (permission-editor.tsx:146-161, :365-369; libs/ui/src/mds/field.tsx:50-53). Only 'En az bir ders seçin.' is a role=alert (:353). Fix: focus the end field, or give the error role=alert, as settings-form.tsx:65-74 does." }
  - { id: F-B-10, rule: "A permission the caller may not give is a disabled box with no word why (permission-section.tsx:49, permission-editor.tsx:284 and :295: disabled={(code) => !givable.has(code)}); the locked ones at least say 'Gruptan gelir.'. Not reachable here: the başmüderris and the başnazım, the only people the page gives the editor, may give all 34. Fix: a description 'Bu izni veremezsiniz.'." }
  - { id: F-B-12, rule: "The whole body of the dialog is its description (libs/ui/src/mds/dialog.tsx:103-112): 34 checkboxes, two selects and the end field are what aria-describedby points at, so a screen reader may read the whole form on open. Not verified with one. Fix: describe the dialog by the group's help line only." }
  - { id: F-B-2, rule: "'Kaydet' carries no loadingLabel, so while it saves its hidden status says 'Yükleniyor' from a default in the primitive (libs/ui/src/mds/button.tsx:62), outside the catalog and the same word for every action." }
  - { id: F-B-9, rule: "A row action that changes its own row: after the save the row's button changes its words from 'İzin ver: name' to 'İzinleri düzenle: name'. It is the same Button in the same cell, so Base UI can give the focus back to it; not verified, since router.refresh() draws the table again (nazirs-table.tsx:197)." }
  - { id: PERM-1, rule: "Stale e2e: permissions#2 a3 counts 33 checkboxes (11 of the medrese and 22 of the courses). The dictionary has 11 and 23 today (permission_group.define and user.lookup are in the course section), so the editor draws 34. Read from GET /madrasahs/:id/permissions on the local stack and from permission-section.tsx. The graph does not count the boxes." }
  - { id: PERM-2, rule: "The footer's count ('Hiç izin seçilmedi', '1 izin', 'Gruptan 2 izin', 'Gruptan 2 izin ve 1 ek izin') is a <p> in the dialog footer (libs/ui/src/mds/dialog.tsx:114-116), not a live region: a person who ticks a box or picks a group hears nothing of the new count. Fix: role=status on it." }
  - { id: PERM-3, rule: "Not verified. The editor shows ONE end, the earliest among everything the nazır holds (getMadrasahNazirPermissions: 'the earliest end among them'), and 'Kaydet' sends that one end for every permission; a row kept with a later end is re-timed earlier (madrasah-nazir.repository.ts:470-507). A nazır whose permissions end at different moments, which this page never makes but another route or an older version may, loses the later ends by opening the editor and saving it with nothing touched." }
  - { id: PERM-4, rule: "A group's permissions are `disabled` checkboxes carrying 'Gruptan gelir.' as their description (permission-section.tsx:44-49), so the keyboard skips them and the sentence is read only by someone who browses the page line by line. Fix: aria-disabled, so that they stay in the tab order, or a text 'Gruptan gelir' in the group's own line." }
  - { id: PERM-5, rule: "Not verified. An error toast of a refused save is announced urgently (priority high) while the dialog is modal; whether Base UI's modal marks the toast region inert, so that it is not exposed to the accessibility tree and a screen reader never hears it, is not known from the code. The graph draws the toasts in `editing` and the replay's `exposed` check will say." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'İzin ver' in 'İzin ver: {name}', 'İzinleri düzenle' in 'İzinleri düzenle: {name}' (WCAG 2.5.3). Holds." }
  - { id: closing-asks-nothing, rule: "Vazgeç, the close icon and Esc drop the form with no question (decision D1); the scrim does not close it, so a stray click loses nothing." }
  - { id: courses-problem-is-announced, rule: "'En az bir ders seçin.' is the one message that is a live alert; it shows only after 'Kaydet' was pressed once (`tried`), then follows the form." }
  - { id: grant-end-not-an-instant, rule: "A finding of the domain that this page cannot reach: the editor sends the end as an instant (zonedLocalToIso, or the held one) or null (permissions.ts:196-221, actions.ts:195), so a basic-format date such as '20261231' never reaches PUT .../permissions from it. By hand the route takes it (IsISO8601) and checkGrantExpiry compares NaN: domain invariant grant-end-is-an-instant, holds false, read from the code and not run." }
  - { id: an-edit-cannot-lift-an-end-by-accident, rule: "A finding of the domain that this page does not have: the köşk grant PATCH lifts an end it is not sent (invariant an-edit-cannot-lift-an-end-by-accident, holds false). This route is a PUT that replaces everything and the editor always sends expiresAt, an instant or null, so a save here never lifts an end by leaving it out." }
