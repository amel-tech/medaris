schema: delurio-graph/0
kind: needs
id: nazar.nazirs.permissions
status: proposed
summary: "What must exist for the başmüderris of a medrese to give a nazır permissions: the flow's product list."

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# missing  (no code): group-the-course-permissions (MDRS-226), say-why-a-permission-is-off (none, F-B-10), say-what-is-wrong-where-it-is
# (none, F-B-5), tell-the-count-as-it-changes (none, PERM-2), keep-the-ends-that-differ (none, PERM-3, not verified)
# unwalked (code, no e2e and no replay that passed): read-all-or-nothing, a-refused-save-says-so, the-roster-refuses-the-wrong-person
# (the page's own refusal is walked by nazar.access.medreseNazirRefused, not here)

needs:
  - id: give-a-group-and-single-permissions
    need: >-
      The başmüderris gives a nazır who holds nothing a ready group of permissions and, on top of it, single permissions; the
      group's own permissions come ticked and locked so that nothing is given twice, and what the nazır then holds is on their row
      and off the band that names the nazırs who hold nothing.
    evidence:
      - node: giveButton
      - node: groupBox
      - node: permDecide
      - node: permComplete
      - node: permWeekHide
      - node: fromGroup
      - node: summaryGroupAndExtra
      - state: saving
      - node: toastSaved
      - node: rowGroup
      - node: rowExtra
      - node: bandMany
      - node: bandOne
      - source: apps/tedrisat/src/madrasah/nazir/madrasah-permission.controller.ts:232
      - source: apps/tedrisat/src/madrasah/nazir/madrasah-permission.controller.ts:92
      - source: apps/nazar/features/nazirs/components/permission-editor.tsx:253
      - test: apps/nazar/e2e/permissions.e2e.ts
        name: "nazir/06 — 'İzin ver': a group and one extra permission are saved, and the row shows the group chip and 'Ayrıca 1 izin' (criteria 1, 4, 5)"
      - test: apps/nazar/test/permission-editor.spec.tsx

  - id: limit-course-permissions-to-chosen-courses
    need: >-
      She can let the course permissions hold in every course of the medrese, later ones too, or only in the courses she chooses;
      choosing "Seçtiğim dersler" and no course is refused on the page, and the row says which courses the permissions are limited
      to.
    evidence:
      - node: limitBox
      - node: limitHelpAll
      - node: limitHelpChosen
      - node: limitHelpNeeds
      - node: courseList
      - node: courseBox
      - node: coursesProblem
      - node: rowCourseScope
      - source: apps/tedrisat/src/madrasah/nazir/madrasah-permission.controller.ts:232
      - source: apps/tedrisat/src/madrasah/madrasah.controller.ts:664
      - source: apps/nazar/features/nazirs/permissions.ts:155
      - test: apps/nazar/e2e/permissions.e2e.ts
        name: "nazir/06 — course permissions can be limited to chosen courses; the row says which"
    note: Also drawn as the assertion a-chosen-course-limit-needs-a-course.

  - id: set-an-end
    need: >-
      She can give an end, a date and a time on her own clock after which the permissions lapse by themselves; an end that is not
      ahead is refused on the page, and an empty end means for good. The row says the end, or "Süresiz".
    evidence:
      - node: endBox
      - node: endHelp
      - node: endError
      - node: rowEnd
      - source: apps/tedrisat/src/madrasah/nazir/madrasah-permission.controller.ts:232
      - source: apps/nazar/features/nazirs/permissions.ts:196
      - source: libs/utils/src/end-instant.ts:141
      - test: apps/nazar/e2e/permissions.e2e.ts
        name: "nazir/06 — the end is a moment to come: one that is not after now is refused on the page, a later one is saved as typed (criterion 3)"
      - test: libs/utils/test/end-instant.spec.ts
    note: |-
      Also drawn as the assertion an-end-in-the-past-is-never-sent.
      permissions#4: date-bound: it types 2026-10-01 against a pinned clock and 2027-03-15 as the end; the graph's binding
      computes both from today

  - id: reopen-and-see-it-as-left
    need: >-
      She opens the editor again and sees what the nazır holds as she left it: the group, the single permissions, the limit and
      the courses, the end; saving it with the end emptied makes the permissions last for good.
    evidence:
      - node: editButton
      - state: opened
      - node: permDecide
      - node: courseBox
      - node: summaryGroupAndExtra
      - source: apps/tedrisat/src/madrasah/nazir/madrasah-permission.controller.ts:204
      - source: apps/nazar/features/nazirs/permissions.ts:83
      - test: apps/nazar/e2e/permissions.e2e.ts
        name: "nazir/06 — 'İzinleri düzenle' opens with what the nazır holds and replaces it: the group stays locked, the end is cleared (criterion 4)"
      - test: apps/nazar/e2e/permissions.e2e.ts
        name: "nazir/06 — course permissions can be limited to chosen courses; the row says which"
    note: |-
      Also drawn as the effect profileForm.
      permissions#5: a8 and a9, the reopened limit and course

  - id: cancel-writes-nothing
    need: >-
      Vazgeç, the close icon and Esc close the editor and write nothing; the scrim does not close it, so a stray click loses
      nothing.
    evidence:
      - node: cancel
      - node: closeIcon
      - source: apps/nazar/features/nazirs/components/permission-editor.tsx:198
      - test: apps/nazar/e2e/permissions.e2e.ts
        name: "nazir/06 — 'Vazgeç' writes nothing"
    note: Also drawn as the effect discard.

  - id: the-buttons-are-on-whatever-the-date
    need: "\"İzin ver\" and \"İzinleri düzenle\" are on whatever the date: the nazır's appointment gates neither (MDRS-215)."
    evidence:
      - node: giveButton
      - node: editButton
      - source: apps/nazar/features/nazirs/components/nazirs-table.tsx:147
      - test: apps/nazar/e2e/permissions.e2e.ts
        name: "nazir/06 — 'İzin ver' and 'İzinleri düzenle' are on whatever the date (MDRS-215: no version gate)"
    note: "permissions#1: it pins the clock before the appointment; the graph walks the real date and does not carry the pin"

  - id: read-all-or-nothing
    need: >-
      The editor reads the dictionary, the groups, what the nazır holds and the courses together; when one cannot be read it says
      so, offers a retry and saves nothing, since a form half read would save over what it did not show.
    evidence:
      - state: opening
      - state: loadFailed
      - node: loadFailedAlert
      - node: retry
      - source: apps/tedrisat/src/madrasah/nazir/madrasah-permission.controller.ts:204
      - source: apps/nazar/features/nazirs/actions.ts:144
      - test: apps/nazar/test/permission-editor.spec.tsx

  - id: a-refused-save-says-so
    need: >-
      When the server refuses a save (the group or the nazır is gone, a permission is not hers to give, the courses are not the
      medrese's, an end that is not ahead) she is told in words and the form stays as it was; a group that is gone reloads the
      editor, a nazır that is gone closes it.
    evidence:
      - node: toastRefused
      - node: toastGroupGone
      - state: saving
      - state: nazir_gone
      - source: apps/nazar/features/nazirs/nazirs.ts:357
      - source: apps/nazar/features/nazirs/components/permission-editor.tsx:176
      - test: apps/nazar/test/nazirs.spec.ts

  - id: the-roster-refuses-the-wrong-person
    need: >-
      A nazır who was not given "Medrese nazırı ata" meets a refusal in place of the roster and has no button here; an unknown
      medrese is the 404 page.
    evidence:
      - state: forbidden
      - node: forbiddenAlert
      - state: not_found
      - source: apps/tedrisat/src/madrasah/nazir/madrasah-nazir.controller.ts:73
      - source: apps/nazar/features/nazirs/components/nazirs-page.tsx:69
      - test: apps/nazar/e2e/nazirs.e2e.ts
        name: "nazir/05 — a medrese nazır is refused: a notice, no table and no way to appoint (criterion 5)"

  - id: group-the-course-permissions
    need: >-
      The 23 course permissions are grouped, and a group of them can be ticked at once, instead of one flat list of 34 boxes
      (planned.md P-17, MDRS-226, requested by the owner on 2026-10-03; the issue names nizam-web's list of boxes, and this editor
      draws a flat list as well, so it is an increment of this dialog too).
    missing: MDRS-226; findings MDRS-226
    note: >-
      Drawn on the nodes madrasahSection and courseSection, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: say-why-a-permission-is-off
    need: >-
      A permission the person may not give says so ("Bu izni veremezsiniz."), as the locked ones say "Gruptan gelir." (F-B-10).
    missing: no issue; nobody the page admits has a ceiling smaller than the whole dictionary, so it cannot be seen on the stack
    note: >-
      Drawn on the node permDecide, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).

  - id: say-what-is-wrong-where-it-is
    need: >-
      A save stopped by the page moves the focus to the first field in error or announces the message, the end's as well as the
      courses' (F-B-5).
    missing: no Linear issue; F-B-5
    note: >-
      Drawn on the nodes endError and coursesProblem, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).

  - id: tell-the-count-as-it-changes
    need: The footer's count of what is ticked ("Gruptan 2 izin ve 1 ek izin") is announced when it changes (PERM-2).
    missing: no Linear issue; PERM-2
    note: >-
      Drawn on the nodes summaryNone, summarySingle, summaryGroup and summaryGroupAndExtra, which the code has: they are not
      evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: keep-the-ends-that-differ
    need: >-
      A nazır whose permissions end at different moments keeps those ends when the editor is saved with nothing touched; today it
      opens with the earliest and sends that one for all (PERM-3, not verified: it needs permissions that end differently, which
      this page never makes).
    missing: no Linear issue; PERM-3, not verified
    note: >-
      Drawn on the node endBox, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves
      out what only missing needs name).
