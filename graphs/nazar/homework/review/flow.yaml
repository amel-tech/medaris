      SEND: { target: reviewingEmpty, source: "apps/nazar/features/homework/components/review-dialog.tsx:157", say: "pressed again, the same line" }
      CLOSE:
        - { guard: "shown == 'one'", target: filtered, source: "libs/ui/src/mds/dialog.tsx:97" }
        - { target: listed, source: "libs/ui/src/mds/dialog.tsx:97" }
      CANCEL:
        - { guard: "shown == 'one'", target: filtered, source: "apps/nazar/features/homework/components/review-dialog.tsx:216" }
        - { target: listed, source: "apps/nazar/features/homework/components/review-dialog.tsx:216" }
      DISMISS:
        - { guard: "shown == 'one'", target: filtered, source: "apps/nazar/features/homework/components/review-dialog.tsx:202" }
        - { target: listed, source: "apps/nazar/features/homework/components/review-dialog.tsx:202" }
    source: apps/nazar/features/homework/components/review-dialog.tsx:259

  uploadPanel:
    title: The upload panel is open
    by: human
    description: >-
      "Dosya yükle" gave way to a panel inside the dialog's form: the legend "Dosya yükle", the note "Dosya hemen kaydedilir; talebe onu değerlendirmeyi gönderince
      görür." (wrong for a review that was already sent, NHWREV-2), the file field "Dosya" with its help, "Yükle" and "Vazgeç". The focus is not moved to the field
      (F-D1-10). Choosing a file shows "Seçilen dosya: <ad> · <boyut>" and checks it against the page's own two limits (empty, over 25 MB: out of view);
      "Yükle" with no file says "Bir dosya seçin." in place of the help. After a refused upload the panel stays with a "Dosya yüklenemedi" alert (role=alert) and
      the chosen file, and a new "Yükle" tries again. The replay cannot set a file input, so `PICK_FILE` is not walked, and the upload that needs a chosen file is
      read from the code.
    on:
      PICK_FILE: { target: uploadPanel, effect: [pickChosen], source: "apps/nazar/features/files/components/file-upload.tsx:200", say: "they choose a file in the native picker" }
      UPLOAD:
        - { guard: "pick == 'chosen'", target: uploading, source: "apps/nazar/features/files/components/file-upload.tsx:111" }
        - { target: uploadPanel, effect: [pickMissing], source: "apps/nazar/features/files/components/file-upload.tsx:103", say: "no file: \"Bir dosya seçin.\", nothing is sent" }
      CANCEL_PANEL: { target: reviewing, effect: [pickNone], source: "apps/nazar/features/files/components/file-upload.tsx:85", say: "\"Vazgeç\": the panel folds, \"Dosya yükle\" is back, the focus is not returned (F-D1-10)" }
      CLOSE:
        - { guard: "shown == 'one'", target: filtered, source: "libs/ui/src/mds/dialog.tsx:97" }
        - { target: listed, source: "libs/ui/src/mds/dialog.tsx:97" }
      CANCEL:
        - { guard: "shown == 'one'", target: filtered, source: "apps/nazar/features/homework/components/review-dialog.tsx:216" }
        - { target: listed, source: "apps/nazar/features/homework/components/review-dialog.tsx:216" }
      DISMISS:
        - { guard: "shown == 'one'", target: filtered, source: "apps/nazar/features/homework/components/review-dialog.tsx:202" }
        - { target: listed, source: "apps/nazar/features/homework/components/review-dialog.tsx:202" }
    source: apps/nazar/features/files/components/file-upload.tsx:170

  uploading:
    title: The file is sent
    by: human
    description: >-
      The browser posts the file as multipart to this app's route /api/files/courses/<id>/reviews/<submissionId>, which streams it on to tedrisat's POST
      /courses/:id/submissions/:submissionId/review/files with the caller's token. "Yükle" is busy ("Yükleniyor…" in a hidden output), the field and "Vazgeç" are
      off, the trash buttons and the submit are off while it runs. On 201 the row takes tedrisat's answer, a toast says "Dosya yüklendi", the panel closes and
      "Dosya yükle" is back. The file is stored and, on a review that was already sent, shown to the talebe now (NHWREV-2). A review with no file before it is
      now a draft ("Gönderilmedi"). On a refusal the panel stays and the alert says why: the local stack answers 503 STORAGE_NOT_CONFIGURED ("Dosya deposu henüz
      kurulmadı. Yöneticiye haber verin."); a sixth file answers 409 and the alert says "Bir şeyler ters gitti..." (NHWREV-4).
    invoke: { action: webAddSubmissionReviewFile }
    on:
      DONE:
        - { guard: "upload == 'stored' and files == 'none' and row == 'none'", target: reviewing, effect: [filesOne, rowToDraft, pickNone, toastUploaded], source: "apps/nazar/features/files/components/file-upload.tsx:123" }
        - { guard: "upload == 'stored' and files == 'none'", target: reviewing, effect: [filesOne, pickNone, toastUploaded], source: "apps/nazar/features/files/components/file-upload.tsx:123" }
        - { guard: "upload == 'stored' and files == 'one'", target: reviewing, effect: [filesMany, pickNone, toastUploaded], source: "apps/nazar/features/files/components/file-upload.tsx:123" }
        - { guard: "upload == 'stored'", target: reviewing, effect: [pickNone, toastUploaded], source: "apps/nazar/features/files/components/file-upload.tsx:123" }
      FAIL.signedOut: sent_to_sign_in
      FAIL.noStorage: { guard: "upload == 'noStorage'", target: uploadPanel, effect: [faultNoStorage], source: "apps/nazar/features/files/components/file-upload.tsx:119" }
      FAIL.limit: { guard: "upload == 'limit'", target: uploadPanel, effect: [faultLimit], source: "apps/nazar/features/files/files.ts:146", say: "SUBMISSION_REVIEW_FILE_LIMIT is not in fileErrorKey: the generic sentence (NHWREV-4)" }
      FAIL.wrongType: { guard: "upload == 'wrongType'", target: uploadPanel, effect: [faultWrongType], source: "apps/nazar/features/files/components/file-upload.tsx:119" }
      FAIL.refused: { guard: "upload == 'refused'", target: uploadPanel, effect: [faultRefused], source: "apps/nazar/features/files/components/file-upload.tsx:119" }
      FAIL.failed: { guard: "upload == 'failed'", target: uploadPanel, effect: [faultFailed], source: "apps/nazar/features/files/components/file-upload.tsx:119" }
    source: apps/nazar/features/files/components/file-upload.tsx:111

  removing:
    title: A review file is removed
    by: human
    description: >-
      The trash button of a review's file calls the server action deleteSubmissionReviewFile (DELETE /courses/:id/submissions/:submissionId/review/files/:fileId):
      the row goes, the object is queued for the store's sweep and the removal is audited. There is no question and no toast. A 404 SUBMISSION_FILE_NOT_FOUND is taken
      as done. The file leaves the list at once and the submit turns to "Yeniden gönder" only if a review was already sent. On a review that was already sent the
      talebe loses the file now (NHWREV-2), and the last one can go from a review with no note, which leaves an empty review under "Değerlendirildi" (NHWREV-3). On a
      review that was not sent the last file's removal leaves the badge "Gönderilmedi" over an empty review until the page is read again (NHWREV-7). The trash button
      that had the focus is gone with its row and nothing moves the focus (F-D1-10). Any other refusal is an error toast "Değerlendirme kaydedilemedi" and the file stays.
    invoke: { action: deleteSubmissionReviewFile }
    on:
      DONE:
        - { guard: "answer == 'saved' and files == 'one'", target: reviewing, effect: [filesNone], source: "apps/nazar/features/homework/components/review-dialog.tsx:185" }
        - { guard: "answer == 'saved'", target: reviewing, effect: [filesOne], source: "apps/nazar/features/homework/components/review-dialog.tsx:185" }
      FAIL.gone:
        - { guard: "files == 'one'", target: reviewing, effect: [filesNone], source: "apps/nazar/features/homework/components/review-dialog.tsx:181", say: "the file was already gone: the same as done" }
        - { target: reviewing, effect: [filesOne], source: "apps/nazar/features/homework/components/review-dialog.tsx:181" }
      FAIL.refused: { guard: "answer == 'refused'", target: reviewing, effect: [toastSaveRefused], source: "apps/nazar/features/homework/components/review-dialog.tsx:182" }
      FAIL.failed: { guard: "answer == 'failed'", target: reviewing, effect: [toastSaveFailed], source: "apps/nazar/features/homework/components/review-dialog.tsx:182" }
    source: apps/nazar/features/homework/components/review-dialog.tsx:176

  sending:
    title: The review is sent
    by: human
    description: >-
      The server action sendSubmissionReview calls PUT /courses/:id/submissions/:submissionId/review with the trimmed note (null when blank): tedrisat stores the
      note (replacing an earlier one), who sent it and when, lets the files already attached show to the talebe, writes the audit row and notifies the talebe
      (SUBMISSION_REVIEWED) on every send, a re-send that changes nothing included, unless the reviewer is that talebe. The submit is busy ("Yükleniyor", a hard-coded
      default word) and the field is off; "Kapat", the X and Esc do nothing while it runs and stay drawn as usable (NHWREV-5). On 200 the row takes tedrisat's answer
      ("Değerlendirildi", "{reviewer} · {time}", the button "Değerlendirmeyi aç"), a toast says "Değerlendirme gönderildi" and "{talebe} adlı talebe değerlendirmenizi
      görecek.", and the dialog closes. Any refusal is an error toast "Değerlendirme kaydedilemedi" with a sentence by the code, the dialog stays and what was typed
      stays. A call that throws is not caught (F-D1-20): the busy state is not reset and the page may reach the error boundary (not verified).
    invoke: { action: sendSubmissionReview }
    on:
      DONE:
        - { guard: "answer == 'saved' and typed == 'words'", target: sentToTalebe, effect: [rowToSent, noteKept, toastSent], source: "apps/nazar/features/homework/components/review-dialog.tsx:167" }
        - { guard: "answer == 'saved'", target: sentToTalebe, effect: [rowToSent, noteNone, toastSent], source: "apps/nazar/features/homework/components/review-dialog.tsx:167" }
      FAIL.empty: { guard: "answer == 'empty'", target: reviewing, effect: [toastSaveEmpty], source: "apps/nazar/features/homework/components/review-dialog.tsx:145" }
      FAIL.refused: { guard: "answer == 'refused'", target: reviewing, effect: [toastSaveRefused], source: "apps/nazar/features/homework/components/review-dialog.tsx:149" }
      FAIL.failed: { guard: "answer == 'failed'", target: reviewing, effect: [toastSaveFailed], source: "apps/nazar/features/homework/components/review-dialog.tsx:149" }
    source: apps/nazar/features/homework/components/review-dialog.tsx:160

  sentToTalebe:
    title: The talebe is told
    description: >-
      The review is on the talebe's page (tedris.learn.homeworkReview) and in their bell. Nothing here draws it; the dialog has closed and the list is drawn
      again, with the toast. A step with no screen of its own.
    always:
      - { guard: "shown == 'one'", target: filtered, starts: { flow: tedris.learn.homeworkReview, given: { reviewed: "true" } }, source: "apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:416", say: "the talebe reads the review on their own page" }
      - { target: listed, starts: { flow: tedris.learn.homeworkReview, given: { reviewed: "true" } }, source: "apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:416", say: "the talebe reads the review on their own page" }
    source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:416

  dialogHandInDownload:
    title: The talebe's file is asked for from the dialog
    by: human
    description: >-
      The same plain link as the table's, inside the dialog (/api/files/courses/<id>/submissions/<fileId>). A file that is served is saved and the dialog stays. A
      refusal loads the whole page again: the dialog is gone with what was typed, the filter is reset and a toast says why (NHWREV-1). The local stack answers 503.
    invoke: { action: webDownloadCourseSubmissionFile }
    on:
      DONE: { guard: "download == 'served'", target: reviewing, source: "libs/services/src/file-proxy/file-proxy.ts:373", say: "the file is saved by the browser; the dialog does not change" }
      FAIL.signedOut: sent_to_sign_in
      FAIL.forbidden: { guard: "download == 'forbidden'", target: reloading, effect: [showAll, toastFileForbidden], source: "libs/services/src/file-proxy/file-proxy.ts:351" }
      FAIL.notFound: { guard: "download == 'notFound'", target: reloading, effect: [showAll, toastFileNotFound], source: "libs/services/src/file-proxy/file-proxy.ts:351" }
      FAIL.unavailable: { guard: "download == 'unavailable'", target: reloading, effect: [showAll, toastFileUnavailable], source: "libs/services/src/file-proxy/file-proxy.ts:351" }
      FAIL.failed: { guard: "download == 'failed'", target: reloading, effect: [showAll, toastFileFailed], source: "libs/services/src/file-proxy/file-proxy.ts:351" }
    source: apps/nazar/features/homework/components/review-dialog.tsx:234

  dialogReviewDownload:
    title: A file of the review is asked for from the dialog
    by: human
    description: >-
      The link of a review's file (/api/files/courses/<id>/review-files/<fileId>), which streams tedrisat's GET /courses/:id/submissions/review-files/:fileId
      (any homework of the course, sent or not; audited before it is sent). The same outcomes as the hand-in's file, and the same reload on a refusal (NHWREV-1).
    invoke: { action: webDownloadCourseSubmissionReviewFile }
    on:
      DONE: { guard: "download == 'served'", target: reviewing, source: "libs/services/src/file-proxy/file-proxy.ts:373", say: "the file is saved by the browser; the dialog does not change" }
