# A müderris (or a ders nazırı who holds submission.read) reads Ödevler of a course in nazar-web (/ders/<id>/odevler) and reviews a hand-in: reads
# what each talebe handed in, narrows the list to one celse, opens "Değerlendir", writes a note, adds or removes the files returned with it, and sends.
# Read from the code of PR #394's branch on 15 Nov 2026 (apps/nazar/features/homework, apps/nazar/features/files, libs/ui/src/mds/{dialog,select,table}.tsx,
# apps/tedrisat/src/lesson-submission); captured, nothing here is a plan. Nothing was seen in a browser: every claim about a page is read from the code.
#
# FILES ARE STORED IN BUNNY STORAGE, WHICH THE LOCAL STACK DOES NOT HAVE. Every upload answers 503 STORAGE_NOT_CONFIGURED (tedrisat's upload gate refuses
# before it reads the body, apps/tedrisat/src/storage/upload.ts:113) and every download answers 503 too (assertConfigured comes first, service.ts:285, :331).
# The graph draws every outcome the code has; the binding walks what the stack can do: the page, the filter, a refused download (the page loads again with
# a toast), the dialog, the note, the review without a file, a removal of a file row that the walk writes by SQL, and the empty and refused pages. It cannot
# walk a file chosen in the panel (the replay has no action that sets a file input), so `PICK_FILE` and the upload that follows are read from the code.
#
# The story is the other side of two talebe flows: tedris.learn.homeworkHandIn starts this flow (`handedIn: true`, the hand-in is on the team's list), and
# this flow starts tedris.learn.homeworkReview (`reviewed: true`) once a review is sent.
#
# Findings this flow touches (ui.yaml `rules` carries the same ids; the inventory's are F-D1-*, the new ones NHWREV-*):
#   F-D1-04   the celse filter and its counts are not live regions: nothing says the list changed, and the counts line does not follow the filter
#   F-D1-09   the row's button is named "{name} adlı talebenin ödevini değerlendir" whether it says "Değerlendir" or "Değerlendirmeyi aç" (WCAG 2.5.3)
#   F-D1-10   removing a review file unmounts the focused trash button; opening the upload panel unmounts "Dosya yükle"; "empty" is a Field.Error, not announced
#   F-D1-31   a row with no note shows "—" inside aria-hidden: the Not cell is empty to a screen reader
#   F-D1-01   the failed read draws a second h1; F-D1-20 no try/catch around the server action (a thrown call is not caught: the busy state may stay)
#   F-C-course-a-14  the upload panel's lost focus (the panel is nazar.curriculum.resources's too)
#   NHWREV-1  a refused download from the dialog loads the whole page again: the dialog is gone and a typed note with it (the Z5 flow calls it NFILES-2)
#   NHWREV-2  a file added to or removed from a review that was already sent reaches the talebe at once; the dialog and the panel say the opposite
#   NHWREV-3  a sent review can be emptied: the last file of a review with no note can be removed, and "Değerlendirildi" stays over nothing
#             (the talebe's side is HWREVIEW-1)
#   NHWREV-4  a sixth review file answers 409 SUBMISSION_REVIEW_FILE_LIMIT, and the panel says "Bir şeyler ters gitti..." because fileErrorKey does not know the
#             code; the sentence made for it ("en çok 5 dosya") sits in a branch no API answer reaches, and "Dosya yükle" is not closed at five
#   NHWREV-5  while a send, an upload or a removal runs, "Kapat", the X and Esc do nothing and stay drawn as usable, and two controls carry the name "Kapat"
#   NHWREV-6  closing the dialog throws a typed note away with no question and no draft (the files are stored at once, the note is not)
#   NHWREV-7  after the last file of an unsent review is removed the row says "Gönderilmedi" over an empty review until the page is read again
# E2E carried: none (the inventory lists none: apps/nazar/e2e has no spec for Ödevler; test/homework.spec.tsx pins it with the actions mocked). Carried by
# the replay, not by an e2e check: the scenarios in binding.yaml.
schema: delurio-graph/0
kind: flow
id: nazar.homework.review
status: captured
domain: medaris.api
ui: nazar.homework.review
title: Read the hand-ins of a course and send the review of one
summary: >-
  The müderris opens Ödevler from the course menu (it is drawn only for a holder of submission.read). The page lists the course's celses in programme
  order, each with whether homework was set, "N / M teslim", and a table with the talebe, their files (download links), when they last changed it, their
  note and where the review stands: "Değerlendirilmedi", "Gönderilmedi" (files attached, not sent), "Değerlendirildi" or "Sonradan değişti". A filter
  narrows the page to one celse, even one with nothing handed in. A hand-in's file is a plain link: where the store cannot give it the browser comes back
  with a toast that stays until it is closed, the whole page loaded again. "Değerlendir" opens a dialog with the talebe's files and note, a field for the
  note to the talebe and the files returned with the review; a file is stored the moment it is chosen and sent, a removal is final the moment it is
  pressed, and the talebe sees none of the review until "Değerlendirmeyi gönder" sends it (a review that was already sent shows file changes at once).
  Sending needs a note or a file, tells the talebe, closes the dialog and updates the row. The page keeps no focus of its own.

scope:
  shows: >-
    Ödevler of one course for a reader who may read hand-ins: the header, the celse filter and its list, the counts, a table per celse, the review column,
    the review dialog with its file list and upload panel, the toasts, and the refusals (no submission.read, nothing handed in, a failed read)
  world: open # what is not drawn is not ruled out; only `outOfView` and `assertions` are binding
  outOfView:
    - "the talebe handing in, and the talebe reading the review: tedris.learn.homeworkHandIn, tedris.learn.homeworkReview"
    - "giving a celse homework, and a celse whose homework is recited (the line \"Ezber · Değerlendirme’de işaretlenir\", no count, no table rows): nazar.curriculum.sessionHomework, nazar.evaluation.markRecited"
    - "the file links of the other pages (Müfredat, Değerlendirme) and the table's link taken on its own: nazar.files.download. This flow draws the table's link only as a step that ends in the reload, and keeps the dialog's two links, which that flow leaves to this one"
    - "a hand-in with no file (the cell says \"Dosya yok\"), a long note (cut at 140 characters with \"Tamamını göster\" and \"Kısalt\"), a talebe whose name tedrisat does not have (\"Adı bilinmeyen talebe\"), several rows in a table, a file's type chip and size, a celse's start time"
    - "a celse that was hidden since, whose homework is listed under its own title with no count; a cancelled celse (listed only with homework or hand-ins)"
    - "a file chosen that the page refuses before sending it (empty: \"Bu dosya boş...\", over 25 MB: \"Bu dosya 25 MB’tan büyük...\"), a request that never gets an answer (NETWORK), a celse or a course that is gone meanwhile (their own sentences), and the API's SUBMISSION_REVIEW_EMPTY, which the page's own check makes unreachable but for a file another person removed under the open dialog (drawn as `answer: empty`)"
    - "the trash buttons, the downloads and the submit button while the upload panel is open: they work and are not drawn (the graph keeps the panel's own steps in `uploadPanel`)"
    - "the notification the talebe gets (SUBMISSION_REVIEWED), written on every send, a re-send that changes nothing included: tedris.account.notifications; the audit rows (submission.review, review_file_upload, review_file_delete)"
    - "a note longer than 4000 characters: the field stops at 4000, so \"Not en çok 4000 karakter olabilir.\" cannot appear (F-D1-10)"
    - "a ders nazırı who holds some other code: the menu hides Ödevler and the address answers the refusal drawn here as `forbidden`: nazar.access.dersNazirPages"

decisions:
  D1:
    question: >-
      Should a refused download keep the dialog and what was typed in it? Both links of the dialog are plain anchors; a refusal is a 303 back to the page
      (?fileError=), which loads it again, closes the dialog and drops the note. A fetch() would get the JSON the proxy already keeps for such callers.
    recommend: >-
      Yes, as nazar.files.download and tedris.files.download ask: fetch the file and say the reason in a toast without leaving the page (NHWREV-1).
    affects: [dialogHandInDownload, dialogReviewDownload]
  D2:
    question: >-
      Should a file added to or removed from a review that was already sent reach the talebe at once? Today it does (tedrisat: "a review already sent shows
      it to the talebe at once"), and the dialog says only that sending again changes the note.
    recommend: >-
      Say it in the dialog and in the panel's note, or hold the file changes until "Yeniden gönder" (NHWREV-2); and refuse a removal that would leave a sent
      review with neither a note nor a file (NHWREV-3).
    affects: [uploading, removing]
  D3:
    question: >-
      Should the dialog keep a typed note when it is closed (a draft), or ask before it is thrown away? The files are kept; the note is not.
    recommend: >-
      Keep the note on the review as a draft, as the files already are, or ask once before closing a dialog whose note differs from the stored one (NHWREV-6).
    affects: [reviewing, uploadPanel]

context:
  # --- case variables: what the world is (initial: any) ---
  handedIn:
    values: [true, false]
    initial: any
    say:
      "true": "at least one talebe handed something in on the course (tedris.learn.homeworkHandIn starts this flow with it): the page lists it"
      "false": "nothing is handed in on the course and the course team set no homework on any celse: the page is the empty alert"
  access:
    values: [granted, refused]
    initial: any
    say:
      granted: "the reader holds submission.read on the course: the müderris, the köşk's nazım, the başmüderris, or a ders nazırı who was given it"
      refused: "the reader does not hold it (a ders nazırı with another code opens the address): the page says \"Bu sayfaya izniniz yok\""
  before:
    values: [fresh, draft, sent, changed]
    initial: any
    say:
      fresh: "the hand-in has no review: \"Değerlendirilmedi\", the talebe handed in a file and no note"
      draft: "a file is attached to the review and it is not sent: \"Gönderilmedi\""
      sent: "a review was sent with a file and no note: \"Değerlendirildi\""
      changed: "a review with a note and a file was sent, and the talebe changed the homework after it (they added a note): \"Sonradan değişti\""
  answer:
    values: [saved, empty, refused, failed]
    initial: any
    say:
      saved: "tedrisat does what the dialog asks: sends the review (200), or removes the review file (204)"
      empty: "the API says the review has neither a note nor a file (400 SUBMISSION_REVIEW_EMPTY): another person removed the last file under the open dialog"
      refused: "the API says the reader may not (403 AUTHZ_FORBIDDEN): the permission was taken away while the dialog was open"
      failed: "the API refuses for another reason (the celse is gone, a 400) or does not answer"
  upload:
    values: [stored, noStorage, limit, wrongType, refused, failed]
    initial: any
    say:
      stored: "a file the panel sends and tedrisat keeps (201), on a stack that has storage"
      noStorage: "tedrisat cannot keep it: 503 STORAGE_NOT_CONFIGURED (the local stack) or STORAGE_UNAVAILABLE"
      limit: "the review already holds five files: 409 SUBMISSION_REVIEW_FILE_LIMIT"
      wrongType: "the bytes are none of the eight types: 415 FILE_TYPE_NOT_ALLOWED"
      refused: "403 AUTHZ_FORBIDDEN"
      failed: "any other answer: a 404 SUBMISSION_NOT_FOUND, a 400"
  download:
    values: [served, forbidden, notFound, unavailable, failed]
    initial: any
    say:
      served: "the store gives the file: the browser saves it and the page stays"
      forbidden: "403: the browser comes back with ?fileError=forbidden"
      notFound: "400, 404 or 410: ?fileError=notFound"
      unavailable: "502, 503 or 504: ?fileError=unavailable. The local stack answers 503 to every download"
      failed: "any other status: ?fileError=failed"

  # --- shown-state variables: what the screen remembers ---
  shown:
    values: [all, one, quiet]
    initial: all
    say:
      all: "the filter reads \"Bütün celseler\": every celse with homework set or handed in"
      one: "the filter names a celse that has a hand-in"
      quiet: "the filter names a celse with no hand-in and no homework: it is drawn all the same, with an empty table"
  row:
    values: [none, draft, sent, changed]
    initial: none
    say:
      none: "the review column says \"Değerlendirilmedi\" and the button \"Değerlendir\""
      draft: "\"Gönderilmedi\" and \"Değerlendir\": files are attached, nothing is sent"
      sent: "\"Değerlendirildi\", who sent it and when, and the button \"Değerlendirmeyi aç\""
      changed: "\"Sonradan değişti\", who sent it and when, and \"Değerlendirmeyi aç\": the talebe changed the homework after the last send"
  files:
    values: [none, one, many]
    initial: none
    say:
      none: "the review holds no file: \"Henüz dosya eklenmedi...\""
      one: "the review holds one file"
      many: "the review holds two to five files (the graph does not count beyond two: a removal from many is drawn as leaving one)"
  note:
    values: [none, kept]
    initial: none
    say:
      none: "the review stores no note"
      kept: "the review stores a note, which the dialog shows when it opens"
  handNote:
    values: [none, written]
    initial: none
    say:
      none: "the talebe's hand-in has no note: the Not cell shows a dash"
      written: "the talebe's hand-in has a note"
  typed:
    values: [blank, words]
    initial: blank
    say:
      blank: "the dialog's \"Talebeye not\" is empty (or holds only spaces)"
      words: "the dialog's note holds text"
  pick:
    values: [none, chosen, missing]
    initial: none
    say:
      none: "no file is chosen in the upload panel"
      chosen: "a file is chosen: \"Seçilen dosya: <ad> · <boyut>\""
      missing: "\"Yükle\" was pressed with no file: \"Bir dosya seçin.\""
  fault:
    values: [none, noStorage, limit, wrongType, refused, failed]
    initial: none
    say:
      none: "the panel shows no failure"
      noStorage: "\"Dosya deposu henüz kurulmadı. Yöneticiye haber verin.\""
      limit: "\"Bir şeyler ters gitti. Biraz sonra yeniden deneyin.\" (the limit has no sentence of its own, NHWREV-4)"
      wrongType: "\"Bu dosya türü kabul edilmiyor...\""
      refused: "\"Bunu yapma izniniz yok.\""
      failed: "\"Bir şeyler ters gitti. Biraz sonra yeniden deneyin.\""
  toast:
    values: [none, sent, uploaded, fileForbidden, fileNotFound, fileUnavailable, fileFailed, saveEmpty, saveRefused, saveFailed]
    initial: none
    say:
      none: "no toast stands (a success closes after 6 seconds, an error stays until it is closed; the graph clears it at the next step)"
      sent: "\"Değerlendirme gönderildi\" and \"<talebe> adlı talebe değerlendirmenizi görecek.\""
      uploaded: "\"Dosya yüklendi\" and \"<dosya> değerlendirmeye eklendi.\""
      fileForbidden: "\"Dosya indirilemedi\" and \"Bu dosyayı indirme izniniz yok.\""
      fileNotFound: "\"Dosya indirilemedi\" and \"Bu dosya artık yok.\""
      fileUnavailable: "\"Dosya indirilemedi\" and \"Dosyalara şu an ulaşılamıyor. Biraz sonra yeniden deneyin.\""
      fileFailed: "\"Dosya indirilemedi\" and \"Bir sorun çıktı. Biraz sonra yeniden deneyin.\""
      saveEmpty: "\"Değerlendirme kaydedilemedi\" and \"Bir not yazın ya da en az bir dosya ekleyin.\""
      saveRefused: "\"Değerlendirme kaydedilemedi\" and \"Bunu yapma izniniz yok.\""
      saveFailed: "\"Değerlendirme kaydedilemedi\" and \"Bir şeyler ters gitti. Biraz sonra yeniden deneyin.\" (or the celse-gone and course-gone sentences)"

guards:
  hasFiles: "files != 'none'"
  nothingToSend: "typed == 'blank' and files == 'none'"
  sentBefore: "row == 'sent' or row == 'changed'"

effects:
  toastNone: { set: { toast: none } }
  toastSent: { set: { toast: sent } }
  toastUploaded: { set: { toast: uploaded } }
  toastFileForbidden: { set: { toast: fileForbidden } }
  toastFileNotFound: { set: { toast: fileNotFound } }
  toastFileUnavailable: { set: { toast: fileUnavailable } }
  toastFileFailed: { set: { toast: fileFailed } }
  toastSaveEmpty: { set: { toast: saveEmpty } }
  toastSaveRefused: { set: { toast: saveRefused } }
  toastSaveFailed: { set: { toast: saveFailed } }
  showAll: { set: { shown: all } }
  showOne: { set: { shown: one } }
  showQuiet: { set: { shown: quiet } }
  rowFresh: { set: { row: none, files: none, note: none, handNote: none, typed: blank } }
  rowDraft: { set: { row: draft, files: one, note: none, handNote: none, typed: blank } }
  rowSent: { set: { row: sent, files: one, note: none, handNote: none, typed: blank } }
  rowChanged: { set: { row: changed, files: one, note: kept, handNote: written, typed: blank } }
  rowToDraft: { set: { row: draft } }
  rowToSent: { set: { row: sent } }
  noteKept: { set: { note: kept } }
  noteNone: { set: { note: none } }
  typedWords: { set: { typed: words } }
  typedBlank: { set: { typed: blank } }
  filesNone: { set: { files: none } }
  filesOne: { set: { files: one } }
  filesMany: { set: { files: many } }
  pickNone: { set: { pick: none, fault: none } }
  pickChosen: { set: { pick: chosen, fault: none } }
  pickMissing: { set: { pick: missing } }
  faultNoStorage: { set: { fault: noStorage } }
  faultLimit: { set: { fault: limit } }
  faultWrongType: { set: { fault: wrongType } }
  faultRefused: { set: { fault: refused } }
  faultFailed: { set: { fault: failed } }

failures:
  opened:
    from: listCourseSubmissions
    forbidden: [AUTHZ_FORBIDDEN]
    missing: [COURSE_NOT_FOUND]
    failed: []
  reloading:
    from: listCourseSubmissions
    forbidden: [AUTHZ_FORBIDDEN]
    failed: []
  downloading:
    from: webDownloadCourseSubmissionFile
    signedOut: [unauthenticated]
    forbidden: [AUTHZ_FORBIDDEN]
    notFound: [NOT_FOUND, COURSE_NOT_FOUND, SUBMISSION_FILE_NOT_FOUND]
    unavailable: [TEDRISAT_UNREACHABLE, STORAGE_NOT_CONFIGURED, STORAGE_UNAVAILABLE]
    failed: []
  dialogHandInDownload:
    from: webDownloadCourseSubmissionFile
    signedOut: [unauthenticated]
    forbidden: [AUTHZ_FORBIDDEN]
    notFound: [NOT_FOUND, COURSE_NOT_FOUND, SUBMISSION_FILE_NOT_FOUND]
    unavailable: [TEDRISAT_UNREACHABLE, STORAGE_NOT_CONFIGURED, STORAGE_UNAVAILABLE]
    failed: []
  dialogReviewDownload:
    from: webDownloadCourseSubmissionReviewFile
    signedOut: [unauthenticated]
    forbidden: [AUTHZ_FORBIDDEN]
    notFound: [NOT_FOUND, COURSE_NOT_FOUND, SUBMISSION_FILE_NOT_FOUND]
    unavailable: [TEDRISAT_UNREACHABLE, STORAGE_NOT_CONFIGURED, STORAGE_UNAVAILABLE]
    failed: []
  uploading:
    from: webAddSubmissionReviewFile
    signedOut: [unauthenticated]
    noStorage: [STORAGE_NOT_CONFIGURED, STORAGE_UNAVAILABLE, TEDRISAT_UNREACHABLE]
    limit: [SUBMISSION_REVIEW_FILE_LIMIT]
    wrongType: [FILE_TYPE_NOT_ALLOWED]
    refused: [AUTHZ_FORBIDDEN]
    failed: [SUBMISSION_NOT_FOUND, HTTP_400, NOT_FOUND]
  removing:
    from: deleteSubmissionReviewFile
    gone: [SUBMISSION_FILE_NOT_FOUND]
    refused: [AUTHZ_FORBIDDEN]
    failed: [SUBMISSION_NOT_FOUND, COURSE_NOT_FOUND, HTTP_400]
  sending:
    from: sendSubmissionReview
    empty: [SUBMISSION_REVIEW_EMPTY]
    refused: [AUTHZ_FORBIDDEN]
    failed: [SUBMISSION_NOT_FOUND, LESSON_NOT_FOUND, COURSE_NOT_FOUND, VALIDATION_ERROR, HTTP_400]

# The story the page tells first: the müderris opens a hand-in nobody has reviewed, writes a note and sends it.
main:
  given: { handedIn: true, access: granted, before: fresh, answer: saved, upload: noStorage, download: unavailable }
  events: [DONE, OPEN_REVIEW, TYPE_NOTE, SEND, DONE]

initial: opened

states:
  opened:
    title: Ödevler is read
    description: >-
      The page reads the course, the person's permissions and GET /courses/:id/submissions on the server (the hand-ins of the course's live celses with
      their files and review, plus each celse's "homework set" flag, its hand-in count and the number of enrolled talebe) and draws behind loading.tsx's
      skeleton. Nothing is on the screen of this step. A holder of submission.read gets the page (the alert "Henüz ödev yok" when no celse has homework
      and nobody handed in); a reader without it gets the refusal (state forbidden); a 404 is Next's not-found page; any other failure draws the retry
      state "Ödevler okunamadı" (state loadFailed). The review column of each row is the stored review as the API answered it.
    invoke: { action: listCourseSubmissions }
    on:
      DONE:
        - { guard: "access == 'granted' and handedIn == false", target: empty, source: "apps/nazar/features/homework/components/homework-list.tsx:77" }
        - { guard: "access == 'granted' and before == 'fresh'", target: listed, effect: [rowFresh], source: "apps/nazar/features/homework/components/homework-page.tsx:73" }
        - { guard: "access == 'granted' and before == 'draft'", target: listed, effect: [rowDraft], source: "apps/nazar/features/homework/components/homework-page.tsx:73" }
        - { guard: "access == 'granted' and before == 'sent'", target: listed, effect: [rowSent], source: "apps/nazar/features/homework/components/homework-page.tsx:73" }
        - { guard: "access == 'granted'", target: listed, effect: [rowChanged], source: "apps/nazar/features/homework/components/homework-page.tsx:73" }
      FAIL.forbidden: { guard: "access == 'refused'", target: forbidden, source: "apps/nazar/features/homework/components/homework-page.tsx:44" }
      FAIL.missing: not_found
      FAIL.failed: loadFailed
    source: apps/nazar/features/homework/components/homework-page.tsx:33

  forbidden:
    title: The page refuses the reader
    by: human
    description: >-
      The header stays and an alert "Bu sayfaya izniniz yok" stands under it. The course menu left Ödevler out for this person, so only an address
      (or an old link) gets here; the API says the same (403). FileErrorNotice is mounted above it, so a ?fileError= that comes back here is worded.
    on:
      NAVIGATE: { target: left, say: "they follow a link or the menu" }
    source: apps/nazar/features/shell/components/page-problem.tsx:23

  loadFailed:
    title: Ödevler could not be read
    by: human
    description: >-
      Any read that fails and is neither a refusal nor a 404 draws "Ödevler okunamadı" with a retry button, a SystemState whose own h1 stands under the
      page's h1 (F-D1-01). "Yeniden dene" asks the server again.
    on:
      RETRY: { target: opened, say: "router.refresh()" }
      NAVIGATE: { target: left, say: "they follow a link or the menu" }
    source: apps/nazar/features/shell/components/load-failed.tsx:33

  empty:
    title: Nothing is handed in and no homework is set
    by: human
    description: >-
      The page says "Henüz ödev yok" in an info alert (a status) that explains where homework is set and where hand-ins appear. There is no filter and
      no table.
    on:
      NAVIGATE: { target: left, say: "they follow a link or the menu" }
    source: apps/nazar/features/homework/components/homework-list.tsx:77

  listed:
    title: Every celse with homework or hand-ins is listed
    by: human
    goal: true
    description: >-
      The header with the course's name, the filter "Celse" (a button, role combobox), one line with "{n} ödev · {m} celse · Saatler dersin saat
      dilimiyle ({zone})", and a section per celse in programme order: its heading, "Ödev verildi", "{n} / {m} teslim", an amber "{n} ödev değerlendirme
      bekliyor" while a row is not reviewed, and a table of the talebe's hand-ins (latest change first): the name, the files as links, the time of the last
      change, the note or a dash, and the review column. The review column holds a badge (none, draft, sent, changed), "{reviewer} · {time}" after a send,
      and the button "Değerlendir" or "Değerlendirmeyi aç". A celse with homework and no hand-in shows "Bu celseye henüz ödev teslim edilmedi." Findings read
      here: F-D1-04 (the filter and the counts are plain paragraphs and a button, no live region, and the counts line does not follow the filter),
      F-D1-09 (the button's name is the same sentence for both words), F-D1-31 (a dash inside aria-hidden). A toast of the last step may stand.
    on:
      OPEN_FILTER: { target: choosing, effect: [toastNone], source: "apps/nazar/features/homework/components/homework-list.tsx:172" }
      DOWNLOAD: { target: downloading, effect: [toastNone], source: "apps/nazar/features/files/components/file-link.tsx:34", say: "they follow the link of a file a talebe handed in" }
      OPEN_REVIEW:
