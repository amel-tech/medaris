  downloading:
    title: A hand-in's file is asked for
    by: human
    description: >-
      The link is a plain anchor with no download attribute, to /api/files/courses/<id>/submissions/<fileId>, followed as a page. The route reads the
      session's token on the server and streams tedrisat's GET /courses/:id/submissions/files/:fileId, which writes the download to the audit log before it
      sends a byte. A file that is served is an attachment: the browser saves it and the page stays. A refusal is a 303 back to this page with
      ?fileError=<forbidden|notFound|unavailable|failed> (a session that ended goes to sign-in): the whole page loads again, the filter is back to "Bütün
      celseler" and one error toast stands until it is closed. The local stack has no store, so it answers 503 and the reason is "unavailable". Nothing is
      on the screen of this step. The same step, from a table, belongs to nazar.files.download.
    invoke: { action: webDownloadCourseSubmissionFile }
    on:
      DONE: { guard: "download == 'served'", target: back, source: "libs/services/src/file-proxy/file-proxy.ts:373", say: "the file is saved by the browser; the page does not change" }
      FAIL.signedOut: sent_to_sign_in
      FAIL.forbidden: { guard: "download == 'forbidden'", target: reloading, effect: [showAll, toastFileForbidden], source: "libs/services/src/file-proxy/file-proxy.ts:351" }
      FAIL.notFound: { guard: "download == 'notFound'", target: reloading, effect: [showAll, toastFileNotFound], source: "libs/services/src/file-proxy/file-proxy.ts:351" }
      FAIL.unavailable: { guard: "download == 'unavailable'", target: reloading, effect: [showAll, toastFileUnavailable], source: "libs/services/src/file-proxy/file-proxy.ts:351" }
      FAIL.failed: { guard: "download == 'failed'", target: reloading, effect: [showAll, toastFileFailed], source: "libs/services/src/file-proxy/file-proxy.ts:351" }
    source: apps/nazar/app/api/files/courses/[courseId]/submissions/[fileId]/route.ts:12

  reloading:
    title: The page is read again
    description: >-
      A refused download loads the whole page again: the same read as the first, the filter reset, the dialog and what was typed in it gone, the focus at
      the top, and FileErrorNotice raises the toast of ?fileError= and takes the parameter off the address (NHWREV-1). Nothing is on the screen of this
      step.
    invoke: { action: listCourseSubmissions }
    on:
      DONE: { target: listed, source: "apps/nazar/features/files/components/file-error-notice.tsx:19" }
      FAIL.forbidden: { target: forbidden, source: "apps/nazar/features/homework/components/homework-page.tsx:44", say: "the permission was taken away meanwhile: the refusal, and the toast is raised there too" }
      FAIL.failed: loadFailed
    source: apps/nazar/features/homework/components/homework-page.tsx:33

  reviewing:
    title: The review dialog is open
    by: human
    description: >-
      A form dialog over the page (the scrim does not close it): the celse's heading as its eyebrow, the title "{talebe} — ödev değerlendirmesi", "Teslim
      edilen" (the talebe's files as links and their note, or "Dosya yok"), the field "Talebeye not" (up to 4000 characters, a textarea of five rows), "Düzeltilmiş
      dosyalar" (the review's files, each a link and a trash button, or "Henüz dosya eklenmedi..."), "Dosya yükle", and a footer with a line, "Kapat" and the submit
      ("Değerlendirmeyi gönder", or "Yeniden gönder" after a send). The line says "Göndermeden talebe hiçbir şey görmez. Gönderince talebeye bildirim gider." before
      a send and "Gönderildi: talebe notu ve dosyaları görüyor. Yeniden gönderirseniz not değişir ve talebeye yeniden haber verilir." after one. The note starts as the
      stored one. No initialFocus is passed, so Base UI focuses the first tabbable, the header's close button (not verified). Two controls are named "Kapat" (NHWREV-5).
      What is typed is kept only in the dialog: closing it throws it away (NHWREV-6). A file added or removed is saved at once; on a review already sent the talebe
      sees the change at once (NHWREV-2). Findings read here: F-D1-09, F-D1-10, NHWREV-1 to NHWREV-7. A toast of the last step (an error) may stand over it.
    on:
      TYPE_NOTE: { target: reviewing, effect: [typedWords, toastNone], source: "apps/nazar/features/homework/components/review-dialog.tsx:271" }
      CLEAR_NOTE: { guard: "typed == 'words'", target: reviewing, effect: [typedBlank], source: "apps/nazar/features/homework/components/review-dialog.tsx:271" }
      SEND:
        - { guard: nothingToSend, target: reviewingEmpty, source: "apps/nazar/features/homework/components/review-dialog.tsx:156", say: "no note and no file: the page asks nothing of tedrisat" }
        - { target: sending, effect: [toastNone], source: "apps/nazar/features/homework/components/review-dialog.tsx:160" }
      OPEN_PANEL: { target: uploadPanel, effect: [pickNone, toastNone], source: "apps/nazar/features/files/components/file-upload.tsx:157", say: "\"Dosya yükle\" unmounts itself and opens the panel; the focus is not moved (F-D1-10, F-C-course-a-14)" }
      REMOVE_FILE: { guard: hasFiles, target: removing, effect: [toastNone], source: "apps/nazar/features/homework/components/review-dialog.tsx:304" }
      DOWNLOAD_HAND_IN: { target: dialogHandInDownload, effect: [toastNone], source: "apps/nazar/features/homework/components/review-dialog.tsx:234", say: "they follow the link of the talebe's file in the dialog" }
      DOWNLOAD_REVIEW_FILE: { guard: hasFiles, target: dialogReviewDownload, effect: [toastNone], source: "apps/nazar/features/homework/components/review-dialog.tsx:292", say: "they follow the link of a file of the review" }
      CLOSE:
        - { guard: "shown == 'one'", target: filtered, source: "libs/ui/src/mds/dialog.tsx:97", say: "the header's X; what was typed is gone (NHWREV-6)" }
        - { target: listed, source: "libs/ui/src/mds/dialog.tsx:97" }
      CANCEL:
        - { guard: "shown == 'one'", target: filtered, source: "apps/nazar/features/homework/components/review-dialog.tsx:216", say: "the footer's \"Kapat\"" }
        - { target: listed, source: "apps/nazar/features/homework/components/review-dialog.tsx:216" }
      DISMISS:
        - { guard: "shown == 'one'", target: filtered, source: "apps/nazar/features/homework/components/review-dialog.tsx:202", say: "Esc" }
        - { target: listed, source: "apps/nazar/features/homework/components/review-dialog.tsx:202" }
    source: apps/nazar/features/homework/components/review-dialog.tsx:199

  reviewingEmpty:
    title: The review has neither a note nor a file
    by: human
    description: >-
      Pressing the submit with no note and no file sets an error under the note field and sends nothing: "Bir not yazın ya da en az bir dosya ekleyin." It
      replaces the field's help line, is a Field.Error with no role=alert, and the focus stays on the submit (F-D1-10). Typing clears it.
    on:
