# The screens of nazar.homework.review: Ödevler of a course (/ders/<id>/odevler), its celse filter, the table of each celse with its review column, the review
# dialog (the talebe's hand-in, the note, the files returned, the upload panel), and the toasts, the refusal, the empty alert and the retry state. Read from
# apps/nazar/features/homework, apps/nazar/features/files and libs/ui/src/mds; every message is copied from libs/i18n/src/locales/tr/nazar.json by a script
# (it fails on a missing key and compares each value). Five messages are not in that file and are built in code, as composed.*: the counts line (two messages
# joined by " · ", homework-list.tsx:178-180), the time of a hand-in's last change (changedLabel, homework.ts:226), the talebe's note, the dash of a row with
# no note (homework-list.tsx:75) and the busy word of a button (Button's default loadingLabel, libs/ui/src/mds/button.tsx:61).
# `changes` is the app's own sentence of the dialog's footer (review-dialog.tsx:211): no message of ours was needed.
# Where a node says "repeat", the page draws it once per celse; the replay finds the sections and tables through the binding. The table has one row in the
# walk's world, so the row's cells are single nodes.
schema: delurio-graph/0
kind: ui
id: nazar.homework.review
flow: nazar.homework.review
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Homework.review.notSentNote }
samples:
  name: Esma Başvuran
  week: "1"
  title: Celse 1
  session: Hafta 1 · Celse 1
  count: "1"
  total: "1"
  submissions: "1"
  sessions: "1"
  zone: İstanbul
  when: 16 Kas 2026 21:05
  note: Fiil çekimlerini yazdım; bir satırdan emin değilim.
  size: 20 KB

# The page keeps no focus of its own on load (nothing in features/homework sets it) and none after a filter or a send (the focus stays where it was, or is
# lost with the unmounted node: F-D1-10), so there is no `initialFocus` on the page and no `focus` here. The dialog passes no initialFocus either: Base UI's
# own rule gives the first tabbable, the header's close button (not verified in a browser), which is drawn below. The dialog hands the focus back to the
# row's button when it closes (Base UI; not verified).
