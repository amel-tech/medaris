  pickMissingText: { type: text, component: Text, text: { key: Files.problems.missing }, in: [uploadPanel, removing, sending, dialogHandInDownload, dialogReviewDownload], when: "(pick == 'missing') and panel == 'open'", source: apps/nazar/features/files/components/file-upload.tsx:193 } # a Field.Error: not announced (F-D1-10)
  chosenLine: { type: text, component: Text, text: { key: Files.chosen, params: { name: file.name, size: file.size } }, in: [uploadPanel, uploading, removing, sending, dialogHandInDownload, dialogReviewDownload], when: "(pick == 'chosen') and panel == 'open'", source: apps/nazar/features/files/components/file-upload.tsx:203 }
  uploadingOutput: { type: status, component: Status, role: status, text: { key: Files.uploading }, in: [uploading], source: apps/nazar/features/files/components/file-upload.tsx:241 } # an <output>
  alertNoStorage: { type: alert, component: Alert, role: alert, name: { key: Files.failed }, text: { key: Files.errors.notConfigured }, in: [uploadPanel, removing, sending, dialogHandInDownload, dialogReviewDownload], when: "(fault == 'noStorage') and panel == 'open'", source: apps/nazar/features/files/components/file-upload.tsx:246 } # role alert, so it is announced; the local stack's answer
  alertType: { type: alert, component: Alert, role: alert, name: { key: Files.failed }, text: { key: Files.errors.type }, in: [uploadPanel, removing, sending, dialogHandInDownload, dialogReviewDownload], when: "(fault == 'wrongType') and panel == 'open'", source: apps/nazar/features/files/components/file-upload.tsx:246 }
