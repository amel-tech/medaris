  countsLine: { type: text, component: Text, text: { key: composed.Homework.countsLine, params: { submissions: counts.submissions, sessions: counts.sessions, zone: course.zone } }, in: [listed, filtered, filteredQuiet], source: apps/nazar/features/homework/components/homework-list.tsx:178 } # a plain <p data-testid=homework-counts>; counted over every celse, not the filtered ones (F-D1-04)
