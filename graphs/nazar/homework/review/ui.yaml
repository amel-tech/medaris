  sessionEmpty: { type: text, component: Text, text: { key: Homework.sessionEmpty }, in: [listed, filteredQuiet], source: apps/nazar/features/homework/components/homework-list.tsx:252 } # the one line of a table with no row: a celse with homework set and nothing handed in, or a chosen quiet celse

