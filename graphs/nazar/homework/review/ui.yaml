rules:
  - { id: F-D1-04, rule: "Choosing a celse swaps the sections with no announcement, and the line 'N ödev · M celse' is counted over every celse, so it neither changes nor is a live region; the empty table's line is only a cell. Fix: role=status on a line that follows the filter (homework-list.tsx:172-181)." }
  - { id: F-D1-09, rule: "The row's button is named 'Homework.review.openFor' ('{name} adlı talebenin ödevini değerlendir') for both of its words; for a sent or changed review its visible 'Değerlendirmeyi aç' is not in that name (WCAG 2.5.3, voice control). Fix: a second label key for the edit variant (review-dialog.tsx:83-96)." }
  - { id: F-D1-10, rule: "Removing a review file unmounts the focused trash button and nothing moves the focus or says the file went (no toast, no live region); 'Dosya yükle' unmounts itself and the panel's file field is not focused, 'Vazgeç' returns no focus; the 'empty' line is a Field.Error with no role=alert and the focus stays on the submit. Fix: focus the next trash button or the upload button, the file field on open, role=alert on the error (review-dialog.tsx:176-197, 253-262; file-upload.tsx:85-92, 147-168)." }
  - { id: F-D1-31, rule: "A row with no note draws a dash inside aria-hidden, so the Not cell is empty to a screen reader. Fix: an sr-only 'Not yok' (homework-list.tsx:75, 150)." }
  - { id: F-D1-01, rule: "The retry state is a SystemState with its own h1 under the page's h1 'Ödevler': two page titles for heading navigation (load-failed.tsx:28-43)." }
  - { id: F-D1-20, rule: "No try/catch around sendSubmissionReview inside the transition (review-dialog.tsx:160-161): when the browser cannot reach Next the rejection escapes the callback, the submit's busy state is not reset and the page may reach app/error.tsx. The removal has a finally (so it resets) and no catch (the rejection is unhandled). Not verified in a browser; Sorular and Değerlendirme do catch." }
  - { id: F-C-course-a-14, rule: "The upload panel unmounts its opener and moves no focus in, out or after a send; shared with nazar.curriculum.resources (file-upload.tsx:147-168)." }
  - { id: NHWREV-1, rule: "A refused download from either link of the dialog is a 303 to the page with ?fileError=: the whole page loads again, the dialog closes, the note typed in it is lost, the filter is back to 'Bütün celseler', the focus is at the top, and a toast that stays says why. On this stack every download answers 503, so every press of a file link in the dialog does it. The same as WRT-10 of tedris and NFILES-2 of nazar.files.download. Fix: fetch the file and word the refusal without leaving the page (libs/services file-proxy.ts:351-370)." }
  - { id: NHWREV-2, rule: "A file added to a review that was already sent, or removed from one, is the talebe's at once: tedrisat shows a sent review's files as they are (lesson-submission.service.ts:72-73; the controller says 'a review already sent shows it to the talebe at once'). The dialog's footer says only that sending again changes the note ('Yeniden gönderirseniz not değişir...'), and the panel says 'talebe onu değerlendirmeyi gönderince görür'. Fix: say it, or hold file changes until 'Yeniden gönder'." }
  - { id: NHWREV-3, rule: "A sent review can be emptied: removing the last file of a review that has no note leaves 'Değerlendirildi' over a review with nothing in it (tedrisat's removeReviewFile checks nothing, lesson-submission.service.ts:378-396, and the page asks nothing); the talebe then reads a block with a heading, a badge and a by-line (HWREVIEW-1 of tedris.learn.homeworkReview). The dialog would then refuse to send it again (the empty line). Fix: refuse a removal that leaves neither note nor file, or ask." }
  - { id: NHWREV-4, rule: "The sixth file of a review is 409 SUBMISSION_REVIEW_FILE_LIMIT and the panel's alert says 'Bir şeyler ters gitti. Biraz sonra yeniden deneyin.' (fileErrorKey has no case for it, files.ts:116-148); the sentence made for it, 'Bir değerlendirmeye en çok 5 dosya eklenir; yenisi için birini kaldırın.' (Homework.review.fileLimit), is in the branch of a send or a removal, which tedrisat never answers with that code (review-dialog.tsx:147). 'Dosya yükle' stays enabled at five files. Fix: word the code in fileErrorKey and close the button at five." }
  - { id: NHWREV-5, rule: "While a send, an upload or a removal runs, 'Kapat', the header's X and Esc do nothing (onOpenChange ignores a close while busy, review-dialog.tsx:202-204) and stay drawn as usable, and nothing says why: the same shape as BANDEC-1. Two controls carry the name 'Kapat' (the header's X and the footer's), which a screen reader lists twice. Fix: disable them while busy; name the X 'Pencereyi kapat'." }
  - { id: NHWREV-6, rule: "Closing the dialog (Kapat, the X, Esc) throws a typed note away with no question and no draft; only the files are stored at once. The note exists in the dialog's state alone (review-dialog.tsx:129). Fix: keep it as a draft on the review, or ask once when it differs from the stored one." }
  - { id: NHWREV-7, rule: "After the last file of a review that was never sent is removed, the row keeps the badge 'Gönderilmedi' over an empty review until the page is read again (the page keeps the review object with no file, reviewStatus() says 'draft' for it, review-dialog.tsx:185-193, homework.ts:44-46); tedrisat would answer no review at all, 'Değerlendirilmedi'. Fix: drop the review object when it holds no file and was not sent." }
  - { id: label-in-name, rule: "The other controls hold: 'Değerlendirmeyi gönder', 'Yeniden gönder', 'Dosya yükle', 'Yükle', 'Vazgeç' carry their visible text as their name, and a file link's name '{name} dosyasını indir' contains the file's name (WCAG 2.5.3)." }
  - { id: focus-not-set, rule: "The page sets no focus of its own, and the dialog passes no initialFocus: Base UI focuses the first tabbable, the header's close button, not the note field. Not verified in a browser." }
