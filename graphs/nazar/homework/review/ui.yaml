  hwSubtitle: { type: text, component: Text, text: { key: Homework.subtitle, params: { name: course.title } }, in: [listed, filtered, filteredQuiet, empty, forbidden, loadFailed], source: apps/nazar/features/homework/components/homework-page.tsx:60 } # drawn when the course read gave a name

