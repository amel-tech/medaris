  sessionHeading: { type: text, component: Heading, role: heading, text: { key: Homework.sessionHeading, params: { week: session.week, title: session.title } }, repeat: sessions, in: [listed, filtered, filteredQuiet], source: apps/nazar/features/homework/components/homework-list.tsx:195 } # h2
