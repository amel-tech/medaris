# The screens of nazar.bans.review: Yasaklamalar of a medrese (/medrese/<id>/yasaklamalar) in nazar-web, in both tabs, with its empty and
# narrowed-to-nothing lines and its refused and unreadable pages. Read from apps/nazar/features/bans (bans-page.tsx, bans-table.tsx,
# bans.ts), libs/ui/src/mds (tabs, table, select, badge, alert, empty-state, system-state) and the shell's page-problem.tsx and
# load-failed.tsx. The words are copied from libs/i18n/src/locales/tr/nazar.json by key (the path inside that file).
#
# The `composed.Bans.*` keys are NOT in any i18n file: they are the cells the page builds from what the API gives, written with their
# placeholders so that a replay can match them (a placeholder with no sample matches any text):
#   composed.Bans.activeCount / liftedCount  the tab's number, a <span class=mds-tab__count> (libs/ui/src/mds/tabs.tsx:67), `Intl.NumberFormat`
#   composed.Bans.person                     the name, else the e-mail, else "Adı bilinmiyor" (bans.ts:201), in <bdi> (bans-table.tsx:124)
#   composed.Bans.course                     the course's title under "Ders", a <bdi> (bans-table.tsx:143; bans.ts:223)
#   composed.Bans.reason                     the reason, as typed by the banner (bans-table.tsx:154)
#   composed.Bans.bannedBy                   the placer's name, else e-mail (bans.ts:202; bans-table.tsx:162)
#   composed.Bans.when / liftedWhen          "Bugün 14:30", "Dün 09:10" or "28 Eyl 16:10", the viewer's clock (archive.ts:113, bans.ts:180)
#   composed.Bans.liftedBy / liftReason      who lifted and why (bans-table.tsx:217-223)
# Samples are invented and neutral.
