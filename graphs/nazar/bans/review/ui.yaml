rules:
  - { id: focus-not-set, rule: "No code of features/bans sets the focus when the page opens, after a tab (a plain <a>: a full page load, so the focus is at the top of the document), after a choice in the scope filter (it stays on the trigger) or after the search narrows the rows. Nothing is drawn as `initialFocus` or `focus`." }
  - { id: F-B-4, rule: "The tab counts are the medrese's whole whatever the scope or the search leaves, and nothing says so; typing a name or choosing a scope changes the rows with no announcement (`aria-busy` on the wrapper, bans-table.tsx:233, is not spoken, and the table is no live region). 'Etkin 4' can sit over one row or over 'Bu süzgece uyan yasak yok.' Fix: a status line that says '{n} yasak' after each narrowing and what the count counts." }
  - { id: F-B-13, rule: "A refused reader meets the page's own title and h1 'Yasaklamalar' and, under them, a polite status line 'Bu sayfaya izniniz yok' whose title is a <p>, not a heading, with no link out (page-problem.tsx:23-29). Fix: render the refusal as a heading with a link back to the medrese's first allowed page, and give it its own <title>." }
  - { id: ban-staff-check-gaps, rule: "SECURITY, from the code, not run. The domain invariant ban-staff-cannot-be-barred (nobody who runs the course or the medrese can be barred from it, on any route that places a ban) does not hold. (1) The two create routes check it (ban.service.ts:152-163 and :483-490), but escalate (ban.service.ts:515-557) and extend (:270-317) read no role and no self id, so the widening of a ban onto someone who has since taken a post is accepted. (2) This page offers the button: viewerMayEscalate (ban.service.ts:702-706) is an open COURSE ban, the caller may bar from the medrese and the person holds no medrese ban; it never asks who the person is now. (3) The appointments that guard against it refuse a barred ders nazır (COURSE_NAZIR_BARRED) and a barred medrese nazır (MADRASAH_NAZIR_BARRED) but, as far as a search of apps/tedrisat found, nothing checks a ban when a müderris is seated, so a person can become a müderris of a course after being barred from it and then be widened to the whole medrese. (4) rolesHeld reads only role_assignments (ban.repository.ts:273-292) while SYSTEM_ADMIN is a realm role, so the başnazım can be barred from a course through the create routes, and his row would show in this list as any other. What a ban does to someone who runs the course (what they can still do as a hoca) was not traced. binding.staffRow.yaml makes Ömer a müderris and holds that his row still offers the widen button. Fix: one check (the target's roles in the course or the medrese and the caller's own id) before every ban is written, in a helper the four routes call, and `viewerMayEscalate` false for such a person." }
  - { id: BANS-1, rule: "New. The notice 'Yasağı, koyan kademe ya da üstü kaldırır' says the reader cannot lift a köşk nazımı's or Medaris's ban (Bans.kademe.text) whoever the reader is. The başnazım, who may open the page by its address, can lift every ban here (viewerMayLift is true for his tier) and is told he cannot. Product wording; the notice could follow the reader's tier or say what the buttons already say per row." }
  - { id: BANS-2, rule: "New. GET /madrasahs/:id/bans sends every ban of the medrese, open or lifted, with no limit and no page (ban.repository.ts:682-703; the controller takes no limit), and the page filters by name on the rows it has. A medrese with thousands of bans sends them all on every tab and every scope change. Fix: a page size and a server-side search." }
  - { id: BANS-3, rule: "New. The scope filter shows `ALL` ('Bütün kapsamlar') whenever the address's course is not among the options (bans-table.tsx:91-95), but the list is still asked for that course (bans.ts:68-81), so an address with `?kapsam=<a course the medrese does not list, or the course read failed>` shows 'Bütün kapsamlar' over a list narrowed to nothing, and 'Süzgeçleri temizle' is the only way out. Fix: keep the unknown value as a choice, or ignore it in the request too." }
  - { id: BANS-4, rule: "New. The unreadable page draws the shell's SystemState with its default heading level 1 (load-failed.tsx:28-30 passes none), so the page has two h1: 'Yasaklamalar' and 'Yasaklar okunamadı'. The same component is used by every page that reads through PageProblem. Fix: pass headingLevel 2 when `shell` is set." }
  - { id: label-in-name, rule: "A row button's visible text is contained in its accessible name: 'Yasağı kaldır' in 'Yasağı kaldır: {name}', 'Medreseden de yasakla' in 'Medreseden de yasakla: {name}', 'Kalıcı yasak talebi aç' in 'Kalıcı yasak talebi aç: {name}' (WCAG 2.5.3). Holds. The tab link's name is its text then its count, 'Etkin 4'." }
  - { id: actions-absent-not-disabled, rule: "An action the API says the caller may not take is not drawn (absent, not disabled), and a ban that cannot be lifted says why in a sentence; a lifted ban draws nothing. The 'Yeni' badge and the pending-request badge are text, not colour alone." }
  - { id: sorted-by-date, rule: "The Etkin table is marked `aria-sort=descending` on 'Tarih' (the API sends newest first); the Kaldırılan table is not marked, and the API sorts it by the lift time, while the column shows the day the ban was placed (bans-table.tsx:302, ban.repository.ts:700)." }
