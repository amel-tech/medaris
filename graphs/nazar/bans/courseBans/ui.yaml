# The screens of nazar.bans.courseBans: Yasaklamalar of one course (/ders/<id>/yasaklamalar) with its header "Yasakla", its two tabs and the
# table of the course's bans, the "Yasakla" dialog, the reason dialog in its three kinds (lift, widen to the medrese, ask for a permanent
# ban), the toasts of a write and the page a caller who cannot read the list is given. Read from apps/nazar/features/bans/components
# (course-bans-page.tsx, course-ban-dialog.tsx, bans-table.tsx, reason-dialog.tsx), bans.ts and actions.ts, libs/ui/src/mds (tabs, dialog,
# button, table) and the shell's page-problem.tsx. The words are copied from libs/i18n/src/locales/tr/nazar.json by key (the path inside
# that file) by <scratchpad>/bancourse-probe/catalog.mjs, letter for letter.
#
# Authored, not copied: `Changes.note`, the one message of this catalog no app message stands for (nothing in the app says what placing,
# lifting or widening a ban changes).
# Composed in code, in no i18n file (each named by its line):
#   composed.Bans.count        tabs.tsx:29-36 and :67 (the count, formatted by Intl, in a <span> inside the tab link)
#   composed.Bans.person       bans.ts:201 (the name, else the e-mail, else "Adı bilinmiyor"), in <bdi> (bans-table.tsx:124)
#   composed.Bans.reason       the reason, as typed by the banner (bans-table.tsx:154)
#   composed.Bans.bannedBy     the placer's name, else e-mail (bans.ts:202; bans-table.tsx:162)
#   composed.Bans.when         "Bugün 14:30", "Dün 09:10" or a date, the viewer's clock (archive.ts whenLabel, bans.ts:180; bans-table.tsx:174)
#   composed.Bans.liftedBy / liftedWhen / liftReason   who lifted, when and why (bans-table.tsx:217-223)
#   composed.Course.title      the course's title: under "Ders" in the row (bans.ts:223; bans-table.tsx:143) and over the dialogs' titles
#                              (course-ban-dialog.tsx:95, bans-table.tsx:310)
#   composed.Button.loading    libs/ui/src/mds/button.tsx:62 (the default loadingLabel of a busy Button, F-D2c-13)
#   composed.Reasons.person / email   reason-dialog.tsx:128 and :131 (the person's name and address)
#   composed.Reasons.summary*  bans.ts:253-257 (the three values of the summary list: scope, who and when, the reason)
# Where a node says "repeat", the page draws it once per row; the replay finds the rows through the binding. The page behind a dialog is
# inert, so no page node is `in` a dialog state. The table's column headers and the fieldset around the search box are not drawn; the
# rows are as nazar.bans.review draws them, with only COURSE rows of this course.
schema: delurio-graph/0
kind: ui
id: nazar.bans.courseBans
flow: nazar.bans.courseBans
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  name: Betül Başvuran
  person: Betül Başvuran
  email: betul.basvuran@example.test
  course: Mantık Dersi
  count: "1"
  reason: Celselerde ders dışı reklam yaptı
  placer: Nuri Medrese Başmüderrisi
  role: Medrese başmüderrisi
  when: Bugün 14:30
  liftedBy: Nuri Medrese Başmüderrisi
  liftedWhen: Bugün 15:10
  liftReason: Süre doldu; söz verdi
  label: Ders
  detail: Mantık Dersi

