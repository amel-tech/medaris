  liftHelp: { type: text, component: Text, text: { key: Reasons.lift.help }, in: [reasonForm, reasonReady, lifting, escalating, requesting], when: "kind == 'lift' and not (state == 'reasonForm' and touched and not typed)", source: apps/nazar/features/bans/components/reason-dialog.tsx:163 }
