rules:
  - { id: F-D2c-3, rule: "ACCESS (CONFIRMED against the running API, 15 Nov 2026, not in a browser). The page has no gate of its own (course-bans-page.tsx:53-60, :98, :113), and both list reads ask a code the course's team does not hold: GET /madrasahs/:id/bans asks madrasah.ban or platform.ban_scoped (apps/tedrisat/src/ban/madrasah-ban.controller.ts:71-74) and GET /kosks/:koskId/bans asks ban.manage_kosk, platform.ban_scoped or platform.ban_account (ban.service.ts:198-204, ban-codes.ts:61-65). A müderris holds only the course-scoped codes (libs/common/src/authz/permissions.ts:360: codesWith(COURSE)), so he is answered 403 (AUTHZ_FORBIDDEN on the medrese's list, BAN_FORBIDDEN on the köşk's; both seen at the API as the stack's müderris, whose roster read answered 200) and meets 'Bu sayfaya izniniz yok' with no 'Yasakla' (the state forbidden). The stack's ders nazırı, who holds enrollment.decide, course.view_unpublished and session.manage, was answered 403 on the medrese's list too; a ders nazırı given ban.course and ban.lift_course meets the same guard (madrasah.ban or platform.ban_scoped), from the code, and binding.dersNazir.yaml walks it. The same müderris may place a ban through the API (POST /courses/:courseId/bans takes ban.course, ban.service.ts:142), which the page cannot reach for him, and the permission's own sentence promises it: 'Talebeyi dersten yasakla (dersin yasak listesini görmeyi kapsar)' (nazar.json Account.permissions.ban_course). The page serves the medrese's başmüderris, a nazır given madrasah.ban and the başnazım. The alert tells the refused hoca to ask the başmüderris. Fix: read the course's bans through a route of the course gated by ban.course or ban.lift_course, or hide the menu entry (F-D2c-2) and say who can use the page." }
  - { id: ban-staff-check-gaps, rule: "SECURITY (read from the code, not run; this page's own screen exposes it). The row's 'Medreseden de yasakla' calls escalateBan (apps/tedrisat/src/ban/ban.service.ts:515-553), which checks only the caller's standing at the medrese (madrasah.ban or platform.ban_scoped, :528-538) and creates a MADRASAH ban for ban.userId (:539-550). It never calls rolesHeld and never compares the person with the caller, where the two routes that place a ban do (createBan :152-163 for the course route this page's own 'Yasakla' uses, createInMadrasah :483-491). viewerMayEscalate (:702-706) is an open COURSE ban, a caller who may bar from the medrese and no open medrese ban on the person; it never asks who the person is now, so the button is drawn on a row whose person has since been named hoca, başmüderris, nazır or nazım. The same holds for extendBan (:270-312, the köşk's widening, which nizam's page reaches and this page does not). And naming a hoca (apps/tedrisat/src/course/course.service.ts:1120-1128, assertMuderrisLinks, the hoca's route: duplicates and unknown accounts only) or a başmüderris, köşk nazım or Medaris nazım looks at no open ban: only apps/tedrisat/src/madrasah/nazir/madrasah-nazir.service.ts:115 and apps/tedrisat/src/course/nazir/course-nazir.service.ts:223 refuse a barred person, for a medrese nazır and a ders nazırı. Beside it, rolesHeld reads role_assignments only (apps/tedrisat/src/ban/ban.repository.ts:273-290), so the başnazım, a realm role, can be barred from a course through this page's own 'Yasakla' (if he is on a roster). The graph draws the widening as the code does it (the row offers it, the API accepts it, the toast says the person can no longer reach any course of the medrese), and nazar.bans.decide walks the case (scenario staff). Fix: run the createBan role check in escalateBan and extendBan (BAN_TARGET_INVALID, which the page already words), refuse viewerMayEscalate for such a person, and refuse to name a hoca who has an open ban." }
  - { id: BANDEC-3, rule: "SECURITY (read from the code, not run; NOT exposed by this page). createMadrasahBan reads the person's roles with koskId and courseId null when the ban is medrese-wide (apps/tedrisat/src/ban/ban.service.ts:463-467, :486), so a hoca and a köşk nazım are not found there and a medrese-wide ban can be placed on them at once; nazar.bans.ban's page offers that scope. This page places only COURSE bans, through POST /courses/:courseId/bans, whose createBan reads the roles at the course, its köşk, its medrese and the platform (ban.service.ts:129-131, :155-163), so the hole is not on this page's own way in. Fix, there: read every scope of the medrese for a medrese-wide ban." }
  - { id: COURSEBANS-1, rule: "HONESTY (from the code; walk: binding.nazir.yaml). A nazır given madrasah.ban alone reads both lists (the guard asks only that code) but the roster read GET /courses/:id/enrollments asks course.staff_read, which the engine confers only on a holder of enrollment.decide, enrollment.remove or enrollment.complete (libs/common/src/authz/effective-permissions.ts:188-192, :295), so it is refused 403. The page treats any roster read that is not ok as unreadable (course-bans-page.tsx:104-105): 'Yasakla' is off with 'Dersin talebeleri okunamadı; şu an yasaklayamazsınız.', although the read did not fail and nobody is stopped for a moment: the API would take the ban (ban.service.ts:137-143). Fix: say that the permission to read the course's talebe is missing, or read the picker's talebe from a route madrasah.ban covers." }
  - { id: COURSEBANS-2, rule: "HONESTY (from the code; walk: binding.invalid.yaml). The picker offers every roster row not taken out and not already barred (bans.ts:310), so it offers a ders nazırı or a hoca who is also enrolled, and the API refuses them when the form is sent (createBan :155-163, BAN_TARGET_INVALID): the page then says 'Bu kişi yasaklanamaz: kendinizi ya da medreseyi veya dersi yürüten birini yasaklayamazsınız.' in an error toast that does not name the person, after the person and the reason were typed. Fix: leave out of the picker a person the API will refuse (the roster could carry the role), or mark them." }
  - { id: COURSEBANS-3, rule: "ACCESSIBILITY AND HONESTY (from the code). The Yasakla dialog of a course draws two required fields with an aria-hidden asterisk and no sentence that says what the asterisk means, and its reason field has no help line, while the reason dialog beside it says '* zorunlu alan' (reason-dialog.tsx:159) and, under the field, who reads the reason and that the talebe does not (Reasons.*.help; BanDialog.reasonHelp exists and the course dialog does not use it: course-ban-dialog.tsx:123-138). The person who bans does not read that the talebe never sees the reason. Fix: pass help={t('BanDialog.reasonHelp')} and the required note." }
  - { id: COURSEBANS-4, rule: "HONESTY (from the code). The page lists this course's COURSE bans only: the medrese's list is narrowed by courseId (ban.repository.ts:664-703: a medrese-wide ban has no course) and the köşk's list is cut by ofCourse (bans.ts:284-290). A talebe barred from the whole medrese or köşk has no row here and no way to be lifted from here, yet the roster marks them barred (ban.repository.ts:239-262) and talebeOf leaves them out of the picker (bans.ts:310), so on this page a person can vanish from the choice with no word why; and 'Medreseden de yasakla' makes exactly such a ban (the row then only loses its widening button, the new ban appears here nowhere). Fix: say it under the picker or list the wider bans with a link to the page that lifts them." }
  - { id: F-D2c-2, rule: "The course menu draws 'Yasaklamalar' to every person who holds the course's scope (features/shell/nav.ts:134), including the hoca and the ders nazırı this page refuses (F-D2c-3, F-L-20). Fix: filter the entry by a code the lists ask, or serve those people (F-D2c-3)." }
  - { id: F-D2c-10, rule: "The sentence that says why 'Yasakla' is off ('Bu derste yasaklanabilecek talebe yok.' or 'Dersin talebeleri okunamadı; şu an yasaklayamazsınız.') is a sibling <span data-testid=ban-off> with no id and no aria-describedby; the button is natively disabled, so a keyboard user never lands on it and the sentence is not tied to it (course-ban-dialog.tsx:164-175). Fix: aria-describedby on the button and aria-disabled instead of disabled." }
  - { id: F-D2c-11, rule: "The Talebe options are labelled by name only (bans.ts:311-314, course-ban-dialog.tsx:117), so two talebe with the same name cannot be told apart before a ban that only a higher kademe can undo. Fix: add the address to the option's label." }
  - { id: F-D2c-12, rule: "Field required draws an aria-hidden asterisk, but the Select (Talebe) carries no required (course-ban-dialog.tsx:112-121), so the requirement is not exposed; the textarea has the native required." }
  - { id: F-D2c-13, rule: "Buttons with loading and no loadingLabel (the Yasakla and the three decisions' submits) announce the kit default 'Yükleniyor', hard-coded in libs/ui/src/mds/button.tsx:62 and outside the catalog; harmless while nazar is Turkish only, wrong when en or ar is switched on. Fix: pass loadingLabel={t('Shell.loadingLabel')}." }
  - { id: F-D2c-15, rule: "The Yasakla dialog gives no initialFocus (course-ban-dialog.tsx:87-110), so Base UI's default applies: the first tabbable, which the header precedes, is the close button (libs/ui/src/mds/dialog.tsx:97-100, 138). NOT VERIFIED in a browser. The reason dialog focuses its field (reason-dialog.tsx:115). Fix: pass initialFocus to the Talebe select." }
  - { id: F-D2c-16, rule: "The whole body of every dialog here (the person, the summary, the sentence and the fields) is its aria-describedby (libs/ui/src/mds/dialog.tsx:103-112), so a screen reader may read all of it on opening. Not verified how it is read. Same as F-B-12." }
  - { id: F-D2c-4, rule: "The reason's error ('Bir gerekçe yazın.') appears after the field was left empty as plain text linked by aria-describedby, with no live region and no focus move (libs/ui/src/mds/field.tsx:50-52; course-ban-dialog.tsx:123-127, reason-dialog.tsx:160-165). In the Yasakla dialog the submit is natively off until a reason exists, so the only way to meet the sentence is to leave the empty field (F-B-6). Fix: role=alert in the kit's Field error." }
  - { id: F-D2c-8, rule: "After a lift succeeds the row and its opener button are gone, and after a placed ban the dialog closes onto a refreshed page; no code chooses where the focus goes (reason-dialog.tsx:78-79, bans-table.tsx:77), so Base UI's return finds nothing in the lift's case and the focus falls to the page (F-B-9). The graph draws no focus after a write, and only the cancel paths return it. NOT VERIFIED in a browser. Fix: focus the table's caption or the next row's button, or the page heading with tabIndex=-1." }
  - { id: F-D2c-1, rule: "The failed read of a list (a 5xx: 'Yasaklar okunamadı') draws PageProblem's LoadFailed shell, whose SystemState is a second <h1> under the page's own (page-problem.tsx:30-37, load-failed.tsx:28-42, libs/ui/src/mds/system-state.tsx:31,43). Not drawn here (the shell's retry state: nazar.shell.errorStates); the page's own <h1> is drawn." }
  - { id: F-B-4, rule: "A write changes the rows and the two tab counts with no announcement: the table's aria-busy is not spoken and the counts are plain spans (bans-table.tsx:233-246). The only word is the toast. Here the counts are the lengths of the lists read (course-bans-page.tsx:130,134), not the API's." }
  - { id: BANDEC-1, rule: "While a call runs (`pending`) Vazgeç, the close icon and Esc do nothing (onOpenChange ignores a close while pending: course-ban-dialog.tsx:89-91, reason-dialog.tsx:107-109), and they stay on, drawn as usable; the select and the textarea are disabled, so the focus leaves them. Nothing says the dialog cannot be closed. The graph draws the cancel and the close icon in the busy states for that reason. Fix: disable the three while pending." }
  - { id: BANDEC-2, rule: "banErrorKey maps BAN_FORBIDDEN to 'Bu yasağı koymak için yetkiniz yok.' (bans.ts:356) for every write; for the permanent request the API's own refusal is 'You may not ask for a permanent ban' (ban.service.ts:589), so a başmüderris who lost the code reads that she may not 'place' a ban when she asked for a request." }
  - { id: BANDEC-4, rule: "HONESTY (MDRS-140, MDRS-194). 'Kalıcı yasak talebi aç' writes a ban_permanent_requests row and an audit row and nothing else: no notification, no route that lists or decides it (domain ban-permanent-request-is-decided holds: false). Yet the dialog says 'Talep Medaris yönetimine gider.' and the toast 'Talep Medaris yönetimine iletildi; karar verilene kadar yasak sürer.' (reason-dialog.tsx:102, nazar.json Reasons.permanent). Fix: say it is only recorded until the deciding page exists, or hide the action." }
  - { id: focus-not-set, rule: "Nothing in features/bans sets the focus when the page opens or after a tab press (a full page load), so the graph draws no initialFocus on the page. The reason dialog gives its focus to the field (reason-dialog.tsx:60,115); the Yasakla dialog gives none (F-D2c-15)." }
  - { id: error-toast-stays, rule: "An error toast (every refusal here) stays until closed, so a second write in the same visit can leave the first one's error on the screen beside the second's; the graph draws the last (`last`). A success toast closes after 6 seconds. A moved refusal also closes the reason dialog, so the person reads the reason of a list that has already changed; the Yasakla dialog never closes on an error." }
  - { id: label-in-name, rule: "A row button's visible text is contained in its accessible name: 'Yasağı kaldır' in 'Yasağı kaldır: {name}', 'Medreseden de yasakla' in 'Medreseden de yasakla: {name}', 'Kalıcı yasak talebi aç' in 'Kalıcı yasak talebi aç: {name}' (WCAG 2.5.3). Holds." }
  - { id: reason-never-reaches-the-talebe, rule: "The reason of a ban, of its lift and of the request is read by those who list and lift bans, never by the talebe, who is told only 'erişimin kaldırıldı' when a ban newly bars a seat of theirs, and nothing when a ban is lifted (liftBan sends no notification; ban.service.ts:336-342). Holds; the reason dialogs' help lines say so, the Yasakla dialog's does not (COURSEBANS-3)." }
