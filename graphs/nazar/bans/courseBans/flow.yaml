  banForm:
    title: The Yasakla dialog, the button off
    description: >-
      A form dialog over the page (the page behind is inert), titled "Yasakla" with the course's title over it. One sentence says what
      the ban does ("Bu dersin celselerine, ders kayıtlarına ve içeriğine erişemez."). Two fields: "Talebe", a select of this course's
      roster (not taken out, not already barred in this course, the medrese or the köşk, once each, by name only: F-D2c-11), and "Yasaklama
      gerekçesi", a textarea of 500 characters. The submit "Yasakla" is natively off until a talebe is chosen and a reason typed. No
      initial focus is given, so Base UI's default applies (F-D2c-15, not verified). "Bir gerekçe yazın." appears under the reason only
      after it was left empty, as plain text: not a live region, the focus is not moved (F-D2c-4). Neither field is `required` for a
      reader of the screen where it matters (F-D2c-12), and the dialog says neither who reads the reason nor what the asterisk means
      (COURSEBANS-3). The whole body is the dialog's description (F-D2c-16). The scrim does not close the dialog.
    by: human
    on:
      PICK_TALEBE: { target: banCheck, effect: [pickedTalebe], source: apps/nazar/features/bans/components/course-ban-dialog.tsx:119, say: "they open the select and choose a talebe" }
      FILL_IN: { target: banCheck, effect: [typedReason], source: apps/nazar/features/bans/components/course-ban-dialog.tsx:135, say: "they type a reason" }
      LEAVE_EMPTY: { target: banForm, effect: [leftEmpty], source: apps/nazar/features/bans/components/course-ban-dialog.tsx:136, say: "they leave the empty reason (Tab, or a click elsewhere): its error appears under it" }
      CANCEL: { target: classify, source: apps/nazar/features/bans/components/course-ban-dialog.tsx:100, say: "Vazgeç, or Esc: the dialog closes, nothing is sent and the focus goes back to the header's button" }
      CLOSE: { target: classify, source: apps/nazar/features/bans/components/course-ban-dialog.tsx:90, say: "the close icon: the same" }
    source: apps/nazar/features/bans/components/course-ban-dialog.tsx:87

  banCheck:
    title: Is the submit on
    description: Not a screen. The submit is on when a talebe is chosen and the reason holds a letter.
    always:
      - { guard: "picked and typed", target: banReady, source: apps/nazar/features/bans/components/course-ban-dialog.tsx:104 }
      - { target: banForm, source: apps/nazar/features/bans/components/course-ban-dialog.tsx:104 }
    source: apps/nazar/features/bans/components/course-ban-dialog.tsx:104

  banReady:
    title: The Yasakla dialog, the button on
    description: >-
      The same dialog with a talebe and a reason: the submit is on. Pressing it sends POST /courses/:courseId/bans {userId, scope: COURSE,
      reason trimmed}. After a refusal the dialog is here again with its error toast over it and what was typed kept.
    by: human
    on:
      PICK_TALEBE: { target: banCheck, effect: [pickedTalebe], source: apps/nazar/features/bans/components/course-ban-dialog.tsx:119, say: "they choose another talebe" }
      FILL_IN: { target: banCheck, effect: [typedReason], source: apps/nazar/features/bans/components/course-ban-dialog.tsx:135, say: "they change the reason" }
      CLEAR: { target: banCheck, effect: [clearedReason], source: apps/nazar/features/bans/components/course-ban-dialog.tsx:135, say: "they empty the reason: the submit goes off" }
      SUBMIT: { target: banning, source: apps/nazar/features/bans/components/course-ban-dialog.tsx:53, say: "they press 'Yasakla'" }
      CANCEL: { target: classify, source: apps/nazar/features/bans/components/course-ban-dialog.tsx:100, say: "Vazgeç, or Esc: what was typed is lost and the focus goes back to the header's button" }
      CLOSE: { target: classify, source: apps/nazar/features/bans/components/course-ban-dialog.tsx:90, say: "the close icon: the same" }
    source: apps/nazar/features/bans/components/course-ban-dialog.tsx:101

  banning:
    title: The ban is on its way
    description: >-
      createBan calls POST /courses/:courseId/bans: the caller's standing at the course (ban.course, ban.manage_kosk or madrasah.ban), the
      caller is not the person, and the person holds no role that runs the course (RUNS_MADRASAH_ROLES for a medrese course, RUNS_COURSE_ROLES
      otherwise, read from the roles at the course, its köşk, its medrese and the platform: ban.service.ts:129-163; the başnazım is never
      found, because SYSTEM_ADMIN is a realm role). A ban is made with the caller's role and kademe, the köşk's nazımları and the Medaris
      nazımları (all but the caller) are told (COURSE_BAN_PLACED), and each enrolled seat the ban newly bars is told "erişimin kaldırıldı", never
      the reason. A person already barred in that scope gets the standing ban back with the same 201 and nothing is written, though the toast
      says the ban was saved (a race: the picker offers nobody barred). The dialog stays open: the submit is busy (aria-disabled,
      "Yükleniyor" for a reader of the screen, F-D2c-13), the select and the field are disabled so the focus leaves them, and Vazgeç, the
      close icon and Esc do nothing (BANDEC-1). On success a toast says "Yasak kaydedildi" and "{name} artık “{course}” dersine
      erişemez.", the dialog closes and the list is read again.
    invoke: { action: createBan }
    on:
      DONE: { guard: "banAnswer == 'done'", target: classify, effect: [placed], source: apps/nazar/features/bans/components/course-ban-dialog.tsx:66, say: "the row appears in Etkin, the Etkin count goes up by one, a toast says the talebe can no longer reach the course" }
      FAIL.invalid: { guard: "banAnswer == 'invalid'", target: banReady, effect: [banError], source: apps/nazar/features/bans/components/course-ban-dialog.tsx:78, say: "the chosen person runs the course: an error toast 'Yasak konamadı' says 'Bu kişi yasaklanamaz: kendinizi ya da medreseyi veya dersi yürüten birini yasaklayamazsınız.'; the dialog stays open" }
      FAIL.refused: { guard: "banAnswer == 'refused'", target: banReady, effect: [banError], source: apps/nazar/features/bans/components/course-ban-dialog.tsx:78, say: "the caller may not bar from this course: an error toast 'Bu yasağı koymak için yetkiniz yok.'; the dialog stays open" }
      FAIL.gone: { guard: "banAnswer == 'gone'", target: banReady, effect: [banError], source: apps/nazar/features/bans/components/course-ban-dialog.tsx:78, say: "the course is no longer there: an error toast says to refresh the page and choose again; the dialog stays open and does not close itself" }
      FAIL.failed: { guard: "banAnswer == 'failed'", target: banReady, effect: [banError], source: apps/nazar/features/bans/components/course-ban-dialog.tsx:78, say: "an error toast ('Gerekçeyi denetleyip yeniden deneyin.' or 'Bir şeyler ters gitti. Biraz sonra yeniden deneyin.'); the dialog stays open" }
      CANCEL: { target: banning, source: apps/nazar/features/bans/components/course-ban-dialog.tsx:90, say: "Vazgeç or Esc: nothing happens, the ban is still sent (BANDEC-1)" }
      CLOSE: { target: banning, source: apps/nazar/features/bans/components/course-ban-dialog.tsx:90, say: "the close icon: nothing happens either" }
    source: apps/nazar/features/bans/components/course-ban-dialog.tsx:60

  reasonForm:
    title: The reason dialog, the button off
    description: >-
      A form dialog over the page, in the kind of the row's button: "Yasağı kaldır", "Medreseden de yasakla" or "Kalıcı yasak talebi aç". Over
      the title stands the course's title (not the medrese's: bans-table.tsx:310); the body names the person (name and address), then the
      ban's scope, who placed it and its reason, then one sentence of what the decision does (a lift says the talebe may apply to the course
      again, a widening says the talebe cannot reach or apply to any course of the medrese and the course's ban goes on, a request says it
      goes to Medaris administration and the ban goes on meanwhile), then the reason field. The focus starts in the reason (initialFocus).
      The submit is natively off until the reason holds a letter. The scrim does not close the dialog. "Bir gerekçe yazın." appears under
      the field only after it was left empty, as plain text (F-B-6, F-D2c-4). The whole body is the dialog's description (F-B-12).
    by: human
    on:
      LEAVE_EMPTY: { target: reasonForm, effect: [leftEmpty], source: "apps/nazar/features/bans/components/reason-dialog.tsx:175", say: "they leave the empty reason: its error appears under it" }
      FILL_IN: { target: reasonReady, effect: [typedReason], source: "apps/nazar/features/bans/components/reason-dialog.tsx:174", say: "they type a reason" }
      CANCEL: { target: classify, source: apps/nazar/features/bans/components/reason-dialog.tsx:118, say: "Vazgeç, or Esc: nothing is sent and the focus goes back to the row's button" }
      CLOSE: { target: classify, source: apps/nazar/features/bans/components/reason-dialog.tsx:107, say: "the close icon: the same" }
    source: apps/nazar/features/bans/components/reason-dialog.tsx:105

  reasonReady:
    title: The reason dialog, the button on
    description: >-
      The same dialog with a reason in the field (trimmed when sent, 500 characters at most): the submit is on. Pressing it (or Enter in the
      field) sends the decision of the dialog's kind.
    by: human
    on:
      FILL_IN: { target: reasonReady, effect: [typedReason], source: "apps/nazar/features/bans/components/reason-dialog.tsx:174", say: "they change the reason" }
      CLEAR: { target: reasonForm, effect: [clearedReason], source: "apps/nazar/features/bans/components/reason-dialog.tsx:174", say: "they empty the reason: the submit goes off" }
      SUBMIT:
        - { guard: "kind == 'lift'", target: lifting, source: apps/nazar/features/bans/components/reason-dialog.tsx:70, say: "they press 'Yasağı kaldır'" }
        - { guard: "kind == 'escalate'", target: escalating, source: apps/nazar/features/bans/components/reason-dialog.tsx:70, say: "they press 'Medreseden de yasakla'" }
        - { target: requesting, source: apps/nazar/features/bans/components/reason-dialog.tsx:70, say: "they press 'Talebi aç'" }
      CANCEL: { target: classify, source: apps/nazar/features/bans/components/reason-dialog.tsx:118, say: "Vazgeç, or Esc: what was typed is lost and the focus goes back to the row's button" }
      CLOSE: { target: classify, source: apps/nazar/features/bans/components/reason-dialog.tsx:107, say: "the close icon: the same" }
    source: apps/nazar/features/bans/components/reason-dialog.tsx:119

  lifting:
    title: The lift is on its way
    description: >-
      liftBan calls POST /bans/:banId/lift with the reason: the ban is lifted with the lifter's name and the reason, in one transaction with its
      audit row; the enrollment is not touched and nobody is told, so the talebe never hears that access has returned. The dialog stays
      open while it runs: the submit is busy, the field is disabled so it loses the focus, and Vazgeç, the close icon and Esc do nothing
      (BANDEC-1). On success a toast says "Yasak kaldırıldı", the dialog closes and the list is read again: the row is in Kaldırılan.
    invoke: { action: liftBan }
    on:
      DONE:
        - { guard: "answer == 'done' and after == 'none'", target: classify, effect: [liftedLast], source: apps/nazar/features/bans/components/reason-dialog.tsx:73, say: "the only open ban moves to Kaldırılan: the Etkin list is empty" }
        - { guard: "answer == 'done'", target: classify, effect: [lifted], source: apps/nazar/features/bans/components/reason-dialog.tsx:73, say: "the row moves to Kaldırılan; the Etkin count goes down by one and the Kaldırılan count up" }
      FAIL.moved:
        - { guard: "answer == 'moved' and after == 'none'", target: classify, effect: [movedLast], source: apps/nazar/features/bans/components/reason-dialog.tsx:87, say: "someone lifted it first, or it is gone, and no other is open: an error toast says the list was refreshed, the dialog closes, the list is empty" }
        - { guard: "answer == 'moved'", target: classify, effect: [moved], source: apps/nazar/features/bans/components/reason-dialog.tsx:87, say: "someone lifted it first, or it is gone: an error toast says the list was refreshed, the dialog closes" }
      FAIL.refused: { guard: "answer == 'refused'", target: reasonReady, effect: [refused], source: apps/nazar/features/bans/components/reason-dialog.tsx:82, say: "the caller's kademe does not reach the ban's: an error toast, the dialog stays open with the reason" }
      FAIL.failed: { guard: "answer == 'failed'", target: reasonReady, effect: [failed], source: apps/nazar/features/bans/components/reason-dialog.tsx:82, say: "an error toast, the dialog stays open" }
      CANCEL: { target: lifting, source: apps/nazar/features/bans/components/reason-dialog.tsx:108, say: "Vazgeç or Esc: nothing happens, the lift is still sent (BANDEC-1)" }
      CLOSE: { target: lifting, source: apps/nazar/features/bans/components/reason-dialog.tsx:108, say: "the close icon: nothing happens either" }
    source: apps/nazar/features/bans/components/reason-dialog.tsx:71

  escalating:
    title: The widening is on its way
    description: >-
      escalateBan calls POST /bans/:banId/escalate with the reason: a second ban, over the whole medrese, is made for the same person with
      the caller's own kademe and reason, and the course ban stays open (a person already barred from the medrese gets that ban back and
      nothing is written). The talebe's seats the new ban newly bars are told 'erişimin kaldırıldı'; the köşk's nazımları are not told. This
      course's list does not show the new ban (it is not a COURSE ban of this course), only that the row loses its widening button. The API
      asks the caller's standing at the medrese (madrasah.ban or platform.ban_scoped) and nothing about the person: unlike placing a ban it
      never reads the person's roles or compares them with the caller (ban.service.ts:515-553), so it does not refuse a person who has since
      been named hoca, başmüderris or nazım (ban-staff-check-gaps, SECURITY; read from the code, the walk is nazar.bans.decide's `staff`). The
      dialog stays open while it runs, as for the lift.
    invoke: { action: escalateBan }
    on:
      DONE: { guard: "answer == 'done'", target: classify, effect: [widened], source: apps/nazar/features/bans/components/reason-dialog.tsx:73, say: "the toast says 'Medreseden de yasaklandı' and '{name} artık medresenin hiçbir dersine erişemez.'; the row loses its widening button; the medrese-wide ban is not on this list" }
      FAIL.moved:
        - { guard: "answer == 'moved' and after == 'none'", target: classify, effect: [movedLast], source: apps/nazar/features/bans/components/reason-dialog.tsx:87, say: "the ban is lifted or gone and no other is open: an error toast, the dialog closes, the list is empty" }
        - { guard: "answer == 'moved'", target: classify, effect: [moved], source: apps/nazar/features/bans/components/reason-dialog.tsx:87, say: "the ban is lifted, gone or cannot be widened: an error toast, the dialog closes and the list is read again" }
      FAIL.refused: { guard: "answer == 'refused'", target: reasonReady, effect: [refused], source: apps/nazar/features/bans/components/reason-dialog.tsx:82, say: "the caller may not widen to the medrese: an error toast, the dialog stays open" }
      FAIL.failed: { guard: "answer == 'failed'", target: reasonReady, effect: [failed], source: apps/nazar/features/bans/components/reason-dialog.tsx:82, say: "an error toast, the dialog stays open" }
      CANCEL: { target: escalating, source: apps/nazar/features/bans/components/reason-dialog.tsx:108, say: "Vazgeç or Esc: nothing happens, the widening is still sent (BANDEC-1)" }
      CLOSE: { target: escalating, source: apps/nazar/features/bans/components/reason-dialog.tsx:108, say: "the close icon: nothing happens either" }
    source: apps/nazar/features/bans/components/reason-dialog.tsx:71

  requesting:
    title: The request is on its way
    description: >-
      requestPermanentBan calls POST /bans/:banId/permanent-request with the reason: one row of ban_permanent_requests per ban and an audit
      row. The ban stands as it was. No notification is sent and no route lists or answers the request, so nothing reaches Medaris
      administration, although the toast says "Talep Medaris yönetimine iletildi" (BANDEC-4, MDRS-140, MDRS-194). The dialog stays open while
      it runs, as for the lift. The start of nizam.moderation.decidePermanentBan (planned) is on the DONE below, as in nazar.bans.decide.
    invoke: { action: requestPermanentBan }
    on:
      DONE: { guard: "answer == 'done'", target: classify, effect: [requested], starts: { flow: nizam.moderation.decidePermanentBan, given: { requested: "true" } }, source: apps/nazar/features/bans/components/reason-dialog.tsx:73, say: "the row wears 'Kalıcı yasak talebi bekliyor' and loses its request button. The start is the PLANNED second half (MDRS-140): no code reads the request today" }
      FAIL.moved:
        - { guard: "answer == 'moved' and after == 'none'", target: classify, effect: [movedLast], source: apps/nazar/features/bans/components/reason-dialog.tsx:87, say: "the ban is lifted or gone and no other is open: an error toast, the dialog closes, the list is empty" }
        - { guard: "answer == 'moved'", target: classify, effect: [moved], source: apps/nazar/features/bans/components/reason-dialog.tsx:87, say: "the ban is lifted or gone, or a request exists already, or it is a ban Medaris placed: an error toast, the dialog closes and the list is read again" }
      FAIL.refused: { guard: "answer == 'refused'", target: reasonReady, effect: [refused], source: apps/nazar/features/bans/components/reason-dialog.tsx:82, say: "the caller may not ask: an error toast that says 'Bu yasağı koymak için yetkiniz yok.' (BANDEC-2), the dialog stays open" }
      FAIL.failed: { guard: "answer == 'failed'", target: reasonReady, effect: [failed], source: apps/nazar/features/bans/components/reason-dialog.tsx:82, say: "an error toast, the dialog stays open" }
      CANCEL: { target: requesting, source: apps/nazar/features/bans/components/reason-dialog.tsx:108, say: "Vazgeç or Esc: nothing happens, the request is still sent (BANDEC-1)" }
      CLOSE: { target: requesting, source: apps/nazar/features/bans/components/reason-dialog.tsx:108, say: "the close icon: nothing happens either" }
    source: apps/nazar/features/bans/components/reason-dialog.tsx:71

  not_found:
    title: The course is not there
    description: "A 404 of the course read (or of the roster or a list) is Next's not-found page, which the shell draws."
    type: final
    leavesPage: true

  left:
    title: They leave the page
    type: final
    leavesPage: true

assertions:
  - id: a-dialog-is-opened-for-what-the-row-offers
    never: "(state == 'reasonForm' or state == 'reasonReady') and ((kind == 'lift' and not mayLift) or (kind == 'escalate' and not mayWiden) or (kind == 'permanent' and not mayRequest))"
    say: A decision's dialog opens only from a row that offers that decision; the buttons are absent otherwise.
    source: apps/nazar/features/bans/components/bans-table.tsx:190
  - id: a-course-with-no-medrese-offers-only-the-lift
    never: "(state == 'escalating' or state == 'requesting') and onKosk"
    say: A course the köşk keeps for itself has no medrese to widen the ban to, and the köşk's list says nothing of a request, so only the lift is offered.
    source: apps/nazar/features/bans/bans.ts:273
  - id: a-ban-medaris-placed-is-not-lifted-here
    never: "state == 'lifting' and list == 'higher' and not made"
    say: A ban that Medaris administration placed is never lifted from this page by a başmüderris, only widened.
    source: apps/nazar/features/bans/bans.ts:145
  - id: a-ban-is-placed-only-where-the-list-is-read
    never: "(state == 'banForm' or state == 'banReady' or state == 'banning') and read != 'ok'"
    say: The header's "Yasakla" is drawn only when both lists were read, so a caller refused the list cannot open its dialog.
    source: apps/nazar/features/bans/components/course-bans-page.tsx:98
  - id: a-ban-needs-a-talebe-to-choose
    never: "(state == 'banForm' or state == 'banReady' or state == 'banning') and not canBan"
    say: The header's "Yasakla" is off when the roster is empty or unreadable, so its dialog never opens without a talebe to choose.
    source: apps/nazar/features/bans/components/course-ban-dialog.tsx:166
  - id: rows-mean-a-ban
    never: "state == 'listed' and not hasOpen"
    say: The Etkin table is drawn with rows only while a ban is open.
    source: apps/nazar/features/bans/components/bans-table.tsx:299
  - id: an-empty-line-means-no-open-ban
    never: "state == 'empty' and hasOpen"
    say: The Etkin table says it is empty only when no ban is open.
    source: apps/nazar/features/bans/components/bans-table.tsx:299
