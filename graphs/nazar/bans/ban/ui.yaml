# The screens of nazar.bans.ban: Talebeler (/medrese/<id>/talebeler) or Yasaklamalar (/medrese/<id>/yasaklamalar) behind, and the
# "Yasakla" dialog over it, with its toasts. Read from apps/nazar/features/bans/components/ban-dialog.tsx (the dialog and the header
# button), features/students/components/students-table.tsx (the row button), features/bans/components/bans-page.tsx and
# bans-table.tsx; the words are copied from libs/i18n/src/locales/tr/nazar.json (namespaces BanDialog, Appoint, Bans, Students,
# Problems, Shell), letter for letter.
#
# `changes` is the dialog's own intro ("Yasak hemen geçerli olur. …"), which tells the person what the ban does; no message was written
# for this flow. Five entries are built in code and belong to no i18n file (`composed.*`, each a data value set in a node):
#   composed.BanDialog.eyebrow       the medrese's name above the title                      (ban-dialog.tsx:207)
#   composed.BanDialog.personName    the chosen person's name, in the person block            (ban-dialog.tsx:230)
#   composed.BanDialog.personEmail   their e-mail, drawn when it differs from the name        (ban-dialog.tsx:234)
#   composed.BanDialog.courseTitle   a course's title, the label of its radio                 (ban-dialog.tsx:263)
#   composed.Bans.personCell         the name in the person column of a ban's row             (bans-table.tsx:124)
#
# The page behind the dialog is drawn only where the dialog is closed: the dialog is modal, so the page is inert while it is open. There
# are two dialogs (rowForm.. and headerForm..) because they differ in the first focus and in the way back: the two openers are two
# nodes and each dialog gives the focus back to its own.
schema: delurio-graph/0
kind: ui
id: nazar.bans.ban
flow: nazar.bans.ban
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: BanDialog.intro }
samples:
  name: Nazlı Talebe # the person: the row's talebe, or the one the address finds
  email: nazli.talebe@example.test
  course: Sarf ve İ'lâl Dersi
  madrasah: Örnek Medrese

# Neither page nor dialog sets a focus of its own on load except the dialog's `initialFocus` (a ref to the reason or to the e-mail field);
# after a lookup nothing moves it (F-B-8), after a refusal it stays on "Yasakla", and after the dialog closes it is Base UI's to give
# back. The graph says only what the code says.
nodes:
  # ---- Talebeler behind the dialog ----------------------------------------------------------------------------------------
  studentsPage: { type: page, component: Page, role: main, in: [studentsPage, savedRow, closedRow], source: libs/ui/src/mds/app-shell.tsx:41 } # the shell's one <main id="main">; it has no name
  studentsTitle: { type: text, component: Heading, role: heading, text: { key: Students.title }, in: [studentsPage, savedRow, closedRow], source: apps/nazar/features/students/components/students-page.tsx:74 } # h1
  studentsTable: { type: list, component: List, role: table, name: { key: Students.caption }, in: [studentsPage, savedRow, closedRow], source: apps/nazar/features/students/components/students-table.tsx:239 }
  rowBan: { type: action, component: Button, role: button, intent: secondary, name: { key: Students.banLabel, params: { name: student.name } }, text: { key: Students.ban }, in: [studentsPage, savedRow, closedRow], repeat: students.rows, emits: OPEN_ROW, source: apps/nazar/features/students/components/students-table.tsx:169 } # one per row, whoever sees the table; the dialog gives the focus back to the row's own

  # ---- Yasaklamalar behind the dialog -------------------------------------------------------------------------------------
  bansPage: { type: page, component: Page, role: main, in: [bansPage, savedHeader, closedHeader], source: libs/ui/src/mds/app-shell.tsx:41 }
  bansTitle: { type: text, component: Heading, role: heading, text: { key: Bans.title }, in: [bansPage, savedHeader, closedHeader], source: apps/nazar/features/bans/components/bans-page.tsx:55 } # h1
  bansIntro: { type: text, component: Text, text: { key: Bans.intro }, in: [bansPage, savedHeader, closedHeader], source: apps/nazar/features/bans/components/bans-page.tsx:56 }
  headerBan: { type: action, component: Button, role: button, text: { key: Bans.ban }, in: [bansPage, savedHeader, closedHeader], emits: OPEN_HEADER, source: apps/nazar/features/bans/components/ban-dialog.tsx:315 } # primary, with a ban icon; left out with the list when the bans cannot be read
  bansTable: { type: list, component: List, role: table, name: { key: Bans.caption.ACTIVE }, in: [bansPage, savedHeader, closedHeader], source: apps/nazar/features/bans/components/bans-table.tsx:279 } # the "Etkin" tab, the page's default
  bannedPerson: { type: text, component: Text, text: { key: composed.Bans.personCell, params: { name: person.name } }, in: [savedHeader], source: apps/nazar/features/bans/components/bans-table.tsx:124 } # the new ban's row, in the person column (a ban that already stood adds no row: BAN-4)

