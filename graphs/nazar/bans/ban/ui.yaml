  dialogHeader: { type: page, component: Page, role: dialog, name: { labelledBy: dialogTitle }, in: [headerForm, headerReady, headerLooking, headerSubmitting], initialFocus: emailField, source: apps/nazar/features/bans/components/ban-dialog.tsx:199 } # opened from the header: the focus starts in the e-mail field
  dialogEyebrow: { type: text, component: Text, text: { key: composed.BanDialog.eyebrow, params: { madrasah: madrasah.name } }, in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerLooking, headerSubmitting], source: apps/nazar/features/bans/components/ban-dialog.tsx:207 } # above the title, outside the dialog's name
  dialogTitle: { type: text, component: Heading, role: heading, text: { key: BanDialog.title }, in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerLooking, headerSubmitting], source: apps/nazar/features/bans/components/ban-dialog.tsx:208 } # Base UI's Title, an h2
  closeIcon: { type: action, component: Button, role: button, intent: dismiss, name: { key: Shell.close }, in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerLooking, headerSubmitting], emits: CANCEL, source: apps/nazar/features/bans/components/ban-dialog.tsx:209 } # stays on and does nothing while the ban is sent (BAN-3)
  intro: { type: text, component: Text, text: { key: BanDialog.intro }, in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerLooking, headerSubmitting], source: apps/nazar/features/bans/components/ban-dialog.tsx:224 }
  requiredNote: { type: text, component: Text, text: { key: BanDialog.required }, in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerLooking, headerSubmitting], source: apps/nazar/features/bans/components/ban-dialog.tsx:225 } # drawn as "* zorunlu alan"

  # The person: a row's talebe, or the one the address found
  personName: { type: text, component: Text, text: { key: composed.BanDialog.personName, params: { name: person.name } }, in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerSubmitting], when: "who != 'nobody'", source: apps/nazar/features/bans/components/ban-dialog.tsx:230 } # inside data-testid="ban-person", with an avatar that is decorative
  personEmail: { type: text, component: Text, text: { key: composed.BanDialog.personEmail, params: { email: person.email } }, in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerSubmitting], when: "who != 'nobody'", source: apps/nazar/features/bans/components/ban-dialog.tsx:234 } # only when the person has an address that is not their name
  # duringStep: "Seçimi kaldır" is a plain <button> with no disabled (ban-dialog.tsx:240) and takes the person out at once while the ban is
  # sent; the call keeps the person it was sent for, so a refusal leaves the dialog with nobody chosen (BAN-3).
  removePerson: { type: action, component: Button, role: button, intent: secondary, name: { key: Appoint.remove, params: { name: person.name } }, in: [headerForm, headerReady, headerSubmitting], when: "who == 'picked'", emits: REMOVE_PERSON, duringStep: true, source: apps/nazar/features/bans/components/ban-dialog.tsx:240 } # an icon button named by its aria-label; no confirmation, the focus is not moved (F-B-8), and it stays live while the ban is sent (BAN-3)

