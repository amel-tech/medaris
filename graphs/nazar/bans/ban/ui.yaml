  emailField: { type: field, component: TextField, role: textbox, text: { key: BanDialog.personLabel }, value: { literal: "" }, in: [headerForm, headerLooking], disabledIn: [headerLooking], when: "who == 'nobody'", source: apps/nazar/features/bans/components/ban-dialog.tsx:94 } # type=email; the red * is hidden from assistive technology and the input has no `required` (F-B-7); disabled while it searches, so it loses the focus (F-B-8)
  emailHelp: { type: text, component: Text, text: { key: Appoint.help }, in: [headerForm, headerLooking], when: "who == 'nobody' and note == 'none'", source: apps/nazar/features/bans/components/ban-dialog.tsx:85 } # says every search is written to the audit log
  emailNotFound: { type: text, component: Text, text: { key: Appoint.notFound }, in: [headerForm, headerLooking], when: "who == 'nobody' and note == 'notFound'", source: apps/nazar/features/bans/components/ban-dialog.tsx:88 } # the field's own error: no live region (F-L-12)
  emailDown: { type: text, component: Text, text: { key: Appoint.failed }, in: [headerForm, headerLooking], when: "who == 'nobody' and note == 'down'", source: apps/nazar/features/bans/components/ban-dialog.tsx:90 }
  searching: { type: status, component: Status, role: status, text: { key: Appoint.searching }, in: [headerLooking], source: apps/nazar/features/bans/components/ban-dialog.tsx:114 } # the hidden <output>; empty in every other state

  # Yasağın kapsamı: the choices are the talebe's own courses (a row), the medrese's courses (the header), and the whole medrese
  scopeGroup: { type: list, component: List, role: radiogroup, name: { key: BanDialog.scopeLegend }, in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerLooking, headerSubmitting], source: apps/nazar/features/bans/components/ban-dialog.tsx:253 }
  rowCourse: { type: field, component: ListItem, role: radio, text: { key: composed.BanDialog.courseTitle, params: { course: course.title } }, checked: "chosen == 'course'", in: [rowForm, rowReady, rowSubmitting], disabledIn: [rowSubmitting], repeat: student.courses, emits: PICK_COURSE, source: apps/nazar/features/bans/components/ban-dialog.tsx:261 } # one for each course the talebe holds a seat in, ongoing then finished; the first is on when it opens, so `checked` holds for the talebe of the walk, who has one course (students#4 a4)
  # duringStep on the radios: they are off only while the ban is sent (`disabled={pending}`, ban-dialog.tsx:258), so while the address is
  # looked up a pick changes the scope at once.
  headerCourse: { type: field, component: ListItem, role: radio, text: { key: composed.BanDialog.courseTitle, params: { course: course.title } }, in: [headerForm, headerReady, headerLooking, headerSubmitting], disabledIn: [headerSubmitting], when: "way != 'noCourses'", repeat: madrasah.courses, emits: PICK_COURSE, duringStep: true, source: apps/nazar/features/bans/components/ban-dialog.tsx:261 } # one for each course of the medrese; the first is on when it opens, which course that is the page's own order says, so `checked` is not drawn
  madrasahRadio: { type: field, component: ListItem, role: radio, text: { key: BanDialog.madrasah }, checked: "chosen == 'madrasah'", in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerLooking, headerSubmitting], disabledIn: [rowSubmitting, headerSubmitting], emits: PICK_MADRASAH, duringStep: true, source: apps/nazar/features/bans/components/ban-dialog.tsx:267 } # last; the first when the courses could not be read
  courseDesc: { type: text, component: Text, text: { key: BanDialog.courseDesc }, in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerLooking, headerSubmitting], when: "way != 'noCourses'", repeat: madrasah.courses, source: apps/nazar/features/bans/components/ban-dialog.tsx:264 } # under each course radio; the radio's description, not its name
  madrasahDesc: { type: text, component: Text, text: { key: BanDialog.madrasahDesc }, in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerLooking, headerSubmitting], source: apps/nazar/features/bans/components/ban-dialog.tsx:269 }
  coursesFailedNote: { type: text, component: Text, text: { key: BanDialog.coursesFailed }, in: [headerForm, headerReady, headerLooking, headerSubmitting], when: "way == 'noCourses'", source: apps/nazar/features/bans/components/ban-dialog.tsx:273 }

  # Yasaklama gerekçesi
  reasonField: { type: field, component: TextField, role: textbox, text: { key: BanDialog.reasonLabel }, value: { literal: "" }, in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerLooking, headerSubmitting], disabledIn: [rowSubmitting, headerSubmitting], source: apps/nazar/features/bans/components/ban-dialog.tsx:282 } # a textarea of 4 rows, at most 500 characters, `required`; the first focus in a row's dialog
  reasonHelp: { type: text, component: Text, text: { key: BanDialog.reasonHelp }, in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerLooking, headerSubmitting], when: "said == 'none'", source: apps/nazar/features/bans/components/ban-dialog.tsx:279 } # says who reads the reason; the error replaces it
  reasonRequired: { type: text, component: Text, text: { key: BanDialog.reasonRequired }, in: [rowForm, headerForm], when: "said == 'required'", source: apps/nazar/features/bans/components/ban-dialog.tsx:280 } # after the field was left empty; not a live region (F-B-6, F-L-12)

  # the footer
  cancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: BanDialog.cancel }, in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerLooking, headerSubmitting], emits: CANCEL, source: apps/nazar/features/bans/components/ban-dialog.tsx:213 } # on while the ban is sent, and does nothing then (ban-dialog.tsx:202, BAN-3)
  submit: { type: action, component: Button, role: button, intent: confirm, text: { key: BanDialog.submit }, in: [rowForm, rowReady, rowSubmitting, headerForm, headerReady, headerLooking, headerSubmitting], disabledIn: [rowForm, headerForm, headerLooking, rowSubmitting, headerSubmitting], emits: SUBMIT, source: apps/nazar/features/bans/components/ban-dialog.tsx:214 } # natively disabled until a person is chosen and a reason is written, and nothing says which is missing (F-B-6); busy (aria-disabled, "Yükleniyor", F-B-2) while it is sent

  # ---- the toasts: a region "Bildirimler", each toast a dialog; an error toast is an alertdialog and stays ----------------------
  toastSavedCourse: { type: status, component: Status, role: dialog, name: { key: BanDialog.saved }, text: { key: BanDialog.savedCourse, params: { name: person.name, course: course.title } }, in: [savedRow, savedHeader], when: "chosen == 'course'", source: apps/nazar/features/bans/components/ban-dialog.tsx:177 } # closes by itself after 6 seconds; the only word of the ban on Talebeler
  toastSavedMadrasah: { type: status, component: Status, role: dialog, name: { key: BanDialog.saved }, text: { key: BanDialog.savedMadrasah, params: { name: person.name } }, in: [savedRow, savedHeader], when: "chosen == 'madrasah'", source: apps/nazar/features/bans/components/ban-dialog.tsx:177 }
  toastForbidden: { type: alert, component: Alert, role: alertdialog, name: { key: BanDialog.failedTitle }, text: { key: Problems.actionForbidden }, in: [rowReady, headerReady], when: "toast == 'forbidden'", source: apps/nazar/features/bans/bans.ts:355 } # tone error: it stays until closed
  toastNotAllowed: { type: alert, component: Alert, role: alertdialog, name: { key: BanDialog.failedTitle }, text: { key: Bans.errors.BAN_FORBIDDEN }, in: [rowReady, headerReady], when: "toast == 'notAllowed'", source: apps/nazar/features/bans/bans.ts:356 }
  toastInvalidTarget: { type: alert, component: Alert, role: alertdialog, name: { key: BanDialog.failedTitle }, text: { key: Bans.errors.BAN_TARGET_INVALID }, in: [rowReady, headerReady], when: "toast == 'invalidTarget'", source: apps/nazar/features/bans/bans.ts:360 }
  toastCourseGone: { type: alert, component: Alert, role: alertdialog, name: { key: BanDialog.failedTitle }, text: { key: Bans.errors.COURSE_NOT_FOUND }, in: [rowReady, headerReady], when: "toast == 'courseGone'", source: apps/nazar/features/bans/bans.ts:364 }
  toastInvalid: { type: alert, component: Alert, role: alertdialog, name: { key: BanDialog.failedTitle }, text: { key: Bans.errors.VALIDATION_ERROR }, in: [rowReady, headerReady], when: "toast == 'invalid'", source: apps/nazar/features/bans/bans.ts:365 }
  toastFailed: { type: alert, component: Alert, role: alertdialog, name: { key: BanDialog.failedTitle }, text: { key: Problems.actionGeneric }, in: [rowReady, headerReady], when: "toast == 'failed'", source: apps/nazar/features/bans/bans.ts:367 }

edges:
  - { labelledBy: [dialogRow, dialogTitle] }
  - { labelledBy: [dialogHeader, dialogTitle] }
  - { triggers: [rowBan, rowForm] }
  - { triggers: [headerBan, headerForm] }
  - { triggers: [submit, rowSubmitting] }
  - { triggers: [submit, headerSubmitting] }
  - { returnsFocus: [dialogRow, rowBan] } # Base UI gives the focus back to the element that was focused when it opened: the row's own "Yasakla", which the refresh keeps; not verified in a browser
  - { returnsFocus: [dialogHeader, headerBan] } # the header's "Yasakla"

rules:
  - { id: BAN-1, rule: "new: the medrese route tells the talebe (`tellBarred`, COURSE_ACCESS_REMOVED, never the reason) and no one above. The course route and the köşk widening also call `announce` (COURSE_BAN_PLACED / KOSK_BAN_PLACED to the köşk's nazımları and the Medaris nazımları holding the permission); `createInMadrasah` does not (apps/tedrisat/src/ban/ban.service.ts:449-507, `announce` is called at :179 and :308 only), though a COURSE ban placed here sits in a köşk. MDRS-113 asks for every ban to be put in front of the people above it, and FLOWS.md's story says 'the ban reaches the Medaris nazımı as a notification': it does not, so this flow does not start nizam.notifications.triage. Fix: call `announce` from `createInMadrasah` (for a medrese-wide ban, to the Medaris nazımları with platform.ban_scoped)." }
  - { id: BAN-2, rule: "new: the e-mail is searched when the field is left (`onBlur`), not only on Enter, and every search, found or not, is a row in the audit log; tabbing through a field that holds an address makes an audited lookup (ban-dialog.tsx:111; the nizam twin is F-W3-14). The help text says searches are audited. Fix: search on Enter or on an explicit 'Ara' button only." }
  - { id: BAN-3, rule: "new: while the ban is sent, 'Vazgeç', the close icon and Escape stay on and do nothing (`if (!open && !pending) onClose()`, ban-dialog.tsx:202), and 'Seçimi kaldır' stays live and takes the person out of the dialog under the call (:240-247). A busy control is neither disabled nor marked. The nizam twin is F-W3-open-2. Fix: disable them with the rest of the form while `pending`." }
  - { id: BAN-4, rule: "new: a person already barred in that scope is answered with the standing ban and the same 201 (ban.service.ts:489-505, `created` false); the dialog cannot tell and says 'Yasak kaydedildi' with '{name} artık … dersine erişemez.', so the person who bans believes the reason just typed was recorded, when the standing ban keeps its own reason, banner and date, and no row is added. Neither Talebeler nor the dialog ever says who is barred. Fix: have the API say whether it made the ban and say 'zaten yasaklı' (decision D1)." }
  - { id: BAN-5, rule: "new: an address that does not look like one (`isEmailLike`, nazirs.ts:245) is neither searched nor told off: Enter and leaving the field do nothing and say nothing, and the same address that found nobody is not searched again until it is changed (`searched.current`, ban-dialog.tsx:57). Fix: say 'Geçerli bir e-posta adresi yazın.' under the field, and let Enter search again." }
  - { id: toast-is-the-only-word, rule: "A ban made from a row changes nothing on Talebeler: the list draws no mark of a ban, so the only word of it is a toast of 6 seconds (a keyboard or screen-reader user may miss it; F-L-17). The ban is on Yasaklamalar, whose Etkin count and table the page reads again. Fix: mark a barred talebe's row, or link the toast to Yasaklamalar." }
  - { id: F-B-2, rule: "'Yasakla' is busy with no `loadingLabel`, so its hidden status says 'Yükleniyor' from the primitive's hard-coded default, outside the catalog and not saying what is happening (ban-dialog.tsx:214-220, libs/ui/src/mds/button.tsx:62)." }
  - { id: F-B-6, rule: "The submit button is natively disabled while the reason is blank or nobody is chosen, so the only way to meet 'Bir gerekçe yazın.' is to leave the empty field, which shows it silently: the error is `aria-describedby` only, with no live region (ban-dialog.tsx:214-220, :276-293, libs/ui/src/mds/field.tsx:50-53, F-L-12). Fix: keep the button on, let a send show the error and move the focus to the reason." }
  - { id: F-B-7, rule: "The visible `*` of 'Kişinin e-posta adresi' is `aria-hidden` and the input has no `required` (ban-dialog.tsx:84, :94-112), so a screen reader is never told the address is required; the reason textarea does carry `required` (:288)." }
  - { id: F-B-8, rule: "The focused e-mail input is `disabled` while it searches, so the focus drops to the page; when a person is found the input is unmounted and nothing moves the focus to the reason field; 'Seçimi kaldır' removes itself and nothing moves it back to the e-mail field (ban-dialog.tsx:55-71, :104, :226-252). Fix: keep the input enabled (`readOnly`), and after a pick focus the reason; after the removal, the e-mail field." }
  - { id: F-B-9, rule: "Listed for this flow in FLOWS.md; it does not apply as the inventory states it: the ban dialog's opener is not removed by the write (the row's and the header's 'Yasakla' stay after the refresh), so Base UI has an element to give the focus back to. It is a claim of the graph (`returnsFocus`) that the replay checks." }
  - { id: F-B-12, rule: "Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:107-116), so a screen reader may read the intro, the person, every radio and the reason as the dialog's description when it opens." }
  - { id: F-B-13, rule: "A nazır with no grant meets the forbidden alert on Talebeler and Yasaklamalar, under the page's own title and with no heading and no link out: out of view here (nazar.access.medreseNazirRefused); the dialog is not mounted for her at all." }
  - { id: F-B-16, rule: "`Appoint.chosen` ('{name} seçildi') exists in the catalog and is never drawn: after the address finds someone the person just replaces the field, in silence (ban-dialog.tsx:226-252). Fix: render it in a hidden role=status and focus the reason." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Yasakla' in 'Yasakla: {name}' (WCAG 2.5.3). Holds. The dialog's name 'Yasakla', the header button's and the submit's are all the same word, so a test or a voice user has to scope them: the replay finds the submit inside the dialog." }
  - { id: no-default-accept, rule: "No page has `initialFocus` on the action that sends: the dialog starts in the reason (a row) or in the e-mail field (the header). The scrim does not close the form; Escape and 'Vazgeç' do, unless a ban is being sent (BAN-3)." }
