schema: delurio-graph/0
kind: needs
id: nazar.bans.decide
status: proposed
summary: >-
  What must exist for the başmüderris of a medrese to decide on an open ban from Yasaklamalar (lift it, widen it to the medrese,
  ask Medaris to make it permanent): the flow's product list. Each need is what the product must do, from the flow's story and the
  planned work in the inventory (planned.md P-01, P-03), not from what the page does today.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# Gaps of this file, for that merge:
# missing:   a-permanent-request-is-answered (MDRS-140), bans-reach-the-people-above (MDRS-113),
# widen-refuses-a-person-who-runs-the-course (finding ban-staff-check-gaps, no issue),
# a-hoca-is-not-named-over-an-open-ban (same finding, no issue),
# an-empty-reason-is-told (F-B-6, no issue), the-focus-follows-a-decision (F-B-9, no issue),
# a-busy-dialog-can-be-left-or-says-it-cannot (BANDEC-1, no issue)
# unwalked:  every-moved-code-is-told (four of the five codes: BAN_NOT_FOUND, BAN_NOT_ESCALATABLE, BAN_PERMANENT_REQUEST_EXISTS,
# BAN_PERMANENT_REQUEST_INVALID; BAN_ALREADY_LIFTED is walked by `alreadyLifted`)
# Gender separation is given and does not touch this flow: no seat is decided here.

needs:
  - id: lift-with-a-reason
    need: >-
      The başmüderris lifts an open ban of her medrese with a reason. The ban moves to Kaldırılan with her name and the reason,
      the person's access comes back, and only the kademe that placed the ban, or a higher one, may do it.
    evidence:
      - state: listed
      - node: liftButton
      - node: liftDialog
      - state: form
      - state: formReady
      - state: lifting
      - node: toastLifted
      - state: settled
      - node: tabActiveCount
      - node: tabLiftedCount
      - source: apps/tedrisat/src/ban/ban.controller.ts:195
      - source: apps/nazar/features/bans/components/reason-dialog.tsx:70
      - test: apps/nazar/e2e/bans.e2e.ts
        name: "nazir/11 — 'Yasağı kaldır' wants a reason, lifts the ban, and moves it to Kaldırılan (criterion 4)"
      - scenario: decides
      - scenario: wide

  - id: widen-to-the-medrese
    need: >-
      She widens an open course ban to the whole medrese with a reason of its own: a second, medrese-wide ban is made and the
      course ban stays; the person cannot reach or apply to any course of the medrese; a person already barred from the medrese
      gets that ban back, and the row of the widened ban no longer offers the widening.
    evidence:
      - state: listed
      - node: widenButton
      - node: escalateDialog
      - state: form
      - state: formReady
      - state: escalating
      - node: toastWidened
      - state: settled
      - source: apps/tedrisat/src/ban/ban.controller.ts:218
      - source: apps/nazar/features/bans/components/reason-dialog.tsx:70
      - test: apps/nazar/e2e/bans.e2e.ts
        name: "nazir/11 — 'Medreseden de yasakla' widens the course ban to the whole medrese, and the course ban stays (criterion 3)"
      - scenario: decides
      - scenario: medaris
    note: Also drawn as the assertion a-medrese-wide-ban-is-not-widened.

  - id: a-row-offers-what-its-kademe-reaches
    need: >-
      A row offers only the decisions the caller's kademe reaches: the lift where hers reaches the ban's, the widening on an open
      course ban whose person is not barred from the medrese yet, the request on an open ban placed below Medaris with no request
      yet; and a ban she cannot lift says who can ("yalnız Medaris yönetimi", "yalnız onu koyan kademe ya da üstü").
    evidence:
      - state: listed
      - node: liftButton
      - node: widenButton
      - node: requestButton
      - node: rowNote
      - node: bannedByAdmin
      - source: apps/tedrisat/src/ban/madrasah-ban.controller.ts:70
      - source: apps/nazar/features/bans/bans.ts:127
      - test: apps/nazar/e2e/bans.e2e.ts
        name: "nazir/11 — a row offers the actions of its kademe, and a Medaris nazımı's ban only widens, with the note (criteria 2, 5)"
      - scenario: medaris
      - scenario: wide
    note: >-
      Also drawn as the guard mayLift, the guard mayWiden, the guard mayRequest, the assertion
      a-dialog-is-opened-for-what-the-row-offers, the assertion a-ban-medaris-placed-is-not-lifted-here.

  - id: ask-medaris-for-a-permanent-ban
    need: >-
      She asks Medaris administration to make a ban permanent, with a reason: one request per ban, the ban stands as it was
      meanwhile, the row says a request is waiting and offers no second one.
    evidence:
      - state: listed
      - node: requestButton
      - node: permanentDialog
      - state: form
      - state: formReady
      - state: requesting
      - node: toastRequested
      - node: permanentBadge
      - state: settled
      - source: apps/tedrisat/src/ban/ban.controller.ts:243
      - source: apps/nazar/features/bans/components/reason-dialog.tsx:70
      - test: apps/nazar/e2e/bans.e2e.ts
        name: "nazir/11 — 'Kalıcı yasak talebi aç' records the request with the reason, and the row says it is waiting"
      - scenario: decides

  - id: a-permanent-request-is-answered
    need: >-
      Medaris administration is told of the request, reads the ban, who placed it and why, and accepts it (the account is disabled
      in Keycloak, MDRS-197) or rejects it with a note; the başmüderris sees the answer on the row. Until then the page does not
      say the request was passed on.
    missing: MDRS-140
    note: >-
      Drawn on the state requesting and on the nodes toastRequested, permanentBody and permanentBadge, which the code has: they
      are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: bans-reach-the-people-above
    need: >-
      Every ban, at course, köşk, medrese or platform level, is shown to the people above its level when it is placed (the köşk
      nazım, Medaris administration), always with its reason (P-01). A medrese-wide ban placed or widened here reaches the köşk
      nazımları and the Medaris nazımları too; today only a course ban and a köşk ban announce themselves (createMadrasahBan and
      escalateBan notify no one).
    missing: MDRS-113
    note: >-
      Drawn on the states listed and escalating, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).

  - id: every-moved-code-is-told
    need: >-
      When the ban was decided by someone else meanwhile (lifted, gone, cannot be widened, already asked for), the person is told
      the list has moved, the dialog closes and the list is read again; none of the five codes is drawn as an error to retry.
    evidence:
      - state: lifting
      - state: escalating
      - state: requesting
      - node: toastMoved
      - state: settled
      - source: apps/nazar/features/bans/bans.ts:373
      - source: apps/nazar/features/bans/components/reason-dialog.tsx:87

  - id: a-ban-already-lifted-is-told
    need: >-
      A lift, a widening or a request on a ban someone lifted first is told in words ("Bu yasak zaten kaldırılmış; liste
      yenilendi.") and changes nothing.
    evidence:
      - state: lifting
      - state: escalating
      - state: requesting
      - node: toastMoved
      - state: settled
      - source: apps/tedrisat/src/ban/ban.controller.ts:195
      - source: apps/tedrisat/src/ban/ban.controller.ts:218
      - source: apps/tedrisat/src/ban/ban.controller.ts:243
      - scenario: alreadyLifted
        binding: graphs/nazar/bans/decide/binding.moved.yaml

  - id: widen-refuses-a-person-who-runs-the-course
    need: >-
      A ban cannot be widened, to the köşk or to the medrese, over a person who runs the course or the medrese (müderris, ders
      nazırı, medrese nazırı, başmüderris, köşk nazımı, Medaris nazımı, the başnazım), as it cannot be placed over them; a refusal
      is BAN_TARGET_INVALID and the page words it already.
    missing: >-
      no Linear issue; finding ban-staff-check-gaps: escalateBan and extendBan never read the person's roles (ban.service.ts:515,
      :270)
    note: >-
      Drawn on the state escalating and on the nodes widenButton and toastWidened, which the code has: they are not evidence, so
      that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-hoca-is-not-named-over-an-open-ban
    need: >-
      A person an open ban bars from a course or a medrese is not named hoca, başmüderris, köşk nazım or Medaris nazım of it until
      the ban is lifted, as a ders nazırı and a medrese nazır are refused while barred (COURSE_NAZIR_BARRED,
      MADRASAH_NAZIR_BARRED); otherwise the ban can later be widened over a person who runs the course.
    missing: "no Linear issue; finding ban-staff-check-gaps: the müderris, başmüderris and nazım routes look at no ban"
    note: >-
      Drawn on the states listed and escalating, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).

  - id: an-empty-reason-is-told
    need: >-
      The reason is required, and a person who tries to send it empty is told so where they are, in a way a screen reader
      announces and with the focus on the field (F-B-6); today the submit is simply off and the message appears silently after the
      field is left.
    missing: F-B-6, no issue
    note: >-
      Drawn on the state form and on the nodes reasonRequired and liftSubmit, which the code has: they are not evidence, so that a
      replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: the-focus-follows-a-decision
    need: >-
      After a decision the focus lands on a place a keyboard or screen-reader user can use (the table's caption or the next row's
      button) and a line on the page, not only a toast, says what was decided and what the counts are now (F-B-9, F-B-4).
    missing: F-B-9, no issue
    note: >-
      Drawn on the state listed and on the nodes toastLifted, toastWidened, toastRequested and tabActiveCount, which the code has:
      they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-busy-dialog-can-be-left-or-says-it-cannot
    need: >-
      While a decision is on its way, Vazgeç, the close icon and Esc are off, or the dialog says it cannot be closed yet
      (BANDEC-1).
    missing: BANDEC-1, no issue
    note: >-
      Drawn on the states lifting, escalating and requesting and on the node busy, which the code has: they are not evidence, so
      that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).
