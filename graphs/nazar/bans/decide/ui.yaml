rules:
  - { id: ban-staff-check-gaps, rule: "SECURITY. Widening a ban never asks who the person is. escalateBan (apps/tedrisat/src/ban/ban.service.ts:515-557) and extendBan (:270-317) do not call rolesHeld, which createBan (:155) and createMadrasahBan (:486) call to refuse a person who runs the course or the medrese (RUNS_COURSE_ROLES, RUNS_MADRASAH_ROLES: ban-tier.ts:66-83) with 400 BAN_TARGET_INVALID. And naming a müderris, a başmüderris, a köşk nazım or a Medaris nazım never looks at open bans (only madrasah-nazir.service.ts:115 and course-nazir.service.ts:223 do, for a medrese nazır and a ders nazırı). So a ban placed on a talebe before they were named hoca stays open, shows 'Medreseden de yasakla', and the API bars the hoca from every course of the medrese; the page then says '{name} artık medresenin hiçbir dersine erişemez.' of a person who teaches. The same holds for a person named köşk nazım or Medaris nazım after the course ban: it can be widened over them. Two smaller faults of the same invariant: createMadrasahBan passes koskId and courseId null for a medrese-wide ban (ban.service.ts:463-467), so a hoca (a course role) or a köşk nazım (a köşk role) is not found there either and can be barred from the whole medrese at once, and nazar.bans.ban's page offers exactly that; and SYSTEM_ADMIN is a realm role that rolesHeld never reads (ban.repository.ts:273), so the başnazım can be barred from a course and then widened. Read from the code, not run; the scenario `staff` of the binding is the walk. Fix: run rolesHeld in escalate and extend and refuse with BAN_TARGET_INVALID (the page words it already: Bans.errors.BAN_TARGET_INVALID), read every scope for a medrese-wide ban, and refuse to name a hoca who is barred." }
  - { id: BANDEC-4, rule: "HONESTY (MDRS-140, MDRS-194). 'Kalıcı yasak talebi aç' writes a ban_permanent_requests row and an audit row and nothing else: no notification, no route that lists or decides the request (domain ban-permanent-request-is-decided holds: false), and nizam's menu entry '/talepler/kalici-yasak' has no page. Yet the dialog says 'Talep Medaris yönetimine gider.' and the toast 'Talep Medaris yönetimine iletildi; karar verilene kadar yasak sürer.' (reason-dialog.tsx:102, nazar.json Reasons.permanent). The start of nizam.moderation.decidePermanentBan drawn from this flow is the planned half; today the request waits for nobody. Fix: say it is only recorded until the deciding page exists, or hide the action." }
  - { id: BANDEC-1, rule: "While the call runs (`pending`) Vazgeç, the close icon and Esc do nothing (onOpenChange ignores a close while pending, reason-dialog.tsx:107-109) and they stay on, drawn as usable; the textarea is disabled, so the focus leaves it (reason-dialog.tsx:173). Nothing says the dialog cannot be closed. The same shape as F-W3-open-2 in nizam. Fix: disable the three while pending, or give the call a way to be abandoned." }
  - { id: BANDEC-3, rule: "SECURITY, on the way in. createMadrasahBan reads the person's roles with koskId and courseId null when the ban is medrese-wide (apps/tedrisat/src/ban/ban.service.ts:463-467, :486), so rolesHeld finds only a platform role and a role of this medrese: a hoca (MUDERRIS, a course role), a ders nazırı and a köşk nazım (a köşk role) are not found, though RUNS_MADRASAH_ROLES lists them, and a medrese-wide ban can be placed on them at once; the page that places it (nazar.bans.ban, 'Medrese düzeyi') offers it. The e2e ban-catalogue.e2e.spec.ts:796-820 tries each of those roles only for a COURSE ban. Read from the code, not run. Fix: read the roles of every scope of the medrese for a medrese-wide ban." }
  - { id: BANDEC-2, rule: "banErrorKey maps BAN_FORBIDDEN to 'Bu yasağı koymak için yetkiniz yok.' (bans.ts:356, nazar.json Bans.errors.BAN_FORBIDDEN) for every decision; for the permanent request the API's own refusal is 'You may not ask for a permanent ban' (ban.service.ts:589), so a başmüderris who lost the code reads that she may not 'place' a ban when she asked for a request. Fix: a key of its own for the request and the widening." }
  - { id: F-B-2, rule: "The submit passes no loadingLabel, so its hidden status says 'Yükleniyor' from the kit's hard-coded default (libs/ui/src/mds/button.tsx:62, reason-dialog.tsx:119), outside the catalog, the same word for every action." }
  - { id: F-B-4, rule: "A decision changes the rows and the two tab counts with no announcement: the table's aria-busy is not spoken and the counts are plain spans (bans-table.tsx:233-246). The only word is the toast." }
  - { id: F-B-6, rule: "The submit is natively disabled while the reason is blank, so the only way to meet 'Bir gerekçe yazın.' is to leave the empty field, and then it is plain text under it (Field.Error has no role), the focus is not moved (reason-dialog.tsx:160-177). Fix: leave the submit on and let it show the error and move the focus to the field, or make the error role=alert." }
  - { id: F-B-9, rule: "After a decision the page closes the dialog and reads the list again, so the row's opener (the lift, the widening or the request button) is gone or has moved to another tab; Base UI's return of the focus has no element and it falls to the page (reason-dialog.tsx:78-79, bans-table.tsx:77). The graph draws no focus after a decision and only the cancel path returns it. Not verified in a browser. Fix: move the focus to the table's caption or the next row's button after a decision." }
  - { id: F-B-12, rule: "The whole body of the dialog (the person, the summary, the sentence and the field) is its aria-describedby (libs/ui/src/mds/dialog.tsx:107-116), so a screen reader may read all of it on opening. Not verified how it is read." }
  - { id: F-B-13, rule: "A refused caller (a nazır with no grant) meets a page titled 'Yasaklamalar' with a polite status 'Bu sayfaya izniniz yok' that is not a heading and has no link out (page-problem.tsx:23-29). The nazır's whole story is nazar.access.medreseNazirRefused." }
  - { id: error-toast-stays, rule: "An error toast (every refusal here) stays until closed, so a second decision in the same visit can leave the first one's error on the screen beside the second's; the graph draws the last (`last`). A success toast closes after 6 seconds. A moved refusal also closes the dialog, so the person reads the reason of a list that has already changed." }
  - { id: label-in-name, rule: "A row button's visible text is contained in its accessible name: 'Yasağı kaldır' in 'Yasağı kaldır: {name}', 'Medreseden de yasakla' in 'Medreseden de yasakla: {name}', 'Kalıcı yasak talebi aç' in 'Kalıcı yasak talebi aç: {name}' (WCAG 2.5.3). Holds." }
  - { id: reason-never-reaches-the-talebe, rule: "The reason of a ban, of its lift and of the request is read by those who list and lift bans, never by the talebe, who is told only 'erişimin kaldırıldı' when a widening bars a seat of theirs, and nothing when a ban is lifted (liftBan sends no notification). Holds; the help lines of the three fields say so." }
