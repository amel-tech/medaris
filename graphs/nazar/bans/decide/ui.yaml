# The screens of nazar.bans.decide: Yasaklamalar of a medrese (/medrese/<id>/yasaklamalar) with the actions of its rows, the reason
# dialog in its three kinds (lift, widen to the medrese, ask for a permanent ban) and the toasts of a decision. Read from
# apps/nazar/features/bans/components/{bans-page,bans-table,reason-dialog}.tsx and bans.ts; the words are copied from
# libs/i18n/src/locales/tr/nazar.json by <scratchpad>/bansdecide-probe/catalog.mjs.
#
# Authored, not copied: `Changes.note`, the one message of this catalog no app message stands for (nothing in the app says what a
# decision on a ban changes).
# Composed in code, in no i18n file (each named by its line):
#   composed.Bans.count           tabs.tsx:29-36 and :67 (the count, formatted by Intl, in a <span> inside the tab link)
#   composed.Button.loading       libs/ui/src/mds/button.tsx:62 (the default loadingLabel of a busy Button, F-B-2)
#   composed.Reasons.person       reason-dialog.tsx:128 (the person's name); composed.Reasons.email :131 (their address)
#   composed.Reasons.eyebrow      reason-dialog.tsx:112 (the medrese's name over the dialog's title)
#   composed.Reasons.summary*     bans.ts:253-257 (the three values of the summary list: scope, who and when, the reason)
# Where a node says "repeat", the page draws it once per row; the replay finds the rows through the binding. The page behind a
# dialog is inert, so no page node is `in` a dialog state.
schema: delurio-graph/0
kind: ui
id: nazar.bans.decide
flow: nazar.bans.decide
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  name: Nazlı Talebe
  email: nazli.talebe@example.test
  course: Mantık Dersi
  madrasah: Örnek Medrese
  nameGenitive: Örnek Medrese’nin
  count: "2"
  role: Medrese başmüderrisi
  reason: Celselerde ders dışı reklam yaptı
  label: Ders
  detail: Mantık Dersi
  placer: Selim Hoca
  when: Dün

