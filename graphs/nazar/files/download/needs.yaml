schema: delurio-graph/0
kind: needs
id: nazar.files.download
status: proposed
summary: >-
  What must exist for a müderris, or a ders nazırı with the right permission, to download the files of a course in nazar-web (a
  talebe's hand-in, the stored files of the editor, the evaluation sheet): nazar.files.download. Each need is what the product
  must do, from the flow's story (FLOWS.md) and the findings of the inventory; none is read off what the page does today.
  planned.md names no feature of this flow.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# Missing (no code): download-the-evaluation-sheet (none: evaluation-export-invalid-path), refusal-says-why-on-every-page (none: NFILES-1, F-D1-13),
# refusal-keeps-what-i-was-doing (none: NFILES-2), success-is-confirmed (none: NFILES-3),
# a-download-is-walked-to-its-end (none: the local stack has no file storage)
# Unwalked (code, and no web e2e and no replay that gets there): download-a-talebes-file and download-the-courses-stored-files (a file served needs storage;
# only unit specs and tedrisat's API e2e read it), staff-read-of-a-handin-is-on-the-record (the audit row is written after the storage
# check, so a stack with no storage never writes it; tedrisat's API e2e reads it), session-over-goes-to-sign-in-and-back (the redirect
# is read with curl as a visitor; the walk cannot end the browser's session)
#
# `walked` names an e2e check as `file#n` where the inventory numbers it. The web e2e has NO check of a file (apps/nazar/e2e has no `fileError`, no
# /api/files and no evaluation-download); tedrisat's API e2e has no inventory number for these and is named by its test title and line. A `replay:` names a
# scenario of binding.yaml or binding.forbidden.yaml as it is BOUND: none was run in this phase, so the walk phase confirms each or takes it off. The unit specs
# that pin the pieces are apps/nazar/test/file-routes.spec.ts (the four downloads of Ödevler and Müfredat; NOT the sheet's route and NOT the review file's),
# test/homework.spec.tsx:306-330 (the toast, once, and the parameter taken off), test/evaluation.spec.tsx:460-474 (the sheet link's address only),
# test/files.spec.ts and libs/services/test/file-proxy.spec.ts.

needs:
  - id: download-a-talebes-file
    need: >-
      A person who holds `submission.read` in the course (the müderris, the köşk's nazım, the başnazım, a ders nazırı who was
      given it) downloads a file a talebe handed in, from the table of Ödevler, saved as an attachment under its own name,
      whatever its type says it is; the page stays where it is. The type and the size are on the row before it is pressed. Nobody
      else is offered the link.
    evidence:
      - state: homeworkListed
      - node: submissionFileRow
      - node: submissionFileType
      - node: submissionFileSize
      - state: followingSubmissionFile
      - source: "apps/nazar/app/api/files/courses/[courseId]/submissions/[fileId]/route.ts:12"
      - source: apps/nazar/features/homework/components/homework-list.tsx:126
      - test: apps/tedrisat/test/e2e/lesson-submissions.e2e.spec.ts
    note: |-
      lesson-submissions.e2e.spec.ts lets the müderris, the köşk nazımı and the başnazım download, each on the record (:400, the
      API, not the web)
      lesson-submissions.e2e.spec.ts refuses staff without submission.read, until a ders nazırı is given it (:419, the API, not
      the web)

  - id: download-the-courses-stored-files
    need: >-
      A person who may edit the course, or manage a celse, opens from Müfredat the stored files of the course's resources, of a
      celse's resources and of a celse's homework, each saved as an attachment under its own name; the page stays where it is. A
      person who may not read the course's content is offered none (the page does not open for them).
    evidence:
      - state: curriculumListed
      - state: lessonOpened
      - node: courseFileRow
      - node: lessonFileRow
      - node: assignmentFileRow
      - state: followingCourseFile
      - state: followingLessonFile
      - state: followingAssignmentFile
      - source: "apps/tedris/app/api/files/courses/[courseId]/resources/[resourceId]/route.ts:11"
      - source: "apps/tedris/app/api/files/lessons/[lessonId]/resources/[resourceId]/route.ts:10"
      - source: "apps/tedris/app/api/files/lessons/[lessonId]/assignment/[fileId]/route.ts:11"
      - source: apps/nazar/features/curriculum/components/resources-editor.tsx:195
      - source: apps/nazar/features/curriculum/components/lesson-resources-editor.tsx:208
      - source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:342
      - test: apps/tedrisat/test/e2e/resource-files.e2e.spec.ts
      - test: apps/tedrisat/test/e2e/lesson-assignments.e2e.spec.ts
    note: |-
      resource-files.e2e.spec.ts streams it to the enrolled talebe and the course team as an attachment, with the headers that
      keep it one (:353, the API, not the web)
      lesson-assignments.e2e.spec.ts are uploaded under the homework, never as a resource, and served to a content reader as an
      attachment (:251, the API, not the web)

  - id: download-the-evaluation-sheet
    need: >-
      The course team downloads the evaluation board as a spreadsheet from Değerlendirme ("Excel indir"), saved as an .xlsx whose
      headers and words follow the viewer's language, and only a person who may manage the course's celses can.
    missing: >-
      no Linear issue; evaluation-export-invalid-path: tedrisat serves the sheet (apps/tedrisat/test/e2e/exams.e2e.spec.ts:497
      downloads it and reads its zip header) and the page offers the link, but the web route between them is refused by the file
      proxy's own path check on every call
    note: >-
      Drawn on the states evaluationListed, exportingBoard and evaluationRefused and on the node exportLink, which the code has:
      they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: refusal-says-why-on-the-page
    need: >-
      When a download is refused the person is brought back to the page they were on and told, once and in words, why: they may
      not download it, it is gone, files cannot be reached now and should be tried again later, or something went wrong. The
      address is cleaned, so a reload or a copied link does not say it again, and the notice stays until the person closes it and
      is announced as an error.
    evidence:
      - state: onThePage
      - state: homeworkListed
      - state: curriculumListed
      - state: lessonOpened
      - state: homeworkForbidden
      - node: fileErrorToast
      - node: reasonForbidden
      - node: reasonNotFound
      - node: reasonUnavailable
      - node: reasonFailed
      - node: toastClose
      - source: libs/services/src/file-proxy/file-proxy.ts:351
      - source: apps/nazar/features/files/components/file-error-notice.tsx:19
      - test: apps/nazar/test/homework.spec.tsx
      - scenario: homeworkUnavailable
      - scenario: curriculumUnavailable
      - scenario: homeworkForbidden
        binding: graphs/nazar/files/download/binding.forbidden.yaml
    note: >-
      homework.spec.tsx says why a file could not be downloaded, once, and takes ?fileError= off the address (:319, a unit spec)

  - id: refusal-says-why-on-every-page
    need: >-
      Whatever page a file link is on, a refused download is worded there, and the address does not keep the reason: Müfredat when
      the person's permission has gone since the page was drawn, as Ödevler does, and Değerlendirme once its sheet can be
      downloaded at all.
    missing: no Linear issue; NFILES-1, F-D1-13
    note: >-
      Drawn on the states curriculumForbidden and evaluationRefused, which the code has: they are not evidence, so that a replay
      still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: refusal-keeps-what-i-was-doing
    need: >-
      A refused download does not reload the page: the focus, the editor's unsaved edits, the celse details that were open and the
      note typed in a review dialog stay as they were, and the reason is said in the page.
    missing: no Linear issue; NFILES-2 (WRT-10 of tedris)
    note: >-
      Drawn on the states onThePage, curriculumListed, lessonOpened and homeworkListed, which the code has: they are not evidence,
      so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: success-is-confirmed
    need: >-
      A person who presses a file's link is told on the page that the download started and, where the browser leaves it to the
      page, which file it is.
    missing: no Linear issue; NFILES-3 (FILES-2 of tedris)
    note: >-
      Drawn on the state onThePage, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).

  - id: staff-read-of-a-handin-is-on-the-record
    need: >-
      A download of a talebe's hand-in by the course team is written to the audit log before the first byte is sent, with the
      course, the celse, the talebe and the file, so that what staff read of a talebe's work can be answered for; a failed write
      fails the download.
    evidence:
      - state: followingSubmissionFile
      - source: apps/tedrisat/src/lesson-submission/lesson-submission.controller.ts:318
      - source: apps/tedrisat/src/lesson-submission/lesson-submission.service.ts:290
      - test: apps/tedrisat/test/e2e/lesson-submissions.e2e.spec.ts
    note: >-
      lesson-submissions.e2e.spec.ts lets the müderris, the köşk nazımı and the başnazım download, each on the record (:400, the
      API, not the web)

  - id: session-over-goes-to-sign-in-and-back
    need: >-
      A person whose session has ended, or whose token tedrisat refused, who follows a file link is sent to sign in and comes back
      to the page they were on, and is not shown a JSON body or a blank page.
    evidence:
      - state: sent_to_sign_in
      - source: libs/services/src/file-proxy/file-proxy.ts:360

  - id: address-with-no-page-explains-itself
    need: >-
      A file address opened with no page of the app behind it (pasted into a tab, sent in a mail) answers a sentence in the three
      languages and the refusal's own status, not JSON; a visitor is sent to sign in.
    evidence:
      - state: followingSubmissionFile
      - state: followingLessonFile
      - state: exportingBoard
      - state: sent_to_sign_in
      - source: libs/services/src/file-proxy/file-proxy.ts:328
      - scenario: homeworkUnavailable
      - scenario: evaluationExport

  - id: a-download-is-walked-to-its-end
    need: >-
      The local stack has file storage, so that a download is walked to its end (the file saved under its name, with the headers
      that keep it an attachment) and not only to the refusal that no storage gives.
    missing: no Linear issue; the local stack has no file storage
    note: >-
      Drawn on the states followingSubmissionFile, followingCourseFile, followingLessonFile and followingAssignmentFile, which the
      code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).
