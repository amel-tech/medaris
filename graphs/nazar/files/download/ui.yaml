  homeworkTitle: { type: text, component: Heading, role: heading, text: { key: Homework.title }, in: [homeworkListed, homeworkForbidden], source: apps/nazar/features/homework/components/homework-page.tsx:57 } # h1
  celseRegion: { type: page, component: Page, role: region, name: { labelledBy: celseHeading }, in: [homeworkListed], source: apps/nazar/features/homework/components/homework-list.tsx:188 } # <section aria-labelledby>, one per celse that has homework or hand-ins; the walk's course has one celse
  celseHeading: { type: text, component: Heading, role: heading, text: { key: Homework.sessionHeading, params: { week: week, title: title } }, in: [homeworkListed], source: apps/nazar/features/homework/components/homework-list.tsx:195 } # h2
  submissionsTable: { type: list, component: List, role: table, name: { key: Homework.caption, params: { session: session } }, in: [homeworkListed], source: apps/nazar/features/homework/components/homework-list.tsx:246 } # the caption is hidden; the table's first column is the talebe, the second "Dosyalar"
  submissionFilesList: { type: list, component: List, role: list, name: { key: Homework.filesOf, params: { name: studentName } }, in: [homeworkListed], source: apps/nazar/features/homework/components/homework-list.tsx:117 } # <ul aria-label>, one per row that has files
  submissionFileRow: { type: action, component: LinkButton, role: link, name: { key: Files.downloadLabel, params: { name: submissionFileName } }, text: { key: composed.Files.fileName, params: { name: submissionFileName } }, in: [homeworkListed], emits: DOWNLOAD_SUBMISSION_FILE, source: apps/nazar/features/files/components/file-link.tsx:34 } # <a class="mds-link" href="/api/files/courses/<course>/submissions/<file>"> with NO download attribute, the name only
  submissionFileType: { type: text, component: Text, text: { key: Files.kinds.pdf }, in: [homeworkListed], source: apps/nazar/features/files/components/file-link.tsx:44 } # an outline Badge beside the link, not inside it
  submissionFileSize: { type: text, component: Text, text: { key: composed.Files.size, params: { size: submissionFileSize } }, in: [homeworkListed], source: apps/nazar/features/files/components/file-link.tsx:45 }

  # ---- Müfredat: the stored files of the editor ----
  curriculumPage: { type: page, component: Page, role: main, in: [curriculumListed, lessonOpened, curriculumForbidden], source: libs/ui/src/mds/app-shell.tsx:41 } # no name, no initial focus (rule focus-not-set)
  curriculumTitle: { type: text, component: Heading, role: heading, text: { key: Curriculum.title }, in: [curriculumListed, lessonOpened, curriculumForbidden], source: apps/nazar/features/curriculum/components/curriculum-editor.tsx:327 } # h1; the refusal page draws the same title (curriculum-page.tsx:48)
  resourcesRegion: { type: page, component: Page, role: region, name: { labelledBy: resourcesTitle }, in: [curriculumListed, lessonOpened], source: apps/nazar/features/curriculum/components/resources-editor.tsx:116 } # <section aria-labelledby="c-resources" data-testid="resources">
  resourcesTitle: { type: text, component: Heading, role: heading, text: { key: Curriculum.resourcesTitle }, in: [curriculumListed, lessonOpened], source: apps/nazar/features/curriculum/components/resources-editor.tsx:122 } # h2
  courseFileRow: { type: action, component: LinkButton, role: link, name: { key: Files.downloadLabel, params: { name: courseFileName } }, text: { key: composed.Files.fileName, params: { name: courseFileName } }, in: [curriculumListed, lessonOpened], emits: DOWNLOAD_COURSE_FILE, source: apps/nazar/features/curriculum/components/resources-editor.tsx:195 } # to /api/files/courses/<course>/resources/<resource>; the resource's own name is in a "Kaynak adı" field above it, not here
  courseFileType: { type: text, component: Text, text: { key: Files.kinds.pdf }, in: [curriculumListed, lessonOpened], source: apps/nazar/features/files/components/file-link.tsx:44 }
  courseFileSize: { type: text, component: Text, text: { key: composed.Files.size, params: { size: courseFileSize } }, in: [curriculumListed, lessonOpened], source: apps/nazar/features/files/components/file-link.tsx:45 }
  detailsToggle: { type: action, component: Button, role: button, text: { key: Curriculum.detailsShow }, in: [curriculumListed], emits: OPEN_DETAILS, source: apps/nazar/features/curriculum/components/curriculum-editor.tsx:744 } # a ghost button with a chevron, aria-expanded false; the celse's details are in the page but hidden (the walk's course has one celse)
  detailsHide: { type: action, component: Button, role: button, text: { key: Curriculum.detailsHide }, in: [lessonOpened], emits: HIDE_DETAILS, source: apps/nazar/features/curriculum/components/curriculum-editor.tsx:744 } # the same button, aria-expanded true; no catalog message names both states, so it is two nodes
  lessonResourcesGroup: { type: page, component: Page, role: group, name: { labelledBy: lessonResourcesLegend }, in: [lessonOpened], source: apps/nazar/features/curriculum/components/lesson-resources-editor.tsx:92 } # a <fieldset>
  lessonResourcesLegend: { type: text, component: Text, text: { key: Curriculum.lessonResourcesTitle }, in: [lessonOpened], source: apps/nazar/features/curriculum/components/lesson-resources-editor.tsx:93 } # a <legend>, not a heading
  lessonFileRow: { type: action, component: LinkButton, role: link, name: { key: Files.downloadLabel, params: { name: lessonFileName } }, text: { key: composed.Files.fileName, params: { name: lessonFileName } }, in: [lessonOpened], emits: DOWNLOAD_LESSON_FILE, source: apps/nazar/features/curriculum/components/lesson-resources-editor.tsx:208 } # to /api/files/lessons/<celse>/resources/<resource>
  lessonFileType: { type: text, component: Text, text: { key: Files.kinds.pdf }, in: [lessonOpened], source: apps/nazar/features/files/components/file-link.tsx:44 }
  lessonFileSize: { type: text, component: Text, text: { key: composed.Files.size, params: { size: lessonFileSize } }, in: [lessonOpened], source: apps/nazar/features/files/components/file-link.tsx:45 }
  assignmentGroup: { type: page, component: Page, role: group, name: { labelledBy: assignmentLegend }, in: [lessonOpened], source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:201 } # a <fieldset>
  assignmentLegend: { type: text, component: Text, text: { key: Curriculum.assignmentTitle }, in: [lessonOpened], source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:202 } # a <legend> with a note icon
  assignmentFilesTitle: { type: text, component: Heading, role: heading, text: { key: Curriculum.assignmentFilesTitle }, in: [lessonOpened], source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:325 } # h4, under the homework's switch, kind and description
  assignmentFileRow: { type: action, component: LinkButton, role: link, name: { key: Files.downloadLabel, params: { name: assignmentFileName } }, text: { key: composed.Files.fileName, params: { name: assignmentFileName } }, in: [lessonOpened], emits: DOWNLOAD_ASSIGNMENT_FILE, source: apps/nazar/features/curriculum/components/lesson-assignment-editor.tsx:342 } # to /api/files/lessons/<celse>/assignment/<file>
  assignmentFileType: { type: text, component: Text, text: { key: Files.kinds.pdf }, in: [lessonOpened], source: apps/nazar/features/files/components/file-link.tsx:44 }
  assignmentFileSize: { type: text, component: Text, text: { key: composed.Files.size, params: { size: assignmentFileSize } }, in: [lessonOpened], source: apps/nazar/features/files/components/file-link.tsx:45 }

  # ---- Değerlendirme: "Excel indir" ----
  evaluationPage: { type: page, component: Page, role: main, in: [evaluationListed, evaluationRefused], source: libs/ui/src/mds/app-shell.tsx:41 } # no name, no initial focus (rule focus-not-set); the same page before and after the refusal
  evaluationTitle: { type: text, component: Heading, role: heading, text: { key: Evaluation.title }, in: [evaluationListed, evaluationRefused], source: apps/nazar/features/evaluation/components/evaluation-page.tsx:41 } # h1
  exportLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Evaluation.download }, in: [evaluationListed, evaluationRefused], emits: EXPORT_BOARD, source: apps/nazar/features/evaluation/components/evaluation-board.tsx:303 } # <a class="mds-btn" href="/api/files/courses/<course>/evaluations"> with a download icon, drawn only when the board has a column and a talebe; it never delivers a file (evaluation-export-invalid-path)
  boardTable: { type: list, component: List, role: table, name: { key: Evaluation.caption }, in: [evaluationListed, evaluationRefused], source: apps/nazar/features/evaluation/components/evaluation-board.tsx:313 } # the overview's hidden caption

  # ---- the refusal page: a permission that is gone ----
  forbiddenAlert: { type: alert, component: Alert, role: status, name: { key: Problems.forbiddenTitle }, text: { key: Problems.forbidden }, in: [homeworkForbidden, curriculumForbidden], source: apps/nazar/features/shell/components/page-problem.tsx:23 } # a neutral Alert is a status, not an alert

  # ---- the toast of a refused download: an error toast, so an alertdialog that stays until it is closed ----
  fileErrorToast: { type: alert, component: Alert, role: alertdialog, name: { key: Files.downloadErrors.title }, in: [homeworkListed, homeworkForbidden, curriculumListed, lessonOpened], when: noticed, source: apps/nazar/features/files/components/file-error-notice.tsx:30 } # id "file-error": a second refusal replaces the first; raised after the page is hydrated
  reasonForbidden: { type: text, component: Text, text: { key: Files.downloadErrors.forbidden }, in: [homeworkListed, homeworkForbidden, curriculumListed, lessonOpened], when: "notice == 'forbidden'", source: apps/nazar/features/files/components/file-error-notice.tsx:34 }
