# The screens of nazar.files.download: the file links of three pages of a course in nazar-web (Ödevler, Müfredat, Değerlendirme), the refusal page of
# a person whose permission is gone, and the toast of a refused download. They are the table of Ödevler (features/homework/components/homework-list.tsx),
# the editor of Müfredat (features/curriculum/components: resources-editor.tsx, lesson-resources-editor.tsx, lesson-assignment-editor.tsx, and the button
# that unfolds a celse's details in curriculum-editor.tsx), the overview of Değerlendirme (features/evaluation/components/evaluation-board.tsx) and the
# kit's toast that FileErrorNotice raises (features/files/components/file-error-notice.tsx; libs/ui/src/mds/toast.tsx). Everything else on those pages is
# another flow's (flow.yaml scope.outOfView). Nothing here was seen in a browser; it is read from the code.
#
# Words: every key that does not start with `composed.` is copied from libs/i18n/src/locales/tr/nazar.json (the app reads it as `nazar.<key>`), the key
# being the path inside it. The `composed.*` keys are NOT in any i18n file: they are what the code writes from a file's own data.
#   composed.Files.fileName   the stored file's own name, the visible text of its link (a <bdi>)                              file-link.tsx:39
#   composed.Files.size       the size as formatFileSize gives it in the page's language ("20 kB"), a caption beside the link   file-link.tsx:45
# The accessible name of a file link is Files.downloadLabel ("{name} dosyasını indir"), set by aria-label; its visible text is only the file's name, so
# the visible text is part of the name (WCAG 2.5.3 holds). The type chip ("PDF", Files.kinds.pdf) and the size are NOT inside the link.
# The toast is the kit's own (libs/ui/src/mds/toast.tsx, Base UI): an error toast has `priority: high`, so Base UI draws it as role alertdialog, and it
# stays until it is closed. Its close button is named by a hard-coded aria-label "Kapat" (toast.tsx:97), not by the catalog, so the node's name is a literal.
# `changes` is not written: the flow only reads (no writing action of the domain is invoked); the one write a download makes, the audit row of a staff's
# read of a hand-in, is tedrisat's own and never reached on a stack with no storage.
# Samples are invented and neutral; the binding's data script (files-data.mjs) names the walk's own files and course with these very words, so that the
# replay compares the page against them. The talebe's name is the stack's own spare account (STACK.md).
schema: delurio-graph/0
kind: ui
id: nazar.files.download
flow: nazar.files.download
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples:
  # the catalog's own placeholders (a node's `params` maps them to the specific values below)
  name: teslim-odevi.pdf
  size: 20 kB
  week: "1"
  title: Celse 1
  session: Hafta 1 · Celse 1
  studentName: Tahsin Başvuran
  submissionFileName: teslim-odevi.pdf
  submissionFileSize: 20 kB
  courseFileName: kaynak-listesi.pdf
  courseFileSize: 12 kB
  lessonFileName: celse-notlari.pdf
  lessonFileSize: 24 kB
  assignmentFileName: odev-kagidi.pdf
  assignmentFileSize: 36 kB

