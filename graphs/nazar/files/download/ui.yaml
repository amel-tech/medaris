edges:
  - { labelledBy: [celseRegion, celseHeading] }
  - { labelledBy: [resourcesRegion, resourcesTitle] }
  - { labelledBy: [lessonResourcesGroup, lessonResourcesLegend] }
  - { labelledBy: [assignmentGroup, assignmentLegend] }
  - { triggers: [submissionFileRow, followingSubmissionFile] }
  - { triggers: [courseFileRow, followingCourseFile] }
  - { triggers: [lessonFileRow, followingLessonFile] }
  - { triggers: [assignmentFileRow, followingAssignmentFile] }
  - { triggers: [exportLink, exportingBoard] }

rules:
  - { id: evaluation-export-invalid-path, rule: "\"Excel indir\" is answered 400 INVALID_PATH on every press, and tedrisat is never called: the route asks the proxy for /courses/<id>/evaluations/export?lang=<lang> (app/api/files/courses/[courseId]/evaluations/route.ts:24) and isProxiablePath refuses any path with a `?` (libs/services/src/file-proxy/file-proxy.ts:106-112, :144-146), before the token is looked at. SEEN on the running stack with curl and no session: a followed link is a 303 to /ders/<id>/degerlendirme?fileError=notFound, a fetch() is 400 {\"code\":\"INVALID_PATH\"}. No test of the web route downloads the sheet (test/evaluation.spec.tsx:460 pins only the link's address; test/file-routes.spec.ts has no case for the route; tedrisat's own e2e, exams.e2e.spec.ts:497, downloads it from the API with the query). The domain records it as the invariant web-every-file-route-builds-a-proxiable-path. Fix: let the proxy take a query the route builds from a fixed list, or send the language as a path segment, and add a spec that reaches the proxy for real. Not in the inventory's F list." }
  - { id: F-D1-13, rule: "A refused \"Excel indir\" is silent: Değerlendirme mounts no FileErrorNotice (evaluation-page.tsx has none; only curriculum-page.tsx:62 and homework-page.tsx:55 do), so the page loads again with nothing to say why and ?fileError=notFound stays in the address. Once the path is fixed the fix is to mount the notice; until then it would say \"Bu dosya artık yok.\" for a file nobody asked for. Fix: mount <FileErrorNotice /> in EvaluationPage after fixing the path." }
  - { id: NFILES-1, rule: "A 403 on a file of Müfredat comes back to /ders/<id>/mufredat?fileError=forbidden, and by then the person holds none of course.edit, session.manage and week.hide, so CurriculumPage returns the refusal page before it reaches <FileErrorNotice /> (curriculum-page.tsx:44-55 against :62): no toast, and the parameter is never taken off the address, so a reload or a copied link carries it. Ödevler, which mounts the notice before its body (homework-page.tsx:55), words the same refusal. Read from the code; binding.forbidden.yaml makes it by taking the ders nazırı's grant away just before the link is followed. Fix: mount the notice above the gate, or in the course layout. Provisional id, not in the inventory." }
  - { id: NFILES-2, rule: "A refused download is a page navigation, so the whole page loads again: on Müfredat the editor is one long form and whatever was typed and not saved (a new week, a resource's name, a celse's date) is lost without a word, and the celse's details fold again; the page has no beforeunload guard (F-C-course-a-13). On Ödevler a review dialog that is open, with the note typed in it, goes the same way, because the dialog's own file links call the same route. The focus goes to the top. This is WRT-10 of tedris, with a longer form. Not verified in a browser with typed text; read from the code (file-proxy.ts:351-370). Fix: fetch the file and raise the toast from the click, which the proxy already supports (a fetch() gets the JSON refusal). Provisional id, not in the inventory." }
  - { id: NFILES-3, rule: "A download that works says nothing on the page: no toast, no status text, no focus move; the only sign is the browser's own saving, which a screen-reader user may not hear (the link has no download attribute on purpose, file-link.tsx:10-14). The same shape as FILES-2 of tedris. Not walked locally (no storage) and not verified with a screen reader. Fix: a line \"<dosya> indiriliyor\" in a role=status region, or a toast. Provisional id, not in the inventory." }
  - { id: F-D1-19, rule: "Named for this flow by FLOWS.md; the finding is the deck template's silent refusal (an empty 502 behind <a download>, app/api/decks/sample/route.ts:28-32), which belongs to nazar.decks.import. No state of this flow draws it." }
  - { id: F-C-course-a-14, rule: "Named for this flow by FLOWS.md; the finding is the upload panel's lost focus (file-upload.tsx:147-274), which belongs to nazar.curriculum.resources. No state of this flow draws it." }
  - { id: focus-not-set, rule: "Neither opening a page nor loading it again after a refusal moves the focus: no page sets an initial focus, the toast is not focused, and a 303 resets the focus to the document. The page nodes have no `initialFocus`; the silence is not read as an omission." }
  - { id: file-links-are-anchors, rule: "A file link is a plain anchor with no `download` attribute (file-link.tsx:10-14, 34-40): a download attribute would have the browser save whatever answers, the page a refusal redirects to included. It therefore works without JavaScript; only the toast of a refusal needs it. The sheet's link is an <a class=\"mds-btn\"> in the same way (button.tsx:117-124)." }
  - { id: label-in-name, rule: "A file link's visible text (the stored file's name) is contained in its accessible name (\"<name> dosyasını indir\", an aria-label): WCAG 2.5.3 holds. The type chip and the size are beside the link, so the name does not carry them. Holds." }
  - { id: error-toast-is-urgent, rule: "Unlike tedris's Sonner toast (DSC-20, CRS-13), this app's kit toast announces an error urgently (priority high, role alertdialog) and keeps it until it is closed, and its region is the kit's own. Holds. Its close button's name is a hard-coded \"Kapat\" (toast.tsx:97), not a catalog message, which the day the app gets en and ar will say Turkish." }
