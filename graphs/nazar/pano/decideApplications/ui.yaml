rules:
  - { id: F-A-2, rule: "After a decision the pressed button leaves with its row and no code moves the focus; the only word is a toast of 6 seconds (a keyboard or screen-reader user falls back to the top of the page). Fix: move focus to the table caption or the next row's button, and keep a status line." }
  - { id: F-A-9, rule: "'Düzenle' is documented as left out where the person holds no scope in the course, but `held` is built from the sessions it is checked against, so every celse row has it, and the link can lead to a course the person may not open." }
  - { id: F-A-10, rule: "No try/catch around the server action: when the call itself fails (the network), the busy state is never cleared and no toast is shown; React hands the error to the nearest boundary. Not verified in a browser." }
  - { id: F-A-11, rule: "A cancelled celse's note is `truncate`d, with the whole text only in `title`: sighted keyboard and touch users cannot read it. Not drawn in this graph (no celse is cancelled in the stack)." }
  - { id: F-A-14, rule: "A busy button passes no loadingLabel, so its hidden status says 'Yükleniyor' from a hard-coded default, outside the catalog." }
  - { id: F-A-15, rule: "The section ids are fixed strings shared across pages ('hosts-heading' is on the Pano and on Dersler); after a client navigation the previous page stays hidden in the DOM, so aria-labelledby may resolve to the hidden one. Not verified; the replay checks the four regions by name." }
  - { id: F-A-17, rule: "The greeting always says '{name} Hoca', also for a medrese nazır or the başnazım. Product wording, not an accessibility defect." }
  - { id: viewer-may-decide-skips-head, rule: "viewerMayDecide counts a müderris of the course, the köşk's nazım and the başnazım; it ignores the başmüderris although approveEnrollment and rejectEnrollment accept her (enrollment.decide), and ignores a grant to a nazır. The Pano lists rows she cannot act on and says nothing (apps/tedrisat/src/madrasah/portal/madrasah-portal.service.ts:93-97). The comment of approveApplication (actions.ts:9-13) still says she gets AUTHZ_FORBIDDEN. New finding (not in the inventory's F-A list); the domain carries it on getMadrasahDashboard." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Onayla' in 'Onayla: {name}', 'Reddet' in 'Reddet: {name}', 'Düzenle' in 'Düzenle: {title}' (WCAG 2.5.3). Holds." }
  - { id: confirm-before-rejecting, rule: "Reddet asks first, in an alertdialog whose focus starts on 'Vazgeç'; Onayla does not ask, because an approval gives a seat and a refusal cannot be taken back. A rejection takes no reason although the API would carry one." }
  - { id: toast-is-the-only-word, rule: "The result of a decision is said by a toast (a dialog in the 'Bildirimler' live region): it closes after 6 seconds for a success and an info notice, and stays for an error. Nothing on the page itself says what was decided." }
