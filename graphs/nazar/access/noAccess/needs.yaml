# What must exist for a person who holds no medrese and no course seat to open Nazar: nazar.access.noAccess, written on 15 Nov 2026 in
# the format of LAYOUT.md section 7. Each need is what the product must do, from the flow's story; none is read off what the page does
# today. Nothing here comes from planned.md: no planned feature (P-nn) names this page. Read by people for now: no checker runs on this file.
# No replay has run, so no `replay:` is named as walking anything; the e2e checks are the repository's own (apps/nazar/e2e is not run in CI).
#
# For the orchestrator's gaps merge (graphs/needs.gaps.yaml, flow nazar.access.noAccess):
#   missing:  chief-is-told-the-truth, chief-is-named-by-his-role, nazim-is-led-to-nizam, sign-out-asks-first   (all `none`: no Linear issue yet)
#   unwalked: failed-read-is-not-a-verdict   (the unit spec access.spec.tsx proves it; no e2e and no replay makes the API fail a read)
kind: needs
flow: nazar.access.noAccess
status: proposed

needs:
  - id: no-seat-is-told-so
    need: >-
      A signed-in person who holds no seat in a medrese or a course is told, in one sentence, that Nazar is the portal of medrese and course
      staff and that their account holds no such seat, and is shown the account they signed in with; they are not shown a menu or a scope
      picker for a portal they cannot use.
    drawn: [verdict, verdictTitle, verdictText, accountLine, accountEmail, sidebar, userName, roleStudent, roleKosk, rolePlatform, verdict-only-without-a-seat]
    built:
      - action: medaris.api:getMyAssignments
      - route: apps/nazar/features/access/no-access-page.tsx:17
      - route: apps/nazar/app/erisim-yok/page.tsx:24
    walked:
      - e2e: apps/nazar/e2e/access.e2e.ts
        check: 'access#1'
      - test: apps/nazar/test/access.spec.tsx

  - id: way-out-for-the-wrong-account
    need: >-
      A person who signed in with the wrong account, or who works elsewhere, is not left at a dead end: they can go back to Tedris and they
      can sign out, from the page itself.
    drawn: [backToTedris, signOut, tedris_opened, handed_over.sign_out]
    built:
      - route: apps/nazar/features/access/no-access-page.tsx:46
      - route: apps/nazar/features/account/components/sign-out-button.tsx:26
    walked:
      - e2e: apps/nazar/e2e/access.e2e.ts
        check: 'access#2'
      - test: apps/nazar/test/access.spec.tsx

  - id: seat-holder-is-sent-on
    need: >-
      A person who holds a seat never meets the no-access page: it sends them to their scope, and "/" reopens the scope they were last in.
    drawn: [sent_on, a-seat-is-sent-on-only-for-staff, verdict-only-without-a-seat]
    built:
      - route: apps/nazar/app/erisim-yok/page.tsx:27
      - route: apps/nazar/app/page.tsx:16
    walked:
      - e2e: apps/nazar/e2e/access.e2e.ts
        check: 'access#4'
      - test: apps/nazar/test/access.spec.tsx

  - id: asked-address-is-the-verdict
    need: >-
      A person who holds no seat at all and asks for the address of a medrese, a course or Hesap is told they have no access, not that the
      page is not there; a person who holds some seat and asks for one that is not theirs gets the 404 (nazar.access.landingScope).
    drawn: [sorting, askingWho, verdict]
    built:
      - action: medaris.api:getMe
      - route: apps/nazar/features/shell/components/portal-layout.tsx:76
      - route: apps/nazar/features/shell/components/portal-layout.tsx:107
    walked:
      - e2e: apps/nazar/e2e/access.e2e.ts
        check: 'access#3'
      - test: apps/nazar/test/access.spec.tsx

  - id: failed-read-is-not-a-verdict
    need: When the roles cannot be read the person is told so and can retry; they are never told they have no access.
    drawn: [load_failed, a-failed-read-is-never-the-verdict, retry-only-after-a-failed-read]
    built:
      - route: apps/nazar/app/erisim-yok/page.tsx:26
      - route: apps/nazar/features/shell/components/portal-layout.tsx:67
    # walked: nothing. The unit spec apps/nazar/test/access.spec.tsx proves the markup; no e2e and no replay makes the API fail a read.

  - id: chief-is-told-the-truth
    need: >-
      The Medaris başnazım, who may open every medrese and every course by its address, is not told "Bu portala erişiminiz yok" at "/" or at
      the page's address; he is told what he may do and offered a way in, or sent to Nizam (decision D1 of the flow; F-E-17, F-L-8).
    drawn: [verdict, askingWho, opened_by_address, only-the-chief-opens-by-address]
    missing: none # F-E-17: the page never reads GET /me; no Linear issue yet

  - id: chief-is-named-by-his-role
    need: >-
      The başnazım is called "Medaris başnazımı" in the user row of every page he opens, the no-access page included, not "Talebe" (NOACC-1;
      F-E-4 and F-L-7 are the same cause on Hesap and on a scope he opened).
    drawn: [roleStudent]
    missing: none # NOACC-1: no Linear issue yet

  - id: nazim-is-led-to-nizam
    need: >-
      A köşk nazımı or a Medaris nazımı, whose work is in Nizam, is led there from this page, as Hesap in Tedris leads them (decision D2 of the
      flow).
    drawn: [verdict, roleKosk, rolePlatform]
    missing: none # a decision: no Linear issue yet

  - id: sign-out-asks-first
    need: >-
      A person who signs out of Nazar from this page is asked first, as in Tedris and Nizam, through the confirmation page nazar already has
      (F-E-18; decision D1 of realm.auth.signOut).
    drawn: [signOut, handed_over.sign_out]
    missing: none # F-E-18: no Linear issue yet
