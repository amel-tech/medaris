schema: delurio-graph/0
kind: needs
id: nazar.access.dersNazirPages
status: proposed
summary: >-
  What must exist for a ders nazırı to work in a course by the permissions the hoca gave them: nazar.access.dersNazirPages. Each
  need is what the product must do, from the flow's story; none is read off what the page does today. Nothing here comes from
  planned.md: no planned feature (P-nn) names these pages. No replay has been run, so no `walked` entry names a scenario: the e2e
  checks are the only evidence, and the replay of each binding file is the walk phase's.

needs:
  - id: a-page-opens-by-the-codes-held
    need: >-
      A ders nazırı opens exactly the pages the permissions the hoca gave them open, each by any one of its own codes, and meets
      “Bu sayfaya izniniz yok” on the rest, under the page's own title and with nothing of its body.
    evidence:
      - state: judged
      - state: shown
      - source: apps/tedrisat/src/course/course.controller.ts:283
      - source: apps/nazar/features/account/course-permissions.ts:36
      - source: apps/nazar/features/account/course-permissions.ts:86
      - test: apps/nazar/e2e/course-nazirs.e2e.ts
        name: "the person appointed opens exactly the pages those two permissions allow (criterion 1)"
      - test: apps/nazar/e2e/course-nazirs.e2e.ts
        name: "the müderris takes a permission and then the end away, and the page it opened shuts (criterion 3)"
      - test: apps/nazar/e2e/course-nazirs.e2e.ts
        name: "a ders nazırı without course_nazir.assign is refused the page and sees no button; the API refuses the list and the appointment (403)"
    note: |-
      Also drawn as the assertion a-nazir-with-no-code-meets-no-body, the assertion talebeler-needs-the-roster, the assertion
      sorular-needs-question-answer, the assertion nazirlar-needs-assign.
      course-nazirs.e2e.ts course-nazirs#4 (a1-a12), course-nazirs#5 (a8-a12, the tail)
      course-nazirs.e2e.ts course-nazirs#12 (a1, a2)

  - id: genel-bakis-opens-for-every-post
    need: >-
      A ders nazırı whose post holds no permission still lands on a page of their course, the course's own, and not on a refusal.
    evidence:
      - state: shown
      - source: apps/nazar/features/course-overview/components/course-overview-page.tsx:32
    note: |-
      Also drawn as the assertion genel-bakis-always-opens.
      walked: nothing here. nazar.course.overview draws the page and its `bare` scenario is the same person; no e2e opens it as a
      ders nazırı with no code.

  - id: menu-hides-the-three-entries-without-the-code
    need: >-
      The course menu leaves out Ödevler, Değerlendirme and Ders destesi for a person who does not hold submission.read,
      session.manage and deck.manage_course, and draws them for one who does (MDRS-290).
    evidence:
      - state: shown
      - node: menuHomework
      - node: menuEvaluation
      - node: menuDeck
      - source: apps/nazar/features/shell/nav.ts:193
      - test: apps/nazar/e2e/evaluation.e2e.ts
        name: "a ders nazırı without session.manage has no Değerlendirme and is refused the page and the API"
    note: evaluation.e2e.ts evaluation#2 (a3)

  - id: menu-offers-only-what-opens
    need: >-
      The course menu offers a ders nazırı only the entries whose page their permissions open (Müfredat, Celseler, Talebeler,
      Sorular, Ders kayıtları, Arşiv, Ders nazırları and Ders ayarları by their codes; Yasaklamalar by none), as it already does
      for three, so that nobody is led to a refusal by the menu.
    missing: F-D2c-2, F-D1-29, F-L-20 (the nav graph's `menu-refused` check); decision D1; no Linear issue
    note: >-
      Drawn on the state shown and on the nodes menuCurriculum, menuSessions, menuStudents, menuQuestions, menuRecordings,
      menuBans, menuArchive, menuNazirs and menuSettings, which the code has: they are not evidence, so that a replay still walks
      them (SPEC.md §13 leaves out what only missing needs name).

  - id: sorular-answered-by-a-holder-of-question-answer
    need: >-
      A ders nazırı reads and answers the questions of the course only while their post holds question.answer: without it the list
      is refused (403) and an answer is refused as if the question were not there (404); with it they answer, and the answer is
      theirs.
    evidence:
      - state: shown
      - node: waitingBadge
      - node: answeredBadge
      - source: apps/tedrisat/src/lesson-question/lesson-question.controller.ts:192
      - source: apps/tedrisat/src/lesson-question/lesson-question.controller.ts:217
      - source: apps/tedrisat/src/lesson-question/lesson-question.controller.ts:189
      - test: apps/nazar/e2e/questions.e2e.ts
        name: "a ders nazırı without question.answer is refused the page, and the API refuses the list (403) and the answer (404)"
      - test: apps/nazar/e2e/questions.e2e.ts
        name: "given question.answer, the ders nazırı reads the questions and answers one; a passive course takes it away again"
    note: |-
      Also drawn as the event NAZIR_ANSWERS, the assertion sorular-needs-question-answer.
      questions.e2e.ts questions#2 (a1-a8), questions#3 (a1-a4)

  - id: a-passive-course-closes-the-content-codes
    need: >-
      When the course has no müderris the codes of its content (course.edit, session.manage, enrollment.*, question.answer,
      submission.read, recording.*, week.hide) close for every ders nazırı at once, and the codes that are no content
      (course.settings, course.publish, deck.manage_course, course_nazir.assign) stay (MDRS-135, MDRS-136).
    evidence:
      - source: libs/common/src/authz/effective-permissions.ts:337
      - test: apps/nazar/e2e/questions.e2e.ts
        name: "given question.answer, the ders nazırı reads the questions and answers one; a passive course takes it away again"
      - test: apps/nazar/e2e/course-nazirs.e2e.ts
        name: "on a passive course the müderris hands on only what he still holds: the boxes are off and the API refuses the rest (ceiling, 403)"
    note: |-
      Also drawn as the event HOCA_LEAVES, the assertion a-passive-course-closes-content, the assertion
      a-passive-course-keeps-the-other-codes, the assertion ders-ayarlari-survives-a-passive-course.
      questions.e2e.ts questions#3 (a5-a10)
      course-nazirs.e2e.ts course-nazirs#14 (a14-a20, the tail; a20 is stale: F-D2c-14)

  - id: an-appointer-gives-nothing-and-ends-only-their-own
    need: >-
      A ders nazırı given only course_nazir.assign appoints a person who starts with no permission, is shown no box and no
      “İzinleri düzenle”, has no way to end their own post or one the hoca gave, and ends the posts they appointed; the API
      refuses them anything more (403 PERMISSION_NOT_GIVABLE, SELF_GRANT_REFUSED, NAZIR_NOT_APPOINTED_BY_YOU).
    evidence:
      - state: shown
      - node: appointOnlyLine
      - node: appointButton
      - node: youMark
      - node: endAppointee
      - node: editRow
      - source: apps/tedrisat/src/course/nazir/course-nazir.controller.ts:71
      - source: apps/tedrisat/src/course/nazir/course-nazir.controller.ts:97
      - source: apps/tedrisat/src/course/nazir/course-nazir.controller.ts:159
      - source: apps/nazar/features/course-nazirs/course-nazirs.ts:157
      - test: apps/nazar/e2e/course-nazirs.e2e.ts
        name: "given course_nazir.assign, a ders nazırı appoints with no permission and ends only their own appointee; their own post stays out of reach"
      - test: apps/nazar/e2e/course-nazirs.e2e.ts
        name: "a ders nazırı without course_nazir.assign is refused the page and sees no button; the API refuses the list and the appointment (403)"
    note: |-
      Also drawn as the assertion nazirlar-needs-assign.
      course-nazirs.e2e.ts course-nazirs#13 (a3-a6, a11-a19; a7-a10 and a24-a26 are nazar.courseNazirs.appoint and .dismiss)
      course-nazirs.e2e.ts course-nazirs#12 (a3-a5)

  - id: ders-ayarlari-follows-the-codes-held
    need: >-
      Ders ayarları opens for a ders nazırı by any of course.edit, course.settings, course.publish and session.manage, and each
      control is open only where the person holds every code its route asks: the sample session for session.manage, the two boxes,
      the zone and “yüz yüze” for course.edit with course.settings, publishing for course.edit with course.publish, the unvans for
      course.settings; what is shut says why.
    evidence:
      - state: settingsEditable
      - state: settingsSample
      - state: settingsShut
      - node: needsEditNote
      - node: formSave
      - node: hocaSave
      - source: apps/nazar/features/course-settings/controls.ts:30
      - source: apps/tedrisat/src/course/course.controller.ts:300
      - test: apps/nazar/e2e/course-settings.e2e.ts
        name: "a ders nazırı with session.manage alone may change the sample session, and nothing else"
      - test: apps/nazar/e2e/course-settings.e2e.ts
        name: "a ders nazırı with course.edit and course.settings changes the two boxes and the zone, and may not publish"
      - test: apps/nazar/e2e/course-settings.e2e.ts
        name: "a ders nazırı with course.settings and course.publish but no course.edit sees every control shut and is told why"
      - test: apps/nazar/e2e/course-settings.e2e.ts
        name: "a ders nazırı with no permission is told so, and is shown no control"
    note: >-
      course-settings.e2e.ts course-settings#7, course-settings#8, course-settings#9 (stale in its “no Kaydet”: F-D2c-14),
      course-settings#11

  - id: evaluation-is-closed-to-those-without-session-manage
    need: >-
      The marks of the recited homework are written and read only by a holder of session.manage: a ders nazırı without it has no
      entry, is refused the page, the board (403) and a mark (403), and a talebe marks nobody, themselves included, and reads no
      board.
    evidence:
      - state: shown
      - node: menuEvaluation
      - node: evaluationEmpty
      - source: apps/tedrisat/src/evaluation/evaluation.controller.ts:68
      - source: apps/tedrisat/src/evaluation/evaluation.controller.ts:115
      - test: apps/nazar/e2e/evaluation.e2e.ts
        name: "a ders nazırı without session.manage has no Değerlendirme and is refused the page and the API"
      - test: apps/nazar/e2e/evaluation.e2e.ts
        name: "the talebe marks nobody, themselves included, reads no board and hands no file in on a recited homework"
    note: evaluation.e2e.ts evaluation#2 (a1-a6), evaluation#3 (a1-a3; a4, a5 are a multipart hand-in the helpers cannot send)

  - id: desk-pages-open
    need: >-
      A ders nazırı given enrollment.decide, submission.read, deck.manage_course or week.hide opens Talebeler, Ödevler, Ders
      destesi and Arşiv (and Müfredat, read-only, for week.hide), and the entries of the first two codes appear in the menu.
    evidence:
      - state: shown
      - node: menuHomework
      - node: menuDeck
      - node: studentsTabs
      - node: homeworkEmpty
      - node: deckSummary
      - node: archiveEmpty
      - source: apps/nazar/features/account/course-permissions.ts:36
      - source: apps/tedrisat/src/course/course.controller.ts:562
      - source: apps/tedrisat/src/lesson-submission/lesson-submission.controller.ts:293
      - source: apps/tedrisat/src/flashcard/course-decks.controller.ts:68
      - source: apps/tedrisat/src/archive/archive.controller.ts:150
    note: >-
      walked: nothing. No e2e opens Talebeler, Ödevler, Ders destesi or Arşiv as a ders nazırı; the unit specs pin the components,
      not the person.

  - id: bans-page-opens-for-a-ban-code
    need: >-
      A ders nazırı given ban.course (or ban.lift_course) can open the course's Yasaklamalar and bar or lift for their course, or
      the course catalog does not offer the grant: a code that opens nothing is not given.
    missing: >-
      F-D2c-3: the page reads the medrese's or the köşk's ban list, which no course code reads; decision D3; no Linear issue
    note: |-
      Drawn on the node bansTitle, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).
      Also drawn as the assertion yasaklamalar-never-opens.

  - id: refusal-says-whom-to-ask
    need: >-
      The sentence a refused course page says names the person who can give the permission, the course's hoca, and not the
      medrese's başmüderris, who is not there in a course of a köşk.
    missing: DNP-1; decision D2; no Linear issue
    note: >-
      Drawn on the node forbiddenText, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).

  - id: refusal-says-the-course-is-passive
    need: >-
      A person who held a permission and meets a refusal because the course has no müderris now is told that, and not the words of
      a person who was never given it.
    missing: DNP-2; no Linear issue
    note: |-
      Drawn on the node forbiddenAlert, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).
      Also drawn as the event HOCA_LEAVES.

  - id: refusal-is-announced-and-leads-somewhere
    need: >-
      A refused page announces the verdict to a screen reader as it loads, in a heading or an alert, and gives the person a way
      on: a link to the first page they may open, or to whoever can give them the permission.
    missing: F-A-16 and F-B-13, shared with nazar.access.medreseNazirRefused; no Linear issue
    note: >-
      Drawn on the nodes forbiddenAlert and forbiddenText, which the code has: they are not evidence, so that a replay still walks
      them (SPEC.md §13 leaves out what only missing needs name).

  - id: one-name-for-the-deck-page
    need: The menu entry and the title of the course's decks page say the same words.
    missing: DNP-3, product wording; no Linear issue
    note: >-
      Drawn on the nodes menuDeck and deckTitle, which the code has: they are not evidence, so that a replay still walks them
      (SPEC.md §13 leaves out what only missing needs name).
