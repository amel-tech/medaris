assertions:
  - id: genel-bakis-always-opens
    never: "state != 'judged' and page == 'overview' and body == 'refused'"
    say: Genel bakış opens for every holder of the course scope, whatever the post holds.
    source: apps/nazar/features/course-overview/components/course-overview-page.tsx:32
  - id: a-nazir-with-no-code-meets-no-body
    never: "state != 'judged' and held == 'none' and page != 'overview' and body == 'drawn'"
    say: A ders nazırı the hoca gave nothing is never shown the body of a course page; every one of them says “Bu sayfaya izniniz yok”.
    source: apps/nazar/features/account/course-permissions.ts:86
  - id: yasaklamalar-never-opens
    never: "state != 'judged' and page == 'bans' and body == 'drawn'"
    say: Yasaklamalar never opens for a ders nazırı, whatever codes the post holds, because the lists it reads ask medrese and köşk codes (F-D2c-3).
    source: apps/nazar/features/bans/components/course-bans-page.tsx:67
  - id: talebeler-needs-the-roster
    never: "state != 'judged' and page == 'students' and body == 'drawn' and held != 'desk'"
    say: Talebeler opens only for the post that holds an enrollment code.
    source: apps/nazar/features/account/course-permissions.ts:40
  - id: sorular-needs-question-answer
    never: "state != 'judged' and page == 'questions' and body == 'drawn' and held != 'answerer'"
    say: Sorular opens only for the post that holds question.answer, since the API lists the questions to nobody else.
    source: apps/tedrisat/src/lesson-question/lesson-question.controller.ts:189
  - id: nazirlar-needs-assign
    never: "state != 'judged' and page == 'nazirs' and body == 'drawn' and held != 'assigner'"
    say: Ders nazırları opens only for the post that holds course_nazir.assign.
    source: apps/nazar/features/account/course-permissions.ts:39
  - id: a-passive-course-closes-content
    never: "state != 'judged' and course == 'passive' and body == 'drawn' and page in ['curriculum', 'sessions', 'plan', 'students', 'questions', 'homework', 'evaluation', 'recordings', 'archive']"
    say: When the course has no müderris the pages that ask a content code (course.edit, session.manage, enrollment.*, question.answer, submission.read, recording.*, week.hide) refuse again.
    source: libs/common/src/authz/effective-permissions.ts:337
  - id: a-passive-course-keeps-the-other-codes
    never: "state != 'judged' and course == 'passive' and held == 'desk' and page == 'deck' and body == 'refused'"
    say: deck.manage_course is no content code, so Ders destesi stays open for its holder in a passive course.
    source: libs/common/src/authz/permissions.ts:251
  - id: ders-ayarlari-survives-a-passive-course
    never: "state != 'judged' and course == 'passive' and held in ['settingsEdit', 'settingsPublish'] and page == 'settings' and body == 'refused'"
    say: course.settings and course.publish are no content codes, so Ders ayarları stays open for their holder in a passive course, and the form shuts.
    source: libs/common/src/authz/permissions.ts:237
