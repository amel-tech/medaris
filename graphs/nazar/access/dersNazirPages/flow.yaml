      NAZIR_ANSWERS:
        guard: "held == 'answerer' and page == 'questions' and body == 'drawn' and question == 'waiting'"
        target: judged
        effect: [answeredNow]
        say: >-
          the nazır answers the waiting question and opens the page again; the form is nazar.questions.answer's, the
          walk sends the same request (PUT /questions/:id/answer) as the nazır, which the API takes because the post
          holds question.answer (e2e questions#3)
        source: apps/tedrisat/src/lesson-question/lesson-question.controller.ts:217
