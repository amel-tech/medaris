rules:
  - { id: F-D2c-2, rule: "The course menu draws Yasaklamalar, Ders nazırları and Ders ayarları (and, with the next finding, Müfredat, Celseler, Talebeler, Sorular, Ders kayıtları and Arşiv) to every holder of the course scope: NAV.ders has a `requires` on three entries only (features/shell/nav.ts:119,125,132), and navFor drops an entry only when it names a code the person lacks (nav.ts:193). A ders nazırı with no code meets nine refusals behind the menu, which the nav graph's `menu-refused` check reports (e2e course-nazirs#12, course-settings#11). Fix: give each entry the codes its page asks (PAGE_CODES; question.answer; week.hide), as the other three have." }
  - { id: F-D1-29, rule: "Talebeler and Sorular carry no `requires`, so the menu offers them to a ders nazırı who holds no code, and the page then says “Bu sayfaya izniniz yok” (pinned by e2e questions#2); Ödevler, Değerlendirme and Ders destesi are not drawn to the same person. Fix: extend `requires` to an any-of list (PAGE_CODES.students; question.answer)." }
  - { id: F-L-20, rule: "The same defect named for the whole shell: the menu draws entries the page then refuses. On the course side it is the nine entries above; on the medrese side it is nazar.access.medreseNazirRefused (MDRS-223). The nav graph reports both." }
  - { id: F-D2c-3, rule: "Yasaklamalar has no gate of its own and refuses every ders nazırı, whatever the post holds, even ban.course: the page reads the medrese's ban list (GET /madrasahs/:id/bans, madrasah.ban or platform.ban_scoped) or the köşk's (GET /kosks/:id/bans, ban.manage_kosk or the platform's), and a course code reads neither (apps/tedrisat/src/ban/madrasah-ban.controller.ts:70-74, ban.service.ts:198-204), so ban.course opens nothing and its grant on Ders nazırları is a dead one. No e2e opens the page; test/course-bans.spec.tsx:332-338 pins the refusal state. Not verified in a browser. Fix: a course-scoped list the code reads, or no grant for it." }
  - { id: F-D2c-14, rule: "e2e course-settings#9 (and course-nazirs#14 a20) assert that a holder of course.settings and course.publish, with no course.edit, sees no “Kaydet” on Ders ayarları. The page has one: the card “Hocalar ve unvanları” (added 2026-10-16) draws its own “Kaydet” and “Vazgeç” for every holder of course.settings (hoca-unvan-card.tsx:155-172), and getByRole(\"button\", {name: \"Kaydet\"}) resolves to two buttons for the hoca, the başmüderris and the başnazım. The graph carries the page: the form's “Kaydet” is absent in settingsShut and the card's is there; the binding scopes each by its test id. Fix: scope the e2e's locators to getByTestId(\"course-settings-form\") and assert the card separately." }
  - { id: DNP-1, rule: "Every refused course page says “İzne ihtiyacınız varsa medresenin başmüderrisine başvurun” (Problems.forbidden, features/shell/components/page-problem.tsx:26), the one sentence of the medrese's pages. For a ders nazırı the person who gives them permissions is the course's hoca (CourseNazirs.introAppointOnly says “izinleri dersin hocası verir”), and a course of a köşk (Nahiv Metinleri) has no medrese and no başmüderris at all. Same defect as F-B-13, which says the verdict gives neither a name nor a way. New finding. Fix: a line for the course pages that names the hoca." }
  - { id: DNP-2, rule: "A course that turns passive (the last müderris left, MDRS-136) closes every content code at once, and a ders nazırı who held session.manage, question.answer or enrollment.decide yesterday meets the same “Bu sayfaya izniniz yok” as a person who never held it; Ders ayarları with course.edit and course.settings shuts its form and says “Dersi düzenle izni de gerekir”, though the permission is still in their list on Ders nazırları. Nothing says the course has no hoca now (e2e questions#3 a5-a10, course-nazirs#14 tail). New finding, from the code (libs/common/src/authz/effective-permissions.ts:337). Fix: say that the course is passive where the page refuses." }
  - { id: DNP-3, rule: "The menu entry is “Ders destesi” (Nav.ders.deck) and its page is titled “Ders desteleri” (Decks.title), and the tab title says “Ders desteleri · Medaris Nazar”: one page, two names, so a person who looks for the heading of the entry they pressed does not find it. Product wording, not an accessibility defect. New finding. Fix: one word." }
  - { id: F-A-16, rule: "The refusal is a neutral Alert, which libs/ui/src/mds/alert.tsx:23 makes a role=status, and it is in the page already when the page loads, so a screen reader does not announce it; its title is a <p>, not a heading, and the page's own <h1> still names the page (the same component as in nazar.access.medreseNazirRefused). A ders nazırı who opens Talebeler hears “Talebeler” and nothing more until they browse. Fix: render the verdict as a heading or role=alert." }
  - { id: F-B-13, rule: "The refused page keeps its <title> (“Müfredat · Medaris Nazar”) and its <h1>, and the verdict has no link out: it gives neither a name nor a way (page-problem.tsx:23-29)." }
  - { id: focus-not-set, rule: "No page of the course gives the focus to anything on load and no menu link keeps it: the focus starts at the top of each new document, and Base UI puts it where it likes after a reload. Nothing is drawn as initialFocus." }
