# The screens of nazar.access.dersNazirPages: the course pages of nazar-web (/ders/<id>/...) as a ders nazırı meets them for the codes the
# hoca gave the post, under the course menu. Read from apps/nazar/features/{shell,account,course-overview,curriculum,sessions,enrolments,
# questions,homework,evaluation,recordings,decks,bans,course-archive,course-nazirs,course-settings}; the words are copied from
# libs/i18n/src/locales/tr/nazar.json, key for key. Nothing was walked in a browser (from the code); the unit tests named in needs.yaml
# exercise the same components.
#
# How to read it. The state `shown` stands for whichever page the person is on (the flow's `page`), and `body` says whether the page
# draws what it came for (`drawn`) or the verdict in its place (`refused`). Every page keeps the same things whatever the read said: its
# title, the menu and the shell around them. A node with `when: "page == ..."` is that page's own. Ders ayarları has three states of
# its own, because its boxes are open, shut or half open by the codes held, and a node cannot be both enabled and disabled in one
# state: settingsEditable (course.edit and course.settings), settingsSample (session.manage alone) and settingsShut (course.settings
# with no course.edit).
#
# A node that no walked grant set ever shows is written with `when: "held == 'none'"` in a state `none` never reaches: it is there so
# that `replay --absent` checks that the control is NOT on the page (the publish buttons, the “İzinleri düzenle” button).
#
# Samples: `name` is the one sample for four kinds of {name}: the course (Sessions.subtitle, Homework.subtitle, Evaluation.subtitle,
# Recordings.subtitle, CourseSettings.intro, Curriculum.intro), the talebe who asked (Questions.questionLabel) and the person on a row
# (CourseNazirs.endLabel, editLabel); it is a person's name, so the page tool draws the course sentences with it. The replay reads the
# binding's samples, which are none, so it matches any text there.
#
# Composed text (not in any i18n file): composed.CourseOverview.courseTitle is the course's own title in the h1 of Genel bakış, in a
# <bdi> followed by its badge (features/course-overview/components/course-overview-page.tsx:90).
schema: delurio-graph/0
kind: ui
id: nazar.access.dersNazirPages
flow: nazar.access.dersNazirPages
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples:
  name: Hamza Örnek
  nameGenitive: Deneme dersi dnp’in
  course: Deneme dersi dnp
  title: Deneme dersi dnp
  zone: İstanbul
  decks: "0"
  cards: "0"
  students: "1"
  count: "1"
  recorded: "0"
  missing: "2"

# No page of the course gives the focus to anything on load (nothing in features/* sets it) and a menu link is a plain link to a new
# document, so the graph draws no `initialFocus` and no `focus` (rule focus-not-set).
nodes:

  # --- the shell around every page of the course -------------------------------------------------------------------------------
  mainPage: { type: page, component: Page, role: main, in: [shown, settingsEditable, settingsSample, settingsShut], source: libs/ui/src/mds/app-shell.tsx:41 } # the shell's one <main id="main">; it has no name
  mainMenu: { type: page, component: Page, role: navigation, name: { key: Shell.navLabel }, in: [shown, settingsEditable, settingsSample, settingsShut], source: libs/ui/src/mds/app-shell.tsx:98 } # the sidebar's menu of the course: twelve entries to every holder of the scope (Pano, Bildirimler, Genel bakış and nine pages) and three more only for the code (MDRS-290)
  userRole: { type: text, component: Text, text: { key: Roles.DERS_NAZIR }, in: [shown, settingsEditable, settingsSample, settingsShut], source: apps/nazar/features/shell/components/portal-frame.tsx:53 } # the person row's role line, “Ders nazırı” (course-nazirs#4 a1)
  menuPano: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.general.pano }, in: [shown, settingsEditable, settingsSample, settingsShut], source: apps/nazar/features/shell/nav.ts:56 } # leads to the Pano of the first medrese the person runs, else to the course's own page (panoHref, scope.ts:214); a ders nazırı runs none, so the same page as Genel bakış, and it sends no event of its own
  menuNotifications: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.general.notifications }, in: [shown, settingsEditable, settingsSample, settingsShut], emits: NAVIGATE, source: apps/nazar/features/shell/nav.ts:58 } # its name may carry a count of unread notifications; its page is nazar.notifications.inbox
  menuOverview: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.ders.overview }, in: [shown, settingsEditable, settingsSample, settingsShut], emits: OPEN_OVERVIEW, source: apps/nazar/features/shell/nav.ts:100 }
  menuCurriculum: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.ders.curriculum }, in: [shown, settingsEditable, settingsSample, settingsShut], emits: OPEN_CURRICULUM, source: apps/nazar/features/shell/nav.ts:101 }
  menuSessions: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.ders.sessions }, in: [shown, settingsEditable, settingsSample, settingsShut], emits: OPEN_SESSIONS, source: apps/nazar/features/shell/nav.ts:103 } # its name carries the number of celses with no way to take part when the person may read the count (course.staff_read), which only a roster holder does
  menuStudents: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.ders.students }, in: [shown, settingsEditable, settingsSample, settingsShut], emits: OPEN_STUDENTS, source: apps/nazar/features/shell/nav.ts:109 } # its name carries the number of waiting applications, for a roster holder
  menuQuestions: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.ders.questions }, in: [shown, settingsEditable, settingsSample, settingsShut], emits: OPEN_QUESTIONS, source: apps/nazar/features/shell/nav.ts:114 } # no `requires`: drawn to a ders nazırı who holds no code, and the page refuses them (F-D1-29)
  menuHomework: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.ders.homework }, in: [shown, settingsEditable, settingsSample, settingsShut], when: homeworkEntry, emits: OPEN_HOMEWORK, source: apps/nazar/features/shell/nav.ts:116 } # drawn only to a holder of submission.read in a live course (nav.ts:119 `requires`, MDRS-290)
  menuEvaluation: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.ders.evaluation }, in: [shown, settingsEditable, settingsSample, settingsShut], when: evaluationEntry, emits: OPEN_EVALUATION, source: apps/nazar/features/shell/nav.ts:122 } # drawn only to a holder of session.manage in a live course (nav.ts:125 `requires`; e2e evaluation#2 a3 asserts it missing for a nazır with no code)
  menuRecordings: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.ders.recordings }, in: [shown, settingsEditable, settingsSample, settingsShut], emits: OPEN_RECORDINGS, source: apps/nazar/features/shell/nav.ts:127 }
  menuDeck: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.ders.deck }, in: [shown, settingsEditable, settingsSample, settingsShut], when: deckEntry, emits: OPEN_DECK, source: apps/nazar/features/shell/nav.ts:129 } # drawn only to a holder of deck.manage_course (nav.ts:132 `requires`); the entry is “Ders destesi” and its page is titled “Ders desteleri” (DNP-3)
  menuBans: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.ders.bans }, in: [shown, settingsEditable, settingsSample, settingsShut], emits: OPEN_BANS, source: apps/nazar/features/shell/nav.ts:134 } # no `requires`, and the page refuses every ders nazırı (F-D2c-2, F-D2c-3)
  menuArchive: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.ders.archive }, in: [shown, settingsEditable, settingsSample, settingsShut], emits: OPEN_ARCHIVE, source: apps/nazar/features/shell/nav.ts:135 } # no `requires` (F-D2c-2)
  menuNazirs: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.ders.nazirs }, in: [shown, settingsEditable, settingsSample, settingsShut], emits: OPEN_NAZIRS, source: apps/nazar/features/shell/nav.ts:141 } # no `requires` (F-D2c-2): refused to everyone but a holder of course_nazir.assign
  menuSettings: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.ders.settings }, in: [shown, settingsEditable, settingsSample, settingsShut], emits: OPEN_SETTINGS, source: apps/nazar/features/shell/nav.ts:142 } # no `requires` (F-D2c-2): refused to everyone who holds none of the five codes

