schema: delurio-graph/0
kind: needs
id: nazar.access.medreseNazirRefused
status: proposed
summary: >-
  What must exist for a medrese nazırı whom the başmüderris gave nothing (or one permission) to open the pages of the medrese and
  be told, on each, what they may do: the flow's product list. Each need is what the product must do, from the flow's story and
  the open bugs (planned.md C: MDRS-223), not from what the pages do today.

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# For the orchestrator's gaps merge (nothing here was replayed; the unit tests named under `walked` are the only runs):
# missing:  menu-draws-what-opens (MDRS-223), lands-on-a-page-that-opens (none), refusal-says-how-to-ask (none),
# awaiting-notice-speaks-to-the-giver (none), partial-courses-grants-say-why (none)
# unwalked: appeals-refusal-is-walked (a unit test, no e2e and no replay), nazir-appoint-sees-own-rows (a unit test, no e2e: the replay
# scenario `appointer` is written and not run), head-contrast-is-walked (the replay scenario `head` is written and not run)
# The course menu's twin of menu-draws-what-opens (F-D2c-2: Yasaklamalar, Ders nazırları and Ders ayarları drawn to a ders nazırı with no
# grant) is a need of nazar.access.dersNazirPages, not of this flow.

needs:
  - id: refusal-keeps-the-page
    need: >-
      A person who holds none of the codes a page of the medrese asks for is told so on that page, under the page's own title, in
      one wording for all ten pages, and is given none of the page's body, list, form or buttons; the başmüderris, who holds every
      medrese code, is never refused.
    evidence:
      - state: shown
      - node: forbiddenAlert
      - node: forbiddenText
      - node: panoTitle
      - node: coursesTitle
      - node: courseNewTitle
      - node: offsiteTitle
      - node: archiveTitle
      - node: studentsTitle
