  - id: appeals-refusal-is-walked
    need: >-
      Every page of the medrese that can refuse is walked as a person with no grant, İtirazlar included, so that a page added to
      the menu cannot refuse without anything noticing.
    evidence:
      - node: appealsTitle
      - node: appealsLine
      - node: forbiddenAlert
      - source: apps/tedrisat/src/appeal/appeal.controller.ts:64
      - source: apps/nazar/features/appeals/components/appeals-page.tsx:30
      - test: apps/nazar/test/appeals.spec.tsx

  - id: menu-draws-what-opens
    need: >-
      The medrese menu draws, for each person, the entries whose page opens for the codes they hold in the medrese, or marks the
      others, so that a nazır with no grant is not offered eight pages that all say no (MDRS-223; the course menu already does it
      for Ödevler, Değerlendirme and Ders destesi, MDRS-290).
    missing: MDRS-223; findings MDRS-223
    note: >-
      Drawn on the nodes mainMenu, menuPano, menuCourses, menuStudents, menuNazirs, menuBans, menuAppeals, menuArchive and
      menuSettings, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only
      missing needs name).

  - id: lands-on-a-page-that-opens
    need: >-
      A nazır with no grant who signs in, or opens "/", lands on a page that opens for them (Bildirimler at the least) or on a
      Pano that says what they may do, not on the first page that refuses them (REFUSED-1).
    missing: no Linear issue; findings REFUSED-1
    note: >-
      Drawn on the state opened and on the nodes panoTitle, greeting, scopeCard and forbiddenAlert, which the code has: they are
      not evidence, so that a replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: refusal-says-how-to-ask
    need: >-
      The refusal is announced to a person who cannot see it (a heading or an alert), names whom to ask and gives a way to do it,
      and leads to the first page the person may open; the page's tab title says it too (F-A-16, F-B-13).
    missing: no Linear issue; findings F-A-16, F-B-13
    note: >-
      Drawn on the nodes forbiddenAlert, forbiddenText and crumbCourses, which the code has: they are not evidence, so that a
      replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: nazir-appoint-sees-own-rows
    need: >-
      A nazır the başmüderris allowed to appoint (madrasah.nazir_appoint) reads the roster and the permission groups, appoints,
      and dismisses only the people they seated; they give no permission and define no group, and every other page of the medrese
      still refuses them (MDRS-108).
    evidence:
      - node: nazirsTable
      - node: appointNazir
      - node: dismissRow
      - node: groupsTitle
      - node: awaitingAlert
      - source: apps/tedrisat/src/madrasah/nazir/madrasah-nazir.controller.ts:73
      - source: apps/tedrisat/src/madrasah/nazir/madrasah-nazir.controller.ts:103
      - source: apps/tedrisat/src/madrasah/nazir/madrasah-nazir.controller.ts:169
      - source: apps/nazar/features/nazirs/components/nazirs-table.tsx:44
      - test: apps/nazar/test/nazirs-page.spec.tsx
    note: >-
      Also drawn as the assertion madrasah-nazir-appoint-opens-the-roster, the assertion
      madrasah-nazir-appoint-opens-the-roster-only.

  - id: awaiting-notice-speaks-to-the-giver
    need: >-
      The warning that a nazır "henüz izin almadı" is shown to the person who can give permission, and worded for a nazır who
      cannot (REFUSED-2).
    missing: no Linear issue; findings REFUSED-2
    note: >-
      Drawn on the nodes awaitingAlert and awaitingText, which the code has: they are not evidence, so that a replay still walks
      them (SPEC.md §13 leaves out what only missing needs name).

  - id: partial-courses-grants-say-why
    need: >-
      A nazır holding some of the courses family of codes (madrasah.course_hide or madrasah.muderris_manage without
      madrasah.course_open; no madrasah.settings_edit) is told on the controls they cannot use that it is a refusal, not that the
      köşks or policies "could not be read", and is not offered a button that leads to a refusal (F-A-8).
    missing: no Linear issue; findings F-A-8
    note: >-
      Drawn on the nodes coursesTitle and forbiddenAlert, which the code has: they are not evidence, so that a replay still walks
      them (SPEC.md §13 leaves out what only missing needs name).

  - id: head-contrast-is-walked
    need: >-
      The same walk as the başmüderris shows, on each of the ten pages, the control that the nazır with no grant is not given, so
      that a refusal that leaves a button behind (REFUSED-3) is caught by the walk and not only by the nazır's own.
