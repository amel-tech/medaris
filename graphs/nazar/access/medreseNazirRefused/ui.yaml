  mainMenu: { type: page, component: Page, role: navigation, name: { key: Shell.navLabel }, in: [shown], source: libs/ui/src/mds/app-shell.tsx:98 } # the sidebar's menu: all nine entries to every holder of the medrese scope (MDRS-223)
  menuPano: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.general.pano }, in: [shown], emits: OPEN_PANO, source: apps/nazar/features/shell/nav.ts:56 }
  menuNotifications: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.general.notifications }, in: [shown], emits: NAVIGATE, source: apps/nazar/features/shell/nav.ts:58 } # the one entry that opens for the nazır; its page is nazar.notifications.inbox
  menuCourses: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.medrese.courses }, in: [shown], emits: OPEN_COURSES, source: apps/nazar/features/shell/nav.ts:78 } # its name carries the number of courses with an application when the person may read it; a nazır with no grant reads none (the count is dropped on a 403, reads.ts:78)
