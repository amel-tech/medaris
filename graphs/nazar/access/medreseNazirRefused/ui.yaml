rules:
  - { id: MDRS-223, rule: "The medrese menu is drawn in full (nine entries) to every holder of the medrese scope, and a nazır with no grant meets eight refusals behind it; only Bildirimler opens. NAV.medrese has no `requires` (features/shell/nav.ts:71-93), whereas the course menu hides Ödevler, Değerlendirme and Ders destesi to anyone who does not hold their code (nav.ts:119,125,132, MDRS-290). The nav graph's `menu-refused` check reports it for this persona. Fix: draw each entry for the codes its page asks (GET /me/effective-permissions lists them by scope), or mark the entry." }
  - { id: F-L-20, rule: "The same defect named for the whole shell: the menu draws entries the page then refuses. On the medrese side it is this flow (MDRS-223); on the course side, the entries Yasaklamalar, Ders nazırları and Ders ayarları for a ders nazırı with no grant, and Talebeler, Celseler, Müfredat, Ders kayıtları and Sorular for those who hold none of their codes (F-D1-29): drawn in nazar.access.dersNazirPages. The nav graph reports both." }
  - { id: F-D2c-2, rule: "The course menu draws Yasaklamalar, Ders nazırları and Ders ayarları to every holder of the course scope (nav.ts:134,141,142 have no `requires`), and the pages refuse a caller without the codes (e2e course-nazirs#12, course-settings#11). A medrese nazır who opens a course of their medrese by address meets it too. Not drawn here: the course pages are nazar.access.dersNazirPages." }
  - { id: F-A-16, rule: "The refusal is a neutral Alert, which libs/ui/src/mds/alert.tsx:23 makes a role=status, and it is in the page already when the page loads, so a screen reader does not announce it; its title is a <p>, not a heading, and the page's own <h1> still names the page. A person who lands on Talebeler hears 'Talebeler' and learns nothing more until they browse. Fix: render the verdict as a heading or role=alert, or let the page's h1 say it." }
  - { id: F-B-13, rule: "The refused page keeps its <title> ('Talebeler · Medaris Nazar') and its <h1>, and the verdict has no link out: it says to ask the başmüderris and gives neither a name nor a way. Fix: a refusal-specific title and a link to the first page the person may open (apps/nazar/features/shell/components/page-problem.tsx:23-29)." }
  - { id: F-A-8, rule: "Not drawn: it needs a nazır holding part of the courses family. A nazır holding madrasah.course_hide or madrasah.muderris_manage and not madrasah.course_open reads the Dersler list but not the köşks, so the side card says the köşks 'okunamadı' (false: a refusal), 'Medrese dersi aç' stays on and leads to a refusal, and every row offers both menu items to be refused with a toast. A nazır without madrasah.settings_edit is told on Medrese dersi aç that the policies could not be read (OpenCourse.policiesUnknown). No e2e covers a partial grant of these." }
  - { id: F-B-15, rule: "Not drawn: the roster never offers 'Görevden al' on a row the nazır did not seat, so NAZIR_NOT_APPOINTED_BY_YOU (403) is reachable only through a stale list; nazirErrorKey has no case for it and the toast is the generic 'Bir şeyler ters gitti', which wrongly invites a retry (features/nazirs/nazirs.ts:357-389). Not verified that the API sends it as `code`." }
  - { id: F-A-17, rule: "The Pano's greeting says '{name} Hoca' to a nazır as well; with no dashboard it keeps only the greeting (apps/nazar/test/pano.spec.tsx:707-720: 'Selâmün aleyküm, Mehmet Emin Hoca.'). Product wording, not an accessibility defect." }
  - { id: REFUSED-1, rule: "The first page a nazır with no grant meets is a refusal: '/' (the remembered scope, else the first medrese), the sign-in and the menu's Pano all lead to the Pano, whose dashboard read asks madrasah.students_view (apps/tedrisat/src/madrasah/portal/madrasah-portal.controller.ts:117). The pages that open for them are Bildirimler and Hesap, reached only from the menu and the person row. New finding (the inventory has MDRS-223 for the menu, not for the landing). Fix: land on the first page the held codes open, or let the Pano say what the person may do." }
  - { id: REFUSED-2, rule: "The warning on Medrese nazırları, 'X henüz izin almadı: ... Siz izin verene kadar hiçbir işlem yapamaz' (Nazirs.awaiting), speaks to the person who gives permission, and awaitingNotice does not look at the viewer (features/nazirs/nazirs.ts:199), so a nazır given madrasah.nazir_appoint reads it too, with no 'İzin ver' button to act on it (those are drawn only where `viewer.manages`, nazirs-table.tsx:147). New finding; not verified in a browser. Fix: show the notice only where `manages`, or word it for the nazır ('izin verecek kişiyi bekliyor')." }
  - { id: REFUSED-3, rule: "Two refused pages keep a way that goes nowhere or leaves: on Medrese dersi aç and Medrese dışı ders talebi the breadcrumb's 'Dersler' leads to Dersler, which refuses the nazır as well (open-course-page.tsx:38, offsite-page.tsx:51), and Medrese ayarları keeps its header link 'Medrese sayfasını gör' to the public page in Tedris while TEDRIS_URL is set (settings-page.tsx:82), though the story and the e2e say the page has no button ('Kaydet' count 0 is all settings#6 asserts). Harmless (the public page is public); recorded so that 'no button' is not read as 'no control'. New finding." }
  - { id: focus-not-set, rule: "No page of the medrese gives the focus to anything on load and no menu link keeps it: the focus starts at the top of each new document. Nothing is drawn as initialFocus." }
  - { id: label-in-name, rule: "The menu links' visible text is their accessible name ('Dersler' may be followed by a hidden count label, 'Dersler 2 derste bekleyen başvuru', when the person can read the count); the breadcrumb's 'Dersler' and the menu's 'Dersler' are two links with one name on the two address-only pages, which a locator tells apart by the landmark. Holds." }
