# The screens of nazar.access.medreseNazirRefused: the ten pages of a medrese in nazar-web as a medrese nazırı with no grant
# meets them, under the shell's menu. Read from apps/nazar/features/{pano,courses,offsite,archive,students,nazirs,bans,appeals,
# settings,shell}; the words are copied from libs/i18n/src/locales/tr/nazar.json, key for key. Nothing was walked in a browser
# (from the code); the unit tests named in needs.yaml exercise the same components.
#
# How to read it. One state, `shown`, stands for whichever page the person is on (the flow's `page`), and `body` says whether
# the page draws what it came for (`drawn`) or the verdict in its place (`refused`). Every page keeps the same three things whatever the
# read said: the header (its title and the line under it), the menu and the shell around them. A node that carries `when: "page == ..."`
# is that page's own. The nodes `when: "body == 'drawn'"` are the contrast: one control that the başmüderris has on the page and the
# nazır with no grant has not (the e2e checks assert them absent), and, on Medrese nazırları, what a nazır given madrasah.nazir_appoint
# is let into.
#
# Samples: `name` is the one sample for four kinds of {name} (the person in the greeting and in "Görevden al: {name}", the
# medrese in the sentences of Dersler, Medrese dersi aç, Talebeler and the roster's caption); it is a person's name, so the page tool
# draws the medrese sentences with it. The replay reads the binding's samples, which are none, so it matches any text there.
#
# Composed text (not in any i18n file): composed.Pano.medreseName is the name of the medrese in the card of the Pano
# (features/pano/components/pano-page.tsx:131, a <bdi> of the API's name).
schema: delurio-graph/0
kind: ui
id: nazar.access.medreseNazirRefused
flow: nazar.access.medreseNazirRefused
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples:
  name: Seher
  nameGenitive: Hadis ve Siyer Medresesi’nin
  madrasah: Hadis ve Siyer Medresesi
  appointer: Seher Medrese Nazırı
  dateLocative: 15 Kasım’da

# No page moves the focus on load (nothing in features/* sets it), and a menu link is a plain link to a new document, so the graph
# draws no `initialFocus` and no `focus`: it says nothing of what the code does not say (rule focus-not-set).
nodes:
