# The screens of nazar.archive.hideAndRestoreCourse: Dersler (/medrese/<id>/dersler) with a course's row menu, the window "Dersi gizle" and
# the toasts that answer it, and Arşiv (/medrese/<id>/arsiv) with its tabs, its table of what is hidden, "Geri al", the sentences that
# stand where a higher kademe's rows have no button, the pager and the toasts that answer a restore. Read from the code of the branch
# (the tree of PR #394) on 15 Nov 2026: apps/nazar/features/courses and apps/nazar/features/archive, and libs/ui/src/mds. Nothing was
# seen in a browser by its writer: every behaviour is "from the code" unless a rule says otherwise.
#
# What this file leaves to its neighbours (flow.yaml `scope.outOfView` names them): the table's filters and the side cards of Dersler
# (nazar.courses.browse), "Medrese dersi aç" (nazar.courses.open), the dialog "Hocaları değiştir" (nazar.courses.changeHocas), the
# section "Medreseyi gizle" and the banner of a hidden medrese on Arşiv (nazar.archive.hideMedrese), and the refusal a nazır with no
# grant meets (nazar.access.medreseNazirRefused).
#
# Words: every key that has no `composed.` prefix is copied letter for letter from libs/i18n/src/locales/tr/nazar.json (the file the app
# reads as `nazar`; the key is the path under its root), by <scratchpad>/hrc/catalog.py, except `Changes.note`, the one authored
# message of this catalog (the app has no one place that says what a hide changes and who can undo it; it is made of the app's own
# sentences HideCourse.rest, HideCourse.affected, HideCourse.note and Archive.restoredBody). The `composed.*` keys are text the app builds
# in code from data and messages; each has its code line here, and a placeholder the binding gives no sample for matches any text:
#   composed.Courses.rowTitle         "{title}"    the course's title, a link in the row (courses-table.tsx:79)
#   composed.HideCourse.eyebrow       "{name}"     the medrese's name above the window's title (hide-course.tsx:79, alert-dialog.tsx:69)
#   composed.HideCourse.body          the course's title and HideCourse.rest in one <p> (hide-course.tsx:87-91); {koskGenitive} is the köşk's
#                                     name in the Turkish genitive (courses.ts:140-149)
#   composed.HideCourse.bodyAffected  the same <p> with " " and HideCourse.affected after it, while someone is enrolled (hide-course.tsx:90)
#   composed.Button.loading           "Yükleniyor" the busy button's hidden status, a default of the kit (libs/ui/src/mds/button.tsx:62)
#   composed.Archive.tabAll|tabCourse|tabWeeks|tabRecordings   a tab link: its label directly followed by the count, no space (tabs.tsx:293-297; F-A-12)
#   composed.Archive.rowTitle|rowContext|rowHiderName|rowHiderRole|rowWhen   the cells of a row, worded and dated by archive.ts:227-262
#                                     ("Nûruosmaniye Köşkü · 12 hafta · 14 talebe", the hider's name and role line, "Dün 10:40")
schema: delurio-graph/0
kind: ui
id: nazar.archive.hideAndRestoreCourse
flow: nazar.archive.hideAndRestoreCourse
status: captured
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  title: Örnek Ders
  name: Örnek Medrese
  courses: '3'
  kosks: '2'
  count: '1'
  koskGenitive: Örnek Köşk’ün
  context: Örnek Köşk · 1 hafta · 1 talebe
  role: köşk nazımı
  when: Dün 10:40
  from: '1'
  to: '10'
  total: '12'

# Neither page sets a focus on load (Dersler and Arşiv: "Initial focus: none"), so no page node carries `initialFocus` (rule focus-not-set).
# Only the window's `initialFocus`, on Vazgeç, is drawn. The menu moves the focus into its popup by Base UI (rule menu-focus-on-popup), which is
# not drawn either.
nodes:
  # ---- Dersler: what every state of the page draws -------------------------------------------------------------------------------
  coursesMain: { type: page, component: Page, role: main, in: [listed, menuOpen, listedWithout], source: apps/nazar/features/courses/components/courses-page.tsx:99 } # the shell's one <main>; no name; the binding tells it from Arşiv's by its caption
  coursesTitle: { type: text, component: Heading, role: heading, text: { key: Courses.title }, in: [listed, menuOpen, listedWithout], source: apps/nazar/features/courses/components/courses-page.tsx:102 } # h1
  coursesCounter: { type: text, component: Text, text: { key: Courses.counter, params: { courses: courses.count, kosks: courses.kosks } }, in: [listed, menuOpen, listedWithout], source: apps/nazar/features/courses/components/courses-table.tsx:191 } # "3 ders · 2 köşkte", a <p data-testid="counter">: it follows a hide when the list is read again
  coursesTable: { type: list, component: List, role: table, name: { key: Courses.caption }, in: [listed, menuOpen, listedWithout], source: apps/nazar/features/courses/components/courses-table.tsx:223 } # explicit table roles (responsive="stack"), named by its caption
  rowTitle: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: composed.Courses.rowTitle, params: { title: course.title } }, in: [listed, menuOpen, listedWithout], repeat: courses.list, source: apps/nazar/features/courses/components/courses-table.tsx:79 } # every row's title is a link to /ders/<id> (F-A-9: `held` is built from the same list, so none is left plain)
  rowMenu: { type: action, component: Button, role: button, intent: secondary, name: { key: Courses.actions.label, params: { title: course.title } }, in: [listed, menuOpen], emits: OPEN_MENU, source: apps/nazar/features/courses/components/courses-table.tsx:164 } # the "···" of the row the walk hides, aria-haspopup=menu and named by its aria-label. It is one node, not a repeat: after the hide the row is gone and so is this button (the binding finds the walk's own course)
  hiddenNoteLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Courses.hiddenNote.link }, in: [listed, menuOpen, listedWithout], emits: OPEN_ARCHIVE, source: apps/nazar/features/courses/components/courses-page.tsx:154 } # "Arşiv" inside the sentence "Gizlenen dersler bu listede yer almaz; Arşiv’de görünür." (a next/link, so a navigation inside the app)

  # ---- Dersler: the row's menu, a Base UI Menu opened by rowMenu --------------------------------------------------------------------
  menuList: { type: list, component: List, role: menu, name: { key: Courses.actions.label, params: { title: course.title } }, in: [menuOpen], source: libs/ui/src/mds/menu.tsx:189 } # a popup named by its trigger; the page behind is not inert and the focus is on the popup, not on an item (menu-focus-on-popup)
  menuHocas: { type: action, component: Button, role: menuitem, intent: secondary, text: { key: Courses.actions.muderris }, in: [menuOpen], emits: CHOOSE_HOCAS, source: apps/nazar/features/courses/components/courses-table.tsx:168 } # opens "Hocaları değiştir", which nazar.courses.changeHocas draws
  menuHide: { type: action, component: Button, role: menuitem, intent: secondary, text: { key: Courses.actions.hide }, in: [menuOpen], emits: CHOOSE_HIDE, source: apps/nazar/features/courses/components/courses-table.tsx:173 } # both items are offered on every row whatever the person holds (F-A-8)

  # ---- "Dersi gizle": an AlertDialog, opened by the page's own state (no trigger) --------------------------------------------------------
  hideDialog: { type: page, component: Page, role: alertdialog, name: { labelledBy: hideTitle }, in: [confirmHide, hiding], initialFocus: hideCancel, source: apps/nazar/features/courses/components/hide-course.tsx:74 } # Base UI AlertDialog: modal, never closed by the scrim; the page behind is inert, so no page node is drawn in these states
  hideEyebrow: { type: text, component: Text, text: { key: composed.HideCourse.eyebrow, params: { name: madrasah.name } }, in: [confirmHide, hiding], source: apps/nazar/features/courses/components/hide-course.tsx:79 } # the medrese's name, above the title
  hideTitle: { type: text, component: Heading, role: heading, text: { key: HideCourse.title }, in: [confirmHide, hiding], source: libs/ui/src/mds/alert-dialog.tsx:74 } # Base UI's Title, an h2
  hideBody: { type: text, component: Text, text: { key: composed.HideCourse.body, params: { title: course.title, koskGenitive: kosk.nameGenitive } }, in: [confirmHide, hiding], when: "enrolled == 'none'", source: apps/nazar/features/courses/components/hide-course.tsx:87 } # the title is in <bdi>; it says who the course is hidden from and that the celses leave the talebe's calendar
  hideBodyAffected: { type: text, component: Text, text: { key: composed.HideCourse.bodyAffected, params: { title: course.title, koskGenitive: kosk.nameGenitive, count: course.enrolled } }, in: [confirmHide, hiding], when: "enrolled == 'some'", source: apps/nazar/features/courses/components/hide-course.tsx:90 } # the same paragraph with the real number of talebe who lose the course (courses#9 a3); the line is left out while nobody is enrolled (courses#10 a1)
  hideNote: { type: text, component: Text, text: { key: HideCourse.note }, in: [confirmHide, hiding], source: apps/nazar/features/courses/components/hide-course.tsx:92 } # "Hiçbir şey silinmez; Arşiv’den geri alabilirsiniz. Öğeyi gizleyen kademe ya da üstü geri alır."
  hideClose: { type: action, component: Button, role: button, intent: dismiss, name: { key: Shell.close }, in: [confirmHide, hiding], emits: CLOSE, source: libs/ui/src/mds/alert-dialog.tsx:82 } # an icon only, named by its aria-label; closing is ignored while the call runs (HIDE-3)
  hideCancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: HideCourse.cancel }, in: [confirmHide, hiding], emits: CANCEL, source: libs/ui/src/mds/alert-dialog.tsx:95 } # the focus starts here; it stays live while the call runs and does nothing (HIDE-3)
  hideConfirm: { type: action, component: Button, role: button, intent: confirm, text: { key: HideCourse.confirm }, in: [confirmHide, hiding], disabledIn: [hiding], emits: CONFIRM_HIDE, source: libs/ui/src/mds/alert-dialog.tsx:101 } # a primary button, not a destructive one: nothing is deleted; busy (aria-disabled) while the call runs
  hideBusy: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [hiding], source: libs/ui/src/mds/button.tsx:113 } # the visually hidden <output> of the busy button, "Yükleniyor" from the kit's default (F-A-14)

  # ---- the toasts that answer a hide: a region "Bildirimler", each toast a dialog (an error is an alertdialog and stays) ------------------------------
  toastHidden: { type: status, component: Status, role: dialog, name: { key: HideCourse.done }, text: { key: HideCourse.doneBody, params: { title: course.title } }, in: [listedWithout], when: "toast == 'hidden'", source: apps/nazar/features/courses/components/hide-course.tsx:45 } # success, 6 seconds; the only word that it worked (F-A-2)
  toastAlready: { type: status, component: Status, role: dialog, name: { key: HideCourse.alreadyTitle }, text: { key: HideCourse.already }, in: [listedWithout], when: "toast == 'alreadyHidden'", source: apps/nazar/features/courses/components/hide-course.tsx:50 } # tone info: it closes by itself, and the list is read again
  toastHideGone: { type: alert, component: Alert, role: alertdialog, name: { key: HideCourse.failedTitle }, text: { key: Courses.errors.gone }, in: [listedWithout], when: "toast == 'hideGone'", source: apps/nazar/features/courses/components/hide-course.tsx:56 } # tone error: it stays until closed; the list is read again, so the course is not in it
  toastHideRefused: { type: alert, component: Alert, role: alertdialog, name: { key: HideCourse.failedTitle }, text: { key: Problems.actionForbidden }, in: [listed], when: "toast == 'hideRefused'", source: apps/nazar/features/courses/components/hide-course.tsx:56 } # a nazır who may list the courses but not hide them meets it (F-A-8); the list is not read again
  toastHideFailed: { type: alert, component: Alert, role: alertdialog, name: { key: HideCourse.failedTitle }, text: { key: Problems.actionGeneric }, in: [listed], when: "toast == 'hideFailed'", source: apps/nazar/features/courses/components/hide-course.tsx:56 }

  # ---- Arşiv: what every state of the page draws -------------------------------------------------------------------------------------
  archiveMain: { type: page, component: Page, role: main, in: [archive, archiveEmpty, restoring], source: apps/nazar/features/archive/components/archive-page.tsx:71 } # the shell's one <main>; no name; the binding tells it from Dersler's by its caption
  archiveTitle: { type: text, component: Heading, role: heading, text: { key: Archive.title }, in: [archive, archiveEmpty, restoring], source: apps/nazar/features/archive/components/archive-page.tsx:73 } # h1
  archiveIntro: { type: text, component: Text, text: { key: Archive.intro }, in: [archive, archiveEmpty, restoring], source: apps/nazar/features/archive/components/archive-page.tsx:74 }
  coursesLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Nav.medrese.courses }, in: [listed, menuOpen, listedWithout, archive, archiveEmpty, restoring], emits: OPEN_COURSES, source: apps/nazar/features/shell/nav.ts:81 } # the sidebar's "Dersler" (the frame is nazar.shell.scopeAndMenu's), drawn on both pages: its name carries the number after it, so the binding finds it by its beginning. On Dersler it is the page's own address (not drawn as a step); from Arşiv it is the only way back to the list

  # the tabs: four links in a named <nav>, full page loads; the one of the page has aria-current="page", which the format cannot say
  tabsNav: { type: page, component: Page, role: navigation, name: { key: Archive.tabsLabel }, in: [archive, archiveEmpty, restoring], source: apps/nazar/features/archive/components/archive-list.tsx:173 }
  tabAll: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: composed.Archive.tabAll, params: { count: counts.all } }, in: [archive, archiveEmpty, restoring], emits: TAB_ALL, source: libs/ui/src/mds/tabs.tsx:289 } # "Tümü12": label and count with no space between (F-A-12)
  tabCourse: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: composed.Archive.tabCourse, params: { count: counts.course } }, in: [archive, archiveEmpty, restoring], emits: TAB_COURSE, source: libs/ui/src/mds/tabs.tsx:289 }
  tabWeeks: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: composed.Archive.tabWeeks, params: { count: counts.weeks } }, in: [archive, archiveEmpty, restoring], emits: TAB_WEEKS, source: libs/ui/src/mds/tabs.tsx:289 } # weeks and sessions together
  tabRecordings: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: composed.Archive.tabRecordings, params: { count: counts.recordings } }, in: [archive, archiveEmpty, restoring], emits: TAB_RECORDINGS, source: libs/ui/src/mds/tabs.tsx:289 } # its count is always 0: the API lists no recording (HIDE-2)

