  rowContext: { type: text, component: Text, text: { key: composed.Archive.rowContext, params: { context: item.context } }, in: [archive, restoring], repeat: archive.items, source: apps/nazar/features/archive/components/archive-list.tsx:100 } # "{köşk} · {n} hafta · {n} talebe" for a course; "{course} · Hafta {n} · {date}" for a session
  rowType: { type: text, component: Text, text: { oneOf: [Archive.types.course, Archive.types.week, Archive.types.session] }, in: [archive, restoring], repeat: archive.items, source: apps/nazar/features/archive/components/archive-list.tsx:112 } # a badge with an icon and the kind's word
  rowHiderName: { type: text, component: Text, text: { key: composed.Archive.rowHiderName, params: { name: item.hider.name } }, in: [archive, restoring], repeat: archive.items, source: apps/nazar/features/archive/components/archive-list.tsx:127 } # "Gizleyen": the person's name, or "Adı bilinmiyor"
  rowHiderRole: { type: text, component: Text, text: { key: composed.Archive.rowHiderRole, params: { role: item.hider.role } }, in: [archive, restoring], repeat: archive.items, source: apps/nazar/features/archive/components/archive-list.tsx:129 } # the role line: "Köşk nazımı", "Medaris yönetimi", or "Medrese başmüderrisi (siz)" for the viewer's own
  rowWhen: { type: text, component: Text, role: time, text: { key: composed.Archive.rowWhen, params: { when: item.when } }, in: [archive, restoring], repeat: archive.items, source: apps/nazar/features/archive/components/archive-list.tsx:140 } # a <time dateTime>: "Bugün 14:05", "Dün 10:40", "28 Eyl 16:10" in the viewer's own zone

  # the button where the caller's kademe reaches the one that hid the row, the sentence where it does not
  restoreButton: { type: action, component: Button, role: button, intent: secondary, name: { key: Archive.restoreLabel, params: { title: item.title } }, text: { key: Archive.restore }, in: [archive], repeat: archive.restorable, emits: RESTORE, source: apps/nazar/features/archive/components/archive-list.tsx:153 } # asks nothing first (the design draws no question); the name carries the item's title. The one in flight is rowRestore
  rowRestore: { type: action, component: Button, role: button, intent: secondary, name: { key: Archive.restoreLabel, params: { title: item.title } }, text: { key: Archive.restore }, in: [restoring], disabledIn: [restoring], source: apps/nazar/features/archive/components/archive-list.tsx:157 } # the row being restored, the first item of restoreButton: busy (aria-disabled) while the call runs; the other rows' buttons stay live
  restoreBusy: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [restoring], source: libs/ui/src/mds/button.tsx:113 } # "Yükleniyor", the kit's default (F-A-14)
  lockedKosk: { type: text, component: Text, text: { key: Archive.locked, params: { role: item.hider.role } }, in: [archive, restoring], when: "locks in ['kosk', 'both'] and held in ['courses', 'both'] and tab in ['all', 'course'] and page == 'first'", repeat: archive.lockedByKosk, source: apps/nazar/features/archive/components/archive-list.tsx:164 } # "Bunu köşk nazımı gizledi; yalnız o kademe ya da üstü geri alabilir." (the role lower-cased): no button on that row. The stack's rows of a higher kademe are courses on the first page of Tümü and of Dersler
  lockedAdmin: { type: text, component: Text, text: { key: Archive.lockedAdmin }, in: [archive, restoring], when: "locks in ['admin', 'both'] and held in ['courses', 'both'] and tab in ['all', 'course'] and page == 'first'", repeat: archive.lockedByAdmin, source: apps/nazar/features/archive/components/archive-list.tsx:164 } # "Bunu Medaris yönetimi gizledi; ..."; a hider with no role is Medaris yönetimi (archive.ts:144-149)

  # nothing to list on this tab: the table keeps its caption and headers and says it in one cell
  emptyAll: { type: text, component: Text, text: { key: Archive.empty.all }, in: [archiveEmpty], when: "tab == 'all'", source: apps/nazar/features/archive/components/archive-page.tsx:109 }
  emptyCourse: { type: text, component: Text, text: { key: Archive.empty.course }, in: [archiveEmpty], when: "tab == 'course'", source: apps/nazar/features/archive/components/archive-page.tsx:109 }
  emptyWeeks: { type: text, component: Text, text: { key: Archive.empty.weeks }, in: [archiveEmpty], when: "tab == 'weeks'", source: apps/nazar/features/archive/components/archive-page.tsx:109 }
  emptyRecordings: { type: text, component: Text, text: { key: Archive.empty.recordings }, in: [archiveEmpty], when: "tab == 'recordings'", source: apps/nazar/features/archive/components/archive-page.tsx:109 } # always what this tab says (HIDE-2)

  # the pager: only while the list spans more than one page (ten a page); the "Sonraki" link is absent on the last page and "Önceki" on the first
  pagerNav: { type: page, component: Page, role: navigation, name: { key: Archive.pager.label }, in: [archive, restoring], when: "tab == 'all' and pages == 'two'", source: apps/nazar/features/archive/components/archive-list.tsx:197 }
  pagerRange: { type: text, component: Text, text: { key: Archive.pager.range, params: { from: page.from, to: page.to, total: page.total } }, in: [archive, restoring], when: "tab == 'all' and pages == 'two'", source: apps/nazar/features/archive/components/archive-list.tsx:201 } # "1–10 / 12"
  pagerNext: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Archive.pager.next }, in: [archive, restoring], when: "tab == 'all' and pages == 'two' and page == 'first'", emits: NEXT_PAGE, source: apps/nazar/features/archive/components/archive-list.tsx:213 }
  pagerPrevious: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Archive.pager.previous }, in: [archive, restoring], when: "tab == 'all' and pages == 'two' and page == 'last'", emits: PREVIOUS_PAGE, source: apps/nazar/features/archive/components/archive-list.tsx:204 }

  # ---- the toasts that answer a restore ---------------------------------------------------------------------------------------------------
  toastRestored: { type: status, component: Status, role: dialog, name: { key: Archive.restored }, text: { key: Archive.restoredBody, params: { title: item.title } }, in: [archive, archiveEmpty], when: "toast == 'restored'", source: apps/nazar/features/archive/components/archive-list.tsx:67 } # success, 6 seconds; the row leaves and the tab counts follow when the page is read again (F-A-2)
  toastRestoreGone: { type: alert, component: Alert, role: alertdialog, name: { key: Archive.restoreFailedTitle }, text: { key: Archive.errors.gone }, in: [archive, archiveEmpty], when: "toast == 'restoreGone'", source: apps/nazar/features/archive/components/archive-list.tsx:74 } # tone error: it stays; the list is read again
  toastRestoreLevel: { type: alert, component: Alert, role: alertdialog, name: { key: Archive.restoreFailedTitle }, text: { key: Archive.errors.forbidden }, in: [archive, archiveEmpty], when: "toast == 'restoreLevel'", source: apps/nazar/features/archive/components/archive-list.tsx:74 } # ARCHIVE_FORBIDDEN and ARCHIVE_RESTORE_LEVEL say the same words: a higher kademe may have hidden it
  toastParentHidden: { type: alert, component: Alert, role: alertdialog, name: { key: Archive.restoreFailedTitle }, text: { key: Archive.errors.parentHidden }, in: [archive, archiveEmpty], when: "toast == 'parentHidden'", source: apps/nazar/features/archive/components/archive-list.tsx:74 } # the one refusal after which the list is not read again
  toastRestoreFailed: { type: alert, component: Alert, role: alertdialog, name: { key: Archive.restoreFailedTitle }, text: { key: Problems.actionGeneric }, in: [archive, archiveEmpty], when: "toast == 'restoreFailed'", source: apps/nazar/features/archive/components/archive-list.tsx:74 }

edges:
  - { labelledBy: [hideDialog, hideTitle] }
  - { triggers: [rowMenu, menuOpen] }
  - { triggers: [menuHide, confirmHide] }
  - { triggers: [hideConfirm, hiding] }
  - { triggers: [restoreButton, restoring] }
  - { returnsFocus: [hideDialog, rowMenu] } # Vazgeç, Kapat and Esc hand the focus back to the row's "···" (measured on the stack for the same Menu and AlertDialog in tedris.course.leave, whose window is opened from a menu item the same way; not measured here). After a hide the row is gone and so is the button: the focus is lost (F-A-2)

rules:
  - { id: F-A-2, rule: "After a hide the row and its menu button are gone and after a restore the pressed 'Geri al' leaves with its row; no code moves the focus (hide-course.tsx:40-71, archive-list.tsx:61-83), and the only word is a toast of 6 seconds. A keyboard or screen-reader user falls back to the top of the page. Not measured here. Fix: move the focus to the table's caption or to the next row's button, and keep a status line." }
  - { id: F-A-3, rule: "Not drawn here. The banner of a hidden medrese (restore-madrasah.tsx:68) is labelled by an id that exists nowhere, so the section has no name; it shows only on a hidden medrese, which nazar.archive.hideMedrese draws. Fix: give the Alert's title the id." }
  - { id: F-A-8, rule: "'Hocaları değiştir' and 'Dersi gizle' are offered on every row whatever the person holds (courses-table.tsx:167-178). A nazır who holds madrasah.course_hide or madrasah.muderris_manage reads the list but not both rights, and is refused with the toast 'Ders gizlenemedi' / 'Bunu yapma izniniz yok.' (toastHideRefused), not told beforehand. Fix: offer an item only where its permission is held (decision D2 of this flow)." }
  - { id: F-A-9, rule: "The title of every row is a link to /ders/<id> because `held` is built from the same list it is checked against (courses-page.tsx:92-94), so the link can lead to a course the person may not open. Not an issue for the başmüderris of the medrese." }
  - { id: F-A-10, rule: "No try/catch around the awaited server action in the window or on 'Geri al' (hide-course.tsx:42, archive-list.tsx:64): when the call itself rejects (the network), the busy state is never cleared and no toast is shown; React hands the error to the nearest boundary. Not verified in a browser." }
  - { id: F-A-12, rule: "A tab link's content is its label followed by an inline count <span> with no whitespace (tabs.tsx:293-297), so the accessible name reads 'Dersler1' and 'Tümü12' (the e2e asserts the DOM text 'Tümü5' in archive#1 a1). Fix: a visually hidden space, or the count in an aria-label. Not verified in a browser." }
  - { id: F-A-14, rule: "The busy buttons of the window ('Gizle') and of a row ('Geri al') pass no loadingLabel, so their hidden status says 'Yükleniyor' from the kit's hard-coded default (button.tsx:62), outside the catalog; Turkish only today." }
  - { id: HIDE-1, rule: "New finding, from the code; not seen in a browser. After 'Geri al' the page is read again with the same ?sayfa (router.refresh, archive-list.tsx:72). When the restored row was the only one on the last page, that page now has no items: the table says Archive.empty.all, 'Bu medresede gizlenmiş bir öğe yok.' (false, ten items are still hidden), and the pager reads '11–10 / 10' with 'Önceki' (pageWindow, archive.ts:71-75, and archive-page.tsx:127-128 draw a pager for any page above 1). Fix: send the person to the last page that has rows." }
  - { id: HIDE-2, rule: "New finding, from the code. The tab 'Ders kayıtları' can never list anything: its count is always 0 (the API's `recording` is not stored in the archive, 'a recording has no storage yet', madrasah-archive.controller.ts:55) and no route hides a recording. The tab and its sentence 'Bu medresede gizlenmiş bir ders kaydı yok.' are drawn for a feature the API does not have. Fix: leave the tab out until a recording can be hidden." }
  - { id: HIDE-3, rule: "New finding, from the code. While 'Gizle' is busy the window ignores every way of closing it (onOpenChange does nothing while `pending`, hide-course.tsx:76-78), but 'Vazgeç' and the close icon stay enabled and a press does nothing; only 'Gizle' is marked busy. Fix: mark 'Vazgeç' and the close icon disabled for the length of the call." }
  - { id: focus-not-set, rule: "Neither Dersler nor Arşiv sets a focus on load (both pages list 'Initial focus: none'), so the page nodes carry no initialFocus and no focus; the replay checks only the window's, on Vazgeç." }
  - { id: menu-focus-on-popup, rule: "Opened with the pointer, Base UI's menu puts the focus on its popup, not on an item (measured in tedris.course.leave for the same Menu). Opened with the keyboard it is not verified. Not drawn." }
  - { id: confirm-before-hiding, rule: "'Dersi gizle' asks first, in an alertdialog whose focus starts on 'Vazgeç' and which says who loses the course and how many talebe lose their access; 'Geri al' asks nothing (the design draws no question), because a restore gives access back and deletes nothing." }
  - { id: label-in-name, rule: "'Geri al' is contained in the name 'Geri al: {title}' (WCAG 2.5.3), and the row's menu button is an icon named by its aria-label 'Diğer işlemler: {title}'. A tab link's name 'Dersler1' contains its visible text (F-A-12 is about the missing space, not the label). Holds." }
  - { id: toast-is-the-only-word, rule: "The result of a hide and of a restore is said by a toast (a dialog in the 'Bildirimler' live region): it closes after 6 seconds for a success and an info notice and stays for an error. Nothing on the page itself says what was done, but the row and the counters change." }
