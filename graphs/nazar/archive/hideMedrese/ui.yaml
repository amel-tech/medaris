  rowRestoreBusy: { type: action, component: Button, role: button, intent: secondary, name: { key: Archive.restoreLabel, params: { title: item.title } }, text: { key: Archive.restore }, in: [restoringCourse], disabledIn: [restoringCourse], source: apps/nazar/features/archive/components/archive-list.tsx:157 } # the course being asked: busy (aria-busy), the other rows stay live
