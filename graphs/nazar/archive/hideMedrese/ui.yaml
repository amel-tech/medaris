  toastParentHidden: { type: alert, component: Alert, role: alertdialog, name: { key: Archive.restoreFailedTitle }, text: { key: Archive.errors.parentHidden }, in: [hidden], when: "last == 'parentHidden'", source: apps/nazar/features/archive/components/archive-list.tsx:74 }
