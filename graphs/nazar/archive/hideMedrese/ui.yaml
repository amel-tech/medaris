  toastRestoreLevel: { type: alert, component: Alert, role: alertdialog, name: { key: Archive.hidden.failedTitle }, text: { key: Archive.hide.restoreLevel }, in: [lockedHidden], when: "last == 'restoreLevel'", source: apps/nazar/features/archive/components/restore-madrasah.tsx:55 }
  toastRestoreRefused: { type: alert, component: Alert, role: alertdialog, name: { key: Archive.hidden.failedTitle }, text: { key: Problems.actionForbidden }, in: [hidden], when: "last == 'restoreRefused'", source: apps/nazar/features/archive/components/restore-madrasah.tsx:55 }
  toastRestoreFailed: { type: alert, component: Alert, role: alertdialog, name: { key: Archive.hidden.failedTitle }, text: { key: Problems.actionGeneric }, in: [hidden], when: "last == 'restoreFailed'", source: apps/nazar/features/archive/components/restore-madrasah.tsx:55 }

edges:
  - { labelledBy: [hideRegion, hideTitle] }
  - { labelledBy: [hideDialog, dialogTitle] }
  - { triggers: [hideButton, confirmHide] }
  - { triggers: [dialogConfirm, hiding] }
  - { triggers: [restoreMedrese, restoring] }
  - { triggers: [rowRestore, restoringCourse] }
  - { returnsFocus: [hideDialog, hideButton] } # Vazgeç, Esc or the close icon: the page's button is still there; the dialog has no trigger, so the return rests on the element that had the focus when it opened; not verified in the browser

rules:
  - { id: focus-not-set, rule: "The page sets no initial focus (nothing in features/archive does), so a person who arrives starts at the top of the document; the graph says no more. The dialog's focus on 'Vazgeç' is the app's own (libs/ui/src/mds/alert-dialog.tsx:64)." }
  - { id: F-A-2, rule: "After the hiding the button 'Medreseyi gizle' is replaced (by an Alert for an instant, then, once the page is read again, by the banner), and after the restore the banner is replaced by the section; no code moves the focus, and the only word is a toast of 6 seconds (hide-madrasah.tsx:46-69, restore-madrasah.tsx:40-65). Fix: after the page is read again, focus the banner's heading or the section's, and keep the line on the page." }
  - { id: F-A-3, rule: "restore-madrasah.tsx:68: aria-labelledby='hidden-heading' names an id that exists nowhere, so the banner's section has no name and the banner has no heading (its title is a <p>). Fix: give the Alert's title that id, or drop the attribute." }
  - { id: F-A-10, rule: "hide-madrasah.tsx:46-69 and restore-madrasah.tsx:40-65: no try/catch around the server action, so when the call itself fails (the network) the busy state is never cleared and no toast is shown; React hands the error to the nearest boundary. Not verified in a browser." }
  - { id: F-A-12, rule: "A tab link's name is its label with the count span glued on, with no space ('Dersler1'; archive-list.tsx:173-184, libs/ui/src/mds/tabs.tsx:65-69). Not verified in a browser." }
  - { id: F-A-14, rule: "The three busy buttons here (Gizle, Medreseyi geri getir, a row's Geri al) pass no loadingLabel, so their hidden status says 'Yükleniyor' from a hard-coded default outside the catalog (libs/ui/src/mds/button.tsx:62,114)." }
  - { id: F-A-16, rule: "The refusal of the read ('Bu sayfaya izniniz yok') is a neutral Alert, which is role=status and already in the page at load, so it is not announced (page-problem.tsx:23-29, libs/ui/src/mds/alert.tsx:23). Only the forbidden state draws it." }
  - id: HIDEMED-1
    rule: "restore-madrasah.tsx:77-83: the banner's button shows 'Medreseyi geri getir' but its aria-label is 'Geri getir: {name}', which does not contain the visible words (WCAG 2.5.3 Label in Name): a person who speaks the label they see ('Medreseyi geri getir') to voice control does not reach it. The row's 'Geri al' / 'Geri al: {title}' pair is fine. The e2e asserts the name by /^Geri getir: / (archive#7 a14). Fix: aria-label 'Medreseyi geri getir: {name}', or drop the aria-label (the banner already names the medrese)."
  - id: HIDEMED-2
    rule: "hide-madrasah.tsx:53-59: when the medrese was already hidden (409 MADRASAH_ALREADY_HIDDEN) the toast, an info, carries the success title 'Medrese gizlendi' with 'Bu medrese zaten gizli.' under it, and so does the Alert in the section until the page is read again; the person who pressed 'Gizle' is told she hid it, when someone else had. Fix: a title of its own ('Medrese zaten gizliydi')."
  - id: HIDEMED-3
    rule: "hide-madrasah.tsx:106-108: while the call runs, onOpenChange ignores every close, so 'Vazgeç', the close icon and Esc do nothing, and none of them is marked disabled or busy; only 'Gizle' shows busy. Not verified in a browser. Fix: disable 'Vazgeç' and the close icon with 'Gizle', or let them close the dialog (the call goes on)."
  - { id: row-restore-offered-while-parent-hidden, rule: "A hidden medrese lists its courses with 'Geri al', and every press is refused (409 ARCHIVE_PARENT_HIDDEN) until the medrese is brought back; the page says why only in the error toast after the press, and, for this refusal, does not read the list again (archive-list.tsx:79). Decision D1 of the flow. The e2e carries this behaviour (archive#7 a13)." }
  - { id: confirm-before-hiding, rule: "'Medreseyi gizle' asks first, in an alertdialog whose focus starts on 'Vazgeç' and which the scrim does not close; its body names what follows, in the app's own words (the shown courses go with it, nothing is deleted, who brings it back, and that the Arşiv's courses stay put until then). 'Medreseyi geri getir' asks nothing, as nothing is lost by it." }
  - { id: section-only-for-the-head, rule: "'Medreseyi gizle' is drawn only where runsMedrese holds (the başmüderris, or the başnazım) and the medrese is shown (archive-page.tsx:112): a nazır given madrasah.course_hide or madrasah.settings_edit opens the page and meets no section, because madrasah.hide is no grant (MDRS-108). The graph draws the başmüderris only." }
