# The screens of nazar.archive.hideMedrese: the Arşiv of a medrese (/medrese/<id>/arsiv) as it bears on hiding the medrese: the
# section "Medreseyi gizle" and its question, the banner of a hidden medrese with "Medreseyi geri getir", the courses that went with it,
# and the toasts of each answer. Read from apps/nazar/features/archive; the words are copied from libs/i18n/src/locales/tr/nazar.json.
# Two messages are not the app's: `composed.Button.loading` is the hidden status text a busy button writes (libs/ui/src/mds/button.tsx:114).
# `changes` is the app's own message that tells the person what hiding changes (the dialog's body), so no message is authored.
# A node that says "repeat" is drawn once per hidden course; the walk's medrese holds one course, and the binding says so.
schema: delurio-graph/0
kind: ui
id: nazar.archive.hideMedrese
flow: nazar.archive.hideMedrese
status: captured
catalog: catalog/tr.json
locales: [tr]
changes: { key: Archive.hide.confirmBody }
samples:
  name: Gizleme Denemesi Medresesi
  title: Deneme dersi hideMedrese

# The page keeps no focus of its own on load (nothing in features/archive sets it) and none after the hiding or the restore (F-A-2),
# so there is no `initialFocus` on the page and no `focus` here: the graph says nothing of what the code does not say.
nodes:
  # --- the page ---------------------------------------------------------------------------------------------------------------
  archivePage: { type: page, component: Page, role: main, in: [forbidden, shownMedrese, hidden, restoringCourse, restoring, lockedHidden], source: libs/ui/src/mds/app-shell.tsx:41 } # the shell's one <main id="main">; it has no name
  archiveTitle: { type: text, component: Heading, role: heading, text: { key: Archive.title }, in: [forbidden, shownMedrese, hidden, restoringCourse, restoring, lockedHidden], source: apps/nazar/features/archive/components/archive-page.tsx:73 } # level 1
  archiveIntro: { type: text, component: Text, text: { key: Archive.intro }, in: [forbidden, shownMedrese, hidden, restoringCourse, restoring, lockedHidden], source: apps/nazar/features/archive/components/archive-page.tsx:74 }
  forbiddenAlert: { type: alert, component: Alert, role: status, name: { key: Problems.forbiddenTitle }, text: { key: Problems.forbidden }, in: [forbidden], source: apps/nazar/features/shell/components/page-problem.tsx:23 } # a neutral Alert is a status, not an alert (F-A-16)

  # --- the tabs and the list --------------------------------------------------------------------------------------------------
  tabsNav: { type: list, component: List, role: navigation, name: { key: Archive.tabsLabel }, in: [shownMedrese, hidden, restoringCourse, restoring, lockedHidden], source: apps/nazar/features/archive/components/archive-list.tsx:173 }
  tabAll: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Archive.tabs.all }, in: [shownMedrese, hidden, restoringCourse, restoring, lockedHidden], source: apps/nazar/features/archive/components/archive-list.tsx:173 } # the link's name is the label with the count glued on ("Tümü1", F-A-12): found by its beginning
  tabCourse: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Archive.tabs.course }, in: [shownMedrese, hidden, restoringCourse, restoring, lockedHidden], source: apps/nazar/features/archive/components/archive-list.tsx:173 }
  tabWeeks: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Archive.tabs.weeks }, in: [shownMedrese, hidden, restoringCourse, restoring, lockedHidden], source: apps/nazar/features/archive/components/archive-list.tsx:173 }
  tabRecordings: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Archive.tabs.recordings }, in: [shownMedrese, hidden, restoringCourse, restoring, lockedHidden], source: apps/nazar/features/archive/components/archive-list.tsx:173 }
  archiveTable: { type: list, component: List, role: table, name: { key: Archive.caption }, in: [shownMedrese, hidden, restoringCourse, restoring, lockedHidden], source: apps/nazar/features/archive/components/archive-list.tsx:186 } # the caption is visually hidden; role=table is set because the table is `stack`
  emptyLine: { type: text, component: Text, text: { key: Archive.empty.all }, in: [shownMedrese], source: libs/ui/src/mds/table.tsx:160 } # while nothing is hidden: the medrese's courses are shown
