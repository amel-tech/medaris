  restoringBusy: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [restoring], source: libs/ui/src/mds/button.tsx:114 } # the banner button's hidden <output> (F-A-14)
  lockedBannerNote: { type: text, component: Text, text: { key: Archive.lockedAdmin }, in: [lockedHidden], source: apps/nazar/features/archive/components/restore-madrasah.tsx:85 } # in place of the button

  # --- the section "Medreseyi gizle", under the list; drawn only while the medrese is shown and she runs it -----------------------
  hideRegion: { type: page, component: Page, role: region, name: { labelledBy: hideTitle }, in: [shownMedrese], source: apps/nazar/features/archive/components/hide-madrasah.tsx:72 }
  hideTitle: { type: text, component: Heading, role: heading, text: { key: Archive.hide.title }, in: [shownMedrese], source: apps/nazar/features/archive/components/hide-madrasah.tsx:77 } # level 2
  hideText: { type: text, component: Text, text: { key: Archive.hide.text, params: { name: madrasah.name } }, in: [shownMedrese], source: apps/nazar/features/archive/components/hide-madrasah.tsx:91 }
  hideButton: { type: action, component: Button, role: button, intent: secondary, text: { key: Archive.hide.button }, in: [shownMedrese], emits: HIDE, source: apps/nazar/features/archive/components/hide-madrasah.tsx:94 }

  # --- Medreseyi gizle asks once ----------------------------------------------------------------------------------------------
  hideDialog: { type: page, component: Page, role: alertdialog, name: { labelledBy: dialogTitle }, in: [confirmHide, hiding], initialFocus: dialogCancel, source: libs/ui/src/mds/alert-dialog.tsx:62 } # its eyebrow is the medrese's name; the scrim does not close it
  dialogTitle: { type: text, component: Heading, role: heading, text: { key: Archive.hide.title }, in: [confirmHide, hiding], source: libs/ui/src/mds/alert-dialog.tsx:74 }
  dialogBody: { type: text, component: Text, text: { key: Archive.hide.confirmBody, params: { name: madrasah.name } }, in: [confirmHide, hiding], source: apps/nazar/features/archive/components/hide-madrasah.tsx:117 }
  dialogCancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: Archive.hide.cancel }, in: [confirmHide, hiding], emits: CANCEL, source: libs/ui/src/mds/alert-dialog.tsx:95 } # the focus starts here; while the call runs it does nothing and is not marked disabled (HIDEMED-3)
  dialogConfirm: { type: action, component: Button, role: button, intent: confirm, text: { key: Archive.hide.confirm }, in: [confirmHide, hiding], disabledIn: [hiding], emits: CONFIRM_HIDE, source: libs/ui/src/mds/alert-dialog.tsx:101 } # busy (aria-busy) while the call runs
  dialogClose: { type: action, component: Button, role: button, intent: dismiss, name: { key: Shell.close }, in: [confirmHide, hiding], emits: CLOSE, source: libs/ui/src/mds/alert-dialog.tsx:82 } # an icon button named only by aria-label
  hidingBusy: { type: status, component: Status, role: status, text: { key: composed.Button.loading }, in: [hiding], source: libs/ui/src/mds/button.tsx:114 } # the confirm button's hidden <output> (F-A-14)

  # --- the toasts: a region "Bildirimler", each toast a dialog (a success or an info) or an alertdialog (an error, which stays) ---
  toastHidden: { type: status, component: Status, role: dialog, name: { key: Archive.hide.done }, text: { key: Archive.hide.doneBody, params: { name: madrasah.name } }, in: [hidden], when: "last == 'hidden'", source: apps/nazar/features/archive/components/hide-madrasah.tsx:53 } # tone success: it closes by itself after 6 seconds
