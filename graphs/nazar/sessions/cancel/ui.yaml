rules:
  - { id: focus-not-set, rule: "Nothing in features/sessions gives the page a focus when it opens, and nothing gives one after the dialog closes on a cancel (the pressed button leaves with its row's state and the dialog is controlled, with no trigger element): the focus falls to the document. The dialog passes no `initialFocus`, so Base UI's default applies (the first tabbable, the close icon by document order); not verified. The only programmatic focus is on the make-up row after \"Telafisi\" (cancel-dialog.tsx has none; sessions-table.tsx:296-304)." }
  - { id: F-C-course-a-20, rule: "\"Celseyi iptal et\" is a primary, plain `Dialog` submit (cancel-dialog.tsx:153), not styled as destructive and not an AlertDialog (justified by the make-up fields): the irreversible confirm looks like \"Kaydet\" on the same page. Fix: `variant=destructive` on the confirm; see CANCEL-4 for what the dialog does not say." }
  - { id: F-C-course-a-25, rule: "The dialog is controlled (`open`) with no trigger element, so where the focus returns on Vazgeç or Esc is Base UI's fallback to the element that had it (the row's \"İptal et\", not verified); after a cancel that element is gone with the row's buttons and the focus is lost. Fix: pass the opener as `finalFocus`, or focus the cancelled row's name cell or the table caption and say it in the toast." }
  - { id: F-C-course-a-26, rule: "While the calls run, Esc, the close icon and \"Vazgeç\" are ignored and say nothing (`if (!open && !pending) onClose()`, cancel-dialog.tsx:143); only the fields are disabled, the three buttons stay enabled and do nothing. Fix: disable the X and Vazgeç with aria-disabled and say why." }
  - { id: F-C-course-a-28, rule: "The busy \"Celseyi iptal et\" passes no loadingLabel, so its hidden <output> says \"Yükleniyor\" from the kit's hard-coded default (button.tsx:62, :114), outside the catalog." }
  - { id: F-L-17, rule: "The family of F-C-course-a-25: the focus is lost after a row action that removes or disables the focused control and the only word is a toast of 6 seconds. Here the row's state changes under the cancel and nothing moves the focus." }
  - { id: F-L-12, rule: "Field's error text is no live region (libs/ui/src/mds/field.tsx:50-53), so \"Tarihi ve saati girin.\" is read only when the focus returns to the date field; the focus is on the submit button when it appears." }
  - { id: F-A-11, rule: "Seen from here, not drawn here: the note typed in this dialog is what the Pano's list of the next seven days shows for a cancelled celse, cut to one line with the whole text only in `title` (pano-tables.tsx:91-97), so a keyboard or touch user cannot read a note of up to 500 characters there. nazar.pano.decideApplications carries it." }
  - { id: cancel-no-type-check, rule: "The domain's finding of the same name (invariant session-cancel-takes-live-sessions-only): cancelLesson has no lesson-type check (course.repository.ts:1330), so a video, document or quiz lesson can be cancelled through the API. This page cannot do it: its rows are the LIVE lessons that have a time (sessions.ts:127-155). The cancelled video that results is read by tedris.celse.cancelled, whose programme links to a not-found page." }
  - { id: lesson-cancelled-text-streams-only, rule: "The domain's finding of the same name (invariant session-cancelled-message-fits-its-route): a 409 LESSON_CANCELLED says \"a cancelled session takes no live stream link\" whatever route refused (errors/lesson-cancelled.error.ts:11), and sessionErrorKey maps the code to the stream sentence (sessions.ts:514). This dialog never meets it: the cancel's own refusal is LESSON_ALREADY_CANCELLED, worded \"Bu celse zaten iptal edilmiş.\". The hoca meets the sentence on the stale row's stream button (nazar.sessions.manage) and on a recording added to a cancelled celse (nazar.recordings.add)." }
  - { id: CANCEL-1, rule: "New. The make-up is made with the cancelled celse's title and length and nothing else (makeUpRequest, sessions.ts:470-484): no meeting link, no stream, no in-person mark of its own, and createSessionBatch gives a link only to what the body carries (course.repository.ts:1874). So the make-up lands in Celseler as \"Eksik\", the sidebar's number on Celseler rises by one, and the talebe are invited to a celse with no link, even when the cancelled celse had one. The check box says \"Aynı başlık ve sürede yeni bir celse açılır.\" and nothing about it. Fix: copy the link, or add a field for it under the date and time. From the code; not seen in a browser." }
  - { id: CANCEL-2, rule: "New. A cancel with a make-up carries the course version the batch left, not the one the page was read at (cancel-dialog.tsx:98), so the page's own staleness check is bypassed: a celse that someone rescheduled or hid since the page was read is cancelled all the same, and only a cancel with no make-up answers COURSE_VERSION_CONFLICT. When the cancel then fails (LESSON_ALREADY_CANCELLED) the make-up stays, linked to nothing, and the talebe have been invited to it; this page has no way to remove it. Fix: send the version the page was read at when the batch is made, or check the celse's own state before." }
  - { id: CANCEL-3, rule: "New. \"Tarihi ve saati girin.\" is set when the date or the time is missing (cancel-dialog.tsx:76-78) and cleared only when the check box is turned (:182); typing a date leaves it under the field. It is also drawn under \"Tarih\" even when the time is the empty one (:190). Fix: clear it on change, and put it under the field that is empty." }
  - { id: CANCEL-4, rule: "New. The dialog does not say that a cancellation cannot be taken back (no route of tedrisat un-cancels a celse; lesson.controller.ts has none) nor that the talebe are told at once by a notification and a calendar mail. The body says only that the celse stays in the programme as \"İptal edildi\"; the confirm is not destructive-styled (F-C-course-a-20). Decision D2." }
  - { id: CANCEL-5, rule: "New. The make-up's date is checked for nothing but being a date (instantOf, sessions.ts:330-338); the `<input type=date>` has no `min`, and tedrisat's batch refuses neither a past date nor one before the cancelled celse (weekly-pattern.ts has no such rule). A make-up in the past is created as a finished celse and the cancelled row links to it. Fix: `min` on the field and a refusal in expandWeeklyPattern for a past start. From the code; not seen in a browser." }
  - { id: CANCEL-6, rule: "New. The note's limit of 500 characters is a bare `maxLength` (cancel-dialog.tsx:168): no counter, no help line, no message; typing stops without a word, as in F-B-appeals-4. Fix: a counter or a help line under the field." }
  - { id: telafi-focus, rule: "\"Telafisi\" focuses the make-up row's name cell, a span with tabIndex=-1 and no role (sessions-table.tsx:270-274, :302): a screen reader reads its content (the title and \"Hafta n · Telafi celsesi\"); the focus does not return to the link, and the link is a plain anchor whose address (#celse-<id>) is cancelled by the handler. Holds as a move of the focus; the span's missing role is small." }
  - { id: label-in-name, rule: "The visible text of each button is contained in its accessible name: \"İptal et\" in \"{when} celsesini iptal et\" (WCAG 2.5.3). Holds." }
  - { id: confirm-before-cancelling, rule: "\"İptal et\" asks first, in a form dialog whose focus does not start on the confirm (the first tabbable, not verified) and which the scrim does not close; the make-up and the note are part of the same confirmation. Holds, apart from CANCEL-4." }
