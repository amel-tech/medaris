# The screens of nazar.sessions.cancel: Celseler (/ders/<id>/celseler) with "İptal et" on a planned row, the dialog "Celseyi iptal et" over
# it, the toasts of the answer and the cancelled row with its "Telafisi" link. Read from apps/nazar/features/sessions/components/
# {sessions-page,sessions-table,cancel-dialog}.tsx, features/sessions/{sessions,actions}.ts and libs/ui/src/mds/{dialog,checkbox,field,
# table,toast,button}.tsx on 15 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nazar.json (namespaces Sessions, Problems,
# Shell). Not looked at in a browser: every role, name and focus below is from the code.
#
# Messages that are not the app's own:
#   Changes.note                     authored: no message of the app says what a cancellation changes (the toast says only "Celse iptal
#                                    edildi"). Each sentence was checked against course.repository.ts (cancelLesson), course-notifier.ts
#                                    (sessionCancelled), lesson-invitation (the CANCEL mail), cancel-dialog.tsx and the routes of
#                                    lesson.controller.ts (no route un-cancels a celse).
#   composed.Sessions.counts         "{count} celse · Hafta {range}": the counts line is Sessions.count, Sessions.cancelledCount and
#                                    Sessions.weekRange joined with " · " (sessions-table.tsx:571-583), here without the middle one
#   composed.Sessions.countsCancelled the same with "{cancelled} iptal edildi" in the middle, once a celse is cancelled
#   composed.Sessions.rowTitle       "{title}", the celse's own title as the dialog's eyebrow (cancel-dialog.tsx:147)
#   composed.Sessions.makeUpCaption  "Hafta {week} · Telafi celsesi": the caption of a make-up's name cell, Sessions.week and
#                                    Sessions.makeUp joined with " · " (sessions-table.tsx:289-290)
#   composed.Button.loading          "Yükleniyor", the hidden word of a busy button, hard-coded in the kit (libs/ui/src/mds/button.tsx:62)
#
# The page behind the dialog is inert while the dialog is open, so no page node is listed in a dialog state. A toast is a dialog in the
# "Bildirimler" live region; an error toast is an alertdialog and stays until closed, a success toast closes after 6 seconds
# (libs/ui/src/mds/toast.tsx:30).
