rules:
  - { id: F-C-course-a-08, rule: "The four inline forms are plain cards rendered BELOW the table, far from the row's button that opened them: nothing traps or moves the focus into one when it opens, and when Kaydet or Vazgeç unmounts it the focus falls to the document (sessions-table.tsx:584-714; F-L-17). Fix: focus the form's first field on open and the row's button on close." }
  - { id: F-C-course-a-01, rule: "The field errors of the link, time and stream forms and of the release dialog (the tinted sentence that replaces the help) are plain text with no role=alert and no live region, and nothing moves the focus after a refused 'Kaydet': a screen-reader user does not know the send was refused (sessions-table.tsx:604-688, release-fields.tsx:70-85). Fix: role=alert on the error, or focus the first invalid field." }
  - { id: F-C-course-a-07, rule: "'Tarih', 'Saat' and 'Açılış tarihi ve saati' are marked required by an aria-hidden star only; none of the controls carries required or aria-required (the forms are noValidate), so 'required' is never announced (sessions-table.tsx:665-678, release-fields.tsx:70-73)." }
  - { id: F-C-course-a-19, rule: "No try/catch around the awaits of changeSession and setLiveStream: a call that fails outright, such as a dropped network, leaves `busy` true, so 'Kaydet' stays busy and 'Vazgeç' stays off with no message (sessions-table.tsx:192-200, :247-252). Not verified at runtime and not drawn." }
  - { id: F-C-course-a-25, rule: "ReleaseDialog is controlled (`open`) with no trigger element, so where the focus returns on close depends on Base UI's fallback to the previously focused element; not verified. The cancel dialog is the same (nazar.sessions.cancel). Fix: pass the opener as finalFocus or render the dialog with a DialogTrigger." }
  - { id: F-C-course-a-26, rule: "While the release write runs, Esc and the close icon do nothing and say nothing (release-dialog.tsx:111-113); only the busy 'Kaydet' says 'Yükleniyor'. Fix: disable the icon with aria-disabled and say why." }
  - { id: F-C-course-a-27, rule: "From Celseler the release dialog's eyebrow is the celse's date in full ('17 Kasım 2026 Salı 21:00'), not its title, and the success toast reads '{date} celsesinin kaydı …', while Ders kayıtları passes the title (sessions-table.tsx:766, release-dialog.tsx:116). Fix: pass the title and keep the date as a second line." }
  - { id: F-C-course-a-28, rule: "Outside the catalog: the busy word 'Yükleniyor' of 'Kaydet' (libs/ui/src/mds/button.tsx:62; sessions-table.tsx:709 and release-dialog.tsx:122 pass no loadingLabel) and the placeholders 'https://zoom.us/j/…' (sessions-table.tsx:653) and 'https://studio.youtube.com/video/…' (:612). The placeholders are language-neutral; the busy word is Turkish only." }
  - { id: F-C-course-a-29, rule: "Holds on this page: a cell with no value says so in a visually hidden sentence ('Bağlantı gösterilmez' for a cancelled celse, 'Katılım bilgisi gösterilmez' when the read carried no attendance, 'İşlem yok' for a row with no action; sessions-table.tsx:305-324, :446-448), not an aria-hidden dash alone. The defect is Ders kayıtları's (nazar.recordings.add). Not drawn: a cancelled row and a content-locked read are out of view." }
  - { id: F-L-17, rule: "After a write the form or dialog closes, the row's button is still there and nothing gives it the focus, and the only word that the write was made is a toast that closes after 6 seconds; the one change that stays on screen is the row itself (the platform chip, 'Yüz yüze', 'Eksik' gone). Fix: focus the row's button, or a persistent status line." }
  - { id: MANAGE-1, rule: "PATCH /lessons/{id} writes no audit row for a changed meeting link, time or in-person mark (apps/tedrisat/src/course/course.repository.ts:1555-1625; course.service.ts:1177-1196; the only audit it can write is resource.file_delete), while the stream (lesson.live_stream_set / _clear), the recording access (lesson.recording_availability_set) and the cancel (lesson.cancel) are audited. Nobody can say afterwards who moved a celse or changed its link. New finding (not in the inventory). Fix: write an audit row from updateLesson for the three fields, as the sibling writes do. The binding's effect checks that none is written today." }
  - { id: MANAGE-2, rule: "A write refused with LESSON_NOT_FOUND (the celse was hidden or removed while the page was open) is worded 'Bir şeyler ters gitti…' and the page is not read again: only COURSE_VERSION_CONFLICT is `courseMoved` (sessions.ts:495-523; sessions-table.tsx:161-169), so the row of a celse that is gone stays on screen with its buttons. The release dialog words the same code 'Bu celse ya da kayıt artık yok. Sayfa yenileniyor.' and does read again (release-dialog.tsx:83-86). New finding. Fix: treat LESSON_NOT_FOUND as `courseMoved` and give it its own sentence." }
  - { id: MANAGE-3, rule: "The calendar invitation names how the celse is attended as of its last send ('Toplantı bağlantısı celse sayfasındadır', 'canlı yayınlanır', 'yüz yüze'), and the invitation sweep re-sends one only when the start, the length or a title changed (lesson-invitation.repository.ts:226-233; invitation-mail.ts:204; calendar/lesson-calendar.ts:54-63). A talebe invited while the celse was 'Eksik' (the mail then reads as if a meeting link were on the page) is never told when the celse turns out to be streamed or held in person, nor that a link was added. New finding, from the code; not verified in Mailpit. Fix: compare the attendance kind in findRequestsDue (D2)." }
  - { id: MANAGE-4, rule: "A field error is cleared only when a form is opened again (startLink, startStream, startTime call setProblem(null); saveEditing never does): after a refused 'Kaydet', a corrected value is sent with the old sentence still under the field, and when that write is then refused (409, a stream the server will not take) the form comes back with the old sentence still there although the field is right (sessions-table.tsx:170-185, :216-246). New finding, from the code; not verified in a browser. Fix: clear the problem on every change of the field and on a send." }
  - { id: MANAGE-5, rule: "A meeting link can be replaced but never removed from this page: the form refuses an empty field with 'Toplantı bağlantısı https:// ile başlamalı…' (sendableLink returns null for it: sessions.ts:290-293), although PATCH /lessons/{id} takes meetingUrl: null, and the stream form has its 'Bağlantıyı kaldır'. A link pasted by mistake can only be replaced by another https address, and a celse can never go back to 'Eksik'. New finding, decision D1. Fix: send null for an empty field, or add the same button." }
  - { id: MANAGE-6, rule: "Four row buttons break WCAG 2.5.3 (the visible text must be part of the accessible name): 'Bağlantıyı güncelle' is named '{when} celsesinin bağlantısını güncelle', 'Canlı yayın ekle' '{when} celsesine canlı yayın bağlantısı ekle', 'Canlı yayını güncelle' '{when} celsesinin canlı yayın bağlantısını güncelle' and 'Tarihi değiştir' '{when} celsesinin tarihini değiştir', so the words a voice-control user reads are not a run of the name ('bağlantıyı', 'canlı yayın ekle', 'tarihi' are not in it). The other four hold: 'Bağlantı ekle', 'Yüz yüze ayarı', 'Kayıt erişimi', 'İptal et' (sessions-table.tsx:455-530, catalog Sessions.*Label). New finding, from the catalog; not in the inventory. Fix: make the label start with the visible text, as the Pano does ('Onayla: {name}'): 'Tarihi değiştir: {when}'." }
  - { id: a-row-has-the-buttons-of-the-codes-it-holds, rule: "Each button is drawn for the code it needs and the API still decides: the link, the time, the in-person mark and 'İptal et' for session.manage (`canManage`); the stream buttons for session.live_link when the stream links were read; 'Kayıt erişimi' for recording.manage. A ders nazırı holding only session.live_link opens the page and meets one button per row; one holding only recording.manage is refused the page (PAGE_CODES.sessions)." }
  - { id: no-question-asked, rule: "None of the four writes asks first: 'Bağlantıyı kaldır' clears a stream with no question, and a time moved reaches every enrolled talebe with a notice and a new calendar invitation. 'İptal et', the one write with a confirmation, is nazar.sessions.cancel." }
