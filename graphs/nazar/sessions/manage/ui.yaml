# The screens of nazar.sessions.manage: Celseler (/ders/<id>/celseler) with its table of celses still ahead, the four inline forms
# (meeting link, date and time, in-person mark, stream link), the "Kayıt erişimi" dialog and the toasts of every write. Read from
# apps/nazar/features/sessions (sessions-page.tsx, sessions-table.tsx, attendance-cell.tsx) and features/recordings/components
# (release-dialog.tsx, release-fields.tsx); the words are copied from libs/i18n/src/locales/tr/nazar.json by script, letter for letter.
#
# Authored, not copied: `Changes.note`, the one message of this catalog no app message stands for (nothing in the app says what these
# writes change and who is told).
# Built in code, in no i18n file (each is named by its line):
#   composed.Button.loading                     libs/ui/src/mds/button.tsx:62 (the default loadingLabel of a busy Button, F-C-course-a-28)
#   composed.Sessions.fullWhen                  sessions-table.tsx:766 (the celse's date in full, the dialog's eyebrow, F-C-course-a-27)
#   composed.Sessions.platform                  libs/ui/src/mds/platform-chip.tsx:9-15 (the chip's label for a known platform, as attendance-cell.tsx:39 draws it)
#   composed.Recordings.release.timeBoxName     libs/ui/src/mds/date-time-field.tsx:104 (the time box is named by the field's label and its own, "Saat")
# Where a node says "repeat", the page draws it once per row of the table; the replay finds the rows through the binding. The page behind a
# dialog is inert, so no page node is `in` a dialog state. The forms are NOT dialogs: the page stays live while one is open.
