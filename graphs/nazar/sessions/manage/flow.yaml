# Celseler of a course in nazar-web (/ders/<id>/celseler), where its staff set how each celse is attended: the meeting link, the time,
# the in-person mark, the YouTube stream and the recording access. Read from the code of PR #394's branch on 15 Nov 2026
# (apps/nazar/features/sessions/, features/recordings/components/release-dialog.tsx, the API's PATCH /lessons/{id},
# PUT /lessons/{id}/live-stream, PUT /lessons/{id}/recording-availability). It says what the code does today. What it finds wrong is
# in ui.yaml `rules` and in the descriptions of the states it touches:
#   - the four inline forms open BELOW the table, far from the row's button, and move no focus; closing one drops the focus to the page
#     (F-C-course-a-08, F-L-17); the release dialog is controlled and has no trigger, so where its focus returns is the library's
#     (F-C-course-a-25); both are from the code, none was seen in a browser;
#   - a field error is cleared only when a form is opened again, so a corrected value is sent, and a refused write is answered, with the
#     old sentence still under the field (MANAGE-4);
#   - a link, a time or an in-person mark written by PATCH /lessons/{id} leaves no audit row, though the stream, the recording access and
#     the cancel do (MANAGE-1);
#   - a celse that was hidden meanwhile (LESSON_NOT_FOUND) is worded "Bir şeyler ters gitti" and not read again, while the same code in
#     the release dialog says the celse is gone and reads the page again (MANAGE-2);
#   - the calendar invitation names how a celse is attended as of its last send, and a link, a stream or an in-person change alone sends
#     nothing new (MANAGE-3);
#   - a meeting link can be replaced and never removed, though the API takes null (MANAGE-5);
#   - an exam celse wears the badge "Sınav" ("Telafi" for a make-up exam) beside its title, as Tedris and Değerlendirme draw it (fdc6e995; the case
#     variable `exam`). No scenario holds one: exam-data.mjs of nazar.evaluation.examScores plans its exam a day behind the clock, so it would sit in
#     the page's second table, which this graph does not draw.
# The talebe's half is tedris.celse.attend; the planner is nazar.sessions.plan; "İptal et" is nazar.sessions.cancel (started below).
schema: delurio-graph/0
kind: flow
id: nazar.sessions.manage
status: captured
domain: medaris.api
ui: nazar.sessions.manage
title: Set how a celse is attended
summary: >-
  The müderris (or a ders nazırı who holds the codes) opens Celseler. Each celse still ahead is a row with its "Katılım": its meeting
  link, its YouTube stream, the in-person mark, or "Eksik" when it has none. A row has a button for each thing the person may change:
  "Bağlantı ekle" or "Bağlantıyı güncelle", "Yüz yüze ayarı", "Canlı yayın ekle" or "Canlı yayını güncelle", "Kayıt erişimi",
  "Tarihi değiştir" and "İptal et". The first four of those open a small form under the table (the meeting link, the stream link,
  one of three in-person choices, the date and time); "Kayıt erişimi" opens a dialog. "Kaydet" writes one change, a toast says what
  was saved, the form closes and the table is read again: "Eksik" leaves the row, and the sidebar's number of celses with no way in
  falls. A write the API refuses is a toast and the form stays open; a link the page can see is wrong is refused before anything is
  sent, under its field. Which buttons a person sees follows the code each needs: session.manage for the link, the time, the
  in-person mark and "İptal et"; session.live_link for the stream; recording.manage for "Kayıt erişimi". Nothing moves the focus.

scope:
  shows: >-
    Celseler of one course for a person who may open it: the header, the table of celses still ahead with their Katılım, the
    four inline forms, the "Kayıt erişimi" dialog, the toasts of every write, and the sidebar's number
  world: open
  outOfView:
    - "a course with no celse at all (the Alert 'Bu derste henüz celse yok' and the plan link), the 'Geçmiş celseler' table and its fold, a celse that has begun (it has no 'Tarihi değiştir' and no 'İptal et') and a cancelled one (it has no buttons and says 'İşlem yok'): only the clock and the data decide them"
    - "'Celse planla' and its page: nazar.sessions.plan; 'İptal et', its note and its make-up: nazar.sessions.cancel (started below); 'Telafisi' and the cancelled celse as the talebe meets it: tedris.celse.cancelled"
    - "how the talebe meets the link, the stream and the in-person mark: tedris.celse.attend, tedris.celse.watchStream; the recording and its access from Ders kayıtları: nazar.recordings.add"
    - "a course that is held in person (its first radio then reads 'Ders yüz yüze yapılıyor…' and a celse that follows the course is covered without any other way); this graph draws a course held online"
    - "pressing another row's button while a form is open (it swaps the form), and every mix of the three codes but the four the context names"
    - "a read that failed (the retry state 'Celseler okunamadı'), an ended session (both server calls then send the person to sign in: realm.auth.signIn), and a call that fails outright, such as a dropped network (F-C-course-a-19)"

decisions:
  D1:
    question: >-
      Should a meeting link be removable from this page? The API takes null (PATCH /lessons/{id} meetingUrl), the stream has "Bağlantıyı
      kaldır", and the link form refuses an empty field, so a link pasted by mistake can only be replaced by another https address.
    recommend: >-
      Yes: let the form send null for an empty field, or add the same button the stream has, and say in the help that the celse then
      reads "Eksik" again.
    affects: [linkForm, savingLink]
  D2:
    question: >-
      Should a change of how a celse is attended (link, stream, in person) reach the talebe, as a change of time does? Today the time
      sends a notice and a new calendar invitation; the others send nothing, and an invitation already sent says how the celse was
      attended when it was sent.
    recommend: >-
      Yes, in the e-mail notice MDRS-189 plans; until then compare the attendance line in the invitation sweep too (MANAGE-3).
    affects: [savingLink, savingInPerson, savingStream, removingStream]

context:
  holds:
    values: [all, manage, stream, none]
    initial: any
    say:
      all: "the müderris of the course: every course code, so session.manage, session.live_link and recording.manage"
      manage: "a ders nazırı who holds session.manage and nothing else of these (the seeded one): no stream button, no 'Kayıt erişimi'"
      stream: "a ders nazırı who holds session.live_link alone: the page opens and offers the stream, nothing else"
      none: "a person who holds neither session.manage nor session.live_link: the page refuses (nazar.access.dersNazirPages)"
  changeAnswer:
    values: [saved, moved, forbidden, failed]
    initial: any
    say:
      saved: "the API takes the change of the link, the time or the in-person mark"
      moved: "the course was saved by someone else since the page was read: a stale version (409)"
      forbidden: "the API refuses for lack of session.manage (it was taken away after the page opened)"
      failed: "the API refuses for any other reason: the celse is gone, the body is refused"
  streamAnswer:
    values: [saved, moved, forbidden, failed]
    initial: any
    say:
      saved: "the API takes the stream link, or clears it"
      moved: "the celse is not a live one any more, or was cancelled meanwhile"
      forbidden: "the API refuses for lack of session.live_link (it was taken away after the page opened)"
      failed: "the API refuses for any other reason: the celse is gone, or the server's parser takes the link the page accepted for no stream"
  releaseAnswer:
    values: [saved, moved, forbidden, failed]
    initial: any
    say:
      saved: "the API takes the release time"
      moved: "the celse is gone (LESSON_NOT_FOUND): the dialog closes and the page is read again"
      forbidden: "the API refuses for lack of recording.manage (it was taken away after the page opened)"
      failed: "the API refuses for any other reason: the time could not be read"
  exam:
    values: [none, exam, retake]
    initial: any
    say:
      none: "the celse is a plain lesson"
      exam: "the celse is an exam (a lesson_exams row, isRetake false): its name carries the badge 'Sınav'"
      retake: "the celse is a make-up exam (isRetake true): its name carries the badge 'Telafi'"
  link:
    values: [none, set]
    initial: none
    say: { none: "the celse has no meeting link", set: "the celse has a meeting link" }
  stream:
    values: [none, set]
    initial: none
    say: { none: "the celse has no stream link", set: "the celse has a stream link" }
  held:
    values: [course, yes, no]
    initial: course
    say:
      course: "the celse follows the course's in-person setting (held online here)"
      yes: "the celse is marked in person"
      no: "the celse is marked not in person"
  release:
    values: [ready, at]
    initial: ready
    say: { ready: "the recording opens as soon as it is ready", at: "the recording opens at a time the team set" }
  picked:
    values: [course, yes, no]
    initial: course
    say: { course: "the in-person form has 'Dersin ayarına uy' chosen", yes: "it has 'Yüz yüze' chosen", no: "it has 'Yüz yüze değil' chosen" }
  mode:
    values: [ready, at]
    initial: ready
    say: { ready: "the dialog has 'Hazır olunca hemen' chosen", at: "it has 'Şu tarih ve saatte' chosen" }
  entered:
    values: [blank, valid, invalid]
    initial: blank
    say:
      blank: "the open form's field is empty"
      valid: "it holds what the page accepts: an https link, a YouTube video link, a date and a time, a time in the future"
      invalid: "it holds what the page refuses: a link that is not https, a channel link, no date, a time in the past"
  said:
    values: [none, link, time, stream, release]
    initial: none
    say:
      none: "no field error is shown"
      link: "'Toplantı bağlantısı https:// ile başlamalı…' under the link field"
      time: "'Tarihi ve saati girin.' under Tarih"
      stream: "one of the five stream problems under the stream field"
      release: "one of 'Tarihi ve saati yazın.', 'İleri bir tarih ve saat seçin.', 'Celse … başlıyor; kayıt ondan önce açılamaz.' under the time"
  toast:
    values: [none, linkSaved, timeSaved, inPersonSaved, streamSaved, streamRemoved, releaseSaved, moved, forbidden, failed]
    initial: none
    say:
      none: "no toast, or the last one is gone"
      linkSaved: "'Bağlantı kaydedildi'"
      timeSaved: "'Celse zamanı değişti'"
      inPersonSaved: "'Yüz yüze ayarı kaydedildi'"
      streamSaved: "'Canlı yayın bağlantısı kaydedildi'"
      streamRemoved: "'Canlı yayın bağlantısı kaldırıldı'"
      releaseSaved: "'Kayıt erişimi kaydedildi', with when the recording opens"
      moved: "the error toast of a write the course or celse had moved under"
      forbidden: "the error toast 'Bunu yapma izniniz yok.'"
      failed: "the error toast 'Bir şeyler ters gitti…', or the stream problem the server found"

guards:
  # the buttons are drawn for the code each needs (sessions-table.tsx:456-543): `canManage`, `streams !== null`, `canRelease`
  maySetWays: "holds == 'all' or holds == 'manage'"
  mayStream: "holds == 'all' or holds == 'stream'"
  mayRelease: "holds == 'all'"
  # "Eksik": a celse still ahead with no meeting link, no stream and no in-person mark (attendance.ts:60-67, attendance-cell.tsx:16)
  lacksWay: "link == 'none' and stream == 'none' and held != 'yes'"

effects:
  # a form or the dialog opens: the field starts empty or with what the celse holds, no error shows, the last toast is gone
  openLink: { set: { entered: blank, said: none, toast: none } }
  openLinkSet: { set: { entered: valid, said: none, toast: none } }
  openTime: { set: { entered: valid, said: none, toast: none } }
  openStream: { set: { entered: blank, said: none, toast: none } }
  openStreamSet: { set: { entered: valid, said: none, toast: none } }
  openInPersonCourse: { set: { picked: course, said: none, toast: none } }
  openInPersonYes: { set: { picked: yes, said: none, toast: none } }
  openInPersonNo: { set: { picked: no, said: none, toast: none } }
  openRelease: { set: { mode: ready, entered: blank, said: none, toast: none } }
  openReleaseAt: { set: { mode: at, entered: valid, said: none, toast: none } }
  # what is typed and chosen
  typedValid: { set: { entered: valid } }
  typedInvalid: { set: { entered: invalid } }
  typedReleaseValid: { set: { entered: valid, said: none } } # the dialog's error is worked out again on every change (release-dialog.tsx:62)
  typedReleaseInvalid: { set: { entered: invalid } }
  pickCourse: { set: { picked: course } }
  pickYes: { set: { picked: yes } }
  pickNo: { set: { picked: no } }
  chooseReady: { set: { mode: ready } }
  chooseAt: { set: { mode: at } }
  # a send the page refuses first: only its own sentence under the field
  saidLink: { set: { said: link } }
  saidTime: { set: { said: time } }
  saidStream: { set: { said: stream } }
  saidRelease: { set: { said: release } }
  # a send: the last toast goes before the call
  sends: { set: { toast: none } }
  # the form or dialog is closed: what it held is dropped, and the toast of a write stays until the next open
  closeForm: { set: { entered: blank, said: none, picked: course, mode: ready } }
  closedAfterLink: { set: { link: set, toast: linkSaved, entered: blank, said: none, picked: course, mode: ready } }
  closedAfterTime: { set: { toast: timeSaved, entered: blank, said: none, picked: course, mode: ready } }
  closedAfterInPersonCourse: { set: { held: course, toast: inPersonSaved, entered: blank, said: none, picked: course, mode: ready } }
  closedAfterInPersonYes: { set: { held: yes, toast: inPersonSaved, entered: blank, said: none, picked: course, mode: ready } }
  closedAfterInPersonNo: { set: { held: no, toast: inPersonSaved, entered: blank, said: none, picked: course, mode: ready } }
  closedAfterStream: { set: { stream: set, toast: streamSaved, entered: blank, said: none, picked: course, mode: ready } }
  closedAfterRemoval: { set: { stream: none, toast: streamRemoved, entered: blank, said: none, picked: course, mode: ready } }
  closedAfterReleaseReady: { set: { release: ready, toast: releaseSaved, entered: blank, said: none, picked: course, mode: ready } }
  closedAfterReleaseAt: { set: { release: at, toast: releaseSaved, entered: blank, said: none, picked: course, mode: ready } }
  closedGone: { set: { toast: moved, entered: blank, said: none, picked: course, mode: ready } }
  # a refused write: the form or dialog stays, with its toast
  movedToast: { set: { toast: moved } }
  forbiddenToast: { set: { toast: forbidden } }
  failedToast: { set: { toast: failed } }

failures:
  opened:
    from: getCourse
    missing: [COURSE_NOT_FOUND]
  savingLink:
    from: updateLesson
    moved: [COURSE_VERSION_CONFLICT]
    forbidden: [AUTHZ_FORBIDDEN]
    failed: [LESSON_NOT_FOUND, VALIDATION_ERROR, COURSE_NOT_FOUND, WEEK_NOT_FOUND]
  savingTime:
    from: updateLesson
    moved: [COURSE_VERSION_CONFLICT]
    forbidden: [AUTHZ_FORBIDDEN]
    failed: [LESSON_NOT_FOUND, VALIDATION_ERROR, COURSE_NOT_FOUND, WEEK_NOT_FOUND]
  savingInPerson:
    from: updateLesson
    moved: [COURSE_VERSION_CONFLICT]
    forbidden: [AUTHZ_FORBIDDEN]
    failed: [LESSON_NOT_FOUND, VALIDATION_ERROR, COURSE_NOT_FOUND, WEEK_NOT_FOUND]
  savingStream:
    from: setLessonLiveStream
    moved: [LESSON_NOT_LIVE, LESSON_CANCELLED]
    forbidden: [AUTHZ_FORBIDDEN]
    failed: [LIVE_STREAM_URL_INVALID, LESSON_NOT_FOUND, VALIDATION_ERROR, COURSE_NOT_FOUND]
  removingStream:
    from: setLessonLiveStream
    moved: [LESSON_NOT_LIVE, LESSON_CANCELLED]
    forbidden: [AUTHZ_FORBIDDEN]
    failed: [LIVE_STREAM_URL_INVALID, LESSON_NOT_FOUND, VALIDATION_ERROR, COURSE_NOT_FOUND]
  savingRelease:
    from: setLessonRecordingAvailability
    moved: [LESSON_NOT_FOUND]
    forbidden: [AUTHZ_FORBIDDEN]
    failed: [VALIDATION_ERROR, COURSE_NOT_FOUND]

# The story the page tells first: the müderris adds the meeting link of a celse that has none, so "Eksik" goes.
main:
  given: { holds: all, changeAnswer: saved, streamAnswer: saved, releaseAnswer: saved }
  events: [DONE, OPEN_LINK, FILL_LINK, SAVE, DONE]

initial: opened

states:
  opened:
    title: Celseler is read
    description: >-
      The page reads the course (GET /courses/{id}, whose version every write of a form carries), what the person holds in it
      (GET /courses/{id}/my-permissions) and who they are, and, for a holder of session.live_link, the stream links
      (GET /courses/{id}/live-streams); the course's recordings are read too, to say "Kayıt yok" of a celse that is over. A person who
      holds neither session.manage nor session.live_link meets the refusal (state forbidden); a 404 is the portal's 404 page; a read
      that failed is the retry state "Celseler okunamadı" (not drawn: it is not a refusal of the API's). A failed read of the stream
      links only drops the stream buttons, and a failed read of the recordings says nothing of recordings. Nothing is on screen in
      this step.
    invoke: { action: getCourse }
    on:
      DONE:
        - { guard: "holds == 'none'", target: forbidden, source: apps/nazar/features/account/course-permissions.ts:88, say: "the person holds neither code of the page" }
        - { target: listed }
      FAIL.missing: not_found
    source: apps/nazar/features/sessions/components/sessions-page.tsx:49

  forbidden:
    title: Celseler refuses its reader
    description: >-
      The header stays (the title and, from the course, the subtitle) and under it a neutral alert, a status and not an alert,
      says "Bu sayfaya izniniz yok" with its sentence; no table, no "Celse planla". The menu still offers "Celseler" to this person,
      since only three entries of the course menu are left out by permission. The whole story is nazar.access.dersNazirPages.
    by: human
    on:
      NAVIGATE: { target: left, say: "they follow the menu" }
    source: apps/nazar/features/sessions/components/sessions-page.tsx:97

  listed:
    title: The celses still ahead, with how each is attended
    description: >-
      The page: "Celseler", the subtitle with the course's name and the zone the times are written in, "Celse planla" for a holder of
      session.manage, and the table "Yaklaşan celseler" with its counts line. Each row has its name (an exam's carries the badge "Sınav", a make-up exam's "Telafi": sessions-table.tsx:277-286,
      since fdc6e995), its time, "Katılım" and its state ("Planlandı"), and, in the last column, a button for each thing the person may change (see the context). "Katılım" joins what
      the celse has with " · ": the meeting link as a platform chip, "YouTube yayını" (or "Yalnız yayın" when it is the only way),
      "Yüz yüze"; a celse still ahead with none of them wears the warning badge "Eksik", and the sidebar's "Celseler" carries the number
      of such celses (the same rule on the server). A recording time that is ahead is said under the state ("Kayıt … açılır"). The
      last write's toast stands for a few seconds. Findings read here: F-C-course-a-08 (the forms open below the table and move no
      focus), F-C-course-a-27 (the dialog's eyebrow is the long date, not the title), F-C-course-a-28 (the URL placeholders and the
      busy word are outside the catalog), F-L-17 (after a write the focus is lost and the only word is a toast), MANAGE-5 (no way to
      remove a link). Acceptance of P-13 (MDRS-118: under 30 seconds on a phone) is not verified.
    by: human
    goal: true
    on:
      OPEN_LINK:
        - { guard: "maySetWays and link == 'set'", target: linkForm, effect: [openLinkSet], source: apps/nazar/features/sessions/components/sessions-table.tsx:170, say: "they press 'Bağlantıyı güncelle': the form holds the link" }
        - { guard: maySetWays, target: linkForm, effect: [openLink], source: apps/nazar/features/sessions/components/sessions-table.tsx:170, say: "they press 'Bağlantı ekle': the form is empty" }
      OPEN_TIME: { guard: maySetWays, target: timeForm, effect: [openTime], source: apps/nazar/features/sessions/components/sessions-table.tsx:178, say: "they press 'Tarihi değiştir': the form holds the celse's date and time on their clock" }
      OPEN_IN_PERSON:
        - { guard: "maySetWays and held == 'yes'", target: inPersonForm, effect: [openInPersonYes], source: apps/nazar/features/sessions/components/sessions-table.tsx:182, say: "they press 'Yüz yüze ayarı': 'Yüz yüze' is chosen" }
        - { guard: "maySetWays and held == 'no'", target: inPersonForm, effect: [openInPersonNo], source: apps/nazar/features/sessions/components/sessions-table.tsx:182, say: "they press 'Yüz yüze ayarı': 'Yüz yüze değil' is chosen" }
        - { guard: maySetWays, target: inPersonForm, effect: [openInPersonCourse], source: apps/nazar/features/sessions/components/sessions-table.tsx:182, say: "they press 'Yüz yüze ayarı': 'Dersin ayarına uy' is chosen" }
      OPEN_STREAM:
        - { guard: "mayStream and stream == 'set'", target: streamForm, effect: [openStreamSet], source: apps/nazar/features/sessions/components/sessions-table.tsx:174, say: "they press 'Canlı yayını güncelle': the form holds the stream link" }
        - { guard: mayStream, target: streamForm, effect: [openStream], source: apps/nazar/features/sessions/components/sessions-table.tsx:174, say: "they press 'Canlı yayın ekle': the form is empty" }
      OPEN_RELEASE:
        - { guard: "mayRelease and release == 'at'", target: releaseDialog, effect: [openReleaseAt], source: apps/nazar/features/sessions/components/sessions-table.tsx:514, say: "they press 'Kayıt erişimi': the dialog holds the time the team set" }
        - { guard: mayRelease, target: releaseDialog, effect: [openRelease], source: apps/nazar/features/sessions/components/sessions-table.tsx:514, say: "they press 'Kayıt erişimi': 'Hazır olunca hemen' is chosen" }
      CANCEL_CELSE: { guard: maySetWays, target: handed_over.cancel, starts: { flow: nazar.sessions.cancel, given: { holds: "'manage'" } }, source: apps/nazar/features/sessions/components/sessions-table.tsx:535, say: "they press 'İptal et': the cancel dialog opens over this page" }
      NAVIGATE: { target: left, say: "they follow 'Celse planla' or the menu" }
    source: apps/nazar/features/sessions/components/sessions-table.tsx:586

  linkForm:
    title: The meeting link form
    description: >-
      A card under the table with the heading "{date} celsesinin toplantı bağlantısı", one field, "Toplantı bağlantısı" (a mono text
      field, with a Zoom address as its placeholder, hard-coded: F-C-course-a-28), the help "Yalnız bu celsenin bağlantısı değişir…",
      and "Vazgeç" and "Kaydet". It is not a dialog: nothing traps or moves the focus, which stays on the row's button above
      (F-C-course-a-08). "Kaydet" is always on. An address with no scheme gets https://; one that is empty, starts http:// or is not an
      address is refused under the field, in a sentence that replaces the help and that no screen reader is told of (F-C-course-a-01).
      The sentence is cleared only when a form is opened again, so a corrected value is sent, and a refused write answered, with it
      still there (MANAGE-4). The API keeps any https host of up to 500 characters (session-meeting-link-any-https-host); the platform
      chip is read off the address afterwards. There is no way to send an empty link (MANAGE-5, D1).
    by: human
    on:
      FILL_LINK: { target: linkForm, effect: [typedValid], source: apps/nazar/features/sessions/components/sessions-table.tsx:656, say: "they type an https address" }
      FILL_LINK_BAD: { target: linkForm, effect: [typedInvalid], source: apps/nazar/features/sessions/components/sessions-table.tsx:656, say: "they type an address that starts http://" }
      SAVE:
        - { guard: "entered == 'valid'", target: savingLink, effect: [sends], source: apps/nazar/features/sessions/components/sessions-table.tsx:233, say: "they press 'Kaydet' with an address the page accepts" }
        - { target: linkForm, effect: [saidLink], source: apps/nazar/features/sessions/components/sessions-table.tsx:233, say: "they press 'Kaydet' with the field empty or wrong: the sentence appears under it and nothing is sent" }
      CANCEL: { target: listed, effect: [closeForm], source: apps/nazar/features/sessions/components/sessions-table.tsx:706, say: "they press 'Vazgeç': the form goes and the focus falls to the page" }
      # The row's buttons stay drawn and live while a form is open (no `disabled`): each start* call puts its own form in this one's
