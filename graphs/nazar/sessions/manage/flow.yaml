        - { guard: mayRelease, target: releaseDialog, effect: [openRelease], source: apps/nazar/features/sessions/components/sessions-table.tsx:514, say: "they press a row's 'Kayıt erişimi': the dialog opens over the page, 'Hazır olunca hemen' chosen; this form stays under it" }
      CANCEL_CELSE: { guard: maySetWays, target: handed_over.cancel, starts: { flow: nazar.sessions.cancel, given: { holds: "'manage'" } }, source: apps/nazar/features/sessions/components/sessions-table.tsx:535, say: "they press a row's 'İptal et': the cancel dialog opens over the page; this form stays under it" }
    source: apps/nazar/features/sessions/components/sessions-table.tsx:613

  savingStream:
    title: The stream link is on its way
    description: >-
      setLiveStream calls PUT /lessons/{id}/live-stream with {liveStreamUrl}. The server parses it again and stores it normalised as
      https://www.youtube.com/live/<id>; it takes one only for a LIVE celse that is not cancelled. The course's version is neither sent
      nor bumped. The audit row lesson.live_stream_set is written (unlike the link, MANAGE-1). A success lays the link over the course
      read at once (the page does not wait for the new read) and clears "Eksik" for a celse with no other way in. A refusal is a toast:
      the celse is not live or was cancelled meanwhile, or the server's parser takes the link for no stream.
    invoke: { action: setLessonLiveStream }
    on:
      DONE: { guard: "streamAnswer == 'saved'", target: listed, effect: [closedAfterStream], source: apps/nazar/features/sessions/components/sessions-table.tsx:208, say: "the toast 'Canlı yayın bağlantısı kaydedildi', the form closes" }
      FAIL.moved: { guard: "streamAnswer == 'moved'", target: streamForm, effect: [movedToast], source: apps/nazar/features/sessions/components/sessions-table.tsx:161, say: "the error toast says only a live celse takes a stream, or that the celse was cancelled; no new read" }
      FAIL.forbidden: { guard: "streamAnswer == 'forbidden'", target: streamForm, effect: [forbiddenToast], source: apps/nazar/features/sessions/components/sessions-table.tsx:161, say: "the error toast says they may not (session.live_link was taken away)" }
      FAIL.failed: { guard: "streamAnswer == 'failed'", target: streamForm, effect: [failedToast], source: apps/nazar/features/sessions/components/sessions-table.tsx:161, say: "the error toast says the link shows no stream, or that something went wrong" }
    source: apps/nazar/features/sessions/components/sessions-table.tsx:192

  removingStream:
    title: The stream link is being cleared
    description: >-
      The same call with {liveStreamUrl: null}; the audit row is lesson.live_stream_clear. The toast reads "Canlı yayın bağlantısı
      kaldırıldı" and a celse that had no other way in reads "Eksik" again. "Bağlantıyı kaldır" and "Vazgeç" are off while it runs.
    invoke: { action: setLessonLiveStream }
    on:
      DONE: { guard: "streamAnswer == 'saved'", target: listed, effect: [closedAfterRemoval], source: apps/nazar/features/sessions/components/sessions-table.tsx:208, say: "the toast 'Canlı yayın bağlantısı kaldırıldı', the form closes" }
      FAIL.moved: { guard: "streamAnswer == 'moved'", target: streamForm, effect: [movedToast], source: apps/nazar/features/sessions/components/sessions-table.tsx:161, say: "the error toast says the celse is not live or was cancelled" }
      FAIL.forbidden: { guard: "streamAnswer == 'forbidden'", target: streamForm, effect: [forbiddenToast], source: apps/nazar/features/sessions/components/sessions-table.tsx:161, say: "the error toast says they may not" }
      FAIL.failed: { guard: "streamAnswer == 'failed'", target: streamForm, effect: [failedToast], source: apps/nazar/features/sessions/components/sessions-table.tsx:161, say: "the error toast says something went wrong" }
    source: apps/nazar/features/sessions/components/sessions-table.tsx:192

  releaseDialog:
    title: The recording access dialog
    description: >-
      The shared ReleaseDialog (it is Ders kayıtları's too: nazar.recordings.add). A modal "Kayıt erişimi" over the page, whose eyebrow
      is the celse's date written in full, not its title (F-C-course-a-27); a radio group "Talebe kaydı ne zaman izlesin" with "Hazır olunca
      hemen" and "Şu tarih ve saatte"; the second shows "Açılış tarihi ve saati" (a date box and a time box, each with its own picker
      button) and its help in the course's zone; "Vazgeç" and "Kaydet". The scrim does not close it. The dialog is controlled with no
      trigger element, so where the focus goes on closing is the library's fallback (F-C-course-a-25, not verified). A time that is
      empty, in the past, or before the celse begins is refused under the field once "Kaydet" was pressed, and then the sentence is
      worked out again on every change. "Hazır olunca hemen" over a celse that holds no time, or the same time again, only closes the
      dialog and writes nothing.
    by: human
    on:
      CHOOSE_READY: { target: releaseDialog, effect: [chooseReady], source: apps/nazar/features/recordings/components/release-fields.tsx:49, say: "they choose 'Hazır olunca hemen'" }
      CHOOSE_AT: { target: releaseDialog, effect: [chooseAt], source: apps/nazar/features/recordings/components/release-fields.tsx:49, say: "they choose 'Şu tarih ve saatte': the date and time boxes appear" }
      FILL_RELEASE: { guard: "mode == 'at'", target: releaseDialog, effect: [typedReleaseValid], source: apps/nazar/features/recordings/components/release-fields.tsx:86, say: "they type a date and a time after the celse begins" }
      FILL_RELEASE_BAD: { guard: "mode == 'at'", target: releaseDialog, effect: [typedReleaseInvalid], source: apps/nazar/features/recordings/components/release-fields.tsx:86, say: "they type a date in the past" }
      SAVE:
        - { guard: "mode == 'ready' and release == 'ready'", target: listed, effect: [closeForm], source: apps/nazar/features/recordings/components/release-dialog.tsx:67, say: "nothing changed: the dialog closes, no call is made and no toast says anything" }
        - { guard: "mode == 'ready'", target: savingRelease, effect: [sends], source: apps/nazar/features/recordings/components/release-dialog.tsx:72, say: "they press 'Kaydet' to open the recording as soon as it is ready again" }
        - { guard: "mode == 'at' and entered == 'valid'", target: savingRelease, effect: [sends], source: apps/nazar/features/recordings/components/release-dialog.tsx:72, say: "they press 'Kaydet' with a time the page accepts" }
        - { target: releaseDialog, effect: [saidRelease], source: apps/nazar/features/recordings/components/release-dialog.tsx:64, say: "they press 'Kaydet' with the time empty or wrong: the sentence appears under the field and nothing is sent" }
      CANCEL: { target: listed, effect: [closeForm], source: apps/nazar/features/recordings/components/release-dialog.tsx:121, say: "they press 'Vazgeç', Esc or the close icon" }
    source: apps/nazar/features/recordings/components/release-dialog.tsx:109

  savingRelease:
    title: The recording access is on its way
    description: >-
      setRecordingAvailability calls PUT /lessons/{id}/recording-availability with {availableAt}: an ISO time, or null for as soon as
      the recording is ready. The release time is kept on the celse, so it may be set before any recording exists; the course's version
      is neither sent nor bumped. The audit row lesson.recording_availability_set is written, and a recording this opens now is announced
      to the talebe now. "Kaydet" is busy and Esc and the close icon do nothing and say nothing while it runs (F-C-course-a-26). A
      success closes the dialog, shows "Kayıt erişimi kaydedildi" with when the recording opens, and reads the page again: a time that
      is ahead is said under the row's state. A celse that is gone closes the dialog too and reads the page again.
    invoke: { action: setLessonRecordingAvailability }
    on:
      DONE:
        - { guard: "releaseAnswer == 'saved' and mode == 'at'", target: listed, effect: [closedAfterReleaseAt], source: apps/nazar/features/recordings/components/release-dialog.tsx:90, say: "the toast says when the recording opens, the dialog closes" }
        - { guard: "releaseAnswer == 'saved'", target: listed, effect: [closedAfterReleaseReady], source: apps/nazar/features/recordings/components/release-dialog.tsx:90, say: "the toast says it opens as soon as it is ready, the dialog closes" }
      FAIL.moved: { guard: "releaseAnswer == 'moved'", target: listed, effect: [closedGone], source: apps/nazar/features/recordings/components/release-dialog.tsx:84, say: "the error toast says the celse or its recording is gone, the dialog closes and the page is read again" }
      FAIL.forbidden: { guard: "releaseAnswer == 'forbidden'", target: releaseDialog, effect: [forbiddenToast], source: apps/nazar/features/recordings/components/release-dialog.tsx:79, say: "the error toast says they may not; the dialog stays open" }
      FAIL.failed: { guard: "releaseAnswer == 'failed'", target: releaseDialog, effect: [failedToast], source: apps/nazar/features/recordings/components/release-dialog.tsx:79, say: "the error toast says the time could not be read or that something went wrong; the dialog stays open" }
      # The dialog drops every way of closing while `pending` (release-dialog.tsx:112): the press changes nothing and the write runs on.
      # Written as a transition back to this state, as a transition here always names a target.
      CANCEL: { target: savingRelease, source: apps/nazar/features/recordings/components/release-dialog.tsx:112, say: "they press 'Vazgeç' or the close icon, or Esc, while the write runs: nothing happens and nothing says so (F-C-course-a-26)" }
    source: apps/nazar/features/recordings/components/release-dialog.tsx:72

