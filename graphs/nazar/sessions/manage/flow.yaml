assertions:
  - id: link-time-and-in-person-need-session-manage
    never: "(state == 'savingLink' or state == 'savingTime' or state == 'savingInPerson') and not maySetWays"
    say: Only a holder of session.manage is offered the link, the time and the in-person mark, so only they send them.
    source: apps/nazar/features/sessions/components/sessions-table.tsx:456
  - id: the-stream-needs-live-link
    never: "(state == 'streamForm' or state == 'savingStream' or state == 'removingStream') and not mayStream"
    say: Only a holder of session.live_link is offered the stream, so only they set or clear it.
    source: apps/nazar/features/sessions/components/sessions-table.tsx:488
  - id: release-needs-recording-manage
    never: "(state == 'releaseDialog' or state == 'savingRelease') and not mayRelease"
    say: Only a holder of recording.manage is offered "Kayıt erişimi".
    source: apps/nazar/features/sessions/components/sessions-table.tsx:505
  - id: a-link-is-sent-only-after-the-page-accepts-it
    never: "state == 'savingLink' and entered != 'valid'"
    say: An address the page refuses (empty, http:// or not an address) is never sent.
    source: apps/nazar/features/sessions/components/sessions-table.tsx:233
  - id: a-time-is-sent-only-with-a-date-and-a-time
    never: "state == 'savingTime' and entered != 'valid'"
    say: A time with the date or the hour missing is never sent.
    source: apps/nazar/features/sessions/components/sessions-table.tsx:242
  - id: a-stream-is-sent-only-after-the-parser-accepts-it
    never: "state == 'savingStream' and entered != 'valid'"
    say: A stream link the parser refuses is never sent; clearing one is its own button.
    source: apps/nazar/features/sessions/components/sessions-table.tsx:221
  - id: a-release-time-is-sent-only-when-it-is-ahead
    never: "state == 'savingRelease' and mode == 'at' and entered != 'valid'"
    say: A release time that is empty, in the past or before the celse begins is never sent.
    source: apps/nazar/features/recordings/components/release-dialog.tsx:64
  - id: a-refusing-page-offers-nothing
    never: "holds == 'none' and state != 'opened' and state != 'forbidden' and state != 'left' and state != 'not_found'"
    say: A person who holds neither code meets the refusal and no form, no dialog.
    source: apps/nazar/features/sessions/components/sessions-page.tsx:97
