      the row, a time that moved between two times of a celse that is not cancelled and not over sends the SESSION_RESCHEDULED notice to
      the enrolled talebe other than the actor, an exam's reminder is armed again, and the invitation sweep sends each talebe a new
      calendar invitation (the start changed). It writes NO audit row (MANAGE-1). The row's "Zaman" cell reads the new time after
      the page is read again. Busy and refusals as savingLink.
