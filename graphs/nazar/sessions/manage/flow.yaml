  savingLink:
    title: The link is on its way
    description: >-
      changeSession calls PATCH /lessons/{id} with {version, meetingUrl}: the version the page was read at. The course's version is
      checked and bumped in one statement, so a stale page changes nothing (409). The write leaves NO audit row (MANAGE-1). On the
      form "Kaydet" is busy (aria-busy and a hidden "Yükleniyor" from a default of the kit, F-C-course-a-28) and "Vazgeç" is off; the
      field stays live. A success keeps the new version, closes the form, shows the toast and reads the page again: the row's button
      reads "Bağlantıyı güncelle", its "Katılım" names the platform and, when nothing else was there, "Eksik" is gone. The talebe of the
      course read the link on the celse page from then on; nobody is told, and no new calendar invitation goes (MANAGE-3).
    invoke: { action: updateLesson }
    on:
      DONE: { guard: "changeAnswer == 'saved'", target: listed, effect: [closedAfterLink], source: apps/nazar/features/sessions/components/sessions-table.tsx:255, say: "the toast 'Bağlantı kaydedildi', the form closes, the page is read again" }
      FAIL.moved: { guard: "changeAnswer == 'moved'", target: linkForm, effect: [movedToast], source: apps/nazar/features/sessions/components/sessions-table.tsx:161, say: "the error toast says the course was saved by someone else since, and the page is read again; the form stays open" }
      FAIL.forbidden: { guard: "changeAnswer == 'forbidden'", target: linkForm, effect: [forbiddenToast], source: apps/nazar/features/sessions/components/sessions-table.tsx:161, say: "the error toast says they may not; the form stays open" }
      FAIL.failed: { guard: "changeAnswer == 'failed'", target: linkForm, effect: [failedToast], source: apps/nazar/features/sessions/components/sessions-table.tsx:161, say: "the error toast says something went wrong; the form stays open and the page is NOT read again (MANAGE-2)" }
