# nazar.sessions.manage as a ders nazırı who holds session.live_link alone: the page opens (PAGE_CODES.sessions asks for session.manage or
# session.live_link), there is no "Celse planla" and one button a row, "Canlı yayın ekle". It adds no transition to binding.yaml's, so it is a
# file of its own, to be walked on its own:
#   flock <scratchpad>/replay.lock nice -n 10 node /home/taha/delurio-wt/medaris-engine/apps/engine/src/cli.ts replay graphs/nazar/sessions/manage \
#     --bind graphs/nazar/sessions/manage/binding.stream.yaml --cover transitions --absent --out <dir>
# (without --cover the walk is the main story, which is the müderris's and not bound here.) The link, the time, the in-person mark and the
# recording access are absent from the graph's states for this person, so `--absent` checks that the page leaves them out. NOT RUN; see locators.binding.yaml. Not verified: that tedrisat lets a post hold session.live_link without
# session.manage (the helper prints the set the API says the post holds).
schema: delurio-graph/0
kind: binding
extends: ./locators.binding.yaml
flow: nazar.sessions.manage

scenarios:
  stream:
    given: { holds: stream, changeAnswer: saved, streamAnswer: saved, releaseAnswer: saved }
    as: dersNazir
    open: '{nazar}/ders/{made.course}/celseler'
    setup:
      - run: [node, helpers/course.mjs, make, sesManage, --weeks, '1', --lessons, '1']
        expect: '"tag":"sesManage"'
      - run: [node, helpers/course-nazir-grants.mjs, --course, '{made.course}', --nazir, dersNazir, --codes, session.live_link]
        expect: 'course-nazir-grants DERS_NAZIR'
    teardown:
      - run: [node, helpers/course.mjs, remove, sesManage]
        expect: 'course remove sesManage'
    vars: { bump: '0' }
