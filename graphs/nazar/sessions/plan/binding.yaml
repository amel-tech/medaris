# nazar.sessions.plan on the local stack (graphs/README.md, "The stack and the bindings"): nazar-web at http://localhost:4002, the hoca "Hamdi Müderris" of a
# course made for the walk, and the form "Celse planla".
#   flock <scratchpad>/replay.lock nice -n 10 node /home/taha/delurio-wt/medaris-engine/apps/engine/src/cli.ts replay graphs/nazar/sessions/plan \
#     --bind graphs/nazar/sessions/plan/binding.yaml --out <dir>                                 (the main story)
#   ... --cover transitions --absent --out <dir>                                                 (every scenario below)
#   ... --bind graphs/nazar/sessions/plan/binding.forbiddenWrite.yaml --cover transitions ...    (the permission taken away between preview and write)
#
# NOT RUN: the owner's word is that replays happen once, at the end; every locator, every account fact and every address is from the code and unverified
# until the walk. The binding loads (`replay <dir> --bind <this file> --emit-spec --out <dir>`, read-only). locators.binding.yaml holds what the scenarios share.
#
# The data. Every scenario makes the one course "Deneme dersi planWk" (tag planWk: one week with one celse from tomorrow, MUDERRIS its hoca) and the
# dates file the form is typed from, and removes both in `teardown`; `make` removes a planWk left by a crashed walk first. The seeded courses are never
# planned into. A walk that makes celses deletes them with the course (helpers/course.mjs remove deletes the course as the başnazım, with everything under
# it). What a walk cannot undo: the audit rows of the writes, and the calendar-invitation mails to the enrolled talebe, of whom the course has none.
#
# Scenarios not bound, with the reason: `read: failed` (the course read fails: nothing on the stack makes it), `answer: patternRefused` and `answer: failed` (the API
# would have to refuse a pattern it has just previewed, or fail: the stack cannot be made to), and the preview's second answer after a refusal (`previewed` stays what
# it is). `answer: forbidden` is in binding.forbiddenWrite.yaml.
schema: delurio-graph/0
kind: binding
extends: ./locators.binding.yaml
flow: nazar.sessions.plan

scenarios:
  # The main story: from Celseler (e2e course-scope#1 a3: the link "Celse planla"), a weekly repeat on Tuesday and Thursday from a Tuesday two to three
  # weeks away, ending 8 days later (three celses), the first with a link, the preview read, the celses made. Lands on Celseler with the toast.
  weekly:
    given: { read: ok, plan: weekly, fields: valid, previewed: lines, answer: created }
    as: muderris
    open: '{nazar}/ders/{made.course}/celseler'
    enter: { nav: ../../nav, bind: ../../nav/binding.yaml, entry: 'dersSessions->dersSessionsPlanla' }
    setup:
      - run: [node, helpers/course.mjs, make, planWk, --weeks, '1', --lessons, '1']
        expect: '"title":"Deneme dersi planWk"'
      - run: [node, helpers/dates.mjs, write, planWk]
        expect: 'dates planWk'
    teardown:
      - run: [node, helpers/course.mjs, remove, planWk]
        expect: 'course remove planWk'
      - run: [node, helpers/dates.mjs, clear, planWk]
        expect: 'dates planWk'
    vars:
      dayA: Sal
      dayB: Per
      startDate: '{when.start}'
      endDate: '{when.end}'
      refillEnd: '{when.noStart}'
      howMany: '4'
      singleDate: '{when.single}'
      examDate: '{when.exam}'
      titleText: Haftanın tekrarı
      firstUrl: https://meet.example.test/plan/ilk
      score: '100'
      topics: Birinci bâbın çekimleri
      fixField: title
      fixValue: Haftanın tekrarı
      planned: '3'
      createdTitle: Haftanın tekrarı
      exams: '0'

  # The same repeat, ended after a number of celses: "Belirli sayıda celseden sonra" and 4: four celses.
  weeklyCount:
    given: { read: ok, plan: weeklyCount, fields: valid, previewed: lines, answer: created }
    as: muderris
