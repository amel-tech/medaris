      firstUrl: https://meet.example.test/plan/ilk
      score: '100'
      topics: Birinci bâbın çekimleri
      fixField: examLocation
      fixValue: Merkez medrese, birinci sınıf
      planned: '1'
      createdTitle: Ara sınav
      exams: '1'

  # A ders nazırı of the walk's course with no permission at all (course-nazir-grants --codes none, appointed by the hoca): the page opens and says "Bu sayfaya izniniz yok"
  # with no form. The seeded ders nazırı holds session.manage in "Bina ve İzhar Şerhi" and is not used.
  notAllowed:
    given: { read: forbidden, plan: weekly, fields: valid, previewed: lines, answer: created }
    as: dersNazir
    open: '{nazar}/ders/{made.course}/celseler/planla'
    setup:
      - run: [node, helpers/course.mjs, make, planWk, --weeks, '1', --lessons, '1']
        expect: '"title":"Deneme dersi planWk"'
      - run: [node, helpers/dates.mjs, write, planWk]
        expect: 'dates planWk'
      - run: [node, helpers/course-nazir-grants.mjs, --course, '{made.course}', --nazir, dersNazir, --codes, none]
        expect: 'course-nazir-grants DERS_NAZIR'
    teardown:
      - run: [node, helpers/course.mjs, remove, planWk]
        expect: 'course remove planWk'
      - run: [node, helpers/dates.mjs, clear, planWk]
        expect: 'dates planWk'
    vars:
      dayA: Sal
      dayB: Per
      startDate: '{when.start}'
      endDate: '{when.end}'
      refillEnd: '{when.noStart}'
      howMany: '4'
      singleDate: '{when.single}'
      examDate: '{when.exam}'
      titleText: Haftanın tekrarı
      firstUrl: https://meet.example.test/plan/ilk
      score: '100'
      topics: Birinci bâbın çekimleri
      fixField: title
      fixValue: Haftanın tekrarı
      planned: '3'
      createdTitle: Haftanın tekrarı
      exams: '0'

  # A course that is not the hoca's, by an address no course has: the layout answers the portal's 404, "Sayfa bulunamadı", before the page reads anything. Nothing is
  # made, so there is nothing to remove.
  unknownCourse:
    given: { read: missing, plan: weekly, fields: valid, previewed: lines, answer: created }
    as: muderris
    open: '{nazar}/ders/00000000-0000-4000-8000-000000000000/celseler/planla'
