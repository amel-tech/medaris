    vars:
      dayA: Sal
      dayB: Per
      startDate: '{when.start}'
      endDate: '{when.end}'
      refillEnd: '{when.noStart}'
      howMany: '4'
      singleDate: '{when.single}'
      examDate: '{when.exam}'
      titleText: Haftanın tekrarı
      firstUrl: http://meet.example.test/plan/ilk
      score: '100'
      topics: Birinci bâbın çekimleri
      fixField: meetingUrl
      fixValue: https://meet.example.test/plan/ilk
      planned: '3'
      createdTitle: Haftanın tekrarı
      exams: '0'

  # An exam whose "Tam puan" is 0, typed under "Sınav ayrıntıları": "1 ile 1000 arasında bir tam puan girin." under it; then 100.
