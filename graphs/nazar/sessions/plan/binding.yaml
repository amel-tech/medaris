      - run: [node, helpers/dates.mjs, clear, planWk]
        expect: 'dates planWk'
    vars:
      dayA: Sal
      dayB: Per
      startDate: '{when.start}'
      endDate: '{when.end}'
      refillEnd: '{when.noStart}'
      howMany: '4'
      singleDate: '{when.single}'
      examDate: '{when.exam}'
      titleText: Haftanın tekrarı
      firstUrl: https://meet.example.test/plan/ilk
      score: '100'
      topics: Birinci bâbın çekimleri
      fixField: title
      fixValue: Haftanın tekrarı
      planned: '1'
      createdTitle: Ara sınav
      exams: '1'

  # A pattern on Monday and Saturday over a Tuesday and the Wednesday after: no day of it falls in the range, tedrisat answers INVALID_SESSION_PATTERN (NO_SESSIONS),
  # the preview is cleared and the alert says so. Nothing is made.
  previewRefused:
    given: { read: ok, plan: weekly, fields: valid, previewed: refused, answer: created }
    as: muderris
    open: '{nazar}/ders/{made.course}/celseler/planla'
    setup:
      - run: [node, helpers/course.mjs, make, planWk, --weeks, '1', --lessons, '1']
        expect: '"title":"Deneme dersi planWk"'
      - run: [node, helpers/dates.mjs, write, planWk]
        expect: 'dates planWk'
    teardown:
