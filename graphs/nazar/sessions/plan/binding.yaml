        expect: 'course remove planWk'
      - run: [node, helpers/dates.mjs, clear, planWk]
        expect: 'dates planWk'
    vars:
      dayA: Pzt
      dayB: Cmt
      startDate: '{when.noStart}'
      endDate: '{when.noEnd}'
      refillEnd: '{when.noStart}'
      howMany: '4'
      singleDate: '{when.single}'
      examDate: '{when.exam}'
      titleText: Haftanın tekrarı
      firstUrl: https://meet.example.test/plan/ilk
      score: '100'
      topics: Birinci bâbın çekimleri
      fixField: title
      fixValue: Haftanın tekrarı
      planned: '3'
      createdTitle: Haftanın tekrarı
      exams: '0'

  # An empty title: the preview works (it does not read the title), the button is on, and pressing it says "Celse başlığını yazın." under the field; the title is
  # then typed and the celses are made.
  noTitle:
    given: { read: ok, plan: weekly, fields: noTitle, previewed: lines, answer: created }
    as: muderris
    open: '{nazar}/ders/{made.course}/celseler/planla'
    setup:
