      - run: [node, helpers/dates.mjs, clear, planWk]
        expect: 'dates planWk'
    vars:
      dayA: Sal
      dayB: Per
      startDate: '{when.start}'
      endDate: '{when.end}'
      refillEnd: '{when.noStart}'
      howMany: '4'
      singleDate: '{when.single}'
      examDate: '{when.exam}'
      titleText: ''
      firstUrl: https://meet.example.test/plan/ilk
      score: '100'
      topics: Birinci bâbın çekimleri
      fixField: title
      fixValue: Haftanın tekrarı
      planned: '3'
      createdTitle: Haftanın tekrarı
      exams: '0'

  # A first-celse link that is not https: "Toplantı bağlantısı https:// ile başlamalı…" under the field; the link is then put right.
  badLink:
    given: { read: ok, plan: weekly, fields: badLink, previewed: lines, answer: created }
    as: muderris
    open: '{nazar}/ders/{made.course}/celseler/planla'
    setup:
