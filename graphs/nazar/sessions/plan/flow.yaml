  creating:
    title: The celses are made
    description: >-
      createSessions calls POST /courses/:id/sessions/batch with the pattern, the title, the length, the first celse's link and, for an exam, its format,
      score, topics, place and whether it is a make-up exam, in one transaction: the course's version is bumped, missing weeks are made as "Hafta N" after the
      last, and the celses are inserted as LIVE lessons (an exam also gets its lesson_exams row). The button is busy (aria-disabled, "Oluşturuluyor…" for a
      reader of the screen), every field and choice is disabled until the answer (plan-form.tsx:123, :250-:661), so what is sent is what
      the form shows and a refusal leaves it as it was sent, and "Vazgeç" loses its address. The calendar invitation mail goes to the course's enrolled talebe,
      and an exam's notification too. The page sends no in-person mark and no seat count: the celses follow the course's own mark (no-in-person-mark).
    invoke: { action: createSessionBatch }
    on:
      DONE: { guard: "answer == 'created'", target: landed, source: apps/nazar/features/sessions/components/plan-form.tsx:230, say: "a toast says how many celses were added, and the page is Celseler" }
      FAIL.patternRefused: { guard: "answer == 'patternRefused'", target: formReady, effect: [patternToast], source: apps/nazar/features/sessions/components/plan-form.tsx:222, say: "a toast 'Celseler oluşturulamadı' says the pattern gives no celse" }
      FAIL.forbidden: { guard: "answer == 'forbidden'", target: formReady, effect: [forbiddenToast], source: apps/nazar/features/sessions/components/plan-form.tsx:222, say: "a toast says she may not" }
      FAIL.failed: { guard: "answer == 'failed'", target: formReady, effect: [failedToast], source: apps/nazar/features/sessions/components/plan-form.tsx:222, say: "a toast says something went wrong; an exam's EXAM_ONE_SESSION would read the same, which this page cannot send" }
    source: apps/nazar/features/sessions/components/plan-form.tsx:204

  landed:
    title: Celseler, with the toast
    goal: true
    by: human
    description: >-
      router.push(/ders/<id>/celseler): the page is Celseler, h1 "Celseler", and a toast "Celseler oluşturuldu / N celse eklendi." stands in its region
      for six seconds (it was fired just before the push, so the route change keeps it). The new celses are listed as "Yaklaşan celseler" with no way in
      yet ("Eksik") unless the first was given a link; that table is nazar.sessions.manage. A new exam is listed there with the badge "Sınav" beside its title ("Telafi"
      for a make-up exam; sessions-table.tsx:276-286, since fdc6e995). The focus is the new document's (focus-not-set). An exam leads on to Değerlendirme
      (nazar.evaluation.examScores).
    on:
      NAVIGATE: { target: left, say: "they follow the menu" }
    source: apps/nazar/features/sessions/components/sessions-page.tsx:73

  sessions_opened:
    title: Back on Celseler, nothing made
    type: final
    leavesPage: true
    description: "'Vazgeç' or the breadcrumb's 'Celseler': a plain link, with no guard for what was typed (F-C-course-a-13)."

  not_found:
    title: The course is not there
    type: final
    leavesPage: true
    description: "The portal's 404 page, 'Sayfa bulunamadı' (the layout's notFound(), or the page's own read: lib/tedrisat-read.ts:46)."

  left:
    title: They leave the page
    type: final
    leavesPage: true

assertions:
  - id: a-preview-comes-before-the-write
    never: "state == 'creating' and not typed"
    say: Celses are made only after the pattern was whole and previewed; the button is off while the preview holds none.
    source: apps/nazar/features/sessions/components/plan-form.tsx:703
  - id: a-refused-form-is-not-sent
    never: "state == 'creating' and said != 'none'"
    say: A form with a title, link, score or place the page has just refused is not sent until the field is corrected.
    source: apps/nazar/features/sessions/components/plan-form.tsx:182
  - id: a-corrected-field-is-not-refused-again
    never: "fixed and said != 'none'"
    say: Once a refused field is corrected, nothing is said under it.
    source: apps/nazar/features/sessions/components/plan-form.tsx:176
