# The screens of nazar.sessions.plan: "Celse planla" (/ders/<id>/celseler/planla), the form that makes one celse, a weekly repeat or an exam,
# with its live preview, and the page it lands on. Read from apps/nazar/features/sessions (plan-page.tsx, plan-form.tsx, sessions.ts); the
# words are copied from libs/i18n/src/locales/tr/nazar.json by script, letter for letter.
#
# Three messages are built in code and are in no i18n file, so they are `composed.SessionPlan.*` ("Günler *" at plan-form.tsx:571, a weekday's
# short name at :570, the date of a previewed celse at :708). `Changes.note` is the one catalog entry the app does not have: no app message says
# what making celses changes (the toast says only "N celse eklendi"), so one short factual sentence was written for it from the API's
# side effects (the calendar invitation mail and, for an exam, the notification: apps/tedrisat/src/course/course.service.ts:1386-1415).
# Where a node says "repeat", the page draws it once per item; the replay finds the items through the binding.
schema: delurio-graph/0
kind: ui
id: nazar.sessions.plan
flow: nazar.sessions.plan
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  name: Deneme dersi planla
  count: "3"
  week: "3"
  minutes: "60"
  link: boş
  zone: İstanbul
  when: 1 Aralık 2026 Salı 21:00
  day: Sal
  legend: Günler
  format: Yazılı
  max: "100"

# The page sets no focus of its own: on load and after the celses are made nothing in features/sessions moves it, so there is no `initialFocus` on
# the page. One press does move it, since c0ca032d: a refused submit of an exam takes the focus to the first field in error under "Sınav ayrıntıları"
# (plan-form.tsx:189-198). That move is from a state to itself (the form stays), which the graph cannot give a `focus` for (SPEC section 4), so it is
# written in the SUBMIT transitions and in PLAN-1, and `focus` is not used. The graph says nothing of what the code does not say.
