rules:
  - { id: F-C-course-a-09, rule: "The submit is natively `disabled` while the preview holds no celse, whatever is wrong, and its label reads '0 celse oluştur'; nothing says what is missing and the button leaves the tab order (plan-form.tsx:678-687). The inventory adds that the form's own errors can never be shown; that is true at first of the pattern's (days, time, date, end, count: `planErrors` leaves `pattern` null, so the count stays 0 and the button stays off, and nothing can be pressed to refuse) but not of the other four: a title, a first-celse link, an exam's 'Tam puan' and 'Yer adı' do not feed the preview, so the button is on and a refused submit does say them (PLAN-1). And `sent` is never reset (plan-form.tsx:115 and :179 have no setSent(false)), so after that one refused press the pattern's messages are said too: clearing the days shows the 'En az bir gün seçin.' alert (plan-form.tsx:581-585, role alert) and a time, length, date or end that goes wrong is said under its field (:240-:632). So the alert is reachable; it is not drawn here (no node, no `sent` variable). Fix: keep the button reachable (aria-disabled) and say what is missing, or word the label 'Celse oluştur' until a preview exists." }
  - { id: F-C-course-a-10, rule: "The preview (the count badge and the list) is rewritten 250 ms after the last key and is not a live region (plan-form.tsx:691-739); only the submit's label changes with it, and that is not announced either. Fix: aria-live=polite on the count." }
  - { id: F-C-course-a-12, rule: "'Celse türü', 'Planlama biçimi' and 'Günler' are Base UI toggle groups of aria-pressed buttons (choice-chips.tsx:75-92), not radio groups; pressing the pressed one is ignored (plan-form.tsx:386, 410); the days legend has a literal ' *' typed into it (:571), which a screen reader says. Fix: radios for the two single choices, and no star in the legend text." }
  - { id: F-C-course-a-13, rule: "'Vazgeç' and the breadcrumb's 'Celseler' leave the page with everything typed and no guard (plan-form.tsx:367-372, 671-677)." }
  - { id: PLAN-1, rule: "A refused submit (an empty title, a first-celse link that is not https, an exam's score outside 1 to 1000, an empty place) only sets `sent`: the text appears under the field and the Field's error is no live region (plan-form.tsx:175-199, 172-173). Until c0ca032d (MDRS-248, 'Celse planla › Sınav: a wrong field under Sınav ayrıntıları is focused when the fold opens on submit') the focus stayed on the button and a keyboard or screen-reader user pressed it and heard nothing. Partly fixed by that commit: for an exam whose score, length, title or link is wrong the section opens (:181-188) and, on the next frame, the first field in error takes the focus (:189-196; apps/nazar/test/plan-page.spec.tsx:401 checks it for the score). The Field ties its error to the control (libs/ui/src/mds/field.tsx:17-23), so a screen reader that lands on the field is given the sentence; not verified with one. Still open: for a lesson (an empty title, a link that is not https) and for an exam's place, which sits outside the fold, the focus stays on the button and nothing is announced. Fix: move the focus to the first field in error in every case, or name the problem in a status." }
  - { id: PLAN-2, rule: "When the course or its permissions cannot be read the page draws its own h1 'Celse planla' (plan-page.tsx:36-38) and then `LoadFailed`, whose SystemState draws a second h1 'Ders okunamadı' (load-failed.tsx:26-35, system-state.tsx:43): two h1 on one page. Not drawn in a walk (nothing makes the read fail locally); from the code. Fix: SystemState headingLevel 2 inside the shell." }
  - { id: PLAN-3, rule: "The two placeholders 'https://zoom.us/j/…' (plan-form.tsx:345) and, on Celseler, 'https://studio.youtube.com/video/…' are typed into the code, not the catalog. A URL is the same in every language, but a product that names one platform in its placeholder says so in every locale." }
  - { id: PLAN-4, rule: "Nothing refuses a date in the past: the inputs carry no min (plan-form.tsx:291, 619) and neither the preview nor the write checks it (apps/tedrisat/src/course/domain/weekly-pattern.ts:151-190), so a repeat that starts yesterday makes celses that are already over, with no warning. Not verified in a browser. Decision D2." }
  - { id: focus-not-set, rule: "No code in features/sessions moves the focus on load or after the celses are made (the page changes, so the focus is the new document's). One move exists, since c0ca032d: a refused submit of an exam takes the focus to the first field in error under 'Sınav ayrıntıları' (plan-form.tsx:189-196, PLAN-1); the graph does not draw it, because the form stays the same state." }
  - { id: exam-title-is-hidden, rule: "An exam's title ('Ara sınav') and its duration, zone and links are editable only under 'Sınav ayrıntıları', folded by default, so the person plans an exam without ever seeing what it will be called (plan-form.tsx:459-552). The summary beside the toggle says only format and score." }
  - { id: no-in-person-mark, rule: "The request carries no in-person mark and no seat count (sessions.ts:450-462): the celses follow the course's own mark, and an extra paragraph says so when the course is held in person (plan-form.tsx:660-664, not drawn here). A kontenjan per gender per celse is MDRS-284 and does not exist." }
  - { id: label-in-name, rule: "The visible text of each button is in its name: the submit is its own label, and the toggle 'Sınav ayrıntıları' adds its summary to the name (WCAG 2.5.3 holds)." }
