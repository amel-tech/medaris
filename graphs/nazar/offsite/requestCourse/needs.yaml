# What must exist for the başmüderris of a medrese to ask a köşk to open a course outside it: the flow's product list
# (LAYOUT.md section 7). Each need is what the product must do, from the flow's story and what the code leaves undone, not from
# what the page does today; the known gaps go to graphs/needs.gaps.yaml, which the orchestrator merges. Read by people for now:
# no checker runs on this file yet. planned.md names no planned feature for this page.
#
# For graphs/needs.gaps.yaml, flow nazar.offsite.requestCourse:
#   missing  (no code): see-what-became-of-a-request (OFFSITE-1), a-failed-call-is-told (F-A-10), a-vanished-koshk-is-deselected
#            (OFFSITE-2), every-wrong-field-is-announced (F-L-12)
#   unwalked (code, no e2e check and no replay that has passed): the-request-reaches-the-koshk-nazim, a-refused-send-says-why,
#            the-empty-and-failed-reads-are-said. No replay has run yet (the graphs were written without one): the scenarios `sends`,
#            `refused` and `koskGone` are bound (binding.yaml, binding.koskGone.yaml) and are named below as comments, not as
#            `walked`, until a walk has passed them; every e2e check named here was read, not run (the nazar suite is not run in CI).
kind: needs
flow: nazar.offsite.requestCourse
status: proposed

needs:
  - id: ask-a-koshk-to-open-an-offsite-course
    need: >-
      The başmüderris asks any köşk that is listed to open a course that will not belong to her medrese, giving the name she
      suggests and her reason; the request is recorded for that köşk's nazım, and no course is made.
    drawn: [form, sending, recorded, sent, toastSent]
    built:
      - action: medaris.api:requestOffsiteCourse
      - route: apps/nazar/features/offsite/components/offsite-form.tsx:58
    walked:
      - e2e: apps/nazar/e2e/offsite.e2e.ts
        check: 'offsite#3'
    # replay: sends (bound, not walked yet)

  - id: the-form-says-what-is-missing
    need: >-
      A send with the name or the reason blank sends nothing, says under each blank field what is missing, and puts the focus on
      the first wrong text field.
    drawn: [refusedTitle, refusedReason, nameError, reasonError, the-first-error-takes-the-focus]
    built:
      - route: apps/nazar/features/offsite/components/offsite-form.tsx:55
      - route: apps/nazar/features/offsite/offsite.ts:19
    walked:
      - e2e: apps/nazar/e2e/offsite.e2e.ts
        check: 'offsite#2'
      - test: apps/nazar/test/offsite.spec.tsx
    # replay: sends (bound, not walked yet)

  - id: the-form-says-what-follows
    need: >-
      Before she sends, the page says what happens next: the request goes to the chosen köşk's nazım and Medaris management sees
      it, the köşk's nazım opens the course and picks its hocas if they accept, and the course will not belong to the medrese; the
      first line follows the köşk she chooses.
    drawn: [afterRegion, afterNamedFirst, afterNamedOther, afterTwo, afterThree]
    built:
      - route: apps/nazar/features/offsite/components/offsite-form.tsx:101
    walked:
      - e2e: apps/nazar/e2e/offsite.e2e.ts
        check: 'offsite#1'
      - e2e: apps/nazar/e2e/offsite.e2e.ts
        check: 'offsite#3'
    # replay: sends (bound, not walked yet)

  - id: the-way-in-and-the-way-back
    need: >-
      Dersler leads to the form, and "Vazgeç", the breadcrumb and "Derslere dön" lead back to Dersler without writing anything.
    drawn: [trail, trailCourses, cancel, noKoskBack, courses_opened]
    built:
      - route: apps/nazar/features/courses/components/courses-page.tsx:114
      - route: apps/nazar/features/offsite/components/offsite-form.tsx:189
    walked:
      - e2e: apps/nazar/e2e/offsite.e2e.ts
        check: 'offsite#1'
    # replay: sends enters through the nav; the exits are walked by --cover transitions (bound, not walked yet)

  - id: the-request-reaches-the-koshk-nazim
    need: >-
      A request that was sent is in the köşk nazım's list of course requests, waiting, with the name, the reason, the medrese and
      the sender, and nobody else's köşk shows it.
    drawn: [recorded]
    built:
      - action: medaris.api:listCourseRequests
      - route: apps/tedrisat/src/madrasah/course/madrasah-course.repository.ts:410
    # replay: sends, effect requestOffsiteCourse reads the row and the nazım's list (bound, not walked yet); e2e platform-admin#8
    # reads a seeded row, not one this page sent

  - id: a-refused-send-says-why
    need: >-
      When the API refuses the send (the köşk is gone, the data is wrong, the permission was taken back, anything else), the person
      keeps what she typed and is told in her own words which of these it was; where the köşk is gone the list is read again.
    drawn: [toastKoskGone, toastInvalid, toastForbidden, toastOther, toastClose]
    built:
      - route: apps/nazar/features/offsite/offsite.ts:67
      - route: apps/nazar/features/offsite/components/offsite-form.tsx:92
    walked:
      - test: apps/nazar/test/offsite.spec.tsx
    # replay: koskGone (binding.koskGone.yaml, bound, not walked yet); invalid, forbidden and other cannot be driven locally

  - id: the-refusal-is-said
    need: >-
      A medrese nazır who was not granted the permission is told "Bu sayfaya izniniz yok" and is given no form.
    drawn: [refused, forbiddenAlert]
    built:
      - route: apps/nazar/features/offsite/components/offsite-page.tsx:46
    walked:
      - e2e: apps/nazar/e2e/offsite.e2e.ts
        check: 'offsite#4'
      - test: apps/nazar/test/offsite.spec.tsx
    # carried by nazar.access.medreseNazirRefused; replay: refused (bound, not walked yet)

  - id: the-empty-and-failed-reads-are-said
    need: >-
      Where no köşk is listed the page says nobody can be asked yet and offers the way back; where a read failed it says so and
      offers a retry, and it names the read that failed.
    drawn: [noKosk, noKoskAlert, unreadable, failedRegion, retry]
    built:
      - route: apps/nazar/features/offsite/components/offsite-page.tsx:61
    walked:
      - test: apps/nazar/test/offsite.spec.tsx
    # not bound: the local stack always lists köşks and cannot be made to fail a read on request

  - id: see-what-became-of-a-request
    need: >-
      After sending, the başmüderris can see the requests of her medrese, each with its köşk, its state (waiting, accepted,
      rejected) and, when rejected, the köşk's reason; or she is told when the köşk decides (OFFSITE-1, decision D1). Today the page
      reads the list and draws none of it, and no notification is sent.
    drawn: [sent]
    missing: none

  - id: a-failed-call-is-told
    need: >-
      When the send cannot reach the server at all, the button stops being busy and the person is told to try again (F-A-10).
    drawn: [sending, toastOther]
    missing: none

  - id: a-vanished-koshk-is-deselected
    need: >-
      When the chosen köşk is no longer listed, the form drops it from its choice, shows a name or the placeholder, and does not
      send the gone id again (OFFSITE-2).
    drawn: [afterUnnamed, toastKoskGone]
    missing: none

  - id: every-wrong-field-is-announced
    need: >-
      After a refused send every wrong field is announced, not only the first one the focus lands on, and an error that appears
      while she types is announced too (F-L-12).
    drawn: [nameError, reasonError]
    missing: none
