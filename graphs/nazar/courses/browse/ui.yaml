# The screens of nazar.courses.browse: Dersler of a medrese (/medrese/<id>/dersler) in nazar-web, with the two filters' open lists and a
# row's open menu. Read from apps/nazar/features/courses (courses-page.tsx, courses-table.tsx, courses.ts), libs/ui/src/mds/{table,select,
# menu,alert,system-state}.tsx and features/shell/components/{page-problem,load-failed}.tsx. Where a node says "repeat", the page draws it
# once per row (or per köşk) and the replay finds the rows through the binding.
#
# Words: every `Courses.*`, `Problems.*` and `Shell.retry` key is copied from libs/i18n/src/locales/tr/nazar.json (the app reads it as
# `nazar.<key>`), `common.imamStar.title` from common.json, the key being the path inside the file. Five messages are built in code and
# are in no i18n file, so they are `composed.*`, each with its code line:
#   composed.Courses.title  "{title}"   the course's name, from the API, the link in the first cell (courses-table.tsx:83, <bdi>)
#   composed.Courses.kosk   "{kosk}"    the köşk's name under it, and in a hosting card's row (courses.ts:228, courses-page.tsx:180, <bdi>);
#                                       " · bugün açıldı" follows it on the day the course was opened (Courses.openedToday, out of view)
#   composed.Courses.hoca   "{hoca}"    a hoca as the course shows her: with the unvan, or the name and "Hoca" (courses.ts:232,
#                                       formatHocaName in libs/utils/src/hoca-unvan.js:67, <bdi>)
#   composed.Courses.exam   "{title}"   the course's name in the exam card (courses-page.tsx:205, <bdi>)
# The samples are the seed's own names (STACK.md) where the replay reads them. `changes` is absent on purpose: the flow invokes three
# reads and nothing that writes (the dialogs of the row menu are other flows').
#
# The page keeps no focus of its own on load (nothing in features/courses sets one) and after a filter or a menu closes it is the kit's
# (Base UI) that returns it, which was not verified in a browser, so there is no `initialFocus` and no `focus`: see the rules
# focus-not-set and focus-after-a-filter. The two filters' lists and the row menu are Base UI popups that leave the page as it is
# (tedris.discover.applyForKosk lists its page's nodes while the same Select is open, and nazar.shell.scopeAndMenu its sidebar's while a Base UI
# menu is; that the popups leave the page exposed is from them and from the code, not seen here), so the page's nodes are listed in those states too.
schema: delurio-graph/0
kind: ui
id: nazar.courses.browse
flow: nazar.courses.browse
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples:
  nameGenitive: Hadis ve Siyer Medresesi’nin
  courses: "5"
  kosks: "2"
  count: "2"
  title: Bina ve İzhar Şerhi
  kosk: Süleymaniye Köşkü
  hoca: Hamdi Müderris Hoca
  name: Süleymaniye Köşkü
  exams: "1"
  taken: "0"
  absent: "0"
  average: "80"

nodes:
  # ---- the page and its header -----------------------------------------------------------------------------------------------
  coursesPage: { type: page, component: Page, role: main, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu, forbidden, loadFailed], source: libs/ui/src/mds/app-shell.tsx:41 } # the shell's one <main id="main">: no name, no initialFocus (rule focus-not-set); the binding finds it by the subtitle
  coursesTitle: { type: text, component: Heading, role: heading, text: { key: Courses.title }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu, forbidden, loadFailed], source: apps/nazar/features/courses/components/courses-page.tsx:102 } # h1
  subtitle: { type: text, component: Text, text: { key: Courses.subtitle, params: { nameGenitive: medrese.nameGenitive } }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu, forbidden, loadFailed], source: apps/nazar/features/courses/components/courses-page.tsx:103 } # the medrese's name in the Turkish genitive (courses.ts:140); "Medresenin dersleri, …" while the name is unknown (out of view)
  offsiteLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: Courses.offsite }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], emits: OPEN_OFFSITE, source: apps/nazar/features/courses/components/courses-page.tsx:114 } # an <a href> (Button href): a full page load; left out with the list when the list read fails
  openCourse: { type: action, component: LinkButton, role: link, intent: confirm, text: { key: Courses.open }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], when: canOpen, emits: OPEN_NEW_COURSE, source: apps/nazar/features/courses/components/courses-page.tsx:117 } # a plain link; stays on while the köşk read is refused or fails (F-A-8)
  openCourseOff: { type: action, component: LinkButton, role: link, intent: confirm, text: { key: Courses.open }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], disabledIn: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], when: "not canOpen", source: apps/nazar/features/courses/components/courses-page.tsx:120 } # no href, aria-disabled, role link kept (button.tsx:76-90): the köşk read answered and holds no köşk

  # ---- the list is refused, or could not be read ------------------------------------------------------------------------------
  forbiddenTitle: { type: text, component: Text, text: { key: Problems.forbiddenTitle }, in: [forbidden], source: apps/nazar/features/shell/components/page-problem.tsx:25 } # the Alert's title is a <p>, not a heading (F-A-16)
  forbiddenAlert: { type: alert, component: Alert, role: status, text: { key: Problems.forbidden }, in: [forbidden], source: apps/nazar/features/shell/components/page-problem.tsx:25 } # a neutral Alert is role status and is in the page when it loads, so it is not announced (F-A-16); it has no name of its own, so it is found by its sentence
  failedRegion: { type: text, component: Text, role: region, name: { labelledBy: failedTitle }, in: [loadFailed], source: libs/ui/src/mds/system-state.tsx:33 } # a <section aria-labelledby> inside the shell's <main>
  failedTitle: { type: text, component: Heading, role: heading, text: { key: Courses.loadFailedTitle }, in: [loadFailed], source: libs/ui/src/mds/system-state.tsx:43 } # an <h1>, the second of the page (F-A-1)
  failedText: { type: text, component: Text, text: { key: Courses.loadFailed }, in: [loadFailed], source: libs/ui/src/mds/system-state.tsx:46 }
  retry: { type: action, component: Button, role: button, intent: secondary, text: { key: Shell.retry }, in: [loadFailed], emits: RETRY, source: apps/nazar/features/shell/components/load-failed.tsx:33 } # busy while router.refresh() runs, with the hidden word "Yükleniyor" from a default outside the catalog (F-A-14)

  # ---- the counter and the two filters -----------------------------------------------------------------------------------------
  counter: { type: text, component: Text, text: { key: Courses.counter, params: { courses: list.courses, kosks: list.kosks } }, in: [listed, choosingKosk, choosingStatus, rowMenu], when: matches, source: apps/nazar/features/courses/components/courses-table.tsx:191 } # <p data-testid="counter">: not a live region (COURSES-1); the köşks are those of the courses listed (courses.ts:106)
  counterNone: { type: text, component: Text, text: { key: Courses.counterNone }, in: [emptyAll, emptyFiltered, choosingKosk, choosingStatus], when: "not matches", source: apps/nazar/features/courses/components/courses-table.tsx:191 }
  filtersGroup: { type: list, component: List, role: group, name: { key: Courses.filters.label }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], source: apps/nazar/features/courses/components/courses-table.tsx:194 } # a <fieldset> with a visually hidden <legend>
  koskSelect: { type: field, component: TextField, role: combobox, text: { key: Courses.filters.kosk.label }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], emits: OPEN_KOSK_FILTER, source: apps/nazar/features/courses/components/courses-table.tsx:198 } # the kit's Select: a button named by its aria-label "Köşk", showing "Köşk: tümü" or "Köşk: {name}"; an address with a ?kosk= that is no option shows "tümü" while the list is filtered (COURSES-2)
  statusSelect: { type: field, component: TextField, role: combobox, text: { key: Courses.filters.status.label }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], emits: OPEN_STATUS_FILTER, source: apps/nazar/features/courses/components/courses-table.tsx:209 } # the same, showing "Durum: tümü", "Durum: Yayında" or "Durum: Taslak"

  # ---- the Köşk filter's list, open (Base UI Select popup) ---------------------------------------------------------------------------
  koskList: { type: list, component: List, role: listbox, in: [choosingKosk], source: libs/ui/src/mds/select.tsx:80 } # no name of its own (as tedris.discover.applyForKosk's, which draws the same popup)
  koskOptionAll: { type: list, component: ListItem, role: option, text: { key: Courses.filters.kosk.all }, checked: "kosk == 'all'", in: [choosingKosk], emits: CHOOSE_KOSK_ALL, source: apps/nazar/features/courses/courses.ts:90 }
  koskOptionOne: { type: list, component: ListItem, role: option, text: { key: Courses.filters.kosk.one, params: { name: hosting.kosk.name } }, in: [choosingKosk], when: "hosting == 'kosks'", repeat: hosting.kosks, emits: CHOOSE_KOSK_ONE, source: apps/nazar/features/courses/courses.ts:91 } # every köşk that holds a hosting right, not only those of the courses on screen (courses#2 a5); which one is selected is the node's, so no `checked`

