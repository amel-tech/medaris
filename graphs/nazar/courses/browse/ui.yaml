  statusOptionPublished: { type: list, component: ListItem, role: option, text: { key: Courses.filters.status.PUBLISHED }, checked: "status == 'published'", in: [choosingStatus], emits: CHOOSE_STATUS_PUBLISHED, source: apps/nazar/features/courses/courses.ts:99 }
  statusOptionDraft: { type: list, component: ListItem, role: option, text: { key: Courses.filters.status.DRAFT }, checked: "status == 'draft'", in: [choosingStatus], emits: CHOOSE_STATUS_DRAFT, source: apps/nazar/features/courses/courses.ts:99 }

  # ---- the table ---------------------------------------------------------------------------------------------------------------------
  coursesTable: { type: list, component: List, role: table, name: { key: Courses.caption }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], source: apps/nazar/features/courses/components/courses-table.tsx:223 } # responsive="stack": the table, its rows and cells carry explicit roles, and the caption is visually hidden
  colCourse: { type: text, component: Text, role: columnheader, text: { key: Courses.columns.course }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], source: apps/nazar/features/courses/components/courses-table.tsx:71 }
  colMuderris: { type: text, component: Text, role: columnheader, text: { key: Courses.columns.muderris }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], source: apps/nazar/features/courses/components/courses-table.tsx:97 }
  colStudents: { type: text, component: Text, role: columnheader, text: { key: Courses.columns.students }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], source: apps/nazar/features/courses/components/courses-table.tsx:120 }
  colStatus: { type: text, component: Text, role: columnheader, text: { key: Courses.columns.status }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], source: apps/nazar/features/courses/components/courses-table.tsx:146 }
  colActions: { type: text, component: Text, role: columnheader, text: { key: Courses.columns.actions }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], source: apps/nazar/features/courses/components/courses-table.tsx:157 } # visually hidden text, in the accessibility tree

