  # ---- the card of the course outside the medrese --------------------------------------------------------------------------------------
  outsideRegion: { type: text, component: Text, role: region, name: { labelledBy: outsideTitle }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], source: apps/nazar/features/courses/components/courses-page.tsx:230 }
