  examList: { type: list, component: List, role: list, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], when: "exams == 'rows'", source: apps/nazar/features/courses/components/courses-page.tsx:199 } # <ul data-testid="exam-summary">
  examCourse: { type: text, component: Text, text: { key: composed.Courses.exam, params: { title: exam.courseTitle } }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], when: "exams == 'rows'", repeat: exam.rows, source: apps/nazar/features/courses/components/courses-page.tsx:205 }
  examRowText: { type: text, component: Text, text: { key: Courses.examSummaryRow, params: { exams: exam.examCount, taken: exam.takenCount, absent: exam.absentCount } }, in: [listed, emptyAll, emptyFiltered, choosingKosk, choosingStatus, rowMenu], when: "exams == 'rows'", repeat: exam.rows, source: apps/nazar/features/courses/components/courses-page.tsx:207 } # the row's line in a caption span, then an aria-hidden "·", then the mean
