edges:
  - { labelledBy: [failedRegion, failedTitle] }
  - { labelledBy: [hostsRegion, hostsTitle] }
  - { labelledBy: [examRegion, examTitle] }
  - { labelledBy: [outsideRegion, outsideTitle] }
  - { triggers: [koskSelect, choosingKosk] }
  - { triggers: [statusSelect, choosingStatus] }
  - { triggers: [rowMenuButton, rowMenu] }
  - { triggers: [retry, readingCourses] }

rules:
  - { id: F-A-8, rule: "One 403 per read is 'no permission' only on the list. A nazır with madrasah.course_hide or madrasah.muderris_manage and not madrasah.course_open reads the list and is refused the köşk read: the card says 'Köşkler şu an okunamadı. Sayfayı yenileyip yeniden deneyin.' (a refusal told as a failure), 'Medrese dersi aç' stays on and leads to a refused page, and both row-menu items are offered on every row whatever she holds, to be refused with a toast (courses-page.tsx:95-96,112-125,165-168; courses-table.tsx:164-178). Drawn as `hosting: unreadable`; not walked (the stack has no medrese nazır holding one of the codes). Fix: on a 403 of the side read say 'izniniz yok' or leave the control out, and draw a control only for a code the reader holds." }
  - { id: F-A-9, rule: "The course title is a link to /ders/<id> on every row: `held`, the set the comment calls 'the courses the caller holds a scope in', is `medreseCourseLinks(courses.data.map(id))`, built from the list itself (courses-page.tsx:92-94), so the check in courseRows (courses.ts:224) is always true. For a nazır who may list the courses and holds no seat in them the link leads to a page she may not open. Fix: build `held` from the caller's real scopes (openedScope), or correct the comment." }
  - { id: F-A-1, rule: "When the list read fails, LoadFailed adds a second <h1> ('Dersler okunamadı') inside the same <main>, beside the page's own <h1> 'Dersler' (load-failed.tsx:28, system-state.tsx:24,43). Fix: headingLevel={2} when `shell` is true." }
  - { id: F-A-14, rule: "The retry button is busy while router.refresh() runs, and passes no loadingLabel, so its hidden status says 'Yükleniyor' from the kit's hard-coded default, outside the catalog (button.tsx:62, load-failed.tsx:33). Turkish only today." }
  - { id: F-A-15, rule: "The card's section id is the fixed string 'hosts-heading' (courses-page.tsx:164), the Pano's too; after a client navigation the previous page may stay hidden in the DOM, so aria-labelledby may resolve to the hidden one. Not verified; the replay checks the three regions by name." }
  - { id: F-A-16, rule: "The refusal 'Bu sayfaya izniniz yok' is a neutral Alert, which is role status, already in the page when it loads, so it is not announced; its title is a <p>, not a heading. The <h1> still names the page (page-problem.tsx:23-28, alert.tsx:23). Fix: render the verdict as a heading or role=alert." }
  - { id: F-A-12, rule: "Listed for this flow in FLOWS.md and not a finding of this page: it is the Arşiv's tab link, whose text is directly followed by its count (archive-list.tsx:173-184). Dersler has no tabs." }
  - { id: COURSES-1, rule: "New. Choosing a filter announces nothing. The counter is a plain <p data-testid=counter> (courses-table.tsx:191), the table's `aria-busy` is on a plain div (:188) and aria-busy is not announced, no live region says how many courses are left, and the focus stays on the select's button (not verified), so a screen-reader user who picks 'Durum: Taslak' hears nothing of the new list. Keşfet's count line is an <output> (tedris.discover.browse). Fix: make the counter a status (an <output> or role=status)." }
  - { id: COURSES-2, rule: "New. An address with ?kosk=<a uuid that is no hosting köşk of the medrese> filters the list by it (filtersOf takes any uuid, courses.ts:47; the API answers an empty list, not a 400, madrasah.repository.ts:1491) while the select shows 'Köşk: tümü' (courses-table.tsx:64-66 falls back to ALL when the value is no option). The page then says 'Bu süzgece uyan ders yok.' with 'Süzgeçleri temizle', and the select says nothing is filtered. From the code; not seen in a browser. Fix: show the raw filter, or drop an unknown köşk in filtersOf." }
  - { id: COURSES-3, rule: "New. The köşk filter and the card list only the köşks that hold a hosting right (listMadrasahHostingKosks), while the list holds every non-hidden course whatever its köşk's right: a course that stayed in a köşk after its right was withdrawn (KEEP) is listed and counted in 'N köşkte', and the person cannot narrow to that köşk nor see it in the card. A course in a hidden köşk is not listed at all (findCourseList joins the köşk's archivedAt, madrasah.repository.ts:1485-1490), and the note says hidden courses are in the Arşiv, which holds items with their own hidden mark (archive.repository.ts). From the code; not seen. Fix: offer the köşks of the listed courses in the filter (decision D2); say where a course of a hidden köşk went." }
  - { id: focus-not-set, rule: "The page sets no initial focus: nothing in features/courses moves it, so after a load the focus is at the document's start (and after 'Süzgeçleri temizle' too, a plain link: a new document)." }
  - { id: focus-after-a-filter, rule: "Choosing a filter or closing the menu returns the focus to the trigger through Base UI; the page is re-read by router.replace in a transition and the client component stays mounted. Not verified in a browser (nazar.md: 'NOT VERIFIED'); the graph draws no `focus`." }
  - { id: label-in-name, rule: "A control's visible text is in its accessible name: 'Medrese dersi aç' and 'Medrese dışı ders talebi gönder' are links with their own text; the two filters are named 'Köşk' and 'Durum' by their aria-label and show 'Köşk: tümü' and 'Durum: tümü' (WCAG 2.5.3 holds); the row menu is an icon named by its aria-label 'Diğer işlemler: {title}'. Holds." }
  - { id: table-semantics, rule: "The table has a caption ('Medrese dersleri', visually hidden), column headers, and the course cell is the row header (scope=row); in the stacked layout the roles are explicit. A draft with nobody says a dash for the eye and 'Henüz talebe yok' to a reader of the screen; the pending badge carries a clock icon and its words, never a colour alone. Holds." }
  - { id: no-confirmation-needed, rule: "This page only reads and filters. The two writes, 'Hocaları değiştir' and 'Dersi gizle' (which asks first), are the dialogs of nazar.courses.changeHocas and nazar.archive.hideAndRestoreCourse." }
