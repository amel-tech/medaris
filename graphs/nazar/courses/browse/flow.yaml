      OPEN_STATUS_FILTER: { target: sorting, source: libs/ui/src/mds/select.tsx:51, say: "they press the filter again: the list closes and the page stays as it was" }
      OPEN_KOSK_FILTER: { target: sorting, source: libs/ui/src/mds/select.tsx:51, say: "they press the Köşk filter: the open list's backdrop takes the press, the list closes and the other one stays shut" }
      OPEN_ROW_MENU: { target: sorting, source: libs/ui/src/mds/select.tsx:51, say: "they press a row's \"Diğer işlemler\": the open list's backdrop takes the press, the list closes and nothing else happens" }
      OPEN_COURSE: { target: sorting, source: libs/ui/src/mds/select.tsx:51, say: "they press a course's title: the open list's backdrop takes the press, the list closes and nothing else happens" }
      OPEN_NEW_COURSE: { target: sorting, source: libs/ui/src/mds/select.tsx:51, say: "they press \"Medrese dersi aç\": the open list's backdrop takes the press, the list closes and nothing else happens" }
      OPEN_OFFSITE: { target: sorting, source: libs/ui/src/mds/select.tsx:51, say: "they press \"Medrese dışı ders talebi gönder\": the open list's backdrop takes the press, the list closes and nothing else happens" }
      OPEN_ARCHIVE: { target: sorting, source: libs/ui/src/mds/select.tsx:51, say: "they press \"Arşiv\" in the note: the open list's backdrop takes the press, the list closes and nothing else happens" }
      CLEAR_FILTERS: { target: sorting, source: libs/ui/src/mds/select.tsx:51, say: "they press \"Süzgeçleri temizle\": the open list's backdrop takes the press, the list closes and nothing else happens" }

  rowMenu:
    title: A row's menu is open
    by: human
    description: >-
      The Base UI menu of the row, opened from the icon button "Diğer işlemler: {title}": two items, "Hocaları değiştir" and "Dersi
      gizle", on every row whatever the reader holds (F-A-8). Arrows, typeahead and Esc are Base UI's; Esc returns the focus to the
      trigger (not verified in a browser). Choosing an item opens that row's dialog on this page, which is another flow's (the exits are
      named for the flow that goes on).
    source: libs/ui/src/mds/menu.tsx:62
    on:
      CHOOSE_CHANGE_HOCAS: { target: handed_over.change_hocas, starts: { flow: nazar.courses.changeHocas }, say: "\"Hocaları değiştir\" opens the dialog for the row's course", source: apps/nazar/features/courses/components/courses-table.tsx:168 }
      CHOOSE_HIDE: { target: handed_over.hide_course, starts: { flow: nazar.archive.hideAndRestoreCourse }, say: "\"Dersi gizle\" opens the confirmation for the row's course", source: apps/nazar/features/courses/components/courses-table.tsx:173 }
      CLOSE_MENU: { target: listed, say: "Esc: the menu closes", source: libs/ui/src/mds/menu.tsx:32 }
      # The kit's Menu is modal (Base UI's default; menu.tsx passes no `modal`): while it is open a transparent backdrop, cut out around its trigger, covers the page, so a press elsewhere only closes the menu.
      OPEN_ROW_MENU: { target: listed, source: libs/ui/src/mds/menu.tsx:48, say: "they press \"Diğer işlemler\" again, or another row's: the menu closes and no other opens" }
      OPEN_KOSK_FILTER: { target: listed, source: libs/ui/src/mds/menu.tsx:48, say: "they press the Köşk filter: the open menu's backdrop takes the press, the menu closes and nothing else happens" }
      OPEN_STATUS_FILTER: { target: listed, source: libs/ui/src/mds/menu.tsx:48, say: "they press the Durum filter: the open menu's backdrop takes the press, the menu closes and nothing else happens" }
