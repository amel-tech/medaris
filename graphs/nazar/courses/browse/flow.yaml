      CHOOSE_STATUS_PUBLISHED: { guard: "status != 'published'", target: readingCourses, effect: [chosePublished], say: "they choose \"Durum: Yayında\"", source: apps/nazar/features/courses/components/courses-table.tsx:216 }
      CHOOSE_STATUS_DRAFT: { guard: "status != 'draft'", target: readingCourses, effect: [choseDraft], say: "they choose \"Durum: Taslak\"", source: apps/nazar/features/courses/components/courses-table.tsx:216 }
      CLOSE_FILTER: { target: sorting, say: "Esc: the list closes and the page stays as it was", source: libs/ui/src/mds/select.tsx:51 }
