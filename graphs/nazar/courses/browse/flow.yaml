      OPEN_NEW_COURSE: { target: listed, source: libs/ui/src/mds/menu.tsx:48, say: "they press \"Medrese dersi aç\": the open menu's backdrop takes the press, the menu closes and nothing else happens" }
      OPEN_OFFSITE: { target: listed, source: libs/ui/src/mds/menu.tsx:48, say: "they press \"Medrese dışı ders talebi gönder\": the open menu's backdrop takes the press, the menu closes and nothing else happens" }
      OPEN_ARCHIVE: { target: listed, source: libs/ui/src/mds/menu.tsx:48, say: "they press \"Arşiv\" in the note: the open menu's backdrop takes the press, the menu closes and nothing else happens" }

  forbidden:
    title: The list is refused
    by: human
    description: >-
      The header stays, the buttons that open or request a course are left out with everything else that needs the list, and under it a
      neutral Alert says "Bu sayfaya izniniz yok" with a sentence. Its role is status and it is in the page when it loads, so nothing
      announces it (F-A-16). The nazır's whole story is nazar.access.medreseNazirRefused.
    source: apps/nazar/features/shell/components/page-problem.tsx:23
    on:
      NAVIGATE: { target: left, say: "they follow the sidebar or leave" }

  loadFailed:
    title: The list could not be read
    by: human
    description: >-
      The header stays, the buttons are left out, and a section with its own <h1> "Dersler okunamadı" (a second h1 beside "Dersler",
      F-A-1), "Dersler şu an okunamadı. Birkaç saniye sonra yeniden deneyin." and the button "Yeniden dene" takes the place of the list.
      The button refreshes the route in a transition and is busy meanwhile, saying "Yükleniyor" to a reader of the screen from a default
      outside the catalog (F-A-14).
    source: apps/nazar/features/shell/components/load-failed.tsx:27
    on:
      RETRY: { target: readingCourses, say: "\"Yeniden dene\": router.refresh(); the server page reads all three again", source: apps/nazar/features/shell/components/load-failed.tsx:36 }
      NAVIGATE: { target: left, say: "they follow the sidebar or leave" }

  not_found:
    type: final
    title: The medrese is not there
    description: "A 404 of a read is Next's not-found page (lib/tedrisat-read.ts:46). Not drawn: no stack account reaches it from this page."
    leavesPage: true

  course_opened:
    type: final
    title: They open a course
    description: The browser is on /ders/<id>, the course's Genel bakış. nazar.course.overview draws it.

  new_course_opened:
    type: final
    title: They open the form that opens a course
    description: The browser is on /medrese/<id>/dersler/yeni. nazar.courses.open draws it.

  offsite_opened:
    type: final
    title: They open the form that asks for an off-site course
    description: The browser is on /medrese/<id>/dersler/talep. nazar.offsite.requestCourse draws it.

  archive_opened:
    type: final
    title: They open the Arşiv
    description: The browser is on /medrese/<id>/arsiv. nazar.archive.hideAndRestoreCourse draws it.

  handed_over.change_hocas:
    type: final
    title: The dialog "Hocaları değiştir" is open
    description: The page stays at /medrese/<id>/dersler with the dialog over it; nazar.courses.changeHocas draws it.

  handed_over.hide_course:
    type: final
    title: The confirmation "Dersi gizle" is open
    description: The page stays at /medrese/<id>/dersler with the alert dialog over it; nazar.archive.hideAndRestoreCourse draws it.

  left:
    type: final
    title: They leave the page
    leavesPage: true

assertions:
  - id: list-means-courses
    never: "state == 'listed' and stock == 'none'"
    say: The table has rows only where the medrese has a course.
    source: apps/nazar/features/courses/components/courses-table.tsx:223
  - id: empty-means-no-course-and-no-filter
    never: "state == 'emptyAll' and (stock != 'none' or filtered)"
    say: The sentence that says the medrese has no course is drawn only when nothing is listed and no filter is set.
    source: apps/nazar/features/courses/components/courses-table.tsx:240
  - id: empty-filtered-means-a-filter
    never: "state == 'emptyFiltered' and (matches or not filtered)"
    say: The sentence that says the filter matches nothing is drawn only when a filter is set and nothing is left.
    source: apps/nazar/features/courses/components/courses-table.tsx:229
  - id: a-kosk-is-chosen-only-where-the-select-offers-one
    never: "kosk == 'one' and hosting != 'kosks'"
    say: The köşk filter holds a köşk only while the card lists the köşks that host the medrese; otherwise it offers "tümü" alone.
    source: apps/nazar/features/courses/courses.ts:86
  - id: a-menu-needs-a-row
    never: "state == 'rowMenu' and not matches"
    say: A row's menu is opened only where the table has a row.
    source: apps/nazar/features/courses/components/courses-table.tsx:164
  - id: the-refusal-is-a-403
    never: "state == 'forbidden' and list != 'forbidden'"
    say: The refusal under the header is drawn only when the list read was refused.
    source: apps/nazar/features/courses/components/courses-page.tsx:127
  - id: the-retry-box-is-a-failure
    never: "state == 'loadFailed' and list != 'failed'"
    say: The retry box is drawn only when the list read failed.
    source: apps/nazar/features/courses/components/courses-page.tsx:127
  - id: the-form-needs-a-hosting-kosk
    never: "state == 'new_course_opened' and hosting == 'none'"
    say: The way to the form is off while no köşk holds a hosting right for the medrese.
    source: apps/nazar/features/courses/components/courses-page.tsx:96
