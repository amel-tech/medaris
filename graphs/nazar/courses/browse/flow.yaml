# Dersler of a medrese in nazar-web (/medrese/<id>/dersler), read by its başmüderris: the list of the medrese's courses with the köşk
# each was opened in, its hocas, its talebe and its state; the filters by köşk and by state and the way to clear them; the three side
# cards (the köşks that host the medrese, how the exams went, the course outside the medrese); the note that leads to the Arşiv; and
# the ways out of the page. Read from the code of PR #394 (apps/nazar/features/courses, libs/ui/src/mds/{table,select,menu}.tsx, the
# three GETs the page makes). Written on 15 Nov 2026, status captured, with no replay run (the first walks are a later phase); every
# behaviour that was not seen in a browser says "from the code".
#
# What it does today, and where the code is wrong for its users (ui.yaml `rules` carries the same ids):
#   F-A-8    one 403 per read is "no permission" only on the list. A nazır who holds madrasah.course_hide or madrasah.muderris_manage but
#            not madrasah.course_open reads the list, and the köşk read is refused: the card says "Köşkler şu an okunamadı" (a refusal told
#            as a failure), "Medrese dersi aç" stays on and leads to a refused page, and both row-menu items are on every row whatever
#            she holds. Drawn (`hosting: unreadable`), not walked: no helper gives a medrese nazır one code.
#   F-A-9    the course title is a link to /ders/<id> on every row: `held`, the set the comment calls "the courses the caller holds a
#            scope in", is built from the list itself (courses-page.tsx:92), so the check is always true.
#   F-A-1    a failed list read draws a second <h1> ("Dersler okunamadı") beside the page's own "Dersler".
#   F-A-14   the retry button's busy word is the hard-coded "Yükleniyor".
#   F-A-15   the card's id `hosts-heading` is the Pano's too.
#   F-A-16   the refusal "Bu sayfaya izniniz yok" is a neutral Alert (role status) already in the page when it loads: nothing announces it.
#   COURSES-1 (new) choosing a filter announces nothing: the counter is a plain <p>, the table's `aria-busy` is on a div, and the result
#            is a new list under a select that kept the focus.
#   COURSES-2 (new) an address with ?kosk=<a uuid that is no hosting köşk of the medrese> filters the list by it (the API answers an empty
#            list, not a 400) while the select reads "Köşk: tümü", and the empty state offers "Süzgeçleri temizle".
#   COURSES-3 (new) a course in a köşk whose hosting right was withdrawn (KEEP) is listed and counted in "N köşkte", but its köşk is in
#            neither the filter nor the side card; a course in a hidden köşk is not listed at all (the list joins the köşk's own hidden
#            mark), and the note says hidden courses are in the Arşiv, which holds what carries its own hidden mark. From the code.
#   F-A-12 (listed for this flow in FLOWS.md) is the Arşiv's tab and does not apply to this page.
# Not a finding, checked in the code: the hidden course, the "bugün açıldı" line and the hoca with no account need data the API cannot
# make (see needs.yaml and the report).
schema: delurio-graph/0
kind: flow
id: nazar.courses.browse
status: captured
domain: medaris.api
ui: nazar.courses.browse
title: Read and filter the medrese's courses
summary: >-
  The başmüderris opens Dersler. The page reads the medrese's courses (draft and published, not hidden), the köşks that host the
  medrese and how its exams went, and draws a table (the course as a link, its köşk, its hocas with a star on the imam when there are
  several, the enrolled count with a badge for the applications that wait, "Yayında" or "Taslak", and a menu "Diğer işlemler" with
  "Hocaları değiştir" and "Dersi gizle"), a counter ("N ders · M köşkte") and two filters, Köşk and Durum, above it; beside it the
  cards of the köşks she may open a course in, of the exams, and of the course outside the medrese; below it a note that hidden
  courses are in the Arşiv. Choosing a filter writes it in the address and reads the page again; a filter that finds nothing says so
  and offers "Süzgeçleri temizle". A medrese with no course says that and how to open one. The two buttons in the header, "Medrese
  dışı ders talebi gönder" and "Medrese dersi aç", are full page loads; the second is off while no köşk hosts the medrese. A
  refused list read draws "Bu sayfaya izniniz yok" and no buttons; a failed one draws "Dersler okunamadı" and a retry. The row menu's
  two items open dialogs, which are other flows' (nazar.courses.changeHocas, nazar.archive.hideAndRestoreCourse).
source: apps/nazar/features/courses/components/courses-page.tsx:63

scope:
  shows: >-
    the Dersler page of one medrese for its başmüderris: the header and its two buttons, the counter and the two filters (each with its
    open list), the table with each row's menu, the three side cards, the note to the Arşiv, the empty states, the refusal and the
    failed read
  world: open
  outOfView:
    - "the sidebar, its scope picker and the number on its \"Dersler\" entry (the count of courses that hold an application): nazar.shell.scopeAndMenu"
    - "the two dialogs the row menu opens, the hide's confirmation and its toasts, and the Arşiv a hidden course goes to: nazar.courses.changeHocas, nazar.archive.hideAndRestoreCourse"
    - "the pages the buttons and the title link lead to: nazar.courses.open (the form), nazar.offsite.requestCourse, nazar.course.overview"
    - "a medrese nazır with no grant meets the refusal under the header: nazar.access.medreseNazirRefused (drawn here as `forbidden`, walked there as well)"
    - "the loading file (loading.tsx): a skeleton in an <output aria-busy> with the hidden label \"Yükleniyor\", drawn while the three reads run"
    - "the \"bugün açıldı\" line under a course opened today (it depends on the day, not on the data), the hoca with no account (a row the API cannot make) and a hidden course's absence (nazar.archive.hideAndRestoreCourse)"
    - "the exact numbers of the counter, the badges and the cards: the replay matches any number, and the walk's data decides what they are"
    - "an address with a ?kosk= or ?durum= typed by hand: it is the same list the filter makes (filtersOf: an unknown ?durum= and a ?kosk= that is no uuid read as \"tümü\"), except COURSES-2"
    - "the phone layout: below 768 px the table is stacked cards with the same nodes"

decisions:
  D1:
    question: >-
      Should the row menu, and the buttons of the header, follow what the reader holds? "Hocaları değiştir" and "Dersi gizle" are on
      every row and "Medrese dersi aç" is on while the köşk read is refused, so a nazır with one of the three list codes meets
      refusals after the click (F-A-8).
    recommend: >-
      Yes: draw a control only for a code the reader holds, as nazar.nav's `held` already says, and say "izniniz yok" where a side read
      is refused instead of "okunamadı".
    affects: [listed, choosingKosk]
  D2:
    question: >-
      Should the köşk filter offer the köşks of the courses on the list as well as the köşks that host the medrese (COURSES-3)?
    recommend: >-
      Yes: a course that stays in a köşk after its right was withdrawn is on the list, and the person should be able to narrow to it.
    affects: [choosingKosk]

context:
  list:
    values: [ok, forbidden, failed]
    initial: any
    say:
      ok: "the list read answers: the başmüderris, a nazır with one of madrasah.course_open, madrasah.course_hide or madrasah.muderris_manage, or the başnazım"
      forbidden: "the list read is refused (403): a medrese nazır with none of the three codes"
      failed: "the list read fails for another reason (a 5xx, the network)"
  hosting:
    values: [kosks, none, unreadable]
    initial: any
    say:
      kosks: "at least one köşk holds a hosting right for the medrese: the card lists them and the köşk filter offers each"
      none: "no köşk holds a hosting right: the card says so, the filter offers only \"tümü\" and \"Medrese dersi aç\" is off"
      unreadable: "the köşk read is refused or fails while the list answers (a nazır without madrasah.course_open, F-A-8): the card says it could not be read, the filter offers only \"tümü\" and \"Medrese dersi aç\" stays on"
  exams:
    values: [rows, empty, unread]
    initial: any
    say:
      rows: "at least one course of the medrese holds an exam: the card has a row for each"
      empty: "no course holds an exam: the card says so"
      unread: "the exam read is refused or fails: the card is left out, with no word"
  stock:
    values: [none, published, mixed]
    initial: any
    say:
      none: "the medrese has no course that is not hidden"
      published: "the medrese's courses are all published and in the one köşk that hosts it (the stack's own seed: two courses); \"one\" köşk in the filter is that köşk"
      mixed: "the courses are in two hosting köşks, some published and one draft, as in the e2e: \"one\" köşk in the filter is the second köşk, which holds one published course and no draft"
  kosk:
    values: [all, one]
    initial: all
    say:
      all: "the köşk filter says \"Köşk: tümü\""
      one: "the köşk filter holds one hosting köşk (?kosk=<id> is in the address)"
  status:
    values: [all, published, draft]
    initial: all
    say:
      all: "the state filter says \"Durum: tümü\""
      published: "the state filter says \"Durum: Yayında\" (?durum=yayinda)"
      draft: "the state filter says \"Durum: Taslak\" (?durum=taslak)"

guards:
  # what the list holds once the two filters are applied (the API narrows by köşk and by state, both together)
  matches: "(stock == 'published' and status != 'draft') or (stock == 'mixed' and not (kosk == 'one' and status == 'draft'))"
  filtered: "kosk != 'all' or status != 'all'"
  canOpen: "hosting != 'none'"
  # the parts of a row that only some of the walk's courses have; the node `when`s of ui.yaml read these
  showsPublished: "matches and status != 'draft'"
  showsDraft: "stock == 'mixed' and kosk == 'all' and status != 'published'"
  showsStar: "stock == 'mixed' and kosk == 'all' and status != 'draft'"
  showsWaiting: "stock != 'none' and status != 'draft' and not (stock == 'mixed' and kosk == 'one')"
  showsNobody: "stock == 'mixed' and status != 'draft'"

effects:
  choseOneKosk: { set: { kosk: one } }
  choseAllKosks: { set: { kosk: all } }
  choseAnyState: { set: { status: all } }
  chosePublished: { set: { status: published } }
  choseDraft: { set: { status: draft } }
  clearedFilters: { set: { kosk: all, status: all } }

failures:
  readingCourses:
    from: listMadrasahCourses
    forbidden: [AUTHZ_FORBIDDEN]
    missing: [MADRASAH_NOT_FOUND]
    failed: []
  readingHosts:
    from: listMadrasahHostingKosks
    unreadable: [AUTHZ_FORBIDDEN]
  readingExams:
    from: getMadrasahExamSummary
    unreadable: [AUTHZ_FORBIDDEN]
# `failed: []` and `unreadable` stand for any answer but success that the page does not say otherwise about: readOnce turns a 403 into
# "forbidden" and every other failure into "failed" (lib/tedrisat-read.ts:43-50). A 404 of any of the three reads is Next's not-found page
# (the same file); only the list's is drawn, as `not_found`. The domain lists HTTP_400 for a ?koskId= or ?status= the API cannot read,
# which the page never sends (filtersOf, courses.ts:47). A 401 is the sign-in's and is left out.

# The story the page tells first, in the e2e's order (courses#2): the köşk filter, then the state filter on top of it (nothing matches),
# "Süzgeçleri temizle", the state filter alone (the draft), and the way to the Arşiv.
main:
  given: { list: ok, hosting: kosks, exams: rows, stock: mixed }
  events:
    - DONE
    - DONE
    - DONE
    - OPEN_KOSK_FILTER
    - CHOOSE_KOSK_ONE
    - DONE
    - DONE
    - DONE
    - OPEN_STATUS_FILTER
    - CHOOSE_STATUS_DRAFT
    - DONE
    - DONE
    - DONE
    - CLEAR_FILTERS
    - DONE
    - DONE
    - DONE
    - OPEN_STATUS_FILTER
    - CHOOSE_STATUS_DRAFT
    - DONE
    - DONE
    - DONE
    - OPEN_ARCHIVE

initial: readingCourses

states:
  readingCourses:
    title: Read the medrese's courses
    description: >-
      The page reads its address (filtersOf: ?kosk= only when it is a uuid, ?durum= only "yayinda" or "taslak"; anything else reads as
      "tümü") and CoursesPage makes three reads at once, Promise.all, each through readOnce: GET /madrasahs/{id}/courses?koskId&status,
      GET /madrasahs/{id}/hosting-kosks and GET /madrasahs/{id}/exam-summary. The graph draws them one after the other, as
      tedris.discover.browse draws its three. This one decides the page: a 403 is the refusal under the header (state forbidden), any
      other failure is the retry box (loadFailed), a 404 is Next's not-found page. While the reads run the segment's loading file draws a
      skeleton; nothing of it is drawn here. Every choice of a filter, and "Yeniden dene", comes back here: the server page is read again.
    invoke: { action: listMadrasahCourses }
    on:
      DONE: { guard: "list == 'ok'", target: readingHosts, source: apps/nazar/features/courses/components/courses-page.tsx:136 }
      FAIL.forbidden: { guard: "list == 'forbidden'", target: forbidden, say: "the list read is 403: the page draws the refusal and no buttons", source: apps/nazar/lib/tedrisat-read.ts:45 }
      FAIL.failed: { guard: "list == 'failed'", target: loadFailed, say: "the list read failed outright: the page draws the retry box", source: apps/nazar/lib/tedrisat-read.ts:48 }
      FAIL.missing: { target: not_found, say: "the medrese is not there: Next's not-found page", source: apps/nazar/lib/tedrisat-read.ts:46 }
    source: apps/nazar/features/courses/components/courses-page.tsx:75

  readingHosts:
    title: Read the köşks that host the medrese
    description: >-
      GET /madrasahs/{id}/hosting-kosks asks madrasah.course_open, which the list read does not: a nazır who holds only
      madrasah.course_hide or madrasah.muderris_manage reads the list and is refused here (F-A-8). Any non-success of this read is the
      same to the page: `canOpen` stays true, the köşk card says "Köşkler şu an okunamadı. Sayfayı yenileyip yeniden deneyin." in an error
      Alert, and the köşk filter keeps only "tümü". The page is not refused for it.
    invoke: { action: listMadrasahHostingKosks }
    on:
      DONE: { guard: "hosting != 'unreadable'", target: readingExams, source: apps/nazar/features/courses/components/courses-page.tsx:169 }
      FAIL.unreadable: { guard: "hosting == 'unreadable'", target: readingExams, say: "a refusal or a failure of this read does not stop the page: the card says it could not be read (F-A-8: a refusal is worded as a failure)", source: apps/nazar/features/courses/components/courses-page.tsx:165 }
    source: apps/nazar/features/courses/components/courses-page.tsx:82

  readingExams:
    title: Read how the exams went
    description: >-
      GET /madrasahs/{id}/exam-summary (MDRS-248) asks the same three codes as the list. A row for each non-hidden course that holds an
      exam: how many exams, how many talebe sat, how many were absent, the mean. A refusal or a failure leaves the card out, with no word.
    invoke: { action: getMadrasahExamSummary }
    on:
      DONE: { guard: "exams != 'unread'", target: sorting, source: apps/nazar/features/courses/components/courses-page.tsx:191 }
      FAIL.unreadable: { guard: "exams == 'unread'", target: sorting, say: "the card is left out", source: apps/nazar/features/courses/components/courses-page.tsx:191 }
    source: apps/nazar/features/courses/components/courses-page.tsx:86

  sorting:
    title: See what the list holds
    description: >-
      Classification only. The table draws its rows, or its one empty line: "Bu süzgece uyan ders yok." with "Süzgeçleri temizle"
      when a filter is set, "Bu medresede henüz ders yok. …" when none is. The page comes here again, without a read, when a filter's
      list is closed with nothing chosen.
    always:
      - { guard: matches, target: listed, say: "at least one course is left", source: apps/nazar/features/courses/components/courses-table.tsx:223 }
      - { guard: "not filtered", target: emptyAll, say: "no filter is set and nothing is listed: the medrese has no course", source: apps/nazar/features/courses/components/courses-table.tsx:240 }
      - { target: emptyFiltered, say: "a filter is set and nothing is left", source: apps/nazar/features/courses/components/courses-table.tsx:229 }
    source: apps/nazar/features/courses/components/courses-table.tsx:223

  listed:
    title: The courses are listed
    by: human
    goal: true
    description: >-
      The page: h1 "Dersler" and its sentence, the two buttons, the counter "{n} ders · {m} köşkte" (a <p>, not a live region,
      COURSES-1), the group "Dersleri süz" with the comboboxes Köşk and Durum, the table "Medrese dersleri" (a row for each course: the
      title as a link and under it the köşk, the hocas with a star on the imam when there are several, the enrolled count with a badge
      "{n} onay bekliyor" while applications wait or "Henüz talebe yok" when nobody is in, "Yayında" or "Taslak", the menu "Diğer işlemler:
      {title}"), the note with the link "Arşiv", and the three cards. A published course nobody is in says "Henüz talebe yok"; a draft
      says a dash for the eye and the same words, hidden, for a reader of the screen. The title link is on every row whatever the person
      holds (F-A-9). Both filters keep each other (choosing a state keeps the köşk), are written in the address with router.replace (no
      history entry: Back leaves the page) and read the page again; the focus is not moved (not verified in a browser). The note says
      hidden courses are in the Arşiv, which is true of a course the person hid and not of a course whose köşk is hidden (COURSES-3).
      The card of the köşks is a section whose id, "hosts-heading", is the Pano's too (F-A-15).
    source: apps/nazar/features/courses/components/courses-table.tsx:185
    on:
      OPEN_KOSK_FILTER: { target: choosingKosk, say: "they open the Köşk filter", source: apps/nazar/features/courses/components/courses-table.tsx:198 }
      OPEN_STATUS_FILTER: { target: choosingStatus, say: "they open the Durum filter", source: apps/nazar/features/courses/components/courses-table.tsx:209 }
      OPEN_ROW_MENU: { target: rowMenu, say: "they press a row's \"Diğer işlemler\"", source: apps/nazar/features/courses/components/courses-table.tsx:164 }
      OPEN_COURSE: { target: course_opened, starts: { flow: nazar.course.overview }, say: "a title is a link to /ders/<id>, whatever the person holds (F-A-9)", source: apps/nazar/features/courses/components/courses-table.tsx:79 }
      OPEN_NEW_COURSE: { guard: canOpen, target: new_course_opened, starts: { flow: nazar.courses.open }, say: "\"Medrese dersi aç\" is a plain link: a new document", source: apps/nazar/features/courses/components/courses-page.tsx:117 }
      OPEN_OFFSITE: { target: offsite_opened, starts: { flow: nazar.offsite.requestCourse }, say: "\"Medrese dışı ders talebi gönder\" is a plain link: a new document", source: apps/nazar/features/courses/components/courses-page.tsx:114 }
      OPEN_ARCHIVE: { target: archive_opened, starts: { flow: nazar.archive.hideAndRestoreCourse }, say: "\"Arşiv\" in the note: a client-side link to /medrese/<id>/arsiv", source: apps/nazar/features/courses/components/courses-page.tsx:154 }
      NAVIGATE: { target: left, say: "they follow the sidebar or leave" }

  emptyAll:
    title: The medrese has no course
    by: human
    description: >-
      The counter says "Gösterilecek ders yok", the table says "Bu medresede henüz ders yok. Barındırma hakkı olan bir köşkte “Medrese dersi
      aç” ile ilk dersi açabilirsiniz." in its one cell, and the filters are still there. Where no köşk holds a hosting right the card
      says so and "Medrese dersi aç" is off (no address, aria-disabled): the sentence names a button that cannot be pressed.
    source: apps/nazar/features/courses/components/courses-table.tsx:240
    on:
      OPEN_KOSK_FILTER: { target: choosingKosk, say: "they open the Köşk filter", source: apps/nazar/features/courses/components/courses-table.tsx:198 }
      OPEN_STATUS_FILTER: { target: choosingStatus, say: "they open the Durum filter", source: apps/nazar/features/courses/components/courses-table.tsx:209 }
      OPEN_NEW_COURSE: { guard: canOpen, target: new_course_opened, starts: { flow: nazar.courses.open }, say: "the link is on where a köşk hosts the medrese or the köşk read failed", source: apps/nazar/features/courses/components/courses-page.tsx:117 }
      OPEN_OFFSITE: { target: offsite_opened, starts: { flow: nazar.offsite.requestCourse }, say: "the other button of the header", source: apps/nazar/features/courses/components/courses-page.tsx:114 }
      OPEN_ARCHIVE: { target: archive_opened, starts: { flow: nazar.archive.hideAndRestoreCourse }, say: "the note is drawn here too", source: apps/nazar/features/courses/components/courses-page.tsx:154 }
      NAVIGATE: { target: left, say: "they follow the sidebar or leave" }

  emptyFiltered:
    title: Nothing matches the filter
    by: human
    description: >-
      The counter says "Gösterilecek ders yok" and the table's one cell says "Bu süzgece uyan ders yok." with the link "Süzgeçleri
      temizle" under it, a plain link to the address with no query: a new document, so both selects start at "tümü" and the focus is at
      the document's start. The filters are still there, so a person may also change one. An address with a ?kosk= that is no hosting
      köşk draws this state with the select saying "Köşk: tümü" (COURSES-2).
    source: apps/nazar/features/courses/components/courses-table.tsx:229
    on:
      CLEAR_FILTERS: { target: readingCourses, effect: [clearedFilters], say: "\"Süzgeçleri temizle\": a plain link to /dersler; both filters go", source: apps/nazar/features/courses/components/courses-table.tsx:232 }
      OPEN_KOSK_FILTER: { target: choosingKosk, say: "they open the Köşk filter", source: apps/nazar/features/courses/components/courses-table.tsx:198 }
      OPEN_STATUS_FILTER: { target: choosingStatus, say: "they open the Durum filter", source: apps/nazar/features/courses/components/courses-table.tsx:209 }
      OPEN_NEW_COURSE: { guard: canOpen, target: new_course_opened, starts: { flow: nazar.courses.open }, say: "the header's button", source: apps/nazar/features/courses/components/courses-page.tsx:117 }
      OPEN_OFFSITE: { target: offsite_opened, starts: { flow: nazar.offsite.requestCourse }, say: "the other button of the header", source: apps/nazar/features/courses/components/courses-page.tsx:114 }
      OPEN_ARCHIVE: { target: archive_opened, starts: { flow: nazar.archive.hideAndRestoreCourse }, say: "the note is drawn here too", source: apps/nazar/features/courses/components/courses-page.tsx:154 }
      NAVIGATE: { target: left, say: "they follow the sidebar or leave" }

  choosingKosk:
    title: The Köşk filter is open
    by: human
    description: >-
      The kit's Select popup (Base UI): a listbox with no name of its own whose options are "Köşk: tümü" and, for every köşk that holds a
      hosting right for the medrese, "Köşk: {name}", not only the köşks of the courses on screen (courses#2 a5); the page stays as it was
      (tedris.discover.applyForKosk draws its page's nodes while the same popup is open; whether the popup makes the page inert is not verified here). Choosing an option other than the chosen
      one writes the address and reads the page again, and nothing says aloud what the new list holds (COURSES-1); Esc, or the chosen
      option, closes it and changes nothing.
    source: libs/ui/src/mds/select.tsx:72
    on:
      CHOOSE_KOSK_ONE: { guard: "hosting == 'kosks' and kosk == 'all'", target: readingCourses, effect: [choseOneKosk], say: "they choose a köşk: ?kosk=<id> joins the address and the status filter stays", source: apps/nazar/features/courses/components/courses-table.tsx:202 }
      CHOOSE_KOSK_ALL: { guard: "kosk == 'one'", target: readingCourses, effect: [choseAllKosks], say: "they choose \"Köşk: tümü\": ?kosk= leaves the address", source: apps/nazar/features/courses/components/courses-table.tsx:205 }
      CLOSE_FILTER: { target: sorting, say: "Esc: the list closes and the page stays as it was", source: libs/ui/src/mds/select.tsx:51 }
      # The kit's Select is modal (Base UI's default; select.tsx passes no `modal`): while it is open a transparent backdrop, cut out around its own trigger, covers the page, so a press elsewhere only closes the list.
