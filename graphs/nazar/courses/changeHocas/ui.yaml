# The screens of nazar.courses.changeHocas: the Dersler page of a medrese (/medrese/<id>/dersler) with a row's menu, and the
# "Hocaları değiştir" dialog that "Hocaları değiştir" in the menu opens, the toasts of its save. Read from the code of PR #394
# (apps/nazar/features/courses/components/{courses-page,courses-table,change-muderris,muderris-picker}.tsx, features/courses/team.ts,
# libs/ui/src/mds/{dialog,menu,toast,button}.tsx); everything here is from the code, nothing was seen in a browser. The words are
# copied from libs/i18n/src/locales/tr/nazar.json and common.json.
#
# Two messages are not from an i18n file, and the catalog keeps them under `composed.` (the app writes the course's title and a
# hoca's name into a paragraph with no words of its own): composed.ChangeTeam.eyebrow ("{title}", change-muderris.tsx:102) and
# composed.Team.memberName ("{name}", muderris-picker.tsx:170). `Changes.note` is the one message the app has no equivalent of: no
# message of the app says what saving the list changes, so this graph carries one short Turkish sentence of its own.
#
# The page behind the dialog is drawn only where the dialog is closed: the dialog is modal and the page is inert while it is open.
# The row menu (Base UI Menu) is drawn alone in its state, since whether it makes the page behind it inert was not looked at.
schema: delurio-graph/0
kind: ui
id: nazar.courses.changeHocas
flow: nazar.courses.changeHocas
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  title: Deneme dersi changeHocas
  name: Esma Örnek
  count: "2"

# The page keeps no focus of its own on load (nothing in features/courses sets it): no `initialFocus` on the page. After the menu
# is closed with Esc the focus is on its trigger (Base UI's own, `focus.listed`); after the dialog closes it is meant to go back to
# the trigger as well (`returnsFocus`), which the code does not say and nobody has looked at.
focus: { listed: rowMenu }

nodes:
