  guestName: { type: text, component: Text, text: { key: composed.Team.memberName, params: { name: person.name } }, in: [form, formReady, looking, saving], when: "list in ['guest', 'guestAndOne']", source: apps/nazar/features/courses/components/muderris-picker.tsx:170 } # the hoca who has no account: shown by name alone
  noAccountNote: { type: text, component: Text, text: { key: Team.noAccount }, in: [form, formReady, looking, saving], when: "list in ['guest', 'guestAndOne']", source: apps/nazar/features/courses/components/muderris-picker.tsx:177 } # no radio and no "Çıkar" on that row
  imamBadge: { type: text, component: Text, text: { key: Team.imam }, in: [form, formReady, looking, saving], when: "list in ['guestAndOne', 'lone', 'pair', 'trio']", source: apps/nazar/features/courses/components/muderris-picker.tsx:181 } # a badge on the imam's row, also with a lone account
