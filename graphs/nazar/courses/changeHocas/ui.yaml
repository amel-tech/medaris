  imamMissing: { type: text, component: Text, text: { key: Team.imamMissing }, in: [form, formReady, looking, saving], when: "list == 'pairNoImam'", source: apps/nazar/features/courses/components/change-muderris.tsx:128 } # a <p class=mds-error> with no role: written at once, never announced (F-A-5)
