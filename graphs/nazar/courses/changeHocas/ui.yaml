  page: { type: page, component: Page, role: main, in: [listed, closed, saved, course_gone], source: apps/nazar/features/courses/components/courses-page.tsx:98 } # the shell's one <main id="main">; it has no name
  pageTitle: { type: text, component: Heading, role: heading, text: { key: Courses.title }, in: [listed, closed, saved, course_gone], source: apps/nazar/features/courses/components/courses-page.tsx:102 } # <h1>
  coursesTable: { type: list, component: List, role: table, name: { key: Courses.caption }, in: [listed, closed, saved, course_gone], source: apps/nazar/features/courses/components/courses-table.tsx:223 }
  rowMenu: { type: action, component: Button, role: button, intent: secondary, name: { key: Courses.actions.label, params: { title: course.title } }, in: [listed, closed, saved], emits: OPEN_MENU, source: apps/nazar/features/courses/components/courses-table.tsx:164 } # an icon-only trigger (aria-haspopup=menu): one on every row, whatever the person may do (F-A-8); the course's own is found by its title
  rowStarBefore: { type: action, component: Button, role: button, name: { key: common.imamStar.title }, in: [listed, closed], when: "team == 'pair'", source: apps/nazar/features/courses/components/courses-table.tsx:110 } # the imam's star in the Hocalar cell, only where the course has more than one hoca
  rowStarAfter: { type: action, component: Button, role: button, name: { key: common.imamStar.title }, in: [saved], when: "list in ['guestAndOne', 'pair', 'trio']", source: apps/nazar/features/courses/components/courses-table.tsx:110 } # after the save the row has the list as saved: a lone hoca has no star (a name with no account counts as a hoca of the row)

  # ---- the row's menu ---------------------------------------------------------------------------------------------------------
  menuPopup: { type: list, component: List, role: menu, in: [menu], source: libs/ui/src/mds/menu.tsx:62 } # Base UI's popup; arrows, typeahead and Esc are its own
