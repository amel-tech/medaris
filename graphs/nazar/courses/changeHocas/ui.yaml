  toastOther: { type: alert, component: Alert, role: alertdialog, name: { key: ChangeTeam.failedTitle }, text: { key: Problems.actionGeneric }, in: [form, formReady], when: "toast == 'other'", source: apps/nazar/features/courses/courses.ts:394 }

edges:
  - { labelledBy: [hocasDialog, hocasTitle] }
  - { labelledBy: [radioGroup, legend] }
  - { triggers: [rowMenu, menu] }
  - { triggers: [menuHocas, form] }
  - { triggers: [menuHide, hide_dialog_opened] }
  - { triggers: [save, saving] }
  - { returnsFocus: [hocasDialog, rowMenu] } # Base UI gives the focus back to what had it when the dialog opened, and the dialog is opened from a menu item that has gone by then: where it lands was not looked at

rules:
  - { id: F-A-4, rule: "The outcomes of a search ('Bu e-posta adresiyle kayıtlı bir hesap bulunamadı.', 'Arama şu an yapılamıyor…', 'Bu kişi zaten listede.', 'En fazla 20 hoca eklenebilir.') are only the Field's error text, with no role and no live region, and `announced` is emptied for each of them; only 'Aranıyor' and a success ('{name} listeye eklendi') are said by the hidden <output> (muderris-picker.tsx:123-139, 245-265). A screen-reader user who presses Enter hears nothing when the search fails. Fix: announce the problem text too, or give the error role=alert." }
  - { id: F-A-5, rule: "'Dersin imamını seçin.' is a plain <p class=mds-error> beside the radio group (change-muderris.tsx:128, muderris-picker.tsx:276): it has no role=alert, it appears at once (with no submit to follow), and it is read only when the person browses to it. Fix: role=alert, or describe the Kaydet button with it." }
  - { id: F-A-8, rule: "Both menu items are offered on every row whatever the person may do: a nazır holding madrasah.course_hide or madrasah.muderris_manage alone meets 'Bunu yapma izniniz yok.' in a toast after opening the dialog and pressing Kaydet (courses-table.tsx:164-178). Not drawn here: only the başmüderris walks this flow. Fix: hide the items by the person's permissions." }
  - { id: F-A-10, rule: "No try/catch around the awaited server action (change-muderris.tsx:64-90): when the call itself fails (the network is down) the pending state is never cleared, no toast says so, and React hands the error to the nearest boundary. Not verified in a browser; not drawn." }
  - { id: F-A-13, rule: "The Dialog wraps its whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:103-112), so a screen reader may read the intro, the field, the radios and every row as the dialog's description when it opens. Fix: describe only the intro paragraph." }
  - { id: HOCAS-1, rule: "New. The e-mail address is searched when the field is left as well as on Enter (muderris-picker.tsx:263, `onBlur`), and tedrisat writes every search, found or not, to the audit log; the help line says so. Typing an address and pressing Vazgeç, or tabbing on, makes an audited lookup the person did not ask for. Fix: search on Enter or an explicit 'Ara' button only (the same shape as F-W3-14 in nizam)." }
  - { id: HOCAS-2, rule: "New. The hidden <output> keeps saying '{name} listeye eklendi' after that person is taken off the list with 'Çıkar' (muderris-picker.tsx:133, 266), and a removal says nothing: the screen-reader user is told the opposite of what the list holds. Fix: say the removal, or empty the output when the list changes (the same shape as F-W3-open-3 in nizam)." }
  - { id: HOCAS-3, rule: "New. The search field is `disabled` while a search runs (muderris-picker.tsx:256), so the focus it had is dropped and nothing gives it back: after Enter the person starts again from the top of the dialog, and nothing but the hidden output says that the search ended. From the code; not seen in a browser. Fix: keep the field enabled with aria-busy, or give the focus back when the search ends (the same shape as F-W2-3 in nizam)." }
  - { id: HOCAS-4, rule: "New, from the code, not seen. After 'Bu kişi zaten listede.' the address stays in the field and `searched` keeps it (muderris-picker.tsx:109, 122-126), so taking that person off the list with 'Çıkar' and pressing Enter again does nothing: the same string is skipped and the message about the person being listed stays. Only a changed address searches again. Fix: forget the last search when the list changes." }
  - { id: HOCAS-5, rule: "New. 'Vazgeç' and the close icon stay enabled while the list is being saved and do nothing (`if (!open && !pending) onClose()`, change-muderris.tsx:96-98): a control that looks live and ignores a press, not marked busy or disabled (the same shape as F-W3-open-2 in nizam)." }
  - { id: HOCAS-6, rule: "New. A course whose only hoca has no account opens with 'Kaydet' off, the line 'Hesabı olmayan hoca; bu listeden değiştirilemez.' and the generic help 'En az bir hoca gerekir…', which does not say that an account is needed; the count reads '1 hoca' (change-muderris.tsx:128 passes an error only for the imam). The e2e comment says an account has to be added before there is anything to save (courses.e2e.ts:253). Fix: say it under the list." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Çıkar' in 'Çıkar: {name}'; the dialog's close button and the row's menu button are named by aria-label alone and have no visible text (WCAG 2.5.3). Holds." }
  - { id: focus-not-set, rule: "No code of features/courses sets the focus when the page opens, after the menu closes, or after the dialog closes (a save or Vazgeç); the Base UI defaults are drawn (`focus.listed`, `returnsFocus`) and not verified. The dialog's own initial focus is the search field (change-muderris.tsx:105, 131)." }
  - { id: no-confirmation-to-remove, rule: "'Çıkar' takes a hoca off the local list at once and nothing asks first; nothing is written until 'Kaydet', and 'Vazgeç' throws the list away. Holds; the unsaved list is lost silently on Esc, since nothing says it has changed." }
