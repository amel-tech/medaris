  searchListed: { type: text, component: Text, text: { key: Team.listed }, in: [form, formReady, looking, saving], when: "search == 'listed'", source: apps/nazar/features/courses/components/muderris-picker.tsx:155 } # the same address is not searched again, even after that person is taken off the list (HOCAS-4)
  searchDown: { type: text, component: Text, text: { key: Team.failed }, in: [form, formReady, looking, saving], when: "search == 'down'", source: apps/nazar/features/courses/components/muderris-picker.tsx:153 }
  searching: { type: status, component: Status, role: status, text: { key: Team.searching }, in: [looking], source: apps/nazar/features/courses/components/muderris-picker.tsx:116 } # the hidden <output>, the only part of a search that is announced
  added: { type: status, component: Status, role: status, text: { key: Team.added, params: { name: person.name } }, in: [form, formReady, saving], when: "said == 'added'", source: apps/nazar/features/courses/components/muderris-picker.tsx:133 } # the same <output>; it keeps saying it after that person is taken off the list (HOCAS-2)

  # Hocalar: the list
  legend: { type: text, component: Text, text: { key: ChangeTeam.legend }, in: [form, formReady, looking, saving], source: apps/nazar/features/courses/components/muderris-picker.tsx:268 } # a <p>, "Hocalar" and an aria-hidden "*"
