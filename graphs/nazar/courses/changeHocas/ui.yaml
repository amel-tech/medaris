  removeOther: { type: action, component: Button, role: button, intent: secondary, name: { key: Team.removeLabel, params: { name: person.name } }, text: { key: Team.remove }, in: [form, formReady, looking, saving], when: "list in ['pair', 'pairNoImam', 'trio']", repeat: team.accounts, emits: REMOVE_OTHER, duringStep: true, source: apps/nazar/features/courses/components/muderris-picker.tsx:221 } # the "Çıkar" of every account that is not the imam (all of them while the imam is missing). Live while a person is looked up and while the list is saved, as imamPickOther
  removeLast: { type: action, component: Button, role: button, intent: secondary, name: { key: Team.removeLabel, params: { name: person.name } }, text: { key: Team.remove }, in: [form, formReady, looking, saving], disabledIn: [form, formReady, looking, saving], when: "list in ['guestAndOne', 'lone']", source: apps/nazar/features/courses/components/muderris-picker.tsx:225 } # the one account left: natively disabled (the course keeps at least one), and nothing says why beyond the help line

  # the footer
  countOne: { type: text, component: Text, text: { key: ChangeTeam.count, params: { count: team.size } }, in: [form, formReady, looking, saving], when: "list in ['guest', 'lone']", source: apps/nazar/features/courses/components/change-muderris.tsx:106 } # "1 hoca": the count is of the lines, a hoca with no account included; not a live region
  countTwo: { type: text, component: Text, text: { key: ChangeTeam.count, params: { count: team.size } }, in: [form, formReady, looking, saving], when: "list in ['guestAndOne', 'pair', 'pairNoImam']", source: apps/nazar/features/courses/components/change-muderris.tsx:106 } # "2 hoca"
  countThree: { type: text, component: Text, text: { key: ChangeTeam.count, params: { count: team.size } }, in: [form, formReady, looking, saving], when: "list == 'trio'", source: apps/nazar/features/courses/components/change-muderris.tsx:106 } # "3 hoca"
  cancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: ChangeTeam.cancel }, in: [form, formReady, looking, saving], emits: CANCEL, source: apps/nazar/features/courses/components/change-muderris.tsx:109 } # still on while the list is saved, and does nothing then (HOCAS-5)
  save: { type: action, component: Button, role: button, intent: confirm, text: { key: ChangeTeam.save }, in: [form, formReady, saving], disabledIn: [form, saving], emits: SAVE, source: apps/nazar/features/courses/components/change-muderris.tsx:110 } # natively disabled until the list differs from where it started and is complete; busy (aria-disabled, aria-busy) while it is saved; not drawn in `looking`, where it keeps the state it had
