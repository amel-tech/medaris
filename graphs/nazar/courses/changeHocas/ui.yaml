  imamPickTwo: { type: field, component: ListItem, role: radio, name: { key: Team.imamPick, params: { name: person.name } }, in: [form, formReady, looking, saving], when: "list in ['pair', 'pairNoImam']", repeat: team.accounts, source: apps/nazar/features/courses/components/muderris-picker.tsx:197 } # one radio an account, as many as the accounts; which is checked is not drawn here (the imam is checked, none while the imam is missing)
  imamPickThree: { type: field, component: ListItem, role: radio, name: { key: Team.imamPick, params: { name: person.name } }, in: [form, formReady, looking, saving], when: "list == 'trio'", repeat: team.accounts, source: apps/nazar/features/courses/components/muderris-picker.tsx:197 }
