  toastGone: { type: alert, component: Alert, role: alertdialog, name: { key: ChangeTeam.failedTitle }, text: { key: Courses.errors.gone }, in: [course_gone], source: apps/nazar/features/courses/components/change-muderris.tsx:81 } # an error toast stays until it is closed
