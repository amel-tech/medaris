  breadcrumb: { type: list, component: List, role: navigation, name: { key: OpenCourse.breadcrumb }, in: [form, formAtName, formAtSearch, looking, lookingAnother, opening, noKosk, forbidden, readFailed], source: apps/nazar/features/courses/components/open-course-page.tsx:38 } # <nav aria-label="Sayfa yolu"> over an ordered list: "Dersler" / "Medrese dersi aç"
  breadcrumbCourses: { type: action, component: LinkButton, role: link, text: { key: Courses.title }, in: [form, formAtName, formAtSearch, looking, lookingAnother, opening, noKosk, forbidden, readFailed], emits: BACK, source: apps/nazar/features/courses/components/open-course-page.tsx:41 }
  breadcrumbCurrent: { type: text, component: Text, text: { key: OpenCourse.title }, in: [form, formAtName, formAtSearch, looking, lookingAnother, opening, noKosk, forbidden, readFailed], source: apps/nazar/features/courses/components/open-course-page.tsx:42 } # aria-current="page", the same words as the h1
  title: { type: text, component: Heading, role: heading, text: { key: OpenCourse.title }, in: [form, formAtName, formAtSearch, looking, lookingAnother, opening, noKosk, forbidden, readFailed], source: apps/nazar/features/courses/components/open-course-page.tsx:45 } # h1
  intro: { type: text, component: Text, text: { key: OpenCourse.intro, params: { name: madrasah.name } }, in: [form, formAtName, formAtSearch, looking, lookingAnother, opening, noKosk, forbidden, readFailed], source: apps/nazar/features/courses/components/open-course-page.tsx:46 } # "Ders {medrese} adına, ..."; OpenCourse.introUnnamed when the name cannot be read

