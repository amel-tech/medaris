# The screens of nazar.courses.open: "Medrese dersi aç" (/medrese/<id>/dersler/yeni) under the nazar shell, read from
# apps/nazar/features/courses/components/{open-course-page,open-course-form,muderris-picker}.tsx and features/courses/{courses,team}.ts on
# 15 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nazar.json (namespaces OpenCourse, Team, Courses, Problems, Shell, Nav).
#
# The sidebar is nazar.shell.scopeAndMenu's; the page here is the shell's <main>. The form is a page, not a dialog, so nothing is
# inert behind it and no focus is returned to an opener. Two hocas are drawn at most (the page takes 20), and the names of those
# two people are written as literals, because a catalog parameter has one sample per flow and `name` is the medrese's in the intro:
# "Dilek Başvuran" and "Rıza Başvuran" are the local stack's spare talebe accounts that the binding adds as hocas (the stack's
# invented names); "Çıkar: …", "Dersin imamı: …" and "… için unvan" are Team.removeLabel, Team.imamPick and
# CourseSettings.hocas.unvanLabel with those names, and "… listeye eklendi" is Team.added. Köşk names are data, not words of the
# app, and are literals too ("Süleymaniye Köşkü", "Kubbealtı Köşkü" are the seed's).
# The toast's close button is "Kapat" hard-coded in libs/ui/src/mds/toast.tsx:97, outside every catalog (F-L-6, MDRS-233): it is
# not drawn.
schema: delurio-graph/0
kind: ui
id: nazar.courses.open
flow: nazar.courses.open
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples: { name: "Deneme Medresesi", count: "2", min: "2", max: "200", title: "Deneme dersi aç" }
changes: { key: OpenCourse.note } # the page's own sentence under the boxes: the course is opened as a draft, and when talebe see it

focus:
  formAtName: nameField
  formAtSearch: hocaField

