edges:
  - { labelledBy: [settingsRegion, settingsTitle] }
  - { labelledBy: [failedSection, failedTitle] }
  - { triggers: [submit, opening] }
  - { triggers: [retry, reading] }

rules:
  - { id: focus-not-set, rule: "The page sets no initial focus (nothing in open-course-page.tsx or open-course-form.tsx does); a keyboard user who arrives from Dersler starts at the top of the page. After the draft is opened the page goes to Dersler by client navigation and nothing moves the focus there either. After a refused press the focus goes to the name field, else to the hoca search, which is the one thing the form does for its people (open-course#2 a3, a6)." }
  - { id: F-A-1, rule: "In the retry state the page already drew its own h1 ('Medrese dersi aç') and LoadFailed adds a second h1 ('Köşkler okunamadı') in a section of the same main (page-problem.tsx:30, system-state.tsx:43). Fix: pass headingLevel 2." }
  - { id: F-A-4, rule: "The search outcomes 'Bu e-posta adresiyle kayıtlı bir hesap bulunamadı.', 'Arama şu an yapılamıyor…' and 'Bu kişi zaten listede.' are Field.Error text with no live region, and `announced` is emptied for each (muderris-picker.tsx:124, 137), while 'Aranıyor' and '<name> listeye eklendi' are announced through the hidden <output>. A screen-reader user who presses Enter hears nothing of a failure. Fix: put the problem text into `announced`, or give the error role=alert." }
  - { id: F-A-5, rule: "'En az bir hoca seçin.' and 'Dersin imamını seçin.' are plain paragraphs (muderris-picker.tsx:276) with no role=alert; the id is wired only to the radio group that exists with several hocas. With none listed nothing references the error, and the refused press puts the focus on the search field, whose description is the help line, so the reason is never read. The imam error needs three hocas to show and is announced to no one (not drawn). Fix: role=alert, or describe the search field with it." }
  - { id: F-A-6, rule: "The köşk group's error 'Bir köşk seçin.' is a loose paragraph outside the radio group (open-course-form.tsx:169); RadioGroup has `error` and `help` props that tie the line to every radio and mark them invalid (libs/ui/src/mds/radio-group.tsx:26-31, 92-96) and the form does not use them; and a refused press with only the köşk wrong focuses nothing (open-course-form.tsx:105-114). Reachable only after the chosen köşk left the list." }
  - { id: F-A-7, rule: "'Köşk' and 'Seçilen hocalar' show a * (aria-hidden) but neither exposes 'required': the radio group has no `required`, and the hoca list is a paragraph legend that is a group label only while several hocas are listed (open-course-form.tsx:150-168, muderris-picker.tsx:268-275). Fix: required on the group; a role=group with the legend as its label." }
  - { id: F-A-8, rule: "A nazır who holds madrasah.course_hide or madrasah.muderris_manage but not madrasah.course_open reads Dersler, finds 'Medrese dersi aç' enabled and lands on this page's forbidden alert; a nazır who holds course_open without madrasah.settings_edit gets the form and the line 'Medresenin politikaları şu an okunamadı; ders açılırken sunucu uygular.' although the settings read was refused (open-course-page.tsx:75-78, courses-page.tsx:95-96). No e2e covers a partial grant. Fix: on a refusal of the settings read say the person may not read the policies (decision D1)." }
  - { id: F-A-10, rule: "No try/catch around the awaited server action (open-course-form.tsx:119): if the call itself rejects (the network), the transition never ends, 'Ders açılıyor' never clears, and nothing is shown; React hands the error to the nearest boundary. Not verified in a browser." }
  - { id: F-A-13, rule: "Listed in FLOWS.md for this flow, but it does not apply: it is about the dialog of nazar.courses.changeHocas (libs/ui/src/mds/dialog.tsx:103-112). This form is a page, not a dialog." }
  - { id: F-A-16, rule: "The refusal 'Bu sayfaya izniniz yok' is a neutral Alert, role=status, already in the page when it is read, so it is not announced; its title is a paragraph, not a heading, and the h1 above still says 'Medrese dersi aç' (page-problem.tsx:23, libs/ui/src/mds/alert.tsx:23). Same for the 'no köşk' warning alert." }
  - { id: F-L-6, rule: "The toast's close button is named 'Kapat' from a literal in libs/ui/src/mds/toast.tsx:97, outside the catalog, in every language (MDRS-233). It is the only way to dismiss the error toast, which stays until closed." }
  - { id: OPEN-1, rule: "new: the page keeps everything the person typed in its own state, and the three ways out drop it without a question: 'Vazgeç' and the breadcrumb's 'Dersler' (links, open-course-form.tsx:268, open-course-page.tsx:41) and the policy sentence's link 'Medrese ayarları' (open-course-form.tsx:253). The last one is the natural next step when a box is locked ('Politikayı Medrese ayarları’ndan değiştirebilirsiniz'), and following it costs the whole form: the name, every hoca found (each an audited lookup) and their unvans. Fix: open the settings in a new tab, or ask before leaving a form with something in it (decision D2)." }
  - { id: OPEN-2, rule: "new: courseErrorKey (courses.ts:374-395) words COURSE_IMAM_*, MUDERRIS_DUPLICATE_USER, VALIDATION_ERROR, HOSTING_RIGHT_REQUIRED, MUDERRIS_UNKNOWN_USER and AUTHZ_FORBIDDEN and sends every other code to 'Bir şeyler ters gitti. Biraz sonra yeniden deneyin.'. SELF_GRANT_REFUSED is one of them: a nazır with madrasah.course_open who finds themselves by e-mail and adds themselves as a hoca without holding every course code is refused on purpose (libs/common/src/authz/self-grant.guard.ts:91) and told to try again later, which can never work. The catalog already has the words (Problems.selfGrant). From the code, not seen in a browser." }
  - { id: OPEN-3, rule: "new: 'Çıkar: <name>' takes the hoca off at once with no question, moves no focus (the pressed button leaves with its row) and says nothing, and the picker's hidden <output> keeps its last words, '<name> listeye eklendi', after that person is gone (muderris-picker.tsx:133, 230, 266). The same shape as F-W3-open-3 in nizam's köşk picker." }
  - { id: OPEN-4, rule: "new: the hoca search field is `disabled` and aria-busy while it searches (muderris-picker.tsx:256-257), so the focused field loses the focus and the person who pressed Enter must tab back to it for the next address; nothing says the search ended except the hidden status for a success (F-A-4). The same shape as F-W2-3 in nizam. From the code." }
  - { id: OPEN-5, rule: "new: the address is searched when the field is left (onBlur, muderris-picker.tsx:263), not only on Enter, and tedrisat writes every lookup, found or not, to the audit log (the help line says so). Tabbing through a field that holds something address-like makes an audited lookup the person did not ask for. The same finding as F-W3-14 and F-X-14 of nizam's pickers. Fix: search on Enter or on an explicit button only." }
  - { id: OPEN-6, rule: "new: HOSTING_RIGHT_REQUIRED words itself 'Bu köşk artık medresenize barındırma hakkı vermiyor. Sayfa yenilendi; başka bir köşk seçin.' and re-reads the köşks (router.refresh, open-course-form.tsx:136). With two köşks that is true. When the köşk was the only one, the list is empty after the refresh and open-course-page.tsx:60-66 swaps the whole form for 'Ders açılabilecek köşk yok': the name, the hocas and the unvans typed are gone, and the toast still tells the person to choose another köşk. Fix: word a second sentence for the last köşk, or keep the typed values for the person to take elsewhere." }
  - { id: label-in-name, rule: "A visible text is contained in its accessible name (WCAG 2.5.3): 'Dersi aç', 'Vazgeç', 'Yeniden dene' and 'Derslere dön' are their own names; the köşk radios, the checkboxes and the hoca radios are named by their label only. Holds." }
  - { id: submit-is-never-off, rule: "'Dersi aç' is never disabled because of what is missing: a refused press writes the errors and moves the focus. A busy press is aria-disabled and aria-busy, not disabled, so the focus survives. This is the opposite of nizam's köşk form (F-W3-1) and is right. The one time it is natively disabled is while a hoca is looked up (open-course-form.tsx:273, the picker's onSearchingChange, muderris-picker.tsx:104), so a course is never opened without the hoca the person asked for." }
