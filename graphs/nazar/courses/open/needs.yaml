# What must exist for the başmüderris of a medrese to open a course of the medrese: the flow's product list (LAYOUT.md section 7). Each
# need is what the product must do, from the flow's story and the findings of the page, not from what the page does today. The known
# gaps go to graphs/needs.gaps.yaml, which the orchestrator merges; this file does not edit it. Read by people for now: no checker
# runs on this file yet.
#
# Gaps of this file, for that merge:
#   missing:   every-answer-is-announced, a-partial-grant-is-told-the-truth, leaving-keeps-the-form, naming-oneself-is-explained,
#              removing-a-hoca-is-said, lookup-only-on-request, the-last-kosk-leaving-keeps-the-work (each `missing: none`, the findings
#              F-A-4..F-A-8, F-A-16, OPEN-1..OPEN-6 of ui.yaml are their evidence)
#   unwalked:  give-a-hoca-an-unvan (code, no e2e: open-course.e2e.ts never picks an unvan; the replay scenario `opens` presses the select
#              but no `effects` check says what was sent, and nothing has been run yet),
#              open-from-the-pano-or-by-address, in part (the Dersler button is walked by open-course#1; the Pano's button, the address
#              and the refusal and 404 words have no e2e, and `noKosk`, `forbidden` and `missing` open the address in the binding, not yet run)
kind: needs
flow: nazar.courses.open
status: proposed

needs:
  - id: open-a-draft-in-a-hosting-kosk
    need: >-
      The başmüderris opens a course of her medrese in a köşk that hosts it, naming it and at least one hoca, in one step. The course
      is a draft: it stays out of sight of talebe until its hocas publish it, and Dersler lists it as "Taslak" at once, with the köşk
      it is in. Who made it and when is on record.
    drawn: [form, opening, opened, a-draft-has-a-name, a-draft-has-a-hoca, a-draft-has-a-kosk, openedToast, newRowStatus, newRowToday]
    built:
      - action: medaris.api:openMadrasahCourse
      - route: apps/nazar/features/courses/components/open-course-form.tsx:99
    walked:
      - e2e: apps/nazar/e2e/open-course.e2e.ts
        check: 'open-course#3'
      - test: apps/nazar/test/open-course.spec.tsx

  - id: only-hosting-kosks-can-be-chosen
    need: >-
      Only a köşk that gives the medrese a hosting right (and is not hidden) can be chosen, the first is chosen already, and each
      choice says how many courses the medrese has there. Where no köşk gives the right the page says so and who can give it, and draws
      no form.
    drawn: [form, noKosk, koskGroup, koskKubbealti, koskSuleymaniye, koskHasCourses, koskHelp, noKoskAlert]
    built:
      - action: medaris.api:listMadrasahHostingKosks
      - route: apps/nazar/features/courses/components/open-course-page.tsx:60
    walked:
      - e2e: apps/nazar/e2e/open-course.e2e.ts
        check: 'open-course#1'

  - id: say-what-is-wrong-and-go-there
    need: >-
      A press that cannot be sent writes, under each field, what is wrong (a missing or short or long name, no hoca), moves the focus to
      the first one, and sends nothing; the errors go the moment they are fixed. The button is never dead.
    drawn: [formAtName, formAtSearch, refused, nameRequired, nameShort, nameLong, teamNone, submit]
    built:
      - route: apps/nazar/features/courses/components/open-course-form.tsx:99
      - route: apps/nazar/features/courses/courses.ts:318
    walked:
      - e2e: apps/nazar/e2e/open-course.e2e.ts
        check: 'open-course#2'

  - id: every-answer-is-announced
    need: >-
      Every answer the form gives is announced to a person who cannot see it and tied to the field it is about: the errors under the
      name, the köşk and the hoca list, the outcomes of a hoca search (not found, directory down, already listed), and the refusal
      of a page that is not theirs. The köşk group and the hoca list say they are required.
    drawn: [nameRequired, teamNone, koskRequired, hocaNotFound, hocaDown, hocaListed, forbiddenAlert, noKoskAlert, koskGroup, teamLegend]
    missing: none # F-A-4, F-A-5, F-A-6, F-A-7, F-A-16; F-A-1 (the retry state has a second h1) is the same family

  - id: find-hocas-by-exact-email
    need: >-
      Each hoca is found by the exact e-mail address of an account in the realm, even one that never opened the app; a person already
      listed is not added twice; an address with no account and a directory that does not answer are said in words; up to 20 hocas.
    drawn: [looking, lookingAnother, hocaField, hocaNotFound, hocaDown, hocaListed, searching]
    built:
      - action: medaris.api:lookupUser
      - route: apps/nazar/features/courses/components/muderris-picker.tsx:95
    walked:
      - e2e: apps/nazar/e2e/open-course.e2e.ts
        check: 'open-course#3'
      - e2e: apps/nazar/e2e/open-course.e2e.ts
        check: 'open-course#4'

  - id: lookup-only-on-request
    need: >-
      A person's address is searched in the realm only when the person asks (Enter or a button), never because they tabbed through the
      field, since every search is written to the audit log; the result is announced and the focus stays in the field.
    drawn: [looking, hocaField]
    missing: none # OPEN-4, OPEN-5 (the same shape as F-W3-14 and F-W2-3 of nizam)

  - id: choose-the-imam
    need: >-
      A lone hoca is the imam; with several the first is the imam until the person picks another, and the row of the imam says so. The
      list the API gets always names exactly one imam among its hocas.
    drawn: [imamGroup, imamRadioA, imamRadioB, imamBadge, hocaARow, hocaBRow, removeA, removeB]
    built:
      - action: medaris.api:openMadrasahCourse
      - route: apps/nazar/features/courses/team.ts:57
    walked:
      - e2e: apps/nazar/e2e/open-course.e2e.ts
        check: 'open-course#3'
      - e2e: apps/nazar/e2e/open-course.e2e.ts
        check: 'open-course#4'
      - test: apps/nazar/test/team.spec.ts

  - id: removing-a-hoca-is-said
    need: >-
      Taking a hoca off the list is said (who was taken off), keeps the focus on a control of the form, and a status that said "added"
      does not go on saying it.
    drawn: [removeA, removeB, addedA, addedB]
    missing: none # OPEN-3 (same shape as F-W3-open-3 of nizam)

  - id: give-a-hoca-an-unvan
    need: >-
      Each hoca can carry an unvan in this course from the day it is opened ("Prof. Dr.", "Doç. Dr.", ... or none, the default), written
      before their name wherever the course shows them; it is kept in this course only.
    drawn: [unvanA, unvanB, form]
    built:
      - action: medaris.api:openMadrasahCourse
      - route: apps/nazar/features/courses/components/muderris-picker.tsx:196

  - id: policies-fix-the-boxes
    need: >-
      A medrese policy ("Kapalı ders zorunlu", "Kayıt her zaman onaylı") fixes its box on and off limits in the form, says whose policy
      it is and where to change it, and the API applies the policy whatever the form sends; with no policy the person decides the two
      boxes.
    drawn: [closedBox, approvalBox, lockClosed, lockApproval, lockLink, readingPolicies, a-locked-box-cannot-be-toggled]
    built:
      - action: medaris.api:getMadrasahSettings
      - action: medaris.api:openMadrasahCourse
      - route: apps/nazar/features/courses/components/open-course-form.tsx:244
    walked:
      - e2e: apps/nazar/e2e/open-course.e2e.ts
        check: 'open-course#5'
      - e2e: apps/nazar/e2e/open-course.e2e.ts
        check: 'open-course#6'

  - id: a-withdrawn-kosk-is-explained
    need: >-
      A köşk that took its right back after the page was drawn refuses the course, and the person is told why in words, the page reads
      the köşks again, and what they typed is kept so that they choose another köşk and press again; if it was the only köşk, they are
      told there is none and nothing they typed is thrown away.
    drawn: [opening, form, toastHostingRight, koskRequired, noKosk, koskKubbealti]
    built:
      - action: medaris.api:openMadrasahCourse
      - route: apps/nazar/features/courses/components/open-course-form.tsx:133
    walked:
      - e2e: apps/nazar/e2e/open-course.e2e.ts
        check: 'open-course#7'

  - id: the-last-kosk-leaving-keeps-the-work
    need: >-
      When the köşk that leaves was the only one, the toast does not tell the person to choose another, and the name, the hocas and the
      unvans they typed are not lost with the form.
    drawn: [opening, noKosk, toastHostingRight]
    missing: none # OPEN-6

  - id: a-partial-grant-is-told-the-truth
    need: >-
      A nazır who may open courses but not read the settings is told they cannot see the policies (not that the read failed), and a
      nazır who may only hide courses or change hocas is not led by an enabled button to a page that refuses them.
    drawn: [forbidden, forbiddenAlert, policiesUnknown, readingPolicies]
    missing: none # F-A-8, decision D1; no e2e covers a nazır with a partial grant

  - id: leaving-keeps-the-form
    need: >-
      Leaving the form (Vazgeç, the breadcrumb, the link to the policy settings) does not throw away what was typed without asking, or
      the settings open where the form stays.
    drawn: [cancel, breadcrumbCourses, lockLink, courses_listed, settings_opened]
    missing: none # OPEN-1, decision D2

  - id: naming-oneself-is-explained
    need: >-
      A nazır who adds themselves as a hoca without holding every course code is told that is not allowed, not that something went
      wrong and to try later.
    drawn: [opening, toastGeneric]
    missing: none # OPEN-2

  - id: open-from-the-pano-or-by-address
    need: >-
      "Medrese dersi aç" opens the form from Dersler and from the Pano, and its address opens it for anyone who may open courses; a
      person who may not, or whose medrese this is not, gets the refusal or the 404 in words.
    drawn: [reading, forbidden, not_found, noKosk]
    built:
      - route: apps/nazar/features/courses/components/courses-page.tsx:118
      - route: apps/nazar/features/pano/components/pano-page.tsx:109
      - route: apps/nazar/app/medrese/[medreseId]/dersler/yeni/page.tsx:11
    walked:
      - e2e: apps/nazar/e2e/open-course.e2e.ts
        check: 'open-course#1'
