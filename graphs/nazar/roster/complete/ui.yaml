rules:
  - { id: F-D1-04, rule: "Searching the roster, flipping the sort and pressing Daha fazla göster change the list with no announcement: the 'N talebeden M tanesi gösteriliyor' line is a plain <p>, not a live region, and the empty-search text is only a table cell (roster-table.tsx:239-243, :230-234). Fix: role=status on the line and on the empty cell." }
  - { id: F-D1-05, rule: "After Tamamladı say or Yeniden aç the acted row leaves its table with the refreshed list, so the focused button unmounts and the focus falls to <body>; Daha fazla göster unmounts too when the list is complete (roster-table.tsx:101, :246-252). Fix: move the focus to the table's caption or the next row's button after a decision." }
  - { id: F-D1-20, rule: "No try/catch wraps the server-action call inside startTransition (roster-table.tsx:77-103): when the browser cannot reach Next the rejection escapes, setBusy(null) never runs and the row stays busy; React hands the error to the nearest boundary. Not verified in a browser. Fix: try/catch/finally with a network toast." }
  - { id: F-D1-01, rule: "A failed read draws the retry state with its own h1 ('Talebeler okunamadı') under the page's own h1 'Talebeler', so heading navigation lists two page titles (load-failed.tsx:28 passes no headingLevel). Fix: headingLevel 2 when the state is inside the shell." }
  - { id: ROSCOM-1, rule: "roster-table.tsx:182-183 gives the pressed button `loading` and `disabled` together, although the Button's own contract is 'busy: aria-disabled and aria-busy, never disabled, so focus survives a submit' (libs/ui/src/mds/button.tsx:29): the button the person is on becomes natively disabled the moment it is pressed, and its twin is disabled with it. The Başvurular table does it right (enrolments-tabs.tsx:165-166 and :177-178 disable only the twin). New finding (not in the inventory); not verified in a browser. Fix: `disabled={busy === row.userId && !isThisButton}`." }
  - { id: ROSCOM-2, rule: "The roster read carries the open ban of every talebe (`ban: {id, scope}`, course.controller.ts:562) and nothing in features/enrolments reads it: a barred talebe's row says nothing, and 'Yeniden aç' on a completed barred talebe is drawn and refused by the API with BAN_ACTIVE (403, ban.service.ts:616), which the page words as the generic 'Bir şeyler ters gitti. Biraz sonra yeniden deneyin.' (enrolments.ts:218) and keeps the row, so the person retries in vain. New finding. Fix: show the ban on the row and leave 'Yeniden aç' off it, or word BAN_ACTIVE ('Bu talebe bu dersten yasaklı; yasak kalkmadan yeniden açılamaz')." }
  - { id: ROSCOM-3, rule: "Tamamlayanlar lists 'Kayıt tarihi', the day the talebe joined (listsOf, enrolments.ts:112), because the roster response has no completedAt (RosterEnrollmentResponse extends EnrollmentResponse, which has none; MyEnrollmentResponse has it, course-response.dto.ts:417). A course team cannot see when a course was completed, which the planned icazet record (P-06, MDRS-149) needs. New finding. Fix: add completedAt to the roster response and a 'Tamamlanma tarihi' column." }
  - { id: ROSCOM-4, rule: "A completion changes more than its toast says. setEnrollmentStatus sends no notification (course.service.ts:1762 kicks the invitation sweep only), a seat that is not ENROLLED is not owed an invitation (lesson-invitation.repository.ts:136) and a completed course is left out of Programım (schedule.repository.ts:197), so the talebe's coming celses are cancelled in their calendar and vanish from their schedule while nobody tells them, and the page asks nothing before it does it ('Tamamladı say' has no confirmation) and says only '{name} dersi tamamladı'. New finding; the sweep's effect on a completion is read from the code, not run. Fix: tell the talebe, and say so in the toast (decision D1)." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Tamamladı say' in 'Tamamladı say: {name}', 'Yeniden aç' in 'Yeniden aç: {name}', 'Dersten çıkar' in 'Dersten çıkar: {name}' (WCAG 2.5.3). Holds." }
  - { id: focus-not-set, rule: "No code sets the focus on this page: not on load, and not after a completion or a reopening (F-D1-05). The graph draws no initialFocus and no focus." }
  - { id: buttons-follow-the-code, rule: "A button the reader does not hold the code for is not drawn (rosterActions, enrolments.ts:199-206; the whole actions column is absent when none is allowed), and the API still decides every write; a ders nazırı who holds enrollment.decide only reads the lists with no button. The page does not say why a button is missing." }
