# The screens of nazar.roster.complete: Talebeler of a course (/ders/<id>/talebeler) on its tabs Başvurular, Kayıtlı and Tamamlayanlar,
# with the search, the sort, "Daha fazla göster", the busy rows and the toasts of a completion and a reopening, the page of a reader
# with no button, the refusal and the failed read. Read from apps/nazar/features/enrolments and libs/ui/src/mds; every word is copied
# from libs/i18n/src/locales/tr/nazar.json by a script (it fails on a missing key and compares each value). Two messages are not in
# that file: `Changes.note`, the one authored message of this catalog (no app message says what a completion changes and what follows
# from it: the toast says only "{name} dersi tamamladı"), and `composed.CourseStudents.tabCount`, the number the tab draws after its
# label (libs/ui/src/mds/tabs.tsx:67, formatCount). Where a node says "repeat", the page draws it once per row; the replay finds the
# rows through the binding.
schema: delurio-graph/0
kind: ui
id: nazar.roster.complete
flow: nazar.roster.complete
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }
samples:
  name: Esma Başvuran
  course: Deneme dersi rosCom
  count: "12"
  total: "12"
  shown: "10"

