  reasonHelp: { type: text, component: Text, text: { key: CourseStudents.remove.reasonHelp }, in: [form, formReady, submitting], when: "said == 'none'", source: apps/nazar/features/enrolments/components/remove-dialog.tsx:121 } # says the course team reads the reason; the talebe reads it too (RMV-1); the error replaces it
