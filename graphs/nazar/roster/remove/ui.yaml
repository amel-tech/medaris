# The screens of nazar.roster.remove: Talebeler of a course (/ders/<id>/talebeler) with its Başvurular, Kayıtlı and Erişimi kaldırılanlar
# tabs, the "Dersten çıkar" dialog over it, and the toasts of the answer. Read from apps/nazar/features/enrolments (the page, the tabs,
# the roster table, remove-dialog.tsx, removed-table.tsx) and libs/ui/src/mds (Dialog, Field, Tabs, Table, Button); the words are copied
# from libs/i18n/src/locales/tr/nazar.json by a script (it fails on a missing key and compares each value). Six entries are built in
# code and belong to no i18n file (`composed.CourseStudents.*`, each a data value set in a node):
#   composed.CourseStudents.eyebrow       the course's name above the dialog's title            (remove-dialog.tsx:95)
#   composed.CourseStudents.person        a talebe's name, in a row header                     (roster-table.tsx:122, removed-table.tsx:178)
#   composed.CourseStudents.personEmail   their e-mail                                          (roster-table.tsx:132, removed-table.tsx:181)
#   composed.CourseStudents.removedDay    the day they were taken out (shortDay)                (removed-table.tsx:194)
#   composed.CourseStudents.removedReason the reason as the server kept it                      (removed-table.tsx:202)
#   composed.CourseStudents.removedBy     who took them out                                     (removed-table.tsx:208)
# `changes` is the dialog's own sentence ("{name} adlı talebe {course} dersinden çıkarılacak. Celselere, toplantı bağlantılarına ve ders
# kayıtlarına erişimi kalkar; …"), which tells the person what the removal does; no message was written for this flow. It is silent on
# two things the flow does (RMV-1, RMV-2): the talebe is sent the reason, and nothing brings them back.
# The page behind the dialog is drawn only where the dialog is closed: the dialog is modal, so the page is inert while it is open.
# Not drawn (other flows' or columns this flow never reads): the search box and the sort of the Kayıtlı table, the date joined and the
# progress columns, "Tamamladı say" on the rows of the second list, the Tamamlayanlar tab's panel, "Toplu talebe ekle".
