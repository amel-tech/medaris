edges:
  - { labelledBy: [dialog, dialogTitle] }
  - { triggers: [rowRemove, form] }
  - { triggers: [submit, submitting] }
  - { returnsFocus: [dialog, rowRemove] } # Vazgeç, the close icon or Escape: the row's button is still there and Base UI hands the focus back to it; after a removal the row is gone (F-D1-05); not verified in a browser

rules:
  - { id: F-D1-05, rule: "After 'Dersten çıkar' succeeds the talebe's row leaves its table with the button that opened the dialog, so the focus Base UI gives back has nowhere to be and keyboard focus falls to <body>; no code moves it, and the only word is a toast of 6 seconds that stays on Kayıtlı while the person is told the talebe 'moved to Erişimi kaldırılanlar' (remove-dialog.tsx:63-72, roster-table.tsx:255-263). Fix: after the refresh move the focus to the table caption or the next row's button, or to the Erişimi kaldırılanlar tab, and keep a status line. Not verified in a browser." }
  - { id: F-D1-06, rule: "The submit button is natively disabled while the reason is blank, so the blank-reason error can only be met by leaving the empty field, and it is a `Field.Error` with no live region: nobody is told when it appears, and a disabled button has no stated reason (remove-dialog.tsx:102, :122-126, :137, libs/ui/src/mds/field.tsx:50-53, F-L-12). Fix: keep the button on and, on a send with a blank reason, show the error and move the focus to the field; or give the message role=alert." }
  - { id: F-D1-20, rule: "No try/catch around `removeStudent` inside `startTransition` (remove-dialog.tsx:56-61): the API's own failures are caught in `authenticatedAction`, but a browser that cannot reach Next throws, no toast is shown and the button stays busy; what React does with the rejection is not verified. Fix: try/catch/finally with a network toast (`Files.errors.network` exists)." }
  - { id: RMV-1, rule: "new: the dialog says 'Gerekçe, Erişimi kaldırılanlar sekmesinde ders kadrosuna görünür.' (CourseStudents.remove.reasonHelp) and nothing says the talebe reads it too: tedrisat sends REMOVED_FROM_COURSE with `{ reason }` (apps/tedrisat/src/course/course-notifier.ts:72-85) and tedris draws it as 'Dersten çıkarıldın. Gerekçe: {reason}' (apps/tedris/features/notifications/notification-view.ts:167-169, tedris.json REMOVED_FROM_COURSE.bodyReason). The person who writes a candid note for her colleagues does not know the removed person gets it word for word. Fix: say it in the help line (decision D2), or send the notice without the reason." }
  - { id: RMV-2, rule: "new: both the dialog (CourseStudents.remove.info) and the Erişimi kaldırılanlar tab (CourseStudents.removedNote) say the seat comes back 'ancak ders kadrosu onaylarsa', and no screen does that approval: Başvurular lists PENDING seats only (enrolments.ts:100-117 drops a REVOKED one), 'Toplu talebe ekle' skips a REVOKED seat with 'Ders kadrosu dersten çıkarmış' (apps/tedrisat/src/course/bulk-enrollment.service.ts:214), the removed table has no button (removed-table.tsx:168-210) and nizam's roster gives a REVOKED row no action (apps/nizam/features/applications/present.ts:148-150). Only the API's POST /courses/:id/enrollments/:userId/approve, called by hand, reinstates the talebe (course.service.ts:1627-1668). A removal made by mistake cannot be undone from the product, and the talebe can neither apply nor leave (409). Fix: decision D1. The nizam twin says the opposite to its user: its dialog's own words are 'Kaydı silinir ... Bu bir yasaklama değildir; talebe yeniden başvurabilir.' (libs/i18n/src/locales/tr/nizam.json:502, removeDescription) and the comment above its action (apps/nizam/features/kosks/actions/courses.ts:145) says 'Not a ban: they may apply again', while the API keeps the row as REVOKED and answers a new application with 409: for nizam.courses.roster." }
  - { id: RMV-3, rule: "new: while the removal is sent, 'Vazgeç', the close icon and Escape stay on and do nothing (`if (!open && !pending) onClose()`, remove-dialog.tsx:89-91), and the reason box is `disabled` under the person's hands; a busy control is neither disabled nor marked, and nothing says why a press does nothing. Same as BAN-3 of nazar.bans.ban. Fix: disable them with the rest of the form while `pending`." }
  - { id: RMV-4, rule: "new: the reason box stops taking text at 500 characters (`maxLength={REASON_MAX}`, remove-dialog.tsx:132, bans.ts:334) with no counter and no message, so a long note is cut silently; the API refuses a longer one with VALIDATION_ERROR, which the page words as 'Bir şeyler ters gitti.' (enrolments.ts:218) if it were ever sent. Fix: a counter or a help line that names the limit." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Dersten çıkar' in 'Dersten çıkar: {name}', 'Tamamladı say' in 'Tamamladı say: {name}' (WCAG 2.5.3). Holds. The same words 'Dersten çıkar' are the row button's text, the dialog's name and the submit's, so a test or a voice user has to scope them: the replay finds the submit inside the dialog." }
  - { id: no-default-accept, rule: "The dialog's focus starts in the reason box, not on the button that sends; the scrim does not close it; Escape and 'Vazgeç' do, unless a removal is being sent (RMV-3). A removal is asked for with a reason, not confirmed with a second dialog: the reason is the confirmation." }
  - { id: toast-is-the-only-word, rule: "The result of a removal is said by a toast (a dialog in the 'Bildirimler' live region) that closes after 6 seconds for a success and an info notice, and stays for an error. The Kayıtlı tab itself says nothing: the row is gone and the counts changed. The page does not move to Erişimi kaldırılanlar although the toast says the talebe is there." }
  - { id: forbidden-keeps-the-header, rule: "A person with no roster code meets 'Bu sayfaya izniniz yok' under the page's own title, with no tabs, no heading of its own and no link out; the menu still lists 'Talebeler' for her (nazar.access.dersNazirPages draws the rest)." }
