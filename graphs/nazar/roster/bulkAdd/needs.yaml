# What must exist for a course's team to add several talebe at once by e-mail address (nazar.roster.bulkAdd): the flow's product list
# (LAYOUT.md section 7). Each need is what the product must do, from the flow's story and the planned work in the inventory (planned.md
# P-08, P-18), not from what the page does today. A need that is not met is a gap in graphs/needs.gaps.yaml, which the orchestrator merges;
# this file does not edit it. Read by people for now: no checker runs on this file.
#
# The `replay:` names are the scenarios of binding.yaml, binding.forbidden.yaml and binding.noButton.yaml; NO REPLAY HAS RUN (the first walks
# are a later phase), so none of them is a proof yet. No e2e covers this dialog (nazar.md section 5, part D1-course-b): the evidence of the
# built needs is the unit specs apps/nazar/test/enrolments-page.spec.tsx and enrolments-bulk.spec.ts, which mock the server action.
#
# Gaps of this file, for that merge:
#   missing:   seats-per-gender-at-bulk-add (MDRS-284); the-answer-is-announced-and-the-focus-follows, a-refusal-is-heard-over-the-dialog,
#              the-dialog-holds-still-while-it-sends, a-call-that-fails-is-told, one-box-says-what-it-holds, the-people-added-are-told,
#              adding-by-address-says-who-it-adds-and-who-it-shows (the last six `missing: none`, no issue)
#   unwalked:  none by the definition (code, no e2e and no replay); of a-refusal-keeps-the-dialog-and-the-list the refusals of the realm
#              (directory) and of anything else (failed) have a unit spec and no replay, and of the-addresses-with-no-account-can-be-copied
#              the browser's refusal of the clipboard has a unit spec and no replay: nothing on the local stack can make either happen
#   Gender separation (kontenjan per gender, MDRS-284): applies, this flow gives seats (seats-per-gender-at-bulk-add).
kind: needs
flow: nazar.roster.bulkAdd
status: proposed

needs:
  - id: add-several-talebe-at-once
    need: >-
      The course team adds many people who already have a Medaris account in one step, by typing their e-mail addresses; no approval is
      asked, because the team chose them, a person whose application waits is approved on the way, and nobody already in the course is
      changed. Only whoever may decide applications in the course can do it.
    drawn: [roster, openBulk, form, formReady, sending, answered, dialog, emailsField, submit]
    built:
      - action: medaris.api:bulkEnroll
      - route: apps/nazar/features/enrolments/components/enrolments-tabs.tsx:198
      - route: apps/nazar/features/enrolments/components/bulk-add-dialog.tsx:62
    walked:
      - test: apps/nazar/test/enrolments-page.spec.tsx
      - replay: mixed
      - replay: added

  - id: the-list-is-read-as-typed
    need: >-
      A list is read as people write one: one address a line, or separated by commas or semicolons, white space and capitals ignored,
      each address once; the person sees how many addresses that makes before sending, and a list of more than 500 is refused under the
      field and not sent.
    drawn: [form, formReady, counter, emailsHelp, tooManyError, submit, a-list-is-sent-only-within-the-limit]
    built:
      - route: apps/nazar/features/enrolments/bulk.ts:19
      - route: apps/nazar/features/enrolments/components/bulk-add-dialog.tsx:53
      - action: medaris.api:bulkEnroll
    walked:
      - test: apps/nazar/test/enrolments-bulk.spec.ts
      - test: apps/nazar/test/enrolments-page.spec.tsx
      - replay: mixed
      - replay: many

  - id: every-outcome-is-told
    need: >-
      The answer says, for each outcome that has people in it, how many were added, how many waiting applications were approved, how
      many were already in the course, how many addresses have no account, how many entries are not addresses and how many were
      skipped, and names each skipped address with its reason (barred, taken out by the team, finished the course, changed meanwhile).
    drawn: [answered, outcomesList, lineEnrolled, lineApproved, lineAlready, lineNotFound, lineInvalid, lineSkipped, skippedTitle, skippedLine]
    built:
      - action: medaris.api:bulkEnroll
      - route: apps/nazar/features/enrolments/components/bulk-add-dialog.tsx:165
      - route: apps/nazar/features/enrolments/bulk.ts:29
    walked:
      - test: apps/nazar/test/enrolments-page.spec.tsx
      - test: apps/nazar/test/enrolments-bulk.spec.ts
      - replay: mixed
      - replay: added
      - replay: unmatched
    # a skipped reason other than "Dersi tamamlamış" (barred, revoked, changed) needs a ban, a removed talebe or a race: the unit specs only

  - id: the-addresses-with-no-account-can-be-copied
    need: >-
      The addresses that found no account, and the entries that are not addresses, are given back in one box that can be copied in one
      press, so the team can add them once their accounts exist; when the browser refuses the copy the box is left selected and the
      person is told to copy by hand.
    drawn: [unmatchedField, unmatchedNote, copyButton, toastCopied, toastCopyFailed]
    built:
      - route: apps/nazar/features/enrolments/components/bulk-add-dialog.tsx:80
    walked:
      - test: apps/nazar/test/enrolments-page.spec.tsx
      - replay: mixed
      - replay: unmatched

  - id: a-refusal-keeps-the-dialog-and-the-list
    need: >-
      When the list cannot be taken, the person is told why in words, nothing is enrolled, and the dialog and the typed list stay so that
      they can try again: the course takes no enrolment (a draft or hidden course), the person no longer holds the code, the realm's
      directory cannot be asked, or anything else.
    drawn: [sending, toastForbidden, toastClosed, toastDirectory, toastFailed, a-refusal-shows-no-answer]
    built:
      - action: medaris.api:bulkEnroll
      - route: apps/nazar/features/enrolments/bulk.ts:69
    walked:
      - test: apps/nazar/test/enrolments-page.spec.tsx
      - replay: closed
      - replay: forbidden
    # directory and failed are drawn and not bound: nothing on the local stack can make the realm fail

  - id: only-the-holder-of-the-code-is-offered-the-form
    need: >-
      "Toplu talebe ekle" is offered to a person who may decide applications in the course, and to nobody who only reads the roster or
      completes or removes talebe; the API still decides every send.
    drawn: [openBulk, only-a-holder-of-the-code-opens-the-form]
    built:
      - route: apps/nazar/features/enrolments/components/enrolments-page.tsx:101
      - action: medaris.api:bulkEnroll
    walked:
      - test: apps/nazar/test/enrolments-page.spec.tsx
      - replay: noButton
      - replay: forbidden

  - id: the-roster-reads-again-when-the-answer-is-closed
    need: >-
      Once the answer is closed the roster shows the people who were added, in its tab counts and its tables, without a reload.
    drawn: [answered, refreshed, tabApplications, tabEnrolled]
    built:
      - route: apps/nazar/features/enrolments/components/enrolments-tabs.tsx:305
    walked:
      - test: apps/nazar/test/enrolments-page.spec.tsx
      - replay: mixed

  - id: the-answer-is-announced-and-the-focus-follows
    need: >-
      When the answer replaces the form, a screen-reader or keyboard user is told it has arrived and the focus lands on something in it
      (its first line or the "Kapat" button); the two buttons that close it are not both called "Kapat"; the address counter does not
      speak on every keystroke (F-D1-07).
    drawn: [answered, outcomesList, counter, closeIconAnswer, closeButton]
    missing: none # no issue: bulk-add-dialog.tsx:68-69, 106, 124-125, 151-156

  - id: a-refusal-is-heard-over-the-dialog
    need: >-
      A refusal, and the notice of a copy, reach a screen-reader user while the modal dialog is open: they are said inside the dialog or in
      a region the dialog does not hide (BULK-1).
    drawn: [toastForbidden, toastClosed, toastDirectory, toastFailed, toastCopied, toastCopyFailed, toastClose]
    missing: none # no issue: FloatingFocusManager marks the Toaster's portal aria-hidden while a modal dialog is open (not verified in a browser)

  - id: the-dialog-holds-still-while-it-sends
    need: >-
      While the list is on its way, "Vazgeç", the close icon and Escape do not look live and do nothing: they are disabled with the rest of
      the form, so nobody presses a close that is ignored (BULK-2).
    drawn: [sending, cancel, closeIcon, submit, busy]
    missing: none # no issue: bulk-add-dialog.tsx:56-60

  - id: a-call-that-fails-is-told
    need: >-
      When the page cannot reach the server at all (the network), the button stops being busy, the dialog can be closed and the person is
      told to try again (F-D1-20).
    drawn: [sending]
    missing: none # no issue: bulk-add-dialog.tsx:65-77 has no try/catch

  - id: one-box-says-what-it-holds
    need: >-
      The box of addresses to copy says what is in it: addresses with no Medaris account and entries that are not addresses at all, each
      told for what it is (BULK-3).
    drawn: [unmatchedField, unmatchedNote, lineNotFound, lineInvalid]
    missing: none # no issue: bulk.ts:49-52 joins both, and the field's help says "hesap bulunamadı" for all

  - id: the-people-added-are-told
    need: >-
      A person put in a course by its team is told so in a notice of their own, as one whose application is approved is; today only the
      calendar invitations of the celses ahead reach them (BULK-4, decision D1).
    drawn: [answered, lineEnrolled, lineApproved]
    missing: none # no issue: apps/tedrisat/src/course/bulk-enrollment.service.ts:98-116 sends ENROLLMENT_APPROVED to approved people only

  - id: adding-by-address-says-who-it-adds-and-who-it-shows
    need: >-
      Putting a person in a course by their address is decided with the person in mind: whether they must accept or at least be told,
      and whether the answer may tell any course team which addresses have an account (BULK-5, decision D2; related MDRS-203).
    drawn: [formReady, answered, lineNotFound, unmatchedField]
    missing: none # no issue: a decision of the owner, bulk-enrollment.service.ts:76-100

  - id: seats-per-gender-at-bulk-add
    need: >-
      Where a seat is counted, the kontenjan is two counts, one per gender, and a seat is given in the order of application; a list added
      in bulk gives seats too, so it follows the same rule and says which people it could not seat for want of a place (MDRS-284, per
      celse and weekly; no kontenjan rule exists in the code, and the bulk route has no limit but the 500 addresses of a list).
    drawn: [answered, lineEnrolled, lineApproved]
    missing: MDRS-284
