# The screens of nazar.roster.bulkAdd: a course's Talebeler page (/ders/<id>/talebeler) with the "Toplu talebe ekle" button, the dialog it opens
# (the list of addresses, then the answer in the same dialog) and the toasts of a copy and of a refusal. Read from
# apps/nazar/features/enrolments/components/{enrolments-page,enrolments-tabs,bulk-add-dialog}.tsx, features/enrolments/bulk.ts and the kit's
# Dialog, Field, Textarea, Button, Tabs and Toast (libs/ui/src/mds); the words are copied from libs/i18n/src/locales/tr/nazar.json
# (namespaces CourseStudents, Problems, Shell), letter for letter.
#
# `changes` is the dialog's own intro ("Medaris hesabı olan kişileri bu derse talebe olarak ekleyin. Onay beklemeden kaydolurlar; bekleyen
# başvuruları da onaylanır."), which tells the person what the list does; no message was authored for this flow. It does not say that the
# people added are not told (BULK-4, decision D1).
#
# Four entries are in no i18n file (`composed.*`), each a value the code puts on the screen:
#   composed.BulkAdd.eyebrow       the course's name above the dialog's title (bulk-add-dialog.tsx:103)
#   composed.BulkAdd.skippedLine   "{address}: {reason}", the address, ": " and the message of the skip reason (bulk-add-dialog.tsx:214-219);
#                                  the reasons are CourseStudents.bulk.reasons.*, and `reason` is a sample (the walk's skipped talebe completed
#                                  the course: "Dersi tamamlamış")
#   composed.Button.loading        "Yükleniyor", the busy button's hidden status, the kit's default (libs/ui/src/mds/button.tsx:62, :114)
#   composed.Toast.close           the toast's close button, a literal of the kit (libs/ui/src/mds/toast.tsx:95-97; F-L-6)
#
# The page behind the dialog is drawn only where the dialog is closed: the dialog is modal, so the page is inert while it is open.
# `samples` give the one value each placeholder shows on the page; a number that changes with the list (the counter, the limit message) is
# found by the binding with a pattern instead.
schema: delurio-graph/0
kind: ui
id: nazar.roster.bulkAdd
flow: nazar.roster.bulkAdd
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: CourseStudents.bulk.intro }
samples:
  course: Deneme dersi bulkadd
  count: "1"
  max: "500"
  email: ornek.talebe@example.test
  reason: Dersi tamamlamış

