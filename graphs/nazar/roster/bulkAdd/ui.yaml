edges:
  - { labelledBy: [dialog, dialogTitle] }
  - { triggers: [openBulk, form] }
  - { triggers: [submit, sending] }
  - { triggers: [copyButton, answered] }
  - { returnsFocus: [dialog, openBulk] } # Base UI gives the focus back to the element that was focused when it opened: the page's "Toplu talebe ekle", which the refresh keeps; the dialog is unmounted by its parent while still `open`, so this is not verified in a browser

rules:
  - { id: F-D1-07, rule: "The answer to 'Ekle' replaces the form in the same dialog with no focus move and no live region: the submit button, which had the focus, unmounts, no code moves it, and the outcome list is silent for a screen reader (bulk-add-dialog.tsx:68-69, 106, 124-125). The address counter is `aria-live=polite` and speaks on every keystroke and paste (:151-156). The header's close icon and the footer's button are both named 'Kapat' in the answer. Fix: wrap the answer in role=status and focus its first line or the footer button; drop aria-live from the counter or debounce it; name the footer button differently." }
  - { id: BULK-1, rule: "new, read from the code and not verified in a browser: the dialog is modal and Base UI marks everything outside its portal aria-hidden (@base-ui/react 1.8.0, floating-ui-react/components/FloatingFocusManager.js:345, `markOthers` with `ariaHidden: modal`); the Toaster's region 'Bildirimler' is a portal of its own (libs/ui/src/mds/toast.tsx:125-131), outside the dialog's, so the toast of a refusal ('Talebeler eklenemedi') and the copy toasts are raised inside an aria-hidden region. A screen-reader user may hear nothing of a refusal until the dialog is closed, and the toast's own close button is outside the dialog's focus trap. The same holds for every dialog of the app that raises a toast while open (the ban dialog, the remove dialog). Fix: keep the toast viewport out of the modal's hidden set (a Base UI `ignoreElement`/keep marker), or say a refusal in the dialog itself with a role=alert." }
  - { id: BULK-2, rule: "new: while the list is sent, 'Vazgeç', the close icon and Escape stay on and do nothing (`if (pending) return`, bulk-add-dialog.tsx:56-60), and nothing marks them; the box is disabled and the button is busy (aria-disabled), whose hidden status says 'Yükleniyor' from the kit's default (libs/ui/src/mds/button.tsx:62), not from the catalog (F-D1-24). The twin of BAN-3 (nazar.bans.ban) and F-W3-open-2 (nizam). Fix: disable the dialog's close controls with the rest of the form while `pending`." }
  - { id: BULK-3, rule: "new: `unmatched(result)` joins the addresses no account was found for and the entries that are not addresses (bulk.ts:49-52) in one read-only box under 'Bu adreslerle Medaris hesabı bulunamadı. Hesap açıldıktan sonra yeniden ekleyebilirsiniz.' (the field's help); a mistyped entry such as 'adres-degil' is therefore told to have no account and to be added again after one is made. The lines above tell the two apart ('1 adresle hesap bulunamadı', '1 adres e-posta adresi değil'); the box does not. Fix: a note that covers both ('Bunlar eklenemedi: ...') or two boxes." }
  - { id: BULK-4, rule: "new, the API: bulkEnroll gives a person with no seat an ENROLLED row and tells them nothing; only a waiting application it approves sends ENROLLMENT_APPROVED (bulk-enrollment.service.ts:98-110, :228-250). The people added learn of it from the calendar invitation mail of each celse still ahead (`invitations.kick()` at :116), or by finding the course in Derslerim; a course with no celse ahead tells them nothing. The dialog's own intro says nothing of it. Decision D1." }
  - { id: BULK-5, rule: "new, the API: every address is looked up in the realm and the answer says which have an account ('hesap bulunamadı'), to anyone who holds enrollment.decide in any course, 500 addresses a time, and a person found is enrolled with no question to them (bulk-enrollment.service.ts:76-100). The audit row keeps the counts and the ids enrolled or approved, not the addresses searched. A person added can only leave afterwards. Decision D2; related MDRS-203." }
  - { id: F-D1-03, rule: "No `required` on the box and no asterisk on its label: by design here, because the button simply stays off with nothing typed. The family finding is about the Field asterisk that is aria-hidden while the control carries no required." }
  - { id: F-D1-16, rule: "The 'En fazla 500 adres ...' message is a Field error (no role=alert, libs/ui/src/mds/field.tsx:50-53): it is tied to the box by aria-describedby and announced by nothing when it appears; the counter beside it, a polite live region, speaks the number instead (F-D1-07). Fix: give the error role=alert, or let the counter carry it." }
  - { id: F-D1-06, rule: "'Ekle' is natively disabled while the box is empty: nothing says why (the family of F-D1-06). The help line under the box says what to type." }
  - { id: F-D1-20, rule: "No try/catch around the server action in `startTransition` (bulk-add-dialog.tsx:65-66): if the browser cannot reach the Next server, the rejection escapes, the button stays busy and the dialog cannot be closed (`pending` stays true). Not verified." }
  - { id: F-D1-24, rule: "'Ekle' is busy with no `loadingLabel`, so its hidden status says 'Yükleniyor' from the kit's hard-coded default (bulk-add-dialog.tsx:113-119). The dialog does pass its own `closeLabel` ('Kapat' from the catalog); the toast's close button does not (F-L-6)." }
  - { id: F-L-6, rule: "The toast's close button is named 'Kapat' from a literal in libs/ui/src/mds/toast.tsx:97, outside the catalog, in every language. It is the only way to dismiss an error or warning toast." }
  - { id: focus-not-set, rule: "The page sets no focus of its own on load or after a refresh (nothing in features/enrolments does); the only focus the code names is the dialog's `initialFocus` on the box before an answer. After the answer the focus is on whatever falls to the dialog's panel when the submit button unmounts, which the graph does not say (F-D1-07)." }
  - { id: no-default-accept, rule: "No node has initialFocus on the button that sends: the dialog starts in the box. The scrim does not close the dialog (a form dialog); Escape, 'Vazgeç' and the close icon do, unless the list is being sent (BULK-2)." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Toplu talebe ekle', 'Ekle', 'Vazgeç', 'Kopyala' and 'Kapat' are all their own names. The dialog's title and its opener have one name, so a test or a voice user has to scope them: the replay finds the buttons inside the dialog." }
  - { id: F-B-12, rule: "Dialog wraps the whole body in Base UI's Dialog.Description (libs/ui/src/mds/dialog.tsx:103-112), so a screen reader may read the intro, the box and its help as the dialog's description when it opens; the same family as F-UI-W1-1 (nizam)." }
  - { id: skipped-reasons-not-drawn, rule: "A skipped address is told with one of five reasons (bulk.ts:55-66): 'Bu derse girişi yasaklı' (barred), 'Ders kadrosu dersten çıkarmış' (revoked), 'Dersi tamamlamış' (COMPLETED), 'Kaydı bu sırada değişti; yeniden deneyin' (changed) and 'Eklenmedi' (any other status). This graph draws 'Dersi tamamlamış' alone: the others need a ban, a removed talebe or a race, and differ only in their words (apps/nazar/test/enrolments-bulk.spec.ts)." }
