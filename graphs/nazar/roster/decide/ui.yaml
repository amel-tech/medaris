edges:
  - { labelledBy: [rejectDialog, rejectTitle] }
  - { labelledBy: [failedSection, failedTitle] }
  - { triggers: [approve, approving] }
  - { triggers: [reject, confirmReject] }
  - { triggers: [rejectConfirm, rejecting] }
  - { triggers: [failedRetry, opened] }
  - { returnsFocus: [rejectDialog, reject] } # Vazgeç, Esc or the close icon: the row's Reddet is still there; not verified in the browser

rules:
  - { id: focus-not-set, rule: "The page sets no initial focus on load (no autoFocus and no .focus() in features/enrolments outside the dialogs), and no code moves the focus after a decision: a keyboard user starts at the top of the document. The graph draws no `initialFocus` and no `focus` for the page." }
  - { id: F-D1-05, rule: "After Onayla, or after Reddet and its confirmation, the pressed row leaves (the `decided` set, then router.refresh) and the button with it, so the focus falls to <body>; the reject dialog's return target is the same removed row (where Base UI puts it is not verified). The only word is a toast of six seconds, and when the last row goes the table's empty cell is no live region. Fix: after a decision move focus to the table's caption or the next row's button, and keep a status line (enrolments-tabs.tsx:103-106)." }
  - { id: F-D1-20, rule: "No try/catch wraps the two server-action calls in decide() (enrolments-tabs.tsx:77-80): when the call itself fails (the browser cannot reach Next), the rejection escapes the callback, setBusy(null) is never reached, the row's button stays busy and no toast is shown. Sorular and Değerlendirme do catch. Not verified in a browser. Fix: try/catch/finally, and a toast from Files.errors.network." }
  - { id: F-D1-04, rule: "Does not apply to this tab: the Başvurular table has no search, sort or paging (a fixed newest-first list, enrolments.ts:119-121). The finding (the roster's search and the 'N talebeden M tanesi gösteriliyor' line are silent) belongs to Kayıtlı and Tamamlayanlar, nazar.roster.complete." }
  - { id: F-D1-29, rule: "(Also F-L-20.) 'Talebeler' carries no `requires` in the course menu (nav.ts:109), so a ders nazırı who holds none of the page's codes is offered the page and then refused with 'Bu sayfaya izniniz yok' (forbidden state); Ödevler, Değerlendirme and Ders destesi are left out for the same person. Fix: extend `requires` to an any-of list (PAGE_CODES.students)." }
  - { id: F-D1-01, rule: "A failed read draws LoadFailed with `shell`, whose SystemState defaults to headingLevel 1 (system-state.tsx:24; load-failed.tsx:28-43 passes none), under the page's own <h1>: two <h1> while a read has failed. Read from the code, not seen (nothing in the stack makes a read fail). Fix: LoadFailed passes headingLevel={2} when `shell`." }
  - { id: ROSTER-1, rule: "New finding. The note over the table reads the course's own `requiresApproval` (enrolments-page.tsx:97-99, from GET /courses/:id) and says 'Bu ders onay istemiyor; talebeler başvurur başvurmaz kaydolur.' when it is false. The API makes an application wait also when the köşk is unlisted or private, when the köşk's always-approve policy or the platform's ALWAYS_REQUIRE_APPROVAL is on, and when the medrese's policy is (course.service.ts:1544-1560), and none of those is in the course read. So a table can hold waiting rows under a sentence that says nobody waits. tedris.course.apply has the same blindness on the card (CRS-APPLY-1). Fix: say 'asks' when the list holds a waiting row, or return the effective rule from GET /courses/:id." }
  - { id: ROSTER-2, rule: "New finding. GET /courses/:id/enrollments returns each row's open ban ({id, scope}, RosterEnrollmentResponse.ban), and listsOf (enrolments.ts:88-123) drops it: a barred talebe's application is listed like any other with Onayla live. Pressing it answers 403 BAN_ACTIVE, which decisionErrorKey (pano.ts:265-275) does not know, so the toast says 'Bir şeyler ters gitti. Biraz sonra yeniden deneyin.' to a person for whom trying again changes nothing until the ban is lifted. The Pano's list does the same. Fix: show the ban on the row and keep Onayla off it, or give BAN_ACTIVE its own sentence." }
  - { id: ROSTER-3, rule: "New finding, from the code and not seen. `busy` is one value for the whole table (enrolments-tabs.tsx:67-69, 76, 107): a second press while a first call runs replaces it, so the first row's busy mark is dropped while its call still runs, and when the first call returns setBusy(null) clears the second row's mark while its call still runs. A third press on that row can send a second call; for Reddet the second answers ENROLLMENT_NOT_FOUND and the toast says 'Bu başvuru artık yok'. Fix: keep a set of busy rows, as `decided` is." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Onayla' in 'Onayla: {name}', 'Reddet' in 'Reddet: {name}' (WCAG 2.5.3). Holds." }
  - { id: confirm-before-rejecting, rule: "Reddet asks first, in an alertdialog whose focus starts on 'Vazgeç'; Onayla does not ask, because an approval gives a seat and the note above the table says what it does. A rejection takes no reason although the API would carry one (decision D2)." }
  - { id: toast-is-the-only-word, rule: "The result of a decision is said by a toast (a dialog in the 'Bildirimler' live region): it closes after 6 seconds for a success and an info notice, and stays for an error. Nothing on the page itself says what was decided." }
  - { id: F-B-13, rule: "The refusal keeps the page's <title> and <h1> 'Talebeler' and its subtitle, which names the course and says 'başvurularını karara bağlayın' to someone who may do none of it; then a neutral Alert (role=status, page-problem.tsx:23-28) with a title and one sentence: no heading, no link out. The same pattern as the medrese pages (inventory F-B-13), here on the course's Talebeler. Fix: render the refusal as an <h2> with a link to the first page the person may open, and a refusal-specific title." }
