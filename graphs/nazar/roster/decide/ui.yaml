# The screens of nazar.roster.decide: a course's Talebeler (/ders/<id>/talebeler) at its first tab, Başvurular, with the reject
# confirmation, the toasts of a decision, the refusal and the retry state. Read from apps/nazar/features/enrolments (the page, the
# tabs) and features/pano (the two actions and the sentences it borrows); the words are copied from
# libs/i18n/src/locales/tr/nazar.json. Where a node says "repeat", the page draws it once per row of that list; the replay finds the
# rows through the binding. The cells of a row (the talebe's name, e-mail and the day) are data, not messages, and are not drawn.
# The three other tabs are drawn only as tabs: their panels are nazar.roster.complete and nazar.roster.remove.
schema: delurio-graph/0
kind: ui
id: nazar.roster.decide
flow: nazar.roster.decide
status: captured
catalog: catalog/tr.json
locales: [tr]
changes: { key: CourseStudents.applicationsNote } # the app's own sentence on what a decision does (the note over the table); no message is authored here
samples:
  name: Betül Başvuran
  course: Deneme dersi rosMain
  count: "3"

# The page sets no focus of its own on load and none after a decision (F-D1-05; see the `focus-not-set` rule), so there is no
# `initialFocus` on the page and no `focus` here: the graph says nothing of what the code does not say.
