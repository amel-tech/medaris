# nazar.roster.decide: the newest applicant is barred from the course behind the page's back, so "Onayla" is answered with 403
# BAN_ACTIVE and the toast says "Bir şeyler ters gitti. Biraz sonra yeniden deneyin." (FAIL.barred, ROSTER-2). The page lists the
# row like any other: the roster read carries the ban and the page ignores it.
#   node apps/engine/src/cli.ts replay graphs/nazar/roster/decide --bind graphs/nazar/roster/decide/binding.barred.yaml --cover transitions --out <dir>
# NOT RUN: written without a replay. Every behaviour below is from the code, none seen in a browser.
#
# How the answer is made: BAN_PLACED is no node's, so the binding gives it: the müderris bars applicantE (the newest row, the one the
# walk presses) from the course through the API (POST /courses/:id/bans, scope COURSE). A ban row is a record that outlives its course
# and no route deletes one, so `setup` and `teardown` delete the rows this walk made by their reason (SQL, the one write here with no
# API), and the notifications COURSE_BAN_PLACED that went to the köşk's nazım and the Medaris nazımı. The audit row ban.create stays.
schema: delurio-graph/0
kind: binding
extends: ./locators.binding.yaml
flow: nazar.roster.decide

events:
  BAN_PLACED:
    - run: [node, helpers/api.mjs, muderris, POST, '/courses/{course}/bans', '{"userId":"{secret.E2E_APPLICANT_E_SUB}","scope":"COURSE","reason":"Deneme yasağı rosBarred"}']
      expect: '"scope":"COURSE"'

scenarios:
  barred:
    given: { approval: needed, mayDecide: may, note: asks }
    as: muderris
    open: '{nazar}/ders/{rosBarred.course}'
    enter: { nav: ../../nav, bind: ../../nav/binding.yaml, entry: 'frame:ders->dersStudents' }
    vars: { course: '{rosBarred.course}' }
    setup:
      # a crashed walk's ban, found by its reason, not by the old course (whose file may be missing)
      - run: [node, helpers/sql.mjs, "delete from bans where reason = 'Deneme yasağı rosBarred'"]
        expect: '"rows":'
      - run: [node, helpers/course.mjs, make, rosBarred, --approval, --weeks, '1', --lessons, '1', --talebe, applicantC, applicantD, applicantE]
        expect: '"APPLICANT_E":"PENDING"'
    teardown:
      # the ban goes first, so that applicantE is no longer barred when the course's remove has the talebe leave
      - run: [node, helpers/sql.mjs, "delete from bans where reason = 'Deneme yasağı rosBarred'"]
        expect: '"rows":'
      - run: [node, helpers/sql.mjs, "delete from notifications where type = 'COURSE_BAN_PLACED' and params->>'courseTitle' = 'Deneme dersi rosBarred'"]
        expect: '"rows":'
      - run: [node, helpers/course.mjs, remove, rosBarred]
        expect: 'course remove rosBarred'
