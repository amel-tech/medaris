entries:
  # a menu entry that carries a number is named with it and its hidden label ("Dersler 2 derste bekleyen başvuru")
  frame:medrese->bildirimler: { role: link, name: '/^Bildirimler/' }
  frame:ders->bildirimler: { role: link, name: '/^Bildirimler/' }
  frame:medrese->medreseCourses: { role: link, name: '/^Dersler/' }
  frame:ders->dersSessions: { role: link, name: '/^Celseler/' }
  frame:ders->dersStudents: { role: link, name: '/^Talebeler/' }
  # the person row is a link with the name, the roles and a hidden ", ayarlar"
  frame:medrese->hesap: { css: 'a.mds-nav-user' }
  frame:ders->hesap: { css: 'a.mds-nav-user' }
  # the picker is a menu only for a person with two or more scopes; for the others it is a card that cannot be opened,
  # and an absence inside a menu that does not open would wait out the timeout on every page
  frame:medrese->medresePano picker: { skip: 'a menu only with two or more scopes; the walk binds no account with a medrese and a course, and a card for the other personas cannot be opened' }
  frame:medrese->dersOverview picker: { skip: 'a menu only with two or more scopes; the walk binds no account with a medrese and a course, and a card for the other personas cannot be opened' }
  frame:ders->medresePano picker: { skip: 'a menu only with two or more scopes; the walk binds no account with a medrese and a course, and a card for the other personas cannot be opened' }
  frame:ders->dersOverview picker: { skip: 'a menu only with two or more scopes: the hoca (three courses) is the one persona with a menu, but the other course personas hold one scope and have a card, which cannot be opened to check an absence' }
  # links whose label is not the whole accessible name
  medreseSettings->tedrisMadrasah: { role: link, name: '/^Medrese sayfasını gör/' }
  dersSettings->tedrisCourse: { role: link, name: '/^Tanıtım sayfasını gör/' }
  dersOverview->tedrisCourse: { role: link, name: '/^Tedris’te aç/' }
  dersDeckOne->dersDeck: { role: link, name: '/Ders desteleri$/' }
  # a course in the Dersler list: its name is the link
  medreseCourses->dersOverview: { role: link, name: Bina ve İzhar Şerhi }
  # the box of the next session, drawn while a live session is ahead (the seed's course runs to December)
  dersOverview->dersSessions CourseOverview.boxes.nextSession: { role: link, name: Sıradaki celse }
  # entries that need data the stack does not seed, or that name an item among several
  dersOverview->dersStudents: { skip: 'a box drawn only while an application waits; the course "Bina ve İzhar Şerhi" takes talebe without approval, so none waits' }
  dersOverview->dersHomework: { skip: 'a box drawn only while a hand-in awaits review; the stack seeds no submission' }
  dersOverview->dersSessions CourseOverview.boxes.withoutAccess: { skip: 'a box drawn only while a session has no way in; every seeded session has a meeting link' }
  medresePano->dersSessions: { skip: 'one "Düzenle: <title>" link per session row; several match' }
  medresePano->dersOverview: { skip: 'the card of a course the person holds a seat in; the başmüderris of the stack holds none' }
  medreseCoursesYeni->medreseSettings: { skip: 'drawn only while a policy locks a box of the form; the stack sets no policy' }
  dersDeck->dersDeckOne: { skip: 'the stack seeds no deck' }
  bildirimler->tedrisTarget: { skip: 'the stack seeds no notification for these accounts' }
  # the buttons that sign out are never followed; the link back from the confirmation page is
  hesap->realmSignIn: { follow: false }
  erisimYok->realmSignIn: { follow: false }
  signOut->realmSignIn: { follow: false }
