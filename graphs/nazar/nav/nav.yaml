notModeled:
  - "The 404 document (app/not-found.tsx: \"Sayfa bulunamadı\", with the link \"Ana sayfaya dön\" to /), the error and global-error documents, the root loading skeleton and the retry state \"Görevleriniz okunamadı\": states a page falls into, not pages a person goes to; nazar.shell.errorStates draws them"
  - "What a person with no seat meets on a scoped address: a redirect to /erisim-yok when they hold no scope at all, the 404 page when they hold others (portal-layout.tsx:107-108). A page that refuses is drawn here as staying at its address, with its words in `refusal`"
  - "The phone bar: the menu button and its sheet hold the same menu, the picker and the person row, and the bell is a second link to Bildirimler with the unread count in its name and no visible number; the sheet has no \"Çıkış yap\""
  - "The remembered scope (cookie nazar-scope): a person with several scopes lands in the last one used; here every persona has the default landing, and Hesap and Bildirimler draw the menu of that landing"
  - "A course opened by address: a medrese's başmüderris and nazırs open its courses, and the başnazım any medrese or course, as that scope for that page only (features/shell/opened-scope.ts); only the Dersler list and the Pano's session rows link to them, so the başnazım reaches nothing by a click"
  - "The page's own controls (filters, tabs, dialogs, forms) and the links to files (/api/files/*, /api/decks/sample): the flows of graphs/nazar draw them"
  - "The numbers on menu entries (unread, courses with applications, sessions without access, applications): a count that cannot be read is left out, never an error"
  - "A passive scope (the medrese has no başmüderris): it closes the content codes for everyone but the başnazım; the persona facts do not vary with it"
  - "The language: nazar is Turkish only (lib/i18n/locale.ts:12); there is no switch"
