# What must exist for the başmüderris of a medrese to read and change its settings: the flow's product list (LAYOUT.md section 7). Each
# need is what the product must do, from the flow's story and the planned work in the inventory (planned.md), not from what the page does
# today; the known gaps go to graphs/needs.gaps.yaml, which the orchestrator merges. Read by people for now: no checker runs on this file yet.
#
# Missing (no code): no-public-recordings-is-enforced (none), leaving-a-changed-form-warns (none), focus-stays-usable-after-vazgec-and-save (none),
#   a-refused-courses-read-is-told-as-a-refusal (none), admission-rules (MDRS-138).
# Unwalked (code, and neither an e2e nor a replay that passed): refusals-keep-the-draft-and-are-told (unit tests only) and
#   the-two-working-policies-reach-courses (nothing walks the medrese's own flags; the platform's approval lock has an e2e of its own).
# Partly walked: a-wrong-name-is-refused-under-its-field (the e2e walks the blank name; the short name, the long name and the long description
#   have unit tests only). No replay has passed yet, so none is named under `walked`.
kind: needs
flow: nazar.settings.edit
status: proposed

needs:
  - id: read-the-settings
    need: >-
      The başmüderris reads, on one page, what her medrese holds: its name and description, the three policies (all off until the first
      save), who saved last and when, the four levels a policy must pass before a permission is used, and the courses the policies apply to
      (published and draft, never a hidden one).
    drawn: [clean, nameField, descriptionField, policyClosed, policyApproval, policyRecordings, lastChange, tiersList, tierMedrese, thisPage, courseList, coursePublished, courseDraft, coursesEmpty, coursesLink]
    built:
      - action: medaris.api:getMadrasahSettings
      - action: medaris.api:listMadrasahCourses
      - route: apps/nazar/features/settings/components/settings-page.tsx:57
    walked:
      - e2e: apps/nazar/e2e/settings.e2e.ts
        check: 'settings#1'
      - test: apps/nazar/test/settings-page.spec.tsx

  - id: change-and-take-back
    need: >-
      She changes a value and sees that something differs (the two buttons turn on); one press of Vazgeç puts everything back to the last save,
      and nothing is sent until she presses Kaydet.
    drawn: [clean, dirty, reverting, cancel, submit, policyClosed]
    built:
      - route: apps/nazar/features/settings/components/settings-form.tsx:61
      - route: apps/nazar/features/settings/components/settings-form.tsx:96
    walked:
      - e2e: apps/nazar/e2e/settings.e2e.ts
        check: 'settings#2'
      - test: apps/nazar/test/settings-form.spec.tsx

  - id: save-and-see-it-kept
    need: >-
      She saves the name, the description and the policies in one press; only what differs is sent, the save is audited, a toast says so, the
      line "Son değişiklik" moves to today and her name, the sidebar carries the new medrese name, and everything is still there after a reload.
      An emptied description clears it and a policy switched off leaves the others as they were.
    drawn: [saving, saved, toastSaved, lastChange, scopeNameSaved, tierMedreseSaved, policyClosed, policyApproval]
    built:
      - action: medaris.api:updateMadrasahSettings
      - route: apps/nazar/features/settings/components/settings-form.tsx:77
      - route: apps/nazar/features/settings/actions.ts:16
    walked:
      - e2e: apps/nazar/e2e/settings.e2e.ts
        check: 'settings#4'
      - e2e: apps/nazar/e2e/settings.e2e.ts
        check: 'settings#5'
      - test: apps/nazar/test/settings-form.spec.tsx

  - id: a-wrong-name-is-refused-under-its-field
    need: >-
      A name that is blank, one character or over 120 characters, and a description over 1000, are refused under their field before anything is
      sent, with the focus moved to the field, and typing it right takes the message away; nothing is saved and no audit row is written.
    drawn: [refused, refusedDescription, nameRequired, nameShort, nameLong, descriptionLong, nameInvalid, descriptionInvalid]
    built:
      - route: apps/nazar/features/settings/settings.ts:66
      - route: apps/nazar/features/settings/components/settings-form.tsx:68
    walked:
      - e2e: apps/nazar/e2e/settings.e2e.ts
        check: 'settings#3'
      - test: apps/nazar/test/settings-form.spec.tsx
      - test: apps/nazar/test/settings.spec.ts

  - id: refusals-keep-the-draft-and-are-told
    need: >-
      When the server refuses the save (the seat was taken meanwhile, the medrese is gone, the body is wrong) a toast that stays says it in the
      page's own words, and the form keeps what she typed so that she can try again.
    drawn: [saving, dirty, toastInvalid, toastForbidden, toastFailed]
    built:
      - route: apps/nazar/features/settings/settings.ts:107
      - route: apps/nazar/features/settings/components/settings-form.tsx:86
    walked:
      - test: apps/nazar/test/settings-form.spec.tsx

  - id: see-the-public-page
    need: >-
      From the settings she can open her medrese's public page, in a new tab, and from the courses card go to Dersler.
    drawn: [viewPage, coursesLink, courses_opened]
    built:
      - route: apps/nazar/features/settings/components/settings-page.tsx:83
      - route: apps/nazar/features/settings/components/settings-page.tsx:190
    walked:
      - e2e: apps/nazar/e2e/settings.e2e.ts
        check: 'settings#1'

  - id: a-nazir-with-no-grant-is-told
    need: >-
      A medrese nazır the API does not let read the settings meets a notice where the form would be and no Kaydet; the form is the başmüderris's
      (and of a nazır given madrasah.settings_edit).
    drawn: [forbidden, forbiddenTitle, forbiddenAlert]
    built:
      - action: medaris.api:getMadrasahSettings
      - route: apps/nazar/features/settings/components/settings-page.tsx:99
    walked:
      - e2e: apps/nazar/e2e/settings.e2e.ts
        check: 'settings#6'
      - test: apps/nazar/test/settings-page.spec.tsx

  - id: the-two-working-policies-reach-courses
    need: >-
      "Kayıt her zaman onaylı" makes every new enrolment in the medrese's courses wait for approval from the moment it is saved, and "Kapalı ders
      zorunlu" makes a course the medrese opens closed and refuses a save that opens it again.
    drawn: [policyClosed, policyApproval, closedHelp, approvalHelp]
    built:
      - action: medaris.api:updateMadrasahSettings
      - route: apps/tedrisat/src/course/course.service.ts:995
    walked: []

  - id: no-public-recordings-is-enforced
    need: >-
      "Ders kayıtları herkese açılamaz" does what its help line says: while it is on, no recording of the medrese's courses can be made public or
      uploaded to YouTube. Today it is saved and audited and nothing reads it (policy-no-public-recordings-inert; decision D1).
    drawn: [policyRecordings, recordingsHelp]
    missing: none # no issue found for the medrese's own flag; the köşk's and the platform's flags are read (course.service.ts:857)

  - id: leaving-a-changed-form-warns
    need: >-
      A form that differs from the last save is not lost to a menu entry, a link or a reload without a warning (SET-2; decision D2).
    drawn: [dirty, refused, refusedDescription]
    missing: none

  - id: focus-stays-usable-after-vazgec-and-save
    need: >-
      After Vazgeç or a successful Kaydet the focus is somewhere a keyboard or screen-reader user can go on from (the name field, or the buttons
      stay focusable), and "Kaydet" says why it is off (F-B-11).
    drawn: [cancel, submit, clean, saved]
    missing: none

  - id: a-refused-courses-read-is-told-as-a-refusal
    need: >-
      A person who may change the settings but not read the course list is told that she may not, not that the list "could not be read, refresh"
      (SET-1).
    drawn: [coursesFailed]
    missing: none

  - id: admission-rules
    need: >-
      A medrese sets rules over its own courses: prerequisites, and enrolment without approval for a talebe who holds an icazet (P-05, MDRS-138,
      with MDRS-149 for the icazet record). The permission madrasah.admission_rules exists and gates nothing; there is no screen and the issue says
      "not now".
    drawn: []
    missing: MDRS-138
