rules:
  - { id: F-B-11, rule: "Pressing 'Vazgeç', or 'Kaydet' once it has succeeded, turns the pressed button natively disabled while it holds the focus (`disabled={!dirty || pending}` settings-form.tsx:225, `disabled={!dirty}` :226; after a save `dirty` becomes false, :80-85), and a native `disabled` drops the focus to the page; the kit uses `aria-disabled` only while busy (libs/ui/src/mds/button.tsx:141-146). 'Kaydet' is also off for 'nothing changed' with no stated reason. Fix: `aria-disabled` for both, or move the focus to the name field after Vazgeç and after a save." }
  - { id: F-B-5, rule: "Holds in this form, unlike the dialogs of the same part: a refused 'Kaydet' moves the focus to the first invalid field (settings-form.tsx:69-75), so the message under it is read through aria-describedby. The message itself is no live region." }
  - { id: policy-no-public-recordings-inert, rule: "'Ders kayıtları herkese açılamaz' is saved, shown and audited, and its help says no recording can then be made public or uploaded to YouTube, but no handler asks the flag (CourseService.publicRecordingsAllowed reads only the platform's and the köşk's, apps/tedrisat/src/course/course.service.ts:857-867). The page tells the başmüderris her recordings are closed when they are not; 'Politika değişikliği kaydettiğiniz anda geçerli olur' is true of the approval box and, for 'Kapalı ders zorunlu', of the next course opened or saved, not of this one. Domain invariant madrasah-no-public-recordings-closes-recordings (holds: false). Fix: enforce it, or leave the box out." }
  - { id: patch-madrasah-unaudited, rule: "Not on this page: the form saves through PATCH /madrasahs/{id}/settings, which writes the audit row madrasah.settings.update. The overlapping route PATCH /madrasahs/{id} (name, description, handle, cover) writes none, and no web app calls it (apps/tedrisat/src/madrasah/madrasah.repository.ts:189). Recorded because the page's promise 'denetim kaydına yazılır' is true only of the route it uses." }
  - { id: madrasah-settings-save-noop, rule: "A save that changes nothing writes nothing: no updatedBy, no updatedAt, no audit row (apps/tedrisat/src/madrasah/madrasah-settings.ts:30). The page never sends one, because 'Kaydet' is off until something differs, whitespace aside (settingsPatch compares trimmed text)." }
  - { id: SET-1, rule: "The courses card says 'Dersler şu an okunamadı. Sayfayı yenileyerek yeniden deneyin.' for every read that is not 'ok' (settings-page.tsx:144-148), the 403 of a nazır who holds madrasah.settings_edit and none of madrasah.course_open, madrasah.course_hide or madrasah.muderris_manage included: a refusal worded as an outage, and a retry that never works. `readOnce` returns `forbidden` for it. New finding, from the code and the domain (listMadrasahCourses asks any of the three); not verified in a browser, and the stack seeds no such nazır. Fix: say 'Bu listeyi görme izniniz yok' for a 403, as PageProblem does for the form." }
  - { id: SET-2, rule: "A changed form is lost by anything that leaves it: a menu entry, a link, 'Medrese dersleri', a reload. Nothing warns (no beforeunload and no router guard in features/settings; the recording dialog has one, apps/nazar/features/recordings/components/recording-dialog.tsx:215), and the only sign of an unsaved change is that 'Kaydet' is on. 'Vazgeç' asks nothing either. New finding, from the code; not verified in a browser. Fix: warn when the form differs from the last save." }
  - { id: REFUSED-3, rule: "Where the API refuses the settings the header link 'Medrese sayfasını gör' stays (settings-page.tsx:82, drawn before the read is judged), so 'no form' is not 'no control'. Harmless: the public page is public. Carried from nazar.access.medreseNazirRefused." }
  - { id: focus-not-set, rule: "The page sets no initial focus on load, and none after 'Vazgeç' or a successful save (F-B-11); the one focus it moves is to the invalid field after a refused 'Kaydet'. The graph draws no `initialFocus` for it." }
  - { id: label-in-name, rule: "A control's visible text is contained in its accessible name (WCAG 2.5.3): 'Kaydet', 'Vazgeç', 'Medrese dersleri', and 'Medrese sayfasını gör' in 'Medrese sayfasını gör (yeni sekmede açılır)'. Holds." }
  - { id: name-is-required-and-said, rule: "The name box carries the native `required` (settings-form.tsx:147) beside the visible '* zorunlu alan', and the form is noValidate, so the refusal is the page's own message under the field: the F-B-7 defect of the dialogs does not occur here." }
  - { id: checkboxes-not-switches, rule: "The three policies are checkboxes that wait for 'Kaydet', not switches that commit at once (settings-form.tsx:32-36): the page draws what the canvas draws. Each help line is the checkbox's aria-describedby, so a long sentence is read with it." }
