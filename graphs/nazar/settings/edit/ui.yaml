# The screens of nazar.settings.edit: "Medrese ayarları" (/medrese/<id>/ayarlar), its toasts and the refusal that replaces the form. Read
# from apps/nazar/features/settings/components/{settings-page,settings-form}.tsx, features/settings/{settings,actions}.ts and the kit's
# libs/ui/src/mds/{field,checkbox,button,alert,toast}.tsx on 15 Nov 2026, not seen in a browser; the words are copied from
# libs/i18n/src/locales/tr/nazar.json (namespaces Settings, Problems; the app reads them as nazar.Settings, nazar.Problems).
#
# Words that are not in the app's i18n file (catalog keys `composed.*`, each with the code line it comes from):
#   composed.Settings.name            "{madrasah}"     the medrese's name, drawn as data: the name box's value (settings-form.tsx:150), the third level
#                                                      (settings-page.tsx:127) and the sidebar's scope (scope-picker.tsx:100)
#   composed.Settings.newName         "{newMadrasah}"  the same after a save, with the name the walk typed
#   composed.Settings.description     "{description}"  the description box's value (settings-form.tsx:169)
#   composed.Settings.viewPageName    "Medrese sayfasını gör (yeni sekmede açılır)"  the link's accessible name: the visible words and a visually
#                                                      hidden hint after a space (settings-page.tsx:90-94)
#   composed.Settings.requiredNote    "* zorunlu alan" the star and `Settings.required` (settings-form.tsx:129)
# `changes` is the app's own `Settings.policiesNote`: the one message that says what a save does ("Politika değişikliği kaydettiğiniz anda
# geçerli olur ve denetim kaydına yazılır."); nothing in the app says it of the name and the description, whose help lines say who sees them.
#
# The page keeps no focus of its own on load and none after "Vazgeç" or a save (F-B-11), so there is no `initialFocus`; the one focus it
# moves is to the first invalid field after a refused "Kaydet" (`focus` below). Where a node says nothing of its state, the replay finds
# it through the binding. `limits.*` and `madrasah.*` are the numbers and names the ui's `samples` stand for.
