# The screens of nazar.appeals.open: İtirazlar (/medrese/<id>/itirazlar), its table of the köşk's refusals, the "İtiraz aç" dialog over
# it and the toasts. Read from apps/nazar/features/appeals/components/{appeals-page,appeals-table,appeal-dialog}.tsx and
# libs/ui/src/mds/{table,dialog,field,toast,button}.tsx on 15 Nov 2026; the words are copied from libs/i18n/src/locales/tr/nazar.json
# (namespaces Appeals, Nav, Shell, Problems). Not looked at in a browser: every role, name and focus below is from the code.
#
# Messages that are not the app's own:
#   Changes.note                     authored: no message of the app says what an appeal changes (the toast's "Medaris yönetimine iletildi"
#                                    claims more than the API does, F-B-appeals-5). Each sentence was checked against appeal.service.ts,
#                                    appeal.repository.ts and appeal.controller.ts (no notification, no withdraw route, one appeal per request).
#   composed.Appeals.course          "{title}", the course's own title as a cell and as the dialog's eyebrow (appeals-table.tsx:35, appeal-dialog.tsx:85)
#   composed.Appeals.kosk            "{kosk}", the köşk's name in its cell (appeals-table.tsx:41)
#   composed.Appeals.rejectReason    "{rejectReason}", the köşk's reason in its cell (appeals-table.tsx:47)
#   composed.Appeals.requiredNote    "* {required}", built in code from the star and Appeals.dialog.required = "zorunlu alan" (appeal-dialog.tsx:98)
#   composed.Button.loading          "Yükleniyor", the hidden word of a busy button, hard-coded in the kit (libs/ui/src/mds/button.tsx:62, :114)
#
# The page behind the dialog is inert while the dialog is open, so no page node is listed in a dialog state. A toast is a dialog in the
# "Bildirimler" live region; an error toast is an alertdialog and stays until closed, a success toast closes after 6 seconds
# (libs/ui/src/mds/toast.tsx:30).
