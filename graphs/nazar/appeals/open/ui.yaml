rules:
  - { id: focus-not-set, rule: "The page sets no focus when it opens or after it was read again, and none after the dialog closes on success (the opener leaves with the row's status change): the focus falls to the document. The dialog itself starts in the textarea (appeal-dialog.tsx:88)." }
  - { id: F-B-6, rule: "The submit button is natively disabled while the reason is blank (appeal-dialog.tsx:92), and the error 'Bir gerekçe yazın.' is shown only when the field was left empty (appeal-dialog.tsx:103, :115): focus has already moved on, the message is only aria-describedby, and the `blank` branch of the submit handler (:49) can never run because a disabled button sends nothing and Enter in a textarea is a new line. Fix: do not disable the submit; on submit show the error and move focus to the textarea, or give the error role=alert." }
  - { id: F-L-12, rule: "Field's error text is no live region (libs/ui/src/mds/field.tsx:50-53), so 'Bir gerekçe yazın.' is read only when the focus returns to the field. The family of F-B-6 (F-L-18)." }
  - { id: F-B-9, rule: "On success the dialog closes and the list is read again: 'İtiraz aç' disappears with the row's change to 'Bekliyor', so the element Base UI would give the focus back to no longer exists and the focus falls to the document. Fix: move the focus to the table's caption or the row's status and say it in the toast. Not verified in a browser." }
  - { id: F-B-2, rule: "The busy 'Gönder' passes no loadingLabel, so its hidden <output> says 'Yükleniyor' from the kit's hard-coded default (libs/ui/src/mds/button.tsx:62, :114), outside the catalog and the same word for every write of the app." }
  - { id: F-B-12, rule: "The dialog's whole body is its description (libs/ui/src/mds/dialog.tsx:107-116); here that is the star line and the field, so a screen reader reads 'zorunlu alan' and 'Gerekçe' with the title. Small here; the same finding is large on the permission editor." }
  - { id: F-B-13, rule: "A refused reader (a medrese nazır without madrasah.appeal_open) lands on a page whose <title> and <h1> still say İtirazlar, under a neutral Alert (role status) whose title is a <p>, with no link out (page-problem.tsx:23-29)." }
  - { id: F-B-14, rule: "The shell e2e (shell.e2e.ts:192-210, shell#4) still expects the shared placeholder 'Bu sayfa henüz hazır değil.' on İtirazlar (a3); İtirazlar is built, the placeholder is unreachable (app/medrese/[medreseId]/[bolum]/page.tsx:16-20) and a3 cannot pass. This graph carries the page the code draws and not a3; a1, a2 and a4 stand (a4, aria-current, is not expressible here)." }
  - { id: F-B-1, rule: "The page's failed read ('İtirazlar okunamadı' with a retry) draws a second <h1> under the page's own (LoadFailed with `shell`, F-L-16). That state is drawn by nazar.shell.errorStates, with İtirazlar standing for every page; this flow does not repeat it." }
  - { id: F-B-appeals-1, rule: "new: while the appeal is sent the textarea is disabled (appeal-dialog.tsx:113), so the focused field loses the focus, and 'Vazgeç', the close icon and Escape stay enabled and do nothing (`if (!open && !pending) onClose()`, :81). A refusal that keeps the dialog open (AUTHZ_FORBIDDEN or any other failure) enables the field again and nothing gives the focus back. The same pattern as F-W3-open-2 in nizam. Fix: aria-disabled on the cancel controls while busy, keep the textarea readOnly, and focus it after a refusal. Not verified in a browser." }
  - { id: F-B-appeals-2, rule: "new: the table is read again silently after a success: the row's badge changes from 'Yok' to 'Bekliyor' and its button leaves under a wrapper that carries only aria-busy (appeals-table.tsx:90), which no screen reader speaks; the toast (6 seconds) is the only word, and it is over when a screen-reader user has found the page again. Fix: a status line under the heading ('1 itiraz bekliyor') or a live region on the row." }
  - { id: F-B-appeals-3, rule: "new: the dialog's accessible name is 'İtiraz aç' alone; the request it acts on is the eyebrow paragraph above the title (libs/ui/src/mds/dialog.tsx:85-89), which is in neither the name nor the description, so a screen-reader user who opens it is not told which course is being appealed (the opener's own aria-label names it, 'İtiraz aç: {title}'). Fix: put the title in the dialog's description or its name. Not verified with a screen reader." }
  - { id: F-B-appeals-4, rule: "new: the reason's limit of 1000 characters is a `maxLength` (appeal-dialog.tsx:110) with no counter, no help line and no message: typing simply stops at 1000, and the person is not told why. Fix: a counter or a help line, and an error when a paste is cut." }
  - { id: F-B-appeals-5, rule: "new: the success toast says 'Medaris yönetimine iletildi' (Appeals.dialog.doneBody), but createMadrasahAppeal writes the appeal and one audit row and notifies no one (appeal.repository.ts:107-150; the domain's sideEffects say so): Medaris management learns of it only by opening nizam's İtirazlar, and the köşk's nazım is not told. The decision is not notified to the medrese either (acceptAppeal and rejectAppeal write no notification), so the medrese finds out by opening İtirazlar again. Fix: notify the platform's deciders when an appeal opens and the medrese when it is decided (needs.yaml, appeal-is-told), or reword the toast." }
  - { id: F-B-appeals-6, rule: "new, not verified: an error toast over an open modal dialog. Base UI marks the content outside a modal dialog inert, and the toast viewport is a portal outside it, so whether 'İtiraz gönderilemedi' is reachable (and announced) while the dialog is open is to be seen in a walk. If it is not, the refusal that keeps the dialog open (AUTHZ_FORBIDDEN, any other failure) says nothing to a screen-reader user." }
  - { id: label-in-name, rule: "'İtiraz aç' is contained in the row button's name 'İtiraz aç: {title}' (WCAG 2.5.3). Holds." }
  - { id: no-default-accept, rule: "The dialog starts in the textarea, not on 'Gönder'. Holds." }
  - { id: one-appeal-per-request, rule: "The button is drawn only on a refused request that has no appeal (`canAppeal`, appeals.ts:41); a sent appeal cannot be taken back or sent again (no withdraw route). The page says neither in the dialog (decision D2)." }
