# The screens of nazar.courseSettings.access: the card "Erişim, kayıt ve saat dilimi" of Ders ayarları (/ders/<id>/ayarlar) in nazar-web, its two
# option lists, the toasts of a save, and the refusal that replaces the page when the codes are gone. Read from apps/nazar/features/course-settings
# (course-settings-page.tsx, course-settings-form.tsx, controls.ts, course-settings.ts, actions.ts) and the kit's libs/ui/src/mds/{field,checkbox,
# select,button,alert,toast}.tsx on 15 Nov 2026, not seen in a browser; the words are copied by script from libs/i18n/src/locales/tr/nazar.json
# (namespaces CourseSettings, Problems, Nav; the app reads them as nazar.CourseSettings, ...).
#
# Words that are not in the app's i18n file (catalog keys `composed.*`, each with the code line it comes from):
#   composed.CourseSettings.sampleFirst   "Hafta {week} · {firstTitle}"   the app's own `CourseSettings.sampleOption` ("Hafta {week} · {title}",
#   composed.CourseSettings.sampleSecond  "Hafta {week} · {secondTitle}"   course-settings-form.tsx:201) once for each of the two sessions of the
#                                                                         walk's course; two keys because a replay fills a sample by its placeholder's name
#   composed.CourseSettings.zoneCity      "{city}"                          a zone's label, the last part of its IANA id with the underscores as spaces
#                                                                         (`timeZoneCity`, libs/utils/src/time-zone.ts:150; course-settings-form.tsx:247-253)
# `changes` is `Changes.note`, the one message authored for this catalog: no message of the app says what Kaydet changes as a whole (its own
# `savedBody` says only that the settings were updated, after the fact), so one short note puts the page's own descriptions (closedDesc,
# sampleHelp, approvalDesc, inPersonDesc, zoneHelp, versionConflict) together.
#
# The page sets no focus of its own on load, after a save or after a refusal (nothing in features/course-settings calls focus() or sets autoFocus:
# focus-not-set), so there is no `initialFocus` and no `focus`; the replay leaves the focus unsaid. The two option lists are drawn as the account page
# draws its own (a Base UI Select in a popup, the page behind taken to be inert, not verified in a browser).
