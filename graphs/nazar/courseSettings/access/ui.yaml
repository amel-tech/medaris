rules:
  - { id: F-D2c-14, rule: "The e2e specs of this card (course-settings#1 a7, #2, #3, #10) were last changed on 2026-10-06; since #344 (2026-10-16) the page also draws the card 'Hocalar ve unvanları' with its own 'Kaydet' and 'Vazgeç' for every holder of course.settings (hoca-unvan-card.tsx:155-172), so `getByRole('button', { name: 'Kaydet' })` finds two buttons and a click or an expect on it breaks in Playwright's strict mode: the specs cannot pass as written, for the müderris, the başmüderris and the başnazım alike. From the code; not run. This graph draws the form's own pair and the binding scopes every locator to `data-testid=course-settings-form`; the fix for the specs is the same scope, and for people using a screen reader two buttons of one name on one page is worth a name that tells the card (course-settings-form.tsx:258-272, hoca-unvan-card.tsx:155-172)." }
  - { id: F-D2c-7, rule: "After a save that changes the stored values the whole form is built again (`key={JSON.stringify(stored)}`, course-settings-page.tsx:109, with `router.refresh()` at course-settings-form.tsx:142), so the pressed Kaydet is destroyed and the focus falls to the body; the toast is the only feedback. Not verified in a browser. Fix: after the refresh give the form heading `tabIndex=-1` and focus it, or keep one instance and update `saved`." }
  - { id: F-D2c-17, rule: "The zone list offers about 418 zones, each labelled by its city alone (`timeZoneCity`: the last part of the id with underscores as spaces, so 'Europe/Berlin' reads 'Berlin' and 'America/Indiana/Knox' reads 'Knox'), in the order of the IANA ids and not of the labels, with no region and no search; 'İstanbul' is the only one worded by the catalog (course-settings-form.tsx:242-254, libs/utils/src/time-zone.ts:150-163). A hoca looking for a zone has to know its id's order. Fix: label 'Berlin (Avrupa)', sort by label, add type-ahead." }
  - { id: CSA-1, rule: "New finding, from the code. A save that wrote the sample session and was then refused on the course's fields (a policy that came on, a code that went) answers with the toast 'Ayarlar kaydedilemedi' and the sentence of the refusal ('... ayar değiştirilmedi.' for a policy, 'Bunu yapma izniniz yok.' for a lost code) although the sample WAS changed (`stop(code)` is given no description when the first write landed, course-settings-form.tsx:83-93, 131-134), and `now !== saved` reads the page again, whose stored sample differs, so `key={JSON.stringify(stored)}` builds the form again and the pressed course fields are gone with it. The page does say 'Örnek ders kaydedilemedi; şu an bu dersin örnek dersi yok.' when the second sample write fails (:116-121), so the case is known; this one is not worded. The unit spec pins only that `refresh` is called (test/course-settings-form.spec.tsx:344). Fix: say that the sample was saved and the rest was not, and keep the draft of the course fields." }
  - { id: CSA-2, rule: "New finding, from the code and its unit spec. A refusal that leaves the stored values as they were (PLATFORM_POLICY_LOCKED, AUTHZ_FORBIDDEN, anything else) does not read the page again: `stop` calls `refresh` only when a write landed or the code is COURSE_VERSION_CONFLICT (course-settings-form.tsx:92; test/course-settings-form.spec.tsx:323-342 pins `refresh` not called). The box stays unticked and open although the policy now holds it, Kaydet stays on, and the same press is refused the same way; the toast names no box and no policy. After a lost code the controls stay offered and only a reload says 'Bu sayfaya izniniz yok' (e2e course-settings#10 a5). Fix: read the page again after a policy lock (the box then shows shut with its reason) and after AUTHZ_FORBIDDEN, keeping the draft of the other controls." }
  - { id: CSA-3, rule: "New finding (coverage). None of the twelve specs of apps/nazar/e2e/course-settings.e2e.ts touches 'Celseler yüz yüze yapılır' (MDRS-283, d24612bb, 2026-10-12): grep finds no `inPerson` in apps/nazar/e2e. The box is pinned by the unit spec (test/course-settings-form.spec.tsx:193-231) only. This graph draws it with the other four; its first walk is the replay's." }
  - { id: focus-not-set, rule: "The page sets no initial focus on load, none after a save (the pressed Kaydet is gone with the remount, F-D2c-7) and none after a refusal, and moves none to the toast; a keyboard user finds the error only if the toast is read as a live region, which an alertdialog toast with priority high is (kit toast.tsx), and the focus stays where it was. The graph draws no `initialFocus` and no `focus`." }
  - { id: stale-course-fields-not-told, rule: "Not a defect of the page, a limit of the story: a stale page is told to retry only when the sample session is among the changes. PATCH /courses/:id takes no version (course.controller.ts:300, 'Takes no version and never answers COURSE_VERSION_CONFLICT'), so a save of closed, approval, in person or the zone from an old page is accepted and the last save wins, field by field (the page sends only the fields it changed, courseSettingsPatch, course-settings.ts:91-106), and the toast says 'Ders ayarları kaydedildi' either way. e2e course-settings#3 walks the sample's conflict only." }
  - { id: locked-approval-shown-ticked, rule: "The shut approval box is ticked whatever the course's own flag holds (`checked = locked || unlisted || draft`, course-settings-form.tsx:219-223), because a policy makes the enrolment wait anyway (MDRS-207): the page shows the effective state and not the stored one. The e2e does not read it; the replay's `policyOpen` walk stores false and expects the box ticked." }
  - { id: checkboxes-not-switches, rule: "The three boxes are checkboxes that wait for Kaydet, not switches that commit at once (the kit's rule: a control that needs a save button beside it is not a switch). Holds." }
