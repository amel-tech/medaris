rules:
  - { id: F-D2c-9, rule: "The code field is `disabled={busy}` (partner-codes-card.tsx:197), and `busy` is true while a code is added, while one is taken off and while the page is read again after a write. Pressing Enter in the field starts the add and the field is disabled at once, so the focus falls to the page; when the API refuses ('taken', and the others) the sentence sits under a field that has just lost the focus, and nothing says it (F-D2c-4). The focus is never put back, not on the field after a refusal and not on the card after a success. Not verified in a browser. Fix: `readOnly` with `aria-busy` while busy, and focus the field after a refusal." }
  - { id: F-D2c-4, rule: "The sentences under the field ('Bir kod yazın.', the shape sentence, 'Bu kod başka bir derse bağlı. …') are Base UI's Field.Error, plain text linked to the input by aria-describedby; it has no role=alert and no live region (libs/ui/src/mds/field.tsx:50-52). They are read only if the focus moves to the field, and after a refused add it does not (F-D2c-9). Fix: role=alert on the error in the kit, or focus the field." }
  - { id: F-D2c-13, rule: "A busy 'Ekle' and a busy 'Kaldır {code}' pass no loadingLabel, so their hidden status says 'Yükleniyor' from the kit's hard-coded default (libs/ui/src/mds/button.tsx:62), outside the catalog. Harmless while nazar is Turkish only." }
  - { id: F-L-17, rule: "After 'Kaldır' succeeds the pressed button leaves with its row (the page is read again) and no code moves the focus; the only word is a toast of 6 seconds. A keyboard or screen-reader user falls back to the top of the page. Fix: after the refresh focus the card's heading (tabIndex=-1) or the next row's Kaldır, and keep a status line." }
  - { id: PCODES-1, rule: "new: the card is for 'the köşk nazımı and the başnazım' (the comment of showsPartnerCodes, partner-codes.ts:26-31; the API gives course.partner_codes to KOSK_NAZIM and SYSTEM_ADMIN), and nazar draws it nowhere else. But nazar builds its scopes from medrese and course seats alone ('Roles whose scope is the platform or a köşk are Nizam's and make no scope', features/shell/scope.ts:89), so a köşk nazımı with no seat in the course is sent to /erisim-yok from /ders/<id>/ayarlar, or meets the 404 page if they hold a seat in another course (portal-layout.tsx:95-108, opened-scope.ts:55); the stack's KOSK_NAZIM lands on /erisim-yok in nazar (STACK.md smoke table). Only the başnazım, by address (admin-scope.ts), and a nazım who also teaches the course get the card. Seen in the code, not in a browser. Fix: see decision D1 of the flow." }
  - { id: PCODES-2, rule: "new: adding a code the course already holds is idempotent on the API (the existing row comes back, createdAt unchanged, no audit row), and the page cannot tell it from a new one: it clears the field and says 'Kod eklendi' / '{name} kodu {code} artık bu derse bağlı.' (partner-codes-card.tsx:102-111). Harmless, but the toast reports a change that did not happen. Fix: compare with the list before sending, or say 'zaten bağlı'." }
  - { id: PCODES-3, rule: "new: a köşk with several partner applications gets one block per partner (partner-codes-card.tsx:59-61), and nothing in a block's controls names its partner: the field's label is 'Kod ekle' and its button 'Ekle' in each, and 'Kaldır {code}' repeats when two partners hold the same code string (the code is unique per partner, not across partners). Only the h3 above the block tells them apart. WCAG 2.4.6 and 2.5.3 context. The stack binds one partner, so this was read from the code and not seen. Fix: name the field and the buttons with the partner (a visually hidden ' {name}')." }
  - { id: kaldir-asks-nothing, rule: "'Kaldır' takes the code off at once, with no confirmation and no reason. What it does is told after the fact by a toast ('Bu kodla kaydedilen talebeler derste kalır.'): the people the code enrolled stay, and the partner application's later calls with the code find no course until it is added again (adding it again undoes it, unless another course took it meanwhile). Not a defect; stated so the graph does not draw a confirmation the page does not have." }
  - { id: toast-is-the-only-word, rule: "The result of a write is said by a toast (a dialog in the 'Bildirimler' live region): it closes after 6 seconds for a success and stays for an error. A refused add is said under the field instead. Nothing else on the card says what was done; the list is what the page shows after it is read again." }
  - { id: focus-not-set, rule: "Nothing in features/course-settings moves the focus when the page loads, when the card appears, after an add or after a removal, so the page has no `initialFocus` and no `focus` here." }
  - { id: label-in-name, rule: "A button's visible text is contained in its accessible name: 'Kaldır' in 'Kaldır {code}' (a visually hidden code follows the word). Holds (WCAG 2.5.3)." }
