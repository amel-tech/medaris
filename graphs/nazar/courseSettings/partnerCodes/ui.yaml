# The screens of nazar.courseSettings.partnerCodes: the "Ortak uygulama kodları" card of Ders ayarları (/ders/<id>/ayarlar), its
# busy states and the toasts of a write. Read from apps/nazar/features/course-settings/{partner-codes.ts,
# components/partner-codes-card.tsx, components/course-settings-page.tsx}, libs/ui/src/mds/{field,input,button,toast,alert}.tsx
# on 15 Nov 2026; nothing here was seen in a browser. The words are copied from libs/i18n/src/locales/tr/nazar.json.
#
# The page carries three other cards (the access form, Hocalar ve unvanları, Yayın): they belong to other flows, so only the
# page's `<main>` and its h1 are drawn here, to say where the card stands. Where a node says "repeat", the page draws it once
# per code of the partner; the replay finds the rows through the binding.
#
# Four messages are not from the app's i18n files, and the catalog keeps them under `composed.`:
#   composed.Button.loading                                 "Yükleniyor": the busy button's hidden <output>, a default of the kit
#                                                           (libs/ui/src/mds/button.tsx:62), outside the catalog (F-D2c-13)
#   composed.CourseSettings.partnerCodes.removeLabel        "Kaldır {code}": the button's visible "Kaldır" plus a visually hidden
#                                                           " {code}" (partner-codes-card.tsx:170-171)
#   composed.CourseSettings.partnerCodes.codeText           "{code}": the code in its <bdi dir=ltr> (partner-codes-card.tsx:158)
#   composed.CourseSettings.partnerCodes.partnerName        "{name}": the partner's name as the h3 (partner-codes-card.tsx:143)
# `Changes.note` is the one message the app has no equivalent of: no message of the app says what a code changes for the people
# of the partner application, so this graph carries one short Turkish text of its own (it is not a copy).
