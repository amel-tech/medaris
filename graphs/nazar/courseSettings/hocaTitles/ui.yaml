# The screens of nazar.courseSettings.hocaTitles: the card "Hocalar ve unvanları" of Ders ayarları (/ders/<id>/ayarlar), the open list of a
# select, the card read-only, and the toasts of a save. Read from apps/nazar/features/course-settings/components/{course-settings-page,
# hoca-unvan-card}.tsx, features/course-settings/hoca-unvan.ts and the kit's libs/ui/src/mds/{field,select,button,toast,app-shell}.tsx on
# 15 Nov 2026; not seen in a browser. The words are copied from libs/i18n/src/locales/tr/nazar.json (the app reads them as nazar.CourseSettings
# and nazar.Problems), by script (scratchpad mkcat-hocatitles.py).
#
# Words that are not copied from an i18n file, each with where they come from:
#   composed.CourseSettings.unvanPrefix.<CODE>   the eight unvans as they go before a name, "Prof. Dr." to "Hafız": libs/utils/src/hoca-unvan.js:33-42
#                                                (HOCA_UNVAN_PREFIX, "written the same in every locale"); they label the options of each select
#   The names in the labels and under the selects are literals, not catalog messages: the app's messages hocas.unvanLabel "{name} için unvan",
#   hocas.shownAs "Derste “{name}” olarak görünür." and hocas.noAccount (this card's lines under each select) fill {name} once for each hoca and
#   the catalog has one sample for a placeholder, so each node carries the sentence the walk's own course draws, with the stack's invented names
#   (Hamdi Müderris, Rıza Başvuran, Ahmed Hilmi) and one title ("Doç. Dr."); the key of each is named in a comment. Same as nazar.courses.open's
#   unvan labels. The two `{name}` that remain in the catalog (CourseSettings.intro and hocas.savedBody) are both the course's title.
# `changes` is the app's own card intro, `hocas.intro`: it says what a save puts on the course's hocas ("Ders, hocayı nerede gösterirse adı bu
# unvanla yazılır"), that it is per course ("aynı kişinin başka derslerdeki unvanı değişmez") and so what the card changes; the app has no other
# message that says it before Kaydet (hocas.savedBody says it after).
#
# The page keeps no focus of its own on load, after a choice, after Vazgeç or after Kaydet (focus-not-set), so there is no `initialFocus` and
# no `focus`. Base UI gives the focus back to a select's button when its list closes; nothing here says it. The list of a select is a popup in
# a portal, drawn with the card behind it as nazar.courses.browse draws its filters' lists: whether the page behind it is inert was not looked
# at. The toast of a success closes by itself after 6 seconds, so it is drawn in `saved` only; an error toast stays until closed and is drawn
# in the state it leads to.
