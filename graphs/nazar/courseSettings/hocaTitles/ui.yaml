rules:
  - { id: focus-not-set, rule: "the page sets no initial focus (nothing in features/course-settings does), and none after a choice, after Vazgeç or after Kaydet; a keyboard user who presses Kaydet loses their place (F-D2c-7). Base UI returns the focus to a select's button when its list closes; not verified in a browser" }
  - { id: F-D2c-7, rule: "course-settings-page.tsx:114 keys the card by `JSON.stringify(hocas)` and hoca-unvan-card.tsx:104 calls router.refresh() after Kaydet: when a title changed the stored list changes, so the whole card is mounted anew, the focused Kaydet is destroyed and the focus falls to the page. The success toast (6 seconds) is the only sign. The form above is keyed the same way by its own stored values (course-settings-page.tsx:109). NOT VERIFIED in a browser. Fix: focus the card's heading after a save, or keep one instance and update `saved`" }
  - { id: F-D2c-14, rule: "the card draws its own 'Kaydet' and 'Vazgeç' for every holder of course.settings (hoca-unvan-card.tsx:155-172, #344, 16 Oct 2026), beside the access form's, so the page has two of each; a locator `getByRole('button', { name: 'Kaydet' })` resolves to two (apps/nazar/e2e/course-settings.e2e.ts:57 and course-nazirs.e2e.ts:726 were last changed on 6 Oct 2026). The two buttons are told apart only by the named form landmark that holds each; their names are the same. From the code; not run. Fix: scope the specs to the forms' test ids; name the buttons by their card ('Unvanları kaydet')" }
  - { id: HOCA-1, rule: "new: after a write is refused and the re-read leaves the hocas as they were, the card is not mounted anew (its key is the hocas), so it keeps the draft the API refused: the selects stay on the refused titles and the lines 'Derste “…” olarak görünür.' name a title the course does not have. With AUTHZ_FORBIDDEN (the caller's course.settings ended, for instance a ders nazırı's end date) the re-read also takes `editable` away: the selects are shut, Kaydet and Vazgeç are gone, and there is no way to put the stored titles back short of reloading (hoca-unvan-card.tsx:81-90, course-settings-page.tsx:114,118). The doc comment says the page is read again 'so it shows what is stored'. From the code; not verified in a browser. Fix: put `saved` back into the draft on a refusal, or key the card by `editable` as well" }
  - { id: HOCA-2, rule: "new: the writes are one PUT for each changed hoca, in list order, with no transaction; the first refusal stops the loop (hoca-unvan-card.tsx:78-91). A refusal at the second hoca leaves the first one stored, and the toast says only 'Unvan kaydedilemedi' with the cause of the second: it does not say that one title was saved. The re-read does show it (a stored title changed, so the card is mounted anew with the stored titles) and drops the choice that was refused, with no word of either. Fix: say how many titles were saved, or send the changes in one call" }
  - { id: HOCA-3, rule: "new: 'Kaydet' and 'Vazgeç' are natively disabled until a title differs (hoca-unvan-card.tsx:159,166), nothing says why, and a native disabled button leaves the tab order; after a Vazgeç, or the end of a save (`setSaved(draft)` makes `dirty` false), the pressed button turns off under the focus. The same family as F-B-11 of nazar.settings.edit. Fix: keep Kaydet focusable (aria-disabled) and say 'Değişiklik yok'" }
  - { id: HOCA-4, rule: "new: leaving the page with a title chosen and not saved (a menu entry, a link, a reload) asks nothing: the choices are lost with no word, and Vazgeç also drops them without a question. The page's recording dialog does warn (recording-dialog.tsx:215, beforeunload); this card does not. The same as SET-2 of nazar.settings.edit. Fix: warn on leaving a card that differs from what is stored" }
  - { id: F-D2c-2, rule: "the course menu offers 'Ders ayarları' to every course persona whatever they hold (features/shell/nav.ts:142), so a ders nazırı with no code of the page's list meets 'Bu sayfaya izniniz yok' (nazar.access.dersNazirPages); this card is reached from that entry" }
