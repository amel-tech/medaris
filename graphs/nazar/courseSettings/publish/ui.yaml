# The screens of nazar.courseSettings.publish: Ders ayarları (/ders/<id>/ayarlar) as far as the Yayın card goes, the question
# "Dersi taslağa çek", and the toasts of the card's two writes. Read from apps/nazar/features/course-settings; the words are copied
# from libs/i18n/src/locales/tr/nazar.json.
#   composed.CourseSettings.viewPublicName  "Tanıtım sayfasını gör (yeni sekmede açılır)": the link's accessible name, its text, a space
#                                           and the visually hidden CourseSettings.viewPublicHint (course-settings-page.tsx:98-102)
#   composed.CourseSettings.courseName      "{title}": the course's title as the question's eyebrow (course-publish-card.tsx:116)
#   composed.CourseSettings.busy            "Yükleniyor": the visually hidden status of a busy button, the kit's own default
#                                           (libs/ui/src/mds/button.tsx:62), in no catalog (F-D2c-13)
# `changes` is the app's own sentence about what taking a course back to draft does (CourseSettings.unpublishNote, the card's caption);
# what "Yayımla" does is said by the card itself (CourseSettings.publishedBody). No message is authored for this flow.
# The access form is drawn only as a witness of the story's "unsaved edits survive": one box, "Kayıt onayı gereksin", and the form's
# Kaydet and Vazgeç. The other fields of the form are nazar.courseSettings.access's. In the world this graph draws the course takes
# anyone (the box starts unticked); a course that already asks for approval starts ticked and unticks, which is the same story the
# other way round.
# While the question is open the page behind it is inert, so no node of the page is drawn in `asking` and `drafting`.
schema: delurio-graph/0
kind: ui
id: nazar.courseSettings.publish
flow: nazar.courseSettings.publish
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: CourseSettings.unpublishNote }
samples:
  name: Nahiv Okumaları
  title: Nahiv Okumaları

# The page keeps no focus of its own when it opens (nothing in features/course-settings sets it); the rule focus-not-set says so. After
# a status change the focus is the one the question gave back (see the rules): the graph draws only what the code says.
nodes:
  # --- the page ------------------------------------------------------------------------------------------------------------------
  settingsPage: { type: page, component: Page, role: main, in: [published, publishedEdited, draft, draftEdited, publishing, publishingEdited], source: apps/nazar/features/course-settings/components/course-settings-page.tsx:83 } # the shell's one <main id="main">; it has no name
  pageTitle: { type: text, component: Heading, role: heading, text: { key: CourseSettings.title }, in: [published, publishedEdited, draft, draftEdited, publishing, publishingEdited], source: apps/nazar/features/course-settings/components/course-settings-page.tsx:85 } # h1
  pageIntro: { type: text, component: Text, text: { key: CourseSettings.intro, params: { name: course.title } }, in: [published, publishedEdited, draft, draftEdited, publishing, publishingEdited], source: apps/nazar/features/course-settings/components/course-settings-page.tsx:86 }
  viewPublic: { type: action, component: LinkButton, role: link, intent: secondary, name: { key: composed.CourseSettings.viewPublicName }, text: { key: CourseSettings.viewPublic }, in: [published, publishedEdited, draft, draftEdited, publishing, publishingEdited], duringStep: true, emits: OPEN_PUBLIC, source: apps/nazar/features/course-settings/components/course-settings-page.tsx:91 } # target=_blank rel="noopener noreferrer"; drawn for a draft too (D2); href {TEDRIS_URL}/tr/courses/<id> (PUB-1); left out when TEDRIS_URL is unset, which the stack sets

  # --- the access form: the witness of an unsaved edit --------------------------------------------------------------------------
  accessForm: { type: page, component: Page, role: form, name: { labelledBy: accessTitle }, in: [published, publishedEdited, draft, draftEdited, publishing, publishingEdited], source: apps/nazar/features/course-settings/components/course-settings-form.tsx:146 } # <form aria-labelledby>, data-testid=course-settings-form
  accessTitle: { type: text, component: Heading, role: heading, text: { key: CourseSettings.accessTitle }, in: [published, publishedEdited, draft, draftEdited, publishing, publishingEdited], source: apps/nazar/features/course-settings/components/course-settings-form.tsx:153 } # h2
  approvalBox: { type: field, component: TextField, role: checkbox, text: { key: CourseSettings.approvalLabel }, checked: "edits == 'unsaved'", in: [published, publishedEdited, draft, draftEdited, publishing, publishingEdited], emits: EDIT, source: apps/nazar/features/course-settings/components/course-settings-form.tsx:198 } # named by its label alone, the sentence under it is the description; open for a hoca whom no policy locks, off for the others
  accessSave: { type: action, component: Button, role: button, intent: confirm, text: { key: CourseSettings.save }, in: [published, publishedEdited, draft, draftEdited, publishing, publishingEdited], disabledIn: [published, draft, publishing], source: apps/nazar/features/course-settings/components/course-settings-form.tsx:249 } # on only while the form differs from what is stored; never pressed here (nazar.courseSettings.access); the card Hocalar ve unvanları has a second Kaydet (F-D2c-14)
  accessCancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: CourseSettings.cancel }, in: [published, publishedEdited, draft, draftEdited, publishing, publishingEdited], disabledIn: [published, draft, publishing], emits: DISCARD_EDIT, source: apps/nazar/features/course-settings/components/course-settings-form.tsx:242 } # puts the stored values back; the second Vazgeç of the page belongs to Hocalar ve unvanları

  # --- the Yayın card ------------------------------------------------------------------------------------------------------------
  publishCard: { type: page, component: Page, role: region, name: { labelledBy: publishTitle }, in: [published, publishedEdited, draft, draftEdited, publishing, publishingEdited], source: apps/nazar/features/course-settings/components/course-publish-card.tsx:67 } # <section aria-labelledby>, data-testid=course-publish; last in the DOM, in the aside column
  publishTitle: { type: text, component: Heading, role: heading, text: { key: CourseSettings.publishTitle }, in: [published, publishedEdited, draft, draftEdited, publishing, publishingEdited], source: apps/nazar/features/course-settings/components/course-publish-card.tsx:73 } # h2 (class mds-h3)
  statusPublished: { type: text, component: Text, text: { key: CourseSettings.statusPublished }, in: [published, publishedEdited], source: apps/nazar/features/course-settings/components/course-publish-card.tsx:76 } # a Badge, success
  statusDraft: { type: text, component: Text, text: { key: CourseSettings.statusDraft }, in: [draft, draftEdited, publishing, publishingEdited], source: apps/nazar/features/course-settings/components/course-publish-card.tsx:76 } # a Badge, secondary
  publishedBody: { type: text, component: Text, text: { key: CourseSettings.publishedBody }, in: [published, publishedEdited], source: apps/nazar/features/course-settings/components/course-publish-card.tsx:84 }
  draftBody: { type: text, component: Text, text: { key: CourseSettings.draftBody }, in: [draft, draftEdited, publishing, publishingEdited], source: apps/nazar/features/course-settings/components/course-publish-card.tsx:84 }
  unpublishNote: { type: text, component: Text, text: { key: CourseSettings.unpublishNote }, in: [published, publishedEdited], source: apps/nazar/features/course-settings/components/course-publish-card.tsx:94 } # a caption, drawn only for a published course and a caller who may publish
  unpublishButton: { type: action, component: Button, role: button, intent: secondary, text: { key: CourseSettings.unpublish }, in: [published, publishedEdited], emits: UNPUBLISH, source: apps/nazar/features/course-settings/components/course-publish-card.tsx:98 } # not busy and not marked haspopup; the question is opened by state
  publishButton: { type: action, component: Button, role: button, intent: secondary, text: { key: CourseSettings.publish }, in: [draft, draftEdited, publishing, publishingEdited], disabledIn: [publishing, publishingEdited], emits: PUBLISH, source: apps/nazar/features/course-settings/components/course-publish-card.tsx:102 } # one Button for both labels (React keeps it); busy is aria-disabled, so it keeps the focus
  publishBusy: { type: status, component: Status, role: status, text: { key: composed.CourseSettings.busy }, in: [publishing, publishingEdited], source: libs/ui/src/mds/button.tsx:114 } # the visually hidden <output> of the busy button, "Yükleniyor" from the kit (F-D2c-13)

  # --- the toasts of a status change: a region "Bildirimler", each toast a dialog; an error toast is an alertdialog and stays -------
  toastDrafted: { type: status, component: Status, role: dialog, name: { key: CourseSettings.drafted }, text: { key: CourseSettings.savedBody, params: { name: course.title } }, in: [draft, draftEdited], when: "last == 'drafted'", source: apps/nazar/features/course-settings/components/course-publish-card.tsx:55 } # closes by itself after 6 seconds
  toastPublished: { type: status, component: Status, role: dialog, name: { key: CourseSettings.published }, text: { key: CourseSettings.savedBody, params: { name: course.title } }, in: [published, publishedEdited], when: "last == 'published'", source: apps/nazar/features/course-settings/components/course-publish-card.tsx:55 }
  toastRefused: { type: alert, component: Alert, role: alertdialog, name: { key: CourseSettings.publishFailed }, text: { key: Problems.actionForbidden }, in: [published, publishedEdited, draft, draftEdited], when: "last == 'refused'", source: apps/nazar/features/course-settings/components/course-publish-card.tsx:48 } # tone error: it stays until closed
  toastFailed: { type: alert, component: Alert, role: alertdialog, name: { key: CourseSettings.publishFailed }, text: { key: CourseSettings.errors.generic }, in: [published, publishedEdited, draft, draftEdited], when: "last == 'failed'", source: apps/nazar/features/course-settings/components/course-publish-card.tsx:48 }

  # --- Taslağa çek asks once ---------------------------------------------------------------------------------------------------------
  unpublishDialog: { type: page, component: Page, role: alertdialog, name: { labelledBy: unpublishTitle }, in: [asking, drafting], initialFocus: unpublishCancel, source: apps/nazar/features/course-settings/components/course-publish-card.tsx:111 } # Base UI AlertDialog: modal; the page behind is inert; the scrim does not close it (the kit's comment, not verified)
  unpublishEyebrow: { type: text, component: Text, text: { key: composed.CourseSettings.courseName, params: { title: course.title } }, in: [asking, drafting], source: apps/nazar/features/course-settings/components/course-publish-card.tsx:116 }
  unpublishTitle: { type: text, component: Heading, role: heading, text: { key: CourseSettings.unpublishTitle }, in: [asking, drafting], source: libs/ui/src/mds/alert-dialog.tsx:80 } # h2 of the dialog
  unpublishBody: { type: text, component: Text, text: { key: CourseSettings.unpublishBody, params: { name: course.title } }, in: [asking, drafting], source: apps/nazar/features/course-settings/components/course-publish-card.tsx:124 } # no number of talebe (D1)
  unpublishWay: { type: text, component: Text, text: { key: CourseSettings.unpublishWay }, in: [asking, drafting], source: apps/nazar/features/course-settings/components/course-publish-card.tsx:125 }
  unpublishCancel: { type: action, component: Button, role: button, intent: dismiss, text: { key: CourseSettings.cancel }, in: [asking, drafting], emits: CANCEL, source: libs/ui/src/mds/alert-dialog.tsx:102 } # the focus starts here; it stays enabled while the call runs and does nothing then (PUB-2)
  unpublishConfirm: { type: action, component: Button, role: button, intent: confirm, text: { key: CourseSettings.unpublishConfirm }, in: [asking, drafting], disabledIn: [drafting], emits: CONFIRM_UNPUBLISH, source: libs/ui/src/mds/alert-dialog.tsx:109 } # busy while the status is written (aria-disabled)
  unpublishBusy: { type: status, component: Status, role: status, text: { key: composed.CourseSettings.busy }, in: [drafting], source: libs/ui/src/mds/button.tsx:114 } # the confirming button's hidden <output>, "Yükleniyor" from the kit (F-D2c-13)
  unpublishClose: { type: action, component: Button, role: button, intent: dismiss, name: { key: CourseSettings.close }, in: [asking, drafting], emits: CLOSE, source: libs/ui/src/mds/alert-dialog.tsx:88 } # an icon button named only by aria-label; it too does nothing while the call runs (PUB-2)

edges:
  - { labelledBy: [accessForm, accessTitle] }
  - { labelledBy: [publishCard, publishTitle] }
  - { labelledBy: [unpublishDialog, unpublishTitle] }
  - { triggers: [approvalBox, publishedEdited] }
  - { triggers: [approvalBox, draftEdited] }
  - { triggers: [accessCancel, published] }
  - { triggers: [unpublishButton, asking] }
  - { triggers: [unpublishConfirm, drafting] }
  - { triggers: [publishButton, publishing] }
  - { returnsFocus: [unpublishDialog, unpublishButton] } # Vazgeç, Esc or Kapat: the button that opened it is still there (Base UI returns to the element focused before; not verified in a browser)

rules:
  - { id: focus-not-set, rule: "The page sets no focus when it opens and none after a status change; the question sets its own (Vazgeç). The status change keeps the pressed button on the page: 'Taslağa çek' and 'Yayımla' are one Button element at one place of the tree (course-publish-card.tsx:97-108), so React keeps the DOM node and only its words and the caption change, and the focus the question gave back stays on it. From the code; not verified in a browser. It is not the focus loss of F-A-2 or F-D2c-7." }
  - { id: F-D2c-7, rule: "Holds for the status: the access form is keyed by JSON.stringify(stored) (course-settings-page.tsx:109), and `stored` is isClosed, requiresApproval, inPerson, timeZone and the sample, never the status or the version, so Yayımla and Taslağa çek read the page again and the form keeps its draft and its focus; the page spec says so (course-settings-page.spec.tsx:216). The remount that loses the focus is the form's own Kaydet (nazar.courseSettings.access) and the Hocalar ve unvanları card's (keyed by hocas, :114)." }
  - { id: F-D2c-13, rule: "'Yayımla' and the question's confirming button are `loading` with no loadingLabel (course-publish-card.tsx:102-106, libs/ui/src/mds/alert-dialog.tsx:109-116), so the hidden status of each says 'Yükleniyor' from the kit's hard-coded default (button.tsx:62), outside the catalog; harmless while nazar is Turkish only. The access form's Kaydet passes its own ('Kaydediliyor…'). Fix: pass loadingLabel={t(\"Shell.loadingLabel\")} and give AlertDialog a confirmLoadingLabel." }
  - { id: F-D2c-14, rule: "Stale locators in the e2e: since the card Hocalar ve unvanları (hoca-unvan-card.tsx:155-172) a caller who holds course.settings has two 'Kaydet' and two 'Vazgeç' on the page, so course-settings#4 a2, a6 (getByRole('button', {name: 'Kaydet'})) and a8 ('Vazgeç') match two elements and fail in strict mode. The behaviour they check holds and is carried here: the graph draws the access form's pair, found inside the form (data-testid=course-settings-form). Fix: scope the e2e's locators to the form." }
  - { id: DRAFT-1, rule: "Cited from tedris.course.draftPreview, where it was seen in a browser: 'Tanıtım sayfasını gör' is drawn for a draft as for a published course (course-settings-page.tsx:90), and the person has a Nazar session only, so in Tedris she is a visitor and the API's 404 for a visitor is 'Sayfa bulunamadı'. The label promises a public page a draft does not have. Decision D2." }
  - { id: PUB-1, rule: "New finding (proposed id); seen with curl, nothing changed. coursePageUrl builds {TEDRIS_URL}/tr/courses/<id> (course-settings.ts:151-160) and says 'Nazar is Turkish only, so the page is the Turkish one'; since MDRS-248 Tedris has no language in its address and the language is the person's cookie (apps/tedris/lib/i18n/routing.ts:14-24). The link still lands because tedris's proxy answers /tr/... with a 308 to the bare address (proxy.ts:22-27); GET /tr/courses/<id> answered 308 to /courses/<id> on the stack. The e2e (course-settings#6 a2) and two unit specs pin the old form. Fix: build {TEDRIS_URL}/courses/<id>, and change the three assertions." }
  - { id: PUB-2, rule: "New finding (proposed id); from the code. While the status is written the question ignores every way of closing (onOpenChange does nothing while `pending`, course-publish-card.tsx:113-115), but 'Vazgeç' and the close icon stay enabled and a press does nothing; only the confirming button is marked busy. The same pattern as HIDE-3 of nazar.archive.hideAndRestoreCourse (the kit's AlertDialog has no way to disable them). Fix: mark both disabled for the length of the call, in the kit." }
  - { id: F-A-10, rule: "Cited from nazar.pano.decideApplications, the same pattern: no try/catch around the awaited server action (course-publish-card.tsx:44). A failure of tedrisat itself is worded (authenticatedAction catches it, and the toast says the generic sentence), but when the call to the action fails (the network between the browser and Next) the transition rejects and React hands the error to the nearest boundary, so no toast words it and the question's close is never reached. Not verified in a browser. Fix: catch around the call and word it as a failure." }
  - { id: confirm-before-drafting, rule: "'Taslağa çek' asks first, in an alertdialog whose focus starts on 'Vazgeç' (libs/ui/src/mds/alert-dialog.tsx:68-71, 102-108); 'Yayımla' does not ask, because nothing is lost and the way back is one button. The question is general: it says no number of talebe (D1)." }
  - { id: label-in-name, rule: "The link's visible text 'Tanıtım sayfasını gör' is contained in its accessible name 'Tanıtım sayfasını gör (yeni sekmede açılır)', which says the new tab (WCAG 2.5.3, 3.2.5). Holds." }
  - { id: toast-says-it-too, rule: "The result of a status change is said by a toast (a dialog in the 'Bildirimler' live region: it closes after 6 seconds for a success and stays for an error) and by the card itself, whose badge, sentence and button change after the page is read again. A refusal reads nothing again, so the card still offers the button the API has just refused." }
  - { id: only-who-may-publish, rule: "The card's buttons are drawn only for a caller who holds course.edit and course.publish (controls.ts:52), the two codes the route asks for a status change; anyone else sees the status alone (nazar.access.dersNazirPages)." }
