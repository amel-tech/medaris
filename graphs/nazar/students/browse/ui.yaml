# The screens of nazar.students.browse: Talebeler of a medrese (/medrese/<id>/talebeler) with its filters, table and pager, the two
# filter lists, the refusal and the failed read. Read from apps/nazar/features/students and libs/ui/src/mds; every word is copied
# from libs/i18n/src/locales/tr/nazar.json by a script (it fails on a missing key and compares each value). Two messages are not in
# that file and are built in code, as composed.*: a course title in a cell and in the Ders list (students-table.tsx:139, students.ts:89), and the day a course
# was marked finished (students.ts:172, shortDay). The page changes nothing, so there is no `changes` note.
# Where a node says "repeat", the page draws it once per row (or per course); the replay finds the rows through the binding.
schema: delurio-graph/0
kind: ui
id: nazar.students.browse
flow: nazar.students.browse
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
samples:
  nameGenitive: Hadis ve Siyer Medresesi’nin
  count: "28"
  name: Deneme Talebe 01 browse
  page: "1"
  pages: "3"
  total: "28"
  from: "1"
  to: "10"
  title: Deneme dersi browseB
  day: 13 Kas

