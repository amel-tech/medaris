edges:
  - { labelledBy: [failedRegion, failedTitle] }
  - { triggers: [courseFilter, choosingCourse] }
  - { triggers: [statusFilter, choosingStatus] }
  - { triggers: [next, reading] }
  - { triggers: [previous, reading] }
  - { triggers: [clearFilters, narrowing] }
  - { triggers: [retry, reading] }
  - { triggers: [ban, handed_over.ban] }

rules:
  - { id: F-B-4, rule: "A change of the list is not announced. The counter (students-table.tsx:235-237) and the range (:282-284) are a plain <p> and a plain <span>; the wrapper's aria-busy (:186) is not spoken; choosing a filter, typing, or paging leaves a screen-reader user with the old words until they read the page again. Fix: make the counter and the range one role=status element, or one hidden live region that says '{n} talebe'." }
  - { id: F-B-1, rule: "A read that fails draws the retry state with its own h1 (LoadFailed -> SystemState shell, headingLevel 1) under the page's own h1 'Talebeler', so heading navigation lists two page titles. Fix: LoadFailed passes headingLevel 2 when shell is true (load-failed.tsx:28-31)." }
  - { id: F-B-13, rule: "A refused reader meets the page's title and line, then a neutral Alert, which is a role=status, whose title 'Bu sayfaya izniniz yok' is a <p>, not a heading, with no link out; the <title> still says 'Talebeler'. Fix: draw the refusal as a heading with a way back to the medrese's first allowed page (page-problem.tsx:23-29)." }
  - { id: students-read-unaudited, rule: "GET /madrasahs/:id/students returns the names and e-mail addresses of the whole medrese's talebe and writes no audit row, while a course roster read writes course.roster_read (domain invariant madrasah-students-read-is-audited, holds: false). Fix: write the row (decision D1)." }
  - { id: focus-not-set, rule: "No `initialFocus` and no `focus` is drawn: nothing in features/students sets focus on load, and after a filter the focus stays where it was (the client component stays mounted; router.replace in a transition, students-table.tsx:63-67). After a page change the document is loaded anew, so the focus is the document's start. Where it lands after a Select list closes is Base UI's (the trigger, not verified in a browser)." }
  - { id: STUDENTS-1, rule: "New. The pager is two plain links (<a href>, button.tsx:136-): each page change loads the whole document anew, where the filters (router.replace) keep the page mounted. The focus falls back to the start of the document, the sidebar is read again, and nothing says that the page changed except the range text, which is no live region (F-B-4). Read from the code, not verified in a browser. Fix: next/link, or a client navigation like the filters, with the focus moved to the table caption." }
  - { id: STUDENTS-2, rule: "New. 'Yasakla' is drawn on every row for every reader of the table (students-table.tsx:169-178 has no permission check). The list is gated by madrasah.students_view and the ban by madrasah.ban (or platform.ban_scoped), two codes: a nazır given only the first meets a button that opens a dialog and is refused at submit (nazar.bans.ban). Read from the code, not walked: the stack seeds no such nazır. Fix: decision D2." }
  - { id: STUDENTS-3, rule: "New. The course filter reads GET /madrasahs/:id/courses, which asks for madrasah.course_open, madrasah.course_hide or madrasah.muderris_manage, none of which students_view implies. A nazır given only madrasah.students_view gets 403 on that side read and the list says nothing: the filter holds only 'Bütün dersler' (students-page.tsx:102-105), a combobox with one option. Read from the code, not walked." }
  - { id: STUDENTS-4, rule: "New, NOT VERIFIED. The box has no maxLength, the page cuts the word to 100 characters (students.ts:46, the API cuts it too), and the effect that asks again stops only when the box's trimmed text equals filters.q (students-table.tsx:69-77). A word of 101 characters or more never equals the cut one, so by the code the page asks the server again every 350 ms for as long as the box holds it. Not run: it needs a browser and a long word. Fix: cut the word in the box too (maxLength 100) or compare the cut words." }
  - { id: STUDENTS-5, rule: "New, NOT VERIFIED here (by analogy with BROWSE-1 of Keşfet, which was seen on the köşk list). pageOf accepts any whole number (archive.ts:53-56), so ?sayfa=99999999999999999999 reaches the API as an offset of 1e21, which Postgres refuses; readOnce turns the 500 into the failed state, and 'Yeniden dene' (router.refresh) fails again for ever. A ?sayfa= past the last but small is answered with a redirect to the last page (students-page.tsx:55-67). Fix: clamp the page in the read (students.ts:70-76)." }
  - { id: filters-replace-history, rule: "A filter or a word changes the address with router.replace, so it leaves no history entry: the browser's Back button leaves the page and does not undo a filter. The pager's links are ordinary links and do leave entries. Product wording, not an accessibility defect." }
  - { id: aria-sort-is-informational, rule: "The 'İlk kayıt' header carries aria-sort=descending (students-table.tsx:263) though no column is sortable; it says the order the API gives (newest first) and nothing can change it. Not a defect." }
  - { id: disabled-link-held-as-it-is, rule: "A pager link that leads nowhere is an <a> with no href, role=link and aria-disabled=true (button.tsx:78-79, :126); a keyboard does not reach it. The graph holds it as the e2e does (students#1 a6, a13)." }
  - { id: label-in-name, rule: "A row's visible text 'Yasakla' is contained in its accessible name 'Yasakla: {name}' (WCAG 2.5.3). Holds." }
  - { id: filters-in-the-address, rule: "The search word, the course, the state and the page are the address (?ara=, ?ders=, ?durum=, ?sayfa=), so a result is a link; a value nobody knows reads as 'all' and never reaches the API as a 400 (students.ts:39-54)." }
