# What must exist for a person who looks for the privacy notice from inside a Medaris app: common.shell.privacyNotice,
# written on 15 Nov 2026 in the format of LAYOUT.md section 7. Each need is what the product must do, from the flow's story
# and from the law the notice is for (KVKK Art. 10); none is read off what the footer does today. Nothing here comes from
# planned.md: no planned feature (P-nn) names this link (MDRS-102 and MDRS-248, which built it, are not in it either).
# The gaps it leaves are reported to the orchestrator, who merges them into graphs/needs.gaps.yaml.
#
# missing (no code; no Linear key searched, so `none`):
#   link-says-it-opens-a-tab (SHL-12, CLS-14, PN-1), notice-found-as-a-landmark-in-nizam (F-P0-5, F-X-13), notice-from-nazar (PN-2)
# unwalked (code, and no e2e or replay walks it):
#   notice-for-a-visitor: the footer for someone not signed in. The replay always signs a person in; the tedris half
#   (the same footer, in the root layout) and nizam's welcome page were read from the served page with curl, not walked
#   (nizamBare has no scenario; see the header of binding.yaml).
# Walked in part: notice-opens-beside-the-page (the replay checks the link's `target` and `rel`, it cannot follow the tab).
kind: needs
flow: common.shell.privacyNotice
status: proposed

needs:
  - id: notice-from-the-footer-of-tedris-and-nizam
    need: >-
      A person who is signed in to Tedris or Nizam finds the link to the privacy notice in the footer of the page they are on,
      whichever page it is, so they never have to leave the app to look for it.
    drawn: [footerBelow, footerInMain, noticeLink]
    built:
      - route: apps/tedris/components/legal-footer/index.tsx:9
      - route: apps/nizam/components/legal-footer/index.tsx:9
      - route: apps/tedris/app/layout.tsx:61
      - route: apps/nizam/app/layout.tsx:54
    walked:
      - e2e: apps/tedris/test/legal-footer.spec.ts
        check: 'legal-footer#4 (Vitest, numbered here by the order of the it()s: the root layout renders the footer; the inventory numbers no spec of this file)'
      - e2e: apps/nizam/test/legal-footer.spec.ts
        check: 'legal-footer#4 (the same spec for nizam)'
      - replay: tedris
      - replay: nizamShell

  - id: notice-for-a-visitor
    need: >-
      A person who has not signed in finds the same link in the footer too: on every page of Tedris, and on Nizam's welcome page,
      where the notice matters most, since a visitor is about to give their data.
    drawn: [footerBelow]
    built:
      - route: apps/tedris/app/layout.tsx:61
      - route: apps/nizam/components/shell/nizam-shell.tsx:52
    walked: [] # none: the replay signs a person in, and nizamBare has no scenario (see the header)

  - id: notice-opens-beside-the-page
    need: >-
      The notice opens in a new tab, so the person keeps the page they were on, and the new tab cannot reach back into it.
    drawn: [footerBelow, footerInMain, noticeLink]
    built:
      - route: apps/tedris/components/legal-footer/index.tsx:15
      - route: apps/nizam/components/legal-footer/index.tsx:15
    walked:
      - e2e: apps/tedris/test/legal-footer.spec.ts
        check: 'legal-footer#1 (Vitest: target _blank and rel noopener noreferrer, text "Aydınlatma Metni")'
      - e2e: apps/nizam/test/legal-footer.spec.ts
        check: 'legal-footer#1 (the same spec for nizam)'
      - replay: tedris # the element is found by target, rel and address and its text is held; the new tab is not followed (an engine limit)
      - replay: nizamShell

  - id: link-says-it-opens-a-tab
    need: >-
      The link tells a person, before they press it, that the notice opens in a new tab: a screen-reader user hears it in the
      link's name, and everyone else is not surprised.
    drawn: [noticeLink]
    missing: none # SHL-12, CLS-14, PN-1; no Linear issue looked up

  - id: notice-found-as-a-landmark-in-nizam
    need: >-
      A person who moves by landmarks finds the footer, and with it the link to the notice, on a page of Nizam's shell as they
      do on a page of Tedris: the footer is a landmark outside the main content, not the last thing inside it.
    drawn: [footerInMain, footer]
    missing: none # F-P0-5, F-X-13: the replay of nizamShell shows no `contentinfo`; no Linear issue looked up

  - id: notice-from-nazar
    need: >-
      A hoca, a nazır or a başmüderris who works in Nazar finds the privacy notice from Nazar's own pages, as the talebe and the
      nazım do in theirs.
    drawn: [noFooter]
    missing: none # PN-2, decision D1; the replay of nazar shows no footer and no link; no Linear issue looked up

  - id: link-leads-to-the-environments-notice
    need: >-
      The link leads to the notice of the environment the app runs in: the development site's notice from a development app,
      the production notice from production, and the production address when no site is configured.
    drawn: [noticeLink]
    built:
      - route: libs/utils/src/privacy-notice.ts:23
      - route: apps/tedris/components/legal-footer/index.tsx:16
    walked:
      - e2e: apps/tedris/test/legal-footer.spec.ts
        check: 'legal-footer#2 (Vitest: LANDING_URL set gives the deployment''s own landing address; unset gives the production one)'
      - e2e: apps/nizam/test/legal-footer.spec.ts
        check: 'legal-footer#2 (the same spec for nizam)'
      - replay: tedris # the link's address is the stack's landing address, {landing}/aydinlatma-metni

  - id: notice-is-published
    need: >-
      The address the link leads to answers with the privacy notice: a person who presses the link is shown the notice and not
      an error.
    drawn: [footerBelow, footerInMain]
    built:
      - route: apps/landing/app/aydinlatma-metni/page.tsx:25
    walked:
      - e2e: apps/landing/test/privacy-notice.spec.ts
        check: 'privacy-notice#19 (landing''s own footer links the same path /aydinlatma-metni; the apps'' links are the same constant)'
      - replay: tedris # the `opensNoticeTab` effect fetches the address after the press and expects HTTP/1.1 200; what the page says is landing.site.readLegal's (start: privacy)
