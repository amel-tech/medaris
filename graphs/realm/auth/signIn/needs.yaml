# What must exist for a person who signs in to a Medaris app: the closed product list of realm.auth.signIn, written on
# 2026-11-15 in the format LAYOUT.md section 7 fixes. Each need is what the product must do, from the flow's story and from
# planned.md, never from what the page does today; a finding the flow touches is a need with `missing: none` where the code
# does not meet it (its id is in the need). A need that nothing walks and a need with no code are the flow's gaps, reported to
# the orchestrator for graphs/needs.gaps.yaml (this flow does not edit it).
kind: needs
flow: realm.auth.signIn
status: proposed

needs:
  - id: sign-in-with-a-name-or-an-address
    need: >-
      A person signs in to tedris, nizam or nazar on one realm page, with the user name or the e-mail address they have and
      their password, and the app takes them on signed in.
    drawn:
      - loginPage
      - submitting
      - finishingRoundTrip
    built:
      - action: medaris.api:startSignIn
      - action: medaris.api:finishSignIn
      - route: apps/keycloak-theme/src/login/pages/Login.tsx:14
    walked:
      - e2e: apps/keycloak-theme/e2e/giris.e2e.ts
        check: 'giris#1'
      - e2e: apps/keycloak-theme/e2e/giris.e2e.ts
        check: 'giris#3'
      - replay: tedrisProtectedPage
      - replay: nizamProtectedPage
      - replay: nazarProtectedPage

  - id: back-to-the-page-they-asked-for
    need: >-
      A person who was sent to sign in by a page that needs a session, or by a Giriş yap link on a page, lands on that page after
      the round trip; one who named none lands on the app's own landing for them.
    drawn:
      - appGate
      - landed_on_asked_page
      - landed_on_role_landing
    built:
      - route: libs/auth/src/server/proxy.ts:198
      - route: libs/auth/src/server/return-to.ts:32
    walked:
      - e2e: apps/tedris/e2e/anonymous.e2e.ts
        check: 'anonymous#8'
      - e2e: apps/tedris/e2e/anonymous.e2e.ts
        check: 'anonymous#9'
      - e2e: apps/nazar/e2e/auth-pages.e2e.ts
        check: 'auth-pages#1'
      - replay: tedrisProtectedPage
      - replay: tedrisSignInLink
      - replay: tedrisSignInPage

  - id: one-wrong-password-one-alert
    need: >-
      A wrong password shows one alert that does not say which of the two was wrong, keeps the user name, empties the password,
      and lets them try again; after ten failures Keycloak pauses the account and says so.
    drawn:
      - loginPageError
    built:
      - route: apps/keycloak-theme/src/login/pages/Login.tsx:41
    walked:
      - e2e: apps/keycloak-theme/e2e/giris.e2e.ts
        check: 'giris#5'
      - replay: tedrisWrongPassword

  - id: remember-me
    need: >-
      A person on their own device can ask to stay signed in: the single sign-on session then lasts 14 days idle and 30 in all, not 5
      and 10 hours.
    drawn:
      - loginPage
    built:
      - route: libs/ui/src/giris/login-form.tsx:113
      - route: config/keycloak/realms/_base.json:10
    walked: []
    missing: none

  - id: one-sign-in-for-the-three-apps
    need: >-
      A person signed in to one Medaris app is not asked for their password again in another while the single sign-on session
      lasts, and a sign-out in one ends the others.
    drawn: []
    built:
      - route: libs/auth/src/server/proxy.ts:173
    walked: []
    missing: none

  - id: the-form-opens-where-they-type
    need: >-
      The form opens with the focus where a keyboard user types (the user name), and a failed attempt moves the focus to the
      alert or the first invalid field (finding K3).
    drawn:
      - loginPage
      - loginPageError
    missing: none

  - id: one-title-for-each-page
    need: >-
      Each page of the round trip has a title of its own in the tab and for a screen reader: the app's sign-in page, the form,
      the error pages (findings K2, SHL-01, F-E-23).
    drawn:
      - loginPage
      - appSignInPage
    missing: none

  - id: the-form-works-without-script
    need: >-
      The form can be read and used without JavaScript, as a native form post allows (finding K19, not in the inventory: the
      page is drawn in the browser from window.kcContext and the server's HTML holds no form).
    drawn:
      - loginPage
    missing: none

  - id: a-language-of-their-own
    need: >-
      The form reads in English and Arabic when the app asks for them (the theme has both catalogs; no app passes them yet), and
      a person who lands on it directly can change the language (finding K12).
    drawn: []
    built:
      - route: apps/keycloak-theme/src/login/i18n.ts:41
    missing: MDRS-202

  - id: a-banned-device-is-refused
    need: >-
      A person who was banned cannot come back under a second account from the same browser: the sign-in refuses the device and
      says so without telling who is banned.
    drawn: []
    missing: MDRS-125

  - id: second-step-with-a-one-time-code
    need: >-
      An account that has set up a one-time code asks for it after the password, and the page for it is in the Medaris theme
      (login-otp.ftl falls to Keycloak's own pages today).
    drawn: []
    missing: MDRS-190
