# The one screen of realm.auth.signIn: Keycloak's login.ftl on the Medaris theme (apps/keycloak-theme/src/login/pages/Login.tsx,
# the form in libs/ui/src/giris/login-form.tsx, the card in auth-card.tsx), as the three web apps' clients meet it. Its words
# are the theme's tr messages, copied with their keys from apps/keycloak-theme/src/login/i18n.ts (the `tr` object); the one
# exception is invalidUserMessage, Keycloak's own message for a wrong user name or password, which the theme does not override
# (keycloakify 11.16.0, messages_defaultSet/tr.js:143). The app's own /auth/signin page (its redirecting line, its button, its
# error box) has the apps' words and is drawn by the navigation graphs; this ui draws none of it.
# The page is drawn by React in the browser from window.kcContext, so it needs JavaScript (no `script` on the page).
# `submitting` draws only what changes while the form is on its way, the busy button and its status line: the rest of the
# card stays as it was, and is not drawn again there.
schema: delurio-graph/0
kind: ui
id: realm.auth.signIn
flow: realm.auth.signIn
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]

