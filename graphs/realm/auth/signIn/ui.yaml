rules:
  - { id: K3, rule: "login.ftl gives no control the initial focus (no autoFocus on the user name field, libs/ui/src/giris/login-form.tsx:78-95), so a keyboard user starts at the top of the document; after a wrong password the page is drawn anew and nothing moves the focus to the alert or to the first invalid field either. login-reset-password.ftl, by contrast, does autofocus. Fix: autoFocus the first invalid field, else the user name." }
  - { id: K2, rule: "Every Keycloak page has the same tab title, Keycloak's 'Medaris adresinde oturum açın' (Template.tsx:57, no page passes documentTitle); the login, register, reset, verify-e-mail, error, logout and consent pages cannot be told apart by title (WCAG 2.4.2). Not a node: the graph cannot draw a title." }
  - { id: K12, rule: "No language control on any Keycloak page: the language is what the app sent (ui_locales and kc_locale, tr from all three apps) or Keycloak's cookie. A person who lands on the form directly cannot change it." }
  - { id: SHL-02, rule: "tedris /auth/signin (the app's page before this form, drawn by tedris.nav, not here): the redirecting state has a status line and a button but no heading (auth-entry.tsx:111-123)." }
  - { id: F-P0-2, rule: "nizam /auth/signin: a bare section with no main landmark (features/auth/auth-entry.tsx:90,111)." }
  - { id: SHL-01, rule: "tedris, nazar (F-E-23): the app's /auth/signin has the app's name as its tab title (no generateMetadata), the same as every other page without one." }
  - { id: no-javascript, rule: "The form is drawn by React in the browser from window.kcContext; with JavaScript off the page is empty (src/main.tsx:17-24). Once drawn, the form is native (method=post), and the browser's own required check stops an empty submission." }
  - { id: aria-pressed-and-type, rule: "The reveal button keeps one name and toggles aria-pressed; the input's type switches between password and text (giris.e2e#4). Neither has a word in the graph." }
