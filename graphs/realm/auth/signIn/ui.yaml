  logoTedris: { type: text, component: Text, role: img, name: { literal: "Medaris — Tedris" }, in: [loginPage, loginPageError], when: "app == 'tedris'", source: libs/ui/src/mds/logo.tsx:52 } # the client id names the app (app-of-client.ts:9)
