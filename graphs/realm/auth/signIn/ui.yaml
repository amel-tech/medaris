  loginTitle: { type: text, component: Heading, role: heading, text: { key: loginAccountTitle }, in: [loginPage, loginPageError], source: libs/ui/src/giris/auth-card.tsx:54 } # the one h1, id kc-page-title
  loginSubtitle: { type: text, component: Text, text: { key: loginAccountSubtitle }, in: [loginPage, loginPageError], source: apps/keycloak-theme/src/login/pages/Login.tsx:67 }
