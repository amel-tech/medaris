# The screens of realm.auth.signOut: the confirmation page of tedris (apps/tedris/features/auth/sign-out-confirm.tsx), of nizam
# (apps/nizam/features/auth/sign-out-confirm.tsx) and of nazar (apps/nazar/features/auth/sign-out-confirm.tsx), the busy button of
# nazar's direct sign-out (apps/nazar/features/account/components/sign-out-button.tsx), and Keycloak's fallback page
# logout-confirm.ftl on the Medaris theme (apps/keycloak-theme/src/login/pages/LogoutConfirm.tsx, with LogoutConfirmForm in
# libs/ui/src/giris/message-screen.tsx and the card in auth-card.tsx).
# The catalog is one file for three apps whose words differ, so a key is the whole next-intl path, namespace first, and not the
# path under one file's root: `tedris.Auth.signOutTitle` ("Çıkış yapılsın mı?") and `nazar.Auth.signOutTitle` ("Çıkış yapmak
# istiyor musunuz?") would otherwise be one key. Nizam's are `nizam.SignOutPage.*`, tedris's Hesap sentence
# `tedrisAccount.AccountProfile.signOutText` (the namespace its useAccountTranslations reads). Keycloak's four keep the key the
# theme gives them (apps/keycloak-theme/src/login/i18n.ts, the `tr` object, lines 300-303). No message is authored here: the
# `changes` note is the sentence tedris's Hesap shows beside its sign-out button.
# Everything is drawn from the code. The page of tedris sits in the app's legacy `<main>` with the top bar over it (drawn by
# tedris.shell.frame); the pages of nizam and nazar have no chrome (nizam: isBarePath, nazar: frame none). In `signingOut` only what
# changes while the form is on its way is drawn: the busy button, its status line and, in tedris and nizam, the disabled "Vazgeç".
