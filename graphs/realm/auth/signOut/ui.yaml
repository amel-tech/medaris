rules:
  - { id: SHL-13, rule: "tedris: if `signOut` throws, the button silently becomes pressable again and the error goes only to the console (apps/tedris/features/auth/sign-out-confirm.tsx:26-35); the graph draws it as FORM_NOT_SENT. Nizam (sign-out-confirm.tsx:28-31) and nazar (sign-out-confirm.tsx:22-25, sign-out-button.tsx:26-29) do not catch it at all: the busy state stays and nothing is said. Fix: an Alert tone=error with a retry text, in all three." }
  - { id: F-E-18, rule: "nazar: the page the graph calls confirmPage is reached only by typing /auth/signout (lib/auth.ts:45 registers only pages.signIn, and nothing links to it). The two real 'Çıkış yap' buttons, on Hesap (features/account/components/account-page.tsx:186) and on the no-access page (features/access/no-access-page.tsx:50), post at once, so tedris and nizam ask and nazar does not. e2e auth-pages#3 asserts the unlinked page. Fix: link it, or delete it and update auth-pages#3 (decision D1)." }
  - { id: SHL-01, rule: "tedris /auth/signout: no generateMetadata (app/auth/signout/page.tsx), so the tab title is the app's name, the same as sign-in and register (WCAG 2.4.2). Not a node: the graph cannot draw a title. Fix: a title from Auth.signOutConfirm." }
  - { id: F-E-23, rule: "nazar /auth/signout: no generateMetadata, the tab title is 'Medaris Nazar' (app/auth/signout/page.tsx), as on sign-in, the 404 and the error screen. Fix: a title from nazar.Auth.signOutTitle." }
  - { id: F-P0-3, rule: "nizam /auth/signout and the signed-out root: no generateMetadata, the tab title is 'Nizam' while the h1 says 'Çıkış yapılsın mı?' (app/auth/signout/page.tsx). Fix: a title from SignOutPage.title." }
  - { id: K2, rule: "Keycloak's logout-confirm.ftl passes no documentTitle (Template.tsx:57), so its tab title is the sign-in title 'Medaris adresinde oturum açın' (WCAG 2.4.2). Fix: pass documentTitle with logoutConfirmTitle." }
  - { id: focus-not-set, rule: "None of the four pages gives a control the initial focus: tedris, nizam and nazar draw the card and leave the focus at the top of the document (no autoFocus in the three sign-out-confirm.tsx; nizam's FocusHeading is used on other pages, not on this one), and Keycloak's page has none either. A keyboard user lands before the logo and tabs to 'Çıkış yap'. Fix: focus the h1 or the confirm button on mount." }
  - { id: MDRS-222, rule: "Answered in the code: signOut sends id_token_hint and post_logout_redirect_uri (libs/auth/src/server/routes.ts:397-402), so Keycloak shows neither its English default page nor its 'Uygulamaya Dön' link while the store can be read. What remains is the fallback page for an unreadable store, now themed and Turkish (LogoutConfirm.tsx), whose 'Vazgeç' goes to the client's base URL: that client setting is Keycloak's configuration (config/keycloak/clients), right in the three local clients and not read in production." }
  - { id: SOUT-1, rule: "nazar: while the sign-out is on its way, 'Vazgeç' stays a live link to / (apps/nazar/features/auth/sign-out-confirm.tsx:39, no disabled), where tedris (sign-out-confirm.tsx:73) and nizam (sign-out-confirm.tsx:62) disable theirs. A press then starts a second navigation while the form post is in flight and the browser follows the last one to finish, so the person may end on / with the app's session removed and Keycloak's end-session never visited, and no word said (not walked). Fix: disable it while busy, as the others do." }
  - { id: SOUT-2, rule: "The three confirmation pages say the same thing in different words and only two of them say what stays: tedris and nizam 'Bu tarayıcıda Medaris’ten çıkarsın.' (second person singular), nazar 'Bu tarayıcıda Medaris’ten çıkarsınız. Görevleriniz ve tercihleriniz hesabınızda kalır.' (plural), and nazar's title is 'Çıkış yapmak istiyor musunuz?' where the others have 'Çıkış yapılsın mı?', which is also Keycloak's own title (logoutConfirmTitle). Hesap's sentence in tedris adds 'Derslerin ve tercihlerin hesabında kalır.' but the page where the choice is made does not. Not a defect in itself; a wording question for the design (canvas medaris/16)." }
  - { id: SOUT-3, rule: "tedris: /auth/signout is public, so a person whose session ended before they pressed the link meets it as a visitor, with the visitor's top bar, and that bar's 'Giriş yap' carries callbackUrl=/auth/signout (seen: href /auth/signin?callbackUrl=%2Fauth%2Fsignout). Signing in from there ends on the 'Çıkış yapılsın mı?' page again, asking the person who has just signed in whether to sign out. The graph draws only the page itself (`session: gone`). Fix: a visitor has nothing to sign out of: send the page to /discover, or leave callbackUrl off on this page." }
  - { id: SOUT-4, rule: "tedris /auth/signout: the app's top bar (the logo link, the 'Ana menü' navigation, the theme button, Bildirimler and Hesabım) is drawn inside the legacy <main data-legacy-main> (components/tab-view/index.tsx:87, PhoneChrome is a child of it), so the page has no banner landmark and its navigation sits inside main; the footer is outside it (aria snapshot of the page on 2026-11-15, not in the inventory). The same wrapper holds the other /auth pages. The graph draws the card, which is the flow's, and leaves the bar to tedris.shell.frame. Fix: mount the bar outside the wrapper, or let these pages own their main as the ownsItsMain pages do." }
