# What must exist for a person who signs out of a Medaris app: the closed product list of realm.auth.signOut, written on
# 2026-11-15 in the format LAYOUT.md section 7 fixes. Each need is what the product must do, from the flow's story, never from
# what the pages do today; a finding the flow touches is a need with `missing: none` where the code does not meet it (its id
# is in the need).
# Missing (no code, or code that does not meet the need; no Linear key yet): tell-the-person-when-sign-out-cannot-start,
#   nazar-asks-before-signing-out, a-sign-out-page-has-its-own-title, focus-starts-on-the-question, nothing-cancels-a-sign-out-in-flight
# Not walked by a replay on the local stack (the e2e checks named are the only walk): other-apps-learn-at-once (no Valkey,
#   and Keycloak's call to the apps is refused on this stack), keycloak-asks-when-it-has-no-hint (needs a session store that
#   cannot be read), cancel-keeps-the-session (the replay's CANCEL transitions are for the next walk phase),
#   sign-out-when-the-session-already-ended (scenario tedrisNoSession is bound and was not walked)
kind: needs
flow: realm.auth.signOut
status: proposed

needs:
  - id: ask-before-signing-out
    need: >-
      A person who presses "Çıkış yap" on Hesap in tedris or nizam is asked once, on a page of its own with a way back, before
      anything ends; nothing signs them out on a plain GET or on another site's say-so.
    drawn:
      - confirmPage
    built:
      - route: apps/tedris/features/auth/sign-out-confirm.tsx:19
      - route: apps/nizam/features/auth/sign-out-confirm.tsx:21
      - action: medaris.api:signOut
    walked:
      - e2e: apps/tedris/e2e/system-pages.e2e.ts
        check: 'system-pages#1'
      - e2e: apps/nizam/e2e/shell.e2e.ts
        check: 'shell#3'
      - e2e: apps/nizam/e2e/account.e2e.ts
        check: 'account#6'
      - replay: tedrisFromHesap
      - replay: nizamFromHesap

  - id: cancel-keeps-the-session
    need: >-
      "Vazgeç" leaves the person signed in and takes them back to the page they came from (to the app's home when there is
      none, and in nazar to their own landing); while a sign-out is on its way it cannot be pressed.
    drawn:
      - confirmPage
      - kept_session.previous_page
      - kept_session.home
      - kept_session.landing
    built:
      - route: apps/tedris/features/auth/sign-out-confirm.tsx:39
      - route: apps/nizam/features/auth/sign-out-confirm.tsx:32
      - route: apps/nazar/features/auth/sign-out-confirm.tsx:39
    walked:
      - e2e: apps/tedris/e2e/system-pages.e2e.ts
        check: 'system-pages#1'
      - e2e: apps/nizam/e2e/shell.e2e.ts
        check: 'shell#3'
      - e2e: apps/nazar/e2e/auth-pages.e2e.ts
        check: 'auth-pages#3'

  - id: end-the-session-here-and-at-keycloak
    need: >-
      Confirming ends the app's own session and Keycloak's single sign-on session, with no page of Keycloak's in between, so
      that the next sign-in asks for the password again, and the browser comes back to the app in the person's language.
    drawn:
      - signingOut
      - endingAtKeycloak
    built:
      - action: medaris.api:signOut
      - route: libs/auth/src/server/routes.ts:351
      - route: libs/auth/src/client/sign-out.ts:41
    walked:
      - e2e: apps/tedris/e2e/system-pages.e2e.ts
        check: 'system-pages#1'
      - e2e: apps/tedris/e2e/profile.e2e.ts
        check: 'profile#3'
      - e2e: apps/nizam/e2e/account.e2e.ts
        check: 'account#6'
      - e2e: apps/nazar/e2e/account.e2e.ts
        check: 'account#7'
      - replay: tedrisFromHesap
      - replay: nizamFromHesap
      - replay: nazarDirectButton

  - id: land-on-a-page-that-works-for-a-visitor
    need: >-
      After signing out the person lands where a signed-out person can act: tedris's Keşfet, nizam's "Hoş geldiniz" with a way
      to sign in, and in nazar, which has no public page, Keycloak's login form.
    drawn:
      - atAppRoot
      - signed_out.discover
      - signed_out.welcome
      - handed_over.sign_in
    built:
      - route: apps/tedris/app/page.tsx:13
      - route: apps/nizam/app/(home)/page.tsx:23
      - route: apps/nazar/app/page.tsx:13
    walked:
      - e2e: apps/nizam/e2e/shell.e2e.ts
        check: 'shell#3'
      - e2e: apps/nazar/e2e/account.e2e.ts
        check: 'account#7'
      - replay: tedrisFromHesap
      - replay: nizamFromHesap
      - replay: nazarDirectButton

  - id: sign-out-when-the-session-already-ended
    need: >-
      A person who presses "Çıkış yap" after their session has ended (in another tab, or by expiry) is signed out cleanly and
      lands on the visitor's page, with nothing sent to Keycloak.
    drawn:
      - start
      - signingOut
      - atAppRoot
    built:
      - route: libs/auth/src/server/routes.ts:386
    walked: []

  - id: other-apps-learn-at-once
    need: >-
      When a person signs out of one app, Keycloak tells every other app that holds a session under the same single sign-on
      session, and each ends it at once, not within a minute; a call that fails never stops the person's own sign-out.
    drawn:
      - tellingApps
    built:
      - action: medaris.api:receiveBackchannelLogout
      - route: libs/auth/src/server/routes.ts:463
    walked:
      - e2e: libs/auth/test/valkey-store.e2e.spec.ts
        check: 'valkey-store#4'
      - e2e: libs/auth/test/valkey-store.e2e.spec.ts
        check: 'valkey-store#5'

  - id: keycloak-asks-when-it-has-no-hint
    need: >-
      When the app cannot send the ID token (its session store cannot be read), Keycloak asks first, on a page in the Medaris
      theme and in the person's language, and neither choice leaves the person half signed out without knowing.
    drawn:
      - keycloakAsks
    built:
      - route: apps/keycloak-theme/src/login/pages/LogoutConfirm.tsx:11
    walked:
      - e2e: apps/keycloak-theme/e2e/giris.e2e.ts
        check: 'giris#15'

  - id: tell-the-person-when-sign-out-cannot-start
    need: >-
      If the sign-out cannot start (SHL-13), the person is told in words and can press again; today tedris puts the error in
      the console only and nizam and nazar do not catch it.
    drawn:
      - signingOut
    missing: none

  - id: nazar-asks-before-signing-out
    need: >-
      Nazar asks before it signs out, as tedris and nizam do (F-E-18, decision D1): its two "Çıkış yap" buttons lead to the
      confirmation page it already has, and the page is no longer reachable only by its address.
    drawn:
      - start
      - confirmPage
    missing: none

  - id: a-sign-out-page-has-its-own-title
    need: >-
      Each page of this flow, the three confirmation pages and Keycloak's, has a tab title that says what it is (SHL-01, F-E-23,
      F-P0-3, K2), not the app's name or "sign in".
    drawn:
      - confirmPage
      - keycloakAsks
    missing: none

  - id: focus-starts-on-the-question
    need: >-
      When a confirmation page opens, the keyboard focus is on its title or on its confirm button, so a keyboard or
      screen-reader user does not start before the logo (focus-not-set).
    drawn:
      - confirmPage
      - keycloakAsks
    missing: none

  - id: nothing-cancels-a-sign-out-in-flight
    need: >-
      While a sign-out is on its way, nothing on the page can start another navigation: nazar's "Vazgeç" is disabled as
      tedris's and nizam's are (SOUT-1).
    drawn:
      - signingOut
    missing: none
