rules:
  - { id: K1, rule: "libs/ui/src/giris/register-form.tsx:119-124 with use-form-state.ts:22-30: useFocusFirstInvalid(form, checked) depends on the `checked` object, and every change calls touch(), which makes a new object, so the effect runs again on every keystroke and focuses the first control that is still aria-invalid. Measured here in Chromium on 15 Nov 2026 (the inventory had it only in happy-dom): after the empty press the focus is on Ad; one character typed into Ad moves it to Soyad, the next to the first radio. A keyboard user cannot type a name. Fix: focus only on a failed press (a counter as the effect's dependency), plus one run on load for the server's reasons." }
  - { id: REG-1, rule: "new: register.ftl and login-verify-email.ftl give no control the initial focus (measured: document.activeElement is the body on both, and on the two info pages); a keyboard user starts at the top of the document. login.ftl has the same finding (K3); login-reset-password.ftl, by contrast, does autofocus. Fix: autoFocus Ad on the form, and the first way on (the resend link, or the h1) on the verification page." }
  - { id: REG-2, rule: "new: the reasons under the fields are `.mds-error` spans wired to their control through aria-describedby and aria-invalid (Base UI Field, libs/ui/src/mds/field.tsx:50-52), not live regions and not role=alert. After a failed press only the first invalid control takes the focus, so only its reason is read; the other five and the box's are met only by moving through the form. Not tested in a screen reader. Fix: an error summary with role=alert that links to each field, or a live region that says how many fields need attention." }
  - { id: REG-3, rule: "new: PasswordField draws its rule list only while the password has no reason of its own (libs/ui/src/giris/password-field.tsx:145). After a press with the password empty, too short or equal to the e-mail the three rules disappear and the one reason replaces them; the person who needs the rules most no longer sees them, and the list comes back when the field is edited. Fix: keep the rules under the reason." }
  - { id: REG-4, rule: "new: Keycloak answers a taken user name with 'Kullanıcı adı zaten var.' and a taken address with 'Bu e-posta zaten var.' under the field (realm: duplicateEmailsAllowed false, config/keycloak/realms/_base.json:7), so anyone can learn from the registration form whether a user name or an e-mail address has an account. Stock Keycloak behaviour; a product decision on enumeration, not a bug of this repository. Measured on the stack: both answers, the fields kept, the passwords emptied, the focus on the invalid field." }
  - { id: REG-5, rule: "new: the verification page offers 'Yeniden gönder' at once, and Keycloak refuses it for the first 30 seconds with an alert 'Doğrulama e-postasını tekrar göndermeden önce {n} saniye beklemelisiniz.' (measured: 28 seconds, no second mail). The alert does not take the focus, the number is a snapshot and not a countdown, and the link is a GET that acts (K14). After the 30 seconds the same link sends a second mail and shows the page as it was." }
  - { id: REG-6, rule: "new: a link opened in another browser first shows a confirmation page (info.ftl, 'E-posta adresi doğrulaması', 'Devam et'), then 'E-posta adresi doğrulandı' with 'Medaris’e devam et', whose address is tedris's base address (measured: the pages and the href; the click on it was not walked, and that this browser then has no session is inferred from the way the round trip is tied to the browser that began it). The page that waits in the browser that registered has no script and no poll (LoginVerifyEmail.tsx), so by the code it cannot notice; the person who verified on their phone must go back and reload it or sign in (not observed). In the same browser the link signs the person in with no page of Keycloak's in between (measured)." }
  - { id: K2, rule: "Every Keycloak page has the same tab title, Keycloak's 'Medaris adresinde oturum açın' (Template.tsx:57; measured on the form, the verification page and the info pages): the form, the verification page and the info pages cannot be told apart by title (WCAG 2.4.2). Not a node: the graph cannot draw a title." }
  - { id: K4, rule: "login-verify-email.ftl still uses the old kit and raw text-gray-* classes (LoginVerifyEmail.tsx:41-48), not the design system the form and the info pages use: its look, spacing and dark/RTL behaviour differ." }
  - { id: K8, rule: "The password rules change as the person types (a tick, ', karşılandı') with no live region (password-field.tsx:35-57), so a screen-reader user hears the state only when the field is focused again. Not tested in a screen reader." }
  - { id: K10, rule: "The copy mixes 'sen' and 'siz' inside this one flow: the form says 'Hesabını oluştur', the next page 'E-posta adresinizi doğrulayın' and 'Bağlantıyı açın', the info pages 'sen' again, the mail 'siz'." }
  - { id: K11, rule: "The terms checkbox (termsAccepted, Register.tsx:131-140) has no required marker; the realm does not ask for it, so it is not drawn here." }
  - { id: K13, rule: "The privacy link is the production address https://medaris.app/aydinlatma-metni on every environment, the stack included (config/keycloak/user-profile.json:66, measured as the link's href). Landing serves the same page at its own address." }
  - { id: K14, rule: "'Yeniden gönder' is a GET link that acts (stock Keycloak behaviour), and the verification page has no way to correct a mistyped address or to go back to sign-in." }
  - { id: no-javascript, rule: "The form is drawn by React in the browser from window.kcContext; with JavaScript off the page is empty (src/main.tsx:17-24). Once drawn, the form is native (method=post) and its own checks run in the browser first (noValidate)." }
  - { id: aria-pressed-and-type, rule: "Each reveal button keeps one name and toggles aria-pressed while the input's type switches between password and text; neither has a word in the graph." }
