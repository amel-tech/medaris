# The screens of realm.auth.register: Keycloak's register.ftl on the Medaris theme (apps/keycloak-theme/src/login/pages/Register.tsx,
# the form in libs/ui/src/giris/register-form.tsx and profile-field.tsx, the card in auth-card.tsx, the fields from
# apps/keycloak-theme/src/login/profile-fields.tsx and the realm's user profile, config/keycloak/user-profile.json), then
# login-verify-email.ftl (LoginVerifyEmail.tsx) and, for a link opened in another browser, info.ftl twice (Info.tsx), as the
# tedris client meets them. Read and measured in Chromium on the local stack on 15 Nov 2026.
#
# Where the words come from (catalog/tr.json, copied by script, letter for letter):
#   - the theme's own Turkish messages, apps/keycloak-theme/src/login/i18n.ts (the `tr` object): the form, the rules, the reasons, the
#     verification page, emailVerifiedMessage and backToApplication;
#   - keycloakify's default Turkish messages (messages_defaultSet/tr.js): firstName "Ad" and lastName "Soyad";
#   - Keycloak 26.6.3's base login theme (theme/base/login/messages/messages_tr.properties in the keycloak-themes jar), which the
#     server answers with: usernameExistsMessage, emailExistsMessage, verifyEmailMessage, emailVerifySendCooldown,
#     confirmEmailAddressVerification(Header) and emailVerifiedMessageHeader;
#   - composed.Register.privacyNoticeLabel: the label of the privacy box, which the code builds by putting the link's text in the
#     place of {0} in privacyNoticeRead ("{0}’ni okudum.", components/linkedOptionLabel.tsx:46-62), so "Aydınlatma Metni’ni okudum.";
#   - Changes.note: the one key written for this flow (the format asks every flow that writes something for one), from what the
#     code and the realm do: the account is made, the mail is sent, and the realm holds the account until the link is opened.
# The page is drawn by React in the browser from window.kcContext, so it needs JavaScript (no `script`). The app's own /auth/register
# page (its redirecting line and button) is drawn by tedris's navigation graph, not here. The words of the pages Keycloak makes with
# a placeholder ({0}) have one sample here, the address of the account the walk makes; the replay matches such a text by any value.
schema: delurio-graph/0
kind: ui
id: realm.auth.register
flow: realm.auth.register
status: captured
catalog: catalog/tr.json
locales: [tr]
samples: { "0": "defne.kayitli@medaris.test" }
changes: { key: Changes.note }

