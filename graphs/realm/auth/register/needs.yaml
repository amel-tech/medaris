schema: delurio-graph/0
kind: needs
id: realm.auth.register
status: proposed
summary: >-
  Each need is what the product must do, from the flow's story and from planned.md, never from what the page does today; a finding
  the flow touches is a need with `missing: none` where the code does not meet it (its id is in the need).

# The writer's notes of 15-16 Nov 2026, from the 0.8.0 shape of this file (`drawn`, `built`, `walked`; a need that was
# built and walked by no e2e and no replay was called `unwalked`). Converted to SPEC.md §13 on 16 Nov 2026 by script.
#
# missing (no code; `missing: none` is a finding the code does not meet, a Linear key is planned work):
# focus-stays-while-typing (K1), form-opens-where-they-type (REG-1), reasons-are-announced (REG-2),
# password-rules-stay-and-are-announced (REG-3, K8), accounts-are-not-enumerated (REG-4), resend-is-offered-when-it-works (REG-5, K14),
# verify-in-another-browser-ends-signed-in (REG-6), one-title-for-each-page (K2), one-way-of-speaking (K10),
# a-mistyped-address-can-be-corrected (K14), change-of-address-mail (MDRS-188), terms-and-consent-at-registration (MDRS-191)
# unwalked (code, and no e2e check or replay scenario passed it): resend-the-mail, taken-address-under-the-field (the address half),
# an-expired-form-is-explained, the-mismatched-passwords-are-refused (giris#8 only, in Storybook), the-sign-in-form-leads-here (giris#1
# only sees the link; nothing walks it), and the last step of link-in-another-browser (verifiedPage to tedris's front door, no replay)
# replay scenarios that passed (15 Nov 2026, under the replay lock): registered (main), userNameTaken (--to userNameRefused),
# otherDevice (--to verifiedPage), pendingEmail (--to verifyEmailPage)

needs:
  - id: register-with-every-attribute
    need: >-
      A visitor makes an account by giving a first name, a last name, a gender, a user name, an e-mail address, a password typed
      twice and the tick that they have read the privacy notice, and is asked for nothing else at registration.
    evidence:
      - state: registerForm
      - state: formFilled
      - state: submitting
      - source: libs/auth/src/server/routes.ts:146
      - source: apps/keycloak-theme/src/login/pages/Register.tsx:97
      - source: config/keycloak/user-profile.json:4
      - test: apps/keycloak-theme/e2e/giris.e2e.ts
        name: "the rules update as the password is typed and read ', karşılandı'"
      - test: apps/keycloak-theme/e2e/giris.e2e.ts
        name: "a valid form posts every field, gender and privacy box included"
      - scenario: registered

  - id: the-form-opens-from-tedris
    need: >-
      "Kayıt ol" on the public site and on Keşfet's invitation opens the registration form, not the sign-in form, and the form's
      own link back to sign-in works.
    evidence:
      - state: appRegisterPage
      - state: startingRoundTrip
      - state: registerForm
      - source: apps/tedris/app/auth/register/page.tsx:15
      - source: libs/auth/src/server/routes.ts:146
      - test: apps/tedris/e2e/anonymous.e2e.ts
        name: "sends 'kayıt ol' to Keycloak's registration form"
      - scenario: registered

  - id: gender-is-always-required
    need: >-
      No account is made without a gender, woman or man, so that the separate seats for women and men can always be counted. The
      form lists it as missing when it is left, and the realm's profile requires it of the user. (tedrisat's own profile column is
      still nullable, user-profile.schema.ts:11,33: the realm is where it is enforced today.)
    evidence:
      - node: genderGroup
      - node: genderFemale
      - node: genderMale
      - node: genderReason
      - state: formWithReasons
      - source: config/keycloak/user-profile.json:26
      - source: libs/ui/src/giris/profile-field.tsx:134
      - test: apps/keycloak-theme/e2e/giris.e2e.ts
        name: "an invalid submission posts nothing and writes the reasons under the fields"
      - test: apps/keycloak-theme/e2e/giris.e2e.ts
        name: "a valid form posts every field, gender and privacy box included"
      - scenario: registered

  - id: privacy-notice-is-read-before-registering
    need: >-
      The person ticks that they have read the privacy notice before the account is made; the notice is one link away and opens in
      a new tab so the half-filled form stays; the account keeps the tick.
    evidence:
      - node: privacyNotice
      - node: privacyLink
      - node: noticeReason
      - source: apps/keycloak-theme/src/login/components/linkedOptionLabel.tsx:54
      - source: config/keycloak/user-profile.json:60
      - test: apps/keycloak-theme/e2e/giris.e2e.ts
        name: "an invalid submission posts nothing and writes the reasons under the fields"
      - test: apps/keycloak-theme/e2e/giris.e2e.ts
        name: "a valid form posts every field, gender and privacy box included"
      - test: apps/keycloak-theme/e2e/giris.e2e.ts
        name: "the privacy notice link opens in a new tab"
      - scenario: registered

  - id: what-is-missing-is-listed
    need: >-
      A press with something missing posts nothing, writes the reason under each field that needs one, and puts the focus on the
      first of them; a second password that differs says so under itself.
    evidence:
      - state: formWithReasons
      - state: formWithMismatch
      - source: libs/ui/src/giris/register-form.tsx:138
      - test: apps/keycloak-theme/e2e/giris.e2e.ts
        name: "an invalid submission posts nothing and writes the reasons under the fields"
      - scenario: registered

  - id: the-mismatched-passwords-are-refused
    need: >-
      A second password that differs from the first is refused before anything is sent, under the second field, with the focus
      there.
    evidence:
      - state: formMismatched
      - state: formWithMismatch
      - node: mismatchReason
      - source: libs/ui/src/giris/register-form.tsx:170
      - test: apps/keycloak-theme/e2e/giris.e2e.ts
        name: "an invalid submission posts nothing and writes the reasons under the fields"

  - id: password-rules-are-shown-as-typed
    need: >-
      The three rules of the realm's password policy (length 10, not the address, not the user name) are listed under the password
      and show which are met as the person types.
    evidence:
      - node: passwordRules
      - node: ruleLength
      - node: ruleNotEmail
      - node: ruleNotUsername
      - source: libs/ui/src/giris/password-field.tsx:33
      - source: config/keycloak/realms/_base.json:20
      - test: apps/keycloak-theme/e2e/giris.e2e.ts
        name: "the rules update as the password is typed and read ', karşılandı'"
      - scenario: registered

  - id: taken-name-is-refused-under-the-field
    need: >-
      A user name or an e-mail address another account has is refused by Keycloak under its own field, with the rest of the form
      kept (the passwords emptied) and the focus on that field.
    evidence:
      - state: userNameRefused
      - state: emailRefused
      - node: userNameTakenReason
      - node: emailTakenReason
      - source: libs/ui/src/giris/register-form.tsx:180
      - source: config/keycloak/realms/_base.json:7
      - scenario: userNameTaken

  - id: taken-address-under-the-field
    need: "The e-mail half of the same refusal: the address another account has is refused under E-posta."
    evidence:
      - state: emailRefused
      - node: emailTakenReason
      - source: config/keycloak/realms/_base.json:7

  - id: verification-mail-is-sent
    need: >-
      Registering sends one mail to the address, in the person's language, with a button that verifies it; the account cannot sign
      in before the link is opened.
    evidence:
      - state: verifyEmailPage
      - source: config/keycloak/realms/_base.json:5
      - source: apps/keycloak-theme/src/email/messages/messages_tr.properties:9
      - test: apps/keycloak-theme/test/email.e2e.spec.ts
      - scenario: registered
    note: email.e2e.spec.ts email.e2e.spec#1

  - id: resend-the-mail
    need: >-
      A person whose mail did not come can have it sent again; Keycloak sends no second mail within 30 seconds and says to wait.
    evidence:
      - state: verifyEmailPage
      - state: resendWait
      - source: apps/keycloak-theme/src/login/pages/LoginVerifyEmail.tsx:35

  - id: link-verifies-and-signs-in-the-same-browser
    need: >-
      The mail's link, opened in the browser that registered, verifies the address and lands the person on tedris's home page,
      signed in, with no page in between.
    evidence:
      - state: finishingRoundTrip
      - state: home_opened.registered
      - source: libs/auth/src/server/routes.ts:277
      - scenario: registered

  - id: link-in-another-browser
    need: The mail's link opened in another browser or on another device verifies the address after one confirmation, and says so.
    evidence:
      - state: confirmPage
      - state: verifiedPage
      - source: apps/keycloak-theme/src/login/pages/Info.tsx:84
      - test: apps/keycloak-theme/e2e/giris.e2e.ts
        name: "info shows the verified title and one way on"
      - scenario: otherDevice

  - id: unverified-sign-in-is-held-on-this-page
    need: >-
      A person who signs in with an account whose address was never verified is held on the verification page, is sent the mail
      again, and cannot reach the app before the link is opened.
    evidence:
      - state: signingIn
      - state: verifyEmailPage
      - source: config/keycloak/realms/_base.json:5
      - source: apps/keycloak-theme/src/login/pages/LoginVerifyEmail.tsx:22
      - scenario: pendingEmail

  - id: an-expired-form-is-explained
    need: >-
      A registration form whose code has gone stale says so and offers a way to start again (realm.auth.signInFailures draws the
      page).
    evidence:
      - state: handed_over.page_expired
      - source: apps/keycloak-theme/src/login/pages/LoginPageExpired.tsx:1

  - id: the-sign-in-form-leads-here
    need: >-
      The link "Kayıt ol" on Keycloak's sign-in form opens the same registration form inside the round trip that is already open.
    evidence:
      - state: openApp
      - state: registerForm
      - source: apps/keycloak-theme/src/login/pages/Login.tsx:72
      - test: apps/keycloak-theme/e2e/giris.e2e.ts
        name: "shows the canvas texts and the two links"

  - id: focus-stays-while-typing
    need: >-
      The focus stays where the person types after a failed press (finding K1: it moves on at every keystroke, measured in
      Chromium).
    missing: no Linear issue; K1
    note: |-
      Drawn on the state formWithReasons, which the code has: they are not evidence, so that a replay still walks them (SPEC.md
      §13 leaves out what only missing needs name).
      ---- findings: what the code does not meet ----

  - id: form-opens-where-they-type
    need: The form opens with the focus on its first field, and the verification page on its first way on (finding REG-1).
    missing: no Linear issue; REG-1
    note: >-
      Drawn on the states registerForm and verifyEmailPage, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: reasons-are-announced
    need: Every reason a failed press writes is announced to a screen reader, not only the first field's (finding REG-2).
    missing: no Linear issue; REG-2
    note: >-
      Drawn on the state formWithReasons, which the code has: they are not evidence, so that a replay still walks them (SPEC.md
      §13 leaves out what only missing needs name).

  - id: password-rules-stay-and-are-announced
    need: The password rules stay under a reason, and a rule that becomes met is announced (findings REG-3, K8).
    missing: no Linear issue; REG-3, K8
    note: >-
      Drawn on the state formWithReasons and on the node passwordRules, which the code has: they are not evidence, so that a
      replay still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: accounts-are-not-enumerated
    need: >-
      The registration form does not tell a stranger whether a user name or an address has an account (finding REG-4; a decision
      for the owner, because the stock answer is what lets a person who has forgotten they registered find out).
    missing: no Linear issue; REG-4
    note: >-
      Drawn on the states userNameRefused and emailRefused, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: resend-is-offered-when-it-works
    need: The verification page offers a resend only when it will send, or shows the wait as it runs (findings REG-5, K14).
    missing: no Linear issue; REG-5, K14
    note: >-
      Drawn on the states verifyEmailPage and resendWait, which the code has: they are not evidence, so that a replay still walks
      them (SPEC.md §13 leaves out what only missing needs name).

  - id: verify-in-another-browser-ends-signed-in
    need: >-
      A person who verifies the address on their phone is not left to sign in again from tedris's front door, and the browser that
      registered notices (finding REG-6).
    missing: no Linear issue; REG-6
    note: >-
      Drawn on the states verifiedPage and home_opened.signed_out, which the code has: they are not evidence, so that a replay
      still walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: a-mistyped-address-can-be-corrected
    need: A person who mistyped the address can change it on the verification page, or go back to sign-in (finding K14).
    missing: no Linear issue; K14
    note: >-
      Drawn on the state verifyEmailPage, which the code has: they are not evidence, so that a replay still walks them (SPEC.md
      §13 leaves out what only missing needs name).

  - id: one-title-for-each-page
    need: Each page of the registration has a title of its own in the tab and for a screen reader (finding K2).
    missing: no Linear issue; K2
    note: >-
      Drawn on the states registerForm and verifyEmailPage, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: one-way-of-speaking
    need: >-
      The form, the verification page, the info pages and the mail address the person in one way, not "sen" and "siz" by turns
      (finding K10).
    missing: no Linear issue; K10
    note: >-
      Drawn on the states registerForm and verifyEmailPage, which the code has: they are not evidence, so that a replay still
      walks them (SPEC.md §13 leaves out what only missing needs name).

  - id: change-of-address-mail
    need: >-
      A person who changes the address of their account gets the same kind of verification mail and page, in their language (P-30,
      SMTP-backed account flows; the verification and the reset mails exist, the change does not).
    missing: MDRS-188
    note: |-
      Drawn on the state verifyEmailPage, which the code has: they are not evidence, so that a replay still walks them (SPEC.md
      §13 leaves out what only missing needs name).
      ---- planned ----

  - id: terms-and-consent-at-registration
    need: >-
      The person accepts the terms of use at registration and the acceptance is kept with a date (P-32; the terms box is in the
      form's code and the realm does not ask for it, K11, K15).
    missing: MDRS-191; findings K11
    note: >-
      Drawn on the state registerForm, which the code has: they are not evidence, so that a replay still walks them (SPEC.md §13
      leaves out what only missing needs name).
