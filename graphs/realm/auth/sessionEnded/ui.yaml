# The screens of realm.auth.sessionEnded: the two pages of tedris the talebe has open when the session ends, and nothing else. A celse
# page (apps/tedris/features/courses/components/session-page.tsx) with its Notlarım panel (lesson-notes.tsx), Keşfet
# (discover-page.tsx) before and after the reload, and the top bar of both (components/phone-menu/desktop-bar.tsx) as far as the
# flow presses it. Everything else on those pages is another flow's (tedris.learn.notes, tedris.discover.browse, tedris.shell.frame).
# Keycloak's form and the app's sign-in page are realm.auth.signIn's; the exits here have no screen.
# The words are copied with their keys from libs/i18n/src/locales/tr/tedris.json (DiscoverPage.title, PhoneMenu.*) and
# tedris-learn.json (LessonNotes.*), root removed. The one message that is not the app's is Changes.note: the app has no message
# for what an ended session does to a note, and a graph never leaves `changes` out where a write is invoked, so one short factual
# Turkish sentence was written for it (calibration note: see the report).
# While the session is over the page is drawn exactly as it was (staleSession shows what pageOpen shows). The busy state of the button
# (`saving`) is drawn from the kit and is not walked: the Server Action answers before a replay could look at it.
schema: delurio-graph/0
kind: ui
id: realm.auth.sessionEnded
flow: realm.auth.sessionEnded
status: captured
kit: ../../../kit
catalog: catalog/tr.json
locales: [tr]
changes: { key: Changes.note }

nodes:
  # a celse of a course the talebe is enrolled in (protected): the page and its Notlarım panel
  celsePage: { type: page, component: Page, role: main, in: [pageOpen, staleSession, saving], when: "page == 'protectedPage'", source: apps/tedris/features/courses/components/session-page.tsx:337 }
  notesPanel: { type: page, component: Page, role: region, name: { labelledBy: notesTitle }, in: [pageOpen, staleSession, saving], when: "page == 'protectedPage'", source: apps/tedris/features/courses/components/lesson-notes.tsx:154 }
  notesTitle: { type: text, component: Heading, role: heading, text: { key: LessonNotes.title }, in: [pageOpen, staleSession, saving], when: "page == 'protectedPage'", source: apps/tedris/features/courses/components/lesson-notes.tsx:160 } # h2, with a note icon
  noteBody: { type: field, component: TextField, role: textbox, text: { key: LessonNotes.bodyLabel }, value: { literal: "" }, in: [pageOpen, staleSession, saving], when: "page == 'protectedPage'", source: apps/tedris/features/courses/components/lesson-notes.tsx:242 } # a Textarea named by aria-label, not a visible label; its words are not kept anywhere
  addNote: { type: action, component: Button, role: button, intent: confirm, text: { key: LessonNotes.add }, in: [pageOpen, staleSession], when: "page == 'protectedPage'", emits: ADD_NOTE, source: apps/tedris/features/courses/components/lesson-notes.tsx:407 } # type=submit of the note form
  addNoteBusy: { type: action, component: Button, role: button, text: { key: LessonNotes.add }, in: [saving], when: "page == 'protectedPage'", disabledIn: [saving], source: libs/ui/src/mds/button.tsx:127 } # aria-busy and aria-disabled, never disabled
  savingStatus: { type: status, component: Status, role: status, text: { key: LessonNotes.saving }, in: [saving], when: "page == 'protectedPage'", source: libs/ui/src/mds/button.tsx:113 } # a visually hidden <output> beside the button

  # Keşfet (public): the same page before the end and after the reload, for a visitor
  discoverPage: { type: page, component: Page, role: main, in: [pageOpen, staleSession, visitorPage], when: "page == 'publicPage'", source: apps/tedris/features/discover/components/discover-page.tsx:97 }
  discoverTitle: { type: text, component: Heading, role: heading, text: { key: DiscoverPage.title }, in: [pageOpen, staleSession, visitorPage], when: "page == 'publicPage'", source: apps/tedris/features/discover/components/discover-page.tsx:99 } # the one h1

  # the top bar at 768 and up (the phone bar has the same entries behind its menu): the signed-in bar before the page learns, the visitor's after
  coursesLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: PhoneMenu.courses }, in: [pageOpen, staleSession, saving], emits: FOLLOW_LINK, source: apps/tedris/components/phone-menu/desktop-bar.tsx:73 } # in the nav "Ana menü"; a link to /my-courses, which is protected
  signInLink: { type: action, component: LinkButton, role: link, intent: secondary, text: { key: PhoneMenu.signIn }, in: [visitorPage], emits: SIGN_IN, source: apps/tedris/components/phone-menu/desktop-bar.tsx:103 } # href /auth/signin?callbackUrl=%2Fdiscover

edges:
  - { labelledBy: [notesPanel, notesTitle] }
  - { triggers: [addNote, saving] }
  - { triggers: [signInLink, handed_over.sign_in_link] }

rules:
  - { id: WRT-13, rule: "No draft is kept anywhere: a note typed in Notlarım and not saved is lost when the session ended, because sendToSignIn leaves the page (a full navigation to /api/auth/signin, lesson-notes.tsx:340, apps/tedris/lib/send-to-sign-in.ts:25) and the callback loads the celse page anew. There is no warning before, and no message after: the field is empty when they come back. The questions and homework panels do the same (lesson-questions.tsx:136, session-homework.tsx:996). Fix: keep the draft per celse in sessionStorage and offer it back, or say so before leaving." }
  - { id: SESSION-1, rule: "A person who comes back to a stale tab learns nothing from the page: it keeps the signed-in bar and the typed text until the tab is shown again (the SessionProvider reads at most every 5 s and not while the tab is hidden, session-context.ts:118-125), and then it reloads without a word. A visitor page that replaces a signed-in one gives no sign that they were signed out (visitorPage), and a protected page goes to the sign-in page whose first line is Giriş sayfasına yönlendiriliyorsunuz…, not that the session ended. Fix: a line on the sign-in page (and the visitor bar) that says the session ended, when the callback names a page." }
  - { id: SESSION-2, rule: "With the session in the cookie (no Valkey: local, and any deploy with WEB__AUTH_STORE_URL unset) the end is noticed by the proxy only when it next asks Keycloak, at most once a minute (renewal.ts:196-205); back-channel logout is answered 501 (routes.ts:508). In that minute a write still saves with the access token the page holds (valid up to five minutes, tedrisat checks it locally), so a person who signed out elsewhere can still write, and one who is signed out of Medaris in another tab is not signed out of this one for up to a minute. Behaviour documented in the code (MDRS-210), not a defect; recorded here so that the walk lets a minute pass. Locally Keycloak's back-channel call does not arrive at all (KC-SERVICES0057: Connect to host.docker.internal:4000 failed: Connection refused), which the stack's notes call a 501; the answer is the same for the person." }
  - { id: focus-not-set, rule: "Neither page sets an initial focus (no autoFocus and no .focus() in session-page.tsx, lesson-notes.tsx or discover-page.tsx), so after the reload the focus is at the top of the document, and after a failed write the focus is lost with the page. Not drawn." }
  - { id: F-E-21, rule: "nazar (not drawn here; nazar.notifications.inbox): when the mark-read action finds the session over, handleUnauthenticated starts the sign-in redirect and `open` then still calls openAddress(href), overriding it (notifications-list.tsx:139-140). Fix: return early when the read reports the session over." }
