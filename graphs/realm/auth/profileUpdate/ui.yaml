rules:
  - { id: K7, rule: "'Kaydet ve devam et' is natively disabled until every required answer is given (LoginUpdateProfile.tsx:77-83): it cannot be focused, and nothing near it says what is missing. The field that is missing carries Keycloak's generic 'Lütfen bu alanı doldurun.' under it from the first render (UserProfileFormFields.tsx:84; looked at in a browser, the box is marked invalid), but that line is no live region and nothing moves the focus to it, so a screen-reader person who tabs to the button finds it off and hears no reason. For a box to tick the generic 'fill in this field' is also the wrong sentence: 'Devam etmek için metni okuduğunu onayla.' (privacyNoticeRequired, requiredError of profile-field.tsx:68) was written for it, and is only read by the registration form's submit try (register-form.tsx:150). Fix: keep the button on and write the reasons when it is pressed, as RegisterForm does, or at least announce the line and name the box's own sentence." }
  - { id: PROFILE-3, rule: "Taking the tick out of the box and leaving it gives the line '1 en az 1, en fazla {2} değer içermelidir.' under the box (looked at in a browser, 15 Nov 2026): the message is the theme's error-invalid-multivalued-size ('{0} en az {1}, en fazla {2} değer içermelidir.', i18n.ts tr), a check for a field with several values that keycloakify applies to this single-option box; its placeholders are not filled as the message expects, so '{0}', where a field's name belongs, got a '1' and '{2}' is printed as it is. The same box's missing-tick line on arrival is the right generic one. Fix: do not let a single-option box fall to the multivalued-size check, or give the theme's own required-box sentence for it (profile-fields.tsx:267 builds requiredError and the profile page does not use it)." }
  - { id: PROFILE-1, rule: "login-update-profile.ftl gives no control the initial focus (looked at in a browser: the active element is the body on arrival, from sign-in and from Hesap; no field has autoFocus, profile-field.tsx:268-301, and nothing in LoginUpdateProfile.tsx focuses one), so a keyboard person starts at the top of the document, and when the save button comes on nothing says so. The same gap as K3 on login.ftl; login-reset-password.ftl and the new-password page do autofocus. Fix: autoFocus the first field that is missing, else the first one. The graph draws no initialFocus." }
  - { id: K2, rule: "Every Keycloak page has the same tab title, Keycloak's 'Medaris adresinde oturum açın' (Template.tsx:57, no page passes documentTitle; looked at in a browser on this page): it cannot be told from the login, registration, reset or consent pages by its title (WCAG 2.4.2). Not a node: the graph cannot draw a title." }
  - { id: PROFILE-2, rule: "'Kaydet ve devam et' has no busy state (LoginUpdateProfile.tsx:77-84 passes no `loading`, and the page has no form-state hook), unlike login.ftl, register.ftl and the new-password page, whose buttons turn aria-busy with a hidden status line: while the post is on its way the page looks as it did and a second press can post again. Read from the code; not looked at in a browser (the post is a navigation the replay cannot look into). Fix: use the same form-state hook as the other three." }
  - { id: K13, rule: "The link of 'Aydınlatma Metni'ni okudum.' is the production address https://medaris.app/aydinlatma-metni on every environment, the local one included (config/keycloak/user-profile.json:66; looked at in a browser: the link's href), so on the local stack it leaves the machine. It opens in a new tab and says so in a hidden line." }
  - { id: ACC-09, rule: "The link that starts this flow from Hesap ('Değiştir' or 'Ekle', apps/tedris/features/account/components/account-settings.tsx:87) has no name that says what it changes beside the word. It belongs to tedris.account.profile; it is listed here because it is the way into the 'account' entry." }
  - { id: no-username-field, rule: "The inventory (keycloak-theme.md 4.5) and the theme draw a read-only user name with the line 'Salt okunur; buradan değiştirilemez.' (readOnlyHelp, profile-fields.tsx:225), but the page Keycloak sends has no username among its attributes (kcContext.profile.attributesByName: firstName, lastName, gender, email, privacyNoticeRead; looked at in a browser), so the line is dead on this page. Not a defect for the person; the message is unused here." }
  - { id: no-javascript, rule: "The page is drawn by React in the browser from window.kcContext; with JavaScript off it is empty (src/main.tsx:17-24). Once drawn, the form is native (method=post), and the save button needs the hook's answer to switch on." }
