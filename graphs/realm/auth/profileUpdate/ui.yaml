# The one screen of realm.auth.profileUpdate: Keycloak's login-update-profile.ftl on the Medaris theme
# (apps/keycloak-theme/src/login/pages/LoginUpdateProfile.tsx, the fields in libs/ui/src/giris/profile-field.tsx drawn from the
# realm's user profile, config/keycloak/user-profile.json, the card in libs/ui/src/giris/auth-card.tsx). Its words are the theme's
# tr messages, copied with their keys from apps/keycloak-theme/src/login/i18n.ts (the `tr` object); `firstName` ("Ad") and
# `lastName` ("Soyad") are Keycloak's own tr messages, which the theme does not override (keycloakify 11.16.0,
# messages_defaultSet/tr.js:56 and :59). The one message that is not copied is Changes.note: the app has no sentence that tells the
# person what saving changes, so one short factual one is authored here.
# The page is drawn by React in the browser from window.kcContext, so it needs JavaScript (no `script` on the page).
# The fields are the realm's profile, so a field added to the profile appears here with no page change (profile-fields.tsx:5); this
# graph draws the five the page gets today (firstName, lastName, gender, email, privacyNoticeRead: Keycloak leaves the user name
# out, and the theme's read-only line for it, readOnlyHelp, is never shown). Each holds the account's own value, which the graph
# does not state. What the page does was looked at in a browser on 15 Nov 2026 (a probe of the sign-in entry with the seed's
# PENDING_PROFILE and of the account entry with TALEBE, neither pressing save); the gender line of the sign-in entry was not.
# The logo and the app's name under it (from the client id) are drawn by realm.auth.signIn; the graph does not know the app here.
