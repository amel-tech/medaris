rules:
  - { id: SHL-03, rule: "tedris: when the automatic round trip fails the redirecting <output> is replaced by the error box (a SystemState with no role=alert and no status): the change is silent and the focus, if it was on 'Devam et', is lost (auth-entry.tsx:85-109). Fix: role=alert on the box, or move the focus to its h1 when it replaces the redirecting state." }
  - { id: F-E-1, rule: "nazar: the same swap with no role=alert, no live region and no focus move (auth-entry.tsx:81,88-108); a screen-reader user hears 'Giriş sayfasına yönlendiriliyorsunuz' and then nothing. Fix: role=alert on the box, or focus its h1." }
  - { id: F-P0-1, rule: "nizam: the same silent swap, no role=alert and no focus move (auth-entry.tsx:90-110). Fix: role=alert on the section, or focus its h1." }
  - { id: F-P0-2, rule: "nizam: /auth/signin has no <main> landmark; the box is a bare <section> and the shell draws nothing around /auth/* (auth-entry.tsx:90,111). The ui has no page node for it. Fix: wrap it in <main>, as SignOutConfirm does." }
  - { id: F-P0-19, rule: "nizam: 'Tekrar dene' and 'Ana sayfaya dön' use the shadcn Button, not the unified mds/button used elsewhere (auth-entry.tsx:100-104); visual only." }
  - { id: SHL-01, rule: "tedris: the tab title of /auth/signin is the app's name, 'Medaris Tedris', in every state (no generateMetadata). F-E-23: nazar's is 'Medaris Nazar'. F-P0-3: nizam's is 'Nizam', while the h1 says 'Giriş yapılamadı' (WCAG 2.4.2). Not a node: the graph cannot draw a title." }
  - { id: F-E-2, rule: "nazar e2e auth-pages#2 a5 expects a 'Tekrar dene' button for ?error=AccessDenied; the code draws none for a final code (auth-entry.tsx:96, auth-error.ts:54-62) and the unit spec pins the same. The e2e is stale; this graph carries the code's behaviour, not a5." }
  - { id: focus-not-set, rule: "No box and no Keycloak page here moves the focus: the three apps' boxes (auth-entry.tsx) set none, and login.ftl, login-page-expired.ftl and error.ftl have no autoFocus (K3), so no page node carries initialFocus and no state a focus." }
  - { id: K2, rule: "Every Keycloak page has the same tab title, 'Medaris adresinde oturum açın' (Template.tsx:57, no page passes documentTitle): the form, the expired page and the error page cannot be told apart by title (WCAG 2.4.2). Not a node." }
  - { id: K3, rule: "login.ftl gives no control the initial focus (libs/ui/src/giris/login-form.tsx:78-95), so after a refusal a keyboard user starts at the top of the document and the alert, which role=alert may not announce on a freshly loaded page, is not focused. Fix: autoFocus the first invalid field, else the alert or the user name." }
  - { id: K10, rule: "The Turkish copy mixes 'sen' and 'siz': the theme's own pages say 'sen' (error.ftl, login-page-expired.ftl), while the two refusal messages here and Keycloak's 'Eylem süresi doldu. Lütfen şimdi giriş yapmaya devam edin.' are keycloakify's defaults, written in 'siz' (messages_defaultSet/tr.js:145-148), and the app boxes differ again (tedris 'sen', nizam and nazar 'siz')." }
  - { id: SIF-1, rule: "The pause comes after two wrong passwords less than a second apart, not only after ten: the realm sets quickLoginCheckMilliSeconds 1000 and minimumQuickLoginWaitSeconds 60 (config/keycloak/realms/_base.json:16-17), and two posts 1 s apart gave failedLoginNotBefore +60 s (measured on the local stack). A script, a password manager that retries, or a double submit through a slow network can pause an account for a minute; the message says nothing of how long. Fix: say 'bir dakika' (or the real wait) in the message, or lower the quick-login check." }
  - { id: SIF-2, rule: "Both refusal messages send the person to 'yönetici' ('yönetici ile iletişime geçin', 'yöneticiyle iletişime geçin veya daha sonra tekrar deneyin') and the page names nobody and links nowhere: the card has no contact address or link (landing has /iletisim and selam@medaris.app). A talebe cannot know who the yönetici is. Fix: link the message to landing's contact page, or name the address." }
  - { id: SIF-3, rule: "The paused-account text is given to anyone who types the account's address, whatever the password (the same attempt on an unknown address says 'Geçersiz kullanıcı adı veya şifre.'), so the form tells a stranger the account exists; the switched-off text needs the right password and tells whoever has it. Both are the realm's brute-force and enabled-user behaviour (bruteForceProtected, config/keycloak/realms/_base.json:12), not the theme's. Observed on the local stack (probed with a throwaway user)." }
  - { id: SIF-4, rule: "nazar: for a refused account (AccessDenied) the box's only way out, 'Ana sayfaya dön', goes to /, which nazar's gate sends to /auth/signin?callbackUrl=%2F, which starts a new round trip by itself (the first hop was observed on the local stack: it ends on Keycloak's form). The link says 'home'; it is the same sign-in again. Fix: link to a public page, or name the button for what it does." }
  - { id: SIF-5, rule: "error.ftl's link says 'Giriş sayfasına dön' (back to the sign-in page) but goes to the client's base address (http://localhost:4000 in the local realm: tedris's front door, then /discover), or to Keycloak's restart address when no client is known; a visitor in tedris or nizam lands on a public page and has to find 'Giriş yap' again (ErrorPage.tsx:27,47). Observed on the local stack (the href, not a click on the unknown-client link). Fix: point it at the app's /auth/signin." }
  - { id: SIF-6, rule: "tedris: the header drawn around the error box offers 'Giriş yap' with href /auth/signin?callbackUrl=%2Fauth%2Fsignin, a callback that is the sign-in page itself (observed with ?error=AccessDenied on the local stack; what happens after signing in through it was not walked). Fix: drop callbackUrl when the current page is /auth/signin." }
