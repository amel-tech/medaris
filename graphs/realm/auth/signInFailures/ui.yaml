# The screens of realm.auth.signInFailures: the error box of the three apps' /auth/signin page (features/auth/auth-entry.tsx in
# apps/tedris, apps/nizam and apps/nazar), Keycloak's login form as it answers a switched-off or a paused account
# (apps/keycloak-theme/src/login/pages/Login.tsx, Template.tsx, the form in libs/ui/src/giris/login-form.tsx, the card in
# auth-card.tsx), and Keycloak's page-expired and error pages (LoginPageExpired.tsx, ErrorPage.tsx, message-screen.tsx).
#
# The words. The three apps' words are copied with their keys from libs/i18n/src/locales/tr/{tedris,nizam,nazar}.json and carry the
# app's name as a prefix (`tedris.Auth.errorTitle`) because the three files use the same keys with different words. The Keycloak
# theme's words are copied with their keys from apps/keycloak-theme/src/login/i18n.ts (the `tr` object). Two messages are
# Keycloak's own, which the theme does not override: accountDisabledMessage and accountTemporarilyDisabledMessage (keycloakify
# 11.16.0, login/i18n/messages_defaultSet/tr.js:145-146). There is no Changes.note: the flow invokes only a read (getAuthSession),
# and a refusal or a box changes nothing.
#
# What is not drawn. The app's redirecting state (a status line and "Devam et") is drawn by the navigation graphs. The page of the
# three apps' box and the Keycloak pages need JavaScript (the box is React; the theme draws from window.kcContext). `submitting`
# draws only what changes while the form is on its way, as in realm.auth.signIn.
schema: delurio-graph/0
kind: ui
id: realm.auth.signInFailures
flow: realm.auth.signInFailures
status: captured
catalog: catalog/tr.json
locales: [tr]

