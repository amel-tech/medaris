  - several köşks of one nazım (the scope picker) and the badge counts on menu items
  - the language menu and the theme switch (they stay on the page; since MDRS-248 the language is a cookie and no address has a locale)
  - "API refusals of pages no persona-level rule decides: only the köşk pages, the course pages, the archive and the four platform pages above carry the rule of the API or of the page"
  - what the dashboards draw when a list is empty, and the retry states when a read fails (a failed read shows the page, not a refusal)
  - filters, pagers, dialogs and tabs inside a page, which stay on the same page; what follows a hide or a delete inside a dialog
  - the hop to Keycloak when a visitor signs in, links to files and the notification rows other than the köşk ban
