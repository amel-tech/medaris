# Navigation graph of Nizam, the Medaris platform's admin app: the hand-written half.
# The pages, the menus (one registry, cut by the role of whoever is signed in), the pages a visitor may open and the gates that name
# the person's own roles are generated into nav.extracted.yaml from the application source
# (`node src/cli.ts extract <this dir> --repo <medaris checkout>`); this file holds what no source file says: who the users are,
# where "/" sends them, the links and buttons inside pages, goals, and overrides of single page fields.
# Every `source:` is relative to the Medaris repository root, read at ce47fce8.
extends: nav.extracted.yaml
kind: nav
schema: delurio-graph/0
id: medaris-nizam
title: Nizam
status: proposed
locale: tr
catalog: catalog/tr.json

extract:
  adapter: nizam
  names:
    "/": start
    "/arsiv": archive
    "/auth/signin": signin
    "/auth/signout": signout
    "/ayarlar/ortak-uygulamalar": partners
    "/ayarlar/platform": platformSettings
    # a menu entry with no route (lib/shell-nav.ts): a `missing` page
    "/ayarlar/youtube": youtube
    "/bildirimler": notifications
    "/decks": decks
    "/decks/{id}/cards": deckCards
    "/denetim-kaydi": auditLog
    "/hesap": account
    "/izin-gruplari": grants
    "/kosks": kosks
    "/kosks/{id}": kosk
    "/kosks/{id}/ana-sayfa": koskHome
    "/kosks/{id}/arsiv": koskArchive
    "/kosks/{id}/ayarlar": koskSettings
    "/kosks/{id}/ayarlar/barindirma": koskHosting
    "/kosks/{id}/ayarlar/nazimlar": koskNazims
    "/kosks/{id}/basvurular": koskApplications
    "/kosks/{id}/courses/new": courseNew
    "/kosks/{id}/courses/{courseId}": course
    "/kosks/{id}/courses/{courseId}/ayarlar": courseSettings
    "/kosks/{id}/courses/{courseId}/curriculum": courseCurriculum
    "/kosks/{id}/courses/{courseId}/edit": courseEdit
    "/kosks/{id}/courses/{courseId}/sessions": courseSessions
    "/kosks/{id}/courses/{courseId}/sessions/new": courseSessionNew
    "/kosks/{id}/courses/{courseId}/students": courseStudents
    "/kosks/{id}/ders-talepleri": koskCourseRequests
    "/kosks/{id}/dersler": koskCourses
    "/kosks/{id}/desteler": koskDecks
    "/kosks/{id}/desteler/yeni": koskDeckNew
    "/kosks/{id}/izinler": koskPermissions
    "/kosks/{id}/yasaklamalar": koskBans
    "/medaris-nazimlari": nazims
    "/medreseler": madrasahs
    "/nazar-yonlendirme": nazarRedirect
    "/pasif-kapsamlar": inactive
    "/talepler/deste-yayin-istekleri": deckRequests
    # menu entries with no route (lib/shell-nav.ts): `missing` pages
    "/talepler/itirazlar": appeals
    "/talepler/kalici-yasak": permanentBans
    "/talepler/kosk-basvurulari": platformKoskApplications
    "/yasaklamalar": bans
    "/yetki-yok": noRole
  locales: [tr, en]

summary: >-
  Where each kind of Nizam user lands, what the sidebar offers them, which entries lead to a page that does not exist,
  and where the menu, the links inside pages and the API disagree about who may go where.

source:
  repo: amel-tech/medaris
  app: apps/nizam
  menu: apps/nizam/lib/shell-nav.ts
  locales: libs/i18n/src/locales/{locale}/nizam.json

frames:
  shell:
    title: Inside Nizam (the sidebar of a signed-in person)
    menu: Sidebar
  bare:
    title: Sign-in and sign-out (no shell)
  elsewhere:
    title: Other applications, and addresses no application answers

facts:
  signedIn:
    values: [true, false]
    say: whether the person has a session
  landing:
    values: [nizam, nazar, none]
    say: where landingFor puts a signed-in person (apps/nizam/features/assignments/landing.ts:21); only meaningful when signedIn
  variant:
    values: [chief, medaris, kosk, none]
    say: which menu the shell draws (apps/nizam/lib/shell-nav.ts:28, shellVariant); the widest role wins
  teaches:
    values: [true, false]
    say: holds MUDERRIS in some course, which is what makes Hesap offer Nazar (apps/nizam/features/account/components/account-page.tsx:121)
  held:
    of:
      - platform.madrasah_create
      - platform.head_muderris_manage
      - platform.madrasah_edit
      - platform.kosk_create
      - platform.kosk_nazim_manage
      - platform.kosk_edit
      - platform.hosting_grant
      - platform.kosk_application_decide
      - platform.deck_publish
      - platform.appeal_decide
      - platform.ban_account
      - platform.ban_scoped
      - platform.audit_read
      - platform.inactive_scopes_manage
      - platform.youtube_manage
      - platform.policy_edit
      - platform.partner_manage
    say: the platform permissions a Medaris nazımı holds; the menu is cut by them for that variant only

# A Medaris nazımı holds nothing until it is granted (libs/common/src/authz/permissions.ts:352, ROLE_DEFAULT_PERMISSIONS).
sets:
  everything:
    - platform.madrasah_create
    - platform.head_muderris_manage
    - platform.madrasah_edit
    - platform.kosk_create
    - platform.kosk_nazim_manage
    - platform.kosk_edit
    - platform.hosting_grant
    - platform.kosk_application_decide
    - platform.deck_publish
    - platform.appeal_decide
    - platform.ban_account
    - platform.ban_scoped
    - platform.audit_read
    - platform.inactive_scopes_manage
    - platform.youtube_manage
    - platform.policy_edit
    - platform.partner_manage

guards:
  managesPlatform: "variant == 'chief' or variant == 'medaris'"
  # whom /kosks/{id} shows the management view (apps/nizam/features/kosks/kosk-entry.ts:56-60)
  koskManagementView: "variant == 'chief' or (variant == 'medaris' and 'platform.kosk_edit' in held)"
  # whom tedrisat lets read a köşk's nazımlar and course roster: KOSK_MANAGE (the köşk nazımı's), platform.kosk_edit, the başnazım
  # (apps/tedrisat/src/kosk/kosk-admin.controller.ts:298, 235); the köşk settings, its Nazımlar tab and its Dersler page open on that read
  readsKosk: "variant == 'chief' or variant == 'kosk' or (variant == 'medaris' and 'platform.kosk_edit' in held)"
  # the başnazım or the köşk's own nazımı (apps/nizam/features/kosks/kosk-abilities.ts:55)
  managesKosk: "variant == 'chief' or variant == 'kosk'"

personas:
  visitor:
    title: Visitor
    say: has no session; Nizam shows a welcome page with the language menu and a sign-in button, and no shell
    facts: { signedIn: false, landing: none, variant: none, teaches: false, held: [] }
  chief:
    title: Medaris başnazımı
    say: the realm's SYSTEM_ADMIN; gets the widest menu, unfiltered
    facts: { signedIn: true, landing: nizam, variant: chief, teaches: false, held: [] }
  medarisAll:
    title: Medaris nazımı with every permission
    say: a Medaris nazımı who has been granted every platform permission
    facts: { signedIn: true, landing: nizam, variant: medaris, teaches: false, held: everything }
  medarisReviewer:
    title: Medaris nazımı who reviews requests
    say: a Medaris nazımı granted only the permissions to decide köşk applications and publish decks
    facts: { signedIn: true, landing: nizam, variant: medaris, teaches: false, held: [platform.kosk_application_decide, platform.deck_publish] }
  medarisKoskEditor:
    title: Medaris nazımı who hides and restores köşks
    say: a Medaris nazımı granted only platform.kosk_edit, which opens a köşk's management view (MDRS-143)
    facts: { signedIn: true, landing: nizam, variant: medaris, teaches: false, held: [platform.kosk_edit] }
  medarisBare:
    title: Medaris nazımı with no grants yet
    say: a Medaris nazımı who has been given the role and no permission, which is how every one starts
    facts: { signedIn: true, landing: nizam, variant: medaris, teaches: false, held: [] }
  kosk:
    title: Köşk nazımı
    say: manages one köşk; "/" sends them to its Ana sayfa
    facts: { signedIn: true, landing: nizam, variant: kosk, teaches: false, held: [] }
  nazarOnly:
    title: Müderris, no Nizam role
    say: teaches a course and holds no role of Nizam's
    facts: { signedIn: true, landing: nazar, variant: none, teaches: true, held: [] }
  noRole:
    title: Signed in, no role
    say: has an account and no role at all
    facts: { signedIn: true, landing: none, variant: none, teaches: false, held: [] }

# Overrides and additions to the generated pages. `nazar` and `tedris` are other applications. The extractor reads only the gates that
# name the person's own roles; where a link or a menu entry leads to a page whose API answer is decided by a platform permission or a
# role, the page's opensFor is written here from that API rule.
pages:
  nazar:
    route: Nazar
    title: Nazar
    kind: external
    frame: elsewhere
  tedris:
    route: Tedris
    title: Tedris
    kind: external
    frame: elsewhere
  offHost:
    route: "//talepler/…, //pasif-kapsamlar, //yasaklamalar, //kosks, //medreseler"
    title: an address on another host
    kind: missing
    frame: elsewhere
    evidence: >-
      features/dashboard/components/medaris-home.tsx:49 sets base to "/", so every `${base}/…` link of the Medaris home page starts
      with "//" and the browser reads it as another host (https://talepler/…)
  tedrisSession:
    route: "Tedris /courses/{id}/sessions/{id}"
    title: a session address Tedris does not have
    kind: missing
    frame: elsewhere
    evidence: features/courses/components/sessions-view.tsx:291 links it; Tedris has /courses/{courseId}/lessons/{lessonId} and no /sessions/ route (apps/tedris/app/courses/[courseId]/lessons/[lessonId]/page.tsx)
  archive:
    opensFor: "signedIn and variant == 'chief'"
    refusal: answers 403 (Bu bölüm için izniniz yok) to anyone but the başnazım
    evidence: apps/nizam/app/arsiv/page.tsx:26 calls forbidden() when tedrisat refuses; apps/tedrisat/src/archive/archive.service.ts:510 serves the platform archive to SYSTEM_ADMIN alone
  kosk:
    opensFor: "signedIn and landing == 'nizam' and (variant != 'medaris' or 'platform.kosk_edit' in held or 'platform.hosting_grant' in held)"
    refusal: answers 403 to anyone else, and to a Medaris nazımı who holds neither platform.kosk_edit nor platform.hosting_grant
    evidence: app/kosks/layout.tsx:20 (landingFor !== "nizam"); features/kosks/kosk-entry.ts:56-62 and app/kosks/[id]/page.tsx:54 (the entry rule)
  koskCourses:
    opensFor: "signedIn and landing == 'nizam' and readsKosk"
    refusal: answers 403 to anyone else
    evidence: app/kosks/[id]/dersler/page.tsx:43; GET /kosks/:id/course-roster needs KOSK_MANAGE or platform.kosk_edit (apps/tedrisat/src/kosk/kosk-admin.controller.ts:235)
  koskSettings:
    opensFor: "signedIn and landing == 'nizam' and readsKosk"
    refusal: answers 403 to anyone else
    evidence: app/kosks/[id]/ayarlar/page.tsx:41; GET /kosks/:id/nazims needs KOSK_MANAGE or platform.kosk_edit (apps/tedrisat/src/kosk/kosk-admin.controller.ts:298)
  koskNazims:
    opensFor: "signedIn and landing == 'nizam' and readsKosk"
    refusal: answers 403 to anyone else
    evidence: app/kosks/[id]/ayarlar/nazimlar/page.tsx:36; GET /kosks/:id/nazims (apps/tedrisat/src/kosk/kosk-admin.controller.ts:298)
  koskHosting:
    opensFor: "signedIn and landing == 'nizam' and (variant != 'medaris' or 'platform.hosting_grant' in held)"
    refusal: answers 403 to anyone else, and to a Medaris nazımı without platform.hosting_grant
    evidence: app/kosks/[id]/ayarlar/barindirma/page.tsx:41; GET /kosks/:id/hosting-rights needs kosk.hosting or platform.hosting_grant (apps/tedrisat/src/hosting/hosting.controller.ts:73)
  koskApplications:
    opensFor: "signedIn and landing == 'nizam' and variant != 'medaris'"
    refusal: answers 403 to anyone else, and to every Medaris nazımı
    evidence: app/kosks/[id]/basvurular/page.tsx:35; GET /kosks/:koskId/enrollments/pending needs course.manage_all in the köşk (apps/tedrisat/src/course/course.controller.ts:522), which no platform permission gives
  courseNew:
    opensFor: "signedIn and landing == 'nizam' and managesKosk"
    refusal: answers 403 to anyone but the başnazım and the köşk's own nazımı
    evidence: app/kosks/[id]/courses/new/page.tsx:35 (koskAbilities(me, kosk).openCourse)
  course:
    opensFor: "signedIn and landing == 'nizam' and variant != 'medaris'"
    refusal: answers 403 unless the person holds course.staff_read in the course, which no platform permission gives
    evidence: app/kosks/[id]/courses/[courseId]/page.tsx:49; GET /courses/:id/stats needs course.staff_read (apps/tedrisat/src/course/course.controller.ts:542)
  # the course's own pages open on readCourseScope: the başnazım, the köşk's nazımı or the course's müderris (mayEditCourse)
  courseCurriculum:
    opensFor: "signedIn and landing == 'nizam' and (managesKosk or teaches)"
    refusal: answers 403 to anyone but the başnazım, the köşk's nazımı and the course's müderris, so to every Medaris nazımı
    evidence: app/kosks/[id]/courses/[courseId]/curriculum/page.tsx:31; features/courses/reads.ts:48 (mayEditCourse, features/kosks/kosk-abilities.ts:69)
  courseSettings:
    opensFor: "signedIn and landing == 'nizam' and (managesKosk or teaches)"
    refusal: answers 403 to anyone but the başnazım, the köşk's nazımı and the course's müderris, so to every Medaris nazımı
    evidence: app/kosks/[id]/courses/[courseId]/ayarlar/page.tsx:35; features/courses/reads.ts:48 (mayEditCourse)
  courseSessions:
    opensFor: "signedIn and landing == 'nizam' and (managesKosk or teaches)"
    refusal: answers 403 to anyone but the başnazım, the köşk's nazımı and the course's müderris, so to every Medaris nazımı
    evidence: app/kosks/[id]/courses/[courseId]/sessions/page.tsx:38; features/courses/reads.ts:48 (mayEditCourse)
  courseSessionNew:
    opensFor: "signedIn and landing == 'nizam' and (managesKosk or teaches)"
    refusal: answers 403 to anyone but the başnazım, the köşk's nazımı and the course's müderris, so to every Medaris nazımı
    evidence: app/kosks/[id]/courses/[courseId]/sessions/new/page.tsx:28; features/courses/reads.ts:48 (mayEditCourse)
  auditLog:
    opensFor: "signedIn and (variant == 'chief' or (variant == 'medaris' and 'platform.audit_read' in held))"
    refusal: answers 403 to anyone else
    evidence: app/denetim-kaydi/page.tsx:31; apps/tedrisat/src/audit/audit.service.ts:97 asks platform.audit_read
  platformSettings:
    opensFor: "signedIn and (variant == 'chief' or (variant == 'medaris' and 'platform.policy_edit' in held))"
    refusal: answers 403 to anyone else
    evidence: app/ayarlar/platform/page.tsx:24; apps/tedrisat/src/platform-policy/platform-policy.service.ts:72 asks platform.policy_edit
  partners:
    opensFor: "signedIn and (variant == 'chief' or (variant == 'medaris' and 'platform.partner_manage' in held))"
    refusal: answers 403 to anyone else
    evidence: app/ayarlar/ortak-uygulamalar/page.tsx:23; apps/tedrisat/src/integration/partner-admin.service.ts:48 asks platform.partner_manage
  inactive:
    opensFor: "signedIn and (variant == 'chief' or (variant == 'medaris' and 'platform.inactive_scopes_manage' in held))"
    refusal: answers 403 to anyone else
    evidence: app/pasif-kapsamlar/page.tsx:23; apps/tedrisat/src/inactive-scope/inactive-scope.service.ts:58 asks platform.inactive_scopes_manage

# from: a page id, a list of them, or frame:shell for every page that draws the sidebar
# how:  auto (a redirect), menu, user (the person's corner of the sidebar), link, button
# when: a guard over the person's facts; omitted = always
# data: true = the entry exists only when a list has an item to link from
entries:
  # where "/" sends a person (app/(home)/page.tsx); a başnazım or a Medaris nazımı stays on the dashboard
  - { from: start, to: signin, how: button, label: Auth.signIn, when: not signedIn, source: "apps/nizam/app/(home)/page.tsx:42" }
  - { from: start, to: nazarRedirect, how: auto, when: "signedIn and landing == 'nazar'", clicks: 0, source: "apps/nizam/app/(home)/page.tsx:54" }
  - { from: start, to: noRole, how: auto, when: "signedIn and landing == 'none'", clicks: 0, source: "apps/nizam/app/(home)/page.tsx:55" }
  - { from: start, to: koskHome, how: auto, when: "signedIn and variant == 'kosk'", clicks: 0, source: "apps/nizam/app/(home)/page.tsx:63" }

  # the sidebar's corners (components/shell/shell-frame.tsx); the bell of the phone bar is not modelled
  - { from: frame:shell, to: start, how: user, label: the Medaris Nizam logo, when: signedIn, source: apps/nizam/components/shell/shell-frame.tsx:194 }
  - { from: frame:shell, to: account, how: user, label: Shell.userLink, when: signedIn, source: apps/nizam/components/shell/shell-frame.tsx:164 }

  # the dashboard of a başnazım and a Medaris nazımı (features/dashboard/components/medaris-home.tsx). A section is drawn when the API
  # sends it (apps/tedrisat/src/nizam-dashboard/dashboard-sections.ts:23). Every link is `${base}/…` with base "/", so each one is
  # "//…" and leaves for another host: they all go to offHost. The page each was meant to open is in the comment.
  - { from: start, to: offHost, how: link, label: Dashboard.seeAll, back: true, when: "variant == 'chief' or (variant == 'medaris' and 'platform.kosk_application_decide' in held)", source: apps/nizam/features/dashboard/components/medaris-home.tsx:65 } # meant: platformKoskApplications
  - { from: start, to: offHost, how: link, label: Dashboard.review, when: "variant == 'chief' or (variant == 'medaris' and 'platform.kosk_application_decide' in held)", data: true, source: apps/nizam/features/dashboard/components/medaris-home.tsx:91 } # meant: platformKoskApplications?secili=
  - { from: start, to: offHost, how: link, label: Dashboard.seeAll, back: true, when: "variant == 'chief' or (variant == 'medaris' and 'platform.deck_publish' in held)", source: apps/nizam/features/dashboard/components/medaris-home.tsx:109 } # meant: deckRequests
  - { from: start, to: offHost, how: link, label: Dashboard.review, when: "variant == 'chief' or (variant == 'medaris' and 'platform.deck_publish' in held)", data: true, source: apps/nizam/features/dashboard/components/medaris-home.tsx:135 } # meant: deckRequests?secili=
  - { from: start, to: offHost, how: link, label: Dashboard.seeAll, back: true, when: "variant == 'chief' or (variant == 'medaris' and 'platform.inactive_scopes_manage' in held)", source: apps/nizam/features/dashboard/components/medaris-home.tsx:159 } # meant: inactive
  - { from: start, to: offHost, how: button, label: the assign button of a passive scope, when: "variant == 'chief' or (variant == 'medaris' and 'platform.inactive_scopes_manage' in held)", data: true, source: apps/nizam/features/dashboard/components/medaris-home.tsx:190 } # meant: inactive
  - { from: start, to: offHost, how: link, label: Dashboard.review, when: "variant == 'chief' or (variant == 'medaris' and ('platform.ban_scoped' in held or 'platform.ban_account' in held))", data: true, source: apps/nizam/features/dashboard/components/medaris-home.tsx:232 } # meant: bans
  - { from: start, to: offHost, how: link, label: Dashboard.bans.goTo, when: "variant == 'chief' or (variant == 'medaris' and ('platform.ban_scoped' in held or 'platform.ban_account' in held))", source: apps/nizam/features/dashboard/components/medaris-home.tsx:244 } # meant: bans
  - { from: start, to: offHost, how: link, label: Dashboard.counts.goKosks, when: "variant == 'chief'", source: apps/nizam/features/dashboard/components/medaris-home.tsx:267 } # meant: kosks
  - { from: start, to: offHost, how: link, label: Dashboard.counts.goMadrasahs, when: "variant == 'chief'", source: apps/nizam/features/dashboard/components/medaris-home.tsx:279 } # meant: madrasahs
  - { from: start, to: offHost, how: button, label: Dashboard.openKosk, when: "variant == 'chief'", source: apps/nizam/features/dashboard/components/medaris-home.tsx:310 } # meant: kosks?ac=1

  # where the köşk entry page sends a person (app/kosks/[id]/page.tsx, features/kosks/kosk-entry.ts): a köşk nazımı to Dersler, the
  # başnazım or a holder of platform.kosk_edit stays on the management view, a holder of platform.hosting_grant (and not kosk_edit)
  # to Barındırma hakları
  - { from: kosks, to: kosk, how: link, label: a köşk in the directory, data: true, source: apps/nizam/features/kosks/components/kosks-directory.tsx:168 }
  - { from: kosks, to: archive, how: link, label: KoskDirectory.archive, when: "variant == 'chief'", source: apps/nizam/features/kosks/components/kosks-directory.tsx:309 }
  - { from: kosks, to: courseEdit, how: link, label: a course the person teaches in a köşk they do not manage, data: true, source: apps/nizam/features/kosks/components/taught-courses.tsx:29 }
  - { from: kosk, to: koskCourses, how: auto, when: "variant == 'kosk'", clicks: 0, source: "apps/nizam/app/kosks/[id]/page.tsx:50" }
  - { from: kosk, to: koskHosting, how: auto, when: "variant == 'medaris' and 'platform.hosting_grant' in held and 'platform.kosk_edit' not in held", clicks: 0, source: "apps/nizam/app/kosks/[id]/page.tsx:52" }
  - { from: kosk, to: kosks, how: link, label: KoskManage.kosks, when: koskManagementView, source: apps/nizam/features/kosks/components/kosk-manage-page.tsx:354 }
  - { from: kosk, to: koskCourses, how: button, label: KoskManage.nazimView, when: koskManagementView, source: apps/nizam/features/kosks/components/kosk-manage-page.tsx:364 }
  - { from: kosk, to: tedris, how: button, label: KoskManage.publicPage, when: koskManagementView, source: apps/nizam/features/kosks/components/kosk-manage-page.tsx:370 }
  - { from: kosk, to: koskSettings, how: link, label: KoskManage.openSettings, when: koskManagementView, source: apps/nizam/features/kosks/components/kosk-manage-page.tsx:466 }
  - { from: kosk, to: archive, how: button, label: KoskManage.toArchive, when: koskManagementView, source: apps/nizam/features/kosks/components/kosk-manage-page.tsx:542 }
  - { from: kosk, to: koskHosting, how: link, label: KoskManage.hostingLink, when: koskManagementView, source: apps/nizam/features/kosks/components/kosk-manage-page.tsx:584 }
  - { from: kosk, to: koskArchive, how: link, label: KoskManage.archive, when: koskManagementView, source: apps/nizam/features/kosks/components/kosk-manage-page.tsx:614 }

  # the köşk nazımı's home (features/dashboard/components/kosk-home.tsx)
  - { from: koskHome, to: courseSessions, how: button, label: the action of a session of the week, data: true, source: apps/nizam/features/dashboard/components/kosk-home.tsx:305 }
  - { from: koskHome, to: courseNew, how: button, label: Dashboard.openCourse, source: apps/nizam/features/dashboard/components/kosk-home.tsx:412 }
