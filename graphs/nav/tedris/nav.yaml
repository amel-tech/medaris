# Navigation graph of Tedris, the Medaris app for talebe (learners): the hand-written half.
# The pages, the top bar and which pages a visitor may open are generated into nav.extracted.yaml from the application source
# (`node src/cli.ts extract <this dir> --repo <medaris checkout>`); this file holds what no source file says: who the users are,
# where "/" sends them, the links and buttons inside pages, goals, and overrides of single page fields.
# Every entry below carries `source:`, the line of apps/tedris that draws the link, button or redirect (read at ce47fce8).
extends: nav.extracted.yaml
kind: nav
schema: delurio-graph/0
id: medaris-tedris
title: Tedris
status: proposed
locale: tr
catalog: catalog/tr.json

extract:
  adapter: tedris
  names:
    "/": start
    "/start": firstLogin
    "/auth/signin": signin
    "/auth/register": register
    "/auth/signout": signout
    "/courses/{courseId}": course
    "/courses/{courseId}/lessons/{lessonId}": lesson
    "/courses/{courseId}/lessons/{lessonId}/izle": watch
    "/kosks/{koskId}": kosk
    "/madrasahs/{madrasahId}": madrasah
    "/kosk-applications/new": koskApplication
    "/decks/{id}": deck
  # Titles the extractor cannot read: they live in translation files it does not open (tedris-account.json, tedris-learn.json)
  # or come from the API. A key is checked against the catalog; plain words are taken as written. The sign-in, registration
  # and sign-out pages set no title of their own, so their tab reads the root layout's "Medaris Tedris" (app/layout.tsx:19).
  titles:
    accountPublicProfile: Herkese açık profil
    koskApplication: Köşk açma başvurusu
    decksStudy: Çalışma
    course: a course's own title
    kosk: a köşk's own name
    madrasah: a medrese's own name
    deck: a deck's own title
    deckCards: the cards of a deck
  locales: [tr, en]

summary: >-
  What a visitor and a signed-in talebe can reach from Tedris, how many clicks it takes, and where the top bar and the
  pages disagree about who may go where.

source:
  repo: amel-tech/medaris
  app: apps/tedris
  menu: apps/tedris/components/phone-menu/desktop-bar.tsx
  locales: libs/i18n/src/locales/{locale}/tedris.json

frames:
  app:
    title: Inside the app (every page that draws the top bar)
    menu: Top bar
  none:
    title: Pages that only send the visitor on (no chrome)
  elsewhere:
    title: Other applications

facts:
  signedIn:
    values: [true, false]
    say: whether the person has a session

personas:
  visitor:
    title: Visitor
    say: has no session; Tedris shows them Keşfet, Giriş yap and Kayıt ol
    facts: { signedIn: false }
  talebe:
    title: Talebe
    say: signed in, with the five places of the top bar
    facts: { signedIn: true }

# Overrides and additions to the generated pages.
pages:
  # The public profile is switched off (features/public-profile/availability.ts:14, PUBLIC_PROFILE_ENABLED = false): the page
  # calls notFound() before anything is read (app/account/public-profile/page.tsx:25) and Hesap leaves out the card that links
  # to it (features/account/components/account-settings.tsx:413). To everyone it is a page that does not exist.
  accountPublicProfile:
    kind: missing
  # other applications
  nazar:
    route: Nazar
    title: Nazar
    kind: external
    frame: elsewhere
  nizam:
    route: Nizam
    title: Nizam
    kind: external
    frame: elsewhere
  landingPrivacy:
    route: Landing (the privacy notice)
    title: Gizlilik bildirimi
    kind: external
    frame: elsewhere

