notModeled:
  - "the phone layout (the same places behind a Menü button, so one more click everywhere)"
  - the language menu and the theme toggle of the bar
  - the hop to Keycloak when a visitor signs in or registers, and the way back; a failed sign-in's “Ana sayfaya dön”
  - "Keycloak's own pages that Hesap opens: Bağlı uygulamalar (the account console) and the gender and name buttons (its profile page)"
  - what a course page offers in each state (visitor, apply, pending, enrolled, completed, revoked) and the locked state of a session; data marks the links that need a seat or a state
  - whether the talebe wrote a deck (only its author gets the Kartlar tab and the edit link) and whether a deck is public (a visitor is sent to sign in for any other)
  - the course page's tabs (?tab=mufredat, ?tab=kayitlar, ?tab=deste), which are one page, and the links between sessions of one course
  - filters, pagers, dialogs and retry links inside a page, which stay on the same page
  - links to files, recordings on other sites, meeting rooms and calendar feeds
  - addresses from before MDRS-248 (/tr/…, /en/…, /ar/…), which proxy.ts answers 308 to the same page without the language
  - the old header and tab row, which are hidden whenever the top bar is mounted (every page that has a screen mounts it)
