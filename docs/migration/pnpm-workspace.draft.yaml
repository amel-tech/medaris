# ─────────────────────────────────────────────────────────────────────────────
# DRAFT pnpm-workspace.yaml — MDRS-8 deliverable (catalog + allowBuilds)
#
# This is the catalog draft for MDRS-10 to author the real root file. It is NOT
# committed as the live workspace file (ADR-001 §D2: root config is authored
# fresh by MDRS-10/11/12). Version rationale + conflict table live in
# ./mdrs-8-dependency-reconciliation.md. Pins follow ADR-001 §D8:
#   tilde/exact for framework-critical existing deps (a fresh pnpm resolve
#   re-floats every caret = hidden upgrade), caret for the harmless long tail.
# ─────────────────────────────────────────────────────────────────────────────

packages:
  # Explicit enumeration, no globs (ADR-001 §D11) — 16 real packages.
  - 'apps/tedrisat'
  - 'apps/teskilat'
  - 'apps/tedris'
  - 'apps/nizam'
  - 'apps/nazir'
  - 'apps/landing'
  - 'apps/keycloak-theme'
  - 'libs/common'
  - 'libs/ui'
  - 'libs/icons'
  - 'libs/tokens'
  - 'libs/hooks'
  - 'libs/services'
  - 'libs/i18n'
  - 'libs/types'
  - 'libs/utils'
  # NOT registered (history-only, dissolved/deleted in MDRS-10): libs/mocks,
  # libs/eslint-config, libs/typescript-config.
  # Reserved names — create nothing now (ADR-001 §D1): apps/muhasebe, apps/e2e,
  # apps/web, apps/docs, libs/errors, libs/validation, libs/config.

verifyDepsBeforeRun: warn   # pnpm-11 non-TTY footgun (ADR-001 §D11 / R2)

# ── Native/build allowlist (MDRS-8 §3). Deny watchers & telemetry by default. ──
onlyBuiltDependencies:
  - '@swc/core'                          # BE  — NestJS SWC transform (native)
  - esbuild                              # both — Vitest/tsx bundler (native)
  - nx                                   # MDRS-11 — Nx native daemon
  - '@tailwindcss/oxide'                 # FE  — Tailwind v4 native engine
  - lightningcss                         # FE  — native CSS transform
  - unrs-resolver                        # transitive native resolver (eslint/nx)
  - sharp                                # FE  — Next.js image optimization (REQUIRED)
  - '@openapitools/openapi-generator-cli' # FE — shared/services postinstall fetches jar
# Denied (no build): fsevents, @parcel/watcher, @scarf/scarf, core-js-pure,
# cpu-features, ssh2, protobufjs — telemetry/watchers/optional-native. Add back
# only if a test proves the native step is required.

# ── Security floors: empty by the "no parent fix" rule (MDRS-8 §6). ──
# Every high/crit advisory except xlsx reports fixAvailable:true → MDRS-21 /
# lockfile-regen resolves them; adding overrides here is MDRS-21's job.
# xlsx@0.18.5 is unfloorable (no fixed npm version) → tracked as FU-5 (replace).
overrides: {}

catalog:
  # ═══ Toolchain — ADR-001 §D8 normative (do not re-decide here) ═══
  nx: 23.0.0                     # exact; all @nx/* pinned to the same version
  '@nx/js': 23.0.0
  '@nx/eslint': 23.0.0
  '@nx/eslint-plugin': 23.0.0
  '@nx/nest': 23.0.0
  '@nx/next': 23.0.0
  '@nx/vite': 23.0.0
  '@nx/vitest': 23.0.0
  typescript: ~5.9.3             # last JS-based line; tilde ≈ frozen
  '@types/node': ^22             # PROD floor (node:22-alpine), not dev Node 24
  '@biomejs/biome': 2.4.4        # exact — reformat commit must be byte-reproducible
  eslint: ^10.5.0                # boundaries-ONLY surface
  typescript-eslint: ^8.62.0
  vitest: ^4.1.9
  '@vitest/coverage-v8': ^4.1.9
  '@vitest/ui': ^4.1.9
  '@swc/core': ~1.15.43          # floors backend 1.15.33; emitDecoratorMetadata under Vitest
