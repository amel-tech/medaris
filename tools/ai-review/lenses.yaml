      === THE MEDARIS-SPECIFIC TRAP — CHECK THIS FIRST, EVERY TIME ===
      `import type` on a NestJS injected constructor parameter erases the parameter
      from the emitted `design:paramtypes` metadata. Nest resolves constructor
      dependencies by reading exactly that metadata, so DI throws at RUNTIME while
      `tsc` and the build both stay completely green. When this happened here it took
      78 of 89 tests red in one go (CLAUDE.md:31; the full write-up is
      docs/migration/mdrs-12-biome.md:86-110).

      Because of it, biome.json turns `style/useImportType` OFF for exactly the three
      packages that compile with `emitDecoratorMetadata` — the override's `includes`
      at biome.json:87-89 are `apps/tedrisat/**/*.{ts,mts,cts}`,
      `apps/teskilat/**/*.{ts,mts,cts}` and `libs/common/**/*.{ts,mts,cts}`, and the
      rule is set to `"off"` at :108. It remains `"error"` everywhere else (:60).
      Confirm this in biome.json yourself before you rely on it.

      So, in apps/tedrisat, apps/teskilat and libs/common:
        - `import type { FooService } from "./foo.service"` on a class whose
          constructor injects `FooService` is a HIGH-severity runtime break, even
          though nothing else in CI will catch it. Report it.
        - The reverse is NOT a finding, and this is the part reviewers get wrong: a
          plain `import { FooService }` for a symbol used only as a type is CORRECT
          and REQUIRED in these packages. Never suggest converting it.
      Outside those three packages, `useImportType` is enforced by Biome, so it is
      already covered and you should not comment on it at all.

      === THE SECOND MEDARIS-SPECIFIC TRAP — TWO VALIDATOR PACKAGES ===
      This workspace intentionally carries both `class-validator` and the NestJS fork
      `@nestjs/class-validator`. pnpm-workspace.yaml catalogues all four packages
      side by side: :122 `@nestjs/class-transformer` ^0.4.0 and :123
      `@nestjs/class-validator` ^0.13.4, both tagged "# NestJS fork (tedrisat)", then
      :124 `class-transformer` ^0.5.1 tagged "# standalone (libs/common) — coexists
      intentionally" and :125 `class-validator` ^0.14.2 tagged "# standalone
      (libs/common, tedrisat)". Seven files import from the fork, nine from the
      standalone package.

      Two DTO files currently import decorators from BOTH inside one file:
      apps/tedrisat/src/flashcard/dto/create-flashcard-label.dto.ts (IsEnum, IsString,
      MaxLength, MinLength from `@nestjs/class-validator` at :1-6; IsOptional and
      IsUUID from `class-validator` at :8) and
      apps/tedrisat/src/flashcard/dto/create-flashcard-deck-label.dto.ts.

      Why that is dangerous here: the global pipe is `MedarisValidationPipe`
      (libs/common/src/pipes/validation.pipe.ts:9), installed at
      libs/common/src/bootstrap/setupMiddleware.ts:27, and it extends `ValidationPipe`
      from `@nestjs/common` with `whitelist: true` (:15) and
      `forbidNonWhitelisted: true` (:16). Under those two options a property that the
      pipe's validator does not see decorated is stripped or rejected outright — so
      decorator metadata landing in the wrong package's storage does not fail loudly,
      it changes what the endpoint accepts.

      Report as a MEDIUM-severity finding any DTO class this PR adds or edits that
      draws validation decorators from both packages. State which import should move,
      and to which package the rest of the file already commits. Do NOT report a file
      that consistently uses one package — using the fork alone is deliberate.

      === WHAT ELSE TO HUNT FOR IN THIS LENS ===
      - Logic bugs: inverted booleans, wrong comparison operator, off-by-one, operator
        precedence, a condition that can never be true, a branch that can never run.
      - Async: a missing `await` on a promise-returning call, a floating promise, an
        unhandled rejection, `Promise.all` over something with a shared mutable target.
