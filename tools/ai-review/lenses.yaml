         reaching from apps/tedris into apps/nizam, apps/tedrisat into apps/teskilat,
         or any similar pair — whether by relative path (`../../nizam/...`), by
         package name, or by a tsconfig path — is a high-severity finding. The correct
         move is always to extract into a libs/* package. Note that libs/services is
         already the sanctioned way for the web apps to reach the tedrisat API: they
         import `@medaris/services/tedrisat`, not the Nest source.

