         libs/ui is React components, libs/tokens is design tokens, libs/icons is
         icons, libs/i18n is locales, libs/hooks is React hooks, libs/services is the
         generated API client, libs/common is NestJS-only shared backend code. Code
         landing in the wrong one — a React component in libs/utils, a NestJS
         decorator in libs/types — is a low-severity finding. Note especially that
         libs/common is BACKEND-only: pulling it into a Next app drags NestJS in.
         Also: docs/PRD.md and docs/ecosystem-boundaries.md are marked "Never modify"
         in CLAUDE.md:50 as authoritative product and governance documents. A PR
         editing either without saying why is worth flagging.

      === KNOWN FALSE POSITIVES — DO NOT REPORT THESE ===
      - `@medaris/ui/components/*`, `@medaris/ui/lib/*`, `@medaris/ui/custom/*` and
        `@medaris/ui/hooks/*` are declared subpath exports in libs/ui/package.json.
        They are the sanctioned entry points and there are over a hundred call sites.
        Flagging them as deep imports is the single loudest false positive available
        to this lens. Read the exports map first, every time.
      - `~/env`, `~/lib/*`, `~/features/*`, `~/components/*` and `~/hooks` are
        app-internal tsconfig `paths` inside the Next apps (see
        apps/tedris/tsconfig.json). They never cross a package boundary. The "NO paths
        aliases anywhere" note in tsconfig.base.json:4 is about CROSS-PACKAGE
        resolution, which goes through pnpm's workspace links — it does not forbid
        these.
      - The `module-boundaries` target passing means nothing today. Do not cite it as
        evidence, and do not report a violation "the rule missed" as though the rule
        were configured.
      - Two apps depending on the same @medaris/* library is the intended design of a
        monorepo, not coupling.
      - `libs/common/src/dto/health-check.dto.ts` shared by both Nest services is
        deliberate.
      - Do not propose adding nx tags or depConstraints. That work is MDRS-13 and
        landing it inside an unrelated PR is worse than waiting.
      - Do not report generated output: libs/services/src/tedrisat/generated/**,
        apps/keycloak-theme/src/kc.gen.tsx, **/routeTree.gen.ts.

      === FILLING IN THE FINAL JSON — LENS-SPECIFIC RULES ===
      The surrounding prompt already told you the exact shape of the single JSON
      object your final message must be, and that shape is the one CI parses. Do not
      restate it, do not invent fields, and do not wrap it in a fence. These are the
      additional rules this lens is held to when filling it in:

        - `findings: []` is a real, respectable result. Do not invent findings to
          fill it. An empty array is a clean review; an unparseable final message is
          a FAILED review and turns this check red.
        - Never report a finding you have not opened the current file and confirmed.
          Cite `path:line` from the file as it now stands, not from the diff.
        - `severity` is `critical` or `high` ONLY for a defect you have confirmed: an
          exploitable authorization hole, a runtime break, a data-loss or contract
          break. Style preferences, "this could be nicer", and anything you could not
          confirm are `medium` at most, usually `low`.
        - `confidence` is not decoration and it is not optional. Only high/critical
          severity at high confidence blocks, so a `confidence` of `medium` or `low`
          still delivers the finding to the author as advisory without wedging the
          PR. Use it freely rather than suppressing an uncertain finding — but do
          state it, because an omitted `confidence` is read as `high`.
        - `fix` must be the concrete change, not a restatement of the problem.
        - `summary` is one or two sentences on what you actually examined and what you
          concluded. Name the files you opened. "Reviewed the PR" is not a summary.
